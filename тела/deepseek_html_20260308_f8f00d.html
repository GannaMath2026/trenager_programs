<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Куб с подписями</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px;
            border-radius: 5px;
            z-index: 100;
            max-width: 300px;
            pointer-events: none;
        }
        #controls {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px;
            border-radius: 5px;
            z-index: 100;
            pointer-events: auto;
        }
        button {
            padding: 8px 16px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px 0;
            width: 100%;
        }
        button:hover { background: #45a049; }
        button.active {
            background: #ff4444;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        .coords {
            font-size: 12px;
            margin: 5px 0;
            border-bottom: 1px solid #444;
            padding: 3px 0;
        }
        .vertex-label {
            color: #ff9999;
        }
        h3 { margin: 5px 0; }
        #message {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: yellow;
            padding: 10px;
            border-radius: 5px;
            display: none;
            z-index: 200;
        }
    </style>
</head>
<body>
    <div id="info">
        <h3>Куб ABCDA₁B₁C₁D₁</h3>
        <div class="coords">
            <div><span class="vertex-label">A (0,0,2):</span> <span id="coordA"></span></div>
            <div><span class="vertex-label">B (0,0,0):</span> <span id="coordB"></span></div>
            <div><span class="vertex-label">C (2,0,0):</span> <span id="coordC"></span></div>
            <div><span class="vertex-label">D (0,2,2):</span> <span id="coordD"></span></div>
            <div><span class="vertex-label">A₁ (2,2,2):</span> <span id="coordA1"></span></div>
            <div><span class="vertex-label">B₁ (2,0,2):</span> <span id="coordB1"></span></div>
            <div><span class="vertex-label">C₁ (2,2,0):</span> <span id="coordC1"></span></div>
            <div><span class="vertex-label">D₁ (0,2,0):</span> <span id="coordD1"></span></div>
        </div>
        <div>Всего вершин: 8</div>
        <div>Всего рёбер: 12</div>
    </div>

    <div id="controls">
        <h3>Управление</h3>
        <button id="edgeModeBtn">🎯 Выбрать ребро</button>
        <button id="resetBtn">⟲ Сбросить вид</button>
        <div style="margin-top: 10px; font-size: 12px; color: #aaa;">
            Режим: <span id="modeDisplay">обычный</span>
        </div>
    </div>

    <div id="message"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'https://unpkg.com/three@0.128.0/examples/jsm/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'https://unpkg.com/three@0.128.0/examples/jsm/renderers/CSS2DRenderer.js';

        // Сцена
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        // Камера
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(4, 3, 5);
        camera.lookAt(1, 1, 1);

        // WebGL рендерер
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // CSS2D рендерер для текста
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        // Управление
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.target.set(1, 1, 1);

        // Освещение
        const light1 = new THREE.DirectionalLight(0xffffff, 1);
        light1.position.set(2, 5, 3);
        scene.add(light1);
        
        const light2 = new THREE.DirectionalLight(0xffffff, 0.5);
        light2.position.set(-2, -1, -3);
        scene.add(light2);
        
        const ambient = new THREE.AmbientLight(0x404060);
        scene.add(ambient);

        // Сетка
        const grid = new THREE.GridHelper(10, 20, 0x888888, 0x444444);
        scene.add(grid);

        // ВЕРШИНЫ КУБА (B в начале координат)
        const vertices = [
            { pos: [0, 0, 0], name: 'B' },      // 0 - B (нижняя)
            { pos: [2, 0, 0], name: 'C' },      // 1 - C (нижняя)
            { pos: [2, 2, 0], name: 'C₁' },     // 2 - C₁ (нижняя)
            { pos: [0, 2, 0], name: 'D₁' },     // 3 - D₁ (нижняя)
            { pos: [0, 0, 2], name: 'A' },      // 4 - A (верхняя)
            { pos: [2, 0, 2], name: 'B₁' },     // 5 - B₁ (верхняя)
            { pos: [2, 2, 2], name: 'A₁' },     // 6 - A₁ (верхняя)
            { pos: [0, 2, 2], name: 'D' }       // 7 - D (верхняя)
        ];

        // Рёбра (индексы вершин)
        const edges = [
            [0,1], [1,2], [2,3], [3,0], // нижний квадрат (B-C-C₁-D₁)
            [4,5], [5,6], [6,7], [7,4], // верхний квадрат (A-B₁-A₁-D)
            [0,4], [1,5], [2,6], [3,7]  // вертикальные
        ];

        // Обновляем координаты на экране
        document.getElementById('coordA').textContent = `(${vertices[4].pos[0]}, ${vertices[4].pos[1]}, ${vertices[4].pos[2]})`;
        document.getElementById('coordB').textContent = `(${vertices[0].pos[0]}, ${vertices[0].pos[1]}, ${vertices[0].pos[2]})`;
        document.getElementById('coordC').textContent = `(${vertices[1].pos[0]}, ${vertices[1].pos[1]}, ${vertices[1].pos[2]})`;
        document.getElementById('coordD').textContent = `(${vertices[7].pos[0]}, ${vertices[7].pos[1]}, ${vertices[7].pos[2]})`;
        document.getElementById('coordA1').textContent = `(${vertices[6].pos[0]}, ${vertices[6].pos[1]}, ${vertices[6].pos[2]})`;
        document.getElementById('coordB1').textContent = `(${vertices[5].pos[0]}, ${vertices[5].pos[1]}, ${vertices[5].pos[2]})`;
        document.getElementById('coordC1').textContent = `(${vertices[2].pos[0]}, ${vertices[2].pos[1]}, ${vertices[2].pos[2]})`;
        document.getElementById('coordD1').textContent = `(${vertices[3].pos[0]}, ${vertices[3].pos[1]}, ${vertices[3].pos[2]})`;

        // Массивы для хранения объектов
        const vertexSpheres = [];
        const edgeLines = [];

        // Рисуем вершины
        vertices.forEach((v, i) => {
            const geometry = new THREE.SphereGeometry(0.08);
            const material = new THREE.MeshStandardMaterial({ 
                color: 0xff3333,
                emissive: 0x220000
            });
            const sphere = new THREE.Mesh(geometry, material);
            sphere.position.set(v.pos[0], v.pos[1], v.pos[2]);
            scene.add(sphere);
            vertexSpheres.push(sphere);

            // Подпись вершины (без цифр)
            const div = document.createElement('div');
            div.textContent = v.name;
            div.style.color = '#ffffff';
            div.style.fontSize = '16px';
            div.style.fontWeight = 'bold';
            div.style.textShadow = '2px 2px 2px black';
            div.style.background = 'rgba(0,0,0,0.3)';
            div.style.padding = '2px 4px';
            div.style.borderRadius = '3px';
            div.style.border = '1px solid #666';
            
            // Подписи для нижних вершин (y=0) - снизу
            if (v.pos[1] === 0) {
                div.style.marginTop = '20px'; // смещение вниз
            }
            
            const label = new CSS2DObject(div);
            // Смещаем подписи: нижние - вниз, верхние - вверх
            if (v.pos[1] === 0) {
                label.position.set(v.pos[0], v.pos[1] - 0.3, v.pos[2]);
            } else {
                label.position.set(v.pos[0], v.pos[1] + 0.3, v.pos[2]);
            }
            scene.add(label);
        });

        // Рисуем рёбра (тёмно-синие)
        edges.forEach(edge => {
            const points = [
                new THREE.Vector3(vertices[edge[0]].pos[0], vertices[edge[0]].pos[1], vertices[edge[0]].pos[2]),
                new THREE.Vector3(vertices[edge[1]].pos[0], vertices[edge[1]].pos[1], vertices[edge[1]].pos[2])
            ];
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ 
                color: 0x1a237e,
                linewidth: 2
            });
            const line = new THREE.Line(geometry, material);
            scene.add(line);
            edgeLines.push(line);
        });

        // Переменные для режима выбора ребра
        let edgeMode = false;
        let selectedEdgeIndices = null;
        let dashedLine = null;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // Кнопка выбора ребра
        document.getElementById('edgeModeBtn').addEventListener('click', () => {
            edgeMode = !edgeMode;
            document.getElementById('edgeModeBtn').classList.toggle('active', edgeMode);
            document.getElementById('modeDisplay').textContent = edgeMode ? 'выбор ребра' : 'обычный';
            
            if (!edgeMode) {
                if (dashedLine) {
                    scene.remove(dashedLine);
                    dashedLine = null;
                }
                selectedEdgeIndices = null;
            }
        });

        // Кнопка сброса
        document.getElementById('resetBtn').addEventListener('click', () => {
            camera.position.set(4, 3, 5);
            controls.target.set(1, 1, 1);
            controls.update();
        });

        // Обработка кликов для выбора ребра
        renderer.domElement.addEventListener('click', (event) => {
            if (!edgeMode) return;

            // Вычисляем позицию мыши
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            // Создаём массив объектов для проверки пересечений
            const objectsToIntersect = edgeLines.map((line, index) => {
                return { line, index };
            });

            // Проверяем пересечения
            const intersects = raycaster.intersectObjects(edgeLines);
            
            if (intersects.length > 0) {
                // Берём первое пересечение
                const hitEdge = intersects[0].object;
                const edgeIndex = edgeLines.indexOf(hitEdge);
                
                if (edgeIndex !== -1) {
                    selectedEdgeIndices = edges[edgeIndex];
                    
                    // Удаляем старую пунктирную линию
                    if (dashedLine) {
                        scene.remove(dashedLine);
                    }
                    
                    // Создаём пунктирную линию ТОЛЬКО снаружи
                    const start = new THREE.Vector3(vertices[selectedEdgeIndices[0]].pos[0], vertices[selectedEdgeIndices[0]].pos[1], vertices[selectedEdgeIndices[0]].pos[2]);
                    const end = new THREE.Vector3(vertices[selectedEdgeIndices[1]].pos[0], vertices[selectedEdgeIndices[1]].pos[1], vertices[selectedEdgeIndices[1]].pos[2]);
                    
                    // Направление ребра
                    const dir = new THREE.Vector3().subVectors(end, start);
                    
                    // Продлеваем ТОЛЬКО наружу (за пределы куба)
                    const extendedStart = new THREE.Vector3().copy(start).sub(dir.clone().multiplyScalar(1.5));
                    const extendedEnd = new THREE.Vector3().copy(end).add(dir.clone().multiplyScalar(1.5));
                    
                    // Создаём пунктирную линию (только внешние части)
                    const points = [extendedStart, start, end, extendedEnd];
                    const geometry = new THREE.BufferGeometry().setFromPoints(points);
                    
                    const material = new THREE.LineDashedMaterial({ 
                        color: 0xffaa00, 
                        dashSize: 0.15,
                        gapSize: 0.1
                    });
                    dashedLine = new THREE.Line(geometry, material);
                    dashedLine.computeLineDistances();
                    scene.add(dashedLine);
                    
                    showMessage(`Выбрано ребро ${vertices[selectedEdgeIndices[0]].name}-${vertices[selectedEdgeIndices[1]].name}`);
                }
            }
        });

        // Функция показа сообщения
        function showMessage(text) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.style.display = 'block';
            setTimeout(() => {
                msg.style.display = 'none';
            }, 2000);
        }

        // Анимация
        function animate() {
            requestAnimationFrame(animate);
            
            controls.update();
            
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();

        // Обработка изменения размера окна
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Оси координат (полупрозрачные)
        const axesHelper = new THREE.AxesHelper(5);
        scene.add(axesHelper);
    </script>
</body>
</html>
