<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВИЗУАЛИЗАЦИЯ ЗАДАЧ МАТЕМАТИКА - ПРОСМОТР</title>
    <!-- KaTeX для формул -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <!-- pako для распаковки -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: white;
            height: 100vh;
            overflow: hidden;
        }

        .viewer {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .left-panel {
            width: 40%;
            background: #f8fafd;
            padding: 40px;
            overflow-y: auto;
            border-right: 2px solid #e0e7f0;
        }

        .right-panel {
            width: 60%;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 25px 30px;
            background: #f8fafd;
            border-bottom: 2px solid #e0e7f0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hint {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .solution {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            font-family: 'Fira Code', monospace;
            font-size: 1.2rem;
            line-height: 1.8;
            background: white;
        }

        .condition {
            background: white;
            border-radius: 16px;
            padding: 25px;
            border-left: 6px solid #667eea;
            font-size: 1.2rem;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .image {
            max-width: 100%;
            max-height: 250px;
            border-radius: 16px;
            object-fit: contain;
            border: 2px solid #e0e7f0;
            padding: 10px;
        }

        .code-line { 
            color: #2c3e50; 
            font-weight: 500; 
            margin-bottom: 5px;
            white-space: pre-wrap;
        }
        
        .comment-line { 
            color: #2e6b4c; 
            font-style: italic; 
            margin-left: 25px; 
            padding-left: 20px; 
            border-left: 4px solid #86b89c; 
            background: #f3faf6; 
            border-radius: 0 12px 12px 0; 
            margin-bottom: 15px;
            white-space: pre-wrap;
        }

        .empty-message { 
            color: #a0aec0; 
            font-style: italic; 
            font-size: 1.4rem; 
            text-align: center; 
            margin-top: 100px; 
        }

        /* Стили для формул */
        .katex { 
            font-size: 1.2em; 
        }
    </style>
</head>
<body>
<div class="viewer">
    <div class="left-panel" id="leftPanel"></div>
    <div class="right-panel">
        <div class="header">
            <span class="hint">␣ пробел — следующий шаг</span>
        </div>
        <div class="solution" id="solution"></div>
    </div>
</div>

<script>
    (function() {
        const leftPanel = document.getElementById('leftPanel');
        const solutionDiv = document.getElementById('solution');
        
        let solutionBlocks = [];
        let currentBlockIndex = 0;

        // Функция для рендеринга формул
        function renderMathInElement(element) {
            if (window.renderMathInElement) {
                window.renderMathInElement(element, {
                    delimiters: [
                        {left: '\\(', right: '\\)', display: false},
                        {left: '\\[', right: '\\]', display: true},
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError: false,
                    output: 'html'
                });
            }
        }

        // Загрузка данных из URL
        function loadTaskFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            const dataParam = urlParams.get('data');
            
            if (!dataParam) {
                leftPanel.innerHTML = '<div class="condition">Ошибка: нет данных</div>';
                return;
            }

            try {
                // Распаковываем данные
                const base64 = decodeURIComponent(dataParam);
                const compressed = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
                const json = pako.inflate(compressed, { to: 'string' });
                const taskData = JSON.parse(json);

                // Заполняем левую панель
                leftPanel.innerHTML = `
                    <div class="condition">${taskData.condition || '— условие не задано —'}</div>
                    ${taskData.image ? `<img class="image" src="${taskData.image}" onerror="this.style.display='none'">` : ''}
                `;
                
                // ВАЖНО: принудительно рендерим формулы в левой панели
                setTimeout(() => {
                    renderMathInElement(leftPanel);
                }, 100);

                // Парсим решение
                solutionBlocks = taskData.solution.split('\n').map(line => ({
                    type: line.trim().startsWith('#') ? 'comment' : 'code',
                    text: line
                }));
                
                solutionDiv.innerHTML = '<div class="empty-message">✨ Нажмите пробел</div>';
                
            } catch (e) {
                console.error('Ошибка загрузки:', e);
                leftPanel.innerHTML = '<div class="condition">Ошибка загрузки данных</div>';
            }
        }

        // Шаг анимации
        function stepAnimation() {
            if (currentBlockIndex >= solutionBlocks.length) return;
            
            // Убираем заглушку
            if (solutionDiv.children.length === 1 && 
                solutionDiv.children[0].classList.contains('empty-message')) {
                solutionDiv.innerHTML = '';
            }
            
            const block = solutionBlocks[currentBlockIndex];
            const div = document.createElement('div');
            div.className = block.type === 'code' ? 'code-line' : 'comment-line';
            div.textContent = block.text;
            solutionDiv.appendChild(div);
            
            // Рендерим формулы в новом блоке
            renderMathInElement(div);
            
            currentBlockIndex++;
            solutionDiv.scrollTop = solutionDiv.scrollHeight;
        }

        // Обработчик клавиш
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                stepAnimation();
            }
        });

        // Загружаем данные при старте
        loadTaskFromUrl();

        // Дополнительная проверка: если данные уже есть, но формулы не отрендерились
        // Запускаем рендеринг еще раз через небольшую задержку
        setTimeout(() => {
            renderMathInElement(leftPanel);
        }, 500);
    })();
</script>
</body>
</html>
