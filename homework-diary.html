<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Дневник заданий</title>
<style>
:root{color-scheme:light;--bg:#f6f7fb;--panel:#fff;--text:#202435;--muted:#74798a;--line:#e7e9f0;--accent:#635bdb;--soft:#efedff;--danger:#c44854;--shadow:0 12px 36px #27305a0c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;transition:.2s}body.dark{color-scheme:dark;--bg:#151720;--panel:#20232e;--text:#edf0f8;--muted:#a1a6b6;--line:#353947;--accent:#a69eff;--soft:#302d4b;--danger:#ff929b;--shadow:0 12px 36px #0003}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{max-width:1160px;margin:auto;padding:30px 24px 70px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{display:flex;align-items:center;gap:13px}.logo{width:45px;height:45px;border-radius:15px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-size:23px}.brand h1{font-size:20px;margin:0;letter-spacing:-.4px}.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}.ghost,.primary,.dangerbtn,.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:11px;padding:9px 13px}.ghost:hover,.iconbtn:hover{border-color:var(--accent)}.primary{background:var(--accent);border-color:var(--accent);color:white;font-weight:650;padding:11px 17px}.dangerbtn{color:var(--danger)}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:22px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.sidebar{padding:18px;height:max-content;position:sticky;top:20px}.sidehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.sidehead h2{font-size:14px;margin:0}.student-list{display:grid;gap:7px}.student{width:100%;text-align:left;display:flex;align-items:center;gap:11px;padding:10px;border:0;background:transparent;color:var(--text);border-radius:12px}.student:hover{background:var(--bg)}.student.active{background:var(--soft);color:var(--accent)}.avatar{width:36px;height:36px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-weight:700;flex:none}.student.active .avatar{background:var(--accent);color:#fff}.studentname{font-weight:650;font-size:14px}.studentcount{font-size:12px;color:var(--muted)}.empty-list{color:var(--muted);font-size:13px;padding:14px 8px}.content{min-width:0}.welcome{padding:26px 28px;margin-bottom:19px;background:linear-gradient(120deg,var(--panel) 55%,var(--soft));}.welcome .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.1px;color:var(--accent);font-weight:700}.welcome h2{font-size:25px;letter-spacing:-.7px;margin:5px 0}.welcome p{margin:0;color:var(--muted)}.bar{display:flex;justify-content:space-between;align-items:center;margin:0 2px 13px;gap:10px}.bar h3{margin:0;font-size:15px}.bar span{font-size:13px;color:var(--muted)}.homework{padding:21px 23px;margin-bottom:11px;display:grid;grid-template-columns:1fr auto;gap:15px;align-items:start}.hw-title{font-size:16px;font-weight:700;margin:0 0 8px}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}.pill{border-radius:8px;background:var(--bg);padding:4px 8px;font-size:12px;color:var(--muted)}.pill.period{color:var(--accent);background:var(--soft)}.comment{font-size:13px;color:var(--muted);white-space:pre-wrap}.hw-link{color:var(--accent);font-size:13px;text-decoration:none;font-weight:650}.hw-link:hover{text-decoration:underline}.hw-actions{display:flex;gap:6px}.iconbtn{padding:7px 9px;font-size:13px}.iconbtn.delete{color:var(--danger)}.empty{padding:40px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--text);margin-bottom:5px}.modal-bg{position:fixed;inset:0;background:#13152277;display:none;place-items:center;padding:18px;z-index:4}.modal-bg.open{display:grid}.modal{width:min(510px,100%);padding:24px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{font-size:19px;margin:0}.close{border:0;background:none;color:var(--muted);font-size:22px}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:13px;font-weight:650}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);color:var(--text);outline:none}.field input:focus,.field textarea:focus{border-color:var(--accent)}.field textarea{resize:vertical;min-height:82px}.formactions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.student-settings{display:none;gap:8px;margin-top:15px}.student-settings.show{display:flex}.small{font-size:12px}@media(max-width:760px){.shell{padding:19px 14px 45px}.layout{grid-template-columns:1fr;gap:14px}.sidebar{position:static}.student-list{display:flex;overflow:auto;padding-bottom:3px}.student{min-width:max-content;width:auto}.studentcount{display:none}.welcome{padding:21px}.homework{padding:17px;grid-template-columns:1fr}.hw-actions{justify-content:flex-end}.top{margin-bottom:18px}} 
</style></head>
<body><div class="shell"><header class="top"><div class="brand"><div class="logo">✎</div><div><h1>Дневник заданий</h1><p>Домашняя работа — по полочкам</p></div></div><button class="ghost" id="themeBtn" aria-label="Сменить тему">☾ Тёмная тема</button></header>
<div class="layout"><aside class="panel sidebar"><div class="sidehead"><h2>Ученики <span id="studentTotal"></span></h2><button class="iconbtn" id="addStudent">＋ Добавить</button></div><div class="student-list" id="students"></div></aside>
<main class="content"><section class="panel welcome"><div class="eyebrow">Панель учителя</div><h2 id="greeting">Выберите ученика</h2><p id="subtitle">Создавайте задания и следите за историей в одном месте.</p><div class="student-settings" id="studentSettings"><button class="ghost small" id="renameStudent">Переименовать</button><button class="dangerbtn small" id="deleteStudent">Удалить ученика</button><button class="dangerbtn small" id="clearProgress">Очистить историю</button></div></section>
<div class="bar"><div><h3>История домашних заданий</h3><span id="historyInfo"></span></div><button class="primary" id="addHomework">＋ Новое задание</button></div><div id="history"></div></main></div></div>
<div class="modal-bg" id="modalBg"><form class="panel modal" id="modalForm"><div class="modalhead"><h2 id="modalTitle">Новое задание</h2><button type="button" class="close" id="closeModal">×</button></div><div id="modalFields"></div><div class="formactions"><button type="button" class="ghost" id="cancelModal">Отмена</button><button class="primary" type="submit" id="submitModal">Сохранить</button></div></form></div>
<script>
(()=>{const KEY='homework-diary-v1';let data={students:[],theme:'light'},active=null,mode='homework',editId=null;try{data={...data,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{}const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>localStorage.setItem(KEY,JSON.stringify(data)),student=()=>data.students.find(x=>x.id===active),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);function render(){document.body.classList.toggle('dark',data.theme==='dark');$('themeBtn').textContent=data.theme==='dark'?'☀ Светлая тема':'☾ Тёмная тема';$('studentTotal').textContent=data.students.length?`(${data.students.length})`:'';$('students').innerHTML=data.students.length?data.students.map(s=>`<button class="student ${s.id===active?'active':''}" data-student="${s.id}"><span class="avatar">${esc((s.name||'?').trim().slice(0,1).toUpperCase())}</span><span><span class="studentname">${esc(s.name)}</span><br><span class="studentcount">${(s.homework||[]).length} заданий</span></span></button>`).join(''):'<div class="empty-list">Пока никого нет. Добавьте первого ученика.</div>';const s=student();$('greeting').textContent=s?s.name:'Выберите ученика';$('subtitle').textContent=s?'Все задания и комментарии ученику собраны здесь.':'Создавайте задания и следите за историей в одном месте.';$('studentSettings').classList.toggle('show',!!s);$('addHomework').disabled=!s;$('addHomework').style.opacity=s?1:.5;$('historyInfo').textContent=s?`${(s.homework||[]).length} записей · новые сверху`:'';if(!s){$('history').innerHTML='<div class="panel empty"><b>Начните с добавления ученика</b>Задания будут сохраняться в его личной истории.</div>';return}const list=[...(s.homework||[])].sort((a,b)=>b.createdAt-a.createdAt);$('history').innerHTML=list.length?list.map(h=>`<article class="panel homework"><div><h4 class="hw-title">${esc(h.section)}</h4><div class="meta"><span class="pill period">${esc(h.period)}</span><span class="pill">${new Date(h.createdAt).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}</span></div>${h.link?`<p><a class="hw-link" href="${esc(h.link)}" target="_blank" rel="noopener noreferrer">↗ Открыть приложение</a></p>`:''}${h.comment?`<div class="comment">${esc(h.comment)}</div>`:''}</div><div class="hw-actions"><button class="iconbtn" data-edit="${h.id}">Изменить</button><button class="iconbtn delete" data-delete="${h.id}" aria-label="Удалить задание">Удалить</button></div></article>`).join(''):'<div class="panel empty"><b>История пока пуста</b>Нажмите «Новое задание», чтобы добавить первую запись.</div>'}
function openModal(which,record){mode=which;editId=record?.id||null;$('modalTitle').textContent=which==='student'?(record?'Переименовать ученика':'Новый ученик'):record?'Изменить задание':'Новое задание';let fields=which==='student'?`<div class="field"><label for="studentName">Имя ученика</label><input id="studentName" name="name" required maxlength="80" placeholder="Например, Анна Смирнова" value="${esc(record?.name||'')}"></div>`:`<div class="field"><label for="period">Период</label><input id="period" name="period" required maxlength="100" placeholder="Например, 18–24 ноября" value="${esc(record?.period||'')}"></div><div class="field"><label for="section">Название раздела</label><input id="section" name="section" required maxlength="160" placeholder="Например, Дроби и проценты" value="${esc(record?.section||'')}"></div><div class="field"><label for="link">Ссылка на приложение</label><input id="link" name="link" type="url" maxlength="1000" placeholder="https://…" value="${esc(record?.link||'')}"></div><div class="field"><label for="comment">Комментарии учителя</label><textarea id="comment" name="comment" maxlength="2000" placeholder="Что важно учесть ученику?">${esc(record?.comment||'')}</textarea></div>`;$('modalFields').innerHTML=fields;$('modalBg').classList.add('open');setTimeout(()=>$('modalFields').querySelector('input')?.focus(),30)}function close(){ $('modalBg').classList.remove('open')}
$('addStudent').onclick=()=>openModal('student');$('addHomework').onclick=()=>student()&&openModal('homework');$('themeBtn').onclick=()=>{data.theme=data.theme==='dark'?'light':'dark';save();render()};$('closeModal').onclick=$('cancelModal').onclick=close;$('modalBg').onclick=e=>{if(e.target===$('modalBg'))close()};$('students').onclick=e=>{const b=e.target.closest('[data-student]');if(b){active=b.dataset.student;render()}};$('history').onclick=e=>{const d=e.target.closest('[data-delete]'),ed=e.target.closest('[data-edit]');if(d){const s=student();if(s&&confirm('Удалить это задание из истории?')){s.homework=s.homework.filter(h=>h.id!==d.dataset.delete);save();render()}}if(ed){const h=student()?.homework.find(x=>x.id===ed.dataset.edit);if(h)openModal('homework',h)}};$('renameStudent').onclick=()=>student()&&openModal('student',student());$('deleteStudent').onclick=()=>{const s=student();if(s&&confirm(`Удалить ученика «${s.name}» вместе со всей историей заданий?`)){data.students=data.students.filter(x=>x.id!==active);active=data.students[0]?.id||null;save();render()}};$('clearProgress').onclick=()=>{const s=student();if(s&&(s.homework||[]).length&&confirm(`Удалить всю историю заданий ученика «${s.name}»?`)){s.homework=[];save();render()}};
$('modalForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.currentTarget);if(mode==='student'){const name=String(fd.get('name')).trim();if(!name)return;if(editId){const s=data.students.find(x=>x.id===editId);if(s)s.name=name}else{const s={id:uid(),name,homework:[]};data.students.push(s);active=s.id}}else{const s=student();if(!s)return;const h={id:editId||uid(),period:String(fd.get('period')).trim(),section:String(fd.get('section')).trim(),link:String(fd.get('link')).trim(),comment:String(fd.get('comment')).trim(),createdAt:editId?(s.homework.find(x=>x.id===editId)?.createdAt||Date.now()):Date.now()};if(editId)s.homework=s.homework.map(x=>x.id===editId?h:x);else s.homework.push(h)}save();close();render()};render()})();
</script></body></html>
