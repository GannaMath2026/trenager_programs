<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВИЗУАЛИЗАЦИЯ ЗАДАЧ МАТЕМАТИКА - ПРОСМОТР</title>
    <!-- KaTeX для формул -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <!-- pako для распаковки -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: white;
            height: 100vh;
            overflow: hidden;
        }

        .viewer {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .left-panel {
            width: 40%;
            background: #f8fafd;
            padding: 40px;
            overflow-y: auto;
            border-right: 2px solid #e0e7f0;
        }

        .right-panel {
            width: 60%;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 25px 30px;
            background: #f8fafd;
            border-bottom: 2px solid #e0e7f0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hint {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .solution {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            font-family: 'Fira Code', monospace;
            font-size: 1.2rem;
            line-height: 1.8;
            background: white;
        }

        .condition {
            background: white;
            border-radius: 16px;
            padding: 25px;
            border-left: 6px solid #667eea;
            font-size: 1.2rem;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .image {
            max-width: 100%;
            max-height: 250px;
            border-radius: 16px;
            object-fit: contain;
            border: 2px solid #e0e7f0;
            padding: 10px;
            margin-bottom: 20px;
        }

        /* Стили для графика */
        .graph-container {
            margin-top: 20px;
            border: 2px solid #e0e7f0;
            border-radius: 12px;
            overflow: hidden;
            width: 100%;
            position: relative;
        }

        .graph-fullscreen-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255,255,255,0.9);
            border: 2px solid #667eea;
            border-radius: 30px;
            padding: 8px 16px;
            font-weight: 600;
            color: #667eea;
            cursor: pointer;
            z-index: 100;
            transition: 0.3s;
            font-size: 0.9rem;
        }

        .graph-fullscreen-btn:hover {
            background: #667eea;
            color: white;
        }

        .graph-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Модальное окно для полноэкранного графика */
        .graph-fullscreen-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }

        .graph-fullscreen-modal.active {
            display: flex;
        }

        .graph-fullscreen-content {
            width: 95%;
            height: 95%;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        .graph-fullscreen-close {
            position: absolute;
            top: 15px;
            right: 25px;
            background: #f56565;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 10px 25px;
            font-weight: 600;
            cursor: pointer;
            z-index: 10001;
            font-size: 1.1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: 0.3s;
        }

        .graph-fullscreen-close:hover {
            background: #e53e3e;
            transform: scale(1.05);
        }

        .graph-fullscreen-body {
            width: 100%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        .graph-fullscreen-body iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
        }

        .code-line { 
            color: #2c3e50; 
            font-weight: 500; 
            margin-bottom: 5px;
            white-space: pre-wrap;
        }
        
        .comment-line { 
            color: #2e6b4c; 
            font-style: italic; 
            margin-left: 25px; 
            padding-left: 20px; 
            border-left: 4px solid #86b89c; 
            background: #f3faf6; 
            border-radius: 0 12px 12px 0; 
            margin-bottom: 15px;
            white-space: pre-wrap;
        }

        .empty-message { 
            color: #a0aec0; 
            font-style: italic; 
            font-size: 1.4rem; 
            text-align: center; 
            margin-top: 100px; 
        }

        .katex { 
            font-size: 1.2em; 
        }
    </style>
</head>
<body>
<div class="viewer">
    <div class="left-panel" id="leftPanel"></div>
    <div class="right-panel">
        <div class="header">
            <span class="hint">␣ пробел — следующий шаг</span>
        </div>
        <div class="solution" id="solution"></div>
    </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО ДЛЯ ПОЛНОЭКРАННОГО ГРАФИКА -->
<div class="graph-fullscreen-modal" id="graphFullscreenModal">
    <div class="graph-fullscreen-content">
        <button class="graph-fullscreen-close" id="closeGraphFullscreenBtn">✕ Закрыть</button>
        <div class="graph-fullscreen-body" id="graphFullscreenBody"></div>
    </div>
</div>

<script>
    (function() {
        const leftPanel = document.getElementById('leftPanel');
        const solutionDiv = document.getElementById('solution');
        
        // Элементы модального окна для графика
        const graphFullscreenModal = document.getElementById('graphFullscreenModal');
        const graphFullscreenBody = document.getElementById('graphFullscreenBody');
        const closeGraphFullscreenBtn = document.getElementById('closeGraphFullscreenBtn');
        
        let solutionBlocks = [];
        let currentBlockIndex = 0;

        // Функция для рендеринга формул
        function renderMathInElement(element) {
            if (window.renderMathInElement) {
                window.renderMathInElement(element, {
                    delimiters: [
                        {left: '\\(', right: '\\)', display: false},
                        {left: '\\[', right: '\\]', display: true},
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError: false,
                    output: 'html'
                });
            }
        }

        // Функция открытия полноэкранного графика
        window.openGraphFullscreen = function(graphHtml) {
            graphFullscreenBody.innerHTML = graphHtml;
            graphFullscreenModal.classList.add('active');
            
            // Рендерим формулы, если есть
            setTimeout(() => {
                renderMathInElement(graphFullscreenBody);
            }, 100);
        };

        // Закрытие полноэкранного графика
        closeGraphFullscreenBtn.addEventListener('click', () => {
            graphFullscreenModal.classList.remove('active');
            graphFullscreenBody.innerHTML = '';
        });

        // Закрытие по ESC
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Escape' && graphFullscreenModal.classList.contains('active')) {
                graphFullscreenModal.classList.remove('active');
                graphFullscreenBody.innerHTML = '';
            }
        });

        // Функция для подготовки HTML графика
        function prepareGraphHtml(html, height, useSandbox) {
            if (!html || !html.trim()) return '';
            
            // Генерируем уникальный ID
            const containerId = 'graph-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
            
            // Если это iframe, добавляем параметры
            if (html.includes('<iframe')) {
                // Добавляем высоту, если не указана
                if (!html.includes('height=')) {
                    html = html.replace('<iframe', `<iframe height="${height}"`);
                }
                // Добавляем sandbox, если нужно
                if (useSandbox && !html.includes('sandbox=')) {
                    html = html.replace('<iframe', '<iframe sandbox="allow-scripts allow-same-origin allow-forms allow-popups"');
                }
                // Добавляем allowfullscreen
                if (!html.includes('allowfullscreen')) {
                    html = html.replace('<iframe', '<iframe allowfullscreen');
                }
            }
            
            // Экранируем HTML для передачи в onclick
            const escapedHtml = html.replace(/"/g, '&quot;').replace(/'/g, "\\'");
            
            return `<div class="graph-container" id="${containerId}" style="height: ${height}px;">
                        <button class="graph-fullscreen-btn" onclick="openGraphFullscreen('${escapedHtml}')">🔍 Открыть на весь экран</button>
                        ${html}
                    </div>`;
        }

        // Загрузка данных из URL
        function loadTaskFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            const dataParam = urlParams.get('data');
            
            if (!dataParam) {
                leftPanel.innerHTML = '<div class="condition">Ошибка: нет данных</div>';
                return;
            }

            try {
                // Распаковываем данные
                const base64 = decodeURIComponent(dataParam);
                const compressed = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
                const json = pako.inflate(compressed, { to: 'string' });
                const taskData = JSON.parse(json);

                // Подготавливаем график
                let graphHtml = '';
                if (taskData.graphHtml) {
                    graphHtml = prepareGraphHtml(
                        taskData.graphHtml, 
                        taskData.graphHeight || 400, 
                        taskData.graphSandbox !== false
                    );
                }

                // Заполняем левую панель
                leftPanel.innerHTML = `
                    <div class="condition">${taskData.condition || '— условие не задано —'}</div>
                    ${taskData.image ? `<img class="image" src="${taskData.image}" onerror="this.style.display='none'">` : ''}
                    ${graphHtml}
                `;
                
                // Рендерим формулы в левой панели
                setTimeout(() => {
                    renderMathInElement(leftPanel);
                }, 100);

                // Парсим решение
                solutionBlocks = taskData.solution ? taskData.solution.split('\n').map(line => ({
                    type: line.trim().startsWith('#') ? 'comment' : 'code',
                    text: line
                })) : [];
                
                solutionDiv.innerHTML = '<div class="empty-message">✨ Нажмите пробел</div>';
                
            } catch (e) {
                console.error('Ошибка загрузки:', e);
                leftPanel.innerHTML = '<div class="condition">Ошибка загрузки данных</div>';
            }
        }

        // Шаг анимации
        function stepAnimation() {
            if (currentBlockIndex >= solutionBlocks.length) return;
            
            // Убираем заглушку
            if (solutionDiv.children.length === 1 && 
                solutionDiv.children[0].classList.contains('empty-message')) {
                solutionDiv.innerHTML = '';
            }
            
            const block = solutionBlocks[currentBlockIndex];
            const div = document.createElement('div');
            div.className = block.type === 'code' ? 'code-line' : 'comment-line';
            div.textContent = block.text;
            solutionDiv.appendChild(div);
            
            // Рендерим формулы в новом блоке
            renderMathInElement(div);
            
            currentBlockIndex++;
            solutionDiv.scrollTop = solutionDiv.scrollHeight;
        }

        // Обработчик клавиш
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                stepAnimation();
            }
        });

        // Загружаем данные при старте
        loadTaskFromUrl();

        // Дополнительный рендеринг через небольшую задержку
        setTimeout(() => {
            renderMathInElement(leftPanel);
        }, 500);
    })();
</script>
</body>
</html>
