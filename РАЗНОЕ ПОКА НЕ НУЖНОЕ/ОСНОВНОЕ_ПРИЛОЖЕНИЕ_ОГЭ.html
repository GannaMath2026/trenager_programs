<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конструктор задач - создание, редактирование, импорт/экспорт</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Панель управления */
        .control-panel {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .panel-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        .btn-warning {
            background: #f59e0b;
            color: white;
        }

        .btn-warning:hover {
            background: #d97706;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-secondary:hover {
            background: #4b5563;
            transform: translateY(-2px);
        }

        /* Форма редактирования */
        .edit-form {
            background: #f9fafb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid #e5e7eb;
        }

        .edit-form h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #374151;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
            font-family: monospace;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Список задач */
        .tasks-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .task-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .task-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .task-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .task-number {
            font-size: 18px;
            font-weight: bold;
        }

        .task-title {
            font-size: 18px;
            font-weight: 600;
            flex: 1;
        }

        .task-badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-section {
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .badge-difficulty {
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .task-actions {
            display: flex;
            gap: 8px;
        }

        .task-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .task-btn-edit {
            background: #f59e0b;
            color: white;
        }

        .task-btn-delete {
            background: #ef4444;
            color: white;
        }

        .task-btn-view {
            background: #3b82f6;
            color: white;
        }

        .task-content {
            padding: 20px;
        }

        .task-section {
            margin-bottom: 20px;
            padding: 15px;
            background: #f9fafb;
            border-radius: 12px;
            border-left: 4px solid #667eea;
        }

        .task-section h4 {
            margin-bottom: 10px;
            color: #374151;
            font-size: 16px;
        }

        .task-section img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-top: 10px;
        }

        .task-text {
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.6;
        }

        .video-link {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 16px;
            background: #e74c3c;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
        }

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 25px;
            max-width: 90%;
            max-height: 90%;
            overflow: auto;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-close {
            cursor: pointer;
            font-size: 24px;
            color: #999;
        }

        /* Пустое состояние */
        .empty-state {
            text-align: center;
            padding: 60px;
            background: white;
            border-radius: 16px;
            color: #9ca3af;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        /* Статистика */
        .stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e5e7eb;
        }

        .stat-item {
            font-size: 14px;
            color: #6b7280;
        }

        .stat-value {
            font-weight: bold;
            color: #667eea;
            font-size: 18px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .task-header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .button-group {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Панель управления -->
        <div class="control-panel">
            <div class="panel-title">📚 Конструктор задач</div>
            
            <div class="button-group">
                <button class="btn btn-primary" onclick="addNewTask()">➕ Добавить задачу</button>
                <button class="btn btn-success" onclick="exportTasks()">💾 Экспорт задач (JSON)</button>
                <button class="btn btn-primary" onclick="document.getElementById('importFile').click()">📂 Импорт задач (JSON)</button>
                <button class="btn btn-warning" onclick="clearAllTasks()">🗑️ Очистить все задачи</button>
                <button class="btn btn-secondary" onclick="loadSampleTasks()">📋 Загрузить примеры</button>
                <input type="file" id="importFile" style="display: none;" accept=".json" onchange="importTasks(this)">
            </div>
            
            <input type="text" id="searchInput" placeholder="🔍 Поиск по названию..." style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin-top: 10px;">
            
            <div class="stats" id="stats">
                <div class="stat-item">📊 Всего задач: <span class="stat-value" id="totalTasks">0</span></div>
                <div class="stat-item">✅ Решено: <span class="stat-value" id="solvedTasks">0</span></div>
                <div class="stat-item">⭐ Избранное: <span class="stat-value" id="favoriteTasks">0</span></div>
            </div>
        </div>
        
        <!-- Форма редактирования задачи -->
        <div id="editForm" class="edit-form" style="display: none;">
            <h3 id="formTitle">✏️ Редактирование задачи</h3>
            <div class="form-group">
                <label>Название задачи *</label>
                <input type="text" id="taskTitle" placeholder="Введите название задачи">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Раздел</label>
                    <input type="text" id="taskSection" placeholder="Например: Алгебра, Геометрия">
                </div>
                <div class="form-group">
                    <label>Сложность</label>
                    <select id="taskDifficulty">
                        <option value="basic">🟢 Легкая</option>
                        <option value="medium">🟡 Средняя</option>
                        <option value="hard">🔴 Сложная</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Условие задачи (текст или HTML)</label>
                <textarea id="taskText" placeholder="Введите условие задачи..."></textarea>
            </div>
            <div class="form-group">
                <label>Изображение условия (вставьте ссылку или base64)</label>
                <input type="text" id="taskImage" placeholder="https://... или data:image/png;base64,...">
            </div>
            <div class="form-group">
                <label>Ответ</label>
                <textarea id="answerText" placeholder="Введите ответ..."></textarea>
            </div>
            <div class="form-group">
                <label>Изображение ответа</label>
                <input type="text" id="answerImage" placeholder="https://... или data:image/png;base64,...">
            </div>
            <div class="form-group">
                <label>Решение</label>
                <textarea id="solutionText" placeholder="Введите решение..."></textarea>
            </div>
            <div class="form-group">
                <label>Изображение решения/чертеж</label>
                <input type="text" id="solutionImage" placeholder="https://... или data:image/png;base64,...">
            </div>
            <div class="form-group">
                <label>Ссылка на видеоразбор</label>
                <input type="text" id="videoLink" placeholder="https://...">
            </div>
            <div class="button-group">
                <button class="btn btn-success" onclick="saveTask()">💾 Сохранить</button>
                <button class="btn btn-secondary" onclick="cancelEdit()">❌ Отмена</button>
            </div>
        </div>
        
        <!-- Список задач -->
        <div id="tasksList" class="tasks-list">
            <!-- Задачи будут здесь -->
        </div>
    </div>
    
    <!-- Модальное окно для просмотра -->
    <div id="viewModal" class="modal" onclick="closeModal(event)">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle"></h2>
                <span class="modal-close" onclick="closeModal()">&times;</span>
            </div>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        // Хранилище задач
        let tasks = [];
        let editingId = null;
        let nextId = 1;
        
        // Загрузка из localStorage
        function loadFromStorage() {
            const saved = localStorage.getItem('tasks_app');
            if (saved) {
                tasks = JSON.parse(saved);
                nextId = Math.max(...tasks.map(t => t.id), 0) + 1;
            } else {
                // Пустой массив, пользователь сам добавит задачи
                tasks = [];
                nextId = 1;
            }
            render();
        }
        
        // Сохранение в localStorage
        function saveToStorage() {
            localStorage.setItem('tasks_app', JSON.stringify(tasks));
        }
        
        // Рендер списка задач
        function render() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filteredTasks = tasks.filter(task => 
                task.title.toLowerCase().includes(searchTerm)
            );
            
            const container = document.getElementById('tasksList');
            
            if (filteredTasks.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div>📭</div>
                        <p>Нет задач</p>
                        <p>Нажмите "Добавить задачу" или "Загрузить примеры"</p>
                    </div>
                `;
            } else {
                container.innerHTML = filteredTasks.map(task => `
                    <div class="task-card" data-id="${task.id}">
                        <div class="task-header">
                            <div class="task-number">#${task.id}</div>
                            <div class="task-title">${escapeHtml(task.title)}</div>
                            <div class="task-badges">
                                <span class="badge badge-section">📂 ${escapeHtml(task.sectionName || 'Без раздела')}</span>
                                <span class="badge badge-difficulty">${getDifficultyIcon(task.difficulty)} ${getDifficultyText(task.difficulty)}</span>
                                ${task.isSolved ? '<span class="badge" style="background: #10b981;">✅ Решено</span>' : ''}
                                ${task.isFavorite ? '<span class="badge" style="background: #f59e0b;">⭐ Избранное</span>' : ''}
                            </div>
                            <div class="task-actions">
                                <button class="task-btn task-btn-view" onclick="viewTask(${task.id})">👁️ Просмотр</button>
                                <button class="task-btn task-btn-edit" onclick="editTask(${task.id})">✏️ Редакт</button>
                                <button class="task-btn task-btn-delete" onclick="deleteTask(${task.id})">🗑️ Удалить</button>
                            </div>
                        </div>
                        <div class="task-content">
                            <div class="task-section">
                                <h4>📝 Условие:</h4>
                                <div class="task-text">${task.taskText ? truncate(escapeHtml(task.taskText), 200) : '<em>Нет текста условия</em>'}</div>
                                ${task.taskImage ? `<img src="${task.taskImage}" alt="Условие" style="max-width: 100%; max-height: 200px;">` : ''}
                            </div>
                            ${task.videoLink ? `
                                <div>
                                    <a href="${task.videoLink}" target="_blank" class="video-link">🎥 Смотреть видеоразбор</a>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `).join('');
            }
            
            // Обновляем статистику
            const total = tasks.length;
            const solved = tasks.filter(t => t.isSolved).length;
            const favorite = tasks.filter(t => t.isFavorite).length;
            
            document.getElementById('totalTasks').textContent = total;
            document.getElementById('solvedTasks').textContent = solved;
            document.getElementById('favoriteTasks').textContent = favorite;
            
            saveToStorage();
        }
        
        // Добавить новую задачу
        function addNewTask() {
            editingId = null;
            document.getElementById('formTitle').textContent = '➕ Добавление новой задачи';
            document.getElementById('taskTitle').value = '';
            document.getElementById('taskSection').value = '';
            document.getElementById('taskDifficulty').value = 'basic';
            document.getElementById('taskText').value = '';
            document.getElementById('taskImage').value = '';
            document.getElementById('answerText').value = '';
            document.getElementById('answerImage').value = '';
            document.getElementById('solutionText').value = '';
            document.getElementById('solutionImage').value = '';
            document.getElementById('videoLink').value = '';
            document.getElementById('editForm').style.display = 'block';
            document.getElementById('editForm').scrollIntoView({ behavior: 'smooth' });
        }
        
        // Редактировать задачу
        function editTask(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;
            
            editingId = id;
            document.getElementById('formTitle').textContent = '✏️ Редактирование задачи';
            document.getElementById('taskTitle').value = task.title || '';
            document.getElementById('taskSection').value = task.sectionName || '';
            document.getElementById('taskDifficulty').value = task.difficulty || 'basic';
            document.getElementById('taskText').value = task.taskText || '';
            document.getElementById('taskImage').value = task.taskImage || '';
            document.getElementById('answerText').value = task.answerText || '';
            document.getElementById('answerImage').value = task.answerImage || '';
            document.getElementById('solutionText').value = task.solutionText || '';
            document.getElementById('solutionImage').value = task.solutionImage || '';
            document.getElementById('videoLink').value = task.videoLink || '';
            document.getElementById('editForm').style.display = 'block';
            document.getElementById('editForm').scrollIntoView({ behavior: 'smooth' });
        }
        
        // Сохранить задачу
        function saveTask() {
            const taskData = {
                id: editingId || nextId++,
                title: document.getElementById('taskTitle').value.trim() || 'Без названия',
                sectionName: document.getElementById('taskSection').value,
                difficulty: document.getElementById('taskDifficulty').value,
                taskText: document.getElementById('taskText').value,
                taskImage: document.getElementById('taskImage').value,
                answerText: document.getElementById('answerText').value,
                answerImage: document.getElementById('answerImage').value,
                solutionText: document.getElementById('solutionText').value,
                solutionImage: document.getElementById('solutionImage').value,
                videoLink: document.getElementById('videoLink').value,
                isSolved: false,
                isFavorite: false
            };
            
            if (editingId) {
                const index = tasks.findIndex(t => t.id === editingId);
                if (index !== -1) {
                    tasks[index] = { ...tasks[index], ...taskData };
                }
            } else {
                tasks.push(taskData);
            }
            
            cancelEdit();
            render();
        }
        
        // Отмена редактирования
        function cancelEdit() {
            document.getElementById('editForm').style.display = 'none';
            editingId = null;
        }
        
        // Удалить задачу
        function deleteTask(id) {
            if (confirm('Удалить задачу?')) {
                tasks = tasks.filter(t => t.id !== id);
                render();
            }
        }
        
        // Очистить все задачи
        function clearAllTasks() {
            if (confirm('Удалить все задачи? Это действие нельзя отменить.')) {
                tasks = [];
                nextId = 1;
                render();
            }
        }
        
        // Просмотр задачи
        function viewTask(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;
            
            document.getElementById('modalTitle').textContent = task.title;
            document.getElementById('modalContent').innerHTML = `
                <div class="task-section">
                    <h4>📝 Условие:</h4>
                    <div class="task-text">${task.taskText ? escapeHtml(task.taskText) : '<em>Нет текста условия</em>'}</div>
                    ${task.taskImage ? `<img src="${task.taskImage}" alt="Условие" style="max-width: 100%;">` : ''}
                </div>
                ${task.answerText || task.answerImage ? `
                    <div class="task-section">
                        <h4>✅ Ответ:</h4>
                        <div class="task-text">${task.answerText ? escapeHtml(task.answerText) : ''}</div>
                        ${task.answerImage ? `<img src="${task.answerImage}" alt="Ответ" style="max-width: 100%;">` : ''}
                    </div>
                ` : ''}
                ${task.solutionText || task.solutionImage ? `
                    <div class="task-section">
                        <h4>🔍 Решение:</h4>
                        <div class="task-text">${task.solutionText ? escapeHtml(task.solutionText) : ''}</div>
                        ${task.solutionImage ? `<img src="${task.solutionImage}" alt="Решение" style="max-width: 100%;">` : ''}
                    </div>
                ` : ''}
                ${task.videoLink ? `
                    <div>
                        <a href="${task.videoLink}" target="_blank" class="video-link">🎥 Смотреть видеоразбор</a>
                    </div>
                ` : ''}
                <div class="button-group" style="margin-top: 20px;">
                    <button class="btn btn-warning" onclick="toggleSolved(${task.id}); closeModal();">${task.isSolved ? '❌ Снять отметку "Решено"' : '✅ Отметить как решенное'}</button>
                    <button class="btn btn-primary" onclick="toggleFavorite(${task.id}); closeModal();">${task.isFavorite ? '⭐ Убрать из избранного' : '⭐ Добавить в избранное'}</button>
                </div>
            `;
            document.getElementById('viewModal').style.display = 'flex';
        }
        
        // Переключить статус "Решено"
        function toggleSolved(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.isSolved = !task.isSolved;
                render();
            }
        }
        
        // Переключить статус "Избранное"
        function toggleFavorite(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.isFavorite = !task.isFavorite;
                render();
            }
        }
        
        // Закрыть модальное окно
        function closeModal(event) {
            if (!event || event.target === document.getElementById('viewModal') || event.target.classList.contains('modal-close')) {
                document.getElementById('viewModal').style.display = 'none';
            }
        }
        
        // Экспорт задач
        function exportTasks() {
            const data = JSON.stringify(tasks, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `tasks_${new Date().toISOString().slice(0,19)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        // Импорт задач
        function importTasks(input) {
            const file = input.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        const maxId = Math.max(...tasks.map(t => t.id), 0);
                        imported.forEach(task => {
                            task.id = maxId + (task.id || nextId++);
                            tasks.push(task);
                        });
                        nextId = Math.max(...tasks.map(t => t.id), 0) + 1;
                        render();
                        alert(`Импортировано ${imported.length} задач`);
                    } else {
                        alert('Неверный формат файла. Ожидается массив задач.');
                    }
                } catch (err) {
                    alert('Ошибка при импорте: ' + err.message);
                }
                input.value = '';
            };
            reader.readAsText(file);
        }
        
        // Загрузить примеры задач
        function loadSampleTasks() {
            const sampleTasks = [
                {
                    id: nextId++,
                    title: "Решение квадратного уравнения",
                    sectionName: "Алгебра",
                    difficulty: "basic",
                    taskText: "Решите уравнение: x² + 5x + 6 = 0",
                    answerText: "x₁ = -2, x₂ = -3",
                    solutionText: "D = 25 - 24 = 1\nx = (-5 ± 1)/2\nx₁ = -2, x₂ = -3",
                    isSolved: false,
                    isFavorite: false
                },
                {
                    id: nextId++,
                    title: "Площадь треугольника",
                    sectionName: "Геометрия",
                    difficulty: "basic",
                    taskText: "Найдите площадь треугольника со сторонами 3, 4, 5",
                    answerText: "6",
                    solutionText: "По формуле Герона:\np = (3+4+5)/2 = 6\nS = √(6·3·2·1) = √36 = 6",
                    isSolved: false,
                    isFavorite: false
                }
            ];
            
            tasks.push(...sampleTasks);
            render();
            alert(`Добавлено ${sampleTasks.length} примеров задач. Отредактируйте их под свои нужды.`);
        }
        
        // Вспомогательные функции
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function truncate(text, length) {
            if (!text) return '';
            if (text.length <= length) return text;
            return text.substring(0, length) + '...';
        }
        
        function getDifficultyIcon(difficulty) {
            switch(difficulty) {
                case 'basic': return '🟢';
                case 'medium': return '🟡';
                case 'hard': return '🔴';
                default: return '🟢';
            }
        }
        
        function getDifficultyText(difficulty) {
            switch(difficulty) {
                case 'basic': return 'Легкая';
                case 'medium': return 'Средняя';
                case 'hard': return 'Сложная';
                default: return 'Легкая';
            }
        }
        
        // Поиск
        document.getElementById('searchInput').addEventListener('input', render);
        
        // Инициализация
        loadFromStorage();
    </script>
</body>
