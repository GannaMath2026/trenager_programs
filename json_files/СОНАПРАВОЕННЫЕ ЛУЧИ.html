<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Сонаправленные лучи — 3D</title>
<style>
  :root{ --txt:#e6edf7; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;}
  body{
    background:radial-gradient(1200px 800px at 75% 15%, #1c2740 0%, #0b1018 60%, #070a10 100%);
    color:var(--txt);font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  }
  #app{position:fixed;inset:0;display:flex;}
  .menu{
    width:340px;height:100%;
    background:rgba(12,17,26,.92);
    border-right:1px solid rgba(255,255,255,.08);
    padding:18px 14px;overflow-y:auto;
    backdrop-filter:blur(10px);
  }
  .menu h2{
    font-size:12px;text-transform:uppercase;letter-spacing:1px;
    color:#8fa3bf;margin:16px 0 8px 6px;font-weight:700;
  }
  .menu h2:first-child{margin-top:0;}
  .menu h2.section{color:#4ecdc4;}
  .menu button{
    width:100%;
    background:rgba(18,24,34,.85);
    border:1px solid rgba(255,255,255,.10);
    color:#cfd9e8;font:inherit;font-size:12.5px;font-weight:600;
    padding:9px 13px;border-radius:10px;text-align:left;cursor:pointer;
    transition:.15s;margin-bottom:5px;
  }
  .menu button:hover{color:#fff;border-color:rgba(78,205,196,.5);}
  .menu button.active{
    background:rgba(78,205,196,.18);color:#fff;
    border-color:rgba(78,205,196,.65);
    box-shadow:0 0 0 1px rgba(78,205,196,.4);
  }
  .view{position:relative;flex:1;min-width:0;}
  .view canvas{display:block;}
  .caption{
    position:absolute;top:18px;left:50%;transform:translateX(-50%);
    max-width:min(820px, 92%);
    background:rgba(18,24,34,.88);backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.12);
    border-radius:14px;padding:12px 20px;
    font-size:13.5px;line-height:1.5;color:#cfd9e8;
    box-shadow:0 8px 22px rgba(0,0,0,.45);
    text-align:center;
  }
  .caption b{color:#4ecdc4;}
  .caption .label{
    display:inline-block;font-size:11px;letter-spacing:1px;
    color:#8fa3bf;text-transform:uppercase;margin-bottom:4px;
  }
  .hint{
    position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
    font-size:11.5px;color:#5f6d82;letter-spacing:.3px;pointer-events:none;
    background:rgba(15,21,32,.6);padding:6px 12px;border-radius:8px;
  }
</style>
</head>
<body>
<div id="app">
  <aside class="menu" id="menu">
    <h2 class="section">Сонаправленные лучи</h2>
    <button data-id="def" class="active">1. Определение</button>
    <button data-id="same" >2. Сонаправленные в одной плоскости</button>
    <button data-id="parallel" >3. Лучи в параллельных плоскостях</button>
    <button data-id="theorem">4. Теорема: углы равны</button>
  </aside>

  <div class="view" id="view">
    <div class="caption" id="caption"></div>
    <div class="hint">левая кнопка — вращать · колесо — зум · ПКМ — панорама</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const viewEl = document.getElementById('view');
const captionEl = document.getElementById('caption');

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(viewEl.clientWidth, viewEl.clientHeight);
viewEl.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, viewEl.clientWidth/viewEl.clientHeight, 0.1, 200);
camera.position.set(3.8, 3.2, 4.8);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1;
controls.maxDistance = 30;
controls.target.set(0, 0, 0);
controls.minPolarAngle = Math.PI * 0.05;
controls.maxPolarAngle = Math.PI * 0.49;

scene.add(new THREE.HemisphereLight(0xdce8ff, 0x1a2233, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 2.0); key.position.set(6,9,7); scene.add(key);
const rim = new THREE.DirectionalLight(0x7fa8ff, 1.0); rim.position.set(-7,-3,-6); scene.add(rim);

const g = new THREE.Group(); scene.add(g);

/* ---------- Хелперы ---------- */
const V = (x,y,z)=> new THREE.Vector3(x,y,z);

function fatLine(a, b, color, r=0.028){
  const grp = new THREE.Group();
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  if (len < 1e-6) return grp;
  const mid = a.clone().add(b).multiplyScalar(0.5);
  const geo = new THREE.CylinderGeometry(r, r, len, 12, 1, false);
  const mat = new THREE.MeshStandardMaterial({
    color, roughness:0.35, metalness:0.1, emissive: color, emissiveIntensity: 0.15
  });
  const cyl = new THREE.Mesh(geo, mat);
  cyl.position.copy(mid);
  cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
  grp.add(cyl);
  [a, b].forEach(p=>{
    const sp = new THREE.Mesh(new THREE.SphereGeometry(r*1.05, 10, 8), mat);
    sp.position.copy(p);
    grp.add(sp);
  });
  return grp;
}

function arrow(a, b, color, r=0.030){
  const grp = new THREE.Group();
  grp.add(fatLine(a, b, color, r));
  // конус-наконечник
  const dir = new THREE.Vector3().subVectors(b, a).normalize();
  const cone = new THREE.Mesh(
    new THREE.ConeGeometry(r*2.8, r*8, 14),
    new THREE.MeshStandardMaterial({color, emissive:color, emissiveIntensity:0.2})
  );
  cone.position.copy(b.clone().add(dir.clone().multiplyScalar(-r*4)));
  cone.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
  grp.add(cone);
  return grp;
}

function dashedLine(a, b, color, dash=0.09, gap=0.07){
  const mat = new THREE.LineDashedMaterial({color, dashSize:dash, gapSize:gap});
  const geo = new THREE.BufferGeometry().setFromPoints([a, b]);
  const line = new THREE.Line(geo, mat);
  line.computeLineDistances();
  const grp = new THREE.Group();
  grp.add(line);
  return grp;
}

function dashedThick(a, b, color, r=0.016, dash=0.14, gap=0.09){
  const grp = new THREE.Group();
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  if (len < 1e-6) return grp;
  const n = dir.clone().normalize();
  const total = dash + gap;
  let t = 0;
  while (t < len){
    const s0 = a.clone().add(n.clone().multiplyScalar(t));
    const s1 = a.clone().add(n.clone().multiplyScalar(Math.min(t+dash, len)));
    grp.add(fatLine(s0, s1, color, r));
    t += total;
  }
  return grp;
}

function point(p, color=0xff6b6b, r=0.08){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12),
                           new THREE.MeshBasicMaterial({color}));
  m.position.copy(p);
  return m;
}

function label(p, text, color='#e6edf7', size=0.55){
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  c.width = 512; c.height = 128;
  ctx.fillStyle = 'rgba(0,0,0,0)';
  ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle = color;
  ctx.font = 'bold 72px ui-sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 256, 64);
  const tex = new THREE.CanvasTexture(c);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false}));
  spr.scale.set(size, size*0.25, 1);
  spr.position.copy(p);
  return spr;
}

function planePatch(p1, p2, p3, p4, color, opacity=0.18){
  const verts = [p1, p2, p3, p4];
  const geo = new THREE.BufferGeometry().setFromPoints(verts);
  geo.setIndex([0,1,2, 0,2,3]);
  geo.computeVertexNormals();
  const mat = new THREE.MeshBasicMaterial({
    color, transparent:true, opacity, side:THREE.DoubleSide, depthWrite:false
  });
  const mesh = new THREE.Mesh(geo, mat);
  const loop = new THREE.LineLoop(
    new THREE.BufferGeometry().setFromPoints(verts),
    new THREE.LineBasicMaterial({color, linewidth:1.2, transparent:true, opacity:0.7})
  );
  const wrap = new THREE.Group();
  wrap.add(mesh); wrap.add(loop);
  return wrap;
}

function planeBig(c, u, v, s, color, opacity=0.12){
  const p1 = c.clone().add(u.clone().multiplyScalar(s)).add(v.clone().multiplyScalar(s));
  const p2 = c.clone().add(u.clone().multiplyScalar(-s)).add(v.clone().multiplyScalar(s));
  const p3 = c.clone().add(u.clone().multiplyScalar(-s)).add(v.clone().multiplyScalar(-s));
  const p4 = c.clone().add(u.clone().multiplyScalar(s)).add(v.clone().multiplyScalar(-s));
  return planePatch(p1, p2, p3, p4, color, opacity);
}

function arcAngle(O, dir1, dir2, radius, color){
  const d1 = dir1.clone().normalize();
  const d2 = dir2.clone().normalize();
  const arcPts = [];
  const N = 24;
  let e2 = d2.clone().sub(d1.clone().multiplyScalar(d1.dot(d2)));
  if (e2.length() < 1e-6) e2 = new THREE.Vector3(0,1,0).cross(d1);
  e2.normalize();
  const angle = Math.acos(Math.max(-1, Math.min(1, d1.dot(d2))));
  for (let i=0; i<=N; i++){
    const t = i/N * angle;
    const p = O.clone()
      .add(d1.clone().multiplyScalar(Math.cos(t) * radius))
      .add(e2.clone().multiplyScalar(Math.sin(t) * radius));
    arcPts.push(p);
  }
  const geo = new THREE.BufferGeometry().setFromPoints(arcPts);
  const mat = new THREE.LineBasicMaterial({color});
  const line = new THREE.Line(geo, mat);
  const grp = new THREE.Group();
  grp.add(line);
  return grp;
}

function clearGroup(grp){
  while (grp.children.length){
    const c = grp.children.pop();
    if (c.geometry) c.geometry.dispose();
    if (c.material){
      if (Array.isArray(c.material)) c.material.forEach(m=>m.dispose());
      else c.material.dispose();
    }
    if (c.children && c.children.length) clearGroup(c);
  }
}

/* ============================================================
   1. Определение сонаправленных лучей
   Два луча с общим началом O, лежащие на одной прямой,
   направленные в одну сторону.
============================================================ */
function sceneDef(){
  const O1 = V(-1.6, 0.4, 0.6);
  const O2 = V( 1.4, 0.4, 0.6);
  // луч OA — от O1 вправо
  g.add(arrow(O1, O1.clone().add(V(1.6,0,0)), 0xff6b6b, 0.030));
  // луч O'A' — от O2 вправо (сонаправлен)
  g.add(arrow(O2, O2.clone().add(V(1.4,0,0)), 0xffd93d, 0.030));

  g.add(point(O1, 0xffffff, 0.08));
  g.add(point(O2, 0xffffff, 0.08));

  // подпись A — конец первого луча, A' — конец второго
  g.add(label(O1.clone().add(V(1.8,0.15,0)), 'A', '#ff6b6b'));
  g.add(label(O2.clone().add(V(1.6,0.15,0)), "A'", '#ffd93d'));
  g.add(label(O1.clone().add(V(-0.15,0.15,0.15)), 'O', '#ffffff'));
  g.add(label(O2.clone().add(V(-0.15,0.15,0.15)), "O'", '#ffffff'));

  // подпись «сонаправлены» наверху
  g.add(label(V(0, 1.1, 0.6), 'OA ↑↑ O′A′', '#3ddc97', 0.8));
}

/* ============================================================
   2. Сонаправленные лучи в одной плоскости
   Два параллельных луча из разных точек одной плоскости.
============================================================ */
function sceneSame(){
  g.add(planeBig(V(0, 0, 0), V(1,0,0), V(0,0,1), 1.9, 0x4ecdc4, 0.12));

  // Луч 1 — из O(-1.4, 0, 0.4), направлен вправо-вперёд
  const d = V(1, 0, 0.35).normalize();
  const O1 = V(-1.4, 0, 0.4);
  const A1 = O1.clone().add(d.clone().multiplyScalar(2.0));
  g.add(arrow(O1, A1, 0xff6b6b, 0.028));

  // Луч 2 — из O'(0.2, 0, -0.6), сонаправлен
  const O2 = V(0.2, 0, -0.6);
  const A2 = O2.clone().add(d.clone().multiplyScalar(1.6));
  g.add(arrow(O2, A2, 0xffd93d, 0.028));

  g.add(point(O1, 0xffffff, 0.07));
  g.add(point(O2, 0xffffff, 0.07));

  g.add(label(O1.clone().add(V(-0.15,0.15,0.1)), 'O', '#ffffff'));
  g.add(label(O2.clone().add(V(-0.15,0.15,0.1)), "O'", '#ffffff'));
  g.add(label(A1.clone().add(V(0.1,0.15,0)), 'A', '#ff6b6b'));
  g.add(label(A2.clone().add(V(0.1,0.15,0)), "A'", '#ffd93d'));

  g.add(label(V(0, 1.0, 0), 'OA ↑↑ O′A′  (в одной плоскости)', '#3ddc97', 0.7));
}

/* ============================================================
   3. Лучи в двух параллельных плоскостях
============================================================ */
function sceneParallel(){
  g.add(planeBig(V(0, 0.9, 0), V(1,0,0), V(0,0,1), 1.5, 0x4ecdc4, 0.12));
  g.add(planeBig(V(0,-0.9, 0), V(1,0,0), V(0,0,1), 1.5, 0xffa94d, 0.12));

  const d = V(1, 0, 0.4).normalize();

  // Верхняя плоскость
  const O1 = V(-1.0, 0.9, -0.3);
  const A1 = O1.clone().add(d.clone().multiplyScalar(1.8));
  g.add(arrow(O1, A1, 0xff6b6b, 0.026));

  // Нижняя плоскость — сонаправленный
  const O2 = V(-1.0, -0.9, -0.3);
  const A2 = O2.clone().add(d.clone().multiplyScalar(1.8));
  g.add(arrow(O2, A2, 0xffd93d, 0.026));

  g.add(point(O1, 0xffffff, 0.07));
  g.add(point(O2, 0xffffff, 0.07));

  g.add(label(O1.clone().add(V(-0.15,0.1,0.1)), 'O', '#ffffff'));
  g.add(label(O2.clone().add(V(-0.15,-0.1,0.1)), "O'", '#ffffff'));
  g.add(label(A1.clone().add(V(0.1,0.15,0)), 'A', '#ff6b6b'));
  g.add(label(A2.clone().add(V(0.1,-0.15,0)), "A'", '#ffd93d'));

  // Пунктир, соединяющий O и O' — показывает параллельные плоскости
  g.add(dashedThick(O1, O2, 0x8fa3bf, 0.012, 0.12, 0.08));

  g.add(label(V(0, 1.7, 0), 'Плоскости параллельны', '#3ddc97', 0.6));
}

/* ============================================================
   4. Теорема: если стороны двух углов сонаправлены —
   то углы равны.
============================================================ */
function sceneTheorem(){
  g.add(planeBig(V(0, 0, 0), V(1,0,0), V(0,0,1), 2.1, 0x4ecdc4, 0.10));

  // Общие направления для углов
  const d1 = V(1, 0, 0.3).normalize();
  const d2 = V(0.4, 0, 1).normalize();
  const L = 1.3;

  // --- Угол 1: ∠AOB ---
  const O1 = V(-1.2, 0, 0.6);
  const A1 = O1.clone().add(d1.clone().multiplyScalar(L));
  const B1 = O1.clone().add(d2.clone().multiplyScalar(L));
  g.add(arrow(O1, A1, 0xff6b6b, 0.024));
  g.add(arrow(O1, B1, 0x6ba8ff, 0.024));
  g.add(arcAngle(O1, d1.clone(), d2.clone(), 0.5, 0xffffff));
  g.add(point(O1, 0xffffff, 0.07));

  g.add(label(O1.clone().add(V(-0.15,0.1,0.15)), 'O', '#ffffff'));
  g.add(label(A1.clone().add(V(0.1,0.1,0)), 'A', '#ff6b6b'));
  g.add(label(B1.clone().add(V(0,0.1,0.15)), 'B', '#6ba8ff'));

  // --- Угол 2: ∠A'O'B' — сонаправлен ---
  const O2 = V(0.6, 0, -0.7);
  const A2 = O2.clone().add(d1.clone().multiplyScalar(L));
  const B2 = O2.clone().add(d2.clone().multiplyScalar(L));
  g.add(arrow(O2, A2, 0xff6b6b, 0.024));
  g.add(arrow(O2, B2, 0x6ba8ff, 0.024));
  g.add(arcAngle(O2, d1.clone(), d2.clone(), 0.5, 0xffffff));
  g.add(point(O2, 0xffffff, 0.07));

  g.add(label(O2.clone().add(V(0.1,0.1,0.1)), "O'", '#ffffff'));
  g.add(label(A2.clone().add(V(0.1,0.1,0)), "A'", '#ff6b6b'));
  g.add(label(B2.clone().add(V(0,0.1,0.15)), "B'", '#6ba8ff'));

  // Подпись теоремы сверху
  g.add(label(V(0, 1.0, 0), 'OA ↑↑ O′A′,  OB ↑↑ O′B′  ⇒  ∠AOB = ∠A′O′B′', '#3ddc97', 0.55));
}

/* ============================================================
   Управление
============================================================ */
const SCENES = {
  def: {
    build: sceneDef,
    cap: '<div class="label">1. Определение</div>Два луча называются <b>сонаправленными</b>, если они лежат на параллельных прямых и направлены в одну сторону. Обозначение: <b>OA ↑↑ O′A′</b>.',
    cam:[4.4, 3.4, 5.4], tgt:[0, 0.2, 0.3]
  },
  same: {
    build: sceneSame,
    cap: '<div class="label">2. Сонаправленные лучи в одной плоскости</div>Два луча из разных точек <b>одной плоскости</b>, направленные в одну сторону, — сонаправлены.',
    cam:[4.2, 3.6, 5.2], tgt:[0, 0, 0]
  },
  parallel: {
    build: sceneParallel,
    cap: '<div class="label">3. Лучи в параллельных плоскостях</div>Если два луча лежат в <b>параллельных плоскостях</b> и одинаково направлены — они также сонаправлены.',
    cam:[4.6, 3.8, 5.6], tgt:[0, 0, 0]
  },
  theorem: {
    build: sceneTheorem,
    cap: '<div class="label">4. Теорема о сонаправленных лучах</div>Если стороны двух углов соответственно <b>сонаправлены</b>, то такие углы равны: <b>OA ↑↑ O′A′</b> и <b>OB ↑↑ O′B′</b> ⇒ <b>∠AOB = ∠A′O′B′</b>.',
    cam:[4.4, 3.8, 5.4], tgt:[0, 0, 0]
  },
};

function show(id){
  clearGroup(g);
  const s = SCENES[id];
  if (!s) return;
  try { s.build(); } catch(e){ console.error('scene error:', id, e); }
  captionEl.innerHTML = s.cap;
  camera.position.set(...s.cam);
  controls.target.set(...s.tgt);
  controls.update();
  renderer.render(scene, camera);
}

document.querySelectorAll('#menu button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#menu button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    show(btn.dataset.id);
  });
});

addEventListener('resize', ()=>{
  const w = viewEl.clientWidth, h = viewEl.clientHeight;
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

function loop(){
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
}

show('def');
loop();
</script>
</body>
</html>
