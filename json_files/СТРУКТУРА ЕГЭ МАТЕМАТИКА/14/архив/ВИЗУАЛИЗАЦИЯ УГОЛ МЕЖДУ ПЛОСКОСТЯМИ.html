<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Двугранный угол — 3D</title>
<style>
  :root{
    --bg:#0f1520; --line:#2a3a52;
    --txt:#e6edf7; --muted:#8fa3bf; --accent:#4ecdc4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;}
  body{
    background:radial-gradient(1200px 800px at 75% 15%, #1c2740 0%, #0b1018 60%, #070a10 100%);
    color:var(--txt);font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  }
  #app{position:fixed;inset:0;}
  .menu{
    position:absolute;top:20px;left:20px;
    display:flex;flex-direction:column;gap:8px;
  }
  .menu button{
    min-width:220px;
    background:rgba(18,24,34,.85);backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.12);
    color:#cfd9e8;font:inherit;font-size:13px;font-weight:600;
    padding:10px 16px;border-radius:12px;text-align:left;cursor:pointer;
    transition:.15s;
    box-shadow:0 8px 22px rgba(0,0,0,.45);
  }
  .menu button:hover{color:#fff;border-color:rgba(78,205,196,.5);}
  .menu button.active{
    background:rgba(78,205,196,.18);color:#fff;
    border-color:rgba(78,205,196,.65);
    box-shadow:0 0 0 1px rgba(78,205,196,.4), 0 8px 22px rgba(0,0,0,.45);
  }
  .hint{
    position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
    font-size:11.5px;color:#5f6d82;letter-spacing:.3px;pointer-events:none;
    background:rgba(15,21,32,.6);padding:6px 12px;border-radius:8px;
  }
</style>
</head>
<body>
<div id="app"></div>

<div class="menu">
  <button data-scene="tetra" class="active">Тетраэдр: ребро AB</button>
  <button data-scene="cube">Куб: ребро AB</button>
  <button data-scene="pyr">Пирамида: ребро AB</button>
</div>

<div class="hint">левая кнопка — вращать · колесо — зум · ПКМ — панорама</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const host = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0b1018, 0.035);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
// Стартовая камера — учебный ракурс: сверху, чуть сбоку, впереди.
camera.position.set(3.5, 3.2, 5.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1;
controls.maxDistance = 20;
controls.target.set(0, 0.9, 0);
controls.minPolarAngle = Math.PI * 0.05;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minAzimuthAngle = -Infinity;
controls.maxAzimuthAngle =  Infinity;

scene.add(new THREE.HemisphereLight(0xdce8ff, 0x1a2233, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(6,9,7); scene.add(key);
const rim = new THREE.DirectionalLight(0x7fa8ff, 1.1); rim.position.set(-7,-3,-6); scene.add(rim);

const g = new THREE.Group(); scene.add(g);

/* ---------- хелперы ---------- */
const V = (x,y,z)=> new THREE.Vector3(x,y,z);

function fatLine(a, b, color, r=0.028){
  const grp = new THREE.Group();
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  if (len < 1e-6) return grp;
  const mid = a.clone().add(b).multiplyScalar(0.5);

  const geo = new THREE.CylinderGeometry(r, r, len, 12, 1, false);
  const mat = new THREE.MeshStandardMaterial({
    color, roughness:0.35, metalness:0.1, emissive: color, emissiveIntensity: 0.15
  });
  const cyl = new THREE.Mesh(geo, mat);
  cyl.position.copy(mid);
  cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
  grp.add(cyl);

  [a, b].forEach(p=>{
    const sp = new THREE.Mesh(new THREE.SphereGeometry(r*1.05, 10, 8), mat);
    sp.position.copy(p);
    grp.add(sp);
  });
  return grp;
}
function rightAngle(O, p1, p2, size, color){
  const d1 = new THREE.Vector3().subVectors(p1, O).normalize();
  const d2 = new THREE.Vector3().subVectors(p2, O).normalize();
  const a = O.clone().add(d1.clone().multiplyScalar(size));
  const b = O.clone().add(d1.clone().multiplyScalar(size)).add(d2.clone().multiplyScalar(size));
  const c = O.clone().add(d2.clone().multiplyScalar(size));
  const geo = new THREE.BufferGeometry().setFromPoints([a,b,c]);
  const mat = new THREE.LineBasicMaterial({color, linewidth:2.5});
  const line = new THREE.Line(geo, mat);
  const geoFill = new THREE.BufferGeometry().setFromPoints([O.clone(), a.clone(), b.clone(), c.clone()]);
  geoFill.setIndex([0,1,2, 0,2,3]);
  const matFill = new THREE.MeshBasicMaterial({
    color, transparent:true, opacity:0.35, side:THREE.DoubleSide, depthWrite:false
  });
  const fill = new THREE.Mesh(geoFill, matFill);
  const wrap = new THREE.Group();
  wrap.add(line); wrap.add(fill);
  return wrap;
}
function point(p, color=0xff6b6b, r=0.06){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12),
                           new THREE.MeshBasicMaterial({color}));
  m.position.copy(p);
  return m;
}
function label(p, text, color='#e6edf7'){
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  c.width = 256; c.height = 64;
  ctx.fillStyle = 'rgba(0,0,0,0)';
  ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle = color;
  ctx.font = 'bold 40px ui-sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 128, 32);
  const tex = new THREE.CanvasTexture(c);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false}));
  spr.scale.set(0.55, 0.14, 1);
  spr.position.copy(p);
  return spr;
}
function clearGroup(grp){
  while (grp.children.length){
    const c = grp.children.pop();
    if (c.geometry) c.geometry.dispose();
    if (c.material){
      if (Array.isArray(c.material)) c.material.forEach(m=>m.dispose());
      else c.material.dispose();
    }
    if (c.children && c.children.length) clearGroup(c);
  }
}
function convexPatch(points, color, opacity=0.24){
  const c = new THREE.Vector3();
  points.forEach(p=> c.add(p));
  c.divideScalar(points.length);
  const n = new THREE.Vector3().subVectors(points[1], points[0])
    .cross(new THREE.Vector3().subVectors(points[2], points[0])).normalize();
  const e1 = new THREE.Vector3().subVectors(points[0], c).normalize();
  const e2 = new THREE.Vector3().crossVectors(n, e1).normalize();
  const sorted = points.slice().sort((A,B)=>{
    const aA = Math.atan2(new THREE.Vector3().subVectors(A,c).dot(e2),
                          new THREE.Vector3().subVectors(A,c).dot(e1));
    const aB = Math.atan2(new THREE.Vector3().subVectors(B,c).dot(e2),
                          new THREE.Vector3().subVectors(B,c).dot(e1));
    return aA - aB;
  });
  const verts = [c];
  sorted.forEach(p=> verts.push(p));
  const idx = [];
  for (let i=1; i<verts.length; i++){
    const j = (i===verts.length-1) ? 1 : i+1;
    idx.push(0, i, j);
  }
  const geo = new THREE.BufferGeometry().setFromPoints(verts);
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const mat = new THREE.MeshBasicMaterial({
    color, transparent:true, opacity, side:THREE.DoubleSide, depthWrite:false
  });
  const mesh = new THREE.Mesh(geo, mat);
  const loop = new THREE.LineLoop(
    new THREE.BufferGeometry().setFromPoints(sorted),
    new THREE.LineBasicMaterial({color, linewidth:1.2, transparent:true, opacity:0.7})
  );
  const wrap = new THREE.Group();
  wrap.add(mesh); wrap.add(loop);
  return wrap;
}

/* ================================================================
   1. ТЕТРАЭДР. Y-up.
   Основание ABC в плоскости y=0, вершина D сверху.
   Ребро AB — переднее, общее для плоскостей ABC и ABD.
================================================================ */
function sceneTetra(){
  const R = 1.4;
  const H = R * Math.sqrt(2);   // правильная высота тетраэдра
  const A = V(-R*Math.sqrt(3)/2, 0,  R/2);   // передняя левая
  const B = V( R*Math.sqrt(3)/2, 0,  R/2);   // передняя правая
  const C = V(0, 0, -R);                     // задняя
  const D = V(0, H, 0);                      // вершина

  [[A,B],[B,C],[C,A],[A,D],[B,D],[C,D]].forEach(([p,q])=>
    g.add(fatLine(p, q, 0x2b4770, 0.012))
  );

  // общее ребро AB
  g.add(fatLine(A, B, 0xffd93d, 0.035));

  // середина AB — точка M
  const M = A.clone().add(B).multiplyScalar(0.5);

  // перпендикуляры к AB в двух плоскостях: MC и MD
  g.add(fatLine(M, C, 0x4ecdc4, 0.030));
  g.add(fatLine(M, D, 0x4ecdc4, 0.030));

  // полупрозрачные плоскости двугранного угла
  g.add(convexPatch([A, B, C], 0x3ddc97, 0.20));
  g.add(convexPatch([A, B, D], 0xffa94d, 0.22));

  // два прямых угла в точке M
  g.add(rightAngle(M, A, C, 0.16, 0xff6b6b));
  g.add(rightAngle(M, A, D, 0.16, 0xff6b6b));

  g.add(point(M, 0xff6b6b, 0.07));
  g.add(label(M.clone().add(V(-0.05,-0.15,-0.1)), 'M', '#ff6b6b'));

  g.add(label(A.clone().add(V(-0.15, 0.15, 0)), 'A'));
  g.add(label(B.clone().add(V( 0.15, 0.15, 0)), 'B'));
  g.add(label(C.clone().add(V(-0.15, 0.15, 0)), 'C'));
  g.add(label(D.clone().add(V( 0.15, 0.15, 0)), 'D'));
}

/* ================================================================
   2. КУБ. Y-up.
   Нижняя грань ABCD в y=-s, верхняя A₁B₁C₁D₁ в y=+s.
   Ребро AB — переднее нижнее.
================================================================ */
function sceneCube(){
  const s = 1.0;
  // нижняя грань
  const A0 = V(-s, -s,  s);
  const B0 = V( s, -s,  s);
  const C0 = V( s, -s, -s);
  const D0 = V(-s, -s, -s);
  // верхняя грань
  const A1 = V(-s,  s,  s);
  const B1 = V( s,  s,  s);
  const C1 = V( s,  s, -s);
  const D1 = V(-s,  s, -s);

  const edges = [
    [A0,B0],[B0,C0],[C0,D0],[D0,A0],
    [A1,B1],[B1,C1],[C1,D1],[D1,A1],
    [A0,A1],[B0,B1],[C0,C1],[D0,D1]
  ];
  edges.forEach(([p,q])=> g.add(fatLine(p, q, 0x2b4770, 0.012)));

  // общее ребро AB — переднее нижнее
  g.add(fatLine(A0, B0, 0xffd93d, 0.035));

  // перпендикуляры к AB в точке B
  g.add(fatLine(B0, C0, 0x4ecdc4, 0.030));
  g.add(fatLine(B0, B1, 0x4ecdc4, 0.030));

  // полупрозрачные плоскости
  g.add(convexPatch([A0, B0, C0, D0], 0x3ddc97, 0.20));  // нижняя грань
  g.add(convexPatch([A0, B0, B1, A1], 0xffa94d, 0.24));  // передняя грань

  // два прямых угла в точке B
  g.add(rightAngle(B0, A0, C0, 0.20, 0xff6b6b));
  g.add(rightAngle(B0, A0, B1, 0.20, 0xff6b6b));

  g.add(point(B0, 0xff6b6b, 0.07));
  g.add(label(B0.clone().add(V(0.15, -0.05, 0.1)), 'B', '#ff6b6b'));

  g.add(label(A0.clone().add(V(-0.15, -0.15, 0.1)), 'A'));
  g.add(label(B0.clone().add(V( 0.15, -0.15, 0.1)), 'B'));
  g.add(label(C0.clone().add(V( 0.15, -0.15, -0.1)), 'C'));
  g.add(label(D0.clone().add(V(-0.15, -0.15, -0.1)), 'D'));
  g.add(label(A1.clone().add(V(-0.15,  0.15, 0.1)), 'A₁'));
  g.add(label(B1.clone().add(V( 0.15,  0.15, 0.1)), 'B₁'));
  g.add(label(C1.clone().add(V( 0.15,  0.15, -0.1)), 'C₁'));
  g.add(label(D1.clone().add(V(-0.15,  0.15, -0.1)), 'D₁'));
}

/* ================================================================
   3. ПИРАМИДА. Y-up.
   Основание ABCD в y=0, вершина S сверху.
   Ребро AB — переднее нижнее.
================================================================ */
function scenePyr(){
  const s = 1.1, h = 1.9;
  const A = V(-s, 0,  s);   // передняя левая
  const B = V( s, 0,  s);   // передняя правая
  const C = V( s, 0, -s);   // задняя правая
  const D = V(-s, 0, -s);   // задняя левая
  const S = V(0, h, 0);      // вершина
  const O = V(0, 0, 0);      // центр основания

  [[A,B],[B,C],[C,D],[D,A]].forEach(([p,q])=> g.add(fatLine(p, q, 0x2b4770, 0.012)));
  [[S,A],[S,B],[S,C],[S,D]].forEach(([p,q])=> g.add(fatLine(p, q, 0x2b4770, 0.012)));

  // общее ребро AB
  g.add(fatLine(A, B, 0xffd93d, 0.035));

  // середина AB — точка M
  const M = A.clone().add(B).multiplyScalar(0.5);
  // перпендикуляры к AB: MO в основании, MS в грани ABS
  g.add(fatLine(M, O, 0x4ecdc4, 0.030));
  g.add(fatLine(M, S, 0x4ecdc4, 0.030));

  // полупрозрачные плоскости
  g.add(convexPatch([A, B, C, D], 0x3ddc97, 0.20));
  g.add(convexPatch([A, B, S], 0xffa94d, 0.24));

  // два прямых угла в точке M
  g.add(rightAngle(M, A, O, 0.16, 0xff6b6b));
  g.add(rightAngle(M, A, S, 0.16, 0xff6b6b));

  g.add(point(M, 0xff6b6b, 0.07));
  g.add(label(M.clone().add(V(0.1, -0.15, 0.1)), 'M', '#ff6b6b'));

  g.add(label(S.clone().add(V(0, 0.15, 0)), 'S'));
  g.add(label(A.clone().add(V(-0.15, 0.1, 0)), 'A'));
  g.add(label(B.clone().add(V( 0.15, 0.1, 0)), 'B'));
  g.add(label(C.clone().add(V( 0.15, 0.1, -0.05)), 'C'));
  g.add(label(D.clone().add(V(-0.15, 0.1, -0.05)), 'D'));
}

/* ================================================================
   Стартовые ракурсы «как в учебнике».
================================================================ */
function buildScene(name){
  clearGroup(g);
  if (name === 'tetra')      sceneTetra();
  else if (name === 'cube')  sceneCube();
  else                       scenePyr();

  // Камера сверху-сбоку-впереди, цель — чуть выше центра основания.
  if (name === 'cube'){
    camera.position.set(4.5, 3.8, 5.5);
    controls.target.set(0, 0, 0);
  } else if (name === 'pyr'){
    camera.position.set(3.5, 3.0, 5.5);
    controls.target.set(0, 1.0, 0);
  } else {
    camera.position.set(3.5, 3.0, 5.5);
    controls.target.set(0, 0.9, 0);
  }
  controls.update();
}

document.querySelectorAll('.menu button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    buildScene(btn.dataset.scene);
  });
});

function loop(){
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
}
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

buildScene('tetra');
loop();
</script>
</body>
</html>
