<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Три плоскости + пирамида + призма — 3D</title>
<style>
  :root{
    --bg:#0f1520; --line:#2a3a52;
    --txt:#e6edf7; --muted:#8fa3bf; --accent:#4ecdc4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;}
  body{
    background:radial-gradient(1200px 800px at 75% 15%, #1c2740 0%, #0b1018 60%, #070a10 100%);
    color:var(--txt);font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  }
  #app{position:fixed;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;}
  .pane{
    position:relative;min-width:0;min-height:0;
    border-right:1px solid rgba(255,255,255,.08);
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .pane:nth-child(2n){ border-right:none; }
  .pane:nth-child(n+3){ border-bottom:none; }
  .pane canvas{display:block;}

  .pane .title{
    position:absolute;top:12px;left:50%;transform:translateX(-50%);
    z-index:5;
    background:rgba(18,24,34,.85);backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.12);
    border-radius:12px;padding:7px 14px;
    font-size:12.5px;font-weight:600;color:#cfd9e8;
    box-shadow:0 8px 22px rgba(0,0,0,.45);
    text-align:center;white-space:nowrap;
  }
  .pane .title b{color:#4ecdc4;}

  .hint{
    position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
    font-size:10.5px;color:#5f6d82;letter-spacing:.3px;pointer-events:none;
    background:rgba(15,21,32,.6);padding:4px 10px;border-radius:8px;
    z-index:5;
  }
</style>
</head>
<body>
<div id="app">

  <div class="pane" id="pane1">
    <div class="title"><b>1.</b> Три плоскости — точка</div>
    <div class="hint">левая кнопка — вращать · колесо — зум</div>
  </div>

  <div class="pane" id="pane2">
    <div class="title"><b>2.</b> Три плоскости — параллельные прямые</div>
    <div class="hint">левая кнопка — вращать · колесо — зум</div>
  </div>

  <div class="pane" id="pane3">
    <div class="title"><b>3.</b> Пирамида — продолжение до вершины</div>
    <div class="hint">левая кнопка — вращать · колесо — зум</div>
  </div>

  <div class="pane" id="pane4">
    <div class="title"><b>4.</b> Призма — без оснований</div>
    <div class="hint">левая кнопка — вращать · колесо — зум</div>
  </div>

</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   Общие хелперы
============================================================ */
const V = (x,y,z)=> new THREE.Vector3(x,y,z);

function fatLine(a, b, color, r=0.028){
  const grp = new THREE.Group();
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  if (len < 1e-6) return grp;
  const mid = a.clone().add(b).multiplyScalar(0.5);
  const geo = new THREE.CylinderGeometry(r, r, len, 12, 1, false);
  const mat = new THREE.MeshStandardMaterial({
    color, roughness:0.35, metalness:0.1, emissive: color, emissiveIntensity: 0.15
  });
  const cyl = new THREE.Mesh(geo, mat);
  cyl.position.copy(mid);
  cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
  grp.add(cyl);
  [a, b].forEach(p=>{
    const sp = new THREE.Mesh(new THREE.SphereGeometry(r*1.05, 10, 8), mat);
    sp.position.copy(p);
    grp.add(sp);
  });
  return grp;
}

function dashedFatLine(a, b, color, r=0.016, dash=0.09, gap=0.07){
  const grp = new THREE.Group();
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  if (len < 1e-6) return grp;
  const n = dir.clone().normalize();
  const total = dash + gap;
  const count = Math.max(1, Math.floor(len / total));
  const mat = new THREE.MeshStandardMaterial({
    color, roughness:0.4, metalness:0.1, emissive: color, emissiveIntensity: 0.15
  });
  let t = 0;
  for (let i=0;i<count;i++){
    const s0 = a.clone().add(n.clone().multiplyScalar(t));
    const s1 = a.clone().add(n.clone().multiplyScalar(Math.min(t+dash, len)));
    const segLen = s0.distanceTo(s1);
    const mid = s0.clone().add(s1).multiplyScalar(0.5);
    const geo = new THREE.CylinderGeometry(r, r, segLen, 8);
    const cyl = new THREE.Mesh(geo, mat);
    cyl.position.copy(mid);
    cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), n);
    grp.add(cyl);
    t += total;
  }
  return grp;
}

function point(p, color=0xff6b6b, r=0.07){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12),
                           new THREE.MeshBasicMaterial({color}));
  m.position.copy(p);
  return m;
}

function label(p, text, color='#e6edf7'){
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  c.width = 256; c.height = 64;
  ctx.fillStyle = 'rgba(0,0,0,0)';
  ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle = color;
  ctx.font = 'bold 40px ui-sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 128, 32);
  const tex = new THREE.CanvasTexture(c);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false}));
  spr.scale.set(0.55, 0.14, 1);
  spr.position.copy(p);
  return spr;
}

function quadPatch(p1, p2, p3, p4, color, opacity=0.18){
  const verts = [p1, p2, p3, p4];
  const geo = new THREE.BufferGeometry().setFromPoints(verts);
  geo.setIndex([0,1,2, 0,2,3]);
  geo.computeVertexNormals();
  const mat = new THREE.MeshBasicMaterial({
    color, transparent:true, opacity, side:THREE.DoubleSide, depthWrite:false
  });
  const mesh = new THREE.Mesh(geo, mat);
  const loop = new THREE.LineLoop(
    new THREE.BufferGeometry().setFromPoints(verts),
    new THREE.LineBasicMaterial({color, linewidth:1.2, transparent:true, opacity:0.7})
  );
  const wrap = new THREE.Group();
  wrap.add(mesh); wrap.add(loop);
  return wrap;
}

function clearGroup(grp){
  while (grp.children.length){
    const c = grp.children.pop();
    if (c.geometry) c.geometry.dispose();
    if (c.material){
      if (Array.isArray(c.material)) c.material.forEach(m=>m.dispose());
      else c.material.dispose();
    }
    if (c.children && c.children.length) clearGroup(c);
  }
}

/* ============================================================
   1. Три плоскости — точка
============================================================ */
function buildTopPoint(g){
  const R = 1.9;

  // α: y = 0
  g.add(quadPatch(V(-R,0,-R), V(R,0,-R), V(R,0,R), V(-R,0,R), 0x4ecdc4, 0.16));
  // β: x = 0
  g.add(quadPatch(V(0,-R,-R), V(0,R,-R), V(0,R,R), V(0,-R,R), 0xffa94d, 0.14));
  // γ: z = 0
  g.add(quadPatch(V(-R,-R,0), V(R,-R,0), V(R,R,0), V(-R,R,0), 0x6ba8ff, 0.14));

  // три прямые пересечения
  g.add(fatLine(V(-R,0,0), V(R,0,0), 0xffd93d, 0.030));
  g.add(fatLine(V(0,-R,0), V(0,R,0), 0x3ddc97, 0.030));
  g.add(fatLine(V(0,0,-R), V(0,0,R), 0xff6b6b, 0.030));

  g.add(point(V(0,0,0), 0xffffff, 0.10));
  g.add(label(V(0.18,0.18,0), 'O', '#ffffff'));

  g.add(label(V(R*0.85, 0.2, R*0.85), 'α', '#4ecdc4'));
  g.add(label(V(0.2, R*0.85, R*0.85), 'β', '#ffa94d'));
  g.add(label(V(R*0.85, R*0.85, 0.2), 'γ', '#6ba8ff'));
}

/* ============================================================
   2. Три плоскости — параллельные прямые
============================================================ */
function buildTopParallel(g){
  const R = 1.9, Z = 1.9;

  // P1: x + y = 1
  {
    const c = V(0.5, 0.5, 0);
    const e1 = V(1, -1, 0).normalize().multiplyScalar(R);
    const e2 = V(0, 0, 1).multiplyScalar(Z);
    g.add(quadPatch(
      c.clone().add(e1).add(e2),
      c.clone().add(e1.clone().multiplyScalar(-1)).add(e2),
      c.clone().add(e1.clone().multiplyScalar(-1)).add(e2.clone().multiplyScalar(-1)),
      c.clone().add(e1).add(e2.clone().multiplyScalar(-1)),
      0x3ddc97, 0.16));
  }
  // P2: x - y = 1
  {
    const c = V(0.5, -0.5, 0);
    const e1 = V(1, 1, 0).normalize().multiplyScalar(R);
    const e2 = V(0, 0, 1).multiplyScalar(Z);
    g.add(quadPatch(
      c.clone().add(e1).add(e2),
      c.clone().add(e1.clone().multiplyScalar(-1)).add(e2),
      c.clone().add(e1.clone().multiplyScalar(-1)).add(e2.clone().multiplyScalar(-1)),
      c.clone().add(e1).add(e2.clone().multiplyScalar(-1)),
      0xffa94d, 0.16));
  }
  // P3: x = 0
  {
    const c = V(0, 0, 0);
    const e1 = V(0, 1, 0).multiplyScalar(R);
    const e2 = V(0, 0, 1).multiplyScalar(Z);
    g.add(quadPatch(
      c.clone().add(e1).add(e2),
      c.clone().add(e1.clone().multiplyScalar(-1)).add(e2),
      c.clone().add(e1.clone().multiplyScalar(-1)).add(e2.clone().multiplyScalar(-1)),
      c.clone().add(e1).add(e2.clone().multiplyScalar(-1)),
      0x6ba8ff, 0.16));
  }

  // три линии пересечения — параллельные
  g.add(fatLine(V(1,0,-Z), V(1,0,Z), 0x3ddc97, 0.032));
  g.add(fatLine(V(0,1,-Z), V(0,1,Z), 0xffd93d, 0.032));
  g.add(fatLine(V(0,-1,-Z), V(0,-1,Z), 0xff6b6b, 0.032));

  g.add(label(V(1, 0, Z+0.2), 'a', '#3ddc97'));
  g.add(label(V(0, 1, Z+0.2), 'b', '#ffd93d'));
  g.add(label(V(0, -1, Z+0.2), 'c', '#ff6b6b'));

  g.add(label(V(1.3, 1.3, 0), 'P₁', '#3ddc97'));
  g.add(label(V(1.3, -1.3, 0), 'P₂', '#ffa94d'));
  g.add(label(V(0, 0, -1.8), 'P₃', '#6ba8ff'));
}

/* ============================================================
   3. Пирамида
============================================================ */
function buildPyramid(g){
  const A1 = V(-1.6, 0,  0.9);
  const B1 = V( 1.6, 0,  0.9);
  const C1 = V( 0.0, 0, -1.6);
  const A2 = V(-1.0, 1.4,  0.55);
  const B2 = V( 1.0, 1.4,  0.55);
  const C2 = V( 0.0, 1.4, -1.0);
  const S  = V(0, 3.2, 0);

  g.add(quadPatch(A1, B1, B2, A2, 0x3ddc97, 0.20));
  g.add(quadPatch(B1, C1, C2, B2, 0xffa94d, 0.20));
  g.add(quadPatch(C1, A1, A2, C2, 0x6ba8ff, 0.20));

  g.add(fatLine(A1, B1, 0x3ddc97, 0.022));
  g.add(fatLine(B1, C1, 0xffa94d, 0.022));
  g.add(fatLine(C1, A1, 0x6ba8ff, 0.022));
  g.add(fatLine(A2, B2, 0x3ddc97, 0.022));
  g.add(fatLine(B2, C2, 0xffa94d, 0.022));
  g.add(fatLine(C2, A2, 0x6ba8ff, 0.022));

  g.add(fatLine(A1, A2, 0x3ddc97, 0.022));
  g.add(fatLine(B1, B2, 0xffa94d, 0.022));
  g.add(fatLine(C1, C2, 0x6ba8ff, 0.022));

  g.add(dashedFatLine(A2, S, 0x3ddc97, 0.018));
  g.add(dashedFatLine(B2, S, 0xffa94d, 0.018));
  g.add(dashedFatLine(C2, S, 0x6ba8ff, 0.018));

  g.add(point(S, 0xffffff, 0.09));
  g.add(label(S.clone().add(V(0, 0.2, 0)), 'S', '#ffffff'));

  g.add(label(V(0, 0.7, 0.75), 'P₁', '#3ddc97'));
  g.add(label(V(1.1, 0.7, -0.7), 'P₂', '#ffa94d'));
  g.add(label(V(-1.1, 0.7, -0.7), 'P₃', '#6ba8ff'));
}

/* ============================================================
   4. Призма
============================================================ */
function buildPrism(g){
  const yTop = 2.2, yBot = -0.6;
  const r = 1.4;
  const A_bot = V(-r*Math.sqrt(3)/2, yBot,  r/2);
  const B_bot = V( r*Math.sqrt(3)/2, yBot,  r/2);
  const C_bot = V(0, yBot, -r);
  const A_top = V(-r*Math.sqrt(3)/2, yTop,  r/2);
  const B_top = V( r*Math.sqrt(3)/2, yTop,  r/2);
  const C_top = V(0, yTop, -r);

  g.add(quadPatch(A_bot, B_bot, B_top, A_top, 0x3ddc97, 0.20));
  g.add(quadPatch(B_bot, C_bot, C_top, B_top, 0xffa94d, 0.20));
  g.add(quadPatch(C_bot, A_bot, A_top, C_top, 0x6ba8ff, 0.20));

  g.add(fatLine(A_bot, A_top, 0x3ddc97, 0.030));
  g.add(fatLine(B_bot, B_top, 0xffa94d, 0.030));
  g.add(fatLine(C_bot, C_top, 0x6ba8ff, 0.030));

  g.add(dashedFatLine(A_top, V(A_top.x, yTop + 1.0, A_top.z), 0x3ddc97, 0.016));
  g.add(dashedFatLine(A_bot, V(A_bot.x, yBot - 1.0, A_bot.z), 0x3ddc97, 0.016));
  g.add(dashedFatLine(B_top, V(B_top.x, yTop + 1.0, B_top.z), 0xffa94d, 0.016));
  g.add(dashedFatLine(B_bot, V(B_bot.x, yBot - 1.0, B_bot.z), 0xffa94d, 0.016));
  g.add(dashedFatLine(C_top, V(C_top.x, yTop + 1.0, C_top.z), 0x6ba8ff, 0.016));
  g.add(dashedFatLine(C_bot, V(C_bot.x, yBot - 1.0, C_bot.z), 0x6ba8ff, 0.016));

  g.add(label(V(0, 0.8, 1.05), 'P₁', '#3ddc97'));
  g.add(label(V(1.2, 0.8, -0.8), 'P₂', '#ffa94d'));
  g.add(label(V(-1.2, 0.8, -0.8), 'P₃', '#6ba8ff'));

  g.add(label(V(A_top.x, yTop + 0.3, A_top.z), 'a', '#3ddc97'));
  g.add(label(V(B_top.x, yTop + 0.3, B_top.z), 'b', '#ffa94d'));
  g.add(label(V(C_top.x, yTop + 0.3, C_top.z), 'c', '#6ba8ff'));
}

/* ============================================================
   Инициализация 4 панелей
============================================================ */
function makePane(paneEl, builderFn, camPos=[4.6,3.2,5.6], target=[0,0.3,0]){
  const w = paneEl.clientWidth, h = paneEl.clientHeight;

  const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(w, h);
  paneEl.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0b1018, 0.02);

  const camera = new THREE.PerspectiveCamera(42, w/h, 0.1, 200);
  camera.position.set(...camPos);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 1;
  controls.maxDistance = 30;
  controls.target.set(...target);
  controls.minPolarAngle = Math.PI * 0.05;
  controls.maxPolarAngle = Math.PI * 0.49;

  scene.add(new THREE.HemisphereLight(0xdce8ff, 0x1a2233, 1.6));
  const key = new THREE.DirectionalLight(0xffffff, 2.0); key.position.set(6,9,7); scene.add(key);
  const rim = new THREE.DirectionalLight(0x7fa8ff, 1.0); rim.position.set(-7,-3,-6); scene.add(rim);

  const g = new THREE.Group(); scene.add(g);
  builderFn(g);

  return { renderer, scene, camera, controls, paneEl };
}

const panes = [
  makePane(document.getElementById('pane1'), buildTopPoint, [4.6,3.2,5.6], [0,0.0,0]),
  makePane(document.getElementById('pane2'), buildTopParallel, [4.6,3.2,5.6], [0,0.0,0]),
  makePane(document.getElementById('pane3'), buildPyramid, [4.6,3.2,5.6], [0,0.6,0]),
  makePane(document.getElementById('pane4'), buildPrism, [4.6,3.2,5.6], [0,0.6,0]),
];

/* ============================================================
   Общий цикл рендера
============================================================ */
function loop(){
  requestAnimationFrame(loop);
  panes.forEach(p=>{
    p.controls.update();
    p.renderer.render(p.scene, p.camera);
  });
}

addEventListener('resize', ()=>{
  panes.forEach(p=>{
    const w = p.paneEl.clientWidth, h = p.paneEl.clientHeight;
    p.camera.aspect = w/h;
    p.camera.updateProjectionMatrix();
    p.renderer.setSize(w, h);
  });
});

loop();
</script>
</body>
</html>
