<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Стереометрия — интерактивный справочник</title>
<style>
  :root{ --txt:#e6edf7; --muted:#8fa3bf; --acc:#4ecdc4; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;}
  body{
    background:radial-gradient(1200px 800px at 75% 15%, #1c2740 0%, #0b1018 60%, #070a10 100%);
    color:var(--txt);font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  }
  #app{position:fixed;inset:0;display:flex;}

  .menu{
    width:400px;height:100%;
    background:rgba(12,17,26,.94);
    border-right:1px solid rgba(255,255,255,.08);
    padding:14px 12px;overflow-y:auto;
    backdrop-filter:blur(10px);
  }
  .menu::-webkit-scrollbar{width:6px;}
  .menu::-webkit-scrollbar-thumb{background:#2a3a52;border-radius:3px;}

  details{
    margin-bottom:6px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:12px;
    background:rgba(15,21,32,.55);
    overflow:hidden;
  }
  details[open]{ background:rgba(15,21,32,.8); border-color:rgba(78,205,196,.25); }
  details.draft{ opacity:.78; }
  details.draft[open]{ border-color:rgba(255,169,77,.25); }
  details.draft > summary{ color:#a8895a; }
  details.draft[open] > summary{ color:#ffa94d; border-bottom-color:rgba(255,169,77,.15); }

  summary{
    list-style:none;cursor:pointer;
    padding:11px 14px;
    font-size:13px;font-weight:700;
    color:#cfd9e8;letter-spacing:.2px;
    display:flex;justify-content:space-between;align-items:center;
    user-select:none;transition:.15s;
  }
  summary::-webkit-details-marker{display:none;}
  summary::after{ content:'▾';color:var(--muted); transition:.2s;font-size:12px; }
  details[open] summary::after{transform:rotate(180deg);color:var(--acc);}
  details.draft[open] summary::after{color:#ffa94d;}
  summary:hover{color:#fff;background:rgba(78,205,196,.06);}
  details[open] summary{ color:var(--acc); border-bottom:1px solid rgba(255,255,255,.06); }
  .sec-num{
    display:inline-block;min-width:30px;
    color:var(--acc);font-weight:800;
    margin-right:8px;
  }
  details.draft .sec-num{ color:#ffa94d; }

  .menu button{
    width:calc(100% - 20px);
    margin:6px 10px;padding:9px 12px;
    background:rgba(18,24,34,.85);
    border:1px solid rgba(255,255,255,.10);
    color:#cfd9e8;font:inherit;font-size:12.5px;font-weight:600;
    border-radius:9px;text-align:left;cursor:pointer;
    transition:.15s;line-height:1.35;
  }
  .menu button:hover{color:#fff;border-color:rgba(78,205,196,.5);}
  .menu button.active{
    background:rgba(78,205,196,.18);color:#fff;
    border-color:rgba(78,205,196,.65);
    box-shadow:0 0 0 1px rgba(78,205,196,.4);
  }
  details > button:last-child{margin-bottom:10px;}

  .view{position:relative;flex:1;min-width:0;}
  .view canvas{display:block;}

  .single{position:absolute;inset:0;}
  .triple{
    position:absolute;inset:0;display:grid;
    grid-template-columns:1fr;grid-template-rows:1fr 1fr 1fr;
  }
  .quad{
    position:absolute;inset:0;display:grid;
    grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
  }
  .triple .mini, .quad .mini{
    position:relative;min-height:0;
    border-bottom:1px solid rgba(255,255,255,.08);
    border-right:1px solid rgba(255,255,255,.08);
  }
  .triple .mini:last-child{border-bottom:none;}
  .quad .mini:nth-child(2n){border-right:none;}
  .quad .mini:nth-child(n+3){border-bottom:none;}
  .mini canvas{display:block;}

  .mini-label{
    position:absolute;top:8px;left:12px;right:12px;
    font-size:12px;color:#cfd9e8;letter-spacing:.3px;
    background:rgba(15,21,32,.78);padding:7px 12px;border-radius:8px;
    pointer-events:none;z-index:5;line-height:1.4;
    border:1px solid rgba(78,205,196,.18);
  }
  .mini-label b{color:var(--acc);font-weight:700;}

  .caption{
    position:absolute;top:18px;left:50%;transform:translateX(-50%);
    max-width:min(1344px, 96%);
    background:rgba(18,24,34,.92);backdrop-filter:blur(10px);
    border:1px solid rgba(78,205,196,.28);
    border-radius:14px;padding:14px 24px;
    font-size:16px;line-height:1.55;color:#f3f8ff;
    font-weight:500;letter-spacing:.15px;
    box-shadow:0 10px 26px rgba(0,0,0,.55);
    text-align:center;z-index:10;
  }
  .caption b{color:var(--acc);font-weight:700;}

  .hint{
    position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
    font-size:11.5px;color:#5f6d82;letter-spacing:.3px;pointer-events:none;
    background:rgba(15,21,32,.6);padding:6px 12px;border-radius:8px;
    z-index:10;
  }
</style>
</head>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const viewEl   = document.getElementById('view');
const singleEl = document.getElementById('single');
const tripleEl = document.getElementById('triple');
const quadEl   = document.getElementById('quad');
const captionEl= document.getElementById('caption');

/* =============== ГЛАВНЫЙ RENDERER =============== */
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(singleEl.clientWidth, singleEl.clientHeight);
singleEl.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, singleEl.clientWidth/singleEl.clientHeight, 0.1, 200);
camera.position.set(3.8, 3.2, 4.8);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1;
controls.maxDistance = 30;
controls.target.set(0, 0.3, 0);
controls.minPolarAngle = Math.PI * 0.05;
controls.maxPolarAngle = Math.PI * 0.49;

scene.add(new THREE.HemisphereLight(0xdce8ff, 0x1a2233, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 2.0); key.position.set(6,9,7); scene.add(key);
const rim = new THREE.DirectionalLight(0x7fa8ff, 1.0); rim.position.set(-7,-3,-6); scene.add(rim);

const g = new THREE.Group(); scene.add(g);

/* =============== ОБЩИЕ ХЕЛПЕРЫ =============== */
const V = (x,y,z)=> new THREE.Vector3(x,y,z);

function fatLine(a, b, color, r=0.024){
  const grp = new THREE.Group();
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  if (len < 1e-6) return grp;
  const mid = a.clone().add(b).multiplyScalar(0.5);
  const geo = new THREE.CylinderGeometry(r, r, len, 12, 1, false);
  const mat = new THREE.MeshStandardMaterial({
    color, roughness:0.35, metalness:0.1, emissive: color, emissiveIntensity: 0.15
  });
  const cyl = new THREE.Mesh(geo, mat);
  cyl.position.copy(mid);
  cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
  grp.add(cyl);
  [a, b].forEach(p=>{
    const sp = new THREE.Mesh(new THREE.SphereGeometry(r*1.05, 10, 8), mat);
    sp.position.copy(p);
    grp.add(sp);
  });
  return grp;
}

function dashedThickLine(a, b, color, r=0.018, dash=0.13, gap=0.09){
  const grp = new THREE.Group();
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  if (len < 1e-6) return grp;
  const n = dir.clone().normalize();
  const total = dash + gap;
  let t = 0;
  while (t < len){
    const s0 = a.clone().add(n.clone().multiplyScalar(t));
    const s1 = a.clone().add(n.clone().multiplyScalar(Math.min(t+dash, len)));
    grp.add(fatLine(s0, s1, color, r));
    t += total;
  }
  return grp;
}

function dashedLine(a, b, color, dash=0.09, gap=0.07){
  const mat = new THREE.LineDashedMaterial({color, dashSize:dash, gapSize:gap});
  const geo = new THREE.BufferGeometry().setFromPoints([a, b]);
  const line = new THREE.Line(geo, mat);
  line.computeLineDistances();
  const grp = new THREE.Group();
  grp.add(line);
  return grp;
}

function point(p, color=0xff6b6b, r=0.075){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12),
                           new THREE.MeshBasicMaterial({color}));
  m.position.copy(p);
  return m;
}

function label(p, text, color='#e6edf7', size=0.55){
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  c.width = 512; c.height = 128;
  ctx.fillStyle = 'rgba(0,0,0,0)';
  ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle = color;
  ctx.font = 'bold 72px ui-sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 256, 64);
  const tex = new THREE.CanvasTexture(c);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false}));
  spr.scale.set(size, size*0.25, 1);
  spr.position.copy(p);
  return spr;
}

function planePatch(p1, p2, p3, p4, color, opacity=0.16){
  const verts = [p1, p2, p3, p4];
  const geo = new THREE.BufferGeometry().setFromPoints(verts);
  geo.setIndex([0,1,2, 0,2,3]);
  geo.computeVertexNormals();
  const mat = new THREE.MeshBasicMaterial({
    color, transparent:true, opacity, side:THREE.DoubleSide, depthWrite:false
  });
  const mesh = new THREE.Mesh(geo, mat);
  const loop = new THREE.LineLoop(
    new THREE.BufferGeometry().setFromPoints(verts),
    new THREE.LineBasicMaterial({color, linewidth:1.2, transparent:true, opacity:0.7})
  );
  const wrap = new THREE.Group();
  wrap.add(mesh); wrap.add(loop);
  return wrap;
}
const quadPatch = planePatch;

/* Простой веерный полигон — работает для выпуклых и упорядоченных точек */
function polyPatch(points, color, opacity=0.16){
  if (points.length < 3) return new THREE.Group();
  const c = new THREE.Vector3();
  points.forEach(p=> c.add(p));
  c.divideScalar(points.length);
  const verts = [c, ...points];
  const idx = [];
  for (let i=1; i<verts.length; i++){
    const j = (i===verts.length-1) ? 1 : i+1;
    idx.push(0, i, j);
  }
  const geo = new THREE.BufferGeometry().setFromPoints(verts);
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const mat = new THREE.MeshBasicMaterial({
    color, transparent:true, opacity, side:THREE.DoubleSide, depthWrite:false
  });
  const mesh = new THREE.Mesh(geo, mat);
  const loop = new THREE.LineLoop(
    new THREE.BufferGeometry().setFromPoints(points),
    new THREE.LineBasicMaterial({color, transparent:true, opacity:0.55})
  );
  const wrap = new THREE.Group();
  wrap.add(mesh); wrap.add(loop);
  return wrap;
}

function planeBig(c, u, v, s, color, opacity=0.12){
  const p1 = c.clone().add(u.clone().multiplyScalar(s)).add(v.clone().multiplyScalar(s));
  const p2 = c.clone().add(u.clone().multiplyScalar(-s)).add(v.clone().multiplyScalar(s));
  const p3 = c.clone().add(u.clone().multiplyScalar(-s)).add(v.clone().multiplyScalar(-s));
  const p4 = c.clone().add(u.clone().multiplyScalar(s)).add(v.clone().multiplyScalar(-s));
  return planePatch(p1, p2, p3, p4, color, opacity);
}

function rightAngle(O, dir1, dir2, size, color){
  const d1 = dir1.clone().normalize();
  const d2 = dir2.clone().normalize();
  const a = O.clone().add(d1.clone().multiplyScalar(size));
  const b = O.clone().add(d1.clone().multiplyScalar(size)).add(d2.clone().multiplyScalar(size));
  const c = O.clone().add(d2.clone().multiplyScalar(size));
  const geo = new THREE.BufferGeometry().setFromPoints([a, b, c]);
  const mat = new THREE.LineBasicMaterial({color});
  const line = new THREE.Line(geo, mat);
  const grp = new THREE.Group();
  grp.add(line);
  return grp;
}
function rightAngleAt(O, P1, P2, size, color){
  const d1 = P1.clone().sub(O).normalize();
  const d2 = P2.clone().sub(O).normalize();
  return rightAngle(O, d1, d2, size, color);
}

function arcAngle(O, dir1, dir2, radius, color){
  const d1 = dir1.clone().normalize();
  const d2 = dir2.clone().normalize();
  const arcPts = [];
  const N = 24;
  let e2 = d2.clone().sub(d1.clone().multiplyScalar(d1.dot(d2)));
  if (e2.length() < 1e-6) e2 = new THREE.Vector3(0,1,0).cross(d1);
  e2.normalize();
  const angle = Math.acos(Math.max(-1, Math.min(1, d1.dot(d2))));
  for (let i=0; i<=N; i++){
    const t = i/N * angle;
    const p = O.clone()
      .add(d1.clone().multiplyScalar(Math.cos(t) * radius))
      .add(e2.clone().multiplyScalar(Math.sin(t) * radius));
    arcPts.push(p);
  }
  const geo = new THREE.BufferGeometry().setFromPoints(arcPts);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({color}));
  const grp = new THREE.Group();
  grp.add(line);
  return grp;
}

function ray(a, b, color, r=0.026){
  const grp = new THREE.Group();
  const dir = new THREE.Vector3().subVectors(b, a).normalize();
  const end = b.clone().add(dir.clone().multiplyScalar(-r*6));
  grp.add(fatLine(a, end, color, r));
  const cone = new THREE.Mesh(
    new THREE.ConeGeometry(r*2.5, r*7, 14),
    new THREE.MeshStandardMaterial({color, emissive:color, emissiveIntensity:0.25})
  );
  cone.position.copy(b.clone().add(dir.clone().multiplyScalar(-r*3.5)));
  cone.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
  grp.add(cone);
  return grp;
}

function convexPatch(points, color, opacity=0.22){
  const c = new THREE.Vector3();
  points.forEach(p=> c.add(p));
  c.divideScalar(points.length);
  const n = new THREE.Vector3().subVectors(points[1], points[0])
    .cross(new THREE.Vector3().subVectors(points[2], points[0])).normalize();
  const e1 = new THREE.Vector3().subVectors(points[0], c).normalize();
  const e2 = new THREE.Vector3().crossVectors(n, e1).normalize();
  const sorted = points.slice().sort((A,B)=>{
    const aA = Math.atan2(new THREE.Vector3().subVectors(A,c).dot(e2),
                          new THREE.Vector3().subVectors(A,c).dot(e1));
    const aB = Math.atan2(new THREE.Vector3().subVectors(B,c).dot(e2),
                          new THREE.Vector3().subVectors(B,c).dot(e1));
    return aA - aB;
  });
  const verts = [c];
  sorted.forEach(p=> verts.push(p));
  const idx = [];
  for (let i=1; i<verts.length; i++){
    const j = (i===verts.length-1) ? 1 : i+1;
    idx.push(0, i, j);
  }
  const geo = new THREE.BufferGeometry().setFromPoints(verts);
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const mat = new THREE.MeshBasicMaterial({
    color, transparent:true, opacity, side:THREE.DoubleSide, depthWrite:false
  });
  const mesh = new THREE.Mesh(geo, mat);
  const loop = new THREE.LineLoop(
    new THREE.BufferGeometry().setFromPoints(sorted),
    new THREE.LineBasicMaterial({color, linewidth:1.3, transparent:true, opacity:0.7})
  );
  const wrap = new THREE.Group();
  wrap.add(mesh); wrap.add(loop);
  return wrap;
}

function commonPerp(A, u, B, v){
  const uu = u.clone().normalize();
  const vv = v.clone().normalize();
  const w0 = new THREE.Vector3().subVectors(A, B);
  const a = uu.dot(uu), b = uu.dot(vv), c = vv.dot(vv);
  const d = uu.dot(w0), e = vv.dot(w0);
  const den = a*c - b*b;
  let t, s;
  if (Math.abs(den) < 1e-9){ t = 0; s = e/c; }
  else { t = (b*e - c*d)/den; s = (a*e - b*d)/den; }
  const P = A.clone().add(uu.clone().multiplyScalar(t));
  const Q = B.clone().add(vv.clone().multiplyScalar(s));
  return { P, Q, dist: P.distanceTo(Q), u: uu, v: vv };
}

function clearGroup(grp){
  while (grp.children.length){
    const c = grp.children.pop();
    if (c.geometry) c.geometry.dispose();
    if (c.material){
      if (Array.isArray(c.material)) c.material.forEach(m=>m.dispose());
      else c.material.dispose();
    }
    if (c.children && c.children.length) clearGroup(c);
  }
}

function distPyr(){
  const s = 1.1, h = 1.9;
  const A = V(-s, 0, s), B = V(s, 0, s), C = V(s, 0, -s), D = V(-s, 0, -s), S = V(0, h, 0);
  [[A,B],[B,C],[C,D],[D,A]].forEach(([p,q])=> g.add(fatLine(p, q, 0x2b4770, 0.012)));
  [[S,A],[S,B],[S,C],[S,D]].forEach(([p,q])=> g.add(fatLine(p, q, 0x2b4770, 0.012)));
  const u = new THREE.Vector3().subVectors(C, A);
  const v = new THREE.Vector3().subVectors(S, B);

function angTetra(){

  const C = V(0, 0, -R), D = V(0, H, 0);
  [[A,B],[B,C],[C,A],[A,D],[B,D],[C,D]].forEach(([p,q]) =>
    g.add(fatLine(p, q, 0x2b4770, 0.012)));

/* =============== УПРАВЛЕНИЕ =============== */
const miniScenes = [];

function createMiniScene(parentEl, buildFn, labelHtml, camPos=[2.6, 2.4, 3.4]){
  const labelEl = document.createElement('div');
  labelEl.className = 'mini-label';
  labelEl.innerHTML = labelHtml;
  parentEl.appendChild(labelEl);

  const r = new THREE.WebGLRenderer({antialias:true, alpha:true});
  r.setPixelRatio(Math.min(devicePixelRatio, 2));
  r.setSize(parentEl.clientWidth, parentEl.clientHeight);
  parentEl.appendChild(r.domElement);

  const s = new THREE.Scene();
  const c = new THREE.PerspectiveCamera(42, parentEl.clientWidth/parentEl.clientHeight, 0.1, 200);
  c.position.set(...camPos);
  c.lookAt(0, 0, 0);

  const ctr = new OrbitControls(c, r.domElement);
  ctr.enableDamping = true;
  ctr.dampingFactor = 0.08;
  ctr.minDistance = 0.5;
  ctr.maxDistance = 20;
  ctr.target.set(0, 0, 0);
  ctr.minPolarAngle = Math.PI * 0.05;
  ctr.maxPolarAngle = Math.PI * 0.49;
  ctr.update();

  s.add(new THREE.HemisphereLight(0xdce8ff, 0x1a2233, 1.6));
  const kk = new THREE.DirectionalLight(0xffffff, 2.0); kk.position.set(6,9,7); s.add(kk);
  const rr = new THREE.DirectionalLight(0x7fa8ff, 1.0); rr.position.set(-7,-3,-6); s.add(rr);

  const grp = new THREE.Group(); s.add(grp);
  buildFn(grp);

  const entry = { renderer:r, scene:s, camera:c, controls:ctr, el: parentEl };
  miniScenes.push(entry);
  return entry;
}

function destroyMiniScenes(){
  while (miniScenes.length){
    const m = miniScenes.pop();
    m.renderer.dispose();
    if (m.renderer.domElement.parentNode){
      m.renderer.domElement.parentNode.removeChild(m.renderer.domElement);
    }
  }
  tripleEl.innerHTML = '';
  quadEl.innerHTML = '';
}

let threeMode = false;
let quadMode = false;

function hideAllViews(){
  singleEl.style.display = 'none';
  tripleEl.style.display = 'none';
  quadEl.style.display   = 'none';
  destroyMiniScenes();
  threeMode = false;
  quadMode = false;
}

function showSingle(id){
  hideAllViews();
  singleEl.style.display = 'block';
  if (!renderer.domElement.parentNode){
    singleEl.appendChild(renderer.domElement);
  }
  renderer.setSize(singleEl.clientWidth, singleEl.clientHeight);

  clearGroup(g);
  const s = SCENES[id];
  if (!s) return;
  try { s.build(); } catch(e){ console.error('scene error:', id, e); }
  captionEl.innerHTML = s.cap;
  camera.position.set(...s.cam);
  controls.target.set(...s.tgt);
  camera.aspect = singleEl.clientWidth/singleEl.clientHeight;
  camera.updateProjectionMatrix();
  controls.update();
  renderer.render(scene, camera);
}

  requestAnimationFrame(() => {
    createMiniScene(m1, miniA_intersect, '<b>а)</b> пересекаются');
    createMiniScene(m2, miniB_parallel, '<b>б)</b> параллельны');
    createMiniScene(m3, miniC_skew,     '<b>в)</b> скрещиваются');
  });

  captionEl.innerHTML = 'Три случая взаимного расположения двух прямых: <b>а)</b> пересекаются; <b>б)</b> параллельны; <b>в)</b> скрещиваются.';
}

function showQuad(){
  hideAllViews();
  quadEl.style.display = 'grid';
  quadMode = true;

  // Скрываем верхнюю единую плашку — подписи у каждой панели
  captionEl.style.display = 'none';

  const m1 = document.createElement('div'); m1.className='mini'; quadEl.appendChild(m1);
  const m2 = document.createElement('div'); m2.className='mini'; quadEl.appendChild(m2);
  const m3 = document.createElement('div'); m3.className='mini'; quadEl.appendChild(m3);
  const m4 = document.createElement('div'); m4.className='mini'; quadEl.appendChild(m4);

  const CAM = [3.0, 2.6, 3.8];

  requestAnimationFrame(() => {
    createMiniScene(m1, buildTPPoint,
      '<b>1. Три плоскости — в одной точке.</b> Линии пересечения попарно пересекаются в O.',
      CAM);
    createMiniScene(m2, buildTPParallel,
      '<b>2. Три плоскости — по параллельным.</b> Линии пересечения попарно параллельны.',
      CAM);
    createMiniScene(m3, buildPyramidTP,
      '<b>3. Пирамида.</b> Продолжение боковых граней до общей вершины S.',
      CAM);
    createMiniScene(m4, buildPrismTP,
      '<b>4. Призма без оснований.</b> Три плоскости параллельны общей прямой.',
      CAM);
  });
}

/* При переключении режимов возвращаем плашку */
const _origShowSingle = showSingle;
showSingle = function(id){
  captionEl.style.display = '';
  _origShowSingle(id);
};
const _origShowThree = showThree;
showThree = function(){
  captionEl.style.display = '';
  _origShowThree();
};

document.querySelectorAll('#menu button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#menu button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const id = btn.dataset.id;
    if (id === 'cross3')      showThree();
    else if (id === 'tpQuad') showQuad();
    else                      showSingle(id);
  });
});

/* --- Аккордеон: при открытии одного раздела закрываем остальные --- */
document.querySelectorAll('.menu details').forEach(det=>{
  det.addEventListener('toggle', ()=>{
    if (det.open){
      document.querySelectorAll('.menu details').forEach(other=>{
        if (other !== det && other.open) other.open = false;
      });
    }
  });
});

addEventListener('resize', ()=>{
  if (threeMode || quadMode){
    miniScenes.forEach(m=>{
      const w = m.el.clientWidth, h = m.el.clientHeight;
      m.camera.aspect = w/h;
      m.camera.updateProjectionMatrix();
      m.renderer.setSize(w, h);
    });
  } else {
    const w = singleEl.clientWidth, h = singleEl.clientHeight;
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }
});

function loop(){
  requestAnimationFrame(loop);
  if (threeMode || quadMode){
    miniScenes.forEach(m=>{
      m.controls.update();
      m.renderer.render(m.scene, m.camera);
    });
  } else {
    controls.update();
    renderer.render(scene, camera);
  }
}

showSingle('ax1');
loop();
</script>
</body>
</html>
