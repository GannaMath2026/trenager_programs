<title>ЕГЭ · Оптимальность · производная</title>
<style>
:root{--bg:#f4f6fb;--cd:#fff;--tx:#1c2333;--mu:#667;--ac:#3b63d9;--ok:#1f9d57;--bad:#d64545;--wa:#d99a1e;--br:#d9deea;--od:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151d;--cd:#1c212d;--tx:#e8ebf3;--mu:#99a;--ac:#7c9bff;--ok:#3ecf80;--bad:#ff6b6b;--wa:#f0b43c;--br:#2e3547;--od:#e74c3c}}
:root[data-theme="dark"]{--bg:#12151d;--cd:#1c212d;--tx:#e8ebf3;--mu:#99a;--ac:#7c9bff;--ok:#3ecf80;--bad:#ff6b6b;--wa:#f0b43c;--br:#2e3547;--od:#e74c3c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;background:var(--cd);border-bottom:1px solid var(--br);position:sticky;top:0;z-index:30}
header h1{flex:1;min-width:120px;margin:0;font-size:15px;font-weight:700;cursor:pointer}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--br);border-radius:10px;padding:7px 11px}button{cursor:pointer}
button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}button.dng{color:var(--bad);border-color:var(--bad)}button.ghost{background:transparent}
main{max-width:980px;margin:auto;padding:12px}
.card{background:var(--cd);border:1px solid var(--br);border-radius:14px;padding:14px;margin-bottom:12px}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}.meta{font-size:13px;color:var(--mu)}
.tag{font-size:12px;border:1px solid var(--br);border-radius:8px;padding:2px 8px;color:var(--mu)}
.eq{font-size:1.2em;overflow-x:auto;padding:6px 0;text-align:center}.q{font-weight:600;margin:0 0 10px}
.op{display:block;width:100%;text-align:left;margin-bottom:8px;padding:11px 12px;overflow-x:auto;line-height:1.4}
.op.g{background:var(--ok);color:#fff;border-color:var(--ok)}.op.r{background:var(--bad);color:#fff;border-color:var(--bad)}
#fb{color:var(--mu);margin-top:6px}#fb.bad{color:var(--bad)}#fb.good{color:var(--ok)}
.row{padding:10px 12px;border:1px solid var(--br);border-radius:12px;margin-bottom:8px;cursor:pointer;background:var(--cd)}
.row:hover{border-color:var(--ac)}.row.done{border-left:6px solid var(--ok)}.row.hw{border-right:4px solid var(--wa)}
.stk{display:inline-block;background:var(--ok);color:#fff;font-weight:800;font-size:12px;padding:3px 10px;border-radius:8px}
.d-basic{color:var(--ok)}.d-medium{color:var(--wa)}.d-hard{color:var(--bad)}
.login-box{max-width:380px;margin:40px auto;text-align:center}.login-box input{width:100%;margin:8px 0;padding:12px;font-size:18px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:10px;z-index:99;opacity:0;transition:.3s}.toast.show{opacity:1}
.fs{display:flex;gap:10px;margin-top:10px;padding:8px;border:1px solid var(--br);border-radius:12px}.fs.last{background:color-mix(in srgb,var(--ok) 12%,var(--cd));border-color:var(--ok)}
.fn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ac);color:#fff;text-align:center;line-height:28px;font-weight:700}.fs.last .fn{background:var(--ok)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto}
.modal-box{background:var(--cd);border-radius:16px;padding:16px;max-width:760px;width:100%;margin-top:3vh}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
textarea.inp{width:100%;min-height:260px;font-family:ui-monospace,monospace;font-size:13px}
.filter-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.theory-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.sticker{border-radius:14px;padding:14px;border:1px solid var(--br)}.st-blue{background:color-mix(in srgb,var(--ac) 8%,var(--cd))}.st-green{background:color-mix(in srgb,var(--ok) 8%,var(--cd))}.st-orange{background:color-mix(in srgb,var(--wa) 10%,var(--cd))}.st-purple{background:color-mix(in srgb,#9b59b6 10%,var(--cd))}
.sticker h3{margin:0 0 8px;font-size:16px}.sticker .ex{background:var(--bg);border-radius:8px;padding:8px;margin:6px 0;overflow-x:auto}
table.der{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}table.der th,table.der td{border:1px solid var(--br);padding:6px 8px;text-align:left}table.der th{background:var(--bg)}
.nlwrap{margin:10px 0;overflow-x:auto}
.nl{position:relative;width:100%;max-width:680px;aspect-ratio:680/200;margin:0 auto}
.nl svg{position:absolute;inset:0;width:100%;height:100%}
.nlb{position:absolute;transform:translateX(-50%);font-size:clamp(11px,2.2vw,15px);white-space:nowrap}
.sketch-label{font-size:12px;color:var(--mu);text-align:center;margin-top:2px}
.concl{background:color-mix(in srgb,var(--ok) 12%,var(--cd));border-left:4px solid var(--ok);border-radius:8px;padding:10px 12px;margin:10px 0}
body.fullscr header{display:none}body.fullscr main{max-width:none;padding:8px;height:100vh;overflow:auto}
.xf{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.xf .btn{padding:6px 10px;font-size:13px}
.xf .btn.on{background:var(--ac);color:#fff}
.resline{background:var(--bg);border-radius:8px;padding:8px;margin-top:6px;overflow-x:auto}
</style>

<script>
const SEED={version:2,sections:[{id:'s1',name:'Упрощение + производная'},{id:'s2',name:'Квадрат / парабола'},{id:'s3',name:'Физика (Максвелл, RLC, мощность)'}],tasks:[
{id:'opt-01',title:'01',section:'s1',difficulty:'basic',text:'На берегах прямого участка реки друг напротив друга находятся пристани A и B. Лодка начинает переправу от пристани A. Собственная скорость лодки \(v\) меньше скорости течения \(u\). Точка прибытия удалена от пристани B на расстояние\n\\[ L = H \\cdot \\frac{u + v \\cos\\alpha}{v \\sin\\alpha}, \\]\nгде \(H\) — ширина реки, \(\\alpha\) — угол между скоростью лодки относительно воды и направлением течения.\nНайдите наименьшее возможное расстояние, если \(H=60\) м, \(u=2\) м/с, \(v=1\) м/с.',answer:'\\(60\\sqrt{3}\\) м',steps:[
{e:'L(\\alpha)=60\\cdot\\frac{2+\\cos\\alpha}{\\sin\\alpha},\\quad \\alpha\\in(0^\\circ;180^\\circ)',q:'С чего начинаем? (постоянный множитель не двигает точку экстремума)',o:[{t:'Отбрасываем 60 и исследуем \\(f(\\alpha)=\\dfrac{2+\\cos\\alpha}{\\sin\\alpha}\\). Константа > 0 не меняет, где минимум.',ok:true},{t:'Сразу подставляем \\(\\alpha=45^\\circ\\) и сравниваем значения',ok:false,w:'Так мы не находим точный минимум — нужен анализ производной.'},{t:'Берём производную от всей L без упрощения',ok:false,w:'Можно, но проще сначала убрать константу.'}]},
{e:'f(\\alpha)=\\frac{2+\\cos\\alpha}{\\sin\\alpha}',q:'Находим производную по правилу частного. Что получается?',o:[{t:'\\(f\'(\\alpha)=\\dfrac{-\\sin^2\\alpha-(2+\\cos\\alpha)\\cos\\alpha}{\\sin^2\\alpha}=\\dfrac{-1-2\\cos\\alpha}{\\sin^2\\alpha}\\)',ok:true},{t:'\\(f\'=\\dfrac{2+\\cos\\alpha}{\\cos\\alpha}\\)',ok:false,w:'Это не правило частного.'},{t:'\\(f\'=-\\sin\\alpha\\)',ok:false,w:'Нужно дифференцировать числитель и знаменатель.'}]},
{e:'f\'(\\alpha)=-\\frac{1+2\\cos\\alpha}{\\sin^2\\alpha}',q:'Нули числителя и знаменателя производной. Куда ставим точки на луче?',o:[{t:'Числитель: \\(1+2\\cos\\alpha=0\\Rightarrow\\cos\\alpha=-\\frac12\\Rightarrow\\alpha=120^\\circ\\) (закрашенная — критическая точка). Знаменатель \\(\\sin\\alpha=0\\) — на краях области.',ok:true,axis:{var:'\\alpha',points:[{label:'0^\\circ',type:'open',nodz:true},{label:'120^\\circ',type:'closed'},{label:'180^\\circ',type:'open',nodz:true}],signs:['-','+'],shade:[1,0],domain:true,sketch:['down','up']}},{t:'Только \\(\\alpha=90^\\circ\\)',ok:false,w:'Из уравнения \\(1+2\\cos=0\\) получается \\(\\cos=-1/2\\), т.е. 120°.'},{t:'\\(\\alpha=60^\\circ\\)',ok:false,w:'Cos 60° = +1/2, нам нужен −1/2.'}]},
{e:'\\text{знаки }f\':\\ (0;120)\\ (-),\\ (120;180)\\ (+)',q:'По знакам производной: где функция убывает / возрастает? Какая точка экстремума?',o:[{t:'f′ < 0 на (0°;120°) → убывает; f′ > 0 на (120°;180°) → растёт. При α=120° — точка минимума.',ok:true,axis:{var:'\\alpha',points:[{label:'0^\\circ',type:'open'},{label:'120^\\circ',type:'closed'},{label:'180^\\circ',type:'open'}],signs:['-','+'],shade:[1,0],domain:true,sketch:['down','up']}},{t:'На (0°;120°) производная > 0 → растёт',ok:false,w:'Смотрите знак: f′ = −(1+2cos)/sin². При α < 120° числитель (1+2cos)>0, перед ним минус → f′ < 0 → убывает.'},{t:'Знаки не нужны, достаточно приравнять к нулю',ok:false,w:'Знаки показывают, минимум это или максимум.'}]},
{e:'\\alpha=120^\\circ,\\ \\cos=-\\tfrac12,\\ \\sin=\\tfrac{\\sqrt3}{2}',q:'Подставляем в исходную L. Чему равно наименьшее расстояние?',o:[{t:'\\(L=60\\cdot\\dfrac{2-1/2}{\\sqrt3/2}=60\\cdot\\dfrac{3/2}{\\sqrt3/2}=60\\sqrt3\\) м',ok:true},{t:'\\(60\\cdot(2+1/2)/(\\sqrt3/2)\\)',ok:false,w:'Cos отрицательный: 2 + (−1/2) = 3/2.'},{t:'60 м',ok:false,w:'Не подставили угол.'}]},
{e:'L_{\\min}=60\\sqrt{3}',q:'Вывод: что мы нашли и зачем?',o:[{t:'Нашли критическую точку α=120°, по знакам производной убедились, что это минимум. Проверили, что она внутри допустимого угла. Ответ: \\(60\\sqrt{3}\\) м.',ok:true},{t:'Просто подставили любое α',ok:false,w:'Нужна именно точка минимума.'}]},
{e:'L_{\\min}=60\\sqrt{3}',q:'END'}]},
{id:'opt-02',title:'02',section:'s3',difficulty:'basic',text:'Распределение кинетической энергии молекул гелия:\n\\[ f(\\mathcal{E})=\\frac{2}{\\sqrt{\\pi}}\\left(\\frac{1}{kT}\\right)^{3/2}\\sqrt{\\mathcal{E}}\\,e^{-\\mathcal{E}/(kT)}, \\]\nгде \\(k=1{,}38\\cdot10^{-23}\\) Дж/К. Найдите значение \\(\\mathcal{E}\\), при котором плотность максимальна, если \\(T=300\\) К.',answer:'\\(2{,}07\\cdot10^{-21}\\) Дж',steps:[
{e:'f(\\mathcal{E})=m\\sqrt{\\mathcal{E}}\\,e^{-\\mathcal{E}/n},\\ m>0,\\ n=kT',q:'Как упростить поиск максимума? (m > 0 — константа)',o:[{t:'Максимум f совпадает с максимумом \\(f^2\\) и с максимумом \\(\\mathcal{E}\\,e^{-2\\mathcal{E}/n}\\). Отбрасываем положительные константы.',ok:true},{t:'Сразу подставляем числа в исходную формулу',ok:false,w:'Сначала находим критическую точку analytically.'},{t:'Берём ln f и дифференцируем',ok:false,w:'Можно, но квадрат проще для этой функции.'}]},
{e:'f_1(\\mathcal{E})=\\mathcal{E}\\,e^{-2\\mathcal{E}/n}',q:'Производная (произведение). Что получается?',o:[{t:'\\(f_1\'=e^{-2\\mathcal{E}/n}\\left(1-\\dfrac{2\\mathcal{E}}{n}\\right)\\)',ok:true},{t:'\\(f_1\'=e^{-2\\mathcal{E}/n}\\)',ok:false,w:'Нужно правило произведения: (uv)′ = u′v + uv′.'},{t:'\\(f_1\'=-\\frac{2}{n}e^{-2\\mathcal{E}/n}\\)',ok:false,w:'Пропущен член от производной первого множителя.'}]},
{e:'1-\\frac{2\\mathcal{E}}{n}=0',q:'Нуль числителя производной. Критическая точка?',o:[{t:'\\(\\mathcal{E}=\\dfrac{n}{2}=\\dfrac{kT}{2}\\). Знаменатель (экспонента) никогда не ноль.',ok:true,axis:{var:'\\mathcal{E}',points:[{label:'0',type:'open'},{label:'kT/2',type:'closed'},{label:'+\\infty',type:'open'}],signs:['+','-'],shade:[1,0],domain:true,sketch:['up','down']}},{t:'\\(\\mathcal{E}=kT\\)',ok:false,w:'Из 1 − 2E/n = 0 → E = n/2.'},{t:'\\(\\mathcal{E}=\\frac{3}{2}kT\\)',ok:false,w:'Это средняя энергия, не мода.'}]},
{e:'\\mathcal{E}=\\frac{kT}{2},\\ T=300',q:'Подставьте k и T',o:[{t:'\\(\\mathcal{E}=\\dfrac{1{,}38\\cdot10^{-23}\\cdot300}{2}=2{,}07\\cdot10^{-21}\\) Дж',ok:true},{t:'\\(4{,}14\\cdot10^{-21}\\)',ok:false,w:'Забыли разделить на 2.'},{t:'\\(2{,}07\\cdot10^{-23}\\)',ok:false,w:'Ошибка порядка.'}]},
{e:'\\mathcal{E}_{\\max}=2{,}07\\cdot10^{-21}',q:'Вывод',o:[{t:'Нашли единственную критическую точку E = kT/2. По знакам производной: слева f′>0 (растёт), справа f′<0 (убывает) → максимум. Это и есть искомое значение энергии.',ok:true},{t:'Просто среднее значение',ok:false,w:'Среднее — другое.'}]},
{e:'\\mathcal{E}_{\\max}=2{,}07\\cdot10^{-21}',q:'END'}]},
{id:'opt-03',title:'03',section:'s2',difficulty:'medium',text:'Амплитуда напряжения на катушке в RLC-цепи:\n\\[ U_L(\\omega)=\\frac{U L\\omega}{\\sqrt{R^2+\\left(\\omega L-\\frac1{\\omega C}\\right)^2}}. \\]\nПри какой частоте \\(\\omega\\) амплитуда наибольшая, если \\(U=180\\) В, \\(L=0{,}045\\) Гн, \\(C=10^{-4}\\) Ф, \\(R=10\\) Ом?',answer:'500',steps:[
{e:'U_L(\\omega)=\\frac{UL\\omega}{\\sqrt{R^2+(\\omega L-1/(\\omega C))^2}}',q:'Что отбрасываем сразу? (U>0, L>0)',o:[{t:'U и L — положительные константы → исследуем \\(f(\\omega)=\\dfrac{\\omega}{\\sqrt{\\ldots}}\\). Точка максимума та же.',ok:true},{t:'Положим ω = 1/√(LC) (резонанс тока)',ok:false,w:'Резонанс тока — не то же самое, что максимум U_L.'},{t:'Дифференцируем исходную функцию целиком',ok:false,w:'Сначала упрощаем.'}]},
{e:'g(\\omega)=(f(\\omega))^2=\\frac{\\omega^2}{R^2+(\\omega L-1/(\\omega C))^2}',q:'Дальше: делим числитель и знаменатель на ω² и делаем замену t = 1/ω². Зачем?',o:[{t:'После деления и замены знаменатель становится квадратичной функцией h(t) — парабола. Минимум параболы ищем по вершине.',ok:true},{t:'Чтобы избавиться от корня',ok:false,w:'Корень уже убрали возведением в квадрат. Замена нужна для сведения к параболе.'},{t:'Замена не нужна',ok:false,w:'Без неё производная очень громоздкая.'}]},
{e:'h(t)=\\frac1{C^2}t^2+(R^2-2L/C)t+L^2',q:'Вершина параболы (a>0 → минимум). Формула x₀ = −b/(2a):',o:[{t:'\\(t=LC-\\dfrac{R^2 C^2}{2}\\)',ok:true},{t:'t = L/C',ok:false,w:'Неверный расчёт коэффициентов.'},{t:'t = 0',ok:false,w:'Вершина не в нуле.'}]},
{e:'\\omega=\\frac1{\\sqrt{LC-R^2 C^2/2}}',q:'Подставьте L=0,045, C=10^{-4}, R=10',o:[{t:'LC = 4,5·10^{-6}, R²C²/2 = 0,5·10^{-6} → под корнем 4·10^{-6} → ω = 1/(2·10^{-3}) = 500',ok:true},{t:'ω ≈ 471 (без вычитания R²C²/2)',ok:false,w:'Нужно вычесть член с R.'},{t:'1000',ok:false,w:'Ошибка в корне.'}]},
{e:'\\omega=500',q:'Вывод',o:[{t:'Свели задачу к минимуму параболы по t=1/ω². Нашли t, вернулись к ω. Получили частоту 500 с⁻¹, при которой амплитуда на катушке максимальна.',ok:true},{t:'Это резонансная частота контура',ok:false,w:'Классический резонанс — 1/√(LC) ≈ 471; здесь сдвиг из‑за R.'}]},
{e:'\\omega=500',q:'END'}]},
{id:'opt-04',title:'04',section:'s2',difficulty:'basic',text:'Источник: \\(\\mathcal{E}=40\\) В, внутреннее сопротивление \\(r=1\\) Ом. Ток \\(I=\\dfrac{\\mathcal{E}}{r+R}\\), мощность на нагрузке \\(P=I^2 R\\).\nНайдите наибольшую возможную тепловую мощность источника.',answer:'\\(P_{\\max}=400\\) Вт',steps:[
{e:'P(R)=\\frac{\\mathcal{E}^2 R}{(r+R)^2},\\ R>0',q:'Упрощаем. Как удобнее искать максимум?',o:[{t:'Отбрасываем \\(\\mathcal{E}^2\\). Исследуем \\(f(R)=\\dfrac{R}{(r+R)^2}\\). Максимум f = минимум знаменателя после деления на R (переворот).',ok:true},{t:'Положить R = 0',ok:false,w:'Тогда P = 0 — минимум, не максимум.'},{t:'Сразу P′ = 0 без упрощения',ok:false,w:'Можно, но переворот быстрее.'}]},
{e:'g(R)=\\frac{r^2}{R}+2r+R',q:'Минимум g (после переворота). Производная g′ = 0:',o:[{t:'\\(-\\dfrac{r^2}{R^2}+1=0\\Rightarrow R=r\\)',ok:true,axis:{var:'R',points:[{label:'0',type:'open'},{label:'r',type:'closed'},{label:'+\\infty',type:'open'}],signs:['-','+'],shade:[1,0],domain:true,sketch:['down','up']}},{t:'R = 2r',ok:false,w:'Из −r²/R² + 1 = 0 → R = r.'},{t:'R = r/2',ok:false,w:'Неверно.'}]},
{e:'R=r=1,\\ \\mathcal{E}=40',q:'Формула максимальной мощности и число',o:[{t:'\\(P_{\\max}=\\dfrac{\\mathcal{E}^2}{4r}=\\dfrac{1600}{4}=400\\) Вт',ok:true},{t:'800 Вт',ok:false,w:'Формула \\(\\mathcal{E}^2/(4r)\\).'},{t:'40 Вт',ok:false,w:'Не подставили.'}]},
{e:'P_{\\max}=400',q:'Вывод',o:[{t:'Мощность максимальна, когда сопротивление нагрузки равно внутреннему сопротивлению источника (R = r). Получили 400 Вт.',ok:true},{t:'Мощность растёт с R без предела',ok:false,w:'Нет: при большом R ток падает.'}]},
{e:'P_{\\max}=400',q:'END'}]},
{id:'opt-05',title:'05',section:'s3',difficulty:'basic',text:'Распределение Максвелла скорости молекул водорода:\n\\[ f(v)=4\\pi v^2\\left(\\frac{M}{2\\pi RT}\\right)^{3/2}e^{-Mv^2/(2RT)}. \\]\nПри каком v функция плотности максимальна, если M = 0,004 кг/моль, T = 500 К? Ответ через R.',answer:'\\(v=500\\sqrt{R}\\) м/с',steps:[

const PFX='ege-opt.v2.';
let U=localStorage.getItem(PFX+'user')||'';

function H(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function nl2(s){return H(s).replace(/\n/g,'<br>')}
function $(id){return document.getElementById(id)}

function secName(id){const s=LIB.sections.find(x=>x.id===id);return s?s.name:id}

function axisHTML(a){
  if(!a||!a.points)return '';
  const n=a.points.length,W=680,Y=78,H=200;
  const xs=a.points.map((_,i)=>50+(i)*(W-100)/Math.max(n-1,1));
  let v=`<line x1="20" y1="${Y}" x2="${W-20}" y2="${Y}" stroke="var(--tx)" stroke-width="2.5"/><path d="M${W-28} ${Y-7} L${W-12} ${Y} L${W-28} ${Y+7}" fill="none" stroke="var(--tx)" stroke-width="2.5"/>`;
  if(a.domain){v+=`<path d="M${xs[0]} ${Y-18} Q${(xs[0]+xs[n-1])/2} ${Y-38} ${xs[n-1]} ${Y-18}" fill="none" stroke="var(--od)" stroke-width="2" stroke-dasharray="5 3"/>`;v+=`<text x="${(xs[0]+xs[n-1])/2}" y="${Y-42}" text-anchor="middle" font-size="11" fill="var(--od)">область смысла</text>`}
  const sg=a.signs||[];
  for(let j=0;j<sg.length;j++){const x1=j===0?30:xs[j-1],x2=j===sg.length-1?W-30:xs[j];const mid=(x1+x2)/2,col=sg[j]==='+'?'var(--bad)':'var(--ac)';v+=`<text x="${mid}" y="${Y-22}" text-anchor="middle" font-size="22" font-weight="700" fill="${col}">${sg[j]==='+'?'+':'−'}</text>`;if(a.shade&&a.shade[j])v+=`<line x1="${x1+6}" y1="${Y}" x2="${x2-6}" y2="${Y}" stroke="var(--ac)" stroke-width="7" stroke-linecap="round" opacity=".7"/>`}
  a.points.forEach((p,i)=>{const x=xs[i],filled=p.type==='closed';v+=`<circle cx="${x}" cy="${Y}" r="8" fill="${filled?'var(--tx)':'var(--cd)'}" stroke="var(--tx)" stroke-width="2.5"/>`;if(p.nodz)v+=`<circle cx="${x}" cy="${Y}" r="12" fill="none" stroke="var(--od)" stroke-width="1.5" stroke-dasharray="3 2"/>`});
  const sk=a.sketch||[];
  if(sk.length){const y0=Y+28;for(let j=0;j<sk.length;j++){const x1=j===0?40:xs[j-1],x2=j===sk.length-1?W-40:xs[j];const mid=(x1+x2)/2;if(sk[j]==='up'){v+=`<path d="M${x1+10} ${y0+18} Q${mid} ${y0-8} ${x2-10} ${y0+18}" fill="none" stroke="var(--ok)" stroke-width="2.2"/><text x="${mid}" y="${y0+32}" text-anchor="middle" font-size="12" fill="var(--ok)">↑ растёт</text>`}else{v+=`<path d="M${x1+10} ${y0} Q${mid} ${y0+26} ${x2-10} ${y0}" fill="none" stroke="var(--ac)" stroke-width="2.2"/><text x="${mid}" y="${y0+32}" text-anchor="middle" font-size="12" fill="var(--ac)">↓ убывает</text>`}}}
  let lb=a.points.map((p,i)=>`<span class="nlb" style="left:${xs[i]/W*100}%;top:48%">${p.label?`\\(${H(p.label)}\\)`:''}</span>`).join('');
  lb+=`<span class="nlb" style="left:96%;top:32%">\\(${H(a.var||'x')}\\)</span>`;
  return `<div class="nlwrap"><div class="nl"><svg viewBox="0 0 ${W} ${H}">${v}</svg>${lb}</div><div class="sketch-label">● закрашенная — входит · ○ выколотая — не входит · красная дуга — область смысла · стрелки — поведение функции</div></div>`;
}

=addTask}
function openT(id){cur=LIB.tasks.find(t=>String(t.id)===String(id));if(!cur)return;si=0;err=0;hist=[];shuffle();view()}
function shuffle(){const s=cur.steps[si];ord=s&&s.o?s.o.map((_,i)=>i).sort(()=>Math.random()-.5):[]}
function view(){const t=cur,x=g(t.id);$('app').innerHTML=`<div class="card"><div class="bar"><button onclick="menu()">← Список</button><button onclick="tg('${t.id}','fav')">${x.fav?'★':'☆'}</button><button onclick="tg('${t.id}','hw')">${x.hw?'✓ ДЗ':'+ ДЗ'}</button><button onclick="tg('${t.id}','done')">${x.done?'✓ Разобрано':'Отметить'}</button><button onclick="fullShow()">📖 Весь разбор</button><button onclick="toggleFull()">${fullMode?'⤢ Окно':'⛶ На весь экран'}</button><button onclick="editTask('${t.id}')">✏️</button></div><div class="bar"><span class="meta">Режим шагов:</span><button class="${MODE==='pick'?'on':''}" onclick="setMode('pick')">С выбором</button><button class="${MODE==='show'?'on':''}" onclick="setMode('show')">Без выбора · «Дальше»</button></div><b>№ ${H(t.title)}</b> <span class="tag">${H(secName(t.section))}</span><div class="tx" style="margin-top:8px">${nl2(t.text)}</div></div><div id="ch"></div>`;chain();tx($('app'))}

function tg(id,k){const x=g(id);x[k]=!x[k];sv();if(cur&&String(cur.id)===String(id))view();else menu()}

function chain(){const el=$('ch'),s=cur.steps[si],fin=s.q==='END';const ok=fin?null:s.o.find(o=>o.ok);let top=`<div class="card"><div class="meta">Шаг ${si+1} из ${cur.steps.length}${err?' · ошибок: '+err:''}</div><div class="eq">$$${H(s.e)}$$</div>${s.axis?axisHTML(s.axis):''}</div>`;let body;if(fin)body=`<div id="fin"></div>`;else if(MODE==='show')body=`<div class="card" id="qc"><p class="q">${nl2(s.q)}</p><div class="op g" style="cursor:default">✓ ${H(ok.t)}</div>${ok.axis?axisHTML(ok.axis):''}<div class="bar"><button class="pri" onclick="nextShow()">Дальше → <span class="meta" style="color:inherit">(пробел)</span></button></div></div>`;else body=`<div class="card" id="qc"><p class="q">${nl2(s.q)}</p>${ord.map(j=>`<button class="op" onclick="pick(${j},this)">${H(s.o[j].t)}</button>`).join('')}<div id="fb"></div></div>`;el.innerHTML=top+body;tx(el);if(fin)finish()}
function pick(j,b){if(lock||b.classList.contains('r'))return;const s=cur.steps[si],o=s.o[j],fb=$('fb');if(o.ok){lock=1;b.classList.add('g');fb.className='good';fb.innerHTML='✓ Верно'+(o.axis?axisHTML(o.axis):'');tx(fb);hist.push({e:s.e,a:o.t});setTimeout(()=>{lock=0;si++;shuffle();chain()},o.axis?1800:700)}else{err++;g(cur.id).err=(g(cur.id).err||0)+1;sv();b.classList.add('r');fb.className='bad';fb.innerHTML=H(o.w||'Неверно');tx(fb)}}
function nextShow(){const s=cur.steps[si],o=s.o.find(o=>o.ok);hist.push({e:s.e,a:o.t});si++;shuffle();chain()}
function finish(){g(cur.id).done=true;sv();$('fin').innerHTML=`<div class="card" style="border-color:var(--ok)"><span class="stk">✓ РАЗОБРАНО</span><div class="meta" style="margin:8px 0">Ошибок: ${err}</div><div class="concl"><b>Итог:</b> мы нашли критическую точку (нули числителя производной), расставили знаки, определили min/max и при необходимости проверили края области. Ответ получен.</div><div class="eq">$$${H(cur.steps[cur.steps.length-1].e)}$$</div>${cur.answer?`<div style="margin-top:10px"><b>Ответ:</b> ${H(cur.answer)}</div>`:''}<div class="bar" style="margin-top:12px"><button onclick="redo()">Заново</button><button class="pri" onclick="nxt()">Следующая →</button><button onclick="menu()">К списку</button></div></div>`+fullHTML();tx($('fin'))}

function theory(){cur=null;document.body.classList.remove('fullscr');$('app').innerHTML=`<div class="bar"><button class="ghost" onclick="menu()">← К списку</button></div><h2 style="margin:0 0 14px">📚 Теория: экстремумы через производную</h2><div class="theory-grid"><div class="sticker st-blue"><h3>Алгоритм</h3><ol style="margin:0;padding-left:18px"><li>Упростить (отбросить положительные константы, возвести в квадрат, перевернуть дробь).</li><li>Взять производную.</li><li>Найти нули <b>числителя</b> и <b>знаменателя</b> производной → точки на луче (● / ○).</li><li>Расставить знаки производной на промежутках.</li><li>Нарисовать эскиз: ↑ растёт, ↓ убывает.</li><li>Определить min/max. Проверить края области смысла.</li><li>Подставить числа, записать ответ.</li></ol></div><div class="sticker st-green"><h3>Лайфхаки упрощения</h3><div class="ex">\\(f=c\\cdot g\\) (c>0) → экстремум там же, где у g</div><div class="ex">\\(f=1/g\\) → max f = min g</div><div class="ex">\\(f=\\sqrt{g}\\) (g≥0) → max f = max g</div><div class="ex">Квадрат: max f² там же, где max |f|</div><div class="ex">Замена \\(t=1/x^2\\) или \\(t=x^2\\) → парабола</div></div><div class="sticker st-orange"><h3>Парабола</h3><p>\\(y=ax^2+bx+c\\)</p><div class="ex">Вершина: \\(x=-\\dfrac{b}{2a}\\)</div><p>a>0 — минимум, a<0 — максимум.</p></div><div class="sticker st-purple"><h3>Таблица производных</h3><table class="der"><tr><th>Функция</th><th>Производная</th></tr><tr><td>\\(c\\)</td><td>\\(0\\)</td></tr><tr><td>\\(x^n\\)</td><td>\\(n x^{n-1}\\)</td></tr><tr><td>\\(e^x\\)</td><td>\\(e^x\\)</td></tr><tr><td>\\(a^x\\)</td><td>\\(a^x\\ln a\\)</td></tr><tr><td>\\(\\ln x\\)</td><td>\\(1/x\\)</td></tr><tr><td>\\(\\sin x\\)</td><td>\\(\\cos x\\)</td></tr><tr><td>\\(\\cos x\\)</td><td>\\(-\\sin x\\)</td></tr><tr><td>\\(\\sqrt{x}\\)</td><td>\\(1/(2\\sqrt{x})\\)</td></tr><tr><td>\\(u\\cdot v\\)</td><td>\\(u'v+uv'\\)</td></tr><tr><td>\\(u/v\\)</td><td>\\((u'v-uv')/v^2\\)</td></tr><tr><td>\\(f(g)\\)</td><td>\\(f'(g)\\cdot g'\\)</td></tr></table></div><div class="sticker st-blue"><h3>Знаки и эскиз</h3><div id="demoAx"></div><p class="meta">● критическая точка входит · ○ край области · красная дуга — область смысла · стрелки — поведение функции</p></div><div class="sticker st-green"><h3>Края промежутка</h3><p>После нахождения внутренних экстремумов всегда смотрим значения (или пределы) на концах допустимого интервала — там тоже может быть наименьшее / наибольшее значение.</p></div></div>`;$('demoAx').innerHTML=axisHTML({var:'x',points:[{label:'a',type:'open',nodz:true},{label:'x_0',type:'closed'},{label:'b',type:'open'}],signs:['-','+'],shade:[0,1],domain:true,sketch:['down','up']});tx($('app'))}
function xform(){cur=null;document.body.classList.remove('fullscr');$('app').innerHTML=`<div class="bar"><button class="ghost" onclick="menu()">← К списку</button></div><h2 style="margin:0 0 10px">🔀 Преобразователь функций</h2><p class="meta">Выберите операцию — как меняется точка экстремума и характер (min ↔ max).</p><div class="card"><div class="xf" id="xfBtns"><button class="btn on" data-op="cpos">× c (c>0)</button><button class="btn" data-op="cneg">× c (c<0)</button><button class="btn" data-op="inv">1/g</button><button class="btn" data-op="sq">g² (g≥0)</button><button class="btn" data-op="sqrt">√g</button><button class="btn" data-op="exp">e^g</button><button class="btn" data-op="ln">ln g (g>0)</button><button class="btn" data-op="pow">g^α (α>0)</button></div><div id="xfOut" class="resline"></div></div><div class="card"><h3 style="margin-top:0">Краткая шпаргалка</h3><table class="der"><tr><th>Операция</th><th>Точка экстремума</th><th>Min / Max</th></tr><tr><td>× c, c>0</td><td>та же</td><td>сохраняется</td></tr><tr><td>× c, c<0</td><td>та же</td><td>меняется (min↔max)</td></tr><tr><td>1/g (g≠0)</td><td>та же</td><td>меняется</td></tr><tr><td>g², √g, e^g, ln g</td><td>та же</td><td>сохраняется</td></tr><tr><td>g^α, α>0</td><td>та же</td><td>сохраняется</td></tr></table></div>`;const expl={cpos:'Умножение на положительную константу не двигает точку экстремума и не меняет характер. Поэтому в задачах сразу отбрасываем такие множители.',cneg:'Умножение на отрицательную константу оставляет точку на месте, но меняет min ↔ max.',inv:'Переворот 1/g: точка та же (где g≠0), но максимум становится минимумом и наоборот.',sq:'Возведение в квадрат (при g≥0) — возрастающая операция → точка и характер сохраняются.',sqrt:'Корень — возрастающая функция → экстремум там же, характер тот же.',exp:'Экспонента строго возрастает → точка и характер сохраняются.',ln:'Логарифм (на области g>0) строго возрастает → точка и характер сохраняются.',pow:'Степень с положительным показателем на положительных — возрастает → точка и характер сохраняются.'};function show(op){document.querySelectorAll('#xfBtns .btn').forEach(b=>b.classList.toggle('on',b.dataset.op===op));$('xfOut').innerHTML=`<p>${expl[op]}</p>`}document.querySelectorAll('#xfBtns .btn').forEach(b=>b.onclick=()=>show(b.dataset.op));show('cpos')}
function editTask(id){const t=LIB.tasks.find(x=>String(x.id)===String(id));if(!t)return;modalEdit(JSON.parse(JSON.stringify(t)),false,id)}
function addTask(){modalEdit({id:'opt-'+Date.now(),title:String(LIB.tasks.length+1).padStart(2,'0'),section:'s1',difficulty:'basic',text:'Решите задачу на экстремум…',answer:'',steps:[{e:'f(x)=\\ldots',q:'Что упрощаем?',o:[{t:'Отбрасываем константу',ok:true},{t:'Угадываем',ok:false,w:'Нет'}]},{e:'f\'=0',q:'END'}]},true,null)}
function modalEdit(obj,isNew,originalId){const root=$('modalRoot');root.innerHTML=`<div class="modal"><div class="modal-box"><h3>${isNew?'＋ Новая задача':'✏️ Редактирование № '+H(obj.title)}</h3><textarea id="editJson" class="inp"></textarea><div class="meta" style="margin-top:6px">Поля: id, title, section, difficulty, text, answer, steps[{e, q, o:[{t, ok, w, axis?}], axis?}]. Последний шаг — q:"END".</div><div class="modal-foot"><button class="ghost" id="cancelEdit">Отмена</button>${!isNew?`<button class="dng" id="delEdit">Удалить</button>`:''}<button class="pri" id="saveEdit">Сохранить</button></div></div></div>`;$('editJson').value=JSON.stringify(obj,null,2);$('cancelEdit').onclick=()=>{root.innerHTML=''};$('saveEdit').onclick=()=>{try{const p=JSON.parse($('editJson').value);if(!p.id||!p.steps)throw new Error('Нужны id и steps');if(isNew)LIB.tasks.push(p);else{const i=LIB.tasks.findIndex(x=>String(x.id)===String(originalId));if(i>=0)LIB.tasks[i]=p}root.innerHTML='';toast('Сохранено');menu()}catch(e){toast('Ошибка JSON: '+e.message)}};if(!isNew)$('delEdit').onclick=()=>{if(!confirm('Удалить задачу?'))return;LIB.tasks=LIB.tasks.filter(x=>String(x.id)!==String(originalId));delete S[originalId];sv();root.innerHTML='';toast('Удалено');menu()}}
function th(){const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';document.querySelector('meta[name=theme-color]').content=r.dataset.theme==='dark'?'#12151d':'#fffdf8'}
function init(){$('btnTheory').onclick=theory;$('btnXform').onclick=xform;$('btnTheme').onclick=th;$('btnUser').onclick=()=>{U='';localStorage.removeItem(PFX+'user');login()};$('brand').onclick=()=>U?menu():login();document.addEventListener('keydown',e=>{if(!cur||MODE!=='show'||$('modalRoot').innerHTML)return;if(/INPUT|TEXTAREA|SELECT/.test((e.target||{}).tagName||''))return;if(e.key===' '||e.key==='Enter'){e.preventDefault();if(cur.steps[si]&&cur.steps[si].q!=='END')nextShow()}if(e.key==='Escape'&&fullMode)toggleFull()});if(U)menu();else login()}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
</script>
