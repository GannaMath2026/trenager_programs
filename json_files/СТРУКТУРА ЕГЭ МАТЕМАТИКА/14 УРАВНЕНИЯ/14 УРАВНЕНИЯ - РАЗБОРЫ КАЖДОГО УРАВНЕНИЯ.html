<script type="text/plain" id="pre">@ 001
= 2\sin^2x\cos x+\sqrt3\cos^2x=\sqrt3 || Как сгруппировать?
+ Перенести $\sqrt3$ влево и вынести $\sqrt3$ из двух последних слагаемых
- Разделить на $\cos x$ || Потеряются корни, при которых $\cos x=0$.
- Возвести в квадрат || Появятся посторонние корни.
= 2\sin^2x\cos x+\sqrt3(\cos^2x-1)=0 || Как преобразовать $\cos^2x-1$?
+ По ОТТ: $\cos^2x-1=-\sin^2x$
- $\cos^2x-1=\sin^2x$ || Ошибка знака: $\cos^2x-1=-\sin^2x$.
- $\cos^2x-1=\cos2x$ || Верно: $\cos2x=2\cos^2x-1$.
= 2\sin^2x\cos x-\sqrt3\sin^2x=0 || Общий множитель?
+ Вынести $\sin^2x$
- Сократить на $\sin^2x$ || Потеряются корни $\sin x=0$.
- Вынести $\cos x$ || Его нет во втором слагаемом.
= \sin^2x\,(2\cos x-\sqrt3)=0 || Когда произведение равно нулю?
+ Когда хотя бы один множитель равен нулю
- Только когда оба равны нулю || Достаточно одного.
- Когда сумма множителей равна нулю || Это условие для суммы.
= \left[\begin{array}{l}\sin x=0\\\cos x=\dfrac{\sqrt3}{2}\end{array}\right. || END
@ 002
= \sqrt2\sin^3x-\sqrt2\sin x+\cos^2x=0 || Как привести к одной функции?
+ $\cos^2x=1-\sin^2x$
- $\cos^2x=1+\sin^2x$ || Знак: $\cos^2x=1-\sin^2x$.
- $\cos^2x=\sin^2x-1$ || Знак перепутан: $\cos^2x=1-\sin^2x$.
= \sqrt2\sin^3x-\sqrt2\sin x+1-\sin^2x=0 || Какая замена?
+ $t=\sin x$, где $|t|\le1$
- $t=\sin^3x$ || Остальные степени не выражаются через $t$.
- $t=\cos x$ || Всё записано через синус.
= \sqrt2t^3-t^2-\sqrt2t+1=0 || Метод для кубического?
+ Группировка: $\sqrt2t(t^2-1)-(t^2-1)$
- Разделить на $t$ || Свободный член $1$ останется в виде $\frac1t$.
- Дискриминант || Он только для квадратных уравнений.
= (t^2-1)(\sqrt2t-1)=0\ \Rightarrow\ \left[\begin{array}{l}t=1\\t=-1\\t=\dfrac{\sqrt2}{2}\end{array}\right. || Какие корни годятся?
+ Все три: $|t|\le1$
- $t=-1$ не подходит || Синус принимает значение $-1$.
- Только $t=1$ || Остальные по модулю тоже не больше 1.
= \left[\begin{array}{l}\sin x=1\\\sin x=-1\\\sin x=\dfrac{\sqrt2}{2}\end{array}\right. || END
@ 003
= 2\sin x\cos^2x+\sqrt3=\sqrt3\sin^2x || Как привести к одной функции?
+ $\cos^2x=1-\sin^2x$
- $\cos^2x=1+\sin^2x$ || Знак: $\cos^2x=1-\sin^2x$.
- $\sin^2x=1+\cos^2x$ || Верно: $\sin^2x=1-\cos^2x$.
= 2\sin x(1-\sin^2x)+\sqrt3=\sqrt3\sin^2x || Что дальше?
+ Замена $t=\sin x$, всё влево, по степеням
- Разделить на $\sin x$ || Потеряются корни, слагаемое $\sqrt3$ даст дробь.
- Возвести в квадрат || Лишние корни.
= 2t^3+\sqrt3t^2-2t-\sqrt3=0 || Метод?
+ Группировка: $t^2(2t+\sqrt3)-(2t+\sqrt3)$
- Дискриминант || Уравнение кубическое.
- Подобрать корень $t=2$ || Делители свободного члена: $\sqrt3$, а не 2.
= (t^2-1)(2t+\sqrt3)=0\ \Rightarrow\ \left[\begin{array}{l}t=1\\t=-1\\t=-\dfrac{\sqrt3}{2}\end{array}\right. || Какие корни годятся?
+ Все три: $|t|\le1$
- $t=-1$ не подходит || Синус принимает значение $-1$.
= \left[\begin{array}{l}\sin x=1\\\sin x=-1\\\sin x=-\dfrac{\sqrt3}{2}\end{array}\right. || END
@ 004

+ $0{,}25x=\frac x4$, затем $\cos^2=1-\sin^2$
- $\cos^2(0{,}25x)=\cos^2x\cdot0{,}25$ || Коэффициент в аргументе не выносится.
- Разделить на $2$ и ничего не менять || Нужно привести к одной функции.
= 4-3\sqrt2\sin\dfrac x4=2\left(1-\sin^2\dfrac x4\right) || Какая замена?
+ $t=\sin\frac x4$, где $|t|\le1$
- $t=\frac x4$ || Тогда останутся $\sin t$ и $\sin^2t$.
- $t=\sin x$ || Аргумент у синуса $\frac x4$.
= 2t^2-3\sqrt2t+2=0\ \Rightarrow\ \left[\begin{array}{l}t=\sqrt2\\t=\dfrac{\sqrt2}{2}\end{array}\right. || Какие корни годятся?
+ $t=\sqrt2$ не подходит ($|t|\le1$), остаётся $t=\frac{\sqrt2}2$
- Оба подходят || $\sqrt2>1$, а $|\sin|\le1$.
- Подходит только $t=\sqrt2$ || Наоборот.
= \sin\dfrac x4=\dfrac{\sqrt2}{2} || END
@ 005

+ $\sin\left(\frac{3\pi}2+x\right)=-\cos x$

@ 008

 - формула понижения степени\n\n1. Применить формулу понижения степени к каждому множителю:\n\\( \\sin^2 \\alpha = \\frac{1 - \\cos 2\\alpha}{2} \\)\n\nДля первого множителя: \\( 2\\alpha = 2 \\cdot (x/2 - \\pi/4) = x - \\pi/2 \\)\nДля второго множителя: \\( 2\\alpha = 2 \\cdot (x/2 + \\pi/4) = x + \\pi/2 \\)\nИТОГО: \\(\\quad 2 \\cdot \\frac{1 - \\cos(x - \\pi/2)}{2} \\cdot \\frac{1 - \\cos(x + \\pi/2)}{2} = \\cos^4 x \\)\n\n2. Применить формулы приведения: \\( \\cos(x - \\pi/2) = \\sin x \\quad  \\cos(x + \\pi/2) = -\\sin x \\)\n3. Применить формулу разности квадратов: \\( (a - b)(a+b) = a^2 – b^2 \\)\n4. Применить основное тригонометрическое тождество: \\( 1 - \\sin^2 x = \\cos^2 x \\)\n5. Получить уравнение: \\( \\cos^2 x = 2\\cos^4 x \\) \n5. Вынести \\( \\cos^2 x \\) за скобку…", "a": "a) \\( \\frac{\\pi}{2} + \\pi k; \\frac{\\pi}{4} + \\frac{\\pi k}{2}, \\, k \\in \\mathbb{Z} \\)<br>б) \\( -\\frac{11\\pi}{4}; \\, -\\frac{5\\pi}{2}; \\, -\\frac{9\\pi}{4} \\)", "ap": "a) \\( \\frac{\\pi}{2} + \\pi k; \\frac{\\pi}{4} + \\frac{\\pi k}{2}, \\, k \\in \\mathbb{Z} \\)\nб) \\( -\\frac{11\\pi}{4}; \\, -\\frac{5\\pi}{2}; \\, -\\frac{9\\pi}{4} \\)"}, {"id": 1778575205414, "n": "967- 104331 ЯЩЕНКО - СПИРАЛЬ", "s": "09 · ОДЗ", "d": "basic", "t": "a) Решите уравнение  \\(\\frac{4 \\sin^3 x - 2 \\sin x}{\\sin (2x - \\pi)} = 1.\\)<br>б) Найдите все корни этого уравнения, принадлежащие отрезку  \\(\\left[ -\\frac{3\\pi}{2}; -\\frac{\\pi}{2} \\right].\\)", "c": "a) Решите уравнение  \\(\\frac{4 \\sin^3 x - 2 \\sin x}{\\sin (2x - \\pi)} = 1.\\)", "p": "a) Решите уравнение  \\(\\frac{4 \\sin^3 x - 2 \\sin x}{\\sin (2x - \\pi)} = 1.\\)\nб) Найдите все корни этого уравнения, принадлежащие отрезку  \\(\\left[ -\\frac{3\\pi}{2}; -\\frac{\\pi}{2} \\right].\\)", "o": "1. Формула приведения: \\(\\sin(2x - \\pi) = -\\sin 2x\\)\n2. ОДЗ: \\(-\\sin 2x \\neq 0\\)\n3. Домножим на \\(-\\sin 2x \\neq 0\\) - уравнение принимает вид:\n\\(4 \\sin^3 x - 2 \\sin x = -\\sin 2x\\)\n4. Формулы \\(\\sin 2x = 2 \\sin x \\cos x\\) и  \\(\\sin^2 x = 1 - \\cos^2 x\\)  + ГРУППИРОВКА\n5. Проверка ОДЗ", "a": "a) \\( \\pm \\frac{2\\pi}{3} + 2\\pi k, \\, k \\in \\mathbb{Z} \\)<br>б) \\( -\\frac{8\\pi}{3}; \\, -\\frac{4\\pi}{3}; \\, -\\frac{2\\pi}{3} \\)", "ap": "a) \\( \\pm \\frac{2\\pi}{3} + 2\\pi k, \\, k \\in \\mathbb{Z} \\)\nб) \\( -\\frac{8\\pi}{3}; \\, -\\frac{4\\pi}{3}; \\, -\\frac{2\\pi}{3} \\)"}],TH="📌РАЗДЕЛ 01 – ЗАМЕНА ПЕРЕМЕННОЙ <br>Основные замены:<br>\\( t = \\sin x \\), \\(\\quad t = \\cos x \\) \\(\\quad \\quad ( t \\in [-1;1] \\))<br>\\( t = tg x \\) \\(\\quad \\quad (x \\neq \\frac{\\pi}{2} + \\pi k \\))<br>\\( t = ctg x \\) \\( \\quad \\quad (x \\neq \\pi k \\))<br>\\( t = a^x \\) \\(\\quad  \\quad  ( t &gt; 0 \\))<br>\\( t = \\log_a x \\) \\(\\quad  \\quad  ( x &gt; 0, a &gt; 0, a \\neq 1 \\))<br>\\( t = \\sqrt{f(x)} \\) \\(\\quad  \\quad  ( t \\ge 0 \\))<br>====================================================<br>📌РАЗДЕЛ 02 – ФОРМУЛЫ ПРИВЕДЕНИЯ <br>Если добавочка на окружности сверху-снизу, то  функцию меняем на ко-функцию<br>\\(sin\\) на \\(cos\\)  и \\(tg\\) на \\(ctg\\)<br>Знак определяем по квадранту «хозяина»<br>====================================================<br>📌РАЗДЕЛ 03 – ДВОЙНЫЕ УГЛЫ<br>\\( \\sin 2\\alpha = 2\\sin\\alpha\\cos\\alpha \\)<br>\\( \\cos 2\\alpha = \\cos^2\\alpha - \\sin^2\\alpha = 2\\cos^2\\alpha - 1 = 1 - 2\\sin^2\\alpha \\)<br>\\( tg 2\\alpha = \\frac{\\sin 2\\alpha}{\\cos 2\\alpha} \\) (при \\( \\alpha \\neq \\frac{\\pi}{4} + \\frac{\\pi k}{2} \\))<br>\\( ctg 2\\alpha = \\frac{\\cos 2\\alpha}{\\sin 2\\alpha} \\) (при \\( \\alpha \\neq \\frac{\\pi k}{2} \\))<br>Понижение степени:<br>\\( \\sin^2\\alpha = \\frac{1 - \\cos 2\\alpha}{2} \\)<br>\\( \\cos^2\\alpha = \\frac{1 + \\cos 2\\alpha}{2} \\)<br>====================================================<br>📌РАЗДЕЛ 04 – ЧЁТНОСТЬ<br>\\( \\sin(-x) = -\\sin x \\) – нечётная функция<br>\\( \\cos(-x) = \\cos x \\) – чётная функция<br>\\( tg(-x) = -tg x \\) – нечётная функция<br>\\( ctg(-x) = -ctg x \\) – нечётная функция<br>====================================================<br>📌  РАЗДЕЛ 05 – СИНУС СУММЫ И РАЗНОСТИ<br>\\( \\sin(\\alpha \\pm \\beta) = \\sin\\alpha\\cos\\beta \\pm \\cos\\alpha\\sin\\beta \\)<br>\\( \\cos(\\alpha \\pm \\beta) = \\cos\\alpha\\cos\\beta \\mp \\sin\\alpha\\sin\\beta \\)<br>====================================================<br>📌  РАЗДЕЛ 06 – РАЗНОСТЬ И СУММА ТРИГОНОМЕТРИЧЕСКИХ ФУНКЦИЙ <br>(на егэ ни разу не встречалась):<br>\\( \\sin\\alpha + \\sin\\beta = 2\\sin\\frac{\\alpha+\\beta}{2}\\cos\\frac{\\alpha-\\beta}{2} \\)<br>\\( \\sin\\alpha - \\sin\\beta = 2\\cos\\frac{\\alpha+\\beta}{2}\\sin\\frac{\\alpha-\\beta}{2} \\)<br>\\( \\cos\\alpha + \\cos\\beta = 2\\cos\\frac{\\alpha+\\beta}{2}\\cos\\frac{\\alpha-\\beta}{2} \\)<br>\\( \\cos\\alpha - \\cos\\beta = -2\\sin\\frac{\\alpha+\\beta}{2}\\sin\\frac{\\alpha-\\beta}{2} \\)<br>====================================================<br>📌 РАЗДЕЛ 07 – ГРУППИРОВКА<br>(Помимо просто вынесения обзего множителя за скобку  используем ФОРМУЛЫ СОКРАЩЕННОГО УМНОЖЕНИЯ-  появляются новые общие множители):<br>\\( a^2 - b^2 = (a-b)(a+b) \\)<br>\\( a^3 \\pm b^3 = (a \\pm b)(a^2 \\mp ab + b^2) \\)<br>====================================================<br>📌 РАЗДЕЛ 08 – ДОПОЛНИТЕЛЬНЫЙ АРГУМЕНТ<br>\\( a\\sin x + b\\cos x = c\\neq 0 \\quad \\quad \\) делим на \\( R = \\sqrt{a^2+b^2} \\)<br>\\( \\frac{a}{R}\\sin x + \\frac{b}{R}\\cos x = \\frac{c}{R}\\)<br>Получаем уравнение: \\( \\sin(x+\\varphi) = \\frac{c}{R} \\), <br>где \\(  \\cos\\varphi = \\frac{a}{R} \\), \\( \\sin\\varphi = \\frac{b}{R} \\)<br>Откуда: \\( x = -\\varphi + arcsin(\\frac{c}{R})+2\\pi k \\),  \\( x = \\pi-(-\\varphi + arcsin(\\frac{c}{R}))+2\\pi k \\)<br>====================================================<br>РАЗДЕЛ 09 – ОДЗ <br>   Подкоренное выражение \\( \\ge 0 \\)<br>   Знаменатель \\( \\neq 0 \\)<br>   Логарифм: степень \\( &gt; 0 \\), основание логарифма \\( &gt;0, \\neq 1 \\)<br>   \\( tg x \\) определён при \\( \\cos x \\neq 0 \\)<br>   \\( ctg x \\) определён при \\( \\sin x \\neq 0 \\)<br>====================================================<br>РАЗДЕЛ 10 – ПОКАЗАТЕЛЬНЫЕ УРАВНЕНИЯ<br>\\( a^x a^y = a^{x+y} \\quad \\) \\( a^{x+y}=a^x a^y \\)<br>\\( \\frac{a^x}{a^y} = a^{x-y} \\quad \\quad \\) \\( a^{x-y}=\\frac{a^x}{a^y}\\) <br>\\( (a^x)^y = a^{xy} \\) <br>\\( (ab)^x = a^x b^x \\quad\\)\\( a^x b^x =(ab)^x \\quad \\)<br>\\( \\left(\\frac{a}{b}\\right)^x = \\frac{a^x}{b^x} \\quad \\quad \\) \\( \\frac{a^x}{b^x} =\\left(\\frac{a}{b}\\right)^x \\)<br>\\( a^0 = 1 \\) (при \\( a \\neq 0 \\)) <br>\\( a^{-1} = \\frac{1}{a} \\) (при \\( a \\neq 0 \\))\\(\\quad \\quad a^{-x} = \\frac{1}{a^x} \\) (при \\( a \\neq 0 \\))<br>====================================================<br>РАЗДЕЛ 11 – ОДНОРОДНЫЕ УРАВНЕНИЯ<br>Тригонометрические однородные:<br>📍Однородное первой степени: <br>   \\( a\\sin x + b\\cos x = 0 \\) → делим на \\( \\cos x \\), получаем \\( a\\cdot tg x + b = 0 \\).<br><br>📍Однородное первой степени: <br>   \\( a\\sin x + b\\cos x = c \\neq 0 \\) → метод доп. аргумента (п.8)<br><br>📍Однородное второй степени: <br>   \\( a\\sin^2 x + b\\sin x\\cos x + c\\cos^2 x = 0 \\) → делим на \\( \\cos^2 x \\), получаем \\( a\\cdot tg^2 x + b\\cdot tg x + c = 0 \\). <br>   Делаем замену : \\(t=tg x\\)<br><br>📍Однородное второй степени: <br>   \\( a\\sin^2 x + b\\sin x\\cos x + c\\cos^2 x = d \\neq 0 \\) → <br>   Рассматриваем отдельно случай: \\( \\cos^2 x = 0 \\rightarrow\\) \\( a\\sin^2 x = d \\neq 0 \\)<br>   Рассматриваем случай \\( \\cos^2 x \\neq 0\\) : делим на  \\( \\cos^2 x\\)<br>   Используя формулу  \\(tg^2 x + 1 = \\frac{1}{\\cos^2 x}\\),  получаем \\( a\\cdot tg^2 x + b\\cdot tg x + c = d\\cdot( tg^2 x + 1)  \\).<br>   Делаем замену : \\(t=tg x\\)<br><br>Показательные однородные:<br>📍 Уравнение вида \\( a \\cdot A^{f(x)} + b \\cdot (A \\cdot B)^{f(x)} + c \\cdot B^{f(x)} = 0 \\)<br>   Делим на \\( B^{f(x)} &gt;0\\), затем делаем замену \\( t = \\left(\\frac{A}{B}\\right)^{f(x)} \\), где \\( t &gt; 0 \\).<br>   Пример: \\( 4^x - 5 \\cdot 6^x + 6 \\cdot 9^x = 0 \\) → делим на \\( 9^x \\), получаем \\( \\left(\\frac{4}{9}\\right)^x - 5\\left(\\frac{2}{3}\\right)^x + 6 = 0 \\), затем замена \\( t = \\left(\\frac{2}{3}\\right)^x \\).<br>====================================================<br>РАЗДЕЛ 12 – ЛОГАРИФМИЧЕСКИЕ УРАВНЕНИЯ<br>Определение: \\( \\log_a b = c \\Leftrightarrow b = a^c \\) (\\( a&gt;0, a\\neq 1, b&gt;0 \\))<br>Свойства: <br>\\( \\log_a (bc) = \\log_a |b| + \\log_a |c| \\) <br>\\( \\log_a \\left(\\frac{b}{c}\\right) = \\log_a |b| - \\log_a |c| \\) <br>⚡ Если даже \\( bc &gt; 0  \\), сами  \\( b \\) и \\( c \\) не обязаны быть положительными, <br>поэтому СТАВИМ МОДУЛИ, а потом смотрим все ограничения, сделанные выше, и ищем повод убрать модуль.<br><br>\\( \\log_a b^c = c \\log_a |b| \\) <br>\\( \\log_{a^k} b = \\frac{1}{k} \\log_{|a|} b \\) <br>⚡для чётных \\( k \\) модуль обязателен; для нечётных можно без модуля<br><br>\\( \\log_a b = \\frac{\\log_c b}{\\log_c a} \\) (переход к новому основанию)<br>\\( a^{\\log_a b} = b \\) (основное логарифмическое тождество)<br>\\( \\log_a b \\cdot \\log_b c = \\log_a c \\) («транзит» )<br>\\( \\log_a b = \\frac{1}{\\log_b a} \\) (при \\( a &gt; 0, a \\neq 1, b &gt; 0, b \\neq 1 \\)) («переворот»:)<br>⚡При перевороте \\( \\log_a b \\) нужно проверить, что \\( b \\neq 1 \\). Иначе происходит переворот НУЛЯ!<br>====================================================<br>РАЗДЕЛ 13 – ИРРАЦИОНАЛЬНЫЕ УРАВНЕНИЯ<br>📍 Избавление от иррациональности <br>\\( \\sqrt{A} = B \\Leftrightarrow (B \\ge 0) \\text{ и } (A = B^2)\\)<br>\\( B^2\\ge 0\\rightarrow\\) ограничение на подкоренное выражение \\(A\\ge0\\) выполнится автоматически<br><br>\\( \\sqrt{A} = \\sqrt{B} \\Leftrightarrow (A = B) \\text{ и } (A \\ge 0\\)  или \\(B \\ge 0) \\)  <br>Достаточно одного ограничения, поскольку потом мы эти выражения приравняем друг к другу<br><br>📍 Свойства корней:<br>\\( \\sqrt{a^2} = |a| \\)<br>\\( \\sqrt[n]{ab} = \\sqrt[n]{|a|}\\sqrt[n]{|b|} \\) (для чётных n)<br>\\( \\sqrt[n]{ab} = \\sqrt[n]{a}\\sqrt[n]{b} \\) (для нечётных n)<br><br>\\( \\sqrt[n]{\\frac{a}{b}} = \\frac{\\sqrt[n]{|a|}}{\\sqrt[n]{|b|}} \\) (для чётных n)<br>\\( \\sqrt[n]{\\frac{a}{b}} = \\frac{\\sqrt[n]{a}}{\\sqrt[n]{b}} \\) (для нечётных n)<br>====================================================<br>РАЗДЕЛ 14 – МЕТОД ОЦЕНКИ<br>С помощью оценивания левой и правой части уравнения неравенствами надо показать, что решения у уравнения есть только при равенстве левой и правой частей, иначе решений нет.<br>Для оценивания используем свойства функций:<br>\\( \\sin x \\le 1, \\cos x \\le 1, \\sin x \\ge -1, \\cos x \\ge -1 \\)<br>\\( a^x &gt; 0 \\)<br>\\( \\sqrt{f(x)} \\ge 0 \\)<br>\\( |f(x)| \\ge 0 \\)<br>\\( f^2(x) \\ge 0 \\)<br>====================================================<br> РАЗДЕЛ 15. ОБЩИЕ ПОДХОДЫ К РЕШЕНИЮ И ЛОВУШКИ<br>⚡ Cначала находим ОДЗ (если это не слишком громоздко), или запоминаем ограничения для последующей проверки, или ищем момент, когда они выполняются автоматически.<br>⚡ Если есть повторяющаяся часть – замена  переменной.<br>⚡ Для уравнений с модулем: \\(|f(x)| = g(x) \\rightarrow f(x) = \\pm g(x)\\)  и \\(g(x) \\ge0\\).<br>⚡ Для уравнений с корнем: \\(\\sqrt{f(x)} = g(x) \\rightarrow f(x) = g^2{(x)}\\)  и \\(g(x) \\ge0\\).<br><br>ТРИГОНОМЕТРИЧЕСКИЕ УРАВНЕНИЯ<br>⚡ Если тригонометрическое с разными аргументами – приводим к одному аргументу с помощью формул приведения, двойных углов, суммы/разности.<br>⚡ По возможности приводим к одной функции, чтобы сделать замену (с помощью ОТТ - только для функций в квадрате). <br>      \\( t = \\sin x \\) или \\( t = \\cos x \\). Помним, что \\( t \\in [-1;1] \\) – корни вне этого промежутка отбрасываем.<br>⚡ Если привести к одному аргументу не получатеся (есть линейное присутствие и синуса, и косинуса) – решаем как однородное или с помощью доп.аргумента<br>⚡ В однородных уравнениях, если делим на \\( \\cos x \\), сначала проверяем случай, когда  \\( \\cos x = 0 \\).<br><br>ПОКАЗАТЕЛЬНЫЕ УРАВНЕНИЯ<br>⚡ Приводим по возможности к одному основанию, делаем замену \\( t = a^x \\), помним, что \\( t &gt; 0 \\) – отрицательные корни отбрасываем.<br>⚡ Если привести к одному основанию не получатеся, делаем группировку  либо решаем делением на одну из степеней с дальнейшей заменой (как однородное). <br>⚡ В однородных показательных уравнениях деление на степень безопасно, так как степень &gt; 0<br>⚡ Если уравнение показательно-степенное (переменная и в основании степени, и в показателе), берем логарифм от обеих частей по удобному основанию. <br>      Показатели степеней в логарифмах можно выносить вперед как множители, избавляясь от многоэатжности.<br><br>ЛОГАРИФМИЧЕСКИЕ УРАВНЕНИЯ<br>⚡ Пользуемся определением логарифма<br>⚡ Делаем замену<br>⚡ Приводим к одному основанию, используя логарифмирование чисел, формулы суммы/разности логарифмов, «транзит», «переворот»… Затем пытаемся «скинуть» логарифмы.<br><br>СМЕШАННЫЕ УРАВНЕНИЯ<br>⚡ Если левая и правая части имеют очевидные ограничения, применяем метод оценки.<br>====================================================<br>⚡ При отборе тригонометрических корней с периодами, отличными от \\(\\pi\\) и \\(\\frac{\\pi}{2}\\) (и аналогичных им) – пользуемся двойным неравенством<br>⚡ При отборе не тригонометрических корней используем цепочки неравенств <br>⚡ После получения ответа ОБЯЗАТЕЛЬНО делаем ПРОВЕРКУ  подстановкой";
