6 + 288 = 1584 \\) тыс. руб."}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> 1 584 000 рублей."}], "byClaude": true, "lvl": 1}, {"id": 1791827869826, "title": "19.0.", "sectionName": "5 - ДИФПЛАТЕЖИ - НЕФОРМАТ", "difficulty": "basic", "taskText": "В июле 2028 года планируется взять кредит в банке на сумму 40 млн руб. на 4 года.\r\nУсловия его возврата таковы:\r\n--- каждый январь долг возрастает на \\(r\\%\\) по сравнению с концом предыдущего года;\r\n--- с февраля по июнь каждого года необходимо выплатить часть долга;\r\n--- в июле 2029, 2030 и 2031 годов долг должен быть на 25\\% меньше долга на июнь предыдущего года;\r\n--- в июле 2032 года долг должен быть полностью погашен.\r\nИзвестно, что общая сумма выплат по кредиту составила 61,875 млн руб. Найдите \\(r\\).", "taskImage": "", "answerText": "\\(\\textbf{Ответ:} 20.\\)", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 40 \\) млн руб. — сумма кредита.\nСрок кредита: 4 года (2029–2032).\nПроценты: \\( r\\% \\), \\( a = \\frac{r}{100} \\).\nВ июле 2029, 2030, 2031 гг. долг на 25% меньше долга годом раньше (умножается на 0,75).\n\u003cb>Общая сумма выплат\u003c/b> = 61,875 млн руб.\n\n\u003cstrong>Найти:\u003c/strong> \\( r \\).\n\n\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>3\u003c/th>\u003cth>4\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления процентов (млн руб.)\u003c/td>\u003ctd>\\( 40 \\)\u003c/td>\u003ctd>\\( 30 \\)\u003c/td>\u003ctd>\\( 22{,}5 \\)\u003c/td>\u003ctd>\\( 16{,}875 \\)\u003c/td>\u003c/tr>\n\u003c/table>\n\\( 40 \\cdot 0{,}75 = 30;\\quad 30 \\cdot 0{,}75 = 22{,}5;\\quad 22{,}5 \\cdot 0{,}75 = 16{,}875 \\)\n\n\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>3\u003c/th>\u003cth>4\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Сумма в счет погашения тела кредита (млн руб.)\u003c/td>\u003ctd>\\( 10 \\)\u003c/td>\u003ctd>\\( 7{,}5 \\)\u003c/td>\u003ctd>\\( 5{,}625 \\)\u003c/td>\u003ctd>\\( 16{,}875 \\)\u003c/td>\u003c/tr>\n\u003c/table>\nПРОВЕРКА: КРЕДИТ \\( S = 10 + 7{,}5 + 5{,}625 + 16{,}875 = 40 \\) – ВЕРНО\n\n\u003cB>ПЛАТЕЖИ:\u003c/B>\n\\(П_i\\)=Часть долга (из таблицы 1) + процент с долга (из таблицы 2)\n\n\\(П_1=10+a(40)\\)\n\\(П_2=7{,}5+a(30)\\)\n\\(П_3=5{,}625+a(22{,}5)\\)\n\\(П_4=16{,}875+a(16{,}875)\\)\n\n\u003cB>ОБЩАЯ СУММА ВЫПЛАТ \\(\\sum\\) = КРЕДИТ + ПРОЦЕНТЫ(ПЕРЕПЛАТА)\u003c/B>\n\\(\\sum = 40 + a(40 + 30 + 22{,}5 + 16{,}875) = 61{,}875 \\)\n\\( 40 + 109{,}375a = 61{,}875 \\)\n\\( a = \\frac{21{,}875}{109{,}375} = 0{,}2 = \\frac{r}{100} \\)\n\\( r = 20\\% \\)\n\n\u003cstrong>Ответ:\u003c/strong> \\( r = 20\\% \\).", "solutionImage": "", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 40 \\) млн руб. — сумма кредита.\nСрок кредита: 4 года (2029–2032).\nПроценты: \\( r\\% \\), \\( a = \\frac{r}{100} \\).\nВ июле 2029, 2030, 2031 гг. долг на 25% меньше долга годом раньше (умножается на 0,75).\n\u003cb>Общая сумма выплат\u003c/b> = 61,875 млн руб.\n\n\u003cstrong>Найти:\u003c/strong> \\( r \\)."}, {"d": "Составляем таблицу 2: долг до начисления процентов (её удобнее заполнить первой)", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>3\u003c/th>\u003cth>4\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления процентов (млн руб.)\u003c/td>\u003ctd>\\( 40 \\)\u003c/td>\u003ctd>\\( 30 \\)\u003c/td>\u003ctd>\\( 22{,}5 \\)\u003c/td>\u003ctd>\\( 16{,}875 \\)\u003c/td>\u003c/tr>\n\u003c/table>\n\\( 40 \\cdot 0{,}75 = 30;\\quad 30 \\cdot 0{,}75 = 22{,}5;\\quad 22{,}5 \\cdot 0{,}75 = 16{,}875 \\)"}, {"d": "Восстанавливаем таблицу 1: суммы в счёт погашения тела кредита", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>3\u003c/th>\u003cth>4\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Сумма в счет погашения тела кредита (млн руб.)\u003c/td>\u003ctd>\\( 10 \\)\u003c/td>\u003ctd>\\( 7{,}5 \\)\u003c/td>\u003ctd>\\( 5{,}625 \\)\u003c/td>\u003ctd>\\( 16{,}875 \\)\u003c/td>\u003c/tr>\n\u003c/table>\nПРОВЕРКА: КРЕДИТ \\( S = 10 + 7{,}5 + 5{,}625 + 16{,}875 = 40 \\) – ВЕРНО"}, {"d": "Записываем платежи", "res": "\u003cB>ПЛАТЕЖИ:\u003c/B>\n\\(П_i\\)=Часть долга (из таблицы 1) + процент с долга (из таблицы 2)\n\n\\(П_1=10+a(40)\\)\n\\(П_2=7{,}5+a(30)\\)\n\\(П_3=5{,}625+a(22{,}5)\\)\n\\(П_4=16{,}875+a(16{,}875)\\)"}, {"d": "Записываем общую сумму выплат и находим r", "res": "\u003cB>ОБЩАЯ СУММА ВЫПЛАТ \\(\\sum\\) = КРЕДИТ + ПРОЦЕНТЫ(ПЕРЕПЛАТА)\u003c/B>\n\\(\\sum = 40 + a(40 + 30 + 22{,}5 + 16{,}875) = 61{,}875 \\)\n\\( 40 + 109{,}375a = 61{,}875 \\)\n\\( a = \\frac{21{,}875}{109{,}375} = 0{,}2 = \\frac{r}{100} \\)\n\\( r = 20\\% \\)"}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> \\( r = 20\\% \\)."}], "byClaude": true, "lvl": 1}, {"id": 1791323639168, "title": "40 аналог", "sectionName": "5 - ДИФПЛАТЕЖИ - НЕФОРМАТ", "difficulty": "basic", "taskText": "\u003ca href=\"https://3.shkolkovo.online/catalog/4162/72048 \" target=\"_blank\">🔍 АНАЛОГ  72048 \u003c/a>\nВ октябре 2027 года Анна планирует взять кредит в банке на 7 лет в размере 4350 тыс. рублей. Условия его возврата таковы:\n- в январе каждого года действия кредита долг увеличивается на 10% от суммы долга на конец предыдущего года;\n- в период с февраля по сентябрь необходимо выплатить часть долга;\n- в октябре каждого года в первые пять лет действия кредита (2028–2032 гг.) долг должен быть на одну и ту же сумму меньше долга на октябрь предыдущего года;\n- в 2033 и 2034 годах выплаты по кредиту равны;\n- к октябрю 2034 года кредит должен быть полностью погашен.\nИзвестно, что общая сумма выплат по кредиту должна составить 6025 тыс. рублей. Сколько рублей составит выплата 2031 года?", "taskImage": "", "answerText": "897000", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 4350 \\) тыс. руб. — сумма кредита.\nСрок кредита: 7 лет (2028–2034).\nПроценты: 10%, \\( a = 0{,}1 \\), множитель \\( \\frac{11}{10} \\).\n2028–2032: долг уменьшается на одну и ту же величину \\( x \\).\n2033, 2034: равные выплаты \\( Y \\).\n\u003cb>Общая сумма выплат\u003c/b> = 6025 тыс. руб.\n\n\u003cstrong>Найти:\u003c/strong> выплату 2031 года.\n\n\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>2028\u003c/th>\u003cth>2029\u003c/th>\u003cth>2030\u003c/th>\u003cth>2031\u003c/th>\u003cth>2032\u003c/th>\u003cth>2033–2034\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Сумма в счет погашения тела кредита\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>остаток \\( R = 4350 - 5x \\)\u003c/td>\u003c/tr>\n\u003c/table>\n\n\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>2028\u003c/th>\u003cth>2029\u003c/th>\u003cth>2030\u003c/th>\u003cth>2031\u003c/th>\u003cth>2032\u003c/th>\u003cth>2033\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления\u003c/td>\u003ctd>\\( 4350 \\)\u003c/td>\u003ctd>\\( 4350 - x \\)\u003c/td>\u003ctd>\\( 4350 - 2x \\)\u003c/td>\u003ctd>\\( 4350 - 3x \\)\u003c/td>\u003ctd>\\( 4350 - 4x \\)\u003c/td>\u003ctd>\\( R \\)\u003c/td>\u003c/tr>\n\u003c/table>\n\n\u003cB>ПЛАТЕЖИ:\u003c/B>\n\\(П_1 = x + 0{,}1 \\cdot 4350\\)\n\\(П_2 = x + 0{,}1(4350 - x)\\)\n\\(П_3 = x + 0{,}1(4350 - 2x)\\)\n\\(П_4 = x + 0{,}1(4350 - 3x)\\)\n\\(П_5 = x + 0{,}1(4350 - 4x)\\)\n\\(П_6 = П_7 = Y\\): \\( (R \\cdot \\frac{11}{10} - Y) \\cdot \\frac{11}{10} - Y = 0 \\)\nДомножаем на 100: \\( 121R = 210Y \\rightarrow 2Y = \\frac{121R}{105} \\)\n\n\\(\\sum = 5x + 0{,}1(5 \\cdot 4350 - 10x) + \\frac{121(4350 - 5x)}{105} = 6025 \\)\n\\( 4x + 2175 + \\frac{121(4350 - 5x)}{105} = 6025 \\)\n\n\\( 420x + 228375 + 526350 - 605x = 632625 \\)\n\\( 185x = 122100 \\rightarrow x = 660 \\)\n\n\\(П_4 = 660 + 0{,}1(4350 - 1980) = 660 + 237 = 897 \\) тыс. руб.\n\n\u003cstrong>Ответ:\u003c/strong> 897 000 рублей.", "solutionImage": "", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 4350 \\) тыс. руб. — сумма кредита.\nСрок кредита: 7 лет (2028–2034).\nПроценты: 10%, \\( a = 0{,}1 \\), множитель \\( \\frac{11}{10} \\).\n2028–2032: долг уменьшается на одну и ту же величину \\( x \\).\n2033, 2034: равные выплаты \\( Y \\).\n\u003cb>Общая сумма выплат\u003c/b> = 6025 тыс. руб.\n\n\u003cstrong>Найти:\u003c/strong> выплату 2031 года."}, {"d": "Составляем таблицу 1: суммы в счёт погашения тела кредита", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>2028\u003c/th>\u003cth>2029\u003c/th>\u003cth>2030\u003c/th>\u003cth>2031\u003c/th>\u003cth>2032\u003c/th>\u003cth>2033–2034\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Сумма в счет погашения тела кредита\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>остаток \\( R = 4350 - 5x \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Составляем таблицу 2: долг до начисления процентов", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>2028\u003c/th>\u003cth>2029\u003c/th>\u003cth>2030\u003c/th>\u003cth>2031\u003c/th>\u003cth>2032\u003c/th>\u003cth>2033\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления\u003c/td>\u003ctd>\\( 4350 \\)\u003c/td>\u003ctd>\\( 4350 - x \\)\u003c/td>\u003ctd>\\( 4350 - 2x \\)\u003c/td>\u003ctd>\\( 4350 - 3x \\)\u003c/td>\u003ctd>\\( 4350 - 4x \\)\u003c/td>\u003ctd>\\( R \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Записываем платежи", "res": "\u003cB>ПЛАТЕЖИ:\u003c/B>\n\\(П_1 = x + 0{,}1 \\cdot 4350\\)\n\\(П_2 = x + 0{,}1(4350 - x)\\)\n\\(П_3 = x + 0{,}1(4350 - 2x)\\)\n\\(П_4 = x + 0{,}1(4350 - 3x)\\)\n\\(П_5 = x + 0{,}1(4350 - 4x)\\)\n\\(П_6 = П_7 = Y\\): \\( (R \\cdot \\frac{11}{10} - Y) \\cdot \\frac{11}{10} - Y = 0 \\)\nДомножаем на 100: \\( 121R = 210Y \\rightarrow 2Y = \\frac{121R}{105} \\)"}, {"d": "Записываем общую сумму выплат", "res": "\\(\\sum = 5x + 0{,}1(5 \\cdot 4350 - 10x) + \\frac{121(4350 - 5x)}{105} = 6025 \\)\n\\( 4x + 2175 + \\frac{121(4350 - 5x)}{105} = 6025 \\)"}, {"d": "Избавляемся от знаменателя: домножаем на 105", "res": "\\( 420x + 228375 + 526350 - 605x = 632625 \\)\n\\( 185x = 122100 \\rightarrow x = 660 \\)"}, {"d": "Считаем выплату 2031 года", "res": "\\(П_4 = 660 + 0{,}1(4350 - 1980) = 660 + 237 = 897 \\) тыс. руб."}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> 897 000 рублей."}], "byClaude": true, "lvl": 1}, {"id": 1791323742673, "title": "40 аналог", "sectionName": "5 - ДИФПЛАТЕЖИ - НЕФОРМАТ", "difficulty": "basic", "taskText": "\u003ca href=\" https://3.shkolkovo.online/old-catalog/math/slozhnye_zadachi_prikladnogo_haraktera/pro_bankovskij_kredit_drugie_shemy_platezhej/page-3\" target=\"_blank\">🔍 АНАЛОГ  2838\u003c/a>\nВ связи с невозможностью полностью оплатить свое обучение, семья Коли была вынуждена взять кредит на 4 года, чтобы оплатить последние 2 года его обучения. Условия пользования кредитом таковы:\n– пока Коля учится, гасить кредит не нужно, но за пользование кредитом банк начисляет проценты;\n– каждый год в течение обучения Коли банк перечисляет на счет Образовательного учреждения сумму, равную сумме годового обучения в Образовательном учреждении;\n– один раз в конце каждого года в течение времени пользования кредитом банк начисляет целое кратное десяти число \\( y \\) процентов на сумму, которую на данный момент семья Коли должна банку;\n– по окончании обучения семья Коли обязана начать выплачивать кредит равными ежегодными платежами после начисления процентов.\nНайдите наибольшее возможное число \\( y \\), чтобы общая переплата по кредиту не превысила 40% от стоимости кредита.", "taskImage": "", "answerText": "10", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\n\\( T \\) — стоимость одного года обучения (банк перечисляет её 2 раза).\nСтоимость кредита \\( = 2T \\).\n\\( y\\% \\) — ставка, \\( y \\) кратно 10; \\( a = 1 + \\frac{y}{100} \\).\nГоды 1–2: Коля учится, проценты начисляются, платежей нет.\nГоды 3–4: два равных платежа \\( x \\).\nПереплата \\( \\le 40\\% \\) от \\( 2T \\), т.е. общая сумма выплат \\( 2x \\le 1{,}4 \\cdot 2T \\).\n\u003cstrong>Найти:\u003c/strong> наибольшее \\( y \\).\n\n\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг на конец года (после начисления и платежа)\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( T \\cdot a \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (T \\cdot a + T) \\cdot a = T(a^2 + a) \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( T(a^2 + a) \\cdot a - x \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\\( (T(a^2 + a) \\cdot a - x) \\cdot a - x = 0 \\) – ИТОГОВОЕ УРАВНЕНИЕ\u003c/td>\u003c/tr>\n\u003c/table>\n\n\\( T(a^2 + a) \\cdot a^2 - x \\cdot a - x = 0 \\)\n\\( x(a + 1) = T \\cdot a^3 (a + 1) \\)\n\\( x = T \\cdot a^3 \\)\n\n\\( 2x \\le 1{,}4 \\cdot 2T \\)\n\\( 2T a^3 \\le 2{,}8T \\)\n\\( a^3 \\le 1{,}4 \\)\n\n\\( y = 10\\%: \\quad a^3 = 1{,}1^3 = 1{,}331 \\le 1{,}4 \\) — подходит.\n\\( y = 20\\%: \\quad a^3 = 1{,}2^3 = 1{,}728 > 1{,}4 \\) — не подходит.\nЗначит, наибольшее \\( y = 10 \\).\n\n\u003cstrong>Ответ:\u003c/strong> 10.", "solutionImage": "", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( T \\) — стоимость одного года обучения (банк перечисляет её 2 раза).\nСтоимость кредита \\( = 2T \\).\n\\( y\\% \\) — ставка, \\( y \\) кратно 10; \\( a = 1 + \\frac{y}{100} \\).\nГоды 1–2: Коля учится, проценты начисляются, платежей нет.\nГоды 3–4: два равных платежа \\( x \\).\nПереплата \\( \\le 40\\% \\) от \\( 2T \\), т.е. общая сумма выплат \\( 2x \\le 1{,}4 \\cdot 2T \\).\n\u003cstrong>Найти:\u003c/strong> наибольшее \\( y \\)."}, {"d": "Составляем таблицу долга по годам", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг на конец года (после начисления и платежа)\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( T \\cdot a \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (T \\cdot a + T) \\cdot a = T(a^2 + a) \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( T(a^2 + a) \\cdot a - x \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\\( (T(a^2 + a) \\cdot a - x) \\cdot a - x = 0 \\) – ИТОГОВОЕ УРАВНЕНИЕ\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Раскрываем скобки и выражаем платёж x", "res": "\\( T(a^2 + a) \\cdot a^2 - x \\cdot a - x = 0 \\)\n\\( x(a + 1) = T \\cdot a^3 (a + 1) \\)\n\\( x = T \\cdot a^3 \\)"}, {"d": "Составляем неравенство по условию на переплату", "res": "\\( 2x \\le 1{,}4 \\cdot 2T \\)\n\\( 2T a^3 \\le 2{,}8T \\)\n\\( a^3 \\le 1{,}4 \\)"}, {"d": "Перебираем y, кратные 10", "res": "\\( y = 10\\%: \\quad a^3 = 1{,}1^3 = 1{,}331 \\le 1{,}4 \\) — подходит.\n\\( y = 20\\%: \\quad a^3 = 1{,}2^3 = 1{,}728 > 1{,}4 \\) — не подходит.\nЗначит, наибольшее \\( y = 10 \\)."}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> 10."}], "byClaude": true, "lvl": 2}, {"id": 1791319872412, "title": "16205 аналог ", "sectionName": "5 - ДИФПЛАТЕЖИ - НЕФОРМАТ", "difficulty": "basic", "taskText": "\u003ca href=\" https://3.shkolkovo.online/catalog/172/1075\" target=\"_blank\">🔍 АНАЛОГ 1075\u003c/a> ТАБЛИЦА УЖЕ С  ПРОЦЕНТОМ\nВ начале марта в банке был взят кредит на 6 месяцев на следующих условиях:\n— 13 числа каждого месяца, начиная с марта, на текущий долг начисляется некоторое количество процентов;\n— с 14 по 29 числа каждого месяца заемщик обязан внести платеж в счет погашения кредита так, чтобы сумма долга на 13 число каждого месяца удовлетворяла следующей таблице:\n\u003ctable>\n\u003ctr>\u003cth>Дата\u003c/th>\u003cth>13.03\u003c/th>\u003cth>13.04\u003c/th>\u003cth>13.05\u003c/th>\u003cth>13.06\u003c/th>\u003cth>13.07\u003c/th>\u003cth>13.08\u003c/th>\u003cth>13.09\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг\u003c/td>\u003ctd>\\( 1,1A \\)\u003c/td>\u003ctd>\\( 0,935A \\)\u003c/td>\u003ctd>\\( 0,77A \\)\u003c/td>\u003ctd>\\( 0,66A \\)\u003c/td>\u003ctd>\\( 0,44A \\)\u003c/td>\u003ctd>\\( 0,165A \\)\u003c/td>\u003ctd>\\( 0 \\)\u003c/td>\u003c/tr>\n\u003c/table>\nгде \\( A \\) – сумма, взятая в кредит.\nОпределите наибольший месячный платеж по такому кредиту, если известно, что переплата по кредиту составила 111000 рублей.", "taskImage": "", "answerText": "87000", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\n\\( A \\) — сумма кредита, срок 6 месяцев.\n❗ В таблице долг на 13-е число — \u003cb>УЖЕ ПОСЛЕ начисления процентов\u003c/b>: 13.03 долг \\( = 1{,}1A \\Rightarrow \\) ставка 10%, \\( a = 0{,}1 \\).\nПереплата = 111 000 руб.\n\n\u003cstrong>Найти:\u003c/strong> наибольший месячный платёж.\n\n\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>март\u003c/th>\u003cth>апр\u003c/th>\u003cth>май\u003c/th>\u003cth>июнь\u003c/th>\u003cth>июль\u003c/th>\u003cth>авг\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления процентов\u003c/td>\u003ctd>\\( A \\)\u003c/td>\u003ctd>\\( 0{,}85A \\)\u003c/td>\u003ctd>\\( 0{,}7A \\)\u003c/td>\u003ctd>\\( 0{,}6A \\)\u003c/td>\u003ctd>\\( 0{,}4A \\)\u003c/td>\u003ctd>\\( 0{,}15A \\)\u003c/td>\u003c/tr>\n\u003c/table>\n\n\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>март\u003c/th>\u003cth>апр\u003c/th>\u003cth>май\u003c/th>\u003cth>июнь\u003c/th>\u003cth>июль\u003c/th>\u003cth>авг\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Сумма в счет погашения тела кредита\u003c/td>\u003ctd>\\( 0{,}15A \\)\u003c/td>\u003ctd>\\( 0{,}15A \\)\u003c/td>\u003ctd>\\( 0{,}1A \\)\u003c/td>\u003ctd>\\( 0{,}2A \\)\u003c/td>\u003ctd>\\( 0{,}25A \\)\u003c/td>\u003ctd>\\( 0{,}15A \\)\u003c/td>\u003c/tr>\n\u003c/table>\nПРОВЕРКА: КРЕДИТ \\( 0{,}15 + 0{,}15 + 0{,}1 + 0{,}2 + 0{,}25 + 0{,}15 = 1 \\) — ВЕРНО\n\n\u003cb>Платежи\u003c/b>\n\\(П_i\\)=Часть долга (из таблицы 1) + процент с долга (из таблицы 2)\n\\(П_1=0{,}15A+0{,}1(A) = 0{,}25A\\)\n\\(П_2=0{,}15A+0{,}1(0{,}85A) = 0{,}235A\\)\n\\(П_3=0{,}1A+0{,}1(0{,}7A) = 0{,}17A\\)\n\\(П_4=0{,}2A+0{,}1(0{,}6A) = 0{,}26A\\)\n\\(П_5=0{,}25A+0{,}1(0{,}4A) = 0{,}29A\\)\n\\(П_6=0{,}15A+0{,}1(0{,}15A) = 0{,}165A\\)\n\n\u003cb>ПЕРЕПЛАТА = ПРОЦЕНТЫ\u003c/b>\n\\( 0{,}1(A + 0{,}85A + 0{,}7A + 0{,}6A + 0{,}4A + 0{,}15A) = 0{,}37A = 111 \\) тыс.\n\\( A = 300 \\) тыс. руб.\n\nНаибольший — \\( П_5 = 0{,}29A = 0{,}29 \\cdot 300 = 87 \\) тыс. руб.\n\n\u003cstrong>Ответ:\u003c/strong> 87 000 рублей.", "solutionImage": "", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( A \\) — сумма кредита, срок 6 месяцев.\n❗ В таблице долг на 13-е число — \u003cb>УЖЕ ПОСЛЕ начисления процентов\u003c/b>: 13.03 долг \\( = 1{,}1A \\Rightarrow \\) ставка 10%, \\( a = 0{,}1 \\).\nПереплата = 111 000 руб.\n\n\u003cstrong>Найти:\u003c/strong> наибольший месячный платёж."}, {"d": "Восстанавливаем таблицу 2: долг до начисления процентов (делим табличные значения на 1,1)", "res": "\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>март\u003c/th>\u003cth>апр\u003c/th>\u003cth>май\u003c/th>\u003cth>июнь\u003c/th>\u003cth>июль\u003c/th>\u003cth>авг\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления процентов\u003c/td>\u003ctd>\\( A \\)\u003c/td>\u003ctd>\\( 0{,}85A \\)\u003c/td>\u003ctd>\\( 0{,}7A \\)\u003c/td>\u003ctd>\\( 0{,}6A \\)\u003c/td>\u003ctd>\\( 0{,}4A \\)\u003c/td>\u003ctd>\\( 0{,}15A \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Восстанавливаем таблицу 1: суммы в счёт погашения тела кредита", "res": "\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>март\u003c/th>\u003cth>апр\u003c/th>\u003cth>май\u003c/th>\u003cth>июнь\u003c/th>\u003cth>июль\u003c/th>\u003cth>авг\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Сумма в счет погашения тела кредита\u003c/td>\u003ctd>\\( 0{,}15A \\)\u003c/td>\u003ctd>\\( 0{,}15A \\)\u003c/td>\u003ctd>\\( 0{,}1A \\)\u003c/td>\u003ctd>\\( 0{,}2A \\)\u003c/td>\u003ctd>\\( 0{,}25A \\)\u003c/td>\u003ctd>\\( 0{,}15A \\)\u003c/td>\u003c/tr>\n\u003c/table>\nПРОВЕРКА: КРЕДИТ \\( 0{,}15 + 0{,}15 + 0{,}1 + 0{,}2 + 0{,}25 + 0{,}15 = 1 \\) — ВЕРНО"}, {"d": "Записываем платежи", "res": "\u003cb>Платежи\u003c/b>\n\\(П_i\\)=Часть долга (из таблицы 1) + процент с долга (из таблицы 2)\n\\(П_1=0{,}15A+0{,}1(A) = 0{,}25A\\)\n\\(П_2=0{,}15A+0{,}1(0{,}85A) = 0{,}235A\\)\n\\(П_3=0{,}1A+0{,}1(0{,}7A) = 0{,}17A\\)\n\\(П_4=0{,}2A+0{,}1(0{,}6A) = 0{,}26A\\)\n\\(П_5=0{,}25A+0{,}1(0{,}4A) = 0{,}29A\\)\n\\(П_6=0{,}15A+0{,}1(0{,}15A) = 0{,}165A\\)"}, {"d": "Записываем переплату и находим A", "res": "\u003cb>ПЕРЕПЛАТА = ПРОЦЕНТЫ\u003c/b>\n\\( 0{,}1(A + 0{,}85A + 0{,}7A + 0{,}6A + 0{,}4A + 0{,}15A) = 0{,}37A = 111 \\) тыс.\n\\( A = 300 \\) тыс. руб."}, {"d": "Находим наибольший платёж", "res": "Наибольший — \\( П_5 = 0{,}29A = 0{,}29 \\cdot 300 = 87 \\) тыс. руб."}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> 87 000 рублей."}], "byClaude": true, "lvl": 2}, {"id": 1791320350335, "title": "20 аналог", "sectionName": "5 - ДИФПЛАТЕЖИ - НЕФОРМАТ", "difficulty": "basic", "taskText": "***\u003ca href=\"https://ege.sdamgia.ru/problem?id=559578   \" target=\"_blank\">🔍 АНАЛОГ  559578   \u003c/a>\nВ июле 2021 года планируется взять кредит на сумму 21 млн рублей на 7 лет (последняя выплата запланирована в 2028 году). Условия его возврата таковы:\n— пока долг больше половины, каждый январь он возрастает на \\( p\\% \\) по сравнению с концом предыдущего года;\n— если долг не превышает половины исходной суммы, то каждый январь долг возрастает на \\( 6\\% \\) по сравнению с концом предыдущего года;\n— с февраля по июнь надо выплатить часть долга;\n— в июле каждого года долг должен быть на одну и ту же сумму меньше долга на июль предыдущего года.\nНайдите \\( p \\), если общая сумма выплат составит 24,72 млн рублей.", "taskImage": "", "answerText": "4", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 21 \\) млн руб. — сумма кредита.\nСрок кредита: 7 лет (2022–2028).\nПроценты: пока долг больше половины (больше 10,5 млн) — \\( p\\% \\), \\( a = \\frac{p}{100} \\); иначе — 6%.\n\\( x \\) — сумма, идущая в счёт погашения тела кредита каждый год.\nОбщая сумма выплат = 24,72 млн руб.\n\n\u003cstrong>Найти:\u003c/strong> \\( p \\).\n\n\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>3\u003c/th>\u003cth>4\u003c/th>\u003cth>5\u003c/th>\u003cth>6\u003c/th>\u003cth>7\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Сумма в счет погашения тела кредита (млн руб.)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\n\u003c/table>\nСУММА КРЕДИТА = \\( 7x = 21 \\) → \\( x = 3 \\)\n\n\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>3\u003c/th>\u003cth>4\u003c/th>\u003cth>5\u003c/th>\u003cth>6\u003c/th>\u003cth>7\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления (млн руб.)\u003c/td>\u003ctd>\\( 21 \\)\u003c/td>\u003ctd>\\( 18 \\)\u003c/td>\u003ctd>\\( 15 \\)\u003c/td>\u003ctd>\\( 12 \\)\u003c/td>\u003ctd>\\( 9 \\)\u003c/td>\u003ctd>\\( 6 \\)\u003c/td>\u003ctd>\\( 3 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Ставка\u003c/td>\u003ctd>p%\u003c/td>\u003ctd>p%\u003c/td>\u003ctd>p%\u003c/td>\u003ctd>p%\u003c/td>\u003ctd>6%\u003c/td>\u003ctd>6%\u003c/td>\u003ctd>6%\u003c/td>\u003c/tr>\n\u003c/table>\n❗ 12 > 10,5 — ещё больше половины; 9 ≤ 10,5 — уже не больше.\n\n\u003cB>ПЛАТЕЖИ:\u003c/B>\n\\(П_i\\)=Часть долга (из таблицы 1) + процент с долга (из таблицы 2)\n\\(П_1=3+a(21)\\), \\(П_2=3+a(18)\\), \\(П_3=3+a(15)\\), \\(П_4=3+a(12)\\)\n\\(П_5=3+0{,}06(9)\\), \\(П_6=3+0{,}06(6)\\), \\(П_7=3+0{,}06(3)\\)\n\n\u003cB>ОБЩАЯ СУММА ВЫПЛАТ \\(\\sum\\) = КРЕДИТ + ПРОЦЕНТЫ(ПЕРЕПЛАТА)\u003c/B>\n\\(\\sum = 21 + a(21 + 18 + 15 + 12) + 0{,}06(9 + 6 + 3) = 24{,}72 \\)\n\\( 21 + 66a + 1{,}08 = 24{,}72 \\)\n\\( 66a = 2{,}64 \\rightarrow a = 0{,}04 = \\frac{p}{100} \\rightarrow p = 4 \\)\n\n\u003cstrong>Ответ:\u003c/strong> \\( p = 4 \\).", "solutionImage": "", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 21 \\) млн руб. — сумма кредита.\nСрок кредита: 7 лет (2022–2028).\nПроценты: пока долг больше половины (больше 10,5 млн) — \\( p\\% \\), \\( a = \\frac{p}{100} \\); иначе — 6%.\n\\( x \\) — сумма, идущая в счёт погашения тела кредита каждый год.\nОбщая сумма выплат = 24,72 млн руб.\n\n\u003cstrong>Найти:\u003c/strong> \\( p \\)."}, {"d": "Составляем таблицу 1: суммы в счёт погашения тела кредита", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>3\u003c/th>\u003cth>4\u003c/th>\u003cth>5\u003c/th>\u003cth>6\u003c/th>\u003cth>7\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Сумма в счет погашения тела кредита (млн руб.)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\n\u003c/table>\nСУММА КРЕДИТА = \\( 7x = 21 \\) → \\( x = 3 \\)"}, {"d": "Составляем таблицу 2: долг до начисления процентов", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>3\u003c/th>\u003cth>4\u003c/th>\u003cth>5\u003c/th>\u003cth>6\u003c/th>\u003cth>7\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления (млн руб.)\u003c/td>\u003ctd>\\( 21 \\)\u003c/td>\u003ctd>\\( 18 \\)\u003c/td>\u003ctd>\\( 15 \\)\u003c/td>\u003ctd>\\( 12 \\)\u003c/td>\u003ctd>\\( 9 \\)\u003c/td>\u003ctd>\\( 6 \\)\u003c/td>\u003ctd>\\( 3 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Ставка\u003c/td>\u003ctd>p%\u003c/td>\u003ctd>p%\u003c/td>\u003ctd>p%\u003c/td>\u003ctd>p%\u003c/td>\u003ctd>6%\u003c/td>\u003ctd>6%\u003c/td>\u003ctd>6%\u003c/td>\u003c/tr>\n\u003c/table>\n❗ 12 > 10,5 — ещё больше половины; 9 ≤ 10,5 — уже не больше."}, {"d": "Записываем платежи", "res": "\u003cB>ПЛАТЕЖИ:\u003c/B>\n\\(П_i\\)=Часть долга (из таблицы 1) + процент с долга (из таблицы 2)\n\\(П_1=3+a(21)\\), \\(П_2=3+a(18)\\), \\(П_3=3+a(15)\\), \\(П_4=3+a(12)\\)\n\\(П_5=3+0{,}06(9)\\), \\(П_6=3+0{,}06(6)\\), \\(П_7=3+0{,}06(3)\\)"}, {"d": "Записываем общую сумму выплат и находим p", "res": "\u003cB>ОБЩАЯ СУММА ВЫПЛАТ \\(\\sum\\) = КРЕДИТ + ПРОЦЕНТЫ(ПЕРЕПЛАТА)\u003c/B>\n\\(\\sum = 21 + a(21 + 18 + 15 + 12) + 0{,}06(9 + 6 + 3) = 24{,}72 \\)\n\\( 21 + 66a + 1{,}08 = 24{,}72 \\)\n\\( 66a = 2{,}64 \\rightarrow a = 0{,}04 = \\frac{p}{100} \\rightarrow p = 4 \\)"}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> \\( p = 4 \\)."}], "byClaude": true, "lvl": 2}, {"id": 1784092204513, "title": "2415 переплата", "sectionName": "5 - ДИФПЛАТЕЖИ - НЕФОРМАТ", "difficulty": "medium", "taskText": "\u003ca href=\" https://3.shkolkovo.online/catalog/172/2415\" target=\"_blank\">🔍 АНАЛОГ 2415\u003c/a>\n10 января в банке был взят кредит на 6 лет на следующих условиях:\n— 16 числа каждого месяца, начиная с января, на текущий долг начисляется \\( r \\) процентов;\n— с 17 по 28 числа каждого месяца заемщик обязан внести платеж в счет погашения кредита так, чтобы сумма долга на 10 число каждого месяца удовлетворяла следующей таблице:\n\u003ctable>\n\u003ctr>\u003cth>Дата\u003c/th>\u003cth>10.01\u003c/th>\u003cth>10.02\u003c/th>\u003cth>10.03\u003c/th>\u003cth>10.04\u003c/th>\u003cth>10.05\u003c/th>\u003cth>10.06\u003c/th>\u003cth>10.07\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг\u003c/td>\u003ctd>\\( A \\)\u003c/td>\u003ctd>\\( 0,8A \\)\u003c/td>\u003ctd>\\( 0,65A \\)\u003c/td>\u003ctd>\\( 0,4A \\)\u003c/td>\u003ctd>\\( 0,25A \\)\u003c/td>\u003ctd>\\( 0,1A \\)\u003c/td>\u003ctd>\\( 0 \\)\u003c/td>\u003c/tr>\n\u003c/table>\nИзвестно, что \\( r \\le 10 \\), наибольший платеж по кредиту равен 517125 рублей, наименьший – 187250 рублей. Определите, сколько рублей составила переплата по кредиту.", "taskImage": "", "answerText": "392000", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\r\n\\( A \\) руб. — сумма кредита.\r\nСрок: 6 месяцев (январь – июнь).\r\nСтавка: \\( r\\% \\) (\\( a = \\frac{r}{100} \\)), причём \\( r \\le 10 \\).\r\nНаибольший платёж = 517125 руб.\r\nНаименьший платёж = 187250 руб.\r\n\r\n\u003cstrong>Найти:\u003c/strong> переплату.\r\n\u003ctable>\r\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>Январь\u003c/th>\u003cth>Февраль\u003c/th>\u003cth>Март\u003c/th>\u003cth>Апрель\u003c/th>\u003cth>Май\u003c/th>\u003cth>Июнь\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>Погашение тела кредита\u003c/td>\u003ctd>\\( 0.2A \\)\u003c/td>\u003ctd>\\( 0.15A \\)\u003c/td>\u003ctd>\\( 0.25A \\)\u003c/td>\u003ctd>\\( 0.15A \\)\u003c/td>\u003ctd>\\( 0.15A \\)\u003c/td>\u003ctd>\\( 0.1A \\)\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\u003ctable>\r\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>Январь\u003c/th>\u003cth>Февраль\u003c/th>\u003cth>Март\u003c/th>\u003cth>Апрель\u003c/th>\u003cth>Май\u003c/th>\u003cth>Июнь\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>Долг до начисления\u003c/td>\u003ctd>\\( A \\)\u003c/td>\u003ctd>\\( 0.8A \\)\u003c/td>\u003ctd>\\( 0.65A \\)\u003c/td>\u003ctd>\\( 0.4A \\)\u003c/td>\u003ctd>\\( 0.25A \\)\u003c/td>\u003ctd>\\( 0.1A \\)\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\u003cB>Платежи:\u003c/B>\r\n\\(П_i = \\text{Часть долга} + \\text{Проценты с долга до начисления}\\)\r\n\r\n\\(П_1 = A(0.2 + a)\\)\r\n\\(П_2 = A(0.15 + 0.8a)\\)\r\n\\(П_3 = A(0.25 + 0.65a)\\)\r\n\\(П_4 = A(0.15 + 0.4a)\\)\r\n\\(П_5 = A(0.15 + 0.25a)\\)\r\n\\(П_6 = A(0.1 + 0.1a)\\)\r\n\r\n\u003cB>\\(П_6\\) – наименьший платеж – в нем в скобке наименьшее выражение\r\n\\(П_6 = A(0.1 + 0.1a) = 187250\\)\u003c/B>\r\n\r\n\u003cB>Определим наибольший платеж:\u003c/B>\r\nСравниваем \\(П_1\\) и \\(П_3\\):\r\nОстальные платежи заведомо меньше\r\n\\(П_1 = A(0.2 + a)\\)\r\n\\(П_3 = A(0.25 + 0.65a)\\)\r\nПри \\(а=0\\)\r\n\\(П_1 = 0.2 A \u003c П_3 = 0.25 A)\\)\r\nПри \\(а=0.1\\)\r\n\\(П_2 = 0.3A\u003cП_3 = 0.9A\\)\r\nЭто возрастающие линейные функции. На отрезке [0; 0.1] \\(П_1\u003cП_3\\) \r\nРешаем систему (делением)\r\n\\(П_3 = A(0.25 + 0.65a)=517125\\)\r\n\\(П_6 = A(0.1 + 0.1a) = 187250\\)\r\n\\(\\frac{5+13a}{2+2a}=\\frac{517125}{187250}\\)\r\n\\(a=0.07\\),\\(A=1750000\\)\r\n\r\nПЕРЕПЛАТА = ПРОЦЕНТЫ =\\(аA(1+0.8+0.65+0.4+0.25+0.1)=3.2aA=3.2\\cdot 0.07 \\cdot 1750000=392000\\) \r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "https://3.shkolkovo.online/catalog/172/2415", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( A \\) руб. — сумма кредита.\nСрок: 6 месяцев (январь – июнь).\nСтавка: \\( r\\% \\) (\\( a = \\frac{r}{100} \\)), причём \\( r \\le 10 \\).\nНаибольший платёж = 517125 руб.\nНаименьший платёж = 187250 руб."}, {"d": "Записываем, что нужно найти, и составляем таблицу погашения тела кредита", "res": "\u003cstrong>Найти:\u003c/strong> переплату.\n\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>Январь\u003c/th>\u003cth>Февраль\u003c/th>\u003cth>Март\u003c/th>\u003cth>Апрель\u003c/th>\u003cth>Май\u003c/th>\u003cth>Июнь\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Погашение тела кредита олг до начисления (тыс. руб.)\u003c/td>\u003ctd>\\( S \\)\u003c/td>\u003ctd>\\( S - Q \\)\u003c/td>\u003ctd>\\( S - 2Q \\)\u003c/td>\u003ctd>\\( S - 3Q \\)\u003c/td>\u003ctd>\\( S - 4Q \\)\u003c/td>\u003ctd>\\( z + w \\)\u003c/td>\u003ctd>\\( w \\)\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\r\n\u003cB>Платежи:\u003c/B>\r\n\\(П_i = \\text{Часть долга} + \\text{Проценты с долга до начисления}\\)\r\n\r\n\\(П_1 = Q + 0.15S\\)\r\n\\(П_2 = Q + 0.15(S - Q)\\)\r\n\\(П_3 = Q + 0.15(S - 2Q)\\)\r\n\\(П_4 = Q + 0.15(S - 3Q)\\)\r\n\\(П_5 = Q + 0.15(S - 4Q)\\)\r\n\r\n\\(П_6 = z + 0.15(z + w)\\)\r\n\\(П_7 = w + 0.15w\\)\r\n\r\nВ 2033 и 2034 годах выплаты равны, значит:\r\n\\( z + 0.15(z + w) = w + 0.15w \\)\r\n\\( 1.15z = w \\)\r\n\r\nИз \\( z + w = S - 5Q \\):\r\n\\( z = \\frac{S - 5Q}{2.15} \\)\r\n\\( w = \\frac{1.15(S - 5Q)}{2.15} \\)\r\n\r\n\u003cB>Общая сумма выплат:\u003c/B> \\( \\Sigma = \\text{СУММА КРЕДИТА} + \\text{СУММА ПРОЦЕНТОВ} = 4168 \\)\r\n\r\nСумма процентов:\r\n\\( 0.15(S + (S - Q) + (S - 2Q) + (S - 3Q) + (S - 4Q) + (z + w) + w) = 0.15(5S - 10Q + z + 2w) \\)\r\n\r\n\\( \\Sigma = S + 0.15(5S - 10Q + z + 2w) = 4168 \\)\r\n\r\nПодставляем \\( S = 2560 \\), \\( z = \\frac{S - 5Q}{2.15} \\), \\( w = \\frac{1.15(S - 5Q)}{2.15} \\):\r\n\\( z + 2w = \\frac{S - 5Q}{2.15} + \\frac{2.3(S - 5Q)}{2.15} = \\frac{3.3(S - 5Q)}{2.15} \\)\r\n\\( Q = 340 \\)\r\n\r\n\u003cstrong>Ответ:\u003c/strong> \\( Q = 340 \\) тыс. руб.\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "https://3.shkolkovo.online/catalog/4162/100637", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 2560 \\) тыс. руб. — сумма кредита.\nСрок кредита: 7 лет.\nПервые 5 лет (2028–2032): долг уменьшается на одну и ту же величину \\( Q \\) тыс. руб.\n6-й год - \\(z\\)\n7-й год - \\(w\\)\nВ 2033 и 2034 годах выплаты равны.\nОбщая сумма выплат = 4168 {S - 5Q}{2.15} \\)\n\\( w = \\frac{1.15(S - 5Q)}{2.15} \\)"}, {"d": "Общая сумма выплат: \\( \\Sigma = \\text{СУММА КРЕДИТА} + \\text{СУММА ПРОЦЕНТОВ} = 4168 \\)", "res": "\u003cB>Общая сумма выплат:\u003c/B> \\( \\Sigma = \\text{СУММА КРЕДИТА} + \\text{СУММА ПРОЦЕНТОВ} = 4168 \\)"}, {"d": "Сумма процентов", "res": "Сумма процентов:\n\\( 0.15(S + (S - Q) + (S - 2Q) + (S - 3Q) + (S - 4Q) + (z + w) + w) = 0.15(5S - 10Q + z + 2w) \\)"}, {"d": "Преобразуем и считаем", "res": "\\( \\Sigma = S + 0.15(5S - 10Q + z + 2w) = 4168 \\)"}, {"d": "Подставляем известные значения", "res": "Подставляем \\( S = 2560 \\), \\( z = \\frac{S - 5Q}{2.15} \\), \\( w = \\frac{1.15(S - 5Q)}{2.15} \\):\n\\( z + 2w = \\frac{S - 5Q}{2.15} + \\frac{2.3(S - 5Q)}{2.15} = \\frac{3.3(S - 5Q)}{2.15} \\)\n\\( Q = 340 \\)"}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> \\( Q = 340 \\) тыс. руб."}], "lvl": 4}, {"id": 1778991025775, "title": "56 - 82241 авторская школково", "sectionName": "5 - ДИФПЛАТЕЖИ - НЕФОРМАТ", "difficulty": "hard", "taskText": "\u003ca href=\" https://3.shkolkovo.online/catalog/11066/82241\" target=\"_blank\">🔍 АНАЛОГ 82241 \u003c/a>\nВ середине января некоторого года планируется взять кредит в банке на 9 месяцев на 143 000 рублей. Условия его возврата таковы:\n– 1-ого февраля, марта, апреля и мая долг будет возрастать на некоторое одинаковое число процентов по сравнению с концом предыдущего месяца;\n– с 10 по 20 число каждого месяца необходимо выплатить часть долга;\n– 25 февраля, марта, апреля и мая долг должен быть на 12 000 рублей меньше долга на конец предыдущего месяца;\n– 1-ого июня, июля, августа, сентября и октября долг будет возрастать на 22% по сравнению с концом предыдущего месяца;\n– 25-ого июня, июля, августа, сентября и октября долг должен быть на одну и ту же величину меньше долга на конец предыдущего месяца;\n– к 25-ому октября долг должен быть выплачен полностью.\nСколько рублей составит наименьшая выплата по кредиту, если переплата по этому кредиту равна 112 700 рублей?", "taskImage": "", "answerText": "22700 рублей", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\r\n\\( S = 143000 \\) руб. — сумма кредита.\r\nСрок кредита: 9 месяцев (февраль – октябрь).\r\nПервые 4 месяца (февраль–май): долг возрастает на \\( r\\% \\) (\\( a = \\frac{r}{100} \\)).\r\nПоследние 5 месяцев (июнь–октябрь): долг возрастает на 22% (\\( b = 0.22 \\)).\r\nВ феврале–мае долг уменьшается на 12000 руб. каждый месяц.\r\nВ июне–октябре долг уменьшается на одну и ту же величину \\( x \\) руб. каждый месяц.\r\nПереплата = 112700 руб.\r\n\u003cb>ПЕРЕПЛАТА = ОБЩАЯ СУММА ВЫПЛАТ - КРЕДИТ\u003c/b>\r\n\r\n\u003cstrong>Найти:\u003c/strong> наименьшую выплату.\r\n\u003ctable>\r\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>Февраль\u003c/th>\u003cth>Март\u003c/th>\u003cth>Апрель\u003c/th>\u003cth>Май\u003c/th>\u003cth>Июнь\u003c/th>\u003cth>Июль\u003c/th>\u003cth>Август\u003c/th>\u003cth>Сентябрь\u003c/th>\u003cth>Октябрь\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>Погашение тела кредита (руб.)\u003c/td>\u003ctd>12000\u003c/td>\u003ctd>12000\u003c/td>\u003ctd>12000\u003c/td>\u003ctd>12000\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\r\n\u003c/table>\r\nСумма кредита: \\( 4 \\cdot 12000 + 5x = 143000 \\rightarrow x = 19000 \\)\r\n\u003ctable>\r\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>Февраль\u003c/th>\u003cth>Март\u003c/th>\u003cth>Апрель\u003c/th>\u003cth>Май\u003c/th>\u003cth>Июнь\u003c/th>\u003cth>Июль\u003c/th>\u003cth>Август\u003c/th>\u003cth>Сентябрь\u003c/th>\u003cth>Октябрь\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>Долг до начисления (руб.)\u003c/td>\u003ctd>143000\u003c/td>\u003ctd>131000\u003c/td>\u003ctd>119000\u003c/td>\u003ctd>107000\u003c/td>\u003ctd>95000\u003c/td>\u003ctd>76000\u003c/td>\u003ctd>57000\u003c/td>\u003ctd>38000\u003c/td>\u003ctd>19000\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\u003cB>Платежи:\u003c/B>\r\n\\(П_i = \\text{Часть долга} + \\text{Проценты с долга до начисления}\\)\r\n\r\n\\(П_1 = 12000 + a \\cdot 143000\\)\r\n\\(П_2 = 12000 + a \\cdot 131000\\)\r\n\\(П_3 = 12000 + a \\cdot 119000\\)\r\n\\(П_4 = 12000 + a \\cdot 107000\\)\r\n\r\n\\(П_5 = 19000 + 0.22 \\cdot 95000 = 19000 + 20900 = 39900\\)\r\n\\(П_6 = 19000 + 0.22 \\cdot 76000 = 19000 + 16720 = 35720\\)\r\n\\(П_7 = 19000 + 0.22 \\cdot 57000 = 19000 + 12540 = 31540\\)\r\n\\(П_8 = 19000 + 0.22 \\cdot 38000 = 19000 + 8360 = 27360\\)\r\n\\(П_9 = 19000 + 0.22 \\cdot 19000 = 19000 + 4180 = 23180\\)\r\n\r\n\u003cB>Общая сумма выплат:\u003c/B>\r\n\\( \\Sigma = \\text{СУММА КРЕДИТА} + \\text{СУММА ПРОЦЕНТОВ} \\)\r\n\r\nСумма процентов:\r\n\\( a(143000 + 131000 + 119000 + 107000) + 0.22(95000 + 76000 + 57000 + 38000 + 19000) = 500000a + 62700 \\)\r\n\r\n\\( \\Sigma = 143000 + (500000a + 62700) = 205700 + 500000a \\)\r\n\r\nПЕРЕПЛАТА  \\(= 112700  =  \\Sigma  - S =( 205700 + 500000a)  - 143000 \\)\r\n\\( 205700 + 500000a = 255700 \\)\r\n\\( a = 0.1 \\)\r\n\r\n\u003cB>Среди выплат с одинаковой частью в теле кредита наименьшая - последняя:\u003c/B>\r\n\\(П_4 = 12000 + 0.1 \\cdot 107000 =  22700\\)\r\n\\(П_9 = 19000+0.22 \\cdot 19000 = 23180\\)\r\n\r\n\u003cstrong>Ответ:\u003c/strong> наименьшая выплата составит \u003cstrong>22700 рублей\u003c/strong>.\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "https://3.shkolkovo.online/catalog/11066/82241", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 143000 \\) руб. — сумма кредита.\nСрок кредита: 9 месяцев (февраль – октябрь).\nПервые 4 месяца (февраль–май): долг возрастает на \\( r\\% \\) (\\( a = \\frac{r}{100} \\)).\nПоследние 5 месяцев (июнь–октябрь): долг возрастает на 22% (\\( b = 0.22 \\)).\nВ феврале–мае долг уменьшается на 12000 руб. каждый месяц.\nВ июне–октябре долг \u003c/th>\u003cth>0,2\u003c/th>\u003cth>0\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг (млн руб.)\u003c/td>\u003ctd>\\( S \\)\u003c/td>\u003ctd>\\( S - 1 \\)\u003c/td>\u003ctd>\\( S - 2 \\)\u003c/td>\u003ctd>\\( S - 2,4 \\)\u003c/td>\u003ctd>\\( S - 2,8 \\)\u003c/td>\u003ctd>\\( S - 3 \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>0,2\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\n\u003c/table>\nЗдесь начиная с 2020 года долг уменьшается равномерно на 200 000 рублей. B каком году Николай планирует совершить последний платеж, если общая сумма выплат равна 17 680 000 рублей?", "taskImage": "", "answerText": "2044", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\r\n\\( S \\) млн руб. — сумма кредита.\r\n\\( r = 10\\% \\)\r\n\\( a = 1 + \\frac{10}{100} = 1.1 \\)\r\n\\( n \\) — количество лет\r\nОбщая сумма выплат = \\( 17.68 \\) млн руб.\r\n\r\n\u003cstrong>Найти:\u003c/strong> год последнего платежа \\(n\\).\r\n\r\n\u003cB>ВОССТАНАВЛИВАЕМ  1-ю ТАБЛИЦУ (часть долга, которая гасится каждый год):\u003c/B>\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>2015\u003c/th>\u003cth>2016\u003c/th>\u003cth>2017\u003c/th>\u003cth>2018\u003c/th>\u003cth>2019\u003c/th>\u003cth>2020\u003c/th>\u003cth>...\u003c/th>\u003cth>последний \\(n\\)-й\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>Часть долга (млн руб.)\u003c/td>\u003ctd>\\( 1 \\)\u003c/td>\u003ctd>\\( 1 \\)\u003c/td>\u003ctd>\\( 0.4 \\)\u003c/td>\u003ctd>\\( 0.4 \\)\u003c/td>\u003ctd>\\( 0.2 \\)\u003c/td>\u003ctd>\\( 0.2 \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>0.2\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\u003cb>СУММА КРЕДИТА \u003c/b> \\(S =  2 + 0.8 + 0.2 \\cdot (n-4) = 2 + 0.2 n\\) \r\n\r\n\u003cB>ВТОРАЯ ТАБЛИЦА (долг до начисления процентов) – БЕРЕМ ИЗ УСЛОВИЯ:\u003c/B>\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>2015\u003c/th>\u003cth>2016\u003c/th>\u003cth>2017\u003c/th>\u003cth>2018\u003c/th>\u003cth>2019\u003c/th>\u003cth>2020\u003c/th>\u003cth>...\u003c/th>\u003cth>последний \\(n\\)-й\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>Долг до начисления (млн руб.)\u003c/td>\u003ctd>\\( S \\)\u003c/td>\u003ctd>\\( S - 1 \\)\u003c/td>\u003ctd>\\( S - 2 \\)\u003c/td>\u003ctd>\\( S - 2.4 \\)\u003c/td>\u003ctd>\\( S - 2.8 \\)\u003c/td>\u003ctd>\\( S - 3 \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>0.2\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\u003cB>ПЛАТЕЖИ:\u003c/B>\r\n\u003cb>ПЛАТЕЖ ЗА \\(i-\\)й год\u003c/b> = \\(П_i = \\text{ЧАСТЬ ДОЛГА} + \\text{ПРОЦЕНТЫ С ДОЛГА ДО НАЧИСЛЕНИЯ} \\)\r\n\r\n\u003cB>ОБЩАЯ СУММА ВЫПЛАТ \\(\\sum\\) = СУММА ЧАСТЕЙ ДОЛГА \\( \\sum_1 \\)+ СУММА ПРОЦЕНТОВ \\( \\sum_2 \\)\u003c/B>\r\nИз первой таблицы: \r\n\\( \\sum_1 =  S = 2 + 0.2n\\)\r\n\r\nИз второй таблицы: \r\n\\( \\sum_2= a\\cdot (S + (S-1) + (S-2) + (S-2.4) + [S-2.8 ]+ [S-3]+[S-0.2]+ \\cdots +[0.2]) = a\\cdot (4S-5.4 + \\sum_3)\\), где \\(\\sum_3 \\) - арифметическая прогрессия с шагом \\( -0.2 \\).\r\n\r\nПо формуле суммы арифметической прогрессии:\r\n\\( S_n = \\frac{a_1 + a_N}{2} \\cdot N \\), здесь \\(a_1 = S-2.8\\), \\(N=n-4\\), \\(a_N=0.2\\)\r\n\\(\\sum_3 = \\frac{S-2.8 + 0.2}{2} \\cdot (n-4)  = (0.1n – 0.3)(n-4)  \\)\r\n\r\n\u003cB>ОБЩАЯ СУММА ВЫПЛАТ:\u003c/B>\r\n\\(\\sum = (2 + 0.2n) + 0.1(4S - 5.4 + \\sum_3) = 17.68\\)\r\n\r\nПодставляем \\( S = 2 + 0.2n \\) и \\(\\sum_3 = (0.1n - 0.3)(n-4)\\):\r\n\\(\\sum = (2 + 0.2n) + 0.1(0.1n^2 + 0.1n + 3.8) = 17.68\\)\r\n\\(0.01n^2 + 0.21n - 15.3 = 0\\)\r\nДомножаем на 100:\r\n\\(n^2 + 21n - 1530 = 0\\)\r\n\\(n = \\frac{-21 + 81}{2} = \\frac{60}{2} = 30\\) – отрицательный корень не берем\r\nВсего прошло 30 лет. \r\n\u003cstrong>Ответ:\u003c/strong> последний платеж будет в \u003cstrong>2044 году\u003c/strong> (2015 + 30 - 1 = 2044).\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "https://3.shkolkovo.online/catalog/172/16205", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u00 ставляем \\( x = \\frac{S - 440}{5} \\) в [2]:\n\\( 1.9S - 1.8 \\cdot \\frac{S - 440}{5} = 2376 \\)\n\\( S = 1440 \\)"}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> \\( S = 1440 \\) тыс. руб. (1 440 000 рублей)."}], "lvl": 5}, {"id": 1778990835992, "title": "55 - 81174 авторская школково", "sectionName": "5 - ДИФПЛАТЕЖИ - НЕФОРМАТ", "difficulty": "hard", "taskText": "В июле 2024 года планируется взять кредит в банке на некоторую сумму \\(S\\) тыс. рублей на 6 лет. Условия его возврата таковы:\r\n— каждый январь долг будет возрастать на \\(10\\%\\) по сравнению с концом предыдущего года;\r\n— с февраля по июнь каждого года необходимо выплатить одним платежом часть долга;\r\n— в июле 2025, 2026 и 2027 годов долг должен быть на 200 тыс. рублей меньше долга на июль предыдущего года;\r\n— в июле 2028 года долг должен составлять \\(0{,}5S\\) тыс. рублей;\r\n— платежи в 2029 и 2030 годах должны быть равными;\r\n— к июлю 2030 года кредит должен быть выплачен полностью.\r\n\r\nИзвестно, что суммарная переплата по кредиту после его полного погашения будет равна 680 тыс. рублей. Какую сумму планируется взять в кредит?", "taskImage": "", "answerText": "1680 тысяч рублей\r\n\r\n\r\n", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\r\n\\( S \\) тыс. руб. — сумма кредита.\r\nСрок кредита: 6 лет (2025–2030).\r\nСтавка: 10% (\\( a = 0.1 \\)).\r\n2025–2027: долг уменьшается на 200 тыс. руб. каждый год.\r\n2028: долг = \\( 0.5S \\).\r\n2029–2030: равные платежи \\( y \\).\r\nПереплата = 680 тыс. руб.\r\n\u003cb>ПЕРЕПЛАТА = ОБЩАЯ СУММА ВЫПЛАТ - КРЕДИТ\u003c/b>\r\n\r\n\u003cstrong>Найти:\u003c/strong> \\( S \\).\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>2025\u003c/th>\u003cth>2026\u003c/th>\u003cth>2027\u003c/th>\u003cth>2028\u003c/th>\u003cth>2029\u003c/th>\u003cth>2030\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>Погашение тела кредита (тыс. руб.)\u003c/td>\u003ctd>200\u003c/td>\u003ctd>200\u003c/td>\u003ctd>200\u003c/td>\u003ctd>\\( y \\)\u003c/td>\u003ctd>\\( z \\)\u003c/td>\u003ctd>\\( w \\)\u003c/td>\u003c/tr>\r\n\u003c/table>\r\nСУММА КРЕДИТА = \\( 200 + 200 + 200 + y + z + w = S \\)\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>2025\u003c/th>\u003cth>2026\u003c/th>\u003cth>2027\u003c/th>\u003cth>2028\u003c/th>\u003cth>2029\u003c/th>\u003cth>2030\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>Долг до начисления (тыс. руб.)\u003c/td>\u003ctd>\\( S \\)\u003c/td>\u003ctd>\\( S - 200 \\)\u003c/td>\u003ctd>\\( S - 400 \\)\u003c/td>\u003ctd>\\( S - 600 \\)\u003c/td>\u003ctd>\\( 0.5S \\)\u003c/td>\u003ctd>\\( w \\)\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\r\n\u003cB>Платежи:\u003c/B>\r\n\\(П_i = \\text{Часть долга} + \\text{Проценты с долга до начисления}\\)\r\n\r\n\\(П_{2025} = 200 + 0.1S\\)\r\n\\(П_{2026} = 200 + 0.1(S - 200)\\)\r\n\\(П_{2027} = 200 + 0.1(S - 400)\\)\r\n\\(П_{2028} = y + 0.1(S - 600)\\)\r\n\\(П_{2029} = z + 0.1(0.5S)\\)\r\n\\(П_{2030} = w + 0.1w = 1.1w\\)\r\n\r\n\u003cB>Система уравнений:\u003c/B>\r\n1) Долг после 2028 года = \\( 0.5S \\):\r\n\\( z + w = 0.5S \\)  [1]\r\n2) Сумма кредита:\r\n\\( 600 + y + z + w = S \\)\r\n\\( 600 + y + 0.5S = S \\)\r\n\\( y = 0.5S - 600 \\)  [2]\r\n3) Равные платежи в 2029 и 2030:\r\n\\( z + 0.05S = 1.1w \\)  [3]\r\n4) Переплата = СУММА ПРОЦЕНТОВ = 680:\r\nСумма процентов = \\( 0.1S + 0.1(S - 200) + 0.1(S - 400) + 0.1(S - 600) + 0.1(0.5S) + 0.1w \\)\r\n\\( 4.5S + w = 8000 \\)  [4]\r\n\r\n\u003cB>Решаем систему:\u003c/B>\r\nИз [1]: \\( z = 0.5S - w \\)\r\nИз [2]: \\( y = 0.5S - 600 \\)\r\nПодставляем в [3]:\r\n\\( (0.5S - w) + 0.05S = 1.1w \\)\r\n\\( 0.55S = 2.1w \\)\r\n\\( w = \\frac{0.55S}{2.1} = \\frac{11S}{42} \\)\r\n\r\nПодставляем в [4]:\r\n\\( 4.5S + \\frac{11S}{42} = 8000 \\)\r\n\\( S =  1680 \\)\r\n\r\n\u003cstrong>Ответ:\u003c/strong> \\( S = 1680 \\) тыс. рублей.\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "https://3.shkolkovo.online/catalog/11066/81174", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S \\) тыс. руб. — сумма кредита.\nСрок кредита: 6 лет (2025–2030).\nСтавка: 10% (\\( a = 0.1 \\)).\n2025–2027: долг уменьшается на 200 тыс. руб. каждый год.\n2028: долг = \\( 0.5S \\).\n2029–2030: равные платежи \\( y \\).\nПереплата = 680 тыс. руб.\n\n\u003cb>ПЕРЕПЛАТА = ОБЩАЯ СУММА ВЫПЛАТ - КРЕДИТ\u003c/b>\n\u003cstrong>Найти:\u003c/strong> \\( S \\)."}, {"d": "Составляем таблицу погашения тела кредита", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>2025\u003c/th>\u003cth>2026\u003c/th>\u003cth>2027\u003c/th>\u003cth>2028\u003c/th>\u003cth>2029\u003c/th>\u003cth>2030\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Погашение тела кредита (тыс. руб.)\u003c/td>\u003ctd>200\u003c/td>\u003ctd>200\u003c/td>\u003ctd>200\u003c/td>\u003ctd>\\( y \\)\u003c/td>\u003ctd>\\( z \\)\u003c/td>\u003ctd>\\( w \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "СУММА КРЕДИТА =", "res": "СУММА КРЕДИТА = \\( 200 + 200 + 200 + y + z + w = S \\)"}, {"d": "Составляем таблицу долга до начисления процентов", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>2025\u003c/th>\u003cth>2026\u003c/th>\u003cth>2027\u003c/th>\u003cth>2028\u003c/th>\u003cth>2029\u003c/th>\u003cth>2030\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления (тыс. руб.)\u003c/td>\u003ctd>\\( S \\)\u003c/td>\u003ctd>\\( S - 200 \\)\u003c/td>\u003ctd>\\( S - 400 \\)\u003c/td>\u003ctd>\\( S - 600 \\)\u003c/td>\u003ctd>\\( 0.5S \\)\u003c/td>\u003ctd>\\( w \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Платежи", "res": "\u003cB>Платежи:\u003c/B>\n\\(П_i = \\text{Часть долга} + \\text{Проценты с долга до начисления}\\)"}, {"d": "Преобразуем и считаем", "res": "\\(П_{2025} = 200 + 0.1S\\)\n\\(П_{2026} = 200 + 0.1(S - 200)\\)\n\\(П_{2027} = 200 + 0.1(S - 400)\\)\n\\(П_{2028} = y + 0.1(S - 600)\\)\n\\(П_{2029} = z + 0.1(0.5S)\\)\n\\(П_{2030} = w + 0.1w = 1.1w\\)"}, {"d": "Система уравнений", "res": "\u003cB>Система уравнений:\u003c/B>\n1) Долг после 2028 года = \\( 0.5S \\):\n\\( z + w = 0.5S \\)  [1]"}, {"d": "2) Сумма кредита", "res": "2) Сумма кредита:\n\\( 600 + y + z + w = S \\)\n\\( 600 + y + 0.5S = S \\)\n\\( y = 0.5S - 600 \\)  [2]"}, {"d": "3) Равные платежи в 2029 и 2030", "res": "3) Равные платежи в 2029 и 2030:\n\\( z + 0.05S = 1.1w \\)  [3]"}, {"d": "4) Переплата = СУММА ПРОЦЕНТОВ = 680", "res": "4) Переплата = СУММА ПРОЦЕНТОВ = 680:\nСумма процентов = \\( 0.1S + 0.1(S - 200) + 0.1(S - 400) + 0.1(S - 600) + 0.1(0.5S) + 0.1w \\)\n\\( 4.5S + w = 8000 \\)  [4]"}, {"d": "Решаем систему", "res": "\u003cB>Решаем систему:\u003c/B>\nИз [1]: \\( z = 0.5S - w \\)\nИз [2]: \\( y = 0.5S - 600 \\)"}, {"d": "Подставляем в [3]", "res": "Подставляем в [3]:\n\\( (0.5S - w) + 0.05S = 1.1w \\)\n\\( 0.55S = 2.1w \\)\n\\( w = \\frac{0.55S}{2.1} = \\frac{11S}{42} \\)"}, {"d": "Подставляем в [4]", "res": "Подставляем в [4]:\n\\( 4.5S + \\frac{11S}{42} = 8000 \\)\n\\( S =  1680 \\)"}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> \\( S = 1680 \\) тыс. рублей."}], "lvl": 5}, {"id": 1772986658960, "title": "99785 (аналог)", "sectionName": "6 - 2 СХЕМЫ", "difficulty": "basic", "taskText": "В июле Максим планирует взять кредит в банке на некоторую сумму. Банк предложил Максиму два варианта кредитования.\n1-й вариант\n– кредит предоставляется на 3 года;\n– в январе каждого года действия кредита долг увеличивается на 20% от суммы долга на конец предыдущего года;\n– в период с февраля по июнь каждого года действия кредита выплачиваются равные суммы, причем последний платеж должен погасить долг по кредиту полностью.\n\n2-й вариант\n– кредит предоставляется на 2 года;\n– в январе каждого года действия кредита долг увеличивается на 24%;\n– в период с февраля по июнь каждого года действия кредита выплачиваются равные суммы, причем последний платеж должен погасить долг по кредиту полностью.\nКогда Максим подсчитал, \nто выяснил, что по 1-му варианту кредитования ему придётся выплачивать на 373 600 рублей больше, чем по 2-му варианту. \nКакую сумму Максим планирует взять в кредит?", "taskImage": "", "answerText": "7,28 млн рублей", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\n\\( S \\) тыс. руб.\nВариант 1: 3 года, 20% (\\( \\frac{6}{5} \\)), равные платежи \\( x \\).\nВариант 2: 2 года, 24% (\\( \\frac{31}{25} \\)), равные платежи \\( y \\).\n\\( 3x - 2y = 373{,}6 \\) тыс. руб.\n\u003cstrong>Найти:\u003c/strong> \\( S \\).\n\n\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Вариант 1\u003c/th>\u003cth>Вариант 2\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot \\frac{6}{5} - x \\)\u003c/td>\u003ctd>\\( S \\cdot \\frac{31}{25} - y \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (S \\cdot \\frac{6}{5} - x) \\cdot \\frac{6}{5} - x \\)\u003c/td>\u003ctd>\\( (S \\cdot \\frac{31}{25} - y) \\cdot \\frac{31}{25} - y = 0 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( ((S \\cdot \\frac{6}{5} - x) \\cdot \\frac{6}{5} - x) \\cdot \\frac{6}{5} - x = 0 \\)\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003c/table>\n\n\\( 216S - 180x - 150x - 125x = 0 \\rightarrow x = \\frac{216}{455}S \\)\n\\( 3x = \\frac{648}{455}S \\)\n\n\\( 961S - 775y - 625y = 0 \\rightarrow y = \\frac{961}{1400}S \\)\n\\( 2y = \\frac{961}{700}S \\)\n\n\\( \\frac{648}{455}S - \\frac{961}{700}S = 373{,}6 \\)\nОбщий знаменатель 9100: \\( \\frac{12960 - 12493}{9100}S = \\frac{467}{9100}S = 373{,}6 \\)\n\\( S = \\frac{373{,}6 \\cdot 9100}{467} = 0{,}8 \\cdot 9100 = 7280 \\) тыс. руб.\n\n\u003cstrong>Ответ:\u003c/strong> 7,28 млн рублей.", "solutionImage": "", "drawingImage": "", "solutionLink": "https://3.shkolkovo.online/catalog/4162/45988", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S \\) тыс. руб.\nВариант 1: 3 года, 20% (\\( \\frac{6}{5} \\)), равные платежи \\( x \\).\nВариант 2: 2 года, 24% (\\( \\frac{31}{25} \\)), равные платежи \\( y \\).\n\\( 3x - 2y = 373{,}6 \\) тыс. руб.\n\u003cstrong>Найти:\u003c/strong> \\( S \\)."}, {"d": "Составляем таблицы долга для обоих вариантов", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Вариант 1\u003c/th>\u003cth>Вариант 2\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot \\frac{6}{5} - x \\)\u003c/td>\u003ctd>\\( S \\cdot \\frac{31}{25} - y \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (S \\cdot \\frac{6}{5} - x) \\cdot \\frac{6}{5} - x \\)\u003c/td>\u003ctd>\\( (S \\cdot \\frac{31}{25} - y) \\cdot \\frac{31}{25} - y = 0 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( ((S \\cdot \\frac{6}{5} - x) \\cdot \\frac{6}{5} - x) \\cdot \\frac{6}{5} - x = 0 \\)\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Вариант 1: избавляемся от знаменателей (домножаем на 125)", "res": "\\( 216S - 180x - 150x - 125x = 0 \\rightarrow x = \\frac{216}{455}S \\)\n\\( 3x = \\frac{648}{455}S \\)"}, {"d": "Вариант 2: избавляемся от знаменателей (домножаем на 625)", "res": "\\( 961S - 775y - 625y = 0 \\rightarrow y = \\frac{961}{1400}S \\)\n\\( 2y = \\frac{961}{700}S \\)"}, {"d": "Составляем уравнение по разнице", "res": "\\( \\frac{648}{455}S - \\frac{961}{700}S = 373{,}6 \\)\nОбщий знаменатель 9100: \\( \\frac{12960 - 12493}{9100}S = \\frac{467}{9100}S = 373{,}6 \\)\n\\( S = \\frac{373{,}6 \\cdot 9100}{467} = 0{,}8 \\cdot 9100 = 7280 \\) тыс. руб."}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> 7,28 млн рублей."}], "byClaude": true, "lvl": 1}, {"id": 1784132088833, "title": "6-01", "sectionName": "6 - 2 СХЕМЫ", "difficulty": "basic", "taskText": "\u003ca href=\"https://ege.sdamgia.ru/problem?id=525027\" target=\"_blank\">🔍 АНАЛОГ  525027\u003c/a>\nАндрей планирует 15-го декабря взять в банке кредит на 3  - X \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( ((S \\cdot \\frac{11}{10} - X) \\cdot \\frac{11}{10} - X) \\cdot \\frac{11}{10} - X = 0 \\)\u003c/td>\u003c/tr>\n\u003c/table>\n\n\\( 1331S - 1210X - 1100X - 1000X = 0 \\rightarrow X = \\frac{1331S}{3310} = \\frac{1331 \\cdot 1655}{3310} = 665{,}5 \\)\n\\( \\Sigma_1 = 3X = 1996{,}5 \\) тыс. руб.\n\n\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>35\u003c/th>\u003cth>36\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Сумма в счет погашения тела кредита\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\n\u003c/table>\nСУММА КРЕДИТА = \\( 36x = S \\)\n\n\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>35\u003c/th>\u003cth>36\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления процентов\u003c/td>\u003ctd>\\( 36x \\)\u003c/td>\u003ctd>\\( 35x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( 2x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\n\u003c/table>\n\n\\(П_i\\)=Часть долга (из таблицы 1) + процент с долга (из таблицы 2)\n\\(П_1 = x + 0{,}01(36x)\\), …, \\(П_{36} = x + 0{,}01(x)\\)\n\u003cB>ОБЩАЯ СУММА ВЫПЛАТ \\(\\sum\\) = КРЕДИТ + ПРОЦЕНТЫ\u003c/B>\n\\( \\Sigma_2 = 36x + 0{,}01 \\cdot \\frac{(36x + x) \\cdot 36}{2} = 36x + 6{,}66x = 42{,}66x \\)\n\\( x = \\frac{1655}{36} \\rightarrow \\Sigma_2 = 1655 \\cdot \\frac{42{,}66}{36} = 1655 \\cdot 1{,}185 = 1961{,}175 \\) тыс. руб.\n\n\\( \\Sigma_1 - \\Sigma_2 = 1996{,}5 - 1961{,}175 = 35{,}325 \\) тыс. руб. = 35 325 руб.\n\n\u003cstrong>Ответ:\u003c/strong> 35 325 рублей.", "solutionImage": "", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 1655 \\) тыс. руб. — сумма кредита.\nПлан 1: 3 года, 10% (\\( \\frac{11}{10} \\)), три равных платежа \\( X \\).\nПлан 2: 36 месяцев, 1% в месяц (\\( a = 0{,}01 \\)), долг уменьшается на одну и ту же сумму \\( x \\).\n\n\u003cstrong>Найти:\u003c/strong> на сколько отличаются общие суммы выплат."}, {"d": "План 1: составляем таблицу долга (аннуитет)", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot \\frac{11}{10} - X \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (S \\cdot \\frac{11}{10} - X) \\cdot \\frac{11}{10} - X \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( ((S \\cdot \\frac{11}{10} - X) \\cdot \\frac{11}{10} - X) \\cdot \\frac{11}{10} - X = 0 \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "План 1: избавляемся от знаменателей (домножаем на 1000) и считаем", "res": "\\( 1331S - 1210X - 1100X - 1000X = 0 \\rightarrow X = \\frac{1331S}{3310} = \\frac{1331 \\cdot 1655}{3310} = 665{,}5 \\)\n\\( \\Sigma_1 = 3X = 1996{,}5 \\) тыс. руб."}, {"d": "План 2: таблица 1 — суммы в счёт погашения тела кредита", "res": "\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>35\u003c/th>\u003cth>36\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Сумма в счет погашения тела кредита\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\n\u003c/table>\nСУММА КРЕДИТА = \\( 36x = S \\)"}, {"d": "План 2: таблица 2 — долг до начисления процентов", "res": "\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>35\u003c/th>\u003cth>36\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления процентов\u003c/td>\u003ctd>\\( 36x \\)\u003c/td>\u003ctd>\\( 35x \\)\u003c/td>\u003ctd>...\u003c/t   var tabs = (t ? [['task', '🎯 К этой задаче']] : []).concat([['all', '🗒 Все стикеры']]).concat(th.map(function (x) { return ['th' + x.id, '📚 ' + plain(x.taskText || x.title).slice(0, 30)]; }));
  var h = '<div class="bar" style="margin-bottom:8px"><b style="font-size:18px">📌 Памятка</b><span class="sp"></span><button onclick="closeOv()">✕</button></div><div class="tabs">' +
    tabs.map(function (x) { return '<button class="' + (memoTab === x[0] ? 'on' : '') + '" onclick="memo(' + (id || 0) + ',\'' + x[0] + '\')">' + esc(x[1]) + '</button>'; }).join('') + '</div>';
  if (memoTab === 'task' && t) {
    h += '<p class="meta">Подобрано под задачу «' + esc(t.title) + '»: тип, ставки, сроки, что ищем.</p><div class="notes">' + (t.note ? '<div class="note w"><h4>✍️ От учителя</h4>' + fmt(t.note) + '</div>' : '') + stkFor(t).map(noteHTML).join('') + '</div>';
  } else if (memoTab === 'all') {
    var groups = [['Общее', ['all', 'units']], ['Вклады', ['vklad', 'deposit_add', 'accrued', 'simple', 'month', 'int']], ['Аннуитет', ['annuitet', 'geom', 'overpay', 'rates', 'onlypct', 'paypart', 'findr', 'findn']], ['Дифференцированные платежи', ['dif', 'difx', 'arith']], ['Оптимальный выбор и две схемы', ['opt', 'cmp', 'sqrt', 'two']]];
    var used = {};
    groups.forEach(function (g) {
      var l = STK.filter(function (s) { return !used[s.id] && g[1].indexOf(s.tags[0]) >= 0; }); l.forEach(function (s) { used[s.id] = 1; });
      if (l.length) h += '<div class="sec">' + g[0] + '</div><div class="notes">' + l.map(noteHTML).join('') + '</div>';
    });
  } else {
    var x = find(memoTab.slice(2));
    if (x) h += '<div class="card theory mx"><div class="bar" style="margin-bottom:6px"><span class="sp"></span><button class="sm" onclick="closeOv();edit(' + x.id + ')">✎ Редактировать теорию</button></div>' + fmt(x.solutionText) + '</div>';
  }
  ov(h);
}
function ov(h) { var o = $('ov'); if (!o) { o = document.createElement('div'); o.id = 'ov'; o.className = 'ov'; o.onclick = function (e) { if (e.target === o) closeOv(); }; document.body.appendChild(o); } o.innerHTML = '<div class="mod">' + h + '</div>'; TS(o); }
function closeOv() { var o = $('ov'); if (o) o.remove(); }
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && $('ov') && !$('edw')) closeOv(); });
function confirmBox(msg, yes) {
  var o = document.createElement('div'); o.className = 'ov'; o.id = 'cf'; o.style.zIndex = 60;
  o.innerHTML = '<div class="mod" style="max-width:520px"><p style="font-size:17px">' + msg + '</p><div class="bar"><span class="sp"></span><button id="cno">Нет</button><button class="pri" id="cyes">Да</button></div></div>';
  document.body.appendChild(o);
  $('cno').onclick = function () { o.remove(); };
  $('cyes').onclick = function () { o.remove(); yes(); }; return true;
}
// ---------------- редактор ----------------
var E = null, Eid = null;
function newTask() {
  var t = { id: Date.now(), lvl: 3, title: 'Новая задача', sectionName: F.sec || (secs()[0] || ''), difficulty: 'basic', taskText: '', answerText: '', solutionText: '', steps: [], hw: false, note: '', taskImage: '', answerImage: '', solutionImage: '', drawingImage: '', solutionLink: '', videoLink: '', taskJSON: null, answerJSON: null, solutionJSON: null, isNew: true };
  E = t; Eid = null; renderEd();
}
function edit(id) { var t = find(id); E = JSON.parse(JSON.stringify(t)); E.steps = E.steps || []; Eid = id; renderEd(); }
function inp(path, val, ta, ph) {
  return ta ? '<textarea data-p="' + path + '" oninput="setP(this)" placeholder="' + esc(ph || '') + '" rows="' + (ta === 2 ? 8 : 3) + '">' + esc(val) + '</textarea>'
    : '<input type="text" data-p="' + path + '" oninput="setP(this)" value="' + esc(val) + '" placeholder="' + esc(ph || '') + '">';
}
function setP(el) { var p = el.dataset.p.split('.'), o = E; for (var i = 0; i < p.length - 1; i++) o = o[p[i]]; o[p[p.length - 1]] = el.type === 'checkbox' ? el.checked : el.value; }
function renderEd() {
  var y = $('ov') && $('ov').scrollTop;
  var h = '<div class="ed" id="edw"><div class="bar" style="margin-bottom:6px"><b style="font-size:18px">✎ ' + (Eid ? 'Редактирование' : 'Новая задача') + '</b><span class="sp"></span><button onclick="closeOv()">Отмена</button><button class="pri" onclick="edSave()">✓ Сохранить задачу</button></div>' +
    '<div class="card"><div class="bar" style="align-items:flex-end"><div style="flex:1;min-width:140px"><label>Название / номер</label>' + inp('title', E.title) + '</div>' +
    '<div style="flex:1;min-width:180px"><label>Раздел</label><input type="text" list="secl" data-p="sectionName" oninput="setP(this)" value="' + esc(E.sectionName) + '"><datalist id="secl">' + secs().map(function (s) { return '<option value="' + esc(s) + '">'; }).join('') + '</datalist></div>' +
    '<div><label>Уровень сложности</label><select onchange="E.lvl=+this.value;E.difficulty=E.lvl<=2?\'basic\':E.lvl===3?\'medium\':\'hard\'">' + [1, 2, 3, 4, 5].map(function (o) { return '<option value="' + o + '"' + ((E.lvl || 3) === o ? ' selected' : '') + '>' + o + (o === 1 ? ' — самая простая' : o === 5 ? ' — самая сложная' : '') + '</option>'; }).join('') + '</select></div>' +
    '<label style="display:flex;gap:6px;align-items:center;margin-bottom:8px"><input type="checkbox" data-p="hw" onchange="setP(this)"' + (E.hw ? ' checked' : '') + '> ДЗ</label>' +
    (E.byClaude ? '<label style="display:flex;gap:6px;align-items:center;margin-bottom:8px"><input type="checkbox" data-p="byClaude" onchange="setP(this)" checked> метка «новое решение»</label>' : '') +
    '<label style="display:flex;gap:6px;align-items:center;margin-bottom:8px"><input type="checkbox" data-p="theory" onchange="setP(this)"' + (E.theory ? ' checked' : '') + '> это теория (в памятку)</label></div>' +
    '<label>Условие (можно HTML и формулы \\( … \\))</label>' + inp('taskText', E.taskText, 2) +
    '<label>Ответ</label>' + inp('answerText', E.answerText, 1) +
    '<label>Стикер «От учителя» — заметка/нюанс к задаче (необязательно)</label>' + inp('note', E.note || '', 1, 'Например: «Внимание! Проценты начисляются 4 раза, а платежей 3»') +
    '<label>Решение целиком (ваш текст; из него можно автоматически собрать шаги)</label>' + inp('solutionText', E.solutionText, 2) +
    '<div class="bar" style="margin-top:8px"><button onclick="autoSteps()">⚙️ Разбить решение на шаги автоматически</button><button onclick="prevAll()">👁 Предпросмотр условия и решения</button></div><div id="pva"></div></div>';
  h += '<div class="card"><div class="bar"><b>Шаги разбора (' + E.steps.length + ')</b><span class="sp"></span><button class="sm" onclick="addStep(' + E.steps.length + ')">＋ шаг в конец</button></div>' +
    '<p class="meta" style="margin:6px 0">Шаг = «что делаем» → ученик нажимает «Показать результат» → появляется ваш текст. Порядок: Дано → таблица(ы) → решение → ответ.</p>';
  E.steps.forEach(function (s, i) {
    h += '<div class="est"><div class="hd">Шаг ' + (i + 1) + '<span class="sp"></span><button class="sm" onclick="mvStep(' + i + ',-1)">↑</button><button class="sm" onclick="mvStep(' + i + ',1)">↓</button><button class="sm" onclick="addStep(' + (i + 1) + ')">＋ после</button><button class="sm" onclick="prevStep(' + i + ')">👁</button><button class="sm dang" onclick="delStep(' + i + ')">✕</button></div>' +
      '<label>Что делаем (описание шага)</label>' + inp('steps.' + i + '.d', s.d || '') +
      '<label>Результат шага — ваш текст (HTML, формулы \\( … \\), таблицы)</label>' + inp('steps.' + i + '.res', s.res, 2) +
      '<div id="pv' + i + '"></div></div>';
  });
  h += '<div class="bar"><button class="dang" onclick="delTask()">🗑 Удалить задачу</button><span class="sp"></span><button onclick="closeOv()">Отмена</button><button class="pri" onclick="edSave()">✓ Сохранить задачу</button></div></div></div>';
  ov(h); if (y) $('ov').scrollTop = y;
}
function setOk(i, j) { E.steps[i].opts.forEach(function (o, k) { o.ok = k === j; }); renderEd(); }
function addOpt(i) { E.steps[i].opts = E.steps[i].opts || []; E.steps[i].opts.push({ t: '', ok: !E.steps[i].opts.length, w: '' }); renderEd(); }
function delOpt(i, j) { E.steps[i].opts.splice(j, 1); renderEd(); }
function addStep(i) { E.steps.splice(i, 0, { d: '', res: '' }); renderEd(); }
function delStep(i) { E.steps.splice(i, 1); renderEd(); }
function mvStep(i, d) { var j = i + d; if (j < 0 || j >= E.steps.length) return; var x = E.steps[i]; E.steps[i] = E.steps[j]; E.steps[j] = x; renderEd(); }
function autoSteps() {
  if (!E.solutionText.trim()) return toast('Сначала вставьте текст решения');
  var go = function () { E.steps = GEN.build(E.solutionText, E.solutionImage); renderEd(); toast('Готово: ' + E.steps.length + ' шагов. Проверьте вопросы и варианты.'); };
  if (E.steps.length) confirmBox('Заменить текущие шаги (' + E.steps.length + ') новыми, собранными из решения?', go);
  else go();
}
function prevStep(i) { var s = E.steps[i]; var el = $('pv' + i); el.innerHTML = '<div class="prv"><div class="todo"><span class="tk">Что делаем</span><div class="q">' + fmt(s.d) + '</div></div><div class="sol"><div class="stp"><span class="n">' + (i + 1) + '</span><div class="mx">' + fmt(s.res) + '</div></div></div></div>'; TS(el); }
function prevAll() { var el = $('pva'); el.innerHTML = '<div class="prv"><div class="task mx">' + fmt(E.taskText) + '</div><hr><div class="mx">' + fmt(E.solutionText) + '</div></div>'; TS(el); }
function edSave() {
  E.steps = (E.steps || []).filter(function (s) { return (s.d || '').trim() || (s.res || '').trim(); }).map(function (s) { return { d: s.d || '', res: s.res || '' }; });
  delete E.isNew;
  if (Eid) { var i = DB.tasks.findIndex(function (t) { return t.id == Eid; }); DB.tasks[i] = E; } else DB.tasks.push(E);
  markDirty(); closeOv(); toast('Задача сохранена. Чтобы изменения остались в приложении — «💾 Сохранить → в приложение».', 4000);
  if (E.theory) menu(); else openT(E.id);
}
function delTask() { var id = Eid; if (!id) return closeOv(); confirmBox('Удалить задачу «' + esc(E.title) + '» насовсем?', function () { closeOv(); DB.tasks = DB.tasks.filter(function (t) { return t.id != id; }); markDirty(); menu(); toast('Задача удалена'); }); }
// ---------------- сохранение ----------------
function saveMenu(ev) {
  ev.stopPropagation(); var w = ev.target.parentNode, m = w.querySelector('.menu'); if (m) return m.remove();
  m = document.createElement('div'); m.className = 'menu';
  m.innerHTML = '<button onclick="saveApp()">☁️ Сохранить в приложение<br><span class="meta">все правки останутся по этой ссылке</span></button>' +
    '<button onclick="dlHTML()">⬇️ Скачать приложение (.html)<br><span class="meta">работает офлайн, со всеми задачами</span></button>' +
    '<button onclick="dlJSON()">⬇️ Скачать задачи (.json)</button>' +
    '<button onclick="$(\'imp\').click()">⬆️ Загрузить задачи из .json</button>' +
    '<button onclick="dlProg()">⬇️ Мой прогресс (.json)</button>';
  w.appendChild(m); setTimeout(function () { document.addEventListener('click', function f() { m.remove(); document.removeEventListener('click', f); }); }, 0);
}
function buildHTML(db) {
  var j = JSON.stringify(db).replace(/</g, '\\u003c');
  return '<!DOCTYPE html>\n<html lang="ru"><head>' + HEAD + '<style id="CSS">' + $('CSS').textContent + '</style></head><body><header id="hdr"></header><main id="app"></main>\n<script type="application/json" id="DB">' + j + '<\/script>\n<script id="GEN">' + $('GEN').textContent + '<\/script>\n<script id="STKJS">' + $('STKJS').textContent + '<\/script>\n<script id="APP">' + $('APP').textContent + '<\/script>\n</body></html>';
}
function clean() { var d = JSON.parse(JSON.stringify(DB)); d.savedAt = Date.now(); return d; }
var capA = null, capD = null;
if (window.claude && claude.use) { claude.use('artifact').then(function (a) { capA = a; }); claude.use('downloads').then(function (d) { capD = d; }); }
function saveApp() {
  if (!capA) return toast('Сохранение в приложение здесь недоступно. Скачайте .html или .json — ничего не потеряется.', 4500);
  var d = clean(); toast('Сохраняю…');
  capA.publish(buildHTML(d)).then(function () { lsDel('draft'); DRAFT = false; toast('✓ Сохранено в приложение'); })
    .catch(function (e) { toast(e && e.code === 'conflict' ? 'Приложение только что обновили в другом окне — повторите правку.' : 'Не удалось сохранить: ' + esc((e && (e.message || e.code)) || e) + '. Скачайте .html, чтобы не потерять правки.', 5000); });
}
function dl(name, data) {
  if (!capD) return toast('Скачивание здесь недоступно — откройте приложение на claude.ai.', 4000);
  capD.save({ filename: name, data: data }).then(function () { toast('✓ Файл передан на сохранение'); }).catch(function (e) { if (e && e.code !== 'declined') toast('Не удалось скачать: ' + esc(e.message || e.code)); });
}
function dlHTML() { dl('финансовая-задача-тренажер.html', buildHTML(clean())); }
function dlJSON() { dl('ege-финансовая-задача.json', JSON.stringify(DB.tasks.map(function (t) { var x = JSON.parse(JSON.stringify(t)); return x; }), null, 1)); }
function dlProg() { dl('прогресс.json', JSON.stringify(P, null, 1)); }
function importJSON(f) {
  var r = new FileReader(); r.onload = function () {
    try {
      var d = JSON.parse(r.result), arr = Array.isArray(d) ? d : (d.tasks || []);
      if (!arr.length) return toast('В файле нет задач');
      ov('<div class="card"><p style="font-size:17px">В файле задач: <b>' + arr.length + '</b>. Как загрузить?</p><div class="bar"><button onclick="closeOv()">Отмена</button><span class="sp"></span><button id="imA">Добавить к текущим (новые/обновлённые)</button><button class="dang" id="imR">Заменить все задачи</button></div></div>');
      var prep = function (t) { if (!t.id) t.id = Date.now() + Math.floor(Math.random() * 1e6); if (!t.steps && t.solutionText) t.steps = GEN.build(t.solutionText, t.solutionImage); t.steps = t.steps || []; return t; };
      $('imA').onclick = function () { var n = 0, u = 0; arr.forEach(function (t) { t = prep(t); var i = DB.tasks.findIndex(function (x) { return x.id == t.id; }); if (i >= 0) { DB.tasks[i] = t; u++; } else { DB.tasks.push(t); n++; } }); markDirty(); closeOv(); menu(); toast('Добавлено ' + n + ', обновлено ' + u); };
      $('imR').onclick = function () { DB.tasks = arr.map(prep); markDirty(); closeOv(); menu(); toast('Загружено задач: ' + arr.length); };
    } catch (e) { toast('Не получилось прочитать файл: ' + esc(e.message)); }
  }; r.readAsText(f);
}
// ---------------- старт ----------------
(function () { var i = document.createElement('input'); i.type = 'file'; i.id = 'imp'; i.accept = '.json,application/json'; i.style.display = 'none'; i.onchange = function () { if (i.files[0]) importJSON(i.files[0]); i.value = ''; }; document.body.appendChild(i); })();
header();
(function () { var m = location.hash.match(/^#t(\d+)$/); if (m && find(m[1])) openT(m[1]); else menu(); })();
</script>
