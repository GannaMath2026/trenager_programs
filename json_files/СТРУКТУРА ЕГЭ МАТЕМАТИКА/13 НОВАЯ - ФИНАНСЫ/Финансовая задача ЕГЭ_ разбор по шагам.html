 \\(4,2\\) млн рублей;\r\n– выплаты в 2030 и 2031 годах равны;\r\n– к июлю 2031 года долг будет выплачен полностью.\r\nНайдите \\(r\\), если известно, что общая сумма выплат равна \\(6,1\\) млн рублей.", "taskImage": "", "answerText": "10", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\r\n\\( S = 4.2 \\) млн руб. — сумма кредита.\r\n\\( r \\) — процентная ставка.\r\n\\( a = 1 + \\frac{r}{100} \\) – коэффициент УВЕЛИЧЕНИЯ НА \\(r\\%\\)\r\n\\( \\frac{r}{100} = a - 1 \\) – коэффициент ВЗЯТИЯ  \\(r\\%\\)\r\n\\( N = 5 \\) лет\r\n\r\nВ июле 2027, 2028, 2029 годов долг остается равным \\( S \\).\r\nЭто означает, что в эти годы выплачиваются только проценты: \\( S \\cdot r=S \\cdot (a - 1) \\)\r\n\r\nВыплаты в 2030 и 2031 годах равны \\( x \\) млн руб.\r\nК июлю 2031 года долг полностью погашен.\r\nОбщая сумма выплат равна \\( T = 6.1 \\) млн руб.\r\n\r\n\u003cstrong>Найти:\u003c/strong> \\( r \\).\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа (млн руб.)\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>2027\u003c/td>\u003ctd>\\( S \\cdot a - S(a - 1) = S \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>2028\u003c/td>\u003ctd>\\( S \\cdot a - S(a - 1) = S \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>2029\u003c/td>\u003ctd>\\( S \\cdot a - S(a - 1) = S \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>2030\u003c/td>\u003ctd>\\( S \\cdot a - x \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>2031\u003c/td>\u003ctd>\\( (S \\cdot a - x) \\cdot a - x = 0 \\)\r\nИТОГОВОЕ УРАВНЕНИЕ\u003c/td>\u003c/tr>\r\n\u003c/table>\r\nПосле раскрытия скобок:\r\n\\( S \\cdot a^2 - x \\cdot a - x = 0 \\)\r\n\\( S \\cdot a^2 = x(a + 1) \\)\r\n\\( x = \\frac{S \\cdot a^2}{a + 1} = \\frac{4.2 \\cdot a^2}{a + 1} \\)\r\n\r\nОбщая сумма выплат = 3 года проценты \\( S(a - 1) \\)+ 2 года по \\(x\\):\r\nОСВ = \\( 3 \\cdot S(a - 1) + 2x= 6.1  \\)\r\n\r\nПодставляем \\( S = 4.2 \\) и \\( x = \\frac{4.2 \\cdot a^2}{a + 1} \\):\r\n\\( 6.1 = 3 \\cdot 4.2(a - 1) + 2 \\cdot \\frac{4.2 \\cdot a^2}{a + 1} \\)\r\n\\( 6.1 = 12.6(a - 1) + \\frac{8.4 \\cdot a^2}{a + 1} \\)\r\n\r\n\u003cstrong>Домножаем на общий знаменатель \\( a + 1 \\):\u003c/strong>\r\n\\( 6.1a + 6.1 = 12.6(a^2 - 1) + 8.4a^2 \\)\r\nПереносим все в одну сторону и Домножаем на 10, чтобы избавиться от десятичных дробей:\r\n\\( 21a^2 - 61a - 187 = 0 \\)\r\n\\( a = 1.1 \\)\r\n(Отрицательный корень не подходит)\r\n\r\nОтсюда:\r\n\\(a= 1 + \\frac{r}{100} = 1.1 \\)\r\n\\( r = 10\\% \\)\r\n\r\n\u003cstrong>Ответ:\u003c/strong> процентная ставка равна \u003cstrong>10%\u003c/strong>.\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "https://3.shkolkovo.online/catalog/131/175428", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 4.2 \\) млн руб. — сумма кредита.\n\\( r \\) — процентная ставка.\n\\( a = 1 + \\frac{r}{100} \\) – коэффициент УВЕЛИЧЕНИЯ НА \\(r\\%\\)\n\\( \\frac{r}{100} = a - 1 \\) – коэффициент ВЗЯТИЯ  \\(r\\%\\)\n\\( N = 5 \\) лет\n\nВ июле 2027, 2028, 2029 годов долг остается равным \\( S \\).\nЭто означает, что в эти годы выплачиваются только проценты: \\( S \\cdot r=S \\cdot (a - 1) \\)\n\nВыплаты в 2030 и 2031 годах равны \\( x \\) млн руб.\nК июлю 2031 года долг полностью погашен.\nОбщая сумма выплат равна \\( T = 6.1 \\) млн руб.\n\u003cstrong>Найти:\u003c/strong> \\( r \\)."}, {"d": "Составляем таблицу платежей", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа (млн руб.)\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>2027\u003c/td>\u003ctd>\\( S \\cdot a - S(a - 1) = S \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2028\u003c/td>\u003ctd>\\( S \\cdot a - S(a - 1) = S \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2029\u003c/td>\u003ctd>\\( S \\cdot a - S(a - 1) = S \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2030\u003c/td>\u003ctd>\\( S \\cdot a - x \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2031\u003c/td>\u003ctd>\\( (S \\cdot a - x) \\cdot a - x = 0 \\)\nИТОГОВОЕ УРАВНЕНИЕ\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "После раскрытия скобок", "res": "После раскрытия скобок:\n\\( S \\cdot a^2 - x \\cdot a - x = 0 \\)\n\\( S \\cdot a^2 = x(a + 1) \\)\n\\( x = \\frac{S \\cdot a^2}{a + 1} = \\frac{4.2 \\cdot a^2}{a + 1} \\)"}, {"d": "Записываем общую сумму выплат", "res": "Общая сумма выплат = 3 года проценты \\( S(a - 1) \\)+ 2 года по \\(x\\):\nОСВ = \\( 3 \\cdot S(a - 1) + 2x= 6.1  \\)"}, {"d": "Подставляем известные значения", "res": "Подставляем \\( S = 4.2 \\) и \\( x = \\frac{4.2 \\cdot a^2}{a + 1} \\):\n\\( 6.1 = 3 \\cdot 4.2(a - 1) + 2 \\cdot \\frac{4.2 \\cdot a^2}{a + 1} \\)\n\\( 6.1 = 12.6(a - 1) + \\frac{8.4 \\cdot a^2}{a + 1} \\)"}, {"d": "Домножаем на общий знаменатель \\( a + 1 \\)", "res": "\u003cstrong>Домножаем на общий знаменатель \\( a + 1 \\):\u003c/strong>\n\\( 6.1a + 6.1 = 12.6(a^2 - 1) + 8.4a^2 \\)"}, {"d": "Переносим все в одну сторону и Домножаем на 10, чтобы избавиться от десятичных дробей", "res": "Переносим все в одну сторону и Домножаем на 10, чтобы избавиться от десятичных дробей:\n\\( 21a^2 - 61a - 187 = 0 \\)\n\\( a = 1.1 \\)\n(Отрицательный корень не подходит)"}, {"d": "Отсюда", "res": "Отсюда:\n\\(a= 1 + \\frac{r}{100} = 1.1 \\)\n\\( r = 10\\% \\)"}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> процентная ставка равна \u003cstrong>10%\u003c/strong>."}], "lvl": 5}, {"id": 1772890337970, "title": "50 - 91742 НЕПРОСТАЯ СИСТЕМА", "sectionName": "2 - АННУИТЕТ", "difficulty": "hard", "taskText": "В июле 2024 года планируется взять кредит в банке на некоторую сумму. Условия его возврата таковы:\n– каждый январь долг возрастает на r%   по сравнению с концом предыдущего года;\n– с февраля по июнь каждого года необходимо выплатить одним платежом часть долга.\nИзвестно, что если ежегодно выплачивать по 65 610 рублей, то кредит будет полностью погашен за 4 года, \nа если ежегодно выплачивать по 117 450 рублей, то кредит будет полностью погашен за 2 года. \nНайдите число r.", "taskImage": "", "answerText": "12,5", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\r\n\\( S \\) — сумма кредита (руб.).\r\n\\( r \\) — процентная ставка.\r\n\\( a = 1 + \\frac{r}{100} \\)\r\nПлатежи: \r\n\\( A = 65610 \\) руб. за 4 года, \r\n\\( B = 117450 \\) руб. за 2 года.\r\n\r\n\u003cstrong>Найти:\u003c/strong> \\( r \\).\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа для 4 лет (руб.)\u003c/th>\u003cth>Долг после начисления и платежа для 2 лет (руб.)\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot a - A \\)\u003c/td>\u003ctd>\\( S \\cdot a - B \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (S \\cdot a - A) \\cdot a - A \\)\u003c/td>\u003ctd>\\( (S \\cdot a - B) \\cdot a - B = 0 \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( ((S \\cdot a - A) \\cdot a - A) \\cdot a - A \\)\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\\( (((S \\cdot a - A) \\cdot a - A) \\cdot a - A) \\cdot a - A = 0 \\)\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\r\n\u003c/table>\r\nПосле раскрытия скобок  и группировки:\r\nДля 4 лет:\r\n\\( S \\cdot a^4 - A(a^3 + a^2 + a + 1) = 0 \\)\r\n\\( S \\cdot a^4 = A(a^3 + a^2 + a + 1) \\)\r\nВыполним справа группировку:\r\n\\( S \\cdot a^4 = A(a+1)(a^2+1) \\quad\\)  [1]\r\n\r\nДля 2 лет:\r\n\\( S \\cdot a^2 - B(a + 1) = 0 \\)\r\n\\( S \\cdot a^2 = B(a + 1) \\)\r\nДомножим на \\(a^2\\):\r\n\\( S \\cdot a^4 = B(a + 1) \\cdot a^2 \\quad \\quad \\quad \\) [2]\r\n\r\nПриравняем правые части уравнений [1] и [2]:\r\n\\( B(a + 1)a^2 = A(a + 1)(a^2 + 1) \\)\r\n\r\nСокращаем на \\( a + 1 > 0 \\):\r\n\\( B a^2 = A(a^2 + 1) \\)\r\n\r\nПодставляем \\( A = 65610 \\), \\( B = 117450 \\):\r\n\\( 117450a^2 = 65610(a^2 + 1) \\) сокращаем на 81\r\n\\( 145a^2 = 81(a^2 + 1) \\)\r\n\\( 64a^2 =81 \\)\r\n\\( a = {\\frac{9}{8}} \\)\r\n\\( a = 1.125 \\)\r\n\r\nОтсюда:\r\n\\( a = 1 + \\frac{r}{100} = 1.125 \\)\r\n\\( \\frac{r}{100} = 0.125 \\)\r\n\\( r = 12.5\\% \\)\r\n\r\n\u003cstrong>Ответ:\u003c/strong> \\( r = 12.5\\% \\).\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "https://3.shkolkovo.online/catalog/131/91742", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S \\) — сумма кредита (руб.).\n\\( r \\) — процентная ставка.\n\\( a = 1 + \\frac{r}{100} \\)\n\nПлатежи: \n\\( A = 65610 \\) руб. за 4 года, \n\\( B = 117450 \\) руб. за 2 года.\n\u003cstrong>Найти:\u003c/strong> \\( r \\)."}, {"d": "Составляем таблицу платежей", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа для 4 лет (руб.)\u003c/th>\u003cth>Долг после начисления и платежа для 2 лет (руб.)\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot a - A \\)\u003c/td>\u003ctd>\\( S \\cdot a - B \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (S \\cdot a - A) \\cdot a - A \\)\u003c/td>\u003ctd>\\( (S \\cdot a - B) \\cdot a - B = 0 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( ((S \\cdot a - A) \\cdot a - A) \\cdot a - A \\)\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\\( (((S \\cdot a - A) \\cdot a - A) \\cdot a - A) \\cdot a - A = 0 \\)\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "После раскрытия скобок  и группировки", "res": "После раскрытия скобок  и группировки:\nДля 4 лет:\n\\( S \\cdot a^4 - A(a^3 + a^2 + a + 1) = 0 \\)\n\\( S \\cdot a^4 = A(a^3 + a^2 + a + 1) \\)"}, {"d": "Выполним справа группировку", "res": "Выполним справа группировку:\n\\( S \\cdot a^4 = A(a+1)(a^2+1) \\quad\\)  [1]"}, {"d": "Для 2 лет", "res": "Для 2 лет:\n\\( S \\cdot a^2 - B(a + 1) = 0 \\)\n\\( S \\cdot a^2 = B(a + 1) \\)\nДомножим на \\(a^2\\):\n\\( S \\cdot a^4 = B(a + 1) \\cdot a^2 \\quad \\quad \\quad \\) [2]"}, {"d": "Приравняем правые части уравнений [1] и [2]", "res": "Приравняем правые части уравнений [1] и [2]:\n\\( B(a + 1)a^2 = A(a + 1)(a^2 + 1) \\)"}, {"d": "Сокращаем на ", "res": "Сокращаем на \\( a + 1 > 0 \\):\n\\( B a^2 = A(a^2 + 1) \\)"}, {"d": "Подставляем известные значения", "res": "Подставляем \\( A = 65610 \\), \\( B = 117450 \\):\n\\( 117450a^2 = 65610(a^2 + 1) \\) сокращаем на 81\n\\( 145a^2 = 81(a^2 + 1) \\)\n\\( 64a^2 =81 \\)\n\\( a = {\\frac{9}{8}} \\)\n\\( a = 1.125 \\)"}, {"d": "Отсюда", "res": "Отсюда:\n\\( a = 1 + \\frac{r}{100} = 1.125 \\)\n\\( \\frac{r}{100} = 0.125 \\)\n\\( r = 12.5\\% \\)"}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> \\( r = 12.5\\% \\)."}], "lvl": 5}, {"id": 1791322462941, "title": "43 аналог", "sectionName": "3 - АННУИТЕТ - НЕФОРМАТ", "difficulty": "basic", "taskText": "\u003ca href=\"https://math-ege.sdamgia.ru/problem?id=561451\" target=\"_blank\">🔍 АНАЛОГ 561451\u003c/a>\nАндрей как начинающий предприниматель 31 декабря взял в кредит некоторую сумму в беспроцентном банке «Aliquot Bank». Он планирует погасить кредит в течение года, ежемесячно возвращая долг по следующей схеме: в январе Андрей возвращает банку половину взятой суммы, в феврале он возвращает треть остатка, в марте он возвращает четверть остатка и так далее в течение года, в том числе и в ноябре. В декабре Андрей возвращает банку 100 тыс. руб. и полностью погашает долг. Какую сумму денег (в тыс. руб.) Андрей взял в этом банке?", "taskImage": "", "answerText": "1200.", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\n\\( S \\) тыс. руб. — беспроцентный кредит.\nЯнварь: возвращается \\( \\frac{1}{2} \\) долга, февраль — \\( \\frac{1}{3} \\) остатка, …, ноябрь — \\( \\frac{1}{12} \\) остатка.\nДекабрь: возвращается 100 тыс. руб., долг погашен.\n\u003cstrong>Найти:\u003c/strong> \\( S \\).\n\n\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>Возвращает\u003c/th>\u003cth>Остаток долга\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Январь\u003c/td>\u003ctd>\\( \\frac{1}{2} \\) долга\u003c/td>\u003ctd>\\( S \\cdot \\frac{1}{2} \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Февраль\u003c/td>\u003ctd>\\( \\frac{1}{3} \\) остатка\u003c/td>\u003ctd>\\( S \\cdot \\frac{1}{2} \\cdot \\frac{2}{3} \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Март\u003c/td>\u003ctd>\\( \\frac{1}{4} \\) остатка\u003c/td>\u003ctd>\\( S \\cdot \\frac{1}{2} \\cdot \\frac{2}{3} \\cdot \\frac{3}{4} \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>...\u003c/td>\u003ctd>...\u003c/td>\u003ctd>...\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Ноябрь\u003c/td>\u003ctd>\\( \\frac{1}{12} \\) остатка\u003c/td>\u003ctd>\\( S \\cdot \\frac{1}{2} \\cdot \\frac{2}{3} \\cdot \\dots \\cdot \\frac{11}{12} \\)\u003c/td>\u003c/tr>\n\u003c/table>\n\n\\( \\frac{1}{2} \\cdot \\frac{2}{3} \\cdot \\frac{3}{4} \\cdot \\dots \\cdot \\frac{11}{12} = \\frac{1}{12} \\)\nОстаток после ноября: \\( \\frac{S}{12} \\).\n\n\\( \\frac{S}{12} = 100 \\rightarrow S = 1200 \\)\n\n\u003cstrong>Ответ:\u003c/strong> 1200 тыс. рублей.", "solutionImage": "", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S \\) тыс. руб. — беспроцентный кредит.\nЯнварь: возвращается \\( \\frac{1}{2} \\) долга, февраль — \\( \\frac{1}{3} \\) остатка, …, ноябрь — \\( \\frac{1}{12} \\) остатка.\nДекабрь: возвращается 100 тыс. руб., долг погашен.\n\u003cstrong>Найти:\u003c/strong> \\( S \\)."}, {"d": "Составляем таблицу остатка долга", "res": "\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>Возвращает\u003c/th>\u003cth>Остаток долга\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Январь\u003c/td>\u003ctd>\\( \\frac{1}{2} \\) долга\u003c/td>\u003ctd>\\( S \\cdot \\frac{1}{2} \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Февраль\u003c/td>\u003ctd>\\( \\frac{1}{3} \\) остатка\u003c/td>\u003ctd>\\( S \\cdot \\frac{1}{2} \\cdot \\frac{2}{3} \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Март\u003c/td>\u003ctd>\\( \\frac{1}{4} \\) остатка\u003c/td>\u003ctd>\\( S \\cdot \\frac{1}{2} \\cdot \\frac{2}{3} \\cdot \\frac{3}{4} \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>...\u003c/td>\u003ctd>...\u003c/td>\u003ctd>...\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Ноябрь\u003c/td>\u003ctd>\\( \\frac{1}{12} \\) остатка\u003c/td>\u003ctd>\\( S \\cdot \\frac{1}{2} \\cdot \\frac{2}{3} \\cdot \\dots \\cdot \\frac{11}{12} \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Сокращаем произведение", "res": "\\( \\frac{1}{2} \\cdot \\frac{2}{3} \\cdot \\frac{3}{4} \\cdot \\dots \\cdot \\frac{11}{12} = \\frac{1}{12} \\)\nОстаток после ноября: \\( \\frac{S}{12} \\)."}, {"d": "Составляем уравнение", "res": "\\( \\frac{S}{12} = 100 \\rightarrow S = 1200 \\)"}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> 1200 тыс. рублей."}], "byClaude": true, "lvl": 1}, {"id": 1784021642553, "title": "51 - 552514 - ХИТРЫЕ ПЛАТЕЖИ", "sectionName": "3 - АННУИТЕТ - НЕФОРМАТ", "difficulty": "basic", "taskText": "\u003ca href=\"https://ege.sdamgia.ru/problem?id=552514\" target=\"_blank\">🔍 АНАЛОГ 552514\u003c/a>\r\nВ начале месяца Артем взял в банке кредит 2,4 млн рублей с месячной процентной ставкой 5% на 12 месяцев с погашением кредита по следующей схеме:\r\n— в начале каждого месяца банк увеличивает долг на 5%;\r\n— выплаты производятся в конце каждого месяца;\r\n— каждая следующая выплата на 5% больше предыдущей.\r\nСколько рублей должна составлять первая выплата, чтобы Артем погасил свой кредит по указанной схеме за 12 месяцев?\r\n\u003cstrong>Ответ:\u003c/strong> 210000.\r\n", "taskImage": "", "answerText": "210000", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\r\n\\( S = 2.4 \\) млн.руб. — сумма кредита.\r\n\\( r = 5\\% \\)\r\n\\( a = 1 + \\frac{5}{100} = 1.05 \\)\r\nСрок: \\( n = 12 \\) месяцев.\r\nВыплаты: каждая следующая на \\( 5\\% \\) больше предыдущей, то есть образуют геометрическую прогрессию со знаменателем \\( a = 1.05 \\).\r\nПервая выплата: \\( x \\) руб.\r\n\r\n\u003cstrong>Найти:\u003c/strong> \\( x \\).\r\n\u003ctable>\r\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>Долг после начисления и выплаты (руб.)\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot a - x \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (S \\cdot a - x)a – xa  = S \\cdot a^2 - 2xa \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( (S \\cdot a^2 - 2xa)a – xa^2  = S \\cdot a^3 - 3xa^2 \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>...\u003c/td>\u003ctd>...\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>12\u003c/td>\u003ctd>\\( S \\cdot a^{12} - 12x \\cdot a^{11}= 0 \\)\r\nИТОГОВОЕ УРАВНЕНИЕ\r\n\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\r\n\u003cB>УРАВНЕНИЕ после раскрытия скобок:\u003c/B>\r\n\\( S \\cdot a^{12} = 12 \\cdot x \\cdot a^{11} \\)\r\nДелим на \\(a^{11}\\), подставляем \\(S=2.4\\) и \\(a=1.05\\):\r\n\\( 2.4 \\cdot 1.05 = 12 \\cdot x \\)\r\n\\( x =0.21 \\) млн.руб\r\n\u003cstrong>Ответ:\u003c/strong> первая выплата должна составлять \u003cstrong>210000 рублей\u003c/strong>.\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "https://ege.sdamgia.ru/problem?id=552514", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 2.4 \\) млн.руб. — сумма кредита.\n\\( r = 5\\% \\)\n\\( a = 1 + \\frac{5}{100} = 1.05 \\)\nСрок: \\( n = 12 \\) месяцев.\nВыплаты: каждая следующая на \\( 5\\% \\) больше предыдущей, то есть образуют геометрическую прогрессию со знаменателем \\( a = 1.05 \\).\nПервая выплата: \\( x \\) руб.\n\u003cstrong>Найти:\u003c/strong> \\( x \\)."}, {"d": "Составляем таблицу платежей", "res": "\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>Долг после начисления и выплаты (руб.)\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot a - x \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (S \\cdot a - x)a – xa  = S \\cdot a^2 - 2xa \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( (S \\cdot a^2 - 2xa)a – xa^2  = S \\cdot a^3 - 3xa^2 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>...\u003c/td>\u003ctd>...\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>12\u003c/td>\u003ctd>\\( S \\cdot a^{12} - 12x \\cdot a^{11}= 0 \\)\nИТОГОВОЕ УРАВНЕНИЕ\n\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "УРАВНЕНИЕ после раскрытия скобок", "res": "\u003cB>УРАВНЕНИЕ после раскрытия скобок:\u003c/B>\n\\( S \\cdot a^{12} = 12 \\cdot x \\cdot a^{11} \\)\nДелим на \\(a^{11}\\), подставляем \\(S=2.4\\) и \\(a=1.05\\):\n\\( 2.4 \\cdot 1.05 = 12 \\cdot x \\)\n\\( x =0.21 \\) млн.руб"}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> первая выплата должна составлять \u003cstrong>210000 рублей\u003c/strong>."}], "lvl": 2}, {"id": 1784014738371, "title": "52 - 2192", "sectionName": "3 - АННУИТЕТ - НЕФОРМАТ", "difficulty": "hard", "taskText": "В банке был взят кредит под 20% годовых на следующих условиях:\n— по нечетным годам клиент в качестве ежегодного платежа выплачивает банку только проценты, начисленные на текущий долг в этом году;\n— по четным годам клиент в качестве ежегодного платежа выплачивает половину от текущего долга в этом году после начисления процентов, причем данный платеж должен быть больше \\( \\frac{1}{5} \\) от изначальной величины кредита;\n— как только платеж по четным годам становится меньше \\( \\frac{1}{5} \\) от кредита, то кредит полностью выплачивается одним платежом.\n\nСколько процентов от величины кредита составила общая сумма выплат по такому кредиту?", "taskImage": "", "answerText": "187.04", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\r\n\\( S \\) руб. — сумма кредита.\r\n\\( r = 20\\% \\)\r\n\\( a = 1 + \\frac{20}{100} = 1.2 \\)\r\nКредит погашается по условию:\r\n— \u003cb>нечетные годы\u003c/b>: выплачиваются только проценты, начисленные на текущий долг;\r\n— \u003cb>четные годы\u003c/b>: выплачивается половина от текущего долга после начисления процентов;\r\n— как только платеж по четным годам становится \u003cb>меньше \\( \\frac{1}{5}S \\)\u003c/b>, кредит полностью выплачивается одним платежом.\r\n\r\n\u003cstrong>Найти:\u003c/strong> общую сумму выплат в процентах от \\( S \\).\r\n\u003ctable> \u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг на конец года\u003c/th>\u003cth>Комментарий\u003c/th>\u003c/tr> \u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot 1.2 - 0.2S = S \\)\u003c/td>\u003ctd>нечетный — только проценты\u003c/td>\u003c/tr> \u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( S \\cdot 1.2 - 0.6S = 0.6S \\)\u003c/td>\u003ctd>четный — половина долга (\\( 0.6S > 0.2S \\))\u003c/td>\u003c/tr> \u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( 0.6S \\cdot 1.2 - 0.6S \\cdot 0.2 = 0.6S \\)\u003c/td>\u003ctd>нечетный — только проценты\u003c/td>\u003c/tr> \u003ctr>\u003ctd>4\u003c/td>\u003ctd>\\( 0.6S \\cdot 1.2 - 0.36S = 0.36S \\)\u003c/td>\u003ctd>четный — половина долга (\\( 0.36S > 0.2S \\))\u003c/td>\u003c/tr> \u003ctr>\u003ctd>5\u003c/td>\u003ctd>\\( 0.36S \\cdot 1.2 - 0.36S \\cdot 0.2 = 0.36S \\)\u003c/td>\u003ctd>нечетный — только проценты\u003c/td>\u003c/tr> \u003ctr>\u003ctd>6\u003c/td>\u003ctd>\\( 0.36S \\cdot 1.2 - 0.216S = 0.216S \\)\u003c/td>\u003ctd>четный — половина долга (\\( 0.216S > 0.2S \\))\u003c/td>\u003c/tr> \u003ctr>\u003ctd>7\u003c/td>\u003ctd>\\( 0.216S \\cdot 1.2 - 0.216S \\cdot 0.2 = 0.216S \\)\u003c/td>\u003ctd>нечетный — только проценты\u003c/td>\u003c/tr> \u003ctr>\u003ctd>8\u003c/td>\u003ctd>\\( 0.216S \\cdot 1.2 - 0.216S \\cdot 1.2 = 0 \\)\u003c/td>\u003ctd>четный — весь долг, т.к. \\( 0.216S \\cdot 1.2 \\cdot 0.5 = 0.1296S \u003c 0.2S \\)\u003c/td>\u003c/tr> \u003c/table>\r\n\u003cB>Общая сумма выплат:\u003c/B>\r\n\\( \\Sigma = 0.2S + 0.6S + 0.12S + 0.36S + 0.072S + 0.216S + 0.0432S + 0.2592S \\)\r\n\\( \\Sigma = 1.8704S \\)\r\n\r\n\u003cB>В процентах от величины кредита:\u003c/B>\r\n\\(\\frac {\\Sigma }{S} \\cdot 100\\%= \\frac{1.8704S }{S}\\cdot 100\\%=187.04\\%\\)\r\n\u003cstrong>Ответ:\u003c/strong> общая сумма выплат составит \r\n\u003cstrong>187.04%\u003c/strong> от величины кредита.\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "https://3.shkolkovo.online/catalog/172/2192", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S \\) руб. — сумма кредита.\n\\( r = 20\\% \\)\n\\( a = 1 + \\frac{20}{100} = 1.2 \\)\n\nКредит погашается по условию:\n— \u003cb>нечетные годы\u003c/b>: выплачиваются только проценты, начисленные на текущий долг;\n— \u003cb>четные годы\u003c/b>: выплачивается половина от текущего долга после начисления процентов;\n— как только платеж по четным годам становится \u003cb>меньше \\( \\frac{1}{5}S \\)\u003c/b>, кредит полностью выплачивается одним платежом.\n\u003cstrong>Найти:\u003c/strong> общую сумму выплат в процентах от \\( S \\)."}, {"d": "Составляем таблицу долга по годам", "res": "\u003ctable> \u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг на конец года\u003c/th>\u003cth>Комментарий\u003c/th>\u003c/tr> \u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot 1.2 - 0.2S = S \\)\u003c/td>\u003ctd>нечетный — только проценты\u003c/td>\u003c/tr> \u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( S \\cdot 1.2 - 0.6S = 0.6S \\)\u003c/td>\u003ctd>четный — половина долга (\\( 0.6S > 0.2S \\))\u003c/td>\u003c/tr> \u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( 0.6S \\cdot 1.2 - 0.6S \\cdot 0.2 = 0.6S \\)\u003c/td>\u003ctd>нечетный — только проценты\u003c/td>\u003c/tr> \u003ctr>\u003ctd>4\u003c/td>\u003ctd>\\( 0.6S \\cdot 1.2 - 0.36S = 0.36S \\)\u003c/td>\u003ctd>четный — половина долга (\\( 0.36S > 0.2S \\))\u003c/td>\u003c/tr> \u003ctr>\u003ctd>5\u003c/td>\u003ctd>\\( 0.36S \\cdot 1.2 - 0.36S \\cdot 0.2 = 0.36S \\)\u003c/td>\u003ctd>нечетный — только проценты\u003c/td>\u003c/tr> \u003ctr>\u003ctd>6\u003c/td>\u003ctd>\\( 0.36S \\cdot 1.2 - 0.216S = 0.216S \\)\u003c/td>\u003ctd>четный — половина долга (\\( 0.216S > 0.2S \\))\u003c/td>\u003c/tr> \u003ctr>\u003ctd>7\u003c/td>\u003ctd>\\( 0.216S \\cdot 1.2 - 0.216S \\cdot 0.2 = 0.216S \\)\u003c/td>\u003ctd>нечетный — только проценты\u003c/td>\u003c/tr> \u003ctr>\u003ctd>8\u003c/td>\u003ctd>\\( 0.216S \\cdot 1.2 - 0.216S \\cdot 1.2 = 0 \\)\u003c/td>\u003ctd>четный — весь долг, т.к. \\( 0.216S \\cdot 1.2 \\cdot 0.5 = 0.1296S \u003c 0.2S \\)\u003c/td>\u003c/tr> \u003c/table>"}, {"d": "Общая сумма выплат", "res": "\u003cB>Общая сумма выплат:\u003c/B>\n\\( \\Sigma = 0.2S + 0.6S + 0.12S + 0.36S + 0.072S + 0.216S + 0.0432S + 0.2592S \\)\n\\( \\Sigma = 1.8704S \\)"}, {"d": "В процентах от величины кредита", "res": "\u003cB>В процентах от величины кредита:\u003c/B>\n\\(\\frac {\\Sigma }{S} \\cdot 100\\%= \\frac{1.8704S }{S}\\cdot 100\\%=187.04\\%\\)"}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> общая сумма выплат составит \n\u003cstrong>187.04%\u003c/strong> от величины кредита."}], "lvl": 4}, {"id": 1791321170425, "title": "32 аналог", "sectionName": "4 - ДИФПЛАТЕЖИ", "difficulty": "basic", "taskText": "\u003ca href=\" https://3.shkolkovo.online/catalog/131/19709\" target=\"_blank\">🔍 АНАЛОГ  19709\u003c/a>\nВ августе со 2-го по 15-е число 2026 года планируется взять кредит на 1200 тысяч рублей. Условия его возврата таковы:\n– первого числа каждого месяца долг увеличивается на 1%;\n– со 2-го по 15-е число каждого месяца на протяжении следующих 10 месяцев долг должен уменьшаться на одну и ту же величину по сравнению с предыдущим месяцем;\n– на одиннадцатый месяц перед начислением процентов остаток долга будет составлять 400 тысяч, после чего он погашается одним платежом.\nЧему равна общая сумма выплат?\n\u003cstrong>Ответ:\u003c/strong> 1288 тысяч рублей", "taskImage": "", "answerText": "1288 тысяч рублей", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 1200 \\) тыс. руб. — сумма кредита.\nПроценты: 1% в месяц, \\( a = 0{,}01 \\).\n10 месяцев: долг уменьшается на одну и ту же величину \\( x \\).\n11-й месяц: долг перед начислением = 400 тыс. руб., гасится одним платежом.\n\n\u003cstrong>Найти:\u003c/strong> общую сумму выплат.\n\n\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>10\u003c/th>\u003cth>11\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Погашение тела кредита (тыс. руб.)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( 400 \\)\u003c/td>\u003c/tr>\n\u003c/table>\nСУММА КРЕДИТА = \\( 10x + 400 = 1200 \\rightarrow x = 80 \\)\n\n\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>3\u003c/th>\u003cth>...\u003c/th>\u003cth>10\u003c/th>\u003cth>11\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления (тыс. руб.)\u003c/td>\u003ctd>1200\u003c/td>\u003ctd>1120\u003c/td>\u003ctd>1040\u003c/td>\u003ctd>...\u003c/td>\u003ctd>480\u003c/td>\u003ctd>400\u003c/td>\u003c/tr>\n\u003c/table>\n\n\u003cB>Платежи:\u003c/B>\n\\(П_i = \\text{Часть долга} + \\text{Проценты с долга до начисления}\\)\n\\(П_1 = 80 + 0{,}01 \\cdot 1200\\), …, \\(П_{10} = 80 + 0{,}01 \\cdot 480\\)\n\\(П_{11} = 400 + 0{,}01 \\cdot 400\\)\n\n\u003cB>Общая сумма выплат = СУММА КРЕДИТА + ПРОЦЕНТЫ С ДОЛГОВ:\u003c/B>\n\\( \\Sigma = 1200 + 0{,}01(1200 + 1120 + \\dots + 480 + 400) \\)\n\\( 1200 + \\dots + 480 = \\frac{1200 + 480}{2} \\cdot 10 = 8400 \\)\n\\( \\Sigma = 1200 + 0{,}01 \\cdot 8800 = 1288 \\) тыс. руб.\n\n\u003cstrong>Ответ:\u003c/strong> 1288 тысяч рублей.", "solutionImage": "", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 1200 \\) тыс. руб. — сумма кредита.\nПроценты: 1% в месяц, \\( a = 0{,}01 \\).\n10 месяцев: долг уменьшается на одну и ту же величину \\( x \\).\n11-й месяц: долг перед начислением = 400 тыс. руб., гасится одним платежом.\n\n\u003cstrong>Найти:\u003c/strong> общую сумму выплат."}, {"d": "Составляем таблицу 1: суммы в счёт погашения тела кредита", "res": "\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>10\u003c/th>\u003cth>11\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Погашение тела кредита (тыс. руб.)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( 400 \\)\u003c/td>\u003c/tr>\n\u003c/table>\nСУММА КРЕДИТА = \\( 10x + 400 = 1200 \\rightarrow x = 80 \\)"}, {"d": "Составляем таблицу 2: долг до начисления процентов", "res": "\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>3\u003c/th>\u003cth>...\u003c/th>\u003cth>10\u003c/th>\u003cth>11\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления (тыс. руб.)\u003c/td>\u003ctd>1200\u003c/td>\u003ctd>1120\u003c/td>\u003ctd>1040\u003c/td>\u003ctd>...\u003c/td>\u003ctd>480\u003c/td>\u003ctd>400\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Записываем платежи", "res": "\u003cB>Платежи:\u003c/B>\n\\(П_i = \\text{Часть долга} + \\text{Проценты с долга до начисления}\\)\n\\(П_1 = 80 + 0{,}01 \\cdot 1200\\), …, \\(П_{10} = 80 + 0{,}01 \\cdot 480\\)\n\\(П_{11} = 400 + 0{,}01 \\cdot 400\\)"}, {"d": "Записываем общую сумму выплат", "res": "\u003cB>Общая сумма выплат = СУММА КРЕДИТА + ПРОЦЕНТЫ С ДОЛГОВ:\u003c/B>\n\\( \\Sigma = 1200 + 0{,}01(1200 + 1120 + \\dots + 480 + 400) \\)\n\\( 1200 + \\dots + 480 = \\frac{1200 + 480}{2} \\cdot 10 = 8400 \\)\n\\( \\Sigma = 1200 + 0{,}01 \\cdot 8800 = 1288 \\) тыс. руб."}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> 1288 тысяч рублей."}], "byClaude": true, "lvl": 1}, {"id": 1778991485786, "title": "60 - 149498 авторская школково", "sectionName": "4 - ДИФПЛАТЕЖИ", "difficulty": "basic", "taskText": "28 ноября 2025 года планируется взять кредит на 49 месяцев. Условия погашения кредита следующие:\n– первого числа каждого месяца сумма долга увеличивается на \\(r\\%\\) по сравнению с концом предыдущего месяца;\n– со 2-го по 27-е число каждого месяца необходимо внести платёж в счёт погашения кредита;\n– 28-го числа каждого месяца долг должен быть на одну и ту же величину меньше долга на 28-е число предыдущего месяца.\n\nИзвестно, что общая сумма выплат по окончании срока кредитования окажется в 3 раза больше суммы, взятой в кредит. Найдите \\(r\\).", "taskImage": "", "answerText": "8", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\n\\( S \\) руб. — сумма кредита.\nСрок кредита: 49 месяцев.\nДолг уменьшается на одну и ту же величину каждый месяц \\(x\\).\nОбщая сумма выплат = \\( 3S \\) (в 3 раза больше кредита).\n\n\u003cstrong>Найти:\u003c/strong> \\( r \\).\n\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>48\u003c/th>\u003cth>49\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Погашение тела кредита\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\n\u003c/table>\nСУММА КРЕДИТА: \\( 49x = S \\rightarrow S = 49x \\)\n\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>48\u003c/th>\u003cth>49\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления\u003c/td>\u003ctd>\\( 49x \\)\u003c/td>\u003ctd>\\( 48x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( 2x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\n\u003c/table>\n\u003cB>Платежи:\u003c/B>\n\\(П_i = \\text{Часть долга} + \\text{Проценты с долга до начисления} \\)\n\\( П_1 = x + a (49x) \\)\n\\( П_2 = x + a (48x) \\)\n\\(\\cdots\\)\n\\( П_{49} = x + a (x) \\)\n\n\u003cB>Общая сумма выплат = СУММА КРЕДИТА + ПРОЦЕНТЫ С ДОЛГОВ:\u003c/B>\n\\( \\Sigma = 49x + a \\cdot (49x + 48x + \\dots + x) \\)\nВ скобках – арифметическая прогрессия:\n\\( \\Sigma = 49x + a \\cdot \\frac{(49x+x)\\cdot 49}{2} \\)\n\n\\( \\Sigma = 49x + a \\cdot 1225x \\)\n\nТак как \\( S = 49x \\), а \\( \\Sigma = 3S = 3 \\cdot 49x = 147x \\), получаем:\n\n\\( 147x = 49x + 1225a x \\)\n\nДелим на \\( x \\):\n\\( 147 = 49 + 1225a \\)\n\\( a  = 0.08 =\\frac{r}{100} \\rightarrow  r = 8 \\)\n\n\u003cstrong>Ответ:\u003c/strong> \\( r = 8\\% \\).", "solutionImage": "", "drawingImage": "", "solutionLink": "https://3.shkolkovo.online/catalog/11066/149498", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S \\) руб. — сумма кредита.\nСрок кредита: 49 месяцев.\nДолг уменьшается на одну и ту же величину каждый месяц \\(x\\).\nОбщая сумма выплат = \\( 3S \\) (в 3 раза больше кредита).\n\u003cstrong>Найти:\u003c/strong> \\( r \\)."}, {"d": "Составляем таблицу погашения тела кредита", "res": "\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>48\u003c/th>\u003cth>49\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Погашение тела кредита\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "СУММА КРЕДИТА", "res": "СУММА КРЕДИТА: \\( 49x = S \\rightarrow S = 49x \\)"}, {"d": "Составляем таблицу долга до начисления процентов", "res": "\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>48\u003c/th>\u003cth>49\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления\u003c/td>\u003ctd>\\( 49x \\)\u003c/td>\u003ctd>\\( 48x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( 2x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Платежи", "res": "\u003cB>Платежи:\u003c/B>\n\\(П_i = \\text{Часть долга} + \\text{Проценты с долга до начисления} \\)\n\\( П_1 = x + a (49x) \\)\n\\( П_2 = x + a (48x) \\)\n\\(\\cdots\\)\n\\( П_{49} = x + a (x) \\)"}, {"d": "Общая сумма выплат = СУММА КРЕДИТА + ПРОЦЕНТЫ С ДОЛГОВ", "res": "\u003cB>Общая сумма выплат = СУММА КРЕДИТА + ПРОЦЕНТЫ С ДОЛГОВ:\u003c/B>\n\\( \\Sigma = 49x + a \\cdot (49x + 48x + \\dots + x) \\)"}, {"d": "В скобках – арифметическая прогрессия", "res": "В скобках – арифметическая прогрессия:\n\\( \\Sigma = 49x + a \\cdot \\frac{(49x+x)\\cdot 49}{2} \\)"}, {"d": "Преобразуем и считаем", "res": "\\( \\Sigma = 49x + a \\cdot 1225x \\)"}, {"d": "Находим \\(S\\)", "res": "Так как \\( S = 49x \\), а \\( \\Sigma = 3S = 3 \\cdot 49x = 147x \\), получаем:"}, {"d": "Преобразуем и считаем", "res": "\\( 147x = 49x + 1225a x \\)"}, {"d": "Находим \\(a\\)", "res": "Делим на \\( x \\):\n\\( 147 = 49 + 1225a \\)\n\\( a  = 0.08 =\\frac{r}{100} \\rightarrow  r = 8 \\)"}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> \\( r = 8\\% \\)."}], "lvl": 1}, {"id": 1784130089127, "title": "539883", "sectionName": "4 - ДИФПЛАТЕЖИ", "difficulty": "basic", "taskText": "В июле планируется взять кредит на срок 6 лет. Условия его возврата таковы:\n— каждый январь долг возрастает на 12,5% по сравнению с концом предыдущего года;\n— с февраля по июнь каждого года необходимо выплатить часть долга;\n— в июле первых трех лет погашения кредита долг должен быть в два раза меньше долга на июль предыдущего года;\n— в июль последних трех лет долг должен быть на одну и ту же величину меньше долга на июль предыдущего года;\nЧему был равен изначальный кредит, если общая сумма выплат равна 1,6 млн рублей?", "taskImage": "", "answerText": "1,28", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\r\nПусть \\( S = 24x \\) млн руб. — сумма кредита.\r\nСрок кредита: 6 лет.\r\nСтавка: 12,5% (\\( a = 0.125 = \\frac{1}{8} \\)).\r\nПервые 3 года: долг уменьшается в 2 раза каждый год.\r\nПоследние 3 года: долг уменьшается на одну и ту же величину.\r\nОбщая сумма выплат = 1,6 млн руб.\r\n\r\n\u003cstrong>Найти:\u003c/strong> \\( S \\).\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>2025\u003c/th>\u003cth>2026\u003c/th>\u003cth>2027\u003c/th>\u003cth>2028\u003c/th>\u003cth>2029\u003c/th>\u003cth>2030\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>Погашение тела кредита\u003c/td>\u003ctd>\\( 12x \\)\u003c/td>\u003ctd>\\( 6x \\)\u003c/td>\u003ctd>\\( 3x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>2025\u003c/th>\u003cth>2026\u003c/th>\u003cth>2027\u003c/th>\u003cth>2028\u003c/th>\u003cth>2029\u003c/th>\u003cth>2030\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>Долг до начисления\u003c/td>\u003ctd>\\( 24x \\)\u003c/td>\u003ctd>\\( 12x \\)\u003c/td>\u003ctd>\\( 6x \\)\u003c/td>\u003ctd>\\( 3x \\)\u003c/td>\u003ctd>\\( 2x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\u003cB>Платежи:\u003c/B>\r\n\\(П_i = \\text{Часть долга} + \\text{Проценты с долга до начисления}\\)\r\n\r\n\\(П_1 = 12x + \\frac{1}{8}\\cdot 24x \\)\r\n\\(П_2 = 6x + \\frac{1}{8}\\cdot 12x \\)\r\n\\(П_3 = 3x + \\frac{1}{8}\\cdot 6x \\)\r\n\\(П_4 = x + \\frac{1}{8}\\cdot 3x \\)\r\n\\(П_5 = x + \\frac{1}{8} \\cdot 2x \\)\r\n\\(П_6 = x + \\frac{1}{8} \\cdot x \\)\r\n\r\n\u003cB>Общая сумма выплат = СУММА КРЕДИТА + ПРОЦЕНТЫ С ДОЛГОВ:\u003c/B>\r\n\\( \\Sigma = 24x + \\frac{1}{8}(48x)= 30x = 1.6 \\)\r\n\\( x = \\frac{4}{75} \\)\r\n\r\nТогда:\r\n\\( S = 24x = 24 \\cdot \\frac{4}{75} =  1.28 \\)\r\n\r\n\u003cstrong>Ответ:\u003c/strong> \\( S = 1.28 \\) млн рублей.\r\n", "solutionImage": "", "dr  + \\frac{1}{8} \\cdot x \\)"}, {"d": "Общая сумма выплат = СУММА КРЕДИТА + ПРОЦЕНТЫ С ДОЛГОВ", "res": "\u003cB>Общая сумма выплат = СУММА КРЕДИТА + ПРОЦЕНТЫ С ДОЛГОВ:\u003c/B>\n\\( \\Sigma = 24x + \\frac{1}{8}(48x)= 30x = 1.6 \\)\n\\( x = \\frac{4}{75} \\)"}, {"d": "Тогда", "res": "Тогда:\n\\( S = 24x = 24 \\cdot \\frac{4}{75} =  1.28 \\)"}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> \\( S = 1.28 \\) млн рублей."}], "lvl": 1}, {"id": 1791321194353, "title": "32 аналог", "sectionName": "4 - ДИФПЛАТЕЖИ", "difficulty": "basic", "taskText": "\u003ca href=\" https://3.shkolkovo.online/catalog/131/26920\" target=\"_blank\">🔍 АНАЛОГ  26920\u003c/a>\n15-го декабря планируется взять кредит в банке на 1000 тыс. рублей на 21 месяц. Условия его возврата таковы:\n– 1-го числа каждого месяца долг возрастает на r   % по сравнению с концом предыдущего месяца;\n– со 2-го по 14-е число каждого месяца необходимо выплатить часть долга;\n– 15-го числа с 1-го по 20-й месяцы долг должен быть на одну и ту же сумму меньше долга на 15-е число предыдущего месяца.\nИзвестно, что общая сумма выплат после полного погашения кредита составила 1441 тыс. рублей, \nа долг на 15-е число 20-го месяца — 400 тыс. рублей. \nНайдите r.", "taskImage": "", "answerText": "3", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 1000 \\) тыс. руб. — сумма кредита.\nСрок кредита: 21 месяц.\nПроценты: \\( r\\% \\), \\( a = \\frac{r}{100} \\).\nМесяцы 1–20: долг уменьшается на одну и ту же сумму \\( x \\); после 20-го месяца долг = 400.\n21-й месяц: остаток гасится полностью.\nОбщая сумма выплат = 1441 тыс. руб.\n\n\u003cstrong>Найти:\u003c/strong> \\( r \\).\n\n\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>20\u003c/th>\u003cth>21\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Погашение тела кредита (тыс. руб.)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( 400 \\)\u003c/td>\u003c/tr>\n\u003c/table>\nСУММА КРЕДИТА = \\( 20x + 400 = 1000 \\rightarrow x = 30 \\)\n\n\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>3\u003c/th>\u003cth>...\u003c/th>\u003cth>20\u003c/th>\u003cth>21\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления (тыс. руб.)\u003c/td>\u003ctd>1000\u003c/td>\u003ctd>970\u003c/td>\u003ctd>940\u003c/td>\u003ctd>...\u003c/td>\u003ctd>430\u003c/td>\u003ctd>400\u003c/td>\u003c/tr>\n\u003c/table>\n\n\u003cB>Платежи:\u003c/B>\n\\(П_i = \\text{Часть долга} + \\text{Проценты с долга до начисления}\\)\n\\(П_1 = 30 + a \\cdot 1000\\), \\(П_2 = 30 + a \\cdot 970\\), …, \\(П_{20} = 30 + a \\cdot 430\\)\n\\(П_{21} = 400 + a \\cdot 400\\)\n\n\u003cB>Общая сумма выплат = СУММА КРЕДИТА + ПРОЦЕНТЫ С ДОЛГОВ:\u003c/B>\n\\( \\Sigma = 1000 + a(1000 + 970 + \\dots + 430 + 400) = 1441 \\)\nВ скобках – арифметическая прогрессия: \\( \\frac{1000 + 400}{2} \\cdot 21 = 14700 \\)\n\\( 1000 + 14700a = 1441 \\rightarrow a = 0{,}03 = \\frac{r}{100} \\rightarrow r = 3\\% \\)\n\n\u003cstrong>Ответ:\u003c/strong> \\( r = 3\\% \\).", "solutionImage": "", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 1000 \\) тыс. руб. — сумма кредита.\nСрок кредита: 21 месяц.\nПроценты: \\( r\\% \\), \\( a = \\frac{r}{100} \\).\nМесяцы 1–20: долг уменьшается на одну и ту же сумму \\( x \\); после 20-го месяца долг = 400.\n21-й месяц: остаток гасится полностью.\nОбщая сумма выплат = 1441 тыс. руб.\n\n\u003cstrong>Найти:\u003c/strong> \\( r \\)."}, {"d": "Составляем таблицу 1: суммы в счёт погашения тела кредита", "res": "\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>20\u003c/th>\u003cth>21\u003c/th> 0 \\) тыс. руб. — сумма кредита.\nСрок кредита: \\( n + 1 \\) месяц.\nПроценты: 1%, \\( a = 0{,}01 \\).\nМесяцы 1…n: долг уменьшается на одну и ту же сумму \\( x \\); после n-го месяца долг = 300.\nВсего выплачено 755 тыс. руб.\n\n\u003cstrong>Найти:\u003c/strong> \\( n \\).\n\n\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>n\u003c/th>\u003cth>n + 1\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Погашение тела кредита (тыс. руб.)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( 300 \\)\u003c/td>\u003c/tr>\n\u003c/table>\nСУММА КРЕДИТА = \\( nx + 300 = 700 \\rightarrow nx = 400 \\)\n\n\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>n\u003c/th>\u003cth>n + 1\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления (тыс. руб.)\u003c/td>\u003ctd>\\( 700 \\)\u003c/td>\u003ctd>\\( 700 - x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( 300 + x \\)\u003c/td>\u003ctd>\\( 300 \\)\u003c/td>\u003c/tr>\n\u003c/table>\n\n\u003cB>Платежи:\u003c/B>\n\\(П_i = \\text{Часть долга} + \\text{Проценты с долга до начисления}\\)\n\\(П_1 = x + 0{,}01 \\cdot 700\\), …, \\(П_n = x + 0{,}01(300 + x)\\), \\(П_{n+1} = 300 + 0{,}01 \\cdot 300\\)\n\n\u003cB>Общая сумма выплат = СУММА КРЕДИТА + ПРОЦЕНТЫ С ДОЛГОВ:\u003c/B>\n\\( \\Sigma = 700 + 0{,}01(700 + (700 - x) + \\dots + 300) \\)\nВ скобках – арифметическая прогрессия из \\( n + 1 \\) членов: \\( \\frac{700 + 300}{2}(n + 1) = 500(n + 1) \\)\n\\( 700 + 5(n + 1) = 755 \\rightarrow n + 1 = 11 \\rightarrow n = 10 \\)\n\n\u003cstrong>Ответ:\u003c/strong> \\( n = 10 \\).", "solutionImage": "", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S = ctd>\\( 0.7S \\)\u003c/td>\u003ctd>\\( 0.4S \\)\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\u003cB>Платежи:\u003c/B>\r\n\\(П_i = \\text{Часть долга} + \\text{Проценты с долга до начисления}\\)\r\n\r\n\\(П_1 = 0.3S + 0.15S = 0.45S = \\frac{9}{20}S\\)\r\n\\(П_2 = 0.3S + 0.15 \\cdot 0.7S = 0.405S = \\frac{81}{200}S\\)\r\n\\(П_3 = 0.4S + 0.15 \\cdot 0.4S = 0.46S = \\frac{23}{50}S\\)\r\n\r\n\u003cB>Условие целочисленности:\u003c/B>\r\n\\( \\frac{9}{20}S \\) — целое → \\( S \\) кратно 20.\r\n\\( \\frac{81}{200}S \\) — целое → \\( S \\) кратно 200.\r\n\\( \\frac{23}{50}S \\) — целое → \\( S \\) кратно 50.\r\nНОК(20, 200, 50) = 200.\r\n\r\n\u003cstrong>Ответ:\u003c/strong> \\( S = 200 \\) тыс. рублей.\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "https://ege.sdamgia.ru/problem?id=514627", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S \\) тыс. руб. — сумма кредита.\n\\( S \\) — натуральное число.\nСрок кредита: 3 года (2017–2019).\nСтавка: 15% (\\( a = 0.15 \\)).\n\u003cstrong>Найти:\u003c/strong> наименьшее натуральное \\( S \\), при котором каждая выплата — целое число тысяч рублей."}, {"d": "Составляем таблицу погашения тела кредита", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>2017\u003c/th>\u003cth>2018\u003c/th>\u003cth>2019\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Погашение тела кредита (тыс. руб.)\u003c/td>\u003ctd>\\( 0.3S \\)\u003c/td>\u003ctd>\\( 0.3S \\)\u003c/td>\u003ctd>\\( 0.4S \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Составляем таблицу долга до начисления процентов", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>2017\u003c/th>\u003cth>2018\u003c/th>\u003cth>2019\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления (тыс. руб.)\u003c/td>\u003ctd>\\( S \\)\u003c/td>\u003ctd>\\( 0.7S \\)\u003c/td>\u003ctd>\\( 0.4S \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Платежи", "res": "\u003cB>Платежи:\u003c/B>\n\\(П_i = \\text{Часть долга} + \\text{Проценты с долга до начисления}\\)"}, {"d": "Находим \\(П_3 \\)", "res": "\\(П_1 = 0.3S + 0.15S = 0.45S = \\frac{9}{20}S\\)\n\\(П_2 = 0.3S + 0.15 \\cdot 0.7S = 0.405S = \\frac{81}{200}S\\)\n\\(П_3 = 0.4S + 0.15 \\cdot 0.4S = 0.46S = \\frac{23}{50}S\\)"}, {"d": "Условие целочисленности", "res": "\u003cB>Условие целочисленности:\u003c/B>\n\\( \\frac{9}{20}S \\) — целое → \\( S \\) кратно 20.\n\\( \\frac{81}{200}S \\) — целое → \\( S \\) кратно 200.\n\\( \\frac{23}{50}S \\) — целое → \\( S \\) кратно 50.\nНОК(20, 200, 50) = 200."}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> \\( S = 200 \\) тыс. рублей."}], "lvl": 2}, {"id": 1791320462664, "title": "22 аналог", "sectionName": "4 - ДИФПЛАТЕЖИ", "difficulty": "basic", "taskText": "\u003ca href=\" https://3.shkolkovo.online/catalog/4162/100640\" target=\"_blank\">🔍 АНАЛОГ 100640\u003c/a>\nВ сентябре 2027 года Мария планирует взять кредит в банке на 6 лет в размере 4,5 млн рублей. Условия его возврата таковы:\n— в январе 2028, 2029 и 2030 годов долг увеличивается на r%   от суммы долга на конец предыдущего года;\n— в январе 2031, 2032 и 2033 годов долг увеличивается на (r− 3)%   от суммы долга на конец предыдущего года;\n— в период с февраля по август необходимо выплатить часть долга;\n— в сентябре каждого года действия кредита долг должен быть на одну и ту же сумму меньше долга на сентябрь предыдущего года;\n— к сентябрю 2033 года кредит должен быть полностью погашен.\nИзвестно, что общая сумма выплат по кредиту должна составить 7,2 млн рублей. \nСколько рублей составит выплата 2032 года?", "taskImage": "", "answerText": "975000", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 4{,}5 \\) млн руб. — сумма кредита.\nСрок кредита: 6 лет (2028–2033).\nПроценты: 2028–2030 — \\( r\\% \\), \\( a = \\frac{r}{100} \\); 2031–2033 — \\( (r - 3)\\% \\), т.е. \\( a - 0{,}03 \\).\n\\ 2%, \\( a = 0{,}02 \\).\nВариант 1 — 24 месяца, вариант 2 — 30 месяцев.\n\\( x \\) — сумма, идущая в счёт погашения тела кредита каждый месяц.\n\n\u003cstrong>Найти:\u003c/strong> на сколько увеличится сумма выплат.\n\n\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>n\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Сумма в счет погашения тела кредита\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\n\u003c/table>\nСУММА КРЕДИТА = \\( nx = 600 \\)\n\n\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>n\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления процентов\u003c/td>\u003ctd>\\( nx \\)\u003c/td>\u003ctd>\\( (n-1)x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\n\u003c/table>\n\n\\(П_i\\)=Часть долга (из таблицы 1) + процент с долга (из таблицы 2)\n\u003cB>ОБЩАЯ СУММА ВЫПЛАТ \\(\\sum\\) = КРЕДИТ + ПРОЦЕНТЫ\u003c/B>\n\\( \\Sigma = nx + 0{,}02 \\cdot \\frac{(nx + x) \\cdot n}{2} = 600 + 0{,}01(n + 1) \\cdot 600 = 600 + 6(n + 1) \\)\n\n\\( \\Sigma_{24} = 600 + 6 \\cdot 25 = 750 \\)\n\\( \\Sigma_{30} = 600 + 6 \\cdot 31 = 786 \\)\n\\( 786 - 750 = 36 \\) тыс. руб.\n\n\u003cstrong>Ответ:\u003c/strong> 36 000 рублей.", "solutionImage": "", "drawingImage": "", "solutionLink": "https://ege.sdamgia.ru/problem?id=562005", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 600 \\) тыс. руб. — сумма кредита.\nПроценты: 2%, \\( a = 0{,}02 \\).\nВариант 1 — 24 месяца, вариант 2 — 30 месяцев.\n\\( x \\) — сумма, идущая в счёт погашения тела кредита каждый месяц.\n\n\u003cstrong>Найти:\u003c/strong> на сколько увеличится сумма выплат."}, {"d": "Составляем таблицу 1 (для n месяцев)", "res": "\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>n\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Сумма в счет погашения тела кредита\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\n\u003c/table>\nСУММА КРЕДИТА = \\( nx = 600 \\)"}, {"d": "Составляем таблицу 2 (для n месяцев)", "res": "\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>n\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления процентов\u003c/td>\u003ctd>\\( nx \\)\u003c/td>\u003ctd>\\( (n-1)x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Записываем общую сумму выплат в общем виде", "res": "\\(П_i\\)=Часть долга (из таблицы 1) + процент с долга (из таблицы 2)\n\u003cB>ОБЩАЯ СУММА ВЫПЛАТ \\(\\sum\\) = КРЕДИТ + ПРОЦЕНТЫ\u003c/B>\n\\( \\Sigma = nx + 0{,}02 \\cdot \\frac{(nx + x) \\cdot n}{2} = 600 + 0{,}01(n + 1) \\cdot 600 = 600 + 6(n + 1) \\)"}, {"d": "Считаем для 24 и 30 месяцев", "res": "\\( \\Sigma_{24} = 600 + 6 \\cdot 25 = 750 \\)\n\\( \\Sigma_{30} = 600 + 6 \\cdot 31 = 786 \\)\n\\( 786 - 750 = 36 \\) тыс. руб."}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> 36 000 рублей."}], "byClaude": true, "lvl": 3}, {"id": 1772891799037, "title": "32 - 1310", "sectionName": "4 - ДИФПЛАТЕЖИ", "difficulty": "medium", "taskText": "15 января планируется взять кредит в банке на некоторую сумму на 31 месяц. Условия его возврата таковы:\n– 1-го числа каждого месяца долг увеличивается на \\( 1\\% \\) по сравнению с концом предыдущего месяца;\n– со 2-го по 14-е число каждого месяца необходимо выплатить одним платежом часть долга;\n– на 15-ое число каждого месяца с 1-го по 30-й долг должен быть на 20 тыс. рублей меньше долга на 15-е число предыдущего месяца;\n– к 15-му числу 31-го месяца долг должен быть погашен полностью.\nСколько тысяч рублей составляет долг на 15 число 30-ого месяца, если банку всего было выплачено 1348 тыс. рублей?", "taskImage": "", "answerText": "500 тысяч рублей", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\nСрок кредита: 31 месяц.\nПроценты: 1% в месяц, \\( a = 0.01 \\).\nДолг на 15-е число каждого месяца с 1-го по 30-й уменьшается на 20 тыс. руб.\nК 15-му числу 31-го месяца долг погашен полностью.\nОбщая сумма выплат = 1348 тыс. руб.\n\u003cstrong>Найти:\u003c/strong> долг на 15-е число 30-го месяца \\(y\\).\n❗ 15-е число наступает после 14-го , т.е. после начисления процентов, а это уже 31-й месяц\n\nКаждый из первых 30 месяцев погашается по 20 тыс. руб. тела кредита,\nа в 31-й месяц погашается остаток \\( y \\).\n\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>30\u003c/th>\u003cth>31\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Погашение тела кредита (тыс. руб.)\u003c/td>\u003ctd>20\u003c/td>\u003ctd>20\u003c/td>\u003ctd>...\u003c/td>\u003ctd>20\u003c/td>\u003ctd>\\( y \\)\u003c/td>\u003c/tr>\n\u003c/table>\n\\(20*30+y=S \\rightarrow 600+y=S\\)\n\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>30\u003c/th>\u003cth>31\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления процентов (тыс. руб.)\u003c/td>\u003ctd>\\( y + 600 \\)\u003c/td>\u003ctd>\\( y + 580 \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( y + 20 \\)\u003c/td>\u003ctd>\\( y \\)\u003c/td>\u003c/tr>\n\u003c/table>\n\nПлатежи\n\\(П_i\\)=Часть долга + процент с долга\n\\(П_1 = 20 + a(y + 600)\\)\n\\(П_2 = 20 + a(y + 580)\\)\n...\n\\(П_{30} = 20 + a(y + 20)\\)\n\\(П_{31} = y + a(y) = y(1 + a)\\)\n\nОбщая сумма выплат = 1348:\n\\( \\Sigma = 30 \\cdot 20 + y + a[(y + 600) + (y + 580) + \\dots + (y + 20) + y] = 1348 \\)\n\nСумма в скобках: 31 слагаемое (от \\( y+600 \\) до \\( y+20 \\) — 30 слагаемых, плюс \\( y \\)):\n\\( (y + 600) + (y + 580) + \\dots + (y + 20) + y = \\frac{y+600 + y}{2} \\cdot 31= (y+300)\\cdot 31= 31y + 9300 \\). \n\nПодставляем:\n\\( 600 + y + 0.01(31y + 9300) = 1348 \\)\n\\( 600 + y + 0.31y + 93 = 1348 \\)\n\\( y = 500 \\)\n\n\u003cstrong>Ответ:\u003c/strong> долг на 15-е число 30-го месяца составляет \u003cstrong>500 тыс. рублей\u003c/strong>.", "solutionImage": "", "drawingImage": "", "solutionLink": "https://3.shkolkovo.online/catalog/131/1310", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\nСрок кредита: 31 месяц.\nПроценты: 1% в месяц, \\( a = 0.01 \\).\nДолг на 15-е число каждого месяца с 1-го по 30-й уменьшается на 20 тыс. руб.\nК 15-му числу 31-го месяца долг погашен полностью.\nОбщая сумма выплат = 1348 тыс. руб.\n\u003cstrong>Найти:\u003c/strong> долг на 15-е число 30-го месяца \\(y\\).\n\n❗ 15-е число наступает после 14-го , т.е. после начисления процентов, а это уже 31-й месяц\nКаждый из первых 30 месяцев погашается по 20 тыс. руб. тела кредита,\nа в 31-й месяц погашается остаток \\( y \\)."}, {"d": "Составляем таблицу погашения тела кредита", "res": "\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>30\u003c/th>\u003cth>31\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Погашение тела кредита (тыс. руб.)\u003c/td>\u003ctd>20\u003c/td>\u003ctd>20\u003c/td>\u003ctd>...\u003c/td>\u003ctd>20\u003c/td>\u003ctd>\\( y \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Преобразуем и считаем", "res": "\\(20*30+y=S \\rightarrow 600+y=S\\)"}, {"d": "Составляем таблицу долга до начисления процентов", "res": "\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>30\u003c/th>\u003cth>31\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления процентов (тыс. руб.)\u003c/td>\u003ctd>\\( y + 600 \\)\u003c/td>\u003ctd>\\( y +  — сумма кредита.\nСрок кредита: 18 месяцев.\nПроценты: 2%, \\( a = 0{,}02 \\).\n\\( x \\) — сумма, идущая в счёт погашения тела кредита каждый месяц.\n\n\u003cstrong>Найти:\u003c/strong> сколько процентов от \\( S \\) составляет общая сумма выплат.\n\n\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>17\u003c/th>\u003cth>18\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Погашение тела кредита\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\n\u003c/table>\nСУММА КРЕДИТА: \\( 18x = S \\)\n\n\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>17\u003c/th>\u003cth>18\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления\u003c/td>\u003ctd>\\( 18x \\)\u003c/td>\u003ctd>\\( 17x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( 2x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\n\u003c/table>\n\n\u003cB>Платежи:\u003c/B>\n\\(П_i = \\text{Часть долга} + \\text{Проценты с долга до начисления} \\)\n\\( П_1 = x + 0{,}02(18x) \\)\n\\( П_2 = x + 0{,}02(17x) \\)\n\\(\\cdots\\)\n\\( П_{18} = x + 0{,}02(x) \\)\n\n\u003cB>Общая сумма выплат = СУММА КРЕДИТА + ПРОЦЕНТЫ С ДОЛГОВ:\u003c/B>\n\\( \\Sigma = 18x + 0{,}02 \\cdot (18x + 17x + \\dots + x) \\)\nВ скобках – арифметическая прогрессия: \\( \\frac{(18x + x) \\cdot 18}{2} = 171x \\)\n\\( \\Sigma = 18x + 3{,}42x = 21{,}42x \\)\n\n\\( \\frac{\\Sigma}{S} = \\frac{21{,}42x}{18x} = 1{,}19 = 119\\% \\)\n\n\u003cstrong>Ответ:\u003c/strong> 119%.", "solutionImage": "", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S \\) — сумма кредита.\nСрок кредита: 18 месяцев.\nПроценты: 2%, \\( a = 0{,}02 \\).\n\\( x \\) — 3ca href=\"https://ege.sdamgia.ru/problem?id=515804 \" target=\"_blank\">🔍 АНАЛОГ  515804 \u003c/a>\n15-го января планируется взять кредит в банке на сумму 2,4 млн рублей на 24 месяца. Условия его возврата таковы:\n— 1-го числа каждого месяца долг возрастает на 3% по сравнению с концом предыдущего месяца;\n— со 2-го по 14-е число каждого месяца необходимо выплатить часть долга;\n— 15-го числа каждого месяца долг должен быть на одну и ту же величину меньше долга на 15-е число предыдущего месяца.\nКакую сумму нужно выплатить банку в первые 12 месяцев?", "taskImage": "", "answerText": "1866000", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 2400 \\) тыс. руб. — сумма кредита.\nСрок кредита: 24 месяца.\nПроценты: 3%, \\( a = 0{,}03 \\).\n\\( x \\) — сумма, идущая в счёт погашения тела кредита каждый месяц.\n\n\u003cstrong>Найти:\u003c/strong> сумму выплат за первые 12 месяцев.\n\n\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>12\u003c/th>\u003cth>...\u003c/th>\u003cth>24\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Сумма в счет погашения тела кредита (тыс. руб.)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\n\u003c/table>\nСУММА КРЕДИТА = \\( 24x = 2400 \\) → \\( x = 100 \\)\n\n\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>12\u003c/th>\u003cth>13\u003c/th>\u003cth>...\u003c/th>\u003cth>24\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления процентов\u003c/td>\u003ctd>\\( 24x \\)\u003c/td>\u003ctd>\\( 23x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( 13x \\)\u003c/td>\u003ctd>\\( 12x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\n\u003c/table>\n💥 \u003cB>СУММА НОМЕРА МЕСЯЦА И КОЛИЧЕСТВА ИКСОВ = 25\u003c/B>\n\n\u003cB>ПЛАТЕЖИ:\u003c/B>\n\\(П_1=x+0{,}03(24x)\\)\n\\(П_2=x+0{,}03(23x)\\)\n...\n\\(П_{12}=x+0{,}03(13x)\\)\n\n\u003cb>СУММА ВЫПЛАТ ЗА ПЕРИОД = ЧАСТЬ КРЕДИТА + ПРОЦЕНТЫ\u003c/b>\n\\( 12x + 0{,}03(24x + 23x + \\dots + 13x) \\)\nВ скобках – арифметическая прогрессия: \\( \\frac{(24x + 13x) \\cdot 12}{2} = 222x \\)\n\\( 12x + 6{,}66x = 18{,}66x = 18{,}66 \\cdot 100 = 1866 \\) тыс. руб.\n\n\u003cstrong>Ответ:\u003c/strong> 1 866 000 рублей.", "solutionImage": "", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 2400 \\) тыс. руб. — сумма кредита.\nСрок кредита: 24 месяца.\nПроценты: 3%, \\( a = 0{,}03 \\).\n\\( x \\) — сумма, идущая в счёт погашения тела кредита каждый месяц.\n\n\u003cstrong>Найти:\u003c/strong> сумму выплат за первые 12 месяцев."}, {"d": "Составляем таблицу 1: суммы в счёт погашения тела кредита", "res": "\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>12\u003c/th>\u003cth>...\u003c/th>\u003cth>24\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Сумма в счет погашения тела кредита (тыс. руб.)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\n\u003c/table>\nСУММА КРЕДИТА = \\( 24x = 2400 \\) → \\( x = 100 \\)"}, {"d": "Составляем таблицу 2: долг до начисления процентов", "res": "\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>12\u003c/th>\u003cth>13\u003c/th>\u003cth>...\u003c/th>\u003cth>24\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления процентов\u003c/td>\u003ctd>\\( 24x \\)\u003c/td>\u003ctd>\\( 23x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( 13x \\)\u003c/td>\u003ctd>\\( 12x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ct >\u003cth>10\u003c/th>\u003cth>...\u003c/th>\u003cth>20\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Сумма в счет погашения тела кредита (тыс. руб.)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\n\u003c/table>\nСУММА КРЕДИТА = \\( 20x = S \\)"}, {"d": "Составляем таблицу 2: долг до начисления процентов", "res": "\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>10\u003c/th>\u003cth>...\u003c/th>\u003cth>20\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления процентов\u003c/td>\u003ctd>\\( 20x \\)\u003c/td>\u003ctd>\\( 19x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( 11x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\n\u003c/table>\n💥 \u003cB>СУММА НОМЕРА МЕСЯЦА И КОЛИЧЕСТВА ИКСОВ = 21\u003c/B>"}, {"d": "Записываем платежи за первые 10 месяцев", "res": "\u003cB>ПЛАТЕЖИ:\u003c/B>\n\\(П_1=x+0{,}02(20x)\\)\n\\(П_2=x+0{,}02(19x)\\)\n...\n\\(П_{10}=x+0{,}02(11x)\\)"}, {"d": "Записываем сумму выплат за 10 месяцев и находим S", "res": "\u003cb>СУММА ВЫПЛАТ ЗА ПЕРИОД = ЧАСТЬ КРЕДИТА + ПРОЦЕНТЫ\u003c/b>\n\\( 10x + 0{,}02(20x + 19x + \\dots + 11x) = 1179 \\)\nВ скобках – арифметическая прогрессия: \\( \\frac{(20x + 11x) \\cdot 10}{2} = 155x \\)\n\\( 10x + 3{,}1x = 13{,}1x = 1179 \\rightarrow x = 90 \\)\n\\( S = 20 \\cdot 90 = 1800 \\) тыс. руб."}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> 1 800 000 рублей."}], "byClaude": true, "lvl": 3}, {"id": 1772891153989, "title": "25 - 13555", "sectionName": "4 - ДИФПЛАТЕЖИ", "difficulty": "medium", "taskText": "В июле 2026 года планируется взять кредит в банке на три года в размере \\( S \\) тысяч рублей, где \\( S \\) — целое число.\nУсловия его возврата таковы:\n– каждый январь долг увеличивается на \\( 20\\% \\) по сравнению с концом предыдущего года;\n– с февраля по июнь каждого года необходимо выплатить одним платежом часть долга;\n– в июле каждого года долг должен составлять часть кредита в соответствии со следующей таблицей:\n\\(\n\\begin{array}{|c|c|}\n\\hline\n\\text{Месяц и год} & \\text{Долг (в тыс. рублей)} \\\\\n\\hline\n\\text{Июль 2026} & S \\\\\n\\hline\n\\text{Июль 2027} & 0{,}8S \\\\\n\\hline\n\\text{Июль 2028} & 0{,}4S \\\\\n\\hline\n\\text{Июль 2029} & 0 \\\\\n\\hline\n\\end{array}\n\\)\nНайдите наибольшее значение \\( S \\), при котором каждая из выплат будет не больше \\( 840 \\) тысяч рублей.", "taskImage": "", "answerText": "1500", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\r\n\\( S \\) — сумма кредита (тыс. руб.).\r\n\\( r = 20\\% \\), \\( a = 0.2 \\).\r\nДолг в июле каждого года задан таблицей.\r\nКаждая выплата \\( \\le 840 \\) тыс. руб.\r\n\r\n\u003cstrong>Найти:\u003c/strong> наибольшее целое \\( S \\).\r\n================================\r\nВосстановим первую таблицу из второй (данной в условии):\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>3\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>Сумма в счет погашения тела кредита (тыс. руб.)\u003c/td>\u003ctd>\\( 0.2S \\)\u003c/td>\u003ctd>\\( 0.4S \\)\u003c/td>\u003ctd>\\( 0.4S \\)\u003c/td>\u003c/tr>\r\n\u003c/table>\r\nПРОВЕРКА:\r\nСУММА КРЕДИТА = \\(0.2S+0.4S+0.4S=S\\) – ВЕРНО\r\n\r\nПерепишем вторую таблицу из условия:\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>3\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>Долг до начисления процентов (тыс. руб.)\u003c/td>\u003ctd>\\( S \\)\u003c/td>\u003ctd>\\( 0.8S \\)\u003c/td>\u003ctd>\\( 0.4S \\)\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\r\n\u003cb>Платежи\u003c/b>\r\n\\(П_i\\)=Часть долга (из таблицы 1) + процент с долга (из таблицы 2)\r\n\r\n\\(П_1=0.2S+a(S)= 0.2S + 0.2S = 0.4S \\)\r\n\\(П_2=0.4S+a(0.8S)= 0.4S + 0.2 \\cdot 0.8S  = 0.56S \\)\r\n\\(П_3=0.4S+a(0.4S)=  0.4S + 0.2 \\cdot 0.4S = 0.48S \\)\r\n\r\nУсловие: каждая выплата \\( \\le 840 \\)\r\n\\(\r\n\\begin{cases}\r\n0.4S \\le 840 \\\\\r\n0.56S \\le 840 \\\\\r\n0.48S \\le 840\r\n\\end{cases}\r\n\\)\r\n\r\n\\(\r\n\\begin{cases}\r\nS \\le \\frac{840}{0.4} = 2100 \\\\\r\nS \\le \\frac{840}{0.56} = 1500 \\\\\r\nS \\le \\frac{840}{0.48} = 1750\r\n\\end{cases}\r\n\\)\r\nТак как \\( S \\) — целое число, наибольшее \\( S = 1500 \\).\r\n\r\n\u003cstrong>Ответ:\u003c/strong> \\( S = 1500 \\) тыс. рублей.\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "https://3.shkolkovo.online/catalog/131/13555", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S \\) — сумма кредита (тыс. руб.).\n\\( r = 20\\% \\), \\( a = 0.2 \\).\nДолг в июле каждого года задан таблицей.\nКаждая выплата \\( \\le 840 \\) тыс. руб.\n\u003cstrong>Найти:\u003c/strong> наибольшее целое \\( S \\).\n================================"}, {"d": "Восстановим первую таблицу из второй (данной в условии) — составляем таблицу погашения тела кредита", "res": "Восстановим первую таблицу из второй (данной в условии):\n\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>3\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Сумма в счет погашения тела кредита (тыс. руб.)\u003c/td>\u003ctd>\\( 0.2S \\)\u003c/td>\u003ctd>\\( 0.4S \\)\u003c/td>\u003ctd>\\( 0.4S \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "ПРОВЕРКА", "res": "ПРОВЕРКА:\nСУММА КРЕДИТА = \\(0.2S+0.4S+0.4S=S\\) – ВЕРНО"}, {"d": "Перепишем вторую таблицу из условия — составляем таблицу долга до начисления процентов", "res": "Перепишем вторую таблицу из условия:\n\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>3\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления процентов (тыс. руб.)\u003c/td>\u003ctd>\\( S \\)\u003c/td>\u003ctd>\\( 0.8S \\)\u003c/td>\u003ctd>\\( 0.4S \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Платежи", "res": "\u003cb>Платежи\u003c/b>\n\\(П_i\\)=Часть долга (из таблицы 1) + процент с долга (из таблицы 2)"}, {"d": "Находим \\(П_3\\)", "res": "\\(П_1=0.2S+a(S)= 0.2S + 0.2S = 0.4S \\)\n\\(П_2=0.4S+a(0.8S)= 0.4S + 0.2 \\cdot 0.8S  = 0.56S \\)\n\\(П_3=0.4S+a(0.4S)=  0.4S + 0.2 \\cdot 0.4S = 0.48S \\)"}, {"d": "Условие: каждая выплата", "res": "Условие: каждая выплата \\( \\le 840 \\)\n\\(\n\\begin{cases}\n0.4S \\le 840 \\\\\n0.56S \\le 840 \\\\\n0.48S \\le 840\n\\end{cases}\n\\)"}, {"d": "Находим \\(S\\)", "res": "\\(\n\\begin{cases}\nS \\le \\frac{840}{0.4} = 2100 \\\\\nS \\le \\frac{840}{0.56} = 1500 \\\\\nS \\le \\frac{840}{0.48} = 1750\n\\end{cases}\n\\)\nТак как \\( S \\) — целое число, наибольшее \\( S = 1500 \\)."}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> \\( S = 1500 \\) тыс. рублей."}], "lvl": 3}, {"id": 1791322848611, "title": "541382 аналог", "sectionName": "4 - ДИФПЛАТЕЖИ", "difficulty": "medium", "taskText": "\u003ca href=\"https://ege.sdamgia.ru/problem?id=557246\" target=\"_blank\">🔍 АНАЛОГ 557246\u003c/a>\n15 июля планируется взять кредит 75 тысяч рублей на 15 месяцев. Условия погашения кредита таковы:\n— с 1-го по 10-е число каждого месяца банк увеличивает долг, имеющийся на 1-е число, на 7,5%;\n— с 11-го по 14-е число каждого месяца необходимо выплатить часть долга;\n— долг на 15-е число каждого месяца должен быть на одну и ту же величину меньше долга на 15-е число предыдущего месяца.\nСколько месяцев выплаты по погашению кредита будут меньше 6,25 тысячи рублей?", "taskImage": "", "answerText": "3", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 75 \\) тыс. руб. — сумма кредита.\nСрок кредита: 15 месяцев.\nПроценты: 7,5%, \\( a = 0{,}075 \\).\n\\( x \\) — сумма, идущая в счёт погашения тела кредита каждый месяц.\n\n\u003cstrong>Найти:\u003c/strong> сколько платежей меньше 6,25 тыс. руб.\n\n\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>14\u003c/th>\u003cth>15\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Сумма в счет погашения тела кредита (тыс. руб.)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\n\u003c/table>\nСУММА КРЕДИТА = \\( 15x = 75 \\) → \\( x = 5 \\) тыс. руб.\n\n\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>k\u003c/th>\u003cth>...\u003c/th>\u003cth>15\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления процентов\u003c/td>\u003ctd>\\( 15x \\)\u003c/td>\u003ctd>\\( 14x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( (16 - k)x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\n\u003c/table>\n💥 \u003cB>СУММА НОМЕРА МЕСЯЦА И КОЛИЧЕСТВА ИКСОВ = 16\u003c/B>\n\n\u003cB>ПЛАТЕЖИ:\u003c/B>\n\\(П_k\\) = Часть долга (из таблицы 1) + процент с долга (из таблицы 2)\n\\(П_k = x + 0{,}075(16 - k)x = 5 + 0{,}375(16 - k)\\)\n\n\\( 5 + 0{,}375(16 - k) \u003c 6{,}25 \\)\n\\( 0{,}375(16 - k) \u003c 1{,}25 \\)\n\\( 16 - k \u003c 3\\frac{1}{3} \\rightarrow 16 - k \\in \\{1; 2; 3\\} \\rightarrow k = 13, 14, 15 \\)\n\n\u003cstrong>Ответ:\u003c/strong> 3 месяца.", "solutionImage": "", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 75 \\) тыс. руб. — сумма кредита.\nСрок кредита: 15 месяцев.\nПроценты: 7,5%, \\( a = 0{,}075 \\).\n\\( x \\) — сумма, идущая в счёт погашения тела кредита каждый месяц.\n\n\u003cstrong>Найти:\u003c/strong> сколько платежей меньше 6,25 тыс. руб."}, {"d": "Составляем таблицу 1: суммы в счёт погашения тела кредита", "res": "\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>14\u003c/th>\u003cth>15\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Сумма в счет погашения тела кредита (тыс. руб.)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\n\u003c/table>\nСУММА КРЕДИТА = \\( 15x = 75 \\) → \\( x = 5 \\) тыс. руб."}, {"d": "Составляем таблицу 2: долг до начисления процентов", "res": "\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>k\u003c/th>\u003cth>...\u003c/th>\u003cth>15\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления процентов\u003c/td>\u003ctd>\\( 15x \\)\u003c/td>\u003ctd>\\( 14x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( (16 - k)x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\n\u003c/table>\n💥 \u003cB>СУММА НОМЕРА МЕСЯЦА И КОЛИЧЕСТВА ИКСОВ = 16\u003c/B>"}, {"d": "Записываем платёж k-го месяца", "res": "\u003cB>ПЛАТЕЖИ:\u003c/B>\n\\(П_k\\) = Часть долга (из таблицы 1) + процент с долга (из таблицы 2)\n\\(П_k = x + 0{,}075(16 - k)x = 5 + 0{,}375(16 - k)\\)"}, {"d": "Решаем неравенство", "res": "\\( 5 + 0{,}375(16 - k) \u003c 6{,}25 \\)\n\\( 0{,}375(16 - k) \u003c 1{,}25 \\)\n\\( 16 - k \u003c 3\\frac{1}{3} \\rightarrow 16 - k \\in \\{1; 2; 3\\} \\rightarrow k = 13, 14, 15 \\)"}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> 3 месяца."}], "byClaude": true, "lvl": 3}, {"id": 1772949448851, "title": "37 - 142697", "sectionName": "4 - ДИФПЛАТЕЖИ", "difficulty": "medium", "taskText": "В июле 2025 года планируется взять кредит на десять лет в размере 800 тыс. рублей. Условия его возврата таковы:\n– каждый январь долг будет возрастать на r%   по сравнению с концом предыдущего года (r   — целое число);\n– с февраля по июнь каждого года необходимо оплатить одним платежом часть долга;\n– в июле 2026, 2027, 2028, 2029 и 2030 годов долг должен быть на какую-то одну и ту же величину меньше долга на июль предыдущего года;\n– в июле 2030 года долг должен составить 200 тыс. рублей;\n– в июле 2031, 2032, 2033, 2034 и 2035 годов долг должен быть на другую одну и ту же величину меньше долга на июль предыдущего года;\n– к июлю 2035 года долг должен быть выплачен полностью.\nИзвестно, что сумма всех платежей после полного погашения кредита будет равна 1480 тыс. рублей. Найдите r.", "taskImage": "", "answerText": "20", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\r\n\\( S = 800 \\) тыс. руб. — сумма кредита.\r\nСрок кредита: 10 лет.\r\nПервые 5 лет (2026–2030): долг уменьшается на одну и ту же величину \\( x \\) тыс. руб.\r\nВ июле 2030 года долг = 200 тыс. руб. \r\n❗ Июль наступает после июня, т.е. после начисления процентов. Значит. Это уже 2031 год!\r\n\r\nВторые 5 лет (2031–2035): долг уменьшается на другую одну и ту же величину \\( y \\) тыс. руб.\r\nК июлю 2035 года долг = 0.\r\nОбщая сумма выплат = 1480 тыс. руб.\r\nПроцентная ставка: \\( r\\% \\), \\( a = \\frac{r}{100} \\).\r\n\r\n\u003cstrong>Найти:\u003c/strong> \\( r \\).\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>2026\u003c/th>\u003cth>2027\u003c/th>\u003cth>2028\u003c/th>\u003cth>2029\u003c/th>\u003cth>2030\u003c/th>\u003cth>2031\u003c/th>\u003cth>2032\u003c/th>\u003cth>2033\u003c/th>\u003cth>2034\u003c/th>\u003cth>2035\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>Погашение тела кредита (тыс. руб.)\u003c/td>\u003ctd>x\u003c/td>\u003ctd>x \u003c/td>\u003ctd>x \u003c/td>\u003ctd>x \u003c/td>\u003ctd>x \u003c/td>\u003ctd>y\u003c/td>\u003ctd>y\u003c/td>\u003ctd>y\u003c/td>\u003ctd>y\u003c/td>\u003ctd>y\u003c/td>\u003c/tr>\r\n\u003c/table>\r\nСУММА КРЕДИТА = \\(5x+5y=S=800\\)\r\n\\(5y=200 \\rightarrow y=40 \\rightarrow x=120\\)\r\n\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>2026\u003c/th>\u003cth>2027\u003c/th>\u003cth>2028\u003c/th>\u003cth>2029\u003c/th>\u003cth>2030\u003c/th>\u003cth>2031\u003c/th>\u003cth>2032\u003c/th>\u003cth>2033\u003c/th>\ ma = 800 +  a \\cdot (800 + 680 + 560 + 440 + 320 + 200 + 160 + 120 + 80 + 40) \\)\n\\( 800 + a \\cdot 3400 = 1480 \\)\n\\( a =  0.2=\\frac{r}{100} \\rightarrow  r =  20\\% \\)"}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> \\( r = 20\\% \\)."}], "lvl": 3}, {"id": 1772891442095, "title": "31 - 18136", "sectionName": "4 - ДИФПЛАТЕЖИ", "difficulty": "hard", "taskText": "В июле планируется взять кредит в банке на сумму 6 млн рублей на срок 15 лет. Условия его возврата таковы:\n– каждый январь долг возрастает на x  % по сравнению с концом предыдущего года;\n– с февраля по июнь каждого года необходимо выплатить часть долга;\n– в июле каждого года долг должен быть на одну и ту же величину меньше долга на июль предыдущего года.\nНайдите x  , если известно, что наибольший платёж по кредиту составит не более 1,9 млн рублей, а наименьший — не менее 0,5 млн рублей.", "taskImage": "", "answerText": "25", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\r\n\\( S = 6 \\) млн руб. — сумма кредита.\r\nСрок кредита: \\( n = 15 \\) лет.\r\nПроценты: \\( x\\% \\), \\( a = \\frac{x}{100} \\).\r\nДолг в июле каждого года уменьшается на одну и ту же величину \\(y\\).\r\nНаибольший платёж \\( \\le 1.9 \\) млн руб.\r\nНаименьший платёж \\( \\ge 0.5 \\) млн руб.\r\n\r\n\u003cstrong>Найти:\u003c/strong> \\( x \\).\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>3\u003c/th>\u003cth>...\u003c/th>\u003cth>14\u003c/th>\u003cth>15\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>Сумма в счет погашения тела кредита (млн руб.)\u003c/td>\u003ctd>\\( y \\)\u003c/td>\u003ctd>\\( y \\)\u003c/td>\u003ctd>\\( y \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( y \\)\u003c/td>\u003ctd>\\( y \\)\u003c/td>\u003c/tr>\r\n\u003c/table>\r\nСУММА КРЕДИТА = \\(15y=6 \\rightarrow y= 0.4 \\) млн руб.\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>3\u003c/th>\u003cth>...\u003c/th>\u003cth>14\u003c/th>\u003cth>15\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>Долг до начисления процентов (млн руб.)\u003c/td>\u003ctd>\\( 15y \\)\u003c/td>\u003ctd>\\( 14y \\)\u003c/td>\u003ctd>\\( 13y\\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( 2y \\)\u003c/td>\u003ctd>\\( y \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd> \u003c/td>\u003ctd>\\( 6 \\)\u003c/td>\u003ctd>\\( 5.6 \\)\u003c/td>\u003ctd>\\( 5.2 \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( 0.8 \\)\u003c/td>\u003ctd>\\( 0.4 \\)\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\u003cb>Платежи\u003c/b>\r\n\\(П_i\\)=Часть долга (из таблицы 1) + процент с долга (из таблицы 2)\r\n\r\n\\(П_1 = 0.4 + a \\cdot 6\\)\r\n\\(П_2 = 0.4 + a \\cdot 5.6\\)\r\n\\(П_3 = 0.4 + a \\cdot 5.2\\)\r\n...\r\n\\(П_{14} = 0.4 + a \\cdot 0.8\\)\r\n\\(П_{15} = 0.4 + a \\cdot 0.4\\)\r\n\r\nПлатежи уменьшаются, так как сумма, идущая в тело кредита, постоянна, а долг до начисления процентов уменьшается.\r\n\u003cb>Наибольший платёж — первый:\u003c/b>\r\n\\( П_1 = 0.4 + 6a \\le 1.9 \\)\r\n\\( a \\le 0.25 \\)\r\n\r\n\u003cb>Наименьший платёж — последний:\u003c/b>\r\n\\( П_{15} = 0.4 + 0.4a \\ge 0.5 \\)\r\n\\( a \\ge 0.25 \\)\r\n\r\nСледовательно, \\( a = 0.25=\\frac {x}{100}  \\rightarrow x=  25 \\)\r\n\r\n\u003cstrong>Ответ:\u003c/strong> \\( x = 25\\% \\).\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "https://3.shkolkovo.online/catalog/131/18136", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 6 \\) млн руб. — сумма кредита.\nСрок кредита: \\( n = 15 \\) лет.\nПроценты: \\( x\\% \\), \\( a = \\frac{x}{100} \\).\nДолг в июле каждого года уменьшается на одну и ту же величину \\(y\\).\nНаибольший платёж \\( \\le 1.9 \\) млн руб.\nНаименьший платёж \\( \\ge 0.5 \\) млн руб.\n\u003cstrong>Найти:\u003c/strong> \\( x \\)."}, {"d": "Составляем таблицу погашения тела кредита",
