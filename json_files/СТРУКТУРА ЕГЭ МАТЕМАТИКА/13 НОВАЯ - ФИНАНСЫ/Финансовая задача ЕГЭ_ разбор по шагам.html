\u003c/th>\u003cth>20\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления (тыс. руб.)\u003c/td>\u003ctd>\\( 20x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( 13x \\)\u003c/td>\u003ctd>\\( 12x \\)\u003c/td>\u003ctd>\\( 11x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( 2x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\n\u003c/table>\n\n\u003cB>ПЛАТЕЖИ:\u003c/B>\n\\(П_i\\)=Часть долга (из таблицы 1) + процент с долга (из таблицы 2)\nБыло бы: \\(П_9 = x + 0{,}1(12x)\\), …, \\(П_{20} = x + 0{,}1(x)\\)\nСтало: \\(П_9 = x + 0{,}08(12x)\\), …, \\(П_{20} = x + 0{,}08(x)\\)\nТело кредита платится одинаково — экономия только на процентах.\n\nЭкономия \\( = (0{,}1 - 0{,}08)(12x + 11x + \\dots + x) \\)\nВ скобках – арифметическая прогрессия: \\( \\frac{(12x + x) \\cdot 12}{2} = 78x = 7800 \\)\nЭкономия \\( = 0{,}02 \\cdot 7800 = 156 \\) тыс. руб.\n\n\u003cstrong>Ответ:\u003c/strong> 156 000 рублей.", "solutionImage": "", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 2000 \\) тыс. руб. — сумма кредита.\nСрок кредита: 20 лет.\nПроценты: 1–8 годы — 10%; 9–20 годы (после реструктуризации) — 8%.\n\\( x \\) — сумма, идущая в счёт погашения тела кредита каждый год.\n\n\u003cstrong>Найти:\u003c/strong> сколько сэкономил Александр Сергеевич."}, {"d": "Составляем таблицу 1: суммы в счёт погашения тела кредита", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>19\u003c/th>\u003cth>20\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Погашение тела кредита (тыс. руб.)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\n\u003c/table>\nСУММА КРЕДИТА = \\( 20x = 2000 \\) → \\( x = 100 \\)"}, {"d": "Составляем табли нужно будет вернуть банку в течение всего срока кредитования?", "taskImage": "", "answerText": "1 080 000 рублей", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\n\\( S \\) — сумма кредита (тыс. руб.).\nСрок кредита: 24 месяца.\nПроценты: 1%, \\( a = 0{,}01 \\).\n\\( x \\) — сумма, идущая в счёт погашения тела кредита каждый месяц.\nПлатёж за 15-й месяц = 44 тыс. руб.\n\n\u003cstrong>Найти:\u003c/strong> общую сумму выплат.\n\n\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>15\u003c/th>\u003cth>...\u003c/th>\u003cth>23\u003c/th>\u003cth>24\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Сумма в счет погашения тела кредита (тыс. руб.)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\n\u003c/table>\nСУММА КРЕДИТА = \\( 24x = S \\)\n\n\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>15\u003c/th>\u003cth>...\u003c/th>\u003cth>23\u003c/th>\u003cth>24\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления процентов (тыс. руб.)\u003c/td>\u003ctd>\\( 24x \\)\u003c/td>\u003ctd>\\( 23x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( 10x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( 2x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\n\u003c/table>\n💥 \u003cB>ЧТОБЫ НЕ ЗАПУТАТЬСЯ: СУММА НОМЕРА МЕСЯЦА И КОЛИЧЕСТВА ИКСОВ ПОСТОЯННА = 25\u003c/B>\n\n\u003cB>ПЛАТЕЖИ:\u003c/B>\n\\(П_i\\)=Часть долга (из таблицы 1) + процент с долга (из таблицы 2)\n\\(П_{15} = x + 0{,}01(10x) = 1{,}1x = 44\\)\n\\( x = 40 \\) тыс. руб. \\( \\rightarrow S = 24 \\cdot 40 = 960 \\) тыс. руб.\n\n\u003cB>ОБЩАЯ СУММА ВЫПЛАТ \\(\\sum\\) = КРЕДИТ + ПРОЦЕНТЫ(ПЕРЕПЛАТА)\u003c/B>\n\\(\\sum = 24x + 0{,}01(24x + 23x + \\dots + x) \\)\nВ скобках – арифметическая прогрессия: \\( \\frac{(24x + x) \\cdot 24}{2} = 300x \\)\n\\(\\sum = 24x + 3x = 27x = 27 \\cdot 40 = 1080 \\) тыс. руб.\n\n\u003cstrong>Ответ:\u003c/strong> 1 080 000 рублей.", "solutionImage": "", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S \\) — сумма кредита (тыс. руб.).\nСрок кредита: 24 месяца.\nПроценты: 1%, \\( a = 0{,}01 \\).\n\\( x \\) — сумма, идущая в счёт погашения тела кредита каждый месяц.\nПлатёж за 15-й месяц = 44 тыс. руб.\n\n\u003cstrong>Найти:\u003c/strong> общую сумму выплат."}, {"d": "Составляем таблицу 1: суммы в счёт погашения тела кредита", "res": "\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>15\u003c/th>\u003cth>...\u003c/th>\u003cth>23\u003c/th>\u003cth>24\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Сумма в счет погашения тела кредита (тыс. руб.)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\n\u003c/table>\nСУММА КРЕДИТА = \\( 24x = S \\)"}, {"d": "Составляем таблицу 2: долг до начисления процентов", "res": "\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>15\u003c/th>\u003cth>...\u003c/th>\u003cth>23\u003c/th>\u003cth>24\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления процентов (тыс. руб.)\u003c/td>\u003ctd>\\( 24x \\)\u003c/td>\u003ctd>\\( 23x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( 10x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( 2x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\n\u003c/table>\n💥 \u003cB>ЧТОБЫ НЕ ЗАПУТАТЬСЯ: СУММА НОМЕРА МЕСЯЦА И КОЛИЧЕСТВА ИКСОВ ПОСТОЯННА = 25\u003c/B>"}, {"d": "Записываем платежи и находим x", "res": "\u003cB>ПЛАТЕЖИ:\u003c/B>\n\\(П_i\\)=Часть долга (из таблицы 1) + процент с долга (из таблицы 2)\n\\(П_{15} = x + 0{,}01(10x) = 1{,}1x = 44\\)\n\\( x = 40 \\) тыс. руб. \\( \\rightarrow S = 24 \\cdot 40 = 960 \\) тыс. руб."}, {"d": "Записываем общую сумму выплат", "res": "\u003cB>ОБЩАЯ СУММА ВЫПЛАТ \\(\\sum\\) = КРЕДИТ + ПРОЦЕНТЫ(ПЕРЕПЛАТА)\u003c/B>\n\\(\\sum = 24x + 0{,}01(24x + 23x + \\dots + x) \\)\nВ скобках – арифметическая прогрессия: \\( \\frac{(24x + x) \\cdot 24}{2} = 300x \\)\n\\(\\sum = 24x + 3x = 27x = 27 \\cdot 40 = 1080 \\) тыс. руб."}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> 1 080 000 рублей."}], "byClaude": true, "lvl": 4}, {"id": 1791320651034, "title": "2415 аналог", "sectionName": "4 - ДИФПЛАТЕЖИ", "difficulty": "hard", "taskText": "\u003ca href=\"https://ege.sdamgia.ru/problem?id=513106\" target=\"_blank\">🔍 АНАЛОГ 513106\u003c/a> \n15-го января был выдан полугодовой кредит на развитие бизнеса. В таблице представлен график его погашения.\n\u003ctable>\n\u003ctr>\u003cth>Дата\u003c/th>\u003cth>15.01\u003c/th>\u003cth>15.02\u003c/th>\u003cth>15.03\u003c/th>\u003cth>15.04\u003c/th>\u003cth>15.05\u003c/th>\u003cth>15.06\u003c/th>\u003cth>15.07\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг (в процентах от кредита)\u003c/td>\u003ctd>100%\u003c/td>\u003ctd>90%\u003c/td>\u003ctd>80%\u003c/td>\u003ctd>70%\u003c/td>\u003ctd>60%\u003c/td>\u003ctd>50%\u003c/td>\u003ctd>0%\u003c/td>\u003c/tr>\n\u003c/table>\nВ конце каждого месяца, начиная с января, текущий долг увеличивался на 5%, а выплаты по погашению кредита происходили в первой половине каждого месяца, начиная с февраля. На сколько процентов общая сумма выплат при таких условиях больше суммы самого кредита?", "taskImage": "", "answerText": "22,5%", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\n\\( S \\) — сумма кредита, срок 6 месяцев.\nПроценты: 5% в месяц, \\( a = 0{,}05 \\).\nДолг 15-го числа (в % от кредита) задан таблицей: 100, 90, 80, 70, 60, 50, 0.\n\n\u003cstrong>Найти:\u003c/strong> на сколько процентов общая сумма выплат больше кредита.\n\n\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>3\u003c/th>\u003cth>4\u003c/th>\u003cth>5\u003c/th>\u003cth>6\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Сумма в счет погашения тела кредита\u003c/td>\u003ctd>\\( 0{,}1S \\)\u003c/td>\u003ctd>\\( 0{,}1S \\)\u003c/td>\u003ctd>\\( 0{,}1S \\)\u003c/td>\u003ctd>\\( 0{,}1S \\)\u003c/td>\u003ctd>\\( 0{,}1S \\)\u003c/td>\u003ctd>\\( 0{,}5S \\)\u003c/td>\u003c/tr>\n\u003c/table>\nПРОВЕРКА: КРЕДИТ \\( 0{,}1S \\cdot 5 + 0{,}5S = S \\) – ВЕРНО\n\n\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>3\u003c/th>\u003cth>4\u003c/th>\u003cth>5\u003c/th>\u003cth>6\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления процентов\u003c/td>\u003ctd>\\( S \\)\u003c/td>\u003ctd>\\( 0{,}9S \\)\u003c/td>\u003ctd>\\( 0{,}8S \\)\u003c/td>\u003ctd>\\( 0{,}7S \\)\u003c/td>\u003ctd>\\( 0{,}6S \\)\u003c/td>\u003ctd>\\( 0{,}5S \\)\u003c/td>\u003c/tr>\n\u003c/table>\n\n\u003cb>Платежи\u003c/b>\n\\(П_i\\)=Часть долга (из таблицы 1) + процент с долга (из таблицы 2)\n\\(П_1=0{,}1S+0{,}05(S)\\)\n\\(П_2=0{,}1S+0{,}05(0{,}9S)\\)\n\\(П_3=0{,}1S+0{,}05(0{,}8S)\\)\n\\(П_4=0{,}1S+0{,}05(0{,}7S)\\)\n\\(П_5=0{,}1S+0{,}05(0{,}6S)\\)\n\\(П_6=0{,}5S+0{,}05(0{,}5S)\\)\n\n\u003cb>ОБЩАЯ СУММА ВЫПЛАТ \\(\\sum\\)= КРЕДИТ + ПРОЦЕНТЫ(ПЕРЕПЛАТА)\u003c/b>\n\\(\\sum = S + 0{,}05(S + 0{,}9S + 0{,}8S + 0{,}7S + 0{,}6S + 0{,}5S) = S + 0{,}05 \\cdot 4{,}5S = 1{,}225S \\)\nОбщая сумма выплат больше кредита на \\( 0{,}225S \\), т.е. на 22,5%.\n\n\u003cstrong>Ответ:\u003c/strong> на 22,5%.", "solutionImage": "", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S \\) — сумма кредита, срок 6 месяцев.\nПроценты: 5% в месяц, \\( a = 0{,}05 \\).\nДолг 15-го числа (в % от кредита) задан таблицей: 100, 90, 80, 70, 60, 50, 0.\n\n\u003cstrong>Найти:\u003c/strong> на сколько процентов общая сумма выплат больше кредита."}, {"d": "Восстанавливаем таблицу 1: суммы в счёт погашения тела кредита", "res": "\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>3\u003c/th>\u003cth>4\u003c/th>\u003cth>5\u003c/th>\u003cth>6\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Сумма в счет погашения тела кредита\u003c/td>\u003ctd>\\( 0{,}1S \\)\u003c/td>\u003ctd>\\( 0{,}1S \\)\u003c/td>\u003ctd>\\( 0{,}1S \\)\u003c/td>\u003ctd>\\( 0{,}1S \\)\u003c/td>\u003ctd>\\( 0{,}1S \\)\u003c/td>\u003ctd>\\( 0{,}5S \\)\u003c/td>\u003c/tr>\n\u003c/table>\nПРОВЕРКА: КРЕДИТ \\( 0{,}1S \\cdot 5 + 0{,}5S = S \\) – ВЕРНО"}, {"d": "Переписываем таблицу 2: долг до начисления процентов", "res": "\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>3\u003c/th>\u003cth>4\u003c/th>\u003cth>5\u003c/th>\u003cth>6\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления процентов\u003c/td>\u003ctd>\\( S \\)\u003c/td>\u003ctd>\\( 0{,}9S \\)\u003c/td>\u003ctd>\\( 0{,}8S \\)\u003c/td>\u003ctd>\\( 0{,}7S \\)\u003c/td>\u003ctd>\\( 0{,}6S \\)\u003c/td>\u003ctd>\\( 0{,}5S \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Записываем платежи", "res": "\u003cb>Платежи\u003c/b>\n\\(П_i\\)=Часть долга (из таблицы 1) + процент с долга (из таблицы 2)\n\\(П_1=0{,}1S+0{,}05(S)\\)\n\\(П_2=0{,}1S+0{,}05(0{,}9S)\\)\n\\(П_3=0{,}1S+0{,}05(0{,}8S)\\)\n\\(П_4=0{,}1S+0{,}05(0{,}7S)\\)\n\\(П_5=0{,}1S+0{,}05(0{,}6S)\\)\n\\(П_6=0{,}5S+0{,}05(0{,}5S)\\)"}, {"d": "Записываем общую сумму выплат", "res": "\u003cb>ОБЩАЯ СУММА ВЫПЛАТ \\(\\sum\\)= КРЕДИТ + ПРОЦЕНТЫ(ПЕРЕПЛАТА)\u003c/b>\n\\(\\sum = S + 0{,}05(S + 0{,}9S + 0{,}8S + 0{,}7S + 0{,}6S + 0{,}5S) = S + 0{,}05 \\cdot 4{,}5S = 1{,}225S \\)\nОбщая сумма выплат больше кредита на \\( 0{,}225S \\), т.е. на 22,5%."}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> на 22,5%."}], "byClaude": true, "lvl": 4}, {"id": 1772954040275, "title": "27 - 100639", "sectionName": "4 - ДИФПЛАТЕЖИ", "difficulty": "hard", "taskText": "В июне 2028 года Егор планирует взять кредит в банке N на 4 года в размере 5 млн рублей. Условия его возврата таковы:\n– в январе 2029 и 2030 годов долг увеличивается на 14% от суммы долга на конец предыдущего года;\n– в январе 2031 и 2032 годов долг увеличивается на r%   от суммы долга на конец предыдущего года;\n– в период с февраля по июнь каждого года действия кредита необходимо выплатить часть долга;\n– в июле каждого года долг должен быть на одну и ту же величину меньше долга на июль предыдущего года;\n– к июлю 2032 года кредит должен быть полностью погашен.\nЕгору предложили взять кредит в банке G на таких же условиях, \nно только в первые два года долг будет увеличиваться на r%,   \nа в последующие два года — на 14%. \nНайдите r,   если общая сумма выплат по кредиту в банке G меньше суммы выплат в банке N на 175 тыс. рублей.", "taskImage": "", "answerText": "10,5", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\r\n\\( S = 5 \\) млн руб. — сумма кредита.\r\nСрок кредита: 4 года.\r\nБанк N: \r\nпервые 2 года — 14%, последние 2 года — \\( r\\% \\). \r\n\\( a = \\frac{14}{100} = 0.14 \\),  \\( b = \\frac{r}{100} \\).\r\nБанк G: \r\nпервые 2 года — \\( r\\% \\), последние 2 года — 14%.\r\n\r\nДолг в июле каждого года уменьшается на одну и ту же величину \\(x\\).\r\nОбщая сумма выплат по G меньше суммы выплат по N на 175 тыс. руб. (0.175 млн руб.)\r\n\r\n\u003cstrong>Найти:\u003c/strong> \\( r \\).\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>3\u003c/th>\u003cth>4\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>Сумма в счет погашения тела кредита (млн руб.)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\r\n\u003c/table>\r\nСУММА КРЕДИТА = \\( 4x = S \\Rightarrow x = \\frac{S}{4} = \\frac{5}{4} = 1.25 \\) млн руб.\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>3\u003c/th>\u003cth>4\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>Долг до начисления процентов (млн руб.)\u003c/td>\u003ctd>\\( 4x \\)\u003c/td>\u003ctd>\\( 3x \\)\u003c/td>\u003ctd>\\( 2x \\)\u003c/td>\u003ctd>\\( 1x \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd> \u003c/td>\u003ctd>\\( 5 \\)\u003c/td>\u003ctd>\\( 3.75 \\)\u003c/td>\u003ctd>\\( 2.5 \\)\u003c/td>\u003ctd>\\( 1.25 \\)\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\u003cb>Платежи\u003c/b>\r\n\\(П_i\\)=Часть долга + процент с долга\r\n\r\n\u003cstrong>Банк N:\u003c/strong> первые 2 года — 14%, последние 2 года — \\( r\\% \\)\r\n\\(П_1 = 1.25 + 0.14 \\cdot 5 =  1.95 \\)\r\n\\(П_2 = 1.25 + 0.14 \\cdot 3.75 = 1.775 \\)\r\n\\(П_3 = 1.25 + b \\cdot 2.5 \\)\r\n\\(П_4 = 1.25 + b \\cdot 1.25 \\)\r\n\r\nОбщая сумма выплат:\r\n\\( \\Sigma_N = 1.95 + 1.775 + 1.25 + b \\cdot 2.5 + 1.25 + b \\cdot 1.25 = 6.225 + 3.75b \\)\r\n\r\n\u003cstrong>Банк G:\u003c/strong> первые 2 года — \\( r\\% \\), последние 2 года — 14%\r\n\\(П_1 = 1.25 + b \\cdot 5 = 1.25 + 5b \\)\r\n\\(П_2 = 1.25 + b \\cdot 3.75 = 1.25 + 3.75b \\)\r\n\\(П_3 = 1.25 + 0.14 \\cdot 2.5 = 1.6 \\)\r\n\\(П_4 = 1.25 + 0.14 \\cdot 1.25 = 1.425 \\)\r\n\r\nОбщая сумма выплат:\r\n\\( \\Sigma_G = 1.25 + 5b + 1.25 + 3.75b + 1.6 + 1.425 = 5.525 + 8.75b \\)\r\n\r\nПо условию: \\( \\Sigma_N -\\Sigma_G =  0.175 \\)\r\n\\( (5.525 + 8.75b) – (6.225 + 3.75b)= 0.175 \\)\r\n\\( b = 0.105=\\frac{r}{100} \\rightarrow r = 10.5 \\)\r\n\r\n\u003cstrong>Ответ:\u003c/strong> \\( r = 10.5\\% \\).\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "https://3.shkolkovo.online/catalog/4162/100639", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( : "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S \\) руб. — сумма кредита, \\( n \\) месяцев.\nПроценты: 2%, \\( a = 0{,}02 \\).\n\\( A \\) — сумма, идущая в счёт погашения тела кредита каждый месяц.\n\\( П_4 = 17700 \\) руб., \\( П_9 = 16200 \\) руб.\n\n\u003cstrong>Найти:\u003c/strong> \\( n, S, A, D \\)."}, {"d": "Составляем таблицу 1: суммы в счёт погашения тела кредита", "res": "\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>n\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Сумма в счет погашения тела кредита\u003c/td>\u003ctd>\\( A \\)\u003c/td>\u003ctd>\\( A \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( A \\)\u003c/td>\u003c/tr>\n\u003c/table>\nСУММА КРЕДИТА = \\( nA = S \\)"}, {"d": "Составляем таблицу 2: долг до начисления процентов", "res": "\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>4\u003c/th>\u003cth>...\u003c/th>\u003cth>9\u003c/th>\u003cth>...\u003c/th>\u003cth>n\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления процентов\u003c/td>\u003ctd>\\( nA \\)\u003c/td>\u003ctd>\\( (n-1)A \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( (n-3)A \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( (n-8)A \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( A \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Записываем платежи", "res": "\u003cB>ПЛАТЕЖИ:\u003c/B>\n\\(П_i\\)=Часть долга (из таблицы 1) + процент с долга (из таблицы 2)\n\\(П_4 = A + 0{,}02(n - 3)A = 17700\\)\n\\(П_9 = A + 0{,}02(n - 8)A = 16200\\)"}, {"d": "Вычитаем — находим A, затем n и S", "res": "\\(П_4 - П_9 = 0{,}02 \\cdot 5A = 1500 \\rightarrow A = 15000 \\)\n\\( 15000(1 + 0{,}02(n - 3)) = 17700 \\rightarrow 0{,}02(n - 3) = 0{,}18 \\rightarrow n = 12 \\)\n\\( S = 12 \\cdot 15000 = 180000 \\)"}, {"d": "Записываем общую сумму выплат D", "res": "\u003cB>ОБЩАЯ СУММА ВЫПЛАТ \\(\\sum\\) = КРЕДИТ + ПРОЦЕНТЫ(ПЕРЕПЛАТА)\u003c/B>\n\\( D = 12A + 0{,}02(12A + 11A + \\dots + A) = 12A + 0{,}02 \\cdot \\frac{(12A + A) \\cdot 12}{2} \\)\n\\( D = 180000 + 0{,}02 \\cdot 78 \\cdot 15000 = 180000 + 23400 = 203400 \\)"}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> \\( n = 12 \\), \\( S = 180000 \\) руб., \\( A = 15000 \\) руб., \\( D = 203400 \\) руб."}], "byClaude": true, "lvl": 4}, {"id": 1791322315229, "title": "37 аналог", "sectionName": "4 - ДИФПЛАТЕЖИ", "difficulty": "hard", "taskText": "\u003ca href=\"https://ege.sdamgia.ru/problem?id=642751 \" target=\"_blank\">🔍 АНАЛОГ 642751 \u003c/a>\nВ июле 2025 года планируется взять кредит в банке на сумму 1400 тысяч рублей на 10 лет. Условия его возврата таковы:\n— каждый январь долг возрастает на 10% по сравнению с концом предыдущего года;\n— с февраля по июнь необходимо выплатить часть долга;\n— в июле 2026, 2027, 2028, 2029, 2030 годов долг должен быть на одну и ту же сумму меньше долга на июль предыдущего года;\n— в июле 2031, 2032, 2033, 2034, 2035 годов долг должен быть на другую одну и ту же сумму меньше долга на июль предыдущего года;\n— к июлю 2035 года долг должен быть полностью погашен.\nНайдите платёж в 2026 году, если общая сумма выплат по кредиту составила 2120 тыс. рублей.", "taskImage": "", "answerText": "300 000", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 1400 \\) тыс. руб. — сумма кредита.\nСрок кредита: 10 лет.\nПроценты: 10%, \\( a = 0{,}1 \\).\nПервые 5 лет (2026–2030): долг уменьшается на одну и ту же величину \\( x \\).\nВторые 5 лет (2031–2035): долг уменьшается на другую одну и ту же величину \\( y \\).\nОбщая сумма выплат = 2120 тыс. руб.\n\n\u003cstrong>Найти:\u003c/strong> платёж 2026 года.\n\n\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>2026\u003c/th>\u003cth>2027\u003c/th>\u003cth>2028\u003c/th>\u003cth>2029\u003c/th>\u003cth>2030\u003c/th>\u003cth>2031\u003c/th>\u003cth>2032\u003c/th>\u003cth>2033\u003c/th>\u003cth>2034\u003c/th>\u003cth>2035\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Погашение тела кредита (тыс. руб.)\u003c/td>\u003ctd>x\u003c/td>\u003ctd>x\u003c/td>\u003ctd>x\u003c/td>\u003ctd>x\u003c/td>\u003ctd>x\u003c/td>\u003ctd>y\u003c/td>\u003ctd>y\u003c/td>\u003ctd>y\u003c/td>\u003ctd>y\u003c/td>\u003ctd>y\u003c/td>\u003c/tr>\n\u003c/table>\nСУММА КРЕДИТА = \\(5x+5y=1400 \\rightarrow x + y = 280\\)\n\n\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>2026\u003c/th>\u003cth>2027\u003c/th>\u003cth>2028\u003c/th>\u003cth>2029\u003c/th>\u003cth>2030\u003c/th>\u003cth>2031\u003c/th>\u003cth>2032\u003c/th>\u003cth>2033\u003c/th>\u003cth>2034\u003c/th>\u003cth>2035\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления (тыс. руб.)\u003c/td>\u003ctd>5x+5y\u003c/td>\u003ctd>4x+5y\u003c/td>\u003ctd>3x+5y\u003c/td>\u003ctd>2x+5y\u003c/td>\u003ctd>x+5y\u003c/td>\u003ctd>5y\u003c/td>\u003ctd>4y\u003c/td>\u003ctd>3y\u003c/td>\u003ctd>2y\u003c/td>\u003ctd>y\u003c/td>\u003c/tr>\n\u003c/table>\n\n\u003cB>Платежи:\u003c/B>\n\\(П_i = \\text{Часть долга} + \\text{Проценты с долга до начисления}\\)\n\\(П_1 = x + 0{,}1(5x + 5y)\\), …, \\(П_5 = x + 0{,}1(x + 5y)\\)\n\\(П_6 = y + 0{,}1 \\cdot 5y\\), …, \\(П_{10} = y + 0{,}1 \\cdot y\\)\n\n\u003cB> Общая сумма выплат:\u003c/b> \\( \\Sigma = \\text{СУММА КРЕДИТА} + \\text{СУММА ПРОЦЕНТОВ} \\)\n\\( \\Sigma = 1400 + 0{,}1 \\cdot (15x + 25y + 15y) = 2120 \\)\n\\( 15x + 40y = 7200 \\rightarrow 3x + 8y = 1440 \\)\n\\( \\begin{cases} x + y = 280 \\\\ 3x + 8y = 1440 \\end{cases} \\Rightarrow 5y = 600 \\rightarrow y = 120,\\ x = 160 \\)\n\n\\(П_1 = x + 0{,}1 \\cdot 1400 = 160 + 140 = 300 \\) тыс. руб.\n\n\u003cstrong>Ответ:\u003c/strong> 300 000 рублей.", "solutionImage": "", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 1400 \\) тыс. руб. — сумма кредита.\nСрок кредита: 10 лет.\nПроценты: 10%, \\( a = 0{,}1 \\).\nПервые 5 лет (2026–2030): долг уменьшается на одну и ту же величину \\( x \\).\nВторые 5 лет (2031–2035): долг уменьшается на другую одну и ту же величину \\( y \\).\nОбщая сумма выплат = 2120 тыс. руб.\n\n\u003cstrong>Найти:\u003c/strong> платёж 2026 года."}, {"d": "Составляем таблицу 1: суммы в счёт погашения тела кредита", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>2026\u003c/th>\u003cth>2027\u003c/th>\u003cth>2028\u003c/th>\u003cth>2029\u003c/th>\u003cth>2030\u003c/th>\u003cth>2031\u003c/th>\u003cth>2032\u003c/th>\u003cth>2033\u003c/th>\u003cth>2034\u003c/th>\u003cth>2035\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Погашение тела кредита (тыс. руб.)\u003c/td>\u003ctd>x\u003c/td>\u003ctd>x\u003c/td>\u003ctd>x\u003c/td>\u003ctd>x\u003c/td>\u003ctd>x\u003c/td>\u003ctd>y\u003c/td>\u003ctd>y\u003c/td>\u003ctd>y\u003c/td>\u003ctd>y\u003c/td>\u003ctd>y\u003c/td>\u003c/tr>\n\u003c/table>\nСУММА КРЕДИТА = \\(5x+5y=1400 \\rightarrow x + y = 280\\)"}, {"d": "Составляем таблицу 2: долг до начисления процентов", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>2026\u003c/th>\u003cth>2027\u003c/th>\u003cth>2028\u003c/th>\u003cth>2029\u003c/th>\u003cth>2030\u003c/th>\u003cth>2031\u003c/th>\u003cth>2032\u003c/th>\u003cth>2033\u003c/th>\u003cth>2034\u003c/th>\u003cth>2035\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления (тыс. руб.)\u003c/td>\u003ctd>5x+5y\u003c/td>\u003ctd>4x+5y\u003c/td>\u003ctd>3x+5y\u003c/td>\u003ctd>2x+5y\u003c/td>\u003ctd>x+5y\u003c/td>\u003ctd>5y\u003c/td>\u003ctd>4y\u003c/td>\u003ctd>3y\u003c/td>\u003ctd>2y\u003c/td>\u003ctd>y\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Записываем платежи", "res": "\u003cB>Платежи:\u003c/B>\n\\(П_i = \\text{Часть долга} + \\text{Проценты с долга до начисления}\\)\n\\(П_1 = x + 0{,}1(5x + 5y)\\), …, \\(П_5 = x + 0{,}1(x + 5y)\\)\n\\(П_6 = y + 0{,}1 \\cdot 5y\\), …, \\(П_{10} = y + 0{,}1 \\cdot y\\)"}, {"d": "Записываем общую сумму выплат и решаем систему", "res": "\u003cB> Общая сумма выплат:\u003c/b> \\( \\Sigma = \\text{СУММА КРЕДИТА} + \\text{СУММА ПРОЦЕНТОВ} \\)\n\\( \\Sigma = 1400 + 0{,}1 \\cdot (15x + 25y + 15y) = 2120 \\)\n\\( 15x + 40y = 7200 \\rightarrow 3x + 8y = 1440 \\)\n\\( \\begin{cases} x + y = 280 \\\\ 3x + 8y = 1440 \\end{cases} \\Rightarrow 5y = 600 \\rightarrow y = 120,\\ x = 160 \\)"}, {"d": "Считаем платёж 2026 года", "res": "\\(П_1 = x + 0{,}1 \\cdot 1400 = 160 + 140 = 300 \\) тыс. руб."}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> 300 000 рублей."}], "byClaude": true, "lvl": 4}, {"id": 1772888186862, "title": "29 - 126148", "sectionName": "4 - ДИФПЛАТЕЖИ", "difficulty": "hard", "taskText": "В июле планируется взять кредит в банке на сумму 5 млн рублей на некоторое целое число лет. Условия его возврата таковы:\n– каждый январь долг возрастает на 20% по сравнению с концом предыдущего года;\n– с февраля по июнь каждого года необходимо выплачивать часть долга;\n– в июле каждого года долг должен быть на одну и ту же сумму меньше долга на июль предыдущего года.\nНа сколько лет взят кредит, если известно, что общая сумма выплат после его погашения составит 7,5 млн рублей?", "taskImage": "", "answerText": "4 года", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\r\n\\( S = 5 \\) млн руб. — сумма кредита.\r\n\\( r = 20\\% \\), \\( a = 0.2 \\).\r\nСрок кредита: \\( n \\) лет (целое число).\r\nДолг в июле каждого года уменьшается на одну и ту же величину \\(x\\).\r\nОбщая сумма выплат = 7.5 млн руб.\r\n\r\n\u003cstrong>Найти:\u003c/strong> \\( n \\).\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>3\u003c/th>\u003cth>...\u003c/th>\u003cth>n-1\u003c/th>\u003cth>n\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>Сумма в счет погашения тела кредита (млн руб.)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\r\n\u003c/table>\r\nСУММА КРЕДИТА = \\( nx = S \\), значит \\( x = \\frac{S}{n} = \\frac{5}{n} \\).\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>3\u003c/th>\u003cth>...\u003c/th>\u003cth>n-1\u003c/th>\u003cth>n\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>Долг до начисления процентов (млн руб.)\u003c/td>\u003ctd>\\( nx \\)\u003c/td>\u003ctd>\\( (n-1)x \\)\u003c/td>\u003ctd>\\( (n-2)x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( 2x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\u003cB>Платежи\u003c/B>\r\n\\(П_i\\)=Часть долга (из таблицы 1) + процент с долга (из таблицы 2)\r\n\r\n\\(П_1 = x + a(nx)\\)\r\n\\(П_2 = x + a((n-1)x)\\)\r\n\\(П_3 = x + a((n-2)x)\\)\r\n...\r\n\\(П_{n-1} = x + a(2x)\\)\r\n\\(П_n = x + a(x)\\)\r\n\r\n\u003cB>ОБЩАЯ СУММА ВЫПЛАТ \\(\\ sum \\)= КРЕДИТ + ПРОЦЕНТЫ(ПЕРЕПЛАТА)\u003c/B>=\\(7.5\\)\r\n\\(\\sum=S  + a(nx + (n-1)x + (n-2)x + \\dots + 2x + x) = 7.5 \\)\r\n\r\nВ скобках – арифметическая прогрессия:\r\n\\(\\sum=S  + a\\frac{(nx + x) \\cdot n}{2}  = 7.5 \\)\r\n\r\nПодставляем \\( x = \\frac{5}{n} , S=5, a=0.2\\):\r\n\\( 5 + 0.2 \\cdot \\frac{(n+1)n}{2} \\cdot \\frac{5}{n} = 7.5 \\)\r\n\r\nУпрощаем:\r\n\\( 5 + 0.2 \\cdot \\frac{5(n+1)}{2} = 7.5 \\)\r\n\\( n = 4 \\)\r\n\r\n\u003cstrong>Ответ:\u003c/strong> кредит взят на \u003cstrong>4 года\u003c/strong>.\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "https://3.shkolkovo.online/catalog/131/126148", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 5 \\) млн руб. — сумма кредита.\n\\( r = 20\\% \\), \\( a = 0.2 \\).\nСрок кредита: \\( n \\) лет (целое число).\nДолг в июле каждого года уменьшается на одну и ту же величину \\(x\\).\nОбщая сумма выплат = 7.5 млн руб.\n\u003cstrong>Найти:\u003c/strong> \\( n \\)."}, {"d": "Составляем таблицу погашения тела кредита", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>3\u003c/th>\u003cth>...\u003c/th>\u003cth>n-1\u003c/th>\u003cth>n\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Сумма в счет погашения тела кредита (млн руб.)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Находим \\(x\\)", "res": "СУММА КРЕДИТА = \\( nx = S \\), значит \\( x = \\frac{S}{n} = \\frac{5}{n} \\)."}, {"d": "Составляем таблицу долга до начисления процентов", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>3\u003c/th>\u003cth>...\u003c/th>\u003cth>n-1\u003c/th>\u003cth>n\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления процентов (млн руб.)\u003c/td>\u003ctd>\\( nx \\)\u003c/td>\u003ctd>\\( (n-1)x \\)\u003c/td>\u003ctd>\\( (n-2)x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( 2x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Платежи", "res": "\u003cB>Платежи\u003c/B>\n\\(П_i\\)=Часть долга (из таблицы 1) + процент с долга (из таблицы 2)"}, {"d": "Преобразуем и считаем", "res": "\\(П_1 = x + a(nx)\\)\n\\(П_2 = x + a((n-1)x)\\)\n\\(П_3 = x + a((n-2)x)\\)\n...\n\\(П_{n-1} = x + a(2x)\\)\n\\(П_n = x + a(x)\\)"}, {"d": "ОБЩАЯ СУММА ВЫПЛАТ \\(\\ sum \\)= КРЕДИТ + ПРОЦЕНТЫ(ПЕРЕПЛАТА)=\\(7.5\\)", "res": "\u003cB>ОБЩАЯ СУММА ВЫПЛАТ \\(\\ sum \\)= КРЕДИТ + ПРОЦЕНТЫ(ПЕРЕПЛАТА)\u003c/B>=\\(7.5\\)\n\\(\\sum=S  + a(nx + (n-1)x + (n-2)x + \\dots + 2x + x) = 7.5 \\)"}, {"d": "В скобках – арифметическая прогрессия", "res": "В скобках – арифметическая прогрессия:\n\\(\\sum=S  + a\\frac{(nx + x) \\cdot n}{2}  = 7.5 \\)"}, {"d": "Подставляем известные значения", "res": "Подставляем \\( x = \\frac{ ble>\r\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>3\u003c/th>\u003cth>...\u003c/th>\u003cth>n-1\u003c/th>\u003cth>n\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>Долг до начисления процентов\u003c/td>\u003ctd>\\( S \\)\u003c/td>\u003ctd>\\( S - x \\)\u003c/td>\u003ctd>\\( S - 2x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( 2x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\u003cb>ПЛАТЕЖИ\u003c/b>\r\nПЛАТЕЖ ЗА \\(i\\)-Й МЕСЯЦ: \\(П_i\\)=Часть долга (из таблицы 1) + процент с долга (из таблицы 2)\r\n\\(П_1=x+a(S)\\)\r\n\\(П_2=x+a(S-x)\\)\r\n\\(П_3=x+a(S-2x)\\)\r\n...\r\n\\(П_{n-1}=x+a(2x)\\)\r\n\\(П_n=x+a(x)\\)\r\n\r\n\u003cb>ОБЩАЯ СУММА ВЫПЛАТ \\(\\sum\\)= КРЕДИТ + ПРОЦЕНТЫ(ПЕРЕПЛАТА)\u003c/b>\r\n\\(\\sum=  S + a(S + (S-x) + (S-2x) + ... + 2x + x) = 1.2S \\)\r\nВ скобках арифметическая прогрессия.\r\n\\( S + a(\\frac{S + x}{2} \\cdot n) = 1.2S \\)\r\n\r\nПодставляем \\( x = \\frac{S}{n}, a=0.01 \\):\r\n\\( S + 0.01({\\frac{S+ S/n}{2} \\cdot n}) = 1.2 S\\)\r\nДелим на \\( S \\) и Умножаем на 1000\r\n\\( 5 \\cdot (n+1) = 200 \\)\r\n\\( n = 39 \\)\r\n\r\n\u003cstrong>Ответ:\u003c/strong> кредит брали на \u003cstrong>39 месяцев\u003c/strong>.\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "https://3.shkolkovo.online/catalog/131/30859", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S \\) — сумма кредита.\n\n\u003cb>Проценты:\u003c/b> 1% в месяц, \\( a =  0.01 \\).\nДолг 15-го числа каждого месяца уменьшается на фиксированную величину \\(x\\).\nОбщая сумма выплат оказалась на 20% больше взятой в кредит суммы.\n\\(\\rightarrow\\) \u003cb>Общая сумма выплат\u003c/b> = \\(1.2S \\).\n\u003cstrong>Найти:\u003c/strong> количество месяцев \\( n \\)."}, {"d": "Составляем таблицу погашения тела кредита", "res": "\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>3\u003c/th>\u003cth>...\u003c/th>\u003cth>n-1\u003c/th>\u003cth>n\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Сумма в счет погашения тела кредита\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "СУММА КРЕДИТА: [1]", "res": "СУММА КРЕДИТА: \\( nx = S \\rightarrow  x = \\frac{S}{n} \\quad\\)[1]"}, {"d": "Составляем таблицу долга до начисления процентов", "res": "\u003ctable>\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>3\u003c/th>\u003cth>...\u003c/th>\u003cth>n-1\u003c/th>\u003cth>n\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления процентов\u003c/td>\u003ctd>\\( S \\)\u003c/td>\u003ctd>\\( S - x \\)\u003c/td>\u003ctd>\\( S - 2x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( 2x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "ПЛАТЕЖИ", "res": "\u003cb>ПЛАТЕЖИ\u003c/b>\nПЛАТЕЖ ЗА \\(i\\)-Й МЕСЯЦ: \\(П_i\\)=Часть долга (из таблицы 1) + процент с долга (из таблицы 2)\n\\(П_1=x+a(S)\\)\n\\(П_2=x+a(S-x)\\)"}, {"d": "Преобразуем и считаем", "res": "\\(П_3=x+a(S-2x)\\)\n...\n\\(П_{n-1}=x+a(2x)\\)\n\\(П_n=x+a(x)\\)"}, {"d": "ОБЩАЯ СУММА ВЫПЛАТ \\(\\sum\\)= КРЕДИТ + ПРОЦЕНТЫ(ПЕРЕПЛАТА)", "res": "\u003cb>ОБЩАЯ СУММА ВЫПЛАТ \\(\\sum\\)= КРЕДИТ + ПРОЦЕНТЫ(ПЕРЕПЛАТА)\u003c/b>\n\\(\\sum=  S + a(S + (S-x) + (S-2x) + ... + 2x + x) = 1.2S \\)\nВ скобках арифметическая прогрессия.\n\\( S + a(\\frac{S + x}{2} \\cdot n) = 1.2S \\)"}, {"d": "Подставляем известные значения", "res": "Подставляем \\( x = \\frac{S}{n}, a=0.01 \\):\n\\( S + 0.01({\\frac{S+ S/n}{2} \\cdot n}) = 1.2 S\\)\nДелим на \\( S \\) и Умножаем на 1000\n\\( 5 \\cdot (n+1) = 200 \\)\n\\( n = 39 \\)"}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> кредит брали на \u003cstrong>39 месяцев\u003c/strong>."}], "lvl": 5}, {"id": 1791322337161, "title": "37 аналог", "sectionName": "4 - ДИФПЛАТЕЖИ", "difficulty": "hard", "taskText": "\u003ca href=\"https://ege.sdamgia.ru/problem?id=642376 \" target=\"_blank\">🔍 АНАЛОГ 642376  \u003c/a>\nВ июле 2025 года планируется взять кредит в банке на некоторую сумму на 10 лет. Условия его возврата таковы:\n— каждый январь долг увеличивается на 10% по сравнению с концом предыдущего года;\n— с февраля по июнь каждого года необходимо выплатить одним платежом часть долга;\n— в июле 2026, 2027, 2028, 2029, 2030 годов долг должен быть на одну и ту же сумму меньше долга на июль предыдущего года;\n— в июле 2030 года долг должен составлять 800 тыс. руб.;\n— в июле 2031, 2032, 2033, 2034, 2035 годов долг должен быть на другую одну и ту же сумму меньше долга на июль предыдущего года;\nНайдите начальную сумму кредита, если сумма выплат по кредиту равна 2090 тысяч рублей.", "taskImage": "", "answerText": "1300000", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\n\\( S \\) тыс. руб. — сумма кредита.\nСрок кредита: 10 лет.\nПроценты: 10%, \\( a = 0{,}1 \\).\nПервые 5 лет (2026–2030): долг уменьшается на одну и ту же величину \\( x \\).\nВ июле 2030 года долг = 800 тыс. руб.\nВторые 5 лет (2031–2035): долг уменьшается на другую одну и ту же величину \\( y \\).\nОбщая сумма выплат = 2090 тыс. руб.\n\n\u003cstrong>Найти:\u003c/strong> \\( S \\).\n\n\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>2026\u003c/th>\u003cth>2027\u003c/th>\u003cth>2028\u003c/th>\u003cth>2029\u003c/th>\u003cth>2030\u003c/th>\u003cth>2031\u003c/th>\u003cth>2032\u003c/th>\u003cth>2033\u003c/th>\u003cth>2034\u003c/th>\u003cth>2035\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Погашение тела кредита (тыс. руб.)\u003c/td>\u003ctd>x\u003c/td>\u003ctd>x\u003c/td>\u003ctd>x\u003c/td>\u003ctd>x\u003c/td>\u003ctd>x\u003c/td>\u003ctd>y\u003c/td>\u003ctd>y\u003c/td>\u003ctd>y\u003c/td>\u003ctd>y\u003c/td>\u003ctd>y\u003c/td>\u003c/tr>\n\u003c/table>\nСУММА КРЕДИТА = \\(5x+5y=S\\)\n\\(5y=800 \\rightarrow y=160\\)\n\n\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>2026\u003c/th>\u003cth>2027\u003c/th>\u003cth>2028\u003c/th>\u003cth>2029\u003c/th>\u003cth>2030\u003c/th>\u003cth>2031\u003c/th>\u003cth>2032\u003c/th>\u003cth>2033\u003c/th>\u003cth>2034\u003c/th>\u003cth>2035\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления (тыс. руб.)\u003c/td>\u003ctd>5x+5y\u003c/td>\u003ctd>4x+5y\u003c/td>\u003ctd>3x+5y\u003c/td>\u003ctd>2x+5y\u003c/td>\u003ctd>x+5y\u003c/td>\u003ctd>5y\u003c/td>\u003ctd>4y\u003c/td>\u003ctd>3y\u003c/td>\u003ctd>2y\u003c/td>\u003ctd>y\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd> \u003c/td>\u003ctd>5x+800\u003c/td>\u003ctd>4x+800\u003c/td>\u003ctd>3x+800\u003c/td>\u003ctd>2x+800\u003c/td>\u003ctd>x+800\u003c/td>\u003ctd>800\u003c/td>\u003ctd>640\u003c/td>\u003ctd>480\u003c/td>\u003ctd>320\u003c/td>\u003ctd>160\u003c/td>\u003c/tr>\n\u003c/table>\n\n\u003cB>Платежи:\u003c/B>\n\\(П_i = \\text{Часть долга} + \\text{Проценты с долга до начисления}\\)\n\\(П_1 = x + 0{,}1(5x + 800)\\), …, \\(П_5 = x + 0{,}1(x + 800)\\)\n\\(П_6 = 160 + 0{,}1 \\cdot 800\\), …, \\(П_{10} = 160 + 0{,}1 \\cdot 160\\)\n\n\u003cB> Общая сумма выплат:\u003c/b> \\( \\Sigma = \\text{СУММА КРЕДИТА} + \\text{СУММА ПРОЦЕНТОВ} \\)\n\\( \\Sigma = (5x + 800) + 0{,}1 \\cdot (15x + 4000 + 800 + 640 + 480 + 320 + 160) = 2090 \\)\n\\( 5x + 800 + 1{,}5x + 400 + 240 = 2090 \\)\n\\( 6{,}5x = 650 \\rightarrow x = 100 \\)\n\\( S = 5 \\cdot 100 + 800 = 1300 \\) тыс. руб.\n\n\u003cstrong>Ответ:\u003c/strong> 1 300 000 рублей.", "solutionImage": "", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S \\) тыс. руб. — сумма кредита.\nСрок кредита: 10 лет.\nПроценты: 10%, \\( a = 0{,}1 \\).\nПервые 5 лет (2026–2030): долг уменьшается на одну и ту же величину \\( x \\).\nВ июле 2030 года долг = 800 тыс. руб.\nВторые 5 лет (2031–2035): долг уменьшается на другую одну и ту же величину \\( y \\).\nОбщая сумма выплат = 2090 тыс. руб.\n\n\u003cstrong>Найти:\u003c/strong> \\( S \\)."}, {"d": "Составляем таблицу 1: суммы в счёт погашения тела кредита", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>2026\u003c/th>\u003cth>2027\u003c/th>\u003cth>2028\u003c/th>\u003cth>2029\u003c/th>\u003cth>2030\u003c/th>\u003cth>2031\u003c/th>\u003cth>2032\u003c/th>\u003cth>2033\u003c/th>\u003cth>2034\u003c/th>\u003cth>2035\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Погашение тела кредита (тыс. руб.)\u003c/td>\u003ctd>x\u003c/td>\u003ctd>x\u003c/td>\u003ctd>x\u003c/td>\u003ctd>x\u003c/td>\u003ctd>x\u003c/td>\u003ctd>y\u003c/td>\u003ctd>y\u003c/td>\u003ctd>y\u003c/td>\u003ctd>y\u003c/td>\u003ctd>y\u003c/td>\u003c/tr>\n\u003c/table>\nСУММА КРЕДИТА = \\(5x+5y=S\\)\n\\(5y=800 \\rightarrow y=160\\)"}, {"d": "Составляем таблицу 2: долг до начисления процентов", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>2026\u003c/th>\u003cth>2027\u003c/th>\u003cth>2028\u003c/th>\u003cth>2029\u003c/th>\u003cth>2030\u003c/th>\u003cth>2031\u003c/th>\u003cth>2032\u003c/th>\u003cth>2033\u003c/th>\u003cth>2034\u003c/th>\u003cth>2035\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления (тыс. руб.)\u003c/td>\u003ctd>5x+5y\u003c/td>\u003ctd>4x+5y\u003c/td>\u003ctd>3x+5y\u003c/td>\u003ctd>2x+5y\u003c/td>\u003ctd>x+5y\u003c/td>\u003ctd>5y\u003c/td>\u003ctd>4y\u003c/td>\u003ctd>3y\u003c/td>\u003ctd>2y\u003c/td>\u003ctd>y\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd> \u003c/td>\u003ctd>5x+800\u003c/td>\u003ctd>4x+800\u003c/td>\u003ctd>3x+800\u003c/td>\u003ctd>2x+800\u003c/td>\u003ctd>x+800\u003c/td>\u003ctd>800\u003c/td>\u003ctd>640\u003c/td>\u003ctd>480\u003c/td>\u003ctd>320\u003c/td>\u003ctd>160\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Записываем платежи", "res": "\u003cB>Платежи:\u003c/B>\n\\(П_i = \\text{Часть долга} + \\text{Проценты с долга до начисления}\\)\n\\(П_1 = x + 0{,}1(5x + 800)\\), …, \\(П_5 = x + 0{,}1(x + 800)\\)\n\\(П_6 = 160 + 0{,}1 \\cdot 800\\), …, \\(П_{10} = 160 + 0{,}1 \\cdot 160\\)"}, {"d": "Записываем общую сумму выплат", "res": "\u003cB> Общая сумма выплат:\u003c/b> \\( \\Sigma = \\text{СУММА КРЕДИТА} + \\text{СУММА ПРОЦЕНТОВ} \\)\n\\( \\Sigma = (5x + 800) + 0{,}1 \\cdot (15x + 4000 + 800 + 640 + 480 + 320 + 160) = 2090 \\)\n\\( 5x + 800 + 1{,}5x + 400 + 240 = 2090 \\)\n\\( 6{,}5x = 650 \\rightarrow x = 100 \\)\n\\( S = 5 \\cdot 100 + 800 = 1300 \\) тыс. руб."}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> 1 300 000 рублей."}], "byClaude": true, "lvl": 5}, {"id": 1784094218144, "title": "526728", "sectionName": "4 - ДИФПЛАТЕЖИ", "difficulty": "hard", "taskText": "\u003ca href=\"https://ege.sdamgia.ru/problem?id=526728   \" target=\"_blank\">🔍 АНАЛОГ  526728   \u003c/a> НЕИЗВЕСТНО КОЛИЧЕСТВО ЛЕТ\nВ июле клиент планирует взять кредит в банке на сумму 6 млн. рублей на некоторый срок (целое число лет). Условия его возврата таковы:\n— каждый январь долг возрастает на 20% по сравнению с концом предыдущего года;\n— с февраля по июнь каждого года необходимо выплатить часть долга;\n— в июле каждого года долг должен быть на одну и ту же сумму меньше долга на июль предыдущего года.\nНа сколько лет планирует клиент взять кредит, если наибольший годовой платёж составит 1,8 млн. рублей?", "taskImage": "", "answerText": "10", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 6 \\) млн руб. — сумма кредита.\nСрок кредита: \\( n \\) лет.\nПроценты: 20%, \\( a = 0{,}2 \\).\n\\( x \\) — сумма, идущая в счёт погашения тела кредита каждый год.\nНаибольший годовой платёж = 1,8 млн руб.\n\n\u003cstrong>Найти:\u003c/strong> \\( n \\).\n\n\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>n\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Сумма в счет погашения тела кредита (млн руб.)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\n\u003c/table>\nСУММА КРЕДИТА = \\( nx = 6 \\)\n\n\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>n\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Долг до начисления процентов\u003c/td>\u003ctd>\\( nx = 6 \\)\u003c/td>\u003ctd>\\( (n-1)x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\n\u003c/table>\n\n\u003cB>ПЛАТЕЖИ:\u003c/B>\n\\(П_i\\)=Часть долга (из таблицы 1) + процент с долга (из таблицы 2)\nНаибольший платёж — первый (долг самый большой):\n\\(П_1 = x + 0{,}2 \\cdot 6 = x + 1{,}2 = 1{,}8 \\rightarrow x = 0{,}6 \\)\n\n\\( n = \\frac{6}{0{,}6} = 10 \\)\n\n\u003cstrong>Ответ:\u003c/strong> 10 лет.", "solutionImage": "", "drawingImage": "", "solutionLink": "https://ege.sdamgia.ru/problem?id=526728", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 6 \\) млн руб. — сумма кредита.\nСрок кредита: \\( n \\) лет.\nПроценты: 20%, \\( a = 0{,}2 \\).\n\\( x \\) — сумма, идущая в счёт погашения тела кредита каждый год.\nНаибольший годовой платёж = 1,8 млн руб.\n\n\u003cstrong>Найти:\u003c/strong> \\( n \\)."}, {"d": "Составляем таблицу 1: суммы в счёт погашения тела кредита", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>n\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Сумма в счет погашения тела кредита (млн руб.)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\n\u003c/table>\nСУММА КРЕДИТА = \\( nx = 6 \\)"}, {"d": "Составляем таблицу 2: долг до начисления процентов", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>...\u003c/th>\u003cth>n\u003c \n\u003cstrong>Найти:\u003c/strong> \\( r \\).\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>2027\u003c/th>\u003cth>2028\u003c/th>\u003cth>2029\u003c/th>\u003cth>2030\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>Погашение тела кредита (млн руб.)\u003c/td>\u003ctd>x\u003c/td>\u003ctd>x\u003c/td>\u003ctd>x\u003c/td>\u003ctd>x\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\\( 4x = S \\Rightarrow x = \\frac{S}{4} = 5 \\) млн руб.\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>2027\u003c/th>\u003cth>2028\u003c/th>\u003cth>2029\u003c/th>\u003cth>2030\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>Долг до начисления (млн руб.)\u003c/td>\u003ctd>20\u003c/td>\u003ctd>15\u003c/td>\u003ctd>10\u003c/td>\u003ctd>5\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\u003cB>Платежи:\u003c/B>\r\n\\(П_i = \\text{Часть долга} + \\text{Проценты с долга до начисления} \\)\r\n\r\n\\(П_1 = 5 + a_1 \\cdot 20\\)\r\n\\(П_2 = 5 + a_1 \\cdot 15\\)\r\n\\(П_3 = 5 + a_2 \\cdot 10\\)\r\n\\(П_4 = 5 + a_2 \\cdot 5\\)\r\n\r\nгде \\( a_1 = \\frac{r}{100} \\), \\( a_2 = \\frac{2r}{100} \\).\r\n\r\n\u003cB>Общая сумма выплат = СУММА КРЕДИТА + ПРОЦЕНТЫ С ДОЛГОВ:\u003c/B>\r\n\\( \\Sigma = 20 + (a_1 \\cdot 20 + a_1 \\cdot 15 + a_2 \\cdot 10 + a_2 \\cdot 5) = 33 \\)\r\n\\( 35a_1 + 15a_2 = 13 \\)\r\n\r\nПодставляем \\( a_1 = \\frac{r}{100} \\), \\( a_2 = \\frac{2r}{100} \\):\r\n\\( 35 \\cdot \\frac{r}{100} + 15 \\cdot \\frac{2r}{100} = 13 \\)\r\n\\( r = 20 \\)\r\n\r\n\u003cstrong>Ответ:\u003c/strong> \\( r = 20\\% \\).\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "https://3.shkolkovo.online/catalog/11066/151549", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 20 \\) млн руб. — сумма кредита.\nСрок кредита: 4 года (2027–2030).\n\nСтавки:\n2027 год: \\( r\\% \\) (\\( a_1 = \\frac{r}{100} \\))\n2028 год: \\( r\\% \\) (\\( a_2 = \\frac  "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> \\( r = 20\\% \\)."}], "lvl": 5}, {"id": 1772891524560, "title": "30 - 18622", "sectionName": "4 - ДИФПЛАТЕЖИ", "difficulty": "hard", "taskText": "В июле некоторого года планируется взять кредит в банке на сумму 3 млн рублей на некоторый срок (целое число лет).\nУсловия его возврата таковы:\n– каждый январь долг возрастает на 20% по сравнению с концом предыдущего года;\n– с февраля по июнь каждого года необходимо выплатить часть долга;\n– в июле каждого года долг должен быть на одну и ту же сумму меньше долга на июль предыдущего года.\nЧему будет равна общая сумма выплат после полного погашения кредита, если наименьший годовой платёж составит 0,24 млн рублей? Считайте, что округления при вычислении платежей не производятся.", "taskImage": "", "answerText": "7,8 млн рублей", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\r\n\\( S = 3 \\) млн руб. — сумма кредита.\r\n\\( r = 20\\% \\), \\( a = 0.2 \\).\r\nСрок кредита: \\( n \\) лет (целое число).\r\nДолг в июле каждого года уменьшается на одну и ту же величину \\( x \\).\r\nНаименьший годовой платёж = 0.24 млн руб.\r\n\r\n\u003cstrong>Найти:\u003c/strong> общую сумму выплат.\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>3\u003c/th>\u003cth>...\u003c/th>\u003cth>n-1\u003c/th>\u003cth>n\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>Сумма в счет погашения тела кредита (млн руб.)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\r\n\u003c/table>\r\nСУММА КРЕДИТА = \\( nx = S = 3 \\), значит \\( x = \\frac{3}{n} \\).\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>3\u003c/th>\u003cth>...\u003c/th>\u003cth>n-1\u003c/th>\u003cth>n\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>Долг до начисления процентов (млн руб.)\u003c/td>\u003ctd>\\( nx \\)\u003c/td>\u003ctd>\\( (n-1)x \\)\u003c/td>\u003ctd>\\( (n-2)x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( 2x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\u003cB>Платежи\u003c/B>\r\n\\(П_i\\)=Часть долга (из таблицы 1) + процент с долга (из таблицы 2)\r\n\r\n\\(П_1 = x + a(nx)\\)\r\n\\(П_2 = x + a((n-1)x)\\)\r\n\\(П_3 = x + a((n-2)x)\\)\r\n...\r\n\\(П_{n-1} = x + a(2x)\\)\r\n\\(П_n = x + a(x)\\)\r\n\r\nПлатежи уменьшаются с каждым годом, так как сумма, идущая в счет тела кредита, - постоянна, а долг до начисления процентов уменьшается.\r\nНаименьший платёж — последний. По условию он равен 0,24:\r\n\\( П_n = x + a(x) = 0,24\\)\r\n\\( x + 1,2x  =0,24\\)\r\n\\( x =  0.2 \\)\r\n\r\nТак как \\( nx = 3 \\):\r\n\\( n \\cdot 0.2 = 3 \\)\r\n\\( n = 15 \\) лет.\r\n\r\nОбщая сумма выплат \\(\\sum \\)= КРЕДИТ + ПРОЦЕНТЫ(ПЕРЕПЛАТА)\r\n\\( \\Sigma = S + a(nx + (n-1)x + (n-2)x + \\dots + 2x + x) \\)\r\n\r\nВ скобках сумма арифметической прогрессии:\r\n\\( \\Sigma = S + a(\\frac{(nx + x) \\cdot n}{2}  )\\)\r\n\r\nПодставляем \\(S=3, x = 0.2 , n = 15, a=0.2 \\):\r\n\\( \\Sigma = 3 + 0.2(\\frac{(3 + 0.2) \\cdot 15}{2}  )\\)\r\n\\( \\Sigma = 7.8 \\)\r\n\r\n\u003cstrong>Ответ:\u003c/strong> общая сумма выплат составит \u003cstrong>7.8 млн рублей\u003c/strong>.\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "https://3.shkolkovo.online/catalog/131/18622", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 3 \\) млн руб. — сумма кредита.\n\\( r = 20\\% \\), \\( a = 0.2 \\).\nСрок кредита: \\( n \\) лет (целое число).\nДолг в июле каждого года уменьшается на одну и ту же величину \\( x \\).\nНаименьший годовой платёж = 0.24 млн руб."}, {"d": "Записываем, что нужно найти, и составляем таблицу погашения тела кредита", "res": "\u003cstrong>Найти:\u003c/strong> общу ической прогрессии", "res": "В скобках сумма арифметической прогрессии:\n\\( \\Sigma = S + a(\\frac{(nx + x) \\cdot n}{2}  )\\)"}, {"d": "Подставляем известные значения", "res": "Подставляем \\(S=3, x = 0.2 , n = 15, a=0.2 \\):\n\\( \\Sigma = 3 + 0.2(\\frac{(3 + 0.2) \\cdot 15}{2}  )\\)\n\\( \\Sigma = 7.8 \\)"}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> общая сумма выплат составит \u003cstrong>7.8 млн рублей\u003c/strong>."}], "lvl": 5}, {"id": 1778990743694, "title": "54 - 41110 авторская школково", "sectionName": "4 - ДИФПЛАТЕЖИ", "difficulty": "hard", "taskText": "15-го января некоторого года Антон взял кредит на 3 млн рублей на 6 месяцев. Условия его возврата таковы:\n– 1-го числа каждого месяца долг возрастает на \\(r\\%\\) по сравнению с концом предыдущего месяца;\n– со 2-го по 14-е число каждого месяца необходимо выплатить часть долга;\n– 15-го февраля, апреля и июня долг должен быть на одну девятую часть от исходной суммы долга меньше, чем величина долга на 15-е число предыдущего месяца;\n– 15-го марта, мая и июля долг должен быть на две девятых части от исходной суммы долга меньше, чем величина долга на 15-е число предыдущего месяца.\n\nИзвестно, что общая сумма выплат после полного погашения кредита на 220 тыс. рублей больше суммы, взятой в кредит. Найдите \\(r\\).", "taskImage": "", "answerText": "2", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\r\n\\( S = 3000 \\) тыс. руб. — сумма кредита.\r\nСрок кредита: 6 месяцев (февраль – июль).\r\nСтавка: \\( r\\% \\) (\\( a = \\frac{r}{100} \\)).\r\nПримем сумму кредита за \\(9x=3000 \\rightarrow x=\\frac{1000}{3}\\)\r\nУменьшение долга:\r\n— 15 февраля, 15 апреля, 15 июня: долг уменьшается на \\( \\frac{S}{9} = x \\) (одна девятая часть от исходной суммы).\r\n— 15 марта, 15 мая, 15 июля: долг уменьшается на \\( \\frac{2S}{9} =2x\\) (две девятых части от исходной суммы).\r\nПереплата = 220 тыс. руб.\r\n\r\n\u003cstrong>Найти:\u003c/strong> \\( r \\).\r\n\u003ctabl igma = \\text{СУММА КРЕДИТА} + \\text{СУММА ПРОЦЕНТОВ} \\)\n\\( \\Sigma = 9x + 33ax \\)"}, {"d": "5) Переплата", "res": "\u003cB>5) Переплата:\u003c/B>\nПереплата = ПРОЦЕНТЫ = \\(  33ax = 220 \\)\nПодставляем \\( x = \\frac{1000}{3} \\):\n\\( 33a \\cdot \\frac{1000}{3} = 220 \\)\n\\( a = 0.02=\\frac{r}{100} \\rightarrow r=2 \\)"}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> \\( r = 2\\% \\)."}], "lvl": 5}, {"id": 1769673129371, "title": "19 - 125995", "sectionName": "4 - ДИФПЛАТЕЖИ", "difficulty": "hard", "taskText": "15 декабря 2026 года планируется взять кредит в банке на сумму 18 млн рублей на 60 месяцев. Условия его возврата таковы:\n– 1-го числа каждого месяца долг возрастает на r  % по сравнению с концом предыдущего месяца;\n– со 2-го по 14-е число каждого месяца необходимо одним платежом оплатить часть долга;\n– 15-го числа каждого месяца долг должен быть на одну и ту же величину меньше долга на 15-е число предыдущего месяца;\n– к 15 декабря 2031 года кредит должен быть полностью погашен.\nЧему равнo r,   если общая сумма платежей в 2031 году составила 3951 тыс. рублей?", "taskImage": "", "answerText": "1,5", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\r\n\\( S = 18000 \\) тыс. руб. — сумма кредита.\r\n\\( n = 60 \\) месяцев.\r\n\\( r \\) — процентная ставка.\r\n\\( a = \\frac{r}{100} \\).\r\nОбщая сумма платежей в \\(2031\\) году = \\(3951\\) тыс. руб. (это платежи ПОСЛЕДНЕГО ГОДА: 12 МЕСЯЦЕВ с 49-го по 60-й месяц).\r\n\r\n\u003cstrong>Найти:\u003c/strong> \\( r \\).\r\n\u003ctable>\r\n\u003ctr>\u003cth>Месяц\u003c/th>\u003cth>1\u003c/th>\u003cth>2\u003c/th>\u003cth>3\u003c/th>\u003cth>...\u003c/th>\u003cth>49\u003c/th>\u003cth>...\u003c/th>\u003cth>59\u003c/th>\u003cth>60\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>Сумма в счет погашения тела кредита (тыс. руб.)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>...\u003c/td>\u003ctd>\\( x \\)\u003c/td>\u003ctd>
