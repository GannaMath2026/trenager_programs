>\u003ctd>\\( ((B \\cdot \\frac{6}{5} - x) \\cdot \\frac{6}{5} - x) \\cdot \\frac{6}{5} - x \\)\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\\( (((B \\cdot \\frac{6}{5} - x) \\cdot \\frac{6}{5} - x) \\cdot \\frac{6}{5} - x) \\cdot \\frac{6}{5} - x = 0 \\)\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\u003cB>УРАВНЕНИЕ для 4-х платежей\u003c/B> после раскрытия сткобок:\r\n\\( B \\cdot (\\frac{6}{5})^4 - x \\cdot (\\frac{6}{5})^3 - x \\cdot (\\frac{6}{5})^2 - x \\cdot \\frac{6}{5} - x = 0 \\)\r\nДомножаем на \\( 625 \\):\r\n\\( B \\cdot 1296 - x \\cdot 216 \\cdot 5 - x \\cdot 36 \\cdot 25 - x \\cdot 6 \\cdot 125 - x \\cdot 625 = 0 \\)\r\n\\( 1296B - 3355x = 0 \\)\r\nПодставляем \\( B = 1342000 \\):\r\n\\( x = 518400 \\)\r\n\r\n\u003cB>УРАВНЕНИЕ для 2-х платежей\u003c/B> после раскрытия сткобок:\r\n\\( B \\cdot (\\frac{6}{5})^2 - y \\cdot \\frac{6}{5} - y = 0 \\)\r\n\u003cstrong>Домножаем на \\( 25 \\):\u003c/strong>\r\n\\( B \\cdot 36 - y \\cdot 6 \\cdot 5 - y \\cdot 25 = 0 \\)\r\n\\( 36B - 55y = 0 \\)\r\nПодставляем \\( B = 1342000 \\):\r\n\\( y = 878400 \\)\r\n\r\nТогда: \\( 4x - 2y = 4 \\cdot 518400 - 2 \\cdot 878400 = 316800 \\)\r\n\r\n\u003cstrong>Ответ:\u003c/strong> на \u003cstrong>316800 рублей\u003c/strong> больше.\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "https://3.shkolkovo.online/catalog/7818/1283", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( B = 1342000 \\) руб. — сумма кредита.\n\\( r = 20\\% \\)\n\\( a = 1 + \\frac{20}{100} = \\frac{6}{5} \\)\nКредит погашается равными платежами.\n\n\u003cstrong>Случай 1:\u003c/strong> 4 года, ежегодный платеж \\( x \\) руб.\n\n\u003cstrong>Случай 2:\u003c/strong> 2 года, ежегодный платеж \\( y \\) руб.\n\u003cstrong>Найти:\u003c/strong> \\( 4x - 2y \\) (на сколько рублей больше придется отдать в случае 4-х платежей)."}, {"d": "Составляем таблицу платежей", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа (руб.) для 4 лет\u003c/th>\u003cth>\u003c/th>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа (руб.) для 2 лет\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( B \\cdot \\frac{6}{5} - x \\)\u003c/td>\u003ctd>\u003c/td>\u003ctd>1\u003c/td>\u003ctd>\\( B \\cdot \\frac{6}{5} - y \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (B \\cdot \\frac{6}{5} - x) \\cdot \\frac{6}{5} - x \\)\u003c/td>\u003ctd>\u003c/td>\u003ctd>2\u003c/td>\u003ctd>\\( (B \\cdot \\frac{6}{5} - y) \\cdot \\frac{6}{5} - y = 0 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( ((B \\cdot \\frac{6}{5} - x) \\cdot \\frac{6}{5} - x) \\cdot \\frac{6}{5} - x \\)\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\\( (((B \\cdot \\frac{6}{5} - x) \\cdot \\frac{6}{5} - x) \\cdot \\frac{6}{5} - x) \\cdot \\frac{6}{5} - x = 0 \\)\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "УРАВНЕНИЕ для 4-х платежей после раскрытия сткобок", "res": "\u003cB>УРАВНЕНИЕ для 4-х платежей\u003c/B> после раскрытия сткобок:\n\\( B \\cdot (\\frac{6}{5})^4 - x \\cdot (\\frac{6}{5})^3 - x \\cdot (\\frac{6}{5})^2 - x \\cdot \\frac{6}{5} - x = 0 \\)\nДомножаем на \\( 625 \\):\n\\( B \\cdot 1296 - x \\cdot 216 \\cdot 5 - x \\cdot 36 \\cdot 25 - x \\cdot 6 \\cdot 125 - x \\cdot 625 = 0 \\)"}, {"d": "Подставляем известные значения", "res": "\\( 1296B - 3355x = 0 \\)\nПодставляем \\( B = 1342000 \\):\n\\( x = 518400 \\)"}, {"d": "УРАВНЕНИЕ для 2-х платежей после раскрытия сткобок", "res": "\u003cB>УРАВНЕНИЕ для 2-х платежей\u003c/B> после раскрытия сткобок:\n\\( B \\cdot (\\frac{6}{5})^2 - y \\cdot \\frac{6}{5} - y = 0 \\)"}, {"d": "Домножаем на \\( 25 \\)", "res": "\u003cstrong>Домножаем на \\( 25 \\):\u003c/strong>\n\\( B \\cdot 36 - y \\cdot 6 \\cdot 5 - y \\cdot 25 = 0 \\)\n\\( 36B - 55y = 0 \\)\nПодставляем \\( B = 1342000 \\):\n\\( y = 878400 \\)"}, {"d": "Тогда", "res": "Тогда: \\( 4x - 2y = 4 \\cdot 518400 - 2 \\cdot 878400 = 316800 \\)"}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> на \u003cstrong>316800 рублей\u003c/strong> больше."}], "lvl": 3}, {"id": 1772954116969, "title": "36 - 100642", "sectionName": "2 - АННУИТЕТ", "difficulty": "medium", "taskText": "В июне 2025 года бизнесмен Олег Вадимович планирует взять кредит в банке на 4 года. \nУсловия его возврата таковы:\n— в январе каждого года действия кредита долг увеличивается на 20% от суммы долга на конец предыдущего года;\n— в период с февраля по июнь каждого из 2026, 2027 и 2028 годов необходимо выплатить часть долга, \nпричём каждый из платежей 2027 и 2028 годов в 1,6 раза больше платежа предыдущего года;\n— в период с февраля по июнь 2029 года выплачивается оставшаяся сумма по кредиту, равная 1770240 рублям. \nНайдите сумму кредита, если общие выплаты по нему составили 8994240 рублей.", "taskImage": "", "answerText": "5650000", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\r\n\\( S \\) — сумма кредита (тыс. руб.).\r\n\\( r = 20\\% \\)\r\n\\( a = 1 + \\frac{20}{100} = 1 + \\frac{1}{5} = \\frac{6}{5} \\)\r\n\\( N = 4 \\) года\r\nПлатежи: \r\n2026 год — \\( x \\) тыс. руб.\r\n2027 год — \\( 1.6x \\) тыс. руб.\r\n2028 год — \\( 1.6 ^2 \\cdot x = 2.56x \\) тыс. руб.\r\n2029 год — \\( 1770.24 \\) тыс. руб.\r\n\\( \\rightarrow \\)  Общие выплаты: \r\n\\( x + 1.6x + 2.56x + 1770.24 = 8994.24 \\)\r\n\r\n\u003cstrong>Найти:\u003c/strong> \\( S \\).\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа (тыс. руб.)\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>2026\u003c/td>\u003ctd>\\( S \\cdot \\frac{6}{5} - x \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>2027\u003c/td>\u003ctd>\\( (S \\cdot \\frac{6}{5} - x) \\cdot \\frac{6}{5} - 1.6x \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>2028\u003c/td>\u003ctd>\\( ((S \\cdot \\frac{6}{5} - x) \\cdot \\frac{6}{5} - 1.6x) \\cdot \\frac{6}{5} - 2.56x \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>2029\u003c/td>\u003ctd>\\( (((S \\cdot \\frac{6}{5} - x) \\cdot \\frac{6}{5} - 1.6x) \\cdot \\frac{6}{5} - 2.56x) \\cdot \\frac{6}{5} - 1770.24 = 0 \\)\r\nИТОГОВОЕ УРАВНЕНИЕ \u003c/td>\u003c/tr>\r\n\u003c/table>\r\nПосле раскрытия скобок:\r\n\\( S \\cdot (\\frac{6}{5})^4 - x \\cdot (\\frac{6}{5})^3 - 1.6x \\cdot (\\frac{6}{5})^2 - 2.56x \\cdot \\frac{6}{5} - 1770.24 = 0 \\)\r\n\\( S \\cdot \\frac{1296}{625} - x \\cdot \\frac{216}{125} - 1.6x \\cdot \\frac{36}{25} - 2.56x \\cdot \\frac{6}{5} - 1770.24 = 0 \\)\r\n\r\n\u003cstrong>Домножаем на общий знаменатель \\( 625 \\):\u003c/strong>\r\n\\( 1296S - x \\cdot 216 \\cdot 5 - 1.6x \\cdot 36 \\cdot 25 - 2.56x \\cdot 6 \\cdot 125 - 1770.24 \\cdot 625 = 0 \\)\r\n\\( 1296S - 4440x - 1106400 = 0 \\)  \\((*)\\)\r\n\r\nИз условия:\r\nОБЩАЯ СУММА ВЫПЛАТ =  \\(8994.24 \\)\r\n\\( x + 1.6x + 2.56x + 1770.24 = 8994.24 \\)\r\n\\( x =  1400 \\)\r\n\r\nПодставляем \\( x = 1400 \\) в \\((*)\\):\r\n\\( 1296S - 4440 \\cdot 1400 - 1106400 = 0 \\)\r\n\\( S =5650 \\)\r\n\r\n\u003cstrong>Ответ:\u003c/strong> сумма кредита составляет \u003cstrong>5 650 000 рублей\u003c/strong>.\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "https://3.shkolkovo.online/catalog/4162/100642", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S \\) — сумма кредита (тыс. руб.).\n\\( r = 20\\% \\)\n\\( a = 1 + \\frac{20}{100} = 1 + \\frac{1}{5} = \\frac{6}{5} \\)\n\\( N = 4 \\) года\n\nПлатежи: \n2026 год — \\( x \\) тыс. руб.\n2027 год — \\( 1.6x \\) тыс. руб.\n2028 год — \\( 1.6 ^2 \\cdot x = 2.56x \\) тыс. руб.\n\n2029 год — \\( 1770.24 \\) тыс. руб.\n\\( \\rightarrow \\)  Общие выплаты: \n\\( x + 1.6x + 2.56x + 1770.24 = 8994.24 \\)\n\u003cstrong>Найти:\u003c/strong> \\( S \\)."}, {"d": "Составляем таблицу платежей", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа (тыс. руб.)\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>2026\u003c/td>\u003ctd>\\( S \\cdot \\frac{6}{5} - x \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2027\u003c/td>\u003ctd>\\( (S \\cdot \\frac{6}{5} - x) \\cdot \\frac{6}{5} - 1.6x \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2028\u003c/td>\u003ctd>\\( ((S \\cdot \\frac{6}{5} - x) \\cdot \\frac{6}{5} - 1.6x) \\cdot \\frac{6}{5} - 2.56x \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2029\u003c/td>\u003ctd>\\( (((S \\cdot \\frac{6}{5} - x) \\cdot \\frac{6}{5} - 1.6x) \\cdot \\frac{6}{5} - 2.56x) \\cdot \\frac{6}{5} - 1770.24 = 0 \\)\nИТОГОВОЕ УРАВНЕНИЕ \u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "После раскрытия скобок", "res": "После раскрытия скобок:\n\\( S \\cdot (\\frac{6}{5})^4 - x \\cdot (\\frac{6}{5})^3 - 1.6x \\cdot (\\frac{6}{5})^2 - 2.56x \\cdot \\frac{6}{5} - 1770.24 = 0 \\)\n\\( S \\cdot \\frac{1296}{625} - x \\cdot \\frac{216}{125} - 1.6x \\cdot \\frac{36}{25} - 2.56x \\cdot \\frac{6}{5} - 1770.24 = 0 \\)"}, {"d": "Домножаем на общий знаменатель \\( 625 \\)", "res": "\u003cstrong>Домножаем на общий знаменатель \\( 625 \\):\u003c/strong>\n\\( 1296S - x \\cdot 216 \\cdot 5 - 1.6x \\cdot 36 \\cdot 25 - 2.56x \\cdot 6 \\cdot 125 - 1770.24 \\cdot 625 = 0 \\)\n\\( 1296S - 4440x - 1106400 = 0 \\)  \\((*)\\)"}, {"d": "Из условия", "res": "Из условия:\nОБЩАЯ СУММА ВЫПЛАТ =  \\(8994.24 \\)\n\\( x + 1.6x + 2.56x + 1770.24 = 8994.24 \\)\n\\( x =  1400 \\)"}, {"d": "Подставляем известные значения", "res": "Подставляем \\( x = 1400 \\) в \\((*)\\):\n\\( 1296S - 4440 \\cdot 1400 - 1106400 = 0 \\)\n\\( S =5650 \\)"}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> сумма кредита составляет \u003cstrong>5 650 000 рублей\u003c/strong>."}], "lvl": 3}, {"id": 1791322508888, "title": "049  аналог", "sectionName": "2 - АННУИТЕТ", "difficulty": "medium", "taskText": "\u003ca href=\"https://3.shkolkovo.online/catalog/172/2051\" target=\"_blank\">🔍 Аналог: Задача 2051\u003c/a>\nВ банке в честь Дня труда действует следующее предложение по выдаче кредита:\n— кредит выдается сроком на 5 лет под \\(10\\%\\) годовых;\n— в первый, третий и пятый годы после начисления процентов на текущую сумму долга клиент обязан внести некоторый платеж, одинаковый во все эти три года;\n— во второй и четвертый годы после начисления процентов на текущую сумму долга клиент выплачивает только проценты по кредиту.\n\nКакое максимальное целое число тысяч рублей в кредит может позволить себе взять трудоголик Лера, если она знает, что переплата по кредиту не должна превысить \\(100\\) тысяч рублей?", "taskImage": "", "answerText": "319 тыс. рублей.", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\n\\( S \\) тыс. руб., срок 5 лет, \\( r = 10\\% \\), \\( a = \\frac{11}{10} \\).\nГоды 1, 3, 5: одинаковый платёж \\( X \\).\nГоды 2, 4: платятся только проценты (долг не меняется).\nПереплата \\( \\le 100 \\) тыс. руб.\n\u003cstrong>Найти:\u003c/strong> наибольшее целое \\( S \\).\n\n\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Платёж\u003c/th>\u003cth>Долг после платежа\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( X \\)\u003c/td>\u003ctd>\\( D_1 = S \\cdot \\frac{11}{10} - X \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( 0{,}1D_1 \\)\u003c/td>\u003ctd>\\( D_1 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( X \\)\u003c/td>\u003ctd>\\( D_2 = D_1 \\cdot \\frac{11}{10} - X \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\\( 0{,}1D_2 \\)\u003c/td>\u003ctd>\\( D_2 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>5\u003c/td>\u003ctd>\\( X \\)\u003c/td>\u003ctd>\\( D_2 \\cdot \\frac{11}{10} - X = 0 \\)\u003c/td>\u003c/tr>\n\u003c/table>\n\n\\( ((S \\cdot \\frac{11}{10} - X) \\cdot \\frac{11}{10} - X) \\cdot \\frac{11}{10} - X = 0 \\)\nДомножаем на 1000:\n\\( 1331S - 1210X - 1100X - 1000X = 0 \\)\n\\( X = \\frac{1331}{3310}S \\)\n\n\\( D_1 = \\frac{11}{10}S - \\frac{1331}{3310}S = \\frac{3641 - 1331}{3310}S = \\frac{231}{331}S \\)\n\\( D_2 = \\frac{11}{10} \\cdot \\frac{231}{331}S - \\frac{1331}{3310}S = \\frac{2541 - 1331}{3310}S = \\frac{121}{331}S \\)\n\n\\( \\Sigma = 3X + 0{,}1D_1 + 0{,}1D_2 = \\frac{3993}{3310}S + \\frac{231 + 121}{3310}S = \\frac{4345}{3310}S \\)\nПереплата: \\( \\frac{4345}{3310}S - S = \\frac{1035}{3310}S = \\frac{207}{662}S \\)\n\n\\( \\frac{207}{662}S \\le 100 \\)\n\\( S \\le \\frac{66200}{207} = 319\\frac{167}{207} \\)\nНаибольшее целое \\( S = 319 \\).\n\n\u003cstrong>Ответ:\u003c/strong> 319 тыс. рублей.", "solutionImage": "", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S \\) тыс. руб., срок 5 лет, \\( r = 10\\% \\), \\( a = \\frac{11}{10} \\).\nГоды 1, 3, 5: одинаковый платёж \\( X \\).\nГоды 2, 4: платятся только проценты (долг не меняется).\nПереплата \\( \\le 100 \\) тыс. руб.\n\u003cstrong>Найти:\u003c/strong> наибольшее целое \\( S \\)."}, {"d": "Составляем таблицу долга", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Платёж\u003c/th>\u003cth>Долг после платежа\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( X \\)\u003c/td>\u003ctd>\\( D_1 = S \\cdot \\frac{11}{10} - X \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( 0{,}1D_1 \\)\u003c/td>\u003ctd>\\( D_1 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( X \\)\u003c/td>\u003ctd>\\( D_2 = D_1 \\cdot \\frac{11}{10} - X \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\\( 0{,}1D_2 \\)\u003c/td>\u003ctd>\\( D_2 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>5\u003c/td>\u003ctd>\\( X \\)\u003c/td>\u003ctd>\\( D_2 \\cdot \\frac{11}{10} - X = 0 \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Записываем итоговое уравнение и избавляемся от знаменателей", "res": "\\( ((S \\cdot \\frac{11}{10} - X) \\cdot \\frac{11}{10} - X) \\cdot \\frac{11}{10} - X = 0 \\)\nДомножаем на 1000:\n\\( 1331S - 1210X - 1100X - 1000X = 0 \\)\n\\( X = \\frac{1331}{3310}S \\)"}, {"d": "Находим долги D₁ и D₂", "res": "\\( D_1 = \\frac{11}{10}S - \\frac{1331}{3310}S = \\frac{3641 - 1331}{3310}S = \\frac{231}{331}S \\)\n\\( D_2 = \\frac{11}{10} \\cdot \\frac{231}{331}S - \\frac{1331}{3310}S = \\frac{2541 - 1331}{3310}S = \\frac{121}{331}S \\)"}, {"d": "Записываем переплату", "res": "\\( \\Sigma = 3X + 0{,}1D_1 + 0{,}1D_2 = \\frac{3993}{3310}S + \\frac{231 + 121}{3310}S = \\frac{4345}{3310}S \\)\nПереплата: \\( \\frac{4345}{3310}S - S = \\frac{1035}{3310}S = \\frac{207}{662}S \\)"}, {"d": "Составляем неравенство", "res": "\\( \\frac{207}{662}S \\le 100 \\)\n\\( S \\le \\frac{66200}{207} = 319\\frac{167}{207} \\)\nНаибольшее целое \\( S = 319 \\)."}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> 319 тыс. рублей."}], "byClaude": true, "lvl": 3}, {"id": 1784019327259, "title": "39 - 1239 ПЕРЕПЛАТА", "sectionName": "2 - АННУИТЕТ", "difficulty": "medium", "taskText": "В банке был взят кредит на некоторую сумму денег на 3 года. Кредит необходимо выплачивать равными платежами раз в год, причем известно, что каждый год перед выплатой текущая сумма долга увеличивается на четверть.  \nНайдите, сколько процентов от тела кредита составит переплата по такому кредиту. В случае необходимости ответ округлите до целого числа.", "taskImage": "", "answerText": "54", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\r\n\\( S \\) руб. — сумма кредита.\r\n\\( r = 25\\% \\)\r\n\\( a = 1 + \\frac{25}{100} = \\frac{5}{4} \\)\r\nКредит погашается равными платежами.\r\n\u003cstrong>Случай:\u003c/strong> 3 года, ежегодный платеж \\( x \\) руб.\r\n\u003cstrong>Найти:\u003c/strong> переплату в процентах от тела кредита.\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа (руб.)\u003c/th>\u003cth>\u003c/th>\u003cth>\u003c/th>\u003cth>\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot \\frac{5}{4} - x \\)\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (S \\cdot \\frac{5}{4} - x) \\cdot \\frac{5}{4} - x \\)\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( ((S \\cdot \\frac{5}{4} - x) \\cdot \\frac{5}{4} - x) \\cdot \\frac{5}{4} - x = 0 \\)\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\u003cB>УРАВНЕНИЕ для 3-х платежей\u003c/B> после раскрытия скобок:\r\n\\( S \\cdot (\\frac{5}{4})^3 - x \\cdot (\\frac{5}{4})^2 - x \\cdot \\frac{5}{4} - x = 0 \\)\r\nДомножаем на \\( 64 \\):\r\n\\( S \\cdot 125 - x \\cdot 25 \\cdot 4 - x \\cdot 5 \\cdot 16 - x \\cdot 64 = 0 \\)\r\n\\( 125S - 244x = 0 \\)\r\n\\( x = \\frac{125}{244}S \\)\r\n\r\n\u003cB>ОБЩАЯ СУММА ВЫПЛАТ:\u003c/B>\r\n\u003cb>ОСВ = \u003c/b>\\( 3x = \\frac{375}{244}S \\)\r\n\r\n\u003cb>ПЕРЕПЛАТА = СУММА ПЛАТЕЖЕЙ – СУММА КРЕДИТА\u003c/b>\r\nПЕРЕПЛАТА = \\( 3x - S = \\frac{375}{244}S  - S = \\frac{131}{244}S \\)\r\n\r\nПереплата в процентах от тела кредита:\r\n\\( \\frac{131}{244} \\cdot 100\\% =53 \\frac{168}{244}\\)\r\nОкругляем до целого: \\( \\approx 54\\% \\)\r\n\r\n\u003cstrong>Ответ:\u003c/strong> переплата составит \u003cstrong>54%\u003c/strong> от тела кредита.\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "https://3.shkolkovo.online/catalog/174/1239", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S \\) руб. — сумма кредита.\n\\( r = 25\\% \\)\n\\( a = 1 + \\frac{25}{100} = \\frac{5}{4} \\)\nКредит погашается равными платежами."}, {"d": "Случай: 3 года, ежегодный платеж \\( x \\) руб — составляем таблицу платежей", "res": "\u003cstrong>Случай:\u003c/strong> 3 года, ежегодный платеж \\( x \\) руб.\n\u003cstrong>Найти:\u003c/strong> переплату в процентах от тела кредита.\n\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа (руб.)\u003c/th>\u003cth>\u003c/th>\u003cth>\u003c/th>\u003cth>\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot \\frac{5}{4} - x \\)\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (S \\cdot \\frac{5}{4} - x) \\cdot \\frac{5}{4} - x \\)\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( ((S \\cdot \\frac{5}{4} - x) \\cdot \\frac{5}{4} - x) \\cdot \\frac{5}{4} - x = 0 \\)\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "УРАВНЕНИЕ для 3-х платежей после раскрытия скобок", "res": "\u003cB>УРАВНЕНИЕ для 3-х платежей\u003c/B> после раскрытия скобок:\n\\( S \\cdot (\\frac{5}{4})^3 - x \\cdot (\\frac{5}{4})^2 - x \\cdot \\frac{5}{4} - x = 0 \\)\nДомножаем на \\( 64 \\):\n\\( S \\cdot 125 - x \\cdot 25 \\cdot 4 - x \\cdot 5 \\cdot 16 - x \\cdot 64 = 0 \\)\n\\( 125S - 244x = 0 \\)\n\\( x = \\frac{125}{244}S \\)"}, {"d": "ОБЩАЯ СУММА ВЫПЛАТ", "res": "\u003cB>ОБЩАЯ СУММА ВЫПЛАТ:\u003c/B>\n\u003cb>ОСВ = \u003c/b>\\( 3x = \\frac{375}{244}S \\)"}, {"d": "ПЕРЕПЛАТА = СУММА ПЛАТЕЖЕЙ – СУММА КРЕДИТА", "res": "\u003cb>ПЕРЕПЛАТА = СУММА ПЛАТЕЖЕЙ – СУММА КРЕДИТА\u003c/b>\nПЕРЕПЛАТА = \\( 3x - S = \\frac{375}{244}S  - S = \\frac{131}{244}S \\)"}, {"d": "Переплата в процентах от тела кредита", "res": "Переплата в процентах от тела кредита:\n\\( \\frac{131}{244} \\cdot 100\\% =53 \\frac{168}{244}\\)\nОкругляем до целого: \\( \\approx 54\\% \\)"}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> переплата составит \u003cstrong>54%\u003c/strong> от тела кредита."}], "lvl": 3}, {"id": 1783993669983, "title": "45 - 2173", "sectionName": "2 - АННУИТЕТ", "difficulty": "hard", "taskText": "Планируется выдать льготный кредит на целое число миллионов рублей на четыре года.\nВ середине каждого года действия кредита долг заемщика возрастает на \\(10\\%\\) по сравнению с началом года.\nПо договоренности с банком в конце первого и третьего годов заемщик выплачивает только проценты по кредиту, начисленные за соответствующий текущий год.\nВ конце второго и четвертого годов заемщик выплачивает одинаковые суммы, погашая к концу четвертого года весь долг полностью.\nНайдите наименьший размер кредита в млн рублей, при котором общая сумма выплат заемщика превысит \\(100\\) млн рублей.", "taskImage": "", "answerText": "77 млн рублей.", "answerImage": "", "solutionText": "Пусть \\( S \\) — сумма кредита (млн руб.), \\( X \\) — выплата в конце 2-го и 4-го годов.\n\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot 1.1 - 0.1S = S \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( S \\cdot 1.1 - X \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( (S \\cdot 1.1 - X) \\cdot 1.1 - 0.1(S \\cdot 1.1 - X) = S \\cdot 1.1 - X \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\\( (S \\cdot 1.1 - X) \\cdot 1.1 - X = 0 \\)\u003c/td>\u003c/tr>\n\u003c/table>\n\\( S \\cdot 1.21 - 1,1X - x = 0 \\)\nУмножаем на 100\n\\( 1,21S=210X \\)\n\\( X = \\frac{121}{210}S \\)\n\nОбщая сумма выплат:\n\\( \\Sigma = 0.1S + X + 0.1(S \\cdot 1.1 - X) + X =0.21S + 1.9X \\)\n\nПодставляем \\( X = \\frac{121}{210}S \\):\n\\( \\Sigma = \\frac{137}{105}S \\)\nПо условию: \\( \\Sigma > 100 \\)\n\\( \\frac{137}{105}S > 100 \\)\n\\( S > \\frac{10500}{137} =76 \\frac{88}{137}\\)\nТак как \\( S \\) — целое число миллионов рублей, наименьшее \\( S = 77 \\).\n\n\u003cstrong>Ответ:\u003c/strong> 77 млн рублей.", "solutionImage": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAUAAAAPCAYAAAAs9AWDAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAAAtSURBVChTY/z1+89/BjSAIvjq3VeGf///MzBB+SiA8T8QQNlwgFXlcBNkYAAAhtERwcoyGvMAAAAASUVORK5CYII=", "drawingImage": "", "solutionLink": "https://3.shkolkovo.online/catalog/172/2173", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Обозначаем неизвестные и записываем условие", "res": "Пусть \\( S \\) — сумма кредита (млн руб.), \\( X \\) — выплата в конце 2-го и 4-го годов."}, {"d": "Составляем таблицу платежей", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot 1.1 - 0.1S = S \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( S \\cdot 1.1 - X \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( (S \\cdot 1.1 - X) \\cdot 1.1 - 0.1(S \\cdot 1.1 - X) = S \\cdot 1.1 - X \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\\( (S \\cdot 1.1 - X) \\cdot 1.1 - X = 0 \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Находим \\(X\\)", "res": "\\( S \\cdot 1.21 - 1,1X - x = 0 \\)\nУмножаем на 100\n\\( 1,21S=210X \\)\n\\( X = \\frac{121}{210}S \\)"}, {"d": "Общая сумма выплат", "res": "Общая сумма выплат:\n\\( \\Sigma = 0.1S + X + 0.1(S \\cdot 1.1 - X) + X =0.21S + 1.9X \\)"}, {"d": "Подставляем известные значения", "res": "Подставляем \\( X = \\frac{121}{210}S \\):\n\\( \\Sigma = \\frac{137}{105}S \\)\nПо условию: \\( \\Sigma > 100 \\)\n\\( \\frac{137}{105}S > 100 \\)\n\\( S > \\frac{10500}{137} =76 \\frac{88}{137}\\)\nТак как \\( S \\) — целое число миллионов рублей, наименьшее \\( S = 77 \\)."}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> 77 млн рублей."}], "lvl": 4}, {"id": 1778991620355, "title": "41 - 158174 авторская школково", "sectionName": "2 - АННУИТЕТ", "difficulty": "hard", "taskText": "В июле 2026 года планируется взять кредит в банке на некоторую сумму. Условия его возврата таковы:\n– каждый январь долг увеличивается на \\(25\\%\\) по сравнению с концом предыдущего года, за исключением января 2028 года, когда проценты не начисляются;\n– с февраля по июнь каждого года необходимо выплатить одним платежом часть долга.\nСколько рублей планируется взять в банке, если известно, что кредит будет полностью погашен четырьмя равными платежами и общая сумма платежей после полного погашения кредита должна быть на 78 000 рублей больше суммы, взятой в кредит?", "taskImage": "", "answerText": "172000  ", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\r\n\\( S \\) — сумма кредита (руб.).\r\n\\( r = 25\\% \\)\r\n\\( a = 1 + \\frac{25}{100} = \\frac{5}{4} \\)\r\nВ январе 2028 года проценты не начисляются.\r\nПлатежи равные: \\( x \\) руб. каждый год.\r\nОбщая сумма платежей \\( 4x \\) на 78 000 руб. больше суммы кредита \\( S \\), т.е. \\( 4x = S + 78000 \\).\r\n\r\n\u003cstrong>Найти:\u003c/strong> \\( S \\).\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа (руб.)\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>2027\u003c/td>\u003ctd>\\( S \\cdot a - x \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>2028\u003c/td>\u003ctd>\\( (S \\cdot a - x) - x \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>2029\u003c/td>\u003ctd>\\( ((S \\cdot a - x) - x) \\cdot a - x \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>2030\u003c/td>\u003ctd>\\( (((S \\cdot a - x) - x) \\cdot a - x) \\cdot a - x = 0 \\)\r\nИТОГОВОЕ УРАВНЕНИЕ\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\u003cb>После раскрытия скобок\u003c/b>:\r\n\\( S \\cdot a^3 - x \\cdot a^2 - x \\cdot a^2 - x \\cdot a - x = 0 \\)\r\n\r\nПодставляем \\( a = \\frac{5}{4} \\):\r\n\\( S \\cdot (\\frac{5}{4})^3 - x \\cdot (\\frac{5}{4})^2 - x \\cdot (\\frac{5}{4})^2 - x \\cdot \\frac{5}{4} - x = 0 \\)\r\n\r\n\u003cstrong>Домножаем на общий знаменатель \\( 64 \\):\u003c/strong>\r\n\\( S \\cdot 125 - x \\cdot 25 \\cdot 4 - x \\cdot 25 \\cdot 4 - x \\cdot 5 \\cdot 16 - x \\cdot 64 = 0 \\)\r\n\\( x = \\frac{125S}{344} \\)\r\n\r\nИз условия \\( 4x = S + 78000 \\):\r\n\\( 4 \\cdot \\frac{125S}{344} = S + 78000 \\)\r\n\u003cstrong>Домножаем на 344:\u003c/strong>\r\n\\( 500S = 344S + 78000 \\cdot 344 \\)\r\n\\( S =  172000 \\)\r\n\r\n\u003cstrong>Ответ:\u003c/strong> планируется взять в кредит \u003cstrong>172 000 рублей\u003c/strong>.\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "https://3.shkolkovo.online/catalog/11066/158174", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S \\) — сумма кредита (руб.).\n\\( r = 25\\% \\)\n\\( a = 1 + \\frac{25}{100} = \\frac{5}{4} \\)\nВ январе 2028 года проценты не начисляются.\nПлатежи равные: \\( x \\) руб. каждый год.\nОбщая сумма платежей \\( 4x \\) на 78 000 руб. больше суммы кредита \\( S \\), т.е. \\( 4x = S + 78000 \\).\n\u003cstrong>Найти:\u003c/strong> \\( S \\)."}, {"d": "Составляем таблицу платежей", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа (руб.)\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>2027\u003c/td>\u003ctd>\\( S \\cdot a - x \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2028\u003c/td>\u003ctd>\\( (S \\cdot a - x) - x \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2029\u003c/td>\u003ctd>\\( ((S \\cdot a - x) - x) \\cdot a - x \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2030\u003c/td>\u003ctd>\\( (((S \\cdot a - x) - x) \\cdot a - x) \\cdot a - x = 0 \\)\nИТОГОВОЕ УРАВНЕНИЕ\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "После раскрытия скобок", "res": "\u003cb>После раскрытия скобок\u003c/b>:\n\\( S \\cdot a^3 - x \\cdot a^2 - x \\cdot a^2 - x \\cdot a - x = 0 \\)"}, {"d": "Подставляем известные значения", "res": "Подставляем \\( a = \\frac{5}{4} \\):\n\\( S \\cdot (\\frac{5}{4})^3 - x \\cdot (\\frac{5}{4})^2 - x \\cdot (\\frac{5}{4})^2 - x \\cdot \\frac{5}{4} - x = 0 \\)"}, {"d": "Домножаем на общий знаменатель \\( 64 \\)", "res": "\u003cstrong>Домножаем на общий знаменатель \\( 64 \\):\u003c/strong>\n\\( S \\cdot 125 - x \\cdot 25 \\cdot 4 - x \\cdot 25 \\cdot 4 - x \\cdot 5 \\cdot 16 - x \\cdot 64 = 0 \\)\n\\( x = \\frac{125S}{344} \\)"}, {"d": "Из условия ", "res": "Из условия \\( 4x = S + 78000 \\):\n\\( 4 \\cdot \\frac{125S}{344} = S + 78000 \\)"}, {"d": "Домножаем на 344", "res": "\u003cstrong>Домножаем на 344:\u003c/strong>\n\\( 500S = 344S + 78000 \\cdot 344 \\)\n\\( S =  172000 \\)"}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> планируется взять в кредит \u003cstrong>172 000 рублей\u003c/strong>."}], "lvl": 4}, {"id": 1784019959802, "title": "44 - 561179", "sectionName": "2 - АННУИТЕТ", "difficulty": "hard", "taskText": "В январе 2020 года Борис взял кредит в банке на сумму 4 200 000 рублей. По договору с банком Борис должен был погасить долг двумя равными платежами в феврале 2021 года и феврале 2022 года, при условии, что в январе 2021 года и январе 2022 года сумма оставшегося долга увеличивается на 10%. В феврале 2021 года Борис сделал первую выплату в соответствии с договором. После этого ему удалось договориться с банком о рефинансировании кредита и уменьшить процент, на который сумма долга вырастет в январе 2022 года, до 7%. Какую сумму сэкономит Борис на рефинансировании своего кредита?", "taskImage": "", "answerText": "66000", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\r\n\\( S = 4.2 \\) млн. руб. — сумма кредита.\r\n\\( r_1 = 10\\% \\), \\( a_1 = 1.1 \\) — ставка до рефинансирования.\r\n\\( r_2 = 7\\% \\), \\( a_2 = 1.07 \\) — ставка после рефинансирования.\r\nКредит погашается двумя равными платежами: \\( x \\) млн. руб. в 2021 и 2022 годах.\r\nВ феврале 2021 года Борис сделал первый платёж \\( x \\), затем ставка изменилась на 7%.\r\n\r\n\u003cstrong>Найти:\u003c/strong> экономию от рефинансирования.\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа (руб.)\u003c/th>\u003cth>\u003c/th>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа (руб.)\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>2021\u003c/td>\u003ctd>\\( S \\cdot 1.1 - x \\)\u003c/td>\u003ctd>\u003c/td>\u003ctd>2021\u003c/td>\u003ctd>\\( S \\cdot 1.1 - x \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>2022\u003c/td>\u003ctd>\\( (S \\cdot 1.1 - x) \\cdot 1.1 - x = 0 \\)\u003c/td>\u003ctd>\u003c/td>\u003ctd>2022\u003c/td>\u003ctd>\\( (S \\cdot 1.1 - x) \\cdot 1.07 - y = 0 \\)\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\u003cB>1) Находим \\( x \\) по первоначальному договору:\u003c/B>\r\n\\( S \\cdot 1.1^2 - x \\cdot 1.1 - x = 0 \\)\r\n\\( x = 2.42 \\)\r\nСумма выплат по первоначальному договору: \\( 2x = 4.84 \\) млн. руб.\r\n\r\n\u003cB>2) Решаем второе уравнение: \\(S \\cdot 1.1 - x) \\cdot 1.07 - y = 0\\)\u003c/b>\r\n\\((4.2 \\cdot 1.1 – 2.42) \\cdot 1.07 - y = 0\\)\r\n\\( y =  2.354 \\) млн. руб.\r\n\r\n\u003cB>4) Экономия:\u003c/B>\r\n\\( x - y = 2.42 - 2.354 = 0.066 \\) млн. руб. = \\( 66000 \\) руб.\r\n\r\n\u003cstrong>Ответ:\u003c/strong> Борис сэкономит \u003cstrong>66000 рублей\u003c/strong>.\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "https://ege.sdamgia.ru/problem?id=561179", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 4.2 \\) млн. руб. — сумма кредита.\n\\( r_1 = 10\\% \\), \\( a_1 = 1.1 \\) — ставка до рефинансирования.\n\\( r_2 = 7\\% \\), \\( a_2 = 1.07 \\) — ставка после рефинансирования.\nКредит погашается двумя равными платежами: \\( x \\) млн. руб. в 2021 и 2022 годах.\nВ феврале 2021 года Борис сделал первый платёж \\( x \\), затем ставка изменилась на 7%."}, {"d": "Записываем, что нужно найти, и составляем таблицу платежей", "res": "\u003cstrong>Найти:\u003c/strong> экономию от рефинансирования.\n\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа (руб.)\u003c/th>\u003cth>\u003c/th>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа (руб.)\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>2021\u003c/td>\u003ctd>\\( S \\cdot 1.1 - x \\)\u003c/td>\u003ctd>\u003c/td>\u003ctd>2021\u003c/td>\u003ctd>\\( S \\cdot 1.1 - x \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2022\u003c/td>\u003ctd>\\( (S \\cdot 1.1 - x) \\cdot 1.1 - x = 0 \\)\u003c/td>\u003ctd>\u003c/td>\u003ctd>2022\u003c/td>\u003ctd>\\( (S \\cdot 1.1 - x) \\cdot 1.07 - y = 0 \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "1) Находим \\( x \\) по первоначальному договору", "res": "\u003cB>1) Находим \\( x \\) по первоначальному договору:\u003c/B>\n\\( S \\cdot 1.1^2 - x \\cdot 1.1 - x = 0 \\)\n\\( x = 2.42 \\)\nСумма выплат по первоначальному договору: \\( 2x = 4.84 \\) млн. руб."}, {"d": "Находим \\(y\\)", "res": "\u003cB>2) Решаем второе уравнение: \\(S \\cdot 1.1 - x) \\cdot 1.07 - y = 0\\)\u003c/b>\n\\((4.2 \\cdot 1.1 – 2.42) \\cdot 1.07 - y = 0\\)\n\\( y =  2.354 \\) млн. руб."}, {"d": "4) Экономия", "res": "\u003cB>4) Экономия:\u003c/B>\n\\( x - y = 2.42 - 2.354 = 0.066 \\) млн. руб. = \\( 66000 \\) руб."}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> Борис сэкономит \u003cstrong>66000 рублей\u003c/strong>."}], "lvl": 4}, {"id": 1784021512497, "title": "43 - 549675 - ПЛАТИМ УМНОЖЕНИЕМ", "sectionName": "2 - АННУИТЕТ", "difficulty": "hard", "taskText": "\u003ca href=\"https://ege.sdamgia.ru/problem?id=549675\" target=\"_blank\">🔍 АНАЛОГ 549675\u003c/a>\nПетр Иванович получил кредит в банке под определенный процент годовых. Ровно через год (после начисления процентов) Петр Иванович в счет погашения кредита вернул \\( \\frac{2}{13} \\) той суммы, которую задолжал к тому моменту. А еще через год он внес сумму, на 43% превышающую величину займа, и тем самым полностью погасил кредит. Каков был процент годовых?", "taskImage": "", "answerText": "30", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\r\n\\( S \\) руб. — сумма кредита.\r\n\\( r = y\\% \\)\r\n\\( a = 1 + \\frac{y}{100} \\)\r\nКредит погашается:\r\n— 1-й год: платёж \\( \\frac{2}{13} \\) от долга после начисления процентов → останется \\( \\frac{11}{13} \\);\r\n— 2-й год: платёж \\( 1.43S \\).\r\n\r\n\u003cstrong>Найти:\u003c/strong> \\( y \\).\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг на конец года\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( (S \\cdot a) \\cdot \\frac{11}{13} \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (S \\cdot a \\cdot \\frac{11}{13} )\\cdot a - 1.43S = 0 \\)\r\nИТОГОВОЕ УРАВНЕНИЕ\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\\( \\frac{11}{13} \\cdot S \\cdot a^2 = 1.43S \\)\r\nДелим на \\( S \\):\r\n\\( a^2 = \\frac{18.59}{11} = 1.69 \\)\r\n\\( a = 1.3 \\)\r\n\\( a = 1.3 = 1 + \\frac{y}{100} \\)\r\n\\( y = 30\\% \\)\r\n\r\n\u003cstrong>Ответ:\u003c/strong> \\( 30\\% \\).\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "https://ege.sdamgia.ru/problem?id=549675", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S \\) руб. — сумма кредита.\n\\( r = y\\% \\)\n\\( a = 1 + \\frac{y}{100} \\)\n\nКредит погашается:\n— 1-й год: платёж \\( \\frac{2}{13} \\) от долга после начисления процентов → останется \\( \\frac{11}{13} \\);\n— 2-й год: платёж \\( 1.43S \\).\n\u003cstrong>Найти:\u003c/strong> \\( y \\)."}, {"d": "Составляем таблицу долга по годам", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг на конец года\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( (S \\cdot a) \\cdot \\frac{11}{13} \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (S \\cdot a \\cdot \\frac{11}{13} )\\cdot a - 1.43S = 0 \\)\nИТОГОВОЕ УРАВНЕНИЕ\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Находим \\(y\\)", "res": "\\( \\frac{11}{13} \\cdot S \\cdot a^2 = 1.43S \\)\nДелим на \\( S \\):\n\\( a^2 = \\frac{18.59}{11} = 1.69 \\)\n\\( a = 1.3 \\)\n\\( a = 1.3 = 1 + \\frac{y}{100} \\)\n\\( y = 30\\% \\)"}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> \\( 30\\% \\)."}], "lvl": 4}, {"id": 1784021319037, "title": "42 - 75434", "sectionName": "2 - АННУИТЕТ", "difficulty": "hard", "taskText": "Виктор взял кредит на 100000 рублей. Условия кредита таковы:\n— каждый год сумма долга увеличивается на целое число \\( x \\) процентов;\n— после начисления процентов Виктор вносит платёж в 10 тысяч рублей.\nОпределите, при какой наименьшей процентной ставке \\( x \\) сумма долга через два года кредитования превысит сумму кредита, увеличенную на \\( x \\) процентов", "taskImage": "", "answerText": "19", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\r\n\\( S = 100000 \\) руб. — сумма кредита.\r\n\\( r = x\\% \\)\r\n\\( a = 1 + \\frac{x}{100} \\)\r\nЕжегодный платёж: \\( 10000 \\) руб.\r\nЧерез 2 года   (сумму кредита, увеличенную на \\( x\\% \\)).\r\n\r\n\u003cstrong>Найти:\u003c/strong> наименьшее целое \\( x \\).\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа (руб.)\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot a - 10000 \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (S \\cdot a - 10000) \\cdot a - 10000 \\)\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\u003cB>Неравенство:  долг должен превысить \\( S \\cdot a \\)\u003c/B>\r\n\\( S \\cdot a^2 - 10000 \\cdot a - 10000 > S \\cdot a \\)\r\n\r\nПодставляем \\( S = 100000 \\):\r\n\\( 100000 \\cdot a^2 - 10000 \\cdot a - 10000 > 100000 \\cdot a \\)\r\n\\( 10a^2 - 11a - 1 > 0 \\) – парабола вертвями вверх (>0 за пределами корней)\r\n\\( a = \\frac{11 \\pm \\sqrt{161}}{20} \\)\r\nПоложительный корень:\r\n\\( a=\\frac{11 + \\sqrt{161}}{20} \\)\r\nЗначит:\r\n\\( a>\\frac{11 + \\sqrt{161}}{20} \\)\r\n\\(\\frac{11 + \\sqrt{161}}{20}>\\frac{11 + \\sqrt{158.76}}{20}=\\frac{11 + \\sqrt{12.6}}{20}=\\frac{23.6}{20}=1.18\\)\r\n\\( a=1 + \\frac{x}{100} > 1.18 \\)\r\n\\( \\frac{x}{100} > 0.18 \\)\r\n\\( x > 18 \\)\r\nНаименьшее целое \\( x = 19 \\).\r\n\r\n\u003cstrong>Ответ:\u003c/strong> \\( 19\\% \\).\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 100000 \\) руб. — сумма кредита.\n\\( r = x\\% \\)\n\\( a = 1 + \\frac{x}{100} \\)\nЕжегодный платёж: \\( 10000 \\) руб.\nЧерез 2 года   (сумму кредита, увеличенную на \\( x\\% \\)).\n\u003cstrong>Найти:\u003c/strong> наименьшее целое \\( x \\)."}, {"d": "Составляем таблицу платежей", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа (руб.)\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot a - 10000 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (S \\cdot a - 10000) \\cdot a - 10000 \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Неравенство:  долг должен превысить \\( S \\cdot a \\)", "res": "\u003cB>Неравенство:  долг должен превысить \\( S \\cdot a \\)\u003c/B>\n\\( S \\cdot a^2 - 10000 \\cdot a - 10000 > S \\cdot a \\)"}, {"d": "Подставляем известные значения", "res": "Подставляем \\( S = 100000 \\):\n\\( 100000 \\cdot a^2 - 10000 \\cdot a - 10000 > 100000 \\cdot a \\)\n\\( 10a^2 - 11a - 1 > 0 \\) – парабола вертвями вверх (>0 за пределами корней)\n\\( a = \\frac{11 \\pm \\sqrt{161}}{20} \\)"}, {"d": "Положительный корень", "res": "Положительный корень:\n\\( a=\\frac{11 + \\sqrt{161}}{20} \\)"}, {"d": "Значит", "res": "Значит:\n\\( a>\\frac{11 + \\sqrt{161}}{20} \\)\n\\(\\frac{11 + \\sqrt{161}}{20}>\\frac{11 + \\sqrt{158.76}}{20}=\\frac{11 + \\sqrt{12.6}}{20}=\\frac{23.6}{20}=1.18\\)\n\\( a=1 + \\frac{x}{100} > 1.18 \\)"}, {"d": "Находим \\(x\\)", "res": "\\( \\frac{x}{100} > 0.18 \\)\n\\( x > 18 \\)\nНаименьшее целое \\( x = 19 \\)."}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> \\( 19\\% \\)."}], "lvl": 4}, {"id": 1784020560405, "title": "371 - 511283 -  НЕПРИЯТНЫЙ СЧЕТ", "sectionName": "2 - АННУИТЕТ", "difficulty": "hard", "taskText": "\u003ca href=\"https://ege.sdamgia.ru/problem?id=511283\" target=\"_blank\">🔍 511283\u003c/a>\nВ июле планируется взять кредит в банке на некоторую сумму. Условия его возврата таковы:\n— каждый январь долг возрастает на 31% по сравнению с концом предыдущего года;\n— с февраля по июнь каждого года необходимо выплатить часть долга, равную 69690821 рубль.\nСколько рублей было взято в банке, если известно, что он был полностью погашен тремя равными платежами (то есть за три года)?", "taskImage": "", "answerText": "124 809 100 рублей.", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\r\n\\( S \\) руб. — сумма кредита.\r\n\\( r = 31\\% \\)\r\n\\( a = 1 + \\frac{31}{100} = \\frac{131}{100} \\)\r\nКредит погашается 3 равными платежами по \\( x = 69690821 \\) руб.\r\n\r\n\u003cstrong>Найти:\u003c/strong> \\( S \\).\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа (руб.)\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot \\frac{131}{100} - x \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( \\left( S \\cdot \\frac{131}{100} - x \\right) \\cdot \\frac{131}{100} - x \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( \\left( \\left( S \\cdot \\frac{131}{100} - x \\right) \\cdot \\frac{131}{100} - x \\right) \\cdot \\frac{131}{100} - x = 0 \\)\r\nИТОГОВОЕ УРАВНЕНИЕ\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\u003cB>После раскрытия скобок\u003c/B> \r\n\\( S \\cdot \\left( \\frac{131}{100} \\right)^3 - x \\cdot \\left( \\frac{131}{100} \\right)^2 - x \\cdot \\frac{131}{100} - x = 0 \\)\r\n\r\n\\( S \\cdot \\frac{131^3}{100^3} = x \\cdot \\left( \\frac{131^2}{100^2} + \\frac{131}{100} + 1 \\right) \\)\r\n\r\nДомножаем на \\( 100^3 \\):\r\n\\( S \\cdot 131^3 = x \\cdot \\left( 131^2 \\cdot 100 + 131 \\cdot 100^2 + 100^3 \\right) \\)\r\n\r\nПодставляем \\( x = 69690821 \\):\r\n\\( S = \\frac{69690821 \\cdot (131^2 \\cdot 100 + 131 \\cdot 100^2 + 100^3)}{131^3} \\)\r\n\\( S = \\frac{69690821 \\cdot 4026100}{2248091} \\)\r\n\\(\\frac{69690821}{2248091}=31 \\rightarrow  S = 31 \\cdot 4026100=124809100\\)\r\n\u003cstrong>Ответ:\u003c/strong> \\( 124809100 \\) рублей.\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "https://ege.sdamgia.ru/problem?id=511283", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S \\) руб. — сумма кредита.\n\\( r = 31\\% \\)\n\\( a = 1 + \\frac{31}{100} = \\frac{131}{100} \\)\nКредит погашается 3 равными платежами по \\( x = 69690821 \\) руб.\n\u003cstrong>Найти:\u003c/strong> \\( S \\)."}, {"d": "Составляем таблицу платежей", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа (руб.)\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot \\frac{131}{100} - x \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( \\left( S \\cdot \\frac{131}{100} - x \\right) \\cdot \\frac{131}{100} - x \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( \\left( \\left( S \\cdot \\frac{131}{100} - x \\right) \\cdot \\frac{131}{100} - x \\right) \\cdot \\frac{131}{100} - x = 0 \\)\nИТОГОВОЕ УРАВНЕНИЕ\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "После раскрытия скобок", "res": "\u003cB>После раскрытия скобок\u003c/B> \n\\( S \\cdot \\left( \\frac{131}{100} \\right)^3 - x \\cdot \\left( \\frac{131}{100} \\right)^2 - x \\cdot \\frac{131}{100} - x = 0 \\)"}, {"d": "Решаем неравенство", "res": "\\( S \\cdot \\frac{131^3}{100^3} = x \\cdot \\left( \\frac{131^2}{100^2} + \\frac{131}{100} + 1 \\right) \\)"}, {"d": "Избавляемся от знаменателей: домножаем на общий знаменатель", "res": "Домножаем на \\( 100^3 \\):\n\\( S \\cdot 131^3 = x \\cdot \\left( 131^2 \\cdot 100 + 131 \\cdot 100^2 + 100^3 \\right) \\)"}, {"d": "Подставляем известные значения", "res": "Подставляем \\( x = 69690821 \\):\n\\( S = \\frac{69690821 \\cdot (131^2 \\cdot 100 + 131 \\cdot 100^2 + 100^3)}{131^3} \\)\n\\( S = \\frac{69690821 \\cdot 4026100}{2248091} \\)\n\\(\\frac{69690821}{2248091}=31 \\rightarrow  S = 31 \\cdot 4026100=124809100\\)"}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> \\( 124809100 \\) рублей."}], "lvl": 4}, {"id": 1784019868446, "title": "38 - 530240  ГЕОМЕТРИЧЕСКАЯ ПРОГРЕССИЯ", "sectionName": "2 - АННУИТЕТ", "difficulty": "hard", "taskText": "Андрей Петрович взял кредит на несколько лет и выплатил его равными ежегодными платежами по 200 000 руб. \nПри этом в начале каждого года сумма кредита увеличивалась на 10%, а в конце года производился платёж. \nЕсли бы Андрей Петрович не делал платежей, то за это время вследствие начисления процентов сумма кредита составила бы 928 200 руб. \nНа сколько лет был взят кредит?\n\u003cstrong>Ответ:\u003c/strong> 4 года.", "taskImage": "", "answerText": "4", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\r\n\\( S \\) руб. — сумма кредита.\r\n\\( r = 10\\% \\)\r\n\\( a = 1 + \\frac{10}{100} = 1.1 \\)\r\nЕжегодный платеж: \\( x = 200000 \\) руб.\r\nЕсли бы платежей не было, то за \\( n \\) лет сумма кредита составила бы \\( S \\cdot 1.1^n = 928200 \\) руб.\r\n\r\n\u003cstrong>Найти:\u003c/strong> \\( n \\).\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа (руб.)\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot 1.1 - 200000 \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (S \\cdot 1.1 - 200000) \\cdot 1.1 - 200000 \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>...\u003c/td>\u003ctd>...\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>n\u003c/td>\u003ctd>\\( S \\cdot 1.1^n - 200000 \\cdot (1.1^{n-1} + 1.1^{n-2} + ... + 1) = 0 \\)\r\nИТОГОВОЕ УРАВНЕНИЕ\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\u003cB>После раскрытия скобок и группировки:\u003c/B>\r\n\\( S \\cdot 1.1^n - 200000 \\cdot (1.1^{n-1} + 1.1^{n-2} + ... + 1)=0\\)  [1]\r\nСумма в скобках — геометрическая прогрессия со знаменателем \\( 1.1 \\):\r\n\r\n\u003cB>ФОРМУЛА СУММЫ ГЕОМЕТРИЧЕСКОЙ ПРОГРЕССИИ:\u003c/B>\r\n\\( S_n = \\frac{a_1 \\cdot (q^n - 1)}{q - 1} \\)\r\nЗдесь \\( a_1=1\\), \\( q=1.1\\), \\(n=n\\)\r\n\r\nТогда [1]:\r\n\\( S \\cdot 1.1^n - 200000 \\cdot \\frac{1.1^n - 1}{1.1 - 1} =0\\)\r\n\r\nПо условию \\( S \\cdot 1.1^n = 928200 \\):\r\n\\( 928200 = 200000 \\cdot \\frac{1.1^n - 1}{0.1} \\)\r\n\\( 928200 = 2000000 \\cdot (1.1^n - 1) \\)\r\n\\( 1.1^n = 1.4641 \\)\r\n\r\nПодбираем \\( n \\):\r\n\\( 1.1^4 = 1.4641 \\)\r\nЗначит, \\( n = 4 \\).\r\n\r\n\u003cstrong>Ответ:\u003c/strong> кредит был взят на \u003cstrong>4 года\u003c/strong>.\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "https://ege.sdamgia.ru/problem?id=530240", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S \\) руб. — сумма кредита.\n\\( r = 10\\% \\)\n\\( a = 1 + \\frac{10}{100} = 1.1 \\)\nЕжегодный платеж: \\( x = 200000 \\) руб.\nЕсли бы платежей не было, то за \\( n \\) лет сумма кредита составила бы \\( S \\cdot 1.1^n = 928200 \\) руб.\n\u003cstrong>Найти:\u003c/strong> \\( n \\)."}, {"d": "Составляем таблицу платежей", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u 2030 и 2031 годах равны.\n– к июлю 2031 года долг будет выплачен полностью.\nНайдите общую сумму платежей за пять лет.", "taskImage": "", "answerText": "1540000", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 720 \\) тыс. руб. — сумма кредита.\n\\( r = 25\\% \\)\n\\( a = 1 + \\frac{25}{100} = \\frac{5}{4} \\)\n\\( N = 5 \\) лет\n\nВ июле 2027, 2028, 2029 годов долг остается равным \\( S \\).\nЭто означает, что в эти годы выплачиваются ТОЛЬКО ПРОЦЕНТЫ: \\(0.25=\\frac{1}{4}\\)\n\nВыплаты в 2030 и 2031 годах равны \\( x \\) тыс. руб.\nК июлю 2031 года долг полностью погашен.\n\n\u003cstrong>Найти:\u003c/strong> общую сумму платежей за 5 лет.\n\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа (тыс. руб.)\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>2027\u003c/td>\u003ctd>\\( S \\cdot \\frac{5}{4} - \\frac{1}{4}S = S \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2028\u003c/td>\u003ctd>\\( S \\cdot \\frac{5}{4} - \\frac{1}{4}S = S \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2029\u003c/td>\u003ctd>\\( S \\cdot \\frac{5}{4} - \\frac{1}{4}S = S \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2030\u003c/td>\u003ctd>\\( S \\cdot \\frac{5}{4} - x \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2031\u003c/td>\u003ctd>\\( (S \\cdot \\frac{5}{4} - x) \\cdot \\frac{5}{4} - x = 0 \\)\nИТОГОВОЕ УРАВНЕНИЕ\u003c/td>\u003c/tr>\n\u003c/table>\nПосле раскрытия скобок:\n\\( S \\cdot (\\frac{5}{4})^2 - x \\cdot \\frac{5}{4} - x = 0 \\)\n\\( S \\cdot \\frac{25}{16} - x \\cdot \\frac{5}{4} - x = 0 \\)\n\nДомножаем на общий знаменатель \\( 16 \\):\n\\( 25S - 20x - 16x = 0 \\)\n\nПодставляем \\( S = 720 \\):\n\\( x = 500 \\)\n\nОбщая сумма платежей = 3 года проценты \\(0.25S\\)+ 2 года по \\(x\\):\n\\( 0.25S \\cdot 3 + x \\cdot 2 = 0.25 \\cdot 720  \\cdot 3 + 500 \\cdot 2 =  1540 \\) тыс. руб.\n\n\u003cstrong>Ответ:\u003c/strong> общая сумма платежей за пять лет составляет \u003cstrong>1 540 000 рублей\u003c/strong>.", "solutionImage": "", "drawingImage": "", "solutionLink": "https://3.shkolkovo.online/catalog/131/90048", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 720 \\) тыс. руб. — сумма кредита.\n\\( r = 25\\% \\)\n\\( a = 1 + \\frac{25}{100} = \\frac{5}{4} \\)\n\\( N = 5 \\) лет\n\nВ июле 2027, 2028, 2029 годов долг остается равным \\( S \\).\nЭто означает, что в эти годы выплачиваются ТОЛЬКО ПРОЦЕНТЫ: \\(0.25=\\frac{1}{4}\\)\n\nВыплаты в 2030 и 2031 годах равны \\( x \\) тыс. руб.\nК июлю 2031 года долг полностью погашен."}, {"d": "Записываем, что нужно найти, и составляем таблицу платежей", "res": "\u003cstrong>Найти:\u003c/strong> общую сумму платежей за 5 лет.\n\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа (тыс. руб.)\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>2027\u003c/td>\u003ctd>\\( S \\cdot \\frac{5}{4} - \\frac{1}{4}S = S \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2028\u003c/td>\u003ctd>\\( S \\cdot \\frac{5}{4} - \\frac{1}{4}S = S \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2029\u003c/td>\u003ctd>\\( S \\cdot \\frac{5}{4} - \\frac{1}{4}S = S \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2030\u003c/td>\u003ctd>\\( S \\cdot \\frac{5}{4} - x \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2031\u003c/td>\u003ctd>\\( (S \\cdot \\frac{5}{4} - x) \\cdot \\frac{5}{4} - x = 0 \\)\nИТОГОВОЕ УРАВНЕНИЕ\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "После раскрытия скобок", "res": "После раскрытия скобок:\n\\( S \\cdot (\\frac{5}{4})^2 - x \\cdot \\frac{5}{4} - x = 0 \\)\n\\( S \\cdot \\frac{25}{16} - x \\cdot \\frac{5}{4} - x = 0 \\)"}, {"d": "Избавляемся от знаменателей: домножаем на общий знаменатель", "res": "Домножаем на общий знаменатель \\( 16 \\):\n\\( 25S - 20x - 16x = 0 \\)"}, {"d": "Подставляем известные значения", "res": "Подставляем \\( S = 720 \\):\n\\( x = 500 \\)"}, {"d": "Записываем общую сумму выплат", "res": "Общая сумма платежей = 3 года проценты \\(0.25S\\)+ 2 года по \\(x\\):\n\\( 0.25S \\cdot 3 + x \\cdot 2 = 0.25 \\cdot 720  \\cdot 3 + 500 \\cdot 2 =  1540 \\) тыс. руб."}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> общая сумма платежей за пять лет составляет \u003cstrong>1 540 000 рублей\u003c/strong>."}], "lvl": 5}, {"id": 1784016034602, "title": "049 - 2259", "sectionName": "2 - АННУИТЕТ", "difficulty": "hard", "taskText": "Планируется выдавать кредит сроком на 3 года на следующих условиях:\n— в 1-й и 3-й годы клиент обязан вносить в счет погашения кредита одну и ту же сумму;\n— во 2-й год клиент обязан вносить в счет погашения кредита только проценты, начисленные за соответствующий текущий год.\nПод какое наименьшее целое кратное десяти число процентов годовых необходимо выдавать такой кредит, чтобы общая сумма выплат по кредиту составляла не менее \\( 150\\% \\) от суммы кредита?", "taskImage": "", "answerText": "30", "answerImage": "", "solutionText": "Пусть \\( S \\) — сумма кредита, \r\n\\( r\\% \\) — годовая ставка, \r\n\\( a = 1 + \\frac{r}{100} \\) — коэффициент увеличения на \\(r\\) процентов, \r\n\\( \\frac{r}{100}=a - 1 \\) — коэффициент начисления процентов, \r\n\\( X \\) — платеж в 1-й и 3-й годы.\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг на конец года\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot a - X \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (S \\cdot a - X)\\cdot a - (a-1)(S \\cdot a - X)=S \\cdot a - X \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( (S \\cdot a - X) \\cdot a - X = 0 \\) \r\nИТОГОВОЕ УРАВНЕНИЕ [1]\u003c/td>\u003c/tr>\r\n\u003c/table>\r\nБудем перебирать кратные 10 \\(r\\):\r\n\r\n🔍Пусть \\( r = 10\\% \\), тогда \\( a = 1.1 \\):\r\nИз уравнения [1]:\r\n\\( S \\cdot 1.1^2 - X\\cdot 1.1 -X = 0 \\)\r\n\\( X =  \\frac{121}{210}S \\)\r\nОбщая сумма выплат:\r\n\\( \\Sigma = 2X + (S \\cdot 1.1 - X)(0.1) \\)\r\nПодставляем \\( X = \\frac{121}{210}S \\):\r\n\\( \\Sigma = 1.205S \u003c 1.5S \\) — не подходит.\r\n\r\n🔍Пусть \\( r = 20\\% \\), тогда \\( a = 1.2 \\):\r\nИз уравнения [1]:\r\n\\( S \\cdot 1.2^2 - X\\cdot 1.2 -X = 0 \\)\r\n\\( X = \\frac{1.44}{2.2}S = \\frac{36}{55}S \\)\r\n\r\nОбщая сумма выплат:\r\n\\( \\Sigma = 2X + (S \\cdot 1.2 - X)(0.2) \\)\r\nПодставляем \\( X = \\frac{36}{55}S \\):\r\n\\( \\Sigma = 1.418S \u003c 1.5S \\) — не подходит.\r\n\r\n🔍Пусть \\( r = 30\\% \\), тогда \\( a = 1.3 \\):\r\nИз уравнения [1]:\r\n\\( S \\cdot 1.3^2 - X\\cdot 1.3 -X) = 0 \\)\r\n\\( X = \\frac{1.69}{2.3}S = \\frac{169}{230}S \\)\r\n\r\nОбщая сумма выплат:\r\n\\( \\Sigma = 2X + (S \\cdot 1.3 - X)(0.3) \\)\r\nПодставляем \\( X = \\frac{169}{230}S \\):\r\n\\( \\Sigma = 1.639S   \\ge 1.5S \\) — подходит.\r\n\r\nНаименьшее целое кратное десяти — \\( 30\\% \\).\r\n\u003cstrong>Ответ:\u003c/strong> 30%\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "https://3.shkolkovo.online/catalog/172/2259", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем платежи", "res": "Пусть \\( S \\) — сумма кредита, \n\\( r\\% \\) — годовая ставка, \n\\( a = 1 + \\frac{r}{100} \\) — коэффициент увеличения на \\(r\\) процентов, \n\\( \\frac{r}{100}=a - 1 \\) — коэффициент начисления процентов, \n\\( X \\) — платеж в 1-й и 3-й годы."}, {"d": "Составляем таблицу долга по годам", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг на конец года\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot a - X \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (S \\cdot a - X)\\cdot a - (a-1)(S \\cdot a - X)=S \\cdot a - X \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( (S \\cdot a - X) \\cdot a - X = 0 \\) \nИТОГОВОЕ УРАВНЕНИЕ [1]\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Будем перебирать кратные 10 ", "res": "Будем перебирать кратные 10 \\(r\\)
