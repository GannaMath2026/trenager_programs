<script type="application/json" id="DB">{"savedAt": 2, "tasks": [{"id": 1784024011995, "title": "00", "sectionName": "", "difficulty": "basic", "taskText": "ИДЕИ", "taskImage": "", "answerText": "", "answerImage": "", "solutionText": "\u003cstrong>Новые авторские идеи для усложнения задач на аннуитетные платежи:\u003c/strong>\r\n\r\nНиже приведены нестандартные схемы, которые я придумал специально для вас. Они основаны на реальных финансовых инструментах, но адаптированы под формат ЕГЭ.\r\n\r\n\u003cstrong>Идея 1. «Плавающий платёж, привязанный к инфляции»\u003c/strong>\r\nУсловие: Каждый год платёж увеличивается на процент инфляции (например, 5%), но при этом процентная ставка по кредиту тоже меняется (например, первые 2 года — 10%, следующие — 15%). Найти общую сумму выплат.\r\n\r\n\u003cstrong>Идея 2. «Кредит с периодами «только проценты» и «только тело»»\u003c/strong>\r\nУсловие: В нечётные годы клиент выплачивает только проценты, а в чётные — только сумму, равную половине текущего долга после начисления процентов. Как только остаток становится меньше заданной суммы, кредит гасится досрочно одним платежом. Найти общую переплату.\r\n\r\n\u003cstrong>Идея 3. «Ступенчатый график погашения»\u003c/strong>\r\nУсловие: Первые 2 года платежи равны X, следующие 3 года — в 1.5 раза больше, последний год — в 2 раза больше первого. Известна общая сумма выплат. Найти X и сумму кредита.\r\n\r\n\u003cstrong>Идея 4. «Кредит с возможностью реструктуризации»\u003c/strong>\r\nУсловие: Клиент берёт кредит на 5 лет под 20%. После 2-х лет он договаривается о снижении ставки до 15%, но при этом сумма ежемесячного платежа увеличивается на 10%. Найти, сколько он сэкономит.\r\n\r\n\u003cstrong>Идея 5. «Два кредита с перекрёстным погашением»\u003c/strong>\r\nУсловие: Клиент берёт два кредита: один на 3 года под 10%, другой на 4 года под 12%. Платежи по первому кредиту на 30% больше, чем по второму. Найти общую переплату, если известна сумма каждого кредита.\r\n\r\n\u003cstrong>Идея 6. «Кредит с «амортизационным» платежом»\u003c/strong>\r\nУсловие: Платежи образуют арифметическую прогрессию с разностью d. Известно, что первый платёж на 20% больше второго, а последний равен половине первого. Найти d и сумму кредита.\r\n\r\n\u003cstrong>Идея 7. «Сезонный кредит»\u003c/strong>\r\nУсловие: В летние месяцы платежи в 2 раза больше, чем в зимние. Ставка единая. Найти общую сумму выплат за 2 года.\r\n\r\n\u003cstrong>Идея 8. «Беспроцентный период с последующими процентами»\u003c/strong>\r\nУсловие: Первые полгода проценты не начисляются, затем ставка 15% годовых. Платежи равны. Найти сумму кредита, если общая сумма выплат известна.\r\n\r\n\u003cstrong>Идея 9. «Кредит с условием минимального платежа»\u003c/strong>\r\nУсловие: Каждый год клиент обязан вносить не менее 10% от первоначальной суммы долга, но может вносить больше. Найти минимальный срок погашения при заданной ставке.\r\n\r\n\u003cstrong>Идея 10. «Переменная ставка в зависимости от суммы долга»\u003c/strong>\r\nУсловие: Если остаток долга больше 50% от начального, ставка 20%, иначе — 12%. Найти общую сумму выплат.\r\n\r\nВсе эти идеи можно комбинировать, создавая задачи повышенной сложности. Основной подвох — необходимость аккуратно расписывать формулы для каждого периода и решать системы уравнений или неравенств.", "solutionImage": "", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "theory": true, "steps": []}, {"id": 1787454853141, "title": "000 ВКЛАДЫ ТЕОРИЯ", "sectionName": "0 - ВКЛАДЫ", "difficulty": "basic", "taskText": "\u003cB>ВКЛАДЫ-ТЕОРИЯ\u003c/B>", "taskImage": "", "answerText": "", "answerImage": "", "solutionText": "\u003cb>1. МНОЖИТЕЛЬ РОСТА\u003c/b>\r\nПри увеличении на \\( r\\% \\) множитель роста: \\( a = 1 + \\frac{r}{100} \\)\r\n\u003cb>ВАЖНО!\u003c/b> Всегда переводим процент в обыкновенную дробь, чтобы домножить на общий знаменатель и получить простое уравнение.\r\nувеличить на \\(10\\%:  \\frac{110}{100}=\\frac{11}{10} \\quad\\quad \\) увеличить на \\(20\\%\\) :    \\(\\frac{120}{100} =\\frac{6}{5} \\quad\\quad \\) увеличить на \\(25\\%\\) : \\( \\frac {125}{100}= \\frac{5}{4} \\quad\\quad \\)увеличить на \\(12,5\\%\\) : \\(   112.5\\% = \\frac{1125}{1000} = \\frac{9}{8} \\)\r\n\r\n================================================================================\r\n\u003cb>2. ОСНОВНЫЕ ПОНЯТИЯ\u003c/b>\r\n\r\n\u003cb>Капитализация процентов\u003c/b> — начисленные проценты прибавляются к сумме вклада, \r\nв следующем периоде проценты начисляются на увеличенную сумму.\r\n\r\n\u003cb>Простые проценты\u003c/b> — начисляются только на первоначальную сумму (капитализации нет).\r\n\u003cb>Сложные проценты\u003c/b> — начисляются на сумму с учётом ранее начисленных процентов  (капитализация есть).\r\n\r\n\u003cB>СРАВНЕНИЕ:\u003c/B> \\(\\quad\\) \u003cb>Простые\u003c/b>: \\( B \\cdot (1 + n \\cdot \\frac{r}{100}) \\quad\\) \u003cb>Сложные\u003c/b>: \\( B \\cdot (1 + \\frac{r}{100})^n \\)\r\n\r\n================================================================================\r\n\u003cb>3. ВКЛАД БЕЗ ПОПОЛНЕНИЙ И СНЯТИЙ\u003c/b>\r\nСумма \\( B \\) под \\( r\\% \\) на \\( n \\) лет: \\(\\quad B_n = B \\cdot a^n \\)\r\n\r\n================================================================================\r\n\u003cb>4. ВКЛАД С ЕЖЕГОДНЫМ СНЯТИЕМ ОДИНАКОВОЙ СУММЫ\u003c/b>\r\n\r\nПоложили \\( B \\), каждый год снимаем \\( S \\), проценты начисляются в конце года.\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Сумма вклада на конец года (после начисления и снятия)\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( B \\cdot a - S \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (B \\cdot a - S) \\cdot a - S \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( ((B \\cdot a - S) \\cdot a - S) \\cdot a - S \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>n\u003c/td>\u003ctd>\\( (...((B \\cdot a - S) \\cdot a - S) \\cdot a - ... ) \\cdot a - S = 0 \\) – ИТОГОВОЕ УРАВНЕНИЕ\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\u003cb>ОБЩАЯ СУММА ВЫПЛАТ\u003c/b>: \\(\\quad \\) ОСВ = \\( S \\cdot n\\)\r\n\r\n\u003cB>КАК РЕШАТЬ УРАВНЕНИЕ\u003c/B>\r\nРаскрываем скобки, домножая каждое слагаемое(со знаком \\(\\pm\\)) на произведение всех коэффициентов:\r\n\\( B \\cdot a^n - S \\cdot a^{n-1} – S \\cdot a^{n-2} – \\dots – S \\cdot a –S  = 0 \\)\r\n\r\n\u003cB>❗ ЕСЛИ ЧИСЛО ЛЕТ \\( n \\) НЕИЗВЕСТНО\u003c/B>, то стоит вынести \\(S\\) за скобку:\r\n\\( B \\cdot a^n - S \\cdot (a^{n-1} + a^{n-2} + \\dots + a + 1) = 0 \\)\r\nВ скобках — \u003cb>геометрическая прогрессия\u003c/b> со знаменателем \\( a \\).\r\nЧерез сумму геометрической прогрессии: \\( S_n = \\frac{b_1 \\cdot (q^n - 1)}{q - 1}\\)\r\n\\( b_1=1\\), \\( q=a \\quad \\rightarrow  \\quad B \\cdot a^n = S \\cdot \\frac{a^n - 1}{a - 1} \\)\r\n\r\n\u003cB>❗ ЕСЛИ ЧИСЛО ЛЕТ \\( n \\) ИЗВЕСТНО\u003c/B> — проще домножить на общий знаменатель, привести подобные, а потом подставлять данные.\r\n\r\n================================================================================\r\n\u003cb>5. ЕЖЕГОДНОЕ ПОПОЛНЕНИЕ ОДИНАКОВОЙ СУММЫ\u003c/b>\r\n\r\n\u003cB>СХЕМА\u003c/B>: положили \\( B \\), каждый год добавляем \\( S \\), проценты начисляются в конце года.\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Сумма вклада на конец года (после начисления и пополнения)\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( B \\cdot a + S \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (B \\cdot a + S) \\cdot a + S \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( ((B \\cdot a + S) \\cdot a + S) \\cdot a + S \\)\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n================================================================================\r\n\u003cb>6. ПОПОЛНЕНИЕ НЕ КАЖДЫЙ ГОД (ВЫБОРОЧНО)\u003c/b>\r\n\r\n❗  Пополнение \u003cb>«В НАЧАЛЕ 3-го года»\u003c/b>  = \u003cb> «В КОНЦЕ 2-го»\u003c/b> =\u003cb> «ПОСЛЕ начисления процентов за 2-й год»\u003c/b>.\r\nПример таблицы для задачи с пополнением в начале 3-го и 5-го годов:\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Сумма вклада на конец года (после начисления и пополнения)\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( B \\cdot \\frac{11}{10} \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( B \\cdot (\\frac{11}{10})^2 \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( (B \\cdot (\\frac{11}{10})^2 + S) \\cdot \\frac{11}{10} \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\\( \\left( (B \\cdot (\\frac{11}{10})^2 + S) \\cdot \\frac{11}{10} \\right) \\cdot \\frac{11}{10}  \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>5\u003c/td>\u003ctd>\\( \\left( ((B \\cdot (\\frac{11}{10})^2 + S) \\cdot \\frac{11}{10} ) \\cdot \\frac{11}{10}+S \\right)\\cdot \\frac{11}{10}  > 20 \\)\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n================================================================================\r\n\u003cb>7. НАЧИСЛЕННЫЕ ПРОЦЕНТЫ\u003c/b>\r\n\r\n\u003cb>НАЧИСЛЕННЫЕ ПРОЦЕНТЫ\u003c/b> = КОНЕЧНАЯ СУММА − ВСЕ ВНЕСЁННЫЕ СРЕДСТВА:\r\n\\( \\text{Проценты} = B_{\\text{кон}} - (B_{\\text{нач}} + \\text{все пополнения} - \\text{все снятия}) \\)\r\n👉 Если снятия были, они уменьшают \"внесённые средства\", поэтому вычитаются.\r\n================================================================================\r\n\u003cb>9. ПЕРЕСЧЁТ ГОДОВОЙ СТАВКИ НА МЕСЯЧНУЮ\u003c/b>\r\n\r\nГодовая ставка \\( r\\% \\), начисление ежемесячное C КАПИТАЛИЗАЦИЕЙ.\r\n\u003cb>Месячный множитель:\u003c/b> \r\n\\( a_{\\text{мес}} = (1 + \\frac {r}{100})^{\\frac{1}{12}} \\)\r\n\r\n\u003cb>Сумма через \\( m \\) месяцев:\u003c/b>\r\n\\( B_m = B \\cdot a_{\\text{мес}}^m \\)\r\n\r\n\u003cb>Проверка:\u003c/b> через 12 месяцев:\r\n\\( B_{12} = B \\cdot a_{\\text{мес}}^{12} = B \\cdot (1 + \\frac{r}{100})^{\\frac{12}{12}} = B \\cdot (1 + \\frac{r}{100})= B \\cdot a \\) -  \u003cb>возвращаемся к исходной ГОДОВОЙ СТАВКЕ\u003c/b>.\r\n\r\n================================================================================\r\n\u003cb>10. РАЗНЫЕ ФОРМУЛИРОВКИ «УВЕЛИЧИЛСЯ НА ...%»\u003c/b>\r\n\u003ctable>\r\n\u003ctr>\u003cth>Формулировка\u003c/th>\u003cth>Математическая запись\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>Увеличился на 40%\u003c/td>\u003ctd>\\( B_{\\text{конечный}} = B \\cdot 1,4  \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>Увеличился в 2,5 раза\u003c/td>\u003ctd>\\( B_{\\text{конечный}} = B \\cdot 2,5\\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>Уменьшился в 2,5 раза\u003c/td>\u003ctd>\\( B_{\\text{конечный}} = \\frac{B} {2,5}\\)\u003c/td>\u003c/tr>\r\n\r\n\u003ctr>\u003ctd>Сняли \\(\\frac {1}{3}\\) (осталось \\(\\frac {2}{3}\\))\u003c/td>\u003ctd>\\( B_{\\text{после снятия}} = B \\cdot \\frac{2}{3} \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>Увеличили на  \\(\\frac {1}{3}\\) (стало \\(\\frac {4}{3}\\))\u003c/td>\u003ctd>\\( B_{\\text{после снятия}} = B \\cdot \\frac{4}{3} \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>Сняли 20% (осталось 80%)\u003c/td>\u003ctd>\\( B_{\\text{после снятия}} = B \\cdot 0,8  \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>Внесли 20% (стало 120%)\u003c/td>\u003ctd>\\( B_{\\text{после пополнения}} = B \\cdot 1,2  \\)\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n================================================================================\r\n\u003cb>11. АЛГОРИТМ РЕШЕНИЯ\u003c/b>\r\n\r\n\u003cb>Шаг 1.\u003c/b> Обозначить неизвестные: \\( B \\) (начальный вклад/кредит), \\( S \\) (снятие/пополнение/платёж).\r\n\u003cb>Шаг 2.\u003c/b> Перевести все проценты в коэффициенты → \u003cb>обыкновенные дроби\u003c/b>.\r\n\u003cb>Шаг 3.\u003c/b> Записать сумму на конец каждого года через предыдущую.\r\n\u003cb>Шаг 4.\u003c/b> Составить уравнение или неравенство по условию.\r\n\u003cb>Шаг 5.\u003c/b> \u003cb>Домножить на общий знаменатель\u003c/b>, привести подобные, получить простое.\r\n\u003cb>Шаг 6.\u003c/b> Решить относительно неизвестной.\r\n\u003cb>Шаг 7.\u003c/b> Если требуется целое число — деление выполнить с остатком, выделить целую часть, провести отбор по неравенству.\r\n\u003cb>Шаг 8.\u003c/b> Записать ответ с \u003cb>размерностью\u003c/b>, которая указана в вопросе – тыс. руб, млн. руб \\(\\cdots\\)….\r\n\r\n❗ \u003cb> ЕСЛИ В СИСТЕМЕ ЕСТЬ УРАВНЕНИЕ И НЕРАВЕНСТВО:\u003c/b>\r\nВыражаем из уравнения переменную так, чтобы в правой части осталось то, что ограничено неравенством.\r\nПри подстановке получаем неравенство относительно ограниченной переменной.\r\n\r\n❗ \u003cb>КОГДА ЧИСЛА БОЛЬШИЕ\u003c/b> — сначала работаем в буквах, потом подставляем числа и \u003cb>максимально сокращаем\u003c/b>.\r\n================================================================================\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "theory": true, "steps": []}, {"id": 1787508953596, "title": "00 теория", "sectionName": "", "difficulty": "basic", "taskText": "\u003cB>АННУИТЕТ - ТЕОРИЯ\u003c/B>", "taskImage": "", "answerText": "", "answerImage": "", "solutionText": "\u003cstrong>📚 ВСЯ ТЕОРИЯ ПО КРЕДИТАМ (АННУИТЕТНЫЕ ПЛАТЕЖИ)\u003c/strong>\r\n\u003cstrong>🔑 ОСНОВНЫЕ ПОНЯТИЯ\u003c/strong>\r\n\u003cstrong>1. Аннуитетный платеж\u003c/strong> — равный платеж, который вносится каждый год (или месяц) в течение всего срока кредита.\r\n\u003cstrong>2. Тело кредита\u003c/strong> — исходная сумма, взятая в банке.\r\n\u003cstrong>3. Переплата\u003c/strong> — разница между общей суммой выплат и телом кредита.\r\n\u003cstrong>4. КОЭФФИЦИЕНТ РОСТА ДОЛГА\u003c/strong>\r\nЕсли ставка = \\( r\\% \\), то каждый год долг \u003cstrong>умножается\u003c/strong> на: \\( a = 1 + \\frac{r}{100} \\)\r\n\u003cstrong>Примеры:\u003c/strong>\r\n- \\( r = 20\\% \\Rightarrow a = 1.2 = \\frac{6}{5} \\)\r\n- \\( r = 31\\% \\Rightarrow a = 1.31 = \\frac{131}{100} \\)\r\n- \\( r = 12,5\\% \\Rightarrow a = 1.125 = \\frac{9}{8} \\)\r\n\r\n\u003cstrong>🧮 ОСНОВНАЯ СХЕМА (ДОЛГ ПО ГОДАМ)\u003c/strong>\r\nЕсли кредит \\( S \\) погашается \\( n \\) равными платежами по \\( x \\) рублей под ставку \\( a \\):\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot a - x \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (S \\cdot a - x) \\cdot a - x \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( ((S \\cdot a - x) \\cdot a - x) \\cdot a - x \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>...\u003c/td>\u003ctd>...\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>n\u003c/td>\u003ctd>\\( S \\cdot a^n - x \\cdot a^{n-1} - x \\cdot a^{n-2} - ... - x = 0 \\)\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\u003cstrong>📐 ГЛАВНАЯ ФОРМУЛА (после раскрытия скобок):\u003c/strong>\r\n\\( S \\cdot a^n = x \\cdot \\frac{a^n - 1}{a - 1} \\), тут дай пока ез прогрессии\r\nгде:\r\n- \\( S \\) — сумма кредита,\r\n- \\( a \\) — коэффициент роста,\r\n- \\( n \\) — количество лет,\r\n- \\( x \\) — ежегодный платёж.\r\nВ скобках прогрессия\r\n\u003cstrong>📌 ФОРМУЛА СУММЫ ГЕОМЕТРИЧЕСКОЙ ПРОГРЕССИИ:\u003c/strong>\r\n\\( S_n = \\frac{a_1 \\cdot (q^n - 1)}{q - 1} \\)\r\nДля кредитов: \\( a_1 = x \\), \\( q = a \\), \\( S_n = x \\cdot \\frac{a^n - 1}{a - 1} \\)\r\n\r\n\u003cstrong>💰 ПЕРЕПЛАТА:\u003c/strong>\r\n\u003cstrong>Переплата = Общая сумма выплат - Сумма кредита\u003c/strong>\r\n\\( \\text{Переплата} = n \\cdot x - S \\)\r\n\r\n\u003cstrong>📊 ПЕРЕПЛАТА В ПРОЦЕНТАХ ОТ ТЕЛА КРЕДИТА:\u003c/strong>\r\n\\( \\frac{n \\cdot x - S}{S} \\cdot 100\\% \\)\r\n\u003cstrong>🔄 ОСОБЫЕ СЛУЧАИ:\u003c/strong>\r\n\u003cstrong>1) КОГДА ПЛАТЕЖИ НЕ РАВНЫ (геометрическая прогрессия):\u003c/strong>\r\nЕсли платежи \\( x, x \\cdot a, x \\cdot a^2, ... \\) (каждый следующий больше предыдущего на \\( r\\% \\)), то уравнение:\r\n\\( S \\cdot a^n = n \\cdot x \\cdot a^{n-1} \\)\r\n\u003cstrong>2) КОГДА В НЕКОТОРЫЕ ГОДЫ ПЛАТЯТСЯ ТОЛЬКО ПРОЦЕНТЫ:\u003c/strong>\r\nЕсли долг остается неизменным \\( S \\), то в этот год платятся только проценты: \\( S \\cdot (a - 1) \\).\r\n\u003cstrong>3) КОГДА ПРОЦЕНТЫ МЕНЯЮТСЯ:\u003c/strong>\r\nЕсли в разные годы разные ставки \\( a_1, a_2, a_3 \\), то:\r\n\\( S \\cdot a_1 \\cdot a_2 \\cdot a_3 - x \\cdot a_2 \\cdot a_3 - x \\cdot a_3 - x = 0 \\)\r\n\r\n\u003cstrong>4) КОГДА ПРОЦЕНТЫ НЕ НАЧИСЛЯЮТСЯ В ОДИН ИЗ ГОДОВ:\u003c/strong>\r\nЕсли в какой-то год долг не увеличивается, то этот год просто пропускается (коэффициент \\( a \\) не ставится).\r\n\r\n\u003cstrong>5) КОГДА ПЛАТЕЖ = ЧАСТЬ ДОЛГА:\u003c/strong>\r\nЕсли платёж составляет \\( \\frac{m}{n} \\) от долга после начисления, то долг умножается на \\( \\frac{n-m}{n} \\).\r\nНапример: платёж \\( \\frac{2}{13} \\) от долга → останется \\( \\frac{11}{13} \\).\r\n\r\n\u003cstrong>📝 АЛГОРИТМ РЕШЕНИЯ ЛЮБОЙ ЗАДАЧИ:\u003c/strong>\r\n\u003cstrong>Шаг 1:\u003c/strong> Обозначить \\( S \\) — сумма кредита, \\( x \\) — платёж, \\( a = 1 + \\frac{r}{100} \\).\r\n\r\n\u003cstrong>Шаг 2:\u003c/strong> Составить таблицу: Год → Долг после начисления → Платёж → Долг после платежа.\r\n\u003cstrong>Шаг 3:\u003c/strong> В последний год приравнять долг к 0.\r\n\u003cstrong>Шаг 4:\u003c/strong> Раскрыть скобки и сгруппировать.\r\n\u003cstrong>Шаг 5:\u003c/strong> Получить уравнение и решить его.\r\n\u003cstrong>Шаг 6:\u003c/strong> Найти искомую величину.\r\n\r\n\u003cstrong>✅ ГЛАВНЫЕ ПРИЁМЫ:\u003c/strong>\r\n\u003cstrong>1. ДОМНОЖЕНИЕ НА ЗНАМЕНАТЕЛЬ\u003c/strong>\r\nЕсли в уравнении есть дроби, умножаем обе части на общий знаменатель.\r\n\u003cstrong>2. СОКРАЩЕНИЕ НА \\( S \\)\u003c/strong>\r\nЕсли \\( S \\neq 0 \\), можно делить на него, чтобы избавиться от неизвестного.\r\n\u003cstrong>3. ПОДБОР КОРНЯ\u003c/strong>\r\nЧасто корень уравнения — красивая дробь типа \\( \\frac{9}{8} \\), \\( \\frac{5}{4} \\), \\( \\frac{6}{5} \\).\r\n\u003cstrong>4. ГЕОМЕТРИЧЕСКАЯ ПРОГРЕССИЯ\u003c/strong>\r\nСумма \\( x \\cdot a^{n-1} + x \\cdot a^{n-2} + ... + x \\) сворачивается в \\( x \\cdot \\frac{a^n - 1}{a - 1} \\).\r\n\u003cstrong>5. ПЕРЕПЛАТА = СУММА ПЛАТЕЖЕЙ - ТЕЛО КРЕДИТА\u003c/strong>\r\n\r\n\u003cstrong>🚀 ТИПОВЫЕ ЗАДАЧИ И ИХ ОСОБЕННОСТИ:\u003c/strong>\r\n\u003cstrong>1. Найти переплату в процентах:\u003c/strong>\r\nНаходим \\( x \\), затем переплату \\( n \\cdot x - S \\), затем \\( \\frac{n \\cdot x - S}{S} \\cdot 100\\% \\).\r\n\u003cstrong>2. Найти сумму кредита по сумме платежей:\u003c/strong>\r\nВыражаем \\( S \\) через \\( x \\) и подставляем в условие.\r\n\u003cstrong>3. Найти ставку (через отношение платежей):\u003c/strong>\r\nСоставляем уравнение, сокращаем \\( S \\), решаем относительно \\( a \\).\r\n\u003cstrong>4. Найти количество лет:\u003c/strong>\r\nПодставляем всё в формулу и подбираем \\( n \\).\r\n\u003cstrong>5. Найти платеж, если платежи образуют прогрессию:\u003c/strong>\r\nРасписываем каждый платёж, сворачиваем сумму в формулу прогрессии.\r\n\u003cstrong>6. Найти экономию при рефинансировании:\u003c/strong>\r\nСчитаем платежи по старой и новой ставке, находим разность.\r\n\u003cstrong>7. Найти процент при хитрой схеме платежей:\u003c/strong>\r\nРасписываем каждый год, составляем уравнение, решаем.\r\n\u003cstrong>🎯 ВАЖНЫЕ ЗАМЕЧАНИЯ:\u003c/strong>\r\n- Если \u003cstrong>долг остается неизменным\u003c/strong> в какой-то год, значит в этот год выплачиваются \u003cstrong>только проценты\u003c/strong>: \\( S \\cdot (a - 1) \\).\r\n- Если \u003cstrong>платёж = \\( \\frac{m}{n} \\) от долга\u003c/strong>, то долг умножается на \\( \\frac{n-m}{n} \\).\r\n- Если \u003cstrong>проценты не начисляются\u003c/strong>, то этот год просто пропускается.\r\n- Если \u003cstrong>ставка меняется\u003c/strong>, то коэффициенты \\( a \\) для разных лет разные.\r\n- Если \u003cstrong>платежи составляют геометрическую прогрессию\u003c/strong>, то каждый следующий платёж умножается на \\( a \\).\r\n\r\n\u003cstrong>⚡ ФОРМУЛЫ ДЛЯ БЫСТРОГО СЧЁТА:\u003c/strong>\r\n\\( 1.1^2 = 1.21, \\quad 1.1^3 = 1.331, \\quad 1.1^4 = 1.4641, \\quad 1.1^5 = 1.61051 \\)\r\n\\( 1.2^2 = 1.44, \\quad 1.2^3 = 1.728, \\quad 1.2^4 = 2.0736, \\quad 1.2^5 = 2.48832 \\)\r\n\\( 1.25^2 = 1.5625, \\quad 1.25^3 = 1.953125, \\quad 1.25^4 = 2.44140625 \\)\r\n\\( 1.3^2 = 1.69, \\quad 1.3^3 = 2.197, \\quad 1.3^4 = 2.8561 \\)\r\n\\( 1.31^2 = 1.7161, \\quad 1.31^3 = 2.248091 \\)\r\n\\( 1.05^2 = 1.1025, \\quad 1.05^{12} \\approx 1.79586 \\)\r\n\u003cstrong>💡 ПОСЛЕДНИЙ СОВЕТ:\u003c/strong>\r\nВсегда проверяйте ответ на разумность:\r\n- Переплата не может быть отрицательной.\r\n- Переплата в процентах обычно от 0% до 200%.\r\n- Платёж должен быть больше процентов за первый год.\r\n- Ставка обычно от 0% до 100% (кроме особых случаев)\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "theory": true, "steps": []}, {"id": 1772889512613, "title": "02 - 130171", "sectionName": "0 - ВКЛАДЫ", "difficulty": "basic", "taskText": "В июле 2026 года Николай планирует открыть накопительный счет на три года. Его условия таковы:\n– 1 июля 2026 года Николай помещает на счет 819 000 рублей;\n– 30 июня каждого года сумма на счете увеличивается на 20% по сравнению с суммой, находящейся на счете 29 июня;\n– 1 июля 2027, 2028 и 2029 годов Николай снимет со счета некоторую одну и ту же сумму денег;\n– 1 июля 2029 года остаток на счете должен оказаться равным 0.\nНайдите сумму, которую Николай должен снимать со счета каждый год.", "taskImage": "", "answerText": "388 800 рублей", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\n\\( B \\) — исходная сумма вклада (тыс. руб.).\n\\( B = 819 \\) тыс. руб.\n\\( r = 20\\% \\)\n\\( a = 1 + \\frac{20}{100} = 1 + \\frac{1}{5} = \\frac{6}{5} \\)\n\\( N = 3 \\) года\n\\( s \\) — сумма, снимаемая каждый год (тыс. руб.).\n\n\u003cstrong>Найти:\u003c/strong> \\( s \\).\n\n\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Сумма вклада на конец года (после начисления и снятия)\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( B \\cdot \\frac{6}{5} - s \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (B \\cdot \\frac{6}{5} - s) \\cdot \\frac{6}{5} - s \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( ((B \\cdot \\frac{6}{5} - s) \\cdot \\frac{6}{5} - s) \\cdot \\frac{6}{5} - s = 0 \\)\u003c/td>\u003c/tr>\n\u003c/table>\n\nСоставляем уравнение:\n\\( B \\cdot (\\frac{6}{5})^3 - s \\cdot (\\frac{6}{5})^2 - s \\cdot \\frac{6}{5} - s = 0 \\)\n\nПодставляем \\( B = 819 \\):\n\\( 819 \\cdot \\frac{216}{125} - s \\cdot \\frac{36}{25} - s \\cdot \\frac{6}{5} - s = 0 \\)\n\n\u003cstrong>Домножаем на общий знаменатель \\( 125 \\):\u003c/strong>\n\\( 819 \\cdot 216 - s \\cdot 36 \\cdot 5 - s \\cdot 6 \\cdot 25 - s \\cdot 125 = 0 \\)\n\\( 176904 - 180s - 150s - 125s = 0 \\)\n\\( 455s = 176904 \\)\n\\( s = \\frac{176904}{455} = 388.8 \\)\n\n\u003cstrong>Ответ:\u003c/strong> Николай должен снимать со счета каждый год \u003cstrong>388 800 рублей\u003c/strong>.", "solutionImage": "", "drawingImage": "", "solutionLink": "https://3.shkolkovo.online/catalog/131/130171", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( B \\) — исходная сумма вклада (тыс. руб.).\n\\( B = 819 \\) тыс. руб.\n\\( r = 20\\% \\)\n\\( a = 1 + \\frac{20}{100} = 1 + \\frac{1}{5} = \\frac{6}{5} \\)\n\\( N = 3 \\) года\n\\( s \\) — сумма, снимаемая каждый год (тыс. руб.).\n\u003cstrong>Найти:\u003c/strong> \\( s \\)."}, {"d": "Составляем таблицу: сумма вклада по годам", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Сумма вклада на конец года (после начисления и снятия)\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( B \\cdot \\frac{6}{5} - s \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (B \\cdot \\frac{6}{5} - s) \\cdot \\frac{6}{5} - s \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( ((B \\cdot \\frac{6}{5} - s) \\cdot \\frac{6}{5} - s) \\cdot \\frac{6}{5} - s = 0 \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Составляем уравнение", "res": "Составляем уравнение:\n\\( B \\cdot (\\frac{6}{5})^3 - s \\cdot (\\frac{6}{5})^2 - s \\cdot \\frac{6}{5} - s = 0 \\)"}, {"d": "Подставляем известные значения", "res": "Подставляем \\( B = 819 \\):\n\\( 819 \\cdot \\frac{216}{125} - s \\cdot \\frac{36}{25} - s \\cdot \\frac{6}{5} - s = 0 \\)"}, {"d": "Домножаем на общий знаменатель \\( 125 \\)", "res": "\u003cstrong>Домножаем на общий знаменатель \\( 125 \\):\u003c/strong>\n\\( 819 \\cdot 216 - s \\cdot 36 \\cdot 5 - s \\cdot 6 \\cdot 25 - s \\cdot 125 = 0 \\)\n\\( 176904 - 180s - 150s - 125s = 0 \\)\n\\( 455s = 176904 \\)\n\\( s = \\frac{176904}{455} = 388.8 \\)"}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> Николай должен снимать со счета каждый год \u003cstrong>388 800 рублей\u003c/strong>."}], "lvl": 1}, {"id": 1772769223098, "title": "01 - 130165", "sectionName": "0 - ВКЛАДЫ", "difficulty": "basic", "taskText": "1 июля 2026 года планируется открыть вклад в банке на 3 года. \n30 июня каждого года сумма на счете увеличивается на 25% по сравнению с суммой, находящейся на вкладе 29 июня. \n1 июля 2027, 2028 и 2029 годов со вклада снимают одну и ту же сумму. \nНайдите исходную сумму вклада, если после третьего снятия на вкладе осталось 0 рублей, а всего было снято 375 000 рублей.", "taskImage": "", "answerText": "244000", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\n\\( B \\) — исходная сумма вклада (тыс. руб.).\n\\( r = 25\\% \\)\n\\( a = 1 + \\frac{25}{100} = 1 + \\frac{1}{4} = \\frac{5}{4} \\)\n\\( N = 3 \\) года\n\\( s \\) — сумма, снимаемая каждый год (тыс. руб.).\n\nВсего снято 375 тыс. руб. за 3 года:\n\\( 3s = 375 \\)\n\\( s = 125 \\) тыс. руб.\n\n\u003cstrong>Найти:\u003c/strong> \\( B \\).\n\u003ctab  4 года, 10% (\\( \\frac{11}{10} \\)).\nВ начале 3-го и 4-го годов пополнение на \\( x \\) млн руб. (\\( x \\) — целое).\nНачисленные проценты > 13 млн руб.\n\u003cstrong>Найти:\u003c/strong> наименьшее \\( x \\).\n\n\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Сумма на конец года\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( 20 \\cdot 1{,}1 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( 20 \\cdot 1{,}1^2 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( (20 \\cdot 1{,}1^2 + x) \\cdot 1{,}1 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\\( ((20 \\cdot 1{,}1^2 + x) \\cdot 1{,}1 + x) \\cdot 1{,}1 \\)\u003c/td>\u003c/tr>\n\u003c/table>\n\n\\( 20 \\cdot 1{,}4641 + x \\cdot 1{,}21 + x \\cdot 1{,}1 = 29{,}282 + 2{,}31x \\)\n\n\\( 29{,}282 + 2{,}31x - (20 + 2x) > 13 \\)\n\\( 9{,}282 + 0{,}31x > 13 \\)\n\\( 0{,}31x > 3{,}718 \\rightarrow x > 11{,}99\\ldots \\)\nНаименьшее целое \\( x = 12 \\).\n\n\u003cstrong>Ответ:\u003c/strong> 12 млн рублей.", "solutionImage": "", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( B = 20 \\) млн руб., 4 года, 10% (\\( \\frac{11}{10} \\)).\nВ начале 3-го и 4-го годов пополнение на \\( x \\) млн руб. (\\( x \\) — целое).\nНачисленные проценты > 13 млн руб.\n\u003cstrong>Найти:\u003c/strong> наименьшее \\( x \\)."}, {"d": "Составляем таблицу вклада", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Сумма на конец года\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( 20 \\cdot 1{,}1 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( 20 \\cdot 1{,}1^2 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( (20 \\cdot 1{,}1^2 + x) \\cdot 1{,}1 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\\( ((20 \\cdot \nА ещё через год, после начисления процентов, остаток на его счёте увеличился в 2,2 раза по сравнению с исходной суммой. \nКакую сумму (в млн руб.) Егор положил в банк первоначально, \nесли в конце каждого года банк начислял один и тот же процент годовых?", "taskImage": "", "answerText": "1.7", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\r\n\\( S \\) — исходная сумма вклада (млн руб.).\r\n\\( k = 1 + \\frac{r}{100} \\) — множитель начисления.\r\nЧерез год Егор добавил \\( 0.9S \\), остаток стал \\( 3.4 \\) млн руб.\r\nЕщё через год остаток увеличился в \\( 2.2 \\) раза по сравнению с исходной суммой.\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Вклад на конец года (млн руб.)\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot k \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>1 (после пополнения)\u003c/td>\u003ctd>\\( S \\cdot k + 0.9S = 3.4 \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (S \\cdot k + 0.9S) \\cdot k = 2.2S \\)\u003c/td>\u003c/tr>\r\n\u003c/table>\r\nСоставляем систему:\r\n\\( \\begin{cases} S(k + 0.9) = 3.4 \\\\ S(k + 0.9)k = 2.2S \\end{cases} \\)\r\n\r\nИз второго уравнения (после сокращения на \\(S\\):\r\n\\( (k + 0.9)k = 2.2 \\)\r\n\\( k^2 + 0.9k - 2.2 = 0 \\)\r\n\\( k = \\frac{-0.9 \\pm \\sqrt{0.81 + 8.8}}{2} = \\frac{-0.9 \\pm 3.1}{2} = 1.1 \\) – отрицательный корень посторонний\r\n\r\nПодставляем \\(k=1.1\\) в первое уравнение:\r\n\\( S(1.1 + 0.9) = 3.4 \\)\r\n\\( S = 1.7 \\)\r\n\r\n\u003cstrong>Ответ:\u003c/strong> Егор положил в банк первоначально \u003cstrong>1.7 млн рублей\u003c/strong>.\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "https://ege.sdamgia.ru/problem?id=553316", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S \\) — исходная сумма вклада (млн руб.).\n\\( k = 1 + \\frac{r}{100} \\) — множитель начисления.\nЧерез год Егор добавил \\( 0.9S \\), остаток стал \\( 3.4 \\) млн руб.\nЕщё через год остаток увеличился в \\( 2.2 \\) раза по сравнению с исходной суммой."}, {"d": "Составляем таблицу: сумма вклада по годам", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Вклад на конец года (млн руб.)\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot k \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>1 (после пополнения)\u003c/td>\u003ctd>\\( S \\cdot k + 0.9S = 3.4 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (S \\cdot k + 0.9S) \\cdot k = 2.2S \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Составляем систему", "res": "Составляем систему:\n\\( \\begin{cases} S(k + 0.9) = 3.4 \\\\ S(k + 0.9)k = 2.2S \\end{cases} \\)"}, {"d": "Решаем квадратное уравнение", "res": "Из второго уравнения (после сокращения на \\(S\\):\n\\( (k + 0.9)k = 2.2 \\)\n\\( k^2 + 0.9k - 2.2 = 0 \\)\n\\( k = \\frac{-0.9 \\pm \\sqrt{0.81 + 8.8}}{2} = \\frac{-0.9 \\pm 3.1}{2} = 1.1 \\) – отрицательный корень посторонний"}, {"d": "Подставляем известные значения", "res": "Подставляем \\(k=1.1\\) в первое уравнение:\n\\( S(1.1 + 0.9) = 3.4 \\)\n\\( S = 1.7 \\)"}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> Егор положил в банк первоначально \u003cstrong>1.7 млн рублей\u003c/strong>."}], "lvl": 2}, {"id": 1791319569007, "title": "05 аналог", "sectionName": "0 - ВКЛАДЫ", "difficulty": "basic", "taskText": "\u003ca href=\" https://ege.sdamgia.ru/problem?id=512434\" target=\"_blank\">🔍 АНАЛОГ  512434\u003c/a>\nВасилий кладет в банк 1 000 000 рублей под 10% годовых на 4 года (проценты начисляются один раз после истечения года) с правом докладывать три раза (в конце каждого года после начисления процентов) на счет фиксированного сумму 133 000 рублей. Какая максимальная сумма может быть на счете у Василия через 4 года?", "taskImage": "", "answerText": "1 948 353 рубля.", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\n\\( B = 1000 \\) тыс. руб., 4 года, 10% (\\( 1{,}1 \\)).\nМожно 3 раза (в конце 1-го, 2-го, 3-го годов) доложить по 133 тыс. руб.\n\u003cstrong>Найти:\u003c/strong> максимальную сумму через 4 года.\nСумма максимальна, если докладывать все 3 раза.\n\n\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Сумма на конец года (после начисления и пополнения)\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( 1000 \\cdot 1{,}1 + 133 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (1000 \\cdot 1{,}1 + 133) \\cdot 1{,}1 + 133 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( ((1000 \\cdot 1{,}1 + 133) \\cdot 1{,}1 + 133) \\cdot 1{,}1 + 133 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\\( (((1000 \\cdot 1{,}1 + 133) \\cdot 1{,}1 + 133) \\cdot 1{,}1 + 133) \\cdot 1{,}1 \\)\u003c/td>\u003c/tr>\n\u003c/table>\n\n\\( 1000 \\cdot 1{,}4641 + 133(1{,}331 + 1{,}21 + 1{,}1) \\)\n\n\\( 1464{,}1 + 133 \\cdot 3{,}641 = 1464{,}1 + 484{,}253 = 1948{,}353 \\) тыс. руб.\n\n\u003cstrong>Ответ:\u003c/strong> 1 948 353 рубля.", "solutionImage": "", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( B = 1000 \\) тыс. руб., 4 года, 10% (\\( 1{,}1 \\)).\nМожно 3 раза (в конце 1-го, 2-го, 3-го годов) доложить по 133 тыс. руб.\n\u003cstrong>Найти:\u003c/strong> максимальную сумму через 4 года.\nСумма максимальна, если докладывать все 3 раза."}, {"d": "Составляем таблицу вклада", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Сумма на конец года (после начисления и пополнения)\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( 1000 \\cdot 1{,}1 + 133 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (1000 \\cdot 1{,}1 + 133) \\cdot 1{,}1 + 133 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( ((1000 \\cdot 1{,}1 + 133) \\cdot 1{,}1 + 133) \\cdot 1{,}1 + 133 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\\( (((1000 \\cdot 1{,}1 + 133) \\cdot 1{,}1 + 133) \\cdot 1{,}1 + 133) \\cdot 1{,}1 \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Раскрываем скобки", "res": "\\( 1000 \\cdot 1{,}4641 + 133(1{,}331 + 1{,}21 + 1{,}1) \\)"}, {"d": "Считаем", "res": "\\( 1464{,}1 + 133 \\cdot 3{,}641 = 1464{,}1 + 484{,}253 = 1948{,}353 \\) тыс. руб."}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> 1 948 353 рубля."}], "byClaude": true, "lvl": 2}, {"id": 1772770307229, "title": "04", "sectionName": "0 - ВКЛАДЫ", "difficulty": "basic", "taskText": "Близнецы Саша и Паша положили в банк по 50000 рублей на три года под 10% годовых. \nОднако через год и Саша, и Паша сняли со своих счетов соответственно 10% и 20% имеющихся денег. \nЕщё через год каждый из них снял со своего счёта соответственно 20000 рублей и 15000 рублей. \nУ кого из братьев к концу третьего года на счету окажется большая сумма денег? На сколько рублей?", "taskImage": "", "answerText": "1155", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\r\n\\( B =50 \\) тыс. руб. — исходная сумма вклада (тыс. руб.). \r\n\\( r = 10\\% \\rightarrow  a = 1 + \\frac{10}{100} =  \\frac{11}{10} \\)\r\n\\( N = 3 \\) года\r\n\r\n\u003cstrong>Саша:\u003c/strong>\r\nснимает через год 10% от имеющихся, т.е. остается \\( 90\\% =\\frac{9}{10} \\)\r\nснимает через два года 20 тыс. руб.\r\n\u003cstrong>Паша:\u003c/strong>\r\nснимает через год 20% от имеющихся, т.е. остается \\( 80\\% = \\frac{4}{5} \\)\r\nснимает через два года 15 тыс. руб.\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Саша (тыс. руб.)\u003c/th>\u003cth>Паша (тыс. руб.)\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( B \\cdot \\frac{11}{10} \\cdot \\frac{9}{10} \\)\u003c/td>\u003ctd>\\( B \\cdot \\frac{11}{10} \\cdot \\frac{4}{5} \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (B \\cdot \\frac{11}{10} \\cdot \\frac{9}{10}) \\cdot \\frac{11}{10} - 20 \\)\u003c/td>\u003ctd>\\( (B \\cdot \\frac{11}{10} )\\cdot \\frac{4}{5} \\cdot \\frac{11}{10} - 15 \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( (B \\cdot \\frac{11}{10} \\cdot \\frac{9}{10} \\cdot \\frac{11}{10} - 20) \\cdot \\frac{11}{10} \\)\u003c/td>\u003ctd>\\( (B \\cdot \\frac{11}{10} \\cdot \\frac{4}{5} \\cdot \\frac{11}{10} - 15) \\cdot \\frac{11}{10} \\)\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\u003cstrong>Саша:\u003c/strong>\r\n\\( S = B \\cdot (\\frac{11}{10})^2 \\cdot \\frac{9}{10} \\cdot \\frac{11}{10} - 20 \\cdot \\frac{11}{10} = B \\cdot (\\frac{11}{10})^3 \\cdot \\frac{9}{10} - 22 \\)\r\n\u003cstrong>Паша:\u003c/strong>\r\n\\( P = B \\cdot (\\frac{11}{10})^2 \\cdot \\frac{4}{5} \\cdot \\frac{11}{10} - 15 \\cdot \\frac{11}{10} = B \\cdot (\\frac{11}{10})^3 \\cdot \\frac{4}{5} - 16.5 \\)\r\n\r\nНаходим разность:\r\n\\( S - P = B \\cdot (\\frac{11}{10})^3 \\cdot (\\frac{9}{10} - \\frac{4}{5}) - (22 - 16.5) = B \\cdot (\\frac{11}{10})^3 \\cdot \\frac{1}{10} - 5.5 \\)\r\n\r\nПодставляем \\( B = 50 \\):\r\n\\( S - P = 50 \\cdot \\frac{1331}{1000} \\cdot \\frac{1}{10} - 5.5 = 50 \\cdot \\frac{1331}{10000} - 5.5 = 1.155 \\) тыс. руб.\r\n\r\n\u003cstrong>Ответ:\u003c/strong> у Саши к концу третьего года сумма больше на \u003cstrong>1155 рублей\u003c/strong>.\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( B =50 \\) тыс. руб. — исходная сумма вклада (тыс. руб.). \n\\( r = 10\\% \\rightarrow  a = 1 + \\frac{10}{100} =  \\frac{11}{10} \\)\n\\( N = 3 \\) года\n\n\u003cstrong>Саша:\u003c/strong>\nснимает через год 10% от имеющихся, т.е. остается \\( 90\\% =\\frac{9}{10} \\)\nснимает через два года 20 тыс. руб.\n\n\u003cstrong>Паша:\u003c/strong>\nснимает через год 20% от имеющихся, т.е. остается \\( 80\\% = \\frac{4}{5} \\)\nснимает через два года 15 тыс. руб."}, {"d": "Составляем таблицу", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Саша (тыс. руб.)\u003c/th>\u003cth>Паша (тыс. руб.)\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( B \\cdot \\frac{11}{10} \\cdot \\frac{9}{10} \\)\u003c/td>\u003ctd>\\( B \\cdot \\frac{11}{10} \\cdot \\frac{4}{5} \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (B \\cdot \\frac{11}{10} \\cdot \\frac{9}{10}) \\cdot \\frac{11}{10} - 20 \\)\u003c/td>\u003ctd>\\( (B \\cdot \\frac{11}{10} )\\cdot \\frac{4}{5} \\cdot \\frac{11}{10} - 15 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( (B \\cdot \\frac{11}{10} \\cdot \\frac{9}{10} \\cdot \\frac{11}{10} - 20) \\cdot \\frac{11}{10} \\)\u003c/td>\u003ctd>\\( (B \\cdot \\frac{11}{10} \\cdot \\frac{4}{5} \\cdot \\frac{11}{10} - 15) \\cdot \\frac{11}{10} \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Саша", "res": "\u003cstrong>Саша:\u003c/strong>\n\\( S = B \\cdot (\\frac{11}{10})^2 \\cdot \\frac{9}{10} \\cdot \\frac{11}{10} - 20 \\cdot \\frac{11}{10} = B \\cdot (\\frac{11}{10})^3 \\cdot \\frac{9}{10} - 22 \\)"}, {"d": "Паша", "res": "\u003cstrong>Паша:\u003c/strong>\n\\( P = B \\cdot (\\frac{11}{10})^2 \\cdot \\frac{4}{5} \\cdot \\frac{11}{10} - 15 \\cdot \\frac{11}{10} = B \\cdot (\\frac{11}{10})^3 \\cdot \\frac{4}{5} - 16.5 \\)"}, {"d": "Находим разность", "res": "Находим разность:\n\\( S - P = B \\cdot (\\frac{11}{10})^3 \\cdot (\\frac{9}{10} - \\frac{4}{5}) - (22 - 16.5) = B \\cdot (\\frac{11}{10})^3 \\cdot \\frac{1}{10} - 5.5 \\)"}, {"d": "Подставляем известные значения", "res": "Подставляем \\( B = 50 \\):\n\\( S - P = 50 \\cdot \\frac{1331}{1000} \\cdot \\frac{1}{10} - 5.5 = 50 \\cdot \\frac{1331}{10000} - 5.5 = 1.155 \\) тыс. руб."}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> у Саши к концу третьего года сумма больше на \u003cstrong>1155 рублей\u003c/strong>."}], "lvl": 2}, {"id": 1772769928648, "title": "03", "sectionName": "0 - ВКЛАДЫ", "difficulty": "medium", "taskText": "Вклад планируется открыть на четыре года. \nПервоначальный вклад составляет целое число миллионов рублей. \nВ конце каждого года вклад увеличивается на 10% по сравнению с его размером в начале года. \nКроме этого, в начале третьего и четвёртого годов вклад ежегодно пополняется на 3 млн рублей. \nНайдите наименьший размер первоначального вклада, при котором через четыре года вклад будет больше 20 млн рублей.", "taskImage": "", "answerText": "9 000 000", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\n\\( B \\) — исходная сумма вклада (млн руб.).\n\\( B \\) — целое число млн руб.\n\\( r = 10\\% \\)\n\\( a = 1 + \\frac{10}{100} = 1 + \\frac{1}{10} = \\frac{11}{10} \\)\n\\( N = 4 \\) года\nПополнение в начале третьего и четвертого годов по 3 млн руб.\n\n\u003cstrong>Найти:\u003c/strong> наименьшее целое \\( B \\), при котором через 4 года вклад > 20 млн руб.\n\n\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Сумма вклада на конец года (после начисления и пополнения)\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( B \\cdot \\frac{11}{10} \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( B \\cdot (\\frac{11}{10})^2 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( (B \\cdot (\\frac{11}{10})^2 + 3) \\cdot \\frac{11}{10} \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\\( ((B \\cdot (\\frac{11}{10})^2 + 3) \\cdot \\frac{11}{10} + 3) \\cdot \\frac{11}{10} > 20 \\)\u003c/td>\u003c/tr>\n\u003c/table>\n\nСоставляем неравенство:\n\\( ((B \\cdot (\\frac{11}{10})^2 + 3) \\cdot \\frac{11}{10} + 3) \\cdot \\frac{11}{10} > 20 \\)\n\nРаскрываем скобки:\n\\( B \\cdot (\\frac{11}{10})^4 + 3 \\cdot (\\frac{11}{10})^2 + 3 \\cdot \\frac{11}{10} > 20 \\)\n\n\\( B \\cdot \\frac{14641}{10000} + 3 \\cdot \\frac{121}{100} + \\frac{33}{10} > 20 \\)\n\n\u003cb>Домножаем на общий знаменатель \\( 10000 \\):\u003c/b>\n\\( B \\cdot 14641 + 3 \\cdot 121 \\cdot 100 + 33 \\cdot 1000 > 200000 \\)\n\\( 14641B + 36300 + 33000 > 200000 \\)\n\\( 14641B > 130700 \\)\n\\( B > \\frac{130700}{14641} \\)\nВыделяем целую часть:\n\\( B > 8  \\frac{13572}{14641} \\)\nТак как \\( B \\) — целое число, наименьшее \\( B = 9 \\).\n\n\u003cstrong>Ответ:\u003c/strong> наименьший размер первоначального вклада составляет \u003cstrong>9 млн рублей\u003c/strong>.", "solutionImage": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAwAAAANCAYAAACdKY9CAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAAAdSURBVChTY/zw8/9/BhIAE5QmGoxqIAaMQA0MDADPTQQBgMxLcwAAAABJRU5ErkJggg==", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( B \\) — исходная сумма вклада (млн руб.).\n\\( B \\) — целое число млн руб.\n\\( r = 10\\% \\)\n\\( a = 1 + \\frac{10}{100} = 1 + \\frac{1}{10} = \\frac{11}{10} \\)\n\\( N = 4 \\) года\nПополнение в начале третьего и четвертого годов по 3 млн руб.\n\u003cstrong>Найти:\u003c/strong> наименьшее целое \\( B \\), при котором через 4 года вклад > 20 млн руб."}, {"d": "Составляем таблицу: сумма вклада по годам", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Сумма вклада на конец года (после начисления и пополнения)\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( B \\cdot \\frac{11}{10} \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( B \\cdot (\\frac{11}{10})^2 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( (B \\cdot (\\frac{11}{10})^2 + 3) \\cdot \\frac{11}{10} \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\\( ((B \\cdot (\\frac{11}{10})^2 + 3) \\cdot \\frac{11}{10} + 3) \\cdot \\frac{11}{10} > 20 \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Составляем неравенство", "res": "Составляем неравенство:\n\\( ((B \\cdot (\\frac{11}{10})^2 + 3) \\cdot \\frac{11}{10} + 3) \\cdot \\frac{11}{10} > 20 \\)"}, {"d": "Раскрываем скобки", "res": "Раскрываем скобки:\n\\( B \\cdot (\\frac{11}{10})^4 + 3 \\cdot (\\frac{11}{10})^2 + 3 \\cdot \\frac{11}{10} > 20 \\)"}, {"d": "Решаем неравенство", "res": "\\( B \\cdot \\frac{14641}{10000} + 3 \\cdot \\frac{121}{100} + \\frac{33}{10} > 20 \\)"}, {"d": "Домножаем на общий знаменатель \\( 10000 \\)", "res": "\u003cb>Домножаем на общий знаменатель \\( 10000 \\):\u003c/b>\n\\( B \\cdot 14641 + 3 \\cdot 121 \\cdot 100 + 33 \\cdot 1000 > 200000 \\)\n\\( 14641B + 36300 + 33000 > 200000 \\)\n\\( 14641B > 130700 \\)\n\\( B > \\frac{130700}{14641} \\)"}, {"d": "Выделяем целую часть", "res": "Выделяем целую часть:\n\\( B > 8  \\frac{13572}{14641} \\)\nТак как \\( B \\) — целое число, наименьшее \\( B = 9 \\)."}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> наименьший размер первоначального вклада составляет \u003cstrong>9 млн рублей\u003c/strong>."}], "lvl": 3}, {"id": 1784183396250, "title": "13 - 508585", "sectionName": "0 - ВКЛАДЫ", "difficulty": "medium", "taskText": "\u003ca href=https://ege.sdamgia.ru/problem?id=508585 \" target=\"_blank\">🔍 АНАЛОГ  508585\u003c/a>\r\nВ банк был положен вклад под 10% годовых. Через год, после начисления процентов, вкладчик снял со счета 2000 рублей, а еще через год (опять после начисления процентов) снова внес 2000 рублей. Вследствие этих действий через три года со времени открытия вклада вкладчик получил сумму меньшую, чем запланированная (если бы не было промежуточных операций со вкладом). На сколько рублей меньше запланированной суммы он получил?\r\n\u003cstrong>Ответ:\u003c/strong> на 220 рублей.\r\n", "taskImage": "", "answerText": "220", "answerImage": "", "solutionText": "\u003cb>Дано:\u003c/b>\r\n\\( S \\) — первоначальная сумма вклада (руб.).\r\n\\( r = 10\\% \\rightarrow a = 1 + \\frac{10}{100} = \\frac{11}{10} \\)\r\nСнятие в конце 1-го года: 2000 руб.\r\nПополнение в конце 2-го года: 2000 руб.\r\nСрок: 3 года.\r\n\r\n\u003cb>Если бы промежуточных операций не было\u003c/b>, через три года сумма составила бы:\r\n\\( S \\cdot \\left( \\frac{11}{10} \\right)^3 \\)\r\n\r\nА при наличии операций:\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Сумма на счете (после начисления и операций)\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot \\frac{11}{10} - 2000 \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( \\left( S \\cdot \\frac{11}{10} - 2000 \\right) \\cdot \\frac{11}{10} + 2000 \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( \\left( \\left( S \\cdot \\frac{11}{10} - 2000 \\right) \\cdot \\frac{11}{10} + 2000 \\right) \\cdot \\frac{11}{10}=\\)\r\n\r\n\\( =S \\cdot \\left( \\frac{11}{10} \\right)^3 - 2000 \\cdot \\left( \\frac{11}{10} \\right)^2 + 2000 \\cdot \\frac{11}{10} \\)\r\n\r\nсумма на конец 3-го года\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\u003cb>Разница между запланированной и реальной суммой:\u003c/b>\r\n\\( \\Delta = S \\cdot \\left( \\frac{11}{10} \\right)^3 - \\left( S \\cdot \\left( \\frac{11}{10} \\right)^3 - 2000 \\cdot \\left( \\frac{11}{10} \\right)^2 + 2000 \\cdot \\frac{11}{10} \\right) \\)\r\nРаскрываем скобки и приводим подобные:\r\n\\( \\Delta = 2000 \\cdot \\left( \\frac{11}{10} \\right)^2 - 2000 \\cdot \\frac{11}{10}= 220 \\)\r\n\r\n\u003cb>Ответ:\u003c/b> вкладчик получил на \u003cb>220 рублей\u003c/b> меньше запланированной суммы.\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "https://ege.sdamgia.ru/problem?id=508585", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cb>Дано:\u003c/b>\n\\( S \\) — первоначальная сумма вклада (руб.).\n\\( r = 10\\% \\rightarrow a = 1 + \\frac{10}{100} = \\frac{11}{10} \\)\nСнятие в конце 1-го года: 2000 руб.\nПополнение в конце 2-го года: 2000 руб.\nСрок: 3 года.\n\n\u003cb>Если бы промежуточных операций не было\u003c/b>, через три года сумма составила бы:\n\\( S \\cdot \\left( \\frac{11}{10} \\right)^3 \\)"}, {"d": "А при наличии операций — составляем таблицу", "res": "А при наличии операций:\n\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Сумма на счете (после начисления и операций)\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot \\frac{11}{10} - 2000 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( \\left( S \\cdot \\frac{11}{10} - 2000 \\right) \\cdot \\frac{11}{10} + 2000 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( \\left( \\left( S \\cdot \\frac{11}{10} - 2000 \\right) \\cdot \\frac{11}{10} + 2000 \\right) \\cdot \\frac{11}{10}=\\)\n\n\\( =S \\cdot \\left( \\frac{11}{10} \\right)^3 - 2000 \\cdot \\left( \\frac{11}{10} \\right)^2 + 2000 \\cdot \\frac{11}{10} \\)\n\nсумма на конец 3-го года\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Разница между запланированной и реальной суммой", "res": "\u003cb>Разница между запланированной и реальной суммой:\u003c/b>\n\\( \\Delta = S \\cdot \\left( \\frac{11}{10} \\right)^3 - \\left( S \\cdot \\left( \\frac{11}{10} \\right)^3 - 2000 \\cdot \\left( \\frac{11}{10} \\right)^2 + 2000 \\cdot \\frac{11}{10} \\right) \\)"}, {"d": "Раскрываем скобки и приводим подобные", "res": "Раскрываем скобки и приводим подобные:\n\\( \\Delta = 2000 \\cdot \\left( \\frac{11}{10} \\right)^2 - 2000 \\cdot \\frac{11}{10}= 220 \\)"}, {"d": "Записываем ответ", "res": "\u003cb>Ответ:\u003c/b> вкладчик получил на \u003cb>220 рублей\u003c/b> меньше запланированной суммы."}], "lvl": 3}, {"id": 1772769514124, "title": "06 - 158632 ЕГКР - НАЧИСЛЕНИЯ БАНКА", "sectionName": "0 - ВКЛАДЫ", "difficulty": "medium", "taskText": "Планируется открыть вклад в банке на четыре года на целое число миллионов рублей на следующих условиях:\n– банк в конце каждого года увеличивает сумму вклада на 10% по сравнению с суммой вклада на начало года;\n– начисленные банком проценты прибавляются к сумме вклада;\n– в начале третьего и четвёртого годов вкладчик пополняет вклад на 7 млн рублей (каждый год).\nНайдите наибольший размер первоначального вклада, при котором банк за четыре года начислит на вклад не больше 12 млн рублей.", "taskImage": "", "answerText": "21 000 000", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\r\n\\( S \\) — исходная сумма вклада (млн руб.). \\( S \\) — целое число млн руб.\r\n\\( r = 10\\% \\rightarrow  a = 1 + \\frac{10}{100} =  \\frac{11}{10} \\)\r\n\\( N = 4 \\) года\r\nПополнение в начале третьего и четвертого годов по 7 млн руб.\r\nНачисленные проценты за 4 года не больше 12 млн руб.\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Сумма вклада на конец года (после начисления и пополнения)\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot \\frac{11}{10} \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( S \\cdot (\\frac{11}{10})^2 \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( (S \\cdot (\\frac{11}{10})^2 + 7) \\cdot \\frac{11}{10} \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\\( ((S \\cdot (\\frac{11}{10})^2 + 7) \\cdot \\frac{11}{10} + 7) \\cdot \\frac{11}{10} \\) – ВКЛАД НА КОНЕЦ ГОДА\u003c/td>\u003c/tr>\r\n\u003c/table>\r\nРаскрываем скобки:\r\nВКЛАД НА КОНЕЦ ГОДА =\\( S \\cdot (\\frac{11}{10})^4 + 7 \\cdot (\\frac{11}{10})^2 + 7 \\cdot \\frac{11}{10} \\)\r\nВСЕ ВНЕСЕННЫЕ СРЕДСТВА ЗА 4 ГОДА:\r\n\\( S + 7 + 7 = S + 14 \\)\r\n\r\n❗ НАЧИСЛЕННЫЕ ПРОЦЕНТЫ = ВКЛАД НА КОНЕЦ 4-ГО ГОДА – ВСЕ ВНЕСЕННЫЕ СРЕДСТВА:\r\n\\( \\text{Проценты} = S \\cdot (\\frac{11}{10})^4 + 7 \\cdot (\\frac{11}{10})^2 + 7 \\cdot \\frac{11}{10}  –  (S + 14) = S \\cdot \\frac{14641}{10000} + 7 \\cdot \\frac{121}{100} + 7 \\cdot \\frac{11}{10} - S – 14\\le12 \\)\r\n\r\n\u003cstrong>Домножаем на общий знаменатель \\( 10000 \\) и приводим подобные:\u003c/strong>\r\n\\( 4641S + 21700 \\leq 120000 \\)\r\n\\( 4641S \\leq 98300 \\)\r\n\\( S \\leq \\frac{98300}{4641} \\)\r\n\\( S \\leq  21 \\frac{839}{4641} \\)\r\nТак как \\( S \\) — целое число, наибольшее \\( S = 21 \\).\r\n\r\n\u003cstrong>Ответ:\u003c/strong> наибольший размер первоначального вклада составляет \u003cstrong>21 млн рублей\u003c/strong>.\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S \\) — исходная сумма вклада (млн руб.). \\( S \\) — целое число млн руб.\n\\( r = 10\\% \\rightarrow  a = 1 + \\frac{10}{100} =  \\frac{11}{10} \\)\n\\( N = 4 \\) года\nПополнение в начале третьего и четвертого годов по 7 млн руб.\nНачисленные проценты за 4 года не больше 12 млн руб."}, {"d": "Составляем таблицу: сумма вклада по годам", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Сумма вклада на конец года (после начисления и пополнения)\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot \\frac{11}{10} \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( S \\cdot (\\frac{11}{10})^2 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( (S \\cdot (\\frac{11}{10})^2 + 7) \\cdot \\frac{11}{10} \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\\( ((S \\cdot (\\frac{11}{10})^2 + 7) \\cdot \\frac{11}{10} + 7) \\cdot \\frac{11}{10} \\) – ВКЛАД НА КОНЕЦ ГОДА\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Раскрываем скобки", "res": "Раскрываем скобки:\nВКЛАД НА КОНЕЦ ГОДА =\\( S \\cdot (\\frac{11}{10})^4 + 7 \\cdot (\\frac{11}{10})^2 + 7 \\cdot \\frac{11}{10} \\)"}, {"d": "ВСЕ ВНЕСЕННЫЕ СРЕДСТВА ЗА 4 ГОДА", "res": "ВСЕ ВНЕСЕННЫЕ СРЕДСТВА ЗА 4 ГОДА:\n\\( S + 7 + 7 = S + 14 \\)"}, {"d": "НАЧИСЛЕННЫЕ ПРОЦЕНТЫ = ВКЛАД НА КОНЕЦ 4-ГО ГОДА – ВСЕ ВНЕСЕННЫЕ СРЕДСТВА", "res": "❗ НАЧИСЛЕННЫЕ ПРОЦЕНТЫ = ВКЛАД НА КОНЕЦ 4-ГО ГОДА – ВСЕ ВНЕСЕННЫЕ СРЕДСТВА:\n\\( \\text{Проценты} = S \\cdot (\\frac{11}{10})^4 + 7 \\cdot (\\frac{11}{10})^2 + 7 \\cdot \\frac{11}{10}  –  (S + 14) = S \\cdot \\frac{14641}{10000} + 7 \\cdot \\frac{121}{100} + 7 \\cdot \\frac{11}{10} - S – 14\\le12 \\)"}, {"d": "Домножаем на общий знаменатель \\( 10000 \\) и приводим подобные", "res": "\u003cstrong>Домножаем на общий знаменатель \\( 10000 \\) и приводим подобные:\u003c/strong>\n\\( 4641S + 21700 \\leq 120000 \\)\n\\( 4641S \\leq 98300 \\)\n\\( S \\leq \\frac{98300}{4641} \\)\n\\( S \\leq  21 \\frac{839}{4641} \\)\nТак как \\( S \\) — целое число, наибольшее \\( S = 21 \\)."}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> наибольший размер первоначального вклада составляет \u003cstrong>21 млн рублей\u003c/strong>."}], "lvl": 3}, {"id": 1772770231589, "title": "05 - 512005", "sectionName": "0 - ВКЛАДЫ", "difficulty": "hard", "taskText": "\u003ca href=\" https://ege.sdamgia.ru/problem?id=512005 \" target=\"_blank\">🔍 АНАЛОГ  512005 \u003c/a>\nВладимир поместил в банк 3600 тысяч рублей под 10% годовых. \nВ конце каждого из первых двух лет хранения после начисления процентов он дополнительно вносил на счёт одну и ту же фиксированную сумму. \nК концу третьего года после начисления процентов оказалось, что размер вклада увеличился по сравнению с первоначальным на 48,5%. \nКакую сумму Владимир ежегодно добавлял к вкладу?", "taskImage": "", "answerText": "240 000", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\r\n\\( B \\) — исходная сумма вклада (тыс. руб.).\r\n\\( B = 3600 \\) тыс. руб.\r\n\\( r = 10\\% \\)\r\n\\( a = 1 + \\frac{10}{100} =  \\frac{11}{10} \\)\r\n\\( N = 3 \\) года\r\n\\( x \\) — сумма, добавляемая в конце первых двух лет (тыс. руб.).\r\nВклад увеличился на 48,5%, т.е. стал \\(148.5\\%  \\rightarrow B \\cdot \\frac{148.5}{100} = B \\cdot \\frac{1485}{1000} = B \\cdot \\frac{297}{200} \\)\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Сумма вклада на конец года (после начисления и пополнения)\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( B \\cdot \\frac{11}{10} + x \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (B \\cdot \\frac{11}{10} + x) \\cdot \\frac{11}{10} + x \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( ((B \\cdot \\frac{11}{10} + x) \\cdot \\frac{11}{10} + x) \\cdot \\frac{11}{10} = B \\cdot \\frac{297}{200} \\) – ИТОГОВОЕ УРАВНЕНИЕ\u003c/td>\u003c/tr>\r\n\u003c/table>\r\nРаскрываем скобки:\r\n\\( B \\cdot (\\frac{11}{10})^3 + x \\cdot (\\frac{11}{10})^2 + x \\cdot \\frac{11}{10} = B \\cdot \\frac{297}{200} \\)\r\n\r\n\\( B \\cdot \\frac{1331}{1000} + x \\cdot \\frac{121}{100} + x \\cdot \\frac{11}{10} = B \\cdot \\frac{297}{200} \\)\r\n\r\n\u003cstrong>Домножаем на общий знаменатель \\( 1000 \\):\u003c/strong>\r\n\\( B \\cdot 1331 + x \\cdot 121 \\cdot 10 + x \\cdot 11 \\cdot 100 = B \\cdot 297 \\cdot 5 \\)\r\n\\( 1331B + 1210x + 1100x = 1485B \\)\r\n\\( 2310x = 154B \\)\r\n\\( x = \\frac{1}{15}В \\)\r\nПодставляем \\( B = 3600 \\):\r\n\\( x = \\frac{3600}{15} = 240 \\)\r\n\r\n\u003cstrong>Ответ:\u003c/strong> Владимир ежегодно добавлял к вкладу \u003cstrong>240 000 рублей\u003c/strong>.\r\n", "solutionImage": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAYAAAAGCAYAAADgzO9IAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAAAZSURBVBhXY/zw8/9/BiyACUpjANpLMDAAAEO3A/Og08f+AAAAAElFTkSuQmCC", "drawingImage": "", "solutionLink": "https://ege.sdamgia.ru/problem?id=512005", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( B \\) — исходная сумма вклада (тыс. руб.).\n\\( B = 3600 \\) тыс. руб.\n\\( r = 10\\% \\)\n\\( a = 1 + \\frac{10}{100} =  \\frac{11}{10} \\)\n\\( N = 3 \\) года\n\\( x \\) — сумма, добавляемая в конце первых двух лет (тыс. руб.).\nВклад увеличился на 48,5%, т.е. стал \\(148.5\\%  \\rightarrow B \\cdot \\frac{148.5}{100} = B \\cdot \\frac{1485}{1000} = B \\cdot \\frac{297}{200} \\)"}, {"d": "Составляем таблицу: сумма вклада по годам", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Сумма вклада на конец года (после начисления и пополнения)\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( B \\cdot \\frac{11}{10} + x \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (B \\cdot \\frac{11}{10} + x) \\cdot \\frac{11}{10} + x \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( ((B \\cdot \\frac{11}{10} + x) \\cdot \\frac{11}{10} + x) \\cdot \\frac{11}{10} = B \\cdot \\frac{297}{200} \\) – ИТОГОВОЕ УРАВНЕНИЕ\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Раскрываем скобки", "res": "Раскрываем скобки:\n\\( B \\cdot (\\frac{11}{10})^3 + x \\cdot (\\frac{11}{10})^2 + x \\cdot \\frac{11}{10} = B \\cdot \\frac{297}{200} \\)"}, {"d": "Преобразуем и считаем", "res": "\\( B \\cdot \\frac{1331}{1000} + x \\cdot \\frac{121}{100} + x \\cdot \\frac{11}{10} = B \\cdot \\frac{297}{200} \\)"}, {"d": "Домножаем на общий знаменатель \\( 1000 \\)", "res": "\u003cstrong>Домножаем на общий знаменатель \\( 1000 \\):\u003c/strong>\n\\( B \\cdot 1331 + x \\cdot 121 \\cdot 10 + x \\cdot 11 \\cdot 100 = B \\cdot 297 \\cdot 5 \\)\n\\( 1331B + 1210x + 1100x = 1485B \\)\n\\( 2310x = 154B \\)"}, {"d": "Подставляем известные значения", "res": "\\( x = \\frac{1}{15}В \\)\nПодставляем \\( B = 3600 \\):\n\\( x = \\frac{3600}{15} = 240 \\)"}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> Владимир ежегодно добавлял к вкладу \u003cstrong>240 000 рублей\u003c/strong>."}], "lvl": 4}, {"id": 1791320006251, "title": "17 аналог", "sectionName": "0 - ВКЛАДЫ", "difficulty": "hard", "taskText": "\u003ca href=\"https://ege.sdamgia.ru/problem?id=558932\" target=\"_blank\">🔍 АНАЛОГ  558932 \u003c/a>\nМарина и Надежда открыли вклады одинакового размера в одном из банков на четыре года. Ежегодно в течение первых трёх лет банк увеличивал каждый вклад на 10%, а в конце четвёртого года на 12% по сравнению с его размером в начале года. Кроме этого, в начале третьего и четвёртого годов Марина ежегодно пополняла вклад на \\( x \\) рублей, где \\( x \\) — натуральное число. Надежда пополняла свой вклад только в начале третьего года, но на сумму \\( 2x \\) рублей. Найдите наименьшее значение \\( x \\), при котором через четыре года на счету Надежды стало на целое число десятков рублей больше, чем у Марины.", "taskImage": "", "answerText": "625", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\n\\( B \\) — одинаковые вклады, 4 года.\nГоды 1–3: 10% (\\( \\frac{11}{10} \\)), год 4: 12% (\\( \\frac{28}{25} \\)).\nМарина: \\( +x \\) в начале 3-го и 4-го года. Надежда: \\( +2x \\) в начале 3-го года.\n\u003cstrong>Найти:\u003c/strong> наименьшее натуральное \\( x \\), при котором у Надежды на целое число десятков рублей больше.\n\n\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Марина\u003c/th>\u003cth>Надежда\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( B \\cdot 1{,}1 \\)\u003c/td>\u003ctd>\\( B \\cdot 1{,}1 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( B \\cdot 1{,}1^2 \\)\u003c/td>\u003ctd>\\( B \\cdot 1{,}1^2 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( (B \\cdot 1{,}1^2 + x) \\cdot 1{,}1 \\)\u003c/td>\u003ctd>\\( (B \\cdot 1{,}1^2 + 2x) \\cdot 1{,}1 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\\( ((B \\cdot 1{,}1^2 + x) \\cdot 1{,}1 + x) \\cdot 1{,}12 \\)\u003c/td>\u003ctd>\\( (B \\cdot 1{,}1^2 + 2x) \\cdot 1{,}1 \\cdot 1{,}12 \\)\u003c/td>\u003c/tr>\n\u003c/table>\n\nМарина: \\( x \\cdot 1{,}1 \\cdot 1{,}12 + x \\cdot 1{,}12 = 1{,}232x + 1{,}12x = 2{,}352x \\)\nНадежда: \\( 2x \\cdot 1{,}1 \\cdot 1{,}12 = 2{,}464x \\)\nРазность: \\( 2{,}464x - 2{,}352x = 0{,}112x \\)\n\n\\( 0{,}112x = 10k \\rightarrow \\frac{112x}{1000} = 10k \\rightarrow 112x = 10000k \\rightarrow 7x = 625k \\)\n7 и 625 взаимно просты \\( \\Rightarrow x \\) делится на 625.\nНаименьшее \\( x = 625 \\) (разность \\( = 70 \\) руб.).\n\n\u003cstrong>Ответ:\u003c/strong> 625.", "solutionImage": "", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( B \\) — одинаковые вклады, 4 года.\nГоды 1–3: 10% (\\( \\frac{11}{10} \\)), год 4: 12% (\\( \\frac{28}{25} \\)).\nМарина: \\( +x \\) в начале 3-го и 4-го года. Надежда: \\( +2x \\) в начале 3-го года.\n\u003cstrong>Найти:\u003c/strong> наименьшее натуральное \\( x \\), при котором у Надежды на целое число десятков рублей больше."}, {"d": "Составляем таблицу вкладов", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Марина\u003c/th>\u003cth>Надежда\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( B \\cdot 1{,}1 \\)\u003c/td>\u003ctd>\\( B \\cdot 1{,}1 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( B \\cdot 1{,}1^2 \\)\u003c/td>\u003ctd>\\( B \\cdot 1{,}1^2 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( (B \\cdot 1{,}1^2 + x) \\cdot 1{,}1 \\)\u003c/td>\u003ctd>\\( (B \\cdot 1{,}1^2 + 2x) \\cdot 1{,}1 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\\( ((B \\cdot 1{,}1^2 + x) \\cdot 1{,}1 + x) \\cdot 1{,}12 \\)\u003c/td>\u003ctd>\\( (B \\cdot 1{,}1^2 + 2x) \\cdot 1{,}1 \\cdot 1{,}12 \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Считаем разность (вклады B сокращаются)", "res": "Марина: \\( x \\cdot 1{,}1 \\cdot 1{,}12 + x \\cdot 1{,}12 = 1{,}232x + 1{,}12x = 2{,}352x \\)\nНадежда: \\( 2x \\cdot 1{,}1 \\cdot 1{,}12 = 2{,}464x \\)\nРазность: \\( 2{,}464x - 2{,}352x = 0{,}112x \\)"}, {"d": "Составляем условие делимости", "res": "\\( 0{,}112x = 10k \\rightarrow \\frac{112x}{ nРаскрываем скобки\r\nВклад на конец 4-го года: \\(  S \\cdot (\\frac{11}{10})^4 + 400(\\frac{11}{10})^3 + 400(\\frac{11}{10})^2 + 400 \\cdot \\frac{11}{10} \\)\r\nВсе внесенные средства за 4 года: \\( S + 400 + 400 + 400 = S + 1200 \\)\r\n\r\n❗ НАЧИСЛЕННЫЕ ПРОЦЕНТЫ = ВКЛАД НА КОНЕЦ 4-ГО ГОДА – ВСЕ ВНЕСЕННЫЕ СРЕДСТВА:\r\n\\( \\text{Проценты} = S \\cdot (\\frac{11}{10})^4 + 400(\\frac{11}{10})^3 + 400(\\frac{11}{10})^2 + 400 \\cdot \\frac{11}{10} - S - 1200 >800\\)\r\n\r\n\\( S \\cdot \\frac{14641}{10000} + 400 \\cdot \\frac{1331}{1000} + 400 \\cdot \\frac{121}{100} + 400 \\cdot \\frac{11}{10} - S - 1200 >800\\)\r\n\r\n\u003cstrong>Домножаем на общий знаменатель \\( 10000 \\):\u003c/strong>\r\n\\( S \\cdot 14641 + 400 \\cdot 1331 \\cdot 10 + 400 \\cdot 121 \\cdot 100 + 400 \\cdot 11 \\cdot 1000 - S \\cdot 10000 - 1200 \\cdot 10000  >800 \\cdot 10000\\)\r\n\\( 4641S + 2564000 > 8000000 \\)\r\n\\( S > \\frac{5436000}{4641} \\)\r\n\\( S > 1171 \\frac{1389}{4641} \\)\r\n\r\nТак как \\( S \\) — целое число сотен тысяч рублей\\(\\rightarrow\\)наименьшее \\( S \\) (кратное 100), большее \\( 1171  \\frac{1389}{4641} \\), это \\( S = 1200 \\) тыс. руб.\r\n\r\n\u003cstrong>Ответ:\u003c/strong> \\( 1200 \\) тыс. руб. = \u003cstrong>1 200 000 рублей\u003c/strong>.\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S \\) — исходная сумма вклада (тыс. руб.).\n\\( S \\) — целое число сотен тысяч рублей, т.е. кратно 100.\n\\( r = 10\\% \\)\n\\( a = 1 + \\frac{10}{100} = \\frac{11}{10} \\)\n\\( N = 4 \\) года\nПополнение в начале второго, третьего и четвертого годов по 400 тыс. руб.\nНачисленные проценты за 4 года больше 800 тыс. руб."}, {"d": "Составляем таблицу: сумма вклада по годам", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Сумма вклада на конец года (после начисления и пополнения)\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot \\frac{11}{10} \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (S \\cdot \\frac{11}{10} + 400) \\cdot \\frac{11}{10} \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( ((S \\cdot \\frac{11}{10} + 400) \\cdot \\frac{11}{10} + 400) \\cdot \\frac{11}{10} \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\\( (((S \\cdot \\frac{11}{10} + 400) \\cdot \\frac{11}{10} + 400) \\cdot \\frac{11}{10} + 400) \\cdot \\frac{11}{10} \\) – ВКЛАД НА КОНЕЦ 4-ГО ГОДА\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Раскрываем скобки", "res": "Раскрываем скобки\nВклад на конец 4-го года: \\(  S \\cdot (\\frac{11}{10})^4 + 400(\\frac{11}{10})^3 + 400(\\frac{11}{10})^2 + 400 \\cdot \\frac{11}{10} \\)\nВсе внесенные средства за 4 года: \\( S + 400 + 400 + 400 = S + 1200 \\)"}, {"d": "НАЧИСЛЕННЫЕ ПРОЦЕНТЫ = ВКЛАД НА КОНЕЦ 4-ГО ГОДА – ВСЕ ВНЕСЕННЫЕ СРЕДСТВА", "res": "❗ НАЧИСЛЕННЫЕ ПРОЦЕНТЫ = ВКЛАД НА КОНЕЦ 4-ГО ГОДА – ВСЕ ВНЕСЕННЫЕ СРЕДСТВА:\n\\( \\text{Проценты} = S \\cdot (\\frac{11}{10})^4 + 400(\\frac{11}{10})^3 + 400(\\frac{11}{10})^2 + 400 \\cdot \\frac{11}{10} - S - 1200 >800\\)"}, {"d": "Преобразуем и считаем", "res": "\\( S \\cdot \\frac{14641}{10000} + 400 \\cdot \\frac{1331}{1000} + 400 \\cdot \\frac{121}{100} + 400 \\cdot \\frac{11}{10} - S - 1200 >800\\)"}, {"d": "Домножаем на общий знаменатель \\( 10000 \\)", "res": "\u003cstrong>Домножаем на общий знаменатель \\( 10000 \\):\u003c/strong>\n\\( S \\cdot 14641 + 400 \\cdot 1331 \\cdot 10 + 400 \\cdot 121 \\cdot 100 + 400 \\cdot 11 \\cdot 1000 - S \\cdot 10000 - 1200 \\cdot 10000  >800 \\cdot 10000\\)\n\\( 4641S + 2564000 > 8000000 \\)\n\\( S > \\frac{5436000}{4641} \\)\n\\( S > 1171 \\frac{1389}{4641} \\)"}, {"d": "Находим \\(S\\)", "res": "Так как \\( S \\) — целое число сотен тысяч рублей\\(\\rightarrow\\)наименьшее \\( S \\) (кратное 100), большее \\( 1171  \\frac{1389}{4641} \\), это \\( S = 1200 \\) тыс. руб."}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> \\( 1200 \\) тыс. руб. = \u003cstrong>1 200 000 рублей\u003c/strong>."}], "lvl": 4}, {"id": 1772953814372, "title": "11 - 147815 РАНЫЕ ПРОЦЕНТЫ", "sectionName": "0 - ВКЛАДЫ", "difficulty": "hard", "taskText": "В январе 2028 года Михаил планирует открыть вклад на 3 года на целое число миллионов рублей, \nа в январе 2029 и 2030 годов дополнительно вносить на этот вклад ещё по 1 млн рублей. \nБанк предложил Михаилу два варианта условий по вкладу. \nВ обоих вариантах условий в декабре каждого года действия вклада начисляются проценты на сумму, находящуюся на вкладе. Начисленные проценты при этом остаются на вкладе, увеличивая сумму вклада. \nПо первому варианту процентная ставка по годам составляет 10, 15 и 20 процентов соответственно, \nа по второму — 20, 15 и 10 процентов. \nМихаил выбрал наиболее выгодное предложение. \nНайдите наименьший первоначальный взнос по вкладу, \nесли при закрытии вклада через 3 года итоговая сумма должна составить не менее 11,5 млн рублей. \nОтвет дайте в миллионах рублей.", "taskImage": "", "answerText": "6", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\r\n\\( S \\) — исходная сумма вклада (млн руб.). \\( S \\) — целое число млн руб.\r\nПополнения: в январе 2029 и 2030 годов по 1 млн руб. (после начисления процентов (которые в декабре), т.е. в начале 2-го и 3-го годов).\r\nВариант 1: проценты 10%, 15%, 20% (\\( a_1 = 1.1 \\), \\( a_2 = 1.15 \\), \\( a_3 = 1.2 \\)).\r\nВариант 2: проценты 20%, 15%, 10% (\\( b_1 = 1.2 \\), \\( b_2 = 1.15 \\), \\( b_3 = 1.1 \\)).\r\n\u003cstrong>Найти:\u003c/strong> \r\nНаименьшее целое \\( S \\), при котором итоговая сумма \\( \\ge 11.5 \\) млн руб.\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Вариант 1 (млн руб.)\u003c/th>\u003cth>Вариант 2 (млн руб.)\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot 1.1 \\)\u003c/td>\u003ctd>\\( S \\cdo 6}{5} \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( 20 \\cdot (\\frac{6}{5})^2 \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( (20 \\cdot (\\frac{6}{5})^2 - m) \\cdot \\frac{6}{5} \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\\( ((20 \\cdot (\\frac{6}{5})^2 - m) \\cdot \\frac{6}{5} - m) \\cdot \\frac{6}{5} \\)\u003c/td>\u003c/tr>\r\n\u003c/table>\r\nВклад на конец 4-го года:\r\n\\( 20 \\cdot (\\frac{6}{5})^4 - m \\cdot (\\frac{6}{5})^2 - m \\cdot \\frac{6}{5} \\)\r\nВсе внесенные средства за 4 года: \\( 20 \\) млн руб.\r\n\r\n❗ НАЧИСЛЕННЫЕ ПРОЦЕНТЫ = ВКЛАД НА КОНЕЦ 4-ГО ГОДА + СНЯТЫЕ СРЕДСТВА – ВСЕ ВНЕСЕННЫЕ СРЕДСТВА:\r\n\\( \\text{Проценты} = 20 \\cdot (\\frac{6}{5})^4 - m \\cdot (\\frac{6}{5})^2 - m \\cdot \\frac{6}{5} + 2m - 20 \u003c 10 \\)\r\n\\(20 \\cdot \\frac{1296}{625} - m \\cdot \\frac{36}{25} - m \\cdot \\frac{6}{5} + 2m - 20 \u003c10\\)\r\n\r\nДомножаем на общий знаменатель \\( 625 \\):\r\n\\(  20 \\cdot 1296 - m \\cdot 36 \\cdot 25 - m \\cdot 6 \\cdot 125 + 2m \\cdot 625 - 20 \\cdot 625\u003c6250 \\)\r\n\\( 13420 - 400m \u003c 6250 \\)\r\n\\( m > \\frac{7170}{400} \\)\r\n\\( m >  17  \\frac{37}{40} \\)\r\nТак как \\( m \\) — целое число, наименьшее \\( m = 18 \\).\r\n\u003cstrong>Ответ:\u003c/strong> наименьшее целое значение \\( m \\) равно \u003cstrong>18 млн рублей\u003c/strong>.\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "https://3.shkolkovo.online/catalog/11066/83759", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( B = 20 \\) млн руб. — первоначальный вклад.\n\\( r = 20\\% \\)\n\\( a = 1 + \\frac{20}{100} = \\frac{6}{5} \\)\n\\( N = 4 \\) года\nСнятие в начале третьего и четвертого годов по \\( m \\) млн руб. (целое число).\nВсего снято \\( 2m \\) млн руб.\nБанк начислит за 4 года менее 10 млн руб."}, {"d": "С
