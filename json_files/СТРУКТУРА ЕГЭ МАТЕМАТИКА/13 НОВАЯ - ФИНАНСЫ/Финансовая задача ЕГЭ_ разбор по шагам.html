.sdamgia.ru/problem?id=506951 \" target=\"_blank\">🔍 АНАЛОГ  506951 \u003c/a>\nБанк под определенный процент принял некоторую сумму. \nЧерез год четверть накопленной суммы была снята со счета. Банк увеличил процент годовых на 40 процентных пунктов (то есть увеличил ставку \\( \\alpha \\% \\) до \\( (\\alpha+40) \\% \\)). \nК концу следующего года накопленная сумма в 1,44 раза превысила первоначальный вклад. Каков процент новых годовых?", "taskImage": "", "answerText": "60", "answerImage": "", "solutionText": "\u003cb>Дано:\u003c/b>\r\n\\( S \\) — первоначальная сумма вклада.\r\nСтавка в первый год: \\( \\alpha\\% \\), множитель \\( c = 1 + \\frac{\\alpha}{100} \\).\r\nСтавка во второй год: \\( (\\alpha+40)\\% \\), множитель \\( d = 1 + \\frac{\\alpha+40}{100} = c + 0,4 \\).\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Сумма на счете\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot c - \\frac{1}{4} \\cdot S \\cdot c = \\frac{3}{4} S \\cdot c \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( \\frac{3}{4} S \\cdot c \\cdot d \\)\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\u003cb>Условие:\u003c/b> к концу второго года сумма стала в 1,44 раза больше первоначальной:\r\n\\( \\frac{3}{4} S \\cdot c \\cdot d = 1,44 \\cdot S \\)\r\n\r\nСокращаем \\( S \\):\r\n\\( \\frac{3}{4} c d = 1,44 \\)\r\n\r\nТак как \\( d = c + 0,4 \\), получаем:\r\n\\( \\frac{3}{4} c(c + 0,4) = 1,44 \\)\r\n\\( c^2 + 0,4c - 1,92 = 0 \\)\r\n\\( \\sqrt{D} = 2,8 \\)\r\n\\( c = \\frac{-0,4 + 2,8}{2} = 1,2 \\) (отрицательный корень отбрасываем)\r\nТогда \\( d = c + 0,4 =1,2 + 0,4 = 1,6 \\)\r\n\r\nПоскольку \\( d = 1 + \\frac{\\alpha+40}{100}\\):\r\n\\( 1.6 = 1 + \\frac{\\alpha+40}{100} \\rightarrow \\) новый процент: \\( \\alpha+40=60 \\)\r\n\r\n\u003cb>Ответ:\u003c/b> 60%.\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "https://ege.sdamgia.ru/problem?id=506951", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cb>Дано:\u003c/b>\n\\( S \\) — первоначальная сумма вклада.\nСтавка в первый год: \\( \\alpha\\% \\), множитель \\( c = 1 + \\frac{\\alpha}{100} \\).\nСтавка во второй год: \\( (\\alpha+40)\\% \\), множитель \\( d = 1 + \\frac{\\alpha+40}{100} = c + 0,4 \\)."}, {"d": "Составляем таблицу", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Сумма на счете\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot c - \\frac{1}{4} \\cdot S \\cdot c = \\frac{3}{4} S \\cdot c \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( \\frac{3}{4} S \\cdot c \\cdot d \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Условие: к концу второго года сумма стала в 1,44 раза больше первоначальной", "res": "\u003cb>Условие:\u003c/b> к концу второго года сумма стала в 1,44 раза больше первоначальной:\n\\( \\frac{3}{4} S \\cdot c \\cdot d = 1,44 \\cdot S \\)"}, {"d": "Сокращаем ", "res": "Сокращаем \\( S \\):\n\\( \\frac{3}{4} c d = 1,44 \\)"}, {"d": "Так как , получаем", "res": "Так как \\( d = c + 0,4 \\), получаем:\n\\( \\frac{3}{4} c(c + 0,4) = 1,44 \\)\n\\( c^2 + 0,4c - 1,92 = 0 \\)\n\\( \\sqrt{D} = 2,8 \\)\n\\( c = \\frac{-0,4 + 2,8}{2} = 1,2 \\) (отрицательный корень отбрасываем)\nТогда \\( d = c + 0,4 =1,2 + 0,4 = 1,6 \\)"}, {"d": "Поскольку ", "res": "Поскольку \\( d = 1 + \\frac{\\alpha+40}{100}\\):\n\\( 1.6 = 1 + \\frac{\\alpha+40}{100} \\rightarrow \\) новый процент: \\( \\alpha+40=60 \\)"}, {"d": "Записываем ответ", "res": "\u003cb>Ответ:\u003c/b> 60%."}], "lvl": 5}, {"id": 1791320228662, "title": "191 аналог", "sectionName": "1 - ВКЛАДЫ - НЕФОРМАТ", "difficulty": "basic", "taskText": "\u003ca href=\" https://ege.sdamgia.ru/problem?id=530067\" target=\"_blank\">🔍 АНАЛОГ  530067\u003c/a>\n1 апреля 2019 г. Андрей Петрович положил 10 000 рублей на банковский вклад сроком на 1 год с ежемесячным начислением процентов и капитализацией под 21% годовых. Это означает, что первого числа каждого месяца сумма вклада увеличивается на одно и то же количество процентов, рассчитанное таким образом, что за 12 месяцев она увеличится ровно на 21%. Через сколько месяцев сумма вклада впервые превысит 11 000 рублей?", "taskImage": "", "answerText": "7", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\n\\( B = 10000 \\) руб., годовой множитель \\( 1{,}21 \\).\nМесячный множитель: \\( a_{\\text{мес}} = 1{,}21^{\\frac{1}{12}} = (1{,}1^2)^{\\frac{1}{12}} = 1{,}1^{\\frac{1}{6}} \\).\n\u003cstrong>Найти:\u003c/strong> наименьшее \\( m \\), при котором вклад > 11 000 руб.\n\n\\( B_m = 10000 \\cdot 1{,}1^{\\frac{m}{6}} \\)\n\n\\( 10000 \\cdot 1{,}1^{\\frac{m}{6}} > 11000 \\)\n\\( 1{,}1^{\\frac{m}{6}} > 1{,}1 \\)\n\\( \\frac{m}{6} > 1 \\rightarrow m > 6 \\)\nНаименьшее целое \\( m = 7 \\).\n\n\u003cstrong>Ответ:\u003c/strong> через 7 месяцев.", "solutionImage": "", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( B = 10000 \\) руб., годовой множитель \\( 1{,}21 \\).\nМесячный множитель: \\( a_{\\text{мес}} = 1{,}21^{\\frac{1}{12}} = (1{,}1^2)^{\\frac{1}{12}} = 1{,}1^{\\frac{1}{6}} \\).\n\u003cstrong>Найти:\u003c/strong> наименьшее \\( m \\), при котором вклад > 11 000 руб."}, {"d": "Записываем сумму через m месяцев", "res": "\\( B_m = 10000 \\cdot 1{,}1^{\\frac{m}{6}} \\)"}, {"d": "Составляем неравенство", "res": "\\( 10000 \\cdot 1{,}1^{\\frac{m}{6}} > 11000 \\)\n\\( 1{,}1^{\\frac{m}{6}} > 1{,}1 \\)\n\\( \\frac{m}{6} > 1 \\rightarrow m > 6 \\)\nНаименьшее целое \\( m = 7 \\)."}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> через 7 месяцев."}], "byClaude": true, "lvl": 1}, {"id": 1784184109788, "title": "191 - 529734 ПЕРЕСЧЕТ ГОДОВОЙ СТАВКИ НА МЕСЯЧНУЮ (ЛАРИН)", "sectionName": "1 - ВКЛАДЫ - НЕФОРМАТ", "difficulty": "basic", "taskText": "1 апреля 2017 г. Андрей Петрович положил 10 000 рублей на банковский вклад сроком на 1 год с ежемесячным начислением процентов и капитализацией под \\( a\\% \\) годовых. Это означает, что первого числа каждого месяца сумма вклада увеличивается на одно и то же количество процентов, рассчитанное таким образом, что за 12 месяцев она увеличится ровно на \\( a\\% \\). Через 6 месяцев сумма вклада составила 10 500 рублей. Найдите \\( a \\).", "taskImage": "", "answerText": "10,25", "answerImage": "", "solutionText": "\u003cb>Дано:\u003c/b>\n\\( S = 10000 \\) руб. — первоначальный вклад.\nСрок: 1 год = 12 месяцев.\nЕжемесячное начисление процентов с капитализацией.\nГодовая ставка: \\( a\\% \\), множитель \\( A = 1 + \\frac{a}{100} \\).\nМесячный множитель: \\( q = A^{\\frac{1}{12}} \\).\nЧерез 6 месяцев сумма: \\( S_6 = 10500 \\) руб.\n\u003cb>Найти:\u003c/b> \\( a \\).\n\n\u003cb>Решение:\u003c/b>\nЧерез 6 месяцев сумма на счете:\n\\( S_6 = S \\cdot q^6 \\)\n\\( 10500 = 10000 \\cdot q^6 \\)\n\\( q^6 = \\frac{10500}{10000} = 1,05 \\)\n\\( q = (1,05)^{\\frac{1}{6}} \\)\n\nТак как \\( q = A^{\\frac{1}{12}} \\), то:\n\\( A^{\\frac{1}{12}} = (1,05)^{\\frac{1}{6}} \\)\n\nВозводим обе части в 12-ю степень:\n\\( A = (1,05)^2 = 1,1025 \\)\n\nПоскольку \\( A = 1 + \\frac{a}{100} = 1,1025 \\):\n\\( \\frac{a}{100} = 0,1025 \\)\n\\( a = 10,25 \\)\n\u003cstrong>Ответ:\u003c/strong> 10,25%.", "solutionImage": "", "drawingImage": "", "solutionLink": "https://ege.sdamgia.ru/problem?id=529734", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cb>Дано:\u003c/b>\n\\( S = 10000 \\) руб. — первоначальный вклад.\nСрок: 1 год = 12 месяцев.\nЕжемесячное начисление процентов с капитализацией.\nГодовая ставка: \\( a\\% \\), множитель \\( A = 1 + \\frac{a}{100} \\).\nМесячный множитель: \\( q = A^{\\frac{1}{12}} \\).\nЧерез 6 месяцев сумма: \\( S_6 = 10500 \\) руб.\n\u003cb>Найти:\u003c/b> \\( a \\)."}, {"d": "Решение", "res": "\u003cb>Решение:\u003c/b>\nЧерез 6 месяцев сумма на счете:\n\\( S_6 = S \\cdot q^6 \\)\n\\( 10500 = 10000 \\cdot q^6 \\)\n\\( q^6 = \\frac{10500}{10000} = 1,05 \\)\n\\( q = (1,05)^{\\frac{1}{6}} \\)"}, {"d": "Так как , то", "res": "Так как \\( q = A^{\\frac{1}{12}} \\), то:\n\\( A^{\\frac{1}{12}} = (1,05)^{\\frac{1}{6}} \\)"}, {"d": "Возводим обе части в 12-ю степень", "res": "Возводим обе части в 12-ю степень:\n\\( A = (1,05)^2 = 1,1025 \\)"}, {"d": "Находим \\(a\\)", "res": "Поскольку \\( A = 1 + \\frac{a}{100} = 1,1025 \\):\n\\( \\frac{a}{100} = 0,1025 \\)\n\\( a = 10,25 \\)"}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> 10,25%."}], "lvl": 2}, {"id": 1784183269383, "title": "18 - 516335", "sectionName": "1 - ВКЛАДЫ - НЕФОРМАТ", "difficulty": "medium", "taskText": "По бизнес-плану предполагается вложить в четырёхлетний проект целое число миллионов рублей. По итогам каждого года планируется прирост средств вкладчика на 20% по сравнению с началом года. Начисленные проценты остаются вложенными в проект. Кроме этого, сразу после начислений процентов нужны дополнительные вложения: по 20 миллионов рублей в первый и второй годы, а также по 10 миллионов в третий и четвёртый годы. Найдите наименьший размер первоначальных вложений, при котором общая сумма средств вкладчика за два года станет больше 125 миллионов, а за четыре года станет больше 200 миллионов рублей.\n\u003cstrong>Ответ:\u003c/strong> 57", "taskImage": "", "answerText": "57", "answerImage": "", "solutionText": "\u003cb>Дано:\u003c/b>\r\n\\( S \\) — первоначальные вложения (млн руб.), \\( S \\) — целое число.\r\n\\( r = 20\\% \\rightarrow a = 1 + \\frac{20}{100} = \\frac{6}{5} \\)\r\nСрок: 4 года.\r\nДополнительные вложения:\r\nв 1-й год: 20 млн руб.\r\nво 2-й год: 20 млн руб.\r\nв 3-й год: 10 млн руб.\r\nв 4-й год: 10 млн руб.\r\n\u003cb>Найти:\u003c/b> наименьшее целое \\( S \\), при котором:\r\n\\( S_2 > 125 \\) и \\( S_4 > 200 \\).\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Сумма на конец года (после начисления и пополнения)\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot \\frac{6}{5} + 20 \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( \\left( S \\cdot \\frac{6}{5} + 20 \\right) \\cdot \\frac{6}{5} + 20 \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( \\left( \\left( S \\cdot \\frac{6}{5} + 20 \\right) \\cdot \\frac{6}{5} + 20 \\right) \\cdot \\frac{6}{5} + 10 \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\\( \\left( \\left( \\left( S \\cdot \\frac{6}{5} + 20 \\right) \\cdot \\frac{6}{5} + 20 \\right) \\cdot \\frac{6}{5} + 10 \\right) \\cdot \\frac{6}{5} + 10 \\)\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\u003cb>Условие за 2 года:\u003c/b> \\( S_2 > 125 \\)\r\nРаскрываем скобки для 2-го года:\r\n\\( S_2 = S \\cdot \\left( \\frac{6}{5} \\right)^2 + 20 \\cdot \\frac{6}{5} + 20 > 125 \\)\r\n\\( S \\cdot \\frac{36}{25} + 24 + 20 > 125 \\)\r\n\\( S > 81 \\cdot \\frac{25}{36}> 56,25 \\)\r\nТак как \\( S \\) — целое, \\( S \\ge 57 \\).\r\n\r\n\u003cb>Условие за 4 года:\u003c/b> \\( S_4 > 200 \\)\r\nРаскрываем скобки для 4-го года:\r\n\\( S_4 = S \\cdot \\left( \\frac{6}{5} \\right)^4 + 20 \\cdot \\left( \\frac{6}{5} \\right)^3 + 20 \\cdot \\left( \\frac{6}{5} \\right)^2 + 10 \\cdot \\frac{6}{5} + 10 > 200 \\)\r\n\\( S \\cdot \\frac{1296}{625} + 20 \\cdot \\frac{216}{125} + 20 \\cdot \\frac{36}{25} + 10 \\cdot \\frac{6}{5} + 10 > 200 \\)\r\nДомножаем на 625 и приводим подобные:\r\n\\( 1296S + 53350 > 125000 \\)\r\n\\( S > \\frac{71650}{1296}  \\)\r\n\\( S > 55\\frac{370}{1296}  \\)\r\nТак как \\( S \\) — целое, \\( S \\ge 56 \\).\r\n\r\n\u003cb>Объединяем условия:\u003c/b>\r\nИз первого условия: \\( S \\ge 57 \\)\r\nИз второго условия: \\( S \\ge 56 \\)\r\nНаименьшее целое, удовлетворяющее обоим условиям: \\( S = 57 \\).\r\n\r\n\u003cstrong>Ответ:\u003c/strong \u003cb>Условие за 4 года:\u003c/b> \\( S_4 > 200 \\)"}, {"d": "Раскрываем скобки для 4-го года", "res": "Раскрываем скобки для 4-го года:\n\\( S_4 = S \\cdot \\left( \\frac{6}{5} \\right)^4 + 20 \\cdot \\left( \\frac{6}{5} \\right)^3 + 20 \\cdot \\left( \\frac{6}{5} \\right)^2 + 10 \\cdot \\frac{6}{5} + 10 > 200 \\)\n\\( S \\cdot \\frac{1296}{625} + 20 \\cdot \\frac{216}{125} + 20 \\cdot \\frac{36}{25} + 10 \\cdot \\frac{6}{5} + 10 > 200 \\)"}, {"d": "Домножаем на 625 и приводим подобные", "res": "Домножаем на 625 и приводим подобные:\n\\( 1296S + 53350 > 125000 \\)\n\\( S > \\frac{71650}{1296}  \\)\n\\( S > 55\\frac{370}{1296}  \\)\nТак как \\( S \\) — целое, \\( S \\ge 56 \\)."}, {"d": "Объединяем условия", "res": "\u003cb>Объединяем условия:\u003c/b>\nИз первого условия: \\( S \\ge 57 \\)\nИз второго условия: \\( S \\ge 56 \\)\nНаименьшее целое, удовлетворяющее обоим условиям: \\( S = 57 \\)."}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> 57 млн рублей."}], "lvl": 3}, {"id": 1784183241651, "title": "17 - 513208", "sectionName": "1 - ВКЛАДЫ - НЕФОРМАТ", "difficulty": "hard", "taskText": "\u003ca href=\" https://math-ege.sdamgia.ru/problem?id=513208\" target=\"_blank\">🔍 АНАЛОГ  513208\u003c/a>\nСаша положил некоторую сумму в банк на 4 года под 10% годовых. Одновременно с ним Паша такую же сумму положил на два года в другой банк под 15% годовых. Через два года Паша решил продлить срок вклада еще на 2 года. Однако к тому времени процентная ставка по вкладам в этом банке изменилась и составляла уже \\( p\\% \\) годовых. В итоге через четыре года на счету у Паши оказалась большая сумма, чем у Саши, причем эта разность составила менее 10% от суммы, вложенной каждым первоначально. Найдите наибольшее возможное целое значение процентной ставки.", "taskImage": "", "answerText": "8", "answerImage": "", "solutionText": "\u003cb>Дано:\u003c/b>\r\n\u003cb>Саша:\u003c/b>\r\n\\( S \\) — первоначальная сумма.\r\n\\( r = 10\\% \\rightarrow a = 1 + \\frac{10}{100} = \\frac{11}{10} \\)\r\nСрок: 4 года.\r\n\u003cb>Паша:\u003c/b>\r\n\\( S \\) — первоначальная сумма.\r\nПервые 2 года: \\( r = 15\\% \\rightarrow b = 1 + \\frac{15}{100} = \\frac{23}{20} \\)\r\nСледующие 2 года: \\( r = p\\% \\rightarrow c = 1 + \\frac{p}{100} \\)\r\nСрок: 4 года (2 + 2).\r\n\r\n\u003cb>Найти:\u003c/b> наибольшее целое \\( p \\), при котором:\r\n\\( S_{\\text{Паша}} > S_{\\text{Саша}} \\) и \\( S_{\\text{Паша}} - S_{\\text{Саша}} \u003c 0,1 \\cdot S \\).\r\n\u003ctable style=\"border-collapse:collapse; border:none;\">\r\n\u003ctr>\r\n\u003ctd style=\"padding:5px; vertical-align:top; border:none;\">\r\n\u003ctable style=\"border-collapse:collapse; border:none;\">\r\n\u003ctr>\u003cth colspan=\"2\" style=\"padding:5px; border:none;\">Счёт Саши\u003c/th>\u003c/tr>\r\n\u003ctr>\u003cth style=\"padding:5px; border:none;\">Год\u003c/th>\u003cth style=\"padding:5px; border:none;\">Сумма на счете\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd style=\"padding:5px; border:none;\">1\u003c/td>\u003ctd style=\"padding:5px; border:none;\">\\( S \\cdot \\frac{11}{10} \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd style=\"padding:5px; border:none;\">2\u003c/td>\u003ctd style=\"padding:5px; border:none;\">\\( S \\cdot \\left( \\frac{11}{10} \\right)^2 \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd style=\"padding:5px; border:none;\">3\u003c/td>\u003ctd style=\"padding:5px; border:none;\">\\( S \\cdot \\left( \\frac{11}{10} \\right)^3 \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd style=\"padding:5px; border:none;\">4\u003c/td>\u003ctd style=\"padding:5px; border:none;\">\\( S \\cdot \\left( \\frac{11}{10} \\right)^4 \\)\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\u003c/td>\r\n\u003ctd style=\"padding:5px; vertical-align:top; border:none;\">\r\n\u003ctable style=\"border-collapse:collapse; border:none;\">\r\n\u003ctr>\u003cth colspan=\"2\" style=\"padding:5px; border:none;\">Счёт Паши\u003c/th>\u003c/tr>\r\n\u003ctr>\u003cth style=\"padding:5px; border:none;\">Год\u003c/th>\u003cth style=\"padding:5px; border:none;\">Сумма на счете\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd style=\"padding:5px; border:none;\">1\u003c/td>\u003ctd style=\"padding:5px; border:none;\">\\( S \\cdot \\frac{23}{20} \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd style=\"padding:5px; border:none;\">2\u003c/td>\u003ctd style=\"padding:5px; border:none;\">\\( S \\cdot \\left( \\frac{23}{20} \\right)^2 \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd style=\"padding:5px; border:none;\">3\u003c/td>\u003ctd style=\"padding:5px; border:none;\">\\( S \\cdot \\left( \\frac{23}{20} \\right)^2 \\cdot c \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd style=\"padding:5px; border:none;\">4\u003c/td>\u003ctd style=\"padding:5px; border:none;\">\\( S \\cdot \\left( \\frac{23}{20} \\right)^2 \\cdot c^2 \\)\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\u003c/td>\r\n\u003c/tr>\r\n\u003c/table>\r\n\u003cb>Условие 1:\u003c/b> \\( S_{\\text{Паша}} > S_{\\text{Саша}} \\)\r\n\\( S \\cdot \\left( \\frac{23}{20} \\right)^2 \\cdot c^2 > S \\cdot \\left( \\frac{11}{10} \\right)^4 \\)\r\nСокращаем \\( S \\):\r\n\\( \\left( \\frac{23}{20} \\right)^2 \\cdot c^2 > \\left( \\frac{11}{10} \\right)^4 \\)\r\n\\( \\frac{529}{400} \\cdot c^2 > \\frac{14641}{10000} \\)\r\n\\( c^2 > \\frac{14641}{10000} \\cdot \\frac{400}{529} = \\frac{14641}{13225} \\)\r\n\\( c > \\frac{121}{115} \\) (так как \\( 121^2 = 14641 \\), \\( 115^2 = 13225 \\) и \\(c>0\\))\r\n\r\nС учетом \\( c = 1 + \\frac{p}{100} \\):\r\n\\( 1 + \\frac{p}{100} > \\frac{121}{115} \\)\r\n\\( \\frac{p}{100} > \\frac{121}{115} - 1 = \\frac{6}{115} \\)\r\n\\( p > \\frac{600}{115} >5 \\frac{5}{23} \\)\r\n\r\n\u003cb>Условие 2:\u003c/b> \\( S_{\\text{Паша}} - S_{\\text{Саша}} \u003c 0,1 \\cdot S \\)\r\n\\( S \\cdot \\left( \\frac{23}{20} \\right)^2 \\cdot c^2 - S \\cdot \\left( \\frac{11}{10} \\right)^4 \u003c 0,1 \\cdot S \\)\r\nСокращаем \\( S \\):\r\n\\( \\frac{529}{400} \\cdot c^2 - \\frac{14641}{10000} \u003c \\frac{1}{10} \\)\r\n\\( \\frac{529}{400} \\cdot c^2 \u003c \\frac{14641}{10000} + \\frac{1}{10} = \\frac{15641}{10000} \\)\r\n\\( c^2 \u003c \\frac{15641}{10000} \\cdot \\frac{400}{529} =  \\frac{15641}{13225} \\)\r\n\\( c \u003c \\sqrt{\\frac {15641}{13225}} \\)\r\n\r\nЗамечаем, что \\( \\sqrt{13225} =115\\) и \\(125.1^2 = 15650.01 \\), то \\( 125\u003c\\sqrt{15641} \u003c125.1 \\).\r\n\\( c \u003c \\frac{125.1}{115}=\\frac{1251}{1150}= 1 \\frac{101}{1150} \\)\r\nС учетом \\( c = 1 + \\frac{p}{100} \\):\r\n\\( 1 + \\frac{p}{100} \u003c 1 \\frac{101}{1150} \\)\r\n\\( \\frac{p}{100} \u003c \\frac{101}{1150} \\)\r\n\\( p \u003c \\frac{10100}{1150}  \\)\r\n\\( p \u003c 8\\frac{900}{1150}  \\)\r\n\u003cb>Объединяем условия:\u003c/b>\r\n\\( 5 \\frac{5}{23} \u003c p \u003c 8\\frac{900}{1150}  \\)\r\nНаибольшее целое \\( p = 8 \\).\r\n\r\n\u003cb>Проверка:\u003c/b>\r\nТак как при вычислении корня мы использовали приближение, \r\nнеобходимо проверить \\( p = 8 \\) подстановкой в исходное неравенство.\r\n\\( c = 1 + \\frac{8}{100} = \\frac{108}{100} = \\frac{27}{25} = 1,08 \\)\r\n\r\nПроверяем условие 2:\r\n\\( \\frac{529}{400} \\cdot c^2 - \\frac{14641}{10000} \u003c \\frac{1}{10} \\)\r\n\\( \\frac{529}{400} \\cdot \\left( \\frac{27}{25} \\right)^2 - \\frac{14641}{10000} \u003c \\frac{1}{10} \\)\r\n\\(\\cdots\\)\r\n\\( 0,078464 \u003c 0,1 \\) — \u003cb>верно\u003c/b>.\r\nЗначит, \\( p = 8 \\) подходит.\r\n\u003cstrong>Ответ:\u003c/strong> \\( 8 \\).\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "https://math-ege.sdamgia.ru/problem?id=513208", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cb>Дано:\u003c/b>\n\u003cb>Саша:\u003c/b>\n\\( S \\) — первоначальная сумма.\n\\( r = 10\\% \\rightarrow a = 1 + \\frac{10}{100} = \\frac{11}{10} \\)\nСрок: 4 года.\n\n\u003cb>Паша:\u003c/b>\n\\( S \\) — первоначальная сумма.\nПервые 2 года: \\( r = 15\\% \\rightarrow b = 1 + \\frac{15}{100} = \\frac{23}{20} \\)\nСледующие 2 года: \\( r = p\\% \\rightarrow c = 1 + \\frac{p}{100} \\)\nСрок: 4 года (2 + 2).\n\u003cb>Найти:\u003c/b> наибольшее целое \\( p \\), при котором:\n\\( S_{\\text{Паша}} > S_{\\text{Саша}} \\) и \\( S_{\\text{Паша}} - S_{\\text{Саша}} \u003c 0,1 \\cdot S \\)."}, {"d": "Составляем таблицу", "res": "\u003ctable style=\"border-collapse:collapse; border:none;\">\n\u003ctr>\n\u003ctd style=\"padding:5px; vertical-align:top; border:none;\">\n\u003ctable style=\"border-collapse:collapse; border:none;\">\n\u003ctr>\u003cth colspan=\"2\" style=\"padding:5px; border:none;\">Счёт Саши\u003c/th>\u003c/tr>\n\u003ctr>\u003cth style=\"padding:5px; border:none;\">Год\u003c/th>\u003cth style=\"padding:5px; border:none;\">Сумма на счете\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:5px; border:none;\">1\u003c/td>\u003ctd style=\"padding:5px; border:none;\">\\( S \\cdot \\frac{11}{10} \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:5px; border:none;\">2\u003c/td>\u003ctd style=\"padding:5px; border:none;\">\\( S \\cdot \\left( \\frac{11}{10} \\right)^2 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:5px; border:none;\">3\u003c/td>\u003ctd style=\"padding:5px; border:none;\">\\( S \\cdot \\left( \\frac{11}{10} \\right)^3 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:5px; border:none;\">4\u003c/td>\u003ctd style=\"padding:5px; border:none;\">\\( S \\cdot \\left( \\frac{11}{10} \\right)^4 \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Составляем таблицу", "res": "\u003c/td>\n\u003ctd style=\"padding:5px; vertical-align:top; border:none;\">\n\u003ctable style=\"border-collapse:collapse; border:none;\">\n\u003ctr>\u003cth colspan=\"2\" style=\"padding:5px; border:none;\">Счёт Паши\u003c/th>\u003c/tr>\n\u003ctr>\u003cth style=\"padding:5px; border:none;\">Год\u003c/th>\u003cth style=\"padding:5px; border:none;\">Сумма на счете\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:5px; border:none;\">1\u003c/td>\u003ctd style=\"padding:5px; border:none;\">\\( S \\cdot \\frac{23}{20} \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:5px; border:none;\">2\u003c/td>\u003ctd style=\"padding:5px; border:none;\">\\( S \\cdot \\left( \\frac{23}{20} \\right)^2 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:5px; border:none;\">3\u003c/td>\u003ctd style=\"padding:5px; border:none;\">\\( S \\cdot \\left( \\frac{23}{20} \\right)^2 \\cdot c \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:5px; border:none;\">4\u003c/td>\u003ctd style=\"padding:5px; border:none;\">\\( S \\cdot \\left( \\frac{23}{20} \\right)^2 \\cdot c^2 \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Преобразуем и считаем", "res": "\u003c/td>\n\u003c/tr>\n\u003c/table>"}, {"d": "Условие 1: \\( S_{\\text{Паша}} > S_{\\text{Саша}} \\)", "res": "\u003cb>Условие 1:\u003c/b> \\( S_{\\text{Паша}} > S_{\\text{Саша}} \\)\n\\( S \\cdot \\left( \\frac{23}{20} \\right)^2 \\cdot c^2 > S \\cdot \\left( \\frac{11}{10} \\right)^4 \\)\nСокращаем \\( S \\):\n\\( \\left( \\frac{23}{20} \\right)^2 \\cdot c^2 > \\left( \\frac{11}{10} \\right)^4 \\)"}, {"d": "Решаем неравенство", "res": "\\( \\frac{529}{400} \\cdot c^2 > \\frac{14641}{10000} \\)\n\\( c^2 > \\frac{14641}{10000} \\cdot \\frac{400}{529} = \\frac{14641}{13225} \\)\n\\( c > \\frac{121}{115} \\) (так как \\( 121^2 = 14641 \\), \\( 115^2 = 13225 \\) и \\(c>0\\))"}, {"d": "Решаем неравенство", "res": "С учетом \\( c = 1 + \\frac{p}{100} \\):\n\\( 1 + \\frac{p}{100} > \\frac{121}{115} \\)\n\\( \\frac{p}{100} > \\frac{121}{115} - 1 = \\frac{6}{115} \\)\n\\( p > \\frac{600}{115} >5 \\frac{5}{23} \\)"}, {"d": "Условие 2: \\( S_{\\text{Паша}} - S_{\\text{Саша}} \u003c 0,1 \\cdot S \\)", "res": "\u003cb>Условие 2:\u003c/b> \\( S_{\\text{Паша}} - S_{\\text{Саша}} \u003c 0,1 \\cdot S \\)\n\\( S \\cdot \\left( \\frac{23}{20} \\right)^2 \\cdot c^2 - S \\cdot \\left( \\frac{11}{10} \\right)^4 \u003c 0,1 \\cdot S \\)\nСокращаем \\( S \\):\n\\( \\frac{529}{400} \\cdot c^2 - \\frac{14641}{10000} \u003c \\frac{1}{10} \\)"}, {"d": "Решаем неравенство", "res": "\\( \\frac{529}{400} \\cdot c^2 \u003c \\frac{14641}{10000} + \\frac{1}{10} = \\frac{15641}{10000} \\)\n\\( c^2 \u003c \\frac{15641}{10000} \\cdot \\frac{400}{529} =  \\frac{15641}{13225} \\)\n\\( c \u003c \\sqrt{\\frac {15641}{13225}} \\)"}, {"d": "Решаем неравенство", "res": "Замечаем, что \\( \\sqrt{13225} =115\\) и \\(125.1^2 = 15650.01 \\), то \\( 125\u003c\\sqrt{15641} \u003c125.1 \\).\n\\( c \u003c \\frac{125.1}{115}=\\frac{1251}{1150}= 1 \\frac{101}{1150} \\)\nС учетом \\( c = 1 + \\frac{p}{100} \\):\n\\( 1 + \\frac{p}{100} \u003c 1 \\frac{101}{1150} \\)"}, {"d": "Решаем неравенство", "res": "\\( \\frac{p}{100} \u003c \\frac{101}{1150} \\)\n\\( p \u003c \\frac{10100}{1150}  \\)\n\\( p \u003c 8\\frac{900}{1150}  \\)"}, {"d": "Объединяем условия", "res": "\u003cb>Объединяем условия:\u003c/b>\n\\( 5 \\frac{5}{23} \u003c p \u003c 8\\frac{900}{1150}  \\)\nНаибольшее целое \\( p = 8 \\)."}, {"d": "Проверка", "res": "\u003cb>Проверка:\u003c/b>\nТак как при вычислении корня мы использовали приближение, \nнеобходимо проверить \\( p = 8 \\) подстановкой в исходное неравенство.\n\\( c = 1 + \\frac{8}{100} = \\frac{108}{100} = \\frac{27}{25} = 1,08 \\)"}, {"d": "Проверяем условие 2", "res": "Проверяем условие 2:\n\\( \\frac{529}{400} \\cdot c^2 - \\frac{14641}{10000} \u003c \\frac{1}{10} \\)\n\\( \\frac{529}{400} \\cdot \\left( \\frac{27}{25} \\right)^2 - \\frac{14641}{10000} \u003c \\frac{1}{10} \\)\n\\(\\cdots\\)\n\\( 0,078464 \u003c 0,1 \\) — \u003cb>верно\u003c/b>.\nЗначит, \\( p = 8 \\) подходит."}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> \\( 8 \\)."}], "lvl": 4}, {"id": 1784183094352, "title": "201 - 506949", "sectionName": "1 - ВКЛАДЫ - НЕФОРМАТ", "difficulty": "hard", "taskText": "\u003ca href=\"https://ege.sdamgia.ru/problem?id=506949 \" target=\"_blank\">🔍 АНАЛОГ  506949\u003c/a>\nВ начале года \\( \\frac{5}{6} \\) некоторой суммы денег вложили в банк А, а то, что осталось — в банк Б. Если вклад находится в банке с начала года, то к концу года он возрастает на определённый процент, величина которого зависит от банка. Известно, что к концу первого года сумма вкладов стала равна \\( 670 \\, \\text{у.е.} \\), к концу следующего — \\( 749 \\, \\text{у.е.} \\). Если первоначально \\( \\frac{5}{6} \\) суммы было бы вложено в банк Б, а оставшуюся вложили бы в банк А, то по истечении одного года сумма выросла бы до \\( 710 \\, \\text{у.е.} \\). Определите сумму вкладов по истечении второго года в этом случае.", "taskImage": "", "answerText": "841", "answerImage": "", "solutionText": "\u003cb>Дано:\u003c/b>\r\n\\( S \\) — вся сумма.\r\nВ первый год: \\( \\frac{5}{6}S \\) в банк А, \\( \\quad \\frac{1}{6}S \\) в банк Б.\r\nМножители: \r\n\\( a \\) — для банка А, \\( \\quad b \\) — для банка Б.\r\nК концу 1-го года: сумма = 670 у.е.\r\nК концу 2-го года: сумма = 749 у.е.\r\n\r\nЕсли поменять местами: \\( \\frac{5}{6}S \\) в банк Б, \\( \\quad \\frac{1}{6}S \\) в банк А.\r\nТогда к концу 1-го года: сумма = 710 у.е.\r\n\r\n\u003cb>Найти:\u003c/b> сумму вкладов по истечении второго года в этом случае.\r\n\r\n\u003cb>Решение:\u003c/b>\r\nСоставим систему уравнений:\r\n\\(\r\n\\begin{cases}\r\n\\frac{5}{6}S \\cdot a + \\frac{1}{6}S \\cdot b = 670 & \\text{(1-й год, случай 1)}  [1]\\\\\r\n\\frac{5}{6}S \\cdot b + \\frac{1}{6}S \\cdot a = 710 & \\text{(1-й год, случай 2)} [2] \\\\\r\n\\frac{5}{6}S \\cdot a^2 + \\frac{1}{6}S \\cdot b^2 = 749 & \\text{(2-й год, случай 1)} [3]\\\\\r\n\\frac{5}{6}S \\cdot b^2 + \\frac{1}{6}S \\cdot a^2 = ? & \\text{(2-й год, случай 2) [4]}\r\n\\end{cases}\r\n\\)\r\n\r\nОбозначим: \\(\\quad  x = S \\cdot a \\), \\( y = S \\cdot b \\).\r\nТогда первые два уравнения примут вид:\r\n\\(\r\n\\begin{cases}\r\n\\frac{5}{6}x + \\frac{1}{6}y = 670 \\\\\r\n\\frac{1}{6}x + \\frac{5}{6}y = 710\r\n\\end{cases}\r\n\\)\r\n\r\nДомножаем оба уравнения на 6, а потом 1-е на 5 и  и решаем вычитанием:\r\n\\( x = 660 \\quad y = 720 \\).\r\n\r\nЗначит:\r\n\\( S \\cdot a = 660 \\), \\( S \\cdot b = 720 \\).\r\n\r\nТеперь используем третье уравнение:\r\n\\( \\frac{5}{6}S \\cdot a^2 + \\frac{1}{6}S \\cdot b^2 = 749 \\)\r\n\r\n\\( S \\cdot a^2 = (S \\cdot a) \\cdot a = 660 \\cdot a \\) \r\n\\( S \\cdot b^2 = (S \\cdot b) \\cdot b =720 \\cdot b \\).\r\n\r\nОтсюда:\r\n\\( \\frac{5}{6} \\cdot 660 \\cdot a + \\frac{1}{6} \\cdot 720 \\cdot b = 749 \\)\r\n\\( 550a + 120b = 749 \\).\r\n\r\nДомножим на \\(S\\)\r\n\\( 550aS + 120bS = 749S \\).\r\n\\( 550x + 120y = 749S \\).\r\n\\( 550\\cdot 660 + 120\\cdot 720 = 749S \\).\r\n\\( S = 600 \\).\r\n\r\nИз \\(\\quad  x = S \\cdot a \\), \\(\\quad y = S \\cdot b \\):\r\n\\( a = \\frac{660}{600} = 1,1 \\), \\( \\quad b = \\frac{720}{600} = 1,2 \\).\r\n\r\n\u003cb>Искомая сумма за 2-й год в переставленном случае:\u003c/b>\r\n\\( S_2 = \\frac{5}{6}S \\cdot b^2 + \\frac{1}{6}S \\cdot a^2 = \\frac{5}{6} \\cdot 600 \\cdot 1,2^2 + \\frac{1}{6} \\cdot 600 \\cdot 1,1^2 =841 \\).\r\n\r\n\u003cstrong>Ответ:\u003c/strong> 841 у.е.\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "https://ege.sdamgia.ru/problem?id=506949", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cb>Дано:\u003c/b>\n\\( S \\) — вся сумма.\nВ первый год: \\( \\frac{5}{6}S \\) в банк А, \\( \\quad \\frac{1}{6}S \\) в банк Б."}, {"d": "Множители", "res": "Множители: \n\\( a \\) — для банка А, \\( \\quad b \\) — для банка Б.\nК концу 1-го года: сумма = 670 у.е.\nК концу 2-го года: сумма = 749 у.е."}, {"d": "Если поменять местами: в банк Б, в банк А", "res": "Если поменять местами: \\( \\frac{5}{6}S \\) в банк Б, \\( \\quad \\frac{1}{6}S \\) в банк А.\nТогда к концу 1-го года: сумма = 710 у.е."}, {"d": "Найти: сумму вкладов по истечении второго года в этом случае", "res": "\u003cb>Найти:\u003c/b> сумму вкладов по истечении второго года в этом случае.\n\u003cb>Решение:\u003c/b>\nСоставим систему уравнений:\n\\(\n\\begin{cases}\n\\frac{5}{6}S \\cdot a + \\frac{1}{6}S \\cdot b = 670 & \\text{(1-й год, случай 1)}  [1]\\\\\n\\frac{5}{6}S \\cdot b + \\frac{1}{6}S \\cdot a = 710 & \\text{(1-й год, случай 2)} [2] \\\\\n\\frac{5}{6}S \\cdot a^2 + \\frac{1}{6}S \\cdot b^2 = 749 & \\text{(2-й год, случай 1)} [3]\\\\\n\\frac{5}{6}S \\cdot b^2 + \\frac{1}{6}S \\cdot a^2 = ? & \\text{(2-й год, случай 2) [4]}\n\\end{cases}\n\\)"}, {"d": "Обозначим: , ", "res": "Обозначим: \\(\\quad  x = S \\cdot a \\), \\( y = S \\cdot b \\)."}, {"d": "Тогда первые два уравнения примут вид", "res": "Тогда первые два уравнения примут вид:\n\\(\n\\begin{cases}\n\\frac{5}{6}x + \\frac{1}{6}y = 670 \\\\\n\\frac{1}{6}x + \\frac{5}{6}y = 710\n\\end{cases}\n\\)"}, {"d": "Домножаем оба уравнения на 6, а потом 1-е на 5 и  и решаем вычитанием", "res": "Домножаем оба уравнения на 6, а потом 1-е на 5 и  и решаем вычитанием:\n\\( x = 660 \\quad y = 720 \\)."}, {"d": "Значит", "res": "Значит:\n\\( S \\cdot a = 660 \\), \\( S \\cdot b = 720 \\)."}, {"d": "Теперь используем третье уравнение", "res": "Теперь используем третье уравнение:\n\\( \\frac{5}{6}S \\cdot a^2 + \\frac{1}{6}S \\cdot b^2 = 749 \\)"}, {"d": "Преобразуем и считаем", "res": "\\( S \\cdot a^2 = (S \\cdot a) \\cdot a = 660 \\cdot a \\) \n\\( S \\cdot b^2 = (S \\cdot b) \\cdot b =720 \\cdot b \\)."}, {"d": "Отсюда", "res": "Отсюда:\n\\( \\frac{5}{6} \\cdot 660 \\cdot a + \\frac{1}{6} \\cdot 720 \\cdot b = 749 \\)\n\\( 550a + 120b = 749 \\)."}, {"d": "Избавляемся от знаменателей: домножаем на общий знаменатель", "res": "Домножим на \\(S\\)\n\\( 550aS + 120bS = 749S \\).\n\\( 550x + 120y = 749S \\).\n\\( 550\\cdot 660 + 120\\cdot 720 = 749S \\).\n\\( S = 600 \\)."}, {"d": "Находим \\(a\\)", "res": "Из \\(\\quad  x = S \\cdot a \\), \\(\\quad y = S \\cdot b \\):\n\\( a = \\frac{660}{600} = 1,1 \\), \\( \\quad b = \\frac{720}{600} = 1,2 \\)."}, {"d": "Искомая сумма за 2-й год в переставленном случае", "res": "\u003cb>Искомая сумма за 2-й год в переставленном случае:\u003c/b>\n\\( S_2 = \\frac{5}{6}S \\cdot b^2 + \\frac{1}{6}S \\cdot a^2 = \\frac{5}{6} \\cdot 600 \\cdot 1,2^2 + \\frac{1}{6} \\cdot 600 \\cdot 1,1^2 =841 \\)."}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> 841 у.е."}], "lvl": 5}, {"id": 1791323367646, "title": "604 аналог переплата", "sectionName": "2 - АННУИТЕТ", "difficulty": "basic", "taskText": "\u003ca href=\"https://3.shkolkovo.online/catalog/174/1899\" target=\"_blank\">🔍 АНАЛОГ 1899\u003c/a>\nЛеонид брал кредит в банке сроком на 6 лет под 50% годовых. После того, как кредит был выплачен, оказалось, что переплата по кредиту составила 3044000 рублей. Сколько тысяч рублей каждый год вносил Леонид в счет погашения кредита, если известно, что кредит был выплачен аннуитетными платежами?", "taskImage": "", "answerText": "729 тыс. р", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\nСрок 6 лет, \\( r = 50\\% \\), \\( a = \\frac{3}{2} \\).\nПлатежи равные: \\( x \\) тыс. руб.\nПереплата \\( 6x - S = 3044 \\) тыс. руб.\n\u003cstrong>Найти:\u003c/strong> \\( x \\).\n\n\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot a - x \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (S \\cdot a - x) \\cdot a - x \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>...\u003c/td>\u003ctd>...\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>6\u003c/td>\u003ctd>\\( S \\cdot a^6 - x a^5 - x a^4 - \\dots - x a - x = 0 \\)\u003c/td>\u003c/tr>\n\u003c/table>\n\n\\( S a^6 = x \\cdot \\frac{a^6 - 1}{a - 1} \\)\n\\( S \\cdot \\frac{729}{64} = x \\cdot \\frac{\\frac{665}{64}}{\\frac{1}{2}} = x \\cdot \\frac{665}{32} \\)\n\n\\( 729S = 1330x \\)\n\\( S = \\frac{1330x}{729} \\)\n\n\\( 6x - \\frac{1330x}{729} = 3044 \\)\nДомножаем на 729:\n\\( 4374x - 1330x = 3044 \\cdot 729 \\)\n\\( 3044x = 3044 \\cdot 729 \\)\n\\( x = 729 \\) тыс. руб.\n\n\u003cstrong>Ответ:\u003c/strong> 729 тыс. рублей.", "solutionImage": "", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\nСрок 6 лет, \\( r = 50\\% \\), \\( a = \\frac{3}{2} \\).\nПлатежи равные: \\( x \\) тыс. руб.\nПереплата \\( 6x - S = 3044 \\) тыс. руб.\n\u003cstrong>Найти:\u003c/strong> \\( x \\)."}, {"d": "Составляем таблицу долга", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot a - x \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (S \\cdot a - x) \\cdot a - x \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>...\u003c/td>\u003ctd>...\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>6\u003c/td>\u003ctd>\\( S \\cdot a^6 - x a^5 - x a^4 - \\dots - x a - x = 0 \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Сворачиваем геометрическую прогрессию", "res": "\\( S a^6 = x \\cdot \\frac{a^6 - 1}{a - 1} \\)\n\\( S \\cdot \\frac{729}{64} = x \\cdot \\frac{\\frac{665}{64}}{\\frac{1}{2}} = x \\cdot \\frac{665}{32} \\)"}, {"d": "Избавляемся от знаменателей: домножаем на 64", "res": "\\( 729S = 1330x \\)\n\\( S = \\frac{1330x}{729} \\)"}, {"d": "Подставляем в переплату", "res": "\\( 6x - \\frac{1330x}{729} = 3044 \\)\nДомножаем на 729:\n\\( 4374x - 1330x = 3044 \\cdot 729 \\)\n\\( 3044x = 3044 \\cdot 729 \\)\n\\( x = 729 \\) тыс. руб."}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> 729 тыс. рублей."}], "byClaude": true, "lvl": 1}, {"id": 1791323329970, "title": "39 аналог", "sectionName": "2 - АННУИТЕТ", "difficulty": "basic", "taskText": "\u003ca href=\"https://3.shkolkovo.online/catalog/174/1261\" target=\"_blank\">🔍 АНАЛОГ 1261\u003c/a>\nБанк выдает кредит сроком на 4 года под 25% годовых. Вычислите, на сколько процентов переплата по такому кредиту превышает платеж, если гасить кредит нужно равными ежегодными выплатами.", "taskImage": "", "answerText": "63,84%.", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\nСрок 4 года, \\( r = 25\\% \\), \\( a = \\frac{5}{4} \\).\nПлатежи равные: \\( x \\).\n\u003cstrong>Найти:\u003c/strong> на сколько процентов переплата \\( 4x - S \\) больше платежа \\( x \\).\n\n\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot \\frac{5}{4} - x \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (S \\cdot \\frac{5}{4} - x) \\cdot \\frac{5}{4} - x \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( ((S \\cdot \\frac{5}{4} - x) \\cdot \\frac{5}{4} - x) \\cdot \\frac{5}{4} - x \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\\( (((S \\cdot \\frac{5}{4} - x) \\cdot \\frac{5}{4} - x) \\cdot \\frac{5}{4} - x) \\cdot \\frac{5}{4} - x = 0 \\)\u003c/td>\u003c/tr>\n\u003c/table>\n\n\\( S \\cdot \\frac{625}{256} - x \\cdot \\frac{125}{64} - x \\cdot \\frac{25}{16} - x \\cdot \\frac{5}{4} - x = 0 \\)\n\n\\( 625S - 500x - 400x - 320x - 256x = 0 \\)\n\\( 625S = 1476x \\)\n\\( S = \\frac{1476}{625}x = 2{,}3616x \\)\n\nПереплата: \\( 4x - 2{,}3616x = 1{,}6384x \\)\n\\( \\frac{1{,}6384x - x}{x} \\cdot 100\\% = 63{,}84\\% \\)\n\n\u003cstrong>Ответ:\u003c/strong> на 63,84%.", "solutionImage": "", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\nСрок 4 года, \\( r = 25\\% \\), \\( a = \\frac{5}{4} \\).\nПлатежи равные: \\( x \\).\n\u003cstrong>Найти:\u003c/strong> на сколько процентов переплата \\( 4x - S \\) больше платежа \\( x \\)."}, {"d": "Составляем таблицу долга", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\  = 30\\% \\)\r\n\\( a = 1 + \\frac{30}{100} = \\frac{13}{10} \\)\r\n\\( N = 3 \\) года\r\nПлатежи: \r\n\\(2027\\) год — \\(300\\) тыс. руб. \r\n\\(2028\\) год — \\(300\\) тыс. руб. \r\n\\(2029\\) год — \\(860,6\\) тыс. руб.\r\n\u003cstrong>Найти:\u003c/strong> \\( S \\).\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа (тыс. руб.)\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>2027\u003c/td>\u003ctd>\\( S \\cdot \\frac{13}{10} - 300 \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>2028\u003c/td>\u003ctd>\\( (S \\cdot \\frac{13}{10} - 300) \\cdot \\frac{13}{10} - 300 \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>2029\u003c/td>\u003ctd>\\( ((S \\cdot \\frac{13}{10} - 300) \\cdot \\frac{13}{10} - 300) \\cdot \\frac{13}{10} - 860,6 = 0 \\) \r\n ИТОГОВОЕ УРАВНЕНИЕ\u003c/td>\u003c/tr>\r\n\u003c/table>\r\nПосле раскрытия скобок: \r\n\\( S \\cdot (\\frac{13}{10})^3 - 300 \\cdot (\\frac{13}{10})^2 - 300 \\cdot \\frac{13}{10} - 860,6 = 0 \\)\r\n\r\nДомножаем на  \\( 1000 \\):\r\n\\( S \\cdot 2197 - 300 \\cdot 169 \\cdot 10 - 300 \\cdot 13 \\cdot 100 - 860,6 \\cdot 1000 = 0 \\)\r\n\\( S = 800 \\)\r\n\r\n\u003cstrong>Ответ:\u003c/strong> планируется взять в кредит \u003cstrong>800 тыс. рублей\u003c/strong>.\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "https://3.shkolkovo.online/catalog/131/30773", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S \\) — сумма кредита (тыс. руб.).\n\\( r = 30\\% \\)\n\\( a = 1 + \\frac{30}{100} = \\frac{13}{10} \\)\n\\( N = 3 \\) года\n\nПлатежи: \n\\(2027\\) год — \\(300\\) тыс. руб. \n\\(2028\\) год — \\(300\\) тыс. руб. \n\\(2029\\) год — \\(860,6\\) тыс. руб.\n\u003cstrong>Найти:\u003c/strong> \\( S \\)."}, {"d": "Составляем таблицу платежей", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа (тыс. руб.)\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>2027\u003c/td>\u003ctd>\\( S \\cdot \\frac{13}{10} - 300 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2028\u003c/td>\u003ctd>\\( (S \\cdot \\frac{13}{10} - 300) \\cdot \\frac{13}{10} - 300 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2029\u003c/td>\u003ctd>\\( ((S \\cdot \\frac{13}{10} - 300) \\cdot \\frac{13}{10} - 300) \\cdot \\frac{13}{10} - 860,6 = 0 \\) \n ИТОГОВОЕ УРАВНЕНИЕ\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "После раскрытия скобок", "res": "После раскрытия скобок: \n\\( S \\cdot (\\frac{13}{10})^3 - 300 \\cdot (\\frac{13}{10})^2 - 300 \\cdot \\frac{13}{10} - 860,6 = 0 \\)"}, {"d": "Избавляемся от знаменателей: домножаем на общий знаменатель", "res": "Домножаем на  \\( 1000 \\):\n\\( S \\cdot 2197 - 300 \\cdot 169 \\cdot 10 - 300 \\cdot 13 \\cdot 100 - 860,6 \\cdot 1000 = 0 \\)\n\\( S = 800 \\)"}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> планируется взять в кредит \u003cstrong>800 тыс. рублей\u003c/strong>."}], "lvl": 1}, {"id": 1791322063121, "title": "36 аналог", "sectionName": "2 - АННУИТЕТ", "difficulty": "basic", "taskText": "\u003ca href=\"https://3.shkolkovo.online/catalog/172/1959\" target=\"_blank\">🔍 1959\u003c/a>\n\u003cstrong>Дано:\u003c/strong>\nМарина взяла кредит в банке на 4 года на следующих условиях:\n— раз в год банк начисляет на текущий долг 12,5%, после чего Марина обязана внести платеж в счет погашения кредита;\n— платеж в первый год в два раза меньше платежа во второй год и в три раза меньше платежа в третий год;\n— платеж в четвертый год в два раза больше платежа во второй год.\nСколько процентов от суммы кредита Марина заплатит банку? В случае необходимости результат округлите до целого числа.", "taskImage": "", "answerText": "\\(141 \\%\\).", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\n\\( S \\) — сумма кредита, срок 4 года, \\( r = 12{,}5\\% \\), \\( a = \\frac{9}{8} \\).\nПлатежи: \\( x,\\ 2x,\\ 3x,\\ 4x \\) (первый в 2 раза меньше второго и в 3 раза меньше третьего, четвёртый в 2 раза больше второго).\n\u003cstrong>Найти:\u003c/strong> сколько процентов от \\( S \\) составляют все выплаты \\( 10x \\).\n\n\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot \\frac{9}{8} - x \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (S \\cdot \\frac{9}{8} - x) \\cdot \\frac{9}{8} - 2x \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( ((S \\cdot \\frac{9}{8} - x) \\cdot \\frac{9}{8} - 2x) \\cdot \\frac{9}{8} - 3x \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\\( (((S \\cdot \\frac{9}{8} - x) \\cdot \\frac{9}{8} - 2x) \\cdot \\frac{9}{8} - 3x) \\cdot \\frac{9}{8} - 4x = 0 \\)\u003c/td>\u003c/tr>\n\u003c/table>\n\n\\( S \\cdot \\frac{6561}{4096} - x \\cdot \\frac{729}{512} - 2x \\cdot \\frac{81}{64} - 3x \\cdot \\frac{9}{8} - 4x = 0 \\)\n\n\\( 6561S - 5832x - 10368x - 13824x - 16384x = 0 \\)\n\\( 6561S = 46408x \\)\n\n\\( \\frac{10x}{S} = \\frac{10 \\cdot 6561}{46408} = \\frac{65610}{46408} \\approx 1{,}414 \\)\n\\( 1{,}414 \\cdot 100\\% \\approx 141\\% \\)\n\n\u003cstrong>Ответ:\u003c/strong> 141%.", "solutionImage": "", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S \\) — сумма кредита, срок 4 года, \\( r = 12{,}5\\% \\), \\( a = \\frac{9}{8} \\).\nПлатежи: \\( x,\\ 2x,\\ 3x,\\ 4x \\) (первый в 2 раза меньше второго и в 3 раза меньше третьего, четвёртый в 2 раза больше второго).\n\u003cstrong>Найти:\u003c/strong> сколько процентов от \\( S \\) составляют все выплаты \\( 10x \\)."}, {"d": "Составляем таблицу долга", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u 03c/strong>\r\n\\( S = 900 \\) тыс. руб. — сумма кредита.\r\n\\( r = 30\\% \\)\r\n\\( a = 1 + \\frac{30}{100} = 1.3 \\)\r\nСрок: 3 года.\r\nПлатежи в 2027 и 2028 годах равны: \\( x \\) тыс. руб.\r\nПлатёж в 2029 году: \\( y \\) тыс. руб.\r\nСумма всех платежей: \\( 2x + y = 1482.3 \\) тыс. руб.\r\n\r\n\u003cstrong>Найти:\u003c/strong> \\( y \\).\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа (тыс. руб.)\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>2027\u003c/td>\u003ctd>\\( S \\cdot a - x \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>2028\u003c/td>\u003ctd>\\( (S \\cdot a - x) \\cdot a - x \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>2029\u003c/td>\u003ctd>\\( ((S \\cdot a - x) \\cdot a - x) \\cdot a - y = 0 \\)\r\nИТОГОВОЕ УРАВНЕНИЕ\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\u003cB>После раскрытия скобок:\u003c/B>\r\n\\( S \\cdot a^3 - x \\cdot a^2 - x \\cdot a - y = 0 \\)\r\n\r\nПодставляем \\( S = 900 \\), \\( a = 1.3 \\):\r\n\\( 900 \\cdot 1.3^3 - x \\cdot 1.3^2 - x \\cdot 1.3 - y = 0 \\)\r\n\\( y = 1977.3 - 2.99x \\)\r\n\r\n\u003cB>Уравнение по сумме платежей:\u003c/B>\r\n\\( 2x + y = 1482.3 \\)\r\n\r\nПодставляем \\( y = 1977.3 - 2.99x \\):\r\n\\( 2x + 1977.3 - 2.99x = 1482.3 \\)\r\n\\( x = 500 \\)\r\n\r\nТогда:\r\n\\( y = 1977.3 - 2.99x = 1977.3 - 2.99 \\cdot 500 = 482.3 \\)\r\n\r\n\u003cstrong>Ответ:\u003c/strong> платёж 2029 года составит \u003cstrong>482.3 тыс. рублей\u003c/strong>.\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "https://neofamily.ru/matematika-profil/task-bank/62931", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 900 \\) тыс. руб. — сумма кредита.\n\\( r = 30\\% \\)\n\\( a = 1 + \\frac{30}{100} = 1.3 \\)\nСрок: 3 года.\nПлатежи в 2027 и 2028 годах равны: \\( x \\) тыс. руб.\nПлатёж в 2029 году: \\( y \\) тыс. руб.\nСумма всех платежей: \\( 2x + y = 1482.3 \\) тыс. руб.\n\u003cstrong>Найти:\u003c/strong> \\( y \\)."}, {"d": "Составляем таблицу платежей", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа (тыс. руб.)\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>2027\u003c/td>\u003ctd>\\( S \\cdot a - x \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2028\u003c/td>\u003ctd>\\( (S \\cdot a - x) \\cdot a - x \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2029\u003c/td>\u003ctd>\\( ((S \\cdot a - x) \\cdot a - x) \\cdot a - y = 0 \\)\nИТОГОВОЕ УРАВНЕНИЕ\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "После раскрытия скобок", "res": "\u003cB>После раскрытия скобок:\u003c/B>\n\\( S \\cdot a^3 - x \\cdot a^2 - x \\cdot a - y = 0 \\)"}, {"d": "Подставляем известные значения", "res": "Подставляем \\( S = 900 \\), \\( a = 1.3 \\):\n\\( 900 \\cdot 1.3^3 - x \\cdot 1.3^2 - x \\cdot 1.3 - y = 0 \\)\n\\( y = 1977.3 - 2.99x \\)"}, {"d": "Уравнение по сумме платежей", "res": "\u003cB>Уравнение по сумме платежей:\u003c/B>\n\\( 2x + y = 1482.3 \\)"}, {"d": "Подставляем известные значения", "res": "Подставляем \\( y = 1977.3 - 2.99x \\):\n\\( 2x + 1977.3 - 2.99x = 1482.3 \\)\n\\( x = 500 \\)"}, {"d": "Тогда", "res": "Тогда:\n\\( y = 1977.3 - 2.99x = 1977.3 - 2.99 \\cdot 500 = 482.3 \\)"}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> платёж 2029 года составит \u003cstrong>482.3 тыс. рублей\u003c/strong>."}], "lvl": 1}, {"id": 1791323451092, "title": "604 аналог переплата", "sectionName": "2 - АННУИТЕТ", "difficulty": "basic", "taskText": "\u003ca href=\"https://3.shkolkovo.online/catalog/174/2257\" target=\"_blank\">🔍 2257\u003c/a>\nКредит на 2 года, выплачиваемый равными ежегодными платежами.\nНайти наименьшее целое кратное пяти число \\( y\\% \\) годовых, чтобы переплата по кредиту превысила 50% от ежегодного платежа.", "taskImage": "", "answerText": "25", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\nКредит \\( S \\) на 2 года, равные платежи \\( x \\).\n\\( a = 1 + \\frac{y}{100} \\), \\( y \\) кратно 5.\nПереплата \\( 2x - S > 0{,}5x \\).\n\u003cstrong>Найти:\u003c/strong> наименьшее \\( y \\).\n\n\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot a - x \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (S \\cdot a - x) \\cdot a - x = 0 \\) – ИТОГОВОЕ УРАВНЕНИЕ\u003c/td>\u003c/tr>\n\u003c/table>\n\n\\( S a^2 - x a - x = 0 \\)\n\\( x = \\frac{S a^2}{a + 1} \\)\n\n\\( 2x - S > 0{,}5x \\rightarrow 1{,}5x > S \\)\n\\( \\frac{3}{2} \\cdot \\frac{S a^2}{a + 1} > S \\)\n\n\\( 3a^2 > 2(a + 1) \\)\n\\( 3a^2 - 2a - 2 > 0 \\)\n\nКорни: \\( a = \\frac{2 \\pm \\sqrt{4 + 24}}{6} = \\frac{1 \\pm \\sqrt{7}}{3} \\)\n\\( a > 1 \\rightarrow a > \\frac{1 + \\sqrt{7}}{3} \\approx \\frac{1 + 2{,}646}{3} \\approx 1{,}215 \\)\n\\( y > 21{,}5 \\)\nНаименьшее \\( y \\), кратное 5: \\( y = 25 \\).\n\n\u003cstrong>Ответ:\u003c/strong> 25.", "solutionImage": "", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\nКредит \\( S \\) на 2 года, равные платежи \\( x \\).\n\\( a = 1 + \\frac{y}{100} \\), \\( y \\) кратно 5.\nПереплата \\( 2x - S > 0{,}5x \\).\n\u003cstrong>Найти:\u003c/strong> наименьшее \\( y \\)."}, {"d": "Составляем таблицу долга", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot a - x \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (S \\cdot a - x) \\cdot a - x = 0 \\) – ИТОГОВОЕ УРАВНЕНИЕ\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Выражаем платёж через S", "res": "\\( S a^2 - x a - x = 0 \\)\n\\( x = \\frac{S a^2}{a + 1} \\)"}, {"d": "Составляем неравенство", "res": "\\( 2x - S > 0{,}5x \\rightarrow 1{,}5x > S \\)\n\\( \\frac{3}{2} \\cdot \\frac{S a^2}{a + 1} > S \\)"}, {"d": "Избавляемся от знаменателей: домножаем на 2(a+1) > 0 и делим на S", "res": "\\( 3a^2 > 2(a + 1) \\)\n\\( 3a^2 - 2a - 2 > 0 \\)"}, {"d": "Решаем квадратное неравенство", "res": "Корни: \\( a = \\frac{2 \\pm \\sqrt{4 + 24}}{6} = \\frac{1 \\pm \\sqrt{7}}{3} \\)\n\\( a > 1 \\rightarrow a > \\frac{1 + \\sqrt{7}}{3} \\approx \\frac{1 + 2{,}646}{3} \\approx 1{,}215 \\)\n\\( y > 21{,}5 \\)\nНаименьшее \\( y \\), кратное 5: \\( y = 25 \\)."}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> 25."}], "byClaude": true, "lvl": 1}, {"id": 1772889551115, "title": "32 - 90042", "sectionName": "2 - АННУИТЕТ", "difficulty": "basic", "taskText": "В июле 2026 года планируется взять кредит на 3 года в размере 800 000 рублей. Условия его возврата таковы:\n— в январе 2027 и 2028 годов долг будет возрастать на 10% по сравнению с концом предыдущего года;\n— в январе 2029 года долг будет возрастать на 20% по сравнению с концом предыдущего года;\n— с февраля по июнь каждого года необходимо выплатить часть долга.\nСколько рублей будет выплачено банку, если известно, \nчто кредит будет полностью погашен тремя равными платежами (то есть за три года)?", "taskImage": "", "answerText": "990000", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 800 \\) тыс. руб. — сумма кредита.\nПроценты: 2027 год — 10%, 2028 год — 10%, 2029 год — 20%.\n\\( a_1 = 1 + \\frac{10}{100} = \\frac{11}{10} \\)\n\\( a_2 = 1 + \\frac{10}{100} = \\frac{11}{10} \\)\n\\( a_3 = 1 + \\frac{20}{100} = \\frac{6}{5} \\)\nПлатежи равные: \\( x \\) тыс. руб. каждый год.\n\u003cstrong>Найти:\u003c/strong> \\( 3x \\) (сколько всего будет выплачено).\n\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа (тыс. руб.)\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>2027\u003c/td>\u003ctd>\\( S \\cdot \\frac{11}{10} - x \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2028\u003c/td>\u003ctd>\\( (S \\cdot \\frac{11}{10} - x) \\cdot \\frac{11}{10} - x \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2029\u003c/td>\u003ctd>\\( ((S \\cdot \\frac{11}{10} - x) \\cdot \\frac{11}{10} - x) \\cdot \\frac{6}{5} - x = 0 \\)\u003c/td>\u003c/tr>\n\u003c/table>\n\n\\( ((S \\cdot \\frac{11}{10} - x) \\cdot \\frac{11}{10} - x) \\cdot \\frac{6}{5} - x = 0 \\)\n\\( S \\cdot (\\frac{11}{10})^2 \\cdot \\frac{6}{5} - x \\cdot \\frac{11}{10} \\cdot \\frac{6}{5} - x \\cdot \\frac{6}{5} - x = 0 \\)\n\\( S \\cdot \\frac{363}{250} - x \\cdot \\frac{33}{25} - x \\cdot \\frac{6}{5} - x = 0 \\)\nДомножаем на  250:\n\\( S \\cdot 363 - x \\cdot 330 - x \\cdot 300 - x \\cdot 250 = 0 \\)\n\\( 363S - 880x = 0 \\)\n\\( x = \\frac{363S}{880} \\) Подставляем \\( S = 800 \\):\n\\( x = \\frac{363 \\cdot 800}{880} = \\frac{290400}{880} = 330 \\)\n\nТогда всего выплачено:\n\\( 3x = 3 \\cdot 330 = 990 \\) тыс. руб.\n\u003cstrong>Ответ:\u003c/strong> банку будет выплачено \u003cstrong>990 000 рублей\u003c/strong>.", "solutionImage": "", "drawingImage": "", "solutionLink": "https://3.shkolkovo.online/catalog/131/90042", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 800 \\) тыс. руб. — сумма кредита.\nПроценты: 2027 год — 10%, 2028 год — 10%, 2029 год — 20%.\n\\( a_1 = 1 + \\frac{10}{100} = \\frac{11}{10} \\)\n\\( a_2 = 1 + \\frac{10}{100} = \\frac{11}{10} \\)\n\\( a_3 = 1 + \\frac{20}{100} = \\frac{6}{5} \\)\nПлатежи равные: \\( x \\) тыс. руб. каждый год.\n\u003cstrong>Найти:\u003c/strong> \\( 3x \\) (сколько всего будет выплачено)."}, {"d": "Составляем таблицу платежей", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа (тыс. руб.)\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>2027\u003c/td>\u003ctd>\\( S \\cdot \\frac{11}{10} - x \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2028\u003c/td>\u003ctd>\\( (S \\cdot \\frac{11}{10} - x) \\cdot \\frac{11}{10} - x \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2029\u003c/td>\u003ctd>\\( ((S \\cdot \\frac{11}{10} - x) \\cdot \\frac{11}{10} - x) \\cdot \\frac{6}{5} - x = 0 \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Преобразуем и считаем", "res": "\\( ((S \\cdot \\frac{11}{10} - x) \\cdot \\frac{11}{10} - x) \\cdot \\frac{6}{5} - x = 0 \\)\n\\( S \\cdot (\\frac{11}{10})^2 \\cdot \\frac{6}{5} - x \\cdot \\frac{11}{10} \\cdot \\frac{6}{5} - x \\cdot \\frac{6}{5} - x = 0 \\)\n\\( S \\cdot \\frac{363}{250} - x \\cdot \\frac{33}{25} - x \\cdot \\frac{6}{5} - x = 0 \\)"}, {"d": "Домножаем на  250", "res": "Домножаем на  250:\n\\( S \\cdot 363 - x \\cdot 330 - x \\cdot 300 - x \\cdot 250 = 0 \\)\n\\( 363S - 880x = 0 \\)\n\\( x = \\frac{363S}{880} \\) Подставляем \\( S = 800 \\):\n\\( x = \\frac{363 \\cdot 800}{880} = \\frac{290400}{880} = 330 \\)"}, {"d": "Тогда всего выплачено", "res": "Тогда всего выплачено:\n\\( 3x = 3 \\cdot 330 = 990 \\) тыс. руб."}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> банку будет выплачено \u003cstrong>990 000 рублей\u003c/strong>."}], "lvl": 2}, {"id": 1772889610682, "title": "34 - 90043", "sectionName": "2 - АННУИТЕТ", "difficulty": "basic", "taskText": "В июле 2026 года планируется взять кредит в банке на некоторую сумму.\nУсловия его возврата таковы:\n— каждый январь долг увеличивается на \\(25\\%\\) по сравнению с концом предыдущего года;\n— с февраля по июнь каждого года необходимо выплатить одним платежом часть долга.\nСколько рублей планируется взять в банке, если известно, что кредит будет полностью погашен тремя равными платежами (то есть за три года) \nи общая сумма платежей после полного погашения кредита должна быть на \\(65 500\\) рублей больше суммы, взятой кредита?", "taskImage": "", "answerText": "122000", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\r\n\\( S \\) руб. — сумма кредита.\r\n\\( r = 25\\% \\)\r\n\\( a = 1 + \\frac{25}{100} = \\frac{5}{4} \\)\r\nКредит погашается равными платежами.\r\n\u003cstrong>Случай:\u003c/strong> 3 года, ежегодный платеж \\( x \\) руб.\r\n\u003cstrong>Найти:\u003c/strong> \\( S \\), если переплата составила 65500 руб.\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа (руб.)\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot \\frac{5}{4} - x \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (S \\cdot \\frac{5}{4} - x) \\cdot \\frac{5}{4} - x \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( ((S \\cdot \\frac{5}{4} - x) \\cdot \\frac{5}{4} - x) \\cdot \\frac{5}{4} - x = 0 \\) \r\nИТОГОВОЕ УРАВНЕНИЕ \u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\u003cB>УРАВНЕНИЕ для 3-х платежей\u003c/B> после раскрытия скобок:\r\n\\( S \\cdot (\\frac{5}{4})^3 - x \\cdot (\\frac{5}{4})^2 - x \\cdot \\frac{5}{4} - x = 0 \\)\r\n\r\nДомножаем на \\( 64 \\):\r\n\\( S \\cdot 125 - x \\cdot 25 \\cdot 4 - x \\cdot 5 \\cdot 16 - x \\cdot 64 = 0 \\)\r\n\\( 125S - 100x - 80x - 64x = 0 \\)\r\n\\( 125S - 244x = 0 \\)\r\n\\( x = \\frac{125}{244}S \\)\r\n\r\nПо условию переплата составила 65500 руб.:\r\n\u003cB>ПЕРЕПЛАТА = СУММА ПЛАТЕЖЕЙ – СУММА КРЕДИТА\u003c/B>\r\n\r\nПЕРЕПЛАТА = \\( 3x - S = 65500 \\)\r\nПодставляем \\( x = \\frac{125}{244}S \\)  и домножаем на \\(244\\):\r\n\\( 3 \\cdot 125 \\cdot S – 244\\cdot S = 65500 \\cdot 244 \\)\r\n\\( S = 122000 \\)\r\n\r\n\u003cstrong>Ответ:\u003c/strong> в банке планируется взять \u003cstrong>122000 рублей\u003c/strong>.\r\n", "solutionImage": "", "drawingImage": "", "solutionLink": "https://3.shkolkovo.online/catalog/131/90043", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S \\) руб. — сумма кредита.\n\\( r = 25\\% \\)\n\\( a = 1 + \\frac{25}{100} = \\frac{5}{4} \\)\n  тыс. руб., срок 5 лет, \\( r = 30\\% \\), \\( a = \\frac{13}{10} \\).\n2027–2029: долг остаётся \\( S \\Rightarrow \\) платим проценты \\( 0{,}3S \\).\n2030, 2031: платежи по 338 тыс. руб.\n\u003cstrong>Найти:\u003c/strong> общую сумму выплат.\n\n\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Платёж\u003c/th>\u003cth>Долг после платежа\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>2027–2029\u003c/td>\u003ctd>\\( 0{,}3S \\) каждый год\u003c/td>\u003ctd>\\( S \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2030\u003c/td>\u003ctd>\\( 338 \\)\u003c/td>\u003ctd>\\( S \\cdot \\frac{13}{10} - 338 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2031\u003c/td>\u003ctd>\\( 338 \\)\u003c/td>\u003ctd>\\( (S \\cdot \\frac{13}{10} - 338) \\cdot \\frac{13}{10} - 338 = 0 \\)\u003c/td>\u003c/tr>\n\u003c/table>\n\n\\( 169S - 338 \\cdot 130 - 338 \\cdot 100 = 0 \\)\n\\( 169S = 338 \\cdot 230 \\)\n\\( S = 2 \\cdot 230 = 460 \\) тыс. руб.\n\n\\( \\Sigma = 3 \\cdot 0{,}3 \\cdot 460 + 2 \\cdot 338 = 414 + 676 = 1090 \\) тыс. руб.\n\n\u003cstrong>Ответ:\u003c/strong> 1090 тыс. рублей.", "solutionImage": "", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S \\) тыс. руб., срок 5 лет, \\( r = 30\\% \\), \\( a = \\frac{13}{10} \\).\n2027–2029: долг остаётся \\( S \\Rightarrow \\) платим проценты \\( 0{,}3S \\).\n2030, 2031: платежи по 338 тыс. руб.\n\u003cstrong>Найти:\u003c/strong> общую сумму выплат."}, {"d": "Составляем таблицу долга", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Платёж\u003c/th>\u003cth>Долг после платежа\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>2027–2029\u003c/td>\u003ctd>\\( 0{,}3S \\) каждый год\u003c/td>\u003ctd>\\( S \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2030\u003c/td>\u003ctd>\\( 338 \\)\u003c/td>\u003ctd>\\( S \\cdot \\frac{13}{10} - 338 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2031\u003c/td>\u003ctd>\\( 338 \\)\u003c/td>\u003ctd>\\( (S \\cdot \\frac{13}{10} - 338) \\cdot \\frac{13}{10} - 338 = 0 \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Избавляемся от знаменателей: домножаем на 100", "res": "\\( 169S - 338 \\cdot 130 - 338 \\cdot 100 = 0 \\)\n\\( 169S = 338 \\cdot 230 \\)\n\\( S = 2 \\cdot 230 = 460 \\) тыс. руб."}, {"d": "Считаем общую сумму выплат", "res": "\\( \\Sigma = 3 \\cdot 0{,}3 \\cdot 460 + 2 \\cdot 338 = 414 + 676 = 1090 \\) тыс. руб."}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> 1090 тыс. рублей."}], "byClaude": true, "lvl": 2}, {"id": 1791322390916, "title": "371 аналог", "sectionName": "2 - АННУИТЕТ", "difficulty": "basic", "taskText": "\u003ca href=\"https://ege.sdamgia.ru/problem?id=511109\" target=\"_blank\">🔍 511109\u003c/a>\n\u003cstrong>Дано:\u003c/strong>\n31 декабря 2014 года Алексей взял в банке 6902000 рублей в кредит под 12,5% годовых. Схема выплаты кредита следующая — 31 декабря каждого следующего года банк начисляет проценты на оставшуюся сумму долга (то есть увеличивает долг на 12,5%), затем Алексей переводит в банк \\( X \\) рублей. Какой должна быть сумма \\( X \\), чтобы Алексей выплатил долг четырьмя равными платежами (то есть за четыре года)?", "taskImage": "", "answerText": "2 296 350.рублей.", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 6902000 \\) руб., \\( r = 12{,}5\\% \\), \\( a = 1 + \\frac{125}{1000} = \\frac{9}{8} \\).\n4 равных платежа \\( X \\).\n\u003cstrong>Найти:\u003c/strong> \\( X \\).\n\n\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot \\frac{9}{8} - X \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (S \\cdot \\frac{9}{8} - X) \\cdot \\frac{9}{8} - X \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( ((S \\cdot \\frac{9}{8} - X) \\cdot \\frac{9}{8} - X) \\cdot \\frac{9}{8} - X \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\\( (((S \\cdot \\frac{9}{8} - X) \\cdot \\frac{9}{8} - X) \\cdot \\frac{9}{8} - X) \\cdot \\frac{9}{8} - X = 0 \\)\u003c/td>\u003c/tr>\n\u003c/table>\n\n\\( S \\cdot \\frac{6561}{4096} - X \\cdot \\frac{729}{512} - X \\cdot \\frac{81}{64} - X \\cdot \\frac{9}{8} - X = 0 \\)\n\n\\( 6561S - 5832X - 5184X - 4608X - 4096X = 0 \\)\n\\( 6561S = 19720X \\)\n\\( X = \\frac{6561S}{19720} \\)\n\n\\( X = \\frac{6561 \\cdot 6902000}{19720} = 6561 \\cdot 350 = 2296350 \\) руб.\n\n\u003cstrong>Ответ:\u003c/strong> 2 296 350 рублей.", "solutionImage": "", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 6902000 \\) руб., \\( r = 12{,}5\\% \\), \\( a = 1 + \\frac{125}{1000} = \\frac{9}{8} \\).\n4 равных платежа \\( X \\).\n\u003cstrong>Найти:\u003c/strong> \\( X \\)."}, {"d": "Составляем таблицу долга", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot \\frac{9}{8} - X \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (S \\cdot \\frac{9}{8} - X) \\cdot \\frac{9}{8} - X \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\\( ((S \\cdot \\frac{9}{8} - X) \\cdot \\frac{9}{8} - X) \\cdot \\frac{9}{8} - X \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\\( (((S \\cdot \\frac{9}{8} - X) \\cdot \\frac{9}{8} - X) \\cdot \\frac{9}{8} - X) \\cdot \\frac{9}{8} - X = 0 \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Раскрываем скобки", "res": "\\( S \\cdot \\frac{6561}{4096} - X \\cdot \\frac{729}{512} - X \\cdot \\frac{81}{64} - X \\cdot \\frac{9}{8} - X = 0 \\)"}, {"d": "Избавляемся от знаменателей: домножаем на 4096", "res": "\\( 6561S - 5832X - 5184X - 4608X - 4096X = 0 \\)\n\\( 6561S = 19720X \\)\n\\( X = \\frac{6561S}{19720} \\)"}, {"d": "Подставляем S и считаем", "res": "\\( X = \\frac{6561 \\cdot 6902000}{19720} = 6561 \\cdot 350 = 2296350 \\) руб."}, {"d": "Записываем ответ", "res": "\u003cstrong>Ответ:\u003c/strong> 2 296 350 рублей."}], "byClaude": true, "lvl": 2}, {"id": 1784020722854, "title": "40 - 2712 - СОКРАЩЕНИЕ БУКВЫ", "sectionName": "2 - АННУИТЕТ", "difficulty": "basic", "taskText": "\u003ca href=\"https://3.shkolkovo.online/catalog/174/2712\" target=\"_blank\">🔍 2712\u003c/a>\nРуслан взял кредит в банке под \\( y\\% \\) годовых. Выплачивать кредит он должен в течение двух лет равными ежегодными платежами, переводимыми в банк после начисления процентов. \nПод какой процент \\( y \\) был взят кредит, если ежегодный платеж составил \\( \\frac{81}{136 \\) от суммы кредита?\n\u003cstrong>Ответ:\u003c/strong> 12.5", "taskImage": "", "answerText": "12,5", "answerImage": "", "solutionText": "\u003cstrong>Дано:\u003c/strong>\r\n\\( S \\) руб. — сумма кредита.\r\n\\( r = y\\% \\)\r\n\\( t = 1 + \\frac{y}{100} \\)\r\nКредит погашается 2 равными платежами по \\( x \\) руб.\r\nЕжегодный платеж: \\( x = \\frac{81}{136}S \\).\r\n\r\n\u003cstrong>Найти:\u003c/strong> \\( y \\).\r\n\u003ctable>\r\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления и платежа (руб.)\u003c/th>\u003c/tr>\r\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\\( S \\cdot t - x \\)\u003c/td>\u003c/tr>\r\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\\( (S \\cdot t - x) \\cdot t - x = 0 \\)  \r\nИТОГОВОЕ  УРАВНЕНИЕ\u003c/td>\u003c/tr>\r\n\u003c/table>\r\n\u003cB> После раскрытия скобок \u003c/B>:\r\n\\( S \\cdot t^2 - x \\cdot t - x = 0 \\)\r\n\r\nПодставляем \\( x = \\frac{81}{136}S \\):\r\n\\( S \\cdot t^2 - \\frac{81}{136}S \\cdot t - \\frac{81}{136}S = 0 \\)\r\n\r\nДелим на \\( S \\) и Домножаем на \\( 136 \\):\r\n\\( 136t^2 - 81t - 81 = 0 \\)\r\n\\( t = \\frac{9}{8} \\):\r\nТогда:\r\n\\( 1 + \\frac{y}{100}= \\frac{9}{8} \\)\r\n\\( y = 12.5 \\).\r  500 \\) тыс. руб.\n\n\u003cstrong>Ответ:\u003c/strong> на 500 тыс. рублей.", "solutionImage": "", "drawingImage": "", "solutionLink": "", "videoLink": "", "taskJSON": null, "answerJSON": null, "solutionJSON": null, "hw": false, "note": "", "steps": [{"d": "Записываем, что дано и что нужно найти", "res": "\u003cstrong>Дано:\u003c/strong>\n\\( S = 1050 \\) тыс. руб., срок 5 лет, \\( r = 10\\% \\), \\( a = \\frac{11}{10} \\).\n2027–2029: долг остаётся 1050 \\( \\Rightarrow \\) платим только проценты.\n2030, 2031: равные платежи \\( X \\).\n\u003cstrong>Найти:\u003c/strong> на сколько последняя выплата больше первой."}, {"d": "Составляем таблицу долга", "res": "\u003ctable>\n\u003ctr>\u003cth>Год\u003c/th>\u003cth>Долг после начисления\u003c/th>\u003cth>Платёж\u003c/th>\u003cth>Долг после платежа\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>2027\u003c/td>\u003ctd>\\( 1050 \\cdot \\frac{11}{10} \\)\u003c/td>\u003ctd>\\( 105 \\)\u003c/td>\u003ctd>\\( 1050 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2028\u003c/td>\u003ctd>\\( 1050 \\cdot \\frac{11}{10} \\)\u003c/td>\u003ctd>\\( 105 \\)\u003c/td>\u003ctd>\\( 1050 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2029\u003c/td>\u003ctd>\\( 1050 \\cdot \\frac{11}{10} \\)\u003c/td>\u003ctd>\\( 105 \\)\u003c/td>\u003ctd>\\( 1050 \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2030\u003c/td>\u003ctd>\\( 1050 \\cdot \\frac{11}{10} \\)\u003c/td>\u003ctd>\\( X \\)\u003c/td>\u003ctd>\\( 1050 \\cdot \\frac{11}{10} - X \\)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2031\u003c/td>\u003ctd>\\( (1050 \\cdot \\frac{11}{10} - X) \\cdot \\frac{11}{10} \\)\u003c/td>\u003ctd>\\( X \\)\u003c/td>\u003ctd>\\( 0 \\)\u003c/td>\u003c/tr>\n\u003c/table>"}, {"d": "Составляем итоговое уравнение и избавляемся от знаменателей", "res": "\\( (1050 \\cdot \\frac{11}{10} - X) \\cdot \\frac{11}{10} - X = 0 \\)\nДомножаем на 100:\n\\( 1050 \\cdot 121 - 110X - 100X = 0 \\)\n\\( 210X = 127050 \\rightarrow X = 605 \\)"}, {"d": "Сравниваем последнюю и первую выплаты", "res": "\\( 605
