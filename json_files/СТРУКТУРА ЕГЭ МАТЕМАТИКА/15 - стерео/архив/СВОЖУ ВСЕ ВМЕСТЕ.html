<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Стереометрия — интерактивный справочник</title>
<style>
  :root{ --txt:#e6edf7; --muted:#8fa3bf; --acc:#4ecdc4; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;}
  body{background:radial-gradient(1200px 800px at 75% 15%, #1c2740 0%, #0b1018 60%, #070a10 100%);
    color:var(--txt);font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif;}
  #app{position:fixed;inset:0;display:flex;}
  .menu{width:410px;height:100%;background:rgba(12,17,26,.94);
    border-right:1px solid rgba(255,255,255,.08);padding:14px 12px;overflow-y:auto;backdrop-filter:blur(10px);}
  .menu::-webkit-scrollbar{width:6px;}
  .menu::-webkit-scrollbar-thumb{background:#2a3a52;border-radius:3px;}
  details{margin-bottom:6px;border:1px solid rgba(255,255,255,.08);
    border-radius:12px;background:rgba(15,21,32,.55);overflow:hidden;}
  details[open]{background:rgba(15,21,32,.8);border-color:rgba(78,205,196,.25);}
  details.bridge[open]{border-color:rgba(255,169,77,.30);}
  details.bridge>summary{color:#d9b07a;}
  details.bridge[open]>summary{color:#ffa94d;border-bottom-color:rgba(255,169,77,.18);}
  details.bridge .sec-num{color:#ffa94d;}
  summary{list-style:none;cursor:pointer;padding:11px 14px;font-size:13px;font-weight:700;
    color:#cfd9e8;letter-spacing:.2px;display:flex;justify-content:space-between;
    align-items:center;user-select:none;transition:.15s;}
  summary::-webkit-details-marker{display:none;}
  summary::after{content:'▾';color:var(--muted);transition:.2s;font-size:12px;}
  details[open] summary::after{transform:rotate(180deg);color:var(--acc);}
  summary:hover{color:#fff;background:rgba(78,205,196,.06);}
  details[open] summary{color:var(--acc);border-bottom:1px solid rgba(255,255,255,.06);}
  .sec-num{display:inline-block;min-width:30px;color:var(--acc);font-weight:800;margin-right:8px;}
  .menu button{width:calc(100% - 20px);margin:6px 10px;padding:9px 12px;
    background:rgba(18,24,34,.85);border:1px solid rgba(255,255,255,.10);
    color:#cfd9e8;font:inherit;font-size:12.5px;font-weight:600;border-radius:9px;
    text-align:left;cursor:pointer;transition:.15s;line-height:1.35;}
  .menu button:hover{color:#fff;border-color:rgba(78,205,196,.5);}
  .menu button.active{background:rgba(78,205,196,.18);color:#fff;
    border-color:rgba(78,205,196,.65);box-shadow:0 0 0 1px rgba(78,205,196,.4);}
  details > button:last-child{margin-bottom:10px;}
  .view{position:relative;flex:1;min-width:0;}
  .view canvas{display:block;}
  .single{position:absolute;inset:0;}
  .quad{position:absolute;inset:0;display:grid;
    grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;}
  .quad .mini{position:relative;min-height:0;
    border-bottom:1px solid rgba(255,255,255,.08);
    border-right:1px solid rgba(255,255,255,.08);}
  .quad .mini:nth-child(2n){border-right:none;}
  .quad .mini:nth-child(n+3){border-bottom:none;}
  .quad .mini canvas{display:block;}
  .mini-label{position:absolute;top:8px;left:12px;right:12px;
    font-size:12px;color:#cfd9e8;letter-spacing:.3px;
    background:rgba(15,21,32,.78);padding:7px 12px;border-radius:8px;
    pointer-events:none;z-index:5;line-height:1.4;
    border:1px solid rgba(78,205,196,.18);}
  .mini-label b{color:var(--acc);font-weight:700;}
  .caption{position:absolute;top:18px;left:50%;transform:translateX(-50%);
    max-width:min(1344px,96%);background:rgba(18,24,34,.92);backdrop-filter:blur(10px);
    border:1px solid rgba(78,205,196,.28);border-radius:14px;padding:14px 24px;
    font-size:16px;line-height:1.55;color:#f3f8ff;font-weight:500;letter-spacing:.15px;
    box-shadow:0 10px 26px rgba(0,0,0,.55);text-align:center;z-index:10;
    max-height:72vh;overflow-y:auto;}
  .caption::-webkit-scrollbar{width:6px;}
  .caption::-webkit-scrollbar-thumb{background:#2a3a52;border-radius:3px;}
  .caption b{color:var(--acc);font-weight:700;}
  .frac{display:inline-flex;flex-direction:column;vertical-align:middle;
    margin:0 5px;text-align:center;line-height:1.12;
    font-family:ui-monospace,Menlo,monospace;font-weight:700;color:#c9faf4;}
  .frac .num{border-bottom:2px solid #b6f3ed;padding:1px 8px 3px;font-size:15px;}
  .frac .den{padding:3px 8px 1px;font-size:15px;}
  .caption details.detail{margin-top:10px;}
  .caption details.detail summary{list-style:none;cursor:pointer;display:inline-block;
    padding:6px 16px;background:rgba(78,205,196,.12);
    border:1px solid rgba(78,205,196,.38);border-radius:8px;
    color:#4ecdc4;font-size:12.5px;font-weight:800;letter-spacing:.3px;
    user-select:none;transition:.15s;text-transform:uppercase;}
  .caption details.detail summary::-webkit-details-marker{display:none;}
  .caption details.detail summary::after{content:' ▾';}
  .caption details.detail[open] summary::after{content:' ▴';}
  .caption details.detail summary:hover{background:rgba(78,205,196,.24);color:#e6fffd;}
  .caption details.detail[open] summary{background:rgba(78,205,196,.28);color:#e6fffd;
    border-bottom-left-radius:0;border-bottom-right-radius:0;}
  .caption .detail-content{margin-top:0;padding:12px 18px;text-align:left;
    background:rgba(78,205,196,.06);border:1px solid rgba(78,205,196,.28);border-top:none;
    border-bottom-left-radius:10px;border-bottom-right-radius:10px;
    animation:fadeIn .2s ease-out;}
  .caption .detail-content .lead{color:#b6f3ed;font-weight:700;margin-bottom:6px;display:block;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
  .hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
    font-size:11.5px;color:#5f6d82;letter-spacing:.3px;pointer-events:none;
    background:rgba(15,21,32,.6);padding:6px 12px;border-radius:8px;z-index:10;}
  .seg{position:absolute;top:18px;right:18px;z-index:11;
    display:flex;background:rgba(15,21,32,.85);
    border:1px solid rgba(78,205,196,.35);border-radius:10px;padding:4px;
    backdrop-filter:blur(10px);box-shadow:0 6px 20px rgba(0,0,0,.5);}
  .seg button{background:transparent;border:0;color:#cfd9e8;font:inherit;
    font-size:12px;font-weight:700;padding:7px 14px;border-radius:7px;
    cursor:pointer;letter-spacing:.3px;transition:.15s;}
  .seg button:hover{color:#fff;}
  .seg button.on{background:rgba(78,205,196,.22);color:#fff;
    box-shadow:inset 0 0 0 1px rgba(78,205,196,.55);}
</style>
</head>
<body>
<div id="app">
<aside class="menu" id="menu">
  <details open>
    <summary><span><span class="sec-num">Вв</span>Введение. Аксиомы и следствия</span></summary>
    <button data-id="ax1" class="active">Аксиома 1 — три точки</button>
    <button data-id="ax2">Аксиома 2 — прямая через две точки</button>
    <button data-id="ax3">Аксиома 3 — пересечение плоскостей</button>
    <button data-id="col1">Следствие 1 — прямая и точка</button>

  </details>
  <details>
    <summary><span><span class="sec-num">§1</span>Параллельные прямые</span></summary>
    <button data-id="p1">Определение параллельных</button>
    <button data-id="p2">Единственная через точку</button>

    <button data-id="crossPlane">Плоскость через них</button>

    <button data-id="def1">Сонаправленные (не на прямой)</button>

    <button data-id="t2b">Свойство 2°</button>

  </details>
  <details>
    <summary><span><span class="sec-num">§4</span>Перпендикулярность</span></summary>
    <button data-id="perpDef">Перпендикулярные прямые</button>
    <button data-id="perpLemma">Лемма</button>
    <button data-id="perpPara">Две ⊥ к плоскости</button>
    <button data-id="perpPriznak">Признак ⊥ прямой и пл.</button>
    <button data-id="perpExist">Единственная ⊥</button>

    <button data-id="perpDihedral">Двугранный угол</button>
    <button data-id="perpPlanePriznak">Признак ⊥ плоскостей</button>
    <button data-id="perpRectPar">Прямоугольный параллелепипед</button>
  </details>
  <details class="bridge">
    <summary><span><span class="sec-num">V⅓</span>Почему V пирамиды = ⅓ V призмы</span></summary>
    <button data-id="pyrCube">Куб — три пирамиды</button>

  <details>

    <button data-id="hackDist">Расстояние через объём</button>

    <button data-id="hackTentTri">Палатка — треугольная пирамида</button>

</aside>
<div class="view" id="view">
  <div class="single" id="single"></div>
  <div class="quad" id="quad" style="display:none;"></div>
  <div class="seg" id="seg" style="display:none;">
    <button data-mode="0" class="on">призмовидная</button>
    <button data-mode="1">пирамидальная</button>
  </div>
  <div class="caption" id="caption"></div>
  <div class="hint">левая кнопка — вращать · колесо — зум · ПКМ — панорама</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { ConvexGeometry } from 'three/addons/geometries/ConvexGeometry.js';

/* ================= БАЗА ================= */
const singleEl = document.getElementById('single');
const quadEl   = document.getElementById('quad');
const captionEl= document.getElementById('caption');
const segEl    = document.getElementById('seg');

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(singleEl.clientWidth, singleEl.clientHeight);
singleEl.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, singleEl.clientWidth/singleEl.clientHeight, 0.1, 200);
camera.position.set(3.8, 3.2, 4.8);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 1; controls.maxDistance = 40;
controls.target.set(0, 0.3, 0);
controls.minPolarAngle = Math.PI * 0.05;
controls.maxPolarAngle = Math.PI * 0.49;

scene.add(new THREE.HemisphereLight(0xdce8ff, 0x1a2233, 1.6));
const keyL = new THREE.DirectionalLight(0xffffff, 2.0); keyL.position.set(6,9,7); scene.add(keyL);
const rimL = new THREE.DirectionalLight(0x7fa8ff, 1.0); rimL.position.set(-7,-3,-6); scene.add(rimL);

const g = new THREE.Group(); scene.add(g);
const handlesGroup = new THREE.Group(); scene.add(handlesGroup);
const V = (x,y,z)=> new THREE.Vector3(x,y,z);

/* ============ ХЕЛПЕРЫ ============ */
function fatLine(a, b, color, r=0.024){
  const grp = new THREE.Group();
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length(); if (len < 1e-6) return grp;
  const mid = a.clone().add(b).multiplyScalar(0.5);
  const geo = new THREE.CylinderGeometry(r, r, len, 12, 1, false);
  const mat = new THREE.MeshStandardMaterial({color, roughness:.35, metalness:.1,
    emissive:color, emissiveIntensity:.15});
  const cyl = new THREE.Mesh(geo, mat);
  cyl.position.copy(mid);
  cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
  grp.add(cyl);
  [a, b].forEach(p=>{
    const sp = new THREE.Mesh(new THREE.SphereGeometry(r*1.05, 10, 8), mat);
    sp.position.copy(p); grp.add(sp);
  });
  return grp;
}
function fatArrow(a, b, color, r=0.026, headLen=0.24, headR=0.085){
  const grp = new THREE.Group();
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length(); if (len < 1e-6) return grp;
  const n = dir.clone().normalize();
  const mat = new THREE.MeshStandardMaterial({color, roughness:.4, metalness:.1,
    emissive:color, emissiveIntensity:.4});
  const shaftLen = Math.max(0.001, len - headLen);
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(r, r, shaftLen, 12), mat);
  shaft.position.copy(a.clone().add(n.clone().multiplyScalar(shaftLen/2)));
  shaft.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), n);
  grp.add(shaft);
  const head = new THREE.Mesh(new THREE.ConeGeometry(headR, headLen, 18), mat);
  head.position.copy(a.clone().add(n.clone().multiplyScalar(shaftLen + headLen/2)));
  head.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), n);
  grp.add(head);
  const sp = new THREE.Mesh(new THREE.SphereGeometry(r*1.1, 10, 8), mat);
  sp.position.copy(a); grp.add(sp);
  return grp;
}
function dashedThickLine(a, b, color, r=0.018, dash=0.13, gap=0.09){
  const grp = new THREE.Group();
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length(); if (len < 1e-6) return grp;
  const n = dir.clone().normalize();
  const total = dash + gap; let t = 0;
  while (t < len){
    const s0 = a.clone().add(n.clone().multiplyScalar(t));
    const s1 = a.clone().add(n.clone().multiplyScalar(Math.min(t+dash, len)));
    grp.add(fatLine(s0, s1, color, r)); t += total;
  }
  return grp;
}
function dashedLine(a, b, color, dash=0.09, gap=0.07){
  const mat = new THREE.LineDashedMaterial({color, dashSize:dash, gapSize:gap});
  const geo = new THREE.BufferGeometry().setFromPoints([a, b]);
  const line = new THREE.Line(geo, mat); line.computeLineDistances();
  const grp = new THREE.Group(); grp.add(line); return grp;
}
function point(p, color=0xff6b6b, r=0.075){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12),
                           new THREE.MeshBasicMaterial({color}));
  m.position.copy(p); return m;
}
function label(p, text, color='#e6edf7', size=0.55){
  const c = document.createElement('canvas'); const ctx = c.getContext('2d');
  c.width = 512; c.height = 128;
  ctx.fillStyle='rgba(0,0,0,0)'; ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle=color; ctx.font='bold 72px ui-sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(text,256,64);
  const tex = new THREE.CanvasTexture(c);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false}));
  spr.scale.set(size, size*0.25, 1); spr.position.copy(p); return spr;
}
const labelBig = label;
function planePatch(p1,p2,p3,p4,color,opacity=0.16){
  const verts=[p1,p2,p3,p4];
  const geo=new THREE.BufferGeometry().setFromPoints(verts);
  geo.setIndex([0,1,2,0,2,3]); geo.computeVertexNormals();
  const mat=new THREE.MeshBasicMaterial({color,transparent:true,opacity,
    side:THREE.DoubleSide,depthWrite:false});
  const mesh=new THREE.Mesh(geo,mat);
  const loop=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(verts),
    new THREE.LineBasicMaterial({color,linewidth:1.2,transparent:true,opacity:.7}));
  const wrap=new THREE.Group(); wrap.add(mesh); wrap.add(loop); return wrap;
}
const quadPatch=planePatch;
function polyPatch(points, color, opacity=0.16){
  if (points.length<3) return new THREE.Group();
  const c=new THREE.Vector3(); points.forEach(p=>c.add(p)); c.divideScalar(points.length);
  const verts=[c,...points]; const idx=[];
  for (let i=1;i<verts.length;i++){ const j=(i===verts.length-1)?1:i+1; idx.push(0,i,j); }
  const geo=new THREE.BufferGeometry().setFromPoints(verts);
  geo.setIndex(idx); geo.computeVertexNormals();
  const mat=new THREE.MeshBasicMaterial({color,transparent:true,opacity,
    side:THREE.DoubleSide,depthWrite:false});
  const mesh=new THREE.Mesh(geo,mat);
  const loop=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(points),
    new THREE.LineBasicMaterial({color,transparent:true,opacity:0.55}));
  const wrap=new THREE.Group(); wrap.add(mesh); wrap.add(loop); return wrap;
}
function planeBig(c,u,v,s,color,opacity=0.12){
  const p1=c.clone().add(u.clone().multiplyScalar(s)).add(v.clone().multiplyScalar(s));
  const p2=c.clone().add(u.clone().multiplyScalar(-s)).add(v.clone().multiplyScalar(s));
  const p3=c.clone().add(u.clone().multiplyScalar(-s)).add(v.clone().multiplyScalar(-s));
  const p4=c.clone().add(u.clone().multiplyScalar(s)).add(v.clone().multiplyScalar(-s));
  return planePatch(p1,p2,p3,p4,color,opacity);
}
function triangle3D(A,B,C,color,opacity=0.28){
  const geo=new THREE.BufferGeometry().setFromPoints([A,B,C]);
  geo.setIndex([0,1,2]); geo.computeVertexNormals();
  const mat=new THREE.MeshBasicMaterial({color,transparent:true,opacity,
    side:THREE.DoubleSide,depthWrite:false});
  const mesh=new THREE.Mesh(geo,mat); const wrap=new THREE.Group(); wrap.add(mesh); return wrap;
}
function polyhedron(faces,color,opacity=0.18){
  const grp=new THREE.Group();
  faces.forEach(face=>{
    const geo=new THREE.BufferGeometry().setFromPoints(face);
    const idx=[]; for (let i=1;i<face.length-1;i++) idx.push(0,i,i+1);
    geo.setIndex(idx); geo.computeVertexNormals();
    const mat=new THREE.MeshBasicMaterial({color,transparent:true,opacity,
      side:THREE.DoubleSide,depthWrite:false});
    grp.add(new THREE.Mesh(geo,mat));
  });
  return grp;
}
function addConvexPiece(verts,color,opacity=0.55){
  const geo=new ConvexGeometry(verts);
  geo.computeVertexNormals();
  const mat=new THREE.MeshStandardMaterial({
    color,flatShading:true,roughness:0.55,metalness:0.05,
    transparent:true,opacity,side:THREE.DoubleSide,
    emissive:color,emissiveIntensity:0.12});
  const mesh=new THREE.Mesh(geo,mat);
  const eg=new THREE.EdgesGeometry(geo,14);
  const lines=new THREE.LineSegments(eg,
    new THREE.LineBasicMaterial({color:0x0a0d12,transparent:true,opacity:0.7}));
  mesh.add(lines); g.add(mesh);
}
function rightAngleAt(O,P1,P2,size,color){
  const d1=new THREE.Vector3().subVectors(P1,O);
  const d2=new THREE.Vector3().subVectors(P2,O);
  if (d1.lengthSq()<1e-8 || d2.lengthSq()<1e-8) return new THREE.Group();
  d1.normalize(); d2.normalize();
  const a=O.clone().add(d1.clone().multiplyScalar(size));
  const b=O.clone().add(d1.clone().multiplyScalar(size)).add(d2.clone().multiplyScalar(size));
  const c=O.clone().add(d2.clone().multiplyScalar(size));
  const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b,c]),
    new THREE.LineBasicMaterial({color}));
  const grp=new THREE.Group(); grp.add(line); return grp;
}
function arcAngle(O,dir1,dir2,radius,color,width=1.6){
  const d1=dir1.clone().normalize(); const d2=dir2.clone().normalize();
  const arcPts=[]; const N=32;
  let e2=d2.clone().sub(d1.clone().multiplyScalar(d1.dot(d2)));
  if (e2.length()<1e-6) e2=new THREE.Vector3(0,1,0).cross(d1);
  e2.normalize();
  const angle=Math.acos(Math.max(-1,Math.min(1,d1.dot(d2))));
  for (let i=0;i<=N;i++){
    const t=i/N*angle;
    arcPts.push(O.clone()
      .add(d1.clone().multiplyScalar(Math.cos(t)*radius))
      .add(e2.clone().multiplyScalar(Math.sin(t)*radius)));
  }
  const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(arcPts),
    new THREE.LineBasicMaterial({color,linewidth:width}));
  const grp=new THREE.Group(); grp.add(line); return grp;
}
function ray(a,b,color,r=0.026){
  const grp=new THREE.Group();
  const dir=new THREE.Vector3().subVectors(b,a).normalize();
  const end=b.clone().add(dir.clone().multiplyScalar(-r*6));
  grp.add(fatLine(a,end,color,r));
  const cone=new THREE.Mesh(new THREE.ConeGeometry(r*2.5,r*7,14),
    new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:0.25}));
  cone.position.copy(b.clone().add(dir.clone().multiplyScalar(-r*3.5)));
  cone.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir);
  grp.add(cone); return grp;
}
function disposeObj(obj){
  if (obj.geometry&&obj.geometry.dispose) obj.geometry.dispose();
  if (obj.material){
    if (Array.isArray(obj.material)) obj.material.forEach(m=>m.dispose());
    else if (obj.material.dispose) obj.material.dispose();
  }
  if (obj.children) for (let i=obj.children.length-1;i>=0;i--) disposeObj(obj.children[i]);
}
function clearGroup(grp){
  for (let i=grp.children.length-1;i>=0;i--){ const c=grp.children[i]; grp.remove(c); disposeObj(c); }
}
function triangleArea3D(A,B,C){
  return 0.5*new THREE.Vector3().subVectors(B,A)
    .cross(new THREE.Vector3().subVectors(C,A)).length();
}
function footOnPlane(P,A,B,C){
  const n=new THREE.Vector3().subVectors(B,A).cross(new THREE.Vector3().subVectors(C,A)).normalize();
  const t=new THREE.Vector3().subVectors(P,A).dot(n);
  return P.clone().sub(n.multiplyScalar(t));
}
function tOnEdge(p,S,E){
  const dir=new THREE.Vector3().subVectors(E,S);
  const L2=dir.lengthSq(); if (L2<1e-9) return 0;
  return new THREE.Vector3().subVectors(p,S).dot(dir)/L2;
}
function makeHandleMesh(pos,colorHex,name){
  const col=new THREE.Color(colorHex);
  const rgb=Math.round(col.r*255)+','+Math.round(col.g*255)+','+Math.round(col.b*255);
  const mesh=new THREE.Mesh(new THREE.SphereGeometry(0.06,16,12),
    new THREE.MeshStandardMaterial({color:colorHex,emissive:colorHex,
      emissiveIntensity:1.4,roughness:0.3,metalness:0.1}));
  mesh.position.copy(pos); mesh.userData.name=name;
  const c=document.createElement('canvas'); c.width=128; c.height=128;
  const ctx=c.getContext('2d');
  const grd=ctx.createRadialGradient(64,64,2,64,64,60);
  grd.addColorStop(0,`rgba(${rgb},0.85)`);
  grd.addColorStop(0.45,`rgba(${rgb},0.30)`);
  grd.addColorStop(1,`rgba(${rgb},0)`);
  ctx.fillStyle=grd; ctx.fillRect(0,0,128,128);
  const tex=new THREE.CanvasTexture(c);
  const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,
    depthWrite:false,depthTest:false,blending:THREE.AdditiveBlending}));
  glow.scale.set(0.55,0.55,1); mesh.add(glow); return mesh;
}

/* ============ ИНТЕРАКТИВ ============ */
const raycaster=new THREE.Raycaster();
const pointerNDC=new THREE.Vector2();
const dragPlane=new THREE.Plane();
let draggingHandle=null, currentId=null;
const interactState={};

function pointerToNDC(e){
  const rect=renderer.domElement.getBoundingClientRect();
  pointerNDC.x=((e.clientX-rect.left)/rect.width)*2-1;
  pointerNDC.y=-((e.clientY-rect.top)/rect.height)*2+1;
}
function onPointerDown(e){
  if (e.button!==0||handlesGroup.children.length===0) return;
  pointerToNDC(e); raycaster.setFromCamera(pointerNDC,camera);
  const hits=raycaster.intersectObjects(handlesGroup.children,true);
  if (hits.length>0){
    let target=hits[0].object;
    while (target && !target.userData.name && target.parent) target=target.parent;
    if (!target||!target.userData.name) return;
    draggingHandle=target; controls.enabled=false;
    const camDir=new THREE.Vector3(); camera.getWorldDirection(camDir);
    dragPlane.setFromNormalAndCoplanarPoint(camDir,draggingHandle.position);
  }
}
function syncHandles(id){
  const s=SCENES[id]; if (!s||!s.handles) return;
  const list=s.handles();
  handlesGroup.children.forEach(mesh=>{
    const h=list.find(x=>x.name===mesh.userData.name);
    if (h) mesh.position.copy(h.pos);
  });
}
function onPointerMove(e){
  if (!draggingHandle) return;
  pointerToNDC(e); raycaster.setFromCamera(pointerNDC,camera);
  const newPos=new THREE.Vector3();
  if (!raycaster.ray.intersectPlane(dragPlane,newPos)) return;
  const s=SCENES[currentId], st=interactState[currentId];
  if (!s||!st) return;
  st[draggingHandle.userData.name]=newPos.clone();
  if (s.restrict) s.restrict(st, draggingHandle.userData.name);
  rebuildStatic(currentId);
  syncHandles(currentId);
}
function onPointerUp(){ if (draggingHandle){ draggingHandle=null; controls.enabled=true; } }
renderer.domElement.addEventListener('pointerdown',onPointerDown);
window.addEventListener('pointermove',onPointerMove);
window.addEventListener('pointerup',onPointerUp);

function rebuildStatic(id){ clearGroup(g); SCENES[id].build(); }
function disposeHandles(){ clearGroup(handlesGroup); draggingHandle=null; controls.enabled=true; }
function setupHandles(id){
  disposeHandles();
  const s=SCENES[id]; if (!s||!s.handles) return;
  s.handles().forEach(h=>{ handlesGroup.add(makeHandleMesh(h.pos,h.color||0xffb84d,h.name)); });
}
function clampToEdge(st,name,S,E,kMin=0.1,kMax=0.95){
  const p=st[name]; const dir=new THREE.Vector3().subVectors(E,S);
  const L2=dir.lengthSq(); if (L2<1e-9) return;
  let k=new THREE.Vector3().subVectors(p,S).dot(dir)/L2;
  if (k<kMin) k=kMin; if (k>kMax) k=kMax;
  st[name]=S.clone().add(dir.clone().multiplyScalar(k));
}

function scenePerpDihedral(){
  const st=interactState['perpDihedral'];
  const P=st.P.clone();
  const R=1.8;
  g.add(fatLine(V(0,0,-R),V(0,0,R),0xffffff,0.032));
  let phi=Math.atan2(P.y,P.x);
  let phiDeg=phi*180/Math.PI;
  if (phiDeg<10) phiDeg=10; if (phiDeg>170) phiDeg=170;
  phi=phiDeg*Math.PI/180;
  const u=V(Math.cos(phi),Math.sin(phi),0),v=V(1,0,0);
  g.add(planePatch(V(0,0,-R),V(0,0,R),
    v.clone().multiplyScalar(R).add(V(0,0,R)),
    v.clone().multiplyScalar(R).add(V(0,0,-R)),0x6ba8ff,0.22));
  g.add(planePatch(V(0,0,-R),V(0,0,R),

  g.add(fatLine(V(0,0,0),v.clone().multiplyScalar(1.6),0xff6b6b,0.028));
  g.add(fatLine(V(0,0,0),u.clone().multiplyScalar(1.6),0xff6b6b,0.028));
  g.add(rightAngleAt(V(0,0,0),V(0,0,1),v,0.18,0xffffff));
  g.add(rightAngleAt(V(0,0,0),V(0,0,1),u,0.18,0xffffff));
  g.add(arcAngle(V(0,0,0),v,u,0.6,0x3ddc97));

  g.add(label(V(0,0,R+.15),'a','#ffffff'));
  g.add(label(v.clone().multiplyScalar(R*.7).add(V(0,0,-.3)),'γ','#6ba8ff',0.6));
  g.add(label(u.clone().multiplyScalar(R*.7).add(V(0,0,-.3)),'β','#ffa94d',0.6));

}

  const st=interactState['hackAngleProj'];
  return [{name:'C',pos:V(0,st.Hh*Math.sin(st.phi),st.Hh*Math.cos(st.phi)),color:0xffd93d},
          {name:'Cp',pos:V(0,.02,st.Hh*Math.cos(st.phi)),color:0x6ba8ff}];
};
sceneHackAngleProj.restrict=(st,name)=>{
  if (name==='C'){const p=st.C; if (!p) return;
    let y=Math.max(p.y,.15),z=Math.max(p.z,.15);
    let phi=Math.atan2(y,z); let Hh=Math.sqrt(y*y+z*z);
    if (phi<.15) phi=.15; if (phi>Math.PI/2-.1) phi=Math.PI/2-.1;
    Hh=Math.min(Math.max(Hh,.45),1.95);
    st.phi=phi; st.Hh=Hh;
  } else if (name==='Cp'){const p=st.Cp; if (!p) return;
    const h2=Math.min(Math.max(p.z,.15),1.85);
    const c=Math.max(Math.cos(st.phi),.18);
    st.Hh=Math.min(Math.max(h2/c,.45),1.95);
  }
};

/* ============================================================
   ПАЛАТКА — ТРЕУГОЛЬНАЯ ПИРАМИДА
   Пирамида S-ABC. Точки M на SA, N на SB, T на AC, K на BC.
   Режим 0 (призмовидная): MN ∥ AB, TK ∥ AB → палатка = M-ABTK ∪ M-BNT.
   Режим 1 (пирамидальная): MN не ∥ ABC → строим R = MN ∩ (продолжение AB).
   ============================================================ */
let tentTriMode = 0;
let tentQuadMode = 0;

function sceneHackTentTri(){
  const st=interactState['hackTentTri'];
  const S=V(0,2.2,0);
  const A=V(-1.2,0,-.9), B=V(1.2,0,-.9), C=V(0,0,1.1);

  // Призмовидный режим — M и N на одной высоте, T и K на одной высоте
  let tM=st.tM, tN=st.tN, tT=st.tT, tK=st.tK;
  if (tentTriMode===0){
    tN=tM; tK=tT;
    st.tN=tN; st.tK=tK;
  }

  const M=S.clone().lerp(A,tM);
  const N=S.clone().lerp(B,tN);
  const T=A.clone().lerp(C,tT);
  const K=B.clone().lerp(C,tK);

  // Контур пирамиды
  g.add(polyhedron([[A,B,C],[S,A,B],[S,B,C],[S,C,A]],0x6ba8ff,0.05));
  [S,A,B,C].forEach(p=>{});
  const wire=0x6ba8ff;
  g.add(fatLine(S,A,wire,0.013)); g.add(fatLine(S,B,wire,0.013)); g.add(fatLine(S,C,wire,0.013));
  g.add(fatLine(A,B,wire,0.013)); g.add(fatLine(B,C,wire,0.013)); g.add(fatLine(C,A,wire,0.013));
  g.add(point(S,0xffffff,0.08)); g.add(point(A,0xffffff,0.07));
  g.add(point(B,0xffffff,0.07)); g.add(point(C,0xffffff,0.07));
  g.add(label(S.clone().add(V(0,.2,0)),'S','#6ba8ff',.5));
  g.add(label(A.clone().add(V(-.18,-.1,.1)),'A','#6ba8ff',.5));
  g.add(label(B.clone().add(V(.18,-.1,.1)),'B','#6ba8ff',.5));
  g.add(label(C.clone().add(V(.1,.1,.15)),'C','#6ba8ff',.5));

  // Заливка четырёхугольной палатки-пирамиды M-ABTK
  g.add(triangle3D(M,A,B,0xffa94d,0.32));
  g.add(triangle3D(M,B,K,0xffa94d,0.32));
  g.add(triangle3D(M,K,T,0xffa94d,0.32));
  g.add(triangle3D(M,T,A,0xffa94d,0.32));
  g.add(triangle3D(A,B,K,0xffa94d,0.20));
  g.add(triangle3D(A,K,T,0xffa94d,0.20));
  g.add(fatLine(M,A,0xffa94d,0.022)); g.add(fatLine(M,B,0xffa94d,0.022));
  g.add(fatLine(M,K,0xffa94d,0.022)); g.add(fatLine(M,T,0xffa94d,0.022));
  g.add(fatLine(A,B,0xff6b6b,0.022)); g.add(fatLine(B,K,0xff6b6b,0.018));
  g.add(fatLine(K,T,0xff6b6b,0.022)); g.add(fatLine(T,A,0xff6b6b,0.018));

  // Заливка треугольной палатки-пирамиды M-BNT (общая грань M-BT)
  g.add(triangle3D(M,B,N,0x3ddc97,0.42));
  g.add(triangle3D(M,N,T,0x3ddc97,0.42));
  g.add(triangle3D(M,T,B,0x3ddc97,0.42));
  g.add(triangle3D(B,N,T,0x3ddc97,0.30));
  g.add(fatLine(M,N,0x3ddc97,0.022));
  g.add(fatLine(N,T,0x3ddc97,0.022));
  g.add(fatLine(M,T,0x3ddc97,0.022));

  // Верхнее ребро MN
  g.add(fatLine(M,N,0xffd93d,0.028));
  g.add(fatLine(T,K,0xffd93d,0.026));

  // Точки и метки
  g.add(point(M,0xffd93d,0.08)); g.add(point(N,0xffd93d,0.08));
  g.add(point(T,0xff6b6b,0.08)); g.add(point(K,0xff6b6b,0.08));
  g.add(label(M.clone().add(V(-.12,.10,.06)),'M','#ffd93d',.5));
  g.add(label(N.clone().add(V(.12,.10,.06)),'N','#ffd93d',.5));
  g.add(label(T.clone().add(V(-.12,-.10,.04)),'T','#ff6b6b',.5));
  g.add(label(K.clone().add(V(.12,-.10,.04)),'K','#ff6b6b',.5));

  // Если пирамидальный режим — показываем R = MN ∩ AB (продолжение)
  if (tentTriMode===1){
    const dMN=new THREE.Vector3().subVectors(N,M);
    const dAB=new THREE.Vector3().subVectors(B,A);
    // Решаем M + s·dMN = A + t·dAB в плоскости, содержащей SAB.
    // Проще: обе прямые лежат в плоскости SAB. Решаем 2D.
    // Базис: e1 = AB, e2 = A->S. В этой плоскости MN и AB пересекаются в R.
    const e1=dAB.clone().normalize();
    const e2=new THREE.Vector3().subVectors(S,A);
    e2.sub(e1.clone().multiplyScalar(e2.dot(e1)));
    e2.normalize();
    const to2=(P)=>{
      const v=new THREE.Vector3().subVectors(P,A);
      return {x:v.dot(e1), y:v.dot(e2)};
    };
    const M2=to2(M), N2=to2(N);
    const dM2={x:N2.x-M2.x, y:N2.y-M2.y};
    // Прямая AB: y=0, x — параметр
    // M + s·dM2 : y = M2.y + s·dM2.y = 0 → s = -M2.y/dM2.y
    if (Math.abs(dM2.y)>1e-3){
      const sR=-M2.y/dM2.y;
      const R2={x:M2.x+sR*dM2.x, y:0};
      const R=A.clone().add(e1.clone().multiplyScalar(R2.x));
      // Пунктир продолжений MN и AB до R
      const farMN=(M.distanceTo(R)>N.distanceTo(R))?M:N;
      g.add(dashedThickLine(farMN,R,0xffd93d,0.012,0.10,0.06));
      const farAB=(A.distanceTo(R)>B.distanceTo(R))?A:B;
      g.add(dashedThickLine(farAB,R,0xff6b6b,0.012,0.10,0.06));
      // Точка R
      g.add(point(R,0xff3d7f,0.10));
      g.add(label(R.clone().add(V(.12,.10,0)),'R','#ff3d7f',.6));
      // Большая пирамида M-BTR (треугольник B-T-R)
      g.add(triangle3D(M,B,T,0x9b6dff,0.24));
      g.add(triangle3D(M,T,R,0x9b6dff,0.24));
      g.add(triangle3D(M,R,B,0x9b6dff,0.24));
      g.add(fatLine(M,R,0x9b6dff,0.018));
      g.add(fatLine(T,R,0x9b6dff,0.018));
    }
  }

  if (tentTriMode===0){
    setCaption(
      '<b>Палатка в треугольной пирамиде, призмовидная (MN ∥ ABC).</b> ' +
      '<div style="margin-top:6px">V = V(M–ABTK) + V(M–BNT)</div>',
      '<span class="lead">Идея</span>' +
      'M и N — на SA и SB на одной высоте, T и K — середины AC и BC. ' +
      'Палатка = четырёхугольная пирамида M-ABTK (основание голубое) ' +
      '+ треугольная пирамида M-BNT (основание жёлтое).'
    );
  } else {
    setCaption(
      '<b>Палатка в треугольной пирамиде, пирамидальная (MN ／ ABC).</b> ' +
      '<div style="margin-top:6px">V = V(M–ABTK) + V(M–BTR) − V(M–BNR)</div>',
      '<span class="lead">Идея</span>' +
      'MN не параллельна ABC — продолжаем MN и AB до пересечения в R. ' +
      'Через R строим большую пирамиду M-BTR, из которой вычитаем лишний кусок M-BNR. ' +
      'Итого: V(M-ABTK) + V(M-BTR) − V(M-BNR).'
    );
  }
}

/* ============================================================
   ПАЛАТКА — ЧЕТЫРЁХУГОЛЬНАЯ ПИРАМИДА
   Пирамида S-ABCD (в основании — параллелограмм/квадрат).
   M на SA, N на SB, T на AD, K на BC.
   Режим 0: MN ∥ AB, TK ∥ AB → M-ABKT ∪ M-BNT (та же идея).
   Режим 1: MN не ∥ → R = MN ∩ AB.
   ============================================================ */
function sceneHackTentQuad(){
  const st=interactState['hackTentQuad'];
  const S=V(0,2.2,0);
  const A=V(-1.1,0,-1.1),B=V(1.1,0,-1.1),C=V(1.1,0,1.1),D=V(-1.1,0,1.1);

  let tM=st.tM, tN=st.tN, tT=st.tT, tK=st.tK;
  if (tentQuadMode===0){ tN=tM; tK=tT; st.tN=tN; st.tK=tK; }

  const M=S.clone().lerp(A,tM);
  const N=S.clone().lerp(B,tN);
  const T=A.clone().lerp(D,tT);
  const K=B.clone().lerp(C,tK);

  // Контур пирамиды
  g.add(polyhedron([[A,B,C,D],[S,A,B],[S,B,C],[S,C,D],[S,D,A]],0x6ba8ff,0.05));
  const wire=0x6ba8ff;
  [S,A,B,C,D].forEach(p=>{});
  [[S,A],[S,B],[S,C],[S,D],[A,B],[B,C],[C,D],[D,A]].forEach(p=>
    g.add(fatLine(p[0],p[1],wire,0.013)));
  [S,A,B,C,D].forEach(p=>g.add(point(p,0xffffff,0.075)));
  g.add(label(S.clone().add(V(0,.2,0)),'S','#6ba8ff',.5));
  g.add(label(A.clone().add(V(-.18,-.1,.1)),'A','#6ba8ff',.5));
  g.add(label(B.clone().add(V(.18,-.1,.1)),'B','#6ba8ff',.5));
  g.add(label(C.clone().add(V(.18,-.1,-.1)),'C','#6ba8ff',.5));
  g.add(label(D.clone().add(V(-.18,-.1,-.1)),'D','#6ba8ff',.5));

  // Четырёхугольная пирамида M-ABKT (основание ABKT)
  g.add(triangle3D(M,A,B,0xffa94d,0.32));
  g.add(triangle3D(M,B,K,0xffa94d,0.32));
  g.add(triangle3D(M,K,T,0xffa94d,0.32));
  g.add(triangle3D(M,T,A,0xffa94d,0.32));
  // Основание ABKT (4-угольник в плоскости ABCD)
  g.add(triangle3D(A,B,K,0x8fb8ff,0.35));
  g.add(triangle3D(A,K,T,0x8fb8ff,0.35));
  g.add(fatLine(A,B,0xff6b6b,0.022));
  g.add(fatLine(B,K,0xff6b6b,0.018));
  g.add(fatLine(K,T,0xff6b6b,0.022));
  g.add(fatLine(T,A,0xff6b6b,0.018));

  // Треугольная пирамида M-BNT (основание BNT — на боковой грани)
  g.add(triangle3D(M,B,N,0x3ddc97,0.42));
  g.add(triangle3D(M,N,T,0x3ddc97,0.42));
  g.add(triangle3D(M,T,B,0x3ddc97,0.42));
  g.add(triangle3D(B,N,T,0x3ddc97,0.30));
  g.add(fatLine(M,N,0x3ddc97,0.022));
  g.add(fatLine(N,T,0x3ddc97,0.022));
  g.add(fatLine(M,T,0x3ddc97,0.022));

  // Верхнее ребро MN и линия TK
  g.add(fatLine(M,N,0xffd93d,0.028));
  g.add(fatLine(T,K,0xffd93d,0.026));

  // Рёбра палатки (жирнее)
  g.add(fatLine(M,A,0xffa94d,0.024)); g.add(fatLine(M,B,0xffa94d,0.024));
  g.add(fatLine(M,K,0xffa94d,0.024)); g.add(fatLine(M,T,0xffa94d,0.024));

  // Точки и метки
  g.add(point(M,0xffd93d,0.08)); g.add(point(N,0xffd93d,0.08));
  g.add(point(T,0xff6b6b,0.08)); g.add(point(K,0xff6b6b,0.08));
  g.add(label(M.clone().add(V(-.12,.10,.06)),'M','#ffd93d',.5));
  g.add(label(N.clone().add(V(.12,.10,.06)),'N','#ffd93d',.5));
  g.add(label(T.clone().add(V(-.12,-.10,.04)),'T','#ff6b6b',.5));
  g.add(label(K.clone().add(V(.12,-.10,.04)),'K','#ff6b6b',.5));

  // След диагонали AC основания — для пирамидального режима
  if (tentQuadMode===1){
    const dMN=new THREE.Vector3().subVectors(N,M);
    const dAB=new THREE.Vector3().subVectors(B,A);
    const e1=dAB.clone().normalize();
    const e2=new THREE.Vector3().subVectors(S,A);
    e2.sub(e1.clone().multiplyScalar(e2.dot(e1))); e2.normalize();
    const to2=P=>{const v=new THREE.Vector3().subVectors(P,A); return {x:v.dot(e1),y:v.dot(e2)};};
    const M2=to2(M),N2=to2(N);
    const dM2={x:N2.x-M2.x,y:N2.y-M2.y};
    if (Math.abs(dM2.y)>1e-3){
      const sR=-M2.y/dM2.y;
      const R2={x:M2.x+sR*dM2.x,y:0};
      const R=A.clone().add(e1.clone().multiplyScalar(R2.x));
      const farMN=(M.distanceTo(R)>N.distanceTo(R))?M:N;
      g.add(dashedThickLine(farMN,R,0xffd93d,0.012,0.10,0.06));
      const farAB=(A.distanceTo(R)>B.distanceTo(R))?A:B;
      g.add(dashedThickLine(farAB,R,0xff6b6b,0.012,0.10,0.06));
      g.add(point(R,0xff3d7f,0.10));
      g.add(label(R.clone().add(V(.12,.10,0)),'R','#ff3d7f',.6));
      g.add(triangle3D(M,B,T,0x9b6dff,0.24));
      g.add(triangle3D(M,T,R,0x9b6dff,0.24));
      g.add(triangle3D(M,R,B,0x9b6dff,0.24));
      g.add(fatLine(M,R,0x9b6dff,0.018));
      g.add(fatLine(T,R,0x9b6dff,0.018));
    }
  }

  if (tentQuadMode===0){
    setCaption(
      '<b>Палатка в четырёхугольной пирамиде, призмовидная (MN ∥ AB).</b>' +
      '<div style="margin-top:6px">V = V(M–ABKT) + V(M–BNT)</div>' +
      '<div style="margin-top:6px;font-size:13px;color:#b6f3ed">' +
        'Для 4-угольной пирамиды диагональ AC разбивает ABCD на ABC и ACD; ' +
        'объём палатки = сумма объёмов в двух треугольных.</div>',
      '<span class="lead">Идея</span>' +
      'Та же схема, что для треугольной: четырёхугольная пирамида M-ABKT (основание голубое) ' +
      '+ треугольная M-BNT (основание жёлтое).'
    );
  } else {
    setCaption(
      '<b>Палатка в четырёхугольной пирамиде, пирамидальная (MN ／ AB).</b>' +
      '<div style="margin-top:6px">V = V(M–ABKT) + V(M–BTR) − V(M–BNR)</div>',
      '<span class="lead">Идея</span>' +
      'Продолжаем MN и AB до пересечения в R. Большая пирамида M-BTR содержит палатку и лишний кусок M-BNR. ' +
      'Вычитаем его. Для 4-угольной пирамиды всё делается по диагоналям на две треугольные.'
    );
  }
}

sceneHackTentQuad.restrict=(st,name)=>{
  const S=V(0,2.2,0);
  const A=V(-1.1,0,-1.1),B=V(1.1,0,-1.1),C=V(1.1,0,1.1),D=V(-1.1,0,1.1);
  if (name==='tM'){ clampToEdge(st,'tM',S,A,.15,.85); st.tM=tOnEdge(st.tM,S,A); }
  else if (name==='tN'){ clampToEdge(st,'tN',S,B,.15,.85); st.tN=tOnEdge(st.tN,S,B); }
  else if (name==='tT'){ clampToEdge(st,'tT',A,D,.15,.85); st.tT=tOnEdge(st.tT,A,D); }
  else if (name==='tK'){ clampToEdge(st,'tK',B,C,.15,.85); st.tK=tOnEdge(st.tK,B,C); }
  if (tentQuadMode===0){ st.tN=st.tM; st.tK=st.tT; }
};

function buildTPParallel(grp){

  (function(){const c=V(0,.7,0);
    const u=V(1,1,0).normalize().multiplyScalar(Rz);
    const w=V(0,0,1).multiplyScalar(Z);

      c.clone().add(u.clone().multiplyScalar(-1)).add(w),
      c.clone().add(u.clone().multiplyScalar(-1)).add(w.clone().multiplyScalar(-1)),
      c.clone().add(u).add(w.clone().multiplyScalar(-1)),0xffa94d,0.14));})();
  (function(){const c=V(0,.7,0);
    const u=V(1,-1,0).normalize().multiplyScalar(Rz);
    const w=V(0,0,1).multiplyScalar(Z);
    grp.add(quadPatch(c.clone().add(u).add(w),
      c.clone().add(u.clone().multiplyScalar(-1)).add(w),
      c.clone().add(u.clone().multiplyScalar(-1)).add(w.clone().multiplyScalar(-1)),

function buildPyramidTP(grp){
  const S=V(0,1.35,0);
  const A1=V(-1.05,-.65,.55),B1=V(1.05,-.65,.55),C1=V(0,-.65,-1.05);
  const A2=V(-.65,.15,.35),B2=V(.65,.15,.35),C2=V(0,.15,-.65);

  grp.add(quadPatch(B1,C1,C2,B2,0xffa94d,0.20));
  grp.add(quadPatch(C1,A1,A2,C2,0x6ba8ff,0.20));

   [A1,A2],[B1,B2],[C1,C2]].forEach(p=>grp.add(fatLine(p[0],p[1],0x2b4770,0.018)));

  grp.add(dashedThickLine(C2,S,0x6ba8ff,0.016));

function buildPrismTP(grp){
  const yT=1.4,yB=-.4,r=1;
  const Ab=V(-r*Math.sqrt(3)/2,yB,r/2),Bb=V(r*Math.sqrt(3)/2,yB,r/2),Cb=V(0,yB,-r);
  const At=V(-r*Math.sqrt(3)/2,yT,r/2),Bt=V(r*Math.sqrt(3)/2,yT,r/2),Ct=V(0,yT,-r);
  grp.add(quadPatch(Ab,Bb,Bt,At,0x3ddc97,0.20));
  grp.add(quadPatch(Bb,Cb,Ct,Bt,0xffa94d,0.20));
  grp.add(quadPatch(Cb,Ab,At,Ct,0x6ba8ff,0.20));
  grp.add(fatLine(Ab,At,0x3ddc97,0.03));
  grp.add(fatLine(Bb,Bt,0xffa94d,0.03));
  grp.add(fatLine(Cb,Ct,0x6ba8ff,0.03));
}

function createMiniScene(parentEl,buildFn,labelHtml,camPos){
  camPos=camPos||[3,2.6,3.8];
  const labelEl=document.createElement('div');
  labelEl.className='mini-label'; labelEl.innerHTML=labelHtml;
  parentEl.appendChild(labelEl);
  const r=new THREE.WebGLRenderer({antialias:true,alpha:true});
  r.setPixelRatio(Math.min(devicePixelRatio,2));
  r.setSize(parentEl.clientWidth,parentEl.clientHeight);
  parentEl.appendChild(r.domElement);
  const s=new THREE.Scene();
  const c=new THREE.PerspectiveCamera(42,parentEl.clientWidth/parentEl.clientHeight,0.1,200);
  c.position.set(camPos[0],camPos[1],camPos[2]); c.lookAt(0,0,0);
  const ctr=new OrbitControls(c,r.domElement);
  ctr.enableDamping=true; ctr.dampingFactor=0.08;
  ctr.minDistance=.5; ctr.maxDistance=20;
  ctr.target.set(0,0,0); ctr.update();
  s.add(new THREE.HemisphereLight(0xdce8ff,0x1a2233,1.6));
  const kk=new THREE.DirectionalLight(0xffffff,2.0); kk.position.set(6,9,7); s.add(kk);
  const rr=new THREE.DirectionalLight(0x7fa8ff,1.0); rr.position.set(-7,-3,-6); s.add(rr);
  const grp=new THREE.Group(); s.add(grp); buildFn(grp);
  miniScenes.push({renderer:r,scene:s,camera:c,controls:ctr,el:parentEl});
}
function destroyMiniScenes(){
  while (miniScenes.length){
    const m=miniScenes.pop();
    m.renderer.dispose();
    if (m.renderer.domElement.parentNode) m.renderer.domElement.parentNode.removeChild(m.renderer.domElement);
  }
  quadEl.innerHTML='';
}
let quadMode=false;
function hideAllViews(){
  singleEl.style.display='none';
  quadEl.style.display='none';
  segEl.style.display='none';
  destroyMiniScenes(); quadMode=false;
}
function showSingle(id){
  hideAllViews();
  singleEl.style.display='block';
  if (!renderer.domElement.parentNode) singleEl.appendChild(renderer.domElement);
  renderer.setSize(singleEl.clientWidth,singleEl.clientHeight);
  const s=SCENES[id]; if (!s) return;
  currentId=id;
  disposeHandles(); clearGroup(g);
  if (s.interactive && !interactState[id]) interactState[id]=s.initState();
  try { s.build(); } catch(e){ console.error(e);
    captionEl.innerHTML='<b style="color:#ff6b6b">Ошибка:</b> '+e.message; return; }
  if (id==='hackTentTri'||id==='hackTentQuad'){
    segEl.style.display='flex';
    segEl.querySelectorAll('button').forEach(b=>{
      b.classList.toggle('on', Number(b.dataset.mode)===(id==='hackTentTri'?tentTriMode:tentQuadMode));
    });
  }
  if (s.cap!=='') setCaption(s.cap,s.detail||null);
  camera.position.set(s.cam[0],s.cam[1],s.cam[2]);
  controls.target.set(s.tgt[0],s.tgt[1],s.tgt[2]);
  camera.aspect=singleEl.clientWidth/singleEl.clientHeight;
  camera.updateProjectionMatrix(); controls.update();
  setupHandles(id); renderer.render(scene,camera);
}
function showQuad(){
  hideAllViews();
  quadEl.style.display='grid'; quadMode=true;
  captionEl.style.display='none';
  const m1=document.createElement('div'); m1.className='mini'; quadEl.appendChild(m1);
  const m2=document.createElement('div'); m2.className='mini'; quadEl.appendChild(m2);
  const m3=document.createElement('div'); m3.className='mini'; quadEl.appendChild(m3);
  const m4=document.createElement('div'); m4.className='mini'; quadEl.appendChild(m4);
  requestAnimationFrame(()=>{
    createMiniScene(m1,buildTPPoint,'<b>1. Три плоскости — в одной точке.</b>');
    createMiniScene(m2,buildTPParallel,'<b>2. Три плоскости — по параллельным.</b>');
    createMiniScene(m3,buildPyramidTP,'<b>3. Пирамида.</b>');
    createMiniScene(m4,buildPrismTP,'<b>4. Призма без оснований.</b>');
  });
}
segEl.querySelectorAll('button').forEach(b=>{
  b.addEventListener('click',()=>{
    segEl.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    const m=Number(b.dataset.mode);
    if (currentId==='hackTentTri'){ tentTriMode=m; interactState['hackTentTri']=sceneHackTentTri.initState(); showSingle('hackTentTri'); }
    else if (currentId==='hackTentQuad'){ tentQuadMode=m; interactState['hackTentQuad']=sceneHackTentQuad.initState(); showSingle('hackTentQuad'); }
  });
});
document.querySelectorAll('#menu button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('#menu button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const id=btn.dataset.id;
    captionEl.style.display='';
    if (id==='tpQuad') showQuad();
    else showSingle(id);
  });
});
document.querySelectorAll('.menu details').forEach(det=>{
  det.addEventListener('toggle',()=>{
    if (det.open) document.querySelectorAll('.menu details').forEach(o=>{if (o!==det&&o.open) o.open=false;});
  });
});
addEventListener('resize',()=>{
  if (quadMode){
    miniScenes.forEach(m=>{
      const w=m.el.clientWidth,h=m.el.clientHeight;
      m.camera.aspect=w/h; m.camera.updateProjectionMatrix();
      m.renderer.setSize(w,h);
    });
  } else {
    const w=singleEl.clientWidth,h=singleEl.clientHeight;
    camera.aspect=w/h; camera.updateProjectionMatrix();
    renderer.setSize(w,h);
  }
});
function loop(){
  requestAnimationFrame(loop);
  if (quadMode){
    miniScenes.forEach(m=>{ m.controls.update(); m.renderer.render(m.scene,m.camera); });
  } else {
    controls.update(); renderer.render(scene,camera);
  }
}
showSingle('ax1');
loop();
</script>
</body>
</html>
