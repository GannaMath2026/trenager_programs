<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Сонаправленные лучи — 3D</title>
<style>
  :root{ --txt:#e6edf7; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;}
  body{
    background:radial-gradient(1200px 800px at 75% 15%, #1c2740 0%, #0b1018 60%, #070a10 100%);
    color:var(--txt);font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  }
  #app{position:fixed;inset:0;display:flex;}
  .menu{
    width:360px;height:100%;
    background:rgba(12,17,26,.92);
    border-right:1px solid rgba(255,255,255,.08);
    padding:18px 14px;overflow-y:auto;
    backdrop-filter:blur(10px);
  }
  .menu h2{
    font-size:12px;text-transform:uppercase;letter-spacing:1px;
    color:#8fa3bf;margin:16px 0 8px 6px;font-weight:700;
  }
  .menu h2:first-child{margin-top:0;}
  .menu h2.section{color:#4ecdc4;}
  .menu button{
    width:100%;
    background:rgba(18,24,34,.85);
    border:1px solid rgba(255,255,255,.10);
    color:#cfd9e8;font:inherit;font-size:12.5px;font-weight:600;
    padding:9px 13px;border-radius:10px;text-align:left;cursor:pointer;
    transition:.15s;margin-bottom:5px;
  }
  .menu button:hover{color:#fff;border-color:rgba(78,205,196,.5);}
  .menu button.active{
    background:rgba(78,205,196,.18);color:#fff;
    border-color:rgba(78,205,196,.65);
    box-shadow:0 0 0 1px rgba(78,205,196,.4);
  }
  .view{position:relative;flex:1;min-width:0;}
  .view canvas{display:block;}
  .caption{
    position:absolute;top:18px;left:50%;transform:translateX(-50%);
    max-width:min(880px, 92%);
    background:rgba(18,24,34,.88);backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.12);
    border-radius:14px;padding:12px 20px;
    font-size:13.5px;line-height:1.5;color:#cfd9e8;
    box-shadow:0 8px 22px rgba(0,0,0,.45);
    text-align:center;
  }
  .caption b{color:#4ecdc4;}
  .caption .label{
    display:inline-block;font-size:11px;letter-spacing:1px;
    color:#8fa3bf;text-transform:uppercase;margin-bottom:4px;
  }
  .hint{
    position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
    font-size:11.5px;color:#5f6d82;letter-spacing:.3px;pointer-events:none;
    background:rgba(15,21,32,.6);padding:6px 12px;border-radius:8px;
  }
</style>
</head>
<body>
<div id="app">
  <aside class="menu" id="menu">
    <h2 class="section">Сонаправленные лучи</h2>
    <button data-id="def1" class="active">1. Определение — не на одной прямой</button>
    <button data-id="def2">2. Определение — на одной прямой</button>
    <button data-id="not">3. НЕ сонаправленные</button>
    <button data-id="theorem">4. Теорема об углах</button>
  </aside>

  <div class="view" id="view">
    <div class="caption" id="caption"></div>
    <div class="hint">левая кнопка — вращать · колесо — зум · ПКМ — панорама</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const viewEl = document.getElementById('view');
const captionEl = document.getElementById('caption');

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(viewEl.clientWidth, viewEl.clientHeight);
viewEl.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, viewEl.clientWidth/viewEl.clientHeight, 0.1, 200);
camera.position.set(3.8, 3.6, 5.0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1;
controls.maxDistance = 30;
controls.target.set(0, 0, 0);
controls.minPolarAngle = Math.PI * 0.05;
controls.maxPolarAngle = Math.PI * 0.49;

scene.add(new THREE.HemisphereLight(0xdce8ff, 0x1a2233, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 2.0); key.position.set(6,9,7); scene.add(key);
const rim = new THREE.DirectionalLight(0x7fa8ff, 1.0); rim.position.set(-7,-3,-6); scene.add(rim);

const g = new THREE.Group(); scene.add(g);

/* ---------- Хелперы ---------- */
const V = (x,y,z)=> new THREE.Vector3(x,y,z);

function fatLine(a, b, color, r=0.022){
  const grp = new THREE.Group();
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  if (len < 1e-6) return grp;
  const mid = a.clone().add(b).multiplyScalar(0.5);
  const geo = new THREE.CylinderGeometry(r, r, len, 12, 1, false);
  const mat = new THREE.MeshStandardMaterial({
    color, roughness:0.35, metalness:0.1, emissive: color, emissiveIntensity: 0.15
  });
  const cyl = new THREE.Mesh(geo, mat);
  cyl.position.copy(mid);
  cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
  grp.add(cyl);
  [a, b].forEach(p=>{
    const sp = new THREE.Mesh(new THREE.SphereGeometry(r*1.05, 10, 8), mat);
    sp.position.copy(p);
    grp.add(sp);
  });
  return grp;
}

/* Луч со стрелкой */
function ray(a, b, color, r=0.026){
  const grp = new THREE.Group();
  const dir = new THREE.Vector3().subVectors(b, a).normalize();
  const end = b.clone().add(dir.clone().multiplyScalar(-r*6));
  grp.add(fatLine(a, end, color, r));
  const cone = new THREE.Mesh(
    new THREE.ConeGeometry(r*2.5, r*7, 14),
    new THREE.MeshStandardMaterial({color, emissive:color, emissiveIntensity:0.25})
  );
  cone.position.copy(b.clone().add(dir.clone().multiplyScalar(-r*3.5)));
  cone.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
  grp.add(cone);
  return grp;
}

function point(p, color=0xff6b6b, r=0.075){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12),
                           new THREE.MeshBasicMaterial({color}));
  m.position.copy(p);
  return m;
}

function label(p, text, color='#e6edf7', size=0.55){
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  c.width = 512; c.height = 128;
  ctx.fillStyle = 'rgba(0,0,0,0)';
  ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle = color;
  ctx.font = 'bold 72px ui-sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 256, 64);
  const tex = new THREE.CanvasTexture(c);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false}));
  spr.scale.set(size, size*0.25, 1);
  spr.position.copy(p);
  return spr;
}

function polyPatch(points, color, opacity=0.16){
  const verts = points.slice();
  const c = new THREE.Vector3();
  verts.forEach(p=> c.add(p));
  c.divideScalar(verts.length);
  const allVerts = [c, ...verts];
  const idx = [];
  for (let i=1; i<allVerts.length; i++){
    const j = (i===allVerts.length-1) ? 1 : i+1;
    idx.push(0, i, j);
  }
  const geo = new THREE.BufferGeometry().setFromPoints(allVerts);
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const mat = new THREE.MeshBasicMaterial({
    color, transparent:true, opacity, side:THREE.DoubleSide, depthWrite:false
  });
  const mesh = new THREE.Mesh(geo, mat);
  const loop = new THREE.LineLoop(
    new THREE.BufferGeometry().setFromPoints(verts),
    new THREE.LineBasicMaterial({color, transparent:true, opacity:0.55})
  );
  const wrap = new THREE.Group();
  wrap.add(mesh); wrap.add(loop);
  return wrap;
}

function dashedLine(a, b, color, dash=0.09, gap=0.07){
  const mat = new THREE.LineDashedMaterial({color, dashSize:dash, gapSize:gap});
  const geo = new THREE.BufferGeometry().setFromPoints([a, b]);
  const line = new THREE.Line(geo, mat);
  line.computeLineDistances();
  const grp = new THREE.Group();
  grp.add(line);
  return grp;
}

function clearGroup(grp){
  while (grp.children.length){
    const c = grp.children.pop();
    if (c.geometry) c.geometry.dispose();
    if (c.material){
      if (Array.isArray(c.material)) c.material.forEach(m=>m.dispose());
      else c.material.dispose();
    }
    if (c.children && c.children.length) clearGroup(c);
  }
}

/* ============================================================
   1. Определение — лучи НЕ на одной прямой
   Лучи целиком внутри верхней полуплоскости.
============================================================ */
function sceneDef1(){
  // Точки на границе
  const O  = V(-0.8, 0, 0);
  const O1 = V( 0.4, 0, 0);

  // Границы полуплоскостей — побольше, с запасом
  const xLeft = -2.6, xRight = 2.6;
  const yTop  = 2.0;

  // Сама граница
  g.add(fatLine(V(xLeft, 0, 0), V(xRight, 0, 0), 0x8fa3bf, 0.014));

  // Верхняя (зелёная) полуплоскость
  g.add(polyPatch([
    V(xLeft, 0,    0),
    V(xRight, 0,   0),
    V(xRight, yTop,0),
    V(xLeft, yTop, 0),
  ], 0x3ddc97, 0.16));

  // Нижняя (пустая)
  g.add(polyPatch([
    V(xLeft, 0,     0),
    V(xRight, 0,    0),
    V(xRight, -1.6, 0),
    V(xLeft, -1.6,  0),
  ], 0x4a6a9a, 0.10));

  // Направление лучей — вверх-вправо, но с запасом от края
  const d = V(0.55, 0.83, 0).normalize();

  const lenA  = 1.5;
  const lenA1 = 1.5;

  const A  = O.clone().add(d.clone().multiplyScalar(lenA));
  const A1 = O1.clone().add(d.clone().multiplyScalar(lenA1));

  // Лучи
  g.add(ray(O,  A,  0xff6b6b, 0.024));
  g.add(ray(O1, A1, 0xffd93d, 0.024));

  // Точки
  g.add(point(O,  0xffffff, 0.08));
  g.add(point(O1, 0xffffff, 0.08));

  // Подписи
  g.add(label(O.clone().add(V(-0.15, -0.15, 0.1)), 'O', '#ffffff'));
  g.add(label(O1.clone().add(V(0.15, -0.15, 0.1)), 'O₁', '#ffffff'));
  g.add(label(A.clone().add(V(0.1, 0.1, 0)), 'A', '#ff6b6b'));
  g.add(label(A1.clone().add(V(0.1, 0.1, 0)), 'A₁', '#ffd93d'));

  g.add(label(V(0, 1.0, 0), 'одна полуплоскость', '#3ddc97', 0.5));
  g.add(label(V(0, -0.9, 0), 'другая полуплоскость', '#8fa3bf', 0.5));
  g.add(label(V(0, 2.3, 0), 'OA ↑↑ O₁A₁ — лучи в одной полуплоскости', '#3ddc97', 0.55));
}

/* ============================================================
   2. Определение — лучи НА одной прямой
============================================================ */
function sceneDef2(){
  const baseY = 0.2;

  // а) совпадают
  const Oa = V(-1.5, baseY, 0.8);
  const Oa1 = V(-1.5, baseY, 0.3);
  const dirA = V(1, 0, 0);
  g.add(ray(Oa,  Oa.clone().add(dirA.clone().multiplyScalar(1.2)), 0xff6b6b, 0.026));
  g.add(ray(Oa1, Oa1.clone().add(dirA.clone().multiplyScalar(1.2)), 0xffd93d, 0.026));
  g.add(point(Oa,  0xffffff, 0.075));
  g.add(point(Oa1, 0xffffff, 0.075));
  g.add(label(Oa.clone().add(V(-0.2, 0.1, 0)), 'O', '#ffffff'));
  g.add(label(Oa1.clone().add(V(-0.2, 0.1, 0)), 'O₁', '#ffffff'));
  g.add(label(V(-1.5, baseY + 0.6, 0.6), 'а) совпадают — сонаправлены', '#3ddc97', 0.55));

  // б) один содержит другой
  const Ob = V(-1.5, baseY, -0.6);
  const B1 = V( 0.6, baseY, -0.6);
  const B2 = V( 0.0, baseY, -0.6);
  g.add(ray(Ob, B1, 0xff6b6b, 0.026));
  g.add(ray(Ob, B2, 0x6ba8ff, 0.026));
  g.add(point(Ob, 0xffffff, 0.075));
  g.add(label(Ob.clone().add(V(-0.2, 0.1, 0)), 'O', '#ffffff'));
  g.add(label(B1.clone().add(V(0.15, 0.1, 0)), 'B₁', '#ff6b6b'));
  g.add(label(B2.clone().add(V(0.15, 0.1, 0)), 'B₂', '#6ba8ff'));
  g.add(label(V(-1.5, baseY + 0.6, -0.6), 'б) один содержит другой — сонаправлены', '#3ddc97', 0.55));
}

/* ============================================================
   3. НЕ сонаправленные
============================================================ */
function sceneNot(){
  const O  = V(-1.2, 0, 0);
  const O2 = V( 1.2, 0, 0);

  g.add(fatLine(V(-2.0, 0, 0), V(2.0, 0, 0), 0x8fa3bf, 0.014));

  g.add(polyPatch([
    V(-2.0, 0,    0),
    V( 2.0, 0,    0),
    V( 2.0, 1.8,  0),
    V(-2.0, 1.8,  0),
  ], 0x3ddc97, 0.14));

  g.add(polyPatch([
    V(-2.0, 0,    0),
    V( 2.0, 0,    0),
    V( 2.0, -1.8, 0),
    V(-2.0, -1.8, 0),
  ], 0xff9a3c, 0.14));

  const A_upper = O.clone().add(V(1.6, 0.7, 0));
  g.add(ray(O, A_upper, 0xff6b6b, 0.026));

  const A2_lower = O2.clone().add(V(1.6, -0.7, 0));
  g.add(ray(O2, A2_lower, 0x6ba8ff, 0.026));

  g.add(point(O,  0xffffff, 0.08));
  g.add(point(O2, 0xffffff, 0.08));

  g.add(label(O.clone().add(V(-0.1, -0.2, 0.1)), 'O', '#ffffff'));
  g.add(label(O2.clone().add(V(0.1, -0.2, 0.1)), 'O₂', '#ffffff'));
  g.add(label(A_upper.clone().add(V(0.1, 0.15, 0)), 'A', '#ff6b6b'));
  g.add(label(A2_lower.clone().add(V(0.1, -0.15, 0)), 'A₂', '#6ba8ff'));

  g.add(label(V(0, 1.1, 0), 'OA — верхняя полуплоскость', '#3ddc97', 0.55));
  g.add(label(V(0, -1.0, 0), 'O₂A₂ — нижняя полуплоскость', '#ff9a3c', 0.55));
  g.add(label(V(0, 2.2, 0), 'Параллельны, но в разных полуплоскостях ⇒ НЕ сонаправлены', '#ff5f5f', 0.55));
}

/* ============================================================
   4. Теорема — две полуплоскости под прямым углом
   Левая уходит влево, правая — к зрителю.
============================================================ */
function sceneTheorem(){
  const O  = V(0,  1.0, 0);
  const O1 = V(0, -1.0, 0);

  // Перпендикулярные направления: левая чисто влево, правая к зрителю
  const leftDir  = V(-1, 0, 0).normalize();
  const rightDir = V( 0, 0, 1).normalize();

  const L = 2.6;
  const yTop = 2.2, yBot = -2.2;
  const edgeTop = V(0, yTop, 0);
  const edgeBot = V(0, yBot, 0);

  // ЛЕВАЯ (голубая) — уходит влево
  g.add(polyPatch([
    edgeBot,
    edgeTop,
    edgeTop.clone().add(leftDir.clone().multiplyScalar(L)),
    edgeBot.clone().add(leftDir.clone().multiplyScalar(L)),
  ], 0x9fc3e8, 0.36));

  // ПРАВАЯ (розовая) — уходит к зрителю (+z)
  g.add(polyPatch([
    edgeBot,
    edgeTop,
    edgeTop.clone().add(rightDir.clone().multiplyScalar(L)),
    edgeBot.clone().add(rightDir.clone().multiplyScalar(L)),
  ], 0xf4a4c4, 0.36));

  const L_A = 1.9;
  const L_B = 1.9;

  const A  = O.clone().add(leftDir.clone().multiplyScalar(L_A));
  const A1 = O1.clone().add(leftDir.clone().multiplyScalar(L_A));

  const B  = O.clone().add(rightDir.clone().multiplyScalar(L_B));
  const B1 = O1.clone().add(rightDir.clone().multiplyScalar(L_B));

  // Лучи
  g.add(ray(O, A, 0xff3d7f, 0.028));
  g.add(ray(O, B, 0xff3d7f, 0.028));
  g.add(ray(O1, A1, 0x1f6fbf, 0.028));
  g.add(ray(O1, B1, 0x1f6fbf, 0.028));

  // Пунктиры вертикальные
  g.add(dashedLine(O, O1, 0xcfd9e8, 0.10, 0.07));
  g.add(dashedLine(A, A1, 0xcfd9e8, 0.10, 0.07));
  g.add(dashedLine(B, B1, 0xcfd9e8, 0.10, 0.07));

  // Заливка углов
  g.add(polyPatch([O, A, B], 0xffe066, 0.35));
  g.add(polyPatch([O1, A1, B1], 0xffe066, 0.35));

  // Точки
  g.add(point(O,  0xffffff, 0.075));
  g.add(point(O1, 0xffffff, 0.075));
  g.add(point(A,  0xff3d7f, 0.06));
  g.add(point(A1, 0x1f6fbf, 0.06));
  g.add(point(B,  0xff3d7f, 0.06));
  g.add(point(B1, 0x1f6fbf, 0.06));

  // Подписи
  g.add(label(O.clone().add(V(-0.15, 0.15, 0.1)), 'O', '#ffffff'));
  g.add(label(O1.clone().add(V(-0.15, -0.15, 0.1)), 'O₁', '#ffffff'));
  g.add(label(A.clone().add(V(-0.2, 0.1, 0)), 'A', '#ff3d7f'));
  g.add(label(A1.clone().add(V(-0.2, -0.1, 0)), 'A₁', '#1f6fbf'));
  g.add(label(B.clone().add(V(0.1, 0.1, 0.1)), 'B', '#ff3d7f'));
  g.add(label(B1.clone().add(V(0.1, -0.1, 0.1)), 'B₁', '#1f6fbf'));

  // Заголовок
  g.add(label(V(0, 2.7, 0),
    'OA ↑↑ O₁A₁,  OB ↑↑ O₁B₁  ⇒  ∠O = ∠O₁',
    '#3ddc97', 0.6));

  g.add(label(V(0, 1.6, 0), 'заливка = равные углы', '#ffe066', 0.45));
}

/* ============================================================
   Управление
============================================================ */
const SCENES = {
  def1: {
    build: sceneDef1,
    cap: '<div class="label">1. Определение — лучи не на одной прямой</div>Лучи <b>OA</b> и <b>O₁A₁</b>, не лежащие на одной прямой, называются <b>сонаправленными</b>, если они <b>параллельны</b> и лежат в <b>одной полуплоскости</b> с границей <b>OO₁</b>.',
    cam:[3.4, 3.6, 5.2], tgt:[0, 0.4, 0]
  },
  def2: {
    build: sceneDef2,
    cap: '<div class="label">2. Определение — лучи на одной прямой</div>Лучи <b>OA</b> и <b>O₁A₁</b>, лежащие на одной прямой, называются <b>сонаправленными</b>, если они <b>совпадают</b> или <b>один содержит другой</b>.',
    cam:[4.6, 4.0, 5.6], tgt:[0, 0.2, 0]
  },
  not: {
    build: sceneNot,
    cap: '<div class="label">3. НЕ сонаправленные лучи</div>Лучи <b>OA</b> и <b>O₂A₂</b> <b>параллельны</b>, но лежат в <b>разных полуплоскостях</b> с границей <b>OO₂</b> ⇒ они <b>НЕ сонаправлены</b>.',
    cam:[3.2, 3.4, 5.0], tgt:[0, 0.2, 0]
  },
  theorem: {
    build: sceneTheorem,
    cap: '<div class="label">4. Теорема о сонаправленных лучах</div>Если стороны двух углов соответственно <b>сонаправлены</b>, то такие углы <b>равны</b>: <b>OA ↑↑ O₁A₁</b> и <b>OB ↑↑ O₁B₁</b> ⇒ <b>∠O = ∠O₁</b>.',
    cam:[4.2, 3.6, 5.6], tgt:[0, 0.3, 0]
  },
};

function show(id){
  clearGroup(g);
  const s = SCENES[id];
  if (!s) return;
  try { s.build(); } catch(e){ console.error('scene error:', id, e); }
  captionEl.innerHTML = s.cap;
  camera.position.set(...s.cam);
  controls.target.set(...s.tgt);
  controls.update();
  renderer.render(scene, camera);
}

document.querySelectorAll('#menu button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#menu button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    show(btn.dataset.id);
  });
});

addEventListener('resize', ()=>{
  const w = viewEl.clientWidth, h = viewEl.clientHeight;
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

function loop(){
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
}

show('def1');
loop();
</script>
</body>
</html>
