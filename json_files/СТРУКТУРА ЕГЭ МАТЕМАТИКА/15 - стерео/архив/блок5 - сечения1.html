<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Сечения через 3 точки — по одному телу</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;
    background:radial-gradient(1200px 800px at 75% 15%, #1c2740 0%, #0b1018 60%, #070a10 100%);
    color:#e6edf7;font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif;}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;}

  .menu{
    display:flex;gap:8px;padding:14px 18px;
    background:rgba(12,17,26,.85);
    border-bottom:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(10px);
    z-index:5;
  }
  .menu button{
    background:rgba(18,24,34,.85);
    border:1px solid rgba(255,255,255,.10);
    color:#cfd9e8;font:inherit;font-size:13px;font-weight:600;
    padding:9px 16px;border-radius:10px;cursor:pointer;
    transition:.15s;
  }
  .menu button:hover{color:#fff;border-color:rgba(78,205,196,.5);}
  .menu button.active{
    background:rgba(78,205,196,.20);color:#fff;
    border-color:rgba(78,205,196,.65);
    box-shadow:0 0 0 1px rgba(78,205,196,.4);
  }

  .view{position:relative;flex:1;min-width:0;}
  .view canvas{display:block;}

  .caption{
    position:absolute;top:16px;left:50%;transform:translateX(-50%);
    background:rgba(18,24,34,.88);backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.12);
    border-radius:12px;padding:10px 18px;
    font-size:13px;color:#cfd9e8;text-align:center;
    box-shadow:0 8px 22px rgba(0,0,0,.45);
    z-index:5;
  }
  .caption b{color:#4ecdc4;}
  .caption .label{
    display:block;font-size:11px;letter-spacing:1px;
    color:#8fa3bf;text-transform:uppercase;margin-bottom:4px;
  }

  .hint{
    position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
    font-size:11.5px;color:#5f6d82;
    background:rgba(15,21,32,.6);padding:6px 12px;border-radius:8px;
    pointer-events:none;z-index:5;
  }
</style>
</head>
<body>
<div id="app">

  <div class="menu" id="menu">
    <button data-id="cube"  class="active">Куб</button>
    <button data-id="prism">Треугольная призма</button>
    <button data-id="tetra">Треугольная пирамида</button>
    <button data-id="pyr4">Четырёхугольная пирамида</button>
    <button data-id="pyr6">Шестиугольная пирамида</button>
  </div>

  <div class="view" id="view">
    <div class="caption" id="caption"></div>
    <div class="hint">левая кнопка — вращать · колесо — зум · ПКМ — панорама</div>
  </div>

</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const viewEl = document.getElementById('view');
const captionEl = document.getElementById('caption');

/* ---------- Общая сцена ---------- */
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(viewEl.clientWidth, viewEl.clientHeight);
viewEl.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(42, viewEl.clientWidth/viewEl.clientHeight, 0.1, 200);
camera.position.set(3.4, 3.0, 4.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1;
controls.maxDistance = 20;
controls.target.set(0, 0, 0);
controls.minPolarAngle = Math.PI * 0.05;
controls.maxPolarAngle = Math.PI * 0.49;
controls.update();

scene.add(new THREE.AmbientLight(0xffffff, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 1.4); key.position.set(6,9,7); scene.add(key);
const rim = new THREE.DirectionalLight(0x7fa8ff, 0.6); rim.position.set(-7,-3,-6); scene.add(rim);

const g = new THREE.Group(); scene.add(g);

const V = (x,y,z)=> new THREE.Vector3(x,y,z);

/* ---------- Хелперы ---------- */
function edgeLine(a, b, color=0x5a7aaa){
  const geo = new THREE.BufferGeometry().setFromPoints([a, b]);
  return new THREE.Line(geo, new THREE.LineBasicMaterial({color}));
}

function point(p, color=0xff6b6b, r=0.07){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 14, 10),
                           new THREE.MeshBasicMaterial({color}));
  m.position.copy(p);
  return m;
}

function label(p, text, color='#e6edf7', size=0.5){
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  c.width = 512; c.height = 128;
  ctx.fillStyle = 'rgba(0,0,0,0)';
  ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle = color;
  ctx.font = 'bold 72px ui-sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 256, 64);
  const tex = new THREE.CanvasTexture(c);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false}));
  spr.scale.set(size, size*0.25, 1);
  spr.position.copy(p);
  return spr;
}

function segPlaneIntersect(A, B, n, d){
  const da = n.dot(A) - d;
  const db = n.dot(B) - d;
  if (Math.abs(da - db) < 1e-9) return null;
  const t = da / (da - db);
  if (t < -1e-6 || t > 1+1e-6) return null;
  return A.clone().lerp(B, t);
}

function buildSection(edges, n, d, color=0xffd93d, opacity=0.3){
  const pts = [];
  edges.forEach(([A, B])=>{
    const P = segPlaneIntersect(A, B, n, d);
    if (P && !pts.some(q=> q.distanceTo(P) < 1e-4)) pts.push(P);
  });
  if (pts.length < 3) return null;

  const c = new THREE.Vector3();
  pts.forEach(p=> c.add(p));
  c.divideScalar(pts.length);
  const nn = n.clone().normalize();
  const up = Math.abs(nn.y) < 0.9 ? V(0,1,0) : V(1,0,0);
  const e1 = new THREE.Vector3().crossVectors(nn, up).normalize();
  const e2 = new THREE.Vector3().crossVectors(nn, e1).normalize();
  pts.sort((A, B)=>{
    const aA = Math.atan2(A.clone().sub(c).dot(e2), A.clone().sub(c).dot(e1));
    const aB = Math.atan2(B.clone().sub(c).dot(e2), B.clone().sub(c).dot(e1));
    return aA - aB;
  });

  const grp = new THREE.Group();

  const verts = [c];
  pts.forEach(p=> verts.push(p));
  const idx = [];
  for (let i=1; i<verts.length; i++){
    const j = (i===verts.length-1) ? 1 : i+1;
    idx.push(0, i, j);
  }
  const geo = new THREE.BufferGeometry().setFromPoints(verts);
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const mat = new THREE.MeshBasicMaterial({
    color, transparent:true, opacity, side:THREE.DoubleSide, depthWrite:false
  });
  grp.add(new THREE.Mesh(geo, mat));

  const loopGeo = new THREE.BufferGeometry().setFromPoints(pts);
  grp.add(new THREE.LineLoop(loopGeo,
    new THREE.LineBasicMaterial({color})));

  return grp;
}

function clearGroup(grp){
  while (grp.children.length){
    const c = grp.children.pop();
    if (c.geometry) c.geometry.dispose();
    if (c.material){
      if (Array.isArray(c.material)) c.material.forEach(m=>m.dispose());
      else c.material.dispose();
    }
    if (c.children && c.children.length) clearGroup(c);
  }
}

/* ============================================================
   1. КУБ
============================================================ */
function sceneCube(){
  const s = 1.2;
  const A  = V(-s,-s, s), B  = V( s,-s, s), C  = V( s,-s,-s), D  = V(-s,-s,-s);
  const A1 = V(-s, s, s), B1 = V( s, s, s), C1 = V( s, s,-s), D1 = V(-s, s,-s);
  const edges = [
    [A,B],[B,C],[C,D],[D,A],
    [A1,B1],[B1,C1],[C1,D1],[D1,A1],
    [A,A1],[B,B1],[C,C1],[D,D1]
  ];
  edges.forEach(([p,q])=> g.add(edgeLine(p, q)));

  const P = A.clone().lerp(B, 0.55);
  const Q = B1.clone().lerp(C1, 0.40);
  const R = D.clone().lerp(D1, 0.65);

  const n = new THREE.Vector3().subVectors(Q, P)
    .cross(new THREE.Vector3().subVectors(R, P)).normalize();
  const d = n.dot(P);

  const sec = buildSection(edges, n, d);
  if (sec) g.add(sec);

  [P,Q,R].forEach(p=> g.add(point(p)));
  g.add(label(P.clone().add(V(-0.18,-0.12, 0.12)), 'P', '#ff6b6b'));
  g.add(label(Q.clone().add(V( 0.18, 0.12, 0.12)), 'Q', '#ff6b6b'));
  g.add(label(R.clone().add(V( 0.18, 0.0,-0.12)), 'R', '#ff6b6b'));

  g.add(label(A.clone().add(V(-0.15, 0.12, 0.15)), 'A'));
  g.add(label(B.clone().add(V( 0.15, 0.12, 0.15)), 'B'));
  g.add(label(C.clone().add(V( 0.15, 0.12,-0.15)), 'C'));
  g.add(label(D.clone().add(V(-0.15, 0.12,-0.15)), 'D'));
  g.add(label(A1.clone().add(V(-0.15, 0.12, 0.15)), 'A₁'));
  g.add(label(B1.clone().add(V( 0.15, 0.12, 0.15)), 'B₁'));
  g.add(label(C1.clone().add(V( 0.15, 0.12,-0.15)), 'C₁'));
  g.add(label(D1.clone().add(V(-0.15, 0.12,-0.15)), 'D₁'));
}

/* ============================================================
   2. ТРЕУГОЛЬНАЯ ПРИЗМА
============================================================ */
function scenePrism(){
  const r = 1.2, h = 1.9;
  const A  = V(-r, -h/2,  r*0.5);
  const B  = V( r, -h/2,  r*0.5);
  const C  = V( 0, -h/2, -r);
  const A1 = V(-r,  h/2,  r*0.5);
  const B1 = V( r,  h/2,  r*0.5);
  const C1 = V( 0,  h/2, -r);

  const edges = [
    [A,B],[B,C],[C,A],
    [A1,B1],[B1,C1],[C1,A1],
    [A,A1],[B,B1],[C,C1]
  ];
  edges.forEach(([p,q])=> g.add(edgeLine(p, q)));

  const P = A.clone().lerp(B, 0.5);
  const Q = B1.clone().lerp(C1, 0.5);
  const R = C.clone().lerp(A, 0.5);

  const n = new THREE.Vector3().subVectors(Q, P)
    .cross(new THREE.Vector3().subVectors(R, P)).normalize();
  const d = n.dot(P);

  const sec = buildSection(edges, n, d);
  if (sec) g.add(sec);

  [P,Q,R].forEach(p=> g.add(point(p)));
  g.add(label(P.clone().add(V(-0.18,-0.12, 0.12)), 'P', '#ff6b6b'));
  g.add(label(Q.clone().add(V( 0.18, 0.12, 0.0)), 'Q', '#ff6b6b'));
  g.add(label(R.clone().add(V( 0.18,-0.12,-0.12)), 'R', '#ff6b6b'));

  g.add(label(A.clone().add(V(-0.15,-0.12, 0.12)), 'A'));
  g.add(label(B.clone().add(V( 0.15,-0.12, 0.12)), 'B'));
  g.add(label(C.clone().add(V( 0.0, -0.12,-0.15)), 'C'));
  g.add(label(A1.clone().add(V(-0.15, 0.12, 0.12)), 'A₁'));
  g.add(label(B1.clone().add(V( 0.15, 0.12, 0.12)), 'B₁'));
  g.add(label(C1.clone().add(V( 0.0, 0.12,-0.15)), 'C₁'));
}

/* ============================================================
   3. ТРЕУГОЛЬНАЯ ПИРАМИДА
============================================================ */
function sceneTetra(){
  const A = V(-1.3, -0.9,  1.0);
  const B = V( 1.3, -0.9,  1.0);
  const C = V( 0.0, -0.9, -1.3);
  const S = V( 0.0,  1.2,  0);

  const edges = [
    [A,B],[B,C],[C,A],
    [A,S],[B,S],[C,S]
  ];
  edges.forEach(([p,q])=> g.add(edgeLine(p, q)));

  const P = A.clone().lerp(B, 0.5);
  const Q = B.clone().lerp(S, 0.45);
  const R = C.clone().lerp(A, 0.4);

  const n = new THREE.Vector3().subVectors(Q, P)
    .cross(new THREE.Vector3().subVectors(R, P)).normalize();
  const d = n.dot(P);

  const sec = buildSection(edges, n, d);
  if (sec) g.add(sec);

  [P,Q,R].forEach(p=> g.add(point(p)));
  g.add(label(P.clone().add(V(-0.18,-0.12, 0.12)), 'P', '#ff6b6b'));
  g.add(label(Q.clone().add(V( 0.18, 0.12, 0.0)), 'Q', '#ff6b6b'));
  g.add(label(R.clone().add(V(-0.18,-0.12,-0.12)), 'R', '#ff6b6b'));

  g.add(label(A.clone().add(V(-0.15,-0.12, 0.12)), 'A'));
  g.add(label(B.clone().add(V( 0.15,-0.12, 0.12)), 'B'));
  g.add(label(C.clone().add(V( 0.0, -0.12,-0.15)), 'C'));
  g.add(label(S.clone().add(V( 0.0,  0.15, 0.0)), 'S'));
}

/* ============================================================
   4. ЧЕТЫРЁХУГОЛЬНАЯ ПИРАМИДА
============================================================ */
function scenePyr4(){
  const s = 1.2, h = 2.0;
  const A = V(-s, -h/2,  s);
  const B = V( s, -h/2,  s);
  const C = V( s, -h/2, -s);
  const D = V(-s, -h/2, -s);
  const S = V( 0,  h/2, 0);

  const edges = [
    [A,B],[B,C],[C,D],[D,A],
    [S,A],[S,B],[S,C],[S,D]
  ];
  edges.forEach(([p,q])=> g.add(edgeLine(p, q)));

  const P = A.clone().lerp(B, 0.5);
  const Q = S.clone().lerp(C, 0.45);
  const R = D.clone().lerp(A, 0.5);

  const n = new THREE.Vector3().subVectors(Q, P)
    .cross(new THREE.Vector3().subVectors(R, P)).normalize();
  const d = n.dot(P);

  const sec = buildSection(edges, n, d);
  if (sec) g.add(sec);

  [P,Q,R].forEach(p=> g.add(point(p)));
  g.add(label(P.clone().add(V(-0.18,-0.12, 0.12)), 'P', '#ff6b6b'));
  g.add(label(Q.clone().add(V( 0.18, 0.12, 0.0)), 'Q', '#ff6b6b'));
  g.add(label(R.clone().add(V(-0.18,-0.12,-0.12)), 'R', '#ff6b6b'));

  g.add(label(A.clone().add(V(-0.15,-0.12, 0.12)), 'A'));
  g.add(label(B.clone().add(V( 0.15,-0.12, 0.12)), 'B'));
  g.add(label(C.clone().add(V( 0.15,-0.12,-0.12)), 'C'));
  g.add(label(D.clone().add(V(-0.15,-0.12,-0.12)), 'D'));
  g.add(label(S.clone().add(V( 0.0,  0.15, 0.0)), 'S'));
}

/* ============================================================
   5. ШЕСТИУГОЛЬНАЯ ПИРАМИДА
============================================================ */
function scenePyr6(){
  const R = 1.2, h = 1.9;
  const base = [];
  for (let i=0; i<6; i++){
    const a = Math.PI/2 + i * Math.PI/3;
    base.push(V(R*Math.cos(a), -h/2, R*Math.sin(a)));
  }
  const S = V(0, h/2, 0);

  const edges = [];
  for (let i=0; i<6; i++){
    edges.push([base[i], base[(i+1)%6]]);
    edges.push([base[i], S]);
  }
  edges.forEach(([p,q])=> g.add(edgeLine(p, q)));

  const P = base[0].clone().lerp(base[1], 0.5);
  const Q = base[3].clone().lerp(S, 0.5);
  const Rr = base[5].clone().lerp(base[0], 0.5);

  const n = new THREE.Vector3().subVectors(Q, P)
    .cross(new THREE.Vector3().subVectors(Rr, P)).normalize();
  const d = n.dot(P);

  const sec = buildSection(edges, n, d);
  if (sec) g.add(sec);

  [P,Q,Rr].forEach(p=> g.add(point(p)));
  g.add(label(P.clone().add(V( 0.18,-0.12, 0.12)), 'P', '#ff6b6b'));
  g.add(label(Q.clone().add(V( 0.18, 0.12, 0.12)), 'Q', '#ff6b6b'));
  g.add(label(Rr.clone().add(V(-0.18,-0.12, 0.0)), 'R', '#ff6b6b'));

  g.add(label(S.clone().add(V( 0.0, 0.15, 0.0)), 'S'));
  ['A','B','C','D','E','F'].forEach((name, i)=>{
    g.add(label(base[i].clone().add(V(0, -0.15, 0)), name));
  });
}

/* ============================================================
   Управление
============================================================ */
const SCENES = {
  cube:  {build: sceneCube,  cap: '<span class="label">Способ 1. 3 точки</span><b>Куб:</b> сечение через точки P, Q, R на рёбрах AB, B₁C₁, DD₁', cam:[3.6, 3.2, 4.6], tgt:[0,0,0]},
  prism: {build: scenePrism, cap: '<span class="label">Способ 1. 3 точки</span><b>Треугольная призма:</b> сечение через точки P, Q, R', cam:[3.6, 3.2, 4.6], tgt:[0,0,0]},
  tetra: {build: sceneTetra, cap: '<span class="label">Способ 1. 3 точки</span><b>Треугольная пирамида:</b> сечение через точки P, Q, R', cam:[3.6, 3.2, 4.6], tgt:[0,0,0]},
  pyr4:  {build: scenePyr4,  cap: '<span class="label">Способ 1. 3 точки</span><b>Четырёхугольная пирамида:</b> сечение через точки P, Q, R', cam:[3.6, 3.2, 4.6], tgt:[0,0,0]},
  pyr6:  {build: scenePyr6,  cap: '<span class="label">Способ 1. 3 точки</span><b>Шестиугольная пирамида:</b> сечение через точки P, Q, R', cam:[3.6, 3.2, 4.6], tgt:[0,0,0]},
};

function show(id){
  clearGroup(g);
  const s = SCENES[id];
  if (!s) return;
  s.build();
  captionEl.innerHTML = s.cap;
  camera.position.set(...s.cam);
  controls.target.set(...s.tgt);
  controls.update();
  renderer.render(scene, camera);
}

document.querySelectorAll('#menu button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#menu button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    show(btn.dataset.id);
  });
});

addEventListener('resize', ()=>{
  const w = viewEl.clientWidth, h = viewEl.clientHeight;
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

function loop(){
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
}

show('cube');
loop();
</script>
</body>
</html>
