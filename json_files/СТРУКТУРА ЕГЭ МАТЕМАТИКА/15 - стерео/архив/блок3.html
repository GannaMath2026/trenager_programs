<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Перпендикулярность — 3D</title>
<style>
  :root{
    --bg:#0f1520; --line:#2a3a52;
    --txt:#e6edf7; --muted:#8fa3bf; --accent:#4ecdc4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;}
  body{
    background:radial-gradient(1200px 800px at 75% 15%, #1c2740 0%, #0b1018 60%, #070a10 100%);

  }
  #app{position:fixed;inset:0;display:flex;}

  .menu{
    width:360px;height:100%;
    background:rgba(12,17,26,.92);
    border-right:1px solid rgba(255,255,255,.08);
    padding:18px 14px;overflow-y:auto;
    backdrop-filter:blur(10px);
  }
  .menu h2{
    font-size:13px;text-transform:uppercase;letter-spacing:1px;
    color:#8fa3bf;margin:0 0 10px 6px;font-weight:700;
  }
  .menu h2.section{margin-top:18px;color:#4ecdc4;}
  .menu button{
    width:100%;
    background:rgba(18,24,34,.85);
    border:1px solid rgba(255,255,255,.10);
    color:#cfd9e8;font:inherit;font-size:13px;font-weight:600;

  .hint{

</style>
</head>
<body>
<div id="app">
  <aside class="menu" id="menu">
    <h2 class="section">6. Перпендикулярность</h2>
    <button data-id="pp1" class="active">6.1. Прямая ⊥ плоскости (определение)</button>
    <button data-id="pp2">6.1. Признак: две пересекающиеся</button>
    <button data-id="pp3">6.2. Плоскость ⊥ плоскости</button>
    <button data-id="pp4">6.3. Теорема о трёх перпендикулярах</button>
    <button data-id="pp5">6.4. Противоположные рёбра пирамиды</button>
  </aside>

  <div class="view" id="view">
    <div class="caption" id="caption"></div>
    <div class="hint">левая кнопка — вращать · колесо — зум · ПКМ — панорама</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const viewEl = document.getElementById('view');
const captionEl = document.getElementById('caption');

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(viewEl.clientWidth, viewEl.clientHeight);
viewEl.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(42, viewEl.clientWidth/viewEl.clientHeight, 0.1, 200);
camera.position.set(3.8, 3.2, 4.8);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1;
controls.maxDistance = 30;
controls.target.set(0, 0.3, 0);
controls.minPolarAngle = Math.PI * 0.05;
controls.maxPolarAngle = Math.PI * 0.49;

scene.add(new THREE.HemisphereLight(0xdce8ff, 0x1a2233, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 2.0); key.position.set(6,9,7); scene.add(key);
const rim = new THREE.DirectionalLight(0x7fa8ff, 1.0); rim.position.set(-7,-3,-6); scene.add(rim);

const g = new THREE.Group(); scene.add(g);

/* ============================================================
   Хелперы
============================================================ */
const V = (x,y,z)=> new THREE.Vector3(x,y,z);

function fatLine(a, b, color, r=0.028){
  const grp = new THREE.Group();
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  if (len < 1e-6) return grp;
  const mid = a.clone().add(b).multiplyScalar(0.5);
  const geo = new THREE.CylinderGeometry(r, r, len, 12, 1, false);
  const mat = new THREE.MeshStandardMaterial({
    color, roughness:0.35, metalness:0.1, emissive: color, emissiveIntensity: 0.15
  });
  const cyl = new THREE.Mesh(geo, mat);
  cyl.position.copy(mid);
  cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
  grp.add(cyl);
  [a, b].forEach(p=>{
    const sp = new THREE.Mesh(new THREE.SphereGeometry(r*1.05, 10, 8), mat);
    sp.position.copy(p);
    grp.add(sp);
  });
  return grp;
}

function dashedLine(a, b, color, dash=0.09, gap=0.07){
  const grp = new THREE.Group();
  const mat = new THREE.LineDashedMaterial({color, dashSize:dash, gapSize:gap});
  const geo = new THREE.BufferGeometry().setFromPoints([a, b]);
  const line = new THREE.Line(geo, mat);
  line.computeLineDistances();
  grp.add(line);
  return grp;
}

function point(p, color=0xff6b6b, r=0.08){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12),
                           new THREE.MeshBasicMaterial({color}));
  m.position.copy(p);
  return m;
}

function label(p, text, color='#e6edf7', size=0.55){
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  c.width = 512; c.height = 128;
  ctx.fillStyle = 'rgba(0,0,0,0)';
  ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle = color;
  ctx.font = 'bold 72px ui-sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 256, 64);
  const tex = new THREE.CanvasTexture(c);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false}));
  spr.scale.set(size, size*0.25, 1);
  spr.position.copy(p);
  return spr;
}

function planePatch(p1, p2, p3, p4, color, opacity=0.18){
  const verts = [p1, p2, p3, p4];
  const geo = new THREE.BufferGeometry().setFromPoints(verts);
  geo.setIndex([0,1,2, 0,2,3]);
  geo.computeVertexNormals();
  const mat = new THREE.MeshBasicMaterial({
    color, transparent:true, opacity, side:THREE.DoubleSide, depthWrite:false
  });
  const mesh = new THREE.Mesh(geo, mat);
  const loop = new THREE.LineLoop(
    new THREE.BufferGeometry().setFromPoints(verts),
    new THREE.LineBasicMaterial({color, linewidth:1.2, transparent:true, opacity:0.75})
  );
  const wrap = new THREE.Group();
  wrap.add(mesh); wrap.add(loop);
  return wrap;
}

function planeBig(c, u, v, s, color, opacity=0.12){
  const p1 = c.clone().add(u.clone().multiplyScalar(s)).add(v.clone().multiplyScalar(s));
  const p2 = c.clone().add(u.clone().multiplyScalar(-s)).add(v.clone().multiplyScalar(s));
  const p3 = c.clone().add(u.clone().multiplyScalar(-s)).add(v.clone().multiplyScalar(-s));
  const p4 = c.clone().add(u.clone().multiplyScalar(s)).add(v.clone().multiplyScalar(-s));
  return planePatch(p1, p2, p3, p4, color, opacity);
}

function rightAngle(O, dir1, dir2, size, color){
  const d1 = dir1.clone().normalize();
  const d2 = dir2.clone().normalize();
  const a = O.clone().add(d1.clone().multiplyScalar(size));
  const b = O.clone().add(d1.clone().multiplyScalar(size)).add(d2.clone().multiplyScalar(size));
  const c = O.clone().add(d2.clone().multiplyScalar(size));
  const geo = new THREE.BufferGeometry().setFromPoints([a, b, c]);
  const mat = new THREE.LineBasicMaterial({color});
  const line = new THREE.Line(geo, mat);
  const grp = new THREE.Group();
  grp.add(line);
  return grp;
}

function clearGroup(grp){
  while (grp.children.length){
    const c = grp.children.pop();
    if (c.geometry) c.geometry.dispose();
    if (c.material){
      if (Array.isArray(c.material)) c.material.forEach(m=>m.dispose());
      else c.material.dispose();
    }
    if (c.children && c.children.length) clearGroup(c);
  }
}

/* ============================================================
   6.1. Определение: a ⊥ α — перпендикулярна любой прямой в α
============================================================ */
function scenePP1(){
  const u = V(1,0,0), v = V(0,0,1);
  g.add(planeBig(V(0,0,0), u, v, 1.9, 0x4ecdc4, 0.14));

  const A_bot = V(0, 0, 0);
  const A_top = V(0, 2.0, 0);
  g.add(fatLine(A_bot, A_top, 0xff6b6b, 0.035));

  const dirs = [
    V(1,0,0),
    V(0,0,1),
    V(1,0,1).normalize(),
    V(1,0,-1).normalize()
  ];
  dirs.forEach(d=>{
    const p1 = d.clone().multiplyScalar(-1.6);
    const p2 = d.clone().multiplyScalar( 1.6);
    g.add(dashedLine(p1, p2, 0xffd93d, 0.08, 0.06));
  });

  dirs.slice(0,2).forEach(d=>{
    g.add(rightAngle(A_bot, V(0,1,0), d, 0.18, 0xffffff));
  });

  g.add(point(A_bot, 0xffffff, 0.09));
  g.add(label(A_bot.clone().add(V(0.15,0.1,0.15)), 'O', '#ffffff'));
  g.add(label(A_top.clone().add(V(0.15,0.15,0)), 'a', '#ff6b6b'));
  g.add(label(V(0, 0.25, -1.7), 'α', '#4ecdc4'));
}

/* ============================================================
   6.1. Признак: a ⊥ b, a ⊥ c (b ∩ c) ⇒ a ⊥ α
============================================================ */
function scenePP2(){
  const u = V(1,0,0), v = V(0,0,1);
  g.add(planeBig(V(0,0,0), u, v, 1.9, 0x4ecdc4, 0.14));

  const O = V(0, 0, 0);

  const b1 = V(-1.6, 0, 0), b2 = V(1.6, 0, 0);
  g.add(fatLine(b1, b2, 0xffd93d, 0.030));

  const c1 = V(0, 0, -1.6), c2 = V(0, 0, 1.6);
  g.add(fatLine(c1, c2, 0x6ba8ff, 0.030));

  const A_bot = V(0, 0, 0);
  const A_top = V(0, 2.0, 0);
  g.add(fatLine(A_bot, A_top, 0xff6b6b, 0.035));

  g.add(rightAngle(A_bot, V(0,1,0), V(1,0,0), 0.20, 0xffffff));
  g.add(rightAngle(A_bot, V(0,1,0), V(0,0,1), 0.20, 0xffffff));

  g.add(point(A_bot, 0xffffff, 0.09));
  g.add(label(A_bot.clone().add(V(0.15,0.1,0.15)), 'O', '#ffffff'));
  g.add(label(A_top.clone().add(V(0.15,0.15,0)), 'a', '#ff6b6b'));
  g.add(label(b2.clone().add(V(0.15,0.2,0)), 'b', '#ffd93d'));
  g.add(label(c2.clone().add(V(0.15,0.2,0)), 'c', '#6ba8ff'));
  g.add(label(V(0, 0.25, -1.7), 'α', '#4ecdc4'));
}

/* ============================================================
   6.2. Плоскость ⊥ плоскости.
   α — вертикальная, β — горизонтальная.
   a ⊂ α, a ⊥ β, поэтому α ⊥ β.
   Прямая a — вертикальная (в α), b и c — две пересекающиеся жёлтые
   прямые в β, обе ⊥ a.
============================================================ */
function scenePP3(){
  // β: горизонтальная плоскость y = 0
  const u1 = V(1,0,0), v1 = V(0,0,1);
  g.add(planeBig(V(0,0,0), u1, v1, 1.9, 0x6ba8ff, 0.14));

  // α: вертикальная плоскость x = 0
  const u2 = V(0,1,0), v2 = V(0,0,1);
  g.add(planeBig(V(0,0,0), u2, v2, 1.9, 0x3ddc97, 0.14));

  // a — вертикальная прямая в α
  const A_bot = V(0, -1.9, 0);
  const A_top = V(0,  1.9, 0);
  g.add(fatLine(A_bot, A_top, 0xff6b6b, 0.035));

  // две пересекающиеся прямые в β
  const b1 = V(-1.7, 0, 0), b2 = V(1.7, 0, 0);
  g.add(fatLine(b1, b2, 0xffd93d, 0.030));

  const c1 = V(0, 0, -1.7), c2 = V(0, 0, 1.7);
  g.add(fatLine(c1, c2, 0xffd93d, 0.030));

  // прямые углы
  g.add(rightAngle(V(0,0,0), V(0,1,0), V(1,0,0), 0.22, 0xffffff));
  g.add(rightAngle(V(0,0,0), V(0,1,0), V(0,0,1), 0.22, 0xffffff));

  g.add(point(V(0,0,0), 0xffffff, 0.10));
  g.add(label(V(0.18, 0.18, 0.18), 'O', '#ffffff'));

  g.add(label(V(-1.6, 1.4, 0), 'α', '#3ddc97'));
  g.add(label(V(0, 0.25, -1.7), 'β', '#6ba8ff'));

  g.add(label(A_top.clone().add(V(0.15,0.15,0)), 'a', '#ff6b6b'));
  g.add(label(b2.clone().add(V(0.15,0.15,0)), 'b', '#ffd93d'));
  g.add(label(c2.clone().add(V(0.15,0.15,0)), 'c', '#ffd93d'));
}

/* ============================================================
   6.3. ТТП
============================================================ */
function scenePP4(){
  const u = V(1,0,0), v = V(0,0,1);
  g.add(planeBig(V(0,0,0), u, v, 1.9, 0x4ecdc4, 0.14));

  const H = V(0, 0, 0);
  const A = V(0, 1.6, 0);
  const B = V(1.4, 0, 0);

  const x1 = V(1.4, 0, -1.4);
  const x2 = V(1.4, 0,  1.4);

  g.add(fatLine(A, H, 0xff6b6b, 0.035));
  g.add(fatLine(A, B, 0xffd93d, 0.035));
  g.add(fatLine(B, H, 0x6ba8ff, 0.035));
  g.add(fatLine(x1, x2, 0xff6b6b, 0.030));

  g.add(rightAngle(H, V(0,1,0), V(1,0,0), 0.20, 0xffffff));
  g.add(rightAngle(B, V(0,0,1), V(-1,0,0), 0.18, 0xffffff));
  const dirAB = new THREE.Vector3().subVectors(A, B).normalize();
  g.add(rightAngle(B, V(0,0,1), dirAB, 0.18, 0xffffff));

  g.add(point(A, 0xffffff, 0.09));
  g.add(point(H, 0xffffff, 0.09));
  g.add(point(B, 0xffffff, 0.09));

  g.add(label(A.clone().add(V(0.15,0.15,0)), 'A', '#ff6b6b'));
  g.add(label(H.clone().add(V(-0.15,0.1,0.15)), 'H', '#ff6b6b'));
  g.add(label(B.clone().add(V(0.15,0.1,0.15)), 'B', '#ffd93d'));
  g.add(label(x1.clone().add(V(0.15,0.2,0)), 'x', '#ff6b6b'));
  g.add(label(V(0, 0.25, -1.7), 'β', '#4ecdc4'));
}

/* ============================================================
   6.4. Противоположные рёбра правильной пирамиды перпендикулярны.
   SABCD — правильная пирамида (ABCD — квадрат).
   M — середина AB, N — середина CD.
   SM ⊥ AB и MN ⊥ AB ⇒ AB ⊥ плоскости (S, M, N).
   Ребро SD лежит в плоскости (S, M, N) ⇒ AB ⊥ SD.
   Сечение через S, M, N — ТРЕУГОЛЬНИК SMN.
============================================================ */
function scenePP5(){
  const s = 1.1, h = 2.0;
  const A = V(-s, 0,  s);
  const B = V( s, 0,  s);
  const C = V( s, 0, -s);
  const D = V(-s, 0, -s);
  const S = V(0, h, 0);

  [[A,B],[B,C],[C,D],[D,A]].forEach(([p,q]) => g.add(fatLine(p, q, 0x2b4770, 0.012)));
  [[S,A],[S,B],[S,C],[S,D]].forEach(([p,q]) => g.add(fatLine(p, q, 0x2b4770, 0.012)));

  const M = A.clone().add(B).multiplyScalar(0.5);
  const N = C.clone().add(D).multiplyScalar(0.5);

  // Сечение — треугольник S M N
  {
    const verts = [S, M, N];
    const geo = new THREE.BufferGeometry().setFromPoints(verts);
    geo.setIndex([0,1,2]);
    geo.computeVertexNormals();
    const mat = new THREE.MeshBasicMaterial({
      color: 0x3ddc97, transparent:true, opacity:0.22,
      side: THREE.DoubleSide, depthWrite:false
    });
    const mesh = new THREE.Mesh(geo, mat);
    const loop = new THREE.LineLoop(
      new THREE.BufferGeometry().setFromPoints(verts),
      new THREE.LineBasicMaterial({color: 0x3ddc97, transparent:true, opacity:0.85})
    );
    const wrap = new THREE.Group();
    wrap.add(mesh); wrap.add(loop);
    g.add(wrap);
  }

  g.add(fatLine(A, B, 0xff6b6b, 0.035));
  g.add(fatLine(S, D, 0x6ba8ff, 0.035));

  g.add(fatLine(S, M, 0xffd93d, 0.030));
  g.add(fatLine(M, N, 0xffd93d, 0.030));

  g.add(rightAngle(M, V(1,0,0), new THREE.Vector3().subVectors(S, M).normalize(), 0.20, 0xffffff));
  g.add(rightAngle(M, V(1,0,0), new THREE.Vector3().subVectors(N, M).normalize(), 0.20, 0xffffff));

  g.add(point(M, 0xffd93d, 0.08));
  g.add(point(N, 0xffd93d, 0.08));

  g.add(label(A.clone().add(V(-0.15, 0.15,  0.1)), 'A'));
  g.add(label(B.clone().add(V( 0.15, 0.15,  0.1)), 'B'));
  g.add(label(C.clone().add(V( 0.15, 0.15, -0.1)), 'C'));
  g.add(label(D.clone().add(V(-0.15, 0.15, -0.1)), 'D'));
  g.add(label(S.clone().add(V(0, 0.15, 0)), 'S'));
  g.add(label(M.clone().add(V(0.1, -0.18, 0.1)), 'M', '#ffd93d'));
  g.add(label(N.clone().add(V(0.1, -0.18, -0.1)), 'N', '#ffd93d'));
  g.add(label(A.clone().add(V(-0.5, 0.3, 0.1)), 'AB ⊥ SD', '#ff6b6b', 0.7));
}

/* ============================================================
   Управление
============================================================ */
const SCENES = {
  pp1: {
    build: scenePP1,
    cap: '<div class="label">6.1. Прямая ⊥ плоскости — определение</div>Прямая называется перпендикулярной плоскости, если она перпендикулярна любой прямой в этой плоскости. На рисунке прямая a перпендикулярна нескольким прямым плоскости α.',
    cam:[4.0,3.4,5.0], tgt:[0,0.6,0]
  },
  pp2: {
    build: scenePP2,
    cap: '<div class="label">6.1. Признак перпендикулярности прямой и плоскости</div>Если прямая перпендикулярна двум пересекающимся прямым, лежащим в плоскости, то она перпендикулярна этой плоскости.',
    cam:[4.0,3.4,5.0], tgt:[0,0.6,0]
  },
  pp3: {
    build: scenePP3,
    cap: '<div class="label">6.2. Признак перпендикулярности плоскостей</div>α — вертикальная плоскость, содержит прямую a. β — горизонтальная плоскость. a ⊥ b и a ⊥ c, где b, c — пересекающиеся прямые в β ⇒ a ⊥ β ⇒ α ⊥ β.',
    cam:[4.4,3.4,5.4], tgt:[0,0.3,0]
  },
  pp4: {
    build: scenePP4,
    cap: '<div class="label">6.3. Теорема о трёх перпендикулярах</div>AH ⊥ β — перпендикуляр, AB — наклонная, BH — проекция. Прямая x ⊂ β: x ⊥ AB ⇔ x ⊥ BH.',
    cam:[4.4,3.6,5.6], tgt:[0,0.5,0]
  },
  pp5: {
    build: scenePP5,
    cap: '<div class="label">6.4. Противоположные рёбра пирамиды</div>В правильной пирамиде SABCD ребро AB ⊥ ребру SD. Через AB проведена плоскость (S, M, N), где M — середина AB, N — середина CD. Обе прямые SM и MN ⊥ AB, значит AB ⊥ плоскости (S, M, N), а SD лежит в этой плоскости.',
    cam:[4.8,4.0,5.8], tgt:[0,1.0,0]
  },
};

function show(id){
  clearGroup(g);
  const s = SCENES[id];
  if (!s) return;
  s.build();
  captionEl.innerHTML = s.cap;
  camera.position.set(...s.cam);
  controls.target.set(...s.tgt);
  controls.update();
  renderer.render(scene, camera);
}

document.querySelectorAll('#menu button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#menu button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    show(btn.dataset.id);
  });
});

addEventListener('resize', ()=>{
  const w = viewEl.clientWidth, h = viewEl.clientHeight;
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

function loop(){
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
}

show('pp1');
loop();
</script>
</body>
</html>
