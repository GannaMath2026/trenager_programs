<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Параллелепипед — интерактивный справочник</title>
<style>
:root{color-scheme:dark;--bg:#090d13;--panel:#111925;--edge:#2a394e;--text:#edf3fc;--muted:#9eafc6;--acc:#57d8ce}*{box-sizing:border-box}body{margin:0;background:radial-gradient(1000px 700px at 70% 0%,#1b2940,#090d13 65%);color:var(--text);font:14px/1.5 system-ui,'Segoe UI',Arial,sans-serif}#app{height:100dvh;display:grid;grid-template-columns:280px minmax(0,1fr)}aside{overflow:auto;padding:18px 12px;background:#0b111bdc;border-right:1px solid #ffffff14}aside h1{font-size:21px;margin:0 8px;color:#ff5968}aside p{margin:3px 8px 18px;color:var(--muted);font-size:12px}.navbtn{width:100%;display:block;text-align:left;margin:5px 0;padding:11px 12px;border-radius:9px;border:1px solid transparent;background:transparent;color:#c9d5e6;font:inherit;cursor:pointer}.navbtn:hover{background:#ffffff08;border-color:#ffffff16}.navbtn.active{background:#ff59681b;border-color:#ff59687a;color:#fff}.navbtn span{display:block;color:#8496ad;font-size:11px;margin-top:2px}main{min-width:0;display:flex;flex-direction:column;overflow:hidden}.top{padding:15px 22px;border-bottom:1px solid #ffffff12;background:#0b111bd9;display:flex;align-items:center;gap:14px;flex-wrap:wrap}.top h2{font-size:20px;margin:0;color:var(--acc);flex:1}.zoom{display:flex;align-items:center;gap:10px;min-width:min(340px,100%);color:#cbd7e8;font-size:12px}.zoom input{width:180px;accent-color:var(--acc)}#sceneDesc{padding:12px 22px 8px;color:#c4d0e0;min-height:48px}.stage{flex:1;min-height:0;padding:0 16px 16px;position:relative}.canvaswrap{height:100%;min-height:250px;border:1px solid #27374c;border-radius:14px;overflow:hidden;background:linear-gradient(145deg,#111b2a,#070b11);position:relative}canvas{width:100%;height:100%;display:block;touch-action:none}.controls{display:flex;gap:8px;flex-wrap:wrap;padding:0 22px 12px}.control{background:#172333;border:1px solid #35465d;color:#e9f2ff;border-radius:9px;padding:8px 12px;font:inherit;cursor:pointer}.control.active{background:#18555b;border-color:#57d8ce}.legend{display:flex;flex-wrap:wrap;gap:8px;padding:0 22px 16px}.chip{font-size:11px;color:#d5dfed;border:1px solid #ffffff20;border-radius:99px;padding:4px 9px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.hidden{display:none!important}@media(max-width:720px){#app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}aside{max-height:190px;border-right:0;border-bottom:1px solid #ffffff14;padding:10px}aside h1{font-size:17px}aside p{margin-bottom:6px}.navlist{display:flex;gap:6px;overflow-x:auto}.navbtn{min-width:185px;margin:0}.top{padding:10px 14px}.top h2{font-size:17px}#sceneDesc{padding:8px 14px;min-height:40px}.stage{padding:0 8px 8px}.controls,.legend{padding-left:14px;padding-right:14px}.zoom{min-width:100%}.zoom input{flex:1}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body><div id="app"><aside><h1>ПАРАЛЛЕЛЕПИПЕД</h1><p>Интерактивные свойства и модели</p><div class="navlist"><button class="navbtn active" data-scene="definition">1. Определение<span>Динамическая модель</span></button><button class="navbtn" data-scene="diagonals">2. Диагонали<span>Плоскостные / пространственные</span></button><button class="navbtn" data-scene="faces">3. Противоположные грани<span>Переключатель пар</span></button><button class="navbtn" data-scene="planes">4. Внутренние плоскости<span>Четыре плоскости по очереди</span></button></div></aside><main><div class="top"><h2 id="sceneTitle">Определение параллелепипеда</h2><label class="zoom">Увеличение <input id="zoomSlider" type="range" min="3" max="11" step="0.1" value="6.4"><output id="zoomValue">6.4</output></label></div><div id="sceneDesc">Поверхность параллелепипеда состоит из двух равных параллелограммов и четырёх параллелограммов. Вершины обозначены A, B, C, D и A₁, B₁, C₁, D₁.</div><div class="controls" id="sceneControls"></div><div class="stage"><div class="canvaswrap"><canvas id="canvas"></canvas></div></div><div class="legend" id="legend"></div></main></div>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const P={A:V(-1,-.8,1),B:V(1,-.8,1),C:V(1,.8,1),D:V(-1,.8,1),A1:V(-1.25,-.55,-1),B1:V(.75,-.55,-1),C1:V(.75,1.05,-1),D1:V(-1.25,1.05,-1)};
const edges=[['A','B'],['B','C'],['C','D'],['D','A'],['A1','B1'],['B1','C1'],['C1','D1'],['D1','A1'],['A','A1'],['B','B1'],['C','C1'],['D','D1']];
const faceDefs=[{n:'ABCD',v:['A','B','C','D'],c:0xff727c},{n:'A₁B₁C₁D₁',v:['A1','B1','C1','D1'],c:0xff727c},{n:'ABB₁A₁',v:['A','B','B1','A1'],c:0x5ed9b5},{n:'DCC₁D₁',v:['D','C','C1','D1'],c:0x5ed9b5},{n:'ADD₁A₁',v:['A','D','D1','A1'],c:0x79aaff},{n:'BCC₁B₁',v:['B','C','C1','B1'],c:0x79aaff}];
const colors=[0xff5e68,0xffc857,0x62dcb9,0x66b8ff];
const canvas=document.querySelector('#canvas'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(40,1,.1,100);camera.position.set(4.2,3.2,6.4);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(-.1,.1,0);scene.add(new THREE.HemisphereLight(0xeaf3ff,0x26344a,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(4,7,6);scene.add(light);scene.add(new THREE.DirectionalLight(0x8ab7ff,.7));
const model=new THREE.Group();scene.add(model);let current='definition',pair=0,planeIndex=0,diagMode='face',faceIndex=0;
function matLine(color,opacity=1,dashed=false){return dashed?new THREE.LineDashedMaterial({color,dashSize:.08,gapSize:.06,transparent:opacity<1,opacity}):new THREE.LineBasicMaterial({color,transparent:opacity<1,opacity});}
function addLine(a,b,color=0xeaf1fc,width=1,opacity=1,dashed=false){const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b]),matLine(color,opacity,dashed));if(dashed)l.computeLineDistances();model.add(l);return l;}
function polygon(names,color,opacity=.25){const a=names.map(n=>P[n]);const center=a.reduce((s,p)=>s.add(p.clone()),V(0,0,0)).multiplyScalar(1/a.length);const verts=[center,...a],idx=[];for(let i=1;i<=a.length;i++)idx.push(0,i,i===a.length?1:i+1);const geo=new THREE.BufferGeometry().setFromPoints(verts);geo.setIndex(idx);geo.computeVertexNormals();model.add(new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color,transparent:true,opacity,side:THREE.DoubleSide,depthWrite:false})));for(let i=0;i<a.length;i++)addLine(a[i],a[(i+1)%a.length],color,.9,.9);}
function label(pos,text,color='#f4f7fc'){const c=document.createElement('canvas');c.width=256;c.height=80;const x=c.getContext('2d');x.font='bold 42px Arial';x.textAlign='center';x.textBaseline='middle';x.fillStyle=color;x.fillText(text,128,40);const tex=new THREE.CanvasTexture(c),s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));s.scale.set(.42,.14,1);s.position.copy(pos);model.add(s);}
function ball(pos,color=0xffffff,r=.055){const m=new THREE.Mesh(new THREE.SphereGeometry(r,14,10),new THREE.MeshBasicMaterial({color}));m.position.copy(pos);model.add(m);}
function edgesAll(color=0xf0f4fc){edges.forEach(([a,b])=>addLine(P[a],P[b],color));}
function labelsAll(){Object.entries(P).forEach(([n,p])=>label(p.clone().add(V(0,.12,0)),n));}
function spatialDiags(){[['A','C1'],['B','D1'],['C','A1'],['D','B1']].forEach(([a,b],i)=>addLine(P[a],P[b],colors[i],1,1));}
function thickEdge(a,b,color=0xffffff,r=.026){const dir=P[b].clone().sub(P[a]),len=dir.length();const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,10),new THREE.MeshBasicMaterial({color}));mesh.position.copy(P[a]).add(P[b]).multiplyScalar(.5);mesh.quaternion.setFromUnitVectors(V(0,1,0),dir.normalize());model.add(mesh);}
function highlightEdges(names,color=0xffffff){names.forEach(([a,b])=>thickEdge(a,b,color,.024));}
function clear(){while(model.children.length){const o=model.children.pop();o.traverse?.(x=>{x.geometry?.dispose?.();if(x.material){if(Array.isArray(x.material))x.material.forEach(m=>m.dispose());else x.material.dispose();}})}}
function base(){edgesAll();labelsAll();}
const title=document.querySelector('#sceneTitle'),desc=document.querySelector('#sceneDesc'),controlBox=document.querySelector('#sceneControls'),legend=document.querySelector('#legend');
function button(text,active,fn){const b=document.createElement('button');b.className='control'+(active?' active':'');b.textContent=text;b.onclick=fn;controlBox.append(b);return b;}
function chip(color,text){const s=document.createElement('span');s.className='chip';s.innerHTML=`<i class="dot" style="background:#${color.toString(16).padStart(6,'0')}"></i>${text}`;legend.append(s)}
function renderScene(){clear();controlBox.innerHTML='';legend.innerHTML='';
if(current==='definition'){title.textContent='Определение параллелепипеда';desc.textContent='Поверхность параллелепипеда состоит из двух равных параллелограммов и четырёх параллелограммов. Модель динамическая: вращайте её, чтобы рассмотреть все грани и вершины.';faceDefs.forEach(f=>polygon(f.v,f.c,.18));base();faceDefs.forEach(f=>chip(f.c,f.n));}
if(current==='diagonals'){title.textContent='Плоскостные и пространственные диагонали';desc.textContent=diagMode==='face'?'Выберите грань кнопками ниже: ярко выделятся две диагонали именно этой грани. У каждой грани свой цвет.':'Пространственная диагональ соединяет вершины, не лежащие на одной грани. Четыре диагонали показаны каждая своим цветом.';base();if(diagMode==='face'){const faceColors=[0xff6b75,0xffc857,0x65d9b8,0x66b8ff,0xd28cff,0xff9b59];faceDefs.forEach((f,i)=>{const c=faceColors[i];if(i!==faceIndex){addLine(P[f.v[0]],P[f.v[2]],c,.8,.22);addLine(P[f.v[1]],P[f.v[3]],c,.8,.22);}else{polygon(f.v,c,.17);addLine(P[f.v[0]],P[f.v[2]],c,1,1);addLine(P[f.v[1]],P[f.v[3]],c,1,1);chip(c,'Диагонали грани '+f.n);}});button('Плоскостные диагонали',true,()=>{diagMode='face';renderScene()});button('Пространственные диагонали',false,()=>{diagMode='space';renderScene()});faceDefs.forEach((f,i)=>button('Грань '+f.n,i===faceIndex,()=>{faceIndex=i;renderScene()}));}else{spatialDiags();[['A—C₁',colors[0]],['B—D₁',colors[1]],['C—A₁',colors[2]],['D—B₁',colors[3]]].forEach(([t,c])=>chip(c,t));button('Плоскостные диагонали',false,()=>{diagMode='face';renderScene()});button('Пространственные диагонали',true,()=>{diagMode='space';renderScene()});const o=V(-.125,.125,0);ball(o,0xffffff,.075);label(o.clone().add(V(.12,.13,0)),'O');}}
if(current==='faces'){title.textContent='Противоположные грани равны и параллельны';desc.textContent='Переключайте пары граней: грани одной пары выделяются одним цветом. Все три пары можно рассмотреть, вращая модель.';faceDefs.forEach((f,i)=>polygon(f.v,0x253247,.07));const pairs=[[0,1],[2,3],[4,5]];const [i,j]=pairs[pair];polygon(faceDefs[i].v,faceDefs[i].c,.55);polygon(faceDefs[j].v,faceDefs[j].c,.55);base();pairs.forEach((ab,k)=>button(['Основания','Боковая пара 1','Боковая пара 2'][k],pair===k,()=>{pair=k;renderScene()}));chip(faceDefs[i].c,faceDefs[i].n+' = '+faceDefs[j].n);}
if(current==='planes'){title.textContent='Четыре внутренние плоскости';desc.textContent='Выберите ребро или вертикальное ребро. Убраны варианты через DA и BC; вместо них добавлены сечения через CC₁ и DD₁. Рёбра D₁C₁, CC₁, CD и DD₁ выделены более толстой яркой линией.';base();highlightEdges([['D1','C1'],['C','C1'],['C','D'],['D','D1']],0xffffff);const defs=[{name:'AB',v:['A','B','C1','D1']},{name:'CC₁',v:['A','C','C1','A1']},{name:'CD',v:['C','D','A1','B1']},{name:'DD₁',v:['B','D','D1','B1']}];const f=defs[planeIndex];polygon(f.v,colors[planeIndex],.35);const ordered=f.v;for(let i=0;i<4;i++)addLine(P[ordered[i]],P[ordered[(i+1)%4]],colors[planeIndex],1,1); // both diagonals in the selected plane, each distinct color
addLine(P[ordered[0]],P[ordered[2]],colors[planeIndex],1,1);addLine(P[ordered[1]],P[ordered[3]],[0xffe36e,0x7de2ff,0xff8bdb,0x9eff8c][planeIndex],1,1);defs.forEach((d,i)=>button('Плоскость через ребро '+d.name,i===planeIndex,()=>{planeIndex=i;renderScene()}));chip(colors[planeIndex],'плоскость через '+f.name);chip([0xffe36e,0x7de2ff,0xff8bdb,0x9eff8c][planeIndex],'диагонали выбранной плоскости');}
}
function switchScene(id){current=id;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.scene===id));renderScene();}
document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>switchScene(b.dataset.scene)));
const zoom=document.querySelector('#zoomSlider'),zv=document.querySelector('#zoomValue');zoom.addEventListener('input',()=>{const d=+zoom.value;zv.value=d.toFixed(1);zv.textContent=d.toFixed(1);const dir=camera.position.clone().sub(controls.target).normalize();camera.position.copy(controls.target.clone().add(dir.multiplyScalar(d)));});
function resize(){const r=canvas.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/Math.max(1,r.height);camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(canvas);renderScene();resize();function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
</script></body></html>
