T({ id: '057', code: '057', src: '65521', sec: 'sys', lvl: 2, kind: 'f(x) = f(y), более двух решений',
  st: R`Найдите все значения параметра \(a\), при каждом из которых система \[\begin{cases}x^2+x+|x^2-x-2|=y^2+y+|y^2-y-2|,\\x+y=a\end{cases}\] имеет более двух решений.`,
  links: L('https://www.geogebra.org/classic/um3dxzwv', 'https://3.shkolkovo.online/catalog/136/65521', 'https://rutube.ru/video/bc2da5a5db729ac731e6780506f798f6/'),
  ans: '(-2;0]', need: '>=3', needText: 'более двух решений',
  an: [
    Q('Функция', R`\(f(t)=t^2+t+|t^2-t-2|\). На \([-1;2]\):`, ['f(t) = 2t + 2', 'f(t) = 2t² − 2', 'f(t) = 2', 'f(t) = t² + t'], R`Вне \([-1;2]\): \(f(t)=2t^2-2\).`),
    Q('Монотонность', R`\(f\) убывает на \((-\infty;-1]\) и возрастает на \([-1;+\infty)\). Поэтому \(f(x)=f(y)\iff\)`, ['y = x или точки «по разные стороны» от −1', 'только y = x', 'y = −x', 'x = y = −1']),
    Q('Дуга', R`При \(x\in[-2;-1]\), \(y\in[-1;2]\): \(2x^2-2=2y+2\iff\)`, ['y=x^2-2', 'y=x^2+2', 'y=2-x^2', 'y=x^2-1'], R`Плюс симметричная дуга \(x=y^2-2\) и лучи \(y=-x\) при \(|x|>2\).`),
    Q('Подсчёт', R`При \(a=0\) прямая \(x+y=0\) содержит лучи фигуры. Решений:`, ['бесконечно много', 'три', 'одно', 'два'], R`При \(-2<a<0\) — три решения (на \(y=x\) и по одному на дугах).`)
  ],
  g: { va: [-4, 3], vx: [-4, 4], vy: [-4, 4],
    fix: [{ F: (x, y) => { const f = t => t * t + t + abs(t * t - t - 2); return f(x) - f(y); }, lab: 'f(x) = f(y)', lx: 1.5, ly: 2.3 }],
    mov: [{ F: (x, y, a) => x + y - a }],
    sol: a => { if (near(a, 0)) return 'inf'; const out = [[a / 2, a / 2]]; quad(1, 1, -(2 + a)).forEach(x => { if (x >= -2 - 1e-12 && x <= -1 + 1e-12) out.push([x, x * x - 2], [x * x - 2, x]); }); return out; },
    pts: [[-1, -1, 0], [-2, 2, 0], [2, -2, 0]],
    fixT: R`Множество \(f(x)=f(y)\): прямая \(y=x\), дуги \(y=x^2-2\), \(x=y^2-2\) и лучи \(y=-x\) (\(|x|\ge2\)).`, forbT: 'Ограничений нет.', movT: '', keyT: R`Прямые \(x+y=a\). Особые: \(a=-2\) (через \((-1;-1)\)), \(a=0\) (лучи).` } });

T({ id: '058', code: '058', src: '24293', sec: 'sys', lvl: 2, kind: 'две параллельные прямые и окружность',
  st: R`Найдите все значения параметра \(a\), при каждом из которых система уравнений \[\begin{cases}(x+ay-5)(x+ay-5a)=0,\\x^2+y^2=16\end{cases}\] имеет ровно четыре различных решения.`,
  links: L('https://www.geogebra.org/classic/uybn4kqr', 'https://3.shkolkovo.online/catalog/7441/24293', 'https://rutube.ru/video/df4d278812c169c7045b8cb6001e6efc/'),
  ans: '(-4/3;-3/4)U(3/4;1)U(1;4/3)', need: '=4',
  an: [
    Q('Первое уравнение', 'Задаёт:', ['две параллельные прямые x + ay = 5 и x + ay = 5a', 'две пересекающиеся прямые', 'окружность', 'одну прямую'], R`При \(a=1\) прямые совпадают.`),
    Q('Расстояния', 'Расстояния от начала координат до прямых:', ['\\frac5{\\sqrt{1+a^2}}\\ \\text{и}\\ \\frac{5|a|}{\\sqrt{1+a^2}}', '\\frac5{1+a^2}\\ \\text{и}\\ \\frac{5a}{1+a^2}', '5\\ \\text{и}\\ 5|a|', '\\frac{5}{\\sqrt{1+a}}']),
    Q('Обе секущие', 'Обе прямые пересекают окружность (расстояние < 4) при', ['\\frac34<|a|<\\frac43', '|a|<\\frac43', '|a|>\\frac34', '\\frac34\\le|a|\\le\\frac43'], R`\(25<16(1+a^2)\) и \(25a^2<16(1+a^2)\).`),
    Q('Исключение', 'Какое значение исключаем?', ['a=1', 'a=-1', 'a=0', 'a=\\pm1'], 'Прямые совпадают — только 2 точки.')
  ],
  g: { va: [-2.2, 2.2], vx: [-6.5, 6.5], vy: [-5, 5],
    fix: [{ F: (x, y) => x * x + y * y - 16, lab: 'x² + y² = 16', lx: 2.9, ly: 3.4 }],
    mov: [{ F: (x, y, a) => x + a * y - 5 }, { F: (x, y, a) => x + a * y - 5 * a }],
    sol: a => { const out = []; for (const c of [5, 5 * a]) quad(1 + a * a, -2 * a * c, c * c - 16).forEach(y => out.push([c - a * y, y])); return out; },
    fixT: R`Окружность радиуса 4 с центром в начале координат.`, forbT: 'Ограничений нет.', movT: '', keyT: R`Две параллельные прямые поворачиваются и сдвигаются. Особые: \(a=\pm\frac34,\ \pm\frac43,\ 1\).` } });

T({ id: '059', code: '059', src: '18138', sec: 'sys', lvl: 2, kind: 'равенство корней, y = x²',
  st: R`Найдите все положительные значения параметра \(a\), при которых система \[\begin{cases}\sqrt{2x-x^2}=\sqrt{2ay-a^2y^2},\\y=x^2\end{cases}\] имеет ровно 3 решения.`,
  links: L('https://3.shkolkovo.online/catalog/136/18138', 'https://rutube.ru/video/private/ade89e50b58284aca7730840e79e6fd0/?p=2RXBCqF6GJPyyOnP89XCTQ'),
  ans: '[1/2;1)U(1;inf)', need: '=3',
  an: [
    Q('Переход', R`\(\sqrt{2x-x^2}=\sqrt{2ay-a^2y^2}\iff\)`, ['\\begin{cases}(x-1)^2=(ay-1)^2\\\\0\\le x\\le2\\end{cases}', '(x-1)^2=(ay-1)^2', '\\begin{cases}x=ay\\\\0\\le x\\le2\\end{cases}', '2x-x^2=2ay'], R`Выделили полные квадраты: \(1-(x-1)^2=1-(ay-1)^2\).`),
    Q('Две прямые', R`\((x-1)^2=(ay-1)^2\iff\)`, ['ay=x\\ \\text{или}\\ ay=2-x', 'ay=x', 'ay=x-2\\ \\text{или}\\ ay=x', 'y=ax']),
    Q('С параболой', R`\(ax^2=x\) даёт`, ['x=0\\ \\text{и}\\ x=\\frac1a', 'x=a', 'x=\\frac1a', 'x=0'], R`\(\frac1a\le2\iff a\ge\frac12\).`),
    Q('Вторая прямая', R`\(ax^2+x-2=0\) имеет корень на \([0;2]\) — всегда один: \(x=\frac{-1+\sqrt{1+8a}}{2a}\). Совпадение с \(\frac1a\) при`, ['a=1', 'a=\\frac12', 'a=2', 'a=\\frac14'], R`Итог: \(a\in[\frac12;1)\cup(1;+\infty)\).`)
  ],
  g: { va: [-0.3, 3], vx: [-1, 3], vy: [-0.8, 4.5], domXY: (x, y, e) => x >= -e && x <= 2 + e, dom: (x, a, e) => a > e, keys: [0],
    fix: [{ F: (x, y) => y - x * x, lab: 'y = x²', lx: 1.6, ly: 3.6 }],
    mov: [{ F: (x, y, a) => a * y - x }, { F: (x, y, a) => a * y - 2 + x }],
    sol: a => { if (a <= 0) return []; const out = [[0, 0], [1 / a, 1 / (a * a)]]; quad(a, 1, -2).forEach(x => out.push([x, x * x])); return out.filter(q => q[0] >= -1e-12 && q[0] <= 2 + 1e-12); },
    fixT: R`Парабола \(y=x^2\), только \(0\le x\le2\).`, forbT: R`Запрещено \(x<0\) и \(x>2\); рассматриваем \(a>0\).`, movT: '', keyT: R`Прямые \(ay=x\) и \(ay=2-x\) поворачиваются вокруг \((0;0)\) и \((2;0)\). Особые: \(a=\frac12\), \(a=1\).` } });

/* ===================== БЛОК 5: задачи 060–072 ===================== */
SEC.ineq = ['Системы неравенств', 10];
const feas = (pred, cands, lo, hi) => { // есть ли x на [lo;hi], удовлетворяющий pred (проверка кандидатов и сетки)
  const xs = [...cands.filter(x => isFinite(x) && x >= lo - 1e-12 && x <= hi + 1e-12)];
  for (let i = 0; i <= 400; i++) xs.push(lo + (hi - lo) * i / 400);
  const all = [...xs]; xs.forEach(x => { all.push(x + 1e-9, x - 1e-9); });
  return all.some(x => x >= lo - 1e-12 && x <= hi + 1e-12 && pred(x)); };

T({ id: '060', code: '060', src: '73005 Ященко 26', sec: 'sys', lvl: 2, kind: 'max-модули, прямоугольник и дуги',
  st: R`Найдите все значения параметра \(a\), при каждом из которых система \[\begin{cases}\left(\dfrac{|x+4|+|x-4|}2-1\right)^2+\left(\dfrac{|y+1|+|y-1|}2-5\right)^2=25,\\y=ax-8a\end{cases}\] имеет ровно два различных решения.`,
  links: L('https://www.geogebra.org/classic/wq6ngsfe', 'https://3.shkolkovo.online/catalog/4150/111606', 'https://3.shkolkovo.online/catalog/4150/73005', 'https://rutube.ru/video/private/95ac58b2fb97f7fe7d1aba371a880a96/?p=xEnENPhnLnonznbtuFp9JA'),
  ans: '(-35/12;-1/4]U[1/4;35/12)', need: '=2',
  an: [
    Q('Полусуммы модулей', R`\(\frac{|x+4|+|x-4|}2=\)`, ['\\max(|x|,4)', '|x|+4', '\\min(|x|,4)', '|x|'], R`Аналогично \(\frac{|y+1|+|y-1|}2=\max(|y|,1)\).`),
    Q('Замена', R`\(u=\max(|x|,4)\ge4,\ v=\max(|y|,1)\ge1\): \((u-1)^2+(v-5)^2=25\). Дуга в \((u;v)\) идёт от`, ['(4; 1) до (4; 9) через (6; 5)', '(1; 5) до (6; 5)', '(4; 0) до (4; 10)', '(0; 0) до (6; 5)']),
    Q('Обратно в (x; y)', R`Точке \(u=4,\ v=1\) соответствует`, ['весь прямоугольник |x| ≤ 4, |y| ≤ 1', 'точка (4; 1)', 'четыре точки (±4; ±1)', 'отрезок'], R`Ещё: отрезки \(y=\pm9,\ |x|\le4\) и четыре дуги окружностей \((|x|-1)^2+(|y|-5)^2=25\).`),
    Q('Пучок', R`Прямая \(y=a(x-8)\) проходит через \((8;0)\). Она задевает прямоугольник (бесконечно много решений) при`, ['|a|<\\frac14', '|a|\\le\\frac14', '|a|<\\frac12', '|a|<4'], R`Через угол \((4;\pm1)\): \(a=\mp\frac14\) — одна общая точка.`),
    Q('Касание дуги', R`Касание с дугой \((x-1)^2+(y-5)^2=25\) при`, ['a=\\frac{35}{12}', 'a=\\frac{12}{35}', 'a=3', 'a=\\frac53'], R`Расстояние от \((1;5)\) до прямой \(ax-y-8a=0\) равно 5: \(\frac{|7a+5|}{\sqrt{a^2+1}}=5\). Итог: \(\frac14\le|a|<\frac{35}{12}\).`)
  ],
  g: { va: [-4, 4], vx: [-9, 10], vy: [-11, 11], keys: [0],
    fix: [{ poly: [[-4, -1], [4, -1], [4, 1], [-4, 1]], lab: 'прямоугольник', lx: -3.6, ly: 1.6 }, { F: (x, y) => (Math.max(abs(x), 4) - 1) ** 2 + (Math.max(abs(y), 1) - 5) ** 2 - 25, ok: (x, y, e) => abs(x) > 4 + e || abs(y) > 1 + e, lab: 'дуги и отрезки y = ±9', lx: 3, ly: 9.6 }],
    mov: [{ F: (x, y, a) => y - a * (x - 8) }],
    sol: a => { if (abs(a) < 0.25 - 1e-12) return 'inf'; const out = [];
      if (near(abs(a), 0.25)) out.push([4, -4 * a]);
      for (const sy of [1, -1]) { const x = sy * 9 / a + 8; if (abs(x) <= 4 + 1e-12) out.push([x, sy * 9]); }
      for (const sx of [1, -1]) for (const sy of [1, -1]) { // (x - sx)^2 + (y - 5sy)^2 = 25, y = a(x-8)
        const A = 1 + a * a, B = -2 * sx + 2 * a * (-8 * a - 5 * sy), C = 1 + (8 * a + 5 * sy) ** 2 - 25;
        quad(A, B, C).forEach(x => { const y = a * (x - 8); if (sx * x > 4 - 1e-12 && sy * y > 1 - 1e-12) out.push([x, y]); }); }
      return out; },
    fixT: R`Фигура: прямоугольник \(|x|\le4,\ |y|\le1\), отрезки \(y=\pm9\) (\(|x|\le4\)) и четыре дуги окружностей.`, forbT: 'Ограничений нет.', movT: '', keyT: R`Пучок через \((8;0)\). Особые: \(a=\pm\frac14\) (углы прямоугольника), \(a=\pm\frac{35}{12}\) (касание дуг).` } });

T({ id: '061', code: '061', src: '175407 (2026 досрок)', sec: 'sys', lvl: 2, kind: 'полуокружность и ромб',
  st: R`Найдите все значения параметра \(a\), при каждом из которых система \[\begin{cases}|x-a|+|y|=2,\\y=\sqrt{4-x^2}\end{cases}\] имеет ровно одно решение.`,
  links: L('https://www.geogebra.org/classic/kekjxuss', 'https://3.shkolkovo.online/catalog/136/175407', 'https://rutube.ru/video/private/c1a532d7cfca27ffbb00cd7d1e4e16ae/?p=w_sgdUo5uAJtCnZPAkTSfQ'),
  ans: '[-4;2-2*sqrt(2))U(-2+2*sqrt(2);4]', need: '=1',
  an: [
    Q('Второе уравнение', R`\(y=\sqrt{4-x^2}\) — это`, ['верхняя полуокружность радиуса 2', 'окружность', 'парабола', 'нижняя полуокружность']),
    Q('Первое уравнение', R`\(|x-a|+|y|=2\) — квадрат (ромб) с центром`, ['(a; 0), вершины (a ± 2; 0), (a; ±2)', '(0; a)', '(a; a)', '(2; 0)']),
    Q('Крайние положения', R`Ромб касается полуокружности только одной вершиной \((a\mp2;0)\) при`, ['a=\\pm4', 'a=\\pm2', 'a=0', 'a=\\pm3']),
    Q('Касание стороной', R`Сторона \(y=2-(x-a)\) касается окружности при`, ['a=2\\sqrt2-2', 'a=2\\sqrt2', 'a=2-\\sqrt2', 'a=\\sqrt2'], R`Расстояние от \((0;0)\) до \(x+y-2-a=0\) равно 2: \(|2+a|=2\sqrt2\).`),
    Q('Итог', 'Ровно одно решение при', ['2\\sqrt2-2<|a|\\le4', '|a|\\le4', '0<|a|<4', '|a|>2\\sqrt2-2'], R`При \(a=0\) — три решения: \((\pm2;0)\) и \((0;2)\).`)
  ],
  g: { va: [-5, 5], vx: [-7.5, 7.5], vy: [-3, 3.6], keys: [0, -2, 2],
    fix: [{ F: (x, y) => x * x + y * y - 4, ok: (x, y, e) => y >= -e, lab: 'y = √(4 − x²)', lx: 1.2, ly: 2.3 }],
    mov: [{ F: (x, y, a) => abs(x - a) + abs(y) - 2 }],
    sol: a => { const out = []; const Y = x => sqrt(Math.max(0, 4 - x * x));
      quad(2, -2 * (2 + a), (2 + a) ** 2 - 4).forEach(x => { if (abs(x) <= 2 + 1e-12 && x >= a - 1e-12 && 2 + a - x >= -1e-12) out.push([x, Y(x)]); });
      quad(2, 2 * (2 - a), (2 - a) ** 2 - 4).forEach(x => { if (abs(x) <= 2 + 1e-12 && x < a - 1e-12 && 2 - a + x >= -1e-12) out.push([x, Y(x)]); });
      return out; },
    fixT: R`Верхняя полуокружность \(x^2+y^2=4,\ y\ge0\).`, forbT: R`Только \(y\ge0\).`, movT: '', keyT: R`Ромб с центром \((a;0)\) едет по оси. Особые: \(a=\pm4\), \(a=\pm(2\sqrt2-2)\), \(a=0,\ \pm2\).` } });

T({ id: '062', code: '062', src: '642757', sec: 'sysf', lvl: 2, kind: 'не пропустить параллельность',
  st: R`Найдите все значения параметра \(a\), при каждом из которых система уравнений \[\begin{cases}(xy-2x+16)\cdot\sqrt{y-2x+16}=0,\\y=ax-14\end{cases}\] имеет ровно два различных решения.`,
  links: L('https://www.geogebra.org/classic/z7qyx2je', 'https://math-ege.sdamgia.ru/problem?id=642757', 'https://rutube.ru/video/3f30d6acc5f0dafe0e1768b749535186/'),
  ans: '(-inf;0)U(0;7/4]U{2;4}', need: '=2',
  an: [
    Q('ОДЗ и фигура', 'Первое уравнение задаёт:', ['прямую y = 2x − 16 и гиперболу y = 2 − 16/x в области y ≥ 2x − 16', 'только гиперболу', 'прямую и параболу', 'две прямые']),
    Q('Пучок', R`Прямая \(y=ax-14\) проходит через`, ['(0; −14)', '(14; 0)', '(0; 14)', '(−14; 0)']),
    Q('Параллельность', R`При \(a=2\) прямая параллельна \(y=2x-16\). Решений:`, ['два (обе точки на гиперболе)', 'ни одного', 'одно', 'бесконечно много'], R`Не пропустите этот случай!`),
    Q('Касание', R`\(ax^2-16x+16=0\) имеет двойной корень при`, ['a=4', 'a=2', 'a=8', 'a=\\frac74'], R`\(D=256-64a=0\).`),
    Q('Граница ОДЗ', R`Прямая через \((-8;\,4)\) — точку гиперболы на границе — имеет`, ['a=-\\frac94', 'a=\\frac74', 'a=-\\frac74', 'a=2'], R`Итог проверьте по лучу: \((-\infty;0)\cup(0;\frac74]\cup\{2;4\}\).`)
  ],
  g: { va: [-3, 5], vx: [-12, 14], vy: [-20, 14], domXY: (x, y, e) => y - 2 * x + 16 >= -e, keys: [0, 2, 4],
    fix: [{ F: (x, y) => y - 2 * x + 16, lab: 'y = 2x − 16', lx: 9, ly: 4 }, { F: (x, y) => x * y - 2 * x + 16, lab: 'xy − 2x + 16 = 0', lx: -11, ly: 6 }],
    mov: [{ F: (x, y, a) => y - a * x + 14 }],
    sol: a => { const out = []; if (!near(a, 2)) { const x = -2 / (a - 2); out.push([x, a * x - 14]); } quad(a, -16, 16).forEach(x => { const y = a * x - 14; if (y - 2 * x + 16 >= -1e-9) out.push([x, y]); }); return out; },
    fixT: R`Прямая \(y=2x-16\) и гипербола \(y=2-\frac{16}x\) — только где \(y\ge2x-16\).`, forbT: R`Запрещено \(y<2x-16\).`, movT: '', keyT: R`Пучок через \((0;-14)\). Особые: \(a=0,\ \frac74,\ 2,\ 4\).` } });

T({ id: '063', code: '063', src: '18.23 (642737)', sec: 'sysf', lvl: 2, kind: 'парабола и прямая в ОДЗ',
  st: R`Найдите все значения параметра \(a\), при каждом из которых система уравнений \[\begin{cases}\left(x^2-5x-y+3\right)\cdot\sqrt{x-y+3}=0,\\y=3x+a\end{cases}\] имеет ровно два различных решения.`,
  links: L('https://www.geogebra.org/classic/u69k4rqh', 'https://math-ege.sdamgia.ru/problem?id=642737', 'https://rutube.ru/video/f010dd6107294cce44e0421ecc0ac972/'),
  ans: '{-13}U[-9;3)', need: '=2',
  an: [
    Q('ОДЗ', 'Ограничение:', ['y\\le x+3', 'y\\ge x+3', 'y<x+3', 'x\\ge y']),
    Q('Фигура', 'Решения первого уравнения:', ['прямая y = x + 3 и часть параболы y = x² − 5x + 3 при 0 ≤ x ≤ 6', 'вся парабола', 'только прямая', 'парабола при x ≥ 6']),
    Q('Касание', R`\(y=3x+a\) касается параболы при`, ['a=-13', 'a=-9', 'a=3', 'a=13'], R`\(x^2-8x+3-a=0,\ D=0\Rightarrow a=-13\) (точка \(x=4\)).`),
    Q('Через концы дуги', R`Через \((0;3)\) и \((6;9)\) проходят прямые с`, ['a=3;\\ a=-9', 'a=3;\\ a=9', 'a=-3;\\ a=-9', 'a=0;\\ a=-9']),
    Q('Итог', 'Ровно два решения:', ['a=-13\\ \\text{или}\\ -9\\le a<3', '-13\\le a<3', '-9<a<3', 'a\\le3'])
  ],
  g: { va: [-16, 6], vx: [-3, 8], vy: [-5, 12], domXY: (x, y, e) => y <= x + 3 + e,
    fix: [{ F: (x, y) => y - x - 3, lab: 'y = x + 3', lx: -2.6, ly: 1.4 }, { F: (x, y) => y - x * x + 5 * x - 3, lab: 'y = x² − 5x + 3', lx: 4.5, ly: -2.5 }],
    mov: [{ F: (x, y, a) => y - 3 * x - a }],
    sol: a => { const out = [[(3 - a) / 2, (3 - a) / 2 + 3]]; quad(1, -8, 3 - a).forEach(x => { if (x >= -1e-12 && x <= 6 + 1e-12) out.push([x, 3 * x + a]); }); return out; },
    pts: [[0, 3, 0], [6, 9, 0], [4, -1, 0]],
    fixT: R`Прямая \(y=x+3\) и дуга параболы \(y=x^2-5x+3\) под ней (\(0\le x\le6\)).`, forbT: R`Запрещено \(y>x+3\).`, movT: '', keyT: R`Параллельные прямые \(y=3x+a\). Особые: \(a=-13\) (касание), \(a=-9\), \(a=3\).` } });

T({ id: '064', code: '064', src: '18.27', sec: 'sys', lvl: 3, kind: 'гипербола с модулем',
  st: R`Найдите все значения параметра \(a\), при каждом из которых система уравнений \[\begin{cases}2x+2ay+a-3=0,\\x|y|+2x-3=0\end{cases}\] имеет единственное решение.`,
  links: L('https://www.geogebra.org/classic/wc8wzf9k', 'https://rutube.ru/video/f63956f5accbece38fa2b80366ab6e62/'),
  ans: '(-inf;0]U(1/3;inf)', need: '=1',
  an: [
    Q('Второе уравнение', R`\(x(|y|+2)=3\iff\)`, ['x=\\frac3{|y|+2}', 'x=\\frac3{|y|}-2', 'y=\\frac3x-2', 'x=3-|y|'], R`Кривая «стрелка»: при \(y=0\) \(x=\frac32\), при \(|y|\to\infty\) \(x\to0\).`),
    Q('Первое уравнение', 'Прямая 2x + 2ay + a − 3 = 0 при всех a проходит через', ['(\\frac32;\\,-\\frac12)', '(0;\\,0)', '(\\frac32;\\,0)', '(1;\\,1)'], R`\(2x-3+a(2y+1)=0\).`),
    Q('a = 0', R`При \(a=0\): \(x=\frac32\). Решений:`, ['одно: (3/2; 0)', 'два', 'ни одного', 'бесконечно много']),
    Q('Итог', 'Единственное решение при', ['a\\le0\\ \\text{или}\\ a>\\frac13', 'a<0', 'a>\\frac13', 'a\\ne\\frac13'], R`Проверьте по лучу: в \((0;\frac13]\) прямая пересекает нижнюю ветвь дважды.`)
  ],
  g: { va: [-2, 2], vx: [-1, 4], vy: [-5, 5], keys: [0],
    fix: [{ F: (x, y) => x * (abs(y) + 2) - 3, lab: 'x(|y| + 2) = 3', lx: 1.6, ly: 1.2 }],
    mov: [{ F: (x, y, a) => 2 * x + 2 * a * y + a - 3 }],
    sol: a => { const out = []; quad(-2 * a, 3 - 5 * a, -2 * a).forEach(y => { if (y >= -1e-12) out.push([3 / (abs(y) + 2), y]); }); quad(2 * a, -(3 + 3 * a), -2 * a).forEach(y => { if (y < -1e-12) out.push([3 / (abs(y) + 2), y]); }); return out; },
    pts: [[1.5, -0.5, 0]],
    fixT: R`Кривая \(x=\frac3{|y|+2}\).`, forbT: 'Ограничений нет.', movT: '', keyT: R`Пучок через \((\frac32;-\frac12)\). Особые: \(a=0\), \(a=\frac13\).` } });

T({ id: '065', code: '065', src: '18.28', sec: 'sys', lvl: 3, kind: 'замена t = x², окружность и прямая',
  st: R`Найдите все значения параметра \(a\), при каждом из которых система уравнений \[\begin{cases}x^4+y^2=a^2,\\x^2+y=|2a-4|\end{cases}\] имеет ровно четыре различных решения.`,
  links: L('https://www.geogebra.org/classic/ak4cvmuh', 'https://rutube.ru/video/private/5179fa52775e09920ea951320440ff73/?p=Ee1vV616c6ZRgXryQyTcJQ'),
  ans: '(4-2*sqrt(2);4/3)U(4;4+2*sqrt(2))', need: '=4',
  an: [
    Q('Замена', R`\(t=x^2\ge0\). Система в плоскости \((t;y)\):`, ['t^2+y^2=a^2,\\ t+y=|2a-4|,\\ t\\ge0', 't^2+y=a^2', 't+y^2=|2a-4|', 't^2+y^2=a'], R`Каждому \(t>0\) — два решения \(x=\pm\sqrt t\), а \(t=0\) — одно.`),
    Q('Четыре решения', R`Нужно, чтобы прямая \(t+y=c\) пересекала окружность радиуса \(|a|\) в двух точках с`, ['t > 0 у обеих', 't ≥ 0', 't < 0', 'одной t = 0'], ''),
    Q('Две точки', R`\(2t^2-2ct+c^2-a^2=0\): обе \(t>0\) ⇔`, ['c>0,\\ c^2<2a^2,\\ c^2>a^2', 'c^2<2a^2', 'c>|a|', 'c^2>a^2'], R`\(c=|2a-4|\).`),
    Q('Итог', 'Получаем:', ['a\\in(4-2\\sqrt2;\\frac43)\\cup(4;4+2\\sqrt2)', 'a\\in(\\frac43;4)', 'a\\in(4-2\\sqrt2;4+2\\sqrt2)', 'a>4'])
  ],
  g: { va: [0, 8], vx: [-3.5, 3.5], vy: [-4, 6],
    fix: [],
    mov: [{ F: (x, y, a) => x ** 4 + y * y - a * a }, { F: (x, y, a) => x * x + y - abs(2 * a - 4) }],
    sol: a => { const c = abs(2 * a - 4), out = []; quad(2, -2 * c, c * c - a * a).forEach(t => { if (t >= -1e-12) { if (t < 1e-10) { out.push([0, c]); return; } const r = sqrt(t); out.push([r, c - t], [-r, c - t]); } }); return out; },
    fixT: R`Здесь обе линии зависят от \(a\): кривая \(x^4+y^2=a^2\) и парабола \(y=|2a-4|-x^2\).`, forbT: 'Ограничений нет.', movT: '', keyT: R`Особые: \(a=4\pm2\sqrt2\) (касание), \(a=\frac43,\ 4\) (через \(t=0\)).` } });

T({ id: '070', code: '070', src: '18.39', sec: 'ineq', lvl: 1, region: true, kind: 'система неравенств на [4; 5]',
  st: R`Найдите все значения параметра \(a\), при каждом из которых система неравенств \[\begin{cases}a(x-1)\ge4,\\2\sqrt{x-2}\ge a,\\3x<a+14\end{cases}\] имеет хотя бы одно решение на отрезке \([4;5]\).`,
  links: L('https://www.geogebra.org/classic/qrbtunh3', 'https://3.shkolkovo.online/catalog/7442/1016', 'https://rutube.ru/video/private/385481eaaf456dfdd6c92fd99fd3828b/?p=3eaQK6LM8TLJn0-WsritOA'),
  ans: '(1;2*sqrt(3)]', needText: 'есть решение на [4; 5]',
  an: [
    Q('Плоскость (x; a)', 'Первое неравенство при x ∈ [4; 5]:', ['a\\ge\\frac4{x-1}', 'a\\le\\frac4{x-1}', 'a\\ge4(x-1)', 'a\\ge\\frac{x-1}4']),
    Q('Второе', 'Второе неравенство:', ['a\\le2\\sqrt{x-2}', 'a\\ge2\\sqrt{x-2}', 'a\\le\\sqrt{x-2}', 'a\\le4(x-2)']),
    Q('Третье', 'Третье неравенство:', ['a>3x-14', 'a<3x-14', 'a\\ge3x-14', 'a>14-3x']),
    Q('Угловые точки', R`Граница \(a=\frac4{x-1}\) при \(x=5\) даёт \(a=1\); граница \(a=2\sqrt{x-2}\) при \(x=5\) даёт`, ['a=2\\sqrt3', 'a=2\\sqrt2', 'a=3', 'a=\\sqrt3'], R`Ответ: \(1<a\le2\sqrt3\). Почему 1 не входит — из-за строгого \(3x<a+14\): при \(a=1\) нужно \(x=5\), а \(15<15\) неверно.`)
  ],
  g: { va: [-0.5, 5], vx: [3.6, 5.4], xr: [4, 5],
    dom: (x, a, e) => a * (x - 1) >= 4 - e && x >= 2 && 2 * sqrt(x - 2) >= a - e && 3 * x < a + 14 - e,
    cls: (r, a) => feas(x => a * (x - 1) >= 4 - 1e-12 && 2 * sqrt(x - 2) >= a - 1e-12 && 3 * x < a + 14 - 1e-12, [4, 5, 1 + 4 / a, 2 + a * a / 4, (a + 14) / 3], 4, 5),
    br: [{ a: x => 4 / (x - 1), lab: 'a = 4/(x−1)' }, { a: x => 2 * sqrt(x - 2), lab: 'a = 2√(x−2)' }, { a: x => 3 * x - 14, lab: 'a = 3x − 14' }],
    brT: R`Каждое неравенство — область по одну сторону от граничной линии в плоскости \((x;a)\).`, forbT: R`Заштриховано всё, где хотя бы одно неравенство нарушено. Незаштрихованная часть — решения.`, keyT: R`Горизонталь \(a=p\) должна задеть незаштрихованную область на \([4;5]\). Особые: \(a=1\), \(a=2\sqrt3\).` } });

T({ id: '071', code: '071', src: '18.38', sec: 'ineq', lvl: 2, region: true, kind: 'система неравенств на [4; 5]',
  st: R`Найдите все значения параметра \(a\), при каждом из которых система неравенств \[\begin{cases}2a\le x,\\6x>x^2+a^2,\\x+a\le6\end{cases}\] имеет хотя бы одно решение на отрезке \([4;5]\).`,
  links: L('https://www.geogebra.org/classic/cbhxjhrv', 'https://rutube.ru/video/private/684d04fd0a4a18f14dbb625ef0f3c324/?p=Ccwh86_ebGjfaiGPrbNoJg'),
  ans: '(-2*sqrt(2);2]', needText: 'есть решение на [4; 5]',
  note: R`В ключе PDF: \((-2\sqrt2;2)\). Но при \(a=2\) число \(x=4\) удовлетворяет всем трём неравенствам в записанном виде: \(4\le4,\ 24>20,\ 6\le6\). Похоже, в оригинале одно из нестрогих неравенств строгое; по этому условию \(a=2\) входит.`,
  an: [
    Q('Второе неравенство', R`\(6x>x^2+a^2\iff\)`, ['(x-3)^2+a^2<9', '(x-3)^2+a^2>9', '(x+3)^2+a^2<9', 'x^2+a^2<6'], 'Внутренность круга с центром (3; 0), радиус 3.'),
    Q('Первое и третье', 'Полуплоскости:', ['a\\le\\frac x2,\\ a\\le6-x', 'a\\ge\\frac x2,\\ a\\le6-x', 'a\\le2x,\\ a\\ge6-x', 'a\\le\\frac x2,\\ a\\ge6-x']),
    Q('Верхняя граница', R`Наибольшее \(a\) на \([4;5]\): прямые \(a=\frac x2\) и \(a=6-x\) пересекаются при`, ['x=4,\\ a=2', 'x=5,\\ a=1', 'x=4,\\ a=3', 'x=3,\\ a=2'], R`Точка \((4;2)\) внутри круга (\(1+4<9\)), а оба нестрогих неравенства обращаются в равенства — она подходит.`),
    Q('Нижняя граница', R`Наименьшее \(a\): круг при \(x=4\): \(1+a^2<9\iff\)`, ['|a|<2\\sqrt2', '|a|\\le2\\sqrt2', '|a|<3', '|a|<\\sqrt8+1'], R`Ответ: \(-2\sqrt2<a\le2\).`)
  ],
  g: { va: [-3.5, 3.5], vx: [-0.5, 7], xr: [4, 5],
    dom: (x, a, e) => 2 * a <= x + e && 6 * x > x * x + a * a + e && x + a <= 6 + e,
    cls: (r, a) => feas(x => 2 * a <= x + 1e-12 && 6 * x > x * x + a * a + 1e-12 && x + a <= 6 + 1e-12, [4, 5, 2 * a, 6 - a], 4, 5),
    br: [{ a: x => x / 2, lab: 'a = x/2' }, { a: x => 6 - x, lab: 'a = 6 − x' }, { x: a => 3 + sq(9 - a * a), lab: '(x−3)² + a² = 9' }, { x: a => 3 - sq(9 - a * a) }],
    brT: R`Граничные линии: прямые \(a=\frac x2\), \(a=6-x\) и окружность \((x-3)^2+a^2=9\).`, forbT: R`Заштриховано всё, где нарушено хотя бы одно неравенство, и вне \([4;5]\).`, keyT: R`Особые: \(a=2\) (угол \((4;2)\): все три неравенства выполнены), \(a=-2\sqrt2\) (круг касается прямой \(x=4\)).` } });

T({ id: '072', code: '072', src: '27260', sec: 'ineq', lvl: 2, region: true, kind: 'произведение ≤ 0 и парабола',
  st: R`Найдите все значения параметра \(a\), при каждом из которых система неравенств \[\begin{cases}(a+7x+4)(a-2x+4)\le0,\\a+3x\ge x^2\end{cases}\] имеет хотя бы одно решение.`,
  links: L('https://www.geogebra.org/classic/fcdd7p5h', 'https://3.shkolkovo.online/catalog/136/27260', 'https://rutube.ru/video/private/e53e0102d767f9fdfcf1372582bc2cc3/?p=tebSdYbA4PkkVES_qFsv2A'),
  ans: '[-9/4;4]U{10}', needText: 'есть хотя бы одно решение',
  an: [
    Q('Второе неравенство', 'В плоскости (x; a):', ['a\\ge x^2-3x', 'a\\le x^2-3x', 'a\\ge3x-x^2', 'a\\le3x-x^2'], 'Выше параболы (вершина (1,5; −2,25)).'),
    Q('Первое неравенство', R`\((a+7x+4)(a-2x+4)\le0\) — точки`, ['между прямыми a = −7x − 4 и a = 2x − 4 («вертикальные» углы)', 'выше обеих прямых', 'ниже обеих прямых', 'на прямых'], R`Прямые пересекаются в \((0;-4)\).`),
    Q('Пересечения с параболой', R`Прямая \(a=2x-4\) и парабола \(a=x^2-3x\) пересекаются в`, ['(1;\\,-2)\\ \\text{и}\\ (4;\\,4)', '(0;\\,-4)', '(2;\\,0)\\ \\text{и}\\ (3;\\,2)', '(1;\\,4)'], R`\(x^2-5x+4=0\).`),
    Q('Вторая прямая', R`\(a=-7x-4\) и парабола: \(x^2+4x+4=0\) — касание в точке`, ['(-2;\\,10)', '(2;\\,-18)', '(-1;\\,3)', '(0;\\,-4)'], R`Отсюда изолированное значение \(a=10\). Итог: \([-\frac94;4]\cup\{10\}\).`)
  ],
  g: { va: [-6, 13], vx: [-4, 6],
    dom: (x, a, e) => (a + 7 * x + 4) * (a - 2 * x + 4) <= e && a + 3 * x >= x * x - e,
    cls: (r, a) => { if (9 + 4 * a < -1e-12) return false; const s = sq(9 + 4 * a), p1 = (3 - s) / 2, p2 = (3 + s) / 2, x1 = -(a + 4) / 7, x2 = (a + 4) / 2, m = Math.min(x1, x2), M = Math.max(x1, x2); return p1 <= m + 1e-13 || p2 >= M - 1e-13; },
    br: [{ a: x => x * x - 3 * x, lab: 'a = x² − 3x' }, { a: x => -7 * x - 4, lab: 'a = −7x − 4' }, { a: x => 2 * x - 4, lab: 'a = 2x − 4' }],
    brT: R`Граничные линии: парабола \(a=x^2-3x\) и прямые \(a=-7x-4\), \(a=2x-4\).`, forbT: R`Заштриховано, где нарушено хотя бы одно неравенство.`, keyT: R`Особые: \(a=-\frac94\) (вершина), \(a=4\) (через \((4;4)\)), \(a=10\) (касание в \((-2;10)\)).` } });

/* ===================== БЛОК 6: задачи 037, 080–089 ===================== */
SEC.area = ['Площадь фигуры', 10];
SEC.circ = ['Окружность в плоскости (x; a)', 11];
const S2 = Math.SQRT2, S85 = sqrt(85);
/* пересечения прямой y = m·x + c с окружностью (x − x0)² + (y − y0)² = r2 */
const lineCirc = (m, c, x0, y0, r2) => quad(1 + m * m, 2 * m * (c - y0) - 2 * x0, x0 * x0 + (c - y0) ** 2 - r2).map(x => [x, m * x + c]);

T({ id: '037', code: '037', src: '111330 Ященко 25', sec: 'area', lvl: 2, kind: 'площадь треугольника между прямой и уголком',
  st: R`Найдите все значения \(a\), при каждом из которых площадь фигуры, ограниченной линиями \(y=\frac a2x+a\) и \(y=a|x|-\left|\frac a2\right|\), будет больше \(6\), но не больше \(12\).`,
  links: L('https://www.geogebra.org/classic/n5mszpwm', 'https://3.shkolkovo.online/catalog/4150/111330', 'https://3.shkolkovo.online/catalog/4150/111329', 'https://rutube.ru/video/private/0c9f67df0ee6f46d3c974988bdd53055/?p=Yon5A1VozphEJryZrdHwQQ'),
  ans: '[-36;-18)U(2;4]', needText: 'площадь фигуры 6 < S ≤ 12', gpre: 2,
  an: [
    Q('Прямая', R`Как удобно записать первую линию?`, ['y=\\frac a2(x+2)', 'y=\\frac a2(x+1)', 'y=a(x+2)', 'y=\\frac a2x'], R`При любом \(a\) прямая проходит через точку \((-2;\,0)\).`),
    Q('Уголок', R`Вершина уголка \(y=a|x|-\left|\frac a2\right|\) находится в точке`, ['\\left(0;\\,-\\frac{|a|}2\\right)', '\\left(0;\\,\\frac{|a|}2\\right)', '\\left(\\frac a2;\\,0\\right)', '(0;\\,-a)'], R`При \(a>0\): \(y=a\left(x-\frac12\right)\) при \(x\ge0\) и \(y=-a\left(x+\frac12\right)\) при \(x<0\). При \(a<0\): \(y=a\left(x+\frac12\right)\) и \(y=-a\left(x-\frac12\right)\).`),
    Q(R`Случай \(a=0\)`, R`Что при \(a=0\)?`, ['обе линии — y = 0, фигуры нет', 'треугольник площади 0', 'площадь бесконечна', 'одна точка пересечения'], R`\(a=0\) не подходит.`),
    Q(R`Вершины при \(a>0\)`, R`Прямая пересекает ветви уголка в точках`, ['(3;\\,\\tfrac{5a}2)\\ \\text{и}\\ (-1;\\,\\tfrac a2)', '(3;\\,\\tfrac{5a}2)\\ \\text{и}\\ (1;\\,\\tfrac{3a}2)', '(2;\\,2a)\\ \\text{и}\\ (-1;\\,\\tfrac a2)', '(-3;\\,-\\tfrac a2)\\ \\text{и}\\ (1;\\,\\tfrac{3a}2)'], R`\(\frac a2(x+2)=a\left(x-\frac12\right)\Rightarrow x=3\); \(\ \frac a2(x+2)=-a\left(x+\frac12\right)\Rightarrow x=-1\).`),
    Q(R`Площадь при \(a>0\)`, R`Чему равна площадь треугольника?`, ['S=3a', 'S=\\frac{3a}2', 'S=6a', 'S=\\frac a3'], R`Режем вертикалью \(x=0\): отрезок от \(-\frac a2\) до \(a\) длины \(\frac{3a}2\). \(S=\frac12\cdot\frac{3a}2\cdot1+\frac12\cdot\frac{3a}2\cdot3=3a\). Условие \(6<3a\le12\iff 2<a\le4\).`),
    Q(R`Площадь при \(a<0\)`, R`Вершины \((0;\frac a2)\), \((1;\frac{3a}2)\), \((-\frac13;\frac{5a}6)\). Площадь равна`, ['S=-\\frac a3', 'S=-3a', 'S=\\frac a3', 'S=-\\frac a6'], R`Отрезок на \(x=0\) — от \(a\) до \(\frac a2\), длина \(-\frac a2\). \(S=\frac12\cdot\left(-\frac a2\right)\cdot\left(1+\frac13\right)=-\frac a3\). Условие \(6<-\frac a3\le12\iff -36\le a<-18\).`)
  ],
  g: { va: [-40, 6], vx: [-2.2, 4.2], vy: [-60, 14], keys: [0], kq: 2,
    fix: [], pts: [[-2, 0, 0]],
    mov: [{ F: (x, y, a) => y - a / 2 * (x + 2) }, { F: (x, y, a) => y - (a * abs(x) - abs(a / 2)) }],
    sol: a => { if (near(a, 0)) return []; return a > 0 ? [[0, -a / 2], [3, 5 * a / 2], [-1, a / 2]] : [[0, a / 2], [1, 3 * a / 2], [-1 / 3, 5 * a / 6]]; },
    shape: a => near(a, 0) ? null : a > 0 ? [[0, -a / 2], [3, 5 * a / 2], [-1, a / 2]] : [[0, a / 2], [1, 3 * a / 2], [-1 / 3, 5 * a / 6]],
    area: a => { if (near(a, 0)) return 0; const P = a > 0 ? [[0, -a / 2], [3, 5 * a / 2], [-1, a / 2]] : [[0, a / 2], [1, 3 * a / 2], [-1 / 3, 5 * a / 6]]; return abs((P[1][0] - P[0][0]) * (P[2][1] - P[0][1]) - (P[2][0] - P[0][0]) * (P[1][1] - P[0][1])) / 2; },
    cls: (r, a) => { const S = a > 0 ? 3 * a : -a / 3; return !near(a, 0) && S > 6 + 1e-9 && S <= 12 + 1e-9; },
    fixT: R`Обе линии зависят от \(a\). Прямая всегда проходит через точку \((-2;0)\), вершина уголка — \(\left(0;-\frac{|a|}2\right)\). Масштаб по оси \(y\) сжат.`,
    forbT: '', keyT: R`Площадь: \(S=3a\) при \(a>0\) и \(S=-\frac a3\) при \(a<0\). Границы: \(3a=6,\ 3a=12\Rightarrow a=2,\ 4\); \(\ -\frac a3=6,\ 12\Rightarrow a=-18,\ -36\).` } });

T({ id: '080', code: '080', src: '45210 Ященко 26', sec: 'sys', lvl: 1, kind: 'окружность и прямая, касание',
  st: R`Найдите все значения параметра \(a\), при каждом из которых система \[\begin{cases}(x-2a+2)^2+(y+a-2)^2=a+\frac52,\\x+y=1-a\end{cases}\] имеет единственное решение.`,
  links: L('https://www.geogebra.org/classic/fxvkadyt', 'https://3.shkolkovo.online/catalog/4150/45210', 'https://rutube.ru/video/private/bdcda85918275d3624ca4f8d7a99cc5c/?p=uNCPNRE-7674N8Rz2HwPQA'),
  ans: '{-1/2;2}', need: '=1',
  an: [
    Q('Первое уравнение', 'Что задаёт первое уравнение при a > −5/2?', ['окружность с центром (2a−2; 2−a) и радиусом √(a+5/2)', 'окружность с центром (2−2a; a−2)', 'окружность радиуса a+5/2', 'прямую'], R`При \(a<-\frac52\) решений нет, при \(a=-\frac52\) — точка.`),
    Q(R`Случай \(a=-\frac52\)`, R`Что при \(a=-\frac52\)?`, ['точка (−7; 4,5) не лежит на прямой x + y = 3,5 — решений нет', 'одно решение (−7; 4,5)', 'бесконечно много решений', 'два решения'], R`\(-7+4{,}5=-2{,}5\ne3{,}5\).`),
    Q('Касание', 'Единственное решение ⇔ прямая касается окружности:', ['\\frac{|2a-1|}{\\sqrt2}=\\sqrt{a+\\frac52}', '|2a-1|=\\sqrt{a+\\frac52}', '\\frac{|a-1|}{\\sqrt2}=\\sqrt{a+\\frac52}', '\\frac{|2a-1|}{2}=a+\\frac52'], R`Расстояние от центра до прямой \(x+y-1+a=0\): \(\frac{|(2a-2)+(2-a)-1+a|}{\sqrt2}=\frac{|2a-1|}{\sqrt2}\).`),
    Q('Решаем', R`\((2a-1)^2=2a+5\iff\)`, ['a=-\\frac12;\\ a=2', 'a=\\frac12;\\ a=-2', 'a=2', 'a=-\\frac12'], R`\(4a^2-6a-4=0\iff2a^2-3a-2=0\). Оба корня больше \(-\frac52\).`)
  ],
  g: { va: [-3, 3.5], vx: [-9.5, 6.5], vy: [-4.3, 8], keys: [-2.5],
    fix: [],
    mov: [{ F: (x, y, a) => (x - 2 * a + 2) ** 2 + (y + a - 2) ** 2 - (a + 2.5) }, { F: (x, y, a) => x + y - 1 + a }],
    sol: a => quad(2, 6 - 4 * a, (2 * a - 2) ** 2 + 1 - a - 2.5).map(x => [x, 1 - a - x]),
    fixT: R`Обе линии движутся: центр окружности \((2a-2;\,2-a)\) идёт по прямой, радиус \(\sqrt{a+\frac52}\) растёт; прямая \(x+y=1-a\) сдвигается.`,
    forbT: '', keyT: R`Касания при \(a=-\frac12\) и \(a=2\). При \(a\le-\frac52\) окружности нет.` } });

T({ id: '081', code: '081', src: '18.35', sec: 'sys', lvl: 1, kind: 'две окружности, два решения',
  st: R`Найдите все значения параметра \(a\), при каждом из которых система уравнений \[\begin{cases}x^2+y^2=6x+8y-9,\\x^2+y^2=a^2\end{cases}\] имеет ровно два различных решения.`,
  links: L('https://www.geogebra.org/classic/qmn4pxxp', 'https://rutube.ru/video/b484a6353b8f9cff82752af43ccad1fe/'),
  ans: '(-9;-1)U(1;9)', need: '=2',
  an: [
    Q('Первое уравнение', 'Выделите полные квадраты:', ['(x-3)^2+(y-4)^2=16', '(x-3)^2+(y-4)^2=34', '(x+3)^2+(y+4)^2=16', '(x-6)^2+(y-8)^2=9'], R`Окружность с центром \(O_1(3;4)\), \(R_1=4\).`),
    Q('Второе уравнение', R`\(x^2+y^2=a^2\) — это`, ['окружность с центром (0; 0) и радиусом |a|', 'окружность радиуса a', 'окружность радиуса a²', 'прямая'], R`При \(a=0\) — точка \((0;0)\), она не лежит на первой окружности.`),
    Q('Условие пересечения', 'Две окружности имеют ровно две общие точки ⇔', ['|R_1-R_2|<O_1O_2<R_1+R_2', 'O_1O_2<R_1+R_2', 'O_1O_2=R_1+R_2', 'O_1O_2>|R_1-R_2|'], R`\(O_1O_2=\sqrt{3^2+4^2}=5\).`),
    Q('Решаем', R`\(|4-|a||<5<4+|a|\iff\)`, ['1<|a|<9', '|a|>1', '|a|<9', '1\\le|a|\\le9'], R`\(5<4+|a|\Rightarrow|a|>1\); \(\ |4-|a||<5\Rightarrow|a|<9\). Касания — при \(|a|=1\) и \(|a|=9\).`)
  ],
  g: { va: [-11, 11], vx: [-13, 17], vy: [-10, 13], keys: [0],
    fix: [{ F: (x, y) => (x - 3) ** 2 + (y - 4) ** 2 - 16, lab: '(x−3)² + (y−4)² = 16', lx: 6.5, ly: 8.2 }],
    mov: [{ F: (x, y, a) => x * x + y * y - a * a }],
    sol: a => { const c = a * a + 9; return quad(100, -12 * c, c * c - 64 * a * a).map(x => [x, (c - 6 * x) / 8]); },
    fixT: R`Неподвижная окружность: центр \((3;4)\), радиус \(4\).`, forbT: '', keyT: R`Окружность \(x^2+y^2=a^2\) раздувается из начала координат. Касания: внешнее при \(|a|=1\), внутреннее при \(|a|=9\).` } });

T({ id: '082', code: '082', src: 'Ященко(50) 26, вар. 21', sec: 'circ', lvl: 1, kind: 'прямая и окружность, корень в знаменателе',
  st: R`Найдите все значения \(a\), при каждом из которых уравнение \[\frac{2x^3-(a+20)x^2+2a(5+a)x-a^3}{\sqrt{10-x+a}}=0\] имеет ровно одно решение.`,
  links: L('https://rutube.ru/video/private/065ac76980bb38bf14e773053246cfb1/?p=xxKi9KTEHeHETfbF4MtLbw'),
  ans: '(-20;-5]U{0}U(5;inf)', need: '=1',
  an: [
    Q('ОДЗ', 'Какое ограничение даёт знаменатель?', ['10-x+a>0', '10-x+a\\ge0', 'x\\ne a+10', '\\text{ограничений нет}'], R`\(a>x-10\) — выше прямой \(a=x-10\), сама прямая выколота.`),
    Q('Группировка', 'Разложите числитель на множители:', ['(2x-a)(x^2+a^2-10x)', '(2x+a)(x^2+a^2-10x)', '(x-2a)(x^2+a^2-10x)', '(2x-a)(x^2-a^2+10x)'], R`\(2x^3-ax^2-20x^2+10ax+2a^2x-a^3=2x(x^2+a^2)-a(x^2+a^2)-10x(2x-a)\).`),
    Q('Окружность', R`\(x^2+a^2-10x=0\iff\)`, ['(x-5)^2+a^2=25', '(x-5)^2+a^2=5', '(x+5)^2+a^2=25', '(x-10)^2+a^2=25'], R`В плоскости \((x;a)\): прямая \(a=2x\) и окружность с центром \((5;0)\), \(R=5\).`),
    Q('Граница ОДЗ', R`Прямая \(a=x-10\) пересекает окружность в точках`, ['(5;\\,-5)\\ \\text{и}\\ (10;\\,0)', '(0;\\,0)\\ \\text{и}\\ (10;\\,0)', '(5;\\,5)\\ \\text{и}\\ (10;\\,0)', '(5;\\,-5)\\ \\text{и}\\ (0;\\,0)'], R`Обе точки выколоты. Дуга окружности ниже этой прямой — вне ОДЗ. Прямая \(a=2x\) входит в ОДЗ при \(a>-20\).`),
    Q('Совпадения', R`Прямая \(a=2x\) пересекает окружность при`, ['a=0\\ \\text{и}\\ a=4', 'a=0', 'a=4', 'a=0\\ \\text{и}\\ a=5'], R`\(\left(\frac a2-5\right)^2+a^2=25\iff a\left(\frac{5a}4-5\right)=0\). Подсчёт: \(-20<a<-5\) — 1; \(a=-5\) — 1 (точка окружности выколота); \(-5<a<0\) — 2; \(a=0\) — 1; \(0<a<5\) — 3 (при \(a=4\) — 2); \(a=5\) — 2; \(a>5\) — 1.`)
  ],
  g: { va: [-24, 9], vx: [-13, 12.5], dom: (x, a, e) => 10 - x + a > e,
    br: [{ x: a => a / 2, lab: 'a = 2x' }, { x: a => 5 + sq(25 - a * a), lab: '(x−5)² + a² = 25' }, { x: a => 5 - sq(25 - a * a) }],
    bnd: [{ a: x => x - 10, lab: 'a = x − 10' }],
    pts: [[-10, -20, 1], [5, -5, 1], [10, 0, 1], [2, 4, 0], [0, 0, 0]],
    brT: R`Корни числителя: прямая \(a=2x\) и окружность \((x-5)^2+a^2=25\).`,
    forbT: R`Запрещено \(a\le x-10\) — ниже прямой \(a=x-10\) (граница выколота).`,
    keyT: R`Особые: \(a=-20\) (прямая входит в ОДЗ), \(a=-5\) и \(a=5\) (низ и верх окружности), \(a=0\) и \(a=4\) (прямая пересекает окружность).` } });

T({ id: '083', code: '083', src: 'Ященко(50) 26, вар. 1', sec: 'circ', lvl: 1, kind: 'окружность и выколотая парабола',
  st: R`Найдите все значения \(a\), при каждом из которых уравнение \[\frac{x^2-12x+a^2-14a}{x^2-24x+144-a}=0\] имеет ровно два различных корня.`,
  links: L('https://rutube.ru/video/private/2256d57979202072cdb41d2f9736337d/?p=7dtCc8PFALHwk0aParNw2Q'),
  ans: '(7-sqrt(85);0)U(0;1)U(1;9)U(9;16)U(16;7+sqrt(85))', ansTex: R`a\in\left(7-\sqrt{85};\,7+\sqrt{85}\right)\setminus\{0;\,1;\,9;\,16\}`, need: '=2',
  an: [
    Q('Знаменатель', R`Знаменатель не равен нулю:`, ['a\\ne(x-12)^2', 'a\\ne x^2-12', 'x\\ne12', 'a\\ne(x-6)^2'], R`\(x^2-24x+144=(x-12)^2\). В плоскости \((x;a)\) выколота парабола \(a=(x-12)^2\).`),
    Q('Числитель', 'Выделите полные квадраты в числителе:', ['(x-6)^2+(a-7)^2=85', '(x-6)^2+(a-7)^2=36', '(x-12)^2+(a-14)^2=85', '(x+6)^2+(a+7)^2=85'], R`\(36+49=85\): окружность с центром \((6;7)\), \(R=\sqrt{85}\).`),
    Q('Две точки окружности', 'Горизонталь a = const пересекает окружность в двух точках при', ['7-\\sqrt{85}<a<7+\\sqrt{85}', '-\\sqrt{85}<a<\\sqrt{85}', '7-\\sqrt{85}\\le a\\le7+\\sqrt{85}', '0<a<16']),
    Q('Выколотые точки', R`Где парабола \(a=(x-12)^2\) пересекает окружность?`, ['(12;0),\\ (13;1),\\ (15;9),\\ (8;16)', '(12;0),\\ (15;9)', '(6;36),\\ (13;1)', '(12;0),\\ (8;16)'], R`Точки удобно найти по рисунку и проверить подстановкой: например, \((15-6)^2+(9-7)^2=81+4=85\). Значит, \(a\ne0;1;9;16\) — в этих случаях один из двух корней выколот.`)
  ],
  g: { va: [-4, 18], vx: [-5, 18.5], dom: (x, a) => abs((x - 12) ** 2 - a) > 1e-9,
    br: [{ x: a => 6 + sq(85 - (a - 7) ** 2), lab: '(x−6)² + (a−7)² = 85' }, { x: a => 6 - sq(85 - (a - 7) ** 2) }],
    exl: [{ x: a => 12 + Math.sqrt(a), lab: 'a = (x−12)²' }, { x: a => 12 - Math.sqrt(a) }],
    pts: [[12, 0, 1], [13, 1, 1], [15, 9, 1], [8, 16, 1]],
    brT: R`Корни числителя — окружность \((x-6)^2+(a-7)^2=85\).`,
    forbT: R`Выколота парабола \(a=(x-12)^2\) (нуль знаменателя).`,
    keyT: R`Особые: \(a=7\pm\sqrt{85}\) (касание горизонтали), \(a=0;1;9;16\) — выколотые точки на окружности.` } });

T({ id: '084', code: '084', src: '18.25', sec: 'sysf', lvl: 1, kind: 'логарифмы, y = ±x и окружность',
  st: R`Найдите все значения параметра \(a\), при каждом из которых система уравнений \[\begin{cases}\log_{11}(a-y^2)=\log_{11}(a-x^2),\\x^2+y^2=2x+6y\end{cases}\] имеет ровно два различных решения.`,
  links: L('https://www.geogebra.org/classic/fprn5t49', 'https://rutube.ru/video/c2cf43dc5294e9e073805ed6364803ac/'),
  ans: '(4;16]', need: '=2', needText: 'ровно два решения',
  an: [
    Q('Переход', R`Первое уравнение равносильно системе`, ['\\begin{cases}x^2=y^2\\\\a>x^2\\end{cases}', 'x^2=y^2', '\\begin{cases}x^2=y^2\\\\a\\ge x^2\\end{cases}', '\\begin{cases}x=y\\\\a>x^2\\end{cases}'], R`Аргументы равны, достаточно потребовать положительность одного: \(a-y^2=a-x^2>0\).`),
    Q('Окружность', 'Второе уравнение:', ['(x-1)^2+(y-3)^2=10', '(x-1)^2+(y-3)^2=4', '(x+1)^2+(y+3)^2=10', '(x-2)^2+(y-6)^2=10']),
    Q('Точки пересечения', R`Прямые \(y=\pm x\) пересекают окружность в точках`, ['(0;0),\\ (4;4),\\ (-2;2)', '(0;0),\\ (4;4)', '(4;4),\\ (-2;2)', '(0;0),\\ (2;2),\\ (-4;4)'], R`\(y=x:\ 2x^2-8x=0\); \(\ y=-x:\ 2x^2+4x=0\). Без ограничения — три решения.`),
    Q('Условия на a', R`Условие \(a>x^2\) для этих точек:`, ['(0;0):\\ a>0;\\ (-2;2):\\ a>4;\\ (4;4):\\ a>16', '(0;0):\\ a\\ge0;\\ (-2;2):\\ a\\ge4;\\ (4;4):\\ a\\ge16', '(0;0):\\ a>0;\\ (-2;2):\\ a>2;\\ (4;4):\\ a>4', '\\text{все при } a>0'], R`Ровно два решения: \(4<a\le16\). В плоскости \((x;a)\) это три вертикали \(x=-2,\ 0,\ 4\) над параболой \(a=x^2\).`)
  ],
  g: { va: [-2, 20], vx: [-4, 6], dom: (x, a, e) => a > x * x + e,
    br: [{ xLine: 0, lab: 'x = 0' }, { xLine: -2, lab: 'x = −2' }, { xLine: 4, lab: 'x = 4' }],
    bnd: [{ a: x => x * x, lab: 'a = x²' }],
    pts: [[0, 0, 1], [-2, 4, 1], [4, 16, 1]],
    brT: R`Решения без ограничения: \(x=0,\ -2,\ 4\) (каждому \(x\) соответствует одна точка \((x;y)\)) — три вертикали в плоскости \((x;a)\).`,
    forbT: R`Условие \(a>x^2\): запрещено всё на параболе \(a=x^2\) и под ней.`,
    keyT: R`Вертикали входят в разрешённую область при \(a=0,\ 4,\ 16\).` } });

T({ id: '085', code: '085', src: '186073 (2026)', sec: 'fact', lvl: 1, kind: 'гипербола, прямая и окружность',
  st: R`Найдите все значения параметра \(a\), при каждом из которых уравнение \[ax^4+x^3+(a^3-2a)x^2+(a^2-2)x=ax^3+x^2+(a^3-2a)x+a^2-2\] имеет ровно 2 решения.`,
  links: L('https://www.geogebra.org/classic/qcwtcbdx', 'https://3.shkolkovo.online/catalog/136/186073', 'https://3.shkolkovo.online/catalog/136/186076', 'https://3.shkolkovo.online/catalog/136/186101', 'https://3.shkolkovo.online/catalog/136/186102', 'https://rutube.ru/video/private/f74f32576ead2a4d2c875270fcac589d/?p=jgaFN1Ap_IQ2mmg69DF3Ow'),
  ans: '(-inf;-sqrt(2))U{-1;1}U(sqrt(2);inf)', need: '=2', ansTex: R`a\in\left(-\infty;\,-\sqrt2\right)\cup\{-1;\,1\}\cup\left(\sqrt2;\,+\infty\right)`,
  an: [
    Q('Разложение', 'Перенесите всё влево и сгруппируйте:', ['(ax+1)(x-1)(x^2+a^2-2)=0', '(ax-1)(x-1)(x^2+a^2-2)=0', '(ax+1)(x+1)(x^2+a^2-2)=0', '(ax+1)(x-1)(x^2-a^2+2)=0'], R`\(x^3(ax+1)-x^2(ax+1)+(a^2-2)(x-1)(ax+1)=(ax+1)\left(x^3-x^2+(a^2-2)(x-1)\right)\).`),
    Q('Корни', 'Что получаем в плоскости (x; a)?', ['гиперболу a = −1/x, прямую x = 1, окружность x² + a² = 2', 'параболу, прямую и окружность', 'две прямые и окружность', 'гиперболу и окружность'], R`\(ax=-1\iff a=-\frac1x\) (при \(a=0\) корня нет).`),
    Q('Общие точки', R`Через какие точки проходят сразу две линии?`, ['(1;-1)\\ \\text{— все три},\\ (-1;1)\\ \\text{— гипербола и окружность}', '(1;1)\\ \\text{— все три}', '(1;-1)\\ \\text{и}\\ (1;1)\\ \\text{— только прямая и окружность}', '\\text{общих точек нет}'], R`Окружность пересекает прямую \(x=1\) при \(a=\pm1\); гипербола касается окружности: \(\frac1{a^2}+a^2=2\iff a=\pm1\).`),
    Q('Подсчёт', R`Сколько корней при \(|a|>\sqrt2\)?`, ['2', '1', '3', '4'], R`Окружности на этой высоте нет: остаются \(x=1\) и \(x=-\frac1a\). При \(|a|=\sqrt2\) добавляется \(x=0\) — три корня; при \(|a|<\sqrt2\), кроме \(a=\pm1\), — четыре (при \(a=0\) — три).`)
  ],
  g: { va: [-3, 3], vx: [-3.5, 3.5],
    br: [{ x: a => near(a, 0) ? NaN : -1 / a, lab: 'a = −1/x' }, { xLine: 1, lab: 'x = 1' }, { x: a => sq(2 - a * a), lab: 'x² + a² = 2' }, { x: a => -sq(2 - a * a) }],
    pts: [[1, -1, 0], [-1, 1, 0], [1, 1, 0]],
    brT: R`Корни: гипербола \(a=-\frac1x\), прямая \(x=1\), окружность \(x^2+a^2=2\).`, forbT: '',
    keyT: R`Особые: \(a=\pm\sqrt2\) (верх и низ окружности), \(a=\pm1\) (линии сходятся в точках), \(a=0\) (у гиперболы нет точки).` } });

T({ id: '086', code: '086', src: 'Ященко(50) 26, вар. 26', sec: 'circ', lvl: 2, kind: 'окружность, прямая и запрещённый круг',
  st: R`Найдите все значения \(a\), при каждом из которых уравнение \[\frac{4x^3-3ax^2+4(a^2-25)x-3a^3+75a}{\sqrt{x^2+a^2-9}}=0\] имеет ровно два различных корня.`,
  links: L('https://rutube.ru/video/private/a8518e3fffc1235d7b9aebf90daa118e/?p=vpUC6ZPrPcf8NnrB0Xdm7A'),
  ans: '{-5;-4}U[-12/5;12/5]U{4;5}', need: '=2',
  an: [
    Q('ОДЗ', 'Ограничение знаменателя:', ['x^2+a^2>9', 'x^2+a^2\\ge9', 'x^2+a^2\\ne9', 'x^2+a^2<9'], R`Запрещён круг радиуса 3 вместе с границей.`),
    Q('Группировка', 'Разложите числитель:', ['(4x-3a)(x^2+a^2-25)=0', '(4x+3a)(x^2+a^2-25)=0', '(3x-4a)(x^2+a^2-25)=0', '(4x-3a)(x^2-a^2-25)=0'], R`\(4x(x^2+a^2)-3a(x^2+a^2)-25(4x-3a)\). Прямая \(a=\frac43x\) и окружность радиуса 5 — она целиком в ОДЗ.`),
    Q('Прямая в ОДЗ', R`Прямая \(x=\frac{3a}4\) лежит вне запрещённого круга при`, ['|a|>\\frac{12}5', '|a|\\ge\\frac{12}5', '|a|>3', '|a|>\\frac95'], R`\(\frac{9a^2}{16}+a^2>9\iff\frac{25a^2}{16}>9\).`),
    Q('Пересечение', 'Прямая пересекает окружность радиуса 5 при', ['a=\\pm4', 'a=\\pm3', 'a=\\pm5', 'a=\\pm\\frac{12}5'], R`\(\frac{25a^2}{16}=25\). Подсчёт: \(|a|\le\frac{12}5\) — 2 (только окружность); \(\frac{12}5<|a|<5\) — 3, кроме \(|a|=4\) — 2; \(|a|=5\) — 2; \(|a|>5\) — 1.`)
  ],
  g: { va: [-7, 7], vx: [-7.5, 7.5], dom: (x, a, e) => x * x + a * a > 9 + e,
    br: [{ x: a => 3 * a / 4, lab: 'a = 4x/3' }, { x: a => sq(25 - a * a), lab: 'x² + a² = 25' }, { x: a => -sq(25 - a * a) }],
    bnd: [{ F: (x, a) => x * x + a * a - 9 }],
    pts: [[1.8, 2.4, 1], [-1.8, -2.4, 1], [3, 4, 0], [-3, -4, 0]],
    brT: R`Корни числителя: прямая \(a=\frac43x\) и окружность \(x^2+a^2=25\).`,
    forbT: R`Запрещён круг \(x^2+a^2\le9\) (заштрихован).`,
    keyT: R`Особые: \(a=\pm\frac{12}5\) (прямая выходит из круга), \(a=\pm4\) (прямая пересекает окружность), \(a=\pm5\) (верх и низ окружности).` } });

T({ id: '087', code: '087', src: '18.37', sec: 'sys', lvl: 2, kind: 'окружность и крест y = ±x',
  st: R`Найдите все значения параметра \(a\), при каждом из которых система уравнений \[\begin{cases}x^2+y^2-4(a+1)x-2ay+5a^2+8a+3=0,\\x^2=y^2\end{cases}\] имеет ровно четыре различных решения.`,
  links: L('https://www.geogebra.org/classic/rxyjx9pk', 'https://www.desmos.com/calculator/ygq3zvwopx?lang=ru', 'https://rutube.ru/video/ca7a7ae2f51857f778110dd68b4c649f/'),
  ans: '((-2-sqrt(2))/3;-1)U(-1;-3/5)U(-3/5;-2+sqrt(2))', need: '=4',
  an: [
    Q('Первое уравнение', 'Выделите полные квадраты:', ['(x-2a-2)^2+(y-a)^2=1', '(x-2a-2)^2+(y-a)^2=a^2+2a+1', '(x-2a)^2+(y-a)^2=1', '(x+2a+2)^2+(y+a)^2=1'], R`Окружность с центром \((2a+2;\,a)\), \(R=1\).`),
    Q('Второе уравнение', R`\(x^2=y^2\iff\)`, ['y=x\\ \\text{или}\\ y=-x', 'y=x', 'y=|x|', 'x=0']),
    Q('Условия', 'Четыре решения ⇔', ['окружность пересекает обе прямые и не проходит через (0; 0)', 'окружность пересекает обе прямые', 'окружность касается обеих прямых', 'центр окружности лежит на прямой y = x']),
    Q('Расстояния', 'Расстояния от центра до прямых меньше радиуса:', ['\\frac{|a+2|}{\\sqrt2}<1\\ \\text{и}\\ \\frac{|3a+2|}{\\sqrt2}<1', '|a+2|<1\\ \\text{и}\\ |3a+2|<1', '\\frac{|a-2|}{\\sqrt2}<1\\ \\text{и}\\ \\frac{|3a-2|}{\\sqrt2}<1', '\\frac{|a+2|}{2}<1'], R`Пересечение: \(\frac{-2-\sqrt2}3<a<-2+\sqrt2\).`),
    Q('Через начало координат', 'Окружность проходит через (0; 0) при', ['a=-1;\\ a=-\\frac35', 'a=-1', 'a=-\\frac35', 'a=1;\\ a=\\frac35'], R`\((2a+2)^2+a^2=1\iff5a^2+8a+3=0\). Эти значения исключаем.`)
  ],
  g: { va: [-2.2, 0.8], vx: [-3, 4], vy: [-3, 2.2],
    fix: [{ F: (x, y) => y - x, lab: 'y = x', lx: 1.5, ly: 1.75 }, { F: (x, y) => y + x, lab: 'y = −x', lx: -2.2, ly: 1.75 }],
    mov: [{ F: (x, y, a) => (x - 2 * a - 2) ** 2 + (y - a) ** 2 - 1 }],
    sol: a => { const c = (2 * a + 2) ** 2 + a * a - 1, out = []; quad(2, -2 * (3 * a + 2), c).forEach(x => out.push([x, x])); quad(2, -2 * (a + 2), c).forEach(x => out.push([x, -x])); return out; },
    pts: [[0, 0, 0]],
    fixT: R`Неподвижная часть — «крест» из прямых \(y=x\) и \(y=-x\).`, forbT: '',
    keyT: R`Центр \((2a+2;\,a)\) едет по прямой \(x=2y+2\). Касания: \(a=\frac{-2-\sqrt2}3\) (с \(y=-x\)), \(a=-2+\sqrt2\) (с \(y=x\)); через начало координат — при \(a=-1\) и \(a=-\frac35\).` } });

T({ id: '088', code: '088', src: '91750', sec: 'sys', lvl: 2, kind: 'ромб и окружность',
  st: R`Найдите все значения параметра \(a\), при каждом из которых система уравнений \[\begin{cases}|3x|+|4y|=12a,\\x^2+y^2-10y=0\end{cases}\] имеет ровно два различных решения.`,
  links: L('https://www.geogebra.org/classic/gzzp97hq', 'https://3.shkolkovo.online/catalog/136/91750', 'https://rutube.ru/video/private/299612e5e7ddfcea1e2743ed7e41ea44/?p=gdg8PoSjhhAdIcDRuXh_Bg'),
  ans: '(0;10/3)U{15/4}', need: '=2',
  an: [
    Q('Знак a', 'Первое уравнение имеет решения при', ['a\\ge0', 'a>0', 'a\\le0', '\\text{любом } a'], R`Левая часть неотрицательна. При \(a=0\) — точка \((0;0)\): она на окружности, решение одно.`),
    Q('Первое уравнение', R`При \(a>0\) \(|3x|+|4y|=12a\) — это`, ['ромб с вершинами (±4a; 0), (0; ±3a)', 'ромб с вершинами (±3a; 0), (0; ±4a)', 'квадрат', 'окружность']),
    Q('Второе уравнение', 'Выделите полный квадрат:', ['x^2+(y-5)^2=25', 'x^2+(y-5)^2=10', 'x^2+(y+5)^2=25', '(x-5)^2+y^2=25'], R`Окружность с центром \((0;5)\), \(R=5\). Проходит через начало координат — ромб с малым \(a\) содержит эту точку внутри.`),
    Q('Вершина на окружности', R`Верхняя вершина \((0;3a)\) попадает на окружность при`, ['a=\\frac{10}3', 'a=\\frac53', 'a=\\frac52', 'a=\\frac{15}4'], R`\(3a=10\). При \(0<a<\frac{10}3\) — два решения, при \(a=\frac{10}3\) — три.`),
    Q('Касание', R`Верхние стороны \(3|x|+4y=12a\) касаются окружности при`, ['a=\\frac{15}4', 'a=\\frac{10}3', 'a=\\frac{25}{12}', 'a=5'], R`\(\frac{|4\cdot5-12a|}{5}=5\Rightarrow a=\frac{15}4\) (и посторонний \(a=-\frac5{12}\)). При \(\frac{10}3<a<\frac{15}4\) — четыре решения, при \(a=\frac{15}4\) — два, дальше — нет.`)
  ],
  g: { va: [-0.8, 4.6], vx: [-13, 13], vy: [-6, 14], keys: [0],
    fix: [{ F: (x, y) => x * x + (y - 5) ** 2 - 25, lab: 'x² + (y−5)² = 25', lx: 4.4, ly: 9.3 }],
    mov: [{ F: (x, y, a) => abs(3 * x) + abs(4 * y) - 12 * a }],
    sol: a => { if (a < -1e-12) return []; if (near(a, 0)) return [[0, 0]]; const out = []; for (const s of [1, -1]) for (const t of [1, -1]) { const p = 3 * a / t, q = -3 * s / (4 * t); quad(1 + q * q, 2 * p * q - 10 * q, p * p - 10 * p).forEach(x => { const y = p + q * x; if (s * x >= -1e-9 && t * y >= -1e-9) out.push([x, y]); }); } return out; },
    fixT: R`Неподвижная окружность: центр \((0;5)\), радиус \(5\).`, forbT: '',
    keyT: R`Ромб раздувается из начала координат. Особые: \(a=0\) (точка), \(a=\frac{10}3\) (вершина на окружности), \(a=\frac{15}4\) (касание сторонами).` } });

T({ id: '089', code: '089', src: '73006 Ященко 26', sec: 'root', lvl: 2, kind: 'полуокружность и уголок',
  st: R`Найдите все значения параметра \(a\), при каждом из которых уравнение \[\sqrt{8-2x-x^2}+2+a=a|x|\] имеет ровно один корень.`,
  links: L('https://www.geogebra.org/classic/gvxgkdem', 'https://3.shkolkovo.online/catalog/4150/73006', 'https://rutube.ru/video/private/6446c4ee2f59c9cecd5b83c4ff54b12e/?p=S9SmGWKyPR9jttmWjUrG5A'),
  ans: '{-2-2*sqrt(2)}U[2/3;2)', ansTex: R`a\in\left\{-2-2\sqrt2\right\}\cup\left[\frac23;\,2\right)`, need: '=1', needText: 'ровно один корень', gpre: 2,
  an: [
    Q('Левая часть', R`\(y=\sqrt{8-2x-x^2}\iff\)`, ['\\begin{cases}y\\ge0\\\\(x+1)^2+y^2=9\\end{cases}', '(x+1)^2+y^2=9', '\\begin{cases}y\\ge0\\\\(x-1)^2+y^2=9\\end{cases}', '\\begin{cases}y\\ge0\\\\(x+1)^2+y^2=8\\end{cases}'], R`Верхняя полуокружность: центр \((-1;0)\), \(R=3\), концы \(A(-4;0)\) и \(B(2;0)\).`),
    Q('Правая часть', R`\(y=a|x|-a-2=\)`, ['a(|x|-1)-2', 'a(|x|+1)-2', 'a|x|-2', 'a(|x|-1)+2'], R`Уголок с вершиной \((0;\,-a-2)\); при любом \(a\) проходит через точки \((\pm1;\,-2)\).`),
    Q('Через A(−4; 0)', 'Левая ветвь проходит через A при', ['a=\\frac23', 'a=2', 'a=-\\frac23', 'a=\\frac32'], R`\(a(4-1)-2=0\).`),
    Q('Через B(2; 0)', 'Правая ветвь проходит через B при', ['a=2', 'a=\\frac23', 'a=-2', 'a=1'], R`\(a(2-1)-2=0\). При \(\frac23\le a<2\) пересечение одно (левая ветвь), при \(a=2\) — два.`),
    Q('Вершина на окружности', 'Вершина уголка (0; −a−2) лежит на полуокружности при', ['a=-2-2\\sqrt2', 'a=-2+2\\sqrt2', 'a=2\\sqrt2-2', 'a=-2\\sqrt2'], R`\(1+(a+2)^2=9,\ -a-2\ge0\Rightarrow a=-2-2\sqrt2\). Ветви уходят внутрь полукруга — корень один.`)
  ],
  g: { va: [-6, 3], vx: [-7, 6], vy: [-5.5, 4.5],
    fix: [{ F: (x, y) => (x + 1) ** 2 + y * y - 9, ok: (x, y, e) => y >= -e, lab: 'y = √(8 − 2x − x²)', lx: -3.2, ly: 3.4 }],
    mov: [{ F: (x, y, a) => y - (a * abs(x) - a - 2) }],
    sol: a => { const out = [], add = (m, c, right) => lineCirc(m, c, -1, 0, 9).forEach(([x, y]) => { if (y >= -1e-9 && (right ? x >= -1e-12 : x < -1e-12)) out.push([x, y]); }); add(a, -a - 2, true); add(-a, -a - 2, false); return out; },
    pts: [[-4, 0, 0], [2, 0, 0], [1, -2, 0], [-1, -2, 0]],
    fixT: R`Неподвижная часть — верхняя полуокружность с центром \((-1;0)\), радиус 3.`, forbT: R`Нижняя половина окружности не годится (\(y\ge0\)) — пунктир.`,
    keyT: R`Уголок вращается вокруг точек \((\pm1;-2)\). Особые: \(a=\frac23\) (через \(A\)), \(a=2\) (через \(B\)), \(a=-2-2\sqrt2\) (вершина на дуге).` } });

/* ===================== БЛОК 7: задачи 090–106 ===================== */
/* две окружности одинакового радиуса r с центрами c1, c2 */
const twoCirc = (c1, c2, r) => { const dx = c2[0] - c1[0], dy = c2[1] - c1[1], d = Math.hypot(dx, dy); if (d < 1e-12) return []; const h = d / 2; if (h > r + 1e-12) return []; const k = sq(r * r - h * h), mx = (c1[0] + c2[0]) / 2, my = (c1[1] + c2[1]) / 2, ux = -dy / d, uy = dx / d; return k === 0 ? [[mx, my]] : [[mx + k * ux, my + k * uy], [mx - k * ux, my - k * uy]]; };

T({ id: '090', code: '090', src: '26290', sec: 'sys', lvl: 2, kind: 'две равные окружности',
  st: R`Найдите все значения параметра \(a\), при каждом из которых система \[\begin{cases}x^2+y^2=2x+2y,\\x^2+y^2=2(1+a)x+2(1-a)y-2a^2\end{cases}\] имеет ровно два различных решения.`,
  links: L('https://www.geogebra.org/classic/n7vcm3gk', 'https://3.shkolkovo.online/catalog/136/26290', 'https://rutube.ru/video/private/27a0ed104bca686a6ffcd7b5ad2210f4/?p=QijEG9FvF2MbqBJ7ceilyw'),
  ans: '(-2;0)U(0;2)', need: '=2',
  an: [
    Q('Первое уравнение', 'Выделите полные квадраты:', ['(x-1)^2+(y-1)^2=2', '(x-1)^2+(y-1)^2=4', '(x+1)^2+(y+1)^2=2', '(x-2)^2+(y-2)^2=2'], R`Окружность с центром \(O_1(1;1)\), \(R=\sqrt2\).`),
    Q('Второе уравнение', 'Выделите полные квадраты:', ['(x-1-a)^2+(y-1+a)^2=2', '(x-1-a)^2+(y-1+a)^2=2a^2', '(x+1+a)^2+(y+1-a)^2=2', '(x-a)^2+(y+a)^2=2'], R`Центр \(O_2(1+a;\,1-a)\) движется по прямой \(y=2-x\), радиус тот же \(\sqrt2\).`),
    Q(R`Случай \(a=0\)`, R`Что при \(a=0\)?`, ['окружности совпадают — бесконечно много решений', 'одно решение', 'два решения', 'решений нет']),
    Q('Условие пересечения', 'Две равные окружности имеют две общие точки ⇔', ['0<O_1O_2<2\\sqrt2', 'O_1O_2<\\sqrt2', 'O_1O_2=2\\sqrt2', 'O_1O_2>2\\sqrt2'], R`\(O_1O_2=\sqrt{a^2+a^2}=|a|\sqrt2\).`),
    Q('Решаем', R`\(0<|a|\sqrt2<2\sqrt2\iff\)`, ['0<|a|<2', '|a|<2', '0<|a|<\\sqrt2', '|a|>2'], R`При \(|a|=2\) окружности касаются (одно решение).`)
  ],
  g: { va: [-3, 3], vx: [-3.5, 5.5], vy: [-2.5, 4.5], keys: [0],
    fix: [{ F: (x, y) => (x - 1) ** 2 + (y - 1) ** 2 - 2, lab: '(x−1)² + (y−1)² = 2', lx: 2.2, ly: 2.7 }],
    mov: [{ F: (x, y, a) => (x - 1 - a) ** 2 + (y - 1 + a) ** 2 - 2 }],
    sol: a => near(a, 0) ? 'inf' : twoCirc([1, 1], [1 + a, 1 - a], S2),
    fixT: R`Неподвижная окружность: центр \((1;1)\), радиус \(\sqrt2\).`, forbT: '',
    keyT: R`Окружность того же радиуса едет по прямой \(y=2-x\). Касания при \(a=\pm2\), совпадение при \(a=0\).` } });

T({ id: '091', code: '091', src: 'Ященко(36) 26, вар. 23', sec: 'sys', lvl: 2, kind: 'окружность и прямая, расстояние',
  st: R`Найдите все значения \(a\), при каждом из которых система уравнений \[\begin{cases}x^2+y^2=|1{,}6a|,\\y=ax-a^2\end{cases}\] имеет ровно два различных решения.`,
  links: L('https://rutube.ru/video/private/90f779b698b127bc9e7ab0b2b190e88f/?p=siEwP74gvzDtHRyk-WDaKg'),
  ans: '(-2;0)U(0;2)', need: '=2',
  an: [
    Q('Окружность', R`\(x^2+y^2=|1{,}6a|\) — это`, ['окружность с центром (0; 0) и радиусом √(1,6|a|)', 'окружность радиуса 1,6|a|', 'круг', 'прямая'], R`При \(a=0\) — точка \((0;0)\).`),
    Q(R`Случай \(a=0\)`, R`Сколько решений при \(a=0\)?`, ['одно: (0; 0)', 'ни одного', 'два', 'бесконечно много'], R`Прямая \(y=0\) проходит через точку \((0;0)\).`),
    Q('Расстояние', 'Две точки ⇔ расстояние от (0; 0) до прямой ax − y − a² = 0 меньше радиуса:', ['\\frac{a^2}{\\sqrt{1+a^2}}<\\sqrt{1{,}6|a|}', '\\frac{a^2}{1+a^2}<1{,}6|a|', 'a^2<\\sqrt{1{,}6|a|}', '\\frac{|a|}{\\sqrt{1+a^2}}<\\sqrt{1{,}6|a|}'], R`Возводим в квадрат: \(a^4<1{,}6|a|(1+a^2)\).`),
    Q('Решаем', R`При \(a>0\): \(a^3-1{,}6a^2-1{,}6<0\iff\)`, ['0<a<2', 'a>2', '0<a<1{,}6', 'a<2'], R`\(5a^3-8a^2-8=(a-2)(5a^2+2a+4)\), второй множитель положителен. При \(a<0\) симметрично: \(-2<a<0\).`)
  ],
  g: { va: [-3, 3], vx: [-3.9, 3.9], vy: [-3, 3], keys: [0],
    fix: [], mov: [{ F: (x, y, a) => x * x + y * y - abs(1.6 * a) }, { F: (x, y, a) => y - a * x + a * a }],
    sol: a => lineCirc(a, -a * a, 0, 0, abs(1.6 * a)),
    fixT: R`Обе линии зависят от \(a\): окружность с центром в начале координат и прямая \(y=a(x-a)\).`, forbT: '',
    keyT: R`Касание при \(|a|=2\); при \(a=0\) окружность вырождается в точку.` } });

T({ id: '092', code: '092', src: '21263', sec: 'root', lvl: 2, kind: 'две полуокружности', needText: 'ровно один корень',
  st: R`Найдите все значения \(a\), при каждом из которых уравнение \[a+\sqrt{6x-x^2-8}=3+\sqrt{1+2ax-a^2-x^2}\] имеет ровно один корень.`,
  links: L('https://www.geogebra.org/classic/wwyrqfhv', 'https://3.shkolkovo.online/catalog/204/21263', 'https://rutube.ru/video/private/aa280ae96b8f3092c13f5b3b57dc8bda/?p=CRSyoYwHvQF8DnlSLDeuCA'),
  ans: '[2;3)U(3;4]', need: '=1', gpre: 2,
  an: [
    Q('Левая часть', R`\(y=\sqrt{6x-x^2-8}-3\iff\)`, ['\\begin{cases}y\\ge-3\\\\(x-3)^2+(y+3)^2=1\\end{cases}', '(x-3)^2+(y+3)^2=1', '\\begin{cases}y\\ge-3\\\\(x+3)^2+(y-3)^2=1\\end{cases}', '\\begin{cases}y\\ge0\\\\(x-3)^2+y^2=1\\end{cases}'], R`Верхняя полуокружность: центр \((3;-3)\), радиус 1.`),
    Q('Правая часть', R`\(y=\sqrt{1+2ax-a^2-x^2}-a\iff\)`, ['\\begin{cases}y\\ge-a\\\\(x-a)^2+(y+a)^2=1\\end{cases}', '(x-a)^2+(y+a)^2=1', '\\begin{cases}y\\ge a\\\\(x-a)^2+(y-a)^2=1\\end{cases}', '\\begin{cases}y\\ge-a\\\\(x+a)^2+(y+a)^2=1\\end{cases}'], R`Тоже верхняя полуокружность радиуса 1, её центр \((a;-a)\) едет по прямой \(y=-x\).`),
    Q(R`Случай \(a=3\)`, R`Что при \(a=3\)?`, ['полуокружности совпадают — бесконечно много корней', 'один корень', 'корней нет', 'два корня']),
    Q('Крайние положения', 'Полуокружности касаются концом и вершиной при', ['a=2\\ \\text{и}\\ a=4', 'a=1\\ \\text{и}\\ a=5', 'a=2\\ \\text{и}\\ a=3', 'a=3\\ \\text{и}\\ a=4'], R`\(a=2\): правый конец второй \((3;-2)\) — вершина первой. \(a=4\): правый конец первой \((4;-3)\) — вершина второй. Между ними, кроме \(a=3\), — одна общая точка.`)
  ],
  g: { va: [0, 6], vx: [-0.6, 9.7], vy: [-6.5, 1.5], keys: [3],
    fix: [{ F: (x, y) => (x - 3) ** 2 + (y + 3) ** 2 - 1, ok: (x, y, e) => y >= -3 - e, lab: 'y = √(6x − x² − 8) − 3', lx: 3.9, ly: -1.6 }],
    mov: [{ F: (x, y, a) => y < -a - 1e-9 ? NaN : (x - a) ** 2 + (y + a) ** 2 - 1 }],
    sol: a => near(a, 3) ? 'inf' : twoCirc([3, -3], [a, -a], 1).filter(([x, y]) => y >= -3 - 1e-9 && y >= -a - 1e-9),
    fixT: R`Неподвижная — верхняя полуокружность с центром \((3;-3)\).`, forbT: R`Нижние половины окружностей не годятся (пунктир).`,
    keyT: R`Вторая полуокружность едет по прямой \(y=-x\). Особые: \(a=2\), \(a=4\) (касание концом), \(a=3\) (совпадение).` } });

T({ id: '093', code: '093', src: '630102', sec: 'circ', lvl: 2, kind: 'модуль: две окружности по разные стороны прямой',
  st: R`Найдите все значения параметра \(a\), при каждом из которых уравнение \[x^2+a^2-x-7a=|7x-a|\] имеет ровно два различных корня.`,
  links: L('https://math-ege.sdamgia.ru/problem?id=630102', 'https://rutube.ru/video/private/3320da57bf2d706382d8b7267a6e3a73/?p=VZV65CnUGVo90oBsfMcbYA'),
  ans: '(-2;-1)U(0;7)U(8;9)', need: '=2',
  an: [
    Q('Раскрываем модуль', 'Какие случаи рассматриваем?', ['7x-a\\ge0\\ \\text{и}\\ 7x-a<0', 'x\\ge0\\ \\text{и}\\ x<0', 'a\\ge0\\ \\text{и}\\ a<0', 'x\\ge a\\ \\text{и}\\ x<a']),
    Q(R`При \(a\le7x\)`, 'Получаем:', ['(x-4)^2+(a-3)^2=25', '(x+3)^2+(a-4)^2=25', '(x-4)^2+(a+3)^2=25', '(x-3)^2+(a-4)^2=25'], R`\(x^2+a^2-8x-6a=0\).`),
    Q(R`При \(a>7x\)`, 'Получаем:', ['(x+3)^2+(a-4)^2=25', '(x-4)^2+(a-3)^2=25', '(x+3)^2+(a+4)^2=25', '(x-3)^2+(a-4)^2=25'], R`\(x^2+a^2+6x-8a=0\). Обе окружности проходят через \((0;0)\) и \((1;7)\) — точки прямой \(a=7x\).`),
    Q('Подсчёт', R`Сколько корней при \(0<a<7\)?`, ['2', '1', '3', '4'], R`В плоскости \((x;a)\): правее прямой \(a=7x\) — дуга первой окружности, левее — дуга второй. Особые уровни: \(a=-2,\,-1\) (низ окружностей), \(a=0,\,7\) (стыки), \(a=8,\,9\) (верх). Два корня: \(-2<a<-1\), \(0<a<7\), \(8<a<9\).`)
  ],
  g: { va: [-3, 10], vx: [-8.5, 9.5],
    br: [{ x: a => 4 + sq(25 - (a - 3) ** 2), ok: (x, a, e) => a <= 7 * x + e, lab: '(x−4)² + (a−3)² = 25' }, { x: a => 4 - sq(25 - (a - 3) ** 2), ok: (x, a, e) => a <= 7 * x + e },
      { x: a => -3 + sq(25 - (a - 4) ** 2), ok: (x, a, e) => a > 7 * x + e, lab: '(x+3)² + (a−4)² = 25' }, { x: a => -3 - sq(25 - (a - 4) ** 2), ok: (x, a, e) => a > 7 * x + e }],
    vl: [], brT: R`При \(a\le7x\) — окружность \((x-4)^2+(a-3)^2=25\), при \(a>7x\) — окружность \((x+3)^2+(a-4)^2=25\). Каждая годится только по свою сторону от прямой \(a=7x\) (вторая половина — пунктир).`,
    forbT: R`Ограничений нет: модуль раскрыт на две области, граница — прямая \(a=7x\).`,
    keyT: R`Особые: \(a=-2,\,-1\) (низ окружностей), \(a=0\) и \(a=7\) (стыки на прямой), \(a=8,\,9\) (верх).` } });

T({ id: '094', code: '094', src: '18.32', sec: 'sys', lvl: 2, kind: 'окружность и две прямые',
  st: R`Найдите все значения параметра \(a\), при каждом из которых система уравнений \[\begin{cases}ax^2+ay^2-(2a-5)x+2ay+1=0,\\x^2+y=xy+x\end{cases}\] имеет ровно четыре различных решения.`,
  links: L('https://www.geogebra.org/classic/sfyrvzcp', 'https://rutube.ru/video/cb06a7ae2f812c04d159cb8e999c9f29/'),
  ans: '(-inf;-3)U(-3;0)U(3;25/8)', need: '=4',
  an: [
    Q('Второе уравнение', R`\(x^2+y-xy-x=0\iff\)`, ['(x-1)(x-y)=0', '(x+1)(x-y)=0', '(x-1)(x+y)=0', 'x(x-y)=0'], R`Две прямые: \(x=1\) и \(y=x\). Каждая должна пересечь первую линию дважды.`),
    Q(R`Случай \(a=0\)`, R`При \(a=0\) первое уравнение`, ['прямая x = −1/5: одно решение', 'окружность: четыре решения', 'решений нет', 'две прямые'], R`\(5x+1=0\). С \(x=1\) не пересекается, с \(y=x\) — одна точка.`),
    Q(R`Прямая \(x=1\)`, R`\(ay^2+2ay+6-a=0\) имеет два корня при`, ['a<0\\ \\text{или}\\ a>3', '0<a<3', 'a>3', 'a<0'], R`\(\frac D4=a^2-a(6-a)=2a(a-3)>0\).`),
    Q(R`Прямая \(y=x\)`, R`\(2ax^2+5x+1=0\) имеет два корня при`, ['a<\\frac{25}8,\\ a\\ne0', 'a>\\frac{25}8', 'a<\\frac{25}8', 'a\\ne0'], R`\(D=25-8a>0\).`),
    Q('Совпадение', R`Первая линия проходит через точку \((1;1)\) при`, ['a=-3', 'a=3', 'a=0', 'a=\\frac{25}8'], R`\(2a+6=0\). Тогда решений три. Итог: \(a<0\), \(a\ne-3\), или \(3<a<\frac{25}8\).`)
  ],
  g: { va: [-6, 4.5], vx: [-4, 6], vy: [-5, 2.8], keys: [0],
    fix: [{ F: (x, y) => x - 1, lab: 'x = 1', lx: 1.15, ly: 2.3 }, { F: (x, y) => y - x, lab: 'y = x', lx: -3, ly: -2.6 }],
    mov: [{ F: (x, y, a) => a * (x * x + y * y) - (2 * a - 5) * x + 2 * a * y + 1 }],
    sol: a => { const out = []; quad(a, 2 * a, 6 - a).forEach(y => out.push([1, y])); quad(2 * a, 5, 1).forEach(x => out.push([x, x])); return out; },
    pts: [[1, 1, 0]],
    fixT: R`Второе уравнение — две прямые \(x=1\) и \(y=x\), пересекаются в \((1;1)\).`, forbT: '',
    keyT: R`При \(a\ne0\) первая линия — окружность с центром \(\left(\frac{2a-5}{2a};\,-1\right)\). Особые: \(a=0\) (прямая), \(a=-3\) (через \((1;1)\)), \(a=3\) и \(a=\frac{25}8\) (касания).` } });

const T095 = (id, code, src, lvl, links) => ({ id, code, src, sec: 'sys', lvl, kind: 'круг и полуплоскость, касание', typ: 'sysin',
  st: R`Найдите все значения \(a\), при каждом из которых система неравенств \[\begin{cases}(a-x)^2+(y+a)^2\le a+3,\\x-y\le|3-2a|\end{cases}\] имеет единственное решение.`,
  links, ans: '{-3;3/2}', need: '=1', needText: 'единственное решение',
  an: [
    Q('Первое неравенство', 'Что задаёт первое неравенство?', ['круг с центром (a; −a) и радиусом √(a+3) при a > −3', 'окружность', 'круг радиуса a+3', 'полуплоскость'], R`При \(a<-3\) решений нет, при \(a=-3\) — точка.`),
    Q(R`Случай \(a=-3\)`, R`При \(a=-3\) круг — точка \((-3;3)\). Она`, ['удовлетворяет второму неравенству — решение одно', 'не удовлетворяет — решений нет', 'даёт два решения', 'лежит на прямой'], R`\(-3-3=-6\le|3+6|=9\).`),
    Q('Второе неравенство', R`\(x-y\le|3-2a|\) — это`, ['полуплоскость над прямой y = x − |3 − 2a| (с границей)', 'полоса', 'прямая', 'полуплоскость под прямой'], R`Граница — прямая с угловым коэффициентом 1.`),
    Q('Единственность', R`При \(a>-3\) решение единственное, если`, ['круг касается прямой извне — центр под прямой', 'центр круга на прямой', 'круг касается прямой изнутри', 'прямая проходит через центр'], R`Если центр над прямой (в полуплоскости), решений бесконечно много.`),
    Q('Касание', R`\(\frac{|2a-|3-2a||}{\sqrt2}=\sqrt{a+3}\). Подходит`, ['a=\\frac32', 'a=\\frac18', 'a=\\frac32\\ \\text{и}\\ a=\\frac18', 'a=3'], R`При \(a\le\frac32\): \((3-4a)^2=2a+6\Rightarrow a=\frac32\) или \(a=\frac18\); при \(a=\frac18\) центр в полуплоскости — бесконечно много решений. При \(a>\frac32\): \(9=2a+6\Rightarrow a=\frac32\) — не входит.`)
  ],
  g: { va: [-4, 3], vx: [-6.5, 6.5], vy: [-5, 5], keys: [1 / 8],
    fix: [], mov: [{ F: (x, y, a) => (a - x) ** 2 + (y + a) ** 2 - (a + 3) }, { F: (x, y, a) => x - y - abs(3 - 2 * a) }],
    sol: a => { const R2 = a + 3, c = abs(3 - 2 * a), v = 2 * a; if (R2 < -1e-12) return []; if (abs(R2) < 1e-12) return v <= c + 1e-9 ? [[a, -a]] : [];
      const d = (v - c) / S2, Rr = sqrt(R2); if (d > Rr + 1e-9) return []; if (abs(d - Rr) < 1e-9) return [[a - (v - c) / 2, -a + (v - c) / 2]]; return 'inf'; },
    fixT: R`Обе фигуры зависят от \(a\): круг с центром \((a;-a)\) и полуплоскость над прямой \(y=x-|3-2a|\).`, forbT: '',
    keyT: R`Особые: \(a=-3\) (круг — точка), \(a=\frac32\) (касание извне — одно решение), \(a=\frac18\) (касание, но круг внутри полуплоскости).` } });
T(T095('095', '095', 'Ященко(36) 26, вар. 17', 2, L('https://rutube.ru/video/private/36ad1a1367e98ff1f765fe01f5360734/?p=j5MEYQl1lBrHKpLVgwQz4g')));

T({ id: '096', code: '096', src: '630221 (аналог)', sec: 'circ', lvl: 3, kind: 'модуль = 2x − 2a: две окружности и полуплоскость',
  st: R`Найдите все значения параметра \(a\), при каждом из которых уравнение \[|x^2+a^2-6x+4a|=2x-2a\] имеет ровно два различных корня.`,
  links: L('https://www.geogebra.org/classic/dttpwzye', 'https://math-ege.sdamgia.ru/problem?id=630221', 'https://rutube.ru/video/private/379aef57d10cd83911fbad4f3bc3f642/?p=XCGbxqL1Jnt2l8UiW8Nh5Q'),
  ans: '(-8;-1-sqrt(5))U(0;1)U(sqrt(5)-1;2)', need: '=2', ansTex: R`a\in\left(-8;\,-1-\sqrt5\right)\cup(0;\,1)\cup\left(\sqrt5-1;\,2\right)`,
  an: [
    Q('Условие', R`\(|A|=B\iff\)`, ['\\begin{cases}B\\ge0\\\\A=\\pm B\\end{cases}', 'A=\\pm B', '\\begin{cases}A\\ge0\\\\A=B\\end{cases}', 'A=B'], R`\(2x-2a\ge0\iff a\le x\) — разрешено на прямой \(a=x\) и ниже.`),
    Q(R`\(A=B\)`, 'Получаем:', ['(x-4)^2+(a+3)^2=25', '(x-2)^2+(a+1)^2=5', '(x+4)^2+(a-3)^2=25', '(x-4)^2+(a+3)^2=5'], R`\(x^2-8x+a^2+6a=0\).`),
    Q(R`\(A=-B\)`, 'Получаем:', ['(x-2)^2+(a+1)^2=5', '(x-4)^2+(a+3)^2=25', '(x+2)^2+(a-1)^2=5', '(x-2)^2+(a+1)^2=25'], R`\(x^2-4x+a^2+2a=0\). Обе окружности проходят через \((0;0)\) — точку прямой \(a=x\).`),
    Q('Подсчёт', R`Горизонталь \(a=\mathrm{const}\) пересекает две дуги ниже прямой \(a=x\). Ровно два корня при`, ['-8<a<-1-\\sqrt5,\\ 0<a<1,\\ \\sqrt5-1<a<2', '-8\\le a<-1-\\sqrt5,\\ \\sqrt5-1<a\\le2', '-8<a<2', '0<a<2'], R`Особые: \(a=-8\) и \(a=-1-\sqrt5\) (низ окружностей), \(a=0\) (обе через \((0;0)\)), \(a=1\) и \(a=2\) (выход на прямую \(a=x\)), \(a=\sqrt5-1\) (верх малой окружности). Проверено численно: ответ совпадает с ключом в заголовке PDF.`)
  ],
  g: { va: [-9, 3.5], vx: [-2.5, 10.5], dom: (x, a, e) => x - a >= -e,
    br: [{ x: a => 4 + sq(25 - (a + 3) ** 2), lab: '(x−4)² + (a+3)² = 25' }, { x: a => 4 - sq(25 - (a + 3) ** 2) },
      { x: a => 2 + sq(5 - (a + 1) ** 2), lab: '(x−2)² + (a+1)² = 5' }, { x: a => 2 - sq(5 - (a + 1) ** 2) }],
    bnd: [{ a: x => x, lab: 'a = x' }],
    brT: R`Корни: окружности \((x-4)^2+(a+3)^2=25\) и \((x-2)^2+(a+1)^2=5\).`,
    forbT: R`Условие \(2x-2a\ge0\): разрешено \(a\le x\) — на прямой \(a=x\) и ниже, выше прямой заштриховано.`,
    keyT: R`Особые: \(a=-8\), \(a=-1-\sqrt5\), \(a=0\), \(a=1\), \(a=\sqrt5-1\), \(a=2\).` } });

T({ id: '097', code: '097', src: '18.26', sec: 'sys', lvl: 3, kind: 'равенство корней: y = ±ax и окружность',
  st: R`Найдите все значения параметра \(a\), при каждом из которых система уравнений \[\begin{cases}\sqrt{36-y^2}=\sqrt{36-a^2x^2},\\x^2+y^2=2x+6y\end{cases}\] имеет ровно два различных решения.`,
  links: L('https://www.geogebra.org/classic/vrsupjxd', 'https://rutube.ru/video/private/3caee4f98b10e8f9064213ef710d769e/?p=UVWX4AtZGTy3XAf7DlRO0w'),
  ans: '(-inf;-3)U{-1/3;0;1/3}U(3;inf)', need: '=2',
  an: [
    Q('Переход', 'Первое уравнение равносильно:', ['\\begin{cases}y=\\pm ax\\\\a^2x^2\\le36\\end{cases}', 'y=\\pm ax', '\\begin{cases}y=ax\\\\|y|\\le6\\end{cases}', '\\begin{cases}y^2=a^2x^2\\\\a^2x^2<36\\end{cases}'], R`Подкоренные равны, достаточно одного условия \(36-a^2x^2\ge0\), то есть \(|y|\le6\).`),
    Q('Окружность', 'Второе уравнение:', ['(x-1)^2+(y-3)^2=10', '(x-1)^2+(y-3)^2=4', '(x+1)^2+(y+3)^2=10', '(x-2)^2+(y-6)^2=10']),
    Q('Точки', R`Прямые \(y=\pm ax\) пересекают окружность в точках с абсциссами`, ['0,\\ \\frac{2+6a}{1+a^2},\\ \\frac{2-6a}{1+a^2}', '0,\\ \\frac{2+6a}{1-a^2},\\ \\frac{2-6a}{1-a^2}', '\\frac{2+6a}{1+a^2},\\ \\frac{2-6a}{1+a^2}', '0,\\ 2+6a,\\ 2-6a']),

T({ id: '101', code: '101', src: '642739_1', sec: 'sysf', lvl: 3, kind: 'произведение с корнем: окружность, граница и пучок',

  ans: '{-sqrt(3)/3;sqrt(3)/3}U[-3/14;1/2]', need: '=2', ansTex: R`a\in\left\{-\frac{\sqrt3}3\right\}\cup\left[-\frac3{14};\,\frac12\right]\cup\left\{\frac{\sqrt3}3\right\}`,
  an: [
    Q('Произведение = 0', 'Первое уравнение равносильно:', ['\\left[\\begin{array}{l}\\begin{cases}x^2+y^2+4x=0\\\\2x+y+6\\ge0\\end{cases}\\\\2x+y+6=0\\end{array}\\right.', 'x^2+y^2+4x=0\\ \\text{или}\\ 2x+y+6=0', '\\begin{cases}x^2+y^2+4x=0\\\\2x+y+6>0\\end{cases}', 'x^2+y^2+4x=0'], R`Множитель с корнем равен нулю на всей прямой \(y=-2x-6\); для окружности нужно ОДЗ.`),

    Q('Вторая линия', R`\(y=a(x-2)\) — это`, ['пучок прямых через точку (2; 0)', 'параллельные прямые', 'окружность', 'прямая y = 2a'], R`Каждая прямая пучка (кроме \(a=-2\)) пересекает прямую \(y=-2x-6\) ровно в одной точке.`),
    Q('Касание', 'Прямая пучка касается окружности при', ['a=\\pm\\frac{\\sqrt3}3', 'a=\\pm\\sqrt3', 'a=\\pm\\frac12', 'a=\\pm1'], R`\(\frac{|4a|}{\sqrt{1+a^2}}=2\iff a^2=\frac13\). Касание + точка на прямой — два решения.`),

T({ id: '102', code: '102', src: '168169 Ященко 26', sec: 'sys', lvl: 3, kind: '«очки» из окружностей и горизонталь',
  st: R`Найдите все значения \(a\), при каждом из которых система уравнений \[\begin{cases}(|x|-a^2)^2+(y-4a)(y+4a)=9a^2-2y-1,\\y=6\sqrt a-1\end{cases}\] имеет ровно два различных решения.`,
  links: L('https://www.geogebra.org/classic/bunavhrk', 'https://3.shkolkovo.online/catalog/4150/168169', 'https://3.shkolkovo.online/catalog/4150/168174', 'https://rutube.ru/video/private/f5bd274a06a1935517482aadd5b83b1b/?p=FitKT80yH6aqNhOA2CRCtQ'),
  ans: '(sqrt(13)-2;4)U{36/25}', need: '=2', ansTex: R`a\in\left(\sqrt{13}-2;\,4\right)\cup\left\{\frac{36}{25}\right\}`,
  an: [
    Q('Преобразование', 'Первое уравнение приводится к виду', ['(|x|-a^2)^2+(y+1)^2=25a^2', '(|x|-a^2)^2+(y-1)^2=25a^2', '(|x|-a^2)^2+(y+1)^2=9a^2', '(x-a^2)^2+(y+1)^2=25a^2'], R`\((y-4a)(y+4a)=y^2-16a^2\), переносим \(-2y-1\) влево.`),
    Q('Две окружности', R`При \(a>0\) это`, ['две окружности с центрами (±a²; −1) и радиусом 5a (каждая — в своей полуплоскости по x)', 'одна окружность', 'две окружности радиуса 25a²', 'ромб'], R`Для \(x\ge0\): \((x-a^2)^2+(y+1)^2=25a^2\); для \(x<0\) — симметрично. При \(a=0\) — точка \((0;-1)\), решение одно.`),
    Q('Касание', R`Горизонталь \(y=6\sqrt a-1\) касается окружностей сверху при`, ['a=\\frac{36}{25}', 'a=\\frac{25}{36}', 'a=\\frac65', 'a=\\frac{6}{25}'], R`\(6\sqrt a=5a\iff\sqrt a=\frac65\). Касание обеих — два решения.`),
    Q('Через ось', R`Левый корень правой окружности \(x=a^2-\sqrt{25a^2-36a}\) неотрицателен при`, ['a^3-25a+36\\ge0', 'a^3-25a+36\\le0', 'a\\ge4', '25a^2\\ge36a'], R`\(a^3-25a+36=(a-4)(a^2+4a-9)\): корни \(4\) и \(\sqrt{13}-2\). При \(\sqrt{13}-2<a<4\) каждая окружность даёт по одной точке — два решения; при \(\frac{36}{25}<a<\sqrt{13}-2\) — четыре.`)
  ],
  g: { va: [-0.3, 5], vx: [-40, 40], vy: [-31, 31], keys: [0],
    fix: [], mov: [{ F: (x, y, a) => (abs(x) - a * a) ** 2 + (y + 1) ** 2 - 25 * a * a }, { F: (x, y, a) => a < 0 ? NaN : y - (6 * Math.sqrt(a) - 1) }],
    sol: a => { if (a < -1e-12) return []; const Y = 6 * sq(Math.max(0, a)) - 1, d = 25 * a * a - (Y + 1) ** 2, out = []; if (d < -1e-12) return []; const r = sq(d);
      [a * a + r, a * a - r].forEach(x => { if (x >= -1e-12) out.push([x, Y]); }); [-a * a + r, -a * a - r].forEach(x => { if (x < -1e-12) out.push([x, Y]); }); return out; },
    fixT: R`Обе линии зависят от \(a\): «очки» из двух окружностей с центрами \((\pm a^2;-1)\) и горизонталь \(y=6\sqrt a-1\).`, forbT: R`\(a\ge0\) (корень).`,
    keyT: R`Особые: \(a=\frac{36}{25}\) (касание), \(a=\sqrt{13}-2\) и \(a=4\) (точка пересечения переходит через ось \(Oy\)).` } });

T({ id: '103', code: '103', src: '168173 Ященко 26', sec: 'sys', lvl: 4, kind: 'замена: две прямые и окружность',

  an: [

/* корни f(θ) на окружности: смена знака и касание (|f| почти 0 в локальном минимуме) */
const circRoots = (cx, cy, R, f) => { const N = 7200, out = [], P = th => [cx + R * Math.cos(th), cy + R * Math.sin(th)], F = th => f(...P(th)), sc = 1e-7 * (1 + Math.abs(f(cx, cy)));
  let v0 = F(0), vm = F(-2 * pi / N);
  for (let i = 1; i <= N; i++) { const th = 2 * pi * i / N, v1 = F(th);
    if (v0 === 0 || v0 * v1 < 0) { let l = th - 2 * pi / N, r = th, fl = F(l); for (let k = 0; k < 60; k++) { const m = (l + r) / 2, fm = F(m); if (fl * fm <= 0) r = m; else { l = m; fl = fm; } } out.push(P((l + r) / 2)); }
    else if (Math.abs(v0) < Math.abs(vm) && Math.abs(v0) <= Math.abs(v1) && vm * v0 > 0 && v0 * v1 > 0) { let l = th - 4 * pi / N, r = th; for (let k = 0; k < 80; k++) { const m1 = l + (r - l) / 3, m2 = r - (r - l) / 3; if (Math.abs(F(m1)) < Math.abs(F(m2))) r = m2; else l = m1; } const tm = (l + r) / 2; if (Math.abs(F(tm)) < sc) out.push(P(tm)); }
    vm = v0; v0 = v1; }
  return out; };

/* ===================== БЛОК 8: задачи 110–112, 120–121, 130–135 ===================== */
SEC.trig = ['Тригонометрия на отрезке', 13];
SEC.minf = ['Наименьшее значение / при всех x', 14];
/* минимум функции на отрезке: сетка + уточнение золотым сечением */
const numMin = (f, lo, hi, N = 6000) => { let bi = 0, bv = Infinity; for (let i = 0; i <= N; i++) { const v = f(lo + (hi - lo) * i / N); if (v < bv) { bv = v; bi = i; } }
  let l = lo + (hi - lo) * Math.max(0, bi - 1) / N, r = lo + (hi - lo) * Math.min(N, bi + 1) / N; for (let k = 0; k < 90; k++) { const m1 = l + (r - l) / 3, m2 = r - (r - l) / 3; if (f(m1) < f(m2)) r = m2; else l = m1; } return Math.min(bv, f((l + r) / 2)); };
/* корни h(x) = 0 на отрезке (смена знака) */
const rootsOn = (h, lo, hi, N = 3000) => { const out = []; let px = lo, pv = h(lo); if (Math.abs(pv) < 1e-12) out.push(lo); for (let i = 1; i <= N; i++) { const x = lo + (hi - lo) * i / N, v = h(x); if (Math.abs(v) < 1e-12) out.push(x); else if (pv * v < 0 && Math.abs(pv) > 1e-12) { let l = px, r = x, fl = pv; for (let k = 0; k < 70; k++) { const m = (l + r) / 2, fm = h(m); if (fl * fm <= 0) r = m; else { l = m; fl = fm; } } out.push((l + r) / 2); } px = x; pv = v; } return out; };

/* ================= цепочки шагов ================= */
const STOP = /Проверк|Совпад|Подсч|Итог|Касан|Выколот|Отбор|Читаем|Особ|Луч|Ответ|Собира|Четыре|Третий|Через концы|Угловые|Точка|Пучок|Расстоян|Случай \\\(a|Случай a|Сколько|Условие на a|Условия знака|Условия существования|Корень|Корни на|существует|^a\s*[<>≤≥=]|Решаем|Два корня|Опорные|Крайние|Верхняя|Нижняя|Пересечени|Парабола на|С параболой|Вторая прямая/;
