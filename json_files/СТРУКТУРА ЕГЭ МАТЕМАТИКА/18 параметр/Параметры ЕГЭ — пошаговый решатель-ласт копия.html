T({ id: '032', code: '032', src: '65519', sec: 'root', lvl: 1, kind: 'ровно один отрицательный корень',
  st: R`Найдите все значения \(a\), при каждом из которых уравнение \[\sqrt{x^2+6x+8}=\sqrt{a-3x}\] имеет корни (хотя бы один), причём ровно один из этих корней отрицательный.`,
  links: L('https://www.geogebra.org/classic/zpwqmjr4', 'https://3.shkolkovo.online/catalog/136/65519', 'https://rutube.ru/video/private/da24dd21917d1f0f25eaa466bc4b3e81/?p=ZyTUoaPeHNiHM6r1z2wb-g'),
  ans: '{-49/4}U(-12;-6)U[8;inf)', needText: 'есть корни, ровно один отрицательный',
  an: [
    Q('Переход', R`\(\sqrt f=\sqrt g\iff\)`, ['\\begin{cases}x^2+6x+8=a-3x\\\\x^2+6x+8\\ge0\\end{cases}', 'x^2+6x+8=a-3x', '\\begin{cases}x^2+6x+8=a-3x\\\\a-3x>0\\end{cases}', '\\begin{cases}x^2+6x+8>0\\\\a-3x>0\\end{cases}']),
    Q('Выражаем a', 'Получаем:', ['a=x^2+9x+8', 'a=x^2+3x+8', 'a=x^2+9x-8', 'a=x^2-9x+8']),
    Q('ОДЗ', R`\(x^2+6x+8\ge0\iff\)`, ['x\\le-4\\ \\text{или}\\ x\\ge-2', '-4\\le x\\le-2', 'x\\ge-2', 'x\\le-4']),
    Q('Опорные значения', R`Значения \(a=x^2+9x+8\) в вершине \(x=-4{,}5\) и в точках \(x=-4,\ -2,\ 0\):`, ['-\\frac{49}4;\\ -12;\\ -6;\\ 8', '-\\frac{81}4;\\ -12;\\ -6;\\ 8', '-\\frac{49}4;\\ -12;\\ -8;\\ 8', '-12;\\ -\\frac{49}4;\\ -6;\\ 8'], R`Вершина \(x=-4{,}5\) — в ОДЗ (\(\le-4\)).`),

  ],
  g: { va: [-14, 14], vx: [-10, 3], dom: (x, a, e) => x * x + 6 * x + 8 >= -e, keys: [-6],
    cls: (r, p) => r.xs.length > 0 && r.xs.filter(x => x < -1e-12).length === 1,

    vl: [{ x: 0 }],
    brT: R`Корни: парабола \(a=x^2+9x+8\).`, forbT: R`Запрещено \(-4<x<-2\) (там \(x^2+6x+8<0\)).`, keyT: R`Особые: вершина \(a=-\frac{49}4\); выходы на границу ОДЗ \(a=-12\) (\(x=-4\)), \(a=-6\) (\(x=-2\)); \(a=8\) (корень \(x=0\)).` } });

T({ id: '033', code: '033', src: '185801 (2026)', sec: 'fact', lvl: 1, kind: 'квадратное относительно a',
  st: R`Найдите все значения параметра \(a\), при каждом из которых уравнение \[(x^2-x)a^2+(x^4-x^3-x+1)a-x^3+x^2=0\] имеет ровно 2 решения.`,
  links: L('https://www.geogebra.org/classic/ntahx8rc', 'https://3.shkolkovo.online/catalog/136/185801', 'https://rutube.ru/video/private/4dce79830c8cff5d017901930afc7a26/?p=Y3mdfe7aDusOfCDTyNV_rQ'),
  ans: '{-1}U[0;1)U(1;inf)', need: '=2',
  an: [
    Q('Общий множитель', 'Какой множитель есть у всех коэффициентов?', ['x-1', 'x+1', 'x', 'x^2-1'], R`\(x^2-x=x(x-1)\), \(\ x^4-x^3-x+1=(x-1)(x^3-1)\), \(\ -x^3+x^2=-x^2(x-1)\).`),
    Q('Оставшийся множитель', R`\(xa^2+(x^3-1)a-x^2=\)`, ['(xa-1)(a+x^2)', '(xa+1)(a-x^2)', '(a-x)(xa+x^2)', '(xa-1)(a-x^2)']),
    Q('Корни', 'Кандидаты:', ['x=1,\\ x=\\frac1a,\\ x=\\pm\\sqrt{-a}', 'x=1,\\ x=a,\\ x=\\pm\\sqrt a', 'x=-1,\\ x=\\frac1a,\\ x=\\pm\\sqrt{-a}', 'x=\\frac1a,\\ x=\\pm\\sqrt{-a}']),
    Q('a > 0', R`Сколько решений при \(a>0,\ a\ne1\)?`, ['два: 1 и 1/a', 'одно', 'три', 'четыре'], R`При \(a=1\) корни \(1\) и \(\frac1a\) совпадают.`),
    Q('a ≤ 0', R`При \(a<0\) решений два только при`, ['a=-1', 'a=-\\frac12', '\\text{ни при каком}', 'a=-4'], R`\(a=-1\): \(\frac1a=-1=-\sqrt{-a}\), \(\sqrt{-a}=1\). При \(a=0\): \(x=1\) и \(x=0\) — два.`)
  ],
  g: { va: [-3, 3], vx: [-4, 4], keys: [1],
    br: [{ xLine: 1, lab: 'x = 1' }, { x: a => 1 / a, lab: 'a = 1/x' }, { x: a => sqrt(-a), lab: 'a = −x²' }, { x: a => -sqrt(-a) }],
    brT: R`Вертикаль \(x=1\), гипербола \(a=\frac1x\) и парабола \(a=-x^2\).`, forbT: 'Ограничений нет.', keyT: R`Особые: \(a=-1\) (гипербола и парабола в точке \(x=-1\)), \(a=0\), \(a=1\).` } });

  an: [
    Q('Разность квадратов', 'Уравнение равносильно:', ['4x\\ln(x+a)=0', 'x\\ln(x+a)=1', '\\ln(x+a)=0', '2x=2\\ln(x+a)']),

T({ id: '035', code: '035', src: '24294', sec: 'subst', lvl: 1, kind: 'полуокружность, хотя бы один корень',
  st: R`Найдите все значения \(a\), при каждом из которых уравнение \[\left(4x-x^2\right)^2-32\sqrt{4x-x^2}=a^2-14a\] имеет хотя бы один корень.`,
  links: L('https://www.geogebra.org/classic/gcw5ebzh', 'https://3.shkolkovo.online/catalog/136/24294', 'https://rutube.ru/video/private/a23d886835b92c7f720b440f1353dd5e/?p=hqXUfWVBlvAbsWD5Do0LnQ'),
  ans: '[0;6]U[8;14]', need: '>=1',
  an: [
    Q('Замена', 'Какую замену сделать?', ['t=\\sqrt{4x-x^2},\\ 0\\le t\\le2', 't=\\sqrt{4x-x^2},\\ t\\ge0', 't=4x-x^2,\\ t\\le4', 't=\\sqrt{4x-x^2},\\ 0\\le t\\le4'], R`\(4x-x^2=4-(x-2)^2\le4\) ⇒ \(t\le2\). График \(y=\sqrt{4x-x^2}\) — полуокружность.`),
    Q('Уравнение по t', 'Получаем:', ['t^4-32t=a^2-14a', 't^2-32t=a^2-14a', 't^4-32\\sqrt t=a^2-14a', 't^4+32t=a^2-14a']),
    Q('Монотонность', R`\(f(t)=t^4-32t\) на \([0;2]\):`, ['убывает от 0 до −48', 'возрастает от 0 до −48', 'убывает от 0 до −16', 'имеет минимум внутри'], R`\(f'(t)=4t^3-32<0\) при \(t<2\).`),
    Q('Условие', 'Корень есть ⇔', ['-48\\le a^2-14a\\le0', 'a^2-14a\\le0', 'a^2-14a\\ge-48', '-16\\le a^2-14a\\le0']),
    Q('Решаем', 'Ответ двойного неравенства:', ['a\\in[0;6]\\cup[8;14]', 'a\\in[0;14]', 'a\\in[6;8]', 'a\\in(0;6)\\cup(8;14)'])
  ],
  g: { va: [-2, 16], vx: [-0.8, 4.8], dom: (x, a, e) => 4 * x - x * x >= -e,
    br: [1, -1].map((s, i) => ({ x: a => { const t = bis(u => u ** 4 - 32 * u - (a * a - 14 * a), 0, 2); return 2 + s * sq(4 - t * t); }, lab: i ? undefined : 'a² − 14a = f(√(4x−x²))' })),
    brT: R`Решения образуют замкнутую кривую над отрезком \([0;4]\): каждому \(a\) соответствует \(t\), а каждому \(t<2\) — два \(x=2\pm\sqrt{4-t^2}\).`, forbT: R`Запрещено \(x<0\) и \(x>4\) (\(4x-x^2<0\)).`, keyT: R`Крайние горизонтали: \(a=0,\ 14\) (\(t=0\)), \(a=6,\ 8\) (\(t=2\)).` } });

T({ id: '036', code: '036', src: '521999', sec: 'subst', lvl: 1, kind: 'две замены → полный квадрат',
  st: R`Найдите все значения \(a\), при которых уравнение \[\left(x^2+2x+2a\right)^2=5x^4+5(x+a)^2\] имеет единственное решение на отрезке \([0;2]\).`,
  links: L('https://ege.sdamgia.ru/problem?id=521999', 'https://rutube.ru/video/961b127d7a555faed4a54966fcadc382/'),
  ans: '{-1/8}U(0;6]', need: '=1',
  an: [
    Q('Замены', 'Удобно обозначить:', ['u=x^2,\\ v=x+a', 'u=x^2+2x,\\ v=a', 'u=x,\\ v=a', 'u=x^2,\\ v=x'], R`Тогда \(x^2+2x+2a=u+2v\).`),
    Q('Уравнение', R`\((u+2v)^2=5u^2+5v^2\iff\)`, ['(2u-v)^2=0', '(u-2v)^2=0', '(2u+v)^2=0', 'u^2=v^2'], R`\(4u^2-4uv+v^2=0\).`),
    Q('Выражаем a', R`\(v=2u\Rightarrow\)`, ['a=2x^2-x', 'a=x^2-2x', 'a=2x^2+x', 'a=x-2x^2']),
    Q('Парабола на [0; 2]', 'Значения a в вершине и на концах:', ['-\\frac18;\\ 0;\\ 6', '-\\frac14;\\ 0;\\ 6', '-\\frac18;\\ 0;\\ 8', '0;\\ \\frac14;\\ 6'], R`Вершина \(x=\frac14\). Единственное решение: \(a=-\frac18\) или \(0<a\le6\).`)
  ],
  g: { va: [-0.6, 7], vx: [-0.6, 2.4], xr: [0, 2], keys: [0],
    br: [{ x: a => (1 + sq(1 + 8 * a)) / 4, lab: 'a = 2x² − x' }, { x: a => (1 - sq(1 + 8 * a)) / 4 }],
    brT: R`Решения: парабола \(a=2x^2-x\).`, forbT: R`Рассматриваем только \(0\le x\le2\).`, keyT: R`Особые: вершина \(a=-\frac18\), \(a=0\) (корни \(0\) и \(\frac12\)), \(a=6\) (\(x=2\)).` } });

T({ id: '038', code: '038', src: '26485', sec: 'frac', lvl: 2, kind: 'дробь, выколотые точки',
  st: R`Найдите все значения параметра \(a\), при каждом из которых уравнение \[\frac{x^2-4x+a}{5x^2-6ax+a^2}=0\] имеет ровно два различных решения.`,

  ans: '(-inf;-5)U(-5;0)U(0;3)U(3;4)', need: '=2',

    Q('Знаменатель', R`\(5x^2-6ax+a^2=\)`, ['(5x-a)(x-a)', '(5x+a)(x-a)', '(5x-a)(x+a)', '5(x-a)^2']),
    Q('Числитель', R`Два различных корня \(x^2-4x+a=0\) при`, ['a<4', 'a\\le4', 'a>4', 'a<2'], R`\(x=2\pm\sqrt{4-a}\).`),
    Q('Корень = a', R`\(x=a\) — корень числителя при`, ['a=0;\\ a=3', 'a=0;\\ a=-3', 'a=3', 'a=4'], R`\(a^2-3a=0\).`),
    Q(R`Корень = \(\frac a5\)`, R`\(x=\frac a5\) — корень числителя при`, ['a=0;\\ a=-5', 'a=0;\\ a=5', 'a=-5', 'a=20'], R`\(\frac{a^2}{25}+\frac a5=0\).`)

T({ id: '039', code: '039', src: '18.14', sec: 'abs', lvl: 4, kind: 'чётность, менее двух корней',
  st: R`Найдите все значения параметра \(a\), при каждом из которых уравнение \[x^4+(a-3)^2=|x-a+3|+|x+a-3|\] имеет менее двух корней.`,
  links: L('https://www.geogebra.org/classic/wc8wzf9k', 'https://rutube.ru/video/private/925616f3cd591beae6eadc6f66116307/?p=tEDz8CKbPAOpnYJckFEvbg'),
  ans: '(-inf;1]U[5;inf)', need: '<2',
  an: [
    Q('Замена', R`Обозначим \(b=a-3\). Правая часть \(|x-b|+|x+b|=\)`, ['2\\max(|x|,|b|)', '2|x|', '|x|+|b|', '2\\min(|x|,|b|)']),
    Q('Чётность', 'Что дают симметрии?', ['если x — корень, то и −x — корень', 'корни всегда положительны', 'корень всегда x = 0', 'симметрии нет'], R`Менее двух корней ⇒ корней нет или единственный корень \(x=0\).`),
    Q('Случай |x| < |b|', R`\(x^4+b^2=2|b|\iff\)`, ['x^4=2|b|-b^2', 'x^4=b^2-2|b|', 'x^4=2|b|', 'x^2=2|b|-b^2']),
    Q('Корень x = 0', R`\(x=0\) — корень при`, ['|b|=2\\ \\text{или}\\ b=0', '|b|=1', '|b|=2', 'b=0'], R`\(b^2=2|b|\). При \(b=0\) есть ещё \(x=\pm\sqrt[3]2\).`),
    Q('Итог', 'Менее двух корней при', ['|b|\\ge2', '|b|>2', '|b|\\le2', '|b|\\ge1'], R`При \(|b|>2\) обе части не сходятся: \(x^4+b^2>2\max(|x|,|b|)\). Значит \(a\le1\) или \(a\ge5\).`)
  ],
  g: { va: [0, 6], vx: [-2, 2], keys: [2, 3, 4],
    br: (() => { const B = a => abs(a - 3);
      const c2 = s => a => { const v = 2 * B(a) - B(a) ** 2; const x = v >= -1e-12 ? s * Math.pow(Math.max(0, v), 0.25) : NaN; return x; };
      const s0 = Math.cbrt(0.5);
      const c1 = (s, piece) => a => { const b2 = B(a) ** 2; const r = piece ? bis(u => u ** 4 - 2 * u + b2, 0, s0) : bis(u => u ** 4 - 2 * u + b2, s0, 2); return s * r; };
      return [{ x: c2(1), ok: (x, a, e) => abs(x) < B(a) - e, lab: '|x| < |a−3|' }, { x: c2(-1), ok: (x, a, e) => abs(x) < B(a) - e },
        { x: c1(1, 0), ok: (x, a, e) => abs(x) >= B(a) - e, lab: '|x| ≥ |a−3|' }, { x: c1(-1, 0), ok: (x, a, e) => abs(x) >= B(a) - e }, { x: c1(1, 1), ok: (x, a, e) => abs(x) >= B(a) - e }, { x: c1(-1, 1), ok: (x, a, e) => abs(x) >= B(a) - e }]; })(),
    bnd: [{ a: x => 3 + abs(x) }, { a: x => 3 - abs(x) }],
    brT: R`Два случая: \(|x|<|a-3|\) — кривая \(x^4=2|b|-b^2\); \(|x|\ge|a-3|\) — кривая \(x^4-2|x|+b^2=0\).`, forbT: R`Пунктир — части кривых не в «своём» случае; граница случаев \(|x|=|a-3|\) (красный пунктир).`, keyT: R`Особые: \(a=1,\ 5\) (корень только \(x=0\)), \(a=2,\ 4\) (стык случаев), \(a=3\).` } });

T({ id: '041', code: '041', src: 'Ященко(50) 2026, вар. 46', sec: 'exp', lvl: 1, kind: 'логарифм с параметром в основании',
  st: R`Найдите все значения \(a\), при каждом из которых уравнение \[\log_{a-3{,}5}\left(4x^2+9\right)=\log_{a-3{,}5}\big(4(a-3)x+8\big)\] имеет ровно два различных корня.`,

    Q('Аргументы', R`Почему не нужно отдельно требовать \(4(a-3)x+8>0\)?`, ['он равен 4x² + 9 > 0', 'он всегда положителен', 'из-за основания', 'нужно требовать'], R`Из равенства аргументов: \(4(a-3)x+8=4x^2+9>0\).`),
    Q('Квадратное уравнение', R`\(4x^2+9=4(a-3)x+8\iff\)`, ['4x^2-4(a-3)x+1=0', '4x^2+4(a-3)x+1=0', '4x^2-4(a-3)x+17=0', 'x^2-(a-3)x+1=0']),
    Q('Два корня', R`\(D>0\iff\)`, ['|a-3|>1', '|a-3|<1', 'a>4', '|a-3|\\ge1'], R`\(D=16(a-3)^2-16\). Вместе с \(a>3{,}5,\ a\ne4{,}5\): \(a\in(4;4{,}5)\cup(4{,}5;+\infty)\).`)
  ],
  g: { va: [2.5, 7.5], vx: [-1, 4], dom: (x, a, e) => a > 3.5 + e && Math.abs(a - 4.5) > 1e-9,
    br: [{ x: a => ((a - 3) + sq((a - 3) ** 2 - 1)) / 2, lab: 'a = 3 + x + 1/(4x)' }, { x: a => ((a - 3) - sq((a - 3) ** 2 - 1)) / 2 }],
    hl: [{ a: 4.5, lab: 'a = 4,5 — основание 1' }],
    brT: R`Корни: \(a=3+x+\frac1{4x}\) (ветвь гиперболы при \(x>0\)).`, forbT: R`Запрещено \(a\le3{,}5\) и прямая \(a=4{,}5\) (основание равно 1).`, keyT: R`Вершина ветви: \(a=4\) (\(x=\frac12\)); \(a=4{,}5\) выколота.` } });

T({ id: '042', code: '042', src: '18.30', sec: 'abs', lvl: 1, kind: 'система → одна переменная',
  st: R`Найдите все значения параметра \(a\), при каждом из которых система уравнений \[\begin{cases}x+y=a,\\|y|=|x^2-2x|\end{cases}\] имеет ровно два различных решения.`,
  links: L('https://www.geogebra.org/classic/zzkfqrd8', 'https://rutube.ru/video/private/7c8ba8a0f7b49320a12a466497ecf38a/?p=wOHfDaC5bl-CTRbx-rVWyQ'),
  ans: '(-inf;-1/4)U(9/4;inf)', need: '=2', needText: 'ровно два решения',
  an: [
    Q('Подстановка', R`\(y=a-x\). Тогда:`, ['|a-x|=|x^2-2x|', 'a-x=x^2-2x', '|a+x|=|x^2-2x|', 'a=|x^2-2x|+x']),
    Q('Равенство модулей', R`\(|A|=|B|\iff\)`, ['A=B\\ \\text{или}\\ A=-B', 'A=B', 'A=B,\\ A\\ge0', 'A^2=B'], 'См. теорию: 6.2.'),
    Q('Ветви', 'Выражаем a:', ['a=x^2-x\\ \\text{или}\\ a=3x-x^2', 'a=x^2+x\\ \\text{или}\\ a=3x+x^2', 'a=x^2-x\\ \\text{или}\\ a=x-x^2', 'a=x^2-3x\\ \\text{или}\\ a=x-x^2']),
    Q('Вершины', 'Вершины парабол:', ['a=-\\frac14\\ (x=\\frac12);\\ a=\\frac94\\ (x=\\frac32)', 'a=\\frac14;\\ a=\\frac94', 'a=-\\frac14;\\ a=\\frac32', 'a=0;\\ a=2'], R`Параболы пересекаются в \(x=0\) (\(a=0\)) и \(x=2\) (\(a=2\)).`),
    Q('Подсчёт', R`При \(-\frac14<a<\frac94\) решений:`, ['больше двух (3 или 4)', 'ровно два', 'одно', 'ни одного'], R`Каждому \(x\) соответствует одно решение \((x;\,a-x)\). Два решения — \(a<-\frac14\) или \(a>\frac94\).`)
  ],
  g: { va: [-1.5, 4], vx: [-2, 4],
    br: [{ x: a => (1 + sq(1 + 4 * a)) / 2, lab: 'a = x² − x' }, { x: a => (1 - sq(1 + 4 * a)) / 2 }, { x: a => (3 + sq(9 - 4 * a)) / 2, lab: 'a = 3x − x²' }, { x: a => (3 - sq(9 - 4 * a)) / 2 }],
    brT: R`Переходим в плоскость \((x;a)\): две параболы \(a=x^2-x\) и \(a=3x-x^2\). Каждый корень \(x\) даёт решение \((x;\,a-x)\).`, forbT: 'Ограничений нет.', keyT: R`Особые: вершины \(a=-\frac14,\ \frac94\); пересечения \(a=0,\ 2\).` } });

T({ id: '043', code: '043', src: '91752', sec: 'sys', lvl: 2, kind: 'ромб и гипербола',
  st: R`Найдите все значения параметра \(a\), при каждом из которых система уравнений \[\begin{cases}|x-4|+|y-4|=a,\\xy=4\end{cases}\] имеет ровно два различных решения.`,
  links: L('https://www.geogebra.org/classic/mtqympys', 'https://3.shkolkovo.online/catalog/136/91752', 'https://rutube.ru/video/private/a62152549684df97a1362f2805fa7da5/?p=uBu6aUkLJhjkJydm7URkjg'),
  ans: '{3}U(4;12)', need: '=2',
  an: [
    Q('Первое уравнение', R`\(|x-4|+|y-4|=a\) при \(a>0\) задаёт`, ['ромб (квадрат) с центром (4; 4) и диагоналями 2a', 'окружность радиуса a', 'квадрат со стороной a', 'две прямые'], R`При \(a=0\) — точка \((4;4)\), при \(a<0\) решений нет.`),
    Q('Симметрия', 'Обе фигуры симметричны относительно', ['прямой y = x', 'оси Ox', 'начала координат', 'прямой y = −x'], R`Значит решения парные; нечётное их число — когда есть точка на \(y=x\).`),
    Q('Касание вершинами', 'Ромб проходит через (1; 4) и (4; 1) при', ['a=3', 'a=4', 'a=6', 'a=2'], R`\(|1-4|+0=3\). Тогда ромб касается гиперболы двумя «рёбрами» — ровно 2 решения.`),
    Q('Точка (2; 2)', R`Ромб проходит через \((2;2)\) при`, ['a=4', 'a=3', 'a=8', 'a=2'], R`\(2+2=4\): решений 3. При \(3<a<4\) — 4 решения.`),
    Q('Левая ветвь', R`Ромб задевает ветвь \(x<0\) (точку \((-2;-2)\)) при`, ['a=12', 'a=8', 'a=16', 'a=10'], R`\(6+6=12\). Итог: \(a=3\) и \(4<a<12\).`)
  ],
  g: { va: [0, 15], vx: [-6, 14], vy: [-6, 14],
    fix: [{ F: (x, y) => x * y - 4, lab: 'xy = 4', lx: 0.6, ly: 9 }],
    mov: [{ F: (x, y, a) => abs(x - 4) + abs(y - 4) - a }],
    sol: a => { const out = [], add = x => out.push([x, 4 / x]);
      [(-a + sq(a * a + 16)) / 2].forEach(x => { if (x > 0 && x <= 1 + 1e-12) add(x); });
      const D = (8 - a) ** 2 - 16; if (D >= -1e-12) [((8 - a) + sq(D)) / 2, ((8 - a) - sq(D)) / 2].forEach(x => { if ((x >= 1 - 1e-12 && x <= 4 + 1e-12) || x < 0) add(x); });
      [(a + sq(a * a + 16)) / 2].forEach(x => { if (x >= 4 - 1e-12) add(x); });
      return out; },
    pts: [[1, 4, 0], [4, 1, 0], [2, 2, 0], [-2, -2, 0]],
    fixT: R`Неподвижная фигура — гипербола \(y=\frac4x\).`, forbT: 'Ограничений нет.', movT: '', keyT: R`Ромб с центром \((4;4)\) раздувается. Особые: \(a=3\) (вершины ромба на гиперболе), \(a=4\) (через \((2;2)\)), \(a=12\) (через \((-2;-2)\)).` } });

T({ id: '044', code: '044', src: '111598 Ященко 25', sec: 'sys', lvl: 1, kind: 'уголок и полупарабола',
  st: R`Найдите все значения \(a\), при каждом из которых система уравнений \[\begin{cases}|y|-|x|=a,\\x-4=\sqrt{9-y}\end{cases}\] имеет ровно два различных решения.`,
  links: L('https://www.geogebra.org/classic/dwfqjkce', 'https://3.shkolkovo.online/catalog/4150/111332', 'https://3.shkolkovo.online/catalog/4150/111598', 'https://rutube.ru/video/private/f156734b67d9e465723c83382bfe4871/?p=xD9EBhKOLA8MbTuC1Zz3EQ'),
  ans: '(-7;5]', need: '=2',
  an: [
    Q('Второе уравнение', R`\(x-4=\sqrt{9-y}\iff\)`, ['\\begin{cases}x\\ge4\\\\y=9-(x-4)^2\\end{cases}', 'y=9-(x-4)^2', '\\begin{cases}x\\ge4\\\\y=(x-4)^2-9\\end{cases}', '\\begin{cases}y\\le9\\\\x=4+\\sqrt y\\end{cases}'], 'Половина параболы, вершина (4; 9), ветвь вправо-вниз.'),
    Q('Подстановка', R`При \(x\ge4\): \(|x|=x\). Уравнение для \(x\):`, ['|9-(x-4)^2|-x=a', '9-(x-4)^2-x=a', '|9-(x-4)^2|+x=a', '(x-4)^2-9-x=a']),
    Q('Монотонность', R`\(g(x)=|9-(x-4)^2|-x\) на \([4;+\infty)\):`, ['убывает от 5 до −7 на [4; 7], затем возрастает', 'возрастает всюду', 'убывает всюду', 'убывает от 9 до 0'], R`\(g(4)=5\), \(g(7)=0-7=-7\).`),
    Q('Подсчёт', R`Два решения при`, ['-7<a\\le5', '-7\\le a\\le5', 'a>5', '-7<a<5'], R`При \(a\le5\) горизонталь задевает убывающую часть (включая \(x=4\)) и возрастающую.`)
  ],
  g: { va: [-10, 9], vx: [-12, 14], vy: [-11, 13],
    fix: [{ F: (x, y) => y - 9 + (x - 4) ** 2, ok: (x, y, e) => x >= 4 - e, lab: 'x − 4 = √(9 − y)', lx: 6.2, ly: 9.5 }],
    mov: [{ F: (x, y, a) => abs(y) - abs(x) - a }],
    sol: a => { const out = [];
      const u1 = (-1 + sq(21 - 4 * a)) / 2; if (u1 >= -1e-12 && u1 <= 3 + 1e-12) out.push([4 + u1, 9 - u1 * u1]);
      const u2 = (1 + sq(53 + 4 * a)) / 2; if (u2 >= 3 - 1e-12) out.push([4 + u2, 9 - u2 * u2]);
      return out; },
    pts: [[4, 9, 0], [7, 0, 0]],
    fixT: R`Неподвижная часть — половина параболы \(y=9-(x-4)^2\) при \(x\ge4\) (вершина \((4;9)\)).`, forbT: R`Только \(x\ge4\) — левая половина параболы пунктиром.`, movT: '', keyT: R`«Уголки» \(|y|=|x|+a\) сдвигаются. Особые: \(a=5\) (через \((4;9)\)), \(a=-7\) (через \((7;0)\)).` } });

T({ id: '045', code: '045', src: '20799', sec: 'sys', lvl: 1, kind: 'корни и разложение',
  st: R`Найдите все значения параметра \(a\), при которых система \[\begin{cases}\sqrt{4-y^2}=\sqrt{4-4x^2},\\xy+a^2=ax+ay\end{cases}\] имеет ровно 2 решения.`,
  links: L('https://3.shkolkovo.online/catalog/136/20799', 'https://rutube.ru/video/private/fd0380efd7e8efe2eca60d95805de78b/?p=vf2TlfD0IywrNG_5yNt95g'),
  ans: '[-2;-1)U(1;2]', need: '=2',
  an: [
    Q('Первое уравнение', R`\(\sqrt{4-y^2}=\sqrt{4-4x^2}\iff\)`, ['\\begin{cases}y=\\pm2x\\\\|x|\\le1\\end{cases}', 'y=\\pm2x', '\\begin{cases}y=2x\\\\|x|\\le1\\end{cases}', '\\begin{cases}y=\\pm2x\\\\|y|\\le1\\end{cases}'], R`\(y^2=4x^2\), \(4-4x^2\ge0\). Это «крест» — два отрезка.`),
    Q('Второе уравнение', R`\(xy-ax-ay+a^2=0\iff\)`, ['(x-a)(y-a)=0', '(x+a)(y+a)=0', '(x-a)(y+a)=0', 'x=y=a']),
    Q('Прямая x = a', R`Сколько точек креста на прямой \(x=a\) при \(0<|a|\le1\)?`, ['две: (a; ±2a)', 'одна', 'ни одной', 'четыре']),
    Q('Прямая y = a', R`Точки \((\pm\frac a2;a)\) существуют при`, ['|a|\\le2', '|a|\\le1', '|a|<2', 'a>0']),
    Q('Итог', 'Ровно два решения при', ['1<|a|\\le2', '|a|\\le2', '0<|a|\\le1', '|a|=1'], R`При \(0<|a|\le1\) — четыре решения, при \(a=0\) — одно.`)
  ],
  g: { va: [-3, 3], vx: [-3.2, 3.2], vy: [-3, 3], keys: [0],
    fix: [{ F: (x, y) => y * y - 4 * x * x, ok: (x, y, e) => abs(x) <= 1 + e, lab: 'y = ±2x, |x| ≤ 1', lx: 1.1, ly: 2.4 }],
    mov: [{ F: (x, y, a) => (x - a) * (y - a) }],
    sol: a => { const out = []; if (abs(a) <= 1 + 1e-12) { out.push([a, 2 * a], [a, -2 * a]); } if (abs(a) <= 2 + 1e-12) out.push([a / 2, a], [-a / 2, a]); return out; },
    pts: [[1, 2, 0], [1, -2, 0], [-1, 2, 0], [-1, -2, 0]],
    fixT: R`Неподвижная фигура — «крест»: отрезки \(y=\pm2x\), \(|x|\le1\).`, forbT: R`Части прямых вне \(|x|\le1\) не годятся (пунктир).`, movT: '', keyT: R`Две прямые \(x=a\) и \(y=a\) скользят вдоль биссектрисы. Особые: \(a=0\), \(a=\pm1\), \(a=\pm2\).` } });

T({ id: '046', code: '046', src: '23442', sec: 'sysf', lvl: 1, kind: 'пучок прямых y = ax',
  st: R`Найдите все значения параметра \(a\), при каждом из которых система \[\begin{cases}\dfrac{xy^2-3xy-3y+9}{\sqrt{x+3}}=0,\\y=ax\end{cases}\] имеет три решения.`,
  links: L('https://www.geogebra.org/classic/r9z9txxq', 'https://3.shkolkovo.online/catalog/136/23442', 'https://rutube.ru/video/private/8726af9479055bee0ba483479ef9b356/?p=lUm5_9l8R6K99qff6-3P2Q'),
  ans: '(1/3;3)U(3;inf)', need: '=3',
  an: [
    Q('Разложение', R`\(xy^2-3xy-3y+9=\)`, ['(y-3)(xy-3)', '(y+3)(xy-3)', '(y-3)(xy+3)', '(x-3)(y^2-3)']),
    Q('ОДЗ', 'Ограничение:', ['x>-3', 'x\\ge-3', 'x\\ne-3', 'x>3']),
    Q('Фигура', 'Первое уравнение задаёт:', ['прямую y = 3 и гиперболу xy = 3 при x > −3', 'только гиперболу', 'прямую x = 3 и гиперболу', 'параболу']),
    Q('Пучок y = ax', R`Прямая \(y=ax\) проходит через \((-3;-1)\) — конец гиперболы — при`, ['a=\\frac13', 'a=3', 'a=-\\frac13', 'a=1'], R`При \(a>\frac13\) она пересекает обе ветви гиперболы.`),
    Q('Совпадение', R`Точка пересечения с \(y=3\) совпадает с точкой на гиперболе \((1;3)\) при`, ['a=3', 'a=1', 'a=\\frac13', 'a=9'], R`Итог: три решения при \(a\in(\frac13;3)\cup(3;+\infty)\).`)
  ],
  g: { va: [-3, 6], vx: [-5, 8], vy: [-6, 7], keys: [-1, 0], domXY: (x, y, e) => x > -3 + e,
    fix: [{ F: (x, y) => y - 3, lab: 'y = 3', lx: 5, ly: 3.4 }, { F: (x, y) => x * y - 3, lab: 'xy = 3', lx: 4, ly: 1.4 }],
    mov: [{ F: (x, y, a) => y - a * x }],
    sol: a => { const out = []; if (abs(a) > 1e-12) out.push([3 / a, 3]); if (a > 0) { const r = sqrt(3 / a); out.push([r, a * r], [-r, -a * r]); } return out; },
    pts: [[-3, -1, 1], [-3, 3, 1]],
    fixT: R`Прямая \(y=3\) и гипербола \(xy=3\) — только при \(x>-3\).`, forbT: R`Запрещено \(x\le-3\); концы \((-3;3)\) и \((-3;-1)\) выколоты.`, movT: '', keyT: R`Пучок прямых \(y=ax\) через начало координат. Особые: \(a=\frac13\) (через \((-3;-1)\)), \(a=3\) (через \((1;3)\)), \(a=-1\) (через \((-3;3)\)).` } });

T({ id: '047', code: '047', src: 'Ященко(50) 26, вар. 19', sec: 'sys', lvl: 1, kind: 'ромб и полупарабола',
  st: R`Найдите все положительные значения \(a\), при каждом из которых система уравнений \[\begin{cases}|x|+|y|=a,\\y=\left(\sqrt x\right)^4-3\end{cases}\] имеет ровно два различных решения.`,
  links: L('https://rutube.ru/video/private/9df15732c98a3f6c9032a3721dfde125/?p=tE4sLKRyqaGbdxBgDJMLXQ'),
  ans: '(sqrt(3);3)U{13/4}', need: '=2',
  an: [
    Q('Второе уравнение', R`\(y=(\sqrt x)^4-3\iff\)`, ['y=x^2-3,\\ x\\ge0', 'y=x^2-3', 'y=x^4-3', 'y=x^2-3,\\ x>0'], 'Корень требует x ≥ 0 — правая половина параболы.'),
    Q('Ромб', R`\(|x|+|y|=a\) при \(a>0\):`, ['квадрат с вершинами (±a; 0), (0; ±a)', 'окружность', 'ромб с центром (a; a)', 'две прямые']),
    Q('Вершина (0; −3)', R`Ромб проходит через \((0;-3)\) при`, ['a=3', 'a=\\sqrt3', 'a=\\frac{13}4', 'a=2']),
    Q('Точка (√3; 0)', R`Ромб проходит через \((\sqrt3;0)\) при`, ['a=\\sqrt3', 'a=3', 'a=1', 'a=\\frac{13}4']),
    Q('Касание', R`Сторона \(y=x-a\) касается параболы \(y=x^2-3\) при`, ['a=\\frac{13}4', 'a=3', 'a=\\frac{11}4', 'a=4'], R`\(x^2-x+a-3=0,\ D=13-4a=0\). Итог: \((\sqrt3;3)\cup\{\frac{13}4\}\).`)
  ],
  g: { va: [-0.5, 5], vx: [-5, 5], vy: [-5, 5], dom: (x, a, e) => a > e, keys: [0],
    fix: [{ F: (x, y) => y - x * x + 3, ok: (x, y, e) => x >= -e, lab: 'y = x² − 3, x ≥ 0', lx: 1.9, ly: 3 }],
    mov: [{ F: (x, y, a) => abs(x) + abs(y) - a }],
    sol: a => { if (a <= 0) return []; const out = [];
      const x1 = (-1 + sq(13 + 4 * a)) / 2; if (x1 >= sqrt(3) - 1e-12) out.push([x1, x1 * x1 - 3]);
      const D = 13 - 4 * a; if (D >= -1e-12) [(1 + sq(D)) / 2, (1 - sq(D)) / 2].forEach(x => { if (x >= -1e-12 && x < sqrt(3) - 1e-12) out.push([x, x * x - 3]); });
      return out; },
    pts: [[0, -3, 0], [Math.sqrt(3), 0, 0]],
    fixT: R`Правая половина параболы \(y=x^2-3\), \(x\ge0\).`, forbT: R`Только \(x\ge0\); рассматриваем лишь \(a>0\).`, movT: '', keyT: R`Квадрат \(|x|+|y|=a\) раздувается. Особые: \(a=\sqrt3\), \(a=3\), \(a=\frac{13}4\) (касание).` } });

T({ id: '048', code: '048', src: '513924', sec: 'sysf', lvl: 1, kind: 'пучок прямых, √(6 − x)',
  st: R`Найдите все значения параметра \(a\), при каждом из которых система уравнений \[\begin{cases}\left(xy^2-2xy-6y+12\right)\sqrt{6-x}=0,\\y=ax\end{cases}\] имеет ровно 3 различных решения.`,
  links: L('https://www.geogebra.org/classic/d4ddafy4', 'https://math-ege.sdamgia.ru/problem?id=513924', 'https://rutube.ru/video/b22cc332cc506a04c51981cfa8294ccd/'),
  ans: '(1/6;1/3]U{2/3}', need: '=3',
  an: [
    Q('Разложение', R`\(xy^2-2xy-6y+12=\)`, ['(y-2)(xy-6)', '(y+2)(xy-6)', '(y-2)(xy+6)', '(x-2)(y^2-6)']),
    Q('Фигура', 'Первое уравнение (с ОДЗ x ≤ 6):', ['y = 2, xy = 6 (при x ≤ 6) и вертикаль x = 6', 'только xy = 6', 'y = 2 и x = 6', 'гипербола и парабола']),
    Q('Особые прямые пучка', R`\(y=ax\) проходит через \((6;1)\), \((6;2)\), \((3;2)\) при`, ['a=\\frac16;\\ \\frac13;\\ \\frac23', 'a=6;\\ 3;\\ \\frac32', 'a=\\frac16;\\ \\frac12;\\ \\frac23', 'a=\\frac13;\\ \\frac23;\\ 1']),
    Q('Подсчёт', R`При \(a\in(\frac16;\frac13)\) решений:`, ['три', 'два', 'четыре', 'одно'], R`Точка на \(x=6\), две на гиперболе; с \(y=2\) пересечение при \(x=\frac2a>6\) — вне ОДЗ.`)
  ],
  g: { va: [-0.6, 1.2], vx: [-8, 9], vy: [-6, 8], keys: [0], domXY: (x, y, e) => x <= 6 + e,
    fix: [{ F: (x, y) => y - 2, lab: 'y = 2', lx: -7, ly: 2.4 }, { F: (x, y) => x * y - 6, lab: 'xy = 6', lx: 2, ly: 4 }, { F: (x, y) => x - 6, lab: 'x = 6', lx: 6.2, ly: -5 }],
    mov: [{ F: (x, y, a) => y - a * x }],
    sol: a => { const out = [[6, 6 * a]]; if (abs(a) > 1e-12) out.push([2 / a, 2]); if (a > 0) { const r = sqrt(6 / a); out.push([r, a * r], [-r, -a * r]); } return out; },
    pts: [[6, 1, 0], [6, 2, 0], [3, 2, 0]],
    fixT: R`Прямая \(y=2\), гипербола \(xy=6\) и вертикаль \(x=6\) (корень \(\sqrt{6-x}=0\)) — всё при \(x\le6\).`, forbT: R`Запрещено \(x>6\).`, movT: '', keyT: R`Пучок \(y=ax\). Особые: \(a=\frac16,\ \frac13,\ \frac23\), а также \(a=0\).` } });

T({ id: '049', code: '049', src: '127721', sec: 'sysf', lvl: 1, kind: 'прямые x + y = a',
  st: R`Найдите все значения параметра \(a\), при которых система уравнений \[\begin{cases}\dfrac{\left(y^2-4y-xy+2x+4\right)\sqrt{x+4}}{\sqrt{5-y}}=0,\\a=x+y\end{cases}\] имеет единственное решение.`,
  links: L('https://www.geogebra.org/classic/ktmzuavj', 'https://3.shkolkovo.online/catalog/136/127721', 'https://rutube.ru/video/ca7a7ae2f51857f778110dd68b4c649f/'),
  ans: '(-inf;-6]U{2}U[8;inf)', need: '=1',
  an: [
    Q('Разложение', R`\(y^2-4y+4-x(y-2)=\)`, ['(y-2)(y-2-x)', '(y-2)(y+2-x)', '(y+2)(y-2-x)', '(y-2)^2-x']),
    Q('ОДЗ', 'Ограничения:', ['x\\ge-4,\\ y<5', 'x>-4,\\ y<5', 'x\\ge-4,\\ y\\le5', 'y<5']),
    Q('Фигура', 'Решения первого уравнения:', ['лучи y = 2, y = x + 2 и отрезок x = −4 в области', 'только прямая y = 2', 'парабола', 'две прямые без ограничений'], R`Три линии: \(y=2\) (\(x\ge-4\)), \(y=x+2\) (\(-4\le x<3\)), \(x=-4\) (\(y<5\)).`),
    Q('Особые прямые', R`Прямая \(x+y=a\) проходит через \((-4;-2)\), \((-4;2)\), \((0;2)\), \((3;5)\) при`, ['a=-6;\\ -2;\\ 2;\\ 8', 'a=-6;\\ 2;\\ 0;\\ 8', 'a=-2;\\ -6;\\ 2;\\ 5', 'a=-6;\\ -2;\\ 4;\\ 8'], R`Единственное решение: \(a\le-6\), \(a=2\), \(a\ge8\).`)
  ],
  g: { va: [-9, 11], vx: [-7, 9], vy: [-5, 8], keys: [-2, 1], domXY: (x, y, e) => x >= -4 - e && y < 5 - e,
    fix: [{ F: (x, y) => y - 2, lab: 'y = 2', lx: 6, ly: 2.4 }, { F: (x, y) => y - x - 2, lab: 'y = x + 2', lx: 0.6, ly: 3.6 }, { F: (x, y) => x + 4, lab: 'x = −4', lx: -6.6, ly: -3 }],
    mov: [{ F: (x, y, a) => x + y - a }],
    sol: a => { const out = []; if (a + 4 < 5) out.push([-4, a + 4]); if (a - 2 >= -4) out.push([a - 2, 2]); out.push([(a - 2) / 2, (a + 2) / 2]); return out; },
    pts: [[3, 5, 1], [-4, 5, 1], [-4, -2, 0], [-4, 2, 0], [0, 2, 0]],
    fixT: R`Линии \(y=2\), \(y=x+2\), \(x=-4\) — части в области \(x\ge-4,\ y<5\).`, forbT: R`Запрещено \(x<-4\) и \(y\ge5\).`, movT: '', keyT: R`Прямая \(x+y=a\) движется параллельно. Особые: \(a=-6,\ -2,\ 1,\ 2,\ 8\).` } });

T({ id: '050', code: '050', src: '127878 (аналог 127721)', sec: 'sysf', lvl: 1, kind: 'прямые x + y = a, бесконечно много',
  st: R`Найдите все значения параметра \(a\), при каждом из которых система уравнений \[\begin{cases}\dfrac{\left(y^2-7y+xy-4x+12\right)\sqrt{x-4}}{\sqrt{y+7}}=0,\\a=x+y\end{cases}\] имеет единственное решение.`,
  links: L('https://www.geogebra.org/classic/d43cpjd3', 'https://3.shkolkovo.online/catalog/136/127878'),
  ans: '(-3;3)U(3;8]', need: '=1',
  an: [
    Q('Разложение', R`\(y^2-7y+12+x(y-4)=\)`, ['(y-4)(y-3+x)', '(y-4)(y+3-x)', '(y-3)(y-4+x)', '(y-4)(y-3)']),
    Q('ОДЗ', 'Ограничения:', ['x\\ge4,\\ y>-7', 'x>4,\\ y>-7', 'x\\ge4,\\ y\\ge-7', 'x\\ge4']),
    Q('Случай a = 3', R`При \(a=3\) прямая \(x+y=3\) совпадает с частью фигуры. Решений:`, ['бесконечно много', 'одно', 'два', 'нет']),
    Q('Особые прямые', R`Через \((4;-7)\) и \((4;4)\) проходят прямые с`, ['a=-3;\\ a=8', 'a=-3;\\ a=4', 'a=3;\\ a=8', 'a=-7;\\ a=8'], R`Итог: \(a\in(-3;3)\cup(3;8]\).`)
  ],
  g: { va: [-6, 12], vx: [-2, 14], vy: [-9, 8], domXY: (x, y, e) => x >= 4 - e && y > -7 + e,
    fix: [{ F: (x, y) => y - 4, lab: 'y = 4', lx: 10, ly: 4.5 }, { F: (x, y) => x + y - 3, lab: 'x + y = 3', lx: 8, ly: -4 }, { F: (x, y) => x - 4, lab: 'x = 4', lx: 4.2, ly: 6.5 }],
    mov: [{ F: (x, y, a) => x + y - a }],
    sol: a => { if (Math.abs(a - 3) < 1e-9) return 'inf'; const out = []; if (a - 4 > -7) out.push([4, a - 4]); if (a - 4 >= 4) out.push([a - 4, 4]); return out; },
    pts: [[4, -7, 1], [4, 4, 0], [10, -7, 1]],
    fixT: R`Линии \(y=4\), \(x+y=3\), \(x=4\) в области \(x\ge4,\ y>-7\).`, forbT: R`Запрещено \(x<4\) и \(y\le-7\).`, movT: '', keyT: R`Прямая \(x+y=a\) параллельна отрезку \(x+y=3\). Особые: \(a=-3,\ 3,\ 8\).` } });

/* ===================== БЛОК 4: задачи 051–059 ===================== */
const near = (u, v) => Math.abs(u - v) < 1e-9;

T({ id: '051', code: '051', src: '18.34', sec: 'sys', lvl: 2, kind: 'парабола и крест y = ±x',
  st: R`Найдите все значения параметра \(a\), при каждом из которых система уравнений \[\begin{cases}y=(a+2)x^2+2ax+a-2,\\y^2=x^2\end{cases}\] имеет ровно четыре различных решения.`,
  links: L('https://www.geogebra.org/classic/jgxsetec', 'https://rutube.ru/video/b3e3b68d4c3aa894194f67aabfdd0e99/'),
  ans: '(-17/4;-2)U(-2;2)U(2;17/4)', need: '=4',
  an: [
    Q('Второе уравнение', R`\(y^2=x^2\iff\)`, ['y=x\\ \\text{или}\\ y=-x', 'y=x', 'y=|x|', 'x=y^2']),
    Q('Подстановка y = x', 'Получаем:', ['(a+2)x^2+(2a-1)x+a-2=0', '(a+2)x^2+(2a+1)x+a-2=0', '(a+2)x^2+2ax+a-2=0', '(a+2)x^2-(2a-1)x+a+2=0'], R`\(D_1=17-4a\).`),
    Q('Подстановка y = −x', 'Получаем:', ['(a+2)x^2+(2a+1)x+a-2=0', '(a+2)x^2+(2a-1)x+a-2=0', '(a+2)x^2-2ax+a-2=0', '(a-2)x^2+(2a+1)x+a+2=0'], R`\(D_2=17+4a\).`),
    Q('Особые случаи', R`Почему исключаем \(a=\pm2\)?`, ['a = −2: уравнения линейные; a = 2: общий корень x = 0', 'там D = 0', 'там парабола вырождается в точку', 'исключать не нужно'], R`При \(a=2\) обе прямые проходят через \((0;0)\) — решения совпадают.`),
    Q('Итог', 'Четыре решения при', ['|a|<\\frac{17}4,\\ a\\ne\\pm2', '|a|\\le\\frac{17}4', '|a|<\\frac{17}4', '-\\frac{17}4<a<2'])
  ],
  g: { va: [-5.5, 5.5], vx: [-4, 4], vy: [-4, 4],
    fix: [{ F: (x, y) => y * y - x * x, lab: 'y = ±x', lx: 2.6, ly: 3.2 }],
    mov: [{ F: (x, y, a) => y - ((a + 2) * x * x + 2 * a * x + a - 2) }],
    sol: a => [...quad(a + 2, 2 * a - 1, a - 2).map(x => [x, x]), ...quad(a + 2, 2 * a + 1, a - 2).map(x => [x, -x])],
    fixT: R`Крест: прямые \(y=x\) и \(y=-x\).`, forbT: 'Ограничений нет.', movT: '', keyT: R`Парабола \(y=(a+2)x^2+2ax+a-2\) меняет форму. Особые: \(a=\pm\frac{17}4\) (касание), \(a=-2\) (вырождение в прямую), \(a=2\) (через начало координат).` } });

T({ id: '052', code: '052', src: '90073', sec: 'sys', lvl: 2, kind: 'уголок и парабола',
  st: R`Найдите все значения параметра \(a\), при каждом из которых система уравнений \[\begin{cases}|y|-4x-a=0,\\x^2-2x-y=0\end{cases}\] имеет ровно два различных решения.`,
  links: L('https://www.geogebra.org/classic/d2dxj4sc', 'https://3.shkolkovo.online/catalog/136/90073', 'https://rutube.ru/video/private/f4e975b925cbf2b44764d38843356c2d/?p=JUJF9Sf5yLglSmavBemtKw'),
  ans: '(-9;inf)', need: '=2',
  an: [
    Q('Подстановка', R`\(y=x^2-2x\). Тогда:`, ['|x^2-2x|=4x+a', 'x^2-2x=4x+a', '|x^2-2x|=4x-a', '|x^2-2x|+4x=a']),
    Q('x ≤ 0 или x ≥ 2', 'Уравнение и корни:', ['x^2-6x-a=0,\\ x=3\\pm\\sqrt{9+a}', 'x^2-2x-a=0', 'x^2+2x+a=0', 'x^2-6x+a=0']),
    Q('0 < x < 2', 'Уравнение:', ['x^2+2x+a=0', 'x^2-6x-a=0', 'x^2-2x+a=0', 'x^2+6x+a=0']),
    Q('Подсчёт', R`Сколько решений при \(a>-9\)?`, ['два', 'четыре', 'одно', 'три'], R`Каждая горизонталь в плоскости \((x;a)\) пересекает «склеенный» график ровно дважды. При \(a=-9\) — одно (касание в \(x=3\)).`)
  ],
  g: { va: [-12, 8], vx: [-4, 6], vy: [-3, 10],
    fix: [{ F: (x, y) => y - x * x + 2 * x, lab: 'y = x² − 2x', lx: 3.6, ly: 6 }],
    mov: [{ F: (x, y, a) => abs(y) - 4 * x - a }],
    sol: a => { const out = []; quad(1, -6, -a).forEach(x => { if (x <= 1e-12 || x >= 2 - 1e-12) out.push([x, x * x - 2 * x]); }); quad(1, 2, a).forEach(x => { if (x > 1e-12 && x < 2 - 1e-12) out.push([x, x * x - 2 * x]); }); return out; },
    fixT: R`Парабола \(y=x^2-2x\).`, forbT: 'Ограничений нет.', movT: '', keyT: R`«Уголок» \(|y|=4x+a\) (вершина на оси \(x\)) сдвигается. Особое: \(a=-9\) — касание.` } });

T({ id: '053', code: '053', src: '120329', sec: 'sysf', lvl: 2, kind: 'пучок через (4; 0)',
  st: R`Найдите все значения параметра \(a\), при каждом из которых система уравнений \[\begin{cases}\dfrac{y^2-xy-7y+5x+10}{\sqrt{x+4}\cdot\sqrt{6-y}}=0,\\4a=ax-y\end{cases}\] имеет единственное решение.`,
  links: L('https://www.geogebra.org/classic/knwqkzfb', 'https://3.shkolkovo.online/catalog/136/120329', 'https://rutube.ru/video/private/9d956391bdc277ab8c9255811a872c80/?p=4bQdb7Pq-Fwhxtjo-UT9bw'),
  ans: '{-5}U[-5/8;0]U[1/4;inf)', need: '=1',
  an: [
    Q('Разложение', R`\(y^2-7y+10-x(y-5)=\)`, ['(y-5)(y-2-x)', '(y-5)(y+2-x)', '(y-2)(y-5-x)', '(y-5)(y-2)']),
    Q('ОДЗ', 'Ограничения:', ['x>-4,\\ y<6', 'x\\ge-4,\\ y\\le6', 'x>-4', 'y<6']),
    Q('Пучок', R`Прямая \(y=a(x-4)\) всегда проходит через`, ['(4; 0)', '(0; 4)', '(−4; 0)', '(0; 0)']),
    Q('Граничные прямые', R`Через \((-4;5)\), \((-4;-2)\), \((4;6)\) прямая пучка проходит при`, ['a=-\\frac58;\\ \\frac14;\\ \\text{вертикаль}', 'a=\\frac58;\\ -\\frac14', 'a=-5;\\ \\frac14', 'a=-\\frac58;\\ \\frac12'], R`\((-4;6)\)? Нет: \((4;6)\) лежит на вертикали \(x=4\) — у пучка её нет.`),
    Q('Точка (3; 5)', R`Пересечение \(y=5\) и \(y=x+2\) — точка \((3;5)\). Через неё прямая проходит при`, ['a=-5', 'a=5', 'a=-\\frac53', 'a=1'])
  ],
  g: { va: [-7, 3], vx: [-6, 8], vy: [-4, 8], domXY: (x, y, e) => x > -4 + e && y < 6 - e, keys: [1, 0],
    fix: [{ F: (x, y) => y - 5, lab: 'y = 5', lx: 6, ly: 5.4 }, { F: (x, y) => y - x - 2, lab: 'y = x + 2', lx: 1.2, ly: 2.2 }],
    mov: [{ F: (x, y, a) => y - a * (x - 4) }],
    sol: a => { const out = []; if (!near(a, 0)) out.push([4 + 5 / a, 5]); if (!near(a, 1)) { const x = (4 * a + 2) / (a - 1); out.push([x, x + 2]); } return out; },
    pts: [[-4, 5, 1], [-4, -2, 1], [4, 6, 1], [3, 5, 0], [4, 0, 0]],
    fixT: R`Прямая \(y=5\) и луч \(y=x+2\) в области \(x>-4,\ y<6\).`, forbT: R`Запрещено \(x\le-4\) и \(y\ge6\).`, movT: '', keyT: R`Пучок прямых через \((4;0)\). Особые: \(a=-5,\ -\frac58,\ 0,\ \frac14,\ 1\).` } });

T({ id: '054', code: '054', src: '18.31', sec: 'sys', lvl: 2, kind: 'ромб и √(x + 4)',
  st: R`Найдите все положительные значения параметра \(a\), при каждом из которых система уравнений \[\begin{cases}|x|+|y|=a,\\y=\sqrt{x+4}\end{cases}\] имеет ровно два различных решения.`,
  links: L('https://www.geogebra.org/classic/mxzxtvkt', 'https://rutube.ru/video/9cdc8e612da0285456faf738b5eef1d1/'),
  ans: '(2;4)U{17/4}', need: '=2',
  an: [
    Q('Замена', R`\(s=\sqrt{x+4}\ge0\), \(x=s^2-4\). Так как \(y=s\ge0\):`, ['|s^2-4|+s=a', 's^2-4+s=a', '|s^2-4|-s=a', 's^2+s=a']),
    Q('x ≥ 0 (s ≥ 2)', 'Уравнение:', ['s^2+s-4=a', 's^2-s+4=a', '4-s^2+s=a', 's^2+s+4=a'], 'Возрастает от 2 — один корень при a ≥ 2.'),
    Q('−4 ≤ x < 0 (0 ≤ s < 2)', 'Уравнение:', ['4-s^2+s=a', 's^2+s-4=a', 's^2-s-4=a', '4+s^2-s=a'], R`Максимум \(\frac{17}4\) при \(s=\frac12\).`),
    Q('Итог', 'Ровно два решения при', ['2<a<4\\ \\text{или}\\ a=\\frac{17}4', '2\\le a\\le4', 'a>2', '2<a<\\frac{17}4'], R`При \(a=4\) левая ветвь даёт ещё \(s=0\) и \(s=1\)… проверьте по лучу.`)
  ],
  g: { va: [-0.5, 6], vx: [-6, 6], vy: [-4, 5], dom: (x, a, e) => a > e, keys: [0],
    fix: [{ F: (x, y) => y * y - x - 4, ok: (x, y, e) => y >= -e, lab: 'y = √(x + 4)', lx: 2.5, ly: 2.9 }],
    mov: [{ F: (x, y, a) => abs(x) + abs(y) - a }],
    sol: a => { if (a <= 0) return []; const out = []; quad(1, 1, -4 - a).forEach(s => { if (s >= 2 - 1e-12) out.push([s * s - 4, s]); }); quad(1, -1, a - 4).forEach(s => { if (s >= -1e-12 && s < 2 - 1e-12) out.push([s * s - 4, s]); }); return out; },
    pts: [[-4, 0, 0], [0, 2, 0]],
    fixT: R`Ветвь параболы \(y=\sqrt{x+4}\).`, forbT: R`Только \(y\ge0\), \(x\ge-4\); рассматриваем \(a>0\).`, movT: '', keyT: R`Квадрат \(|x|+|y|=a\) раздувается. Особые: \(a=2\) (через \((0;2)\)), \(a=4\) (через \((-4;0)\)), \(a=\frac{17}4\) (касание).` } });

T({ id: '055', code: '055', src: '18.29', sec: 'sys', lvl: 2, kind: 'уголок и «очки» |y|',
  st: R`Найдите все значения параметра \(a\), при каждом из которых система уравнений \[\begin{cases}y=|x-a|-4,\\4|y|+x^2+8x=0\end{cases}\] имеет ровно четыре различных решения.`,
  links: L('https://www.geogebra.org/classic/gfzgjqt7', 'https://rutube.ru/video/private/bde95d8f42ab2dbf845c47f538a5608a/?p=OGHJJmmMxgZ1pIXhSgMcZA'),
  ans: '(-5;-4)U(-4;-3)', need: '=4',
  an: [
    Q('Второе уравнение', R`\(4|y|=-x^2-8x\) задаёт`, ['две дуги парабол y = ±(16 − (x+4)²)/4 на [−8; 0]', 'окружность', 'параболу y = x² + 8x', 'две прямые']),
    Q('Вершины', 'Вершины дуг:', ['(−4; 4) и (−4; −4)', '(−4; 0)', '(0; ±4)', '(−8; 0) и (0; 0)']),
    Q('Уголок', R`\(y=|x-a|-4\) — уголок с вершиной`, ['(a; −4)', '(−4; a)', '(a; 4)', '(0; a − 4)']),
    Q('Особые положения', R`При \(a=-4\) вершина уголка совпадает с`, ['вершиной нижней дуги (−4; −4)', 'точкой (0; 0)', 'вершиной верхней дуги', 'точкой (−8; 0)'], R`Касания сторон уголка с нижней дугой — при \(a=-5\) и \(a=-3\).`)
  ],
  g: { va: [-12, 5], vx: [-10, 4], vy: [-6, 6], keys: [-8, 0],
    fix: [{ F: (x, y) => 4 * abs(y) + x * x + 8 * x, lab: '4|y| + x² + 8x = 0', lx: -3, ly: 4.6 }],
    mov: [{ F: (x, y, a) => y - abs(x - a) + 4 }],
    sol: a => { const out = []; for (const s of [1, -1]) for (const g of [1, -1]) quad(-s, -(8 * s + 4 * g), 4 * g * a + 16).forEach(x => { if (x < -8 - 1e-9 || x > 1e-9) return; if (g === 1 ? x < a - 1e-12 : x >= a - 1e-12) return; const y = g * (x - a) - 4; if (s * y < -1e-9) return; out.push([x, y]); }); return out; },
    fixT: R`«Очки»: две дуги парабол \(|y|=\frac{-x^2-8x}4\), \(x\in[-8;0]\).`, forbT: 'Ограничений нет.', movT: '', keyT: R`Уголок \(y=|x-a|-4\) едет вдоль прямой \(y=-4\). Особые: \(a=-5,\ -4,\ -3\).` } });

T({ id: '056', code: '056', src: '90067 (аналог 18.29)', sec: 'sys', lvl: 2, kind: 'уголок вниз и «очки»',
  st: R`Найдите все значения параметра \(a\), при каждом из которых система уравнений \[\begin{cases}y=-|x-a|+1,\\|y|+x^2+2x=0\end{cases}\] имеет ровно четыре различных решения.`,
  links: L('https://www.geogebra.org/classic/k5bxrfyp', 'https://3.shkolkovo.online/catalog/136/90067', 'https://rutube.ru/video/private/bde95d8f42ab2dbf845c47f538a5608a/?p=OGHJJmmMxgZ1pIXhSgMcZA'),
  ans: '(-5/4;-1)U(-1;-3/4)', need: '=4',
  an: [
    Q('Второе уравнение', R`\(|y|=-x^2-2x\) задаёт`, ['две дуги y = ±(1 − (x+1)²) на [−2; 0]', 'окружность', 'параболу', 'ромб']),
    Q('Уголок', R`\(y=-|x-a|+1\) — уголок ветвями вниз с вершиной`, ['(a; 1)', '(1; a)', '(a; −1)', '(−a; 1)']),
    Q('a = −1', R`При \(a=-1\) вершина уголка совпадает с`, ['вершиной верхней дуги (−1; 1)', 'точкой (0; 0)', 'точкой (−2; 0)', 'вершиной нижней дуги']),
    Q('Касания', R`Стороны уголка касаются верхней дуги при`, ['a=-\\frac54\\ \\text{и}\\ a=-\\frac34', 'a=-\\frac32;\\ -\\frac12', 'a=-2;\\ 0', 'a=-1'], R`\(-x^2-2x=x-a+1\): \(D=0\).`)
  ],
  g: { va: [-3, 1.5], vx: [-3.2, 1.8], vy: [-2, 2], keys: [-2, 0],
    fix: [{ F: (x, y) => abs(y) + x * x + 2 * x, lab: '|y| + x² + 2x = 0', lx: -0.4, ly: 1.3 }],
    mov: [{ F: (x, y, a) => y + abs(x - a) - 1 }],
    sol: a => { const out = []; for (const s of [1, -1]) for (const g of [1, -1]) quad(-s, g - 2 * s, -(g * a + 1)).forEach(x => { if (x < -2 - 1e-9 || x > 1e-9) return; if (g === 1 ? x < a - 1e-12 : x >= a - 1e-12) return; const y = -g * (x - a) + 1; if (s * y < -1e-9) return; out.push([x, y]); }); return out; },
    fixT: R`«Очки»: дуги \(|y|=-x^2-2x\), \(x\in[-2;0]\).`, forbT: 'Ограничений нет.', movT: '', keyT: R`Уголок \(y=1-|x-a|\) едет вдоль \(y=1\). Особые: \(a=-\frac54,\ -1,\ -\frac34\).` } });

T({ id: '056b', code: '056 (90068)', src: '90068', sec: 'sys', lvl: 2, kind: 'прямая и |y| = x² − 2x',
  st: R`Найдите все значения параметра \(a\), при каждом из которых система уравнений \[\begin{cases}y=4x+a,\\|y|=x^2-2x\end{cases}\] имеет ровно два различных решения.`,
  links: L('https://www.geogebra.org/classic/wq45ejja', 'https://3.shkolkovo.online/catalog/136/90068', 'https://rutube.ru/video/private/758ace7cc231985d1cfcfee9461e21c7/?p=eEUyY9qFiiTKOcerSdNr6g'),
  ans: '(-inf;-9)U(-8;0)U(1;inf)', need: '=2',
  an: [
    Q('Фигура', R`\(|y|=x^2-2x\) задаёт`, ['параболу y = x² − 2x вне (0; 2) и её отражение', 'параболу целиком', 'окружность', 'уголок'], R`Нужно \(x^2-2x\ge0\): \(x\le0\) или \(x\ge2\).`),
    Q('y ≥ 0', R`\(4x+a=x^2-2x\iff\)`, ['x^2-6x-a=0', 'x^2+2x+a=0', 'x^2-6x+a=0', 'x^2-2x-a=0']),
    Q('y < 0', R`\(-(4x+a)=x^2-2x\iff\)`, ['x^2+2x+a=0', 'x^2-6x-a=0', 'x^2-2x+a=0', 'x^2+6x+a=0']),

  ],
  g: { va: [-12, 4], vx: [-4, 6], vy: [-6, 10],

    pts: [[0, 0, 0], [2, 0, 0]],
