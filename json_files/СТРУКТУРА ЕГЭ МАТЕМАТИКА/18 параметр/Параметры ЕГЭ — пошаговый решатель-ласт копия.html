  const box = modal(`<h3>⇅ Резервная копия прогресса<span class="sp"></span><button class="btn sm" data-close>✕</button></h3>
    <p class="meta">${DBS ? 'Прогресс учеников уже сохраняется в приложении. Копия нужна на всякий случай или для переноса.' : 'Прогресс, флаги и рисунки хранятся в этом браузере. Чтобы перенести на другое устройство — сохраните копию и загрузите её там.'}</p>
    <div class="bar"><button class="btn" id="expFile">⬇ Скачать файл</button><button class="btn" id="expCopy">📋 Скопировать текст</button>
      <label class="btn" style="cursor:pointer">⬆ Загрузить файл<input type="file" id="impFile" accept=".json,application/json" hidden></label></div>
    <textarea id="impText" class="inp" rows="4" style="width:100%;margin-top:8px;font-size:12px" placeholder="…или вставьте сюда текст копии и нажмите «Восстановить»"></textarea>
    <div class="bar" style="margin-top:6px"><button class="btn sm" id="impBtn">Восстановить из текста</button><span class="meta" id="impMsg"></span></div>`);
  const data = () => { const o = { v: 5, users: USERS, p: {}, ink: {} }; USERS.forEach(u => { o.p[u] = u === ME ? S : (lsGet('p:' + u) || {}); o.ink[u] = lsGet('ink:' + u) || {}; }); return JSON.stringify(o); };
  $('expFile').onclick = async () => {
    const name = 'parametry-progress-' + new Date().toISOString().slice(0, 10) + '.json', txt = data();
    try { const dl = window.claude && window.claude.use ? await Promise.race([window.claude.use('downloads'), new Promise(r => setTimeout(() => r(null), 1500))]) : null;
      if (dl) { await dl.save({ filename: name, data: txt }); $('impMsg').textContent = 'Файл сохранён ✓'; return; } } catch (e) { $('impMsg').textContent = 'Сохранение отменено — используйте «Скопировать текст».'; return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  };
  $('expCopy').onclick = async () => { const txt = data(); $('impText').value = txt; try { await navigator.clipboard.writeText(txt); $('impMsg').textContent = 'Скопировано ✓'; } catch (e) { $('impText').select(); $('impMsg').textContent = 'Текст в поле — скопируйте вручную.'; } };
  const imp = txt => {
    try { const d = JSON.parse(txt); if (!d || !Array.isArray(d.users)) throw 0;
      d.users.forEach(u => { if (USERS.indexOf(u) < 0) USERS.push(u); lsSet('p:' + u, d.p[u] || {}); if (d.ink && d.ink[u]) lsSet('ink:' + u, d.ink[u]); const keep = ME; ME = u; S = d.p[u] || {}; pushP(); ME = keep; });
      lsSet('users', USERS); S = ME ? (lsGet('p:' + ME) || {}) : {}; Ink.store = null; $('impMsg').textContent = 'Восстановлено ✓'; if (!cur) (ME ? menu() : login());
    } catch (e) { $('impMsg').textContent = 'Не похоже на резервную копию.'; }
  };
  $('impFile').onchange = e => { const f = e.target.files[0]; if (f) f.text().then(imp); e.target.value = ''; };
  $('impBtn').onclick = () => imp($('impText').value);
}

/* ================= запуск ================= */
function init() {
  const th = () => document.documentElement.dataset.theme;
  $('btnTheme').onclick = () => { const t = th() === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = t; lsSet('theme', t); G.draw(); };
  $('fontSizeSel').value = lsGet('font') || 'medium';
  $('fontSizeSel').onchange = e => { document.body.className = document.body.className.replace(/text-\w+/, '') + ' text-' + e.target.value; lsSet('font', e.target.value); setTimeout(() => Ink.resize(), 50); };
  document.body.classList.add('text-' + ($('fontSizeSel').value));
  $('brand').onclick = () => ME ? menu() : login();
  $('btnUser').onclick = () => { $('hdr').classList.remove('open'); ME = ''; lsDel('me'); S = {}; Ink.store = null; Ink.render(); login(); };
  $('btnTheory').onclick = () => { $('hdr').classList.remove('open'); showTheory(); };
  $('btnBackup').onclick = () => { $('hdr').classList.remove('open'); showBackup(); };
  $('btnMenu').onclick = () => $('hdr').classList.toggle('open');
  $('dPrev').onclick = () => goStep(si - 1);
  $('dNext').onclick = () => goStep(si + 1);
  $('dMain').onclick = primary;
  document.addEventListener('keydown', e => {
    if (!cur || mode === 'all' || $('modalRoot').innerHTML) return;
    const tg = e.target; if (tg && (/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName) && tg.type !== 'range')) return;
    if (document.body.classList.contains('drawing')) return;
    if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); if (tg && tg.blur) tg.blur(); primary(); }
    else if (e.key === 'ArrowRight' && tg.type !== 'range') { e.preventDefault(); if (!rev) primary(); else goStep(si + 1); }
    else if (e.key === 'ArrowLeft' && tg.type !== 'range') { e.preventDefault(); goStep(si - 1); }
    else if (/^[1-4]$/.test(e.key) && mode === 'quiz' && !rev) { const b = document.querySelectorAll('#curStep [data-opt]')[+e.key - 1]; if (b) b.click(); }
  });
  Ink.bind();
  header();
  const h = location.hash.replace(/^#t-/, '');
  if (!ME) login(); else if (h && PROBS.find(t => t.id === decodeURIComponent(h))) openT(decodeURIComponent(h)); else menu();
  initCloud();
  mjReady().then(() => { const b = $('boot'); if (b) b.remove(); tx($('app')); });
}
window.__app = { openT: id => openT(id), state: () => ({ cur: cur && cur.id, part, si, rev, mode, finShown }), primary: () => primary(), G };
init();
})();
