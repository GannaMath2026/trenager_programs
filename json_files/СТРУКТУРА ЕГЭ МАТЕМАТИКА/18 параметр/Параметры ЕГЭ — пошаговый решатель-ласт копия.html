<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap&amp;subset=cyrillic" rel="stylesheet">
<title>Параметры ЕГЭ — пошаговый решатель</title>

<style>
:root{
  --bg:#f3f1ec;--bg2:#ebe7de;--cd:#fffdf8;--tx:#1f2430;--mu:#6b6f7a;--br:#e2ddd2;--zb:#f6f3ec;
  --ac:#2f5bd3;--ac2:#7a3fd1;--ac3:#e8eefc;
  --ok:#1d9a55;--okbg:#e6f4ec;--bad:#d33c3c;--badbg:#fbeaea;--wa:#e0a11b;
  --ink:#1f2430;
  --sh:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);--sh2:0 20px 60px rgba(0,0,0,.35);
  --r:16px;--font-base:16px;color-scheme:light;
  /* график */
  --panel:var(--cd);--muted:var(--mu);--line:var(--br);
  --grid:#ebe6db;--axis:#7d7a72;--forb:#d33c3c;--forbfill:rgba(211,60,60,.07);
  --run:#0c8599;--warn:#e8590c;--strip:rgba(29,154,85,.10);--hi:#f08c00;
  --b0:#c2255c;--b1:#1971c2;--b2:#2f9e44;--b3:#e8590c;--b4:#7048e8;--b5:#0c8599;
}
:root[data-theme="dark"]{
  --bg:#14161c;--bg2:#1a1d25;--cd:#1d2029;--tx:#e9ebf1;--mu:#9aa0ad;--br:#2e3341;--zb:#232733;
  --ac:#7c9bff;--ac2:#b08cff;--ac3:#262c45;
  --ok:#3ecf80;--okbg:#17302a;--bad:#ff6b6b;--badbg:#3a1d22;--wa:#f0b43c;
  --ink:#e9ebf1;
  --sh:0 1px 2px rgba(0,0,0,.4);--sh2:0 20px 60px rgba(0,0,0,.6);color-scheme:dark;
  --grid:#262a35;--axis:#8a93a8;--forb:#ff6b6b;--forbfill:rgba(255,107,107,.08);
  --run:#3bc9db;--warn:#ffa94d;--strip:rgba(62,207,128,.10);--hi:#ffb43c;
  --b0:#f06595;--b1:#4dabf7;--b2:#69db7c;--b3:#ffa94d;--b4:#b197fc;--b5:#3bc9db;
}
body.text-small{--font-base:14px}body.text-medium{--font-base:16px}body.text-large{--font-base:19px}
*{box-sizing:border-box}
html{scroll-padding-top:70px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:var(--font-base)/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0)}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .08s}
button:active{transform:scale(.97)}
a{color:var(--ac)}
mjx-container{max-width:100%}
mjx-container[display="true"]{margin:.4em 0!important;overflow-x:auto;overflow-y:hidden}
.mjwait{visibility:hidden}
#boot{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:3000;flex-direction:column;gap:12px;color:var(--mu);font-weight:600}
#boot .spin{width:34px;height:34px;border:4px solid var(--br);border-top-color:var(--ac);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- шапка ---------- */
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--cd);border-bottom:1px solid var(--br)}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:150px;cursor:pointer}
.brand h1{margin:0;font-size:17px;font-weight:700;white-space:nowrap}
.brand small{color:var(--mu);font-weight:400;font-size:13px;margin-left:4px}
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;position:relative}
.hb,#fontSizeSel,.iconbtn{background:var(--cd);border:1px solid var(--br);border-radius:10px;padding:7px 11px;font-size:15px}
.hb.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.hb.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.iconbtn{padding:7px 10px;line-height:1}
#btnMenu{display:none}
main{max-width:980px;margin:0 auto;padding:12px 12px 40px;position:relative}
body.wide main{max-width:1560px}

/* ---------- базовые ---------- */
.card{background:var(--cd);border:1px solid var(--br);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--sh);position:relative}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sp{flex:1}
.btn{border:1px solid var(--br);background:var(--cd);border-radius:10px;padding:7px 11px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover:not(:disabled){border-color:var(--ac)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost.danger{border-color:transparent}
.btn.on{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.on.fav{background:#f5b301;border-color:#f5b301}
.btn.on.hard{background:var(--bad);border-color:var(--bad)}
.btn.on.hw{background:#f26b1d;border-color:#f26b1d}
.btn.sm{padding:3px 8px;font-size:13px;border-radius:8px}
.btn.big{padding:11px 18px;font-weight:600;font-size:16px}
.meta{font-size:13px;color:var(--mu)}
.lv{display:inline-flex;gap:2px;align-items:center;vertical-align:middle}
.lv i{width:7px;height:7px;border-radius:2px;background:var(--br);display:block}
.lv i.on{background:var(--wa)}
.lv.l0 i.on,.lv.l1 i.on{background:var(--ok)}.lv.l3 i.on,.lv.l4 i.on{background:var(--bad)}
.stk{display:inline-block;font:700 12px/1 "Inter",sans-serif;letter-spacing:.4px;padding:5px 9px;border-radius:6px;transform:rotate(-4deg);box-shadow:0 2px 5px rgba(0,0,0,.25);white-space:nowrap;color:#fff;background:linear-gradient(135deg,#1fbf63,#0f8f48)}
.stk.hw{background:linear-gradient(135deg,#ff9f1c,#f26b1d);transform:rotate(3deg)}
.stk.go{background:linear-gradient(135deg,#8a5cf6,#5b3fd1);transform:rotate(2deg);font-size:11px}
.stk.hard{background:linear-gradient(135deg,#ff6b6b,#c92a2a);transform:rotate(-2deg);font-size:11px}
.star{border:0;background:none;padding:0 2px;font-size:19px;color:var(--mu);line-height:1}
.star.on{color:#f5b301}
input.inp,select.inp,textarea.inp{border:1px solid var(--br);background:var(--cd);border-radius:10px;padding:7px 11px;outline:none}
input.inp:focus{border-color:var(--ac)}

/* ---------- вход ---------- */
.login{max-width:560px;margin:30px auto}
.login .ttl{font-size:22px;font-weight:700;margin-bottom:10px}
.ulist{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.ulist span{display:inline-flex;gap:2px;align-items:center}

/* ---------- список ---------- */
.sum{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:8px}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters select,.filters input{border:1px solid var(--br);background:var(--cd);border-radius:10px;padding:7px 11px;min-width:0;max-width:100%}
.filters #fSec{flex:1 1 220px}
.filters input{flex:1;min-width:120px}
.gh{margin:22px 0 4px;font:700 26px/1.1 "Caveat",cursive;display:flex;align-items:baseline;gap:10px;color:var(--ac)}
.gh .cnt{font:500 13px "Inter";color:var(--mu)}
.msec{margin:12px 0 6px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}.msec .cnt,.gh .cnt{font:500 12px 'Inter';color:var(--mu)}
.ssh{margin:10px 0 6px 2px;font-size:13px;font-weight:600;color:var(--mu)}.ssh::before{content:"— "}
.tsec{font-size:11px;padding:1px 6px;border-radius:6px;background:var(--zb);border:1px solid var(--br);margin-left:4px}
.pbar{height:6px;border-radius:4px;background:var(--br);overflow:hidden;flex:0 0 90px}
.pbar i{display:block;height:100%;background:var(--ok)}
.row{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--cd);border:1px solid var(--br);border-radius:12px;margin-bottom:6px;cursor:pointer;position:relative}
.row:hover{border-color:var(--ac)}
.row .ti{font-weight:600;white-space:nowrap}
.row .pv{flex:1;font-size:14px;color:var(--mu);overflow:hidden;white-space:nowrap;min-width:0;text-overflow:ellipsis}
.row.done{background:color-mix(in srgb,var(--ok) 9%,var(--cd));border-left:5px solid var(--ok)}
.row .side{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.parts{display:inline-flex;gap:3px}
.parts b{font:700 11px/1 "Inter";padding:4px 6px;border-radius:6px;background:var(--zb);color:var(--mu);border:1px solid var(--br)}
.parts b.on{background:var(--okbg);color:var(--ok);border-color:transparent}
.empty{text-align:center;color:var(--mu);padding:30px 10px}

/* ---------- задача ---------- */
.lbl{font:700 12px/1.2 "Inter";letter-spacing:.8px;text-transform:uppercase;color:var(--mu);margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cond{font-size:1.08em;margin-top:4px;overflow-wrap:anywhere}
.need{font-size:13px;color:var(--mu);margin-top:6px}
.note{background:color-mix(in srgb,var(--wa) 16%,var(--cd));border-left:4px solid var(--wa);padding:8px 12px;border-radius:8px;margin-top:10px;font-size:14px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.links a{display:inline-flex;align-items:center;gap:7px;text-decoration:none;border:1px solid var(--br);background:var(--zb);border-radius:10px;padding:5px 10px;color:var(--tx);font-weight:500;font-size:14px}
.links a:hover{border-color:var(--ac)}
.links svg{width:17px;height:17px;flex:none}
.modes{display:inline-flex;background:var(--zb);border:1px solid var(--br);border-radius:10px;padding:2px;gap:2px;flex-wrap:wrap}
.modes button{border:0;background:transparent;border-radius:8px;padding:5px 11px;font-weight:600;font-size:13px;color:var(--mu)}
.modes button.on{background:var(--ac);color:#fff}
.partsw{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.partsw button{flex:1 1 220px;display:flex;align-items:center;gap:10px;justify-content:center;border:2px solid var(--br);background:var(--cd);border-radius:14px;padding:10px 14px;font-weight:700;font-size:16px;color:var(--mu)}
.partsw button.on{border-color:var(--ac);color:var(--tx);box-shadow:0 0 0 3px var(--ac3)}
.partsw .ck{font-size:12px;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--zb);color:var(--mu)}
.partsw .ck.ok{background:var(--okbg);color:var(--ok)}
.stepnav{padding:10px 14px;position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:30}
.trh{font-weight:700;font-size:14px;color:var(--mu)}
.pick.res{margin-top:8px;padding-top:8px;border-top:1px dashed color-mix(in srgb,var(--ok) 40%,transparent);font-size:1.06em}.pick .rl{font:700 12px/1 'Inter';letter-spacing:.5px;text-transform:uppercase;color:var(--ok)}
.why{margin-bottom:6px;padding-left:10px;border-left:3px solid var(--hi)}
.roots{margin:12px 2px 0;padding:8px 12px;border-radius:10px;background:var(--ac3);overflow-x:auto}.roots b{font-size:13px;color:var(--ac);margin-right:6px}
.step-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.step-head b{font-size:15px}.step-head b span{color:var(--mu);font-weight:500}
.prog{height:5px;border-radius:4px;background:var(--br);margin:10px 0 2px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .4s}
#stepSlider{display:block;width:100%;margin:8px 0 0;accent-color:var(--ac);cursor:pointer}
.step-scale{display:flex;justify-content:space-between;color:var(--mu);font-size:12px}
.trail{margin-bottom:12px}
.trail summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--mu);list-style:none;display:flex;align-items:center;gap:8px}
.trail summary::-webkit-details-marker{display:none}
.trail summary::before{content:"▸";transition:.2s}
.trail[open] summary::before{transform:rotate(90deg)}
.trail ol{list-style:none;margin:10px 0 0;padding:0}
.trail li{position:relative;padding:8px 12px 8px 44px;border-left:3px solid var(--ac);margin:0 0 8px;background:color-mix(in srgb,var(--ac) 4%,var(--cd));border-radius:0 12px 12px 0;cursor:pointer;overflow-wrap:anywhere}
.trail li.pre{border-left-color:var(--ac2)}
.trail li::before{content:attr(data-n);position:absolute;left:10px;top:9px;width:24px;height:24px;border-radius:50%;background:var(--ac);color:#fff;font:700 12px/24px "Inter";text-align:center}
.trail li.pre::before{background:var(--ac2)}
.trail .tt{font-weight:600;font-size:14px}
.trail .ta{font-size:14px;color:var(--mu);overflow-x:auto}
.fade-in{animation:fi .45s ease both}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.qc{border:2px solid var(--ac)}
.qc.prec{border-color:var(--ac2)}
.st-title{font-size:1.15em;font-weight:700;margin:2px 0 4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chipk{font:700 11px/1 "Inter";letter-spacing:.5px;text-transform:uppercase;padding:5px 8px;border-radius:6px;background:var(--ac3);color:var(--ac)}
.chipk.pre{background:color-mix(in srgb,var(--ac2) 16%,var(--cd));color:var(--ac2)}
.chipk.gr{background:color-mix(in srgb,var(--run) 16%,var(--cd));color:var(--run)}
.todo{position:relative;background:#fff8c4;color:#3b3200;border-radius:4px 4px 14px 4px;padding:16px 14px 12px;box-shadow:0 6px 14px rgba(0,0,0,.12);transform:rotate(-.6deg);margin:16px 2px 4px}
.todo .q{font:600 17px/1.5 "Inter",sans-serif;margin:0;color:#3b3200;overflow-x:auto}
.todo .tk{position:absolute;top:-10px;left:12px;background:#f26b1d;color:#fff;font:700 11px/1 "Inter";letter-spacing:.6px;text-transform:uppercase;padding:5px 8px;border-radius:6px;transform:rotate(-3deg)}
.todo mjx-container{color:#3b3200}
.action{position:relative;margin-top:14px;padding:10px 12px 10px 14px;border-left:3px solid var(--ok);background:color-mix(in srgb,var(--ok) 7%,var(--cd));border-radius:0 12px 12px 0;overflow-x:auto;line-height:1.6}
.action .ah{font:700 12px/1 "Inter";letter-spacing:.6px;text-transform:uppercase;color:var(--ok);margin-bottom:6px}
.action .pick{font-size:1.06em;margin-bottom:4px}
.action.gr{border-left-color:var(--run);background:color-mix(in srgb,var(--run) 7%,var(--cd))}
.action.gr .ah{color:var(--run)}
.action.hi{border-left-color:var(--hi);background:color-mix(in srgb,var(--hi) 10%,var(--cd))}
.action.hi .ah{color:var(--hi)}
.cnt{display:inline-block;padding:1px 9px;border-radius:999px;color:#fff;font-weight:700}
.hint{margin-top:10px;font-size:14px;padding:8px 12px;border-radius:10px;background:var(--zb)}
.stepbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;align-items:center}
.stepbtns .sp{flex:1}
.kbd{font-size:12px;color:var(--mu)}
.kbd kbd{border:1px solid var(--br);border-bottom-width:2px;border-radius:6px;padding:0 5px;font:inherit;font-size:11px;background:var(--zb)}
.opts{display:grid;gap:8px;margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.opt{text-align:left;border:1px solid var(--br);background:var(--cd);border-radius:12px;padding:11px 12px;line-height:1.5;overflow-x:auto;min-height:48px}
.opt:hover{border-color:var(--ac)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--cd));animation:shake .35s}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--cd))}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.final{text-align:center;padding:22px 14px;border:2px solid var(--ok)}
.final .big{display:inline-block;font:700 30px/1.1 "Caveat",cursive;background:#c8f7c5;color:#0f5a2c;padding:12px 24px;transform:rotate(-3deg);box-shadow:0 6px 16px rgba(0,0,0,.18);border-radius:4px;margin-bottom:10px}
.solution-answer{margin:12px auto 6px;padding:10px 14px;border-radius:12px;background:var(--zb);font-size:1.15em;overflow-x:auto;max-width:720px;text-align:center}
.solution-answer b{font-size:13px;color:var(--mu);margin-right:6px;text-transform:uppercase;letter-spacing:.6px}
.allstep{position:relative;padding:10px 12px 10px 44px;border-left:3px solid var(--ac);margin:0 0 12px;background:color-mix(in srgb,var(--ac) 4%,var(--cd));border-radius:0 12px 12px 0;overflow-wrap:anywhere}
.allstep.gr{border-left-color:var(--run)}
.allstep::before{content:attr(data-n);position:absolute;left:10px;top:10px;width:24px;height:24px;border-radius:50%;background:var(--ac);color:#fff;font:700 12px/24px "Inter";text-align:center}
.allstep.gr::before{background:var(--run)}
.allstep h4{margin:0 0 4px;font-size:15px}
.allstep .todo{transform:none;margin:12px 0 4px;box-shadow:0 3px 8px rgba(0,0,0,.08)}
.dock{display:none}
.ray{max-width:720px;margin:8px auto 0}

/* ---------- график ---------- */
.grwrap{display:grid;grid-template-columns:minmax(330px,.85fr) minmax(0,1.35fr);gap:14px;align-items:start}
.gcol{position:sticky;top:64px}
@media (min-width:1151px){#scol .stepnav{top:calc(56px + env(safe-area-inset-top,0px))}#graph{max-height:calc(100vh - 290px)}#scol{padding-bottom:70vh}#ch{padding-bottom:40vh}.gcol .legend{display:none}}
.gcard{padding:10px}
.graph{width:100%;height:auto;display:block;background:var(--cd);border:1px solid var(--br);border-radius:12px;touch-action:none;user-select:none;-webkit-user-select:none}
.ctrl{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.ctrl input[type=range]{flex:1;min-width:120px;accent-color:var(--run)}
.pval{font-variant-numeric:tabular-nums;font-weight:700;min-width:84px}
.status{margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--zb);border:1px solid var(--br);font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--mu);margin-top:6px}
.legend i{width:16px;height:6px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:middle}
@keyframes pulse{0%{r:8}50%{r:14;opacity:.35}100%{r:8}}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.25}50%{opacity:.6}}
.glow{animation:glow 1.4s ease-in-out infinite}

/* ---------- теория ---------- */
.modal{position:fixed;inset:0;background:rgba(10,12,20,.55);z-index:1000;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:20px 10px}
.modal-box{background:var(--bg);border-radius:18px;width:100%;max-width:900px;padding:14px;box-shadow:var(--sh2)}
.modal-box h3{margin:0 0 12px;font-size:18px;display:flex;align-items:center;gap:8px}
.theory-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px;padding:6px 4px 10px}
.sticker{position:relative;padding:22px 16px 14px;color:#2b2a26;box-shadow:0 8px 16px rgba(0,0,0,.15);border-radius:2px 2px 14px 2px;font-size:15px;overflow-wrap:anywhere}
.sticker:nth-child(odd){transform:rotate(-.6deg)}.sticker:nth-child(even){transform:rotate(.5deg)}
.sticker::before{content:"";position:absolute;top:-9px;left:50%;width:70px;height:20px;margin-left:-35px;background:rgba(255,255,255,.55);box-shadow:0 1px 3px rgba(0,0,0,.15);transform:rotate(-2deg)}

<script>
/* ===================== МАТЕМАТИЧЕСКИЙ ДВИЖОК (плоскость x–a) ===================== */
const R = String.raw;
const EPS = 1e-9;
const sq = v => (Math.abs(v) < 1e-9 ? 0 : Math.sqrt(v));
const sqrt = Math.sqrt, ln = Math.log, log2 = Math.log2, log3 = x => Math.log(x) / Math.log(3), abs = Math.abs, pi = Math.PI, inf = Infinity;
const TASKS = [];
/* корни A·x² + B·x + C = 0 (линейное при A≈0, двойной корень при D≈0) */
function quad(A, B, C) { if (Math.abs(A) < 1e-12) return Math.abs(B) < 1e-12 ? [] : [-C / B]; const D = B * B - 4 * A * C; if (D < -1e-10 * Math.max(1, B * B)) return []; const d = Math.abs(D) < 1e-10 * Math.max(1, B * B) ? 0 : Math.sqrt(D); return d === 0 ? [-B / (2 * A)] : [(-B + d) / (2 * A), (-B - d) / (2 * A)]; }
/* корень монотонной/знакопеременной функции на [lo;hi] (бисекция); NaN, если знака не меняет */
function bis(f, lo, hi) { let fl = f(lo), fh = f(hi); if (Math.abs(fl) < 1e-12) return lo; if (Math.abs(fh) < 1e-12) return hi; if (!(fl * fh < 0)) return NaN; for (let k = 0; k < 90; k++) { const m = (lo + hi) / 2, fm = f(m); if (fl * fm <= 0) hi = m; else { lo = m; fl = fm; } } return (lo + hi) / 2; }

/* ---------- множества ответа: "(-3;0)U(0;3]" , "{-7/13}U[5/6;22/5)" ---------- */
function exprVal(s) {
  s = s.trim().replace(/−/g, '-');
  if (s === 'inf' || s === '+inf') return Infinity;
  if (s === '-inf') return -Infinity;
  // eslint-disable-next-line no-new-func
  return Function('sqrt', 'pi', 'cbrt', 'return (' + s.replace(/√/g, 'sqrt') + ')')(Math.sqrt, Math.PI, Math.cbrt);
}
function exprTex(s) {
  s = s.trim().replace(/−/g, '-');
  if (s === 'inf' || s === '+inf') return '+\\infty';
  if (s === '-inf') return '-\\infty';
  let neg = '';
  if (/^-\(.*\)\/\d+$/.test(s) === false && s[0] === '-' && /^-[^+\-]*$/.test(s)) { neg = '-'; s = s.slice(1); }
  s = s.replace(/cbrt\(([^()]+)\)/g, '\\sqrt[3]{$1}').replace(/sqrt\(([^()]+)\)/g, '\\sqrt{$1}').replace(/\*/g, '').replace(/pi/g, '\\pi ');
  const m = s.match(/^\((.+)\)\/(\d+)$/) || s.match(/^([^/()+\-]+|\\sqrt\{[^}]+\})\/(\d+)$/);
  if (m) s = '\\frac{' + m[1] + '}{' + m[2] + '}';
  return (neg + s).replace(/(\d)\.(\d)/g, '$1{,}$2');
}
function parseSet(str) {
  const parts = str.replace(/\s/g, '').split('U');
  const out = [];
  for (const p of parts) {
    if (p[0] === '{') {
      p.slice(1, -1).split(';').forEach(v => out.push({ lo: exprVal(v), hi: exprVal(v), lc: true, hc: true, pt: true, tl: exprTex(v) }));
    } else {
      const lc = p[0] === '[', hc = p[p.length - 1] === ']';
      const [a, b] = p.slice(1, -1).split(';');
      out.push({ lo: exprVal(a), hi: exprVal(b), lc, hc, tl: exprTex(a), th: exprTex(b) });
    }
  }
  return out;
}
function setTex(set) {
  const pts = set.filter(s => s.pt), ivs = set.filter(s => !s.pt);
  const parts = ivs.map(s => (s.lc ? '[' : '(') + s.tl + ';\\,' + s.th + (s.hc ? ']' : ')'));
  if (pts.length) parts.push('\\{' + pts.map(p => p.tl).join(';\\,') + '\\}');
  // упорядочим по левому концу
  const all = set.map((s, i) => ({ s, i }));
  const ordered = [...ivs, ...(pts.length ? [{ lo: Math.min(...pts.map(p => p.lo)), group: true }] : [])].sort((x, y) => x.lo - y.lo);
  const tex = ordered.map(s => s.group ? '\\{' + pts.map(p => p.tl).join(';\\,') + '\\}' : (s.lc ? '[' : '(') + s.tl + ';\\,' + s.th + (s.hc ? ']' : ')')).join('\\cup ');
  return 'a\\in ' + (tex || '\\varnothing');
}
function inSet(set, a) {
  for (const s of set) {
    const t = 1e-9 * Math.max(1, Math.abs(a));
    const lo = s.lc ? a >= s.lo - t : a > s.lo + t;
    const hi = s.hc ? a <= s.hi + t : a < s.hi - t;
    if (lo && hi) return true;
  }
  return false;
}
function setKeys(set) { const k = []; set.forEach(s => { if (isFinite(s.lo)) k.push(s.lo); if (isFinite(s.hi)) k.push(s.hi); }); return k; }
/* дистракторы к ответу: меняем включённость концов, выбрасываем/добавляем точки */
function answerVariants(task) {
  const base = task._set, v = [];
  const clone = s => s.map(x => ({ ...x }));
  const finiteEnds = [];
  base.forEach((s, i) => { if (!s.pt) { if (isFinite(s.lo)) finiteEnds.push([i, 'lc']); if (isFinite(s.hi)) finiteEnds.push([i, 'hc']); } });
  finiteEnds.forEach(([i, k]) => { const c = clone(base); c[i][k] = !c[i][k]; v.push(c); });
  base.forEach((s, i) => { if (s.pt && base.length > 1) { const c = clone(base); c.splice(i, 1); v.push(c); } });
  if (task.wrong) task.wrong.forEach(w => v.push(parseSet(w)));
  const seen = new Set([setTex(base)]), out = [];
  for (const c of v) { const t = setTex(c); if (!seen.has(t)) { seen.add(t); out.push(t); } }
  return out;
}

/* ---------- корни при a = p ---------- */
function domOK(g, x, p) {
  if (g.xr && (x < g.xr[0] - 1e-9 || x > g.xr[1] + 1e-9)) return false;
  return !g.dom || g.dom(x, p, EPS);
}
function solve(task, p) {
  const g = task.g; let xs = [], inf = false;
  if (g.sol) { // система: решения — точки (x; y)
    const r = g.sol(p);
    if (r === 'inf') return { xs: [], inf: true };
    const out = [];
    for (const q of r) { if (!q || !isFinite(q[0]) || !isFinite(q[1])) continue; if (g.domXY && !g.domXY(q[0], q[1], EPS)) continue; if (!out.some(o => Math.abs(o[0] - q[0]) < 1e-10 && Math.abs(o[1] - q[1]) < 1e-10)) out.push(q); }
    return { xs: out, inf: false };
  }
  const lo = g.xr ? g.xr[0] : (g.xc ? g.xc[0] : -60), hi = g.xr ? g.xr[1] : (g.xc ? g.xc[1] : 60);
  for (const b of g.br) {
    const ok = x => domOK(g, x, p) && (!b.ok || b.ok(x, p, EPS));
    if (b.x) { let v = b.x(p); (Array.isArray(v) ? v : [v]).forEach(x => { if (isFinite(x) && ok(x)) xs.push(x); }); }
    else if (b.xLine != null) { if (ok(b.xLine)) xs.push(b.xLine); }
    else if (b.aLine != null) {
      if (Math.abs(p - b.aLine) < 1e-9) { for (let i = 0; i <= 600; i++) { const x = lo + (hi - lo) * i / 600; if (ok(x)) { inf = true; break; } } }
    } else if (b.a) { // a = g(x): ищем корни g(x) - p
      const N = 3000, f = x => b.a(x) - p;
      let px = lo, pf = f(lo);
      if (Math.abs(pf) < 1e-10 && ok(lo)) xs.push(lo);
      for (let i = 1; i <= N; i++) {
        const x = lo + (hi - lo) * i / N, fx = f(x);
        if (isFinite(pf) && isFinite(fx)) {
          if (fx === 0) { if (ok(x)) xs.push(x); }
          else if (pf * fx < 0) { let l = px, r = x, fl = pf; for (let k = 0; k < 80; k++) { const m = (l + r) / 2, fm = f(m); if (fl * fm <= 0) r = m; else { l = m; fl = fm; } } const r0 = (l + r) / 2; if (ok(r0)) xs.push(r0); }
        }
        px = x; pf = fx;
      }
    }
  }
  xs.sort((u, v) => u - v);
  const out = [];
  for (const x of xs) if (!out.length || Math.abs(x - out[out.length - 1]) > 1e-7 * Math.max(1, Math.abs(x))) out.push(x);
  return { xs: out, inf };
}
function needFn(need) {
  if (typeof need === 'function') return need;
  const m = String(need).match(/^(=|>=|<=|<|>)(\d+)$/); const op = m[1], n = +m[2];
  return c => c === Infinity ? (op === '>=' || op === '>') : op === '=' ? c === n : op === '>=' ? c >= n : op === '<=' ? c <= n : op === '<' ? c < n : c > n;
}
function classify(task, p) {
  const r = solve(task, p), c = r.inf ? Infinity : r.xs.length;
  const ok = task.g.cls ? task.g.cls(r, p) : needFn(task.need || '=1')(c);
  return { c, ok, xs: r.xs };
}
function prepTask(t) {
  if (t.region) t.g.region = true;
  t._set = parseSet(t.ans);
  t.answerTex = setTex(t._set);
  const k = new Map(); [...(t.g.keys || []), ...setKeys(t._set)].forEach(v => { const r = v.toFixed(10); if (!k.has(r)) k.set(r, v); });
  t._keys = [...k.values()].filter(v => v >= t.g.va[0] && v <= t.g.va[1]).sort((a, b) => a - b);
  return t;
}
if (typeof module !== 'undefined') module.exports = { TASKS, prepTask, solve, classify, inSet, parseSet, setTex, answerVariants };

/* ===================== БЛОК 1: теория + задачи 001–025 ===================== */
const Q = (t, q, o, ex, h) => ({ t, q, o, ex, h });
const L = (...u) => u;
const SEC = {
  th: ['Теория', 0],
  root: ['Уравнения с корнями', 1],
  prod: ['Произведение = 0 с ОДЗ (ln, log, √)', 2],
  frac: ['Дробно-рациональные уравнения', 3],
  abs: ['Модули', 4],
  exp: ['Показательные и логарифмические', 5],
  fact: ['Квадратные относительно a: разложение', 6],
  subst: ['Замена и монотонность', 7],
  sys: ['Системы: плоскость (x; y)', 8],
  sysf: ['Системы: разложение и ОДЗ', 9]
};
function T(o) { o.secName = SEC[o.sec][0]; o.secOrd = SEC[o.sec][1]; TASKS.push(o); }

/* ---------------- ТЕОРИЯ ---------------- */
T({ id: 'th-roots', code: '000', src: 'Теория', sec: 'th', lvl: 0, kind: 'Работа с корнями — мини-справка', theory: true,
  html: R`
<h4>1. Уравнение \(\sqrt a=b\)</h4>
\[\sqrt a=b\iff\begin{cases}b\ge0\\a=b^2\end{cases}\]
<p class="cm">Правая часть неотрицательна, возводим в квадрат; подкоренное автоматически \(\ge0\).</p>
<h4>2. Уравнение \(\sqrt a=\sqrt b\)</h4>
\[\sqrt a=\sqrt b\iff\begin{cases}a\ge0\\a=b\end{cases}\]
<p class="cm">Ограничение только на одно подкоренное: второе после возведения в квадрат ему равно.</p>
<h4>3. Уравнение \(\sqrt a+\sqrt b=c\)</h4>
\[\begin{cases}c\ge0,\ a\ge0,\ b\ge0\\(\sqrt a+\sqrt b)^2=c^2\end{cases}\ \Rightarrow\ \begin{cases}c\ge0,\ a\ge0,\ b\ge0\\2\sqrt{ab}=c^2-a-b\end{cases}\ \Rightarrow\ \begin{cases}c\ge0,\ a\ge0,\ b\ge0\\c^2-a-b\ge0\\4ab=(c^2-a-b)^2\end{cases}\]
<p class="cm">Изолируем корень, ограничиваем правую часть и снова возводим в квадрат. В конце — проверка всех ограничений.</p>
<h4>4. Модуль при снятии корня</h4>
\[\sqrt{x^2}=|x|,\qquad x^2=a\iff\begin{cases}a\ge0\\x=\pm\sqrt a\end{cases}\]
<p class="cm">Корень чётной степени — всегда модуль, т.е. знак \(\pm\).</p>
<h4>5. Неравенства с корнями — только с развилкой</h4>
<p><b>5.1.</b> \(\sqrt a<b\iff\begin{cases}b>0\\a<b^2\\a\ge0\end{cases}\)</p>
<p class="cm">Число \(b\) обязано быть положительным; ограничиваем правую часть, возводим в квадрат и не забываем подкоренное.</p>
<p><b>5.2.</b> \(\sqrt a>b\): две ветки</p>
\[\left[\begin{aligned}&\begin{cases}b<0\\a\ge0\end{cases}\\&\begin{cases}b\ge0\\a>b^2\end{cases}\end{aligned}\right.\]
<p class="cm">Если справа отрицательное — корень больше при любом допустимом \(a\). Если неотрицательное — в квадрат; ограничение на подкоренное не нужно.</p>` });

T({ id: 'th-abs', code: '000', src: 'Теория', sec: 'th', lvl: 0, kind: 'Модуль в уравнениях и неравенствах', theory: true,
  html: R`
<h4>6.1. Уравнение \(|x|=a\)</h4>
<p><b>Вариант 1</b> (через \(\pm\)): \(\ |x|=a\iff\begin{cases}a\ge0\\x=\pm a\end{cases}\)</p>
<p><b>Вариант 2</b> (совокупность двух систем): \[\left[\begin{aligned}&\begin{cases}x\ge0\\x=a\end{cases}\\&\begin{cases}x<0\\-x=a\end{cases}\end{aligned}\right.\]</p>
<p class="cm">Смотрим, что проще: проще правая часть — способ 1, проще левая — способ 2.</p>
<h4>6.2. Уравнение \(|x|=|y|\)</h4>
\[|x|=|y|\iff\left[\begin{aligned}&x=y\\&x=-y\end{aligned}\right.\]
<p class="cm">Ограничения не нужны.</p>
<h4>6.3. Неравенство \(|x|<a\)</h4>
\[\left[\begin{aligned}&\begin{cases}x\ge0\\x<a\end{cases}\\&\begin{cases}x<0\\-x<a\end{cases}\end{aligned}\right.\]
<h4>6.4. Неравенство \(|x|>a\)</h4>
<p>Если \(a<0\) — верно при всех \(x\in\mathbb R\). Если \(a\ge0\): \[\left[\begin{aligned}&\begin{cases}x\ge0\\x>a\end{cases}\\&\begin{cases}x<0\\-x>a\end{cases}\end{aligned}\right.\]</p>` });

/* ---------------- ЗАДАЧИ ---------------- */
T({ id: '001', code: '001', src: '44993 Ященко 26', sec: 'prod', lvl: 0, kind: 'log = 0, единственный корень',
  st: R`Найдите все значения параметра \(a\), при каждом из которых уравнение \[\frac{\log_{0{,}4}\left(6x^2-13x+5ax-6a^2-13a+6\right)}{\sqrt{2x-3a+4}}=0\] имеет единственный корень.`,
  links: L('https://3.shkolkovo.online/catalog/4150/111345', 'https://3.shkolkovo.online/catalog/4150/44993', 'https://rutube.ru/video/private/0cf38d81903398975eb115529e4bcd0d/?p=75doG-5_MrKQbRA6RJ6-HQ'),
  ans: '{-7/13}U[5/6;22/5)', need: '=1',
  an: [
    Q('ОДЗ', 'Какое ограничение даёт знаменатель?', ['2x-3a+4>0', '2x-3a+4\\ge0', '2x-3a+4\\ne0', 'ограничений нет'], R`Корень в знаменателе: \(2x-3a+4>0\). Аргумент логарифма отдельно ограничивать не нужно — он будет равен \(1\).`, 'Корень стоит в знаменателе — он не может быть равен нулю.'),
    Q('Логарифм равен нулю', R`Когда \(\log_{0{,}4}(\dots)=0\)?`, ['аргумент равен 1', 'аргумент равен 0', 'аргумент равен 0,4', 'аргумент больше 1'], R`\[6x^2-13x+5ax-6a^2-13a+6=1\iff 6x^2-x(13-5a)-6a^2-13a+5=0\]`, R`\(\log_b 1=0\).`),
    Q('Дискриминант', R`Чему равен \(D\)?`, ['(13a+7)^2', '(13a-7)^2', '169a^2+49', '(7a+13)^2'], R`\(D=(13-5a)^2+24(6a^2+13a-5)=169a^2+182a+49=(13a+7)^2\).`, 'Соберите полный квадрат: 169 = 13², 49 = 7².'),
    Q('Корни', 'Найдите корни:', ['x_1=\\frac{5+2a}{3},\\ x_2=\\frac{1-3a}{2}', 'x_1=\\frac{5-2a}{3},\\ x_2=\\frac{1+3a}{2}', 'x_1=\\frac{5+2a}{6},\\ x_2=\\frac{1-3a}{4}', 'x_1=5+2a,\\ x_2=1-3a'], R`\(x=\dfrac{13-5a\pm(13a+7)}{12}\).`, 'Знаменатель формулы корней — 2·6 = 12.'),
    Q(R`Проверка \(x_1\)`, R`\(2x_1-3a+4>0\iff\ ?\)`, ['a<\\frac{22}{5}', 'a>\\frac{22}{5}', 'a<\\frac{5}{6}', 'a\\le\\frac{22}{5}'], R`\(\frac{10+4a}{3}-3a+4>0\Rightarrow 22-5a>0\).`, 'Неравенство строгое.'),
    Q(R`Проверка \(x_2\)`, R`\(2x_2-3a+4>0\iff\ ?\)`, ['a<\\frac56', 'a>\\frac56', 'a<\\frac{22}5', 'a\\le\\frac56'], R`\(1-3a-3a+4>0\Rightarrow a<\frac56\).`),
    Q('Совпадение корней', 'При каком a корни совпадают?', ['a=-\\frac{7}{13}', 'a=\\frac{7}{13}', 'a=-\\frac{13}{7}', 'a=0'], R`\(\frac{5+2a}3=\frac{1-3a}2\Rightarrow 10+4a=3-9a\Rightarrow a=-\frac7{13}\) — оба условия выполнены, корень один. Иначе один корень — когда «живёт» только \(x_1\): \(\frac56\le a<\frac{22}5\).`)
  ],
  g: { va: [-3, 6], vx: [-5, 7], dom: (x, a, e) => 2 * x - 3 * a + 4 > e,
    br: [{ x: a => (5 + 2 * a) / 3, lab: 'x = (5+2a)/3' }, { x: a => (1 - 3 * a) / 2, lab: 'x = (1−3a)/2' }],
    bnd: [{ a: x => (2 * x + 4) / 3, lab: 'a = (2x+4)/3' }],
    brT: R`Корни — прямые \(x=\frac{5+2a}{3}\) и \(x=\frac{1-3a}{2}\) в плоскости \((x;a)\).`,
    forbT: R`Запрещено \(2x-3a+4\le0\), т.е. \(a\ge\frac{2x+4}{3}\) — выше прямой (граница выколота).`,
    keyT: R`Прямые пересекаются при \(a=-\frac7{13}\); вторая выходит из области при \(a=\frac56\), первая — при \(a=\frac{22}5\).` } });

T({ id: '001_', code: '001_', src: '83775 (аналог 26295)', sec: 'root', lvl: 0, kind: 'разложение на множители',
  st: R`Найдите все значения параметра \(a\), при каждом из которых уравнение \[x^2-(x-1)\sqrt{2x-a}=x\] имеет ровно один корень.`,
  links: L('https://www.geogebra.org/classic/syvfuk8g', 'https://3.shkolkovo.online/catalog/7440/26295', 'https://rutube.ru/video/private/bd4f3554cd6b8991b6a1df5e081bb621/?p=hmL8-QLW0irym2dkmxBuXw', 'https://3.shkolkovo.online/catalog/136/83775'),
  ans: '[1;2]', need: '=1',
  an: [
    Q('Ограничение', 'Какое ограничение обязательно?', ['2x-a\\ge0', 'x\\ge0', '2x-a>0', 'x\\ne1'], R`Подкоренное: \(2x-a\ge0\iff x\ge\frac a2\).`),
    Q('Разложение', R`Перенесём \(x\) влево. Как разложить?`, ['(x-1)\\left(x-\\sqrt{2x-a}\\right)=0', '(x-1)\\left(x+\\sqrt{2x-a}\\right)=0', 'x(x-1)-\\sqrt{2x-a}=0', '(x+1)\\left(x-\\sqrt{2x-a}\\right)=0'], R`\(x^2-x=x(x-1)\), выносим \((x-1)\).`, R`\(x^2-x=x(x-1)\).`),
    Q(R`Корень \(x_1=1\)`, R`При каких \(a\) корень \(x=1\) существует?`, ['a\\le2', 'a<2', 'a\\ge2', 'при всех a'], R`\(2\cdot1-a\ge0\Rightarrow a\le2\).`),
    Q(R`Уравнение \(\sqrt{2x-a}=x\)`, 'Равносильная система:', ['\\begin{cases}x\\ge0\\\\a=2x-x^2\\end{cases}', '\\begin{cases}x\\ge0\\\\a=x^2-2x\\end{cases}', 'a=2x-x^2', '\\begin{cases}x>0\\\\a=2x+x^2\\end{cases}'], R`\(\sqrt{M}=N\iff N\ge0,\ M=N^2\). Отсюда \(x_{2,3}=1\pm\sqrt{1-a},\ a\le1\).`),
    Q(R`Проверка \(x\ge0\)`, R`Когда \(x_3=1-\sqrt{1-a}\ge0\)?`, ['0\\le a\\le1', 'a\\le1', 'a\\ge1', 'a<0'], R`\(\sqrt{1-a}\le1\iff a\ge0\). Корень \(x_2=1+\sqrt{1-a}\ge1\) — всегда.`),
    Q('Совпадения', 'При каком a все корни сливаются в x = 1?', ['a=1', 'a=0', 'a=2', 'a=-1'], R`Таблица: \(a<0\) — 2 корня; \(0\le a<1\) — 3; \(a=1\) — 1; \(1<a\le2\) — 1 (только \(x=1\)); \(a>2\) — 0.`)
  ],
  g: { va: [-3, 3.5], vx: [-2, 4], dom: (x, a, e) => 2 * x - a >= -e, keys: [0],
    br: [{ xLine: 1, lab: 'x = 1' }, { x: a => 1 + sq(1 - a), ok: (x, a, e) => x >= -e, lab: 'a = 2x − x²' }, { x: a => 1 - sq(1 - a), ok: (x, a, e) => x >= -e }],
    bnd: [{ a: x => 2 * x, lab: 'a = 2x' }],
    brT: R`Корни: прямая \(x=1\) и парабола \(a=2x-x^2\) (только при \(x\ge0\)).`,
    forbT: R`Запрещено \(2x-a<0\), т.е. \(a>2x\) — выше прямой \(a=2x\). Часть параболы при \(x<0\) — пунктир.`,
    keyT: R`Особые значения: \(a=0\) (парабола проходит через \(x=0\)), \(a=1\) (вершина на прямой \(x=1\)), \(a=2\) (прямая \(x=1\) выходит из области).` } });

T({ id: '002', code: '002', src: '1713', sec: 'exp', lvl: 0, kind: 'замена t = 2ˣ',
  st: R`Найдите все значения параметра \(a\), при каждом из которых уравнение \[2^x-a=\sqrt{4^x-3a}\] имеет единственный корень.`,
  links: L('https://www.geogebra.org/classic/ujt5yff4', 'https://3.shkolkovo.online/catalog/136/1713', 'https://rutube.ru/video/private/dd11fa1ce01fb068242f5eac26631746/?p=ka05-smWYH3eYZVmn8kRwQ'),
  ans: '(-3;0)U(0;3]', need: '=1',
  an: [
    Q('Замена', 'Какую замену удобно сделать?', ['t=2^x,\\ t>0', 't=2^x,\\ t\\in\\mathbb R', 't=4^x,\\ t>0', 't=\\sqrt{4^x-3a}'], R`\(4^x=t^2\): \(\ t-a=\sqrt{t^2-3a},\ t>0\).`),
    Q('Условие перед квадратом', 'Что обязательно добавить?', ['t-a\\ge0', 't^2-3a\\ge0\\ \\text{(только это)}', 't-a>0', '\\text{ничего}'], R`Корень \(\ge0\) ⇒ левая часть \(\ge0\). Условие \(t^2-3a\ge0\) необязательно — оно станет \((t-a)^2\).`),
    Q('Возводим в квадрат', R`Из \((t-a)^2=t^2-3a\) получаем:`, ['2at=a^2+3a', '2at=a^2-3a', '-2at=a^2+3a', 'a^2=3a'], R`\[\begin{cases}t\ge a\\2at=a^2+3a\\t>0\end{cases}\]`),
    Q(R`Случай \(a=0\)`, R`Что будет при \(a=0\)?`, ['0=0 — любое t>0, бесконечно много корней', 'корней нет', 'один корень t=0', 'один корень x=0'], R`\(a=0\) не подходит: корней бесконечно много.`),
    Q(R`Случай \(a\ne0\)`, R`Чему равно \(t\)?`, ['t=\\frac{a+3}{2}', 't=\\frac{a^2+3a}{2}', 't=\\frac{a+3}{2a}', 't=\\frac{2}{a+3}'], R`\(t=\frac{a(a+3)}{2a}=\frac{a+3}2\).`),
    Q('Ограничения', R`\(\frac{a+3}2\ge a\) и \(\frac{a+3}2>0\):`, ['-3<a\\le3', '-3\\le a\\le3', '-3<a<3', 'a\\le3'], R`\(a\le3\) и \(a>-3\). Одно \(t\) ⇒ один \(x=\log_2 t\) (показательная функция монотонна).`)
  ],
  g: { va: [-5, 6.5], vx: [-4.6, 3.4], dom: (x, a, e) => a <= 2 ** x + e,
    br: [{ x: a => log2((a + 3) / 2), lab: 'a = 2ˣ⁺¹ − 3' }, { aLine: 0, lab: 'a = 0' }],
    bnd: [{ a: x => 2 ** x, lab: 'a = 2ˣ' }], hl: [{ a: -3, lab: 'a = −3' }],
    brT: R`Выражаем \(a\): \(a(a+3-2t)=0\iff a=0\) или \(a=2^{x+1}-3\).`,
    forbT: R`Условие \(a\le2^x\): запрещено всё, что выше графика \(a=2^x\). Часть кривой там — пунктир.`,
    keyT: R`Кривая выходит из области в точке \((\log_2 3;\,3)\); слева прижимается к асимптоте \(a=-3\). Прямая \(a=0\) целиком в области — бесконечно много корней.` } });

T({ id: '003', code: '003', src: 'Ященко(50) 26, вар. 6', sec: 'root', lvl: 1, kind: 'ровно три корня',
  st: R`Найдите все значения \(a\), при каждом из которых уравнение \[\sqrt{9x^4+5x^2(3-5x)+a(x^2+a)}=3x^2-5x+a\] имеет ровно три различных корня.`,
  links: L('https://rutube.ru/video/549b9aeb0aac2f02d8cb2c2a4bd81d44/'),
  ans: '[4/3;2)U(2;inf)', need: '=3',
  an: [
    Q('Ограничение', 'Что нужно потребовать перед возведением в квадрат?', ['3x^2-5x+a\\ge0', '9x^4+5x^2(3-5x)+a(x^2+a)\\ge0', '3x^2-5x+a>0', '\\text{ничего}'], R`\(a\ge-3x^2+5x\). Подкоренное после возведения станет квадратом — его не ограничиваем.`),
    Q('Возводим в квадрат', 'После приведения подобных:', ['5x^3-10x^2-5ax^2+10ax=0', '5x^3+10x^2-5ax^2-10ax=0', 'x^3-2x^2=0', '9x^4-25x^3=0'], R`\(9x^4+15x^2-25x^3+ax^2+a^2=9x^4+25x^2+a^2-30x^3+6ax^2-10ax\).`),
    Q('Разложение', 'Разложите на множители:', ['x(x-2)(x-a)=0', 'x(x+2)(x-a)=0', 'x(x-2)(x+a)=0', '(x-2)(x-a)=0'], R`\(x_1=2,\ x_2=0,\ x_3=a\).`),
    Q('Проверка ограничения', R`\(x_3=a\): \(a\ge-3a^2+5a\iff\ ?\)`, ['a\\le0\\ \\text{или}\\ a\\ge\\frac43', '0\\le a\\le\\frac43', 'a\\ge\\frac43', 'a\\le0'], R`\(x_1=2\): \(a\ge-2\); \(\ x_2=0\): \(a\ge0\); \(\ x_3=a\): \(3a^2-4a\ge0\).`),
    Q('Совпадения', 'При каких a корни совпадают?', ['a=0\\ \\text{и}\\ a=2', 'a=2', 'a=0', 'a=\\frac43'], R`Три различных: все условия выполнены одновременно и \(a\ne0,\ a\ne2\).`)
  ],
  g: { va: [-3.5, 4.5], vx: [-2, 4], dom: (x, a, e) => a >= 5 * x - 3 * x * x - e,
    br: [{ xLine: 0, lab: 'x = 0' }, { xLine: 2, lab: 'x = 2' }, { x: a => a, lab: 'x = a' }],
    bnd: [{ a: x => 5 * x - 3 * x * x, lab: 'a = 5x − 3x²' }],
    brT: R`Корни \(x=0,\ x=2,\ x=a\): две вертикали и биссектриса.`,
    forbT: R`Запрещено \(a<5x-3x^2\) — внутри (под) параболой.`,
    keyT: R`\(x=0\) входит при \(a\ge0\); \(x=a\) выходит из запрета при \(a=\frac43\); совпадения \(a=0,\ a=2\).` } });

T({ id: '004', code: '004', src: '111354 Ященко 26', sec: 'root', lvl: 1, kind: 'при a = 0 — множество корней',
  st: R`Найдите все значения параметра \(a\), при каждом из которых уравнение \[|x^2-a^2|=|x+a|\cdot\sqrt{x^2-5ax+4a}\] имеет ровно два различных корня.`,
  links: L('https://3.shkolkovo.online/catalog/4150/45070', 'https://3.shkolkovo.online/catalog/4150/111354', 'https://rutube.ru/video/private/1beb1c1d8948194cb66f7d2def288618/?p=AQBpJ6W7zKHug_Sb7SIRYg'),
  ans: '(-inf;-2)U(-2;-2/3]U(0;inf)', need: '=2',
  an: [
    Q(R`Выносим \(|x+a|\)`, 'Как переписать уравнение?', ['|x+a|\\left(|x-a|-\\sqrt{x^2-5ax+4a}\\right)=0', '|x-a|\\left(|x+a|-\\sqrt{x^2-5ax+4a}\\right)=0', '(x+a)\\left(x-a-\\sqrt{x^2-5ax+4a}\\right)=0', '|x+a|=\\sqrt{x^2-5ax+4a}'], R`\(|x^2-a^2|=|x-a|\,|x+a|\). ОДЗ: \(x^2-5ax+4a\ge0\).`),
    Q(R`Корень \(x=-a\)`, 'При каких a он входит в ОДЗ?', ['a\\le-\\frac23\\ \\text{или}\\ a\\ge0', '-\\frac23\\le a\\le0', 'a\\ge0', '\\text{при всех } a'], R`\(a^2+5a^2+4a=6a^2+4a\ge0\).`),
    Q('Второе уравнение', R`\(|x-a|=\sqrt{x^2-5ax+4a}\) после возведения в квадрат:`, ['3ax=4a-a^2', '3ax=4a+a^2', 'ax=a^2', '-3ax=4a-a^2'], R`ОДЗ выполнится автоматически: подкоренное равно \((x-a)^2\).`),
    Q(R`Случай \(a=0\)`, R`Что при \(a=0\)?`, ['0 = 0 — любое x, бесконечно много корней', 'x = 0 — один корень', 'корней нет', 'x = 4/3'], R`Исходное: \(x^2=|x|\cdot|x|\) — верно всегда. \(a=0\) не подходит.`),
    Q('Совпадение', R`Когда \(-a=\frac{4-a}3\)?`, ['a=-2', 'a=2', 'a=-\\frac23', 'a=1'], R`Итог: \(a\ne0\), \(a\le-\frac23\) или \(a>0\), и \(a\ne-2\).`)
  ],
  g: { va: [-4.5, 3], vx: [-3, 6], dom: (x, a, e) => x * x - 5 * a * x + 4 * a >= -e,
    br: [{ x: a => -a, lab: 'x = −a' }, { x: a => (4 - a) / 3, lab: 'x = (4−a)/3' }, { aLine: 0, lab: 'a = 0' }],
    bnd: [{ F: (x, a) => x * x - 5 * a * x + 4 * a }],
    brT: R`Корни: \(x=-a\), \(x=\frac{4-a}3\) и вся прямая \(a=0\).`,
    forbT: R`Запрещено \(x^2-5ax+4a<0\) (заштриховано).`,
    keyT: R`Прямые пересекаются при \(a=-2\); \(x=-a\) уходит в запрет при \(-\frac23<a<0\).` } });

T({ id: '005', code: '005', src: 'Ященко(36) 26, вар. 31', sec: 'abs', lvl: 1, kind: 'четыре корня, модуль',
  st: R`Найдите все значения \(a\), при каждом из которых уравнение \[(a-x)^2+4a+1=(2x+1)^2-8|x|\] имеет четыре различных корня.`,
  links: L('https://rutube.ru/video/private/57f350f08a22c32a1dadef89811336c5/?p=kw0udXef3zQfMGwIKQwU-w'),
  ans: '(-4;-3)U(-3;-1)U(-1;0)', ansTex: R`a\in(-4;0)\setminus\{-3;-1\}`, need: '=4',
  an: [
    Q('Раскрываем модуль', 'Какие случаи рассматриваем?', ['x\\ge0\\ \\text{и}\\ x<0', 'a\\ge0\\ \\text{и}\\ a<0', 'x\\ge a\\ \\text{и}\\ x<a', 'x\\ge-\\frac12\\ \\text{и}\\ x<-\\frac12']),
    Q(R`Случай \(x\ge0\)`, 'Уравнение при x ≥ 0:', ['3x^2+(2a-4)x-a^2-4a=0', '3x^2+(2a+4)x-a^2-4a=0', '3x^2-(2a-4)x+a^2+4a=0', 'x^2+(2a-4)x-a^2=0'], R`\(D=16(a+1)^2\): \(\ x=-a,\ \ x=\frac{a+4}3\).`),
    Q(R`Случай \(x<0\)`, 'Корни при x < 0:', ['x=\\frac a3,\\ x=-a-4', 'x=-\\frac a3,\\ x=a+4', 'x=\\frac a3,\\ x=a-4', 'x=3a,\\ x=-a-4'], R`\(3x^2+(2a+12)x-a^2-4a=0,\ D=16(a+3)^2\).`),
    Q('Условия знака', 'Все четыре корня в своих промежутках при', ['-4<a<0', '-4\\le a\\le0', 'a<0', '-4<a\\le0'], R`\(-a\ge0,\ \frac{a+4}3\ge0,\ \frac a3<0,\ -a-4<0\).`),
    Q('Совпадения', 'Когда корни сливаются?', ['a=-1\\ \\text{и}\\ a=-3', 'a=-1', 'a=-3', 'a=-2'], R`\(-a=\frac{a+4}3\Rightarrow a=-1\); \(\ \frac a3=-a-4\Rightarrow a=-3\).`)
  ],
  g: { va: [-5.5, 1.5], vx: [-4, 3],
    br: [{ x: a => -a, ok: (x, a, e) => x >= -e, lab: 'x = −a' }, { x: a => (a + 4) / 3, ok: (x, a, e) => x >= -e, lab: 'x = (a+4)/3' },
      { x: a => a / 3, ok: (x, a, e) => x < -e, lab: 'x = a/3' }, { x: a => -a - 4, ok: (x, a, e) => x < -e, lab: 'x = −a−4' }],
    vl: [{ x: 0 }],
    brT: R`При \(x\ge0\): \(x=-a,\ x=\frac{a+4}3\); при \(x<0\): \(x=\frac a3,\ x=-a-4\).`,
    forbT: R`Каждая пара корней живёт в своей полуплоскости (\(x\ge0\) или \(x<0\)); «чужие» части прямых — пунктир.`,
    keyT: R`Пересечения: \(a=-1\) (справа), \(a=-3\) (слева); границы \(a=-4\) и \(a=0\).` } });

T({ id: '006', code: '006', src: '18.1', sec: 'prod', lvl: 1, kind: 'ln, корень на [0;1]',
  st: R`Найдите все значения параметра \(a\), при каждом из которых уравнение \[(5x-2)\cdot\ln(x+a)=(5x-2)\cdot\ln(2x-a)\] имеет ровно один корень на отрезке \([0;1]\).`,
  links: L('https://www.geogebra.org/classic/zjassajw', 'https://rutube.ru/video/private/21a556744f656ca303f62850943e4ab6/?p=DQcfliorPlQOpoZHIt-2ug'),
  ans: '(-2/5;0]U{1/5}U(1/2;4/5)', need: '=1',
  an: [
    Q('ОДЗ', 'Ограничения:', ['\\begin{cases}x+a>0\\\\2x-a>0\\\\x\\in[0;1]\\end{cases}', '\\begin{cases}x+a\\ge0\\\\2x-a\\ge0\\end{cases}', 'x+a>0', '5x-2\\ne0']),
    Q('Разложение', 'Переносим и выносим:', ['(5x-2)\\left(\\ln(x+a)-\\ln(2x-a)\\right)=0', '\\ln(x+a)=\\ln(2x-a)', '(5x-2)\\ln\\frac{x+a}{2x-a}=1', '5x-2=0'], R`\(x_1=\frac25\); \(\ x+a=2x-a\Rightarrow x_2=2a\).`, 'Нельзя сокращать на 5x − 2!'),
    Q(R`Проверка \(x_1=\frac25\)`, 'Подходит при', ['-\\frac25<a<\\frac45', 'a>-\\frac25', 'a<\\frac45', '-\\frac25\\le a\\le\\frac45'], R`\(\frac25+a>0,\ \frac45-a>0\).`),
    Q(R`Проверка \(x_2=2a\)`, 'Подходит при', ['0<a\\le\\frac12', '0\\le a\\le\\frac12', 'a>0', '0<a<\\frac12'], R`\(3a>0,\ a>0,\ 0\le2a\le1\).`),
    Q('Совпадение', 'Когда x₁ = x₂?', ['a=\\frac15', 'a=\\frac25', 'a=\\frac12', 'a=0'], R`Один корень: \(a\in(-\frac25;0]\) (только \(x_1\)), \(a=\frac15\), \(a\in(\frac12;\frac45)\).`)
  ],
  g: { va: [-0.8, 1.1], vx: [-0.25, 1.25], xr: [0, 1], dom: (x, a, e) => x + a > e && 2 * x - a > e,
    br: [{ xLine: 0.4, lab: 'x = 2/5' }, { x: a => 2 * a, lab: 'x = 2a' }],
    bnd: [{ a: x => -x, lab: 'a = −x' }, { a: x => 2 * x, lab: 'a = 2x' }],

T({ id: '0061', code: '0061', src: '21259', sec: 'frac', lvl: 1, kind: 'дробь, два корня',
  st: R`Найдите все значения параметра \(a\), при каждом из которых уравнение \[\frac{4x^2-a^2}{x^2+6x+9-a^2}=0\] имеет ровно два различных корня.`,
  links: L('https://www.geogebra.org/classic/u6rxdjyx', 'https://3.shkolkovo.online/catalog/7199/21259', 'https://rutube.ru/video/12881451a82157f8867052c6213d8b4b/'),
  ans: '(-inf;-6)U(-6;-2)U(-2;0)U(0;2)U(2;6)U(6;inf)', need: '=2',
  an: [

T({ id: '007', code: '007', src: '65516', sec: 'root', lvl: 1, kind: 'корень на [0;1]',
  st: R`Найдите все значения \(a\), при каждом из которых уравнение \[x\sqrt{x-a}=\sqrt{4x^2-(4a+2)x+2a}\] имеет ровно один корень на отрезке \([0;1]\).`,
  links: L('https://3.shkolkovo.online/catalog/136/65516', 'https://rutube.ru/video/private/526b635eef63c2a255472531cde4bdce/?p=gIUwd5_7RmBt2QROUTJF6w'),
  ans: '(-inf;0)U[2-sqrt(2);1]', need: '=1',
  an: [
    Q('Разложим правое подкоренное', R`\(4x^2-(4a+2)x+2a=\)`, ['2(2x-1)(x-a)', '(2x-1)(2x-a)', '2(2x+1)(x-a)', '(4x-1)(x-a)'], R`\(2x(2x-1)-2a(2x-1)\).`),
    Q('Условия', 'Какие условия нужны?', ['x-a\\ge0,\\ x\\ge0', 'x-a\\ge0', 'x\\ge0', 'x-a>0,\\ x>0'], R`Слева произведение должно быть \(\ge0\) ⇒ \(x\ge0\); подкоренное слева \(\ge0\). Правое тогда равно \(x^2(x-a)\ge0\).`),
    Q('Возводим в квадрат', 'Получаем:', ['(x-a)(x^2-4x+2)=0', '(x-a)(x^2-4x-2)=0', '(x-a)(x^2+4x+2)=0', 'x^2(x-a)=0']),
    Q(R`Корни на \([0;1]\)`, 'Какие корни могут лежать на отрезке?', ['x=a\\ \\text{и}\\ x=2-\\sqrt2', 'x=a\\ \\text{и}\\ x=2+\\sqrt2', 'x=2\\pm\\sqrt2', '\\text{только } x=a']),
    Q('Условия существования', R`\(x=2-\sqrt2\) подходит при`, ['a\\le2-\\sqrt2', 'a<2-\\sqrt2', 'a\\ge2-\\sqrt2', '\\text{всегда}'], R`\(x=a\in[0;1]\iff a\in[0;1]\). При \(a=2-\sqrt2\) корни совпадают.`)
  ],
  g: { va: [-1, 1.5], vx: [-0.3, 1.3], xr: [0, 1], dom: (x, a, e) => x - a >= -e,
    br: [{ x: a => a, lab: 'x = a' }, { xLine: 2 - Math.SQRT2, lab: 'x = 2−√2' }],
    bnd: [{ a: x => x, lab: 'a = x' }],
    brT: R`Корни: биссектриса \(x=a\) и вертикаль \(x=2-\sqrt2\).`,
    forbT: R`Запрещено \(a>x\) (выше биссектрисы) и всё вне \(0\le x\le1\).`,
    keyT: R`Особые: \(a=0,\ a=1\) — концы биссектрисы, \(a=2-\sqrt2\) — пересечение.` } });

T({ id: '008', code: '008', src: '639634', sec: 'prod', lvl: 1, kind: '√·ln = 0 на [0;1]',

    Q(R`Отбор на \([\frac14;1]\)`, R`\(x=1-|a|\in[\frac14;1]\iff\)`, ['|a|\\le\\frac34', '|a|<\\frac34', '|a|\\le\\frac54', '|a|\\ge\\frac34'], R`\(x=1+|a|>1\) вне отрезка (кроме \(a=0\), где оба равны 1).`),

  g: { va: [-1.6, 1.6], vx: [-0.25, 1.3], xr: [0, 1], dom: (x, a, e) => 4 * x - 1 >= -e && x * x - 2 * x + 2 - a * a > e,

    brT: R`Корни: вертикаль \(x=\frac14\) и прямые \(x=1\pm a\).`,

T({ id: '009a', code: '009 (аналог)', src: 'аналог 656588', sec: 'root', lvl: 0, kind: '√f = √g на [0;1]',
  st: R`Найдите все значения параметра \(a\), при каждом из которых уравнение \[\sqrt{x^2-a^2}=\sqrt{4x^2-(4a+1)x+a}\] имеет ровно один корень на отрезке \([0;1]\).`,
  links: L('https://math-ege.sdamgia.ru/problem?id=656588', 'https://rutube.ru/video/private/35faca006ce868cb801b84e05f248e36/?p=hXmS5Qt42iU6y-gEYhO7pA'),
  ans: '[-1/4;0)U[1/2;1]', need: '=1',
  an: [
    Q('Переход', R`\(\sqrt f=\sqrt g\iff\)`, ['\\begin{cases}f=g\\\\f\\ge0\\end{cases}', 'f=g', '\\begin{cases}f=g\\\\f>0\\\\g>0\\end{cases}', 'f^2=g^2'], 'Достаточно одного подкоренного.'),
    Q('Разложение', R`\(4x^2-(4a+1)x+a=\)`, ['(4x-1)(x-a)', '(4x+1)(x-a)', '(x-1)(4x-a)', '(2x-1)(2x-a)']),
    Q('Корни', R`\((x-a)(x+a)=(4x-1)(x-a)\Rightarrow\)`, ['x=a\\ \\text{или}\\ x=\\frac{a+1}3', 'x=a\\ \\text{или}\\ x=\\frac{a-1}3', 'x=-a\\ \\text{или}\\ x=\\frac{a+1}3', 'x=\\frac{a+1}3']),
    Q('Проверка', R`\(x=\frac{a+1}3\): \(x^2-a^2\ge0\iff\)`, ['-\\frac14\\le a\\le\\frac12', 'a\\le\\frac12', '-\\frac14<a<\\frac12', 'a\\ge-\\frac14'], R`\(8a^2-2a-1\le0\). Корень \(x=a\) подходит всегда (\(0\ge0\)).`),
    Q('Отрезок и совпадение', 'Корни совпадают при', ['a=\\frac12', 'a=-\\frac14', 'a=1', 'a=0'], R`\(x=a\in[0;1]\); \(\ \frac{a+1}3\in[0;1]\iff a\in[-1;2]\).`)
  ],
  g: { va: [-1, 1.5], vx: [-0.3, 1.3], xr: [0, 1], dom: (x, a, e) => x * x - a * a >= -e,

    bnd: [{ a: x => x }, { a: x => -x }],
    brT: R`Корни: \(x=a\) и \(x=\frac{a+1}3\).`, forbT: R`Запрещено \(|a|>|x|\) и всё вне \([0;1]\).`, keyT: R`Особые: \(a=-\frac14\) (вход), \(a=\frac12\) (пересечение), \(a=0,\ 1\).` } });

T({ id: '010', code: '010', src: '130181', sec: 'prod', lvl: 1, kind: 'ln — общий множитель',
  st: R`Найдите все значения \(a\), при каждом из которых уравнение \[\sqrt{x+3a}\cdot\ln(x-2a)=(x-1)\cdot\ln(x-2a)\] имеет ровно один корень на отрезке \([0;1]\).`,
  links: L('https://www.geogebra.org/classic/pfytnsht', 'https://3.shkolkovo.online/catalog/136/130181', 'https://rutube.ru/video/4ea479d6ce3e3c656f4b15f7935b7c87/'),
  ans: '{-1/3}U[-1/5;0]', need: '=1',
  an: [
    Q('ОДЗ', 'Ограничения:', ['x+3a\\ge0,\\ x-2a>0', 'x+3a>0,\\ x-2a>0', 'x-2a>0', 'x+3a\\ge0']),
    Q('Разложение', 'Выносим общий множитель:', ['\\ln(x-2a)\\left(\\sqrt{x+3a}-x+1\\right)=0', '\\ln(x-2a)\\left(\\sqrt{x+3a}+x-1\\right)=0', '\\sqrt{x+3a}=x-1', '\\ln(x-2a)=0']),
    Q('Логарифм = 0', 'Корень и условие:', ['x=2a+1,\\ a\\ge-\\frac15', 'x=2a+1,\\ a\\ge-\\frac13', 'x=2a-1,\\ a\\ge\\frac15', 'x=2a,\\ a\\ge0'], R`\(x+3a=5a+1\ge0\); на отрезке: \(-\frac12\le a\le0\) ⇒ \(a\in[-\frac15;0]\).`),
    Q(R`\(\sqrt{x+3a}=x-1\)`, R`С учётом \(x\le1\) и \(x-1\ge0\):`, ['x=1,\\ a=-\\frac13', 'x=0,\\ a=0', 'x=1,\\ a=0', '\\text{решений нет}']),
    Q('Итог', R`При \(a=-\frac13\) корень \(2a+1=\frac13\) подходит?`, ['нет: 5a + 1 < 0', 'да', 'да, совпадает с 1', 'нет: x − 2a ≤ 0'], R`Значит при \(a=-\frac13\) корень ровно один.`)
  ],
  g: { va: [-0.7, 0.4], vx: [-0.2, 1.3], xr: [0, 1], dom: (x, a, e) => x + 3 * a >= -e && x - 2 * a > e,

    keyT: R`Кривая касается отрезка только в точке \((1;-\frac13)\); прямая входит в область при \(a=-\frac15\).` } });

  ],
  g: { va: [-5.5, 4.5], vx: [-0.2, 1.3], xr: [0, 1], dom: (x, a, e) => 4 * x - 3 >= -e && 5 * x - a > e && 6 * x + a > e,
    br: [{ xLine: 0.75, lab: 'x = 3/4' }, { x: a => -2 * a, lab: 'x = −2a' }],
    bnd: [{ a: x => 5 * x }, { a: x => -6 * x }],
    brT: R`Корни: \(x=\frac34\) и \(x=-2a\).`, forbT: R`Разрешено \(x\ge\frac34\), \(-6x<a<5x\).`, keyT: R`Особые: \(-\frac92,\ \frac{15}4,\ -\frac12,\ -\frac38\).` } });

T({ id: '011', code: '011', src: '16738', sec: 'prod', lvl: 1, kind: 'показательное × √',
  st: R`Найдите все значения параметра \(a\), при каждом из которых уравнение \[\left(9^x-3\cdot3^x+3a-a^2\right)\cdot\sqrt{2-x}=0\] имеет два различных корня.`,
  links: L('https://www.geogebra.org/classic/etbxfqat', 'https://3.shkolkovo.online/catalog/136/16738', 'https://rutube.ru/video/private/fbb873d067f27e79e96001e4e1734322/?p=EZcqndahQ3fzRwQLSrUJcQ'),
  ans: '(-6;0]U{3/2}U[3;9)', need: '=2',
  an: [
    Q('ОДЗ и корень', 'Что даёт множитель √(2 − x)?', ['x\\le2;\\ x=2\\ \\text{— корень всегда}', 'x<2', 'x\\le2;\\ x=2\\ \\text{— не корень}', 'x\\ge2']),
    Q('Замена', R`\(t=3^x\): \(t^2-3t+3a-a^2=0\iff\)`, ['(t-a)(t-3+a)=0', '(t+a)(t-3-a)=0', '(t-a)(t+3-a)=0', '(t-3)(t-a)=0']),
    Q('Возврат к x', 'Корни:', ['x=\\log_3a\\ (a>0),\\ x=\\log_3(3-a)\\ (a<3)', 'x=\\log_3a,\\ x=\\log_3(a-3)', 'x=3^a,\\ x=3^{3-a}', 'x=\\log_a3']),
    Q('Условие x ≤ 2', R`\(\log_3a\le2\) и \(\log_3(3-a)\le2\):`, ['a\\le9;\\ a\\ge-6', 'a<9;\\ a>-6', 'a\\le9;\\ a\\le-6', 'a\\ge9;\\ a\\ge-6']),
    Q('Совпадения', 'Когда корни сливаются?', ['a=\\frac32;\\ a=9;\\ a=-6', 'a=\\frac32', 'a=9;\\ a=-6', 'a=0;\\ a=3'], R`\(\log_3a=\log_3(3-a)\Rightarrow a=\frac32\); корень \(=2\) при \(a=9\) или \(a=-6\).`)
  ],
  g: { va: [-8, 11], vx: [-4, 3.2], dom: (x, a, e) => x <= 2 + e, keys: [0, 3],
    br: [{ xLine: 2, lab: 'x = 2' }, { x: a => log3(a), lab: 'a = 3ˣ' }, { x: a => log3(3 - a), lab: 'a = 3 − 3ˣ' }],
    brT: R`Корни: \(x=2\), кривые \(a=3^x\) и \(a=3-3^x\).`, forbT: R`Запрещено \(x>2\).`, keyT: R`Особые: \(a=-6,\ 9\) (кривые выходят на \(x=2\)), \(a=\frac32\) (пересечение), асимптоты \(a=0,\ a=3\).` } });

T({ id: '012', code: '012', src: '560735', sec: 'prod', lvl: 1, kind: 'квадрат суммы, ln',
  st: R`Найдите все значения параметра \(a\), при которых уравнение \[\left(x^2-5+\ln(x-a)\right)^2=\left(x^2-5\right)^2+\ln^2(x-a)\] имеет единственное решение на отрезке \([0;3]\).`,
  links: L('https://ege.sdamgia.ru/problem?id=560735', 'https://rutube.ru/video/08a57e0743842bcc83c3d4af64c2c33f/'),
  ans: '(-inf;-1)U{sqrt(5)-1}U(2;sqrt(5))', need: '=1',
  note: R`В ключе PDF записано \((2;+\infty)\). Но при \(a\ge\sqrt5\) условие \(x>a\) не пускает ни \(x=\sqrt5\), ни \(x=a+1\) на отрезок — корней нет. Правильный промежуток: \((2;\sqrt5)\).`,
  an: [
    Q('Раскрываем квадрат', 'После сокращения:', ['2(x^2-5)\\ln(x-a)=0', '(x^2-5)\\ln(x-a)=1', '\\ln(x-a)=0', 'x^2-5=\\ln(x-a)']),
    Q('ОДЗ', 'Ограничение:', ['x>a', 'x\\ge a', 'x>a+1', 'x\\ne a']),
    Q(R`Корни на \([0;3]\)`, 'Кандидаты:', ['x=\\sqrt5\\ \\text{и}\\ x=a+1', 'x=\\pm\\sqrt5\\ \\text{и}\\ x=a+1', 'x=\\sqrt5\\ \\text{и}\\ x=a', 'x=5\\ \\text{и}\\ x=a+1']),
    Q('Условия', 'Когда каждый корень подходит?', ['\\sqrt5:\\ a<\\sqrt5;\\ \\ a+1:\\ -1\\le a\\le2', '\\sqrt5:\\ a\\le\\sqrt5;\\ \\ -1<a<2', '\\sqrt5:\\ a<\\sqrt5;\\ \\ 0\\le a\\le3', 'a+1:\\ a<2'], R`Корень \(a+1\) всегда удовлетворяет \(x>a\).`),
    Q('Совпадение', 'Корни совпадают при', ['a=\\sqrt5-1', 'a=\\sqrt5+1', 'a=1', 'a=2'])
  ],
  g: { va: [-2.5, 3], vx: [-0.3, 3.3], xr: [0, 3], dom: (x, a, e) => x - a > e,
    br: [{ xLine: Math.sqrt(5), lab: 'x = √5' }, { x: a => a + 1, lab: 'x = a+1' }],
    bnd: [{ a: x => x, lab: 'a = x' }],
    brT: R`Корни: \(x=\sqrt5\) и \(x=a+1\).`, forbT: R`Запрещено \(a\ge x\) и всё вне \([0;3]\).`, keyT: R`Особые: \(a=-1,\ 2\) (концы прямой), \(a=\sqrt5-1\) (пересечение), \(a=\sqrt5\).` } });

T({ id: '013', code: '013', src: '514451', sec: 'root', lvl: 1, kind: 'три решения',
  st: R`Найдите все значения \(a\), при каждом из которых уравнение \[\sqrt{x^4-x^2+a^2}=x^2+x-a\] имеет ровно три различных решения.`,
  links: L('https://ege.sdamgia.ru/problem?id=514451', 'https://rutube.ru/video/de8e528d5d8e48e0d6c2fe5ba142b02c/'),
  ans: '(-inf;-1)U(-1;0)', need: '=3',
  an: [
    Q('Ограничение', 'Что требуем?', ['x^2+x-a\\ge0', 'x^4-x^2+a^2\\ge0', 'x^2+x-a>0', '\\text{ничего}']),
    Q('В квадрат', 'После упрощения:', ['2x(x+1)(x-a)=0', '2x(x-1)(x-a)=0', '2x(x+1)(x+a)=0', 'x^2(x-a)=0']),
    Q('Проверка', 'x = 0 и x = −1 подходят при', ['a\\le0', 'a<0', 'a\\ge0', '\\text{всегда}'], R`\(x=a\): \(a^2\ge0\) — всегда.`),
    Q('Совпадения', 'Корни совпадают при', ['a=0;\\ a=-1', 'a=0', 'a=-1', 'a=1'])
  ],
  g: { va: [-3, 2], vx: [-3, 2], dom: (x, a, e) => a <= x * x + x + e,
    br: [{ xLine: 0, lab: 'x = 0' }, { xLine: -1, lab: 'x = −1' }, { x: a => a, lab: 'x = a' }],
    bnd: [{ a: x => x * x + x, lab: 'a = x² + x' }],
    brT: R`Корни: \(x=0,\ x=-1,\ x=a\).`, forbT: R`Запрещено \(a>x^2+x\) — выше параболы.`, keyT: R`Особые: \(a=0\), \(a=-1\).` } });

T({ id: '014', code: '014', src: '393', sec: 'frac', lvl: 1, kind: 'сумма дробей, единственный корень',
  st: R`Найдите все значения параметра \(a\), при которых уравнение \[\frac{x-2a}{x+2}+\frac{x-1}{x-a}=1\] имеет единственный корень.`,
  links: L('https://3.shkolkovo.online/catalog/136/393', 'https://rutube.ru/video/private/046295dcd6707c5ff79d11a96921a89c/?p=OLXfcGQN_SLosP13HqOiGA'),
  ans: '{(-1-sqrt(10))/2;-2;-1;1;(-1+sqrt(10))/2}', need: '=1',
  an: [
    Q('ОДЗ', 'Ограничения:', ['x\\ne-2,\\ x\\ne a', 'x\\ne2,\\ x\\ne a', 'x\\ne-2', 'x\\ne a']),
    Q('Умножаем на знаменатели', 'Получаем:', ['x^2-(2a+1)x+2a^2+2a-2=0', 'x^2-(2a-1)x+2a^2-2a-2=0', 'x^2+(2a+1)x+2a^2+2a+2=0', 'x^2-2ax+2a^2-2=0']),
    Q('D = 0', 'Один корень при D = 0:', ['a=\\frac{-1\\pm\\sqrt{10}}2', 'a=\\frac{1\\pm\\sqrt{10}}2', 'a=-1\\pm\\sqrt{10}', 'a=\\pm\\frac{\\sqrt{10}}2'], R`\(D=-4a^2-4a+9\).`),
    Q('Корень x = −2', 'Квадратное имеет корень −2 при', ['a=-1;\\ a=-2', 'a=1;\\ a=2', 'a=-1', 'a=-2'], R`\(2a^2+6a+4=0\).`),
    Q('Корень x = a', 'Квадратное имеет корень a при', ['a=1;\\ a=-2', 'a=-1;\\ a=2', 'a=1', 'a=2'], R`\(a^2+a-2=0\). Проверка: \(a=-1\Rightarrow x=1\); \(a=1\Rightarrow x=2\); \(a=-2\Rightarrow x=-1\).`)
  ],
  g: { va: [-3, 2.5], vx: [-4, 4], dom: (x, a) => Math.abs(x + 2) > 1e-7 && Math.abs(x - a) > 1e-7,
    br: [{ x: a => ((2 * a + 1) + sq(-4 * a * a - 4 * a + 9)) / 2, lab: 'эллипс' }, { x: a => ((2 * a + 1) - sq(-4 * a * a - 4 * a + 9)) / 2 }],
    exl: [{ xLine: -2, lab: 'x = −2' }, { x: a => a, lab: 'x = a' }],
    pts: [[-2, -1, 1], [-2, -2, 1], [1, 1, 1]],
    brT: R`Корни лежат на эллипсе \(x^2-(2a+1)x+2a^2+2a-2=0\).`, forbT: R`Выколоты прямые \(x=-2\) и \(x=a\).`, keyT: R`Касательные горизонтали \(a=\frac{-1\pm\sqrt{10}}2\); выколотые точки при \(a=-2,\ -1,\ 1\).` } });

T({ id: '015', code: '015', src: '563637', sec: 'abs', lvl: 1, kind: 'группировка модулей',
  st: R`При каких значениях параметра \(a\) уравнение \[|x^2-a^2|+8=|x+a|+8|x-a|\] имеет ровно три различных решения?`,
  links: L('https://ege.sdamgia.ru/problem?id=563637', 'https://rutube.ru/video/586fe01259f8070d32aa2d4478c93318/'),
  ans: '{-4.5;-3.5;3.5;4.5}', need: '=3',
  an: [
    Q('Группировка', 'Уравнение раскладывается:', ['(|x-a|-1)(|x+a|-8)=0', '(|x-a|-8)(|x+a|-1)=0', '(|x-a|+1)(|x+a|-8)=0', '(x-a-1)(x+a-8)=0'], R`\(|x^2-a^2|=|x-a|\,|x+a|\).`),
    Q('Корни', 'Четыре кандидата:', ['x=a\\pm1,\\ x=-a\\pm8', 'x=a\\pm8,\\ x=-a\\pm1', 'x=\\pm a+1', 'x=a\\pm1']),
    Q('Совпадения', 'Ровно три ⇔ два корня совпали:', ['a=\\pm3{,}5;\\ a=\\pm4{,}5', 'a=\\pm3{,}5', 'a=\\pm4{,}5', 'a=\\pm1;\\ a=\\pm8'], R`\(a+1=8-a\Rightarrow3{,}5\); \(a-1=8-a\Rightarrow4{,}5\); симметрично отрицательные.`)
  ],
  g: { va: [-6, 6], vx: [-11, 11],
    br: [{ x: a => a + 1, lab: 'x = a+1' }, { x: a => a - 1, lab: 'x = a−1' }, { x: a => 8 - a, lab: 'x = 8−a' }, { x: a => -a - 8, lab: 'x = −a−8' }],
    brT: R`Четыре прямые: \(x=a\pm1\), \(x=-a\pm8\).`, forbT: 'Ограничений нет.', keyT: R`Пересечения при \(a=\pm3{,}5\) и \(a=\pm4{,}5\).` } });

T({ id: '016', code: '016', src: '13169', sec: 'abs', lvl: 2, kind: 'линейно по a',
  st: R`Найдите все значения параметра \(a\), при каждом из которых уравнение \[a|x+2|+(1-a)|x-2|+3=0\] имеет ровно два различных решения.`,
  links: L('https://rutube.ru/video/74dd664338ae879ce9fe7d07bfa74d20/', 'https://3.shkolkovo.online/catalog/136/13169', 'https://rutube.ru/video/private/759f6e0ee98652814ebba3952f7a3ccf/?p=TMRt1PdwCWbmaNPBfdCkBQ'),
  ans: '(-inf;-3/4)U(7/4;inf)', need: '=2',
  an: [
    Q('Промежутки', 'На какие части делим ось?', ['x<-2,\\ -2\\le x<2,\\ x\\ge2', 'x<0,\\ x\\ge0', 'x<-2,\\ x\\ge2', 'x<a,\\ x\\ge a']),
    Q('x ≥ 2', 'Корень и условие:', ['x=-4a-1,\\ a\\le-\\frac34', 'x=4a+1,\\ a\\ge\\frac14', 'x=-4a+1,\\ a\\le-\\frac14', 'x=-4a-1,\\ a\\ge-\\frac34'], R`\(x+4a+1=0\).`),
    Q('x < −2', 'Корень и условие:', ['x=5-4a,\\ a>\\frac74', 'x=5+4a,\\ a<-\\frac74', 'x=4a-5,\\ a<\\frac34', 'x=5-4a,\\ a<\\frac74'], R`\(-x-4a+5=0\).`),
    Q('−2 ≤ x < 2', R`\((2a-1)x=-5\):`, ['x=\\frac5{1-2a},\\ a<-\\frac34\\ \\text{или}\\ a\\ge\\frac74', 'x=\\frac5{2a-1},\\ a>\\frac12', 'x=\\frac5{1-2a},\\ -\\frac34<a<\\frac74', 'x=\\frac{-5}{1-2a},\\ a\\ne\\frac12']),
    Q('Подсчёт', 'При a = −3/4 корней:', ['один (x = 2)', 'два', 'ни одного', 'три'], R`Два корня: \(a<-\frac34\) или \(a>\frac74\).`)
  ],
  g: { va: [-4, 5], vx: [-12, 12],
    br: [{ x: a => -4 * a - 1, ok: (x, a, e) => x >= 2 - e, lab: 'x = −4a−1' }, { x: a => 5 - 4 * a, ok: (x, a, e) => x < -2 - e, lab: 'x = 5−4a' }, { x: a => 5 / (1 - 2 * a), ok: (x, a, e) => x >= -2 - e && x < 2 - e, lab: 'x = 5/(1−2a)' }],
    vl: [{ x: -2 }, { x: 2 }],
    brT: R`Три ветви — по одной на каждом промежутке.`, forbT: R`Ветви живут только в своих полосах; вне — пунктир.`, keyT: R`Стыки ветвей: \(a=-\frac34\) (в точке \(x=2\)) и \(a=\frac74\) (в \(x=-2\)).` } });

T({ id: '017', code: '017', src: '25028', sec: 'root', lvl: 2, kind: 'сумма корней, хотя бы одно решение',
  st: R`Найдите все значения параметра \(a\), при каждом из которых уравнение \[\sqrt{x+2a-1}+\sqrt{x-a}=1\] имеет хотя бы одно решение.`,
  links: L('https://3.shkolkovo.online/catalog/136/25028', 'https://rutube.ru/video/private/40552c8713a990a01e730ace24517f29/?p=pLUTjwmca7WCmlMnF0XIRQ'),
  ans: '[0;2/3]', need: '>=1',
  an: [
    Q('ОДЗ', 'Ограничения:', ['x\\ge a,\\ x\\ge1-2a', 'x>a,\\ x>1-2a', 'x\\ge a', 'x\\ge1-2a']),
    Q('Замена', R`\(u=\sqrt{x-a}\ge0\). Тогда \(x+2a-1=\)`, ['u^2+3a-1', 'u^2+a-1', 'u^2-3a+1', 'u+3a-1']),
    Q('Изолируем корень', R`\(\sqrt{u^2+3a-1}=1-u\Rightarrow\)`, ['u=\\frac{2-3a}2,\\ 0\\le u\\le1', 'u=\\frac{3a-2}2,\\ u\\ge0', 'u=2-3a,\\ 0\\le u\\le1', 'u=\\frac{2-3a}2,\\ u\\ge1'], R`\(u^2+3a-1=1-2u+u^2\).`),
    Q('Условие на a', R`\(0\le\frac{2-3a}2\le1\iff\)`, ['0\\le a\\le\\frac23', '0<a<\\frac23', 'a\\le\\frac23', '-\\frac23\\le a\\le0'], R`Тогда \(x=a+\left(\frac{2-3a}2\right)^2\).`)
  ],
  g: { va: [-1, 1.5], vx: [-1, 2], dom: (x, a, e) => x - a >= -e && x + 2 * a - 1 >= -e,
    br: [{ x: a => a + ((2 - 3 * a) / 2) ** 2, ok: (x, a, e) => a >= -e && a <= 2 / 3 + e, lab: 'x = a + (1 − 1,5a)²' }],
    bnd: [{ a: x => x, lab: 'a = x' }, { a: x => (1 - x) / 2, lab: 'a = (1−x)/2' }],
    brT: R`Решение: \(x=a+\left(1-\frac32a\right)^2\) при \(0\le a\le\frac23\) — дуга параболы.`, forbT: R`Разрешено \(x\ge a\) и \(x\ge1-2a\).`, keyT: R`Концы дуги: \(a=0\) (\(x=1\)) и \(a=\frac23\) (\(x=\frac23\)).` } });

T({ id: '018', code: '018', src: '88579', sec: 'prod', lvl: 2, kind: 'круг в ОДЗ, корень на [4;8]',
  st: R`Найдите все значения параметра \(a\), при каждом из которых уравнение \[\frac{(x-a-7)(x+a-2)}{\sqrt{10x-x^2-a^2}}=0\] имеет ровно один корень на отрезке \([4;8]\).`,
  links: L('https://www.geogebra.org/classic/fhtcje5h', 'https://3.shkolkovo.online/catalog/136/88579', 'https://rutube.ru/video/e06061dff53c4e5d2de04634fbbe8109/'),
  ans: '((-3-sqrt(41))/2;-3)U{-5/2}U(-2;1]', need: '=1',
  note: R`В ключе PDF у левого конца потерян знак: правильно \(\frac{-3-\sqrt{41}}2\approx-4{,}70\).`,
  an: [
    Q('ОДЗ', R`\(10x-x^2-a^2>0\iff\)`, ['(x-5)^2+a^2<25', '(x-5)^2+a^2\\le25', '(x+5)^2+a^2<25', 'x^2+a^2<10x+25'], 'Внутренность круга радиуса 5 с центром (5; 0).'),
    Q('Корни', 'Числитель = 0:', ['x=a+7,\\ x=2-a', 'x=a-7,\\ x=a+2', 'x=7-a,\\ x=a-2', 'x=a+7,\\ x=a-2']),
    Q('x = a + 7', 'На [4; 8] и в круге:', ['-3\\le a\\le1', '-3<a<1', '-4\\le a\\le1', '-3\\le a\\le2'], R`Круг: \(2a^2+4a-21<0\) — на \([-3;1]\) выполнено.`),
    Q('x = 2 − a', 'На [4; 8] и в круге:', ['\\frac{-3-\\sqrt{41}}2<a\\le-2', '-6\\le a\\le-2', '\\frac{-3-\\sqrt{41}}2\\le a\\le-2', '-6<a<-2'], R`Отрезок: \(a\in[-6;-2]\); круг: \(a^2+3a-8<0\).`),
    Q('Совпадение', 'Корни совпадают при', ['a=-\\frac52', 'a=-3', 'a=-2', 'a=\\frac52'])
  ],
  g: { va: [-6.5, 6.5], vx: [-3.4, 13.4], xr: [4, 8], dom: (x, a, e) => (x - 5) ** 2 + a * a < 25 - e,
    br: [{ x: a => a + 7, lab: 'x = a+7' }, { x: a => 2 - a, lab: 'x = 2−a' }],
    bnd: [{ F: (x, a) => (x - 5) ** 2 + a * a - 25 }],
    brT: R`Корни: прямые \(x=a+7\) и \(x=2-a\).`, forbT: R`Разрешено: внутри круга \((x-5)^2+a^2<25\) и \(4\le x\le8\).`, keyT: R`Особые: выход из круга \(a=\frac{-3-\sqrt{41}}2\); \(a=-3,\ -\frac52,\ -2,\ 1\).` } });

T({ id: '019', code: '019', src: '45069 Ященко 26', sec: 'prod', lvl: 2, kind: '√ · log₂ = 0',
  st: R`Найдите все значения параметра \(a\), при каждом из которых уравнение \[\sqrt{10x^2+x-24}\cdot\log_2\big((x-3)(a+5)+14\big)=0\] имеет ровно два различных корня.`,
  links: L('https://3.shkolkovo.online/catalog/4150/111350', 'https://3.shkolkovo.online/catalog/4150/45069', 'https://rutube.ru/video/private/162e7df9cf48dc78f1761c74f7397697/?p=6sv8dEZWQFe_qBaLFuN86A'),
  ans: '{-5}U[-50/23;-45/23)U(11/3;13/3)', need: '=2',
  an: [
    Q('Корни под корнем', R`\(10x^2+x-24=0\):`, ['x=\\frac32,\\ x=-\\frac85', 'x=-\\frac32,\\ x=\\frac85', 'x=\\frac32,\\ x=\\frac85', 'x=2,\\ x=-\\frac{12}5'], 'При условии, что аргумент логарифма > 0.'),
    Q('Логарифм = 0', 'Получаем:', ['(x-3)(a+5)=-13', '(x-3)(a+5)=-14', '(x-3)(a+5)=1', '(x-3)(a+5)=13'], R`\(x=3-\frac{13}{a+5}\), нужно \(10x^2+x-24\ge0\).`),
    Q(R`\(x=\frac32\) существует`, R`\(-\frac32(a+5)+14>0\iff\)`, ['a<\\frac{13}3', 'a>\\frac{13}3', 'a<\\frac{11}3', '\\text{всегда}']),
    Q(R`\(x=-\frac85\) существует`, R`\(-\frac{23}5(a+5)+14>0\iff\)`, ['a<-\\frac{45}{23}', 'a>-\\frac{45}{23}', 'a<-\\frac{50}{23}', 'a>\\frac{45}{23}']),
    Q('Третий корень', R`\(3-\frac{13}{a+5}\) лежит вне \((-\frac85;\frac32)\) при`, ['a<-5;\\ -5<a\\le-\\frac{50}{23};\\ a\\ge\\frac{11}3', 'a\\ge\\frac{11}3', 'a>-5', '-\\frac{50}{23}\\le a\\le\\frac{11}3'], R`При \(a=-5\) третьего корня нет, а оба первых есть — два корня.`)
  ],
  g: { va: [-8, 7], vx: [-6, 8], dom: (x, a, e) => 10 * x * x + x - 24 >= -e && (x - 3) * (a + 5) + 14 > e, keys: [-5],
    br: [{ xLine: 1.5, lab: 'x = 3/2' }, { xLine: -1.6, lab: 'x = −8/5' }, { x: a => 3 - 13 / (a + 5), lab: '(x−3)(a+5) = −13' }],
    bnd: [{ F: (x, a) => (x - 3) * (a + 5) + 14 }],
    brT: R`Корни: вертикали \(x=\frac32,\ x=-\frac85\) и гипербола \((x-3)(a+5)=-13\).`, forbT: R`Запрещено \(-\frac85<x<\frac32\) и \((x-3)(a+5)+14\le0\).`, keyT: R`Особые: \(a=-5,\ -\frac{50}{23},\ -\frac{45}{23},\ \frac{11}3,\ \frac{13}3\).` } });

T({ id: '020', code: '020', src: '45077 Ященко 26', sec: 'exp', lvl: 2, kind: 'корни на [−2; −1]',
  st: R`Найдите все положительные значения параметра \(a\), при каждом из которых корни уравнения \[3a^{2x}-16^x+2\cdot(4a)^x=0\] принадлежат отрезку \([-2;-1]\).`,
  links: L('https://3.shkolkovo.online/catalog/4150/111355', 'https://3.shkolkovo.online/catalog/4150/45077', 'https://rutube.ru/video/private/762b8e4346f4a676f9ddbfc9ccbd9734/?p=hy5m3lv5xV_7vuV7AyVwFw'),
  ans: '[4*sqrt(3);12]', needText: 'все корни на [−2; −1]',
  an: [
    Q(R`Делим на \(16^x\)`, 'Получаем:', ['3t^2+2t-1=0,\\ t=\\left(\\frac a4\\right)^x', '3t^2-2t-1=0,\\ t=\\left(\\frac a4\\right)^x', '3t^2+2t-1=0,\\ t=(4a)^x', 't^2+2t-3=0,\\ t=a^x']),
    Q('Корни t', R`С учётом \(t>0\):`, ['t=\\frac13', 't=\\frac13;\\ t=-1', 't=1', 't=-\\frac13']),
    Q('Случай a = 4', R`При \(a=4\):`, ['t = 1 ≠ 1/3 — корней нет', 'x — любое', 'x = 0', 'x = −1']),
    Q('Корень x', R`При \(a\ne4\):`, ['x=-\\frac{\\ln3}{\\ln(a/4)}', 'x=\\frac{\\ln3}{\\ln(a/4)}', 'x=\\log_3\\frac a4', 'x=-\\log_3a']),
    Q('Условие', R`\(-2\le x\le-1\iff\)`, ['\\sqrt3\\le\\frac a4\\le3', '\\frac13\\le\\frac a4\\le\\frac1{\\sqrt3}', '3\\le\\frac a4\\le9', '1\\le\\frac a4\\le3'], R`\(\ln\frac a4\in[\frac{\ln3}2;\ln3]\Rightarrow a\in[4\sqrt3;12]\).`)
  ],
  g: { va: [-1, 16], vx: [-4, 3], dom: (x, a, e) => a > e, keys: [4], strip: [-2, -1],
    cls: (r, p) => p > 0 && r.xs.length > 0 && r.xs.every(x => x >= -2 - 1e-9 && x <= -1 + 1e-9),
    br: [{ x: a => -Math.log(3) / Math.log(a / 4), lab: 'a = 4·3^(−1/x)' }],
    brT: R`Корень: \(x=-\frac{\ln3}{\ln(a/4)}\iff a=4\cdot3^{-1/x}\).`, forbT: R`Только \(a>0\). Полоса \(-2\le x\le-1\) выделена.`, keyT: R`На границах полосы: \(x=-2\Rightarrow a=4\sqrt3\); \(x=-1\Rightarrow a=12\). Прямая \(a=4\) — асимптота.` } });

T({ id: '021', code: '021', src: '548270', sec: 'root', lvl: 2, kind: 'квадрат суммы с корнем',
  st: R`Найдите все значения \(a\), при которых уравнение \[\left(x^2-3+\sqrt{2x+a}\right)^2=\left(x^2-3\right)^2+2x+a\] имеет единственное решение на отрезке \([0;2]\).`,
  links: L('https://ege.sdamgia.ru/problem?id=548270', 'https://rutube.ru/video/218d0fd1596dfc1d7ec0c9ac43766c90/'),
  ans: '[-4;-2*sqrt(3)]U(0;inf)', need: '=1',
  an: [
    Q('Раскрываем', 'После сокращения:', ['2(x^2-3)\\sqrt{2x+a}=0', '(x^2-3)\\sqrt{2x+a}=1', '\\sqrt{2x+a}=0', 'x^2-3=\\sqrt{2x+a}']),
    Q('ОДЗ', 'Ограничение:', ['2x+a\\ge0', '2x+a>0', 'x^2-3\\ge0', '\\text{ограничений нет}']),
    Q('Корни на [0; 2]', 'Кандидаты:', ['x=\\sqrt3,\\ x=-\\frac a2', 'x=\\pm\\sqrt3,\\ x=-\\frac a2', 'x=\\sqrt3,\\ x=\\frac a2', 'x=3,\\ x=-2a']),
    Q('Условия', 'Когда каждый подходит?', ['\\sqrt3:\\ a\\ge-2\\sqrt3;\\ \\ -\\frac a2:\\ -4\\le a\\le0', '\\sqrt3:\\ a>-2\\sqrt3;\\ \\ -4<a<0', '-\\frac a2:\\ -4\\le a\\le0\\ \\text{только}', '\\sqrt3:\\ a\\ge2\\sqrt3;\\ \\ 0\\le a\\le4']),
    Q('Совпадение', 'Корни совпадают при', ['a=-2\\sqrt3', 'a=2\\sqrt3', 'a=-4', 'a=0'])
  ],
  g: { va: [-5, 2], vx: [-0.3, 2.3], xr: [0, 2], dom: (x, a, e) => 2 * x + a >= -e,
    br: [{ xLine: Math.sqrt(3), lab: 'x = √3' }, { x: a => -a / 2, lab: 'x = −a/2' }],
    bnd: [{ a: x => -2 * x, lab: 'a = −2x' }],
    brT: R`Корни: \(x=\sqrt3\) и \(x=-\frac a2\).`, forbT: R`Запрещено \(a<-2x\) и всё вне \([0;2]\).`, keyT: R`Особые: \(a=-4,\ -2\sqrt3,\ 0\).` } });

T({ id: '022', code: '022', src: '30849', sec: 'abs', lvl: 3, kind: 'менее четырёх корней',
  st: R`Найдите все значения параметра \(a\), при каждом из которых уравнение \[a^2+ax-2x^2-6a-3x+9|x|=0\] имеет менее четырёх различных корней.`,
  links: L('https://www.geogebra.org/classic/tfezwnwz', 'https://3.shkolkovo.online/catalog/7197/30849', 'https://rutube.ru/video/e707d41e76abd10ed5958766a96f517e/'),
  ans: '(-inf;0]U{2;4}U[6;inf)', need: '<4',
  an: [
    Q('Случай x ≥ 0', R`Квадратное по \(a\): \(a^2+a(x-6)-2x^2+6x=0\), \(D=\)`, ['9(x-2)^2', '9(x+2)^2', '(3x-2)^2', '9x^2']),
    Q('Ветви при x ≥ 0', 'Получаем:', ['a=x,\\ a=6-2x', 'a=-x,\\ a=6+2x', 'a=x,\\ a=2x-6', 'a=2x,\\ a=6-x']),
    Q('Ветви при x < 0', R`\(a^2+a(x-6)-2x^2-12x=0\):`, ['a=x+6,\\ a=-2x', 'a=x-6,\\ a=2x', 'a=-x+6,\\ a=-2x', 'a=x+6,\\ a=2x'], R`\(D=9(x+2)^2\).`),
    Q('Четыре корня', 'Горизонталь пересекает все четыре ветви при', ['0<a<6', '0\\le a\\le6', 'a>0', 'a<6']),
    Q('Совпадения', 'Внутри (0; 6) корни совпадают при', ['a=2;\\ a=4', 'a=2', 'a=4', 'a=3'], R`\(x=\frac{6-a}2=a\Rightarrow a=2\); \(\ a-6=-\frac a2\Rightarrow a=4\).`)
  ],
  g: { va: [-3, 9], vx: [-8, 8],
    br: [{ x: a => a, ok: (x, a, e) => x >= -e, lab: 'a = x' }, { x: a => (6 - a) / 2, ok: (x, a, e) => x >= -e, lab: 'a = 6−2x' },
      { x: a => a - 6, ok: (x, a, e) => x < -e, lab: 'a = x+6' }, { x: a => -a / 2, ok: (x, a, e) => x < -e, lab: 'a = −2x' }],
    vl: [{ x: 0 }],
    brT: R`Четыре луча-ветви: справа \(a=x,\ a=6-2x\); слева \(a=x+6,\ a=-2x\).`, forbT: R`Каждая ветвь — только в своей полуплоскости.`, keyT: R`Особые: \(a=0,\ 2,\ 4,\ 6\).` } });

T({ id: '023', code: '023', src: '517543', sec: 'prod', lvl: 3, kind: 'ln · √ = 0 на [0;1]',
  st: R`Найдите все значения \(a\), при каждом из которых уравнение \[\ln(5x-2)\cdot\sqrt{x^2-2x+2a-a^2}=0\] имеет ровно один корень на отрезке \([0;1]\).`,
  links: L('https://ege.sdamgia.ru/problem?id=517543', 'https://rutube.ru/video/ad9f00be3aa359e56319da47e12c389f/'),
  ans: '(2/5;3/5]U[7/5;8/5)', need: '=1',
  an: [
    Q('ОДЗ', 'Ограничения:', ['5x-2>0,\\ x^2-2x+2a-a^2\\ge0', '5x-2\\ge0,\\ x^2-2x+2a-a^2\\ge0', '5x-2>0', 'x^2-2x+2a-a^2>0']),
    Q('ln = 0', 'x = 3/5 подходит при', ['\\frac35\\le a\\le\\frac75', '\\frac35<a<\\frac75', 'a\\ge\\frac35', 'a\\le\\frac75'], R`\(\frac9{25}-\frac65+2a-a^2\ge0\).`),
    Q('Подкоренное = 0', R`\(x^2-2x+2a-a^2=0\iff\)`, ['(x-1)^2=(a-1)^2', '(x+1)^2=(a+1)^2', '(x-1)^2=a^2', 'x^2=a^2'], R`\(x=a\) или \(x=2-a\).`),
    Q('Отбор', R`С учётом \(\frac25<x\le1\):`, ['x=a:\\ \\frac25<a\\le1;\\ \\ x=2-a:\\ 1\\le a<\\frac85', 'x=a:\\ 0\\le a\\le1;\\ \\ x=2-a:\\ 1\\le a\\le2', 'x=a:\\ a>\\frac25;\\ \\ x=2-a:\\ a<\\frac85', 'x=a:\\ \\frac25\\le a\\le1']),
    Q('Совпадения', 'Корни совпадают при', ['a=\\frac35;\\ a=1;\\ a=\\frac75', 'a=1', 'a=\\frac35;\\ a=\\frac75', 'a=\\frac25;\\ a=\\frac85'])
  ],
  g: { va: [0, 2], vx: [-0.2, 1.3], xr: [0, 1], dom: (x, a, e) => 5 * x - 2 > e && x * x - 2 * x + 2 * a - a * a >= -e, keys: [1],
    br: [{ xLine: 0.6, lab: 'x = 3/5' }, { x: a => a, lab: 'x = a' }, { x: a => 2 - a, lab: 'x = 2−a' }],
    brT: R`Корни: \(x=\frac35\), \(x=a\), \(x=2-a\).`, forbT: R`Запрещено \(x\le\frac25\) и \(|x-1|<|a-1|\) (между прямыми — «бабочка»).`, keyT: R`Особые: \(a=\frac25,\ \frac35,\ 1,\ \frac75,\ \frac85\).` } });

T({ id: '024', code: '024', src: '26286', sec: 'root', lvl: 3, kind: 'модуль и корень',
  st: R`Определите, при каких значениях параметра \(a\) уравнение \[|x^2-a^2|=|x+a|\sqrt{3x+1}\] имеет два различных решения.`,
  links: L('https://3.shkolkovo.online/catalog/136/26286', 'https://rutube.ru/video/private/5797fa148ccb3134095f0a4495c3c6ea/?p=FkPP9d7WxztP6s3_fCFPxA'),
  ans: '{-13/12;-1;1/4}U(1/3;inf)', need: '=2',
  an: [
    Q('Выносим', 'Уравнение:', ['|x+a|\\left(|x-a|-\\sqrt{3x+1}\\right)=0', '|x-a|\\left(|x+a|-\\sqrt{3x+1}\\right)=0', '(x+a)(x-a-\\sqrt{3x+1})=0', '|x+a|=\\sqrt{3x+1}']),
    Q('x = −a', 'Подходит при', ['a\\le\\frac13', 'a<\\frac13', 'a\\ge-\\frac13', '\\text{всегда}'], R`ОДЗ: \(3x+1\ge0\).`),
    Q('Квадрат', R`\((x-a)^2=3x+1\iff\)`, ['x^2-(2a+3)x+a^2-1=0', 'x^2-(2a-3)x+a^2+1=0', 'x^2-2ax+a^2-3x=0', 'x^2+(2a+3)x+a^2-1=0'], R`ОДЗ автоматически; \(D=12a+13\).`),
    Q('Совпадение с x = −a', 'Когда −a — корень квадратного?', ['a=\\frac14;\\ a=-1', 'a=-\\frac14;\\ a=1', 'a=\\frac13', 'a=-\\frac{13}{12}'], R`\(4a^2+3a-1=0\).`),
    Q('Подсчёт', 'При a > 1/3 корней:', ['два', 'три', 'один', 'ни одного'], R`При \(a=-\frac{13}{12}\): \(D=0\) — двойной корень плюс \(x=-a\).`)
  ],
  g: { va: [-2, 2], vx: [-1.5, 5], dom: (x, a, e) => 3 * x + 1 >= -e,
    br: [{ x: a => -a, lab: 'x = −a' }, { x: a => ((2 * a + 3) + sq(12 * a + 13)) / 2, lab: '(x−a)² = 3x+1' }, { x: a => ((2 * a + 3) - sq(12 * a + 13)) / 2 }],
    brT: R`Корни: прямая \(x=-a\) и парабола \((x-a)^2=3x+1\).`, forbT: R`Запрещено \(x<-\frac13\).`, keyT: R`Особые: вершина \(a=-\frac{13}{12}\); пересечения \(a=-1,\ \frac14\); \(a=\frac13\).` } });

T({ id: '025', code: '025', src: '168171 Ященко 25', sec: 'abs', lvl: 3, kind: 'ломаная и прямая',
  st: R`При каких положительных значениях параметра \(a\) уравнение \[|x-a|+|2x+3a|=1-ax\] имеет ровно одно решение?`,
  links: L('https://3.shkolkovo.online/catalog/4150/168172', 'https://rutube.ru/video/private/4283348fd087beab5a17be3797b2dc1f/?p=yYGlDHcy4xvWySX3bmHYTA'),
  ans: '{2/3;1}U[3;inf)', need: '=1',
  an: [
    Q('Нули модулей', 'Точки смены знака:', ['x=a,\\ x=-\\frac{3a}2', 'x=-a,\\ x=\\frac{3a}2', 'x=a,\\ x=-3a', 'x=\\frac a2,\\ x=-\\frac{3a}2']),
    Q('x ≥ a', 'Корень:', ['x=\\frac{1-2a}{3+a}', 'x=\\frac{1+2a}{3+a}', 'x=\\frac{1-2a}{3-a}', 'x=\\frac{1-4a}{1+a}'], R`\(3x+2a=1-ax\).`),
    Q('−3a/2 ≤ x < a', 'Корень:', ['x=\\frac{1-4a}{1+a}', 'x=\\frac{1+4a}{1+a}', 'x=\\frac{1-4a}{1-a}', 'x=\\frac{1-2a}{3+a}'], R`\(x+4a=1-ax\).`),
    Q('x < −3a/2', 'Корень:', ['x=\\frac{1+2a}{a-3}', 'x=\\frac{1+2a}{3-a}', 'x=\\frac{1-2a}{a-3}', 'x=\\frac{2a-1}{a+3}'], R`\(-3x-2a=1-ax\).`),
    Q('Проверка условий', 'Каждый корень берём только на своём промежутке. Сколько решений при a = 3?', ['одно', 'два', 'ни одного', 'бесконечно много'], R`Подставляйте \(a\) и проверяйте принадлежность промежутку — луч решения на графике покажет итог.`)
  ],
  g: { va: [-0.5, 4.5], vx: [-8, 3], dom: (x, a, e) => a > e, keys: [0, 1 / 6],
    br: [{ x: a => (1 - 2 * a) / (3 + a), ok: (x, a, e) => x >= a - e, lab: 'x ≥ a' }, { x: a => (1 - 4 * a) / (1 + a), ok: (x, a, e) => x >= -1.5 * a - e && x < a - e, lab: '−3a/2 ≤ x < a' }, { x: a => (1 + 2 * a) / (a - 3), ok: (x, a, e) => x < -1.5 * a - e, lab: 'x < −3a/2' }],
    bnd: [{ a: x => x, lab: 'a = x' }, { a: x => -2 * x / 3, lab: 'a = −2x/3' }],
    brT: R`Три ветви корней, каждая — в своём секторе между прямыми \(a=x\) и \(a=-\frac{2x}3\).`, forbT: R`Рассматриваем только \(a>0\).`, keyT: R`Особые: \(a=\frac23,\ 1,\ 3\).` } });

/* ===================== БЛОК 2: задачи 030–039 ===================== */
T({ id: '030', code: '030', src: '30818', sec: 'abs', lvl: 0, kind: 'полный квадрат с |x|',
  st: R`Найдите все значения параметра \(a\), при каждом из которых уравнение \[a^2-4x^2+8|x|-4=0\] имеет ровно 2 различных корня.`,
  links: L('https://www.geogebra.org/classic/uegd6qz6', 'https://3.shkolkovo.online/catalog/136/30818', 'https://rutube.ru/video/private/d37c6f101db782ce420090eabba876c4/?p=g_hrxsaiZkpQk_1WCSzMUA'),
  ans: '(-inf;-2)U{0}U(2;inf)', need: '=2',
  an: [
    Q('Выделяем квадрат', R`\(4x^2-8|x|+4=\)`, ['4(|x|-1)^2', '4(x-1)^2', '(2|x|-1)^2', '4(|x|+1)^2'], R`\(x^2=|x|^2\). Уравнение: \(a^2=4(|x|-1)^2\).`),
    Q('Снимаем квадрат', R`\(a^2=4(|x|-1)^2\iff\)`, ['|x|=1\\pm\\frac{|a|}2', '|x|=1\\pm\\frac a2\\ \\text{(без модуля)}', 'x=1\\pm\\frac{|a|}2', '|x|=\\frac{|a|}2\\pm1'], R`\(2\,\big||x|-1\big|=|a|\).`),
    Q('Подсчёт', R`Сколько корней при \(0<|a|<2\)?`, ['четыре', 'два', 'три', 'один'], R`\(|x|=1+\frac{|a|}2\) — два корня, \(|x|=1-\frac{|a|}2>0\) — ещё два.`),
    Q('Особые значения', 'Ровно два корня при', ['|a|>2\\ \\text{или}\\ a=0', '|a|\\ge2', '|a|<2', 'a=0'], R`\(a=0\): \(|x|=1\) — два корня; \(|a|=2\): \(x=0,\ \pm2\) — три.`)
  ],
  g: { va: [-4, 4], vx: [-4, 4],
    br: [{ x: a => 1 + abs(a) / 2, lab: '|a| = 2(|x|−1)' }, { x: a => -1 - abs(a) / 2 }, { x: a => 1 - abs(a) / 2, ok: (x, a, e) => x >= -e }, { x: a => -(1 - abs(a) / 2), ok: (x, a, e) => x <= e }],
    brT: R`Решения: \(|a|=2\,\big||x|-1\big|\) — «два уголка» (W-образная ломаная и её отражение).`, forbT: 'Ограничений нет — любое x.', keyT: R`Особые: \(a=0\) (касание вершин \(x=\pm1\)), \(a=\pm2\) (проход через \(x=0\)).` } });

T({ id: '031', code: '031', src: '185931 (2026)', sec: 'fact', lvl: 1, kind: 'квадратное относительно a',
  st: R`Найдите все значения параметра \(a\), при каждом из которых уравнение \[(x-2)a^2-(x^3-x^2-4)a+x^4-4x^2=0\] имеет ровно 2 решения.`,
  links: L('https://www.geogebra.org/classic/sxs5zwq3rc', 'https://3.shkolkovo.online/catalog/136/185931', 'https://rutube.ru/video/private/227def4131e4dd4c5e7c437f2ae1c092/?p=dBSn_0iikI3SRzKwR29V9A'),
  ans: '(-inf;0)U{4}', need: '=2',
  an: [
    Q('Угадываем корень по a', 'Один из корней (как уравнения относительно a):', ['a=x^2', 'a=x', 'a=-x^2', 'a=2x'], R`Подстановка \(a=x^2\) обращает левую часть в 0. По теореме Виета второй корень: \(a=\frac{x^2(x^2-4)}{(x-2)x^2}=x+2\).`),
    Q('Разложение', 'Уравнение равносильно:', ['(x-2)(a-x^2)(a-x-2)=0', '(x+2)(a-x^2)(a-x+2)=0', '(x-2)(a+x^2)(a-x-2)=0', '(a-x^2)(a-x-2)=0'], R`Проверьте: \((x-2)\) — коэффициент при \(a^2\).`),
    Q('Корни', 'Все кандидаты:', ['x=2,\\ x=\\pm\\sqrt a,\\ x=a-2', 'x=2,\\ x=\\sqrt a,\\ x=a+2', 'x=\\pm\\sqrt a,\\ x=a-2', 'x=-2,\\ x=\\pm\\sqrt a,\\ x=a-2'], R`\(x=2\) — корень при любом \(a\)!`),
    Q('a < 0', R`Сколько решений при \(a<0\)?`, ['два: 2 и a − 2', 'одно', 'три', 'ни одного']),
