<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,"Segoe UI",system-ui,sans-serif;background:#f1f3fb;color:#1e293b;line-height:1.55}
header{background:linear-gradient(120deg,#0f766e,#2563eb 55%,#7c3aed);color:#fff;padding:20px 14px 0}

<header><h1>Два графика</h1><p>Левая часть — один график, правая — другой. Корни = точки пересечения. Строим, двигаем, приближаем, касаемся.</p><nav id="nav"></nav></header>
<main id="app"></main>
<script>
const $=(s,e=document)=>e.querySelector(s),abs=Math.abs,sq=Math.sqrt;
const F=n=>(Math.round(n*1000)/1000+'').replace('-','−');
const sg=n=>n<0?'− '+F(-n):'+ '+F(n);
const pl=n=>n+(n%10==1&&n%100!=11?' корень':(n%10>1&&n%10<5&&(n%100<10||n%100>20)?' корня':' корней'));
function rnd(s){let t=s+0x6D2B79F5;return()=>{t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296}}

/* ============ АНАЛИЗ: корни, касание, множества ============ */
function analyze(sc,a){
 const[lo,hi]=sc.scan,N=4000;let xs=[];for(let i=0;i<=N;i++)xs.push(lo+(hi-lo)*i/N);
 if(sc.pts)xs=xs.concat(sc.pts(a)).sort((p,q)=>p-q);
 const ok=x=>!sc.dom||sc.dom(x),L=x=>sc.L(x,a),R=x=>sc.R(x,a);
 if(sc.ineq){const segs=[];let s=null,p=null;
  for(const x of xs){let t=false;if(ok(x)){const l=L(x),r=R(x);t=isFinite(l)&&isFinite(r)&&(sc.ineq==='le'?l<=r+1e-9:l>r+1e-9)}
   if(t){if(s===null)s=x;p=x}else if(s!==null){segs.push([s,p]);s=null}}
  if(s!==null)segs.push([s,p]);
  return{segs,len:segs.reduce((u,g)=>u+g[1]-g[0],0),n:segs.length,roots:[],touch:[]}}
 const ds=xs.map(x=>ok(x)?L(x)-R(x):NaN),roots=[],touch=[],kink=[],n=xs.length,g=x=>abs(L(x)-R(x));
 for(let i=0;i<n;i++){const d=ds[i];if(!isFinite(d))continue;
  if(abs(d)<1e-9){roots.push(xs[i]);continue}
  const p=ds[i-1],q=ds[i+1];
  if(i>0&&isFinite(p)&&abs(p)>=1e-9&&p*d<0&&abs(p-d)<50){roots.push(xs[i]-d*(xs[i]-xs[i-1])/(d-p));continue}
  if(i>0&&i<n-1&&isFinite(p)&&isFinite(q)&&p*d>0&&q*d>0&&abs(d)<=abs(p)&&abs(d)<=abs(q)&&abs(d)<.05){
   let l=xs[i-1],r=xs[i+1];for(let k=0;k<70;k++){const m1=l+(r-l)/3,m2=r-(r-l)/3;g(m1)<g(m2)?r=m2:l=m1}
   const xm=(l+r)/2;if(g(xm)<1e-7){(g(xm-1e-3)+g(xm+1e-3)<2e-4?touch:kink).push(xm);roots.push(xm)}}}
 return{roots,touch,kink,n:roots.length}}
function nearPt(sc,a){const r=analyze(sc,a);if(r.touch&&r.touch.length)return r.touch[0];
 if(r.roots&&r.roots.length)return r.roots[r.roots.length-1];
 const[lo,hi]=sc.scan;let bx=lo,bd=1e9;for(let i=0;i<=2000;i++){const x=lo+(hi-lo)*i/2000;if(sc.dom&&!sc.dom(x))continue;const d=abs(sc.L(x,a)-sc.R(x,a));if(isFinite(d)&&d<bd){bd=d;bx=x}}return bx}
function ach(sc,pred,steps=500){const[a0,a1]=sc.arange,out=[];let s=null;
 for(let i=0;i<=steps;i++){const a=a0+(a1-a0)*i/steps,t=pred(analyze(sc,a));if(t&&s===null)s=a;if(!t&&s!==null){out.push([s,a-(a1-a0)/steps]);s=null}}
 if(s!==null)out.push([s,a1]);return out.length?out.map(g=>'['+F(g[0])+'; '+F(g[1])+']').join(' ∪ ')+' (приблизительно)':'таких значений нет'}

/* ============ ГРАФИЧЕСКОЕ ПОЛЕ (зум, перетаскивание) ============ */
class Plot{
 constructor(box,view,hr){this.v0=view.slice();this.v=view.slice();this.hr=hr||.62;
  const c=this.c=document.createElement('canvas');c.className='cvs';box.appendChild(c);let dr=null;
  c.onwheel=e=>{e.preventDefault();const r=c.getBoundingClientRect();this.zoom(e.deltaY<0?.8:1.25,this.ux(e.clientX-r.left),this.uy(e.clientY-r.top))};
  c.onpointerdown=e=>{dr={x:e.clientX,y:e.clientY};c.setPointerCapture(e.pointerId);c.style.cursor='grabbing'};
  c.onpointermove=e=>{if(!dr)return;const v=this.v,dx=(e.clientX-dr.x)/c.clientWidth*(v[1]-v[0]),dy=(e.clientY-dr.y)/c.clientHeight*(v[3]-v[2]);v[0]-=dx;v[1]-=dx;v[2]+=dy;v[3]+=dy;dr={x:e.clientX,y:e.clientY};this.draw()};
  c.onpointerup=()=>{dr=null;c.style.cursor='grab'};c.ondblclick=()=>this.reset();
  new ResizeObserver(()=>this.draw()).observe(c)}
 ux(px){return this.v[0]+px/this.c.clientWidth*(this.v[1]-this.v[0])}
 uy(py){return this.v[3]-py/this.c.clientHeight*(this.v[3]-this.v[2])}
 zoom(f,cx,cy){const v=this.v;cx=cx??(v[0]+v[1])/2;cy=cy??(v[2]+v[3])/2;this.v=[cx+(v[0]-cx)*f,cx+(v[1]-cx)*f,cy+(v[2]-cy)*f,cy+(v[3]-cy)*f];this.draw()}
 focus(x,y,f){const v=this.v,w=(v[1]-v[0])*f,h=(v[3]-v[2])*f;this.v=[x-w/2,x+w/2,y-h/2,y+h/2];this.draw()}
 reset(){this.v=this.v0.slice();this.draw()}
 render(fn){this.fn=fn;this.draw()}
 draw(){const c=this.c,w=c.clientWidth;if(!w)return;const h=Math.round(w*this.hr),d=devicePixelRatio||1;
  c.style.height=h+'px';c.width=w*d;c.height=h*d;const g=c.getContext('2d');g.scale(d,d);
  const[x0,x1,y0,y1]=this.v,X=x=>(x-x0)/(x1-x0)*w,Y=y=>h-(y-y0)/(y1-y0)*h;this.X=X;this.Y=Y;this.g=g;
  g.fillStyle='#fff';g.fillRect(0,0,w,h);
  const st=r=>{const p=Math.pow(10,Math.floor(Math.log10(r/8)));for(const m of[1,2,5,10])if(r/(p*m)<=10)return p*m};
  const sx=st(x1-x0),sy=st(y1-y0);g.font='11px sans-serif';g.fillStyle='#64748b';g.strokeStyle='#eceef6';g.lineWidth=1;g.textAlign='center';
  for(let x=Math.ceil(x0/sx)*sx;x<=x1;x+=sx){g.beginPath();g.moveTo(X(x),0);g.lineTo(X(x),h);g.stroke();if(abs(x)>sx/2)g.fillText(F(+x.toFixed(6)),X(x),Math.min(h-3,Math.max(12,Y(0)+13)))}
  g.textAlign='right';for(let y=Math.ceil(y0/sy)*sy;y<=y1;y+=sy){g.beginPath();g.moveTo(0,Y(y));g.lineTo(w,Y(y));g.stroke();if(abs(y)>sy/2)g.fillText(F(+y.toFixed(6)),Math.min(w-3,Math.max(30,X(0)-4)),Y(y)-3)}
  g.strokeStyle='#475569';g.lineWidth=1.5;g.beginPath();g.moveTo(0,Y(0));g.lineTo(w,Y(0));g.moveTo(X(0),0);g.lineTo(X(0),h);g.stroke();
  if(this.fn)this.fn(g,X,Y,this)}
}
function curve(P,f,col,wd,dash,dom){const g=P.g,[x0,x1,y0,y1]=P.v,N=1400,hh=y1-y0;g.beginPath();g.strokeStyle=col;g.lineWidth=wd;g.setLineDash(dash||[]);let pen=false,py=0;
 for(let i=0;i<=N;i++){const x=x0+(x1-x0)*i/N,y=(dom&&!dom(x))?NaN:f(x);if(!isFinite(y)){pen=false;continue}
  if(pen&&abs(y-py)>hh*.7)pen=false;pen?g.lineTo(P.X(x),P.Y(y)):g.moveTo(P.X(x),P.Y(y));pen=true;py=y}
 g.stroke();g.setLineDash([])}
function dot(P,x,y,col,r,ring){const g=P.g;g.beginPath();g.arc(P.X(x),P.Y(y),r,0,7);g.fillStyle=ring?'#fff':col;g.fill();g.lineWidth=2.5;g.strokeStyle=col;g.stroke()}
function dl(P,v,hor,col){const g=P.g,c=P.c;g.save();g.setLineDash([8,6]);g.strokeStyle=col;g.lineWidth=2;g.beginPath();if(hor){g.moveTo(0,P.Y(v));g.lineTo(c.clientWidth,P.Y(v))}else{g.moveTo(P.X(v),0);g.lineTo(P.X(v),c.clientHeight)}g.stroke();g.restore()}
function piv(P,x,y){const g=P.g;dot(P,x,y,'#7c3aed',13,true);dot(P,x,y,'#7c3aed',7);g.font='bold 13px sans-serif';g.fillStyle='#6d28d9';g.textAlign='left';g.fillText('центр пучка',P.X(x)+18,P.Y(y)+19)}

/* ============ СЦЕНА: два графика + ползунок ============ */
function mountScene(box,sc,o={}){
 box.innerHTML=`<div class="pb"></div>${o.fixed?'':`<div class="ctl"><b style="white-space:nowrap">${sc.pn||'a'} =</b><input type="text" class="av" inputmode="decimal" title="Введи значение вручную: 1.25 или 5/4, затем Enter"><button class="b alt nd" data-n="-1">◀</button><input type="range" class="sl"><button class="b alt nd" data-n="1">▶</button></div>`}<div class="rd" ${o.hideRd?'style="display:none"':''}></div><div class="btns tb"></div>${sc.asym!==undefined||sc.hasym!==undefined||sc.bnd?'<div class="mut leg"><i style="background:#0d9488"></i>пунктир — асимптоты<i style="background:#dc2626"></i>пунктир — границы промежутка</div>':''}`;
 const P=new Plot($('.pb',box),sc.view,sc.hr),[a0,a1]=sc.arange,sl=$('.sl',box),rd=$('.rd',box),tb=$('.tb',box);let a=o.a??sc.a0??(a0+a1)/2,res;
 if(sl){sl.min=a0;sl.max=a1;sl.step=(a1-a0)/2000}
 const upd=()=>{res=analyze(sc,a);if(sl){sl.value=a;const av=$('.av',box);if(document.activeElement!==av)av.value=+a.toFixed(4)}
  const n=res.n;let col=sc.ineq?'#7c3aed':n===0?'#ef4444':(res.touch.length||n===1)?'#f59e0b':n===2?'#16a34a':'#2563eb';
  P.render((g,X,Y)=>{
   if(sc.ineq){g.fillStyle='rgba(16,185,129,.18)';res.segs.forEach(s=>g.fillRect(X(s[0]),0,Math.max(2,X(s[1])-X(s[0])),P.c.clientHeight));
    g.strokeStyle='#059669';g.lineWidth=7;res.segs.forEach(s=>{g.beginPath();g.moveTo(X(s[0]),Y(0));g.lineTo(X(Math.max(s[1],s[0]+1e-9)),Y(0));g.stroke()})}
   if(sc.asym!==undefined)dl(P,sc.asym,0,'#0d9488');if(sc.hasym!==undefined)dl(P,sc.hasym,1,'#0d9488');(sc.bnd||[]).forEach(x=>dl(P,x,0,'#dc2626'));
   curve(P,x=>sc.L(x,a),'#2563eb',3,0,sc.dom);curve(P,x=>sc.R(x,a),col,3,0,sc.rdom);
   if(sc.pivot)piv(P,sc.pivot[0],sc.pivot[1]);
   res.roots.forEach(x=>{const y=sc.L(x,a);isFinite(y)&&dot(P,x,y,res.touch.some(t=>abs(t-x)<1e-6)?'#f59e0b':'#059669',6,res.touch.some(t=>abs(t-x)<1e-6))})});
  rd.innerHTML=sc.ineq?`Решения: ${res.segs.length?res.segs.map(s=>abs(s[1]-s[0])<1e-6?'{'+F(s[0])+'}':'['+F(s[0])+'; '+F(s[1])+']').join(' ∪ '):'нет'} · длина ${F(res.len)}`+(sc.ok?(sc.ok(res,a)?' <span class="good">✅ условие выполнено</span>':' <span class="bad">✖ не выполнено</span>'):'')
   :`<span style="color:${col}">Корней: ${n}</span>${res.touch.length?' (есть касание — оранжевое кольцо)':''}${res.kink.length?' (график проходит через угловую точку)':''}`+(sc.ok?(sc.ok(res,a)?' <span class="good">✅ условие «'+sc.okTxt+'» выполнено</span>':' <span class="bad">✖ «'+sc.okTxt+'» не выполнено</span>'):'')};
 if(sl){const cs=sc.crit||[],mw=Math.max((a1-a0)*.002,Math.min((a1-a0)*.012,cs.length>1?Math.min(...cs.slice(1).map((c,i)=>abs(c-cs[i])))*.3:1e9));
  sl.oninput=()=>{let v=+sl.value,b=null;cs.forEach(c=>{if(abs(v-c)<mw&&(b===null||abs(v-c)<abs(v-b)))b=c});a=b===null?v:b;upd()};
  const av=$('.av',box);av.onchange=()=>{const s=av.value.replace(/,/g,'.').replace(/−/g,'-').split('/'),v=s.length===2?parseFloat(s[0])/parseFloat(s[1]):parseFloat(s[0]);if(isFinite(v))a=v;av.blur();upd()};
  box.querySelectorAll('.nd').forEach(b=>b.onclick=()=>{let v=Math.max(a0,Math.min(a1,a+b.dataset.n*(a1-a0)/400));cs.forEach(c=>{if((c-a)*(c-v)<0)v=c});a=v;upd()})}
 let h='';if(!o.fixed&&!o.noCrit)(sc.crit||[]).forEach((c,i)=>h+=`<button class="b alt" data-c="${i}">${sc.pn||'a'} = ${sc.critL?sc.critL[i]:F(c)}</button>`);
 h+=`<button class="b alt" data-z="0.5">🔍+</button><button class="b alt" data-z="2">🔍−</button><button class="b alt" data-z="r">⟲ вид</button><button class="b" data-z="t">🔍 к касанию</button>`;
 tb.innerHTML=h;tb.onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.c!==undefined){a=sc.crit[+b.dataset.c];upd()}
  else if(b.dataset.z==='r')P.reset();else if(b.dataset.z==='t'){const x=nearPt(sc,a);let y=sc.R(x,a);if(!isFinite(y))y=sc.L(x,a);P.reset();P.focus(x,y,.08)}else P.zoom(+b.dataset.z)};
 upd();return{P,get a(){return a},set a(v){a=v;upd()},res:()=>res}}

/* ============ ЗАДАЧИ ============ */
const T=[
{id:'t6',no:'№ 500216',lv:1,sec:0,txt:'Найдите все значения a, при каждом из которых уравнение √(1−2x) = a − 3|x| имеет более двух корней.',
 L:x=>sq(1-2*x),R:(x,a)=>a-3*abs(x),scan:[-4,.5],view:[-1.5,1.2,-1,2.6],arange:[0,2.2],crit:[1,1.5,5/3],critL:['1','3/2','5/3'],a0:1,ok:r=>r.n>2,okTxt:'более двух корней',ans:'a ∈ [3/2; 5/3)',
 steps:['Два графика: синий y=√(1−2x) (ветвь корня, x≤½) и «галка» y=a−3|x| ветвями вниз с вершиной (0; a). Параметр a двигает галку вверх — это <b>каскад</b>.','a = 1: вершина галки лежит на кривой — корень один. Ниже — корней 1 или 0, поднимаем выше.','a = 3/2: правая ветвь галки проходит через конец корня (½; 0) — появляется третий корень (левая ветвь, правая ветвь и конец). Это включаем.','a = 5/3: правая ветвь галки <b>касается</b> корня: два правых пересечения слились в одно — корней уже 2. Это не включаем.','Между 3/2 и 5/3 — три корня. Ответ: [3/2; 5/3).']},

function vBuild(el){
 let ei=0,st=0,tv=1,raf=0;
 const lerp=(A,B,t)=>{const o={};for(const k in A)o[k]=A[k]+((B[k]??A[k])-A[k])*t;return o};
 function apply(ex,n){let PL={...ex.L.P},PR=ex.R?{...ex.R.P}:null,showR=false;for(let i=0;i<n;i++){const s=ex.steps[i];if(s.w==='L')PL={...PL,...s.to};else{PR={...PR,...s.to};showR=true}}return{PL,PR,showR}}
 function draw(){const ex=EXS[ei];
  el.innerHTML=`<div class="card"><h3>🏗 Строим график шаг за шагом</h3><div class="btns">${EXS.map((e,i)=>`<button class="b ${i===ei?'':'alt'}" data-e="${i}">${e.name}</button>`).join('')}</div>
  <div class="dots">${ex.steps.map((s,i)=>`<i class="${i<st?'ok':i===st?'cur':''}"></i>`).join('')}<i class="${st===ex.steps.length?'cur':''}"></i></div><div id="bx"></div>
  <div class="btns"><button class="b alt" id="pv" ${st?'':'disabled'}>← Назад</button><button class="b" id="nx">${st<ex.steps.length?'Дальше →':'К задаче →'}</button></div></div>`;
  $('#bx',el).innerHTML='';
  el.onclick=e=>{const b=e.target.closest('[data-e]');if(b){ei=+b.dataset.e;st=0;tv=1;draw()}};
  $('#pv',el).onclick=()=>{cancelAnimationFrame(raf);st--;tv=1;draw()};
  $('#nx',el).onclick=()=>{cancelAnimationFrame(raf);if(st>=ex.steps.length){go('tasks',ex.task);return}st++;tv=1;draw()};
  if(st<ex.steps.length)stepView(ex);else finalView(ex)}
 function stepView(ex){const s=ex.steps[st],base=apply(ex,st),bx=$('#bx',el);
  bx.innerHTML=`<div class="step">${s.t}</div><div class="pb"></div><div class="ctl"><b>Преобразование</b><input type="range" id="tr" min="0" max="1" step=".005" value="${tv}"><button class="b alt" id="pl">▶</button></div>
  <div class="mut leg"><i style="background:#2563eb"></i>левая часть <i style="background:#16a34a"></i>правая часть <i style="background:#94a3b8"></i>прошлый шаг <i style="background:#0d9488"></i>асимптоты (пунктир)</div>`;
  const P=new Plot($('.pb',bx),ex.view);
  const hasT=Object.keys(s.to).length>0,tr=$('#tr',bx);if(!hasT){tr.disabled=true;$('#pl',bx).disabled=true}
  const rr=()=>{const t=hasT?tv:1,PL=s.w==='L'?lerp(base.PL,{...base.PL,...s.to},t):base.PL,PR=base.PR?(s.w==='R'?lerp(base.PR,{...base.PR,...s.to},t):base.PR):null,showR=base.showR||s.w==='R';
   P.render(()=>{if(hasT){if(s.w==='L')curve(P,x=>ex.L.f(x,base.PL),'#94a3b8',2.5,[6,5]);else curve(P,x=>ex.R.f(x,base.PR),'#94a3b8',2.5,[6,5])}
    if(ex.L.f===HY){dl(P,-PL.m,0,'#0d9488');dl(P,PL.n<0?PL.n*(1-2*PL.r):PL.n,1,'#0d9488')}curve(P,x=>ex.L.f(x,PL),'#2563eb',3.2);if(showR&&ex.R)curve(P,x=>ex.R.f(x,PR),'#16a34a',3.2)})};
  tr.oninput=()=>{tv=+tr.value;rr()};
  $('#pl',bx).onclick=()=>{cancelAnimationFrame(raf);const t0=performance.now();const f=n=>{const k=Math.min(1,(n-t0)/2200);tv=k;tr.value=k;rr();if(k<1)raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f)};
  rr()}
 function finalView(ex){const t=getT(ex.task);$('#bx',el).innerHTML=`<div class="step"><b>Финал.</b> Теперь оба графика готовы: ${ex.task==='t6'?'галка скользит вверх при росте a (каскад)':'прямая вращается вокруг фиксированной точки (пучок)'}. Двигай ползунок — считай точки пересечения. Оранжевое кольцо — касание, <b>🔍 к касанию</b> приближает его.</div><div id="fs"></div><div class="exp">Условие задачи: ${t.txt}</div>`;mountScene($('#fs',el),t)}
 draw()}

  nx.onclick=()=>{st.i++;draw()};$('#sk',el).onclick=()=>{if(!st.res[st.i])st.res[st.i]='skip';st.i++;draw()};
  const opts=(O,c,e)=>{qb.innerHTML=O.map((t,i)=>`<button class="opt" data-i="${i}">${t}</button>`).join('');qb.onclick=ev=>{const b=ev.target.closest('.opt');if(!b||done)return;const i=+b.dataset.i;b.classList.add(i===c?'ok':'no');if(i!==c)qb.children[c].classList.add('ok');fin(i===c,e)}};
  if(q.t==='mc')opts(q.o,q.c,q.e);
  else if(q.t==='zoom'){const sc=Object.assign({},q.sc);const ob=mountScene(qb.appendChild(document.createElement('div')),sc,{fixed:true,a:q.a,hideRd:true});
   const n=Math.min(analyze(sc,q.a).n,4),t=analyze(sc,q.a),h=document.createElement('div');qb.appendChild(h);
   h.innerHTML=[0,1,2,3,4].map(i=>`<button class="opt" style="display:inline-block;width:auto;min-width:70px" data-i="${i}">${i}</button>`).join('');
   h.onclick=ev=>{const b=ev.target.closest('.opt');if(!b||done)return;const i=+b.dataset.i;b.classList.add(i===n?'ok':'no');fin(i===n,`Верно: ${pl(n)}${t.touch.length?' — это касание (одна общая точка)':''}. Два близких корня и касание невооружённым глазом не различить — приближай!`)}}
  else{const o=mountScene(qb,q.sc,{noCrit:true});const b=document.createElement('button');b.className='b ok';b.textContent='Проверить';qb.appendChild(b);
   b.onclick=()=>{if(done)return;const r=o.res(),ok=q.kind==='cnt'?r.n===q.N:r.touch.length>0;
    if(ok)fin(true,q.kind==='cnt'?`Да, при a = ${F(o.a)} корней ${r.n}. Подходящие значения: ${ach(q.sc,x=>x.n===q.N)}.`:`Касание при a = ${F(o.a)}. Ищи его через D = 0 — как на вкладке «Касание».`);
    else{ex.innerHTML=`<div class="exp">❌ Пока ${q.kind==='cnt'?'корней '+r.n:'касания нет'}. Двигай дальше (можно проверять снова).</div>`;if(!st.fl){st.fl={}}if(!st.fl[st.i]){st.fl[st.i]=1;st.res[st.i]='no';$('.dots i.cur',el).className='no'}}}}}
 draw()}

  <div class="btns">${i>0?`<button class="b alt" data-g="${T[i-1].id}">← ${T[i-1].no}</button>`:''}${i<T.length-1?`<button class="b alt" data-g="${T[i+1].id}">${T[i+1].no} →</button>`:''}</div>`;

 el.onclick=e=>{const c=e.target.closest('[data-t]');if(c)vTasks(el,c.dataset.t)}}

/* ============ ПАМЯТКА ============ */
function vMemo(el){el.innerHTML=`<h2>Памятка «Два графика»</h2><div class="mg">
<div class="mc c1"><h3>1. Алгоритм</h3><ol><li>Раздели уравнение на «левую» и «правую» части — по параметру a должна меняться <b>простая</b> часть (прямая, галка).</li><li>Построй обе части.</li><li>Найди <b>особые положения</b> подвижного графика.</li><li>Между ними число корней постоянно — посчитай в одной точке.</li><li>Сами особые a проверь подстановкой.</li></ol></div>
<div class="mc c2"><h3>2. Построение с модулем</h3><ul><li>Сначала график <b>без</b> модуля: база → k → сдвиг по x → сдвиг по y.</li><li>Потом отразить всё, что ниже Ox, вверх.</li><li>Появляются <b>углы</b> в нулях функции.</li><li>y = k/(x+m) + n: асимптоты x = −m, y = n.</li></ul></div>
<div class="mc c3"><h3>3. Пучок и каскад</h3><ul><li><b>Пучок</b> y = a(x−p)+q — вращение вокруг (p; q).</li><li><b>Каскад</b> y = kx + a — параллельный сдвиг.</li><li>Галка a|x−c| — пучок через (c; 0); a − k|x| — каскад.</li></ul></div>
<div class="mc c4"><h3>4. Касание за три шага</h3><ol><li>Приравняй.</li><li>Приведи к A x² + B x + C = 0.</li><li>D = 0 ⇒ значение параметра.</li></ol>Запасной способ: производная.</div>
<div class="mc c5"><h3>5. Особые положения</h3><ul><li>Касание (D = 0)</li><li>Проход через угол графика с модулем</li><li>Проход через конец кривой (корень, граница промежутка)</li><li>Асимптота — в корень не превращается</li></ul></div>
<div class="mc c6"><h3>6. Тонкие места</h3><ul><li>Строгое/нестрогое неравенство на границе промежутка.</li><li>«Более двух» — это ≥ 3; «ровно два» — 2.</li><li>Граничное a — подставь и посчитай.</li><li>Касание считается одним корнем.</li><li>Неравенство: смотри на оси x, где один график не выше другого.</li></ul></div></div>`}

/* ============ ФОРМУЛЫ: автоматический LaTeX через KaTeX ============ */
const B=String.fromCharCode(92),SYM={'≤':'le','≥':'ge','∈':'in','∪':'cup','·':'cdot','⇒':'Rightarrow','⇔':'Leftrightarrow','±':'pm','∞':'infty','→':'to','…':'dots','≈':'approx','<':'lt','>':'gt'},SUP={'²':'^2','³':'^3','₀':'_0','₁':'_1','₂':'_2','′':"'",'⁺':'^{+}'};
const FR=/(\d+(?:[.,]\d+)?[a-z]?|[a-zΔ]{1,2}|\((?:[^()]|\([^()]*\))*\))\/(\d+(?:[.,]\d+)?[a-z]?|[a-zΔ]{1,2}|\((?:[^()]|\([^()]*\))*\))/g;
const TOK=/^[0-9A-Za-zΔ+\-−=<>≤≥()\[\]{}|;,.:!?√∞∈∪·⇒⇔±²³₀₁₂′⁺½\/→…«»≈]+$/;
function toTex(s){const un=p=>p[0]==='('?p.slice(1,-1):p;
 return s.replace(/−/g,'-').replace(/½/g,'1/2').replace(/[«»]/g,'').replace(/[{}]/g,m=>B+m)
  .replace(/√\(((?:[^()]|\([^()]*\))*)\)/g,(m,p)=>B+'sqrt{'+p+'}').replace(/√(\d+|[a-z])/g,(m,p)=>B+'sqrt{'+p+'}')
  .replace(FR,(m,p,q)=>B+'frac{'+un(p)+'}{'+un(q)+'}').replace(/(\d),(\d)/g,'$1{,}$2')
  .replace(/[²³₀₁₂′⁺]/g,m=>SUP[m]).replace(/[≤≥∈∪·⇒⇔±∞→…≈<>]/g,m=>B+SYM[m]+' ')}
function splitRuns(s){const tk=s.split(/(\s+)/),out=[];let run='';
 const txt=t=>{if(!t)return;const l=out[out.length-1];if(l&&!l.m)l.t+=t;else out.push({t})};
 const flush=()=>{if(!run)return;const m=run.match(/^([«\s:;,.!?…→]*)([\s\S]*?)([»\s:;,.!?…→]*)$/),c=m[2];
  if(c&&(c==='D'||(/[a-z√∞=−\-\/≤≥<>∈½²]/.test(c)&&/[0-9A-Za-z√∞½]/.test(c)&&!/^[\d\s.,;:()\[\]]+$/.test(c)))){txt(m[1]);out.push({t:c,m:1});txt(m[3])}else txt(run);run=''};
 for(const t of tk){if(/^\s*$/.test(t)){if(run)run+=t;else txt(t)}else if(TOK.test(t)&&t!=='·')run+=t;else{flush();txt(t)}}
 flush();return out}
function mathify(root){if(!window.katex||!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),L=[];let n;
 while(n=w.nextNode()){const p=n.parentElement;if(p&&!p.closest('.mx,.katex,.nomath,script,style')&&/[0-9a-zD√∞½]/.test(n.nodeValue))L.push(n)}
 L.forEach(n=>{const ps=splitRuns(n.nodeValue);if(!ps.some(p=>p.m))return;const f=document.createDocumentFragment();
  ps.forEach(p=>{if(!p.m){f.appendChild(document.createTextNode(p.t));return}const e=document.createElement('span');e.className='mx';
   try{e.innerHTML=katex.renderToString(toTex(p.t),{throwOnError:false,strict:false})}catch(x){e.textContent=p.t}f.appendChild(e)});n.replaceWith(f)})}
