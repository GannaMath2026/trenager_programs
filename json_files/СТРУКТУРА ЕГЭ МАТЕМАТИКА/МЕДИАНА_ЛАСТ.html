<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Медиана — геометрия</title>
<style>
:root{color-scheme:dark;--bg:#0b0d10;--panel:#151a21;--panel2:#1c232c;--line:#303a46;--text:#edf2f7;--muted:#a8b3c2;--red:#ff5656;--yellow:#ffd34e;--blue:#65b7ff;--green:#65d6a1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:18px 24px;border-bottom:1px solid var(--line);font-size:22px;font-weight:750}
main{padding:22px;max-width:1600px;margin:0 0 0 250px}.sceneNav{position:fixed;z-index:5;left:0;top:64px;bottom:0;width:238px;padding:12px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;background:#11161d;border-right:1px solid var(--line)}.sceneNav .btn{text-align:left;width:100%;flex:0 0 auto;line-height:1.35}.factcard{background:linear-gradient(135deg,#1b222b,#141920);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px;display:flex;gap:20px;align-items:center;justify-content:space-between}.factcard h2{margin:0 0 7px;font-size:21px}.factcard p{margin:0;color:#d2dbe5}.factResult{max-width:440px;text-align:right;color:var(--yellow);font-weight:750;white-space:pre-line}
.btn{border:1px solid #536171;background:#26313d;color:white;padding:9px 13px;border-radius:9px;cursor:pointer}.btn:hover{background:#344252}.btn.active{background:#493034;border-color:#a95760}
.sceneWrap{border:1px solid var(--line);border-radius:14px;background:#0e1217;overflow:hidden}.sceneHead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);color:var(--muted)}.scene{display:block;width:100%;height:min(65vh,650px);min-height:360px;touch-action:none}.scene text{font-family:system-ui,sans-serif;fill:#f4f7fa;font-size:16px;paint-order:stroke;stroke:#0e1217;stroke-width:3px;stroke-linejoin:round}.edge{stroke:#dce4ec;stroke-width:2.4;fill:none}.median{stroke:var(--red);stroke-width:2.8;fill:none}.vertex{fill:#fff;stroke:#111;stroke-width:2;cursor:grab}.vertex:active{cursor:grabbing}.stats{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}.stat{background:#1b232c;border:1px solid #303b47;border-radius:8px;padding:7px 11px;color:#dbe5ef}.note{color:var(--muted);font-size:13px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.bottom{padding:12px 16px;border-top:1px solid var(--line);color:var(--muted)}@media(max-width:700px){.sceneNav{position:relative;top:auto;bottom:auto;width:auto;max-height:180px;border:1px solid var(--line);border-radius:12px;margin:8px;display:flex;flex-direction:row;overflow-x:auto;overflow-y:hidden}.sceneNav .btn{width:auto;min-width:190px;text-align:center}main{margin:0;padding:10px}.factcard{align-items:flex-start;flex-direction:column}.factResult{text-align:left}.scene{height:55vh;min-height:300px}}

html,body{height:100%;min-height:100%}
body{height:100dvh;overflow:hidden}
header{display:none}
.sceneNav{top:0;bottom:0;height:100dvh}
main{height:100dvh;max-width:none;margin:0 0 0 238px;padding:7px 9px;display:flex;flex-direction:column;overflow:hidden}
.factcard{display:none}
.sceneWrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;border-radius:9px}
.sceneHead{flex:0 0 auto;min-height:38px;padding:4px 8px;gap:8px;flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;overflow-y:hidden}
#sceneHint,#controls1{display:none!important}
#controls2 b,#controls5 span{display:none!important}
.controls{flex-wrap:nowrap;flex:0 0 auto;gap:6px}
.controls .btn{padding:5px 9px;white-space:nowrap}
.scene{flex:1 1 auto;width:100%;height:0;min-height:0;max-height:none;display:block}
.stats{flex:0 0 auto;min-height:0;padding:3px 8px;gap:5px;max-height:58px;overflow:auto}
.bottom{display:none}
#vargnon{flex:1 1 auto;width:100%;height:100%!important;min-height:0!important;border:0}
#stats:empty{display:none}
@media(max-width:700px){
  body{height:100dvh;overflow:hidden}
  .sceneNav{position:relative;top:auto;bottom:auto;height:58px;max-height:58px;width:100%;margin:0;padding:5px 8px;border:0;border-bottom:1px solid var(--line);border-radius:0;flex-direction:row;overflow-x:auto;overflow-y:hidden}
  .sceneNav .btn{width:auto;min-width:160px;text-align:center}
  main{height:calc(100dvh - 58px);margin:0;padding:5px}
  .sceneHead{min-height:34px;padding:3px 5px}
  .scene{min-height:0;height:0}
  #vargnon{min-height:0!important}
}


.factcard{display:flex!important;flex:0 0 auto;align-items:center;justify-content:space-between;gap:12px;margin:0 0 6px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#151d26;min-height:40px}
.factLine{display:flex;align-items:center;gap:12px;min-width:0}
.factLine strong{color:#ffd34e;white-space:nowrap;font-size:14px}
.factResult{display:block;max-width:none;text-align:left;color:#edf2f7;font-size:14px;font-weight:500;white-space:normal}
#proofBtn{flex:0 0 auto;padding:5px 11px}
.proofPanel{flex:0 0 auto;margin:0 0 6px;padding:7px 12px;background:#151d26;border:1px solid #303a46;border-radius:8px;color:#e2e8f0;font-size:13px;line-height:1.35;max-height:112px;overflow:auto}
.proofPanel[hidden]{display:none!important}
.proofPanel ol{margin:0;padding-left:22px}
.proofPanel li{margin:2px 0}
#stats,#bottom{display:none!important}
.sceneWrap{flex:1 1 auto;min-height:0}
#vargnon{flex:1 1 auto;width:100%;height:0!important;min-height:0!important;border:0}
@media(max-width:700px){.factcard{gap:6px;padding:5px 7px}.factLine{gap:7px}.factResult{font-size:12px}.proofPanel{max-height:95px;font-size:12px}}

</style>
</head>
<body>

<main>
<nav class="sceneNav"><button class="btn active" id="scene1Btn">1 · Медиана</button><button class="btn" id="scene2Btn">2 · Серединный перпендикуляр</button><button class="btn" id="scene3Btn">3 · Точка пересечения медиан</button><button class="btn" id="scene4Btn">4 · Свойства медиан</button><button class="btn" id="scene5Btn">5 · Параллелограмм Вариньона</button><button class="btn" id="scene6Btn">6 · Медиана к гипотенузе</button><button class="btn" id="scene7Btn">7 · Равенство углов</button><button class="btn" id="scene8Btn">8 · Формулы медиан</button><button class="btn" id="scene9Btn">9 · Параллелограмм</button></nav>
<section class="factcard" id="factCard"><div class="factLine"><strong>Факт</strong><span class="factResult" id="factResult"></span></div><button class="btn" id="proofBtn" type="button">Подробнее</button></section><section class="proofPanel" id="proofPanel" hidden><ol id="proofSteps"></ol></section>
<section class="sceneWrap">
<div class="sceneHead"><span id="sceneHint">Перетаскивайте вершины A, B, C</span><div class="controls" id="controls1"></div><div class="controls" id="controls2" style="display:none"><input id="position" type="range" min="-150" max="150" step="1" value="-90"><button class="btn" id="reset2">Сбросить</button></div><div class="controls" id="controls3" style="display:none"><button class="btn" id="reset3">Сбросить вершины</button></div><div class="controls" id="controls4" style="display:none"><button class="btn active" id="mode4a">Режим 1</button><button class="btn" id="mode4b">Режим 2</button><button class="btn" id="mode4c">Режим 3</button></div><div class="controls" id="controls8" style="display:none"><button class="btn active" id="formulaMode1">Одна медиана</button><button class="btn" id="formulaMode2">Сумма квадратов медиан</button></div>
<div class="controls" id="controls5" style="display:none;flex-wrap:wrap"><button class="btn" id="reset5">Сбросить</button></div></div>
<svg id="scene" class="scene" viewBox="0 0 800 520" role="img" aria-label="Геометрическая сцена"></svg>
<iframe id="vargnon" title="Параллелограмм Вариньона" style="display:none;width:100%;height:min(78vh,900px);min-height:650px;border:0;background:#0f172a" sandbox="allow-scripts"></iframe>
<div class="stats" id="stats"></div>
<div class="bottom" id="bottom">Перемещайте вершину, пока треугольник не станет равнобедренным относительно активной вершины.</div>
</section>
</main>
<script>
const svg=document.getElementById('scene'),ns='http://www.w3.org/2000/svg';
let A={x:230,y:390},B={x:570,y:390},C={x:400,y:110},initial={A:{x:230,y:390},B:{x:570,y:390},C:{x:400,y:110}},active='A',drag=null,scene=1,Pval=.35,showMarks=true;
const add=(tag,attrs={},parent=svg,text='')=>{let e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text)e.textContent=text;parent.appendChild(e);return e};
const sub=(p,q)=>({x:p.x-q.x,y:p.y-q.y}),plus=(p,q)=>({x:p.x+q.x,y:p.y+q.y}),mul=(p,k)=>({x:p.x*k,y:p.y*k}),mid=(p,q)=>mul(plus(p,q),.5),dist=(p,q)=>Math.hypot(p.x-q.x,p.y-q.y);
function point(e){let p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;let q=p.matrixTransform(svg.getScreenCTM().inverse());return{x:q.x,y:q.y}}
function getV(n){return {A,B,C}[n]}function setV(n,p){if(n==='A')A=p;else if(n==='B')B=p;else C=p}
function angleArc(P,Q,R,r,color,label=''){let a1=Math.atan2(Q.y-P.y,Q.x-P.x),a2=Math.atan2(R.y-P.y,R.x-P.x),d=((a2-a1+Math.PI*3)%(Math.PI*2))-Math.PI,pts=[];for(let i=0;i<=32;i++){let a=a1+d*i/32;pts.push({x:P.x+r*Math.cos(a),y:P.y+r*Math.sin(a)})}add('polyline',{points:pts.map(p=>`${p.x},${p.y}`).join(' '),fill:'none',stroke:color,'stroke-width':2.6,'stroke-linecap':'round'});if(label){let a=a1+d/2;add('text',{x:P.x+(r+20)*Math.cos(a),y:P.y+(r+20)*Math.sin(a),fill:color,'text-anchor':'middle'},svg,label)}}
function angleArcGap(P,Q,R,r,color,gap){let a1=Math.atan2(Q.y-P.y,Q.x-P.x),a2=Math.atan2(R.y-P.y,R.x-P.x),d=((a2-a1+Math.PI*3)%(Math.PI*2))-Math.PI,sgn=Math.sign(d)||1,start=a1+sgn*gap/2,end=a2-sgn*gap/2,pts=[];for(let i=0;i<=32;i++){let a=start+(end-start)*i/32;pts.push({x:P.x+r*Math.cos(a),y:P.y+r*Math.sin(a)})}add('polyline',{points:pts.map(p=>`${p.x},${p.y}`).join(' '),fill:'none',stroke:color,'stroke-width':2.8,'stroke-linecap':'round'})}
function line(P,Q,attrs={}){return add('line',{x1:P.x,y1:P.y,x2:Q.x,y2:Q.y,...attrs})}
function render1(){
 svg.innerHTML='';const V={A,B,C},op={A:['B','C'],B:['C','A'],C:['A','B']},[uName,wName]=op[active],P=V[active],U=V[uName],W=V[wName],M=mid(U,W),side1=dist(P,U),side2=dist(P,W),iso=Math.abs(side1-side2)<2.5;
 add('polygon',{points:[A,B,C].map(p=>`${p.x},${p.y}`).join(' '),fill:'#65b7ff','fill-opacity':'.035',stroke:'none'});
 [[A,B],[B,C],[C,A]].forEach(([p,q])=>line(p,q,{class:'edge'}));line(P,M,{class:'median'});
 let d=sub(W,U),len=Math.hypot(d.x,d.y)||1,n={x:-d.y/len,y:d.x/len};
 for(let s of [mid(U,M),mid(M,W)])line(plus(s,mul(n,-7)),plus(s,mul(n,7)),{stroke:'#ffd34e','stroke-width':2.5});
 if(iso&&showMarks){let v1=sub(U,M),v2=sub(P,M),l1=Math.hypot(v1.x,v1.y)||1,l2=Math.hypot(v2.x,v2.y)||1,r=15,p1=plus(M,mul(v1,r/l1)),p2=plus(p1,mul(v2,r/l2)),p3=plus(M,mul(v2,r/l2));add('polyline',{points:[p1,p2,p3].map(p=>`${p.x},${p.y}`).join(' '),fill:'none',stroke:'#ffd34e','stroke-width':2.5});angleArcGap(P,U,M,35,'#65d6a1',0.10);angleArcGap(P,M,W,35,'#65d6a1',0.10);for(let [X,Y] of [[P,U],[P,W]]){let m=mid(X,Y),dd=sub(Y,X),nn=Math.hypot(dd.x,dd.y)||1,perp={x:-dd.y/nn,y:dd.x/nn};line(plus(m,mul(perp,-8)),plus(m,mul(perp,8)),{stroke:'#65d6a1','stroke-width':2.5})}}
 for(let [name,Q] of Object.entries(V)){add('circle',{cx:Q.x,cy:Q.y,r:6,class:'vertex','data-v':name});add('text',{x:Q.x+11,y:Q.y-12},svg,name)}
 add('circle',{cx:M.x,cy:M.y,r:4.5,fill:'#ffd34e',stroke:'#111','stroke-width':1.5});add('text',{x:M.x+10,y:M.y+22,fill:'#ffd34e'},svg,active+'ₘ');
 document.getElementById('stats').innerHTML=iso?'<span class="stat">Равнобедренный: '+active+uName+' = '+active+wName+'</span><span class="stat">Медиана = высота = биссектриса</span><span class="stat">Углы при '+active+' равны</span>':'<span class="stat">Медиана: '+active+'M</span><span class="stat">M — середина '+uName+wName+'</span><span class="stat">'+uName+'M = M'+wName+'</span>';
 document.getElementById('factResult').textContent=iso?'Особое положение найдено: медиана стала высотой и биссектрисой.':'Медиана делит противоположную сторону на два равных отрезка.';
}
function render2(){
 svg.innerHTML='';
 const U={x:180,y:300},V={x:620,y:300},M=mid(U,V),offset=Number(document.getElementById('position').value),P={x:M.x,y:M.y+offset};
 line(U,V,{stroke:'#65b7ff','stroke-width':4});
 line({x:M.x,y:65},{x:M.x,y:455},{stroke:'#ffd34e','stroke-width':3});
 // Matching tick marks show AM = MB.
 for(const x of [290,510]) line({x:x-6,y:292},{x:x+6,y:308},{stroke:'#65b7ff','stroke-width':2.8});
 line(P,U,{stroke:'#edf2f7','stroke-width':2,'stroke-dasharray':'5 6'});
 line(P,V,{stroke:'#edf2f7','stroke-width':2,'stroke-dasharray':'5 6'});
 // Two matching tick marks on PA and PB indicate equal distances.
 for(const [X,Y] of [[P,U],[P,V]]){const d=sub(Y,X),L=Math.hypot(d.x,d.y)||1,n={x:-d.y/L,y:d.x/L},m=plus(X,mul(d,.48));for(const k of [-1,1])line(plus(m,mul(n,k*7)),plus(m,mul(n,k*14)),{stroke:'#ffd34e','stroke-width':2.5});}
 add('polyline',{points:`${M.x},${M.y-18} ${M.x+18},${M.y-18} ${M.x+18},${M.y}`,fill:'none',stroke:'#ffd34e','stroke-width':2.5});
 for(let [name,X] of [['A',U],['B',V],['P',P],['M',M]]){
   add('circle',{cx:X.x,cy:X.y,r:name==='P'?8:5.5,fill:name==='P'?'#ff5656':'#fff',stroke:'#111','stroke-width':2,'data-point':name==='P'?'P':''});
   add('text',{x:X.x+10,y:X.y-12},svg,name)
 }
 add('text',{x:M.x+22,y:92,fill:'#ffd34e'},svg,'Серединный перпендикуляр');
 document.getElementById('stats').innerHTML='<span class="stat">PA = '+dist(P,U).toFixed(1)+'</span><span class="stat">PB = '+dist(P,V).toFixed(1)+'</span><span class="stat">AM = MB</span><span class="stat">PM ⟂ AB</span>';
 document.getElementById('factResult').textContent='Для любой точки P на серединном перпендикуляре PA = PB.';
}

function render3(){
 svg.innerHTML='';
 const V=[A,B,C], mids=[mid(B,C),mid(C,A),mid(A,B)];
 const centroid={x:(A.x+B.x+C.x)/3,y:(A.y+B.y+C.y)/3};
 add('polygon',{points:V.map(p=>`${p.x},${p.y}`).join(' '),fill:'#65b7ff','fill-opacity':'.035',stroke:'none'});
 [[A,B],[B,C],[C,A]].forEach(([p,q])=>line(p,q,{class:'edge'}));
 // Each median runs from a vertex to the opposite side's midpoint.
 V.forEach((p,i)=>line(p,mids[i],{stroke:'#ff5656','stroke-width':2.8}));
 // Mark each median at its one-third and two-third points, making the 2:1 split explicit.
 V.forEach((p,i)=>{const m=mids[i],d=sub(m,p),len=Math.hypot(d.x,d.y)||1,n={x:-d.y/len,y:d.x/len};[1/3,2/3].forEach(t=>{const q=plus(p,mul(d,t));line(plus(q,mul(n,-8)),plus(q,mul(n,8)),{stroke:'#ffd34e','stroke-width':3});});});
 add('circle',{cx:centroid.x,cy:centroid.y,r:7,fill:'#ffd34e',stroke:'#111','stroke-width':2});
 add('text',{x:centroid.x+12,y:centroid.y-12,fill:'#ffd34e'},svg,'G');
 for(let [name,Q] of [['A',A],['B',B],['C',C]]){add('circle',{cx:Q.x,cy:Q.y,r:6,class:'vertex','data-v':name});add('text',{x:Q.x+11,y:Q.y-12},svg,name)}
 mids.forEach((m,i)=>add('circle',{cx:m.x,cy:m.y,r:4.5,fill:'#fff',stroke:'#111','stroke-width':1.5}));
 // Label ratio portions along all medians without cluttering the centroid.
 document.getElementById('stats').innerHTML='<span class="stat">Все 3 медианы пересекаются в G</span><span class="stat">От вершины до G: ⅔ медианы</span><span class="stat">От G до середины стороны: ⅓ медианы</span><span class="stat">AG : GM = BG : GN = CG : GK = 2 : 1</span>';
 document.getElementById('factResult').textContent='Точка пересечения медиан делит каждую медиану в отношении 2 : 1, считая от вершины.';
}

let mode4=1;
function render4(which){
 svg.innerHTML=''; const V=[A,B,C], mids=[mid(B,C),mid(C,A),mid(A,B)],G={x:(A.x+B.x+C.x)/3,y:(A.y+B.y+C.y)/3};
 const colors=['#42c8f5','#ff7c9c','#ffd166'];
 add('polygon',{points:V.map(p=>`${p.x},${p.y}`).join(' '),fill:'#65b7ff','fill-opacity':'.025',stroke:'none'});
 [[A,B],[B,C],[C,A]].forEach(([p,q])=>line(p,q,{class:'edge'}));
 if(which===1){
   // One median from C, plus altitude from C to AB.
   const M=mids[2]; line(C,M,{stroke:'#9aa3ad','stroke-width':3});
   const d=sub(B,A),den=d.x*d.x+d.y*d.y||1,t=Math.max(0,Math.min(1,((C.x-A.x)*d.x+(C.y-A.y)*d.y)/den)),H=plus(A,mul(d,t));
   line(C,H,{stroke:'#ff3b45','stroke-width':3});
   // Right-angle marker follows the side direction and is correctly placed at H.
   const u=mul(d,1/Math.sqrt(den)),v=sub(C,H),vl=Math.hypot(v.x,v.y)||1,w=mul(v,1/vl),sz=16;
   const p1=plus(H,mul(u,sz)),p2=plus(p1,mul(w,sz)),p3=plus(H,mul(w,sz));
   add('polyline',{points:[H,p1,p2,p3].map(p=>`${p.x},${p.y}`).join(' '),fill:'none',stroke:'#ffd166','stroke-width':2.5});
   add('polygon',{points:[A,B,M].map(p=>`${p.x},${p.y}`).join(' '),fill:'#ffd500','fill-opacity':'.52',stroke:'none'});
   add('polygon',{points:[A,M,C].map(p=>`${p.x},${p.y}`).join(' '),fill:'#19bfff','fill-opacity':'.52',stroke:'none'});
   line(C,M,{stroke:'#ffffff','stroke-width':3});line(C,H,{stroke:'#ff3b45','stroke-width':3});
   document.getElementById('stats').innerHTML='<span class="stat">BM = MC</span><span class="stat">Общее основание и высота</span><span class="stat">S(ACM) = S(BCM)</span>';
   document.getElementById('factResult').textContent='Медиана делит треугольник на две равновеликие части.';
 } else if(which===2){
   // Median segments gray; centroid-to-side altitudes dashed red; paired equal-area regions.
   [[C,mids[2]],[A,mids[0]],[B,mids[1]]].forEach(([P,Q])=>line(P,Q,{stroke:'#ffffff','stroke-width':2.6}));
   const pairs=[[C,A,G,'#ff9f43'],[A,B,G,'#f7c7ff'],[C,B,G,'#8ee3ff']];
   pairs.forEach(([P,Q,R,col])=>add('polygon',{points:[P,Q,R].map(p=>`${p.x},${p.y}`).join(' '),fill:col,'fill-opacity':'.42',stroke:col,'stroke-width':1.8}));
   // altitude from G to each side with correctly oriented right-angle marker
   [[A,B],[B,C],[C,A]].forEach(([P,Q])=>{
     const d=sub(Q,P),den=d.x*d.x+d.y*d.y||1,t=Math.max(0,Math.min(1,((G.x-P.x)*d.x+(G.y-P.y)*d.y)/den)),H=plus(P,mul(d,t));
     line(G,H,{stroke:'#ff4d5f','stroke-width':2.5,'stroke-dasharray':'6 5'});
     const u=mul(d,1/Math.sqrt(den)),v=sub(G,H),vl=Math.hypot(v.x,v.y)||1,w=mul(v,1/vl),z=11;
