function validateTask(t,ids){const E=[];if(!t||typeof t!=='object')return ['Задача должна быть объектом {…}'];

 let env;try{env=ENG.envOf(t,t.proto);if(!Number.isFinite(env.ans))E.push('ответ прототипа не число: '+env.ans)}catch(e){E.push('вычисление прототипа: '+e.message);return E}
 try{ENG.tpl(t.text,env);(t.steps||[]).forEach(s=>ENG.tpl(s[1],env))}catch(e){E.push('шаблон: '+e.message)}
 if(t.fig)try{ENG.figSVG(t.fig,env)}catch(e){E.push('чертёж: '+e.message)}
 if(t.v&&Object.keys(t.v).length){const g=ENG.gen(t,[t.proto]);if(!g)E.push('не удалось подобрать ни одного варианта с новыми числами: проверьте диапазоны v и условие ok (ответ должен быть конечной дробью, не больше dec знаков)')}
 (t.th||[]).forEach(id=>{if(!(BANK.theory||{})[id]&&!(ids&&ids.theory&&ids.theory[id]))E.push('нет стикера теории «'+id+'»')});return E}

 for(let i=0;i<3;i++){const v=ENG.gen(t,[t.proto]);if(!v){h+='<div class="card err">Вариант с новыми числами не подобрался</div>';break}const e=ENG.envOf(t,v);h+=`<div class="card"><b>Вариант с новыми числами ${i+1}</b> · ответ <b>${ENG.fmt(e.ans)}</b><p>${ENG.mk(ENG.tpl(t.text,e))}</p>${t.fig?safeFig(t.fig,e):''}<details><summary class="note">решение</summary>${(t.steps||[]).map(s=>`<p><b>${ENG.tpl(s[0],e)}.</b> ${ENG.mk(ENG.tpl(s[1],e))}</p>`).join('')}</details></div>`}}catch(e){h+=`<div class="err">${esc(e.message)}</div>`}return `<div class="prevgrid">${h}</div>`}

 <p><b>v</b> — переменные для вариантов с новыми числами: <code>[10,80]</code> целые от 10 до 80; <code>{"min":1,"max":10,"step":0.5}</code>; <code>{"list":[120,135,150]}</code>; <code>{"set":[[3,4,5],[7,24,25]],"as":["p","q","r"]}</code> — наборы.</p>

function compact(level=1){let n=0;const keepA=level>1?2:4,keepBad=level>1?2:4,now=Date.now();

    for(const r of[T.p,...(T.a||[])])if(r&&r.bad&&r.bad.length>keepBad){r.bad=r.bad.slice(-keepBad);n++}}

function validateTask(t,ids){const E=[];if(!t||typeof t!=='object')return ['Задача должна быть объектом {…}'];

 if(!['min','max','minv','maxv','eq'].includes(t.kind))E.push('kind: min | max | minv | maxv | eq');
 if((t.kind==='minv'||t.kind==='maxv')&&!t.seg&&!(t.pts&&t.pts.length))E.push('для наибольшего/наименьшего нужен seg или pts');
 if(!(BANK.topics||[]).some(x=>x.id===t.topic)&&!(ids&&ids.topics&&ids.topics.some(x=>x.id===t.topic)))E.push(`тема «${t.topic}» не найдена (есть: ${(BANK.topics||[]).map(x=>x.id).join(', ')})`);
 let env;try{env=ENG.envOf(t,t.proto);if(!Number.isFinite(env.ans))E.push('ответ прототипа не число: '+env.ans)}catch(e){E.push('вычисление прототипа: '+e.message);return E}
 try{ENG.tpl(t.text,env);(t.steps||[]).forEach(s=>ENG.tpl(s[1],env))}catch(e){E.push('шаблон: '+e.message)}
 try{const cx=taskCtx(t,env);if(!Number.isFinite(cx.f(cx.win[0]+(cx.win[1]-cx.win[0])*.37))&&!Number.isFinite(cx.f(cx.win[0]+(cx.win[1]-cx.win[0])*.61)))E.push('функция f не вычисляется в окне графика — проверьте f');

/* ---------------- пересказ карточек: d — подробно, s — кратко ---------------- */
Object.assign(FS,{
 t1:{d:'Точка максимума или минимума — это икс. А наибольшее или наименьшее значение — это игрек: его получают, подставив найденный икс в функцию. Частая ошибка — записать в ответ икс, когда спрашивают значение.',s:'Точка — это икс, значение — это игрек.'},
 t2:{d:'Наибольшее и наименьшее значение на отрезке ищем только в двух местах: в точках экстремума, которые лежат на отрезке, и на концах отрезка. Если функция на отрезке возрастает, наименьшее значение на левом конце, а наибольшее — на правом. Если убывает — наоборот.',s:'Ищем только в экстремумах внутри отрезка и на его концах.'},
 t3:{d:'Знак производной показывает поведение функции. Если производная положительна, функция возрастает, если отрицательна — убывает. Если при переходе через точку знак меняется с плюса на минус, это максимум, а с минуса на плюс — минимум. Если знак не меняется, экстремума нет.',s:'Плюс сменился на минус — максимум, минус на плюс — минимум.'},
 t4:{d:'Алгоритм из восьми шагов. Первое — область определения. Второе — производная. Третье — нули числителя производной. Четвёртое — нули знаменателя. Пятое — отбираем точки, которые лежат на отрезке. Шестое — отмечаем их на числовой прямой. Седьмое — расставляем знаки производной пробной точкой. Восьмое — рисуем стрелки и делаем вывод.',s:'Область определения, производная, нули, прямая, знаки, вывод.'},
 t5:{d:'Монотонная обёртка. Если снаружи стоит возрастающая функция — логарифм с основанием больше единицы, корень или степень с основанием больше единицы, — то вся функция наименьшая там же, где наименьшее выражение внутри, и наибольшая там же, где наибольшее. Если внешняя функция убывает, минимум и максимум меняются местами. И обязательно проверяем область определения.',s:'Внешняя функция возрастает — экстремум там же и того же вида; убывает — вид меняется.'},
 t6:{d:'У параболы а икс квадрат плюс бэ икс плюс цэ при положительном а — минимум, при отрицательном — максимум, и он находится в вершине. Абсцисса вершины равна минус бэ, делённому на два а.',s:'Вершина параболы: минус бэ на два а.'},
 t7:{d:'Производная степени: показатель выносим вперёд, а саму степень уменьшаем на единицу. Корень — это степень одна вторая, поэтому производная корня — единица, делённая на два корня. Икс, умноженный на корень из икс, — это степень три вторых, её производная — три вторых корня из икс. Производная а, делённого на икс, равна минус а, делённому на икс в квадрате.',s:'Показатель вперёд, степень на единицу меньше.'},
 t8:{d:'Если в знаменателе одночлен, например икс, каждое слагаемое числителя делим на него отдельно — производная станет простой. Но если в знаменателе сумма, например икс плюс один, делить почленно нельзя.',s:'На одночлен делим почленно, на сумму — нельзя.'},
 t9:{d:'Производная произведения: производная первого множителя на второй плюс первый на производную второго. Если перемножаются многочлены, часто проще раскрыть скобки. А если многочлен умножен на экспоненту, синус или косинус — пользуемся формулой.',s:'Производная произведения: у штрих вэ плюс у вэ штрих.'},
 t11:{d:'Производная натурального логарифма икс — единица, делённая на икс. Коэффициент внутри логарифма сокращается. Производная логарифма от икс плюс а — единица, делённая на икс плюс а. Показатель степени под логарифмом выносим вперёд как множитель. И помните: логарифм единицы равен нулю.',s:'Производная логарифма — единица на аргумент.'},
 t12:{d:'Под логарифмом может стоять только положительное число. Граница области определения на прямой — выколотая точка, и за ней знаки не ставим. Корень производной вне области определения отбрасываем.',s:'Под логарифмом — строго положительное число.'},
 t13:{d:'Производная экспоненты — она сама. Если в показателе стоит ка икс плюс бэ, умножаем на производную показателя, то есть на ка. Если в показателе а минус икс — появляется минус.',s:'Экспонента — сама себе производная, умножаем на производную показателя.'},
 t14:{d:'Экспонента всегда положительна. Поэтому её выносят за скобку, и знак производной определяет только скобка. Нули производной — это корни многочлена в скобке.',s:'Экспонента положительна — знак решает скобка.'},
 t15:{d:'Замена: тэ равно е в степени икс. Тогда е в степени два икс — это тэ в квадрате, и получается парабола по тэ. Не забываем пересчитать отрезок: если икс от нуля до трёх, то тэ от единицы до е в кубе.',s:'Замена тэ равно е в степени икс даёт параболу.'},
 t16:{d:'Производная синуса — косинус. Производная косинуса — минус синус. Производная тангенса — единица, делённая на косинус в квадрате.',s:'Синус в косинус, косинус в минус синус, тангенс — единица на косинус квадрат.'},
 t17:{d:'Если уравнение «производная равна нулю» требует, чтобы синус или косинус были больше единицы по модулю, корней нет. Тогда производная не меняет знак, функция монотонна, и экстремумов внутри отрезка нет: ответы на концах.',s:'У производной нет корней — функция монотонна.'},
 t18:{d:'Косинус нуля — единица, синус нуля — ноль. Синус пи шестых и косинус пи третьих равны одной второй. Синус и косинус пи четвёртых равны корню из двух, делённому на два. Тангенс пи четвёртых равен единице.',s:'Табличные значения синуса и косинуса.'},
 t19:{d:'После формулы производной произведения слагаемые с косинусом сокращаются, и остаётся произведение со множителем синус икс. Знак синуса на промежутке известен — дальше остаются знаки.',s:'Слагаемые с косинусом сокращаются.'},
 t21:{d:'Ответ в двенадцатом задании — целое число или конечная десятичная дробь. Если значение на конце отрезка содержит пи, логарифм или корень, это не ответ — ответ в точке экстремума.',s:'Ответ — «красивое» число.'}
});
