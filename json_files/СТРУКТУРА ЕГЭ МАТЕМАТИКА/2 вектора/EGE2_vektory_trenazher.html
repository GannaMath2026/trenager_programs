<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ЕГЭ №2 · Векторы — тренажёр</title>
<style>
:root{--bg:#f4f6fb;--bg2:#eef1f8;--panel:#fff;--panel2:#f7f9fd;--ink:#16213a;--muted:#66748f;--line:#e2e7f1;--blue:#4f6bff;--blue2:#eef1ff;--ok:#16a06a;--okbg:#e6f7ef;--bad:#e2475b;--badbg:#fdecee;--warn:#f0a020;--warnbg:#fff4dc;--c:#4f6bff;--sh:0 1px 2px #16213a0d,0 8px 28px #16213a12;--r:18px;--fs:16px;--hand:"Comic Sans MS","Segoe Print","Bradley Hand","Marker Felt","Chalkboard SE",cursive;--mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace}
body.theme-dark{--bg:#0e1424;--bg2:#121a2e;--panel:#172036;--panel2:#1c2742;--ink:#e7ecf7;--muted:#97a5c2;--line:#2a3654;--blue2:#23305a;--okbg:#123a2c;--badbg:#45202a;--warnbg:#3f3216;--sh:0 1px 2px #0006,0 10px 30px #0007}
body.font-small{--fs:14px}body.font-medium{--fs:16px}body.font-large{--fs:18px}body.font-xlarge{--fs:21px}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font:var(--fs)/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(900px 500px at 0% -10%,#e5eaff 0,transparent 60%),radial-gradient(800px 600px at 110% 0%,#ffe9f3 0,transparent 55%),var(--bg);background-attachment:fixed;min-height:100vh}
body.theme-dark{background:radial-gradient(900px 500px at 0% -10%,#1d2a55 0,transparent 60%),radial-gradient(800px 600px at 110% 0%,#3a1d3a 0,transparent 55%),var(--bg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
/* header */
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:9px 18px;background:color-mix(in srgb,var(--panel) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;margin-right:auto;user-select:none}
.logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#4f6bff,#b84fff);color:#fff;font-weight:900;font-size:15px;box-shadow:0 4px 14px #4f6bff55}
.brand b{display:block;font-size:16px;line-height:1.1}.brand small{color:var(--muted);font-size:12px;font-weight:600}
.hbtn{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:7px 12px;font-size:14px;font-weight:650;cursor:pointer;white-space:nowrap;transition:.15s}
.hbtn:hover{border-color:var(--blue);color:var(--blue)}.hbtn.active{background:var(--ink);color:var(--panel);border-color:var(--ink)}.hbtn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.fonts{display:inline-flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--panel)}.fonts button{border:0;background:none;padding:7px 9px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}.fonts button.active{background:var(--blue);color:#fff}
/* generic */
.btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 15px;font-weight:650;cursor:pointer;transition:.15s;font-size:calc(var(--fs) - 1px)}
.btn:hover{border-color:var(--c);color:var(--c)}.btn.primary{background:var(--c);border-color:var(--c);color:#fff}.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.small{padding:5px 10px;font-size:13px;border-radius:9px}.btn:disabled{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:750;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.chip.c{background:color-mix(in srgb,var(--c) 14%,var(--panel));color:var(--c);border-color:transparent}.chip.ok{background:var(--okbg);color:var(--ok);border-color:transparent}.chip.bad{background:var(--badbg);color:var(--bad);border-color:transparent}.chip.warn{background:var(--warnbg);color:#b07000;border-color:transparent}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.mono{font-family:var(--mono)}
kbd{font-family:var(--mono);background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 5px;font-size:.9em}
/* home */
#home{max-width:1240px;margin:0 auto;padding:26px 20px 60px}
.hero{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between;margin-bottom:22px}
.hero h1{font-size:clamp(26px,3.4vw,40px);line-height:1.1;margin:0 0 6px;letter-spacing:-.02em}.hero h1 span{background:linear-gradient(90deg,#4f6bff,#c04fff 60%,#ff5f8f);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:var(--muted);max-width:620px}
.ring{--p:0;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--blue) calc(var(--p)*1%),var(--line) 0);position:relative}.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--panel)}.ring b{position:relative;font-size:20px}.ring small{position:relative;display:block;font-size:11px;color:var(--muted);text-align:center;margin-top:-6px}
.herostat{display:flex;gap:16px;align-items:center;padding:14px 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tile{position:relative;padding:16px 16px 14px;cursor:pointer;transition:.18s;overflow:hidden;min-height:150px;display:flex;flex-direction:column}
.tile::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--c);opacity:.09;transition:.25s}
.tile:hover{transform:translateY(-3px);box-shadow:0 2px 4px #16213a10,0 16px 36px #16213a1c}.tile:hover::after{opacity:.16;transform:scale(1.15)}
.tile .num{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:900;font-size:19px;color:#fff;background:var(--c);box-shadow:0 6px 16px color-mix(in srgb,var(--c) 45%,transparent)}
.tile h3{margin:10px 0 2px;font-size:calc(var(--fs) + 1px);line-height:1.25}.tile p{margin:0 0 10px;color:var(--muted);font-size:13px;flex:1}
.bar{height:7px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--c);border-radius:9px;transition:width .4s}
.tile .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;font-weight:650}
.tile.pc{opacity:.92}.tile.pc .num{background:repeating-linear-gradient(135deg,var(--c),var(--c) 6px,color-mix(in srgb,var(--c) 75%,#fff) 6px,color-mix(in srgb,var(--c) 75%,#fff) 12px)}
.sect-h{display:flex;align-items:baseline;gap:10px;margin:28px 0 12px}.sect-h h2{margin:0;font-size:20px}.sect-h span{color:var(--muted);font-size:13px}
/* module layout */
#mod{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;max-width:1500px;margin:0 auto;padding:16px 18px 50px}
#mod aside{position:sticky;top:70px;align-self:start;max-height:calc(100vh - 86px);overflow:auto;padding:14px}
.modhead{display:flex;gap:11px;align-items:center;margin-bottom:10px}.modhead .num{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:900;font-size:20px;color:#fff;background:var(--c);flex:none}
.modhead b{display:block;line-height:1.2}.modhead small{color:var(--muted);font-size:12px}
.back{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;margin-bottom:10px;border:0;background:none;padding:0}.back:hover{color:var(--c)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px;margin:10px 0}.tabs button{border:0;background:none;border-radius:8px;padding:5px 2px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}.tabs button.active{background:var(--panel);color:var(--c);box-shadow:0 1px 3px #0002}
.secttl{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:12px 4px 5px}
.ti{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:11px;cursor:pointer;border:1px solid transparent;font-size:calc(var(--fs) - 2px);line-height:1.3;margin:2px 0}
.ti:hover{background:var(--panel2)}.ti.active{background:color-mix(in srgb,var(--c) 11%,var(--panel));border-color:color-mix(in srgb,var(--c) 40%,transparent)}
.ti .st{width:22px;height:22px;flex:none;border-radius:7px;display:grid;place-items:center;font-size:12px;background:var(--panel2);border:1px solid var(--line);font-weight:800;color:var(--muted)}
.ti.ok .st{background:var(--ok);color:#fff;border-color:var(--ok)}.ti.bad .st{background:var(--badbg);color:var(--bad);border-color:transparent}.ti.hint .st{background:var(--warnbg);border-color:transparent}
.ti .tt{flex:1;min-width:0}.ti .tt small{display:block;color:var(--muted);font-size:11px}.ti.an{margin-left:16px}.ti.an::before{content:"↳";color:var(--muted);margin-right:-3px}
.ti .flags{display:flex;gap:2px}.ti .flags button{border:0;background:none;cursor:pointer;font-size:14px;padding:0 2px;opacity:.35;filter:grayscale(1)}.ti .flags button.on{opacity:1;filter:none}
main.work{min-width:0}
/* stickers */
.stickbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.board{display:flex;flex-wrap:wrap;gap:20px;padding:18px 8px 8px;margin-bottom:6px}.board.strip{flex-wrap:nowrap;overflow-x:auto;gap:16px;padding:16px 6px 12px;scroll-snap-type:x mandatory}.board.strip .sticker{flex:0 0 255px;font-size:calc(var(--fs) - 2px);padding:16px 13px 11px;scroll-snap-align:start}.board.strip .sticker h4{font-size:calc(var(--fs) + 1px)}
.sticker{--rot:-1.5deg;--sc:#fff6a8;position:relative;flex:1 1 230px;max-width:360px;background:var(--sc);color:#2b2a26;padding:20px 16px 14px;border-radius:3px 3px 14px 3px;box-shadow:0 1px 1px #0001,0 10px 18px -6px #0003;transform:rotate(var(--rot));transition:.2s;font-size:calc(var(--fs) - 1px);line-height:1.45}
.sticker:hover{transform:rotate(0) scale(1.02);z-index:2}
.sticker::before{content:"";position:absolute;top:-10px;left:50%;width:84px;height:22px;transform:translateX(-50%) rotate(-3deg);background:#ffffff8c;border:1px solid #0000000d;box-shadow:0 1px 2px #0001}
.sticker h4{font-family:var(--hand);font-size:calc(var(--fs) + 3px);margin:0 0 6px;line-height:1.2}
.sticker p{margin:5px 0}.sticker .big{font-family:var(--mono);font-weight:800;font-size:calc(var(--fs) + 2px);background:#ffffff7a;border-radius:8px;padding:3px 8px;display:inline-block;margin:2px 0}
.sticker code{font-family:var(--mono);background:#ffffff80;border-radius:5px;padding:0 4px}
.sticker .scrawl{font-family:var(--hand);color:#b4235a}
.sticker:nth-child(5n+1){--sc:#fff3a0;--rot:-1.6deg}.sticker:nth-child(5n+2){--sc:#ffd7e4;--rot:1.3deg}.sticker:nth-child(5n+3){--sc:#cdeffd;--rot:-.6deg}.sticker:nth-child(5n+4){--sc:#d4f5d0;--rot:1.8deg}.sticker:nth-child(5n+5){--sc:#ffe1c2;--rot:-1.1deg}
/* task */
.taskcard{padding:clamp(16px,2vw,26px)}
.thead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}.thead h2{margin:0 auto 0 0;font-size:calc(var(--fs) + 6px);letter-spacing:-.01em;line-height:1.2}
.repair{display:flex;gap:10px;align-items:center;background:var(--warnbg);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-weight:650}
.cond{background:var(--panel2);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;padding:14px 16px;margin:10px 0 14px;font-size:calc(var(--fs) + 1px)}
.cond .f{display:block;font-family:var(--mono);font-weight:800;font-size:calc(var(--fs) + 4px);margin:8px 0 2px;color:var(--c)}
.cond table{border-collapse:collapse;margin:8px 0;background:var(--panel)}.cond td,.cond th{border:1px solid var(--line);padding:5px 10px;text-align:center}.cond th{background:var(--panel2)}
.tool{border:1px dashed color-mix(in srgb,var(--c) 45%,var(--line));border-radius:16px;padding:12px 14px;margin:12px 0;background:color-mix(in srgb,var(--c) 3%,var(--panel))}
.tool>.tl{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--c);margin-bottom:8px}
.ansrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0 6px}
.ansrow input{flex:1;min-width:180px;max-width:360px;padding:11px 14px;border:2px solid var(--line);border-radius:13px;background:var(--panel);font-size:calc(var(--fs) + 3px);font-weight:800;outline:none;transition:.15s}.ansrow input:focus{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 18%,transparent)}
.fb{min-height:26px;font-weight:750;margin:6px 0}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.solved .cond{border-left-color:var(--ok)}
.hintbox{margin-top:10px}.step{display:flex;gap:11px;padding:10px 12px;border-radius:13px;background:var(--warnbg);margin:6px 0;animation:pop .3s}.step b.n{flex:none;width:24px;height:24px;border-radius:50%;background:#f0a020;color:#fff;display:grid;place-items:center;font-size:13px}
.step .h{font-weight:800;margin-bottom:2px}
@keyframes pop{from{transform:translateY(6px);opacity:0}}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
/* matrix/report */
#page{max-width:1300px;margin:0 auto;padding:20px}
.mtable{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:14px}
.mtable th,.mtable td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left}.mtable th{background:var(--panel2);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);position:sticky;top:57px}
.mtable td.c{text-align:center;cursor:pointer}.mtable tr.grp td{background:var(--panel2);font-weight:800}.mtable tr.sub td{font-size:13px}
/* modal */
.overlay{position:fixed;inset:0;z-index:60;background:#0e1424a8;display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto;backdrop-filter:blur(3px)}
.modal{background:var(--panel);border-radius:20px;box-shadow:0 30px 80px #0006;width:min(1000px,100%);padding:20px 22px;position:relative}
.modal .x{position:absolute;right:14px;top:12px}
dialog{border:0;border-radius:20px;padding:20px;width:min(560px,94vw);background:var(--panel);color:var(--ink);box-shadow:0 30px 80px #0006}dialog::backdrop{background:#0e1424a8;backdrop-filter:blur(3px)}
.sturow{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:6px;margin:5px 0}.sturow.cur{border-color:var(--blue);background:var(--blue2)}.sturow .pick{flex:1;text-align:left;font-weight:700;border:0;background:none;cursor:pointer;padding:6px}.sturow small{color:var(--muted);white-space:nowrap}
.stuadd{display:flex;gap:6px;margin-top:10px}.stuadd input{flex:1;padding:9px 12px;border-radius:11px;border:1px solid var(--line);background:var(--bg)}
iframe.t16{width:100%;height:calc(100vh - 84px);border:0;border-radius:18px;background:var(--panel);box-shadow:var(--sh)}
@media(max-width:900px){#mod{grid-template-columns:1fr}#mod aside{position:static;max-height:300px}header{flex-wrap:wrap}.brand small{display:none}}
@media print{header,#mod aside,.navrow,.noprint{display:none!important}body{background:#fff}.overlay{position:static;background:none;padding:0}.modal{box-shadow:none;width:100%}body.printing>*:not(.overlay){display:none!important}}
/* module-specific */
.tiles{display:flex;flex-wrap:wrap;gap:3px;align-items:flex-end;user-select:none}
.ch{font-family:var(--mono);font-weight:800;font-size:calc(var(--fs) + 6px);min-width:1.05em;text-align:center;padding:4px 0;border-radius:6px}
.cut{width:12px;align-self:stretch;cursor:pointer;position:relative;border-radius:4px}.cut:hover{background:color-mix(in srgb,var(--c) 18%,transparent)}.cut.on::after{content:"";position:absolute;left:5px;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--c)}
.seg{display:inline-flex;flex-direction:column;align-items:center;border-radius:10px;padding:2px 3px;transition:.15s}.seg .lt{font-weight:900;font-size:calc(var(--fs) + 2px);height:1.5em}.seg.good{background:var(--okbg)}.seg.good .lt{color:var(--ok)}.seg.badseg{background:var(--badbg)}.seg.badseg .lt{color:var(--bad)}
.codetab{border-collapse:collapse;background:var(--panel)}.codetab td,.codetab th{border:1px solid var(--line);padding:4px 10px;text-align:center;font-family:var(--mono);font-weight:700}.codetab th{background:var(--panel2);font-family:inherit}
.cards{display:flex;flex-wrap:wrap;gap:7px}.fcard{border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:6px 11px;cursor:pointer;font-family:var(--mono);font-weight:800;transition:.12s;display:inline-flex;gap:7px;align-items:baseline}.fcard small{font-family:system-ui;color:var(--c);font-weight:900}.fcard:hover{border-color:var(--c);transform:translateY(-2px)}.fcard.used{opacity:.4}
.assembled{min-height:52px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:8px 0;background:var(--panel)}
.piece{background:color-mix(in srgb,var(--c) 14%,var(--panel));border-radius:9px;padding:4px 8px;font-family:var(--mono);font-weight:800;cursor:pointer;display:inline-flex;gap:5px;align-items:baseline}.piece small{color:var(--c);font-family:system-ui;font-weight:900}.piece:hover{background:var(--badbg)}
.addrline{font-family:var(--mono);font-size:calc(var(--fs) + 4px);font-weight:800;word-break:break-all}
.codebox{font-family:var(--mono);background:#0f1730;color:#e5ecff;border-radius:14px;padding:12px 16px;white-space:pre;overflow:auto;font-size:calc(var(--fs));line-height:1.6}
.codebox .k{color:#8fb0ff;font-weight:700}.codebox .s{color:#9be59b}.codebox .n{color:#ffc76b}
.pairs{display:flex;flex-wrap:wrap;gap:6px}.pair{border:2px solid var(--line);border-radius:11px;padding:4px 10px;font-family:var(--mono);font-weight:800;cursor:pointer;background:var(--panel);user-select:none}.pair.y{border-color:var(--ok);background:var(--okbg)}.pair.n{border-color:var(--bad);background:var(--badbg);text-decoration:line-through}
.ttab{border-collapse:collapse;font-size:14px}.ttab td,.ttab th{border:1px solid var(--line);padding:4px 9px;text-align:center}.ttab th{background:var(--panel2)}.T{color:var(--ok);font-weight:900}.F{color:var(--bad);font-weight:900}
.xchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.xchip{border-radius:8px;padding:2px 8px;font-family:var(--mono);font-weight:800;font-size:13px}.xchip.t{background:var(--okbg);color:var(--ok)}.xchip.f{background:var(--badbg);color:var(--bad)}
.screen{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.lcd{font-family:var(--mono);font-size:calc(var(--fs) + 22px);font-weight:900;color:var(--c);background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:4px 18px;min-width:120px;text-align:center}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin:8px 0}.cv{background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:3px 10px;font-family:var(--mono);font-weight:800}.cv.fin{background:var(--okbg);border-color:var(--ok)}.cv.goal{background:var(--warnbg);border-color:var(--warn)}.arw{display:inline-flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);line-height:1.1;margin:0 2px}.arw b{color:var(--c);font-size:11px}
.cmdbtn{border:2px solid var(--c);background:var(--panel);color:var(--c);border-radius:13px;padding:9px 14px;font-weight:800;cursor:pointer}.cmdbtn:hover{background:color-mix(in srgb,var(--c) 10%,var(--panel))}.cmdbtn .k{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--c);color:#fff;margin-right:6px;font-size:13px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:800px){.split{grid-template-columns:1fr}}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}.pane h5{margin:0 0 6px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.slide{display:flex;align-items:center;gap:10px}.slide input[type=range]{flex:1;accent-color:var(--c)}
svg text{font-family:system-ui,Arial,sans-serif}
.gnode{cursor:pointer}.gnode circle{fill:var(--panel);stroke:var(--ink);stroke-width:2.5}.gnode text{fill:var(--ink);font-weight:800;font-size:17px;text-anchor:middle;dominant-baseline:central;pointer-events:none}

.euler{position:relative;display:inline-block}.euler canvas{width:340px;height:300px;border-radius:14px;border:1px solid var(--line);background:var(--panel)}.euler input{position:absolute;width:54px;transform:translate(-50%,-50%);text-align:center;border:1.5px solid #0003;border-radius:8px;background:#ffffffd9;font-weight:800;font-size:13px;padding:2px;color:#16213a}

.scinfo{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}.big2{font-size:calc(var(--fs) + 2px);line-height:1.9}.hint2{color:var(--muted);font-size:14px}.sctip{font-size:12px;color:var(--muted);margin-top:8px}.ok2{color:var(--ok);font-weight:800}.no2{color:var(--bad);font-weight:700}

{m:2,n:'06',a:'28',t:'Даны векторы $a(1; 2), $b(3; −6) и $c(4; −3). Найдите скалярное произведение ($a + $b)·$c.',

{m:2,n:'09',a:'42',p:'p09',t:'На координатной плоскости изображены векторы $a, $b и $c, координаты этих векторов — целые числа. Найдите скалярное произведение $a·($b + $c).',

  cfg:{pts:{O:[-3,-2],A:[3,2],B:[-1,3]},draw:(G,P)=>{const a=V(P.O,P.A),b=V(P.O,P.B),d=V(P.B,P.A);return{svg:arrow(G,P.O,P.A,VC.a,'a')+arrow(G,P.O,P.B,VC.b,'b')+arrow(G,P.B,P.A,VC.m,'',{w:4}),info:`<div class="big2">${vv('a')} = ${co(a)}, ${vv('b')} = ${co(b)}<br><span style="color:${VC.m}">${vv('a')} − ${vv('b')}</span> = <b>${co(d)}</b></div><p class="hint2">Проверка: ${vv('b')} + (${vv('a')} − ${vv('b')}) = ${vv('a')} — дойти по b, потом по фиолетовой, и окажешься в конце a.</p>`}}}},
 mulk:{title:'Умножение на число',text:'Вектор k·a: каждую координату умножаем на k. Если k > 0 — направление то же (сонаправлен), если k < 0 — разворачивается в обратную сторону. Длина меняется в |k| раз.',
  cfg:{pts:{O:[0,0],A:[2,1]},fixed:[],x:[-7,8],y:[-5,6],k:{lab:'k',min:-3,max:3,step:.5,v:2},draw:(G,P,k)=>{const a=V(P.O,P.A),ka=mul(k,a);return{svg:arrow(G,P.O,add(P.O,ka),VC.m,'',{w:6,op:.75})+arrow(G,P.O,P.A,VC.a,'a'),info:`<div class="big2">${vv('a')} = ${co(a)}<br>${fr(k)}·${vv('a')} = (${fr(k)}·${nf(a[0])}; ${fr(k)}·${nf(a[1])}) = <b>${co(ka)}</b></div><p>${k>0?'k &gt; 0 — <b>сонаправлены</b>':k<0?'k &lt; 0 — <b>противоположно направлены</b>':'k = 0 — нулевой вектор'}; длина в ${nf(Math.abs(k))} раза ${Math.abs(k)>=1?'больше':'меньше'}.</p>`}}}},
 len:{title:'Длина вектора',text:'Координаты вектора — это катеты прямоугольного треугольника, сам вектор — гипотенуза. Поэтому длина считается по теореме Пифагора.',
  cfg:{pts:{A:[-2,-1],B:[4,7]},x:[-5,8],y:[-3,8],draw:(G,P)=>{const v=V(P.A,P.B),L2=len2(v);return{svg:legs(G,P.A,P.B)+arrow(G,P.A,P.B,VC.a,'',{w:4}),info:`<div class="big2">${vv('AB')} = ${co(v)}<br>|${vv('AB')}| = √(${nf(v[0])}² + ${nf(v[1])}²) = √${L2} = <b>${sqr(L2)}</b></div><p class="hint2">Попробуй найти «красивые» векторы: (3; 4) → 5, (6; 8) → 10, (5; 12) → 13.</p>`}}}},
 dot:{title:'Скалярное произведение и угол',text:'Скалярное произведение — это <b>число</b>: x₁x₂ + y₁y₂. Оно же равно |a|·|b|·cos φ. Отсюда угол: знак подсказывает, острый он, прямой или тупой.',
  cfg:{pts:{O:[0,0],A:[5,2],B:[1,4]},x:[-6,7],y:[-4,6],draw:(G,P)=>{const a=V(P.O,P.A),b=V(P.O,P.B),d=dot(a,b),la=Math.sqrt(len2(a)),lb=Math.sqrt(len2(b));const cs=la&&lb?d/(la*lb):0,ang=Math.acos(Math.max(-1,Math.min(1,cs)))*180/Math.PI;
   const a1=Math.atan2(a[1],a[0]),a2=Math.atan2(b[1],b[0]);let st=a1,en=a2,dlt=en-st;while(dlt>Math.PI)dlt-=2*Math.PI;while(dlt<-Math.PI)dlt+=2*Math.PI;const R=1.2,pts=[];for(let i=0;i<=24;i++){const t=st+dlt*i/24;pts.push([G.X(P.O[0]+R*Math.cos(t)),G.Y(P.O[1]+R*Math.sin(t))])}
   const col=Math.abs(d)<1e-9?'#16a06a':d>0?'#2563eb':'#e2475b';
   return{svg:`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${col}" stroke-width="3"/>`+arrow(G,P.O,P.A,VC.a,'a')+arrow(G,P.O,P.B,VC.b,'b'),info:`<div class="big2">${vv('a')}·${vv('b')} = ${nf(a[0])}·${nf(b[0])} + ${nf(a[1])}·${nf(b[1])} = <b>${nf(d)}</b><br>|${vv('a')}| = ${sqr(len2(a))}, |${vv('b')}| = ${sqr(len2(b))}<br>cos φ = ${nf(d)} / (${sqr(len2(a))}·${sqr(len2(b))}) ≈ <b>${nf(cs)}</b>, φ ≈ ${Math.round(ang)}°</div><p style="color:${col};font-weight:800">${Math.abs(d)<1e-9?'= 0 ⇒ векторы перпендикулярны (90°)':d>0?'&gt; 0 ⇒ угол острый':'&lt; 0 ⇒ угол тупой'}</p>`}}}},
 mid:{title:'Середина и деление отрезка',text:'Середина — среднее арифметическое координат концов. Точка, делящая AB так, что AM = k·AB: <b>M = A + k·$AB</b>.',
  cfg:{pts:{A:[-4,-2],B:[5,4]},k:{lab:'k',min:0,max:1,step:1/12,v:1/3},draw:(G,P,k)=>{const v=V(P.A,P.B),M=add(P.A,mul(k,v)),Md=add(P.A,mul(.5,v));return{svg:`<line x1="${G.X(P.A[0])}" y1="${G.Y(P.A[1])}" x2="${G.X(P.B[0])}" y2="${G.Y(P.B[1])}" stroke="#16213a" stroke-width="3"/><circle cx="${G.X(Md[0])}" cy="${G.Y(Md[1])}" r="6" fill="#16a06a"/><circle cx="${G.X(M[0])}" cy="${G.Y(M[1])}" r="7" fill="#8b5cf6"/><text x="${G.X(M[0])+10}" y="${G.Y(M[1])+20}" class="pl" fill="#8b5cf6">M</text>`,info:`<div class="big2"><span style="color:#16a06a">Середина</span>: ([[${nf(P.A[0])} + ${nf(P.B[0])}|2]]; [[${nf(P.A[1])} + ${nf(P.B[1])}|2]]) = <b>${co(Md)}</b></div><div class="big2" style="margin-top:8px"><span style="color:#8b5cf6">M</span> = A + ${fr(k)}·${vv('AB')} = ${co(P.A)} + ${fr(k)}·${co(v)} = <b>${co(M)}</b></div><p class="hint2">«В отношении 1 : 2 от A» ⇒ k = 1/3; «2 : 1 от A» ⇒ k = 2/3.</p>`.replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,'<span class="fr"><span>$1</span><span>$2</span></span>')}}}},
 col:{title:'Коллинеарность и перпендикулярность',text:'<b>Коллинеарны</b> (параллельны) — координаты пропорциональны: a = k·b. <b>Перпендикулярны</b> — скалярное произведение равно нулю.',
  cfg:{pts:{O:[0,0],A:[4,2],B:[-2,-1]},x:[-6,7],y:[-4,6],draw:(G,P)=>{const a=V(P.O,P.A),b=V(P.O,P.B),cr=a[0]*b[1]-a[1]*b[0],d=dot(a,b);const kk=b[0]?a[0]/b[0]:b[1]?a[1]/b[1]:NaN;
   return{svg:arrow(G,P.O,P.A,VC.a,'a')+arrow(G,P.O,P.B,VC.b,'b'),info:`<div class="big2">${vv('a')} = ${co(a)}, ${vv('b')} = ${co(b)}</div><p>Отношения координат: ${b[0]?fr(a[0]/b[0]):'—'} и ${b[1]?fr(a[1]/b[1]):'—'}</p><p class="${cr===0?'ok2':'no2'}">${cr===0?`✓ Коллинеарны: ${vv('a')} = ${fr(kk)}·${vv('b')} — ${kk>0?'сонаправлены':'противоположно направлены'}`:'✗ Не коллинеарны — отношения разные'}</p><p class="${d===0?'ok2':'no2'}">${vv('a')}·${vv('b')} = ${nf(d)} ${d===0?'⇒ ✓ перпендикулярны':'≠ 0 ⇒ не перпендикулярны'}</p><p class="hint2">Попробуй поставить b в (−1; 2) — получишь перпендикуляр.</p>`}}}},
 dec:{title:'Разложение вектора по двум векторам',text:'Любой вектор c можно собрать из двух неколлинеарных: c = k·a + l·b. Координаты дают систему из двух уравнений на k и l.',
  cfg:{pts:{O:[0,0],A:[-2,4],B:[3,1],C:[2,4]},fixed:['O'],x:[-5,8],y:[-3,8],draw:(G,P)=>{const a=V(P.O,P.A),b=V(P.O,P.B),c=V(P.O,P.C),D=a[0]*b[1]-a[1]*b[0];if(!D)return{svg:arrow(G,P.O,P.A,VC.a,'a')+arrow(G,P.O,P.B,VC.b,'b'),info:'<p class="no2">a и b коллинеарны — разложить нельзя. Раздвинь их!</p>'};
   const k=(c[0]*b[1]-c[1]*b[0])/D,l=(a[0]*c[1]-a[1]*c[0])/D,ka=mul(k,a);
   return{svg:arrow(G,P.O,ka,VC.a,'',{dash:true,op:.7})+arrow(G,ka,add(ka,mul(l,b)),VC.b,'',{dash:true,op:.7})+arrow(G,P.O,P.A,VC.a,'a')+arrow(G,P.O,P.B,VC.b,'b')+arrow(G,P.O,P.C,VC.c,'c',{w:4}),info:`<div class="big2">${nf(c[0])} = k·(${nf(a[0])}) + l·${nf(b[0])}<br>${nf(c[1])} = k·${nf(a[1])} + l·${nf(b[1])}</div><div class="big2" style="margin-top:6px">k = <b>${fr(k)}</b>, l = <b>${fr(l)}</b></div><p class="hint2">Пунктиры: k·a, а за ним l·b — вместе они приходят в конец c.</p>`}}}}
};

const META=[
 [1,'Действия с векторами','Координаты, сумма, разность, умножение на число','#4f6bff',['coord','sum','dif','mulk'],[
  ['📍 Координаты вектора','<p><span class="big">AB = (x<sub>B</sub> − x<sub>A</sub>; y<sub>B</sub> − y<sub>A</sub>)</span></p><p class="scrawl">Конец минус начало!</p>'],
  ['➕ Сумма / разность','<p>Складываем (вычитаем) <b>отдельно</b> x-ы и <b>отдельно</b> y-ки.</p><p>(3; 4) + (8; 8) = (11; 12)</p>'],
  ['✖️ Умножение на число','<p>2·(8; 5) = (16; 10) — каждую координату.</p><p>Минус разворачивает вектор.</p>'],

 [2,'Скалярное произведение','x₁x₂ + y₁y₂, неизвестная координата','#ec4899',['dot','coord'],[
  ['✳️ Это число!','<p><span class="big">a·b = x₁x₂ + y₁y₂</span></p><p>Результат — не вектор, а <b>число</b>.</p>'],

 [5,'Середина, деление, разложение','Середина отрезка, M = A + k·AB, c = k·a + l·b','#8b5cf6',['mid','col','dec'],[

function numEval(s){let e=String(s||'').trim().replace(/−/g,'-').replace(/,/g,'.').replace(/√\s*\(/g,'sqrt(').replace(/√\s*([\d.]+)/g,'sqrt($1)').replace(/·|×/g,'*');if(!e||!/^[\d+\-*/().\s]+$/.test(e.replace(/sqrt/g,'')))return NaN;try{const v=Function('sqrt','return ('+e+')')(Math.sqrt);return Number.isFinite(v)?v:NaN}catch(_){return NaN}}
const near=(v,e)=>Number.isFinite(v)&&Math.abs(v-e)<=(Math.abs(e-Math.round(e))<1e-9?1e-9:0.006);
for(const[n,title,sub,color,scs,st]of META){
 const tasks=G2.filter(t=>t.m===n).map(t=>({id:'v'+t.n.replace('+','x'),kind:'p',title:'№ '+t.n.replace('+','')+' · '+(t.f?'большая задача':(()=>{const q=(t.t.replace(/\$/g,'').match(/Найдите ([^.]+)\./)||[])[1]||'';return q.length>30?q.slice(0,28)+'…':q})()),ans:t.a||t.f.map(f=>f[1]).join(' | '),src:t,steps:t.s.map(s=>[s[0],mk(s[1])])}));
 reg({n,title,sub,color,tasks,stickers:st,scenes:scs.map(k=>({id:k,...SC[k]})),
  cond:t=>mk(t.src.t),
  noAnswer:t=>!!t.src.f,
  ansPh:()=>'Ответ',
  check:(t,v)=>{if(!t.src.f)return defCheck(t,v);let ok=true;const vals=JSON.parse(v||'[]');t.src.f.forEach((f,i)=>{const e=numEval(f[1]),g=numEval(vals[i]);const good=near(g,e);ok=ok&&good;const el=document.querySelector(`[data-fi="${i}"]`);if(el){el.classList.toggle('ok',good);el.classList.toggle('badv',!good&&String(vals[i]||'')!=='')}});return ok},
  toolName:t=>t.src.p?'🗺 Рисунок: нажми «показать клетки», чтобы увидеть координаты':t.src.f?'✍️ Ответы':'',
  tool:function(t,el,ctx){const s=t.src,w=ctx.work;let h='';
   if(s.p)h+=`<div id="picBox">${picHTML(s.p,w.lg)}</div><div style="margin:6px 0 10px"><button class="btn small" id="lgB">${w.lg?'Скрыть клетки':'📐 Показать клетки (Δx, Δy)'}</button></div>`;
   if(s.f){w.f=w.f||[];h+=`<div class="fgrid">${s.f.map((f,i)=>`<label>${mk(f[0])}<input class="vin" data-fi="${i}" value="${esc(w.f[i]||'')}" placeholder="?"></label>`).join('')}</div><div style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap"><button class="btn primary" id="fChk">Проверить все</button><span style="font-size:12px;color:var(--muted)">Дроби пиши как 7/3, корни — как √146/3 или десятичной дробью.</span></div>`}
   el.innerHTML=h;if(!h)el.parentElement.style.display='none';
   if(s.p)$('lgB').onclick=()=>{w.lg=!w.lg;ctx.save();$('picBox').innerHTML=picHTML(s.p,w.lg);$('lgB').textContent=w.lg?'Скрыть клетки':'📐 Показать клетки (Δx, Δy)'};
   if(s.f){el.querySelectorAll('[data-fi]').forEach(i=>i.oninput=()=>{w.f[+i.dataset.fi]=i.value;ctx.save()});$('fChk').onclick=()=>ctx.check(JSON.stringify(s.f.map((_,i)=>w.f[i]||'')))}}})}
