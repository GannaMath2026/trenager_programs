// ===== ВИЗУАЛИЗАТОР: сцены темы «Биссектриса» (экранные координаты 800×520) =====
const TRI0={A:{x:360,y:80},B:{x:240,y:320},C:{x:580,y:320}};
const T3=()=>[seg('A','B',{w:2.6}),seg('B','C',{w:2.6}),seg('C','A',{w:2.6})];
const V3=()=>[pt('A',{size:6}),pt('B',{size:6}),pt('C',{size:6})];
const lens=S=>({a:G.d(S.B,S.C),b:G.d(S.C,S.A),c:G.d(S.A,S.B),A:G.ang(S.B,S.A,S.C),B:G.ang(S.A,S.B,S.C),C:G.ang(S.A,S.C,S.B)});
const U=40; // единица длины: 40 px = 1
const L1=x=>fmt(x/U,2), SQ=x=>fmt(x/U/U,2);
const SCENES_BIS=[
{id:'Б1',group:'Свойства биссектрисы',title:'Свойство биссектрисы',short:'Биссектриса делит противоположную сторону на отрезки, пропорциональные прилежащим сторонам.',detail:'Если AD — биссектриса треугольника ABC, D ∈ BC, то BD : DC = AB : AC. Доказательство: у треугольников ABD и ADC общая высота из A и равные расстояния от D до сторон угла, поэтому S_ABD : S_ADC = BD : DC = AB : AC.',
 build(S){const D=G.bis(S.A,S.B,S.C),l=lens(S);return{P:{...S,D},items:[...T3(),seg('A','D',{c:'red',w:2.4}),arc('A','B','D',{r:34}),arc('A','D','C',{r:40}),pt('D'),...V3()],
  stats:[`AB = ${L1(l.c)}`,`AC = ${L1(l.b)}`,`BD = ${L1(G.d(S.B,D))}`,`DC = ${L1(G.d(D,S.C))}`,`BD/DC = ${fmt(G.d(S.B,D)/G.d(D,S.C),3)}`,`AB/AC = ${fmt(l.c/l.b,3)}`],result:'BD : DC = AB : AC'}}},
{id:'Б2',group:'Свойства биссектрисы',title:'Биссектриса внешнего угла',short:'Внешняя биссектриса делит сторону внешним образом в том же отношении; внутренняя и внешняя биссектрисы перпендикулярны.',detail:'Биссектриса внешнего угла A пересекает продолжение BC в точке E: EB : EC = AB : AC. Внутренняя AD и внешняя AE биссектрисы одного угла перпендикулярны: их углы — половины смежных углов, 90° в сумме. При AB = AC внешняя биссектриса параллельна BC.',
 build(S){const D=G.bis(S.A,S.B,S.C),E=G.extBis(S.A,S.B,S.C),l=lens(S);const far=!E||G.d(E,S.A)>2600;const X=G.lerp(S.B,S.A,1.5);
  const items=[...T3(),seg('A','D',{c:'blue'}),pt('D'),seg('A','X',{c:'gray',d:'5 4'})];const P={...S,D,X};
  if(!far){P.E=E;items.push(seg('A','E',{c:'red'}),seg(G.d(E,S.B)<G.d(E,S.C)?'B':'C','E',{c:'gray',d:'6 5'}),rt('A','D','E'),pt('E'))}
  items.push(...V3());return{P,items,stats:far?['AB ≈ AC: внешняя биссектриса почти параллельна BC']:[`EB = ${L1(G.d(E,S.B))}`,`EC = ${L1(G.d(E,S.C))}`,`EB/EC = ${fmt(G.d(E,S.B)/G.d(E,S.C),3)}`,`AB/AC = ${fmt(l.c/l.b,3)}`,`∠DAE = ${fmt(G.ang(D,S.A,E),1)}°`],result:'EB : EC = AB : AC,\nAD ⟂ AE'}}},
{id:'Б3',group:'Свойства биссектрисы',title:'Длина биссектрисы через отрезки',short:'AD² = AB·AC − BD·DC (для внешней: AE² = EB·EC − AB·AC).',detail:'Формула следует из теоремы Стюарта или из подобия: продлите AD до пересечения с описанной окружностью в W; тогда AB·AC = AD·AW и BD·DC = AD·DW, вычитаем.',
 build(S){const D=G.bis(S.A,S.B,S.C),l=lens(S);const ad=G.d(S.A,D);return{P:{...S,D},items:[...T3(),seg('A','D',{c:'red',w:3}),arc('A','B','D',{r:34}),arc('A','D','C',{r:40}),pt('D'),...V3()],
  stats:[`AD² = ${SQ(ad*ad)}`,`AB·AC = ${SQ(l.c*l.b)}`,`BD·DC = ${SQ(G.d(S.B,D)*G.d(D,S.C))}`,`AB·AC − BD·DC = ${SQ(l.c*l.b-G.d(S.B,D)*G.d(D,S.C))}`],result:'AD² = AB·AC − BD·DC'}}},
{id:'Б4',group:'Свойства биссектрисы',title:'Длина биссектрисы через угол',short:'l = 2bc·cos(α/2)/(b + c), где b, c — прилежащие стороны, α — угол между ними.',detail:'S_ABC = S_ABD + S_ADC: ½bc·sinα = ½c·l·sin(α/2) + ½b·l·sin(α/2). Используем sinα = 2sin(α/2)cos(α/2) и выражаем l.',
 build(S){const D=G.bis(S.A,S.B,S.C),l=lens(S);const f=2*l.b*l.c*Math.cos(G.rad(l.A/2))/(l.b+l.c);return{P:{...S,D},items:[...T3(),poly(['A','B','D'],'blue'),poly(['A','D','C'],'green'),seg('A','D',{c:'red',w:3}),arc('A','B','D',{r:34,t:'α/2'}),arc('A','D','C',{r:40,t:'α/2'}),pt('D'),...V3()],
  stats:[`α = ${fmt(l.A,1)}°`,`AD = ${L1(G.d(S.A,D))}`,`2bc·cos(α/2)/(b+c) = ${L1(f)}`],result:'l = 2bc·cos(α/2) / (b + c)'}}},
{id:'Б5',group:'Свойства биссектрисы',title:'Угол между биссектрисами',short:'Биссектрисы углов B и C пересекаются в центре вписанной окружности I, ∠BIC = 90° + ∠A/2.',detail:'В треугольнике BIC: ∠BIC = 180° − B/2 − C/2 = 180° − (180° − A)/2 = 90° + A/2.',
 build(S){const I=G.incenter(S.A,S.B,S.C),l=lens(S);return{P:{...S,I},items:[...T3(),{k:'c',o:'I',r:G.inr(S.A,S.B,S.C),c:'gray',d:'5 5'},seg('B','I',{c:'red'}),seg('C','I',{c:'red'}),seg('A','I',{c:'gray',d:'5 4'}),arc('I','B','C',{r:22,c:'orange',t:'90°+A/2',tr:22}),arc('A','B','C',{r:26,c:'blue',t:'A'}),arc('B','A','I',{r:30}),arc('B','I','C',{r:36}),arc('C','A','I',{r:30,c:'green'}),arc('C','I','B',{r:36,c:'green'}),pt('I'),...V3()],
  stats:[`∠A = ${fmt(l.A,1)}°`,`∠BIC = ${fmt(G.ang(S.B,I,S.C),1)}°`,`90° + ∠A/2 = ${fmt(90+l.A/2,1)}°`],result:'∠BIC = 90° + ∠A/2'}}},
{id:'Б6',group:'Свойства биссектрисы',title:'Внешние биссектрисы и вневписанные центры',short:'Внешние биссектрисы B и C: ∠BJC = 90° − A/2. Внутренняя B и внешняя C: ∠BMC = A/2.',detail:'J — центр вневписанной окружности против вершины A (пересечение внешних биссектрис B и C). M — пересечение внутренней биссектрисы B и внешней биссектрисы C (центр вневписанной окружности против B). В треугольнике BMC: ∠MBC = B/2, ∠BCM = 90° + C/2, значит ∠BMC = A/2.',
 build(S){const J=G.excenter(S.A,S.B,S.C),M=G.excenter(S.B,S.C,S.A),l=lens(S);return{P:{...S,J,M},items:[...T3(),seg('B','J',{c:'purple',d:'6 5'}),seg('C','J',{c:'purple',d:'6 5'}),seg('B','M',{c:'blue'}),seg('C','M',{c:'red',d:'6 5'}),arc('J','B','C',{r:24,c:'purple',t:'90°−A/2',tr:26}),arc('M','B','C',{r:26,c:'red',t:'A/2'}),arc('A','B','C',{r:26,c:'blue',t:'A'}),pt('J',{c:'purple'}),pt('M',{c:'red'}),...V3()],
  stats:[`∠A = ${fmt(l.A,1)}°`,`∠BJC = ${fmt(G.ang(S.B,J,S.C),1)}° (90° − A/2 = ${fmt(90-l.A/2,1)}°)`,`∠BMC = ${fmt(G.ang(S.B,M,S.C),1)}° (A/2 = ${fmt(l.A/2,1)}°)`],result:'∠BJC = 90° − A/2\n∠BMC = A/2'}},init:{A:{x:330,y:150},B:{x:270,y:270},C:{x:420,y:270}}},
{id:'Б7',group:'Свойства биссектрисы',title:'Инцентр делит биссектрису',short:'AI : ID = (AB + AC) : BC.',detail:'В треугольнике ABD отрезок BI — биссектриса: AI : ID = AB : BD. Так как BD = a·c/(b + c), получаем AI : ID = (b + c) : a.',
 build(S){const D=G.bis(S.A,S.B,S.C),I=G.incenter(S.A,S.B,S.C),l=lens(S);return{P:{...S,D,I},items:[...T3(),seg('A','I',{c:'red',w:3}),seg('I','D',{c:'blue',w:3}),seg('B','I',{c:'gray',d:'5 4'}),seg('C','I',{c:'gray',d:'5 4'}),pt('D'),pt('I'),...V3()],
  stats:[`AI/ID = ${fmt(G.d(S.A,I)/G.d(I,D),3)}`,`(b+c)/a = ${fmt((l.b+l.c)/l.a,3)}`],result:'AI : ID = (b + c) : a'}}},
{id:'Б8',group:'Биссектриса и окружность',title:'Биссектриса и описанная окружность',short:'Биссектриса угла A пересекает описанную окружность в середине W дуги BC: WB = WC.',detail:'Равные вписанные углы BAW и WAC опираются на равные дуги BW и WC, а равные дуги стягиваются равными хордами. Обратно: если хорды BW = WC, то AW — биссектриса. W лежит на серединном перпендикуляре к BC.',
 build(S){const D=G.bis(S.A,S.B,S.C),O=G.circ3(S.A,S.B,S.C),W=G.second(S.A,D,O);return{P:{...S,D,O,W},items:[...T3(),{k:'c',o:'O',c:'gray'},seg('A','W',{c:'red'}),seg('B','W',{c:'blue'}),seg('W','C',{c:'blue'}),tick('B','W',1),tick('W','C',1),arc('A','B','D',{r:34}),arc('A','D','C',{r:40}),arc('B','C','W',{r:26,c:'green'}),arc('C','W','B',{r:26,c:'green'}),pt('D'),pt('W'),...V3()],
  stats:[`WB = ${L1(G.d(W,S.B))}`,`WC = ${L1(G.d(W,S.C))}`,`∠WBC = ∠WCB = A/2 = ${fmt(lens(S).A/2,1)}°`],result:'W — середина дуги BC,\nWB = WC'}}},
{id:'Б9',group:'Биссектриса и окружность',title:'Лемма о трезубце',short:'W — середина дуги BC: WB = WC = WI = WJ, где I — инцентр, J — центр вневписанной окружности.',detail:'∠WBI = ∠WBC + ∠CBI = A/2 + B/2, ∠WIB — внешний угол треугольника ABI, тоже A/2 + B/2. Значит WB = WI. Окружность с центром W проходит через B, C, I и J.',
 build(S){const O=G.circ3(S.A,S.B,S.C),I=G.incenter(S.A,S.B,S.C),J=G.excenter(S.A,S.B,S.C),W=G.second(S.A,I,O);return{P:{...S,O,I,J,W},items:[...T3(),{k:'c',o:'O',c:'gray'},{k:'c',o:'W',thr:'B',c:'orange',d:'6 5'},seg('A','J',{c:'red'}),seg('W','B',{c:'blue'}),seg('W','C',{c:'blue'}),tick('W','B',1),tick('W','C',1),tick('W','I',1),tick('W','J',1),pt('I'),pt('J',{c:'purple'}),pt('W'),...V3()],
  stats:[`WB = ${L1(G.d(W,S.B))}`,`WC = ${L1(G.d(W,S.C))}`,`WI = ${L1(G.d(W,I))}`,`WJ = ${L1(G.d(W,J))}`],result:'WB = WC = WI = WJ'}}},
{id:'Б10',group:'Свойства биссектрисы',title:'Биссектриса в параллелограмме',short:'Биссектриса угла параллелограмма отсекает от него равнобедренный треугольник: AB = BK.',detail:'Перетаскивайте A, B, C — D достраивается. ∠BKA = ∠KAD (накрест лежащие при BC ∥ AD) = ∠BAK, поэтому треугольник ABK равнобедренный. Так же работает в трапеции.',
 build(S){const D=G.sub(G.add(S.A,S.C),S.B);const u=nrm(G.sub(S.B,S.A)),v=nrm(G.sub(D,S.A));const K=G.inter(S.A,G.add(S.A,G.add(u,v)),S.B,S.C);return{P:{...S,D,K},items:[seg('A','B',{w:2.6}),seg('B','C',{w:2.6}),seg('C','D',{w:2.6}),seg('D','A',{w:2.6}),poly(['A','B','K'],'orange'),seg('A','K',{c:'red'}),seg('C','K',{c:'gray',d:'5 4'}),tick('A','B',1),tick('B','K',1),arc('A','B','K',{r:30}),arc('A','K','D',{r:36}),arc('K','A','B',{r:30,c:'blue'}),pt('D'),pt('K'),...V3()],
  stats:[`AB = ${L1(G.d(S.A,S.B))}`,`BK = ${L1(G.d(S.B,K))}`],result:'AB = BK'}},init:{A:{x:180,y:400},B:{x:300,y:160},C:{x:640,y:160}}},
{id:'Б11',group:'Свойства биссектрисы',title:'Перпендикуляр к биссектрисе',short:'Если BN ⟂ биссектрисе угла A, то треугольник ABN равнобедренный: AN = AB, биссектриса делит BN пополам.',detail:'В треугольнике ABN отрезок AF — биссектриса и высота. «Два одиночества»: если в треугольнике биссектриса совпадает с высотой или медианой, он равнобедренный.',
 build(S){const D=G.bis(S.A,S.B,S.C),F=G.foot(S.B,S.A,D),N=G.inter(S.B,F,S.A,S.C);return{P:{...S,D,F,N},items:[...T3(),poly(['A','B','N'],'green'),seg('A','D',{c:'blue'}),seg('B','N',{c:'red'}),rt('F','A','B'),tick('A','B',1),tick('A','N',1),tick('B','F',2,{c:'blue'}),tick('F','N',2,{c:'blue'}),arc('A','B','D',{r:34}),arc('A','D','C',{r:40}),pt('D'),pt('F'),pt('N'),...V3()],
  stats:[`AB = ${L1(G.d(S.A,S.B))}`,`AN = ${L1(G.d(S.A,N))}`,`BF = ${L1(G.d(S.B,F))}`,`FN = ${L1(G.d(F,N))}`],result:'AN = AB, BF = FN'}}},
{id:'Б12',group:'Свойства биссектрисы',title:'Площади и биссектриса',short:'S_ABD : S_ADC = BD : DC = AB : AC; треугольники с общей высотой относятся как основания.',detail:'У треугольников ABD и ADC общая высота из A — их площади относятся как основания BD и DC. Это же отношение равно AB : AC. Приём «общая высота» — главный инструмент метода площадей.',
 build(S){const D=G.bis(S.A,S.B,S.C),s1=G.area(S.A,S.B,D),s2=G.area(S.A,D,S.C),H=G.foot(S.A,S.B,S.C);return{P:{...S,D,H},items:[...T3(),poly(['A','B','D'],'blue'),poly(['A','D','C'],'green'),seg('A','D',{c:'red'}),seg('A','H',{c:'gray',d:'5 4'}),rt('H','A','C'),pt('D'),pt('H'),...V3()],
  stats:[`S_ABD = ${SQ(s1)}`,`S_ADC = ${SQ(s2)}`,`S_ABD/S_ADC = ${fmt(s1/s2,3)}`,`AB/AC = ${fmt(G.d(S.A,S.B)/G.d(S.A,S.C),3)}`],result:'S_ABD : S_ADC = AB : AC'}}},
{id:'Б13',group:'Опорные факты',title:'Вписанный и центральный углы',short:'Вписанные углы, опирающиеся на одну дугу, равны; центральный угол вдвое больше вписанного.',detail:'∠ACB = ∠ADB (C и D на одной дуге), ∠AOB = 2∠ACB. Если точки лежат по разные стороны хорды, вписанные углы в сумме дают 180°.',
 build(S){const O=G.circ3(S.A,S.B,S.C);const m=G.mid(S.A,S.B),pp={x:m.x-(S.B.y-S.A.y),y:m.y+(S.B.x-S.A.x)};let D=G.refl(S.C,O,G.d(O,m)<1?pp:m);if(G.d(D,S.C)<20)D=G.rot(S.C,O,40);const c=G.ang(S.A,S.C,S.B);return{P:{...S,O,D},items:[{k:'c',o:'O',c:'gray'},seg('A','B',{w:2.4}),seg('C','A'),seg('C','B'),seg('D','A',{c:'green'}),seg('D','B',{c:'green'}),seg('O','A',{c:'blue'}),seg('O','B',{c:'blue'}),arc('C','A','B',{r:28,t:fmt(c,1)+'°'}),arc('D','A','B',{r:28,c:'green',t:fmt(G.ang(S.A,D,S.B),1)+'°'}),arc('O','A','B',{r:22,c:'blue',t:fmt(G.ang(S.A,O,S.B),1)+'°'}),pt('O'),pt('D'),...V3()],
  stats:[`∠ACB = ${fmt(c,1)}°`,`∠ADB = ${fmt(G.ang(S.A,D,S.B),1)}°`,`2∠ACB = ${fmt(2*c,1)}°`,c>90?'C на меньшей дуге: центральный угол AOB (тупой) = 360° − 2∠ACB':'∠AOB = 2∠ACB'],result:'∠ACB = ∠ADB = ½∠AOB'}}},
{id:'Б14',group:'Опорные факты',title:'Вписанный четырёхугольник',short:'Четырёхугольник вписан в окружность ⇔ сумма противоположных углов 180°.',detail:'∠B и ∠D опираются на дуги, дополняющие друг друга до всей окружности. Признак: если ∠B + ∠D = 180° (или стороны видны под равными углами из двух точек по одну сторону), то около четырёхугольника можно описать окружность.',
 build(S){const O=G.circ3(S.A,S.B,S.C),D=G.second(S.B,G.bis(S.B,S.A,S.C),O);const b=G.ang(S.A,S.B,S.C),d=G.ang(S.A,D,S.C);return{P:{...S,O,D},items:[{k:'c',o:'O',c:'gray'},seg('A','B',{w:2.6}),seg('B','C',{w:2.6}),seg('C','D',{w:2.6}),seg('D','A',{w:2.6}),arc('B','A','C',{r:28,t:fmt(b,1)+'°'}),arc('D','A','C',{r:28,c:'blue',t:fmt(d,1)+'°'}),pt('D'),...V3()],
  stats:[`∠B = ${fmt(b,1)}°`,`∠D = ${fmt(d,1)}°`,`∠B + ∠D = ${fmt(b+d,1)}°`],result:'∠B + ∠D = 180°'}}},
{id:'Б15',group:'Опорные факты',title:'Окружность на диаметре. Медиана к гипотенузе',short:'Угол, опирающийся на диаметр, прямой; медиана прямоугольного треугольника равна половине гипотенузы.',detail:'Точка C всегда остаётся на окружности с диаметром AB. ∠ACB = 90°, центр описанной окружности — середина гипотенузы M, MA = MB = MC. Обратно: если ∠ACB = 90°, то C лежит на окружности с диаметром AB.',
 fix(S){const M=G.mid(S.A,S.B),r=G.d(S.A,S.B)/2,v=nrm(G.sub(S.C,M));S.C={x:M.x+v.x*r,y:M.y+v.y*r}},
 build(S){const M=G.mid(S.A,S.B);return{P:{...S,M},items:[{k:'c',o:'M',thr:'A',c:'purple',d:'6 5'},...T3(),rt('C','A','B'),seg('C','M',{c:'red'}),tick('M','A',1),tick('M','B',1),tick('M','C',1),pt('M'),...V3()],
  stats:[`∠ACB = ${fmt(G.ang(S.A,S.C,S.B),1)}°`,`MC = ${L1(G.d(M,S.C))}`,`AB/2 = ${L1(G.d(S.A,S.B)/2)}`],result:'∠ACB = 90°,\nMC = MA = MB'}},init:{A:{x:180,y:290},B:{x:620,y:290},C:{x:300,y:100}}},
{id:'Б16',group:'Опорные факты',title:'Подобие: AC² = CP·CB',short:'Если точка P на прямой BC и ∠CAP = ∠ABC, то △CAP ∼ △CBA и AC² = CP·CB.',detail:'У треугольников CAP и CBA общий угол C и равные углы CAP и CBA — подобие по двум углам. Из подобия CA/CB = CP/CA. Так же: касательная и секущая, «отсечённый» треугольник.',
 build(S){const a=G.d(S.B,S.C),b=G.d(S.A,S.C);const P=G.lerp(S.C,S.B,b*b/(a*a));return{P:{...S,P},items:[...T3(),poly(['C','A','P'],'orange'),seg('A','P',{c:'red'}),seg('B','P',{c:'gray',d:'5 4'}),arc('B','A','C',{r:30,t:'β'}),arc('A','C','P',{r:34,t:'β'}),pt('P'),...V3()],
  stats:[`AC² = ${SQ(b*b)}`,`CP·CB = ${SQ(G.d(S.C,P)*a)}`,`∠CAP = ${fmt(G.ang(S.C,S.A,P),1)}°`,`∠B = ${fmt(G.ang(S.A,S.B,S.C),1)}°`],result:'△CAP ∼ △CBA,\nAC² = CP·CB'}}},
{id:'Б17',group:'Опорные факты',title:'Теорема Менелая',short:'Прямая пересекает BC в A₁, CA в B₁, прямую AB в C₁: (AC₁/C₁B)·(BA₁/A₁C)·(CB₁/B₁A) = 1.',detail:'Обходим треугольник: от вершины до точки на прямой, от точки — до следующей вершины. Обратная теорема: если произведение равно 1 и одна из точек на продолжении (или все три), точки лежат на одной прямой.',
 build(S){const A1=G.lerp(S.B,S.C,0.42),B1=G.lerp(S.C,S.A,0.3),C1=G.inter(A1,B1,S.A,S.B);const items=[...T3(),pt('A1',{n:'A₁'}),pt('B1',{n:'B₁'})];const P={...S,A1,B1};let st=['Прямая A₁B₁ параллельна AB'];
  if(C1&&G.d(C1,S.A)<4000){P.C1=C1;items.push(seg('B1','C1',{c:'red'}),seg(G.d(C1,S.A)<G.d(C1,S.B)?'A':'B','C1',{c:'gray',d:'6 5'}),pt('C1',{n:'C₁'}));const r1=G.d(S.A,C1)/G.d(C1,S.B),r2=G.d(S.B,A1)/G.d(A1,S.C),r3=G.d(S.C,B1)/G.d(B1,S.A);st=[`AC₁/C₁B = ${fmt(r1,3)}`,`BA₁/A₁C = ${fmt(r2,3)}`,`CB₁/B₁A = ${fmt(r3,3)}`,`произведение = ${fmt(r1*r2*r3,3)}`]}
  items.push(...V3());return{P,items,stats:st,result:'произведение трёх\nотношений = 1'}}},
{id:'Б18',group:'Опорные факты',title:'Теорема синусов',short:'a/sinA = b/sinB = c/sinC = 2R. Хорда равна 2R·sin вписанного угла.',detail:'Проведём диаметр BA′. ∠BA′C = ∠BAC (опираются на дугу BC), ∠BCA′ = 90°, поэтому BC = BA′·sinA = 2R·sinA.',
 build(S){const O=G.circ3(S.A,S.B,S.C),A2=G.add(O,G.sub(O,S.B)),l=lens(S);return{P:{...S,O,A2},items:[{k:'c',o:'O',c:'gray'},...T3(),seg('B','A2',{c:'blue',d:'6 5'}),seg('A2','C',{c:'blue',d:'6 5'}),rt('C','B','A2'),arc('A','B','C',{r:28,t:'α'}),arc('A2','B','C',{r:28,t:'α',c:'blue'}),pt('O'),pt('A2',{n:'A′'}),...V3()],
  stats:[`a/sinA = ${L1(l.a/Math.sin(G.rad(l.A)))}`,`b/sinB = ${L1(l.b/Math.sin(G.rad(l.B)))}`,`c/sinC = ${L1(l.c/Math.sin(G.rad(l.C)))}`,`2R = ${L1(2*O.r)}`],result:'a / sinA = 2R'}}},
{id:'Б19',group:'Опорные факты',title:'Теорема о пропорциональных отрезках',short:'Параллельные прямые отсекают на сторонах угла пропорциональные отрезки: если XY ∥ BC, то AX : XB = AY : YC.',detail:'Перетаскивайте точку X по стороне AB. Треугольники AXY и ABC подобны (обобщённая теорема Фалеса), поэтому AX/AB = AY/AC = XY/BC.',
 fix(S){const t=Math.max(.08,Math.min(.92,((S.X.x-S.A.x)*(S.B.x-S.A.x)+(S.X.y-S.A.y)*(S.B.y-S.A.y))/G.d(S.A,S.B)**2));S.X=G.lerp(S.A,S.B,t)},
 build(S){const Y=G.inter(S.X,G.add(S.X,G.sub(S.C,S.B)),S.A,S.C);return{P:{...S,Y},items:[...T3(),poly(['A','X','Y'],'blue'),seg('X','Y',{c:'red',w:2.6}),pt('X',{size:6,c:'red'}),pt('Y'),...V3()],
  stats:[`AX/XB = ${fmt(G.d(S.A,S.X)/G.d(S.X,S.B),3)}`,`AY/YC = ${fmt(G.d(S.A,Y)/G.d(Y,S.C),3)}`,`XY/BC = ${fmt(G.d(S.X,Y)/G.d(S.B,S.C),3)}`],result:'AX : XB = AY : YC'}},init:{X:{x:270,y:230}},drag:['A','B','C','X']}
];

const quad=(a,b,c,d,o={})=>[seg(a,b,{w:2.6,...o}),seg(b,c,{w:2.6,...o}),seg(c,d,{w:2.6,...o}),seg(d,a,{w:2.6,...o})];
const circAt=(o,r,opt={})=>({k:'c',o,r,c:'gray',w:1.3,...opt});
const PTS=(...n)=>n.map(x=>pt(x));
const TASKS_CIRC=[
{id:'c60',topic:'circ',num:'60',code:'2707',level:0,
 cond:R`В остроугольном треугольнике $ABC$: $\angle B=60^\circ$, $AM$ и $CN$ — высоты, а точка $Q$ — середина $AC$.<br><b>а)</b> Докажите, что $\triangle MNQ$ — равнобедренный.<br><b>б)</b> Найдите $\dfrac{\angle MNQ}{\angle NQM}$.`,
 ans:'1',facts:['Б15','Б13'],
 fig(){const B={x:0,y:0},C={x:7,y:0},A=G.ray(B,60,6);const M=G.foot(A,B,C),N=G.foot(C,A,B),Q=G.mid(A,C);return{P:{A,B,C,M,N,Q},items:[
  ...triItems(),seg('A','M',{c:'gray'}),seg('C','N',{c:'gray'}),rt('M','A','C'),rt('N','C','A'),arc('B','A','C',{t:'60°',r:26}),
  seg('Q','M',{c:'blue',st:1}),tick('Q','M',1,{st:1}),tick('Q','A',1,{st:1}),tick('Q','C',1,{st:1}),
  seg('Q','N',{c:'blue',st:2}),tick('Q','N',1,{st:2}),
  {k:'c',o:'Q',thr:'A',c:'purple',d:'6 5',st:3},
  arc('C','N','B',{t:'30°',r:34,c:'green',st:4}),
  arc('Q','N','M',{t:'60°',r:22,c:'green',st:5}),seg('M','N',{c:'red',st:5}),poly(['M','N','Q'],'orange',{st:5}),
  ...PTS('A','B','C','M','N','Q')]}},
 steps:[
  {part:'а',t:'Медиана QM',do:R`Треугольник $AMC$ прямоугольный ($\angle AMC=90^\circ$), $MQ$ — медиана к гипотенузе $AC$.`,res:R`Медиана к гипотенузе равна её половине.`,eq:R`QM=\tfrac12AC`,sc:['Б15']},
  {t:'Медиана QN',do:R`Аналогично в прямоугольном треугольнике $ANC$.`,res:R`$QM=QN$ — треугольник $MNQ$ равнобедренный.`,eq:R`QN=\tfrac12AC=QM`},
  {part:'б',t:'Окружность с диаметром AC',do:R`Точки $M$ и $N$ видят отрезок $AC$ под прямым углом.`,res:R`$A,C,M,N$ лежат на окружности с центром $Q$.`,eq:R`QA=QC=QM=QN`,sc:['Б15']},
  {t:'Вписанный угол MCN',do:R`В прямоугольном треугольнике $NBC$: $\angle NCB=90^\circ-\angle B$.`,res:R``,eq:R`\angle MCN=90^\circ-60^\circ=30^\circ`},
  {t:'Ответ',do:R`$\angle MQN$ — центральный угол, опирающийся на ту же дугу $MN$, что и вписанный угол $MCN$.`,res:R`Равнобедренный треугольник с углом $60^\circ$ — равносторонний.`,eq:R`\angle MQN=2\cdot30^\circ=60^\circ\Rightarrow\angle MNQ=\angle NQM=60^\circ,\quad\frac{\angle MNQ}{\angle NQM}=1`,sc:['Б13']}]},

{id:'c61',topic:'circ',num:'61',code:'11621',level:1,
 cond:R`Окружность, проходящая через вершины $A$, $C$ и $D$ прямоугольной трапеции $ABCD$ с основаниями $AD$ и $BC$, пересекает меньшую боковую сторону $AB$ в точке $P$ и касается прямой $BC$. Известно, что $AD=CD$.<br><b>а)</b> Докажите, что $CP$ — биссектриса угла $ACB$.<br><b>б)</b> В каком отношении прямая $DP$ делит площадь трапеции?`,
 ans:'4:5',facts:['О2','О1'],
 fig(){const s3=Math.sqrt(3),A={x:0,y:0},D={x:2,y:0},C={x:1,y:s3},B={x:0,y:s3},O={x:1,y:1/s3},P={x:0,y:2/s3},H={x:1,y:0};return{P:{A,B,C,D,O,P,H},items:[
  ...quad('A','B','C','D'),rt('A','D','B'),circAt('O',2/s3,{c:'purple',d:'6 5'}),seg('A','C',{c:'gray'}),
  seg('C','H',{c:'blue',d:'6 4',st:1}),rt('H','D','C',{st:1}),pt('O',{st:1}),tick('A','H',1,{st:1}),tick('H','D',1,{st:1}),
  tick('C','A',2,{st:2}),tick('C','D',2,{st:2}),tick('A','D',2,{st:2}),arc('A','C','D',{t:'60°',r:26,st:2}),arc('C','B','A',{t:'60°',r:30,c:'green',st:2}),
  seg('C','P',{c:'red',st:3}),arc('C','B','P',{t:'30°',r:46,c:'orange',st:3}),arc('A','P','C',{t:'30°',r:36,c:'orange',st:3}),
  mtx('B','P','1/√3',{st:4,dx:-26,c:'orange'}),mtx('A','P','2/√3',{st:4,dx:-26,c:'orange'}),
  seg('D','P',{c:'red',st:5}),poly(['A','P','D'],'blue',{st:5}),poly(['P','B','C','D'],'green',{st:5}),
  ...PTS('A','B','C','D'),pt('P')]}},
 steps:[
  {part:'а',t:'Радиус в точку касания',do:R`Пусть $O$ — центр окружности. Касательная $BC$ перпендикулярна радиусу $OC$, а $BC\parallel AD$, значит $OC\perp AD$.`,res:R`Прямая $CO$ — диаметр, перпендикулярный хорде $AD$, она делит хорду пополам: $CH$ — серединный перпендикуляр к $AD$, и $CA=CD$.`,eq:R`OC\perp AD\Rightarrow AH=HD\Rightarrow CA=CD`,sc:['О2']},
  {t:'Равносторонний треугольник ACD',do:R`По условию $CD=AD$, а только что получили $CA=CD$.`,res:R`$\triangle ACD$ равносторонний; $\angle ACB=\angle CAD$ (накрест лежащие).`,eq:R`\angle CAD=60^\circ,\qquad\angle ACB=60^\circ`},
  {t:'Угол между касательной и хордой',do:R`Угол между касательной $CB$ и хордой $CP$ равен вписанному углу $CAP$, опирающемуся на дугу $CP$.`,res:R`$\angle CAP=90^\circ-60^\circ=30^\circ$ — половина угла $ACB$. Пункт а) доказан.`,eq:R`\angle BCP=\angle CAP=30^\circ=\tfrac12\angle ACB`,sc:['О1']},
  {part:'б',t:'Длины',do:R`Пусть $AD=2$. Тогда $AB$ — высота равностороннего треугольника: $AB=\sqrt3$, $BC=AH=1$. В треугольнике $PBC$: $BP=BC\operatorname{tg}30^\circ$.`,res:R``,eq:R`BP=\tfrac1{\sqrt3},\qquad AP=\sqrt3-\tfrac1{\sqrt3}=\tfrac2{\sqrt3}`},
  {t:'Площади и ответ',do:R`Прямая $DP$ отсекает треугольник $APD$.`,res:R``,eq:R`S_{APD}=\tfrac12\cdot\tfrac2{\sqrt3}\cdot2=\tfrac{2\sqrt3}3,\ \ S_{ABCD}=\tfrac{1+2}2\sqrt3=\tfrac{3\sqrt3}2,\ \ S_{PBCD}=\tfrac{5\sqrt3}6;\qquad 4:5`}]},

{id:'c62',topic:'circ',num:'62',code:'20871',level:1,
 cond:R`В треугольнике $ABC$ биссектрисы $AD$ и $CE$ пересекаются в точке $O$, величина угла $AOC$ составляет $120^\circ$.<br><b>а)</b> Докажите, что около четырехугольника $BDOE$ можно описать окружность.<br><b>б)</b> Найдите площадь треугольника $ABC$, если $BC=4$, а $\angle BED=75^\circ$.`,

 steps:[
  {part:'а',t:'Угол B',do:R`Угол между биссектрисами: $\angle AOC=90^\circ+\frac{\angle B}2$.`,res:R``,eq:R`90^\circ+\tfrac{\angle B}2=120^\circ\Rightarrow\angle B=60^\circ`,sc:['Б5']},
  {t:'Вписанный четырёхугольник',do:R`$\angle EOD=\angle AOC=120^\circ$ (вертикальные).`,res:R`Сумма противоположных углов $B$ и $O$ четырёхугольника $BDOE$ равна $180^\circ$ — он вписанный.`,eq:R`\angle B+\angle EOD=60^\circ+120^\circ=180^\circ`,sc:['Б14']},
  {part:'б',t:'Угол DEO',do:R`Третья биссектриса $BO$ делит $\angle B$ на углы по $30^\circ$. Вписанные углы $DEO$ и $DBO$ опираются на одну дугу $DO$.`,res:R``,eq:R`\angle DEO=\angle DBO=30^\circ`,sc:['Б13']},
  {t:'Углы треугольника',do:R`$\angle BEC=\angle BED+\angle DEO=105^\circ$. Из треугольника $BEC$ находим $\angle BCE$.`,res:R``,eq:R`\angle BCE=180^\circ-60^\circ-105^\circ=15^\circ\Rightarrow\angle C=30^\circ,\ \angle A=90^\circ`},
  {t:'Ответ',do:R`$BC=4$ — гипотенуза, $\angle B=60^\circ$.`,res:R``,eq:R`AB=2,\ AC=2\sqrt3,\qquad S=\tfrac12\cdot2\cdot2\sqrt3=2\sqrt3`}]},

{id:'c63',topic:'circ',num:'63',code:'406',level:1,
 cond:R`Четырёхугольник $MNPQ$ вписан в окружность, причём $\dfrac{MN}{PQ}=\dfrac{QM}{PN}$.<br><b>а)</b> Докажите, что точки $N$ и $Q$ равноудалены от прямой, содержащей $MP$.<br><b>б)</b> Найдите расстояние от точки $P$ до прямой, содержащей $MQ$, если $MP=4$, расстояние от $N$ до прямой, содержащей $MP$, равно $1{,}5$, $MQ=3$.`,

  mtx('N','HN','1,5',{st:4,dx:12,c:'red'}),
  seg('P','HP',{c:'red',st:5}),rt('HP','P','M',{st:5}),seg('M','HP',{c:'gray',d:'4 4',st:5}),mtx('P','HP','2',{st:5,dx:10,c:'red',bold:true}),
  ...PTS('M','N','P','Q')]}},
 steps:[
  {part:'а',t:'Переписываем условие',do:R`Пропорцию $\frac{MN}{PQ}=\frac{QM}{PN}$ запишем через произведения.`,res:R``,eq:R`MN\cdot NP=MQ\cdot QP`},
  {t:'Синусы противоположных углов',do:R`Четырёхугольник вписан: $\angle N+\angle Q=180^\circ$.`,res:R``,eq:R`\sin\angle N=\sin\angle Q`,sc:['Б14']},
  {t:'Равные площади',do:R`Площади треугольников $MNP$ и $MQP$ через две стороны и угол между ними.`,res:R`Площади равны, основание $MP$ общее — значит, равны высоты к $MP$. Пункт а) доказан.`,eq:R`S_{MNP}=\tfrac12MN\cdot NP\sin N=\tfrac12MQ\cdot QP\sin Q=S_{MQP}`},
  {part:'б',t:'Площадь треугольника MQP',do:R`По пункту а) расстояние от $Q$ до $MP$ тоже $1{,}5$.`,res:R``,eq:R`S_{MQP}=\tfrac12\cdot4\cdot1{,}5=3`},
  {t:'Ответ',do:R`Та же площадь через основание $MQ=3$ и искомую высоту $h$ из $P$.`,res:R``,eq:R`\tfrac12\cdot3\cdot h=3\Rightarrow h=2`}]},

{id:'c64',topic:'circ',num:'64',code:'820',level:1,
 cond:R`Стороны $KN$ и $LM$ трапеции $KLMN$ параллельны, прямые $LM$ и $MN$ — касательные к окружности, описанной около треугольника $KLN$.<br><b>а)</b> Докажите, что треугольники $LMN$ и $KLN$ подобны.<br><b>б)</b> Найдите площадь треугольника $KLN$, если известно, что $KN=6$, а $\angle LMN=120^\circ$.`,
 ans:R`3\sqrt3`,facts:['О2','О1'],

 steps:[

  {t:'Угол между касательной и хордой',do:R`Угол между касательной $LM$ и хордой $LN$ равен вписанному углу, опирающемуся на дугу $LN$.`,res:R``,eq:R`\angle MLN=\angle LKN=\alpha`,sc:['О1']},

  {t:'Подобие',do:R`В треугольнике $LMN$ углы $\alpha,\alpha,180^\circ-2\alpha$; в треугольнике $KLN$ углы при $K$ и $N$ тоже равны $\alpha$.`,res:R`Треугольники подобны по двум углам. Пункт а) доказан.`,eq:R`\triangle LMN\sim\triangle KLN`},

{id:'c65',topic:'circ',num:'65',code:'11456',level:2,
 cond:R`Окружность проходит через вершины $B$ и $C$ треугольника $ABC$ и пересекает $AB$ и $AC$ в точках $C_1$ и $B_1$ соответственно.<br><b>а)</b> Докажите, что треугольник $ABC$ подобен треугольнику $AB_1C_1$.<br><b>б)</b> Вычислите длину стороны $BC$ и радиус данной окружности, если $\angle A=45^\circ$, $B_1C_1=6$ и площадь треугольника $AB_1C_1$ в восемь раз меньше площади четырёхугольника $BCB_1C_1$.`,
 ans:R`BC=18,\ R=3\sqrt{20-6\sqrt2}`,facts:['Б14','О5','Б18'],
 fig(){const R0=3*Math.sqrt(20-6*Math.SQRT2),x=G.deg(Math.atan(1/(3*Math.SQRT2-1)));const O={x:0,y:0},C1=G.ray(O,90+x,R0),B1=G.ray(O,90-x,R0),B=G.ray(O,225-x,R0),C=G.ray(O,315+x,R0);const A=G.inter(B,C1,C,B1);return{P:{A,B,C,B1,C1,O},items:[
  circAt('O',R0,{c:'purple',d:'6 5'}),...triItems(),seg('B1','C1',{c:'blue'}),seg('B','B1',{c:'gray',d:'4 4'}),
  arc('B1','A','C1',{r:22,c:'green',st:1}),arc('B','A','C',{r:22,c:'green',st:1}),poly(['A','B1','C1'],'blue',{st:1}),
  mtx('B1','C1','6',{st:2,dy:-8,c:'orange'}),mtx('B','C','18',{st:2,dy:16,c:'orange'}),
  arc('A','B','C',{t:'45°',r:30,c:'red',st:3}),seg('O','B',{c:'teal',st:3}),seg('O','C',{c:'teal',st:3}),seg('O','B1',{c:'teal',d:'4 4',st:3}),seg('O','C1',{c:'teal',d:'4 4',st:3}),
  ...PTS('A','B','C'),pt('B1',{n:'B₁'}),pt('C1',{n:'C₁'}),pt('O',{st:3})]}},
 steps:[
  {part:'а',t:'Внешний угол вписанного четырёхугольника',do:R`$BCB_1C_1$ вписан, поэтому $\angle AB_1C_1=180^\circ-\angle CB_1C_1=\angle C_1BC$.`,res:R`Угол $A$ общий — треугольники подобны.`,eq:R`\angle AB_1C_1=\angle ABC\Rightarrow\triangle AB_1C_1\sim\triangle ABC`,sc:['Б14']},
  {part:'б',t:'Коэффициент подобия',do:R`$S_{BCB_1C_1}=8S_{AB_1C_1}$, значит $S_{ABC}=9S_{AB_1C_1}$.`,res:R``,eq:R`k=3,\qquad BC=3\cdot B_1C_1=18`},
  {t:'Угол между секущими',do:R`Угол между секущими равен полуразности дуг, заключённых между ними.`,res:R``,eq:R`45^\circ=\tfrac12(\smile BC-\smile B_1C_1)\Rightarrow\smile BC-\smile B_1C_1=90^\circ`,sc:['О5']},
  {t:'Хорды через радиус',do:R`Пусть $\smile B_1C_1=2x$, тогда $\smile BC=2x+90^\circ$. Хорда равна $2R\sin$ половины дуги.`,res:R``,eq:R`\frac{BC}{B_1C_1}=\frac{\sin(x+45^\circ)}{\sin x}=3\Rightarrow\frac{\sin x+\cos x}{\sqrt2\sin x}=3\Rightarrow\operatorname{ctg}x=3\sqrt2-1`,sc:['Б18']},
  {t:'Ответ',do:R`$\sin^2x=\frac1{1+\operatorname{ctg}^2x}=\frac1{20-6\sqrt2}$; $R=\frac{B_1C_1}{2\sin x}$.`,res:R``,eq:R`R=\frac3{\sin x}=3\sqrt{20-6\sqrt2}`}]},

{id:'c66',topic:'circ',num:'66',code:'18137',level:2,
 cond:R`Четырехугольник $ABCD$ вписан в окружность, причем сторона $CD$ — диаметр этой окружности. Продолжение перпендикуляра $AH$ к диагонали $BD$ пересекает сторону $CD$ в точке $E$, а окружность — в точке $F$, причем $H$ — середина $AE$.<br><b>а)</b> Докажите, что четырехугольник $BCFE$ — параллелограмм.<br><b>б)</b> Найдите площадь четырехугольника $ABCD$, если известно, что $AB=5$, $AH=4$.`,
 ans:'67,5',facts:['Б15','Б14','О3'],
 fig(){const B={x:0,y:0},D={x:15,y:0},A={x:3,y:4},H={x:3,y:0},E={x:3,y:-4},F={x:3,y:-9},C={x:0,y:-5},O={x:7.5,y:-2.5};return{P:{A,B,C,D,E,F,H,O},items:[

  rt('B','C','D',{st:1}),seg('B','C',{c:'green',w:4,st:1}),
  seg('B','E',{c:'orange',st:2}),tick('A','H',1,{st:2}),tick('H','E',1,{st:2}),tick('B','A',2,{st:2}),tick('B','E',2,{st:2}),
  seg('C','F',{c:'orange',st:3}),arc('C','B','F',{r:22,c:'purple',st:3}),arc('E','B','F',{r:22,c:'purple',st:3}),
  poly(['B','C','F','E'],'orange',{st:4}),
  mtx('B','H','3',{st:5,dy:-8,c:'orange'}),mtx('H','D','x = 12',{st:6,dy:-8,c:'orange'}),
  poly(['A','B','C','D'],'blue',{st:7}),
  ...PTS('A','B','C','D','E','F','H')]}},
 steps:[
  {part:'а',t:'BC ∥ EF',do:R`$CD$ — диаметр, поэтому $\angle CBD=90^\circ$: $BC\perp BD$. И $AF\perp BD$.`,res:R``,eq:R`BC\parallel EF`,sc:['Б15']},
  {t:'Равнобедренный треугольник ABE',do:R`$BH\perp AE$ и $AH=HE$: $BH$ — серединный перпендикуляр к $AE$.`,res:R``,eq:R`BA=BE,\qquad\angle BEA=\angle BAE`},
  {t:'Углы при C и E',do:R`Точки $A$ и $C$ лежат на разных дугах $BF$, поэтому $\angle BCF=180^\circ-\angle BAF$.`,res:R`$E$ лежит между $H$ и $F$, значит $\angle BEF=180^\circ-\angle BEA$.`,eq:R`\angle BCF=180^\circ-\angle BAE=180^\circ-\angle BEA=\angle BEF`,sc:['Б14']},
  {t:'Параллелограмм',do:R`В четырёхугольнике $BCFE$ стороны $BC\parallel EF$, значит $\angle C+\angle F=180^\circ$ и $\angle B+\angle E=180^\circ$.`,res:R`Из $\angle C=\angle E$ следует $\angle B=\angle F$: обе пары противоположных углов равны — параллелограмм.`,eq:R`BCFE\ \text{— параллелограмм}`},
  {part:'б',t:'Отрезок BH',do:R`Прямоугольный треугольник $ABH$.`,res:R``,eq:R`BH=\sqrt{25-16}=3`},
  {t:'Уравнение для HD',do:R`Пусть $HD=x$. $HE\parallel BC$: $\frac{HE}{BC}=\frac{DH}{DB}$. Пересекающиеся хорды $AF$ и $BD$: $AH\cdot HF=BH\cdot HD$. И $EF=BC$ (параллелограмм).`,res:R``,eq:R`BC=\frac{4(3+x)}x,\ \ HF=\frac{3x}4,\ \ \frac{3x}4-4=\frac{4(3+x)}x\Rightarrow3x^2-32x-48=0,\ x=12`,sc:['О3']},
  {t:'Ответ',do:R`$BD=15$, $BC=\frac{4\cdot15}{12}=5$. Диагональ $BD$ делит $ABCD$ на треугольники с высотами $AH=4$ и $BC=5$.`,res:R``,eq:R`S_{ABCD}=\tfrac12\cdot15\cdot(4+5)=67{,}5`}]},

 steps:[
  {part:'а',t:'Вписанный четырёхугольник CDPQ',do:R`Точки $C,D,P,Q$ лежат на окружности: внешний угол вписанного четырёхугольника равен внутреннему противолежащему.`,res:R``,eq:R`\angle APQ=180^\circ-\angle DPQ=\angle DCQ`,sc:['Б14']},
  {t:'Сумма углов',do:R`В параллелограмме $\angle DCB+\angle ABC=180^\circ$.`,res:R`Значит $\angle APQ+\angle ABQ=180^\circ$ — четырёхугольник $ABQP$ вписанный. Пункт а) доказан.`,eq:R`\angle APQ+\angle ABQ=\angle DCB+\angle ABC=180^\circ`},

  {t:'Вписанная трапеция PQCD',do:R`$PD\parallel QC$, четырёхугольник вписан — равнобедренная трапеция.`,res:R``,eq:R`PQ=CD=AB,\qquad DQ=PC`,sc:['О6']},
  {t:'Теорема Птолемея',do:R`$DQ\cdot PC=PQ\cdot DC+PD\cdot QC$, где $PD=b-a$, $QC=b-c$.`,res:R``,eq:R`DQ^2=(\sqrt{ab}+\sqrt{bc})^2+(b-a)(b-c)=b^2+2b\sqrt{ac}+ac\Rightarrow DQ=b+\sqrt{ac}`,sc:['О7']}]},

{id:'c71',topic:'circ',num:'71',code:'11632',level:3,
 cond:R`Хорды $AD$, $BE$ и $CF$ окружности делят друг друга на три равные части.<br><b>а)</b> Докажите, что эти хорды равны.<br><b>б)</b> Найдите площадь шестиугольника $ABCDEF$, если точки $A,B,C,D,E$ последовательно расположены на окружности, а радиус окружности равен $2\sqrt{21}$.`,
 ans:R`117\sqrt3`,facts:['О3'],
 fig(){const Rr=2*Math.sqrt(21),O={x:0,y:0},f=G.deg(Math.acos(1/(2*Math.sqrt(7))));const ang=[90-f,330+f-360,210-f+0,90+f,330-f,210+f];const P={O};const names=['A','B','C','D','E','F'];
  // A: 90−φ, B: −30+φ, ... упорядочим по возрастанию угла
  const list=[90-f,90+f,210-f,210+f,330-f,330+f].map(a=>(a+360)%360).sort((a,b)=>a-b);list.forEach((a,i)=>P[names[i]]=G.ray(O,a,Rr));
  P.X=G.inter(P.A,P.D,P.B,P.E);P.Y=G.inter(P.B,P.E,P.C,P.F);P.Z=G.inter(P.C,P.F,P.A,P.D);
  return{P,items:[circAt('O',Rr),seg('A','D',{c:'blue'}),seg('B','E',{c:'blue'}),seg('C','F',{c:'blue'}),
  ...[['A','D','X','Z',1,'red'],['B','E','X','Y',2,'green'],['C','F','Y','Z',3,'purple']].flatMap(([s,e,p,q,n,c])=>{const[a,b]=G.d(P[s],P[p])<G.d(P[s],P[q])?[p,q]:[q,p];return[tick(s,a,n,{c}),tick(a,b,n,{c}),tick(b,e,n,{c})]}),
  poly(['X','Y','Z'],'orange',{st:2}),seg('O','A',{c:'gray',d:'4 4',st:2}),
  seg('O','B',{c:'gray',d:'4 4',st:4}),seg('O','C',{c:'gray',d:'4 4',st:4}),arc('O','A','B',{r:22,c:'red',st:4}),arc('O','B','C',{r:30,c:'green',st:4}),
  seg('A','B',{st:5,w:2.6}),seg('B','C',{st:5,w:2.6}),seg('C','D',{st:5,w:2.6}),seg('D','E',{st:5,w:2.6}),seg('E','F',{st:5,w:2.6}),seg('F','A',{st:5,w:2.6}),
  ...PTS('A','B','C','D','E','F'),pt('O',{st:2})]}},
 steps:[
  {part:'а',t:'Пересекающиеся хорды',do:R`Пусть $AD=3a$, $BE=3b$, $CF=3c$. Точка пересечения $AD$ и $BE$ делит каждую из них в отношении $1:2$.`,res:R`По свойству пересекающихся хорд $a\cdot2a=b\cdot2b$, откуда $a=b$; аналогично $b=c$. Хорды равны.`,eq:R`2a^2=2b^2=2c^2\Rightarrow AD=BE=CF`,sc:['О3']},
  {part:'б',t:'Центральный треугольник',do:R`Средние трети хорд образуют равносторонний треугольник со стороной $t$; по симметрии его центр — центр окружности $O$. Расстояние от $O$ до каждой хорды $d=\frac t{2\sqrt3}$, половина хорды $\frac{3t}2$.`,res:R``,eq:R`R^2=\frac{t^2}{12}+\frac{9t^2}4=\frac{7t^2}3=84\Rightarrow t=6,\ d=\sqrt3`},
  {t:'Центральный угол хорды',do:R`Пусть $2\varphi$ — центральный угол, опирающийся на хорду. Тогда $\cos\varphi=\frac dR$.`,res:R``,eq:R`\cos\varphi=\frac{\sqrt3}{2\sqrt{21}}=\frac1{2\sqrt7},\quad\sin2\varphi=\frac{3\sqrt3}{14},\quad\cos2\varphi=-\frac{13}{14}`},
  {t:'Два типа дуг',do:R`Нормали к хордам повёрнуты на $120^\circ$, поэтому шесть дуг чередуются: $2\varphi-120^\circ$ и $240^\circ-2\varphi$.`,res:R``,eq:R`\sin(2\varphi-120^\circ)=\frac{5\sqrt3}{14},\qquad\sin(240^\circ-2\varphi)=\frac{4\sqrt3}7`},
  {t:'Ответ',do:R`Шестиугольник состоит из шести треугольников с вершиной $O$: $S=\frac12R^2\sin(\text{центр. угла})$.`,res:R``,eq:R`S=3\cdot\tfrac12\cdot84\Big(\tfrac{5\sqrt3}{14}+\tfrac{8\sqrt3}{14}\Big)=117\sqrt3`}]},

{id:'c72',topic:'circ',num:'72',code:'121034',level:3,

 steps:[
  {part:'а',t:'CK — диаметр',do:R`$BK\perp AD$ и $AD\parallel BC$, значит $\angle CBK=90^\circ$.`,res:R`Вписанный прямой угол опирается на диаметр: $CK$ — диаметр.`,eq:R`\angle CBK=90^\circ\Rightarrow CK=2R`,sc:['Б15']},
  {t:'Прямой угол CAK',do:R`$\angle CAK$ опирается на диаметр $CK$.`,res:R`Пункт а) доказан.`,eq:R`\angle CAK=90^\circ`},
  {part:'б',t:'Треугольник BKC',do:R`$BC=2R\sin30^\circ=10$; $\angle BKC=\angle BAC=30^\circ$ (опираются на дугу $BC$).`,res:R``,eq:R`BK=CK\cos30^\circ=10\sqrt3`,sc:['Б13']},
  {t:'Подобие KHN и KBC',do:R`$HN\parallel BC$, коэффициент $k=\frac{KH}{KB}$: $S_{BCNH}=(1-k^2)S_{KBC}$, $S_{NKH}=k^2S_{KBC}$.`,res:R``,eq:R`\frac{1-k^2}{k^2}=24\Rightarrow k=\frac15,\quad KH=2\sqrt3,\ BH=8\sqrt3`},
  {t:'Пересекающиеся хорды',do:R`Хорды $AD$ и $BK$ пересекаются в $H$: $AH\cdot HD=BH\cdot HK$. В равнобедренной трапеции $HD=AH+BC$.`,res:R``,eq:R`AH(AH+10)=48`,sc:['О3']},
  {t:'Ответ',do:R`Решаем квадратное уравнение.`,res:R``,eq:R`AH=\sqrt{73}-5,\qquad AD=2AH+10=2\sqrt{73}`}]},

{id:'c73',topic:'circ',num:'73',code:'127873',level:3,

 steps:[
  {part:'а',t:'M — точка пересечения медиан',do:R`$AO$ — медиана треугольника $ABD$ ($O$ — центр ромба), и $AM=\frac13AC=\frac23AO$.`,res:R`$M$ — центр тяжести $ABD$, поэтому $BP$ — медиана: $P$ — середина $AD$. Так же $Q$ — середина $CD$.`,eq:R`AP=PD,\qquad CQ=QD`},
  {t:'Площади',do:R`Медиана делит площадь треугольника пополам.`,res:R`Пункт а) доказан.`,eq:R`S_{BPD}=\tfrac12S_{ABD},\ S_{BQD}=\tfrac12S_{CBD}\Rightarrow S_{BPDQ}=\tfrac12S_{ABCD}=S_{ADC}`},
  {part:'б',t:'Две секущие из точки A',do:R`Точки $M,N,P,D$ лежат на одной окружности, $A$ — вне её. Произведения секущих на внешние части равны.`,res:R``,eq:R`AM\cdot AN=AP\cdot AD\Rightarrow\frac{2\sqrt3}3\cdot\frac{4\sqrt3}3=\frac{AD^2}2\Rightarrow AD^2=\frac{16}3`,sc:['О4']},
  {t:'Ответ',do:R`Прямоугольный треугольник $AOD$: $AO=\sqrt3$.`,res:R``,eq:R`BD=2\sqrt{AD^2-AO^2}=2\sqrt{\tfrac{16}3-3}=\frac{2\sqrt{21}}3`}]},

 steps:[

  {part:'б',t:'Положение N',do:R`$AC=BC$. Проекция $K$ на $BC$ — середина $BC$; серединный перпендикуляр к $CK$ проходит через неё, поэтому точка $N$ с $NC=NK$ — середина $BC$.`,res:R``,eq:R`x=\tfrac{BC}2,\qquad KN\perp BC`},

 steps:[
  {part:'а',t:'Угол KPC',do:R`$BQ=BP$ (отрезки касательных), $\angle BPQ=90^\circ-\frac B2$. Угол $KPC$ ему вертикален.`,res:R``,eq:R`\angle KPC=90^\circ-\tfrac{\angle B}2`,sc:['О2']},
  {t:'Угол KIC',do:R`$\angle KIC$ — внешний угол треугольника $AIC$.`,res:R`Отрезок $KC$ виден из $P$ и $I$ под одним углом: $I,P,K,C$ на одной окружности.`,eq:R`\angle KIC=\tfrac A2+\tfrac C2=90^\circ-\tfrac B2=\angle KPC`},

  {part:'а',t:'Прямая Симсона',do:R`$D,E,A,H$ лежат на окружности с диаметром $AD$; $D,H,F,C$ — на окружности с диаметром $DC$. Тогда $\angle DHE=\angle DAE$, $\angle DHF=180^\circ-\angle DCF$, а $\angle DAE=\angle DCB$ (внешний угол вписанного $ABCD$).`,res:R`$\angle DHE+\angle DHF=180^\circ$ — точки $E,H,F$ на одной прямой.`,eq:R`E,\ H,\ F\ \text{коллинеарны}`,sc:['О8','Б14']},
  {part:'б',t:'Треугольник EBC',do:R`$A$ — середина $EB$, $D$ — середина $EC$, поэтому $E,D,C$ на одной прямой и $EC\perp AB$.`,res:R`$\triangle EBC$ — прямоугольный равнобедренный ($\angle B=45^\circ$).`,eq:R`\angle BEC=90^\circ,\ \ EB=EC`},
  {t:'Положение F',do:R`Пусть $G$ — проекция $E$ на $BC$; это середина $BC$. $DF\parallel EG$ и $D$ — середина $EC$, значит $F$ — середина $GC$.`,res:R``,eq:R`FC=\tfrac14BC`},
  {t:'Ответ',do:R`$H$ — точка пересечения $FE$ с прямой $AC$: $\frac{FH}{HE}=\frac{\rho(F,AC)}{\rho(E,AC)}$. $\rho(E,AC)=\rho(B,AC)$ ($A$ — середина $BE$), $\rho(F,AC)=\frac14\rho(B,AC)$.`,res:R``,eq:R`FH:HE=1:4`}]},

{id:'c83',topic:'circ',num:'83',code:'1293',level:4,
 cond:R`В трапеции $ABCD$ диагонали $AC$ и $BD$ взаимно перпендикулярны, $\angle BAC=\angle CDB$. Продолжения сторон $AB$ и $DC$ пересекаются в точке $K$, образуя угол $AKD$, равный $30^\circ$.<br><b>а)</b> Можно ли вписать окружность в трапецию $ABCD$?<br><b>б)</b> Найдите площадь треугольника $AKD$, если площадь трапеции равна $60$.`,
 ans:'нет; 90',facts:['Б13','Б14','О6'],
 fig(){const h=Math.sqrt(60),ad=2*h/(1+1/Math.sqrt(3)),bc=ad/Math.sqrt(3);const A={x:-ad/2,y:0},D={x:ad/2,y:0},B={x:-bc/2,y:h},C={x:bc/2,y:h};const K=G.inter(A,B,D,C),O=G.inter(A,C,B,D);return{P:{A,B,C,D,K,O},items:[
  seg('A','K',{c:'gray',d:'5 4'}),seg('D','K',{c:'gray',d:'5 4'}),...quad('A','B','C','D'),seg('A','C',{c:'blue'}),seg('B','D',{c:'blue'}),rt('O','C','D'),arc('K','A','D',{t:'30°',r:30}),
  arc('A','B','C',{r:22,c:'green',st:1}),arc('D','C','B',{r:22,c:'green',st:1}),{k:'c3',pts:['A','B','D'],c:'purple',d:'6 5',st:1},
  arc('A','O','D',{t:'45°',r:24,c:'orange',st:2}),arc('A','D','K',{t:'75°',r:34,c:'red',st:2}),
  tick('A','B',1,{st:3}),
  poly(['K','B','C'],'orange',{st:4}),poly(['A','B','C','D'],'blue',{st:5}),
  ...PTS('A','B','C','D','K'),pt('O',{st:2})]}},
 steps:[
  {part:'а',t:'Трапеция вписанная',do:R`Отрезок $BC$ виден из точек $A$ и $D$ под равными углами $BAC=BDC$.`,res:R`Точки $A,B,C,D$ на одной окружности; вписанная трапеция равнобедренная.`,eq:R`ABCD\ \text{вписанная, }AB=CD`,sc:['Б14','О6']},
  {t:'Углы и высота',do:R`$\angle K=30^\circ$ → углы при основании $AD$ по $75^\circ$. Диагонали равнобедренной трапеции перпендикулярны → $\angle OAD=45^\circ$, высота равна средней линии.`,res:R``,eq:R`h=\frac{AD+BC}2,\qquad AB=\frac h{\sin75^\circ}`},
  {t:'Ответ на а)',do:R`Окружность вписывается, только если $AB+CD=AD+BC$, то есть $AB=\frac{AD+BC}2=h$.`,res:R`Но $AB=\frac h{\sin75^\circ}>h$. Вписать окружность нельзя.`,eq:R`AB>h\Rightarrow\text{нельзя}`},
  {part:'б',t:'Коэффициент подобия',do:R`$\triangle KBC\sim\triangle KAD$, $k=\frac{BC}{AD}$. Высота $\triangle KAD$: $H=\frac{AD}2\operatorname{tg}75^\circ$; высота трапеции $H(1-k)=\frac{AD(1+k)}2$.`,res:R``,eq:R`\operatorname{tg}75^\circ(1-k)=1+k\Rightarrow k=\frac{\operatorname{tg}75^\circ-1}{\operatorname{tg}75^\circ+1}=\operatorname{tg}30^\circ=\frac1{\sqrt3}`},
  {t:'Ответ',do:R`$S_{ABCD}=(1-k^2)S_{AKD}$.`,res:R``,eq:R`S_{AKD}=\frac{60}{1-\frac13}=90`}]},

{id:'c84',topic:'circ',num:'84',code:'65021',level:4,
 cond:R`Дан треугольник $ABC$. Известно, что $BC=\sqrt{37}$, $AB=4$, $AC=3$. На стороне $BC$ построен равносторонний треугольник $BDC$, при этом точки $A$ и $D$ лежат по разные стороны от прямой $BC$.<br><b>а)</b> Докажите, что вокруг полученного четырехугольника $ABDC$ можно описать окружность.<br><b>б)</b> Найдите расстояние от точки пересечения диагоналей четырехугольника $ABDC$ до центра его описанной окружности.`,
 ans:R`\frac{\sqrt{1443}}{21}`,facts:['Б14','Б13','Б1','О10'],
 fig(){const A={x:0,y:0},B={x:4,y:0},C=G.ray(A,120,3);const D=G.rot(C,B,-60);const D2=G.rot(C,B,60);const DD=(G.d(D,A)>G.d(D2,A))?D:D2;const O=G.circ3(A,B,C),P=G.inter(A,DD,B,C);return{P:{A,B,C,D:DD,O,P},items:[
  {k:'c',o:'O',c:'gray',w:1.2,st:1},seg('A','B',{w:2.6}),seg('B','D',{w:2.6}),seg('D','C',{w:2.6}),seg('C','A',{w:2.6}),seg('B','C'),
  arc('A','B','C',{t:'120°',r:18,st:1}),arc('D','B','C',{t:'60°',r:24,st:1}),
  seg('A','D',{c:'blue',st:2}),arc('A','B','D',{r:30,c:'green',st:2}),arc('A','D','C',{r:36,c:'green',st:2}),
  mtx('B','P','4',{st:3,dy:-6,c:'orange'}),mtx('P','C','3',{st:3,dy:-6,c:'orange'}),
  seg('O','P',{c:'red',st:4}),pt('O',{st:4}),
  ...PTS('A','B','C','D'),pt('P',{st:2})]}},
 steps:[
  {part:'а',t:'Угол A',do:R`Теорема косинусов в треугольнике $ABC$.`,res:R``,eq:R`\cos A=\frac{16+9-37}{2\cdot4\cdot3}=-\frac12\Rightarrow\angle A=120^\circ`},
  {t:'Вписанный четырёхугольник',do:R`$\angle D=60^\circ$ (равносторонний треугольник), $A$ и $D$ по разные стороны от $BC$.`,res:R`Пункт а) доказан.`,eq:R`\angle A+\angle D=180^\circ`,sc:['Б14']},
  {part:'б',t:'AD — биссектриса',do:R`$\angle BAD=\angle BCD=60^\circ$ и $\angle DAC=\angle DBC=60^\circ$ (вписанные углы на дуги $BD$ и $DC$).`,res:R`$AD$ — биссектриса угла $A$, она делит $BC$ в отношении $4:3$.`,eq:R`BP=\frac{4\sqrt{37}}7,\qquad PC=\frac{3\sqrt{37}}7`,sc:['Б13','Б1']},
  {t:'Радиус',do:R`Теорема синусов в треугольнике $BDC$.`,res:R``,eq:R`R=\frac{\sqrt{37}}{2\sin60^\circ}=\frac{\sqrt{37}}{\sqrt3},\qquad R^2=\frac{37}3`},
  {t:'Ответ',do:R`Для точки $P$ внутри окружности: $R^2-OP^2=BP\cdot PC$.`,res:R``,eq:R`OP^2=\frac{37}3-\frac{444}{49}=\frac{481}{147},\qquad OP=\frac{\sqrt{1443}}{21}`,sc:['О10']}]},

{id:'c85',topic:'circ',num:'85',code:'91275',level:4,
 cond:R`На серединах сторон $AB$, $BC$ и $AC$ остроугольного треугольника $ABC$ отмечены точки $C_1$, $A_1$ и $B_1$ соответственно.<br><b>а)</b> Докажите, что окружность, описанная около треугольника $AB_1C_1$, проходит через отличную от $A_1$ точку пересечения описанных окружностей треугольников $A_1B_1C$ и $A_1BC_1$.<br><b>б)</b> Известно, что $AC=AB=13$, $BC=10$. Найдите радиус окружности, описанной около треугольника с вершинами в центрах вписанных окружностей треугольников $AB_1C_1$, $A_1B_1C$ и $A_1BC_1$.`,
 ans:R`\frac{169}{48}`,facts:['О9','Б15'],
 fig(){const B={x:-5,y:0},C={x:5,y:0},A={x:0,y:12};const A1=G.mid(B,C),B1=G.mid(A,C),C1=G.mid(A,B),O=G.circ3(A,B,C),I=G.incenter(A,B,C);const J1=G.mid(A,I),J2=G.mid(B,I),J3=G.mid(C,I);return{P:{A,B,C,A1,B1,C1,O,I,J1,J2,J3},items:[
  ...triItems(),seg('A1','B1',{c:'gray'}),seg('B1','C1',{c:'gray'}),seg('C1','A1',{c:'gray'}),
  seg('O','B1',{c:'blue',st:1}),seg('O','C1',{c:'blue',st:1}),rt('B1','O','A',{st:1}),rt('C1','O','A',{st:1}),{k:'c3',pts:['A','B1','C1'],c:'purple',d:'6 5',st:1},
  {k:'c3',pts:['B','A1','C1'],c:'teal',d:'6 5',st:2},{k:'c3',pts:['C','A1','B1'],c:'orange',d:'6 5',st:2},
  pt('I',{st:4}),seg('A','I',{c:'gray',d:'4 4',st:4}),seg('B','I',{c:'gray',d:'4 4',st:4}),seg('C','I',{c:'gray',d:'4 4',st:4}),
  poly(['J1','J2','J3'],'red',{st:5}),{k:'c3',pts:['J1','J2','J3'],c:'red',st:5},
  ...PTS('A','B','C'),pt('A1',{n:'A₁'}),pt('B1',{n:'B₁'}),pt('C1',{n:'C₁'}),pt('O',{st:1,c:'red'})]}},
 steps:[
  {part:'а',t:'Окружность AB₁C₁',do:R`Пусть $O$ — центр описанной окружности $ABC$. Серединные перпендикуляры: $OC_1\perp AB$, $OB_1\perp AC$.`,res:R`$\angle AC_1O=\angle AB_1O=90^\circ$ — точка $O$ лежит на окружности с диаметром $AO$, то есть на окружности $AB_1C_1$.`,eq:R`O\in(AB_1C_1)`,sc:['О9','Б15']},
  {t:'Две другие окружности',do:R`Так же $\angle BA_1O=\angle BC_1O=90^\circ$ и $\angle CA_1O=\angle CB_1O=90^\circ$.`,res:R``,eq:R`O\in(A_1BC_1),\qquad O\in(A_1B_1C)`},
  {t:'Вывод',do:R`Окружности $A_1B_1C$ и $A_1BC_1$ пересекаются в $A_1$ и в $O$ ($O\ne A_1$: треугольник остроугольный, $O$ внутри).`,res:R`Вторая точка пересечения — $O$, она лежит на окружности $AB_1C_1$. Пункт а) доказан.`,eq:R`(A_1B_1C)\cap(A_1BC_1)=\{A_1,O\}`},
  {part:'б',t:'Инцентры угловых треугольников',do:R`$\triangle AB_1C_1$ — образ $\triangle ABC$ при гомотетии с центром $A$ и коэффициентом $\frac12$, значит его инцентр — середина $AI$. Аналогично для двух других.`,res:R``,eq:R`J_1,J_2,J_3\ \text{— середины } AI,BI,CI`},
  {t:'Ответ',do:R`Треугольник $J_1J_2J_3$ — образ $ABC$ при гомотетии с центром $I$ и $k=\frac12$: радиус равен $\frac R2$. $S_{ABC}=\frac12\cdot10\cdot12=60$.`,res:R``,eq:R`R=\frac{abc}{4S}=\frac{13\cdot13\cdot10}{240}=\frac{169}{24},\qquad\frac R2=\frac{169}{48}`}]},

{id:'c851',topic:'circ',num:'851',code:'24574',level:4,
 cond:R`К окружности с диаметром $AB=10$ проведена касательная $BC$ так, что $BC=5$. Прямая $AC$ вторично пересекает окружность в точке $D$. Точка $E$ окружности диаметрально противоположна точке $D$. Прямые $ED$ и $BC$ пересекаются в точке $F$.<br><b>а)</b> Докажите, что $BD^2=CD\cdot BE$.<br><b>б)</b> Найдите площадь треугольника $FBE$.`,
 ans:R`\frac{80}3`,facts:['Б15','Б13'],
 fig(){const B={x:0,y:0},A={x:0,y:10},C={x:5,y:0},O={x:0,y:5},D={x:4,y:2},E={x:-4,y:8},F={x:20/3,y:0};return{P:{A,B,C,D,E,F,O},items:[

  seg('B','D',{c:'red',st:1}),rt('D','B','C',{st:1}),
  seg('A','E',{c:'green',st:2}),seg('E','B',{c:'green',st:2}),poly(['A','D','B','E'],'green',{st:2}),
  arc('A','B','D',{t:'φ',r:30,st:3}),arc('O','B','D',{t:'2φ',r:20,c:'purple',st:3}),

  ...PTS('A','B','C','D','E','F','O')]}},
 steps:[
  {part:'а',t:'Высота прямоугольного треугольника',do:R`$\angle ADB=90^\circ$ (опирается на диаметр), $AB\perp BC$ (касательная ⟂ радиусу). $BD$ — высота прямоугольного треугольника $ABC$.`,res:R``,eq:R`BD^2=AD\cdot DC`,sc:['Б15']},
  {t:'Прямоугольник ADBE',do:R`$AB$ и $DE$ — диаметры, их середины совпадают, и они равны.`,res:R`$ADBE$ — прямоугольник, $BE=AD$. Пункт а) доказан.`,eq:R`BD^2=CD\cdot BE`},
  {part:'б',t:'Угол BOF',do:R`$\operatorname{tg}\angle BAC=\frac{BC}{AB}=\frac12$. Центральный угол $BOD$ вдвое больше вписанного $BAD$.`,res:R``,eq:R`\operatorname{tg}\angle BOF=\operatorname{tg}2\varphi=\frac{2\cdot\frac12}{1-\frac14}=\frac43`,sc:['Б13']},
  {t:'Отрезок BF',do:R`Треугольник $OBF$ прямоугольный ($\angle B=90^\circ$), $OB=5$.`,res:R``,eq:R`BF=5\cdot\frac43=\frac{20}3`},
  {t:'Высота из E',do:R`$BD=\frac{AB\cdot BC}{AC}=2\sqrt5$, $\angle DBC=\varphi$: расстояние от $D$ до $BC$ равно $BD\sin\varphi=2$. $E$ симметрична $D$ относительно $O$.`,res:R``,eq:R`\rho(E,BC)=2\cdot OB-2=8`},
  {t:'Ответ',do:R`Площадь треугольника $FBE$.`,res:R``,eq:R`S_{FBE}=\tfrac12\cdot\tfrac{20}3\cdot8=\frac{80}3`}]},

{id:'c852',topic:'circ',num:'852',code:'30833',level:4,
 cond:R`Дан равнобедренный треугольник $ABC$, в котором $AB=BC$. На стороне $AC$ взяли точку $D$, а также отметили центры $I$ и $J$ описанных окружностей треугольников $ABD$ и $CBD$ соответственно.<br><b>а)</b> Докажите, что $BI\parallel DJ$.<br><b>б)</b> Найдите $IJ$, если $AC=12$ и $\cos\angle BDC=\frac37$.`,
 ans:R`\frac{21\sqrt{10}}{10}`,facts:['Б18','Б13'],
 fig(){const A={x:-6,y:0},C={x:6,y:0},B={x:0,y:8},D={x:-Math.sqrt(576/40),y:0};const I=G.circ3(A,B,D),J=G.circ3(C,B,D);return{P:{A,B,C,D,I,J},items:[
  ...triItems(),seg('B','D',{c:'gray'}),{k:'c',o:'I',c:'blue',d:'6 5',w:1.2},{k:'c',o:'J',c:'green',d:'6 5',w:1.2},
  seg('B','I',{c:'blue',st:2}),seg('D','J',{c:'green',st:2}),arc('B','I','D',{r:30,c:'purple',st:2}),arc('D','J','B',{r:30,c:'purple',st:2}),
  seg('I','D',{c:'blue',d:'4 4',st:3}),seg('J','B',{c:'green',d:'4 4',st:3}),tick('B','I',1,{st:3}),tick('I','D',1,{st:3}),tick('D','J',1,{st:3}),tick('J','B',1,{st:3}),
  seg('I','J',{c:'red',st:4}),seg(G.foot(I,A,C),'I',{c:'gray',d:'3 4',st:4}),seg(G.foot(J,A,C),'J',{c:'gray',d:'3 4',st:4}),
  arc('D','B','C',{t:'δ',r:24,c:'orange',st:5}),
  ...PTS('A','B','C','D','I','J')]}},
 steps:[
  {part:'а',t:'Равные радиусы',do:R`По теореме синусов $R_{ABD}=\frac{BD}{2\sin A}$, $R_{CBD}=\frac{BD}{2\sin C}$, а $\angle A=\angle C$.`,res:R``,eq:R`IB=ID=JB=JD=R`,sc:['Б18']},
  {t:'Накрест лежащие углы',do:R`Центральный $\angle BID=2\angle A$, в равнобедренном $\triangle IBD$: $\angle IBD=90^\circ-\angle A$. Аналогично $\angle JDB=90^\circ-\angle C$.`,res:R`Углы равны и накрест лежащие — пункт а) доказан.`,eq:R`\angle IBD=\angle JDB\Rightarrow BI\parallel DJ`,sc:['Б13']},
  {part:'б',t:'Ромб BIDJ',do:R`Все четыре стороны равны $R$.`,res:R``,eq:R`BIDJ\ \text{— ромб},\qquad IJ\perp BD`},
  {t:'Проекция IJ на AC',do:R`Проекции центров на хорды $AD$ и $DC$ — их середины. Проекция $IJ$ на $AC$ равна $\frac{AD}2+\frac{DC}2$.`,res:R``,eq:R`\text{пр}_{AC}IJ=\frac{AC}2=6`},
  {t:'Ответ',do:R`$IJ\perp BD$, а $BD$ образует с $AC$ угол $\delta=\angle BDC$: угол между $IJ$ и $AC$ равен $90^\circ-\delta$. $\sin\delta=\frac{2\sqrt{10}}7$.`,res:R``,eq:R`IJ=\frac6{\sin\delta}=\frac{42}{2\sqrt{10}}=\frac{21\sqrt{10}}{10}`}]},

{id:'c86',topic:'circ',num:'86',code:'11681',level:5,

  {k:'c3',pts:['A','B','E'],c:'purple',d:'6 5',st:3},
  seg('C','M',{c:'red',st:5}),seg('M','Z',{c:'teal',st:5}),seg('N','Z',{c:'teal',st:5}),
  seg('Z','A',{c:'red',d:'4 4',st:6}),

 steps:[
  {part:'а',t:'Прямоугольник CKHE',do:R`У четырёхугольника $CKHE$ три прямых угла — это прямоугольник, он вписан в окружность с диаметром $CH$.`,res:R``,eq:R`\angle CEK=\angle CHK`,sc:['Б13']},

  {t:'Косинус угла C',do:R`Высота из $B$ делит основание пополам: $\cos C=\frac{AC/2}{BC}$.`,res:R``,eq:R`\cos C=\frac{\sqrt2x}{3x}=\frac{\sqrt2}3`},
  {t:'Ответ',do:R`Высота $AH$ к стороне $BC$: $CH=AC\cos C$.`,res:R``,eq:R`CH=2\sqrt2x\cdot\frac{\sqrt2}3=\frac{4x}3,\quad BH=\frac{5x}3,\quad BH:HC=5:4`}]},

{id:'iA102',topic:'inc',num:'A102',code:'88578',level:2,
 cond:R`В треугольнике $ABC$ угол $ABC$ равен $60^\circ$. Окружность, вписанная в треугольник, касается стороны $AC$ в точке $M$.<br><b>а)</b> Докажите, что отрезок $BM$ не больше утроенного радиуса вписанной в треугольник окружности.<br><b>б)</b> Найдите $\sin\angle BMC$, если известно, что отрезок $BM$ в $2{,}8$ раза больше радиуса вписанной в треугольник окружности.`,
 ans:R`\frac{121}{140}`,facts:['В2'],
 fig(){const I={x:0,y:0},B={x:0,y:2},M={x:Math.sqrt(1-0.71*0.71),y:-0.71},TA={x:-Math.sqrt(3)/2,y:0.5},TC={x:Math.sqrt(3)/2,y:0.5};const dirM=G.add(M,{x:-M.y,y:M.x});const A=G.inter(B,TA,M,dirM),C=G.inter(B,TC,M,dirM);return{P:{A,B,C,I,M,K:TA},items:[
  ...triItems(),{k:'c',o:'I',r:1,c:'purple',d:'6 5'},seg('B','M',{c:'blue'}),arc('B','A','C',{t:'60°',r:20}),
  seg('B','I',{c:'red',st:1}),seg('I','K',{c:'gray',st:1}),rt('K','I','B',{st:1}),arc('B','K','I',{t:'30°',r:40,c:'green',st:1}),
  seg('I','M',{c:'red',st:2}),
  arc('M','B','I',{r:24,c:'orange',st:3}),rt('M','I','C',{st:4}),
  ...PTS('A','B','C','I','M'),pt('K',{st:1})]}},
 steps:[
  {part:'а',t:'Отрезок BI',do:R`$BI$ — биссектриса угла $60^\circ$; в прямоугольном треугольнике $BKI$ ($K$ — точка касания на $AB$) катет $IK=r$ лежит против угла $30^\circ$.`,res:R``,eq:R`BI=2r`,sc:['В2']},
  {t:'Неравенство треугольника',do:R`Для точек $B$, $I$, $M$.`,res:R`Пункт а) доказан.`,eq:R`BM\le BI+IM=2r+r=3r`},
  {part:'б',t:'Треугольник BIM',do:R`Стороны $BI=2r$, $IM=r$, $BM=2{,}8r$. Теорема косинусов для угла $BMI$.`,res:R``,eq:R`\cos\angle BMI=\frac{2{,}8^2+1-4}{2\cdot2{,}8}=\frac{4{,}84}{5{,}6}=\frac{121}{140}`},
  {t:'Ответ',do:R`$IM\perp AC$, поэтому $\angle BMC=90^\circ\pm\angle BMI$.`,res:R``,eq:R`\sin\angle BMC=\cos\angle BMI=\frac{121}{140}`}]},

{id:'iA103',topic:'inc',num:'A103',code:'1080',level:3,
 cond:R`В параллелограмм вписана окружность.<br><b>а)</b> Докажите, что параллелограмм является ромбом.<br><b>б)</b> Окружность, касающаяся стороны параллелограмма, делит ее на отрезки $3$ и $5$. Найдите площадь выпуклого четырехугольника, вершинами которого являются точки касания окружности со сторонами параллелограмма.`,
 ans:R`\frac{15\sqrt{15}}2`,facts:['В3','О2'],
 fig(){const a=Math.sqrt(24),b=Math.sqrt(40),A={x:-a,y:0},C={x:a,y:0},B={x:0,y:b},D={x:0,y:-b},O={x:0,y:0};const T1=G.lerp(A,B,3/8),T2=G.lerp(C,B,3/8),T3=G.lerp(C,D,3/8),T4=G.lerp(A,D,3/8);return{P:{A,B,C,D,O,T1,T2,T3,T4},items:[
  ...quad('A','B','C','D'),{k:'c',o:'O',r:Math.sqrt(15),c:'purple',d:'6 5'},
  tick('A','B',1,{st:1}),tick('B','C',1,{st:1}),tick('C','D',1,{st:1}),tick('D','A',1,{st:1}),
  seg('A','C',{c:'gray',st:2}),seg('B','D',{c:'gray',st:2}),seg('O','T1',{c:'blue',st:2}),rt('T1','O','B',{st:2}),mtx('A','T1','3',{st:2,dx:-10,c:'orange'}),mtx('T1','B','5',{st:2,dx:-10,c:'orange'}),
  poly(['T1','T2','T3','T4'],'orange',{st:3}),
  ...PTS('A','B','C','D'),pt('T1',{n:'T'}),pt('T2',{n:''}),pt('T3',{n:''}),pt('T4',{n:''}),pt('O')]}},
 steps:[
  {part:'а',t:'Описанный четырёхугольник',do:R`Суммы противоположных сторон описанного четырёхугольника равны: $AB+CD=BC+AD$. В параллелограмме $AB=CD$, $BC=AD$.`,res:R`Пункт а) доказан.`,eq:R`2AB=2BC\Rightarrow AB=BC`,sc:['В3']},
  {part:'б',t:'Диагонали ромба',do:R`Сторона $AB=3+5=8$, диагонали перпендикулярны; $OT$ — высота прямоугольного треугольника $AOB$.`,res:R``,eq:R`OA^2=AT\cdot AB=24,\qquad OB^2=BT\cdot AB=40,\qquad r^2=3\cdot5=15`},
  {t:'Прямоугольник точек касания',do:R`Точки касания симметричны относительно обеих диагоналей — они образуют прямоугольник. Координаты $T$ (оси — диагонали): $AT:TB=3:5$.`,res:R``,eq:R`|x_T|=\tfrac58\sqrt{24},\qquad|y_T|=\tfrac38\sqrt{40}`},
  {t:'Ответ',do:R`Площадь прямоугольника $4|x_T||y_T|$.`,res:R``,eq:R`S=4\cdot\frac{5\sqrt{24}}8\cdot\frac{3\sqrt{40}}8=\frac{15\sqrt{960}}{16}=\frac{15\sqrt{15}}2`}]},

{id:'iA104',topic:'inc',num:'A104',code:'11625',level:3,
 cond:R`В треугольник $ABC$ вписана окружность радиуса $R$, касающаяся стороны $AC$ в точке $M$, причём $AM=2R$ и $CM=3R$.<br><b>а)</b> Докажите, что треугольник $ABC$ прямоугольный.<br><b>б)</b> Найдите расстояние между центрами его вписанной и описанной окружностей, если известно, что $R=2$.`,
 ans:R`\sqrt5`,facts:['В2','Б15'],
 fig(){const B={x:0,y:0},A={x:0,y:6},C={x:8,y:0},I={x:2,y:2};const M=G.foot(I,A,C),O=G.mid(A,C);return{P:{A,B,C,I,M,O},items:[
  ...triItems(),{k:'c',o:'I',r:2,c:'purple',d:'6 5'},seg('I','M',{c:'gray'}),rt('M','I','C'),seg('A','I',{c:'blue'}),seg('C','I',{c:'blue'}),
  arc('A','C','I',{t:'A/2',r:30,st:1}),arc('C','I','A',{t:'C/2',r:36,c:'green',st:1}),
  rt('B','A','C',{st:2}),
  pt('O',{st:3,c:'red'}),{k:'c',o:'O',thr:'A',c:'gray',w:1.2,st:3},mtx('M','O','1',{st:3,dx:10,dy:-8,c:'orange'}),
  seg('I','O',{c:'red',st:4}),
  ...PTS('A','B','C','M'),pt('I')]}},
 steps:[
  {part:'а',t:'Тангенсы половинных углов',do:R`$IM\perp AC$; в прямоугольных треугольниках $AIM$ и $CIM$:`,res:R``,eq:R`\operatorname{tg}\tfrac A2=\frac R{2R}=\frac12,\qquad\operatorname{tg}\tfrac C2=\frac13`,sc:['В2']},
  {t:'Сумма углов',do:R`Тангенс суммы.`,res:R`Пункт а) доказан.`,eq:R`\operatorname{tg}\tfrac{A+C}2=\frac{\frac12+\frac13}{1-\frac16}=1\Rightarrow A+C=90^\circ,\ \angle B=90^\circ`},
  {part:'б',t:'Центр описанной окружности',do:R`$R=2$: $AM=4$, $CM=6$, гипотенуза $AC=10$; $O$ — её середина.`,res:R``,eq:R`AO=5,\qquad OM=AO-AM=1`,sc:['Б15']},
  {t:'Ответ',do:R`Прямоугольный треугольник $IMO$.`,res:R``,eq:R`IO=\sqrt{IM^2+OM^2}=\sqrt{4+1}=\sqrt5`}]},

{id:'iA105',topic:'inc',num:'A105',code:'11630',level:3,
 cond:R`В прямоугольном треугольнике $ABC$ с прямым углом $C$ известны стороны $AC=15$, $BC=8$. Окружность радиуса $2{,}5$ с центром $O$ на стороне $BC$ проходит через вершину $C$. Вторая окружность касается катета $AC$, гипотенузы треугольника, а также внешним образом касается первой окружности.<br><b>а)</b> Докажите, что радиус второй окружности меньше чем $0{,}25$ длины катета $AC$.<br><b>б)</b> Найдите радиус второй окружности.`,
 ans:'2,5',facts:['В5'],
 fig(){const C={x:0,y:0},A={x:0,y:15},B={x:8,y:0},O={x:2.5,y:0},Q={x:2.5,y:5},I={x:3,y:3};return{P:{A,B,C,O,Q,I},items:[
  ...triItems(),rt('C','B','A'),{k:'c',o:'O',r:2.5,c:'blue'},{k:'c',o:'Q',r:2.5,c:'red'},
  {k:'c',o:'I',r:3,c:'gray',d:'4 4',st:1},
  seg('Q',{x:0,y:5},{c:'gray',d:'4 4',st:2}),mtx('Q',{x:0,y:5},'ρ',{st:2,dy:-6,c:'orange'}),
  seg('O','Q',{c:'green',st:3}),
  ...PTS('A','B','C','O'),pt('Q',{st:3})]}},
 steps:[
  {part:'а',t:'Оценка через вписанную окружность',do:R`Вторая окружность лежит внутри треугольника (касается $AC$ и $AB$ изнутри угла $A$ и не пересекает первую), поэтому её радиус не больше радиуса вписанной окружности.`,res:R``,eq:R`\rho\le r=\frac{8+15-17}2=3<3{,}75=0{,}25\cdot AC`,sc:['В5']},
  {part:'б',t:'Координаты',do:R`$C(0;0)$, $B(8;0)$, $A(0;15)$, $O(2{,}5;0)$. Центр второй окружности $Q(\rho;y)$ (касание с $AC$). Прямая $AB$: $15x+8y=120$, расстояние от $Q$ до неё равно $\rho$.`,res:R``,eq:R`\frac{120-15\rho-8y}{17}=\rho\Rightarrow y=15-4\rho`},
  {t:'Внешнее касание',do:R`$QO=\rho+2{,}5$.`,res:R``,eq:R`(\rho-2{,}5)^2+(15-4\rho)^2=(\rho+2{,}5)^2\Rightarrow16\rho^2-130\rho+225=0`},
  {t:'Ответ',do:R`Корни $\rho=2{,}5$ и $\rho=5{,}625$; при втором $y=15-22{,}5<0$ — центр вне треугольника.`,res:R``,eq:R`\rho=2{,}5`}]},

{id:'iA106',topic:'inc',num:'A106',code:'1724',level:3,
 cond:R`Радиус вписанной в треугольник $ABC$ окружности равен трети одной из его высот.<br><b>а)</b> Докажите, что одна из сторон треугольника $ABC$ равна среднему арифметическому двух других его сторон.<br><b>б)</b> Найдите наибольшее возможное значение периметра такого треугольника, если одна из его сторон равна $4$, а две другие имеют целые длины.`,
 ans:'21',facts:['В2'],
 fig(){const{A,B,C}=G.tri(10,7,4);const I=G.incenter(A,B,C),H=G.foot(A,B,C);return{P:{A,B,C,I,H},items:[
  ...triItems(),{k:'c',o:'I',r:G.inr(A,B,C),c:'purple',d:'6 5'},seg('A','H',{c:'blue'}),seg('C','H',{c:'gray',d:'4 4'}),rt('H','A','B'),
  mtx('B','C','a = 7',{st:5,dx:18,c:'orange'}),mtx('A','C','b = 4',{st:5,dx:-18,c:'orange'}),mtx('A','B','c = 10',{st:5,dy:16,c:'orange'}),
  ...PTS('A','B','C','H'),pt('I')]}},
 steps:[
  {part:'а',t:'Площадь двумя способами',do:R`Пусть $r=\frac{h_a}3$, где $h_a$ — высота к стороне $a$.`,res:R``,eq:R`S=r\cdot p=\tfrac12a\cdot h_a`,sc:['В2']},
  {t:'Вывод',do:R`Подставим $r=\frac{h_a}3$.`,res:R`Пункт а) доказан.`,eq:R`\frac{h_a}3\cdot\frac{a+b+c}2=\frac{a\,h_a}2\Rightarrow b+c=2a`},
  {part:'б',t:'Периметр',do:R`$P=a+b+c=3a$. Если $a=4$, то $P=12$.`,res:R``,eq:R`P=3a`},
  {t:'Случай b = 4',do:R`$c=2a-4$. Неравенство треугольника $c<a+4$ даёт $a<8$; остальные выполняются при $a>\frac83$.`,res:R``,eq:R`a\le7\ (a\in\mathbb Z)`},
  {t:'Ответ',do:R`$a=7$: стороны $7,\ 4,\ 10$ — треугольник существует ($4+7>10$).`,res:R``,eq:R`P_{\max}=21`}]},

{id:'iA107',topic:'inc',num:'A107',code:'80521',level:3,
 cond:R`$AC$ и $BC$ — катеты прямоугольного треугольника $ABC$. В этот треугольник вписана окружность с центром в точке $O$, которая касается сторон $AC$ и $BC$ в точках $N$ и $M$ соответственно, а стороны $AB$ — в точке $L$. Известно, что $CN=8$ и $BL=24$.<br><b>а)</b> Докажите, что прямая $ON$ проходит через точку $K$ пересечения медиан треугольника $ABC$.<br><b>б)</b> Найдите площадь треугольника $AKO$.`,
 ans:R`\frac{64}3`,facts:['В5','В1'],

  tick('C','N',1,{st:1}),tick('C','M',1,{st:1}),tick('B','M',2,{st:1,c:'blue'}),tick('B','L',2,{st:1,c:'blue'}),
  mtx('A','N','16',{st:2,dx:-12,c:'orange'}),
  seg('N',{x:32,y:8},{c:'red',d:'5 4',st:3}),seg('A',G.mid(B,C),{c:'gray',d:'4 4',st:3}),seg('B',G.mid(A,C),{c:'gray',d:'4 4',st:3}),pt('K',{st:3,c:'red'}),
  poly(['A','K','O'],'orange',{st:4}),
  ...PTS('A','B','C','N','M','L'),pt('O')]}},
 steps:[
  {part:'а',t:'Радиус и катет BC',do:R`$CNOM$ — квадрат: $r=CN=8$. $BM=BL=24$.`,res:R``,eq:R`BC=8+24=32`,sc:['В5']},
  {t:'Катет AC',do:R`$AN=AL=x$: $AC=x+8$, $AB=x+24$; теорема Пифагора.`,res:R``,eq:R`(x+8)^2+32^2=(x+24)^2\Rightarrow x=16,\ AC=24`,sc:['В1']},
  {t:'Координаты',do:R`$C(0;0)$, $B(32;0)$, $A(0;24)$. Прямая $ON$ — это $y=8$. Центр тяжести — среднее координат вершин.`,res:R`Пункт а) доказан.`,eq:R`K\Big(\tfrac{32}3;\ 8\Big)\in ON`},
  {part:'б',t:'Ответ',do:R`Основание $OK=\frac{32}3-8=\frac83$ на прямой $y=8$, высота из $A$ равна $24-8=16$.`,res:R``,eq:R`S_{AKO}=\tfrac12\cdot\tfrac83\cdot16=\frac{64}3`}]},

{id:'iA109',topic:'inc',num:'A109',code:'170914',level:4,
 cond:R`В параллелограмме $ABCD$ на стороне $BC$ взята точка $M$ такая, что $AM=MC$.<br><b>а)</b> Докажите, что центр окружности, вписанной в треугольник $AMD$, лежит на диагонали $AC$.<br><b>б)</b> Найдите радиус вписанной в треугольник $AMD$ окружности, если $AB=7$, $BC=21$, $\angle BAD=60^\circ$.`,
 ans:R`\frac{34\sqrt3-\sqrt{381}}{14}`,facts:['В2'],
 fig(){const A={x:0,y:0},D={x:21,y:0},B=G.ray(A,60,7),C=G.add(B,D),M={x:11.5,y:B.y};const I=G.incenter(A,M,D);return{P:{A,B,C,D,M,I},items:[
  ...quad('A','B','C','D'),seg('A','M',{c:'blue'}),seg('M','D',{c:'blue'}),seg('A','C',{c:'gray'}),{k:'c',o:'I',r:G.inr(A,M,D),c:'purple',d:'6 5'},
  tick('A','M',1,{st:1}),tick('M','C',1,{st:1}),arc('A','M','C',{r:40,st:1}),arc('C','A','M',{r:40,st:1}),arc('A','C','D',{r:46,c:'green',st:1}),
  mtx('A','M','13',{st:2,dx:-12,c:'orange'}),mtx('M','D','√127',{st:3,dx:16,c:'orange'}),
  poly(['A','M','D'],'blue',{st:4}),
  ...PTS('A','B','C','D','M'),pt('I',{st:1})]}},
 steps:[
  {part:'а',t:'AC — биссектриса угла MAD',do:R`$AM=MC$: $\angle MAC=\angle MCA$; $BC\parallel AD$: $\angle MCA=\angle CAD$.`,res:R`Центр вписанной окружности лежит на биссектрисе $AC$. Пункт а) доказан.`,eq:R`\angle MAC=\angle CAD`},
  {part:'б',t:'Точка M',do:R`Введём $A(0;0)$, $D(21;0)$; высота параллелограмма $h=7\sin60^\circ=\frac{7\sqrt3}2$, $B(3{,}5;h)$, $C(24{,}5;h)$, $M(x;h)$, $AM=MC$.`,res:R``,eq:R`x^2+h^2=(24{,}5-x)^2\Rightarrow x=11{,}5,\ AM=\sqrt{132{,}25+36{,}75}=13`},
  {t:'Сторона MD',do:R`$MD^2=(21-11{,}5)^2+h^2$.`,res:R``,eq:R`MD=\sqrt{90{,}25+36{,}75}=\sqrt{127}`},
  {t:'Площадь и полупериметр',do:R`$S_{AMD}=\frac12\cdot21\cdot h$.`,res:R``,eq:R`S=\frac{147\sqrt3}4,\qquad p=\frac{34+\sqrt{127}}2`},
  {t:'Ответ',do:R`$r=\frac Sp$, избавляемся от иррациональности.`,res:R``,eq:R`r=\frac{147\sqrt3}{2(34+\sqrt{127})}=\frac{147\sqrt3(34-\sqrt{127})}{2\cdot1029}=\frac{34\sqrt3-\sqrt{381}}{14}`,sc:['В2']}]},

{id:'iA111',topic:'inc',num:'A111',code:'127877',level:5,
 cond:R`Дан ромб $ABCD$. Точки $K$ и $P$ — середины сторон $DC$ и $BC$ соответственно. Проведены $AK$ и $AP$ таким образом, что они пересекают диагональ $BD$ в точках $T$ и $Q$ соответственно.<br><b>а)</b> Докажите, что сумма площадей треугольников $DKT$ и $QBP$ равна площади треугольника $AQT$.<br><b>б)</b> Известно, что в $TKCPQ$ можно вписать окружность. Найдите радиус этой окружности, если сторона ромба равна $12\sqrt5$.`,
 ans:'8',facts:['В2'],
 fig(){const p=20,q=8*Math.sqrt(5),A={x:-p,y:0},C={x:p,y:0},B={x:0,y:q},D={x:0,y:-q},O={x:0,y:0};const K=G.mid(D,C),P=G.mid(B,C),T={x:0,y:-q/3},Q={x:0,y:q/3},X={x:8,y:0};return{P:{A,B,C,D,O,K,P,T,Q,X},items:[
  ...quad('A','B','C','D'),seg('A','C',{c:'gray',d:'4 4'}),seg('B','D',{c:'gray'}),seg('A','K',{c:'blue'}),seg('A','P',{c:'blue'}),

  poly(['T','K','C','P','Q'],'purple',{st:3}),{k:'c',o:'X',r:8,c:'red',st:3},pt('X',{n:'',c:'red',st:3}),
  ...PTS('A','B','C','D','K','P','T','Q'),pt('O')]}},
 steps:[
  {part:'а',t:'T — центр тяжести ACD',do:R`$AK$ и $DO$ — медианы треугольника $ACD$, $T$ — их точка пересечения: $DT=\frac23DO=\frac13BD$. Так же $BQ=\frac13BD$.`,res:R``,eq:R`DT=TQ=QB`},
  {t:'Площади',do:R`Пусть $S=S_{ABCD}$. Медианы делят $\triangle ACD$ на 6 равновеликих частей, $S_{DKT}=\frac16\cdot\frac S2$; аналогично $S_{QBP}$; $S_{AQT}=\frac13S_{ABD}$.`,res:R`Пункт а) доказан.`,eq:R`S_{DKT}+S_{QBP}=\frac S{12}+\frac S{12}=\frac S6=S_{AQT}`},
  {part:'б',t:'Центр окружности',do:R`Пятиугольник симметричен относительно $AC$ — центр $X$ на $AC$, и окружность касается $TQ\subset BD$: $X(\rho;0)$, радиус $\rho$. Пусть $OA=p$, $OB=q$, $s=12\sqrt5$.`,res:R``,eq:R`p^2+q^2=s^2=720`},
  {t:'Касание с BC',do:R`Расстояние от $X$ до $BC$: $(p-\rho)\sin\angle OCB$, $\sin\angle OCB=\frac qs$.`,res:R``,eq:R`(p-\rho)\frac qs=\rho\Rightarrow\rho=\frac{pq}{s+q}`},
  {t:'Касание с AP',do:R`$A,Q,P$ на одной прямой, $\operatorname{tg}\angle OAQ=\frac{q/3}p$, $\sin\angle OAQ=\frac q{\sqrt{q^2+9p^2}}$.`,res:R``,eq:R`(p+\rho)\sin\angle OAQ=\rho\Rightarrow\rho=\frac{pq}{\sqrt{q^2+9p^2}-q}`},
  {t:'Ответ',do:R`Приравниваем: $\sqrt{q^2+9p^2}=s+2q$, подставляем $p^2=s^2-q^2$.`,res:R``,eq:R`2s^2-sq-3q^2=0\Rightarrow q=\tfrac23s=8\sqrt5,\ p=20,\ \rho=\frac{160\sqrt5}{20\sqrt5}=8`}]},

{id:'В1',group:'Вписанная окружность треугольника',title:'Отрезки касательных: p − a',short:'Отрезок касательной из вершины A равен p − a, где p — полупериметр, a — противолежащая сторона.',detail:'Из каждой вершины отрезки касательных равны: x = AC₁ = AB₁, y = BC₁ = BA₁, z = CA₁ = CB₁ (A₁, B₁, C₁ — точки касания со сторонами BC, CA, AB). Тогда x + y + z = p, откуда x = p − a, y = p − b, z = p − c. Например, AC₁ = (b + c − a)/2.',

{id:'В3',group:'Описанные многоугольники',title:'Описанный четырёхугольник',short:'В четырёхугольник можно вписать окружность ⇔ суммы противоположных сторон равны: AB + CD = BC + AD.',detail:'Перетаскивайте точки касания T₁…T₄ по окружности; вершины — точки пересечения соседних касательных. Каждая сторона — сумма двух отрезков касательных, и в обеих суммах участвуют все восемь отрезков ровно по одному разу.',
 fix(S){const o={x:400,y:260,r:120};['T1','T2','T3','T4'].forEach(n=>S[n]=onCirc(S[n],o))},

  items.push(...['T1','T2','T3','T4'].map(n=>pt(n,{n:'',size:6,c:'red'})));return{P,items,stats,result:'AB + CD = BC + AD'}},
 init:{T1:G.ray({x:400,y:260},200,120),T2:G.ray({x:400,y:260},290,120),T3:G.ray({x:400,y:260},20,120),T4:G.ray({x:400,y:260},115,120)},drag:['T1','T2','T3','T4']},

 steps:[
  {part:'а',t:'Параллелограмм Вариньона',do:R`$MENF$ — параллелограмм со сторонами $\frac{AC}2$ и $\frac{BD}2$; $MN$ и $EF$ — его диагонали.`,res:R``,eq:R`ME=\tfrac{AC}2,\qquad EN=\tfrac{BD}2`,sc:['М3']},
  {t:'Сумма квадратов диагоналей',do:R`В параллелограмме сумма квадратов диагоналей равна сумме квадратов сторон.`,res:R``,eq:R`MN^2+EF^2=2\Big(\tfrac{AC^2}4+\tfrac{BD^2}4\Big)=\frac{AC^2+BD^2}2`},

 steps:[
  {part:'а',t:'Теорема о пропорциональных отрезках',do:R`$PS\parallel QR$, то есть $PS\parallel BC$ (это верно и без прямого угла $A$).`,res:R`Пункт а) доказан.`,eq:R`\frac{AP}{PB}=\frac{AS}{SC}\Rightarrow BP\cdot AS=AP\cdot CS`,sc:['Б19']},
  {part:'б',t:'Подобие APS и ABC',do:R`Пусть $PQ=x$. Высота треугольника $APS$ равна $AK-x$.`,res:R``,eq:R`\frac{PS}{BC}=\frac{AK-x}{AK}\Rightarrow\frac x{BC}=1-\frac x{AK}`,sc:['Б16']},

{id:'m013',topic:'med',num:'013',code:'10816',level:0,
 cond:R`Точка $M$ — середина гипотенузы $AB$ прямоугольного треугольника $ABC$. Серединный перпендикуляр к гипотенузе пересекает катет $BC$ в точке $N$.<br><b>а)</b> Докажите, что $\angle CAN=\angle CMN$.<br><b>б)</b> Найдите отношение радиусов окружностей, описанных около треугольников $ANB$ и $CBM$, если $\operatorname{tg}\angle BAC=\frac{12}5$.`,
 ans:'13/12',facts:['Б15','Б13','Б18'],
 fig(){const C={x:0,y:0},A={x:5,y:0},B={x:0,y:12};const M=G.mid(A,B),N=G.inter(M,G.add(M,{x:12,y:5}),B,C);return{P:{A,B,C,M,N},items:[

  tick('N','A',1,{st:3}),tick('N','B',1,{st:3}),arc('N','A','B',{t:'2α',r:22,c:'red',st:3}),
  tick('M','C',2,{st:4,c:'blue'}),tick('M','B',2,{st:4,c:'blue'}),arc('M','B','C',{t:'2α',r:20,c:'red',st:4}),

 steps:[

  {t:'Вписанные углы',do:R`$\angle CAN$ и $\angle CMN$ опираются на дугу $CN$.`,res:R`Пункт а) доказан.`,eq:R`\angle CAN=\angle CMN`,sc:['Б13']},

  {t:'Радиус для CBM',do:R`$MC=MB$ (медиана к гипотенузе), $\angle BMC=180^\circ-2\angle B=2\alpha$.`,res:R``,eq:R`R_2=\frac{BC}{2\sin2\alpha}`},
  {t:'Ответ',do:R`$\operatorname{tg}\alpha=\frac{12}5\Rightarrow\sin\alpha=\frac{12}{13}$, $\frac{BC}{AB}=\sin\alpha$.`,res:R``,eq:R`\frac{R_1}{R_2}=\frac{AB}{BC}=\frac{13}{12}`}]},

{id:'m014',topic:'med',num:'014',code:'11453',level:2,
 cond:R`Дан треугольник $ABC$. Серединный перпендикуляр к стороне $AB$ пересекается с биссектрисой угла $BAC$ в точке $K$, лежащей на стороне $BC$.<br><b>а)</b> Докажите, что $AC^2=BC\cdot CK$.<br><b>б)</b> Найдите радиус окружности, вписанной в треугольник $AKB$, если $\cos\angle B=\frac23$, $AC=36$, а площадь треугольника $AKC$ равна $126\sqrt5$.`,
 ans:R`\frac{14\sqrt5}5`,facts:['Б16','В2'],
 fig(){const{A,B,C}=G.tri(28,48,36);const K=G.bis(A,B,C),Mm=G.mid(A,B);return{P:{A,B,C,K,M:Mm},items:[
  ...triItems(),seg('A','K',{c:'blue'}),seg('K','M',{c:'gray',d:'5 4'}),rt('M','K','B'),tick('K','A',1),tick('K','B',1),
  arc('A','B','K',{r:30,st:1}),arc('B','K','A',{r:30,st:1}),arc('A','K','C',{r:36,st:2}),
  poly(['C','A','K'],'orange',{st:2}),
  poly(['A','K','C'],'green',{st:3}),{k:'c',o:G.incenter(A,K,B),r:G.inr(A,K,B),c:'purple',d:'6 5',st:5},
  dS('A','C','36'),dT('B','cos B = 2/3',10,26),
  ...PTS('A','B','C','K')]}},
 steps:[
  {part:'а',t:'Равнобедренный треугольник AKB',do:R`$K$ на серединном перпендикуляре к $AB$: $KA=KB$, $\angle KAB=\angle B$.`,res:R``,eq:R`\angle KAC=\angle KAB=\angle B`},
  {t:'Подобие',do:R`Треугольники $CAK$ и $CBA$: угол $C$ общий, $\angle CAK=\angle CBA$.`,res:R`Пункт а) доказан.`,eq:R`\frac{CA}{CB}=\frac{CK}{CA}\Rightarrow AC^2=BC\cdot CK`,sc:['Б16']},
  {part:'б',t:'Отрезок AK',do:R`$\sin B=\frac{\sqrt5}3$; площадь $AKC$ через стороны $AC$, $AK$ и угол $\angle KAC=\angle B$.`,res:R``,eq:R`\tfrac12\cdot36\cdot AK\cdot\tfrac{\sqrt5}3=126\sqrt5\Rightarrow AK=21=KB`},
  {t:'Треугольник AKB',do:R`Основание $AB=2\cdot21\cos B=28$, высота из $K$ равна $21\sin B=7\sqrt5$.`,res:R``,eq:R`S_{AKB}=\tfrac12\cdot28\cdot7\sqrt5=98\sqrt5,\qquad p=35`},
  {t:'Ответ',do:R`$r=\frac Sp$.`,res:R``,eq:R`r=\frac{98\sqrt5}{35}=\frac{14\sqrt5}5=\frac{14}{\sqrt5}`,sc:['В2']}]},

{id:'m015',topic:'med',num:'015',code:'21053',level:2,
 cond:R`Дана трапеция $ABCD$ с основанием $BC=2$ и $\angle BAD=60^\circ$. Высота трапеции $BH$ равна $2\sqrt3$. Диагональ $AC$ пересекает высоту $BH$ в точке $M$.<br><b>а)</b> Докажите, что $M$ — середина $BH$.<br><b>б)</b> Найдите $\angle ACH$.`,
 ans:R`\arcsin\frac{\sqrt{21}}{14}`,facts:[],
 fig(){const s3=Math.sqrt(3),A={x:0,y:0},H={x:2,y:0},B={x:2,y:2*s3},C={x:4,y:2*s3},D={x:6.5,y:0},M={x:2,y:s3};return{P:{A,B,C,D,H,M},items:[

  tick('A','H',1,{st:1}),tick('B','C',1,{st:1}),poly(['A','M','H'],'green',{st:2}),poly(['C','M','B'],'green',{st:2}),tick('B','M',2,{st:2,c:'red'}),tick('M','H',2,{st:2,c:'red'}),
  seg('C','H',{c:'red',st:3}),arc('C','A','H',{r:26,c:'orange',st:4}),
  dS('B','C','2'),dA('A','B','D','60°',{r:22}),dT('B','BH = 2√3',-30,0),

 steps:[
  {part:'а',t:'Отрезок AH',do:R`В прямоугольном треугольнике $ABH$: $AH=BH\operatorname{ctg}60^\circ$.`,res:R``,eq:R`AH=2\sqrt3\cdot\tfrac1{\sqrt3}=2=BC`},
  {t:'Равные треугольники',do:R`$\triangle AMH=\triangle CMB$: $AH=CB$, $\angle MAH=\angle MCB$ (накрест лежащие), $\angle AHM=\angle CBM=90^\circ$.`,res:R`Пункт а) доказан.`,eq:R`BM=MH`},
  {part:'б',t:'Стороны треугольника ACH',do:R`$CH^2=BC^2+BH^2$, $AC^2=(AH+BC)^2+BH^2$.`,res:R``,eq:R`CH=4,\qquad AC=2\sqrt7,\qquad AH=2`},

 cond:R`Два равнобедренных прямоугольных треугольника $ABM$ и $CDM$ с гипотенузами $AB$ и $CD$ расположены так, что $ABCD$ — выпуклый четырехугольник.<br><b>а)</b> Докажите, что диагонали четырехугольника $ABCD$ равны.<br><b>б)</b> Найдите площадь четырехугольника $ABCD$, если $AC=2$.`,

{id:'m022',topic:'med',num:'022',code:'354',level:2,
 cond:R`На стороне $AC$ равностороннего треугольника $ABC$ отмечена точка $P$, а на продолжении стороны $AB$ за вершину $A$ отмечена точка $Q$ так, что $BP=PQ$.<br><b>а)</b> Докажите, что $AC$ равно длине ломаной $QAP$.<br><b>б)</b> Найдите площадь четырёхугольника $BQPC$, если $AP=2$, $PC=4$.`,
 ans:R`11\sqrt3`,facts:[],
 fig(){const s3=Math.sqrt(3),A={x:0,y:0},B={x:6,y:0},C={x:3,y:3*s3},P={x:1,y:s3},Q={x:-4,y:0},F={x:1,y:0};return{P:{A,B,C,P,Q,F},items:[

  arc('A','P','Q',{t:'120°',r:16,c:'green',st:5}),poly(['B','Q','P','C'],'orange',{st:5}),
  dS('A','P','2'),dS('P','C','4'),

 steps:[

  {t:'Отрезок AF',do:R`$\angle PAF=60^\circ$.`,res:R``,eq:R`AF=AP\cos60^\circ=\tfrac{AP}2,\qquad FB=AB-\tfrac{AP}2`},
  {t:'Вывод',do:R`$QA=QF-AF=FB-AF$.`,res:R`Пункт а) доказан.`,eq:R`QA=AB-AP\Rightarrow AC=AB=QA+AP`},

  {t:'Ответ',do:R`$S_{BQPC}=S_{ABC}+S_{AQP}$, $\angle QAP=120^\circ$.`,res:R``,eq:R`S=\frac{36\sqrt3}4+\tfrac12\cdot4\cdot2\cdot\tfrac{\sqrt3}2=9\sqrt3+2\sqrt3=11\sqrt3`}]},

{id:'m023',topic:'med',num:'023',code:'11679',level:3,
 cond:R`На диагонали параллелограмма взяли точку, отличную от её середины. Из неё на все стороны параллелограмма (или их продолжения) опустили перпендикуляры.<br><b>а)</b> Докажите, что четырёхугольник, образованный основаниями этих перпендикуляров, является трапецией.<br><b>б)</b> Найдите площадь полученной трапеции, если площадь параллелограмма равна $16$, а один из его углов равен $60^\circ$.`,
 ans:'6',facts:['Б19'],
 fig(){const ab=5.5,ad=32/Math.sqrt(3)/ab,A={x:0,y:0},B={x:ab,y:0},D=G.ray(A,60,ad),C=G.add(B,D);const X=G.lerp(A,C,0.35);const K=G.foot(X,A,B),L=G.foot(X,B,C),M=G.foot(X,C,D),N=G.foot(X,D,A);return{P:{A,B,C,D,X,K,L,M,N},items:[

  seg('K','M',{c:'red',d:'5 4',st:1}),seg('L','N',{c:'red',d:'5 4',st:1}),
  poly(['K','L','M','N'],'orange',{st:2}),seg('K','N',{c:'green',w:3,st:2}),seg('L','M',{c:'green',w:3,st:2}),
  dT('A','S = 16, ∠A = 60°',40,26),
  ...PTS('A','B','C','D','K','L','M','N'),pt('X',{c:'red'})]}},
 steps:[
  {part:'а',t:'Две прямые через X',do:R`$X$ — точка на диагонали $AC$. Перпендикуляры к параллельным сторонам $AB$ и $CD$ лежат на одной прямой: $K,X,M$ коллинеарны; так же $L,X,N$.`,res:R``,eq:R`KM\ni X,\qquad LN\ni X`},
  {t:'KN ∥ LM',do:R`Расстояния от точки диагонали до $AB$ и $CD$ (до $AD$ и $BC$) относятся как $AX:XC$.`,res:R`Треугольники $XKN$ и $XML$ подобны (вертикальные углы), $KN\parallel LM$; а $KL\nparallel NM$, так как $AX\ne XC$. Пункт а) доказан.`,eq:R`\frac{XK}{XM}=\frac{XN}{XL}=\frac{AX}{XC}`,sc:['Б19']},
  {part:'б',t:'Площадь через диагонали',do:R`$KM=h_1$ (расстояние между $AB$ и $CD$), $LN=h_2$; угол между ними равен углу параллелограмма $60^\circ$.`,res:R``,eq:R`S=\tfrac12h_1h_2\sin60^\circ`},
  {t:'Ответ',do:R`$h_1=AD\sin60^\circ$, $h_2=AB\sin60^\circ$, $AB\cdot AD\sin60^\circ=16$.`,res:R``,eq:R`S=\tfrac12\cdot16\sin60^\circ\cdot\sin60^\circ=8\cdot\tfrac34=6`}]},

{id:'m024',topic:'med',num:'024',code:'158181',level:3,
 cond:R`Диагональ $AC$ делит выпуклый пятиугольник $ABCDE$ на равносторонний треугольник $ABC$ и ромб $ACDE$.<br><b>а)</b> Докажите, что угол $DBE$ равен $30^\circ$.<br><b>б)</b> Отрезки $AD$ и $BE$ пересекаются в точке $O$. Найдите площадь треугольника $BOD$, если $BD=6$.`,

  ...PTS('A','B','C','D','E'),pt('O',{st:4})]}},
 steps:[
  {part:'а',t:'Окружность с центром C',do:R`$CB=CA=CD$: точки $B,A,D$ на окружности с центром $C$.`,res:R``,eq:R`\angle ABD=\tfrac12\angle ACD`,sc:['Б13']},
  {t:'Окружность с центром A',do:R`$AB=AC=AE$: точки $B,C,E$ на окружности с центром $A$.`,res:R``,eq:R`\angle CBE=\tfrac12\angle CAE`},
  {t:'Сумма',do:R`В ромбе $\angle ACD+\angle CAE=180^\circ$, поэтому $\angle ABD+\angle CBE=90^\circ$. Эти углы перекрываются по углу $DBE$ и вместе покрывают $\angle ABC=60^\circ$.`,res:R`Пункт а) доказан.`,eq:R`\angle ABD+\angle CBE=\angle ABC+\angle DBE\Rightarrow\angle DBE=30^\circ`},
  {part:'б',t:'Угол BDA',do:R`$\angle BDA$ — вписанный в окружность с центром $C$, опирается на дугу $AB$: $\angle BCA=60^\circ$.`,res:R``,eq:R`\angle BDO=30^\circ=\angle DBO\Rightarrow OB=OD`},
  {t:'Ответ',do:R`Высота равнобедренного треугольника к основанию $BD=6$: $3\operatorname{tg}30^\circ=\sqrt3$.`,res:R``,eq:R`S_{BOD}=\tfrac12\cdot6\cdot\sqrt3=3\sqrt3`}]},

{...T18('m025','025','16717',3)},

{id:'m026',topic:'med',num:'026',code:'80525',level:3,
 cond:R`Точки $K$ и $M$ расположены соответственно на стороне $BC$ и высоте $BH$ остроугольного треугольника $ABC$ так, что треугольник $AKM$ равносторонний. Известно, что $AH=3$, $HC=2$, $CK:KB=1:10$.<br><b>а)</b> Докажите, что отрезок высоты $BH$, ограниченный треугольником $AKM$, относится к стороне треугольника $AKM$ как $7:8$.<br><b>б)</b> Найдите площадь треугольника $AKM$.`,
 ans:R`\frac{49\sqrt3}3`,facts:[],
 fig(){const A={x:-3,y:0},H={x:0,y:0},C={x:2,y:0},M={x:0,y:13/Math.sqrt(3)};const K=G.add(A,G.rot(G.sub(M,A),{x:0,y:0},-60));const Y=G.inter(A,K,H,M);return{P:{A,H,C,M,K,Y},items:[
  seg('A','C',{w:2.6}),seg('H','M',{c:'gray'}),rt('H','C','M'),poly(['A','K','M'],'orange',{c:'orange'}),seg('M','Y',{c:'red',w:3,st:2}),
  ...PTS('A','H','C','M','K'),pt('Y',{n:'',st:2})]}},
 steps:[
  {t:'Проверка данных',do:R`Введём координаты $H(0;0)$, $A(-3;0)$, $C(2;0)$, $B(0;b)$, $K$ на $BC$ с $CK:KB=1:10$, $M(0;m)$ и потребуем $AM=AK=KM$.`,res:R`Система не имеет решений с $M$ на отрезке $BH$ и $b>0$ — в распознанном условии, видимо, искажены данные. Ответ ключа $\frac{49\sqrt3}3$ соответствует стороне $\frac{14}{\sqrt3}$ и $HM=\frac{13}{\sqrt3}$, но тогда $K$ лежит не на стороне $BC$.`,eq:R`\text{Нужно сверить условие с оригиналом (задача 80525)}`},
  {part:'а',t:'Общая формула для пункта а)',do:R`Пусть $\angle MAH=\alpha$; сторона $AK$ идёт под углом $\alpha-60^\circ$ к $AC$. Отрезок $MY$ высоты внутри треугольника ($Y=AK\cap BH$):`,res:R`Отношение $7:8$ равносильно $\cos(\alpha-60^\circ)=\frac{4\sqrt3}7$; тогда $AM=\frac{AH}{\cos\alpha}=\frac{14}{\sqrt3}$ и $S=\frac{\sqrt3}4\cdot\frac{196}3=\frac{49\sqrt3}3$.`,eq:R`\frac{MY}{AM}=\frac{\sin60^\circ}{\cos(\alpha-60^\circ)}`}]},

{id:'m027',topic:'med',num:'027',code:'26926',level:5,
 cond:R`Прямая, параллельная боковой стороне $CD$ равнобокой трапеции $ABCD$, пересекает боковую сторону $AB$ в точке $F$ и основание $AD$ в точке $E$. Оказалось, что $FC=ED$.<br><b>а)</b> Докажите, что углы $AFE$ и $BCF$ равны.<br><b>б)</b> Известно, что $FE=5$, $ED:FB=3:1$, а площадь четырехугольника $FCDE$ равна $14\sqrt{35}$. Найдите площадь трапеции $ABCD$.`,
 ans:R`\frac{73\sqrt{35}}4`,facts:[],
 fig(){const ca=1/6,sa=Math.sqrt(35)/6,A={x:0,y:0},D={x:41/3,y:0},B={x:9*ca,y:9*sa},C={x:41/3-9*ca,y:9*sa},F={x:5*ca,y:5*sa},E={x:5/3,y:0};return{P:{A,B,C,D,E,F},items:[

  poly(['F','C','D','E'],'green',{st:2}),arc('C','F','D',{r:24,c:'green',st:2}),
