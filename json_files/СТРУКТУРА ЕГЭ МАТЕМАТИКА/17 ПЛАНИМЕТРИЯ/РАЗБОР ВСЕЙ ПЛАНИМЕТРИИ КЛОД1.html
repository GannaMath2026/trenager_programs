 steps:[
  {part:'а',t:'AF = FE',do:R`$FE\parallel CD$: $\angle AEF=\angle ADC=\angle BAD$ (трапеция равнобокая).`,res:R``,eq:R`\angle FAE=\angle FEA\Rightarrow AF=FE`},
  {t:'Равнобокая трапеция FCDE',do:R`$FE\parallel CD$ и $FC=ED$ ($FC\nparallel ED$, так как $F$ не на $BC$).`,res:R``,eq:R`\angle FCD=\angle EDC=\angle A`},
  {t:'Вывод',do:R`$\angle BCF=\angle BCD-\angle FCD=(180^\circ-\angle A)-\angle A$, а $\angle AFE=180^\circ-2\angle A$.`,res:R`Пункт а) доказан.`,eq:R`\angle AFE=\angle BCF=180^\circ-2\angle A`},
  {part:'б',t:'Косинус угла A',do:R`$AF=FE=5$, $FB=x$, $ED=FC=3x$, $CD=AB=5+x$. В трапеции $FCDE$: $CD-FE=2\cdot ED\cos A$.`,res:R``,eq:R`x=6x\cos A\Rightarrow\cos A=\tfrac16,\ \sin A=\tfrac{\sqrt{35}}6`},
  {t:'Находим x',do:R`$S_{FCDE}=\frac{FE+CD}2\cdot ED\sin A$.`,res:R``,eq:R`\frac{(10+x)\,x\sqrt{35}}4=14\sqrt{35}\Rightarrow x^2+10x-56=0,\ x=4`},
  {t:'Размеры трапеции',do:R`$AB=9$, $AE=2\cdot5\cos A=\frac53$, $AD=\frac53+12=\frac{41}3$, $BC=AD-2AB\cos A=\frac{32}3$, $h=9\sin A=\frac{3\sqrt{35}}2$.`,res:R``,eq:R`S=\frac{\frac{41}3+\frac{32}3}2\cdot\frac{3\sqrt{35}}2=\frac{73\sqrt{35}}4`}]},

{id:'m125947',topic:'med',num:'125947',code:'125947',level:2,

 steps:[
  {part:'а',t:'Угол MAC',do:R`В прямоугольном треугольнике $AHC$: $\angle HAC=90^\circ-30^\circ=60^\circ$; $AM$ — биссектриса.`,res:R``,eq:R`\angle MAC=30^\circ=\angle MCA\Rightarrow MA=MC`},

  {part:'б',t:'Длины',do:R`$AB=10$, $\angle C=30^\circ$: $BC=20$, $MC=10$; $BH=AB\cos60^\circ=5$, $HM=5$.`,res:R``,eq:R`MC=10,\qquad HM=5`},

 steps:[
  {part:'а',t:'Расстояние до ортоцентра',do:R`Расстояние от вершины до ортоцентра: $AH=2R|\cos A|$ (вдвое больше расстояния от $O$ до $BC$).`,res:R`Пункт а) доказан.`,eq:R`AH=2R\cos60^\circ=R=AO`,sc:['М9']},

const clampIn=(S,n)=>{const a=S.A,b=S.B,c=S.C,p=S[n];const s1=side(p,a,b),s2=side(p,b,c),s3=side(p,c,a),sg=side(c,a,b);if(s1!==sg||s2!==side(a,b,c)||s3!==side(b,c,a))S[n]=G.lerp(cent(S),p,0.6)};
const SCENES_MED=[
{id:'М1',group:'Медианы',title:'Точка пересечения медиан',short:'Медианы пересекаются в одной точке M и делятся ею в отношении 2 : 1, считая от вершины; они делят треугольник на 6 равновеликих треугольников.',detail:'Площадь каждого из шести треугольников равна S/6. Отсюда: треугольники AMB, BMC, CMA равновелики (S/3), а четырёхугольник «вершина — середина — M — середина» имеет площадь S/3.',
 build(S){const A1=G.mid(S.B,S.C),B1=G.mid(S.A,S.C),C1=G.mid(S.A,S.B),M=cent(S);const cols=['blue','green','orange','purple','teal','pink'];const tri6=[['A','C1','M'],['C1','B','M'],['B','A1','M'],['A1','C','M'],['C','B1','M'],['B1','A','M']];return{P:{...S,A1,B1,C1,M},items:[...tri6.map((t,i)=>poly(t,cols[i])),...T3(),seg('A','A1',{c:'red'}),seg('B','B1',{c:'red'}),seg('C','C1',{c:'red'}),pt('M',{c:'red'}),pt('A1',{n:'A₁'}),pt('B1',{n:'B₁'}),pt('C1',{n:'C₁'}),...V3()],
  stats:[`AM/MA₁ = ${fmt(G.d(S.A,M)/G.d(M,A1),3)}`,`BM/MB₁ = ${fmt(G.d(S.B,M)/G.d(M,B1),3)}`,`S/6 = ${SQ(G.area(S.A,S.B,S.C)/6)}`,`S(AC₁M) = ${SQ(G.area(S.A,C1,M))}`],result:'AM : MA₁ = 2 : 1,\n6 частей по S/6'}}},
{id:'М2',group:'Медианы',title:'Длина медианы',short:'mₐ² = (2b² + 2c² − a²)/4. Сумма квадратов медиан равна ¾(a² + b² + c²).',detail:'Достройте треугольник до параллелограмма ABDC (удвоение медианы): сумма квадратов диагоналей параллелограмма равна сумме квадратов его сторон: (2mₐ)² + a² = 2b² + 2c².',
 build(S){const A1=G.mid(S.B,S.C),l=lens(S),ma=G.d(S.A,A1);return{P:{...S,A1},items:[...T3(),seg('A','A1',{c:'red',w:3}),tick('B','A1',1),tick('A1','C',1),pt('A1',{n:'A₁'}),...V3()],
  stats:[`mₐ² = ${SQ(ma*ma)}`,`(2b² + 2c² − a²)/4 = ${SQ((2*l.b*l.b+2*l.c*l.c-l.a*l.a)/4)}`],result:'mₐ² = (2b² + 2c² − a²)/4'}}},
{id:'М8',group:'Медианы',title:'Удвоение медианы',short:'Продлим медиану AM на её длину: AD = 2AM. ABDC — параллелограмм: BD = AC, CD = AB, BD ∥ AC.',detail:'Ключевой приём: появляются равные треугольники ABM и DCM, параллельные прямые и возможность «переносить» углы и отрезки.',
 build(S){const M=G.mid(S.B,S.C),D=G.sub(G.mul(M,2),S.A);return{P:{...S,M,D},items:[...T3(),seg('A','D',{c:'red'}),seg('B','D',{c:'blue',d:'6 4'}),seg('C','D',{c:'blue',d:'6 4'}),tick('A','M',2,{c:'red'}),tick('M','D',2,{c:'red'}),tick('B','M',1),tick('M','C',1),poly(['A','B','M'],'green'),poly(['D','C','M'],'green'),pt('M'),pt('D'),...V3()],
  stats:[`AB = ${L1(G.d(S.A,S.B))}`,`CD = ${L1(G.d(S.C,D))}`,`AC = ${L1(G.d(S.A,S.C))}`,`BD = ${L1(G.d(S.B,D))}`],result:'ABDC — параллелограмм'}}},
{id:'М3',group:'Четырёхугольники',title:'Параллелограмм Вариньона',short:'Середины сторон любого четырёхугольника — вершины параллелограмма: его стороны параллельны диагоналям и равны их половинам, площадь равна половине площади четырёхугольника.',detail:'PQ и SR — средние линии треугольников ABC и ADC. Периметр параллелограмма равен сумме диагоналей. Если диагонали равны — ромб, если перпендикулярны — прямоугольник.',
 build(S){const P=G.mid(S.A,S.B),Q=G.mid(S.B,S.C),R2=G.mid(S.C,S.D),Sm=G.mid(S.D,S.A);return{P:{...S,P,Q,R:R2,Sm},items:[seg('A','B',{w:2.6}),seg('B','C',{w:2.6}),seg('C','D',{w:2.6}),seg('D','A',{w:2.6}),seg('A','C',{c:'gray',d:'5 4'}),seg('B','D',{c:'gray',d:'5 4'}),poly(['P','Q','R','Sm'],'blue',{c:'blue'}),pt('P'),pt('Q'),pt('R'),pt('Sm',{n:'S'}),...V3(),pt('D',{size:6})],
  stats:[`PQ = ${L1(G.d(P,Q))}`,`AC/2 = ${L1(G.d(S.A,S.C)/2)}`,`S(PQRS) = ${SQ(G.area(P,Q,R2,Sm))}`,`S(ABCD)/2 = ${SQ(G.area(S.A,S.B,S.C,S.D)/2)}`],result:'PQ ∥ AC, PQ = AC/2,\nS = ½S(ABCD)'}},init:{A:{x:220,y:380},B:{x:300,y:110},C:{x:600,y:150},D:{x:560,y:410}},drag:['A','B','C','D']},
{id:'М4',group:'Чевианы',title:'Теорема Чевы',short:'Прямые AA₁, BB₁, CC₁ пересекаются в одной точке ⇔ (AC₁/C₁B)·(BA₁/A₁C)·(CB₁/B₁A) = 1.',detail:'Перетаскивайте точку P внутри треугольника. Доказательство через площади: AC₁/C₁B = S(APC)/S(BPC) и т.д., произведение равно 1.',
 fix(S){clampIn(S,'P')},
 build(S){const A1=G.inter(S.A,S.P,S.B,S.C),B1=G.inter(S.B,S.P,S.C,S.A),C1=G.inter(S.C,S.P,S.A,S.B);const r1=G.d(S.A,C1)/G.d(C1,S.B),r2=G.d(S.B,A1)/G.d(A1,S.C),r3=G.d(S.C,B1)/G.d(B1,S.A);return{P:{...S,A1,B1,C1},items:[...T3(),seg('A','A1',{c:'blue'}),seg('B','B1',{c:'blue'}),seg('C','C1',{c:'blue'}),pt('A1',{n:'A₁'}),pt('B1',{n:'B₁'}),pt('C1',{n:'C₁'}),pt('P',{size:6,c:'red'}),...V3()],
  stats:[`AC₁/C₁B = ${fmt(r1,3)}`,`BA₁/A₁C = ${fmt(r2,3)}`,`CB₁/B₁A = ${fmt(r3,3)}`,`произведение = ${fmt(r1*r2*r3,3)}`],result:'произведение = 1'}},init:{P:{x:390,y:240}},drag:['A','B','C','P']},
{id:'М5',group:'Чевианы',title:'Теорема Ван-Обеля',short:'Для чевиан через точку P: AP/PA₁ = AC₁/C₁B + AB₁/B₁C.',detail:'Следует из теоремы Менелая для треугольника ABA₁ и прямой CC₁ (и для ACA₁ и прямой BB₁). Частный случай — точка пересечения медиан: 1 + 1 = 2.',
 fix(S){clampIn(S,'P')},
 build(S){const A1=G.inter(S.A,S.P,S.B,S.C),B1=G.inter(S.B,S.P,S.C,S.A),C1=G.inter(S.C,S.P,S.A,S.B);return{P:{...S,A1,B1,C1},items:[...T3(),seg('A','A1',{c:'red',w:3}),seg('B','B1',{c:'blue'}),seg('C','C1',{c:'blue'}),pt('A1',{n:'A₁'}),pt('B1',{n:'B₁'}),pt('C1',{n:'C₁'}),pt('P',{size:6,c:'red'}),...V3()],
  stats:[`AP/PA₁ = ${fmt(G.d(S.A,S.P)/G.d(S.P,A1),3)}`,`AC₁/C₁B + AB₁/B₁C = ${fmt(G.d(S.A,C1)/G.d(C1,S.B)+G.d(S.A,B1)/G.d(B1,S.C),3)}`],result:'AP/PA₁ = AC₁/C₁B + AB₁/B₁C'}},init:{P:{x:360,y:250}},drag:['A','B','C','P']},
{id:'М6',group:'Площади',title:'Треугольники с общим углом',short:'Если у треугольников равны (или общие) углы, их площади относятся как произведения сторон, заключающих эти углы: S(AXY)/S(ABC) = (AX·AY)/(AB·AC).',detail:'S = ½·AX·AY·sin A. Частный случай — подобие с коэффициентом k: площади относятся как k². Перетаскивайте X по AB и Y по AC.',
 fix(S){const pr=(n,U,W)=>{const t=Math.max(.05,Math.min(.95,((S[n].x-U.x)*(W.x-U.x)+(S[n].y-U.y)*(W.y-U.y))/G.d(U,W)**2));S[n]=G.lerp(U,W,t)};pr('X',S.A,S.B);pr('Y',S.A,S.C)},
 build(S){return{P:{...S},items:[...T3(),poly(['A','X','Y'],'orange'),seg('X','Y',{c:'red'}),pt('X',{size:6,c:'red'}),pt('Y',{size:6,c:'red'}),...V3()],
  stats:[`S(AXY)/S(ABC) = ${fmt(G.area(S.A,S.X,S.Y)/G.area(S.A,S.B,S.C),3)}`,`(AX·AY)/(AB·AC) = ${fmt(G.d(S.A,S.X)*G.d(S.A,S.Y)/(G.d(S.A,S.B)*G.d(S.A,S.C)),3)}`],result:'S₁/S₂ = (AX·AY)/(AB·AC)'}},init:{X:{x:290,y:220},Y:{x:470,y:200}},drag:['A','B','C','X','Y']},
{id:'М7',group:'Площади',title:'Трапеция: диагонали и боковые стороны',short:'В трапеции S(AOB) = S(COD); треугольники BOC и AOD подобны (k = BC/AD); прямая через точку пересечения диагоналей и точку пересечения боковых сторон делит основания пополам.',detail:'Перетаскивайте A, B, C; D строится так, что AD ∥ BC и AD = 1,8·BC. S(AOB)² = S(BOC)·S(AOD).',
 build(S){const D=G.add(S.A,G.mul(G.sub(S.C,S.B),1.8));const O=G.inter(S.A,S.C,S.B,D),K=G.inter(S.A,S.B,D,S.C),M1=G.mid(S.B,S.C),M2=G.mid(S.A,D);const P={...S,D,O,K,M1,M2};const items=[seg('A','B',{w:2.6}),seg('B','C',{w:2.6}),seg('C','D',{w:2.6}),seg('D','A',{w:2.6}),seg('A','C',{c:'blue'}),seg('B','D',{c:'blue'}),poly(['A','O','B'],'green'),poly(['C','O','D'],'green'),poly(['B','O','C'],'orange'),poly(['A','O','D'],'orange')];
  if(K&&G.d(K,O)<3000)items.push(seg('B','K',{c:'gray',d:'4 4'}),seg('C','K',{c:'gray',d:'4 4'}),seg('K','M2',{c:'red',d:'6 4'}),pt('K'));
  items.push(tick('B','M1',1),tick('M1','C',1),tick('A','M2',2),tick('M2','D',2),pt('O'),pt('D'),...V3());return{P,items,stats:[`S(AOB) = ${SQ(G.area(S.A,O,S.B))}`,`S(COD) = ${SQ(G.area(S.C,O,D))}`,`BO/OD = ${fmt(G.d(S.B,O)/G.d(O,D),3)}`],result:'S(AOB) = S(COD)'}},init:{A:{x:170,y:400},B:{x:300,y:180},C:{x:470,y:180}}},
{id:'М9',group:'Треугольник и окружность',title:'Расстояние от вершины до ортоцентра',short:'AH = 2R·|cos A| = 2·OA₁ (A₁ — середина BC); угол между AH и AO равен |∠B − ∠C|.',detail:'Отрезок AH вдвое больше расстояния от центра описанной окружности до стороны BC. При ∠A = 60° получаем AH = R = AO.',
 build(S){const O=G.circ3(S.A,S.B,S.C),H=G.add(G.sub(G.add(S.A,S.B),{x:O.x,y:O.y}),G.sub(S.C,{x:O.x,y:O.y})),A1=G.mid(S.B,S.C),l=lens(S);const Hf=G.foot(S.A,S.B,S.C);return{P:{...S,O,H,A1,Hf},items:[{k:'c',o:'O',c:'gray'},...T3(),seg('A','Hf',{c:'gray',d:'4 4'}),seg('A','H',{c:'red',w:3}),seg('O','A1',{c:'blue',w:3}),seg('A','O',{c:'blue',d:'5 4'}),rt('A1','O','C'),pt('O'),pt('H',{c:'red'}),pt('A1',{n:'A₁'}),...V3()],
  stats:[`AH = ${L1(G.d(S.A,H))}`,`2·OA₁ = ${L1(2*G.d(O,A1))}`,`2R|cos A| = ${L1(2*O.r*Math.abs(Math.cos(G.rad(l.A))))}`,`∠HAO = ${fmt(G.ang(H,S.A,O),1)}°, |B − C| = ${fmt(Math.abs(l.B-l.C),1)}°`],result:'AH = 2R|cos A|'}}}
];

{id:'qA124',topic:'quad',num:'A124',code:'107670',level:1,
 cond:R`В параллелограмме $ABCD$ биссектриса угла $BAD$ пересекает сторону $BC$ в точке $K$, а продолжение стороны $DC$ — в точке $P$; диагональ $AC$ является биссектрисой угла $KAD$.<br><b>а)</b> Докажите, что $PC^2=CD\cdot PK$.<br><b>б)</b> Найдите $AC:AP$, если $BC:AB=2$.`,
 ans:R`\frac{\sqrt3}2`,facts:['Б10','Б16'],
 fig(){const A={x:0,y:0},D={x:2,y:0},B=G.ray(A,120,1),C=G.add(B,{x:2,y:0}),K=G.ray(A,60,1),P=G.ray(A,60,2);return{P:{A,B,C,D,K,P},items:[
  ...quad('A','B','C','D'),seg('A','P',{c:'blue'}),seg('C','P',{c:'gray',d:'5 4'}),seg('A','C',{c:'green'}),
  arc('A','B','K',{r:22,st:1}),arc('A','K','D',{r:28,st:1}),arc('K','B','A',{r:22,st:1}),tick('A','B',1,{st:1}),tick('B','K',1,{st:1}),
  arc('P','K','C',{r:22,c:'blue',st:2}),arc('K','C','P',{r:22,c:'blue',st:2}),tick('C','K',2,{st:2,c:'blue'}),tick('C','P',2,{st:2,c:'blue'}),
  arc('A','K','C',{r:46,c:'green',st:3}),arc('A','C','D',{r:52,c:'green',st:3}),tick('K','A',3,{st:3,c:'green'}),
  poly(['A','B','K'],'orange',{st:4}),poly(['P','C','K'],'orange',{st:4}),
  dT('B','BC : AB = 2',30,-20),
  ...PTS('A','B','C','D','K','P')]}},
 steps:[
  {part:'а',t:'Треугольник ABK',do:R`Пусть $\angle BAD=2\alpha$, $\angle KAD=\alpha$. $\angle BKA=\angle KAD$ (накрест лежащие).`,res:R``,eq:R`\angle BAK=\angle BKA=\alpha\Rightarrow AB=BK`,sc:['Б10']},
  {t:'Треугольник KCP',do:R`$\angle KPC=\angle BAK=\alpha$ (накрест лежащие, $AB\parallel DP$), $\angle PKC=\angle AKB=\alpha$ (вертикальные).`,res:R``,eq:R`CK=CP`},
  {t:'Треугольник AKC',do:R`$AC$ — биссектриса угла $KAD$: $\angle KAC=\angle CAD=\angle ACK$ (накрест лежащие).`,res:R``,eq:R`KA=KC=CP`},
  {t:'Подобие',do:R`Равнобедренные треугольники $ABK$ и $PCK$ имеют углы при основаниях $\alpha$: $\frac{AB}{PC}=\frac{AK}{PK}$.`,res:R`Пункт а) доказан.`,eq:R`PC\cdot AK=AB\cdot PK,\ \ AK=PC,\ AB=CD\Rightarrow PC^2=CD\cdot PK`,sc:['Б16']},
  {part:'б',t:'Угол α',do:R`$BC=2AB$, $BK=AB$, значит $KC=AB=KA$: треугольник $ABK$ равносторонний.`,res:R``,eq:R`\alpha=60^\circ,\qquad\angle ABC=60^\circ`},
  {t:'Ответ',do:R`$\triangle KCP$ тоже равносторонний: $AP=AK+KP=2AB$. Теорема косинусов в $\triangle ABC$.`,res:R``,eq:R`AC^2=AB^2+4AB^2-2AB\cdot2AB\cdot\tfrac12=3AB^2,\qquad AC:AP=\frac{\sqrt3}2`}]},

  {t:'Обратная теорема Пифагора',do:R`Стороны треугольника $ACE$: $8$, $15$, $17$.`,res:R`Пункт а) доказан.`,eq:R`8^2+15^2=289=17^2\Rightarrow\angle ACE=90^\circ\Rightarrow AC\perp BD`},

{id:'qA127',topic:'quad',num:'A127',code:'2621',level:1,
 cond:R`Окружность с центром $O$ проходит через вершины $B$ и $C$ большей боковой стороны прямоугольной трапеции $ABCD$ и касается боковой стороны $AD$ в точке $K$. При этом точка $O$ находится внутри трапеции.<br><b>а)</b> Докажите, что угол $BOC$ вдвое больше угла $BKC$.<br><b>б)</b> Найдите расстояние от точки $K$ до прямой $BC$, если основания трапеции $AB$ и $CD$ равны $4$ и $9$ соответственно.`,
 ans:'6',facts:['Б13','О1','Ч4'],
 fig(){const d=8,k=(-2*d+Math.sqrt(4*d*d+5*(45+d*d)))/2.5,r=(16+k*k)/8;const A={x:0,y:0},B={x:4,y:0},D={x:0,y:d},C={x:9,y:d},O={x:r,y:k},K={x:0,y:k};const H=G.foot(K,B,C);return{P:{A,B,C,D,O,K,H},items:[
  ...quad('A','B','C','D'),rt('A','B','D'),rt('D','A','C'),{k:'c',o:'O',r,c:'purple',d:'6 5'},seg('K','B',{c:'blue'}),seg('K','C',{c:'blue'}),
  seg('O','B',{c:'gray',st:1}),seg('O','C',{c:'gray',st:1}),arc('O','B','C',{r:20,c:'orange',st:1}),arc('K','B','C',{r:24,c:'orange',st:1}),
  seg('K','H',{c:'red',st:2}),rt('H','K','C',{st:2}),arc('K','A','B',{r:22,c:'green',st:2}),arc('C','K','B',{r:26,c:'green',st:2}),
  arc('K','D','C',{r:22,c:'teal',st:3}),arc('B','K','C',{r:26,c:'teal',st:3}),
  dS('A','B','4'),dS('C','D','9'),
  ...PTS('A','B','C','D','O','K'),pt('H',{st:2})]}},
 steps:[
  {part:'а',t:'Центральный и вписанный',do:R`$O$ внутри трапеции, поэтому $K$ и $O$ по одну сторону от $BC$: $\angle BKC$ и $\angle BOC$ опираются на одну дугу.`,res:R`Пункт а) доказан.`,eq:R`\angle BOC=2\angle BKC`,sc:['Б13']},
  {part:'б',t:'Первое подобие',do:R`Пусть $KH\perp BC$. Угол между касательной $AK$ и хордой $KB$ равен вписанному: $\angle AKB=\angle KCB$. Прямоугольные $\triangle ABK\sim\triangle HKC$.`,res:R``,eq:R`\frac{KH}{KC}=\frac{AB}{KB}\Rightarrow KH=\frac{AB\cdot KC}{KB}`,sc:['О1']},
  {t:'Второе подобие',do:R`Аналогично $\angle DKC=\angle KBC$: $\triangle DCK\sim\triangle HKB$.`,res:R``,eq:R`KH=\frac{DC\cdot KB}{KC}`},
  {t:'Ответ',do:R`Перемножаем два равенства.`,res:R``,eq:R`KH^2=AB\cdot DC=36\Rightarrow KH=6`,sc:['Ч4']}]},

{id:'qA128',topic:'quad',num:'A128',code:'91008',level:1,
 cond:R`Дана трапеция $ABCD$ с боковой стороной $AB$, которая перпендикулярна основаниям. Из точки $A$ на сторону $CD$ опущен перпендикуляр $AH$. На стороне $AB$ взята точка $E$ так, что прямые $CE$ и $CD$ перпендикулярны.<br><b>а)</b> Докажите, что прямые $BH$ и $ED$ параллельны.<br><b>б)</b> Найдите отношение $BH$ к $ED$, если $\angle BCD=150^\circ$.`,
 ans:'1/4',facts:['Б15','Б13','Б18'],
 fig(){const s3=Math.sqrt(3),B={x:0,y:0},C={x:1,y:0},D={x:1+2*s3,y:2},A={x:0,y:2},E={x:0,y:s3};const H=G.foot(A,C,D);return{P:{A,B,C,D,E,H},items:[
  ...quad('A','B','C','D'),rt('B','C','A'),seg('A','H',{c:'gray'}),rt('H','A','D'),seg('C','E',{c:'gray'}),rt('C','E','D'),seg('B','H',{c:'blue'}),seg('E','D',{c:'blue'}),
  {k:'c3',pts:['A','B','C'],c:'purple',d:'6 5',st:1},arc('H','B','C',{r:20,c:'orange',st:1}),arc('A','B','C',{r:22,c:'orange',st:1}),
  {k:'c3',pts:['A','E','D'],c:'teal',d:'6 5',st:2},arc('D','E','C',{r:30,c:'orange',st:2}),
  dA('C','B','D','150°',{r:16}),
  ...PTS('A','B','C','D','E','H')]}},
 steps:[
  {part:'а',t:'Окружность с диаметром AC',do:R`$\angle ABC=\angle AHC=90^\circ$: $A,B,C,H$ на одной окружности.`,res:R``,eq:R`\angle BHC=\angle BAC`,sc:['Б15','Б13']},
  {t:'Окружность с диаметром ED',do:R`$\angle EAD=\angle ECD=90^\circ$: $A,E,C,D$ на одной окружности.`,res:R``,eq:R`\angle EDC=\angle EAC=\angle BAC`},
  {t:'Параллельность',do:R`$\angle BHC=\angle EDC$ — соответственные углы при прямых $BH$, $ED$ и секущей $CD$.`,res:R`Пункт а) доказан.`,eq:R`BH\parallel ED`},
  {part:'б',t:'Хорда BH',do:R`В окружности с диаметром $AC$ хорда $BH$ видна из $C$ под углом $\angle BCH=150^\circ$.`,res:R``,eq:R`BH=AC\sin150^\circ=\tfrac{AC}2`,sc:['Б18']},
  {t:'Хорда AC',do:R`В окружности с диаметром $ED$ хорда $AC$ видна из $D$ под углом $\angle ADC=180^\circ-150^\circ=30^\circ$.`,res:R``,eq:R`AC=ED\sin30^\circ\Rightarrow ED=2AC`},
  {t:'Ответ',do:R`Делим.`,res:R``,eq:R`\frac{BH}{ED}=\frac{AC/2}{2AC}=\frac14`}]},

{id:'qA129',topic:'quad',num:'A129',code:'11455',level:2,
 cond:R`Точки $P$, $Q$, $W$ делят стороны выпуклого четырёхугольника $ABCD$ в отношении $AP:PB=CQ:QB=CW:WD=1:4$, радиус окружности, описанной около треугольника $PQW$, равен $10$, $PQ=16$, $QW=12$, угол $PWQ$ — острый.<br><b>а)</b> Докажите, что треугольник $PQW$ — прямоугольный.<br><b>б)</b> Найдите площадь четырёхугольника $ABCD$.`,
 ans:'600',facts:['Б18','Б19'],
 fig(){const A={x:-8,y:0},C={x:12,y:0},B={x:0,y:-20},D={x:0,y:40};const P=G.lerp(A,B,0.2),Q=G.lerp(C,B,0.2),W=G.lerp(C,D,0.2);return{P:{A,B,C,D,P,Q,W},items:[
  ...quad('A','B','C','D'),poly(['P','Q','W'],'blue',{c:'blue'}),{k:'c3',pts:['P','Q','W'],c:'purple',d:'6 5'},
  rt('Q','P','W',{st:3}),
  seg('A','C',{c:'green',st:4}),seg('B','D',{c:'green',st:4}),
  dS('P','Q','16'),dS('Q','W','12'),
  ...PTS('A','B','C','D','P','Q','W')]}},
 steps:[
  {part:'а',t:'Угол W',do:R`Теорема синусов: $PQ=2R\sin W$.`,res:R``,eq:R`\sin W=\frac{16}{20}=\frac45,\qquad\cos W=\frac35`,sc:['Б18']},
  {t:'Угол P',do:R`$QW=2R\sin P$: $\sin P=\frac35$. Если бы угол $P$ был тупым, $\angle P+\angle W>180^\circ$.`,res:R``,eq:R`\cos P=\frac45`},
  {t:'Угол Q',do:R`$\cos(P+W)=\cos P\cos W-\sin P\sin W$.`,res:R`Пункт а) доказан.`,eq:R`\cos(P+W)=\tfrac45\cdot\tfrac35-\tfrac35\cdot\tfrac45=0\Rightarrow\angle Q=90^\circ`},
  {part:'б',t:'Диагонали',do:R`$\frac{BP}{BA}=\frac{BQ}{BC}=\frac45$: $PQ\parallel AC$; $\frac{CQ}{CB}=\frac{CW}{CD}=\frac15$: $QW\parallel BD$.`,res:R``,eq:R`AC=\frac54PQ=20,\qquad BD=5QW=60,\qquad AC\perp BD`,sc:['Б19']},
  {t:'Ответ',do:R`Площадь четырёхугольника с перпендикулярными диагоналями.`,res:R``,eq:R`S=\tfrac12\cdot20\cdot60=600`}]},

{id:'qA130',topic:'quad',num:'A130',code:'22648',level:2,
 cond:R`В трапеции $ABCD$ с основаниями $BC$ и $AD$ углы $ABD$ и $ACD$ прямые.<br><b>а)</b> Докажите, что $AB=CD$.<br><b>б)</b> Найдите $AD$, если $AB=2$, $BC=7$.`,
 ans:'8',facts:['Б15','О6','Ч2'],

  seg('B','H',{c:'red',st:3}),rt('H','A','B',{st:3}),
  dS('A','B','2'),dS('B','C','7'),
  ...PTS('A','B','C','D'),pt('H',{st:3})]}},
 steps:[
  {part:'а',t:'Окружность с диаметром AD',do:R`$\angle ABD=\angle ACD=90^\circ$.`,res:R`$B$ и $C$ лежат на окружности с диаметром $AD$.`,eq:R`ABCD\ \text{вписан}`,sc:['Б15']},
  {t:'Вывод',do:R`Вписанная трапеция равнобедренная.`,res:R`Пункт а) доказан.`,eq:R`AB=CD`,sc:['О6']},
  {part:'б',t:'Проекция',do:R`Пусть $AD=x$; высота $BH$: $AH=\frac{x-7}2$.`,res:R``,eq:R`AH=\frac{x-7}2`,sc:['Ч2']},
  {t:'Ответ',do:R`В прямоугольном треугольнике $ABD$: $AB^2=AH\cdot AD$.`,res:R``,eq:R`4=\frac{x(x-7)}2\Rightarrow x^2-7x-8=0\Rightarrow AD=8`}]},

{id:'qA131',topic:'quad',num:'A131',code:'765',level:2,
 cond:R`Диагонали параллелограмма $ABCD$ пересекаются в точке $E$. Биссектрисы углов $DAE$ и $EBC$ пересекаются в точке $F$, причём $ECFD$ — параллелограмм.<br><b>а)</b> Докажите, что треугольники $BCF$ и $ADF$ равны.<br><b>б)</b> Найдите величину угла $AFB$.`,
 ans:'60°',facts:['Б10'],
 fig(){const s3=Math.sqrt(3),A={x:0,y:0},B={x:s3,y:0},C={x:s3,y:1},D={x:0,y:1},E={x:s3/2,y:0.5},F={x:s3/2,y:1.5};return{P:{A,B,C,D,E,F},items:[
  ...quad('A','B','C','D'),seg('A','C',{c:'gray'}),seg('B','D',{c:'gray'}),seg('A','F',{c:'blue'}),seg('B','F',{c:'blue'}),seg('C','F',{c:'green'}),seg('D','F',{c:'green'}),
  arc('A','D','F',{r:18,st:1}),arc('A','F','E',{r:22,st:1}),arc('F','D','A',{r:18,st:1}),tick('D','A',1,{st:1}),tick('D','F',1,{st:1}),tick('C','B',2,{st:1,c:'blue'}),tick('C','F',2,{st:1,c:'blue'}),
  poly(['A','E','D'],'orange',{st:3}),

  poly(['A','F','B'],'purple',{st:5}),arc('F','A','B',{t:'60°',r:16,c:'red',st:5}),
  ...PTS('A','B','C','D','E','F')]}},
 steps:[
  {part:'а',t:'Равнобедренные треугольники',do:R`$DF\parallel EC$, то есть $DF\parallel AC$: $\angle DFA=\angle FAC=\angle FAD$. Аналогично $CF\parallel BD$.`,res:R``,eq:R`DF=DA,\qquad CF=CB`,sc:['Б10']},
  {t:'Равные отрезки',do:R`$ECFD$ — параллелограмм: $DF=CE$, $CF=DE$.`,res:R``,eq:R`AE=CE=AD,\qquad BE=DE=BC=AD`},
  {t:'Прямоугольник',do:R`$AE=BE$, значит $AC=BD$ — $ABCD$ прямоугольник, а $\triangle AED$ равносторонний ($AE=ED=AD$).`,res:R``,eq:R`\angle AED=60^\circ,\ \angle DEC=120^\circ`},
  {t:'Равенство треугольников',do:R`$\angle ADF=\angle ADE+\angle EDF=60^\circ+60^\circ$; $\angle BCF=\angle BCE+\angle ECF=60^\circ+60^\circ$; $AD=DF=BC=CF$.`,res:R`Пункт а) доказан (по двум сторонам и углу).`,eq:R`\triangle ADF=\triangle BCF`},
  {part:'б',t:'Ответ',do:R`$AF=\sqrt3\,AD$ ($\triangle ADF$ с углом $120^\circ$), $AB=\sqrt3\,AD$ ($\angle CAD=60^\circ$), $FA=FB$.`,res:R``,eq:R`\triangle AFB\ \text{равносторонний}\Rightarrow\angle AFB=60^\circ`}]},

{id:'qA132',topic:'quad',num:'A132',code:'91749',level:2,
 cond:R`На сторонах $BC$ и $CD$ квадрата $ABCD$ отмечены точки $K$ и $E$ соответственно. Известно, что $AK=3$, $KE=1$, $AE=\sqrt{10}$.<br><b>а)</b> Докажите, что $BK:CE=3:1$.<br><b>б)</b> Найдите площадь квадрата $ABCD$.`,
 ans:R`\frac{81}{13}`,facts:['Б16'],
 fig(){const s=9/Math.sqrt(13),A={x:0,y:s},B={x:0,y:0},C={x:s,y:0},D={x:s,y:s},K={x:2*s/3,y:0},E={x:s,y:2*s/9};return{P:{A,B,C,D,K,E},items:[
  ...quad('A','B','C','D'),seg('A','K',{c:'blue'}),seg('K','E',{c:'blue'}),seg('A','E',{c:'blue'}),
  rt('K','A','E',{st:1}),
  arc('A','B','K',{r:22,c:'green',st:2}),arc('K','C','E',{r:22,c:'green',st:2}),poly(['A','B','K'],'orange',{st:2}),poly(['K','C','E'],'orange',{st:2}),
  mtx('B','K','2s/3',{st:3,dy:16,c:'orange'}),mtx('K','C','s/3',{st:3,dy:16,c:'orange'}),
  dS('A','K','3',{off:12}),dS('K','E','1',{off:12}),dS('A','E','√10',{off:12}),
  ...PTS('A','B','C','D','K','E')]}},
 steps:[
  {part:'а',t:'Прямой угол AKE',do:R`$AK^2+KE^2=9+1=10=AE^2$.`,res:R``,eq:R`\angle AKE=90^\circ`},
  {t:'Подобие',do:R`$\angle BAK=90^\circ-\angle AKB=\angle CKE$: $\triangle ABK\sim\triangle KCE$, $k=\frac{AK}{KE}=3$.`,res:R`Пункт а) доказан.`,eq:R`BK=3CE,\qquad AB=3KC`,sc:['Б16']},
  {part:'б',t:'Отрезки стороны',do:R`Пусть сторона $s$: $KC=\frac s3$, $BK=\frac{2s}3$.`,res:R``,eq:R`AK^2=s^2+\frac{4s^2}9=\frac{13s^2}9`},
  {t:'Ответ',do:R`$\frac{13s^2}9=9$. Проверка: $DE=\frac{7s}9$, $AE^2=s^2+\frac{49s^2}{81}=10$ ✓.`,res:R`В ключе подборки указано $\frac{18}{13}$ — при данных $AK=3$, $KE=1$, $AE=\sqrt{10}$ получается $\frac{81}{13}$.`,eq:R`S=s^2=\frac{81}{13}`}]},

{id:'qA133',topic:'quad',num:'A133',code:'125957',level:3,
 cond:R`Дан параллелограмм $ABCD$ с острым углом $DAB$. В нем опущены высоты $BP$ и $BQ$ на стороны $AD$ и $CD$ соответственно. На стороне $AD$ отмечена точка $M$ так, что $AM=BP$. Известно, что $AB=BQ$.<br><b>а)</b> Докажите, что $BM=PQ$.<br><b>б)</b> Найдите площадь треугольника $APQ$, если $AM=BP=12$, $AB=BQ=15$.`,
 ans:'13,5',facts:[],
 fig(){const A={x:0,y:0},B={x:9,y:12},P={x:9,y:0},Q={x:21,y:3},M={x:12,y:0},D={x:18.75,y:0},C=G.add(B,D);return{P:{A,B,C,D,P,Q,M},items:[
  ...quad('A','B','C','D'),seg('B','P',{c:'gray'}),rt('P','B','D'),seg('B','Q',{c:'gray'}),rt('Q','B','C'),seg('B','M',{c:'blue'}),seg('P','Q',{c:'blue'}),
  arc('B','P','Q',{r:22,c:'green',st:1}),arc('A','B','D',{r:22,c:'green',st:1}),
  poly(['M','A','B'],'orange',{st:2}),poly(['P','B','Q'],'orange',{st:2}),tick('A','M',1,{st:2}),tick('B','P',1,{st:2}),tick('A','B',2,{st:2,c:'blue'}),tick('B','Q',2,{st:2,c:'blue'}),
  seg('Q',{x:21,y:0},{c:'red',d:'4 4',st:4}),poly(['A','P','Q'],'purple',{st:5}),
  ...PTS('A','B','C','D','P','Q','M')]}},
 steps:[
  {part:'а',t:'Угол PBQ',do:R`$BP\perp AD$, $BQ\perp CD\parallel AB$ — угол между высотами равен углу между сторонами.`,res:R``,eq:R`\angle PBQ=\angle BAD`},
  {t:'Равные треугольники',do:R`$\triangle MAB$ и $\triangle PBQ$: $AM=BP$, $AB=BQ$, углы между ними равны.`,res:R`Пункт а) доказан.`,eq:R`\triangle MAB=\triangle PBQ\Rightarrow BM=PQ`},
  {part:'б',t:'Отрезок AP',do:R`Прямоугольный $\triangle ABP$.`,res:R``,eq:R`AP=\sqrt{15^2-12^2}=9,\qquad\cos A=\tfrac35`},
  {t:'Расстояние от Q до AD',do:R`Проекция $BQ$ на направление $BP$ равна $BQ\cos\angle PBQ$.`,res:R``,eq:R`\rho(Q,AD)=BP-BQ\cos A=12-15\cdot\tfrac35=3`},
  {t:'Ответ',do:R`Площадь треугольника $APQ$ с основанием $AP$.`,res:R``,eq:R`S_{APQ}=\tfrac12\cdot9\cdot3=13{,}5`}]},

{id:'qA134',topic:'quad',num:'A134',code:'151380',level:3,

{id:'qA135',topic:'quad',num:'A135',code:'2372',level:3,

{id:'qA136',topic:'quad',num:'A136',code:'11454',level:4,

  {part:'б',t:'Ответ',do:R`$AB=\sqrt{5^2+12^2}=13$; $S_{ABCP}=2S_{ABC}=BC\cdot h=84$, $p=13+7=20$.`,res:R``,eq:R`r=\frac Sp=\frac{84}{20}=4{,}2`}]},

{id:'qA137',topic:'quad',num:'A137',code:'19111',level:4,
 cond:R`Дана трапеция $ABCD$ с основаниями $AD=5$ и $BC=2$. Её диагонали $AC$ и $BD$ пересекаются в точке $O$ и перпендикулярны боковым сторонам $CD$ и $AB$ соответственно.<br><b>а)</b> Докажите, что $\sin\angle BAC=\frac25$.<br><b>б)</b> Найдите радиус окружности, вписанной в треугольник $COD$.`,

 steps:[

  {part:'б',t:'Координаты',do:R`$A(-2{,}5;0)$, $D(2{,}5;0)$, $C(1;h)$: $1+h^2=6{,}25$. $\frac{CO}{OA}=\frac{BC}{AD}=\frac25$.`,res:R``,eq:R`h^2=\frac{21}4,\qquad O\Big(0;\tfrac57h\Big)`},
  {t:'Стороны треугольника COD',do:R`$\angle OCD=90^\circ$.`,res:R``,eq:R`OC=\sqrt{1+\tfrac{4h^2}{49}}=\frac{\sqrt{70}}7,\ \ CD=\sqrt{\tfrac{15}2}=\frac{\sqrt{30}}2,\ \ OD=\frac{5\sqrt{70}}{14}`},

{id:'qA138',topic:'quad',num:'A138',code:'24568',level:4,
 cond:R`Дан параллелограмм $ABCD$ с острым углом $A$. На продолжении стороны $AD$ за точку $D$ взята точка $N$ такая, что $CN=CD$, а на продолжении стороны $CD$ за точку $D$ взята такая точка $M$, что $AD=AM$.<br><b>а)</b> Докажите, что $BM=BN$.<br><b>б)</b> Найдите $MN$, если $AC=4$, $\sin\angle BAD=\frac8{17}$.`,
 ans:R`\frac{120}{17}`,facts:[],
 fig(){const ca=15/17,sa=8/17,b=2,u={x:ca,y:sa};const d=Math.sqrt(16-(b*sa)**2)-b*ca;const A={x:0,y:0},D={x:d,y:0},B=G.mul(u,b),C=G.add(B,D);const M=G.sub(D,G.mul(u,2*d*ca)),N={x:d+2*b*ca,y:0};return{P:{A,B,C,D,M,N},items:[
  ...quad('A','B','C','D'),seg('D','M',{c:'gray',d:'5 4'}),seg('D','N',{c:'gray',d:'5 4'}),seg('A','M',{c:'green'}),seg('C','N',{c:'green'}),tick('A','M',1),tick('A','D',1),tick('C','N',2,{c:'blue'}),tick('C','D',2,{c:'blue'}),
  arc('D','A','M',{t:'α',r:18,st:1}),arc('D','C','N',{t:'α',r:18,st:1}),
  arc('M','A','D',{t:'α',r:22,c:'blue',st:2}),arc('N','C','D',{t:'α',r:22,c:'blue',st:2}),
  seg('B','M',{c:'red',st:3}),seg('B','N',{c:'red',st:3}),poly(['B','A','M'],'orange',{st:3}),poly(['N','C','B'],'orange',{st:3}),

  dS('A','C','4',{off:12}),dT('A','sin A = 8/17',30,20),
  ...PTS('A','B','C','D','M','N')]}},
 steps:[
  {part:'а',t:'Углы при D',do:R`Пусть $\angle BAD=\alpha$; $\angle ADC=180^\circ-\alpha$, смежные с ним углы $ADM$ и $CDN$ равны $\alpha$.`,res:R``,eq:R`\angle ADM=\angle CDN=\alpha`},
  {t:'Равнобедренные треугольники',do:R`$AM=AD$: $\angle AMD=\alpha$, $\angle MAD=180^\circ-2\alpha$. $CN=CD$: $\angle CND=\alpha$, $\angle DCN=180^\circ-2\alpha$.`,res:R``,eq:R`\angle BAM=\alpha+180^\circ-2\alpha=180^\circ-\alpha=\angle BCN`},
  {t:'Равные треугольники',do:R`$\triangle BAM$ и $\triangle NCB$: $BA=CD=CN$, $AM=AD=CB$, углы между ними равны.`,res:R`Пункт а) доказан.`,eq:R`BM=BN`},
  {part:'б',t:'Треугольник MDN',do:R`$DM=2AD\cos\alpha$, $DN=2CD\cos\alpha$ (основания равнобедренных треугольников), $\angle MDN=\angle ADC=180^\circ-\alpha$.`,res:R``,eq:R`MN^2=4\cos^2\alpha\,(AD^2+CD^2+2AD\cdot CD\cos\alpha)=4\cos^2\alpha\cdot AC^2`},
  {t:'Ответ',do:R`$\cos\alpha=\frac{15}{17}$.`,res:R``,eq:R`MN=2AC\cos\alpha=2\cdot4\cdot\frac{15}{17}=\frac{120}{17}`}]},

{id:'qA139',topic:'quad',num:'A139',code:'63301',level:4,
 cond:R`Дана равнобедренная трапеция $ABCD$ с основаниями $AD$ и $BC$, где $AD>BC$. Биссектрисы углов $BAD$ и $BCD$ пересекаются в точке $O$. Через точку $O$ провели прямую, параллельную основаниям, которая пересекла боковые стороны $AB$ и $CD$ в точках $M$ и $N$ соответственно.<br><b>а)</b> Докажите, что $MN=AB$.<br><b>б)</b> Найдите $BC:AD$, если известно, что $AO=OC$ и $AM:MB=2:3$.`,
 ans:'7/17',facts:['Б10','Ч2'],
 fig(){const a=85/26,A={x:-a,y:0},D={x:a,y:0},B={x:-35/26,y:60/13},C={x:35/26,y:60/13};const M=G.lerp(A,B,0.4),N=G.lerp(D,C,0.4),O=G.add(M,{x:2,y:0});return{P:{A,B,C,D,M,N,O},items:[

  arc('A','M','O',{r:22,st:1}),arc('A','O','D',{r:28,st:1}),arc('O','M','A',{r:18,st:1}),tick('M','A',1,{st:1}),tick('M','O',1,{st:1}),
  arc('C','B','O',{r:22,c:'blue',st:2}),arc('C','O','D',{r:28,c:'blue',st:2}),tick('N','O',2,{st:2,c:'blue'}),tick('N','C',2,{st:2,c:'blue'}),

  dT('M','AM : MB = 2 : 3',-30,0),
  ...PTS('A','B','C','D','M','N','O')]}},
 steps:[
  {part:'а',t:'Треугольник AMO',do:R`$MO\parallel AD$: $\angle MOA=\angle OAD=\angle MAO$.`,res:R``,eq:R`MA=MO`,sc:['Б10']},
  {t:'Треугольник NOC',do:R`$ON\parallel BC$: $\angle NOC=\angle OCB=\angle NCO$.`,res:R``,eq:R`NO=NC`},
  {t:'Вывод',do:R`Прямая $MN\parallel AD$ в равнобедренной трапеции симметрична: $NC=MB$.`,res:R`Пункт а) доказан.`,eq:R`MN=MO+ON=MA+MB=AB`},
  {part:'б',t:'Отрезки',do:R`$AM=2k=MO$, $MB=3k=NC=ON$, $AB=5k$. Пусть $\angle BAD=\alpha$, тогда $\angle BCD=180^\circ-\alpha$.`,res:R``,eq:R`AO=2\cdot AM\cos\tfrac\alpha2=4k\cos\tfrac\alpha2,\qquad CO=2\cdot NC\cos\tfrac{180^\circ-\alpha}2=6k\sin\tfrac\alpha2`},
  {t:'Угол α',do:R`$AO=OC$.`,res:R``,eq:R`\operatorname{tg}\tfrac\alpha2=\tfrac23\Rightarrow\cos\alpha=\frac{1-\frac49}{1+\frac49}=\frac5{13}`},
  {t:'Ответ',do:R`$AD-BC=2\cdot5k\cos\alpha=\frac{50k}{13}$; отрезок $MN$ на высоте $\frac25$ от $AD$: $MN=AD-\frac25(AD-BC)=5k$.`,res:R``,eq:R`AD=\frac{85k}{13},\quad BC=\frac{35k}{13},\quad BC:AD=\frac7{17}`,sc:['Ч2']}]},

{id:'qA140',topic:'quad',num:'A140',code:'86921',level:5,
 cond:R`В выпуклом четырехугольнике $ABCD$ диагонали $AC$ и $BD$ равны стороне $AB$. Точки $P$ и $N$ — середины сторон $AD$ и $BC$ соответственно, угол $CDA$ прямой.<br><b>а)</b> Докажите, что $PN=AB\cdot\sin\angle C$.<br><b>б)</b> Найдите длину отрезка $PN$, если известно, что $BC=4$, $AD=5$.`,
 ans:R`\frac{5\sqrt{286}}{26}`,facts:['Б15','Б18'],

  dS('B','C','4'),dS('A','D','5'),
  ...PTS('A','B','C','D','P','N')]}},
 steps:[
  {part:'а',t:'Две высоты-медианы',do:R`$BA=BD$, $P$ — середина $AD$: $BP\perp AD$. $AB=AC$, $N$ — середина $BC$: $AN\perp BC$.`,res:R``,eq:R`\angle APB=\angle ANB=90^\circ`},
  {t:'Окружность с диаметром AB',do:R`$P$ и $N$ видят $AB$ под прямым углом.`,res:R``,eq:R`A,B,N,P\ \text{на окружности с диаметром }AB`,sc:['Б15']},
  {t:'Хорда PN',do:R`Хорда $PN$ видна из $B$ под углом $PBN$.`,res:R``,eq:R`PN=AB\sin\angle PBN`,sc:['Б18']},
  {t:'Угол C',do:R`$BP\perp AD$ и $CD\perp AD$ — $BP\parallel CD$, поэтому $\angle PBC=180^\circ-\angle BCD$.`,res:R`Пункт а) доказан.`,eq:R`PN=AB\sin\angle C`},
  {part:'б',t:'Прямоугольная трапеция BPDC',do:R`Пусть $CD=c$: $AB^2=AC^2=25+c^2$, $BP^2=AB^2-6{,}25$; $BC^2=PD^2+(BP-c)^2$.`,res:R``,eq:R`16=6{,}25+(BP-c)^2\Rightarrow BP-c=\tfrac{\sqrt{39}}2`},
  {t:'Находим c и sin C',do:R`$(c+\frac{\sqrt{39}}2)^2=18{,}75+c^2$.`,res:R``,eq:R`c=\frac9{\sqrt{39}},\quad AB^2=\frac{352}{13},\quad\cos\angle PBC=\frac{\sqrt{39}/2}4\Rightarrow\sin C=\frac58`},
  {t:'Ответ',do:R`$PN=AB\cdot\frac58$. (Ключ «11 5√26» — искажённая запись $\frac{5\sqrt{11\cdot26}}{26}$.)`,res:R``,eq:R`PN=\frac58\sqrt{\frac{352}{13}}=\frac52\sqrt{\frac{22}{13}}=\frac{5\sqrt{286}}{26}`}]},

{id:'qA141',topic:'quad',num:'A141',code:'175421',level:4,
 cond:R`В прямоугольном треугольнике $ABC$ точки $M$ и $N$ — середины гипотенузы $AC$ и катета $BC$ соответственно. Точка $K$ лежит на катете $BC$ так, что $BK:KC=1:3$.<br><b>а)</b> Докажите, что $AN=2KM$.<br><b>б)</b> Пусть $P$ — точка пересечения отрезков $AN$ и $KM$. Найдите длину отрезка прямой $BP$, заключенного внутри треугольника $KMN$, если $AB=6$, $BC=8$.`,
 ans:R`\frac{\sqrt5}2`,facts:[],
 fig(){const B={x:0,y:0},A={x:0,y:6},C={x:8,y:0},M={x:4,y:3},N={x:4,y:0},K={x:2,y:0},P={x:3,y:1.5},Q={x:4,y:2};return{P:{A,B,C,M,N,K,P,Q},items:[
  ...triItems(),rt('B','C','A'),seg('M','N',{c:'gray'}),seg('A','N',{c:'blue'}),seg('K','M',{c:'blue'}),
  rt('N','M','K',{st:1}),tick('B','K',1,{st:1}),tick('K','N',1,{st:1}),
  poly(['K','M','N'],'orange',{st:3}),pt('P',{st:3}),
  seg('B','Q',{c:'gray',d:'5 4',st:4}),pt('Q',{st:4}),seg('P','Q',{c:'red',w:3.5,st:5}),
  dS('A','B','6'),dS('B','C','8',{off:26}),
  ...PTS('A','B','C','M','N','K')]}},
 steps:[
  {part:'а',t:'Средняя линия MN',do:R`$MN\parallel AB$, $MN=\frac{AB}2$, $\angle MNK=90^\circ$. $BK=\frac14BC$, $BN=\frac12BC$ — $K$ середина $BN$.`,res:R``,eq:R`KN=\tfrac{BN}2,\qquad MN=\tfrac{AB}2`},
  {t:'Теорема Пифагора',do:R`$\triangle KMN$ и $\triangle ABN$ прямоугольные.`,res:R`Пункт а) доказан.`,eq:R`KM^2=\frac{BN^2+AB^2}4=\frac{AN^2}4\Rightarrow AN=2KM`},
  {part:'б',t:'Точка P',do:R`$B(0;0)$, $A(0;6)$, $C(8;0)$, $N(4;0)$, $K(2;0)$, $M(4;3)$. $AN$: $\frac x4+\frac y6=1$; $KM$: $(2+2t;3t)$.`,res:R``,eq:R`t=\tfrac12,\qquad P(3;\,1{,}5)`},
  {t:'Выход из треугольника',do:R`Прямая $BP$: $y=\frac x2$; она входит в $\triangle KMN$ в точке $P$ и выходит через сторону $MN$ ($x=4$).`,res:R``,eq:R`Q(4;\,2)`},
  {t:'Ответ',do:R`Длина отрезка $PQ$.`,res:R``,eq:R`PQ=\sqrt{1^2+0{,}5^2}=\frac{\sqrt5}2`}]},

{id:'qA142',topic:'quad',num:'A142',code:'1719',level:3,
 cond:R`Внутри острого угла $\angle XOY$ взяты точки $M$ и $N$ так, что $\angle XON=\angle YOM$. На отрезке $OX$ выбрана точка $Q$ так, что $\angle NQX=\angle MQO$, а на отрезке $OY$ выбрана точка $P$ так, что $\angle NPO=\angle MPY$.<br><b>а)</b> Докажите, что треугольники $MPN$ и $MQN$ имеют одинаковые периметры.<br><b>б)</b> Пусть $R_1$ и $R_2$ — радиусы окружностей, описанных около треугольников $POM$ и $NOQ$ соответственно. Найдите $\dfrac{R_1}{R_2}$, если $PN=MQ$.`,
 ans:'1',facts:['Ч6','Б18'],
 fig(){const O={x:0,y:0},X={x:9,y:0},Y=G.ray(O,70,9),M=G.ray(O,50,5),N=G.ray(O,20,6);const M1=G.refl(M,O,X),M2=G.refl(M,O,Y);const Q=G.inter(N,M1,O,X),P=G.inter(N,M2,O,Y);return{P:{O,X,Y,M,N,M1,M2,Q,P},items:[
  seg('O','X',{w:2.6}),seg('O','Y',{w:2.6}),arc('O','X','N',{r:60,c:'green'}),arc('O','M','Y',{r:60,c:'green'}),
  seg('M','Q',{c:'blue'}),seg('Q','N',{c:'blue'}),seg('M','P',{c:'red'}),seg('P','N',{c:'red'}),seg('M','N',{c:'gray'}),
  seg('M','M1',{c:'gray',d:'3 4',st:1}),seg('Q','M1',{c:'blue',d:'6 4',st:1}),pt('M1',{n:'M₁',st:1}),
  seg('M','M2',{c:'gray',d:'3 4',st:2}),seg('P','M2',{c:'red',d:'6 4',st:2}),pt('M2',{n:'M₂',st:2}),
  seg('O','M1',{c:'purple',st:3}),seg('O','M2',{c:'purple',st:3}),seg('O','N',{c:'purple',st:3}),seg('O','M',{c:'gray',d:'4 4',st:3}),
  {k:'c3',pts:['P','O','M'],c:'teal',d:'5 5',st:4},{k:'c3',pts:['N','O','Q'],c:'orange',d:'5 5',st:4},
  ...PTS('O','M','N','Q','P'),pt('X',{n:'X',size:3}),pt('Y',{n:'Y',size:3})]}},
 steps:[
  {part:'а',t:'Отражение в OX',do:R`$M_1$ — точка, симметричная $M$ относительно $OX$: $\angle M_1QO=\angle MQO=\angle NQX$ — значит $N,Q,M_1$ на одной прямой.`,res:R``,eq:R`MQ+QN=M_1Q+QN=M_1N`,sc:['Ч6']},
  {t:'Отражение в OY',do:R`$M_2$ — симметрична $M$ относительно $OY$: $\angle M_2PY=\angle MPY=\angle NPO$ — $N,P,M_2$ на одной прямой.`,res:R``,eq:R`MP+PN=M_2N`},
  {t:'Равные треугольники',do:R`$OM_1=OM_2=OM$; $\angle M_1ON=\angle MOX+\angle XON=\angle MOX+\angle YOM=\angle XOY$, так же $\angle M_2ON=\angle MOY+\angle YON=\angle XOY$.`,res:R`$\triangle M_1ON=\triangle M_2ON$, $M_1N=M_2N$ — периметры равны. Пункт а) доказан.`,eq:R`P_{MQN}=MN+M_1N=MN+M_2N=P_{MPN}`},
  {part:'б',t:'Радиусы',do:R`$\angle POM=\angle YOM=\angle XON=\angle NOQ=\varphi$. Теорема синусов.`,res:R``,eq:R`R_1=\frac{PM}{2\sin\varphi},\qquad R_2=\frac{NQ}{2\sin\varphi}`,sc:['Б18']},
  {t:'Ответ',do:R`$MP+PN=MQ+QN$ и $PN=MQ$, значит $MP=NQ$.`,res:R``,eq:R`\frac{R_1}{R_2}=1`}]}
];

{id:'Ч3',group:'Трапеция',title:'Описанная трапеция',short:'Биссектрисы углов при боковой стороне перпендикулярны: ∠AOB = 90°; радиус — высота прямоугольного треугольника AOB: r² = AK·KB.',detail:'Перетаскивайте точки касания на боковых сторонах. Основания касаются окружности сверху и снизу, высота трапеции 2r. Также AB + CD = AD + BC.',
 fix(S){const o={x:400,y:260,r:110};['T1','T2'].forEach(n=>{S[n]=onCirc(S[n],o)});if(S.T1.x>o.x-10)S.T1=onCirc({x:o.x-60,y:S.T1.y},o);if(S.T2.x<o.x+10)S.T2=onCirc({x:o.x+60,y:S.T2.y},o)},
 build(S){const o={x:400,y:260,r:110},top=150,bot=370;const tl=p=>[p,G.add(p,{x:-(p.y-o.y),y:p.x-o.x})];const[a1,a2]=tl(S.T1),[b1,b2]=tl(S.T2);const B=G.inter(a1,a2,{x:0,y:top},{x:1,y:top}),A=G.inter(a1,a2,{x:0,y:bot},{x:1,y:bot}),C=G.inter(b1,b2,{x:0,y:top},{x:1,y:top}),D=G.inter(b1,b2,{x:0,y:bot},{x:1,y:bot});const P={...S,A,B,C,D,O:o,K:S.T1};const ok=[A,B,C,D].every(p=>p&&Math.abs(p.x)<3000);if(!ok)return{P,items:[{k:'c',o:'O',r:110,c:'purple'}],stats:['Касательная почти горизонтальна'],result:''};
  return{P,items:[seg('A','B',{w:2.6}),seg('B','C',{w:2.6}),seg('C','D',{w:2.6}),seg('D','A',{w:2.6}),{k:'c',o:'O',r:110,c:'purple',d:'6 5'},seg('O','A',{c:'blue'}),seg('O','B',{c:'blue'}),rt('O','A','B'),seg('O','K',{c:'red'}),pt('A'),pt('B'),pt('C'),pt('D'),pt('O'),pt('T1',{n:'K',size:6,c:'red'}),pt('T2',{n:'',size:6,c:'red'})],
  stats:[`∠AOB = ${fmt(G.ang(A,o,B),1)}°`,`r² = ${SQ(110*110)}`,`AK·KB = ${SQ(G.d(A,S.T1)*G.d(S.T1,B))}`,`AB + CD = ${L1(G.d(A,B)+G.d(C,D))}`,`AD + BC = ${L1(G.d(A,D)+G.d(B,C))}`],result:'∠AOB = 90°,\nr² = AK·KB'}},
 init:{T1:G.ray({x:400,y:260},200,110),T2:G.ray({x:400,y:260},-20,110)},drag:['T1','T2']},
{id:'Ч4',group:'Окружность и четырёхугольник',title:'Расстояние от точки окружности до хорды',short:'Для точки K окружности: расстояние до хорды BC — среднее геометрическое расстояний до касательных в B и C: d² = d_B·d_C.',detail:'Из подобия прямоугольных треугольников (угол между касательной и хордой равен вписанному). В задаче про прямоугольную трапецию роль касательных играют основания, а K — точка касания боковой стороны.',

 build(S){const o={x:400,y:250,r:160};const tg=p=>({a:p,b:G.add(p,{x:-(p.y-o.y),y:p.x-o.x})});const tB=tg(S.B),tC=tg(S.C);const H=G.foot(S.K,S.B,S.C),HB=G.foot(S.K,tB.a,tB.b),HC=G.foot(S.K,tC.a,tC.b);
  return{P:{...S,O:o,H,HB,HC,B2:G.lerp(tB.a,tB.b,1.6),B3:G.lerp(tB.a,tB.b,-1.6),C2:G.lerp(tC.a,tC.b,1.6),C3:G.lerp(tC.a,tC.b,-1.6)},items:[{k:'c',o:'O',r:160,c:'gray'},seg('B2','B3',{c:'blue'}),seg('C2','C3',{c:'blue'}),seg('B','C',{w:2.6}),seg('K','H',{c:'red',w:2.6}),seg('K','HB',{c:'green'}),seg('K','HC',{c:'green'}),rt('H','K','C'),rt('HB','K','B'),rt('HC','K','C'),pt('B',{size:6}),pt('C',{size:6}),pt('K',{size:6,c:'red'})],

 init:{B:G.ray({x:400,y:250},140,160),C:G.ray({x:400,y:250},40,160),K:G.ray({x:400,y:250},250,160)},drag:['B','C','K']},
{id:'Ч5',group:'Параллелограмм и ромб',title:'Ромб: диагонали и углы',short:'Диагонали ромба перпендикулярны и делят углы пополам; S = d₁d₂/2; cos∠A = (p² − q²)/(p² + q²), где p, q — половины диагоналей.',detail:'Перетаскивайте вершины A и B (C и D симметричны относительно центра O). Высота ромба равна диаметру вписанной окружности: h = 2r.',
 build(S){const O={x:400,y:260},C=G.sub(G.mul(O,2),S.A),D=G.sub(G.mul(O,2),S.B);const v=nrm(G.sub(S.A,O));const Bf=G.add(O,G.mul({x:-v.y,y:v.x},G.d(S.B,O)*Math.sign(-v.y*(S.B.x-O.x)+v.x*(S.B.y-O.y)||1)));const P={A:S.A,B:Bf,C,D:G.sub(G.mul(O,2),Bf),O};const p=G.d(S.A,O),q=G.d(Bf,O);const r=p*q/Math.hypot(p,q);
  return{P,items:[seg('A','B',{w:2.6}),seg('B','C',{w:2.6}),seg('C','D',{w:2.6}),seg('D','A',{w:2.6}),seg('A','C',{c:'blue'}),seg('B','D',{c:'blue'}),rt('O','A','B'),{k:'c',o:'O',r,c:'purple',d:'6 5'},arc('A','B','O',{r:28}),arc('A','O','D',{r:34}),pt('O'),pt('C'),pt('D'),pt('A',{size:6}),pt('B',{size:6})],
  stats:[`S = ${SQ(2*p*q)}`,`cos∠A = ${fmt(Math.cos(2*Math.atan(q/p)),3)}`,`(p² − q²)/(p² + q²) = ${fmt((p*p-q*q)/(p*p+q*q),3)}`],result:'AC ⟂ BD, S = d₁d₂/2'}},
 fix(S){const O={x:400,y:260},v=nrm(G.sub(S.A,O)),n={x:-v.y,y:v.x},t=(S.B.x-O.x)*n.x+(S.B.y-O.y)*n.y;S.B=G.add(O,G.mul(n,Math.abs(t)<20?20:t))},init:{A:{x:180,y:260},B:{x:400,y:130}},drag:['A','B']},
{id:'Ч6',group:'Параллелограмм и ромб',title:'Отражение: равные углы и кратчайший путь',short:'Если ∠MQO = ∠NQX (угол падения равен углу отражения), то точки N, Q и M₁ (отражение M относительно OX) лежат на одной прямой, и MQ + QN = M₁N — наименьшая возможная сумма.',detail:'Перетаскивайте точки M и N. Точка Q строится как пересечение NM₁ с OX. Для любой другой точки Q′ на OX: MQ′ + Q′N = M₁Q′ + Q′N ≥ M₁N.',
 build(S){const O={x:180,y:300},X={x:720,y:300};const M1=G.refl(S.M,O,X),Q=G.inter(S.N,M1,O,X);const P={O,X,M:S.M,N:S.N,M1,Q};const items=[seg('O','X',{w:2.6}),seg('M','M1',{c:'gray',d:'3 4'})];
  if(Q){items.push(seg('M','Q',{c:'blue'}),seg('Q','N',{c:'blue'}),seg('Q','M1',{c:'blue',d:'6 4'}),arc('Q','O','M',{r:26,c:'orange'}),arc('Q','N','X',{r:26,c:'orange'}),pt('Q'))}
  items.push(pt('O'),pt('M1',{n:'M₁'}),pt('M',{size:6}),pt('N',{size:6}));return{P,items,stats:Q?[`∠MQO = ${fmt(G.ang(S.M,Q,O),1)}°`,`∠NQX = ${fmt(G.ang(S.N,Q,X),1)}°`,`MQ + QN = ${L1(G.d(S.M,Q)+G.d(Q,S.N))}`,`M₁N = ${L1(G.d(M1,S.N))}`]:['—'],result:'MQ + QN = M₁N'}},init:{M:{x:300,y:190},N:{x:560,y:110}},drag:['M','N']}
];

// ===== ВИЗУАЛИЗАТОР: «Касающиеся окружности, вневписанная» (сцены К1–К4) =====
const perp=v=>({x:-v.y,y:v.x});
const SCENES_TWO=[
{id:'К1',group:'Касающиеся окружности',title:'Внешнее касание: общая касательная',short:'Если окружности касаются внешне в точке K, а AB — общая внешняя касательная, то ∠AKB = 90°, AB = 2√(Rr), а общая касательная в K делит AB пополам.',detail:'Двигайте центр O₁, точку R (задаёт радиус первой окружности) и центр O₂ — вторая окружность всегда касается первой. Общая касательная в точке K пересекает AB в X: XA = XK = XB (отрезки касательных), поэтому K лежит на окружности с диаметром AB и ∠AKB = 90°. Опустив перпендикуляр из O₂ на O₁A, получаем AB² = (R + r)² − (R − r)² = 4Rr.',
 fix(S){const r1=G.d(S.O1,S.R);if(G.d(S.O1,S.O2)<r1+15)S.O2=G.add(S.O1,G.mul(nrm(G.sub(S.O2,S.O1)),r1+15))},
 build(S){const r1=G.d(S.O1,S.R),d=G.d(S.O1,S.O2),r2=d-r1,u=nrm(G.sub(S.O2,S.O1)),c=(r2-r1)/d,s=Math.sqrt(Math.max(0,1-c*c));const n=G.add(G.mul(u,c),G.mul(perp(u),s));
  const A=G.sub(S.O1,G.mul(n,r1)),B=G.sub(S.O2,G.mul(n,r2)),K=G.add(S.O1,G.mul(u,r1)),X=G.mid(A,B);const P={...S,A,B,K,X};

{id:'К2',group:'Касающиеся окружности',title:'Внутреннее касание: гомотетия',short:'Окружности касаются внутренне в K. Гомотетия с центром K и коэффициентом r/R переводит большую окружность в меньшую. Если хорда MN большой касается малой в C, то KC — биссектриса угла MKN.',detail:'Двигайте точку касания K, центр малой окружности Q (он лежит на радиусе OK) и точку касания C. Прямые KM и KN пересекают малую окружность в A и B: KA/KM = KB/KN = r/R, поэтому AB ∥ MN. Касательная MN при гомотетии переходит в параллельную касательную к большой окружности в точке W — середине дуги MN, поэтому K, C, W на одной прямой и KC — биссектриса ∠MKN.',
 fix(S){const o={x:400,y:260,r:210};S.K=onCirc(S.K,o);const v=G.sub(S.K,o),t=Math.min(0.9,Math.max(0.1,((S.Q.x-o.x)*v.x+(S.Q.y-o.y)*v.y)/(v.x*v.x+v.y*v.y)));S.Q=G.add(o,G.mul(v,t));S.C=onCirc(S.C,{x:S.Q.x,y:S.Q.y,r:G.d(S.Q,S.K)});if(G.d(S.C,S.K)<30)S.C=G.add(S.Q,G.mul(nrm(G.sub(S.Q,S.K)),G.d(S.Q,S.K)))},
 build(S){const O={x:400,y:260,r:210},r=G.d(S.Q,S.K),k=r/210;const tv=perp(G.sub(S.C,S.Q));
  const sec=(P,Q)=>{const d=G.sub(Q,P),f=G.sub(P,O),a=d.x*d.x+d.y*d.y,b=2*(f.x*d.x+f.y*d.y),c=f.x*f.x+f.y*f.y-O.r*O.r,D=b*b-4*a*c;if(D<0)return null;const s=Math.sqrt(D);return[G.add(P,G.mul(d,(-b-s)/(2*a))),G.add(P,G.mul(d,(-b+s)/(2*a)))]};
  const mn=sec(S.C,G.add(S.C,tv));const P={...S,O};let items=[{k:'c',o:'O',r:210,c:'purple'},{k:'c',o:'Q',r,c:'teal'},seg('O','K',{c:'gray',d:'3 4'})],stats=[`R = ${L1(210)}`,`r = ${L1(r)}`,`k = r/R = ${fmt(k,3)}`];
  if(mn){const[M1,N1]=mn;P.M=M1;P.N=N1;P.A=G.lerp(S.K,M1,k);P.B=G.lerp(S.K,N1,k);const W=sec(S.K,S.C);P.W=G.d(W[0],S.K)<1e-6?W[1]:W[0];
   items.push(seg('M','N',{w:2.4}),seg('K','M',{c:'blue'}),seg('K','N',{c:'blue'}),seg('K','W',{c:'red'}),seg('A','B',{c:'green',w:2.2}),arc('K','M','C',{r:30}),arc('K','C','N',{r:36,c:'orange'}),pt('M'),pt('N'),pt('A'),pt('B'),pt('W'),pt('C',{size:6,c:'red'}));
   stats.push(`∠MKC = ${fmt(G.ang(P.M,S.K,S.C),1)}°`,`∠CKN = ${fmt(G.ang(S.C,S.K,P.N),1)}°`,`KA/KM = ${fmt(G.d(S.K,P.A)/G.d(S.K,P.M),3)}`,`MW = ${L1(G.d(P.M,P.W))}, NW = ${L1(G.d(P.N,P.W))}`)}
  items.push(pt('K',{size:6}),pt('Q',{n:'O₂',size:6}),pt('O',{size:4}));return{P,items,stats,result:'KC — биссектриса ∠MKN,\nAB ∥ MN'}},
 init:{K:{x:400,y:50},Q:{x:400,y:150},C:{x:470,y:200}},drag:['K','Q','C']},

{id:'К3',group:'Вневписанная окружность',title:'Вневписанная окружность: MN = |b − c|',short:'Вписанная окружность касается BC в M, вневписанная (против A) — в N. Тогда BM = CN = p − b, BN = CM = p − c, MN = |AC − AB|; отрезок касательной из A к вневписанной равен p.',detail:'Двигайте вершины. Для вневписанной окружности отрезки касательных из A до точек касания с продолжениями сторон равны полупериметру p. Отсюда BN = p − c, CN = p − b — точки M и N симметричны относительно середины BC. Расстояние между центрами: II_a² = MN² + (r + r_a)².',
 build(S){const I=G.incenter(S.A,S.B,S.C),J=G.excenter(S.A,S.B,S.C),r=G.inr(S.A,S.B,S.C),M=G.foot(I,S.B,S.C),N=G.foot(J,S.B,S.C),ra=G.d(J,N),l=lens(S),p=(l.a+l.b+l.c)/2;const Tb=G.foot(J,S.A,S.C),Tc=G.foot(J,S.A,S.B);const P={...S,I,J,M,N,Tb,Tc};

   pt('I'),pt('J',{n:'Iₐ'}),pt('M'),pt('N'),pt('Tb',{n:'',size:3}),pt('Tc',{n:'',size:3}),...V3()],
   stats:[`BM = ${L1(G.d(S.B,M))}, CN = ${L1(G.d(S.C,N))}`,`p − b = ${L1(p-l.b)}`,`MN = ${L1(G.d(M,N))}`,`|b − c| = ${L1(Math.abs(l.b-l.c))}`,`ATc = ${L1(G.d(S.A,Tc))}, p = ${L1(p)}`,`r + rₐ = ${L1(r+ra)}`,`II_a = ${L1(G.d(I,J))}`],result:'MN = |AC − AB|'}},
 init:{A:{x:330,y:40},B:{x:250,y:170},C:{x:500,y:170}},drag:['A','B','C']},

{id:'К4',group:'Касающиеся окружности',title:'Две окружности в угле',short:'Две касающиеся окружности вписаны в угол C. Тогда sin(C/2) = (R − r)/(R + r), а точка касания T видит отрезок MK между точками касания на стороне под углом 90°.',detail:'Двигайте вершину C, точки U и V на сторонах угла и центр I малой окружности (он остаётся на биссектрисе). Центры лежат на биссектрисе: CI = r/sin(C/2), CJ = R/sin(C/2), IJ = R + r — отсюда формула. Общая касательная в T пересекает MK в X: XM = XT = XK, поэтому ∠MTK = 90°; MK = 2√(Rr).',
 fix(S){const a=nrm(G.sub(S.U,S.C)),b=nrm(G.sub(S.V,S.C)),w=nrm(G.add(a,b));let t=(S.I.x-S.C.x)*w.x+(S.I.y-S.C.y)*w.y;t=Math.max(40,Math.min(260,t));S.I=G.add(S.C,G.mul(w,t))},
 build(S){const a=nrm(G.sub(S.U,S.C)),b=nrm(G.sub(S.V,S.C)),w=nrm(G.add(a,b)),al=G.rad(G.ang(S.U,S.C,S.V))/2,s=Math.sin(al);const ci=G.d(S.C,S.I),r=ci*s,R=r*(1+s)/(1-s),J=G.add(S.C,G.mul(w,R/s));
  const M=G.foot(S.I,S.C,S.U),K=G.foot(J,S.C,S.U),T=G.lerp(S.I,J,r/(r+R)),X=G.mid(M,K);const P={...S,J,M,K,T,X};
  return{P,items:[seg('C',G.add(S.C,G.mul(a,900)),{w:2.4}),seg('C',G.add(S.C,G.mul(b,900)),{w:2.4}),seg('C','J',{c:'gray',d:'4 4'}),{k:'c',o:'I',r,c:'purple'},{k:'c',o:'J',r:R,c:'teal'},seg('I','M',{c:'gray'}),seg('J','K',{c:'gray'}),seg('M','T',{c:'blue'}),seg('T','K',{c:'blue'}),seg('X','T',{c:'red'}),rt('T','M','K'),tick('X','M',1),tick('X','K',1),tick('X','T',1),
   pt('M'),pt('K'),pt('T'),pt('X',{size:4}),pt('J',{n:'O₂'}),pt('I',{n:'O₁',size:6}),pt('C',{size:6}),pt('U',{n:'',size:5,c:'red'}),pt('V',{n:'',size:5,c:'red'})],
   stats:[`∠C = ${fmt(2*G.deg(al),1)}°`,`sin(C/2) = ${fmt(s,3)}`,`(R − r)/(R + r) = ${fmt((R-r)/(R+r),3)}`,`MK = ${L1(G.d(M,K))}, 2√(Rr) = ${L1(2*Math.sqrt(R*r))}`,`∠MTK = ${fmt(G.ang(M,T,K),1)}°`],result:'sin(C/2) = (R − r)/(R + r)'}},

{id:'tA116',topic:'two',num:'A116',code:'11682',level:2,

{id:'tA118',topic:'two',num:'A118',code:'2371',level:3,

 steps:[
  {part:'а',t:'AO₁ — диаметр ω₂',do:R`$\omega_2$ касается $\omega_1$ в $A$ и проходит через $O_1$ — значит, $AO_1$ её диаметр.`,res:R`$\angle APO_1=90^\circ$: $O_1P$ — перпендикуляр из центра $\omega_1$ к хорде $AD$, он делит хорду пополам. Пункт а) доказан.`,eq:R`AP=PD`,sc:['Б15']},
  {part:'б',t:'Радиусы',do:R`Пусть радиус $\omega_1$ равен $R$, тогда $\omega_2$ — $\frac R2$, $BO_2=\frac32R$. $BC$ касается $\omega_2$: $\sin\angle ABC=\frac{R/2}{3R/2}=\frac13$.`,res:R``,eq:R`\sin\angle ABC=\tfrac13`,sc:['О2']},

{id:'tA119',topic:'two',num:'A119',code:'2562',level:3,

 steps:[
  {part:'а',t:'Общая касательная в точке T',do:R`Общая касательная к окружностям в точке $T$ пересекает $MK$ в точке $X$. Отрезки касательных: $XM=XT$ и $XT=XK$.`,res:R`$T$ лежит на окружности с диаметром $MK$, $\angle MTK=90^\circ$. Пункт а) доказан.`,eq:R`XM=XT=XK\Rightarrow\angle KTM=90^\circ`,sc:['К1']},

  {t:'Полупериметр и сторона c',do:R`$S=rp$: $p=\frac{3\sqrt{15}}{\sqrt{15}/3}=9$. Отрезок касательной из $C$: $p-c=\frac r{\operatorname{tg}(C/2)}$.`,res:R``,eq:R`p-c=\frac{\sqrt{15}}3\cdot\sqrt{15}=5\Rightarrow c=AB=4`,sc:['В2']},

{id:'h51',topic:'alt',num:'51',code:'1117',level:3,
 cond:R`Прямая, проходящая через середину $M$ гипотенузы $AB$ прямоугольного треугольника $ABC$, перпендикулярна $CM$ и пересекает катет $AC$ в точке $K$. При этом $AK:KC=1:2$.<br><b>а)</b> Докажите, что $\angle BAC=30^\circ$.<br><b>б)</b> Пусть прямые $MK$ и $BC$ пересекаются в точке $P$, а прямые $AP$ и $BK$ — в точке $Q$. Найдите $KQ$, если $BC=2\sqrt3$.`,
 ans:R`4\sqrt7`,facts:['Б15','Н1'],

  {t:'Треугольник CMK',do:R`$\angle CMK=90^\circ$: $CM=CK\cos A$. Пусть $AK=x$, $KC=2x$, $AC=3x$.`,res:R`Пункт а) доказан.`,eq:R`\tfrac{3x}2=2x\cos^2A\Rightarrow\cos^2A=\tfrac34\Rightarrow A=30^\circ`},

{id:'h53',topic:'alt',num:'53',code:'173960',level:3,

 steps:[

  {t:'Подобие',do:R`$\angle AME+\angle CMK=120^\circ$ и $\angle AME+\angle AEM=120^\circ$.`,res:R`$\angle AEM=\angle CMK$, $\angle A=\angle C=60^\circ$. Пункт а) доказан.`,eq:R`\triangle AEM\sim\triangle CMK`,sc:['Б16']},
  {part:'б',t:'Периметры',do:R`Пусть сторона равна $s$. $P_{AEM}=AE+EB+AM=s+AM$, $P_{CMK}=s+CM$. Отношение площадей $\frac49$ — коэффициент $\frac23$.`,res:R``,eq:R`3(s+AM)=2(s+CM)`,sc:['М6']},
  {t:'Ответ',do:R`$CM=s-AM$.`,res:R``,eq:R`3s+3AM=4s-2AM\Rightarrow AM=\tfrac s5,\qquad AM:MC=1:4`}]},

{id:'h54',topic:'alt',num:'54',code:'18539',level:3,

$('printGo').onclick=()=>{const all=$('pAll').checked,list=all?topicTasks():ALL_TASKS.filter(t=>t.id===curId);let h='';
 for(const t of list){h+=`<section class="ptask"><h2>№ ${esc(t.num)} · ${esc(t.code)} · уровень ${t.level}</h2>`;if($('pCondition').checked)h+=`<div>${t.cond}</div>`;if($('pDiagram').checked)h+=`<div class="pdiag">${diagramSVG(t,t.steps.length,'done')}</div>`;
  if($('pSteps').checked)h+=t.steps.map((s,i)=>`<div class="pstep"><b>${i+1}. ${s.part?s.part+') ':''}${esc(s.t)}.</b> ${s.do} ${s.res||''}${s.eq?` \\(\\displaystyle ${s.eq}\\)`:''}</div>`).join('');h+=`<div class="pstep"><b>Ответ:</b> \\(${t.ans}\\)</div></section>`}
 $('printArea').innerHTML=h;$('printModal').close();const done=()=>setTimeout(()=>window.print(),150);if(window.MathJax?.typesetPromise)MathJax.typesetPromise([$('printArea')]).then(done,done);else done()};

 const blob=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='planimetria_17_saved.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};

// ===== ВИЗУАЛИЗАТОР =====
let vz={topic:'bis',idx:0,S:null,zoom:1,pan:{x:0,y:0},drag:null,panDrag:null};
function vizScenes(){return VIZ[vz.topic].scenes}
function vizInit(){const sc=vizScenes()[vz.idx];vz.S={...JSON.parse(JSON.stringify(TRI0)),...JSON.parse(JSON.stringify(sc.init||{}))};if(sc.fix)sc.fix(vz.S)}
function openViz(id){const f=id?sceneById(id):null;if(f&&f.scene.ext!=null){openOrtho(f.scene.ext);return}if(!f&&topic==='alt'&&!VIZ.alt){openOrtho(0);return}vz.topic=f?f.topic:(VIZ[topic]?topic:'bis');vz.idx=f?vizScenes().indexOf(f.scene):0;vz.zoom=1;vz.pan={x:0,y:0};$('vizZoom').value=1;vizInit();$('vizTitle').textContent=VIZ[vz.topic].title;vizMenu();vizDraw();if(!$('vizModal').open)$('vizModal').showModal()}
function vizMenu(){const sc=vizScenes();let h='';[...new Set(sc.map(s=>s.group))].forEach(g=>{h+=`<h3>${esc(g)}</h3>`;sc.forEach((s,i)=>{if(s.group===g)h+=`<button class="factbtn${i===vz.idx?' active':''}" data-vi="${i}"><b>${s.id}.</b> ${esc(s.title)}</button>`})});$('vizMenu').innerHTML=h}
function vizDraw(){const sc=vizScenes()[vz.idx];const b=sc.build(vz.S);const drag=sc.drag||['A','B','C'];
 const r=render(b.items,b.P,{fit:false,W:800,H:520,zoom:vz.zoom,pan:vz.pan});
 let handles='';for(const n of drag){const p=r.map(vz.S[n]);handles+=`<circle class="vertex" data-v="${n}" cx="${p.x}" cy="${p.y}" r="11"/>`}
 $('vizScene').innerHTML=r.svg+handles;$('vizFactTitle').textContent=`${sc.id}. ${sc.title}`;$('vizShort').textContent=sc.short;$('vizResult').textContent=b.result||'';
 $('vizStats').innerHTML=b.stats.map(s=>`<span class="stat">${esc(s)}</span>`).join('');vz.map=r.map}
function vizPoint(e){const svg=$('vizScene'),p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());return{x:(q.x-400-vz.pan.x)/vz.zoom+400,y:(q.y-260-vz.pan.y)/vz.zoom+260,raw:q}}
$('vizMenu').addEventListener('click',e=>{const b=e.target.closest('[data-vi]');if(!b)return;vz.idx=Number(b.dataset.vi);vizInit();vizMenu();vizDraw();$('vizLayout').classList.remove('menuopen')});
$('vizScene').addEventListener('pointerdown',e=>{const q=vizPoint(e);if(e.ctrlKey){vz.panDrag={x:q.raw.x-vz.pan.x,y:q.raw.y-vz.pan.y};return}const sc=vizScenes()[vz.idx];let best=null,bd=22/vz.zoom;for(const n of sc.drag||['A','B','C']){const d=G.d(q,vz.S[n]);if(d<bd){bd=d;best=n}}if(best){vz.drag=best;$('vizScene').setPointerCapture(e.pointerId)}});
$('vizScene').addEventListener('pointermove',e=>{const q=vizPoint(e);if(vz.panDrag){vz.pan={x:q.raw.x-vz.panDrag.x,y:q.raw.y-vz.panDrag.y};vizDraw();return}if(!vz.drag)return;vz.S[vz.drag]={x:q.x,y:q.y};const sc=vizScenes()[vz.idx];if(sc.fix)sc.fix(vz.S);vizDraw()});
['pointerup','pointercancel'].forEach(ev=>$('vizScene').addEventListener(ev,()=>{vz.drag=null;vz.panDrag=null}));
$('vizZoom').oninput=e=>{vz.zoom=Number(e.target.value);$('vizZoomVal').textContent=vz.zoom.toFixed(2)+'×';vizDraw()};
$('vizReset').onclick=()=>{vz.zoom=1;vz.pan={x:0,y:0};$('vizZoom').value=1;$('vizZoomVal').textContent='1.00×';vizInit();vizDraw()};
$('vizDetails').onclick=()=>{const sc=vizScenes()[vz.idx];$('vizDetailText').innerHTML=`<h2>${sc.id}. ${esc(sc.title)}</h2><p>${esc(sc.short)}</p><p>${esc(sc.detail)}</p>`;$('vizDetail').showModal()};
$('vizDetailClose').onclick=()=>$('vizDetail').close();$('vizClose').onclick=()=>$('vizModal').close();$('orthoClose').onclick=()=>{$('orthoModal').close();$('orthoFrame').srcdoc=''};$('vizOpen').onclick=()=>openViz(null);$('vizMenuBtn').onclick=()=>$('vizLayout').classList.toggle('menuopen');

var ink={};let hist={},drawMode=false,tool='pen',penColor='#e34c4c',curStroke=null,curPath=null,erasing=null,showData=true;
try{const i=JSON.parse(localStorage.getItem('plan17_ink'));if(i)ink=i}catch{}
try{const v=localStorage.getItem('plan17_showData');if(v!==null)showData=v==='1'}catch{}
const saveInk=()=>{try{localStorage.setItem('plan17_ink',JSON.stringify(ink))}catch{}};
const strokeD=st=>'M'+st.pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L');
function inkSVG(id){return (ink[id]||[]).map(st=>`<path d="${strokeD(st)}" fill="none" stroke="${st.c}" stroke-width="${st.w}" stroke-linecap="round" stroke-linejoin="round"${st.c==='#ffd400'?' opacity=".55"':''}/>`).join('')}
function redrawInk(){const g=document.querySelector('#diagram #ink');if(g&&curId)g.innerHTML=inkSVG(curId)}
function svgPt(e){const svg=document.querySelector('#diagram svg');if(!svg)return null;const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());return[q.x,q.y]}
function setDraw(on){drawMode=on;$('diagram').classList.toggle('drawing',on);$('diagram').classList.toggle('erasing',on&&tool==='eraser');$('drawToggle').classList.toggle('primary',on);$('drawToggle').textContent=on?'✏ Рисование: вкл (Esc — выход)':'✏ Рисовать';document.querySelectorAll('.drawOnly').forEach(x=>x.style.display=on?'':'none')}
function setTool(t){tool=t;$('penBtn').classList.toggle('active',t==='pen');$('eraserBtn').classList.toggle('active',t==='eraser');$('diagram').classList.toggle('erasing',drawMode&&t==='eraser')}
function pushHist(a){(hist[curId]||(hist[curId]=[])).push(a)}
function eraseAt(p){const list=ink[curId]||[];for(let i=list.length-1;i>=0;i--){const st=list[i];if(st.pts.some(q=>Math.hypot(q[0]-p[0],q[1]-p[1])<10)){erasing.push({st,i});list.splice(i,1)}}redrawInk()}
function undo(){const h=hist[curId];if(!h||!h.length)return;const a=h.pop(),list=ink[curId]||(ink[curId]=[]);
 if(a.t==='add'){const i=list.lastIndexOf(a.st);if(i>=0)list.splice(i,1)}else if(a.t==='erase'){[...a.items].reverse().forEach(x=>list.splice(Math.min(x.i,list.length),0,x.st))}else if(a.t==='clear'){ink[curId]=a.list}saveInk();redrawInk()}
$('diagram').addEventListener('pointerdown',e=>{if(!drawMode||e.ctrlKey||!curId)return;const p=svgPt(e);if(!p)return;e.preventDefault();$('diagram').setPointerCapture(e.pointerId);
 if(tool==='pen'){curStroke={c:penColor,w:penColor==='#ffd400'?12:3,pts:[p]};const g=document.querySelector('#diagram #ink');curPath=document.createElementNS('http://www.w3.org/2000/svg','path');curPath.setAttribute('fill','none');curPath.setAttribute('stroke',curStroke.c);curPath.setAttribute('stroke-width',curStroke.w);curPath.setAttribute('stroke-linecap','round');curPath.setAttribute('stroke-linejoin','round');if(curStroke.c==='#ffd400')curPath.setAttribute('opacity','.55');g.appendChild(curPath);curPath.setAttribute('d',strokeD(curStroke))}
 else{erasing=[];eraseAt(p)}});
$('diagram').addEventListener('pointermove',e=>{if(!drawMode)return;const p=svgPt(e);if(!p)return;if(curStroke){const l=curStroke.pts[curStroke.pts.length-1];if(Math.hypot(p[0]-l[0],p[1]-l[1])>1.2){curStroke.pts.push(p);curPath.setAttribute('d',strokeD(curStroke))}}else if(erasing)eraseAt(p)});
['pointerup','pointercancel'].forEach(ev=>$('diagram').addEventListener(ev,()=>{if(curStroke){if(curStroke.pts.length>1){(ink[curId]||(ink[curId]=[])).push(curStroke);pushHist({t:'add',st:curStroke});saveInk()}curStroke=null;curPath=null;redrawInk()}if(erasing){if(erasing.length){pushHist({t:'erase',items:erasing});saveInk()}erasing=null}}));
$('drawToggle').onclick=()=>setDraw(!drawMode);$('penBtn').onclick=()=>setTool('pen');$('eraserBtn').onclick=()=>setTool('eraser');$('undoBtn').onclick=undo;
$('clearInk').onclick=()=>{if(!curId||!(ink[curId]||[]).length)return;pushHist({t:'clear',list:ink[curId]});ink[curId]=[];saveInk();redrawInk()};
document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{penColor=b.dataset.color;document.querySelectorAll('.sw').forEach(x=>x.classList.toggle('active',x===b));setTool('pen')});
$('showData').checked=showData;$('showData').onchange=e=>{showData=e.target.checked;try{localStorage.setItem('plan17_showData',showData?'1':'0')}catch{};renderTask()};
document.addEventListener('keydown',e=>{if($('vizModal').open||$('printModal').open||$('orthoModal').open)return;if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
 if((e.ctrlKey||e.metaKey)&&(e.key==='z'||e.key==='Z'||e.key==='я'||e.key==='Я'||e.code==='KeyZ')){e.preventDefault();undo()}
 if(e.key==='Escape'&&drawMode){setDraw(false)}});
setDraw(false);setTool('pen');

loadStatus();try{const th=localStorage.getItem('plan17_theme');if(th)document.documentElement.dataset.theme=th}catch{}
renderTopics();curId=visibleTasks()[0]?.id||null;renderList();renderTask();
