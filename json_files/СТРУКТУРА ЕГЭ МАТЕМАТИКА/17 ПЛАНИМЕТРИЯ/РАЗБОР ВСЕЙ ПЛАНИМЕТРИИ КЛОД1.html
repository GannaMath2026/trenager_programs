<header><strong>Планиметрия ЕГЭ №17 · разбор по темам</strong><button class="btn" id="vizOpen">Визуализатор фактов</button><button class="btn" id="printOpen">Печать</button><button class="btn" id="exportApp">Сохранить приложение</button><button class="btn" id="theme">☾</button></header>
<div class="app" id="app">

<script type="text/plain" id="ortho-code">"\u003c!doctype html>\n\u003chtml lang=\"ru\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Ортоцентр: интерактивные факты\u003c/title>\n\u003cstyle>\n:root{color-scheme:dark;--bg:#0b0d10;--panel:#151a21;--panel2:#1c232c;--line:#303a46;--text:#edf2f7;--muted:#a8b3c2;--red:#ff5656;--yellow:#ffd34e;--blue:#65b7ff;--green:#65d6a1}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,\"Segoe UI\",sans-serif}header{padding:18px 24px;border-bottom:1px solid var(--line);font-size:22px;font-weight:750;letter-spacing:.2px}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 65px)}aside{border-right:1px solid var(--line);padding:18px 12px;background:#10141a;position:sticky;top:0;height:calc(100vh - 65px);overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;scrollbar-color:#596979 #10141a;scrollbar-width:auto;align-self:start}.group{margin:8px 0 18px}aside::-webkit-scrollbar{width:10px}aside::-webkit-scrollbar-track{background:#10141a}aside::-webkit-scrollbar-thumb{background:#596979;border:2px solid #10141a;border-radius:8px}aside::-webkit-scrollbar-thumb:hover{background:#7a8b9b}.group h3{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:1px;margin:12px}.factbtn{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;color:var(--text);padding:10px 12px;border-radius:9px;cursor:pointer;margin:3px 0}.factbtn:hover{background:var(--panel2)}.factbtn.active{background:#2b2022;border-color:#6f3538;color:#fff}.factbtn small{display:block;color:var(--muted);font-size:11px}main{padding:22px;min-width:0}.factcard{background:linear-gradient(135deg,#1b222b,#141920);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px;display:flex;gap:20px;align-items:center;justify-content:space-between}.factcard h2{margin:0 0 7px;font-size:21px}.factcard p{margin:0;color:#d2dbe5}.factmain{min-width:0;flex:1}.factAside{display:flex;align-items:center;gap:14px}.factResult{max-width:360px;text-align:right;color:#ffd34e;font-weight:750;line-height:1.4;white-space:pre-line}.angle-chip.active,.reflect-chip.active,.mid-chip.active,.radius-chip.active,.orth-chip.active{background:#493034;border-color:#a95760;color:#fff}.btn{border:1px solid #536171;background:#26313d;color:white;padding:10px 14px;border-radius:9px;cursor:pointer;white-space:nowrap}.btn:hover{background:#344252}.sceneWrap{position:relative;border:1px solid var(--line);border-radius:14px;background:#0e1217;overflow:hidden}.sceneHead{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);color:var(--muted);font-size:15px}.scene{display:block;width:100%;height:min(62vh,620px);min-height:360px;touch-action:none}.scene text{font-family:system-ui,sans-serif;fill:#f4f7fa;font-size:15px;paint-order:stroke;stroke:#0e1217;stroke-width:3px;stroke-linejoin:round}.scene .vertex{fill:#fff;stroke:#111;stroke-width:2;cursor:grab}.scene .vertex:active{cursor:grabbing}.scene .edge{stroke:#dce4ec;stroke-width:2.2;fill:none}.scene .alt{stroke:var(--red);stroke-width:1.8;fill:none}.scene .aux{stroke:var(--blue);stroke-width:1.5;fill:none}.scene .circ{stroke:#8c9aa9;stroke-width:1.4;fill:none}.scene .section{fill:#ffd34e22;stroke:var(--yellow);stroke-width:2}.stats{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}.stat{background:#1b232c;border:1px solid #303b47;border-radius:8px;padding:6px 10px;font-size:15px;color:#dbe5ef}.controls{display:flex;align-items:center;gap:10px}.controls input{width:130px}.bottom{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}.note{font-size:14px;color:var(--muted)}dialog{background:#171e26;color:var(--text);border:1px solid #465362;border-radius:14px;max-width:650px;width:calc(100% - 32px);padding:24px;box-shadow:0 20px 80px #0009}dialog::backdrop{background:#000a}dialog h2{margin-top:0}dialog p{color:#d8e1ea}.close{float:right}.mobileMenu{display:none}\n@media(max-width:800px){.layout{grid-template-columns:1fr}aside{display:none;border:0;position:static;height:auto;max-height:55vh;overflow-y:auto}.layout.menuopen aside{display:block}.mobileMenu{display:inline-block;margin-right:12px}main{padding:12px}.factcard{align-items:flex-start;flex-direction:column}.factAside{width:100%;justify-content:space-between;flex-wrap:wrap}.factResult{text-align:left}.scene{height:55vh;min-height:300px}.bottom{grid-template-columns:1fr}.controls{justify-content:space-between}}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cheader>\u003cbutton class=\"btn mobileMenu\" id=\"menuBtn\">☰\u003c/button>Ортоцентр: интерактивные факты\u003c/header>\n\u003cdiv class=\"layout\" id=\"layout\">\u003caside id=\"menu\">\u003c/aside>\u003cmain>\n\u003csection class=\"factcard\">\u003cdiv class=\"factmain\">\u003ch2 id=\"factTitle\">\u003c/h2>\u003cp id=\"factShort\">\u003c/p>\u003c/div>\u003cdiv class=\"factAside\">\u003cdiv id=\"factResult\" class=\"factResult\">\u003c/div>\u003cbutton class=\"btn\" id=\"detailsBtn\">Подробнее →\u003c/button>\u003c/div>\u003c/section>\n\u003csection class=\"sceneWrap\">\u003cdiv class=\"sceneHead\">\u003cspan>Перетаскивайте вершины A, B, C · Ctrl + перетаскивание — двигать сцену\u003c/span>\u003cspan class=\"controls\">\u003cbutton class=\"btn\" id=\"reset\">Сбросить вершины\u003c/button> Масштаб \u003cinput id=\"zoom\" type=\"range\" min=\".5\" max=\"2.5\" step=\".05\" value=\"1\">\u003cb id=\"zoomVal\">1.00×\u003c/b>\u003c/span>\u003c/div>\n\u003csvg id=\"scene\" class=\"scene\" viewBox=\"0 0 800 520\" role=\"img\" aria-label=\"Интерактивная геометрическая сцена\">\u003c/svg>\n\u003cdiv class=\"stats\" id=\"stats\">\u003c/div>\n\u003cdiv class=\"stats\" id=\"angleControls\" style=\"display:none;align-items:center\">\n\u003cb>Выберите вершину:\u003c/b>\n\u003cbutton class=\"btn angle-chip active\" data-v=\"C\">C\u003c/button>\n\u003cbutton class=\"btn angle-chip\" data-v=\"A\">A\u003c/button>\n\u003cbutton class=\"btn angle-chip\" data-v=\"B\">B\u003c/button>\n\u003c/div>\n\u003cdiv class=\"stats\" id=\"reflectControls\" style=\"display:none;align-items:center\">\u003cb>Отражение H относительно противоположной стороны\u003c/b>\u003cspan class=\"note\">Выберите вершину:\u003c/span>\u003cbutton class=\"btn reflect-chip\" data-v=\"A\">A · BC\u003c/button>\u003cbutton class=\"btn reflect-chip\" data-v=\"B\">B · CA\u003c/button>\u003cbutton class=\"btn reflect-chip\" data-v=\"C\">C · AB\u003c/button>\u003c/div>\n\u003cdiv class=\"stats\" id=\"cyclicControls\" style=\"display:none;align-items:center;flex-wrap:wrap\">\n\u003cb>6 вписанных четырёхугольников\u003c/b>\n\u003cbutton class=\"btn cyclic-mode active\" data-mode=\"side\">Диаметр — сторона\u003c/button>\n\u003cbutton class=\"btn cyclic-mode\" data-mode=\"vh\">Диаметр — вершина и H\u003c/button>\n\u003cbutton class=\"btn cyclic-mode\" data-mode=\"allSide\">Все 3 на сторонах\u003c/button>\n\u003cbutton class=\"btn cyclic-mode\" data-mode=\"allVH\">Все 3 с H\u003c/button>\n\u003cbutton class=\"btn cyclic-mode\" data-mode=\"all\">Все 6\u003c/button>\n\u003cspan class=\"note\">Выберите вершину A, B или C для одного построения.\u003c/span>\n\u003cbutton class=\"btn cyclic-vertex active\" data-v=\"A\">A\u003c/button>\u003cbutton class=\"btn cyclic-vertex\" data-v=\"B\">B\u003c/button>\u003cbutton class=\"btn cyclic-vertex\" data-v=\"C\">C\u003c/button>\n\u003c/div>\n\u003cdiv class=\"stats\" id=\"midControls\" style=\"display:none;align-items:center;flex-wrap:wrap\">\n\u003cb>Отражение относительно середины противоположной стороны\u003c/b>\u003cspan class=\"note\">Активная вершина:\u003c/span>\n\u003cbutton class=\"btn mid-chip active\" data-v=\"A\">A\u003c/button>\u003cbutton class=\"btn mid-chip\" data-v=\"B\">B\u003c/button>\u003cbutton class=\"btn mid-chip\" data-v=\"C\">C\u003c/button>\n\u003c/div>\n\u003cdiv class=\"stats\" id=\"radiusAngleControls\" style=\"display:none;align-items:center;flex-wrap:wrap\">\u003cb>Активная вершина:\u003c/b>\u003cspan class=\"note\">Выберите вершину:\u003c/span>\u003cbutton class=\"btn radius-chip active\" data-v=\"A\">A\u003c/button>\u003cbutton class=\"btn radius-chip\" data-v=\"B\">B\u003c/button>\u003cbutton class=\"btn radius-chip\" data-v=\"C\">C\u003c/button>\u003c/div>\n\u003cdiv class=\"stats\" id=\"orthAnglesControls\" style=\"display:none;align-items:center\">\u003cb>Активная вершина:\u003c/b>\u003cbutton class=\"btn orth-chip active\" data-v=\"C\">C\u003c/button>\u003cbutton class=\"btn orth-chip\" data-v=\"A\">A\u003c/button>\u003cbutton class=\"btn orth-chip\" data-v=\"B\">B\u003c/button>\u003c/div>\n\u003cdiv class=\"stats\" id=\"nineControls\" style=\"display:none;align-items:center\">\u003cb>Показать:\u003c/b>\u003clabel>\u003cinput type=\"checkbox\" id=\"nineAlt\"> Высоты\u003c/label>\u003clabel>\u003cinput type=\"checkbox\" id=\"nineMedian\"> Медианы\u003c/label>\u003c/div>\n\u003cdiv class=\"stats\" id=\"eulerControls\" style=\"display:none;align-items:center\">\n\u003cb>Показать построения:\u003c/b>\n\u003clabel>\u003cinput type=\"checkbox\" id=\"showAlt\" checked> Высоты\u003c/label>\n\u003clabel>\u003cinput type=\"checkbox\" id=\"showMedian\" checked> Медианы\u003c/label>\n\u003clabel>\u003cinput type=\"checkbox\" id=\"showRadius\" checked> Радиусы\u003c/label>\n\u003c/div>\u003c/section>\n\u003c/main>\u003c/div>\n\u003cdialog id=\"modal\">\u003cbutton class=\"btn close\" id=\"close\">Закрыть ✕\u003c/button>\u003cdiv id=\"detailContent\">\u003c/div>\u003c/dialog>\n\u003cscript>\nconst facts=[\n{id:1,level:\"Базовые\",title:\"1. Ортоцентр — пересечение высот\",short:\"Высоты треугольника (или их продолжения) пересекаются в одной точке — ортоцентре H.\",detail:\"Высота треугольника — перпендикуляр, проведённый из вершины к прямой, содержащей противоположную сторону. Три высоты пересекаются в одной точке H. В остроугольном треугольнике H внутри, в прямоугольном — в вершине прямого угла, в тупоугольном — вне треугольника.\",scene:\"alt\"},\n{id:2,level:\"Базовые\",title:\"2. Угол при ортоцентре\",short:\"Для остроугольного треугольника угол между двумя высотами равен 180° минус угол третьей вершины.\",detail:\"Например, ∠BHC = 180° − ∠A. При выборе другой вершины A, B или C построение переключается на соответствующую пару высот.\",scene:\"angle\"},\n{id:3,level:\"Базовые\",title:\"3. Шесть вписанных четырёхугольников\",short:\"Три четырёхугольника имеют сторонy треугольника в качестве диаметра, ещё три — отрезок от вершины до H.\",detail:\"Для сторон BC, CA и AB строятся три вписанных четырёхугольника с диаметром, равным стороне. Ещё три строятся с диаметрами AH, BH и CH. Переключайте отдельные варианты или показывайте все шесть одновременно.\",scene:\"cyclic\"},\n{id:4,level:\"Средние\",title:\"4. Отражение H относительно стороны\",short:\"Отражение ортоцентра относительно стороны лежит на описанной окружности.\",detail:\"Выберите вершину: отражаем H относительно противоположной стороны и показываем дельтоид и связанные углы. Для A, B и C построение аналогично.\",scene:\"reflect\"},\n{id:5,level:\"Средние\",title:\"5. Отражение H относительно середины стороны\",short:\"M — середина стороны и отрезка HM₁; M₁ лежит на описанной окружности.\",detail:\"Для выбранной вершины отмечаем середину M противоположной стороны и строим M₁, симметричную H относительно M. HM = MM₁. Показываются параллелограмм B–H–C–M₁ и прямые углы ABM₁ и ACM₁.\",scene:\"midreflect\"},\n{id:6,level:\"Средние\",title:\"6. Угол между стороной и высотой\",short:\"Для активной вершины выделены угол между стороной и высотой, угол 90° − α, центральный угол 180° − 2α и два угла α у радиусов.\",detail:\"При активной вершине C: ∠C₁CB = α (жёлтый), ∠CBC₁ = 90° − α (фиолетовый), ∠COA = 180° − 2α (зелёный), ∠ACO = ∠CAO = α (жёлтые). При активных A и B построение и обозначения поворачиваются аналогично.\",scene:\"radiusAngle\"},\n{id:7,level:\"Средние\",title:\"7. Расстояние до ортоцентра\",short:\"Для вершины C расстояние CH вдвое больше расстояния от O до стороны AB.\",detail:\"Если E — основание перпендикуляра из O на AB, то CH = 2·OE. Аналогичные соотношения выполняются для каждой вершины и противоположной стороны.\",scene:\"distance\"},\n{id:8,level:\"Средние\",title:\"8.1. Касательная, дуга и высота\",short:\"Угол между касательной в вершине и стороной равен вписанному углу; пунктирная окружность меняется вместе с активной вершиной.\",detail:\"При активной вершине C пунктирная окружность проходит через A, B₁, A₁, B; при A — через B, C₁, B₁, C; при B — через C, A₁, C₁, A. Также показываются касательная, высоты и соответствующие углы.\",scene:\"tangent\"},\n{id:81,level:\"Средние\",title:\"8.2. Радиус перпендикулярен отрезку между основаниями высот\",short:\"Для активной вершины радиус к ней перпендикулярен отрезку, соединяющему основания двух остальных высот.\",detail:\"Для активной вершины C: OC ⟂ A₁B₁; для B: OB ⟂ A₁C₁; для A: OA ⟂ B₁C₁. Здесь A₁, B₁ и C₁ — основания высот исходного треугольника. Это следствие пункта 8.1.\",scene:\"radiusPerp\"},\n{id:9,level:\"Средние\",title:\"9. Прямая Эйлера\",short:\"Ортоцентр H, центр описанной окружности O и центр тяжести M лежат на одной прямой.\",detail:\"Прямая Эйлера проходит через H, O и M. Центр тяжести делит отрезок OH в отношении OM:MH = 1:2.\",scene:\"euler\"},\n{id:13,level:\"Продвинутые\",title:\"10. Сумма квадратов\",short:\"AH² + BC² = 4R², где R — радиус описанной окружности.\",detail:\"Квадрат расстояния от вершины до ортоцентра плюс квадрат противоположной стороны равен квадрату диаметра описанной окружности: AH² + BC² = (2R)².\",scene:\"squares\"},\n{id:12,level:\"Продвинутые\",title:\"12. Подобие отсечённого треугольника\",short:\"Отсечённый треугольник подобен исходному ABC; коэффициент подобия равен модулю косинуса угла C.\",detail:\"Для активной вершины C отсечённый треугольник, образованный основаниями высот A₁ и B₁ и вершиной C, подобен исходному треугольнику ABC. Коэффициент подобия равен |cos C|.\",scene:\"similar\"},\n{id:13,level:\"Продвинутые\",title:\"13. Подобие прямоугольных треугольников\",short:\"Для активной вершины выделена соответствующая пара равных углов и коэффициент подобия.\",detail:\"При активной вершине C выделяются треугольники CB₁H и AB₁B; при B — HA₁B и ACA₁; при A — AHC₁ и CC₁B. В каждой паре выделяются соответствующие равные острые углы. Коэффициент подобия для выбранной вершины равен модулю котангенса её угла.\",scene:\"cotSimilar\"},\n{id:15,level:\"Продвинутые\",title:\"14. Окружность девяти точек\",short:\"Середины сторон, основания высот и середины отрезков AH, BH, CH лежат на одной окружности.\",detail:\"Центр окружности девяти точек N — середина OH, а её радиус равен R/2.\",scene:\"nine\"},\n{id:15,level:\"Продвинутые\",title:\"15. Равные углы ортотреугольника\",short:\"Ортотреугольник выделен; внутри него показана бледная голубая пунктирная вписанная окружность с центром H.\",detail:\"Основания высот A₁, B₁ и C₁ образуют ортотреугольник. Для остроугольного ABC ортоцентр H является центром его вписанной окружности. Равные углы при активной вершине выделяются цветными дугами.\",scene:\"orthAngles\"},\n{id:16,level:\"Продвинутые\",title:\"16. Равенство углов ортотреугольника\",short:\"Для каждой активной вершины выделяются равные углы исходного и ортотреугольника.\",detail:\"При активной вершине B: ∠CBA = ∠CB₁A₁ = ∠AB₁C₁. При активной вершине C: ∠ACB = ∠B₁C₁A = ∠A₁C₁B. Для A показано аналогичное равенство.\",scene:\"orthEqual\"},\n{id:17,level:\"Продвинутые\",title:\"17. Высоты — биссектрисы нового треугольника\",short:\"Продолжения высот пересекают описанную окружность в точках Hₐ, Hᵦ, H꜀ и становятся биссектрисами треугольника HₐHᵦH꜀.\",detail:\"Продлим высоты исходного треугольника до описанной окружности и обозначим точки Hₐ, Hᵦ и H꜀. Они образуют новый треугольник. Красные дуги: ∠HᵦHₐA = ∠AHₐH꜀ = ∠ACH꜀ = ∠HᵦBA. Зелёные дуги: ∠HₐHᵦB = ∠BHᵦH꜀ = ∠HₐAB = ∠H꜀CB. Голубые дуги: ∠HₐH꜀C = ∠HᵦH꜀C = ∠CAHₐ = ∠CBHᵦ. Ортоцентр H — центр вписанной окружности нового треугольника; окружность показана бледным жёлтым пунктиром.\",scene:\"altitudeBisectors\"}\n];\nconst svg=document.getElementById('scene'), ns='http://www.w3.org/2000/svg';let current=0,zoom=1,drag=null,pan={x:0,y:0},panDrag=null,angleVertex='C',activeVertex='A',cyclicMode='side',cyclicChoice='A',reflectVertices=['A'],nineAlt=false,nineMedian=false;\nfunction scenePoint(e){\n  const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;\n  const q=p.matrixTransform(svg.getScreenCTM().inverse());\n  return {x:(q.x-pan.x-400)/zoom+400,y:(q.y-pan.y-260)/zoom+260};\n}\nfunction vertexPoint(name){return name==='A'?A:name==='B'?B:C}\nfunction setVertex(name,p){if(name==='A')A=p;else if(name==='B')B=p;else C=p}\n\nlet A={x:250,y:390},B={x:570,y:390},C={x:400,y:105};const initial=()=>{A={x:250,y:390};B={x:570,y:390};C={x:400,y:105}};\nconst add=(tag,attrs={},parent=svg,text='')=>{let e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text)e.textContent=text;parent.appendChild(e);return e};\nconst plus=(a,b)=>({x:a.x+b.x,y:a.y+b.y}),sub=(a,b)=>({x:a.x-b.x,y:a.y-b.y}),mul=(a,k)=>({x:a.x*k,y:a.y*k}),dot=(a,b)=>a.x*b.x+a.y*b.y,dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);\nfunction lineIntersection(p,v,q,w){let cross=(a,b)=>a.x*b.y-a.y*b.x,den=cross(v,w);if(Math.abs(den)\u003c1e-8)return{x:400,y:260};return plus(p,mul(v,cross(sub(q,p),w)/den))}\nfunction foot(P,U,V){let d=sub(V,U),t=dot(sub(P,U),d)/dot(d,d);return plus(U,mul(d,t))}\nfunction circum(){let d=2*(A.x*(B.y-C.y)+B.x*(C.y-A.y)+C.x*(A.y-B.y));if(Math.abs(d)\u003c1e-6)return{x:400,y:260};let aa=dot(A,A),bb=dot(B,B),cc=dot(C,C);return{x:(aa*(B.y-C.y)+bb*(C.y-A.y)+cc*(A.y-B.y))/d,y:(aa*(C.x-B.x)+bb*(A.x-C.x)+cc*(B.x-A.x))/d}}\nfunction ortho(O){return{x:A.x+B.x+C.x-2*O.x,y:A.y+B.y+C.y-2*O.y}}\nfunction midpoint(P,Q){return mul(plus(P,Q),.5)}function reflect(P,U,V){let F=foot(P,U,V);return sub(mul(F,2),P)}\nfunction secondCircleIntersection(P,Q,O){const d=sub(Q,P),den=dot(d,d);if(den\u003c1e-9)return P;const t=-2*dot(sub(P,O),d)/den;return plus(P,mul(d,t));}\nfunction pointLineDistance(P,U,V){const d=sub(V,U),len=dist(U,V)||1;return Math.abs(d.x*(P.y-U.y)-d.y*(P.x-U.x))/len;}\nfunction fmt(n){return Number.isFinite(n)?n.toFixed(1):\"—\"}function angle(P,Q,R){let u=sub(P,Q),v=sub(R,Q);return Math.acos(Math.max(-1,Math.min(1,dot(u,v)/(dist(P,Q)*dist(R,Q)))))*180/Math.PI}\nfunction syncVertexButtons(){\n  document.querySelectorAll('.angle-chip,.reflect-chip,.mid-chip,.radius-chip').forEach(b=>b.classList.toggle('active',b.dataset.v===activeVertex));\n}\nfunction render(){\n  const sceneKey=facts[current]?.scene;\n  document.getElementById('nineControls').style.display=sceneKey==='nine'?'flex':'none';\n  document.getElementById('angleControls').style.display=sceneKey==='angle'?'flex':'none';\n  document.getElementById('reflectControls').style.display=sceneKey==='reflect'?'flex':'none';\n  document.getElementById('midControls').style.display=sceneKey==='midreflect'?'flex':'none';\n  document.getElementById('radiusAngleControls').style.display=['radiusAngle','tangent','radiusPerp'].includes(sceneKey)?'flex':'none';\n  document.getElementById('cyclicControls').style.display=sceneKey==='cyclic'?'flex':'none';\n  document.getElementById('eulerControls').style.display=sceneKey==='euler'?'flex':'none';\n  document.getElementById('orthAnglesControls').style.display=['orthAngles','cotSimilar','orthEqual'].includes(sceneKey)?'flex':'none';\n  syncVertexButtons();\n  svg.innerHTML='';let g=add('g',{transform:`translate(${pan.x} ${pan.y}) translate(400 260) scale(${zoom}) translate(-400 -260)`});\n  const el=(tag,attrs,text)=>add(tag,attrs,g,text), edge=(P,Q,cls='edge',dash='')=>{if(cls==='alt'&&!dash)dash='6 5';return el('line',{x1:P.x,y1:P.y,x2:Q.x,y2:Q.y,class:cls,...(dash?{ 'stroke-dasharray':dash}:{})})};\n  const polygon=(pts,stroke='#65b7ff',dash='5 5')=>el('polygon',{points:pts.map(P=>`${P.x},${P.y}`).join(' '),fill:'none',stroke,'stroke-width':1.7,'stroke-dasharray':dash});\n  const label=(P,t,color='#f4f7fa')=>el('text',{x:P.x+9,y:P.y-10,fill:color,'font-size':14},t);\n  const angleArc=(P,Q,T,r,label,color='#ffd34e',width=2.2)=>{\n    const a1=Math.atan2(Q.y-P.y,Q.x-P.x),a2=Math.atan2(T.y-P.y,T.x-P.x);\n    let delta=((a2-a1+Math.PI*3)%(Math.PI*2))-Math.PI;\n    const rr=Math.max(32,r); // Never crowd an angle arc against its vertex.\n    const pts=[];for(let i=0;i\u003c=40;i++){const a=a1+delta*i/40;pts.push({x:P.x+rr*Math.cos(a),y:P.y+rr*Math.sin(a)});}\n    el('polyline',{points:pts.map(Q=>`${Q.x},${Q.y}`).join(' '),fill:'none',stroke:color,'stroke-width':width,'stroke-linecap':'round'});\n    if(label){const am=a1+delta/2,lr=rr+24;el('text',{x:P.x+lr*Math.cos(am),y:P.y+lr*Math.sin(am),fill:color,'font-size':15,'text-anchor':'middle'},label);}\n  };\nlet O=circum(),H=ortho(O),M={x:(A.x+B.x+C.x)/3,y:(A.y+B.y+C.y)/3};\nlet D=foot(A,B,C),E=foot(B,C,A),F=foot(C,A,B);\nlet R=dist(O,A);\nif(!['alt','angle','cyclic','nine','orthAngles','orthEqual','radiusPerp'].includes(sceneKey))el('circle',{cx:O.x,cy:O.y,r:R,class:'circ'});\nedge(A,B);edge(B,C);edge(C,A);\nconst alt=(P,Q,T)=>{let Fp=foot(P,Q,T);edge(P,Fp,'alt');if(Fp.x\u003cQ.x||Fp.x>T.x||Fp.y\u003cQ.y||Fp.y>T.y){edge(Fp,plus(Fp,mul(sub(Q,T),.35)),'alt','5 5')}};\nif(['alt','angle','cyclic','reflect','midreflect'].includes(sceneKey) || (sceneKey==='euler'&&document.getElementById('showAlt').checked)){\n  // Высоты идут от вершин через H к основаниям; продолжения показаны пунктиром.\n  [[A,H,D],[B,H,E],[C,H,F]].forEach(([P,Q,T])=>{edge(P,Q,'alt','6 5');edge(Q,T,'alt','6 5');});\n  [[D,B,C],[E,C,A],[F,A,B]].forEach(([P,U,V])=>{\n    const d=sub(V,U),den=dot(d,d)||1,t=dot(sub(P,U),d)/den;\n    if(t\u003c0)edge(U,P,'edge','6 5');else if(t>1)edge(V,P,'edge','6 5');\n  });\n}\n// Right-angle marks at altitude feet are visible; Euler controls can hide them with the altitudes.\nconst rightMark=(P,U,V,altTarget)=>{\n  const unit=(v)=>{const n=Math.hypot(v.x,v.y)||1;return {x:v.x/n,y:v.y/n}};\n  const side=unit(sub(midpoint(U,V),P));\n  const alt=unit(sub(altTarget,P));\n  const r=14;\n  const p1=plus(P,mul(side,r)),p2=plus(p1,mul(alt,r)),p3=plus(P,mul(alt,r));\n  el('polyline',{points:[p1,p2,p3].map(Q=>`${Q.x},${Q.y}`).join(' '),fill:'none',stroke:'#ffd34e','stroke-width':2.3,'stroke-linejoin':'round'});\n};\nconst markCorner=(P,Q,R,r=15)=>{\n  const unit=v=>{const n=Math.hypot(v.x,v.y)||1;return {x:v.x/n,y:v.y/n}};\n  const u=unit(sub(Q,P)),v=unit(sub(R,P)),p1=plus(P,mul(u,r)),p2=plus(p1,mul(v,r)),p3=plus(P,mul(v,r));\n  el('polyline',{points:[p1,p2,p3].map(X=>`${X.x},${X.y}`).join(' '),fill:'none',stroke:'#ffd34e','stroke-width':2.2,'stroke-linejoin':'round'});\n};\nif(sceneKey!=='euler'||document.getElementById('showAlt').checked){rightMark(D,B,C,A);rightMark(E,C,A,B);rightMark(F,A,B,C);}\nif(sceneKey==='angle'){\n  const V={A,B,C},opp={A:[B,C],B:[C,A],C:[A,B]},name=activeVertex,[U,W]=opp[name];\n  const greek={A:'α',B:'β',C:'γ'}[name];\n  angleArc(V[name],U,W,25,greek);\n  angleArc(H,U,W,31,`180° − ${greek}`);\n}\nif(sceneKey==='tangent'){\n  const V={A,B,C},name=activeVertex,opp={A:['C','B'],B:['A','C'],C:['A','B']},[uName,wName]=opp[name],P=V[name],U=V[uName],W=V[wName];\n  const O3=circum(),RR=dist(O3,P);\n  el('circle',{cx:O3.x,cy:O3.y,r:RR,class:'circ'});\n  // Tangent MN through the active vertex, oriented left-to-right on screen.\n  let tv={x:-(P.y-O3.y),y:P.x-O3.x};if(tv.x\u003c0)tv={x:-tv.x,y:-tv.y};\n  const tn=Math.hypot(tv.x,tv.y)||1;tv={x:tv.x/tn,y:tv.y/tn};\n  const Mtan=plus(P,mul(tv,-260)),Ntan=plus(P,mul(tv,260));\n  edge(Mtan,Ntan,'aux');label(Mtan,'M');label(Ntan,'N');\n  // All three altitudes and their feet.\n  [[A,D,'A₁'],[B,E,'B₁'],[C,F,'C₁']].forEach(([X,Y,n  cond:R`В треугольнике $ABC$ проведена биссектриса $AM$. Прямая, проходящая через вершину $B$ перпендикулярно $AM$, пересекает сторону $AC$ в точке $N$. При этом $AB=12$, $BC=7$, $AC=16$.<br><b>а)</b> Докажите, что биссектриса угла $C$ делит отрезок $MN$ пополам.<br><b>б)</b> Пусть $P$ — точка пересечения биссектрис треугольника $ABC$. Найдите отношение $AP:PN$.`,
 ans:'4',facts:['Б11','Б1'],
 fig(){const{A,B,C}=G.tri(12,7,16);const M=G.bis(A,B,C),N=G.lerp(A,C,12/16),F=G.inter(A,M,B,N),P=G.incenter(A,B,C),L=G.mid(M,N);return{P:{A,B,C,M,N,F,P,L},items:[
  ...triItems(),seg('A','M',{c:'blue'}),seg('B','N',{c:'green'}),rt('F','M','N'),
  arc('A','B','M',{r:34,st:1}),arc('A','M','C',{r:40,st:1}),tick('A','B',1,{st:1}),tick('A','N',1,{st:1}),poly(['A','B','N'],'green',{st:1}),
  mtx('M','C','MC = 4',{st:2,dx:22,c:'orange'}),mtx('N','C','NC = 4',{st:1,dy:-14,c:'orange'}),
  seg('M','N',{st:3,c:'purple'}),seg('C','L',{st:3,c:'red'}),tick('C','M',2,{st:3}),tick('C','N',2,{st:3}),tick('M','L',1,{st:3,c:'blue'}),tick('L','N',1,{st:3,c:'blue'}),
  arc('C','M','L',{r:30,c:'purple',st:3}),arc('C','L','N',{r:36,c:'purple',st:3}),
  pt('P',{st:4,c:'red'}),mtx('A','P','AP : PM = 4',{st:4,dy:-14,c:'red'}),
  seg('P','N',{st:5,d:true,c:'red'}),tick('P','M',3,{st:5,c:'green'}),tick('P','N',3,{st:5,c:'green'}),
  pt('A'),pt('B'),pt('C'),pt('M'),pt('N'),pt('F',{n:'F',size:3}),pt('L',{st:3})]}},
 steps:[
  {part:'а',t:'Перпендикуляр к биссектрисе',do:R`В треугольнике $ABN$ отрезок $AF$ ($F$ — точка пересечения $AM$ и $BN$) является и биссектрисой, и высотой.`,res:R`Значит, треугольник $ABN$ равнобедренный: $AN=AB=12$, откуда $NC=16-12=4$.`,eq:R`AN=AB=12,\qquad NC=AC-AN=4`,sc:['Б11']},
  {t:'Свойство биссектрисы AM',do:R`Биссектриса $AM$ делит сторону $BC$ в отношении прилежащих сторон.`,res:R`Находим $MC$.`,eq:R`\frac{BM}{MC}=\frac{AB}{AC}=\frac{12}{16}=\frac34\Rightarrow MC=\frac47\cdot7=4`,sc:['Б1']},
  {t:'Треугольник MCN',do:R`Получили $CM=CN=4$. Рассмотрим треугольник $MCN$ и биссектрису угла $C$.`,res:R`Треугольник $MCN$ равнобедренный, биссектриса угла при вершине является медианой: она делит $MN$ пополам. Пункт а) доказан.`,eq:R`CM=CN\Rightarrow ML=LN`},
  {part:'б',t:'Биссектриса CP в треугольнике AMC',do:R`Точка $P$ лежит на $AM$ и на биссектрисе угла $C$. В треугольнике $AMC$ отрезок $CP$ — биссектриса.`,res:R`По свойству биссектрисы:`,eq:R`\frac{AP}{PM}=\frac{AC}{CM}=\frac{16}{4}=4`,sc:['Б1']},
  {t:'Ответ',do:R`Биссектриса $CL$ равнобедренного треугольника $MCN$ — серединный перпендикуляр к $MN$, и точка $P$ на ней.`,res:R`Значит, $PN=PM$.`,eq:R`AP:PN=AP:PM=4`}]},

{id:'b29',topic:'bis',num:'29',code:'80524',level:1,
 cond:R`Из вершины $B$ треугольника $ABC$ проведены биссектрисы внутреннего и внешнего углов треугольника, пересекающие сторону $AC$ и её продолжение в точках $D$ и $E$ соответственно.<br><b>а)</b> Докажите свойство биссектрисы внешнего угла треугольника: $\dfrac{CE}{AE}=\dfrac{BC}{AB}$.<br><b>б)</b> Найдите радиус окружности, описанной около треугольника $BDE$, если $AC=5$, $AB:BC=2:3$.`,
 ans:'6',facts:['Б2','Б16','Б1','Б15'],
 fig(){const{A,B,C}=G.tri(4,6,5);const D=G.lerp(A,C,2/5),E=G.lerp(C,A,3);const K=G.inter(C,G.add(C,G.sub(E,B)),A,B);const X=G.lerp(A,B,1.45);return{P:{A,B,C,D,E,K,X},items:[
  ...triItems(),seg('A','E',{c:'gray',d:'6 5'}),seg('B','D',{c:'blue'}),seg('B','E',{c:'red'}),seg('B','X',{c:'gray',d:'4 4',hide:4}),
  seg('C','K',{c:'green',d:'7 5',st:1,hide:4}),seg('B','K',{c:'gray',d:'4 4',st:1,hide:4}),
  arc('C','B','K',{c:'orange',st:2,hide:4}),arc('B','C','E',{c:'orange',st:2,r:30,hide:4}),tick('B','K',1,{st:2,hide:4}),tick('B','C',1,{st:2,hide:4}),
  poly(['A','E','B'],'blue',{st:3,hide:4}),poly(['A','C','K'],'green',{st:3,hide:4}),
  mtx('A','D','2',{st:4,dy:-10,c:'orange'}),mtx('D','C','3',{st:4,dy:-10,c:'orange'}),
  mtx('E','A','EA = 10',{st:5,dy:-12,c:'orange'}),
  rt('B','D','E',{st:6}),{k:'c3',pts:['B','D','E'],c:'purple',d:'6 5',st:6},
  pt('A'),pt('B'),pt('C'),pt('D'),pt('E'),pt('K',{st:1,hide:4})]}},
 steps:[
  {part:'а',t:'Дополнительное построение',do:R`Проведём через $C$ прямую, параллельную $BE$; она пересечёт прямую $AB$ в точке $K$ (за точкой $B$).`,res:R`Появилась пара параллельных прямых $BE\parallel CK$.`,eq:R`CK\parallel BE`,sc:['Б19']},
  {t:'Равнобедренный треугольник BCK',do:R`Сравним углы треугольника $BCK$ с углами, которые $BE$ образует со сторонами внешнего угла.`,res:R`$\angle BCK=\angle CBE$ (накрест лежащие), $\angle BKC$ равен углу между $BE$ и продолжением $AB$ (соответственные). Эти углы равны, т.к. $BE$ — биссектриса. Значит, $BK=BC$.`,eq:R`\angle BKC=\angle BCK\Rightarrow BK=BC`},
  {t:'Подобие с центром в A',do:R`Треугольники $AEB$ и $ACK$ подобны ($BE\parallel CK$, угол при $A$ — вертикальный).`,res:R`Из подобия $\dfrac{AC}{AE}=\dfrac{AK}{AB}$. Прибавим к обеим частям 1:`,eq:R`\frac{AC+AE}{AE}=\frac{AK+AB}{AB}\Rightarrow\frac{CE}{AE}=\frac{BK}{AB}=\frac{BC}{AB}`,sc:['Б16','Б2']},
  {part:'б',t:'Внутренняя биссектриса',do:R`Пусть $AB=2k$, $BC=3k$. Биссектриса $BD$ делит $AC=5$ в отношении $2:3$.`,res:R`Находим $AD$ и $DC$.`,eq:R`AD=2,\qquad DC=3`,sc:['Б1']},
  {t:'Внешняя биссектриса',do:R`По пункту а) $\dfrac{EA}{EC}=\dfrac{AB}{BC}=\dfrac23$; точка $E$ лежит за точкой $A$, поэтому $EC=EA+5$.`,res:R`Решаем уравнение.`,eq:R`\frac{EA}{EA+5}=\frac23\Rightarrow EA=10`,sc:['Б2']},
  {t:'Прямой угол и радиус',do:R`Внутренняя и внешняя биссектрисы одного угла перпендикулярны: $\angle DBE=90^\circ$. Центр окружности, описанной около прямоугольного треугольника, — середина гипотенузы $DE$.`,res:R`$DE=EA+AD=12$, радиус равен половине гипотенузы.`,eq:R`R=\frac{DE}2=\frac{12}2=6`,sc:['Б2','Б15']}]},

{id:'b30',topic:'bis',num:'30',code:'130174',level:1,
 cond:R`Биссектриса угла $A$ треугольника $ABC$ пересекает его сторону $BC$ в точке $K$ и его описанную окружность в точке $M$.<br><b>а)</b> Докажите, что треугольник $BMC$ — равнобедренный.<br><b>б)</b> Найдите радиус окружности, описанной около треугольника $KMC$, если $AB=8$, $BC=7$ и $AC=6$.`,
 ans:R`\frac{8\sqrt{15}}{15}`,facts:['Б8','Б1','Б13','Б18'],
 fig(){const{A,B,C}=G.tri(8,7,6);const K=G.bis(A,B,C),O=G.circ3(A,B,C),M=G.second(A,K,O);return{P:{A,B,C,K,M,O},items:[
  ...triItems(),{k:'c',o:'O',c:'gray',w:1.3},seg('A','M',{c:'blue'}),
  arc('A','B','K',{r:34,st:1}),arc('A','K','C',{r:40,st:1}),seg('B','M',{st:1,c:'green'}),seg('M','C',{st:1,c:'green'}),tick('B','M',1,{st:1}),tick('M','C',1,{st:1}),
  mtx('K','C','KC = 3',{st:2,dy:16,dx:18,c:'orange'}),
  arc('B','A','C',{c:'green',st:3,r:24}),arc('M','K','C',{c:'green',st:3,r:24}),
  {k:'c3',pts:['K','M','C'],c:'purple',d:'6 5',st:5},
  pt('A'),pt('B'),pt('C'),pt('K'),pt('M')]}},
 steps:[
  {part:'а',t:'Равные дуги',do:R`$AM$ — биссектриса: $\angle BAM=\angle MAC$. Это вписанные углы, опирающиеся на дуги $BM$ и $MC$.`,res:R`Равные вписанные углы опираются на равные дуги, а равные дуги стягиваются равными хордами: $BM=MC$, треугольник $BMC$ равнобедренный.`,eq:R`\angle BAM=\angle MAC\Rightarrow \smile BM=\smile MC\Rightarrow BM=MC`,sc:['Б8']},
  {part:'б',t:'Отрезок KC',do:R`Найдём, в каком отношении биссектриса $AK$ делит сторону $BC=7$.`,res:R`$BK:KC=AB:AC=8:6=4:3$.`,eq:R`KC=\frac37\cdot7=3`,sc:['Б1']},
  {t:'Угол KMC',do:R`Угол $KMC$ — это угол $AMC$; он опирается на хорду $AC$, как и вписанный угол $ABC$.`,res:R`Углы равны.`,eq:R`\angle KMC=\angle AMC=\angle ABC`,sc:['Б13']},
  {t:'Синус угла B',do:R`Найдём $\cos B$ по теореме косинусов в треугольнике $ABC$.`,res:R`Затем — синус.`,eq:R`\cos B=\frac{64+49-36}{2\cdot8\cdot7}=\frac{11}{16},\qquad \sin B=\frac{\sqrt{256-121}}{16}=\frac{3\sqrt{15}}{16}`},
  {t:'Теорема синусов в KMC',do:R`В треугольнике $KMC$ сторона $KC$ лежит против угла $KMC=\angle B$.`,res:R`Радиус описанной окружности:`,eq:R`R=\frac{KC}{2\sin\angle KMC}=\frac{3}{2\cdot\frac{3\sqrt{15}}{16}}=\frac{8}{\sqrt{15}}=\frac{8\sqrt{15}}{15}`,sc:['Б18']}]},

{id:'b31',topic:'bis',num:'31',code:'44132',level:2,
 cond:R`Дан остроугольный треугольник $ABC$. Биссектриса внутреннего угла при вершине $B$ пересекает биссектрису внешнего угла при вершине $C$ в точке $M$, а биссектриса внутреннего угла при вершине $C$ пересекает биссектрису внешнего угла при вершине $B$ в точке $N$.<br><b>а)</b> Докажите, что $\angle BMN=\frac12\angle ACB$.<br><b>б)</b> Найдите $BM$, если $AB=AC=10$, $BC=12$.`,
 ans:R`8\sqrt5`,facts:['Б2','Б15','Б13','Б6','Б18'],
 fig(){const{A,B,C}=G.tri(10,12,10);const M=G.excenter(B,C,A),N=G.excenter(C,A,B),Q=G.mid(M,N);return{P:{A,B,C,M,N,Q},items:[
  ...triItems(),seg('B','M',{c:'blue'}),seg('C','N',{c:'blue'}),seg('C','M',{c:'red',d:'7 5'}),seg('B','N',{c:'red',d:'7 5'}),
  rt('C','M','N',{st:1}),rt('B','M','N',{st:1}),
  seg('M','N',{st:2,c:'purple'}),{k:'c',o:'Q',thr:'M',c:'purple',d:'6 5',st:2},
  arc('M','B','N',{c:'orange',st:3,r:30,t:'γ/2'}),arc('C','B','N',{c:'orange',st:3,r:30,t:'γ/2'}),
  poly(['B','M','C'],'blue',{st:4}),arc('M','B','C',{c:'green',st:4,r:44,t:'α/2'}),arc('B','C','M',{c:'teal',st:4,r:18}),
  mtx('B','M','BM = 8√5',{st:6,c:'red',bold:true,dx:-34,dy:-16}),
  pt('A'),pt('B'),pt('C'),pt('M'),pt('N')]}},
 steps:[
  {part:'а',t:'Две пары перпендикулярных биссектрис',do:R`Биссектрисы внутреннего и внешнего углов при одной вершине перпендикулярны (смежные углы в сумме $180^\circ$, их половины — $90^\circ$).`,res:R`При вершине $C$: $CM\perp CN$; при вершине $B$: $BM\perp BN$.`,eq:R`\angle MCN=\angle MBN=90^\circ`,sc:['Б2']},
  {t:'Окружность на диаметре MN',do:R`Из точек $B$ и $C$ отрезок $MN$ виден под прямым углом.`,res:R`Значит, $B$ и $C$ лежат на окружности с диаметром $MN$.`,eq:R`B,\,C,\,M,\,N\ \text{лежат на одной окружности}`,sc:['Б15']},
  {t:'Вписанные углы',do:R`Углы $BMN$ и $BCN$ опираются на одну дугу $BN$ этой окружности.`,res:R`Они равны, а $CN$ — биссектриса угла $C$. Пункт а) доказан.`,eq:R`\angle BMN=\angle BCN=\tfrac12\angle ACB`,sc:['Б13']},
  {part:'б',t:'Углы треугольника BMC',do:R`Обозначим углы треугольника $ABC$: $\alpha,\beta,\gamma$. Найдём углы треугольника $BMC$.`,res:R`$\angle MBC=\frac\beta2$, $\angle BCM=\gamma+\frac{180^\circ-\gamma}2=90^\circ+\frac\gamma2$, тогда $\angle BMC=\frac\alpha2$.`,eq:R`\angle BMC=180^\circ-\tfrac\beta2-90^\circ-\tfrac\gamma2=\tfrac\alpha2`,sc:['Б6']},
  {t:'Значения тригонометрических функций',do:R`В равнобедренном треугольнике $AB=AC=10$, $BC=12$ найдём $\cos\gamma$ и $\cos\alpha$, затем половинные углы.`,res:R`$\cos\gamma=\frac6{10}=0{,}6$, $\cos\alpha=\frac{100+100-144}{200}=0{,}28$.`,eq:R`\cos\tfrac\gamma2=\sqrt{\tfrac{1+0{,}6}2}=\tfrac2{\sqrt5},\qquad \sin\tfrac\alpha2=\sqrt{\tfrac{1-0{,}28}2}=0{,}6`},
  {t:'Теорема синусов в BMC',do:R`Сторона $BM$ лежит против угла $BCM=90^\circ+\frac\gamma2$, сторона $BC$ — против угла $\frac\alpha2$.`,res:R`Получаем ответ.`,eq:R`BM=\frac{BC\cdot\sin(90^\circ+\frac\gamma2)}{\sin\frac\alpha2}=\frac{12\cdot\frac2{\sqrt5}}{0{,}6}=\frac{40}{\sqrt5}=8\sqrt5`,sc:['Б18']}]},

{id:'b32',topic:'bis',num:'32',code:'353',level:2,
 cond:R`В треугольнике $ABC$ биссектриса $AE$ равна отрезку $EB$. На продолжении $AE$ за точку $E$ взята точка $D$ так, что $ED=CE$.<br><b>а)</b> Докажите, что $CD\parallel AB$.<br><b>б)</b> Найдите $\angle ABC$, если $AB=2\cdot AC$.`,
 ans:'30°',facts:['Б1','Б18'],
 fig(){const{A,B,C}=G.tri(6,3*Math.sqrt(3),3);const E=G.bis(A,B,C);const D=G.lerp(A,E,(G.d(A,E)+G.d(C,E))/G.d(A,E));return{P:{A,B,C,E,D},items:[
  ...triItems(),seg('A','E',{c:'blue'}),seg('E','D',{c:'blue',d:'7 5'}),seg('C','D',{c:'green'}),
  tick('A','E',1,{st:1}),tick('E','B',1,{st:1}),arc('A','E','B',{st:1,t:'β',r:34}),arc('B','A','E',{st:1,t:'β',r:30}),
  tick('C','E',2,{st:2,c:'blue'}),tick('E','D',2,{st:2,c:'blue'}),arc('E','A','B',{c:'purple',st:2,r:16}),arc('E','C','D',{c:'purple',st:2,r:16}),arc('D','E','C',{st:2,t:'β',r:26}),
  seg('C','D',{st:3,c:'green',w:4}),seg('A','B',{st:3,c:'green',w:4}),
  arc('A','E','C',{st:4,t:'β',r:24,c:'orange'}),tick('A','C',3,{st:4,c:'orange'}),tick('C','D',3,{st:4,c:'orange'}),
  mtx('A','B','∠B = 30°',{st:6,dy:22,c:'red',bold:true}),
  pt('A'),pt('B'),pt('C'),pt('E'),pt('D')]}},
 steps:[
  {part:'а',t:'Треугольник AEB',do:R`По условию $AE=EB$. Обозначим $\angle ABC=\beta$.`,res:R`Треугольник $AEB$ равнобедренный: $\angle EAB=\angle EBA=\beta$.`,eq:R`\angle EAB=\angle ABE=\beta`},
  {t:'Треугольник CED',do:R`$CE=ED$, и $\angle CED=\angle AEB$ как вертикальные. Значит, равнобедренные треугольники $AEB$ и $CED$ имеют равные углы при вершине $E$.`,res:R`Тогда равны и углы при основаниях.`,eq:R`\angle EDC=\angle ECD=\angle EAB=\beta`},
  {t:'Параллельность',do:R`Углы $EDC$ и $EAB$ — накрест лежащие при прямых $CD$, $AB$ и секущей $AD$.`,res:R`Они равны, значит, прямые параллельны. Пункт а) доказан.`,eq:R`\angle CDA=\angle DAB\Rightarrow CD\parallel AB`},
  {part:'б',t:'Треугольник ACD',do:R`$AE$ — биссектриса, поэтому $\angle CAD=\angle DAB=\beta=\angle CDA$.`,res:R`Треугольник $ACD$ равнобедренный, $CD=AC$. Кроме того, $\angle BAC=2\beta$, $\angle ACB=180^\circ-3\beta$.`,eq:R`\angle A=2\beta,\quad \angle C=180^\circ-3\beta`},
  {t:'Теорема синусов',do:R`В треугольнике $ABC$: $\dfrac{AB}{AC}=\dfrac{\sin C}{\sin B}=2$.`,res:R`Используем $\sin 3\beta=3\sin\beta-4\sin^3\beta$.`,eq:R`\frac{\sin3\beta}{\sin\beta}=3-4\sin^2\beta=2\Rightarrow\sin^2\beta=\frac14`,sc:['Б18']},
  {t:'Ответ',do:R`Угол $\beta$ острый (в треугольнике есть ещё угол $2\beta$), значит $\sin\beta=\frac12$.`,res:R`Тогда $\angle A=60^\circ$, $\angle C=90^\circ$ — проверка: $AB=2AC$ ✓.`,eq:R`\angle ABC=30^\circ`}]},

{id:'b33',topic:'bis',num:'33',code:'848',level:2,
 cond:R`На стороне $MN$ треугольника $MNP$ отметили точки $Q$, $R$ и $S$ так, что $\angle MPQ=\angle QPR=\angle RPS=\angle SPN$.<br><b>а)</b> Докажите, что если $S_{\triangle RPM}=S_{\triangle NPR}$, то $S_{\triangle PRS}\ne S_{\triangle NPS}$.<br><b>б)</b> Найдите $\dfrac{PS}{QP}$, если $MP=a$, $NP=b$, $RP=c$.`,
 ans:R`\frac{b(a+c)}{a(b+c)}`,facts:['Б12','Б11','Б4'],
 fig(){const P0={x:0,y:0},M=G.ray(P0,220,5),N=G.ray(P0,320,7);const Q=G.inter(P0,G.ray(P0,245,1),M,N),Rr=G.inter(P0,G.ray(P0,270,1),M,N),S=G.inter(P0,G.ray(P0,295,1),M,N);return{P:{P:P0,M,N,Q,R:Rr,S},items:[
  seg('M','P',{w:2.6}),seg('P','N',{w:2.6}),seg('M','N',{w:2.6}),seg('P','Q',{c:'blue'}),seg('P','R',{c:'blue'}),seg('P','S',{c:'blue'}),
  arc('P','M','Q',{r:30}),arc('P','Q','R',{r:30}),arc('P','R','S',{r:30}),arc('P','S','N',{r:30}),
  poly(['R','P','N'],'orange',{st:1,hide:4}),poly(['M','P','N'],'blue',{st:2,hide:4}),seg('P','R',{c:'red',w:4,st:3,hide:4}),
  poly(['M','P','R'],'blue',{st:4}),mtx('M','P','a',{st:4,dx:-12,c:'blue',bold:true}),mtx('P','R','c',{st:4,dx:10,c:'purple',bold:true}),
  poly(['R','P','N'],'green',{st:5}),mtx('P','N','b',{st:5,dx:12,c:'green',bold:true}),
  pt('P'),pt('M'),pt('N'),pt('Q'),pt('R'),pt('S')]}},
 steps:[
  {part:'а',t:'Предположим противное',do:R`Пусть $S_{\triangle PRS}=S_{\triangle NPS}$. У этих треугольников общая высота из $P$, значит $RS=SN$.`,res:R`Тогда в треугольнике $RPN$ отрезок $PS$ — и биссектриса, и медиана, поэтому треугольник $RPN$ равнобедренный.`,eq:R`RS=SN\Rightarrow PR=PN`,sc:['Б12','Б11']},
  {t:'Используем условие',do:R`$S_{\triangle RPM}=S_{\triangle NPR}$ означает $MR=RN$. В треугольнике $MPN$ отрезок $PR$ — биссектриса (угол $MPR$ = угол $RPN$ = $2\varphi$) и медиана.`,res:R`Значит, треугольник $MPN$ равнобедренный и $PR$ — его высота.`,eq:R`PM=PN,\qquad PR\perp MN`},
  {t:'Противоречие',do:R`В прямоугольном треугольнике $PRN$ ($\angle R=90^\circ$) гипотенуза $PN$ больше катета $PR$.`,res:R`Это противоречит равенству $PR=PN$. Значит, $S_{\triangle PRS}\ne S_{\triangle NPS}$.`,eq:R`PN>PR\ \ \text{— противоречие}`},
  {part:'б',t:'Биссектриса PQ треугольника MPR',do:R`Пусть $\angle MPQ=\varphi$. Тогда $\angle MPR=2\varphi$, и $PQ$ — биссектриса треугольника $MPR$ со сторонами $a$ и $c$.`,res:R`Длина биссектрисы через угол:`,eq:R`PQ=\frac{2ac\cos\varphi}{a+c}`,sc:['Б4']},
  {t:'Биссектриса PS треугольника RPN',do:R`$\angle RPN=2\varphi$, и $PS$ — биссектриса треугольника $RPN$ со сторонами $c$ и $b$.`,res:R`Аналогично:`,eq:R`PS=\frac{2bc\cos\varphi}{b+c}`,sc:['Б4']},
  {t:'Отношение',do:R`Разделим одно выражение на другое: $\cos\varphi$ и $2c$ сократятся.`,res:R`Ответ:`,eq:R`\frac{PS}{QP}=\frac{2bc\cos\varphi}{b+c}\cdot\frac{a+c}{2ac\cos\varphi}=\frac{b(a+c)}{a(b+c)}`}]},

{id:'b34',topic:'bis',num:'34',code:'106604',level:3,
 cond:R`На стороне $BC$ треугольника $ABC$ отмечена точка $D$ такая, что $AB=BD$. Биссектриса $BF$ треугольника $ABC$ пересекает прямую $AD$ в точке $E$. Из точки $C$ на прямую $AD$ опущен перпендикуляр $CK$.<br><b>а)</b> Докажите, что $AB:BC=AE:EK$.<br><b>б)</b> Найдите отношение площади треугольника $ABE$ к площади четырёхугольника $CDEF$, если $BD:DC=5:2$.`,
 ans:'30/19',facts:['Б11','Б19','Б1','Б12'],
 fig(){const B={x:0,y:0},C={x:7,y:0},A=G.ray(B,70,5),D={x:5,y:0};const F=G.bis(B,A,C),E=G.inter(B,F,A,D),K=G.foot(C,A,D);return{P:{A,B,C,D,E,F,K},items:[
  ...triItems(),seg('A','D'),seg('D','K',{d:'6 5',c:'gray'}),seg('B','F',{c:'blue'}),seg('C','K',{c:'gray'}),rt('K','C','A'),
  tick('A','B',1,{st:1}),tick('B','D',1,{st:1}),rt('E','B','A',{st:1}),tick('A','E',2,{st:1,c:'blue'}),tick('E','D',2,{st:1,c:'blue'}),
  seg('B','E',{c:'green',w:4,st:2,hide:5}),seg('C','K',{c:'green',w:4,st:2,hide:5}),
  poly(['D','E','B'],'blue',{st:3,hide:5}),poly(['D','K','C'],'green',{st:3,hide:5}),
  poly(['A','B','E'],'blue',{st:5}),poly(['E','B','D'],'teal',{st:5}),mtx('A','D','5/14',{st:5,dx:-30,dy:5,c:'blue'}),
  mtx('A','F','5',{st:6,dx:-10,c:'orange'}),mtx('F','C','7',{st:6,dx:-4,dy:-6,c:'orange'}),
  poly(['A','E','F'],'orange',{st:7}),poly(['C','D','E','F'],'green',{st:8}),
  pt('A'),pt('B'),pt('C'),pt('D'),pt('E'),pt('F'),pt('K')]}},
 steps:[
  {part:'а',t:'Равнобедренный треугольник ABD',do:R`$AB=BD$, и $BE$ — биссектриса угла $B$ треугольника $ABD$.`,res:R`Биссектриса равнобедренного треугольника — высота и медиана.`,eq:R`BE\perp AD,\qquad AE=ED`,sc:['Б11']},
  {t:'Параллельные прямые',do:R`Прямые $BE$ и $CK$ перпендикулярны одной прямой $AD$.`,res:R`Значит, они параллельны.`,eq:R`BE\parallel CK`},
  {t:'Пропорциональные отрезки',do:R`Параллельные прямые $BE$ и $CK$ пересекают стороны угла с вершиной $D$ (прямые $BC$ и $AK$).`,res:R`Треугольники $DEB$ и $DKC$ подобны:`,eq:R`\frac{DE}{DK}=\frac{DB}{DC}`,sc:['Б19']},
  {t:'Вывод',do:R`Выразим $AE$ и $EK$: $AE=ED$, $EK=ED+DK$.`,res:R`Пункт а) доказан.`,eq:R`\frac{AE}{EK}=\frac{DE}{DE+DK}=\frac{DB}{DB+DC}=\frac{BD}{BC}=\frac{AB}{BC}`},
  {part:'б',t:'Площадь ABE',do:R`Пусть $S=S_{ABC}$, $BD=5$, $DC=2$, $AB=5$, $BC=7$. Треугольники $ABD$ и $ABC$ имеют общую высоту из $A$; медиана $BE$ делит $ABD$ пополам.`,res:R``,eq:R`S_{ABD}=\frac57S,\qquad S_{ABE}=S_{EBD}=\frac5{14}S`,sc:['Б12']},
  {t:'Точка F',do:R`Биссектриса $BF$ делит $AC$ в отношении $AB:BC=5:7$.`,res:R`Площадь $ABF$ — часть площади $S$:`,eq:R`\frac{AF}{FC}=\frac57,\qquad S_{ABF}=\frac5{12}S`,sc:['Б1','Б12']},
  {t:'Площадь AEF',do:R`$S_{AEF}=S_{ABF}-S_{ABE}$.`,res:R``,eq:R`S_{AEF}=\frac5{12}S-\frac5{14}S=\frac5{84}S`},
  {t:'Площадь CDEF и ответ',do:R`Вычтем из $S$ площади треугольников $ABE$, $EBD$ и $AEF$.`,res:R``,eq:R`S_{CDEF}=S\Big(1-\frac{30}{84}-\frac{30}{84}-\frac5{84}\Big)=\frac{19}{84}S,\qquad \frac{S_{ABE}}{S_{CDEF}}=\frac{30}{19}`}]},

{id:'b35',topic:'bis',num:'35',code:'175416',level:3,
 cond:R`В прямоугольном треугольнике $ABC$ точки $M$ и $N$ — середины гипотенузы $AB$ и катета $BC$ соответственно. Биссектриса угла $BAC$ пересекает прямую $MN$ в точке $L$.<br><b>а)</b> Докажите, что треугольники $AML$ и $BLC$ подобны.<br><b>б)</b> Найдите отношение площадей этих треугольников, если $\cos\angle BAC=\frac7{25}$.`,
 ans:'25/36',facts:['Б15','Б13','Б18'],
 fig(){const C={x:0,y:0},A={x:7,y:0},B={x:0,y:24};const M=G.mid(A,B),N=G.mid(B,C);const u=nrm(G.sub(N,M));const L=G.add(M,G.mul(u,12.5));return{P:{A,B,C,M,N,L},items:[
  ...triItems(),rt('C','A','B'),seg('A','L',{c:'blue'}),seg('M','L',{c:'green'}),
  seg('M','N',{c:'green',w:4,st:1}),seg('A','C',{c:'green',w:4,st:1}),
  arc('A','C','L',{r:30,st:2}),arc('A','L','B',{r:36,st:2}),arc('L','A','M',{r:30,st:2}),tick('M','A',1,{st:2}),tick('M','L',1,{st:2}),
  {k:'c',o:'M',r:12.5,c:'purple',d:'6 5',st:3},seg('M','C',{d:'5 4',c:'gray',st:3}),
  seg('B','L',{st:4,c:'orange'}),seg('C','L',{st:4,c:'orange'}),poly(['A','M','L'],'blue',{st:4}),poly(['B','L','C'],'green',{st:4}),arc('B','C','L',{r:30,c:'green',st:4}),arc('C','B','L',{r:30,c:'green',st:4}),
  pt('A'),pt('B'),pt('C'),pt('M'),pt('N'),pt('L')]}},
 steps:[
  {part:'а',t:'Средняя линия',do:R`$M$ и $N$ — середины $AB$ и $BC$, значит $MN$ — средняя линия треугольника $ABC$.`,res:R``,eq:R`MN\parallel AC`},
  {t:'Треугольник AML равнобедренный',do:R`Пусть $\angle BAC=\alpha$. Угол $MLA$ и угол $LAC$ — накрест лежащие при $ML\parallel AC$.`,res:R`$\angle MLA=\angle LAC=\frac\alpha2=\angle MAL$, поэтому $ML=MA$.`,eq:R`\angle MAL=\angle MLA=\tfrac\alpha2\Rightarrow ML=MA`},
  {t:'L на описанной окружности',do:R`В прямоугольном треугольнике медиана к гипотенузе равна её половине: $MA=MB=MC$.`,res:R`Точки $A$, $B$, $C$, $L$ лежат на окружности с центром $M$ и радиусом $MA$.`,eq:R`MA=MB=MC=ML`,sc:['Б15']},
  {t:'Углы треугольника BLC',do:R`Точка $L$ лежит на дуге $BC$, не содержащей $A$. Вписанные углы $LBC$ и $LAC$, а также $LCB$ и $LAB$ опираются на одни дуги.`,res:R`Треугольник $BLC$ имеет углы $\frac\alpha2,\frac\alpha2,180^\circ-\alpha$ — как и $AML$. Треугольники подобны.`,eq:R`\angle LBC=\angle LCB=\tfrac\alpha2\Rightarrow\triangle AML\sim\triangle BLC`,sc:['Б13']},
  {part:'б',t:'Коэффициент подобия',do:R`$AM=R$ — радиус окружности, $BL$ — хорда, на которую опирается вписанный угол $\frac\alpha2$.`,res:R``,eq:R`BL=2R\sin\tfrac\alpha2,\qquad k=\frac{AM}{BL}=\frac1{2\sin\frac\alpha2}`,sc:['Б18']},
  {t:'Ответ',do:R`$\sin^2\frac\alpha2=\frac{1-\cos\alpha}2=\frac{1-\frac7{25}}2=\frac9{25}$, $\sin\frac\alpha2=\frac35$, $k=\frac56$.`,res:R`Площади относятся как квадрат коэффициента подобия.`,eq:R`\frac{S_{AML}}{S_{BLC}}=k^2=\frac{25}{36}`}]},

{id:'b36',topic:'bis',num:'36',code:'24585',level:3,
 cond:R`В прямоугольном треугольнике $ABC$ точка $M$ лежит на катете $AC$, а точка $N$ лежит на продолжении катета $BC$ за точку $C$, причём $CM=BC$ и $CN=AC$. Отрезки $CP$ и $CQ$ — биссектрисы треугольников $ACB$ и $NCM$ соответственно.<br><b>а)</b> Докажите, что $CP$ и $CQ$ перпендикулярны.<br><b>б)</b> Найдите $PQ$, если $BC=3$, а $AC=5$.`,
 ans:'3,75',facts:['Б4'],
 fig(){const C={x:0,y:0},B={x:3,y:0},A={x:0,y:5},M={x:0,y:3},N={x:-5,y:0};const P=G.lerp(A,B,5/8),Q=G.lerp(N,M,5/8);return{P:{A,B,C,M,N,P,Q},items:[
  ...triItems(),seg('N','C',{w:2.6}),seg('N','M',{w:2.6}),seg('C','P',{c:'blue'}),seg('C','Q',{c:'blue'}),rt('C','B','A'),
  rt('C','N','M',{st:1,c:'purple',s:16}),
  arc('C','A','P',{r:34,t:'45°',st:2}),arc('C','M','Q',{r:34,t:'45°',st:2,c:'green'}),
  poly(['A','C','B'],'blue',{st:3}),poly(['N','C','M'],'green',{st:3}),tick('C','P',2,{st:3}),tick('C','Q',2,{st:3}),
  seg('P','Q',{c:'red',st:5,w:2.6}),mtx('P','Q','PQ = 15/4',{st:5,dy:-12,c:'red',bold:true}),
  pt('A'),pt('B'),pt('C'),pt('M'),pt('N'),pt('P'),pt('Q')]}},
 steps:[
  {part:'а',t:'Два прямых угла',do:R`$\angle ACB=90^\circ$. Точка $N$ — на продолжении $BC$ за $C$, точка $M$ — на $CA$.`,res:R`$\angle NCM=180^\circ-\angle ACB=90^\circ$.`,eq:R`\angle ACB=\angle NCM=90^\circ`},
  {t:'Биссектрисы прямых углов',do:R`$CP$ делит угол $ACB$ пополам, $CQ$ делит угол $MCN$ пополам; оба угла прилегают к лучу $CA$ с разных сторон.`,res:R`Каждая биссектриса образует с лучом $CA$ угол $45^\circ$.`,eq:R`\angle PCQ=45^\circ+45^\circ=90^\circ`},
  {part:'б',t:'Равные треугольники',do:R`Треугольники $ACB$ и $NCM$ прямоугольные с катетами $5$ и $3$.`,res:R`Они равны, поэтому их биссектрисы прямых углов равны: $CP=CQ$.`,eq:R`\triangle ACB=\triangle NCM\Rightarrow CP=CQ`},
  {t:'Длина биссектрисы',do:R`Длина биссектрисы прямого угла: $l=\dfrac{2ab\cos45^\circ}{a+b}$.`,res:R``,eq:R`CP=\frac{2\cdot3\cdot5\cdot\frac{\sqrt2}2}{3+5}=\frac{15\sqrt2}8`,sc:['Б4']},
  {t:'Ответ',do:R`Треугольник $PCQ$ — прямоугольный равнобедренный.`,res:R``,eq:R`PQ=CP\sqrt2=\frac{15\sqrt2}8\cdot\sqrt2=\frac{15}4=3{,}75`}]},

{id:'b37',topic:'bis',num:'37',code:'30812',level:3,
 cond:R`В параллелограмме $ABCD$ проведена биссектриса $AL$ угла $BAC$. На прямой $CD$ за точкой $D$ отметили точку $E$ такую, что $AE=EC$. Кроме того, $\angle BAC=2\angle CAD$.<br><b>а)</b> Докажите, что треугольники $BAC$ и $BAL$ подобны.<br><b>б)</b> Найдите $EL$, если $\operatorname{tg}\angle BCA=0{,}25$ и $AC=12$.`,
 ans:'4,7',facts:['Б16','Б10'],
 fig(){const f=G.deg(Math.atan(0.25));const A={x:0,y:0},C={x:12,y:0};const B=G.inter(A,G.dir(2*f),C,G.add(C,G.dir(180-f)));const D=G.sub(G.add(A,C),B);const L=G.inter(A,G.dir(f),B,C);const O={x:6,y:0};const E=G.inter(C,D,O,{x:6,y:1});return{P:{A,B,C,D,L,E,O},items:[
  seg('A','B',{w:2.6}),seg('B','C',{w:2.6}),seg('C','D',{w:2.6}),seg('D','A',{w:2.6}),seg('A','C'),seg('A','L',{c:'blue'}),seg('D','E',{c:'gray',d:'6 5'}),seg('A','E',{c:'green',d:'6 5'}),seg('E','C',{c:'green',d:'6 5'}),
  arc('A','C','D',{r:40,t:'φ',st:1}),arc('C','B','A',{r:40,t:'φ',st:1}),arc('A','B','C',{r:56,t:'2φ',st:1,c:'purple'}),
  arc('A','B','L',{r:30,c:'green',st:2,t:'φ'}),
  poly(['B','A','C'],'blue',{st:3,hide:4}),poly(['B','A','L'],'green',{st:3,hide:4}),
  arc('A','L','C',{r:30,c:'orange',st:4}),tick('A','L',1,{st:4}),tick('L','C',1,{st:4}),
  seg('E','L',{c:'red',st:5,w:2.4}),rt('O','C','L',{st:5}),pt('O',{st:5}),
  mtx('O','L','1,5',{st:6,dx:14,c:'orange'}),arc('C','A','E',{r:30,t:'2φ',c:'purple',st:7}),mtx('O','E','3,2',{st:7,dx:14,c:'orange'}),
  mtx('L','E','EL = 4,7',{st:8,dx:-40,c:'red',bold:true}),
  pt('A'),pt('B'),pt('C'),pt('D'),pt('L'),pt('E')]}},
 steps:[
  {part:'а',t:'Углы при диагонали',do:R`Пусть $\angle BCA=\varphi$. Так как $AD\parallel BC$, угол $CAD$ равен $\angle BCA$ (накрест лежащие).`,res:R`По условию $\angle BAC=2\angle CAD$.`,eq:R`\angle CAD=\angle BCA=\varphi,\qquad\angle BAC=2\varphi`},
  {t:'Биссектриса AL',do:R`$AL$ делит угол $BAC=2\varphi$ пополам.`,res:R``,eq:R`\angle BAL=\varphi=\angle BCA`},
  {t:'Подобие',do:R`У треугольников $BAC$ и $BAL$ общий угол $B$ и $\angle BCA=\angle BAL$.`,res:R`Треугольники подобны по двум углам. Пункт а) доказан.`,eq:R`\triangle BAC\sim\triangle BAL`,sc:['Б16']},
  {part:'б',t:'Треугольник ALC',do:R`$\angle LAC=\varphi$ и $\angle LCA=\varphi$.`,res:R`Треугольник $ALC$ равнобедренный: $AL=LC$, точка $L$ лежит на серединном перпендикуляре к $AC$.`,eq:R`AL=LC`},
  {t:'Серединный перпендикуляр',do:R`$EA=EC$ — значит, и $E$ на серединном перпендикуляре к $AC$. Пусть $O$ — середина $AC$; $L$ и $E$ по разные стороны от $AC$.`,res:R``,eq:R`EL=EO+OL`},
  {t:'Отрезок OL',do:R`В прямоугольном треугольнике $OLC$: $OC=6$, $\angle LCO=\varphi$.`,res:R``,eq:R`OL=OC\cdot\operatorname{tg}\varphi=6\cdot0{,}25=1{,}5`},
  {t:'Отрезок OE',do:R`$AB\parallel CD$, поэтому $\angle ECA=\angle BAC=2\varphi$.`,res:R``,eq:R`\operatorname{tg}2\varphi=\frac{2\cdot0{,}25}{1-0{,}0625}=\frac8{15},\qquad OE=6\cdot\frac8{15}=3{,}2`},
  {t:'Ответ',do:R`Складываем найденные отрезки.`,res:R``,eq:R`EL=3{,}2+1{,}5=4{,}7`}]},

{id:'b38',topic:'bis',num:'38',code:'17144',level:3,
 cond:R`В прямоугольнике $ABCD$ диагонали пересекаются в точке $O$, а угол $BDC$ равен $75^\circ$. Точка $P$ лежит вне прямоугольника, а угол $APB$ равен $150^\circ$.<br><b>а)</b> Докажите, что углы $BAP$ и $POB$ равны.<br><b>б)</b> Прямая $PO$ пересекает сторону $CD$ в точке $F$. Найдите $CF$, если $AP=6\sqrt3$ и $BP=4$.`,
 ans:R`\frac{378-84\sqrt3}{23}`,facts:['Б14','Б13','Б18'],
 fig(){const w=14*Math.tan(G.rad(75));const A={x:0,y:0},B={x:0,y:14},C={x:w,y:14},D={x:w,y:0};const y=288/28,P={x:-Math.sqrt(108-y*y),y};const O=G.mid(A,C),F=G.inter(P,O,C,D);return{P:{A,B,C,D,O,P,F},items:[
  seg('A','B',{w:2.6}),seg('B','C',{w:2.6}),seg('C','D',{w:2.6}),seg('D','A',{w:2.6}),seg('A','C',{c:'gray'}),seg('B','D',{c:'gray'}),seg('P','A'),seg('P','B'),seg('P','F',{c:'blue'}),
  arc('D','B','C',{t:'75°',st:1}),arc('B','A','D',{t:'75°',st:1,r:20}),arc('A','O','B',{t:'75°',st:1,r:20}),arc('O','A','B',{t:'30°',st:1,c:'purple',r:40}),
  {k:'c3',pts:['A','P','B'],c:'purple',d:'6 5',st:2},arc('P','A','B',{t:'150°',c:'purple',st:2,r:14}),
  arc('A','B','P',{t:'α',c:'green',st:3,r:44,tr:10}),arc('O','B','P',{t:'α',c:'green',st:3,r:62}),
  mtx('A','B','14',{st:4,dx:10,c:'orange'}),
  arc('O','F','D',{t:'α',c:'green',st:6,r:62}),arc('D','O','C',{t:'75°',c:'red',st:6,r:30}),poly(['O','D','F'],'orange',{st:6}),
  mtx('C','F','CF ≈ 10,11',{st:8,dx:-50,c:'red',bold:true}),
  pt('A'),pt('B'),pt('C'),pt('D'),pt('O'),pt('P'),pt('F')]}},
 steps:[
  {part:'а',t:'Угол AOB',do:R`$\angle ABD=\angle BDC=75^\circ$ (накрест лежащие при $AB\parallel CD$). Треугольник $AOB$ равнобедренный ($OA=OB$).`,res:R``,eq:R`\angle OAB=\angle OBA=75^\circ\Rightarrow\angle AOB=30^\circ`},
  {t:'Вписанный четырёхугольник',do:R`$\angle APB+\angle AOB=150^\circ+30^\circ=180^\circ$, точки $P$ и $O$ лежат по разные стороны от $AB$.`,res:R`Четырёхугольник $APBO$ вписанный.`,eq:R`\angle APB+\angle AOB=180^\circ\Rightarrow A,P,B,O\ \text{на одной окружности}`,sc:['Б14']},
  {t:'Равные вписанные углы',do:R`Углы $BAP$ и $BOP$ опираются на одну дугу $BP$.`,res:R`Пункт а) доказан.`,eq:R`\angle BAP=\angle BOP=\alpha`,sc:['Б13']},
  {part:'б',t:'Сторона AB',do:R`Теорема косинусов в треугольнике $APB$.`,res:R``,eq:R`AB^2=108+16-2\cdot6\sqrt3\cdot4\cdot\cos150^\circ=124+72=196,\ AB=14`},
  {t:'Угол α',do:R`Теорема синусов в треугольнике $APB$: $\dfrac{BP}{\sin\alpha}=\dfrac{AB}{\sin150^\circ}$.`,res:R``,eq:R`\sin\alpha=\frac{4\cdot\frac12}{14}=\frac17,\qquad\cos\alpha=\frac{4\sqrt3}7`,sc:['Б18']},
  {t:'Треугольник ODF',do:R`$\angle FOD=\angle POB=\alpha$ (вертикальные), $\angle ODF=75^\circ$, $OD=\frac{BD}2=\frac{7}{\cos75^\circ}$.`,res:R`По теореме синусов $DF=\dfrac{OD\sin\alpha}{\sin(75^\circ+\alpha)}$.`,eq:R`DF=\frac{1}{\cos75^\circ\,\sin(75^\circ+\alpha)}`,sc:['Б18']},
  {t:'Вычисление DF',do:R`$\cos75^\circ\sin(75^\circ+\alpha)=\sin75^\circ\cos75^\circ\cos\alpha+\cos^275^\circ\sin\alpha=\frac14\cdot\frac{4\sqrt3}7+\frac{2-\sqrt3}4\cdot\frac17$.`,res:R``,eq:R`\cos75^\circ\sin(75^\circ+\alpha)=\frac{3\sqrt3+2}{28},\qquad DF=\frac{28}{3\sqrt3+2}=\frac{28(3\sqrt3-2)}{23}`},
  {t:'Ответ',do:R`$CF=CD-DF=14-DF$.`,res:R``,eq:R`CF=14-\frac{84\sqrt3-56}{23}=\frac{378-84\sqrt3}{23}`}]},

{id:'b39',topic:'bis',num:'39',code:'30809',level:3,
 cond:R`Биссектриса $BB_1$ и высота $CC_1$ треугольника $ABC$ пересекают описанную около него окружность в точках $M$ и $N$ соответственно. Известно, что $\angle BCA=85^\circ$ и $\angle ABC=40^\circ$.<br><b>а)</b> Докажите, что $BM=CN$.<br><b>б)</b> Пусть $MN$ и $BC$ пересекаются в точке $D$. Найдите площадь треугольника $BDN$, если его высота $BH$ равна $7$.`,
 ans:'49',facts:['Б13','Б18','Б8'],
 fig(){const Oc={x:0,y:0,r:6},A=G.ray(Oc,45,6),B=G.ray(Oc,215,6),C=G.ray(Oc,325,6);const B1=G.bis(B,A,C),M=G.second(B,B1,Oc),C1=G.foot(C,A,B),N=G.second(C,C1,Oc),D=G.inter(M,N,B,C),H=G.foot(B,D,N);return{P:{A,B,C,M,N,B1,C1,D,H,Oc},items:[

  arc('B','A','M',{t:'20°',r:40,st:1}),arc('B','M','C',{t:'20°',r:52,st:1}),arc('C','B','N',{t:'50°',r:30,c:'purple',st:1}),arc('C','N','A',{t:'35°',r:42,c:'teal',st:1}),
  seg('A','M',{st:2,c:'green'}),arc('A','B','M',{t:'75°',c:'green',st:2,r:22}),
  seg('B','N',{st:3,c:'green'}),arc('B','C','N',{t:'75°',c:'green',st:3,r:70}),
  tick('B','M',2,{st:4,c:'orange'}),tick('C','N',2,{st:4,c:'orange'}),
  seg('M','D',{st:5,c:'purple'}),seg('C','D',{st:5,d:'6 5',c:'gray'}),arc('N','B','D',{t:'75°',c:'purple',st:5,r:26}),
  arc('D','B','N',{t:'30°',c:'red',st:6,r:40}),tick('D','B',1,{st:6}),tick('D','N',1,{st:6}),poly(['B','D','N'],'orange',{st:6}),
  seg('B','H',{st:7,c:'red'}),rt('H','B','D',{st:7}),mtx('B','H','7',{st:7,dx:-8,dy:-6,c:'red',bold:true}),
  pt('A'),pt('B'),pt('C'),pt('M'),pt('N'),pt('B1',{n:'B₁',size:3}),pt('C1',{n:'C₁',size:3}),pt('D',{st:5}),pt('H',{st:7})]}},
 steps:[
  {part:'а',t:'Известные углы',do:R`$\angle BAC=180^\circ-85^\circ-40^\circ=55^\circ$. Биссектриса: $\angle ABM=\angle MBC=20^\circ$. Высота: $\angle BCN=90^\circ-40^\circ=50^\circ$, $\angle ACN=90^\circ-55^\circ=35^\circ$.`,res:R``,eq:R`\angle A=55^\circ,\ \ \angle MBC=20^\circ,\ \ \angle ACN=35^\circ`},
  {t:'Вписанный угол BAM',do:R`$\angle CAM=\angle CBM=20^\circ$ (опираются на дугу $CM$).`,res:R``,eq:R`\angle BAM=\angle BAC+\angle CAM=55^\circ+20^\circ=75^\circ`,sc:['Б13']},
  {t:'Вписанный угол CBN',do:R`$\angle ABN=\angle ACN=35^\circ$ (опираются на дугу $AN$).`,res:R``,eq:R`\angle CBN=\angle CBA+\angle ABN=40^\circ+35^\circ=75^\circ`,sc:['Б13']},
  {t:'Равные хорды',do:R`Хорды $BM$ и $CN$ видны из точек окружности под одним углом $75^\circ$.`,res:R`По следствию из теоремы синусов они равны. Пункт а) доказан.`,eq:R`BM=2R\sin75^\circ=CN`,sc:['Б18']},
  {part:'б',t:'Угол BND',do:R`$\angle BNM$ и $\angle BAM$ опираются на дугу $BM$.`,res:R``,eq:R`\angle BND=\angle BNM=\angle BAM=75^\circ`,sc:['Б13']},
  {t:'Треугольник BDN',do:R`Точка $D$ лежит на луче $BC$, поэтому $\angle NBD=\angle NBC=75^\circ$.`,res:R`Углы при $B$ и $N$ равны: треугольник равнобедренный, угол $D$ равен $30^\circ$.`,eq:R`DB=DN,\qquad\angle BDN=180^\circ-2\cdot75^\circ=30^\circ`},
  {t:'Ответ',do:R`В прямоугольном треугольнике $BHD$ катет $BH$ лежит против угла $30^\circ$.`,res:R``,eq:R`BD=2BH=14=DN,\qquad S_{BDN}=\tfrac12\cdot DN\cdot BH=\tfrac12\cdot14\cdot7=49`}]},

{id:'b40',topic:'bis',num:'40',code:'24573',level:3,
 cond:R`Биссектриса прямого угла прямоугольного треугольника $ABC$ вторично пересекает окружность, описанную около этого треугольника, в точке $L$. Прямая, проходящая через точку $L$ и середину $N$ гипотенузы $AB$, пересекает катет $BC$ в точке $M$.<br><b>а)</b> Докажите, что $\angle BML=\angle BAC$.<br><b>б)</b> Найдите площадь треугольника $ABC$, если $AB=20$ и $CM=3\sqrt5$.`,
 ans:'80',facts:['Б8','Б15'],
 fig(){const s5=Math.sqrt(5),C={x:0,y:0},B={x:8*s5,y:0},A={x:0,y:4*s5};const N=G.mid(A,B),o={x:N.x,y:N.y,r:10};const L=G.second(C,{x:1,y:-1},o);const M=G.inter(L,N,B,C);return{P:{A,B,C,N,L,M},items:[
  ...triItems(),rt('C','B','A'),{k:'c',o:'N',r:10,c:'gray',w:1.3},seg('C','L',{c:'blue'}),seg('L','M',{c:'green'}),
  arc('C','A','L',{t:'45°',r:30,st:1}),arc('C','L','B',{t:'45°',r:36,st:1}),seg('A','L',{st:1,c:'orange',d:'5 4'}),seg('B','L',{st:1,c:'orange',d:'5 4'}),tick('A','L',1,{st:1}),tick('L','B',1,{st:1}),
  rt('N','L','B',{st:2}),
  arc('M','B','L',{c:'green',r:24,st:3,n:2}),arc('A','C','B',{c:'green',r:24,st:3,n:2}),
  mtx('B','N','10',{st:4,dy:-12,c:'orange'}),
  mtx('C','M','3√5',{st:5,dy:16,c:'orange'}),
  pt('A'),pt('B'),pt('C'),pt('N'),pt('L'),pt('M')]}},
 steps:[
  {part:'а',t:'L — середина дуги AB',do:R`$CL$ — биссектриса: $\angle ACL=\angle LCB=45^\circ$. Это вписанные углы, опирающиеся на дуги $AL$ и $LB$.`,res:R`Дуги равны, $L$ — середина дуги $AB$, $LA=LB$.`,eq:R`\smile AL=\smile LB`,sc:['Б8']},
  {t:'NL ⟂ AB',do:R`Гипотенуза — диаметр, $N$ — центр окружности. $NL$ — радиус, проведённый в середину дуги $AB$ (или: $N$ и $L$ равноудалены от $A$ и $B$).`,res:R`Значит, $NL$ — серединный перпендикуляр к $AB$.`,eq:R`LN\perp AB`,sc:['Б15']},
  {t:'Угол BML',do:R`В прямоугольном треугольнике $BNM$ ($\angle N=90^\circ$) острые углы дополняют друг друга до $90^\circ$.`,res:R`Пункт а) доказан.`,eq:R`\angle BML=\angle BMN=90^\circ-\angle B=\angle BAC`},
  {part:'б',t:'Отрезки на BC',do:R`Пусть $\cos B=c$. Из треугольника $BNM$: $BN=10$, $BM=\dfrac{10}{c}$. Из треугольника $ABC$: $BC=20c$.`,res:R`$CM=BC-BM$:`,eq:R`20c-\frac{10}c=3\sqrt5`},
  {t:'Решаем уравнение',do:R`$20c^2-3\sqrt5\,c-10=0$, берём положительный корень.`,res:R``,eq:R`c=\frac{3\sqrt5+\sqrt{45+800}}{40}=\frac{3\sqrt5+13\sqrt5}{40}=\frac2{\sqrt5}`},
  {t:'Ответ',do:R`$BC=20c=8\sqrt5$, $AC=20\sin B=20\cdot\frac1{\sqrt5}=4\sqrt5$.`,res:R``,eq:R`S_{ABC}=\tfrac12\cdot8\sqrt5\cdot4\sqrt5=80`}]},

{id:'b41',topic:'bis',num:'41',code:'14094',level:4,
 cond:R`Точка $O$ — центр вписанной в треугольник $ABC$ окружности. Прямая $BO$ вторично пересекает описанную около этого треугольника окружность в точке $P$.<br><b>а)</b> Докажите, что $\angle POC=\angle PCO$.<br><b>б)</b> Найдите площадь треугольника $APC$, если радиус описанной около треугольника $ABC$ окружности равен $4$, а $\angle ABC=120^\circ$.`,
 ans:R`12\sqrt3`,facts:['Б9','Б13','Б8','Б14','Б18'],
 fig(){const Q={x:0,y:0,r:4},A=G.ray(Q,150,4),B=G.ray(Q,200,4),C=G.ray(Q,270,4),P=G.ray(Q,30,4);const O=G.incenter(A,B,C);return{P:{A,B,C,P,O,Q},items:[
  ...triItems(),{k:'c',o:'Q',c:'gray',w:1.3},seg('B','P',{c:'blue'}),seg('O','C',{c:'blue'}),seg('P','C',{c:'green'}),
  arc('B','A','O',{r:30,st:1}),arc('B','O','C',{r:36,st:1}),arc('C','B','O',{r:28,c:'teal',st:1}),arc('C','O','A',{r:34,c:'teal',st:1}),arc('O','P','C',{r:22,c:'orange',st:1}),
  arc('C','P','A',{r:44,st:2}),arc('P','C','O',{r:22,c:'orange',st:2}),tick('P','O',1,{st:2}),tick('P','C',1,{st:2}),
  seg('P','A',{st:3,c:'green'}),tick('P','A',1,{st:3}),
  poly(['A','P','C'],'orange',{st:4}),arc('P','A','C',{t:'60°',r:26,c:'purple',st:4}),
  mtx('A','C','AC = 4√3',{st:5,dx:46,dy:6,c:'red'}),
  pt('A'),pt('B'),pt('C'),pt('O'),pt('P')]}},
 steps:[
  {part:'а',t:'Внешний угол треугольника BOC',do:R`$BO$ и $CO$ — биссектрисы. Угол $POC$ — внешний угол треугольника $BOC$.`,res:R``,eq:R`\angle POC=\angle OBC+\angle OCB=\tfrac\beta2+\tfrac\gamma2`},
  {t:'Угол PCO',do:R`$\angle PCA=\angle PBA=\frac\beta2$ (опираются на дугу $PA$), $\angle ACO=\frac\gamma2$.`,res:R`Углы равны, треугольник $POC$ равнобедренный: $PO=PC$ (лемма о трезубце). Пункт а) доказан.`,eq:R`\angle PCO=\tfrac\beta2+\tfrac\gamma2=\angle POC`,sc:['Б13','Б9']},
  {part:'б',t:'P — середина дуги AC',do:R`$BP$ — биссектриса угла $B$, значит $P$ — середина дуги $AC$, не содержащей $B$.`,res:R``,eq:R`PA=PC`,sc:['Б8']},
  {t:'Угол APC',do:R`$ABCP$ — вписанный четырёхугольник: $\angle APC=180^\circ-\angle ABC$.`,res:R`Равнобедренный треугольник с углом $60^\circ$ — равносторонний.`,eq:R`\angle APC=60^\circ\Rightarrow\triangle APC\ \text{равносторонний}`,sc:['Б14']},
  {t:'Сторона AC',do:R`Теорема синусов для треугольника $ABC$.`,res:R``,eq:R`AC=2R\sin120^\circ=8\cdot\frac{\sqrt3}2=4\sqrt3`,sc:['Б18']},
  {t:'Ответ',do:R`Площадь равностороннего треугольника со стороной $a$: $\frac{a^2\sqrt3}4$.`,res:R``,eq:R`S_{APC}=\frac{48\sqrt3}4=12\sqrt3`}]},

{id:'b42',topic:'bis',num:'42',code:'83761',level:4,
 cond:R`В треугольнике $ABC$ отрезки $AA_1$ и $BB_1$ — биссектрисы. Прямая $A_1B_1$ пересекает прямую $AB$ в точке $C_1$.<br><b>а)</b> Докажите, что $CC_1$ — биссектриса внешнего угла треугольника $ABC$.<br><b>б)</b> Найдите $CC_1$, если $AB=3$, $BC=2$, $AC=3{,}5$.`,
 ans:R`\sqrt{21}`,facts:['Б17','Б1','Б2','Б3'],
 fig(){const{A,B,C}=G.tri(3,2,3.5);const A1=G.bis(A,B,C),B1=G.bis(B,A,C),C1=G.inter(A1,B1,A,B),X=G.lerp(A,C,1.35);return{P:{A,B,C,A1,B1,C1,X},items:[
  ...triItems(),seg('A','A1',{c:'blue'}),seg('B','B1',{c:'blue'}),seg('B1','C1',{c:'green'}),seg('B','C1',{c:'gray',d:'6 5'}),seg('C','C1',{c:'red'}),
  arc('A','B','A1',{r:40,st:2}),arc('A','A1','C',{r:46,st:2}),arc('B','C','B1',{r:22,c:'teal',st:2}),arc('B','B1','A',{r:28,c:'teal',st:2}),
  seg('C','X',{c:'gray',d:'5 4',st:3}),arc('C','X','C1',{r:22,c:'orange',st:3}),arc('C','C1','B',{r:28,c:'orange',st:3}),
  mtx('B','C1','C₁B = 4',{st:4,dy:16,c:'orange'}),mtx('A','B','3',{st:4,dy:16,c:'orange'}),
  arc('B','A','C',{r:18,c:'purple',st:5}),poly(['C','B','C1'],'orange',{st:6}),mtx('C','C1','√21',{st:6,dy:-10,c:'red',bold:true}),
  pt('A'),pt('B'),pt('C'),pt('A1',{n:'A₁'}),pt('B1',{n:'B₁'}),pt('C1',{n:'C₁'})]}},
 steps:[
  {part:'а',t:'Теорема Менелая',do:R`Прямая $A_1B_1C_1$ пересекает стороны (продолжения сторон) треугольника $ABC$.`,res:R``,eq:R`\frac{AC_1}{C_1B}\cdot\frac{BA_1}{A_1C}\cdot\frac{CB_1}{B_1A}=1`,sc:['Б17']},
  {t:'Свойство биссектрис',do:R`Подставим отношения, в которых биссектрисы $AA_1$ и $BB_1$ делят стороны.`,res:R``,eq:R`\frac{BA_1}{A_1C}=\frac{AB}{AC},\qquad\frac{CB_1}{B_1A}=\frac{BC}{AB}`,sc:['Б1']},
  {t:'Вывод',do:R`Из Менелая: $\dfrac{AC_1}{C_1B}\cdot\dfrac{AB}{AC}\cdot\dfrac{BC}{AB}=1$.`,res:R`$C_1$ делит $AB$ внешним образом в отношении $AC:BC$ — это свойство биссектрисы внешнего угла $C$ (верно и обратное). Пункт а) доказан.`,eq:R`\frac{AC_1}{C_1B}=\frac{AC}{BC}`,sc:['Б2']},
  {part:'б',t:'Положение C₁',do:R`$\dfrac{AC_1}{C_1B}=\dfrac{3{,}5}{2}=\dfrac74$, точка $C_1$ за точкой $B$: $AC_1-C_1B=AB=3$.`,res:R``,eq:R`C_1B=4,\qquad AC_1=7`},
  {t:'Косинус угла B',do:R`Теорема косинусов в треугольнике $ABC$.`,res:R``,eq:R`\cos B=\frac{9+4-12{,}25}{2\cdot3\cdot2}=\frac1{16}`},
  {t:'Ответ',do:R`В треугольнике $CBC_1$ угол $B$ равен $180^\circ-\angle ABC$, его косинус $-\frac1{16}$. (Проверка: $CC_1^2=AC_1\cdot BC_1-AC\cdot BC=28-7$.)`,res:R``,eq:R`CC_1^2=4+16-2\cdot2\cdot4\cdot\left(-\tfrac1{16}\right)=21,\qquad CC_1=\sqrt{21}`,sc:['Б3']}]},

{id:'b43',topic:'bis',num:'43',code:'125949',level:5,
 cond:R`В прямоугольном треугольнике $ABC$ проведена высота $CH$ из вершины прямого угла, $AM$ и $CN$ — биссектрисы треугольников $ACH$ и $BCH$ соответственно.<br><b>а)</b> Докажите, что прямые $AM$ и $CN$ перпендикулярны.<br><b>б)</b> Найдите длину отрезка $MN$, если $BC=21$ и $\sin\angle ABC=\frac25$.`,
 ans:'6',facts:['Б11','Б1'],
 fig(){const C={x:0,y:0},B={x:21,y:0},A={x:0,y:2*Math.sqrt(21)};const H=G.foot(C,A,B),M=G.bis(A,C,H),N=G.bis(C,H,B),K=G.inter(A,M,C,N);return{P:{A,B,C,H,M,N,K},items:[
  ...triItems(),rt('C','B','A'),seg('C','H',{c:'gray'}),rt('H','C','B'),seg('A','K',{c:'blue'}),seg('C','N',{c:'blue'}),
  arc('C','H','B',{r:46,t:'α',st:1}),arc('A','C','B',{r:30,t:'α',st:1}),
  arc('A','C','M',{r:44,c:'green',st:2}),arc('C','H','N',{r:56,c:'green',st:2}),arc('C','N','B',{r:62,c:'green',st:2}),
  rt('K','A','C',{st:3}),
  poly(['A','C','N'],'orange',{st:4}),tick('A','C',1,{st:4}),tick('A','N',1,{st:4}),seg('M','N',{c:'red',st:4}),tick('M','C',2,{st:4,c:'red'}),tick('M','N',2,{st:4,c:'red'}),
  mtx('C','M','6',{st:6,dx:-10,c:'red',bold:true}),
  pt('A'),pt('B'),pt('C'),pt('H'),pt('M'),pt('N'),pt('K',{st:3})]}},
 steps:[
  {part:'а',t:'Равные углы',do:R`Пусть $\angle BAC=\alpha$. Углы $HCB$ и $BAC$ оба дополняют $\angle B$ до $90^\circ$.`,res:R``,eq:R`\angle HCB=\alpha,\qquad\angle ACH=90^\circ-\alpha`},
  {t:'Половины углов',do:R`$AM$ — биссектриса угла $CAH=\alpha$, $CN$ — биссектриса угла $HCB=\alpha$.`,res:R``,eq:R`\angle CAM=\tfrac\alpha2,\qquad\angle ACN=90^\circ-\alpha+\tfrac\alpha2=90^\circ-\tfrac\alpha2`},
  {t:'Прямой угол',do:R`Пусть $K$ — точка пересечения $AM$ и $CN$. В треугольнике $ACK$ сумма двух углов:`,res:R`Пункт а) доказан.`,eq:R`\angle CAK+\angle ACK=\tfrac\alpha2+90^\circ-\tfrac\alpha2=90^\circ\Rightarrow\angle AKC=90^\circ`},
  {part:'б',t:'MN = MC',do:R`$N$ лежит на $AB$, поэтому $AK$ — биссектриса угла $CAN$ и высота треугольника $ACN$.`,res:R`Треугольник $ACN$ равнобедренный, $AK$ — серединный перпендикуляр к $CN$, точка $M$ на нём.`,eq:R`MN=MC`,sc:['Б11']},
  {t:'Стороны треугольника',do:R`$\sin B=\frac25$, $\cos B=\frac{\sqrt{21}}5$; $BC=AB\cos B$.`,res:R``,eq:R`AB=5\sqrt{21},\ AC=2\sqrt{21},\ CH=\frac{AC\cdot BC}{AB}=\frac{42}5,\ AH=\frac{AC^2}{AB}=\frac{4\sqrt{21}}5`},
  {t:'Ответ',do:R`$AM$ — биссектриса треугольника $ACH$: $\dfrac{CM}{MH}=\dfrac{AC}{AH}=\dfrac52$.`,res:R``,eq:R`MN=CM=\frac57\cdot\frac{42}5=6`,sc:['Б1']}]},

{id:'b44',topic:'bis',num:'44',code:'30814',level:5,
 cond:R`На стороне острого угла с вершиной $A$ отмечена точка $B$. Из точки $B$ на биссектрису и на другую сторону угла опущены перпендикуляры $BC$ и $BD$ соответственно.<br><b>а)</b> Докажите, что $AC^2+CD^2=AD^2+BD^2$.<br><b>б)</b> Прямые $AC$ и $BD$ пересекаются в точке $T$. Найдите отношение $AT:TC$, если $\cos\angle ABC=\frac38$.`,
 ans:'46/9',facts:['Б15','Б8'],
 fig(){const f=G.deg(Math.asin(3/8));const A={x:0,y:0},X={x:13,y:0},Y=G.ray(A,2*f,13),Z=G.ray(A,f,13),B=G.ray(A,2*f,10);const C=G.foot(B,A,Z),D=G.foot(B,A,X),T=G.inter(A,C,B,D),Q=G.mid(A,B);return{P:{A,B,C,D,T,X,Y,Z,Q},items:[

  {part:'а',t:'Окружность на диаметре AB',do:R`$\angle ACB=\angle ADB=90^\circ$.`,res:R`Точки $C$ и $D$ лежат на окружности с диаметром $AB$.`,eq:R`A,\,B,\,C,\,D\ \text{на одной окружности}`,sc:['Б15']},
  {t:'Равные хорды',do:R`$AC$ — биссектриса: вписанные углы $BAC$ и $CAD$ равны.`,res:R`Они опираются на хорды $BC$ и $CD$, значит хорды равны.`,eq:R`BC=CD`,sc:['Б8']},
  {t:'Теорема Пифагора дважды',do:R`Треугольники $ACB$ и $ADB$ прямоугольные с общей гипотенузой $AB$.`,res:R`Пункт а) доказан.`,eq:R`AC^2+CD^2=AC^2+BC^2=AB^2=AD^2+BD^2`},
  {part:'б',t:'Угол φ',do:R`Пусть $\angle BAC=\varphi$, тогда $\angle BAD=2\varphi$, а $\angle ABC=90^\circ-\varphi$.`,res:R``,eq:R`\sin\varphi=\cos\angle ABC=\frac38`},
  {t:'Отрезок AT',do:R`$AC=AB\cos\varphi$, $AD=AB\cos2\varphi$. В прямоугольном треугольнике $ATD$ угол при $A$ равен $\varphi$.`,res:R``,eq:R`AT=\frac{AD}{\cos\varphi}=\frac{AB\cos2\varphi}{\cos\varphi}`},
  {t:'Отрезок TC',do:R`$TC=AC-AT$.`,res:R``,eq:R`TC=AB\cdot\frac{\cos^2\varphi-\cos2\varphi}{\cos\varphi}=AB\cdot\frac{\sin^2\varphi}{\cos\varphi}`},
  {t:'Ответ',do:R`Делим: $\cos2\varphi=1-2\sin^2\varphi=1-\frac{18}{64}=\frac{46}{64}$.`,res:R``,eq:R`\frac{AT}{TC}=\frac{\cos2\varphi}{\sin^2\varphi}=\frac{46/64}{9/64}=\frac{46}9`}]}
