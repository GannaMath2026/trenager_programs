<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffdf8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap&amp;subset=cyrillic" rel="stylesheet">
<title>Неравенства: разбор по шагам</title>
<style>
:root{
  --bg:#f3f1ec;--bg2:#ebe7de;--cd:#fffdf8;--tx:#1f2430;--mu:#6b6f7a;--br:#e2ddd2;--zb:#f6f3ec;
  --ac:#2f5bd3;--ac2:#7a3fd1;--ac3:#e8eefc;
  --ok:#1d9a55;--okbg:#e6f4ec;--bad:#d33c3c;--badbg:#fbeaea;--wa:#e0a11b;
  --ink:#1f2430;--axl:#8b8f9a;--arc:#2f5bd3;--hatch:#2f5bd3;--plus:#1d9a55;--minus:#d33c3c;--off:#b3b0a8;
  --sh:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);--sh2:0 20px 60px rgba(0,0,0,.35);
  --r:16px;--font-base:16px;color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#14161c;--bg2:#1a1d25;--cd:#1d2029;--tx:#e9ebf1;--mu:#9aa0ad;--br:#2e3341;--zb:#232733;
  --ac:#7c9bff;--ac2:#b08cff;--ac3:#262c45;
  --ok:#3ecf80;--okbg:#17302a;--bad:#ff6b6b;--badbg:#3a1d22;--wa:#f0b43c;
  --ink:#e9ebf1;--axl:#7a8091;--arc:#7c9bff;--hatch:#7c9bff;--plus:#3ecf80;--minus:#ff6b6b;--off:#5b6070;
  --sh:0 1px 2px rgba(0,0,0,.4);--sh2:0 20px 60px rgba(0,0,0,.6);color-scheme:dark;
}
body.text-small{--font-base:14px}body.text-medium{--font-base:16px}body.text-large{--font-base:19px}
*{box-sizing:border-box}
html{scroll-padding-top:70px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:var(--font-base)/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0)}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .08s}
button:active{transform:scale(.97)}
mjx-container{max-width:100%}
mjx-container[display="true"]{margin:.4em 0!important}

/* ---------- шапка ---------- */
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--cd);border-bottom:1px solid var(--br)}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:150px;cursor:pointer}
.logo{display:none}
.brand h1{margin:0;font-size:17px;font-weight:700;white-space:nowrap}
.brand small{color:var(--mu);font-weight:400;font-size:13px;margin-left:4px}
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;position:relative}
.hb,#fontSizeSel,.iconbtn{background:var(--cd);border:1px solid var(--br);border-radius:10px;padding:7px 11px;font-size:15px}
.hb.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.iconbtn{padding:7px 10px;line-height:1}
#btnMenu{display:none}
.menu{position:absolute;right:0;top:110%;background:var(--cd);border:1px solid var(--br);border-radius:12px;box-shadow:var(--sh2);padding:6px;z-index:60;min-width:270px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:8px 10px;margin:1px 0;font-size:15px}
.menu button:hover{background:var(--zb)}
.menu hr{border:0;border-top:1px solid var(--br);margin:4px 0}
main{max-width:900px;margin:0 auto;padding:12px 12px 40px}

/* ---------- базовые ---------- */
.card{background:var(--cd);border:1px solid var(--br);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sp{flex:1}
.btn{border:1px solid var(--br);background:var(--cd);border-radius:10px;padding:7px 11px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover:not(:disabled){border-color:var(--ac)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost.danger{border-color:transparent}
.btn.on{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.sm{padding:3px 8px;font-size:13px;border-radius:8px}
.btn.big{padding:11px 18px;font-weight:600;font-size:16px}
.meta{font-size:13px;color:var(--mu)}
.tag{font-size:12px;color:var(--mu)}
.dd{display:inline-block;width:10px;height:10px;border-radius:50%;flex:0 0 10px;font-size:0}
.d-basic{background:var(--ok)}.d-medium{background:var(--wa)}.d-hard{background:var(--bad)}
.stk{display:inline-block;font:700 12px/1 "Inter",sans-serif;letter-spacing:.4px;padding:5px 9px;border-radius:6px;transform:rotate(-4deg);box-shadow:0 2px 5px rgba(0,0,0,.25);white-space:nowrap;color:#fff;background:linear-gradient(135deg,#1fbf63,#0f8f48)}
.stk.hw{background:linear-gradient(135deg,#ff9f1c,#f26b1d);transform:rotate(3deg)}
.stk.go{background:linear-gradient(135deg,#8a5cf6,#5b3fd1);transform:rotate(2deg);font-size:11px}
.stk.ns{background:#9aa0ad;transform:none;box-shadow:none;font-weight:600}
.star{border:0;background:none;padding:0 2px;font-size:19px;color:var(--mu);line-height:1}
.star.on{color:#f5b301}
.tx{overflow-x:auto;overflow-y:hidden}
input.inp,select.inp,textarea.inp{border:1px solid var(--br);background:var(--cd);border-radius:10px;padding:7px 11px;outline:none}
input.inp:focus,select.inp:focus,textarea.inp:focus{border-color:var(--ac)}
.banner{background:#fff3b0;color:#5c4400;border-radius:12px;padding:8px 12px;margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- вход ---------- */
.login{max-width:520px;margin:30px auto}
.login .ttl{font-size:22px;font-weight:700;margin-bottom:10px}
.ulist{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.ulist span{display:inline-flex;gap:2px;align-items:center}

/* ---------- список ---------- */
.sum{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:8px}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters select,.filters input{border:1px solid var(--br);background:var(--cd);border-radius:10px;padding:7px 11px;min-width:0;max-width:100%}
.filters #fSec{flex:1 1 220px}
.filters input{flex:1;min-width:120px}
.gh{margin:22px 0 4px;font:700 26px/1.1 "Caveat",cursive;display:flex;align-items:baseline;gap:10px;color:var(--ac)}
.gh .cnt{font:500 13px "Inter";color:var(--mu)}
.sec{margin:12px 0 6px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px}
.ssh{margin:10px 0 6px 2px;font-size:13px;font-weight:600;color:var(--mu);letter-spacing:.2px}
.ssh::before{content:"— "}
.sec .cnt{font-size:12px;color:var(--mu);font-weight:500}
.pbar{height:6px;border-radius:4px;background:var(--br);overflow:hidden;flex:0 0 90px}
.pbar i{display:block;height:100%;background:var(--ok)}
.row{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--cd);border:1px solid var(--br);border-radius:12px;margin-bottom:6px;cursor:pointer;position:relative}
.row:hover{border-color:var(--ac)}
.row .ti{font-weight:600;white-space:nowrap}
.row .pv{flex:1;font-size:14px;color:var(--mu);overflow:hidden;white-space:nowrap;min-width:0;mask-image:linear-gradient(90deg,#000 85%,transparent);-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent)}
.row.done{background:color-mix(in srgb,var(--ok) 9%,var(--cd));border-left:5px solid var(--ok)}
.row .side{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.empty{text-align:center;color:var(--mu);padding:30px 10px}

/* ---------- задача ---------- */
.lbl{font:700 12px/1.2 "Inter";letter-spacing:.8px;text-transform:uppercase;color:var(--mu);margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cond{font-size:1.08em;margin-top:4px}
.modes{display:inline-flex;background:var(--zb);border:1px solid var(--br);border-radius:10px;padding:2px;gap:2px}
.modes button{border:0;background:transparent;border-radius:8px;padding:5px 11px;font-weight:600;font-size:13px;color:var(--mu)}
.modes button.on{background:var(--ac);color:#fff}
.stepnav{padding:10px 14px}
.step-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.step-head b{font-size:15px}.step-head b span{color:var(--mu);font-weight:500}
.prog{height:5px;border-radius:4px;background:var(--br);margin:10px 0 2px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .4s}
#stepSlider{display:block;width:100%;margin:8px 0 0;accent-color:var(--ac);cursor:pointer}
.step-scale{display:flex;justify-content:space-between;color:var(--mu);font-size:12px}
.trail{margin-bottom:12px}
.trail summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--mu);list-style:none;display:flex;align-items:center;gap:8px}
.trail summary::-webkit-details-marker{display:none}
.trail summary::before{content:"▸";transition:.2s}
.trail[open] summary::before{transform:rotate(90deg)}
.trail ol{list-style:none;margin:10px 0 0;padding:0}
.trail li{position:relative;padding:8px 12px 8px 44px;border-left:3px solid var(--ac);margin:0 0 8px;background:color-mix(in srgb,var(--ac) 4%,var(--cd));border-radius:0 12px 12px 0;cursor:pointer}
.trail li::before{content:attr(data-n);position:absolute;left:10px;top:9px;width:24px;height:24px;border-radius:50%;background:var(--ac);color:#fff;font:700 12px/24px "Inter";text-align:center}
.trail .te{overflow-x:auto;font-size:.95em}
.trail .ta{font-size:13px;color:var(--mu)}
.eq{font-size:1.28em;overflow-x:auto;overflow-y:hidden;padding:12px;text-align:center;background:var(--zb);border-radius:12px}
.eq.small{font-size:1.08em}
.fade-in{animation:fi .45s ease both}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.qc{border:2px solid var(--ac)}
.todo{position:relative;background:#fff8c4;color:#3b3200;border-radius:4px 4px 14px 4px;padding:16px 14px 12px;box-shadow:0 6px 14px rgba(0,0,0,.12);transform:rotate(-.6deg);margin:16px 2px 4px}
.todo .q{font:600 17px/1.4 "Inter",sans-serif;margin:0;color:#3b3200;overflow-x:auto}
.todo .tk{position:absolute;top:-10px;left:12px;background:#f26b1d;color:#fff;font:700 11px/1 "Inter";letter-spacing:.6px;text-transform:uppercase;padding:5px 8px;border-radius:6px;transform:rotate(-3deg)}
.todo mjx-container{color:#3b3200}
.action{position:relative;margin-top:14px;padding:10px 12px 10px 14px;border-left:3px solid var(--ok);background:color-mix(in srgb,var(--ok) 7%,var(--cd));border-radius:0 12px 12px 0;white-space:pre-line;overflow-x:auto;line-height:1.6}
.action .ah{font:700 12px/1 "Inter";letter-spacing:.6px;text-transform:uppercase;color:var(--ok);margin-bottom:6px;white-space:normal}
.result{margin-top:12px}
.result .arrow{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:13px;font-weight:600;margin-bottom:6px}
.stepbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;align-items:center}
.stepbtns .sp{flex:1}
.kbd{font-size:12px;color:var(--mu)}
.kbd kbd{border:1px solid var(--br);border-bottom-width:2px;border-radius:6px;padding:0 5px;font:inherit;font-size:11px;background:var(--zb)}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{text-align:left;border:1px solid var(--br);background:var(--cd);border-radius:12px;padding:11px 12px;line-height:1.5;overflow-x:auto}
.opt:hover{border-color:var(--ac)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--cd));animation:shake .35s}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--cd))}
.opt .why{font-size:13px;color:var(--bad);margin-top:6px}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.final{text-align:center;padding:22px 10px}
.final .big{display:inline-block;font:700 30px/1.1 "Caveat",cursive;background:#c8f7c5;color:#0f5a2c;padding:14px 26px;transform:rotate(-3deg);box-shadow:0 6px 16px rgba(0,0,0,.18);border-radius:4px;margin-bottom:10px}
.solution-answer{margin:14px auto 6px;padding:10px 14px;border-radius:12px;background:var(--zb);text-align:left;font-size:1.1em;overflow-x:auto;max-width:640px}
.allstep{position:relative;padding:10px 12px 10px 44px;border-left:3px solid var(--ac);margin:0 0 12px;background:color-mix(in srgb,var(--ac) 4%,var(--cd));border-radius:0 12px 12px 0}
.allstep::before{content:attr(data-n);position:absolute;left:10px;top:10px;width:24px;height:24px;border-radius:50%;background:var(--ac);color:#fff;font:700 12px/24px "Inter";text-align:center}
.allstep .todo{transform:none;margin:12px 0 4px;box-shadow:0 3px 8px rgba(0,0,0,.08)}
.nochain{text-align:center;color:var(--mu);padding:24px}
.dock{display:none}

/* ---------- ось ---------- */
.axbox{margin-top:14px;border:1px solid var(--br);border-radius:12px;padding:10px 10px 8px;background:var(--cd)}
.ax-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.ax-in{position:relative;margin:0 auto}
.ax svg{display:block;width:100%;height:auto;overflow:visible}
.ax .axl{stroke:var(--axl);stroke-width:2}
.ax .axa{fill:var(--axl)}
.ax .axv{fill:var(--ink);font:italic 20px "Times New Roman",serif}
.ax .arc{fill:none;stroke:var(--arc);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0}
.ax .odz{fill:none;stroke:var(--bad);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0}
.lg-odz{width:22px;height:9px;border:2.4px solid var(--bad);border-bottom:0;border-radius:5px 5px 0 0;display:inline-block}
.ax .arc.out{stroke:var(--off);stroke-dasharray:.035 .03;stroke-width:2;opacity:.75}
.ax .hl{stroke:var(--hatch);stroke-width:2.2;opacity:.85}
.ax .sol{stroke:var(--hatch);stroke-width:5;stroke-linecap:round;opacity:.9}
.ax .sg{font:800 24px system-ui,sans-serif}
.ax .sg-plus{fill:var(--plus)}.ax .sg-minus{fill:var(--minus)}
.ax .sg.out{fill:var(--off);opacity:.75}
.ax .strike{stroke:var(--off);stroke-width:2.2;stroke-linecap:round}
.ax .pc{fill:var(--ink);stroke:var(--ink);stroke-width:2}
.ax .po{fill:var(--cd);stroke:var(--ink);stroke-width:2.6}
.ax .mk{font:900 22px system-ui,sans-serif;fill:var(--bad);paint-order:stroke;stroke:var(--cd);stroke-width:5px;stroke-linejoin:round}
.ax-lbl{position:absolute;transform:translateX(-50%);white-space:nowrap;font-size:15px;color:var(--ink);line-height:1.2;pointer-events:none}
.ax-ans{text-align:center;font-size:1.05em;margin-top:6px;overflow-x:auto}
.ax-ans mjx-container{font-size:100%!important;display:inline-block!important;margin:0!important}
.ax-ans b{color:var(--mu);font-size:13px;font-weight:600;margin-right:6px}
.ax-legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:12px;color:var(--mu);margin-top:8px}
.ax-legend span{display:inline-flex;align-items:center;gap:5px}
.lg-dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);display:inline-block}
.lg-dot.f{background:var(--ink)}
.lg-ex{color:var(--bad);font-weight:900}
.lg-off{color:var(--off);font-weight:900;text-decoration:line-through}
.lg-h{width:22px;height:11px;border-bottom:3px solid var(--hatch);background:repeating-linear-gradient(135deg,var(--hatch) 0 2px,transparent 2px 6px);opacity:.85;display:inline-block}
.ax .L{transition:opacity .45s ease}
.ax:not(.on-odz) .L-odz,.ax:not(.on-pts) .L-pts,.ax:not(.on-mark) .L-mark,.ax:not(.on-arcs) .L-arcs,.ax:not(.on-signs) .L-signs,.ax:not(.on-shade) .L-shade,.ax:not(.on-ans) .L-ans{opacity:0}
.ax:not(.on-ans) .L-ans{height:0;overflow:hidden;margin:0}
.ax.on-arcs .arc:not(.out){animation:axdraw .9s ease both}
.ax.on-odz .odz{animation:axdraw .8s ease both}
.ax.on-mark .mk{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:center}
.ax.on-signs .sg{animation:pop .4s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:center}
.ax.static .arc,.ax.static .odz,.ax.static .mk,.ax.static .sg{animation:none!important}
.ax.static .L{transition:none}
@keyframes axdraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
.axctl{border-top:1px dashed var(--br);margin-top:10px;padding-top:10px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pill{border:1px solid var(--br);background:var(--cd);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--mu)}
.pill.done{background:var(--ac3);color:var(--ac);border-color:transparent}
.pill.cur{background:var(--ac);color:#fff;border-color:var(--ac)}
.axcap{font-size:14px;min-height:2.6em}
.axbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* ---------- модалка ---------- */
.modal{position:fixed;inset:0;background:rgba(10,12,20,.55);z-index:1000;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:20px 10px}
.modal-box{background:var(--bg);border-radius:18px;width:100%;max-width:820px;padding:14px;box-shadow:var(--sh2);display:flex;flex-direction:column;max-height:none}
.modal-box h3{margin:0 0 12px;font-size:18px}
.modal-body{min-height:0}
.modal-box textarea{width:100%;min-height:320px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.modal-foot{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--br);background:var(--cd);border-radius:10px;padding:6px 12px;font-weight:600;font-size:14px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.drop{display:block;border:2px dashed var(--br);border-radius:14px;padding:20px;text-align:center;color:var(--mu);cursor:pointer;background:var(--cd)}
.drop.over{border-color:var(--ac);color:var(--ac)}
.radio{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0}
.radio label,.print-fields label,.print-task-list label{display:flex;align-items:center;gap:8px;cursor:pointer}
.print-fields{display:flex;gap:12px 22px;flex-wrap:wrap;padding:12px;background:var(--cd);border:1px solid var(--br);border-radius:12px;margin-bottom:12px}
.print-task-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.print-task-list{max-height:38vh;overflow:auto;border:1px solid var(--br);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;background:var(--cd)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--ac)}
.axe-grid{display:grid;gap:6px}
.axe-row{display:grid;grid-template-columns:28px 1fr 150px 70px 76px;gap:6px;align-items:center}
.axe-row.iv{grid-template-columns:1fr 92px 80px 92px 86px}
.axe-row .n{font-weight:700;color:var(--mu);font-size:13px;text-align:center}
.axe-row .inp{padding:6px 8px;font-size:13px;width:100%}
.axe-row label{font-size:13px;display:flex;gap:5px;align-items:center;white-space:nowrap}
.axe-sec{font-weight:700;font-size:12px;color:var(--mu);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.6px}
.axe-ivname{font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* ---------- тост ---------- */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140px);background:#222;color:#fff;padding:10px 16px;border-radius:12px;z-index:2000;transition:.3s;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}

/* ---------- теория (стикеры) ---------- */
.theory-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;padding:6px 4px 10px}
.sticker{position:relative;padding:22px 14px 14px;color:#2b2a26;box-shadow:0 8px 16px rgba(0,0,0,.15);border-radius:2px 2px 14px 2px;font-size:15px}
.sticker:nth-child(3n){transform:rotate(1.2deg)}.sticker:nth-child(3n+1){transform:rotate(-1deg)}.sticker:nth-child(3n+2){transform:rotate(.5deg)}
.sticker::before{content:"";position:absolute;top:-9px;left:50%;width:70px;height:20px;margin-left:-35px;background:rgba(255,255,255,.55);box-shadow:0 1px 3px rgba(0,0,0,.15);transform:rotate(-2deg)}
.sticker h3{margin:0 0 6px;font:700 24px/1.1 "Caveat",cursive}
.sticker p{margin:6px 0;overflow-x:auto}
.sticker .ex{background:rgba(255,255,255,.55);border-radius:8px;padding:6px 8px;margin-top:8px;overflow-x:auto;text-align:center}
.sticker mjx-container{color:#2b2a26}
.sticker.wide{grid-column:1/-1;transform:none;background:var(--cd)!important;color:var(--tx);border:1px solid var(--br);border-radius:14px}
.sticker.wide::before{display:none}
.sticker.wide mjx-container{color:var(--tx)}
.st-blue{background:#bfe3ff}.st-green{background:#c8f7c5}.st-purple{background:#ffc1d9}.st-orange{background:#ffd7a8}.st-red{background:#fff59d}.st-cyan{background:#d6f5f0}

/* ---------- адаптив ---------- */
@media (max-width:760px){
  #btnMenu{display:inline-block}
  .actions{display:none;position:absolute;top:100%;right:8px;left:8px;flex-direction:column;align-items:stretch;background:var(--cd);border:1px solid var(--br);border-radius:14px;padding:8px;box-shadow:var(--sh2)}
  header.open .actions{display:flex}
  .actions .hb,#fontSizeSel{text-align:left}
  .actions .menu{position:static;box-shadow:none;border:0;padding:0;min-width:0}
}
@media (max-width:600px){
  main{padding:8px 8px 104px}
  .card{padding:11px}
  .row{flex-wrap:wrap;gap:6px 10px}
  .row .pv{order:5;flex-basis:100%;white-space:normal;mask-image:none;-webkit-mask-image:none;overflow-x:auto}
  .eq{font-size:1.1em;padding:10px 6px}
  .brand small{display:none}
  .hide-m{display:none!important}
  .axe-row{grid-template-columns:18px 1fr 96px 30px 62px;gap:4px}
  .axe-row select.inp{font-size:12px;padding:6px 4px}
  .axe-row.iv{grid-template-columns:1fr 72px;row-gap:4px}
  body.in-task .dock{display:flex;position:fixed;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:60;gap:8px;padding:8px;border-radius:16px;background:var(--cd);border:1px solid var(--br);box-shadow:var(--sh2)}
  .dock .btn{flex:none;width:52px;padding:11px 0}
  .dock .btn.pri{flex:1;width:auto}
  body.in-task .stepbtns{display:none}
  .theory-grid{grid-template-columns:1fr}
}
@media print{header,.dock,#modalRoot,.btn,.stepnav{display:none!important}body{background:#fff}}

  SEED_AT = Number($('seed').dataset.saved || 0);
  SET = Object.assign(SET, lsGet('set')||{});
  const d = lsGet('draft');
  if (d && d.savedAt > SEED_AT && Array.isArray(d.tasks) && d.tasks.length){ T = d.tasks; DRAFT = true; }
  else { T = embedded.slice(); if (d) lsDel('draft'); }
  if (!lsGet('migr')){

    try { const old = JSON.parse(localStorage.getItem('ineq.v3.tasks')||'null'); let add = 0;
      if (Array.isArray(old)) old.forEach(t => { if (t && t.id && !T.some(x=>String(x.id)===String(t.id))){ T.push(t); add++; } });
      if (add) persistTasks(); } catch(e){}
    try { const os = JSON.parse(localStorage.getItem('ineq.v2.s')||'null');
      if (os && Object.keys(os).some(k=>os[k] && (os[k].done||os[k].fav||os[k].hw))){ const u = lsGet('users')||[]; if (u.indexOf('Без имени')<0){ u.push('Без имени'); lsSet('users', u); } lsSet('p:Без имени', os); } } catch(e){}

  USERS = lsGet('users') || []; ME = lsGet('me') || ''; if (ME && USERS.indexOf(ME)<0) ME = '';
  S = ME ? (lsGet('p:'+ME) || {}) : {};

}

/* =====================================================================
   МЕТОД ИНТЕРВАЛОВ: модель и отрисовка
   axis = { var?, points:[{x,label,type:'open'|'closed'|'hidden',mark?:'!'}],
            intervals:[{from,to,label?:'+'|'-',arc?,shade?,out?}] }
   Скрытые крайние точки означают −∞ и +∞. out:true — промежуток вне ОДЗ.
   ===================================================================== */
const isInf = v => v==='-Infinity'||v===-Infinity||v==='+Infinity'||v==='Infinity'||v===Infinity;
function normAxis(axis){
  if (!axis || typeof axis!=='object') return null;
  const pts = (axis.points||[]).slice().sort((a,b)=>Number(a.x)-Number(b.x));
  const vis = pts.filter(p=>p.type!=='hidden');
  const n = vis.length;
  const bIdx = v => {
    if (v==='-Infinity'||v===-Infinity) return 0;
    if (isInf(v)) return n+1;
    const p = pts.find(q => Number(q.x)===Number(v));
    if (!p) return null;
    if (p.type==='hidden'){
      if (!n) return p===pts[0] ? 0 : 1;
      if (Number(p.x) < Number(vis[0].x)) return 0;
      if (Number(p.x) > Number(vis[n-1].x)) return n+1;
      return null;
    }
    return vis.indexOf(p)+1;
  };
  const ivs = new Array(n+1).fill(null);
  for (const it of (axis.intervals||[])) {
    let a = bIdx(it.from), b = bIdx(it.to);
    if (a==null || b==null) continue;
    if (a>b) [a,b]=[b,a];
    if (b===n+1 && n===0 && a===0) { ivs[0]=it; continue; }
    for (let k=a; k<b && k<=n; k++) ivs[k] = it;
  }
  return {pts:vis, ivs, n};
}
const sgnOf = it => { const l=String(it&&it.label||'').trim(); return l==='+'?'+':(l==='-'||l==='−'||l==='–')?'-':''; };
const arcOf = it => !!it && (it.arc===true || (it.arc===undefined && !!sgnOf(it)));

function axisAnswer(axis, v){
  const N = normAxis(axis); if (!N) return '';
  const {pts, ivs, n} = N;
  // последовательность I0 P1 I1 ... Pn In
  const seq = [];
  for (let k=0;k<=n;k++){
    seq.push({kind:'I',k,inc:!!(ivs[k]&&ivs[k].shade&&!ivs[k].out)});
    if (k<n) seq.push({kind:'P',k:k+1,inc:pts[k].type==='closed'});
  }
  const lab = k => String(pts[k-1].label||pts[k-1].x);
  const parts = [];
  let i=0;
  while (i<seq.length){
    if (!seq[i].inc){ i++; continue; }
    let j=i; while (j+1<seq.length && seq[j+1].inc) j++;
    const a=seq[i], b=seq[j];
    if (a===b && a.kind==='P') parts.push('\\{'+lab(a.k)+'\\}');
    else {
      const L = a.kind==='P' ? '['+lab(a.k) : (a.k===0 ? '(-\\infty' : '('+lab(a.k));
      const R = b.kind==='P' ? lab(b.k)+']' : (b.k===n ? '+\\infty)' : lab(b.k+1)+')');
      parts.push(L+';\\ '+R);
    }
    i=j+1;
  }
  if (!parts.length) return (v||'x')+'\\in\\varnothing';
  return (v||'x')+'\\in '+parts.join('\\cup ');
}

function odzRuns(N){
  const {pts, ivs, n} = N;
  if (!(ivs.some(it => it && it.out) || pts.some(p => p.nodz))) return null;
  const runs = []; let a = null;
  for (let k=0;k<=n;k++){
    const inK = !(ivs[k] && ivs[k].out);
    if (inK && a===null) a = k;
    const brk = !inK || (k<n && pts[k].nodz) || k===n;
    if (a!==null && brk){ const b = inK ? k : k-1; if (b>=a) runs.push([a,b]); a = null; }
  }
  return runs;
}
function axisStages(axis){
  const N = normAxis(axis); if (!N) return [];
  const st = [];
  const hasOut = N.ivs.some(it=>it&&it.out);
  if (N.n) st.push({k:'pts', s:'Точки', c:'Отмечаем точки: <b>закрашенные</b> ● входят в ответ, <b>выколотые</b> ○ — нет (нули знаменателя, строгое неравенство, границы ОДЗ).'});
  if (odzRuns(N)) st.push({k:'odz', s:'ОДЗ', c:'Отмечаем ОДЗ <b style="color:var(--bad)">красной дугой</b> — этажом выше. Знаки будем ставить только под ней.'});
  if (N.pts.some(p=>p.mark==='!')) st.push({k:'mark', s:'Кратность «!»', c:'Корни <b>чётной кратности</b> отмечаем «!» — при переходе через них знак <b>не меняется</b>.'});
  if (N.ivs.some(arcOf)) st.push({k:'arcs', s:'Дуги', c:'Рисуем дуги между соседними точками. Крайние дуги уходят в бесконечность.'});
  if (N.ivs.some(it=>sgnOf(it))) st.push({k:'signs', s:'Знаки', c:'Расставляем знаки — только в пределах ОДЗ.' + (hasOut ? ' Вне ОДЗ знак бледный и зачёркнут: его там быть не должно.' : ' Начинаем справа и идём влево, учитывая «!».')});
  if (N.ivs.some(it=>it&&it.shade)) st.push({k:'shade', s:'Штриховка', c:'Штрихуем промежутки, которые подходят под знак неравенства.'});
  if (showAns(axis)) st.push({k:'ans', s:'Ответ', c:'Записываем ответ по рисунку.'});
  return st;
}

const showAns = (axis, v) => axis.ans===true || (axis.ans!==false && String(v||axis.var||'x')==='x');
let AXUID = 0;
function fx(v){ return Math.round(v*10)/10; }
function axisHTML(axis, o){
  o = o || {};
  const N = normAxis(axis); if (!N) return '';
  const v = o.v || axis.var || 'x';
  const uid = 'ax' + (++AXUID) + Math.random().toString(36).slice(2,6);
  const {pts, ivs, n} = N;
  const long = pts.some(p => /log|sqrt|frac/.test(String(p.label||'')) || String(p.label||'').length>8);
  const M = n<=1 ? 150 : 100, gap = long ? 150 : 118;
  const runs = odzRuns(N);
  const W = 2*M + Math.max(0,n-1)*gap, Hh = runs ? 152 : 132, y = runs ? 104 : 84, h = 40, L = 8, R = W-24;
  const X = k => M + (k-1)*gap;
  let defs = `<pattern id="${uid}h" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" class="hl"/></pattern>`;
  let gShade='', gArcs='', gSigns='', gPts='', gMark='', lbls='', gOdz='';
  const used = {closed:false, open:false, mark:false, out:false, shade:false, odz:!!runs};
  if (runs){
    const yo = y - h - 22, r = 9, yb = y - 8;
    runs.forEach(([a,b], j) => {
      const li = a===0, ri = b===n, x1 = li ? L : X(a), x2 = ri ? R : X(b+1);
      let d;
      if (li && ri) d = `M${L+4} ${yo} L${R-6} ${yo}`;
      else if (li) d = `M${x2} ${yb} L${x2} ${yo+r} Q${x2} ${yo} ${x2-r} ${yo} L${L+4} ${yo}`;
      else if (ri) d = `M${x1} ${yb} L${x1} ${yo+r} Q${x1} ${yo} ${x1+r} ${yo} L${R-6} ${yo}`;
      else d = `M${x1} ${yb} L${x1} ${yo+r} Q${x1} ${yo} ${x1+r} ${yo} L${x2-r} ${yo} Q${x2} ${yo} ${x2} ${yo+r} L${x2} ${yb}`;
      let mk = '';
      if (li || ri){
        const gid = uid+'og'+j, mid = uid+'om'+j; let gx1, gx2, stops;
        if (li && ri){ gx1 = L; gx2 = R; stops = '<stop offset="0" stop-color="#000"/><stop offset=".2" stop-color="#fff"/><stop offset=".8" stop-color="#fff"/><stop offset="1" stop-color="#000"/>'; }
        else { gx1 = ri ? x1+40 : x2-40; gx2 = ri ? R-2 : L+2; stops = '<stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/>'; }
        defs += `<linearGradient id="${gid}" gradientUnits="userSpaceOnUse" x1="${fx(gx1)}" y1="0" x2="${fx(gx2)}" y2="0">${stops}</linearGradient><mask id="${mid}" maskUnits="userSpaceOnUse" x="-10" y="-10" width="${W+20}" height="${Hh+20}"><rect x="-10" y="-10" width="${W+20}" height="${Hh+20}" fill="url(#${gid})"/></mask>`;
        mk = ` mask="url(#${mid})"`;
      }
      gOdz += `<g${mk}><path class="odz" pathLength="1" d="${d}"/></g>`;
    });
  }

  for (let k=0;k<=n;k++){
    const it = ivs[k]; if (!it) continue;
    const li = (k===0), ri = (k===n);
    const x1 = li ? L : X(k), x2 = ri ? R : X(k+1);
    const arc = arcOf(it), sg = sgnOf(it);
    let path, area, sx;
    if (li && ri){ path=`M${L+4} ${y-h} L${R-6} ${y-h}`; area=`M${L} ${y} L${L} ${y-h} L${R} ${y-h} L${R} ${y} Z`; sx=W/2; }
    else if (ri){ path=`M${x1} ${y} C${fx(x1+9)} ${fx(y-h*1.05)} ${fx(x1+26)} ${y-h} ${fx(x1+56)} ${y-h} L${R-6} ${y-h}`; area=path+` L${R-6} ${y} Z`; sx=x1+Math.min(58,(R-x1)/2); }
    else if (li){ path=`M${x2} ${y} C${fx(x2-9)} ${fx(y-h*1.05)} ${fx(x2-26)} ${y-h} ${fx(x2-56)} ${y-h} L${L+4} ${y-h}`; area=path+` L${L+4} ${y} Z`; sx=x2-Math.min(58,(x2-L)/2); }
    else { const d=x2-x1; path=`M${x1} ${y} C${fx(x1+d*.16)} ${fx(y-h*1.33)} ${fx(x2-d*.16)} ${fx(y-h*1.33)} ${x2} ${y}`; area=path+' Z'; sx=(x1+x2)/2; }
    if (!arc){ const bh=18; area=`M${li?L:x1} ${y} L${li?L:x1} ${y-bh} L${ri?R:x2} ${y-bh} L${ri?R:x2} ${y} Z`; }
    let mask = '';
    if (li || ri){
      const gid=uid+'g'+k, mid=uid+'m'+k;
      let stops, gx1, gx2;
      if (li && ri){ gx1=L; gx2=R; stops='<stop offset="0" stop-color="#000"/><stop offset=".25" stop-color="#fff"/><stop offset=".75" stop-color="#fff"/><stop offset="1" stop-color="#000"/>'; }
      else { gx1 = ri ? x1+40 : x2-40; gx2 = ri ? R-2 : L+2; stops='<stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/>'; }
      defs += `<linearGradient id="${gid}" gradientUnits="userSpaceOnUse" x1="${fx(gx1)}" y1="0" x2="${fx(gx2)}" y2="0">${stops}</linearGradient><mask id="${mid}" maskUnits="userSpaceOnUse" x="-10" y="-10" width="${W+20}" height="${Hh+20}"><rect x="-10" y="-10" width="${W+20}" height="${Hh+20}" fill="url(#${gid})"/></mask>`;
      mask = ` mask="url(#${mid})"`;
    }
    if (it.shade && !it.out){
      used.shade = true;
      gShade += `<g${mask}><path d="${area}" fill="url(#${uid}h)"/><line class="sol" x1="${li?L:x1}" y1="${y}" x2="${ri?R:x2}" y2="${y}"/></g>`;
    }
    if (arc){
      gArcs += `<g${mask}><path class="arc${it.out?' out':''}" pathLength="1" d="${path}" style="animation-delay:${(k*0.12).toFixed(2)}s"/></g>`;
    }
    if (sg){
      const sy = y - (arc ? h*0.42 : 30);
      if (it.out) used.out = true;
      gSigns += `<text class="sg ${sg==='+'?'sg-plus':'sg-minus'}${it.out?' out':''}" x="${fx(sx)}" y="${fx(sy)}" text-anchor="middle" dominant-baseline="central" style="animation-delay:${(0.12*(n-k)).toFixed(2)}s">${sg==='+'?'+':'−'}</text>`;
      if (it.out) gSigns += `<line class="strike" x1="${fx(sx-11)}" y1="${fx(sy+10)}" x2="${fx(sx+11)}" y2="${fx(sy-10)}"/>`;
    }
  }
  pts.forEach((p,i)=>{
    const cx = X(i+1);
    if (p.type==='closed'){ used.closed=true; gPts += `<circle class="pc" cx="${cx}" cy="${y}" r="6"/>`; }
    else { used.open=true; gPts += `<circle class="po" cx="${cx}" cy="${y}" r="6"/>`; }
    if (p.mark==='!'){ used.mark=true; gMark += `<text class="mk" x="${cx}" y="${y-30}" text-anchor="middle" dominant-baseline="central">!</text>`; }
    const lab = String(p.label!=null && p.label!=='' ? p.label : p.x);
    lbls += `<div class="ax-lbl L L-pts" style="left:${(cx/W*100).toFixed(2)}%;top:${((y+13)/Hh*100).toFixed(2)}%">\\(${H(lab)}\\)</div>`;
  });

  const svg = `<svg viewBox="0 0 ${W} ${Hh}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Числовая ось">
    <defs>${defs}</defs>
    <g class="L L-shade">${gShade}</g>
    <line class="axl" x1="${L}" y1="${y}" x2="${W-8}" y2="${y}"/>
    <path class="axa" d="M${W-3} ${y} l-12 -5.5 v11 z"/>
    <text class="axv" x="${W-14}" y="${y+26}" text-anchor="middle">${H(v)}</text>
    <g class="L L-odz">${gOdz}</g>
    <g class="L L-arcs">${gArcs}</g>
    <g class="L L-signs">${gSigns}</g>
    <g class="L L-pts">${gPts}</g>
    <g class="L L-mark">${gMark}</g>
  </svg>`;
  const stages = axisStages(axis).map(s=>s.k);
  const stage = o.stage==null ? stages.length-1 : o.stage;
  const on = stages.slice(0, stage+1).map(k=>'on-'+k).join(' ');
  const ans = (o.noAnswer || !showAns(axis, v)) ? '' : `<div class="ax-ans L L-ans"><b>Ответ по рисунку:</b>\\(${axisAnswer(axis, v)}\\)</div>`;

}
function setAxStage(box, idx){

function guessVar(step, axis){
  if (axis && axis.var) return axis.var;
  const m = String(step&&step.q||'').match(/\$\s*([a-zA-Z])\s*\$/);
  if (m) return m[1];
  const e = String(step&&step.e||'').replace(/\\[a-zA-Z]+/g,' ');
  if (/(^|[^a-zA-Z])t([^a-zA-Z]|$)/.test(e) && !/(^|[^a-zA-Z])x([^a-zA-Z]|$)/.test(e)) return 't';
  return 'x';
}

function GRP(){ return [...new Set(T.map(t=>t.g))]; }
function SEC(g){ return [...new Set(T.filter(t => !g || t.g===g).map(t=>t.s))]; }
function okf(t, st){

}

async function download(name, text, type){
  if (window.claude && typeof window.claude.use === 'function'){
    try {
      const dl = await window.claude.use('downloads');
      if (dl){ await dl.save({filename:name, data:text}); return true; }
    } catch(e){ if (e && e.code==='declined') { toast('Сохранение отменено'); return false; } }
  }
  const blob = new Blob([text], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
  return true;
}

function mergeTasks(arr, replace){
  if (replace) T = [];
  let added=0, upd=0, skipped=0;
  for (const src of arr){
    if (!src || typeof src!=='object' || Array.isArray(src)){ skipped++; continue; }
    const t = Object.assign({}, src);
    if (!t.id) t.id = Date.now()+Math.floor(Math.random()*100000)+added;
    if (!t.n) t.n = String(T.length+added+1).padStart(3,'0');
    if (!t.s) t.s = 'Без раздела';
    if (!t.d) t.d = 'basic';
    if (!t.c) t.c = t.t || '';
    const i = T.findIndex(x => String(x.id)===String(t.id));
    if (i>=0){ T[i] = Object.assign({}, T[i], t); upd++; } else { T.push(t); added++; }
  }
  sortT(); persistTasks();
  return {added, upd, skipped};
}

        <div class="meta" style="margin-top:6px">Поля: <code>g</code> — тип (Показательные / Логарифмические), <code>s</code> — метод, <code>ss</code> — подраздел, <code>o</code> — порядок; <code>t</code> — условие, <code>c</code> — для карточки, <code>a</code> — ответ, <code>ch</code> — шаги <code>{e, q, o:[{t, ok, axis?, why?}]}</code>. Несколько вариантов в <code>o</code> → режим выбора.</div></div>
      <div id="tabAxis" hidden></div>
    </div>
    <div class="modal-foot"><button class="btn ghost" id="cancelEdit">Отмена</button><button class="btn pri" id="saveEdit">Сохранить</button></div>
  </div>`);
  $('editJson').value = JSON.stringify(obj, null, 2);
  const sync = () => { try { obj = JSON.parse($('editJson').value); return true; } catch(e){ toast('Ошибка JSON: '+e.message); return false; } };
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
    if (b.dataset.tab==='axis'){ if (!sync()) return; }
    document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on', x===b));
    $('tabJson').hidden = b.dataset.tab!=='json';
    $('tabAxis').hidden = b.dataset.tab!=='axis';
    if (b.dataset.tab==='axis') axisEditor(obj, newObj => { obj=newObj; $('editJson').value = JSON.stringify(obj,null,2); });
    else $('editJson').value = JSON.stringify(obj, null, 2);
  });
  $('cancelEdit').onclick = closeModal;
  $('saveEdit').onclick = () => {
    if (!$('tabJson').hidden && !sync()) return;
    const parsed = obj;
    if (!parsed || typeof parsed!=='object' || !parsed.id){ toast('Некорректный объект (нет id)'); return; }
    if (isNew) T.push(parsed);
    else { const idx=T.findIndex(x=>String(x.id)===String(originalId)); if (idx>=0) T[idx]=parsed; else T.push(parsed); }
    sortT(); persistTasks(); closeModal(); toast('Сохранено');
    if (cur && String(cur.id)===String(originalId)) openT(parsed.id, true); else menu();
  };
}

function axisEditor(obj, onChange){
  const box = $('tabAxis');
  const steps = Array.isArray(obj.ch) ? obj.ch : (obj.ch = []);
  const idxs = steps.map((s,i)=>i).filter(i=>!isEnd(steps[i]));
  if (!idxs.length){ box.innerHTML = '<div class="meta">В задаче пока нет шагов. Добавьте шаги в JSON (поле <code>ch</code>).</div>'; return; }
  let si0 = idxs.find(i => { const c=correctOption(steps[i]); return c&&c.axis; });
  if (si0==null) si0 = idxs[idxs.length-1];
  let model;
  const load = i => {
    const c = correctOption(steps[i]), ax = c && c.axis;
    const N = normAxis(ax||{points:[],intervals:[]});
    model = { v: (ax&&ax.var) || guessVar(steps[i], ax), pts: N.pts.map(p=>({label:String(p.label!=null&&p.label!==''?p.label:p.x), type:p.type==='closed'?'closed':'open', mark:p.mark==='!', nodz:!!p.nodz})),
      ivs: N.ivs.map(it=>({sign:sgnOf(it), arc:it?arcOf(it):true, shade:!!(it&&it.shade), out:!!(it&&it.out)})) };
    if (!model.pts.length){ model.pts=[{label:'0',type:'open',mark:false}]; model.ivs=[{sign:'-',arc:true,shade:false,out:false},{sign:'+',arc:true,shade:false,out:false}]; }
  };
  const toAxis = () => {
    const n = model.pts.length;
    const points = [{x:0,label:'',type:'hidden'}].concat(model.pts.map((p,i)=>{ const d={x:i+1,label:p.label,type:p.type}; if(p.mark)d.mark='!'; if(p.nodz)d.nodz=true; return d; }), [{x:n+1,label:'',type:'hidden'}]);
    const intervals = model.ivs.map((it,k)=>{ const d={from:k,to:k+1}; if(it.sign)d.label=it.sign; d.arc=!!it.arc; if(it.shade)d.shade=true; if(it.out)d.out=true; return d; });
    return {var:model.v, points, intervals};
  };
  const ivName = k => { const n=model.pts.length; const a=k===0?'−∞':model.pts[k-1].label, b=k===n?'+∞':model.pts[k].label; return `(${a}; ${b})`; };
  const autoSigns = () => {
    let s = '+';
    for (let k=model.ivs.length-1;k>=0;k--){
      model.ivs[k].sign = s;
      const p = model.pts[k-1];
      if (p && !p.mark) s = s==='+'?'-':'+';
    }
  };
  const render = () => {
    const ax = toAxis();
    box.innerHTML = `
      <div class="bar" style="margin-bottom:8px">
        <label class="meta">Шаг: <select id="axStep" class="inp" style="max-width:420px">${idxs.map(i=>`<option value="${i}" ${i===si0?'selected':''}>${i+1}. ${H(cleanQ(steps[i].q||'').slice(0,60))}${(()=>{const c=correctOption(steps[i]);return c&&c.axis?' 📐':''})()}</option>`).join('')}</select></label>
        <label class="meta">Переменная <input id="axVar" class="inp" style="width:56px" value="${A(model.v)}"></label>
      </div>
      <div class="axe-sec">Точки (слева направо, подпись в LaTeX)</div>
      <div class="axe-grid">${model.pts.map((p,i)=>`<div class="axe-row">
        <span class="n">${i+1}</span>
        <input class="inp" data-p="${i}" data-f="label" value="${A(p.label)}">
        <select class="inp" data-p="${i}" data-f="type"><option value="closed" ${p.type==='closed'?'selected':''}>● закрашенная</option><option value="open" ${p.type==='open'?'selected':''}>○ выколотая</option></select>
        <span style="display:flex;flex-direction:column;gap:2px"><label title="Чётная кратность"><input type="checkbox" data-p="${i}" data-f="mark" ${p.mark?'checked':''}> !</label><label title="Точка не входит в ОДЗ — красная дуга над ней прерывается"><input type="checkbox" data-p="${i}" data-f="nodz" ${p.nodz?'checked':''}> ∉ОДЗ</label></span>
        <span class="bar" style="gap:2px;flex-wrap:nowrap"><button class="btn ghost" style="padding:4px 6px" data-mv="${i}" data-d="-1" title="Левее">↑</button><button class="btn ghost danger" style="padding:4px 6px" data-del="${i}" title="Удалить">✕</button></span>
      </div>`).join('')}</div>
      <div class="bar" style="margin-top:8px"><button class="btn" id="axAddPt">+ точка</button><button class="btn" id="axAuto" title="Справа «+», дальше чередуем; через «!» знак не меняется">⚡ Автознаки</button><button class="btn ghost" id="axNoArcs">Без дуг (простой луч)</button></div>
      <div class="axe-sec">Промежутки</div>
      <div class="axe-grid">${model.ivs.map((it,k)=>`<div class="axe-row iv">
        <span class="axe-ivname">\\(${H(ivName(k).replace('−∞','-\\infty').replace('+∞','+\\infty'))}\\)</span>
        <select class="inp" data-i="${k}" data-f="sign"><option value="" ${!it.sign?'selected':''}>—</option><option value="+" ${it.sign==='+'?'selected':''}>+</option><option value="-" ${it.sign==='-'?'selected':''}>−</option></select>
        <label><input type="checkbox" data-i="${k}" data-f="arc" ${it.arc?'checked':''}> дуга</label>
        <label><input type="checkbox" data-i="${k}" data-f="shade" ${it.shade?'checked':''}> штрих</label>
        <label><input type="checkbox" data-i="${k}" data-f="out" ${it.out?'checked':''}> вне ОДЗ</label>
      </div>`).join('')}</div>
      <div class="axe-sec">Предпросмотр</div>
      <div class="axbox" style="margin-top:0">${axisHTML(ax,{v:model.v,static:true})}</div>
      <div class="bar" style="margin-top:10px;justify-content:flex-end"><button class="btn danger" id="axRemove">Убрать ось из шага</button><button class="btn pri" id="axApply">✓ Записать ось в шаг ${si0+1}</button></div>`;
    $('axStep').onchange = e => { si0 = Number(e.target.value); load(si0); render(); };
    $('axVar').oninput = e => { model.v = e.target.value || 'x'; };
    $('axVar').onchange = render;
    box.querySelectorAll('[data-p]').forEach(inp => inp.onchange = () => {
      const p = model.pts[Number(inp.dataset.p)], f = inp.dataset.f;
      p[f] = inp.type==='checkbox' ? inp.checked : inp.value; render();
    });
    box.querySelectorAll('[data-i]').forEach(inp => inp.onchange = () => {
      const it = model.ivs[Number(inp.dataset.i)], f = inp.dataset.f;
      it[f] = inp.type==='checkbox' ? inp.checked : inp.value; render();
    });
    box.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
      const i = Number(b.dataset.del); if (model.pts.length<=1) return;
      model.pts.splice(i,1); model.ivs.splice(i+1,1); render();
    });
    box.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => {
      const i = Number(b.dataset.mv); if (i===0) return;
      [model.pts[i-1], model.pts[i]] = [model.pts[i], model.pts[i-1]]; render();
    });
    $('axAddPt').onclick = () => { model.pts.push({label:String(model.pts.length), type:'open', mark:false}); model.ivs.push({sign:'',arc:true,shade:false,out:false}); render(); };
    $('axAuto').onclick = () => { autoSigns(); model.ivs.forEach(it=>it.arc=true); render(); };
    $('axNoArcs').onclick = () => { model.ivs.forEach(it=>{ it.arc=false; it.sign=''; }); render(); };
    $('axApply').onclick = () => {
      const st = steps[si0]; if (!Array.isArray(st.o)) st.o = [];
      let c = correctOption(st); if (!c){ c={t:'',ok:true}; st.o.push(c); }
      c.axis = toAxis(); onChange(obj); toast('Ось записана в шаг '+(si0+1)+'. Не забудьте «Сохранить».'); render();
    };
    $('axRemove').onclick = () => { const c=correctOption(steps[si0]); if (c){ delete c.axis; onChange(obj); toast('Ось удалена из шага'); } };
    tx(box);
  };
  load(si0); render();
}

function addTask(){
  closeMenu();
  openModal({ id: Date.now(), n: String(T.length+1).padStart(3,'0'), s: fl.sec || 'Замена', d: 'basic',
    g: fl.g || 'Показательные', ss: '', t: 'Решите неравенство: \\( \\dfrac{x-1}{x+2} \\ge 0 \\).', c: 'Решите неравенство: \\( \\dfrac{x-1}{x+2} \\ge 0 \\).',
    a: 'Ответ: \\( x\\in(-\\infty;\\ -2)\\cup[1;\\ +\\infty) \\).', ap: 'x\\in(-\\infty;\\ -2)\\cup[1;\\ +\\infty)',
    ch: [
      {e:'\\dfrac{x-1}{x+2} \\ge 0', q:'Найдите нули числителя и знаменателя.', o:[{t:'Числитель: $x=1$ (закрашена). Знаменатель: $x=-2$ (выколота).', ok:true}]},
      {e:'\\dfrac{x-1}{x+2} \\ge 0', q:'Решите методом интервалов.', o:[{t:'Нужны промежутки со знаком «+».', ok:true, axis:{var:'x',points:[{x:0,label:'',type:'hidden'},{x:1,label:'-2',type:'open'},{x:2,label:'1',type:'closed'},{x:3,label:'',type:'hidden'}],intervals:[{from:0,to:1,label:'+',arc:true,shade:true},{from:1,to:2,label:'-',arc:true},{from:2,to:3,label:'+',arc:true,shade:true}]}}]},
      {e:'x\\in(-\\infty;\\ -2)\\cup[1;\\ +\\infty)', q:'END'}

function askConfirm(msg, yes){
  return new Promise(res => {
    modal(`<div class="modal-box" style="max-width:520px;margin-top:10vh"><p style="font-size:17px;margin:4px 0 14px">${H(msg)}</p><div class="modal-foot"><button class="btn" id="cNo">Нет</button><button class="btn pri" id="cYes">${H(yes||'Да')}</button></div></div>`);
    $('cNo').onclick = () => { closeModal(); res(false); };
    $('cYes').onclick = () => { closeModal(); res(true); };
  });
}
async function delTask(id){
  if (!(await askConfirm('Удалить эту задачу насовсем?', 'Удалить'))) return;
  T = T.filter(x=>String(x.id)!==String(id)); persistTasks(); delete S[id]; sv();
  if (cur && String(cur.id)===String(id)) menu(); else rows();
  toast('Задача удалена');
}

/* ================= теория ================= */
function theory(){
  cur = null; setTaskMode(false); closeMenu();
  const demo = {var:'x', points:[{x:0,type:'hidden'},{x:1,label:'-3',type:'open'},{x:2,label:'-2',type:'closed'},{x:3,label:'1',type:'closed',mark:'!'},{x:4,label:'4',type:'open'},{x:5,type:'hidden'}],
    intervals:[{from:0,to:1,label:'-',arc:true,out:true},{from:1,to:2,label:'+',arc:true},{from:2,to:3,label:'-',arc:true,shade:true},{from:3,to:4,label:'-',arc:true,shade:true},{from:4,to:5,label:'+',arc:true}]};
  $('app').innerHTML = `
    <div class="bar" style="margin-bottom:14px"><button id="backBtn2" class="btn ghost">← К списку</button></div>
    <h2 style="margin:0 0 14px;font-size:24px;letter-spacing:-.5px">📚 Шпаргалка по неравенствам</h2>
    <div class="theory-grid">
      <div class="sticker st-blue wide">
        <h3>📈 Как оформлять метод интервалов</h3>
        <p>Пример: $\\dfrac{(x-1)^2(x+2)}{x-4}\\le 0$ при ОДЗ $x>-3$.</p>
        <div id="demoAx">${axisWidget(demo,'x',0)}</div>
        <p class="meta" style="margin-top:10px">Точка $1$ — корень чётной кратности (!): знак через неё не меняется, а сама точка входит в ответ. Левее $-3$ — вне ОДЗ, знак зачёркнут.</p>
      </div>
      <div class="sticker st-blue">
        <h3>🧭 Алгоритм</h3>
        <p>1) Приводим к виду $\\frac{P(x)}{Q(x)} \\vee 0$. 2) Нули числителя — закрашенные при $\\le,\\ \\ge$, выколотые при $<,\\ >$. Нули знаменателя — всегда выколотые. 3) Учитываем ОДЗ. 4) Знак на крайнем правом промежутке — по старшим коэффициентам, дальше чередуем.</p>
      </div>
      <div class="sticker st-green">
        <h3>🌱 Показательные</h3>
        <p>Если $a > 1$: $a^{f} \\vee a^{g} \\iff f \\vee g$.</p>
        <p>Если $0 < a < 1$: знак неравенства <b>меняется</b>.</p>
        <p>Число $b > 0$ записываем как $a^{\\log_a b}$, чтобы сбросить основания.</p>
        <div class="ex">$2^x < 8 \\Rightarrow 2^x < 2^3 \\Rightarrow x < 3$</div>
      </div>
      <div class="sticker st-purple">
        <h3>📝 Логарифмические</h3>
        <p>ОДЗ: аргумент $>0$, основание $>0,\\ \\ne 1$.</p>
        <p>При $a > 1$ знак сохраняется, при $0 < a < 1$ — меняется.</p>
        <div class="ex">$\\log_2(x-1) < 3 \\Rightarrow 0 < x-1 < 8$</div>
      </div>
      <div class="sticker st-cyan">
        <h3>⚡ Метод рационализации</h3>
        <p>Знак $a^{f}-a^{g}$ совпадает со знаком $(a-1)(f-g)$.</p>
        <p>Знак $\\log_a f-\\log_a g$ совпадает со знаком $(a-1)(f-g)$ — на ОДЗ.</p>
        <div class="ex">$\\dfrac{4^{f}-4^{g}}{5^{x-1}-1}\\vee 0 \\iff \\dfrac{f-g}{x-1}\\vee 0$</div>
      </div>
      <div class="sticker st-orange">
        <h3>📐 Иррациональные</h3>
        <p>$\\sqrt{A} < B \\iff \\begin{cases} A \\ge 0 \\\\ B > 0 \\\\ A < B^2 \\end{cases}$</p>
        <p>$\\sqrt{A} > B \\iff \\left[ \\begin{array}{l} \\begin{cases} B < 0 \\\\ A\\ge 0\\end{cases} \\\\ \\begin{cases} B \\ge 0 \\\\ A > B^2 \\end{cases} \\end{array} \\right.$</p>
      </div>
      <div class="sticker st-red">
        <h3>⚖️ Системы и совокупности</h3>
        <p><b>Система</b> — это <b>И</b> (пересечение): $\\begin{cases} A > 0 \\\\ B < 0 \\end{cases}$</p>
        <p><b>Совокупность</b> — это <b>ИЛИ</b> (объединение): $\\left[ \\begin{array}{l} A = 0 \\\\ B = 0 \\end{array} \\right.$</p>
        <p>ОДЗ добавляем к системе под общую фигурную скобку.</p>
      </div>
      <div class="sticker st-cyan">
        <h3>🎯 Оценка знака</h3>
        <p>Удобно подставить $x=0$ или $x \\to +\\infty$, чтобы проверить знак на крайнем правом промежутке.</p>
        <p>При переходе через корень <b>нечётной</b> кратности знак меняется, <b>чётной</b> — нет.</p>
      </div>
    </div>`;
  $('backBtn2').onclick = menu;
  const wb = $('demoAx').querySelector('.axbox'); wb._axis = demo;
  let st = setAxStage(wb, 0);
  wb.querySelectorAll('[data-axi]').forEach(p => p.onclick = () => { st = setAxStage(wb, Number(p.dataset.axi)); });
  wb.querySelectorAll('[data-ax]').forEach(b => b.onclick = () => { const a=b.dataset.ax; st = setAxStage(wb, a==='next'?st+1:a==='prev'?st-1:99); });
  tx($('app'));
}

/* ================= тема / меню / клавиши ================= */
function th(){
  const r = document.documentElement;
  r.dataset.theme = r.dataset.theme==='dark' ? 'light' : 'dark';
  try { localStorage.setItem('ineq.v3.theme', r.dataset.theme); } catch(e){}
  themeIcon();
}
function themeIcon(){ const d=document.documentElement.dataset.theme==='dark'; document.querySelector('meta[name=theme-color]').content = d?'#1d2029':'#fffdf8'; }
function closeMenu(){ $('hdr').classList.remove('open'); }

function init(){
  loadSeed();
  const savedSize = localStorage.getItem('ineq.v2.fontSize');
  if (savedSize){ document.body.className = 'text-'+savedSize; $('fontSizeSel').value = savedSize; }
  themeIcon();
  $('btnTheory').onclick = theory;
  $('btnAdd').onclick = addTask;
  $('btnSave').onclick = saveMenu;
  $('btnUser').onclick = logout;
  $('btnTheme').onclick = th;
  $('btnMenu').onclick = e => { e.stopPropagation(); $('hdr').classList.toggle('open'); };
  $('brand').onclick = () => ME ? menu() : login();
  document.addEventListener('click', e => { if (!e.target.closest('#hdr')) closeMenu(); });
  $('fontSizeSel').onchange = e => {
    const inTask = document.body.classList.contains('in-task');
    document.body.className = 'text-'+e.target.value + (inTask?' in-task':'');
    localStorage.setItem('ineq.v2.fontSize', e.target.value);
  };
  const fi = document.createElement('input'); fi.type = 'file'; fi.id = 'impP'; fi.accept = '.json,application/json'; fi.hidden = true;
  fi.onchange = () => { if (fi.files[0]) importProg(fi.files[0]); fi.value = ''; }; document.body.appendChild(fi);
  $('dPrev').onclick = () => goStep(si-1);
  $('dNext').onclick = () => goStep(si+1);
  $('dMain').onclick = primary;
  document.addEventListener('keydown', e => {
    if (!cur || !ch || mode!=='step' || $('modalRoot').innerHTML) return;
    if (/INPUT|TEXTAREA|SELECT/.test((e.target||{}).tagName||'')) return;
    if (e.key===' ' || e.key==='Enter'){ e.preventDefault(); primary(); }
    else if (e.key==='ArrowRight'){ e.preventDefault(); goStep(si+1); }
    else if (e.key==='ArrowLeft'){ e.preventDefault(); goStep(si-1); }
  });
  document.addEventListener('keydown', e => { if (e.key==='Escape' && $('modalRoot').innerHTML) closeModal(); });
  window.__ineq = {T:()=>T, axisAnswer, normAxis, S:()=>S, build:()=>buildHTML()};
  header();
  const m = location.hash.match(/^#t([\w-]+)$/);
  if (ME && m && T.some(t => String(t.id)===m[1])) openT(m[1]); else if (ME) menu(); else login();
  initCloud();
}
if (document.readyState==='loading') document.addEventListener('DOMContentLoaded', init); else init();
