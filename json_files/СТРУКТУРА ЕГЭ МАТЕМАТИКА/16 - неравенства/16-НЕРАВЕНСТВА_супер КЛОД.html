<!doctype html>
<html lang="ru" data-theme="light"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6fb">
<title>Неравенства: разбор по шагам</title>
<style>
:root{
  --bg:#f4f5fa;--bg2:#eceef6;--cd:#ffffff;--tx:#1b1f2e;--mu:#6b7083;--br:#e3e5ef;
  --ac:#4f46e5;--ac2:#eef0ff;--acx:#ffffff;
  --ok:#059669;--okbg:#e7f7f1;--bad:#e11d48;--badbg:#fdecf0;--wa:#d97706;
  --ink:#1f2433;--axl:#8a90a6;--arc:#6c63ff;--hatch:#4f46e5;--plus:#059669;--minus:#e11d48;--off:#a7abbb;
  --sh:0 1px 2px rgba(20,24,50,.05),0 4px 16px rgba(20,24,50,.06);
  --sh2:0 10px 40px rgba(20,24,50,.18);
  --r:18px;--font-base:16px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0e1020;--bg2:#161936;--cd:#171a2e;--tx:#eceefa;--mu:#9a9fbd;--br:#2a2e4a;
  --ac:#8b85ff;--ac2:#25285a;--acx:#0e1020;
  --ok:#34d399;--okbg:#10302a;--bad:#fb7185;--badbg:#3a1622;--wa:#fbbf24;
  --ink:#e6e8f7;--axl:#7a80a3;--arc:#a39dff;--hatch:#8b85ff;--plus:#34d399;--minus:#fb7185;--off:#5d6285;
  --sh:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --sh2:0 12px 50px rgba(0,0,0,.6);
  color-scheme:dark;
}
body.text-small{--font-base:14px}
body.text-medium{--font-base:16px}
body.text-large{--font-base:19px}

*{box-sizing:border-box}
html{scroll-padding-top:80px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:var(--font-base)/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;
  background-image:radial-gradient(1200px 500px at 100% -10%,var(--ac2),transparent 60%);background-attachment:fixed}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
mjx-container{max-width:100%}
mjx-container[display="true"]{margin:.4em 0!important}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:10px 18px;padding-top:max(10px,env(safe-area-inset-top));
  background:color-mix(in srgb,var(--cd) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--br)}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer}
.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),#ec4899);color:#fff;font-weight:800;font-size:20px;flex:none;box-shadow:0 4px 14px color-mix(in srgb,var(--ac) 40%,transparent)}
.brand h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.3px;white-space:nowrap}
.brand small{display:block;color:var(--mu);font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.hb{border:1px solid var(--br);background:var(--cd);border-radius:11px;padding:7px 11px;font-size:14px;font-weight:600;display:inline-flex;gap:6px;align-items:center;transition:.15s}
.hb:hover{border-color:var(--ac);color:var(--ac)}
.hb .i{font-size:15px}
#fontSizeSel{border:1px solid var(--br);background:var(--cd);border-radius:11px;padding:7px 8px;font-size:13px;font-weight:600}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--br);background:var(--cd);display:grid;place-items:center;font-size:17px;flex:none}
#btnMenu{display:none}

main{max-width:1000px;margin:0 auto;padding:18px 16px 40px}

/* ---------- basics ---------- */
.card{background:var(--cd);border:1px solid var(--br);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--br);background:var(--cd);border-radius:12px;padding:9px 14px;font-weight:600;font-size:.92em;transition:.15s;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover:not(:disabled){border-color:var(--ac);color:var(--ac)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.pri:hover{filter:brightness(1.08);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--bg2)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.on{background:var(--ac2);border-color:var(--ac);color:var(--ac)}
.btn.big{padding:13px 22px;font-size:1em;border-radius:14px}
.meta{font-size:13px;color:var(--mu)}
.tag{font-size:12px;border-radius:8px;padding:3px 9px;color:var(--mu);background:var(--bg2);font-weight:600;white-space:nowrap}
.dd{font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.dd::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.d-basic{color:var(--ok)}.d-medium{color:var(--wa)}.d-hard{color:var(--bad)}
.stk{display:inline-block;background:linear-gradient(135deg,#10b981,#059669);color:#fff;font-weight:800;font-size:11px;letter-spacing:.6px;padding:4px 10px;border-radius:8px;transform:rotate(-3deg);box-shadow:0 3px 8px rgba(5,150,105,.35)}
.tx{overflow-x:auto;overflow-y:hidden}
input.inp,select.inp,textarea.inp{border:1px solid var(--br);background:var(--bg);border-radius:12px;padding:9px 12px;outline:none;transition:.15s}
input.inp:focus,select.inp:focus,textarea.inp:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac2)}

/* ---------- list ---------- */
.hero{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--cd);border:1px solid var(--br);border-radius:16px;padding:12px 14px;box-shadow:var(--sh)}
.stat b{display:block;font-size:24px;letter-spacing:-.5px}
.stat span{font-size:12px;color:var(--mu);font-weight:600}
.pbar{height:6px;border-radius:6px;background:var(--bg2);overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),#ec4899);border-radius:6px;transition:width .4s}
.filters{display:grid;grid-template-columns:1fr 1fr 2fr;gap:8px;margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--br);background:var(--cd);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--mu)}
.chip.on{background:var(--tx);color:var(--cd);border-color:var(--tx)}
.chip em{font-style:normal;opacity:.6;margin-left:4px}
.sec-h{font-size:13px;font-weight:800;letter-spacing:.8px;color:var(--mu);margin:22px 4px 10px;text-transform:uppercase}
.row{position:relative;transition:transform .15s,box-shadow .15s}
.row:hover{box-shadow:0 2px 4px rgba(20,24,50,.05),0 10px 28px rgba(20,24,50,.1)}
.row.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--br))}
.row.done::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--ok)}
.row-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row-num{font-weight:800;font-size:15px}
.row-cond{margin:12px 0 14px;font-size:1.02em}
.row-act{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row-act .sp{flex:1}
.mini{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mu);font-weight:600}
.mini .pbar{width:60px;margin:0;height:5px}
.empty{text-align:center;color:var(--mu);padding:40px 10px}

/* ---------- task view ---------- */
.task-head .bar{margin-bottom:12px}
.cond{font-size:1.12em;margin-top:6px}
.modes{display:inline-flex;background:var(--bg2);border-radius:12px;padding:3px;gap:2px}
.modes button{border:0;background:transparent;border-radius:9px;padding:6px 12px;font-weight:700;font-size:13px;color:var(--mu)}
.modes button.on{background:var(--cd);color:var(--tx);box-shadow:var(--sh)}
.stepnav{padding:12px 16px}
.step-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.step-head b{font-size:15px}
.step-head b span{color:var(--mu);font-weight:600}
#stepSlider{display:block;width:100%;margin:12px 0 2px;accent-color:var(--ac);cursor:pointer}
.step-scale{display:flex;justify-content:space-between;color:var(--mu);font-size:12px}
.trail{margin-bottom:14px}
.trail summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--mu);padding:4px 2px;list-style:none;display:flex;align-items:center;gap:8px}
.trail summary::-webkit-details-marker{display:none}
.trail summary::before{content:"▸";transition:.2s}
.trail[open] summary::before{transform:rotate(90deg)}
.trail ol{list-style:none;margin:8px 0 0;padding:0 0 0 14px;border-left:2px dashed var(--br)}
.trail li{position:relative;padding:6px 0 10px 14px;cursor:pointer;border-radius:10px}
.trail li:hover{background:var(--bg2)}
.trail li::before{content:attr(data-n);position:absolute;left:-26px;top:8px;width:22px;height:22px;border-radius:50%;background:var(--cd);border:2px solid var(--br);font-size:11px;font-weight:800;display:grid;place-items:center;color:var(--mu)}
.trail .te{overflow-x:auto;font-size:.95em}
.trail .ta{font-size:13px;color:var(--mu)}
.lbl{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
.eq{font-size:1.32em;overflow-x:auto;overflow-y:hidden;padding:14px 12px;text-align:center;background:var(--bg);border:1px solid var(--br);border-radius:14px}
.eq.small{font-size:1.1em}
.fade-in{animation:fin .45s ease both}
@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hint{display:flex;gap:12px;align-items:flex-start;margin:16px 0 4px;font-weight:600;font-size:1.04em}
.hint .qi{flex:none;width:30px;height:30px;border-radius:10px;background:var(--ac2);color:var(--ac);display:grid;place-items:center;font-weight:800}
.hint .qt{padding-top:3px;min-width:0;overflow-x:auto}
.action{margin-top:14px;padding:14px 16px;border-radius:14px;background:var(--okbg);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent);white-space:pre-line;overflow-x:auto;line-height:1.6}
.action .ah{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--ok);margin-bottom:4px;white-space:normal}
.result{margin-top:14px}
.result .arrow{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:13px;font-weight:700;margin-bottom:6px}
.stepbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;align-items:center}
.stepbtns .sp{flex:1}
.kbd{font-size:12px;color:var(--mu)}
.kbd kbd{border:1px solid var(--br);border-bottom-width:2px;border-radius:6px;padding:0 5px;font:inherit;font-size:11px;background:var(--bg)}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{text-align:left;border:1.5px solid var(--br);background:var(--cd);border-radius:14px;padding:12px 14px;font-weight:500;line-height:1.5;transition:.15s;overflow-x:auto}
.opt:hover{border-color:var(--ac)}
.opt.wrong{border-color:var(--bad);background:var(--badbg);animation:shake .35s}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt .why{font-size:13px;color:var(--bad);margin-top:6px}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.final{text-align:center;padding:26px 18px}
.final .big{font-size:42px;line-height:1}
.final h2{margin:8px 0 4px;font-size:22px}
.solution-answer{margin:16px auto 6px;padding:16px;border-radius:16px;background:var(--okbg);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent);font-size:1.18em;overflow-x:auto;max-width:640px}
.allstep{border-left:3px solid var(--br);padding:0 0 18px 16px;margin-left:8px;position:relative}
.allstep::before{content:attr(data-n);position:absolute;left:-14px;top:0;width:25px;height:25px;border-radius:50%;background:var(--ac);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center}
.allstep .hint{margin-top:10px}
.nochain{text-align:center;color:var(--mu);padding:30px}

/* dock (mobile) */
.dock{display:none}

/* ---------- axis ---------- */
.axbox{margin-top:16px;border:1px solid var(--br);border-radius:16px;padding:12px 12px 10px;background:var(--bg)}
.ax-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.ax-in{position:relative;margin:0 auto}
.ax svg{display:block;width:100%;height:auto;overflow:visible}
.ax .axl{stroke:var(--axl);stroke-width:2}
.ax .axa{fill:var(--axl)}
.ax .axv{fill:var(--ink);font:italic 20px "Times New Roman",serif}
.ax .arc{fill:none;stroke:var(--arc);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0}
.ax .arc.out{stroke:var(--off);stroke-dasharray:.035 .03;stroke-width:2;opacity:.75}
.ax .hl{stroke:var(--hatch);stroke-width:2.2;opacity:.85}
.ax .harea{fill:var(--hu)}
.ax .sol{stroke:var(--hatch);stroke-width:5;stroke-linecap:round;opacity:.9}
.ax .sg{font:800 24px system-ui,sans-serif}
.ax .sg-plus{fill:var(--plus)}
.ax .sg-minus{fill:var(--minus)}
.ax .sg.out{fill:var(--off);opacity:.75}
.ax .strike{stroke:var(--off);stroke-width:2.2;stroke-linecap:round}
.ax .pc{fill:var(--ink);stroke:var(--ink);stroke-width:2}
.ax .po{fill:var(--cd);stroke:var(--ink);stroke-width:2.6}
.ax .mk{font:900 22px system-ui,sans-serif;fill:var(--bad);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.ax-lbl{position:absolute;transform:translateX(-50%);white-space:nowrap;font-size:15px;color:var(--ink);line-height:1.2;pointer-events:none}
.ax-ans{text-align:center;font-size:1.05em;margin-top:6px;overflow-x:auto}
.ax-ans b{color:var(--mu);font-size:13px;font-weight:700;margin-right:6px}
.ax-legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:12px;color:var(--mu);margin-top:8px}
.ax-legend span{display:inline-flex;align-items:center;gap:5px}
.lg-dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);display:inline-block}
.lg-dot.f{background:var(--ink)}
.lg-ex{color:var(--bad);font-weight:900}
.lg-off{color:var(--off);font-weight:900;text-decoration:line-through}
.lg-h{width:22px;height:11px;border-bottom:3px solid var(--hatch);background:repeating-linear-gradient(135deg,var(--hatch) 0 2px,transparent 2px 6px);opacity:.85;display:inline-block}
/* staged reveal */
.ax .L{transition:opacity .45s ease}
.ax:not(.on-pts) .L-pts,.ax:not(.on-mark) .L-mark,.ax:not(.on-arcs) .L-arcs,.ax:not(.on-signs) .L-signs,.ax:not(.on-shade) .L-shade,.ax:not(.on-ans) .L-ans{opacity:0}
.ax:not(.on-ans) .L-ans{height:0;overflow:hidden;margin:0}
.ax.on-arcs .arc:not(.out){animation:axdraw .9s ease both}
.ax.on-mark .mk{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:center}
.ax.on-signs .sg{animation:pop .4s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:center}
.ax.static .arc,.ax.static .mk,.ax.static .sg{animation:none!important}
.ax.static .L{transition:none}
@keyframes axdraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
.axctl{border-top:1px dashed var(--br);margin-top:10px;padding-top:10px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pill{border:1px solid var(--br);background:var(--cd);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;color:var(--mu)}
.pill.done{background:var(--ac2);color:var(--ac);border-color:transparent}
.pill.cur{background:var(--ac);color:#fff;border-color:var(--ac)}
.axcap{font-size:14px;min-height:2.6em}
.axbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(10,12,30,.5);display:flex;align-items:center;justify-content:center;padding:18px;z-index:1000;backdrop-filter:blur(4px);animation:fin .2s}
.modal-box{background:var(--cd);border:1px solid var(--br);border-radius:22px;padding:20px;width:100%;max-width:820px;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--sh2);overflow:hidden}
.modal-box h3{margin:0 0 12px;font-size:19px}
.modal-body{overflow:auto;flex:1;min-height:0}
.modal-box textarea{width:100%;min-height:320px;font:13px/1.45 ui-monospace,Consolas,monospace;resize:vertical}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.tabs{display:flex;gap:4px;margin-bottom:12px;background:var(--bg2);padding:3px;border-radius:12px;width:max-content;max-width:100%}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-weight:700;font-size:13px;color:var(--mu)}
.tabs button.on{background:var(--cd);color:var(--tx);box-shadow:var(--sh)}
.drop{border:2px dashed var(--br);border-radius:16px;padding:22px;text-align:center;color:var(--mu);transition:.15s;cursor:pointer}
.drop.over{border-color:var(--ac);background:var(--ac2);color:var(--ac)}
.radio{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0}
.radio label,.print-fields label,.print-task-list label{display:flex;align-items:center;gap:8px;cursor:pointer}
.print-fields{display:flex;gap:12px 22px;flex-wrap:wrap;padding:12px;background:var(--bg);border:1px solid var(--br);border-radius:12px;margin-bottom:12px}
.print-task-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.print-task-list{max-height:38vh;overflow:auto;border:1px solid var(--br);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--ac)}
/* axis editor */
.axe-grid{display:grid;gap:6px}
.axe-row{display:grid;grid-template-columns:28px 1fr 150px 54px 76px;gap:6px;align-items:center}
.axe-row.iv{grid-template-columns:1fr 92px 80px 92px 86px}
.axe-row .n{font-weight:800;color:var(--mu);font-size:13px;text-align:center}
.axe-row .inp{padding:6px 8px;font-size:13px;width:100%}
.axe-row label{font-size:13px;display:flex;gap:5px;align-items:center;white-space:nowrap}
.axe-sec{font-weight:800;font-size:13px;color:var(--mu);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.6px}
.axe-ivname{font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--tx);color:var(--cd);padding:11px 18px;border-radius:14px;font-weight:600;font-size:14px;z-index:2000;transition:.3s;box-shadow:var(--sh2);max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}

/* ---------- theory ---------- */
.theory-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.sticker{border-radius:18px;padding:16px 18px;border:1px solid var(--br);background:var(--cd);box-shadow:var(--sh);position:relative;overflow:hidden}
.sticker::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--c)}
.sticker h3{margin:0 0 8px;font-size:17px}
.sticker p{margin:6px 0;overflow-x:auto}
.sticker .ex{background:var(--bg);border-radius:12px;padding:8px 10px;margin-top:8px;overflow-x:auto;text-align:center}
.sticker.wide{grid-column:1/-1}
.st-blue{--c:#4f46e5}.st-green{--c:#059669}.st-purple{--c:#9333ea}.st-orange{--c:#ea580c}.st-red{--c:#e11d48}.st-cyan{--c:#0891b2}

/* ---------- responsive ---------- */
@media (max-width: 860px){
  #btnMenu{display:grid}
  .actions{display:none;position:absolute;top:100%;right:10px;left:10px;flex-direction:column;align-items:stretch;background:var(--cd);border:1px solid var(--br);border-radius:18px;padding:10px;box-shadow:var(--sh2)}
  header.open .actions{display:flex;animation:fin .2s}
  .actions .hb{justify-content:flex-start;padding:11px 14px;font-size:15px}
  #fontSizeSel{padding:10px}
}
@media (max-width: 640px){

<script>
(function(){
'use strict';

const $ = id => document.getElementById(id);
const H = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const A = s => H(s).replace(/"/g,'&quot;');
const DF = {basic:'базовый', medium:'средний', hard:'сложный'};
const K_TASKS='ineq.v3.tasks', K_STATE='ineq.v2.s', K_SET='ineq.v3.set';

let T = [], S = {}, SET = {staged:true};
let fl = {sec:'', st:'all', df:'', q:''};
let shown = 20, cur = null, ch = null, si = 0, err = 0, ord = [], rev = false, seen = new Set(), mode = 'step', axStage = 0, picked = {};

/* ================= storage ================= */
function persistTasks(){ try{ localStorage.setItem(K_TASKS, JSON.stringify(T)); }catch(e){ toast('Не удалось сохранить в браузере'); } }
function sv(){ try{ localStorage.setItem(K_STATE, JSON.stringify(S)); }catch(e){} }
function svSet(){ try{ localStorage.setItem(K_SET, JSON.stringify(SET)); }catch(e){} }
function g(id){ return S[id] || (S[id] = {}); }
function correctOption(step){ return (step && Array.isArray(step.o) ? step.o.find(o=>o && o.ok) : null) || null; }
function sortT(){ T.sort((a,b) => String(a.n||'').localeCompare(String(b.n||''), 'ru', {numeric:true})); }
function isEnd(s){ return !s || String(s.q||'').toUpperCase()==='END'; }
function cleanQ(q){ return String(q||'').replace(/^\s*Шаг\s*\d+\s*[.:)]\s*/i,''); }

function loadSeed(){
  let embedded = [];
  try { embedded = JSON.parse($('seed').textContent); } catch(e){ console.error(e); }
  const isSnapshot = $('seed').dataset.snapshot === '1';
  try { SET = Object.assign(SET, JSON.parse(localStorage.getItem(K_SET)||'{}')); } catch(e){}
  if (isSnapshot) {
    T = embedded;
    try { const st = $('seed-state').textContent; S = st && st !== '{}' ? JSON.parse(st) : {}; } catch(e){ S = {}; }
    try {
      const snapKey = 'ineq.v3.snap.' + ($('seed').dataset.stamp||'');
      if (localStorage.getItem('ineq.v3.lastsnap') !== snapKey) {
        localStorage.setItem('ineq.v3.lastsnap', snapKey);
        persistTasks(); sv();
      } else {
        const saved = JSON.parse(localStorage.getItem(K_TASKS)||'null');
        if (Array.isArray(saved) && saved.length) T = saved;
        S = JSON.parse(localStorage.getItem(K_STATE)||'null') || S;
      }
    } catch(e){}
  } else {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(K_TASKS) || 'null'); } catch(e){}
    if (Array.isArray(saved) && saved.length) T = saved;
    else {
      T = embedded.slice();
      // перенос задач, добавленных в старой версии
      try {
        const old = JSON.parse(localStorage.getItem('ineq.v2.tasks')||'null');
        if (Array.isArray(old)) old.forEach(t => { if (t && t.id && !T.some(x => String(x.id)===String(t.id))) T.push(t); });
      } catch(e){}
      persistTasks();
    }
    try { S = JSON.parse(localStorage.getItem(K_STATE)) || {}; } catch(e){ S = {}; }
  }
  sortT();
}

/* ================= MathJax ================= */
function tx(el, n){
  if (!el) return; n = n || 0;
  if (window.MathJax && MathJax.typesetPromise) {
    try { MathJax.typesetClear && MathJax.typesetClear([el]); } catch(e){}
    MathJax.typesetPromise([el]).catch(e => console.warn('MathJax', e));
  } else if (n < 120) setTimeout(() => tx(el, n+1), 200);
}

let toastT;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }

/* =====================================================================
   МЕТОД ИНТЕРВАЛОВ: модель и отрисовка
   axis = { var?, points:[{x,label,type:'open'|'closed'|'hidden',mark?:'!'}],
            intervals:[{from,to,label?:'+'|'-',arc?,shade?,out?}] }
   Скрытые крайние точки означают −∞ и +∞. out:true — промежуток вне ОДЗ.
   ===================================================================== */
const isInf = v => v==='-Infinity'||v===-Infinity||v==='+Infinity'||v==='Infinity'||v===Infinity;
function normAxis(axis){
  if (!axis || typeof axis!=='object') return null;
  const pts = (axis.points||[]).slice().sort((a,b)=>Number(a.x)-Number(b.x));
  const vis = pts.filter(p=>p.type!=='hidden');
  const n = vis.length;
  const bIdx = v => {
    if (v==='-Infinity'||v===-Infinity) return 0;
    if (isInf(v)) return n+1;
    const p = pts.find(q => Number(q.x)===Number(v));
    if (!p) return null;
    if (p.type==='hidden'){
      if (!n) return p===pts[0] ? 0 : 1;
      if (Number(p.x) < Number(vis[0].x)) return 0;
      if (Number(p.x) > Number(vis[n-1].x)) return n+1;
      return null;
    }
    return vis.indexOf(p)+1;
  };
  const ivs = new Array(n+1).fill(null);
  for (const it of (axis.intervals||[])) {
    let a = bIdx(it.from), b = bIdx(it.to);
    if (a==null || b==null) continue;
    if (a>b) [a,b]=[b,a];
    if (b===n+1 && n===0 && a===0) { ivs[0]=it; continue; }
    for (let k=a; k<b && k<=n; k++) ivs[k] = it;
  }
  return {pts:vis, ivs, n};
}
const sgnOf = it => { const l=String(it&&it.label||'').trim(); return l==='+'?'+':(l==='-'||l==='−'||l==='–')?'-':''; };
const arcOf = it => !!it && (it.arc===true || (it.arc===undefined && !!sgnOf(it)));

function axisAnswer(axis, v){
  const N = normAxis(axis); if (!N) return '';
  const {pts, ivs, n} = N;
  // последовательность I0 P1 I1 ... Pn In
  const seq = [];
  for (let k=0;k<=n;k++){
    seq.push({kind:'I',k,inc:!!(ivs[k]&&ivs[k].shade&&!ivs[k].out)});
    if (k<n) seq.push({kind:'P',k:k+1,inc:pts[k].type==='closed'});
  }
  const lab = k => String(pts[k-1].label||pts[k-1].x);
  const parts = [];
  let i=0;
  while (i<seq.length){
    if (!seq[i].inc){ i++; continue; }
    let j=i; while (j+1<seq.length && seq[j+1].inc) j++;
    const a=seq[i], b=seq[j];
    if (a===b && a.kind==='P') parts.push('\\{'+lab(a.k)+'\\}');
    else {
      const L = a.kind==='P' ? '['+lab(a.k) : (a.k===0 ? '(-\\infty' : '('+lab(a.k));
      const R = b.kind==='P' ? lab(b.k)+']' : (b.k===n ? '+\\infty)' : lab(b.k+1)+')');
      parts.push(L+';\\ '+R);
    }
    i=j+1;
  }
  if (!parts.length) return (v||'x')+'\\in\\varnothing';
  return (v||'x')+'\\in '+parts.join('\\cup ');
}

function axisStages(axis){
  const N = normAxis(axis); if (!N) return [];
  const st = [];
  const hasOut = N.ivs.some(it=>it&&it.out);
  if (N.n) st.push({k:'pts', s:'Точки', c:'Отмечаем точки: <b>закрашенные</b> ● входят в ответ, <b>выколотые</b> ○ — нет (нули знаменателя, строгое неравенство, границы ОДЗ).'});
  if (N.pts.some(p=>p.mark==='!')) st.push({k:'mark', s:'Кратность «!»', c:'Корни <b>чётной кратности</b> отмечаем «!» — при переходе через них знак <b>не меняется</b>.'});
  if (N.ivs.some(arcOf)) st.push({k:'arcs', s:'Дуги', c:'Рисуем дуги между соседними точками. Крайние дуги уходят в бесконечность.'});
  if (N.ivs.some(it=>sgnOf(it))) st.push({k:'signs', s:'Знаки', c:'Расставляем знаки — только в пределах ОДЗ.' + (hasOut ? ' Вне ОДЗ знак бледный и зачёркнут: его там быть не должно.' : ' Начинаем справа и идём влево, учитывая «!».')});
  if (N.ivs.some(it=>it&&it.shade)) st.push({k:'shade', s:'Штриховка', c:'Штрихуем промежутки, которые подходят под знак неравенства.'});
  if (showAns(axis)) st.push({k:'ans', s:'Ответ', c:'Записываем ответ по рисунку.'});
  return st;
}

const showAns = (axis, v) => axis.ans===true || (axis.ans!==false && String(v||axis.var||'x')==='x');
let AXUID = 0;
function fx(v){ return Math.round(v*10)/10; }
function axisHTML(axis, o){
  o = o || {};
  const N = normAxis(axis); if (!N) return '';
  const v = o.v || axis.var || 'x';
  const uid = 'ax' + (++AXUID) + Math.random().toString(36).slice(2,6);
  const {pts, ivs, n} = N;
  const long = pts.some(p => /log|sqrt|frac/.test(String(p.label||'')) || String(p.label||'').length>8);
  const M = n<=1 ? 150 : 100, gap = long ? 150 : 118;
  const W = 2*M + Math.max(0,n-1)*gap, Hh = 132, y = 84, h = 40, L = 8, R = W-24;
  const X = k => M + (k-1)*gap;
  let defs = `<pattern id="${uid}h" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" class="hl"/></pattern>`;
  let gShade='', gArcs='', gSigns='', gPts='', gMark='', lbls='';
  const used = {closed:false, open:false, mark:false, out:false, shade:false};

  for (let k=0;k<=n;k++){
    const it = ivs[k]; if (!it) continue;
    const li = (k===0), ri = (k===n);
    const x1 = li ? L : X(k), x2 = ri ? R : X(k+1);
    const arc = arcOf(it), sg = sgnOf(it);
    let path, area, sx;
    if (li && ri){ path=`M${L+4} ${y-h} L${R-6} ${y-h}`; area=`M${L} ${y} L${L} ${y-h} L${R} ${y-h} L${R} ${y} Z`; sx=W/2; }
    else if (ri){ path=`M${x1} ${y} C${fx(x1+9)} ${fx(y-h*1.05)} ${fx(x1+26)} ${y-h} ${fx(x1+56)} ${y-h} L${R-6} ${y-h}`; area=path+` L${R-6} ${y} Z`; sx=x1+Math.min(58,(R-x1)/2); }
    else if (li){ path=`M${x2} ${y} C${fx(x2-9)} ${fx(y-h*1.05)} ${fx(x2-26)} ${y-h} ${fx(x2-56)} ${y-h} L${L+4} ${y-h}`; area=path+` L${L+4} ${y} Z`; sx=x2-Math.min(58,(x2-L)/2); }
    else { const d=x2-x1; path=`M${x1} ${y} C${fx(x1+d*.16)} ${fx(y-h*1.33)} ${fx(x2-d*.16)} ${fx(y-h*1.33)} ${x2} ${y}`; area=path+' Z'; sx=(x1+x2)/2; }
    if (!arc){ const bh=18; area=`M${li?L:x1} ${y} L${li?L:x1} ${y-bh} L${ri?R:x2} ${y-bh} L${ri?R:x2} ${y} Z`; }
    let mask = '';
    if (li || ri){
      const gid=uid+'g'+k, mid=uid+'m'+k;
      let stops, gx1, gx2;
      if (li && ri){ gx1=L; gx2=R; stops='<stop offset="0" stop-color="#000"/><stop offset=".25" stop-color="#fff"/><stop offset=".75" stop-color="#fff"/><stop offset="1" stop-color="#000"/>'; }
      else { gx1 = ri ? x1+40 : x2-40; gx2 = ri ? R-2 : L+2; stops='<stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/>'; }
      defs += `<linearGradient id="${gid}" gradientUnits="userSpaceOnUse" x1="${fx(gx1)}" y1="0" x2="${fx(gx2)}" y2="0">${stops}</linearGradient><mask id="${mid}" maskUnits="userSpaceOnUse" x="-10" y="-10" width="${W+20}" height="${Hh+20}"><rect x="-10" y="-10" width="${W+20}" height="${Hh+20}" fill="url(#${gid})"/></mask>`;
      mask = ` mask="url(#${mid})"`;
    }
    if (it.shade && !it.out){
      used.shade = true;
      gShade += `<g${mask}><path d="${area}" fill="url(#${uid}h)"/><line class="sol" x1="${li?L:x1}" y1="${y}" x2="${ri?R:x2}" y2="${y}"/></g>`;
    }
    if (arc){
      gArcs += `<g${mask}><path class="arc${it.out?' out':''}" pathLength="1" d="${path}" style="animation-delay:${(k*0.12).toFixed(2)}s"/></g>`;
    }
    if (sg){
      const sy = y - (arc ? h*0.42 : 30);
      if (it.out) used.out = true;
      gSigns += `<text class="sg ${sg==='+'?'sg-plus':'sg-minus'}${it.out?' out':''}" x="${fx(sx)}" y="${fx(sy)}" text-anchor="middle" dominant-baseline="central" style="animation-delay:${(0.12*(n-k)).toFixed(2)}s">${sg==='+'?'+':'−'}</text>`;
      if (it.out) gSigns += `<line class="strike" x1="${fx(sx-11)}" y1="${fx(sy+10)}" x2="${fx(sx+11)}" y2="${fx(sy-10)}"/>`;
    }
  }
  pts.forEach((p,i)=>{
    const cx = X(i+1);
    if (p.type==='closed'){ used.closed=true; gPts += `<circle class="pc" cx="${cx}" cy="${y}" r="6"/>`; }
    else { used.open=true; gPts += `<circle class="po" cx="${cx}" cy="${y}" r="6"/>`; }
    if (p.mark==='!'){ used.mark=true; gMark += `<text class="mk" x="${cx}" y="${y-30}" text-anchor="middle" dominant-baseline="central">!</text>`; }
    const lab = String(p.label!=null && p.label!=='' ? p.label : p.x);
    lbls += `<div class="ax-lbl L L-pts" style="left:${(cx/W*100).toFixed(2)}%;top:${((y+13)/Hh*100).toFixed(2)}%">\\(${H(lab)}\\)</div>`;
  });

  const svg = `<svg viewBox="0 0 ${W} ${Hh}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Числовая ось">
    <defs>${defs}</defs>
    <g class="L L-shade">${gShade}</g>
    <line class="axl" x1="${L}" y1="${y}" x2="${W-8}" y2="${y}"/>
    <path class="axa" d="M${W-3} ${y} l-12 -5.5 v11 z"/>
    <text class="axv" x="${W-14}" y="${y+26}" text-anchor="middle">${H(v)}</text>
    <g class="L L-arcs">${gArcs}</g>
    <g class="L L-signs">${gSigns}</g>
    <g class="L L-pts">${gPts}</g>
    <g class="L L-mark">${gMark}</g>
  </svg>`;
  const stages = axisStages(axis).map(s=>s.k);
  const stage = o.stage==null ? stages.length-1 : o.stage;
  const on = stages.slice(0, stage+1).map(k=>'on-'+k).join(' ');
  const ans = (o.noAnswer || !showAns(axis, v)) ? '' : `<div class="ax-ans L L-ans"><b>Ответ по рисунку:</b>\\(${axisAnswer(axis, v)}\\)</div>`;
  const lg = [];
  if (o.legend !== false){
    if (used.closed) lg.push('<span><i class="lg-dot f"></i>входит</span>');
    if (used.open) lg.push('<span><i class="lg-dot"></i>не входит</span>');
    if (used.mark) lg.push('<span><b class="lg-ex">!</b>чётная кратность</span>');
    if (used.out) lg.push('<span><b class="lg-off">±</b>вне ОДЗ</span>');
    if (used.shade) lg.push('<span><i class="lg-h"></i>решение</span>');
  }
  const minW = Math.round(W*0.74);
  return `<div class="ax ${o.static?'static':''} ${on}" data-stages="${stages.join(',')}">
    <div class="ax-scroll"><div class="ax-in" style="min-width:${minW}px;max-width:${Math.round(W*1.35)}px">${svg}${lbls}</div></div>
    ${ans}${lg.length?`<div class="ax-legend">${lg.join('')}</div>`:''}
  </div>`;
}
function setAxStage(box, idx){
  const ax = box.querySelector('.ax'); if (!ax) return;
  const stages = (ax.dataset.stages||'').split(',').filter(Boolean);
  idx = Math.max(0, Math.min(stages.length-1, idx));
  stages.forEach((k,i)=> ax.classList.toggle('on-'+k, i<=idx));
  box.dataset.stage = idx;
  const meta = axisStages(box._axis||{});
  box.querySelectorAll('.pill').forEach((p,i)=>{ p.classList.toggle('done', i<idx); p.classList.toggle('cur', i===idx); });
  const cap = box.querySelector('.axcap'); if (cap && meta[idx]) cap.innerHTML = meta[idx].c;
  const last = idx>=stages.length-1;
  const nx = box.querySelector('[data-ax="next"]'), al = box.querySelector('[data-ax="all"]'), pv = box.querySelector('[data-ax="prev"]');
  if (nx) nx.hidden = last; if (al) al.hidden = last; if (pv) pv.disabled = idx===0;
  return idx;
}
function axisWidget(axis, v, stage){
  const st = axisStages(axis);
  return `<div class="axbox" data-stage="${stage}">
    ${axisHTML(axis, {v, stage})}
    ${st.length>1 ? `<div class="axctl">
      <div class="pills">${st.map((s,i)=>`<button class="pill" data-axi="${i}">${i+1}. ${s.s}</button>`).join('')}</div>
      <div class="axcap"></div>
      <div class="axbtns">
        <button class="btn" data-ax="prev">◂</button>
        <button class="btn pri" data-ax="next">Следующий этап ▸</button>
        <button class="btn ghost" data-ax="all">Показать всё</button>
      </div></div>` : ''}
  </div>`;
}

function guessVar(step, axis){
  if (axis && axis.var) return axis.var;
  const m = String(step&&step.q||'').match(/\$\s*([a-zA-Z])\s*\$/);
  if (m) return m[1];
  const e = String(step&&step.e||'').replace(/\\[a-zA-Z]+/g,' ');
  if (/(^|[^a-zA-Z])t([^a-zA-Z]|$)/.test(e) && !/(^|[^a-zA-Z])x([^a-zA-Z]|$)/.test(e)) return 't';
  return 'x';
}

/* ================= список ================= */
function SEC(){ return [...new Set(T.map(t=>t.s))].sort((a,b)=>String(a).localeCompare(String(b),'ru',{numeric:true})); }
function okf(t, st){
  st = st || fl.st; const x = S[t.id] || {};
  return st==='all' || (st==='new'&&!x.done) || (st==='done'&&x.done) || (st==='hw'&&x.hw) || (st==='fav'&&x.fav) || (st==='go'&&!x.done&&x.si>0);
}
function getFiltered(st){
  return T.filter(t => (!fl.sec||t.s===fl.sec) && (!fl.df||t.d===fl.df) &&
    (!fl.q || ((t.n||'')+' '+(t.c||'')+' '+(t.s||'')).toLowerCase().includes(fl.q)) && okf(t, st));
}
function setTaskMode(on){ document.body.classList.toggle('in-task', !!on); }

function menu(){

  const total=T.length, done=T.filter(t=>(S[t.id]||{}).done).length, hw=T.filter(t=>(S[t.id]||{}).hw).length, fav=T.filter(t=>(S[t.id]||{}).fav).length;

        <input id="fQ" class="inp" type="search" placeholder="🔎 Поиск по номеру или тексту" value="${A(fl.q)}">

  $('fSec').onchange = e => { fl.sec=e.target.value; shown=20; rows(); };
  $('fDf').onchange = e => { fl.df=e.target.value; shown=20; rows(); };

  rows();

function rows(){
  const C = [['all','Все'],['new','Не разобраны'],['go','В процессе'],['done','Разобраны'],['hw','ДЗ'],['fav','★ Избранное']];
  const chips = $('chips');
  if (chips){
    chips.innerHTML = C.map(c=>`<button class="chip ${fl.st===c[0]?'on':''}" data-st="${c[0]}">${c[1]}<em>${getFiltered(c[0]).length}</em></button>`).join('');
    chips.querySelectorAll('[data-st]').forEach(b => b.onclick = () => { fl.st=b.dataset.st; shown=20; rows(); });
  }
  const L = getFiltered();
  const el = $('rows'); if (!el) return;
  let html = '', lastSec = null;
  L.slice(0, shown).forEach(t => {
    if (!fl.sec && t.s !== lastSec){ html += `<div class="sec-h">${H(t.s)}</div>`; lastSec = t.s; }
    const x = S[t.id] || {}, nsteps = Array.isArray(t.ch) ? t.ch.filter(s=>!isEnd(s)).length : 0;
    const prog = !x.done && x.si>0 && nsteps ? `<span class="mini">шаг ${Math.min(x.si+1,nsteps)}/${nsteps}<span class="pbar"><i style="width:${Math.round(x.si/nsteps*100)}%"></i></span></span>` : '';
    html += `<div class="card row ${x.done?'done':''}">
      <div class="row-top">
        <span class="row-num">№ ${H(t.n)}</span>
        <span class="dd d-${H(t.d||'basic')}">${DF[t.d]||''}</span>
        ${nsteps ? `<span class="tag">${nsteps} шагов</span>` : '<span class="tag">без разбора</span>'}
        ${x.hw ? '<span class="tag" style="color:var(--wa)">ДЗ</span>' : ''}
        ${prog}
        ${x.done ? '<span class="stk">✓ РАЗОБРАНО</span>' : ''}
      </div>
      <div class="row-cond tx">${t.c||t.t||''}</div>
      <div class="row-act">
        <button class="btn pri" data-act="open" data-id="${A(t.id)}">${x.done?'Повторить':(x.si>0?'Продолжить':'Разбирать')} →</button>
        <button class="btn" data-act="fav" data-id="${A(t.id)}" title="Избранное">${x.fav?'★':'☆'}</button>
        <button class="btn" data-act="hw" data-id="${A(t.id)}">${x.hw?'✓ ДЗ':'+ ДЗ'}</button>
        <span class="sp"></span>

      </div></div>`;
  });
  el.innerHTML = html || '<div class="card empty">Ничего не найдено. Измените фильтры или загрузите JSON.</div>';
  if (L.length > shown){

    $('moreBtn').onclick = () => { shown += 20; rows(); };
  }
  el.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    const id=b.dataset.id, act=b.dataset.act;
    if (act==='open') openT(id); else if (act==='edit') editTask(id); else if (act==='del') delTask(id); else tg(id, act);
  });
  tx(el);
}
function tg(id,k){ const x=g(id); x[k]=!x[k]; sv(); if (cur) view(); else rows(); }

/* ================= карточка задачи ================= */
function openT(id, fromStart){
  cur = T.find(t => String(t.id)===String(id)); if (!cur) return;
  ch = Array.isArray(cur.ch) && cur.ch.length ? JSON.parse(JSON.stringify(cur.ch)) : null;
  const x = g(cur.id);
  si = (!fromStart && ch && !x.done && x.si>0) ? Math.min(x.si, ch.length-1) : 0;
  err = (!fromStart && x.err && si>0) ? x.err : 0;
  seen = new Set(); for (let i=0;i<si;i++) seen.add(i); rev = false; picked = {}; axStage = 0; mode = 'step';
  shuf(); view(); window.scrollTo({top:0});
}
function shuf(){
  const s = ch && ch[si];
  ord = s && Array.isArray(s.o) ? s.o.map((_,i)=>i).sort(()=>Math.random()-.5) : [];
}
function view(){

  $('app').innerHTML = `
    <div class="card task-head">

        ${ch ? `<div class="modes"><button data-mode="step" class="${mode==='step'?'on':''}">Пошагово</button><button data-mode="all" class="${mode==='all'?'on':''}">Всё решение</button></div>` : ''}
      </div>

  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { mode=b.dataset.mode; view(); });
  tx(document.querySelector('.task-head'));

function chain(){
  const el = $('ch'); if (!el) return;
  if (!ch){
    el.innerHTML = `<div class="card nochain">Разбора пока нет.<br>Нажмите ✏️, чтобы добавить шаги, или загрузите JSON.${cur.a?`<div class="solution-answer">${cur.a}</div>`:''}</div>`;
    setTaskMode(false); tx(el); return;
  }
  si = Math.max(0, Math.min(si, ch.length-1));
  const s = ch[si], fin = isEnd(s), total = ch.length;
  const x = g(cur.id);
  if (!x.done) { x.si = si; x.err = err; sv(); }

  const trail = si>0 ? `<details class="trail card" style="padding:12px 16px" ${window.innerWidth>900&&si<6?'open':''}>
      <summary>Ход решения · ${si} ${plural(si,'шаг','шага','шагов')}</summary>
      <ol>${ch.slice(0,si).map((p,i)=>{ const c=correctOption(p); return `<li data-n="${i+1}" data-go="${i}"><div class="te">\\(\\displaystyle ${H(p.e||'')}\\)</div>${c&&c.t?`<div class="ta">→ ${H(c.t).replace(/\n+/g,' ')}</div>`:''}</li>`; }).join('')}</ol>
    </details>` : '';

  let body = '';
  if (fin){
    if (!x.done){ x.done = true; x.si = 0; x.last = Date.now(); sv(); }
    let lastAx = null, lastStep = null;
    for (let i=ch.length-1;i>=0;i--){ const c=correctOption(ch[i]); if (c&&c.axis){ lastAx=c.axis; lastStep=ch[i]; break; } }
    body = `<div class="card final fade-in">
      <div class="big">🎉</div>
      <h2>Ответ получен</h2>
      <div class="meta">${err ? `Ошибок при выборе: ${err}` : 'Без ошибок — отлично!'}</div>
      <div class="solution-answer">${cur.a ? cur.a : '\\('+H(s.e||'')+'\\)'}</div>
      ${lastAx ? `<div style="max-width:640px;margin:10px auto 0">${axisHTML(lastAx,{v:guessVar(lastStep,lastAx), static:true, noAnswer:true})}</div>` : ''}
      <div class="bar" style="justify-content:center;margin-top:18px">
        <button class="btn" id="redoBtn">↺ Сначала</button>
        <button class="btn" id="allBtn">Всё решение</button>
        <button class="btn pri" id="nextBtn">Следующее задание →</button>
      </div></div>`;
  } else {
    const opts = Array.isArray(s.o) ? s.o.filter(Boolean) : [];
    const good = correctOption(s);
    const quiz = opts.length > 1 && !rev;
    const nextS = ch[si+1];
    const showRes = rev && nextS && String(nextS.e||'').trim() && String(nextS.e).trim()!==String(s.e||'').trim();

    body = `<div class="card">
      <div class="lbl">Текущее выражение</div>
      <div class="eq fade-in">$$${H(s.e||'')}$$</div>
      ${s.q ? `<div class="hint"><span class="qi">?</span><div class="qt">${H(cleanQ(s.q))}</div></div>` : ''}
      ${quiz ? `<div class="opts">${ord.map(i=>{ const o=opts[i]; const st=picked[i]; return `<button class="opt ${st||''}" data-opt="${i}">${H(o.t||'')}${o.axis?axisHTML(o.axis,{v,static:true,noAnswer:true,legend:false}):''}${st==='wrong'&&o.why?`<div class="why">${H(o.why)}</div>`:''}</button>`; }).join('')}</div>` : ''}
      ${rev && good ? `<div class="fade-in">
          ${good.t ? `<div class="action"><div class="ah">✓ Что делаем</div>${H(good.t)}</div>` : ''}
          ${good.axis ? axisWidget(good.axis, v, axStage) : ''}
          ${showRes ? `<div class="result"><div class="arrow">↓ Результат преобразования</div><div class="eq small">$$${H(nextS.e)}$$</div></div>` : ''}
        </div>` : ''}
      ${!rev && !quiz && !good ? '<div class="meta" style="margin-top:12px">Для этого шага в JSON нет правильного варианта (ok: true).</div>' : ''}
      <div class="stepbtns">
        <button class="btn" id="prevStep2" ${si===0?'disabled':''}>←</button>
        <span class="sp"></span>
        <span class="kbd hide-m"><kbd>Пробел</kbd> далее · <kbd>←</kbd><kbd>→</kbd> шаги</span>

  if ($('goNext')) $('goNext').onclick = () => goStep(si+1);

  if ($('nextBtn')) $('nextBtn').onclick = nxt;

function plural(n,a,b,c){ n=Math.abs(n)%100; const n1=n%10; if(n>10&&n<20)return c; if(n1>1&&n1<5)return b; if(n1===1)return a; return c; }

function reveal(){
  const s = ch[si], good = correctOption(s);
  rev = true; seen.add(si);
  const st = good && good.axis ? axisStages(good.axis) : [];
  axStage = SET.staged && st.length>2 ? 0 : Math.max(0, st.length-1);
  chain();
}
function pick(i){
  const s = ch[si], o = s.o[i];
  if (o && o.ok){ picked[i]='right'; reveal(); }
  else { picked[i]='wrong'; err++; chain(); }
}
function goStep(n, fromSlider){
  if (!ch) return;
  n = Math.max(0, Math.min(ch.length-1, Number(n)||0));
  if (n===si && !fromSlider) return;
  si = n; picked = {};
  rev = seen.has(n);
  const good = correctOption(ch[si]);
  axStage = rev && good && good.axis ? axisStages(good.axis).length-1 : 0;
  shuf(); chain();
  if (!fromSlider){ const c=document.querySelector('.stepnav'); if (c && window.scrollY > c.offsetTop) window.scrollTo({top:c.offsetTop-70,behavior:'smooth'}); }
}
function primary(){
  if (!ch || mode!=='step') return;
  const s = ch[si];
  if (isEnd(s)) { nxt(); return; }
  const good = correctOption(s), quiz = (s.o||[]).filter(Boolean).length>1;
  if (!rev){ if (quiz) return; if (good) { reveal(); return; } goStep(si+1); return; }
  if (good && good.axis){
    const n = axisStages(good.axis).length;
    if (axStage < n-1){ const box=document.querySelector('.axbox'); if (box){ axStage=setAxStage(box, axStage+1); dock(); return; } }
  }
  goStep(si+1);
}
function dock(){
  const m = $('dMain'); if (!m || !ch) return;
  const s = ch[si];
  $('dPrev').disabled = si===0; $('dNext').disabled = si>=ch.length-1;
  if (isEnd(s)) m.textContent = 'Следующее задание →';
  else if (!rev) m.textContent = (s.o||[]).filter(Boolean).length>1 ? 'Выберите вариант' : 'Показать, что делать';
  else { const g2 = correctOption(s); const n = g2&&g2.axis ? axisStages(g2.axis).length : 0;
    m.textContent = n && axStage<n-1 ? 'Следующий этап оси ▸' : (isEnd(ch[si+1])?'К ответу ✓':'Дальше →'); }
}
function redo(){ si=0; err=0; rev=false; seen=new Set(); picked={}; axStage=0; mode='step'; const x=g(cur.id); x.si=0; sv(); shuf(); view(); }
function nxt(){
  const L = getFiltered(); let i = L.findIndex(t=>String(t.id)===String(cur.id));

function mergeTasks(arr, replace){
  if (replace) T = [];
  let added=0, upd=0, skipped=0;
  for (const src of arr){
    if (!src || typeof src!=='object' || Array.isArray(src)){ skipped++; continue; }
    const t = Object.assign({}, src);
    if (!t.id) t.id = Date.now()+Math.floor(Math.random()*100000)+added;
    if (!t.n) t.n = String(T.length+added+1).padStart(3,'0');
    if (!t.s) t.s = 'Без раздела';
    if (!t.d) t.d = 'basic';
    if (!t.c) t.c = t.t || '';
    const i = T.findIndex(x => String(x.id)===String(t.id));
    if (i>=0){ T[i] = Object.assign({}, T[i], t); upd++; } else { T.push(t); added++; }
  }
  sortT(); persistTasks();
  return {added, upd, skipped};
}

function axisEditor(obj, onChange){
  const box = $('tabAxis');
  const steps = Array.isArray(obj.ch) ? obj.ch : (obj.ch = []);
  const idxs = steps.map((s,i)=>i).filter(i=>!isEnd(steps[i]));
  if (!idxs.length){ box.innerHTML = '<div class="meta">В задаче пока нет шагов. Добавьте шаги в JSON (поле <code>ch</code>).</div>'; return; }
  let si0 = idxs.find(i => { const c=correctOption(steps[i]); return c&&c.axis; });
  if (si0==null) si0 = idxs[idxs.length-1];
  let model;
  const load = i => {
    const c = correctOption(steps[i]), ax = c && c.axis;
    const N = normAxis(ax||{points:[],intervals:[]});
    model = { v: (ax&&ax.var) || guessVar(steps[i], ax), pts: N.pts.map(p=>({label:String(p.label!=null&&p.label!==''?p.label:p.x), type:p.type==='closed'?'closed':'open', mark:p.mark==='!'})),
      ivs: N.ivs.map(it=>({sign:sgnOf(it), arc:it?arcOf(it):true, shade:!!(it&&it.shade), out:!!(it&&it.out)})) };
    if (!model.pts.length){ model.pts=[{label:'0',type:'open',mark:false}]; model.ivs=[{sign:'-',arc:true,shade:false,out:false},{sign:'+',arc:true,shade:false,out:false}]; }
  };
  const toAxis = () => {
    const n = model.pts.length;
    const points = [{x:0,label:'',type:'hidden'}].concat(model.pts.map((p,i)=>{ const d={x:i+1,label:p.label,type:p.type}; if(p.mark)d.mark='!'; return d; }), [{x:n+1,label:'',type:'hidden'}]);
    const intervals = model.ivs.map((it,k)=>{ const d={from:k,to:k+1}; if(it.sign)d.label=it.sign; d.arc=!!it.arc; if(it.shade)d.shade=true; if(it.out)d.out=true; return d; });
    return {var:model.v, points, intervals};
  };
  const ivName = k => { const n=model.pts.length; const a=k===0?'−∞':model.pts[k-1].label, b=k===n?'+∞':model.pts[k].label; return `(${a}; ${b})`; };
  const autoSigns = () => {
    let s = '+';
    for (let k=model.ivs.length-1;k>=0;k--){
      model.ivs[k].sign = s;
      const p = model.pts[k-1];
      if (p && !p.mark) s = s==='+'?'-':'+';
    }
  };
  const render = () => {
    const ax = toAxis();
    box.innerHTML = `
      <div class="bar" style="margin-bottom:8px">
        <label class="meta">Шаг: <select id="axStep" class="inp" style="max-width:420px">${idxs.map(i=>`<option value="${i}" ${i===si0?'selected':''}>${i+1}. ${H(cleanQ(steps[i].q||'').slice(0,60))}${(()=>{const c=correctOption(steps[i]);return c&&c.axis?' 📐':''})()}</option>`).join('')}</select></label>
        <label class="meta">Переменная <input id="axVar" class="inp" style="width:56px" value="${A(model.v)}"></label>
      </div>
      <div class="axe-sec">Точки (слева направо, подпись в LaTeX)</div>
      <div class="axe-grid">${model.pts.map((p,i)=>`<div class="axe-row">
        <span class="n">${i+1}</span>
        <input class="inp" data-p="${i}" data-f="label" value="${A(p.label)}">
        <select class="inp" data-p="${i}" data-f="type"><option value="closed" ${p.type==='closed'?'selected':''}>● закрашенная</option><option value="open" ${p.type==='open'?'selected':''}>○ выколотая</option></select>
        <label title="Чётная кратность"><input type="checkbox" data-p="${i}" data-f="mark" ${p.mark?'checked':''}> !</label>
        <span class="bar" style="gap:2px;flex-wrap:nowrap"><button class="btn ghost" style="padding:4px 6px" data-mv="${i}" data-d="-1" title="Левее">↑</button><button class="btn ghost danger" style="padding:4px 6px" data-del="${i}" title="Удалить">✕</button></span>
      </div>`).join('')}</div>
      <div class="bar" style="margin-top:8px"><button class="btn" id="axAddPt">+ точка</button><button class="btn" id="axAuto" title="Справа «+», дальше чередуем; через «!» знак не меняется">⚡ Автознаки</button><button class="btn ghost" id="axNoArcs">Без дуг (простой луч)</button></div>
      <div class="axe-sec">Промежутки</div>
      <div class="axe-grid">${model.ivs.map((it,k)=>`<div class="axe-row iv">
        <span class="axe-ivname">\\(${H(ivName(k).replace('−∞','-\\infty').replace('+∞','+\\infty'))}\\)</span>
        <select class="inp" data-i="${k}" data-f="sign"><option value="" ${!it.sign?'selected':''}>—</option><option value="+" ${it.sign==='+'?'selected':''}>+</option><option value="-" ${it.sign==='-'?'selected':''}>−</option></select>
        <label><input type="checkbox" data-i="${k}" data-f="arc" ${it.arc?'checked':''}> дуга</label>
        <label><input type="checkbox" data-i="${k}" data-f="shade" ${it.shade?'checked':''}> штрих</label>
        <label><input type="checkbox" data-i="${k}" data-f="out" ${it.out?'checked':''}> вне ОДЗ</label>
      </div>`).join('')}</div>
      <div class="axe-sec">Предпросмотр</div>
      <div class="axbox" style="margin-top:0">${axisHTML(ax,{v:model.v,static:true})}</div>
      <div class="bar" style="margin-top:10px;justify-content:flex-end"><button class="btn danger" id="axRemove">Убрать ось из шага</button><button class="btn pri" id="axApply">✓ Записать ось в шаг ${si0+1}</button></div>`;
    $('axStep').onchange = e => { si0 = Number(e.target.value); load(si0); render(); };
    $('axVar').oninput = e => { model.v = e.target.value || 'x'; };
    $('axVar').onchange = render;
    box.querySelectorAll('[data-p]').forEach(inp => inp.onchange = () => {
      const p = model.pts[Number(inp.dataset.p)], f = inp.dataset.f;
      p[f] = inp.type==='checkbox' ? inp.checked : inp.value; render();
    });
    box.querySelectorAll('[data-i]').forEach(inp => inp.onchange = () => {
      const it = model.ivs[Number(inp.dataset.i)], f = inp.dataset.f;
      it[f] = inp.type==='checkbox' ? inp.checked : inp.value; render();
    });
    box.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
      const i = Number(b.dataset.del); if (model.pts.length<=1) return;
      model.pts.splice(i,1); model.ivs.splice(i+1,1); render();
    });
    box.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => {
      const i = Number(b.dataset.mv); if (i===0) return;
      [model.pts[i-1], model.pts[i]] = [model.pts[i], model.pts[i-1]]; render();
    });
    $('axAddPt').onclick = () => { model.pts.push({label:String(model.pts.length), type:'open', mark:false}); model.ivs.push({sign:'',arc:true,shade:false,out:false}); render(); };
    $('axAuto').onclick = () => { autoSigns(); model.ivs.forEach(it=>it.arc=true); render(); };
    $('axNoArcs').onclick = () => { model.ivs.forEach(it=>{ it.arc=false; it.sign=''; }); render(); };
    $('axApply').onclick = () => {
      const st = steps[si0]; if (!Array.isArray(st.o)) st.o = [];
      let c = correctOption(st); if (!c){ c={t:'',ok:true}; st.o.push(c); }
      c.axis = toAxis(); onChange(obj); toast('Ось записана в шаг '+(si0+1)+'. Не забудьте «Сохранить».'); render();
    };
    $('axRemove').onclick = () => { const c=correctOption(steps[si0]); if (c){ delete c.axis; onChange(obj); toast('Ось удалена из шага'); } };
    tx(box);
  };
  load(si0); render();
}

function editTask(id){ closeMenu(); const t=T.find(x=>String(x.id)===String(id)); if (t) openModal(t,false,id); }
function addTask(){
  closeMenu();
  openModal({ id: Date.now(), n: String(T.length+1).padStart(3,'0'), s: 'Без раздела', d: 'basic',
    t: 'Решите неравенство: \\( \\dfrac{x-1}{x+2} \\ge 0 \\).', c: 'Решите неравенство: \\( \\dfrac{x-1}{x+2} \\ge 0 \\).',
    a: 'Ответ: \\( x\\in(-\\infty;\\ -2)\\cup[1;\\ +\\infty) \\).', ap: 'x\\in(-\\infty;\\ -2)\\cup[1;\\ +\\infty)',
    ch: [
      {e:'\\dfrac{x-1}{x+2} \\ge 0', q:'Найдите нули числителя и знаменателя.', o:[{t:'Числитель: $x=1$ (закрашена). Знаменатель: $x=-2$ (выколота).', ok:true}]},
      {e:'\\dfrac{x-1}{x+2} \\ge 0', q:'Решите методом интервалов.', o:[{t:'Нужны промежутки со знаком «+».', ok:true, axis:{var:'x',points:[{x:0,label:'',type:'hidden'},{x:1,label:'-2',type:'open'},{x:2,label:'1',type:'closed'},{x:3,label:'',type:'hidden'}],intervals:[{from:0,to:1,label:'+',arc:true,shade:true},{from:1,to:2,label:'-',arc:true},{from:2,to:3,label:'+',arc:true,shade:true}]}}]},
      {e:'x\\in(-\\infty;\\ -2)\\cup[1;\\ +\\infty)', q:'END'}
    ]}, true, null);
}
function delTask(id){
  if (!confirm('Удалить эту задачу?')) return;
  T = T.filter(x=>String(x.id)!==String(id)); persistTasks(); delete S[id]; sv();
  if (cur && String(cur.id)===String(id)) menu(); else rows();
  toast('Задача удалена');
}

/* ================= теория ================= */
function theory(){
  cur = null; setTaskMode(false); closeMenu();
  const demo = {var:'x', points:[{x:0,type:'hidden'},{x:1,label:'-3',type:'open'},{x:2,label:'-2',type:'closed'},{x:3,label:'1',type:'closed',mark:'!'},{x:4,label:'4',type:'open'},{x:5,type:'hidden'}],
    intervals:[{from:0,to:1,label:'-',arc:true,out:true},{from:1,to:2,label:'+',arc:true},{from:2,to:3,label:'-',arc:true,shade:true},{from:3,to:4,label:'-',arc:true,shade:true},{from:4,to:5,label:'+',arc:true}]};
  $('app').innerHTML = `
    <div class="bar" style="margin-bottom:14px"><button id="backBtn2" class="btn ghost">← К списку</button></div>
    <h2 style="margin:0 0 14px;font-size:24px;letter-spacing:-.5px">📚 Шпаргалка по неравенствам</h2>
    <div class="theory-grid">
      <div class="sticker st-blue wide">
        <h3>📈 Как оформлять метод интервалов</h3>
        <p>Пример: $\\dfrac{(x-1)^2(x+2)}{x-4}\\le 0$ при ОДЗ $x>-3$.</p>
        <div id="demoAx">${axisWidget(demo,'x',0)}</div>
        <p class="meta" style="margin-top:10px">Точка $1$ — корень чётной кратности (!): знак через неё не меняется, а сама точка входит в ответ. Левее $-3$ — вне ОДЗ, знак зачёркнут.</p>
      </div>
      <div class="sticker st-blue">
        <h3>🧭 Алгоритм</h3>
        <p>1) Приводим к виду $\\frac{P(x)}{Q(x)} \\vee 0$. 2) Нули числителя — закрашенные при $\\le,\\ \\ge$, выколотые при $<,\\ >$. Нули знаменателя — всегда выколотые. 3) Учитываем ОДЗ. 4) Знак на крайнем правом промежутке — по старшим коэффициентам, дальше чередуем.</p>
      </div>
      <div class="sticker st-green">
        <h3>🌱 Показательные</h3>
        <p>Если $a > 1$: $a^{f} \\vee a^{g} \\iff f \\vee g$.</p>
        <p>Если $0 < a < 1$: знак неравенства <b>меняется</b>.</p>
        <p>Число $b > 0$ записываем как $a^{\\log_a b}$, чтобы сбросить основания.</p>
        <div class="ex">$2^x < 8 \\Rightarrow 2^x < 2^3 \\Rightarrow x < 3$</div>
      </div>
      <div class="sticker st-purple">
        <h3>📝 Логарифмические</h3>
        <p>ОДЗ: аргумент $>0$, основание $>0,\\ \\ne 1$.</p>
        <p>При $a > 1$ знак сохраняется, при $0 < a < 1$ — меняется.</p>
        <div class="ex">$\\log_2(x-1) < 3 \\Rightarrow 0 < x-1 < 8$</div>
      </div>
      <div class="sticker st-cyan">
        <h3>⚡ Метод рационализации</h3>
        <p>Знак $a^{f}-a^{g}$ совпадает со знаком $(a-1)(f-g)$.</p>
        <p>Знак $\\log_a f-\\log_a g$ совпадает со знаком $(a-1)(f-g)$ — на ОДЗ.</p>
        <div class="ex">$\\dfrac{4^{f}-4^{g}}{5^{x-1}-1}\\vee 0 \\iff \\dfrac{f-g}{x-1}\\vee 0$</div>
      </div>
      <div class="sticker st-orange">
        <h3>📐 Иррациональные</h3>
        <p>$\\sqrt{A} < B \\iff \\begin{cases} A \\ge 0 \\\\ B > 0 \\\\ A < B^2 \\end{cases}$</p>
        <p>$\\sqrt{A} > B \\iff \\left[ \\begin{array}{l} \\begin{cases} B < 0 \\\\ A\\ge 0\\end{cases} \\\\ \\begin{cases} B \\ge 0 \\\\ A > B^2 \\end{cases} \\end{array} \\right.$</p>
      </div>
      <div class="sticker st-red">
        <h3>⚖️ Системы и совокупности</h3>
        <p><b>Система</b> — это <b>И</b> (пересечение): $\\begin{cases} A > 0 \\\\ B < 0 \\end{cases}$</p>
        <p><b>Совокупность</b> — это <b>ИЛИ</b> (объединение): $\\left[ \\begin{array}{l} A = 0 \\\\ B = 0 \\end{array} \\right.$</p>
        <p>ОДЗ добавляем к системе под общую фигурную скобку.</p>
      </div>
      <div class="sticker st-cyan">
        <h3>🎯 Оценка знака</h3>
        <p>Удобно подставить $x=0$ или $x \\to +\\infty$, чтобы проверить знак на крайнем правом промежутке.</p>
        <p>При переходе через корень <b>нечётной</b> кратности знак меняется, <b>чётной</b> — нет.</p>
      </div>
    </div>`;
  $('backBtn2').onclick = menu;
  const wb = $('demoAx').querySelector('.axbox'); wb._axis = demo;
  let st = setAxStage(wb, 0);
  wb.querySelectorAll('[data-axi]').forEach(p => p.onclick = () => { st = setAxStage(wb, Number(p.dataset.axi)); });
  wb.querySelectorAll('[data-ax]').forEach(b => b.onclick = () => { const a=b.dataset.ax; st = setAxStage(wb, a==='next'?st+1:a==='prev'?st-1:99); });
  tx($('app'));
}

/* ================= тема / меню / клавиши ================= */
function th(){
  const r = document.documentElement;
  r.dataset.theme = r.dataset.theme==='dark' ? 'light' : 'dark';
  try { localStorage.setItem('ineq.v3.theme', r.dataset.theme); } catch(e){}
  themeIcon();
}
function themeIcon(){ const d=document.documentElement.dataset.theme==='dark'; $('btnTheme').textContent = d?'☀️':'🌙'; document.querySelector('meta[name=theme-color]').content = d?'#0e1020':'#f5f6fb'; }
function closeMenu(){ $('hdr').classList.remove('open'); }

function init(){
  loadSeed();
  const savedSize = localStorage.getItem('ineq.v2.fontSize');
  if (savedSize){ document.body.className = 'text-'+savedSize; $('fontSizeSel').value = savedSize; }
  themeIcon();
  $('btnTheory').onclick = theory;
  $('btnAdd').onclick = addTask;
  $('btnImport').onclick = importJson;
  $('btnExport').onclick = () => { closeMenu(); exportJson(); };
  $('btnSaveApp').onclick = () => { closeMenu(); saveWholeApp(); };
  $('btnPrint').onclick = printTasks;
  $('btnTheme').onclick = th;
  $('btnMenu').onclick = e => { e.stopPropagation(); $('hdr').classList.toggle('open'); };
  $('brand').onclick = menu;
  document.addEventListener('click', e => { if (!e.target.closest('#hdr')) closeMenu(); });
  $('fontSizeSel').onchange = e => {
    const inTask = document.body.classList.contains('in-task');
    document.body.className = 'text-'+e.target.value + (inTask?' in-task':'');
    localStorage.setItem('ineq.v2.fontSize', e.target.value);
  };
  $('dPrev').onclick = () => goStep(si-1);
  $('dNext').onclick = () => goStep(si+1);
  $('dMain').onclick = primary;
  document.addEventListener('keydown', e => {
    if (!cur || !ch || mode!=='step' || $('modalRoot').innerHTML) return;
    if (/INPUT|TEXTAREA|SELECT/.test((e.target||{}).tagName||'')) return;
    if (e.key===' ' || e.key==='Enter'){ e.preventDefault(); primary(); }
    else if (e.key==='ArrowRight'){ e.preventDefault(); goStep(si+1); }
    else if (e.key==='ArrowLeft'){ e.preventDefault(); goStep(si-1); }
  });
  document.addEventListener('keydown', e => { if (e.key==='Escape' && $('modalRoot').innerHTML) closeModal(); });
  window.__ineq = {T:()=>T, axisAnswer, normAxis};
  menu();
}
if (document.readyState==='loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
