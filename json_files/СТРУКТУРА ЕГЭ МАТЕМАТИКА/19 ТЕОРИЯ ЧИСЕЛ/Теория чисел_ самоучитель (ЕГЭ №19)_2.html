<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<title>Теория чисел: самоучитель (ЕГЭ №19)</title>
<style>
:root{
  --bg:#f6f1e7; --paper:#fffdf8; --ink:#1f2328; --muted:#6b6f76; --line:#e4dccb; --soft:#efe7d6;
  --accent:#1d5fd1; --accent-soft:#e3ecfb; --ok:#1f8a4c; --ok-soft:#dff3e6; --bad:#c2372d; --bad-soft:#fbe4e1;
  --warn:#9a6400; --warn-soft:#fff1d1; --sticker:#ffd84d; --sticker-ink:#4a3a00; --fact:#6a3fb5; --fact-soft:#efe8fb;
  --shadow:0 1px 2px rgba(60,40,0,.06),0 6px 18px rgba(60,40,0,.06);
  --serif: "Iowan Old Style","Palatino Linotype",Palatino,"PT Serif",Georgia,serif;
  --sans: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
[data-theme="dark"]{
  --bg:#15171b; --paper:#1d2026; --ink:#e8e6e1; --muted:#9aa0a8; --line:#2f333b; --soft:#262a31;
  --accent:#7aa7ff; --accent-soft:#22304a; --ok:#5fd18f; --ok-soft:#1b3326; --bad:#ff8a80; --bad-soft:#3a2120;
  --warn:#f1c25b; --warn-soft:#3a3018; --sticker:#ffd84d; --sticker-ink:#3a2e00; --fact:#b99bf2; --fact-soft:#2c2540;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
/* ---------- login */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:28px;max-width:440px;width:100%}
.login h1{font-family:var(--serif);font-size:28px;margin:0 0 4px;line-height:1.15}
.login p{color:var(--muted);margin:0 0 18px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{flex:1;min-width:0;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.field:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.btn{border:1px solid var(--line);background:var(--paper);padding:9px 14px;border-radius:10px;font-weight:600;font-size:15px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
[data-theme="dark"] .btn.primary{color:#0d1424}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--soft)}
.names{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.name-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);text-align:left;width:100%}
.name-item:hover{border-color:var(--accent)}
.name-item small{color:var(--muted)}
/* ---------- app shell */
.app{display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);height:100%}
header.top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:20}
.brand{font-family:var(--serif);font-weight:700;font-size:18px;white-space:nowrap}
.who{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:14px;color:var(--muted)}
.bar{width:120px;height:8px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok)}
.iconbtn{border:1px solid var(--line);background:var(--paper);width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.iconbtn:hover{border-color:var(--accent)}
.menu{position:absolute;right:12px;top:54px;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:260px;z-index:40}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:8px}
.menu button:hover{background:var(--soft)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.body{display:grid;grid-template-columns:320px 1fr;min-height:0}
aside.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--paper)}
.filters{padding:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;padding:6px 4px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tagsel{flex:1;min-width:0;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:14px}
.plist{overflow:auto;flex:1;padding:6px}
.pitem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;width:100%;text-align:left;padding:10px;border:1px solid transparent;border-radius:12px;background:transparent;margin-bottom:2px;position:relative}
.pitem:hover{background:var(--soft)}
.pitem.cur{background:var(--accent-soft);border-color:var(--accent)}
.pnum{font-family:var(--serif);font-weight:700;font-size:15px;min-width:30px;color:var(--muted)}
.ptxt{font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dots{display:flex;gap:3px;margin-top:5px}
.dots i{width:16px;height:5px;border-radius:3px;background:var(--line)}
.dots i.ok{background:var(--ok)}
.dots i.seen{background:var(--warn)}
.sticker{position:absolute;right:6px;top:6px;background:var(--sticker);color:var(--sticker-ink);font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;transform:rotate(4deg);box-shadow:0 1px 0 rgba(0,0,0,.15);letter-spacing:.02em}
.fav{color:#e2a400}
main{overflow:auto;min-height:0;min-width:0}
.wrap{max-width:860px;margin:0 auto;padding:20px 18px 80px}
.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.phead h2{font-family:var(--serif);margin:0;font-size:24px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:var(--soft);font-size:12.5px;color:var(--muted);border:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:14px}
.stem{font-family:var(--serif);font-size:18px;line-height:1.55;white-space:pre-wrap}
.note{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.tabs{display:flex;gap:6px;margin:6px 0 12px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--paper);padding:7px 16px;border-radius:10px;font-weight:700;font-family:var(--serif);font-size:17px;position:relative}
.tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab .mk{position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;background:var(--ok);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;font-family:var(--sans)}
.q{font-family:var(--serif);font-size:18px;margin:0 0 14px}
.ans{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.yn{min-width:84px;padding:10px 16px;border-radius:12px;border:2px solid var(--line);background:var(--paper);font-weight:800;font-size:16px}
.yn:hover{border-color:var(--accent)}
.feedback{margin-top:12px;padding:10px 14px;border-radius:12px;font-weight:600}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.feedback.info{background:var(--soft);color:var(--ink);font-weight:500}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.steps{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:32px 1fr;gap:10px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.snum{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.stext{font-size:16px;line-height:1.55;padding-top:2px}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.fchip{border:0;background:#fff3a8;color:#4a3a00;padding:3px 10px 4px;border-radius:2px;font-size:13px;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.18);transform:rotate(-1.2deg)}
.fchip:nth-child(even){background:#ffd9e2;transform:rotate(1deg)}
.fchip:nth-child(3n){background:#d4f5dc}
.fchip:hover{transform:rotate(0) scale(1.05)}
.diff{color:#e29a00;letter-spacing:1px;font-size:12px}
.navrow{display:flex;justify-content:space-between;gap:8px;margin-top:6px}
/* ---------- theory drawer */
.drawer{position:fixed;top:0;right:0;height:100%;width:min(460px,100%);background:var(--paper);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.12);z-index:50;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .22s ease}
.drawer.open{transform:none}
.dhead{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.dtitle{display:flex;align-items:center;gap:8px}
.dtitle b{font-family:var(--serif);font-size:19px;flex:1}
.dbody{overflow:auto;padding:14px 16px 40px;flex:1}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 8px;font-weight:700}
.fact{position:relative;border:0;border-radius:3px 3px 14px 3px;padding:16px 16px 14px;margin:6px 4px 18px;background:var(--st1);color:#2b2a26;box-shadow:0 1px 1px rgba(0,0,0,.08),0 8px 16px -8px rgba(60,40,0,.35);transform:rotate(var(--rot,-.6deg));transition:transform .15s}
.fact:hover{transform:rotate(0deg) scale(1.01)}
.fact::before{content:"";position:absolute;top:-9px;left:50%;width:70px;height:18px;margin-left:-35px;background:rgba(255,255,255,.55);border:1px solid rgba(0,0,0,.06);transform:rotate(-2deg)}
.fact.c1{background:var(--st1)} .fact.c2{background:var(--st2)} .fact.c3{background:var(--st3)} .fact.c4{background:var(--st4)}
.fact.hl{box-shadow:0 0 0 3px var(--fact),0 8px 16px -8px rgba(60,40,0,.35)}
.fact h4{margin:0 0 4px;font-family:"Caveat","Segoe Print","Bradley Hand","Comic Sans MS",cursive;font-size:24px;line-height:1.1;color:#3b2f7a}
.fact p{margin:0;font-size:14.5px;line-height:1.5}
.fact .ex{display:block;margin:12px -4px 2px 18px;padding:9px 12px 10px;background:#fffdf3;border-radius:2px;box-shadow:0 2px 6px rgba(0,0,0,.15);transform:rotate(1.6deg);font-size:14px;color:#33302a;position:relative}
.fact .ex b{display:block;font-family:"Caveat","Segoe Print","Comic Sans MS",cursive;font-size:20px;font-weight:700;color:#c2410c;margin-bottom:1px}
:root{--st1:#fff3a8;--st2:#ffd9e2;--st3:#d4f5dc;--st4:#d9ecff}
[data-theme="dark"]{--st1:#efe08a;--st2:#f0c3cf;--st3:#bfe5c8;--st4:#c4dcf3}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:45}
/* ---------- modal */
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:60;padding:16px;background:rgba(0,0,0,.35)}
.mbox{background:var(--paper);border-radius:16px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:20px;border:1px solid var(--line);box-shadow:var(--shadow)}
.mbox h3{margin:0 0 10px;font-family:var(--serif);font-size:22px}
.mbox textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
table.stat{width:100%;border-collapse:collapse;font-size:14px}
table.stat td,table.stat th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:12px;z-index:70;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);max-width:92vw}
.toast button{background:var(--paper);color:var(--ink);border:0;border-radius:8px;padding:5px 10px;font-weight:700}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.mobile-only{display:none}
@media (max-width:860px){
  .body{grid-template-columns:minmax(0,1fr)}
  header.top{gap:6px;padding:8px 10px}
  .brand{display:none}
  .who .pc{display:none}
  .phead h2{font-size:21px}
  aside.list{position:fixed;left:0;top:53px;bottom:0;width:min(340px,92vw);z-index:30;transform:translateX(-105%);transition:transform .22s ease;box-shadow:10px 0 30px rgba(0,0,0,.15)}
  aside.list.open{transform:none}
  .mobile-only{display:inline-flex}
  .bar{width:60px}
  .brand{font-size:16px}
  .who .nm{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wrap{padding:14px 12px 80px}
  .card{padding:14px}
  .stem,.q{font-size:17px}
}
@media print{header.top,aside.list,.tools,.drawer{display:none!important}}
</style>
</head>

<script id="app-data" type="application/json">{"version":2,"title":"Теория чисел: самоучитель (ЕГЭ №19)","tags":{"digits":"Цифры и запись числа","div":"Делимость и остатки","ops":"Операции и инварианты","avg":"Средние и проценты","est":"Оценка + пример","seq":"Последовательности","eq":"Уравнения в целых"},"sections":[["div","Делимость и признаки делимости"],["fta","Простые числа, НОД, НОК"],["mod","Остатки и сравнения"],["dec","Десятичная запись числа"],["par","Чётность"],["inv","Инварианты и операции"],["seq","Прогрессии и суммы"],["eq","Уравнения в целых числах"],["avg","Средние, доли, проценты"],["est","Оценка + пример, крайний, Дирихле"]],"facts":[{"id":"div_def","s":"div","n":"Определение делимости","t":"Число a делится на b (b ≠ 0), если a = b·k для некоторого целого k. Пишут b | a.","e":"84 = 14·6, значит 14 | 84. А 230 не делится на 14: 230 = 14·16 + 6."},{"id":"div_sum","s":"div","n":"Делимость суммы и разности","t":"Если a и b делятся на m, то a ± b делится на m. Если сумма a + b делится на m и a делится на m, то и b делится на m. Сумма двух чисел, кратных m, кратна m.","e":"Оба числа кратны 45 ⇒ их сумма кратна 45. 3435 : 45 = 76,33… ⇒ 3435 не может быть суммой двух чисел, кратных 45."},{"id":"div_rules","s":"div","n":"Признаки делимости","t":"На 2 — последняя цифра чётная; на 5 — последняя 0 или 5; на 10 — последняя 0; на 4 — число из двух последних цифр делится на 4; на 8 — из трёх последних; на 3 и на 9 — сумма цифр делится на 3 (на 9); на 11 — знакочередующаяся сумма цифр делится на 11.","e":"9720: сумма цифр 18 ⇒ делится на 9, оканчивается на 0 ⇒ делится на 5, значит делится на 45. 9167169: 9−1+6−7+1−6+9 = 11 ⇒ делится на 11."},{"id":"div_comp","s":"div","n":"Делимость на составное число","t":"Если число делится на взаимно простые a и b, то оно делится на a·b. Поэтому: на 36 = 4·9 — проверяем 4 и 9; на 45 = 5·9; на 15 = 3·5; на 60 = 3·4·5.","e":"Двузначные кратные 36: 36 и 72 — других нет (108 уже трёхзначное)."},{"id":"div_count","s":"div","n":"Кратные среди подряд идущих чисел","t":"Среди любых k подряд идущих натуральных чисел ровно одно делится на k. Если среди L подряд идущих чисел ровно m делятся на k, то (m−1)·k + 1 ≤ L ≤ (m+1)·k − 1.","e":"Ровно 5 чисел, делящихся на 15 ⇒ 61 ≤ L ≤ 89. Чтобы 6 чисел делились на 17, нужно L ≥ 5·17 + 1 = 86."},{"id":"fta","s":"fta","n":"Основная теорема арифметики","t":"Любое натуральное число больше 1 раскладывается на простые множители, и притом единственным образом (с точностью до порядка).","e":"945 = 3³·5·7. 2108 = 2²·17·31. 1001 = 7·11·13."},{"id":"prime_min","s":"fta","n":"Наименьший делитель — простой","t":"Наименьший делитель числа n > 1, больший 1, — простое число. Поэтому n ≥ своего наименьшего простого делителя.","e":"У числа 35 наименьший делитель 5, и 35 ≥ 5. Если числа имеют разные наименьшие простые делители p₁, p₂, …, то их сумма ≥ p₁ + p₂ + …"},{"id":"coprime","s":"fta","n":"Взаимно простые числа","t":"Числа взаимно просты, если НОД = 1. У попарно взаимно простых чисел нет общих простых делителей ⇒ у каждого числа (кроме 1) свой простой делитель. Среди попарно взаимно простых чисел не больше одного чётного.","e":"1, 2, 3, 5, 7, 11, 13, 17 — попарно взаимно простые, сумма 59."},{"id":"gcd","s":"fta","n":"НОД и алгоритм Евклида","t":"НОД(a, b) = НОД(a − b, b) = НОД(a + b, b). Дробь a/b несократима, если НОД(a, b) = 1.","e":"НОД(a + b, 2a + b) = НОД(a + b, a) = НОД(b, a). Значит, если a/b несократима, то и (a+b)/(2a+b) несократима."},{"id":"prime_only","s":"fta","n":"Простое число как произведение","t":"Простое число p нельзя получить как произведение двух чисел, больших 1. Если p записано как произведение натуральных, то один множитель равен p, а остальные равны 1.","e":"Если на доске стоит простое 7, а единицы нет, то 7 — одно из задуманных чисел."},{"id":"mod_def","s":"mod","n":"Сравнения по модулю","t":"a ≡ b (mod m), если a и b дают одинаковые остатки при делении на m, т.е. m | (a − b). Сравнения можно складывать, вычитать и умножать.","e":"563 = 28·20 + 3 ⇒ 563 ≡ 3 (mod 28). 1417 − 563 = 854 не делится на 4 ⇒ остатки по mod 4 разные."},{"id":"mod_shift","s":"mod","n":"Метод сдвига (все числа сравнимы)","t":"Если сумма ЛЮБЫХ k чисел из набора делится на m (и чисел больше k), то все числа набора дают одинаковый остаток при делении на m: заменим в k-ке одно число x на y — сумма останется кратной m, значит x ≡ y. Для чисел по кругу: если сумма любых k подряд кратна m, то aᵢ ≡ aᵢ₊ₖ (mod m).","e":"Среднее любых трёх и любых пяти — целое ⇒ все числа сравнимы по mod 3 и mod 5, т.е. по mod 15."},{"id":"mod_sq","s":"mod","n":"Остатки квадратов","t":"Квадрат при делении на 3 даёт остаток 0 или 1; на 4 — 0 или 1; на 8 (для нечётного) — 1. n² ≡ 1 (mod p) для простого p ⇔ n ≡ ±1 (mod p).","e":"Число ≡ 3 (mod 4) не может быть квадратом. n² ≡ 1 (mod 7) ⇔ n ≡ 1 или 6 (mod 7)."},{"id":"last_digit","s":"mod","n":"Последняя цифра","t":"Последняя цифра суммы (произведения) определяется последними цифрами слагаемых (множителей) — это остаток по mod 10.","e":"26 чисел на 4 и 4 числа на 8: 26·4 + 4·8 = 136 ⇒ сумма оканчивается на 6."},{"id":"mod_cases","s":"mod","n":"Перебор остатков","t":"Чтобы проверить, решается ли уравнение, удобно перебрать остатки по подходящему модулю: если ни один остаток не подходит — решений нет.","e":"101 = 5a + 14b при a ≤ 4: 101 − 5a ∈ {101, 96, 91, 86, 81} — ни одно не делится на 14."},{"id":"dec_repr","s":"dec","n":"Десятичная запись","t":"Трёхзначное число с цифрами a, b, c равно 100a + 10b + c; двузначное с цифрами a, b равно 10a + b. При перестановке цифр двузначного числа: 10a + b → 10b + a.","e":"Если A — сумма цифр десятков, B — сумма цифр единиц, то сумма чисел 10A + B, а после перестановки 10B + A."},{"id":"append","s":"dec","n":"Приписывание цифры","t":"Приписать к числу x справа цифру d — получить 10x + d. Приписать k-значное число y — получить x·10ᵏ + y.","e":"К 13 приписали 7: 137 = 10·13 + 7."},{"id":"ds_mod9","s":"dec","n":"Сумма цифр и деление на 9","t":"Число и его сумма цифр дают одинаковый остаток при делении на 9 (и на 3): S(n) ≡ n (mod 9). Сумма цифр k-значного числа ≤ 9k.","e":"1994: S = 23, 23 ≡ 5 ≡ 1994 (mod 9). Если x + S(x) + S(S(x)) = N, то 3x ≡ N (mod 9)."},{"id":"ds_carry","s":"dec","n":"Сумма цифр и переносы","t":"S(x) + S(y) = S(x + y) + 9·(число переносов при сложении столбиком).","e":"x + y = 599 без переносов ⇒ S(x) + S(y) = 5 + 9 + 9 = 23 — нечётно, поэтому S(x) ≠ S(y)."},{"id":"repunit","s":"dec","n":"Числа из единиц","t":"Число из k единиц 11…1 = (10ᵏ − 1)/9, и оно ≡ k (mod 9).","e":"1 + 11 + 111 = 123, в записи 6 единиц, 123 ≡ 6 (mod 9). Замена 11 единиц на одно «11» уменьшает число единиц на 9, а сумма не меняется."},{"id":"subseq","s":"dec","n":"Вычёркивание цифр","t":"Вычёркивая цифры, получаем подпоследовательность: порядок цифр сохраняется. Если каждая цифра встречается один раз, условия «x раньше y» должны быть непротиворечивы.","e":"Из 2893506 вычёркиванием получаются 206, 835, 930."},{"id":"parity","s":"par","n":"Чётность","t":"Сумма чётного количества нечётных чисел чётна, нечётного — нечётна. |a − b| и a + b одной чётности. Если a + b чётно, то a и b одной чётности.","e":"Сумма модулей разностей соседей по кругу ≡ сумме самих разностей ≡ 0 (mod 2) ⇒ всегда чётна."},{"id":"invariant","s":"inv","n":"Инвариант","t":"Инвариант — величина, которая не меняется при операции (например, остаток разности, чётность, сумма). Если у начального и конечного состояний инвариант разный — перейти нельзя.","e":"Ход «+2 одному, −1 двум другим»: все числа меняются на −1 по mod 3 ⇒ разности чисел по mod 3 не меняются."},{"id":"monovar","s":"inv","n":"Полуинвариант (монотонная величина)","t":"Величина, которая при каждом ходе меняется в одну сторону (например, растёт ровно на 1), позволяет посчитать число ходов или доказать, что процесс закончится.","e":"(A+2, B−1) и (A−1, B+2): сумма каждый ход растёт на 1 ⇒ число ходов = (новая сумма − старая сумма)."},{"id":"reverse","s":"inv","n":"Обратный ход","t":"Если операция обратима, можно восстановить предыдущее состояние однозначно и идти «назад» от конечного состояния.","e":"(a, b) → (a+b, a−b): обратно (x, y) ← ((x+y)/2, (x−y)/2). Для (806; 788) предыдущая пара (797; 9)."},{"id":"double_bound","s":"inv","n":"Удвоение за ход","t":"Если за один ход каждый кусок можно разрезать не более чем на две части, то после k ходов кусков не больше 2ᵏ.","e":"За 5 ходов не больше 32 частей, а нужно 100 ⇒ нельзя."},{"id":"lin_map","s":"inv","n":"Линейная операция над парами","t":"Если (a, b) → (pa + qb, ra + sb), то пара (c, d) получается из целой пары, когда система pa + qb = c, ra + sb = d имеет целое решение. Это даёт условие делимости на c и d.","e":"(3a + b, 3b − a) = (c, d) ⇒ a = (3c − d)/10, b = (c + 3d)/10 ⇒ нужно c + 3d ≡ 0 (mod 10)."},{"id":"sum_1n","s":"seq","n":"Сумма 1 + 2 + … + n","t":"1 + 2 + … + n = n(n+1)/2. Сумма n различных натуральных чисел не меньше n(n+1)/2; различных неотрицательных — не меньше n(n−1)/2.","e":"Сумма 100 различных натуральных ≥ 5050. Сумма 41 различного неотрицательного ≥ 0 + 1 + … + 40 = 820."},{"id":"ap","s":"seq","n":"Арифметическая прогрессия","t":"Сумма n членов: Sₙ = n·a₁ + n(n−1)d/2 = n(a₁ + aₙ)/2.","e":"Если каждый день решать на 2 задачи больше, начав с b: за q дней qb + q(q−1)."},{"id":"pow2","s":"seq","n":"Степени двойки, двоичная запись","t":"1 + 2 + 4 + … + 2ᵏ⁻¹ = 2ᵏ − 1. Набором гирь 1, 2, 4, …, 2ᵏ⁻¹ отвешивается любой вес от 1 до 2ᵏ − 1. Непустых поднаборов из k предметов — 2ᵏ − 1.","e":"Гири 1, 2, 4, 8, 16: веса 1…31. Четыре гири дают не более 15 разных сумм."},{"id":"lin_dioph","s":"eq","n":"Линейные уравнения в целых числах","t":"ax + by = c. Решения ищут перебором одной переменной в небольшом диапазоне или по остаткам. Из двух уравнений с тремя неизвестными часто удаётся выразить всё через одну.","e":"5a = 6b в натуральных ⇒ a = 6t, b = 5t."},{"id":"factor","s":"eq","n":"Разложение на множители","t":"Приём: привести уравнение к виду (…)(…) = число и перебрать делители. uv − u − v = (u−1)(v−1) − 1; x² − y² = (x−y)(x+y).","e":"uv − u − v = 30 ⇒ (u−1)(v−1) = 31 — простое ⇒ u − 1 = 1, v − 1 = 31."},{"id":"vieta","s":"eq","n":"Теорема Виета","t":"Для x² + px + q = 0 с корнями x₁, x₂: x₁ + x₂ = −p, x₁·x₂ = q.","e":"Корни 5 и 11 ⇒ p = −16, q = 55."},{"id":"squares_sum","s":"eq","n":"Выражение через квадраты разностей","t":"a² + b² + c² − ab − bc − ca = ½[(a−b)² + (b−c)² + (c−a)²] = x² + xy + y², где x = a − b, y = b − c.","e":"a = 6, b = 3, c = 1: x = 3, y = 2, d = 9 + 6 + 4 = 19."},{"id":"mean","s":"avg","n":"Среднее арифметическое","t":"Среднее = сумма / количество, значит сумма = среднее · количество. Среднее не меньше наименьшего и не больше наибольшего числа.","e":"Шесть наименьших со средним 5 ⇒ их сумма 30."},{"id":"mean_move","s":"avg","n":"Перенос элемента между группами","t":"Если из группы (n чисел, среднее m) убрать число x, новое среднее (nm − x)/(n − 1). Среднее увеличится ⇔ x \u003c m. Если добавить x к группе — среднее растёт ⇔ x > m.","e":"Школа: 4 ученика со средним 42, пришёл ученик с 21 баллом: (168 + 21)/5 = 37,8 — уменьшилось на 10%."},{"id":"percent","s":"avg","n":"Проценты и доли","t":"p% от N = pN/100. «Увеличилось на 10%» ⇒ стало 1,1 от прежнего. Доля k из n — это 100k/n %.","e":"Доля девочек 30% при 20 учениках — 6 девочек."},{"id":"rounding","s":"avg","n":"Округление","t":"Число x округляется до целого k ⇔ k − 0,5 ≤ x \u003c k + 0,5.","e":"Рейтинг 31 при 13 голосах: 30,5 ≤ 100v/13 \u003c 31,5 ⇒ v = 4."},{"id":"frac_monot","s":"avg","n":"Монотонность дроби","t":"Дробь (x + a)/(x + b) при b > a > 0 возрастает с ростом x. Чтобы максимизировать дробь — увеличиваем числитель и уменьшаем знаменатель; для дробно-линейной функции исследуем знак a·d − b·c.","e":"(10b + 3)/(100 + 10b) растёт с ростом b."},{"id":"est_ex","s":"est","n":"Схема «оценка + пример»","t":"Чтобы найти наибольшее (наименьшее) значение, нужно: 1) доказать оценку — значение не может быть больше (меньше); 2) привести пример, где оценка достигается. Без примера ответ не засчитывается.","e":"Сумма 8 попарно взаимно простых ≥ 59 (оценка), и 1 + 2 + 3 + 5 + 7 + 11 + 13 + 17 = 59 (пример)."},{"id":"extreme","s":"est","n":"Принцип крайнего","t":"Рассмотрите наименьший (наибольший) элемент — для него условия задачи дают самые сильные ограничения.","e":"Наибольший член цикла M: перед ним может стоять только M/2, а после — только M − 98."},{"id":"dirichlet","s":"est","n":"Принцип Дирихле","t":"Если n + 1 предмет разложить в n ящиков, то в каком-то ящике окажется хотя бы 2 предмета. Бесконечная (длинная) последовательность из конечного числа значений повторяется.","e":"400 членов из чисел 1…111 ⇒ какое-то число повторится ⇒ в последовательности есть цикл."},{"id":"distinct_min","s":"est","n":"Различные числа — минимальная сумма","t":"Если k различных натуральных чисел, то наименьшая их сумма — когда это k наименьших подходящих чисел. Если числа меньше x и различны, их сумма ≤ (x−1) + (x−2) + … + (x−k).","e":"4 различных числа меньше a₅: сумма ≤ 4a₅ − 10."},{"id":"tau","s":"fta","n":"Количество делителей","t":"Если n = p₁^a₁·p₂^a₂·…·pₖ^aₖ, то у n ровно (a₁+1)(a₂+1)…(aₖ+1) натуральных делителей.","e":"840 = 2³·3·5·7 ⇒ 4·2·2·2 = 32 делителя. 7 делителей бывает только у p⁶ (например, 729 = 3⁶)."},{"id":"gmean","s":"avg","n":"Среднее геометрическое","t":"ⁿ√(a₁·…·aₙ) — целое число g ⇔ произведение равно gⁿ. Удобно смотреть на показатели простых: каждый должен делиться на n.","e":"3·8·9 = 216 = 6³ ⇒ среднее геометрическое 3, 8, 9 равно 6."},{"id":"floor","s":"eq","n":"Целая часть [x]","t":"[x] — наибольшее целое, не превосходящее x: [x] ≤ x \u003c [x] + 1. Поэтому [n/a] ≤ n/a.","e":"[11/4] = 2. [n/2] + [n/3] + [n/9] ≤ 17n/18 \u003c n."},{"id":"gp","s":"seq","n":"Геометрическая прогрессия","t":"bₖ = b₁·qᵏ⁻¹. Если члены целые и q = p/r — несократимая дробь, то rᵏ⁻¹ делит b₁.","e":"128, 192, 288, 432, 648, 972: q = 3/2, а 2⁵ делит 128."},{"id":"coins","s":"est","n":"Набор монет без «дыр»","t":"Монеты c₁ ≤ c₂ ≤ … позволяют набрать любую сумму до общей суммы ⇔ каждая следующая монета не больше 1 + сумма предыдущих.","e":"1, 2, 2, 5, 10, 10, … — подходит; 1, 2, 5 — нет (4 не набрать)."},{"id":"abs_sum","s":"est","n":"Сумма модулей разностей","t":"Каждое число входит в две разности по кругу со знаком «+» или «−». Сумма максимальна, когда большие числа всегда со знаком «+», малые — «−»: большие и малые чередуются.","e":"Для 1…12: максимум 2·(7+…+12) − 2·(1+…+6) = 114 − 42 = 72."}],"problems":[{"id":"90076","d":1,"from":"PDF №004","stem":"Есть 4 камня, каждый массой 5 тонн, и 13 камней, каждый массой 14 тонн.","parts":[{"l":"а","q":"Можно ли разложить все эти камни на две группы так, чтобы разность суммарных масс камней в этих группах составила 6 тонн?","ak":"yn","av":"ДА","steps":[{"t":"Общая масса 4·5 + 13·14 = 202 т. Разность 6 ⇒ группы 104 и 98 т.","f":[]},{"t":"98 = 7·14. Группа 1: семь камней по 14 т (98 т). Группа 2: шесть по 14 и четыре по 5: 84 + 20 = 104 т. Ответ: да.","f":[]}]},{"l":"б","q":"Можно ли разложить все эти камни на две группы, суммарные массы камней в которых равны?","ak":"yn","av":"НЕТ","steps":[{"t":"Равные группы — по 101 т. В группе a камней по 5 т (0 ≤ a ≤ 4) и b по 14 т: 5a + 14b = 101.","f":["lin_dioph"]},{"t":"101 − 5a при a = 0…4: 101, 96, 91, 86, 81 — ни одно не делится на 14. Ответ: нет.","f":["mod_cases"]}]},{"l":"в","q":"Все камни хотят разложить на две группы. Какое наименьшее положительное значение (в тоннах) может принимать разность суммарных масс камней в этих группах?","ak":"num","av":"4","steps":[{"t":"Если в одной группе S т, разность |202 − 2S| — чётное число ⇒ ≥ 2; разность 0 невозможна (пункт б).","f":["parity"]},{"t":"Разность 2 ⇒ S = 100: 100 − 5a = 100, 95, 90, 85, 80 — не делятся на 14. Нельзя.","f":["mod_cases"]},{"t":"Разность 4 ⇒ S = 99: 99 − 5·3 = 84 = 6·14. Группа: три камня по 5 и шесть по 14 (99 т), другая 103 т.","f":["est_ex"]},{"t":"Наименьшая разность 4.","f":[]}]}],"tags":["div","est"],"facts":["lin_dioph","mod_cases","parity","est_ex"],"note":"","n":1},{"id":"90090","d":1,"from":"PDF №005","stem":"Есть 16 монет по 2 рубля и 29 монет по 5 рублей.","parts":[{"l":"а","q":"Можно ли этими монетами набрать сумму 175 рублей?","ak":"yn","av":"ДА","steps":[{"t":"Все монеты: 16·2 + 29·5 = 32 + 145 = 177 р.","f":[]},{"t":"175 = 177 − 2: берём все монеты, кроме одной двухрублёвой. Ответ: да.","f":[]}]},{"l":"б","q":"Можно ли этими монетами набрать сумму 176 рублей?","ak":"yn","av":"НЕТ","steps":[{"t":"176 = 177 − 1. Если набрать 176, то оставшиеся монеты дают 1 рубль — а монет в 1 рубль нет. Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наименьшее количество монет, каждая по 1 рублю, нужно добавить, чтобы иметь возможность набрать любую целую сумму от 1 рубля до 180 рублей включительно?","ak":"num","av":"3","steps":[{"t":"Оценка: чтобы набрать 180, всего денег должно быть ≥ 180 ⇒ 177 + k ≥ 180 ⇒ k ≥ 3.","f":["est_ex"]},{"t":"Пример с тремя рублёвыми монетами. Сумму s ≤ 180 набираем так: берём b = min(29, [s/5]) пятирублёвых, остаток r = s − 5b.","f":[]},{"t":"Если b \u003c 29, то r ≤ 4: r = 0, 1 (1), 2 (2), 3 (2+1), 4 (2+2). Если b = 29, то r = s − 145 ≤ 35: берём min(16, [r/2]) двухрублёвых, остаток ≤ 3 добираем рублёвыми.","f":[]},{"t":"Значит, 3 монеты достаточно и меньше нельзя. Ответ: 3.","f":[]}]}],"tags":["est"],"facts":["lin_dioph","est_ex"],"note":"","n":2},{"id":"88570","d":1,"from":"PDF №010","stem":"В продуктовом магазине есть весы с двумя чашами. На одну чашу весов кладут только продукты, на другую — гири. На чашу для гирь можно положить несколько гирь. Магазину разрешено продавать только целое число килограммов продуктов.","parts":[{"l":"а","q":"Можно ли некоторым набором из пяти гирь отвесить любое целое число килограммов от 1 до 25?","ak":"yn","av":"ДА","steps":[{"t":"Гири 1, 2, 4, 8, 16 кг: любое число от 1 до 31 записывается в двоичной системе ⇒ отвешивается. Ответ: да.","f":["pow2"]}]},{"l":"б","q":"Можно ли некоторым набором из четырех гирь отвесить любое целое число килограммов от 1 до 25?","ak":"yn","av":"НЕТ","steps":[{"t":"Из 4 гирь можно составить 2⁴ − 1 = 15 непустых наборов ⇒ не больше 15 разных весов, а нужно 25. Ответ: нет.","f":["pow2"]}]},{"l":"в","q":"Найдите наибольшее значение n такое, что любой вес от 1 до n килограммов можно отвесить каким-нибудь набором из пяти гирь.","ak":"num","av":"31","steps":[{"t":"Из 5 гирь — не больше 2⁵ − 1 = 31 разных весов ⇒ n ≤ 31.","f":["pow2"]},{"t":"Гири 1, 2, 4, 8, 16 дают все веса 1…31. Ответ: 31.","f":["est_ex"]}]}],"tags":["est","seq"],"facts":["pow2","est_ex"],"note":"","n":3},{"id":"21797","d":1,"from":"PDF №064","stem":"За прохождение каждого уровня игры на планшете можно получить от одной до трёх звёзд. При этом заряд аккумулятора планшета уменьшается на 3 пункта при получении трёх звёзд, на 6 пунктов при получении двух звёзд и на 9 пунктов при получении одной звезды. Витя прошёл несколько уровней игры подряд.","parts":[{"l":"а","q":"Мог ли заряд аккумулятора уменьшиться ровно на 32 пункта? Считайте, что максимальный заряд планшета достаточно большой.","ak":"yn","av":"НЕТ","steps":[{"t":"Каждый уровень уменьшает заряд на 3, 6 или 9 ⇒ уменьшение кратно 3. 32 не кратно 3. Ответ: нет.","f":["div_def"]}]},{"l":"б","q":"Сколько уровней игры было пройдено, если заряд аккумулятора уменьшился на 33 пункта и суммарно было получено 17 звёзд?","ak":"num","av":"7","steps":[{"t":"x, y, z — уровни с 3, 2, 1 звездой: 3x + 6y + 9z = 33 ⇒ x + 2y + 3z = 11; 3x + 2y + z = 17.","f":["lin_dioph"]},{"t":"Сложим: 4(x + y + z) = 28 ⇒ x + y + z = 7. Ответ: 7.","f":[]}]},{"l":"в","q":"За пройденный уровень начисляется 9000 очков при получении трёх звёзд, 5000 — при получении двух звёзд и 2000 — при получении одной звезды. Какое наибольшее количество очков мог получить Витя, если заряд аккумулятора уменьшился на 33 пункта и суммарно было получено 17 звёзд?","ak":"num","av":"49000","steps":[{"t":"Из уравнений: y = 10 − 2x, z = x − 3, 3 ≤ x ≤ 5.","f":["lin_dioph"]},{"t":"Очки: 9000x + 5000(10 − 2x) + 2000(x − 3) = 44000 + 1000x — максимум при x = 5.","f":["est_ex"]},{"t":"x = 5, y = 0, z = 2: 49000. Ответ: 49000.","f":[]}]}],"tags":["eq"],"facts":["lin_dioph","div_def","est_ex"],"note":"","n":4},{"id":"23760","d":1,"from":"Школково","stem":"На доске написано 30 различных натуральных чисел, каждое из которых либо чётное, либо его десятичная запись оканчивается на цифру 7. Сумма написанных чисел равна 810.","parts":[{"l":"а","q":"Может ли на доске быть ровно 24 чётных числа?","ak":"yn","av":"ДА","steps":[{"t":"24 чётных ≥ 2 + 4 + … + 48 = 600, 6 чисел на 7 ≥ 7 + 17 + … + 57 = 192, всего 792 ≤ 810.","f":["distinct_min"]},{"t":"Нужно добавить 18: 48 → 66. Ответ: да.","f":[]}]}],"tags":["est"],"facts":["parity","distinct_min"],"note":"","n":5},{"id":"43735","d":1,"from":"Школково","stem":"Красный карандаш стоит 17 рублей, синий — 13 рублей. Нужно купить карандаши, имея всего 495 рублей и соблюдая дополнительное условие: число синих карандашей не должно отличаться от числа красных карандашей больше чем на пять.","parts":[{"l":"а","q":"Можно ли купить при таких условиях 32 карандаша?","ak":"yn","av":"ДА","steps":[{"t":"14 красных и 18 синих: 238 + 234 = 472 ≤ 495. Ответ: да.","f":[]}]},{"l":"б","q":"Можно ли купить при таких условиях 35 карандашей?","ak":"yn","av":"НЕТ","steps":[{"t":"35 карандашей и синих ≤ красных + 5 ⇒ красных ≥ 15: 15·17 + 20·13 = 515 > 495. Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наибольшее число карандашей можно купить при таких условиях?","ak":"num","av":"33","steps":[{"t":"34: красных ≥ 15 ⇒ ≥ 255 + 247 = 502 > 495.","f":["est_ex"]},{"t":"33: 14 красных и 19 синих — 485. Ответ: 33.","f":[]}]}],"tags":["eq"],"facts":["lin_dioph","est_ex"],"note":"","n":6},{"id":"44861","d":1,"from":"Школково","stem":"Петя участвовал в викторине по истории. За каждый правильный ответ участнику начисляется 8 баллов, за каждый неверный — списывается 8 баллов, за отсутствие ответа списывается 3 балла. По результатам викторины Петя набрал 35 баллов.","parts":[{"l":"а","q":"На сколько вопросов Петя не дал ответа, если в викторине 30 вопросов?","ak":"num","av":"7","steps":[{"t":"8x − 8y − 3z = 35 ⇒ 3z ≡ 5 (mod 8) ⇒ z ≡ 7 (mod 8): z = 7, 15, 23.","f":["mod_cases"]},{"t":"x + y + z = 30: z = 7 ⇒ x − y = 7, x + y = 23 ⇒ x = 15, y = 8 ✓; z = 15, 23 — нецелые. Ответ: 7.","f":[]}]},{"l":"б","q":"На сколько вопросов Петя не дал ответа, если в викторине 35 вопросов?","ak":"num","av":"15","steps":[{"t":"z ∈ {7, 15, 23, 31}, x + y = 35 − z: подходит только z = 15 (x = 15, y = 5). Ответ: 15.","f":[]}]},{"l":"в","q":"На сколько вопросов Петя ответил правильно, если в викторине 33 вопроса?","ak":"num","av":"14","steps":[{"t":"x + y = 33 − z: подходит z = 15: x − y = 10, x + y = 18 ⇒ x = 14. Ответ: 14.","f":[]}]}],"tags":["eq"],"facts":["lin_dioph","mod_cases"],"note":"","n":7},{"id":"65028","d":1,"from":"Школково","stem":"Дано квадратное уравнение x² − px + q = 0 с натуральными коэффициентами p и q и натуральными корнями x₁ и x₂.","parts":[{"l":"а","q":"Найдите все различные значения p, если q = 4.","ak":"set","av":"4;5","steps":[{"t":"По Виета x₁x₂ = 4: (1; 4) или (2; 2) ⇒ p = 5 или 4.","f":["vieta"]}]},{"l":"б","q":"Может ли быть p \u003c 8, если q > 20?","ak":"yn","av":"НЕТ","steps":[{"t":"x₁ + x₂ ≤ 7 ⇒ x₁x₂ ≤ 3·4 = 12 \u003c 20. Ответ: нет.","f":["vieta"]}]},{"l":"в","q":"Найдите наименьшее значение p, если q > 20.","ak":"num","av":"10","steps":[{"t":"При сумме 9 произведение ≤ 4·5 = 20 ⇒ p ≥ 10.","f":["est_ex"]},{"t":"Пример: корни 3 и 7: q = 21, p = 10. Ответ: 10.","f":[]}]}],"tags":["eq"],"facts":["vieta","est_ex"],"note":"","n":8},{"id":"159671","d":2,"from":"PDF №001","stem":"Из набора цифр 1, 2, 3, 4, 6, 7 и 8 составляют пару чисел, используя каждую цифру ровно один раз. Оказалось, что одно из этих чисел пятизначное, другое — двузначное и кратно 36.","parts":[{"l":"а","q":"Может ли сумма такой пары чисел равняться 14 908?","ak":"yn","av":"ДА","steps":[{"t":"Двузначные числа, кратные 36 = 4·9: это только 36 и 72.","f":["div_comp"]},{"t":"Если двузначное 72, то пятизначное = 14908 − 72 = 14836. Его цифры 1, 4, 8, 3, 6 вместе с 7 и 2 дают ровно набор 1, 2, 3, 4, 6, 7, 8.","f":[]},{"t":"Пример: 14836 + 72 = 14908. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли сумма такой пары чисел равняться 74 134?","ak":"yn","av":"НЕТ","steps":[{"t":"Двузначное число — 36 или 72. Найдём пятизначное: 74134 − 36 = 74098; 74134 − 72 = 74062.","f":[]},{"t":"В обоих числах есть цифра 0 (и 9), которой нет в наборе. Значит, такой суммы не бывает. Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наибольшее значение может принимать сумма чисел в этой паре?","ak":"num","av":"87457","steps":[{"t":"Сумма = пятизначное + двузначное. Двузначное — 36 или 72; при каждом из них пятизначное составлено из оставшихся пяти цифр.","f":["est_ex"]},{"t":"Если двузначное 72: остаются 1, 3, 4, 6, 8, наибольшее пятизначное 86431, сумма 86431 + 72 = 86503.","f":[]},{"t":"Если двузначное 36: остаются 1, 2, 4, 7, 8, наибольшее пятизначное 87421, сумма 87421 + 36 = 87457.","f":[]},{"t":"Других вариантов нет, наибольшая сумма 87457 (пример: 87421 и 36).","f":[]}]}],"tags":["digits","div"],"facts":["div_comp","div_rules","dec_repr","est_ex"],"note":"","n":9},{"id":"120330","d":2,"from":"PDF №002","stem":"В школе перед началом учебного года было сформировано несколько одиннадцатых классов, в каждом из которых количество мальчиков относилось к количеству девочек как 7 :2 или как 2 :7. После этого в параллель одиннадцатых классов школы приняли ещё четырёх мальчиков и трёх девочек.","parts":[{"l":"а","q":"Удастся ли теперь разбить всех одиннадцатиклассников на классы так, чтобы в каждом классе отношение количества мальчиков к количеству девочек было 5:4 или 4 :5?","ak":"yn","av":"НЕТ","steps":[{"t":"В каждом классе мальчиков и девочек 7k и 2k (или 2k и 7k) ⇒ в классе 9k человек. Значит, всего учеников кратно 9: N = 9m.","f":["div_sum"]},{"t":"После приёма стало 9m + 7 учеников — остаток 7 при делении на 9.","f":["mod_def"]},{"t":"При отношении 5:4 каждый класс снова кратен 9 ⇒ всё количество кратно 9. Но 9m + 7 на 9 не делится. Ответ: нет.","f":[]}]},{"l":"б","q":"Всех одиннадцатиклассников удалось разбить на классы так, чтобы в каждом классе отношение количества мальчиков к количеству девочек было 7 :3 или 3:7. Могло ли при этом получиться ровно семь классов?","ak":"yn","av":"ДА","steps":[{"t":"При 7:3 каждый класс — 10t человек. Ищем пример с 7 классами.","f":[]},{"t":"Пусть сначала было 3 класса (7 м, 2 д) и 4 класса (2 м, 7 д): мальчиков 21 + 8 = 29, девочек 6 + 28 = 34. Добавим 4 и 3: стало 33 мальчика и 37 девочек.","f":[]},{"t":"Разобьём: 3 класса по (7 м, 3 д) и 4 класса по (3 м, 7 д): мальчиков 21 + 12 = 33, девочек 9 + 28 = 37. Ровно семь классов. Ответ: да.","f":[]}]},{"l":"в","q":"Всех одиннадцатиклассников удалось разбить на классы так, чтобы в каждом классе отношение количества мальчиков к количеству девочек было 7 :3 или 3:7. Было решено отправить всех одиннадцатиклассников на экскурсию группами по 90 человек, при этом одна из групп оказалась неполной. Сколько в этой группе было одиннадцатиклассников?","ak":"num","av":"70","steps":[{"t":"Всего учеников N = 9m + 7 (из пункта а) и N кратно 10 (классы 7:3).","f":["div_sum"]},{"t":"N = 10s и 10s ≡ 7 (mod 9) ⇒ s ≡ 7 (mod 9) ⇒ N ≡ 70 (mod 90).","f":["mod_def"]},{"t":"Значит, при делении на группы по 90 неполная группа содержит 70 человек. Такая ситуация возможна — пример из пункта б (70 человек).","f":[]}]}],"tags":["div"],"facts":["div_def","div_sum","mod_def","est_ex"],"note":"","n":10},{"id":"83776","d":2,"from":"PDF №003","stem":"Из набора цифр 0, 1, 2, 3, 5, 7 и 9 составляют пару чисел, используя каждую цифру ровно один раз. Оказалось, что одно из этих чисел четырёхзначное, другое – трёхзначное и оба кратны 45.","parts":[{"l":"а","q":"Может ли сумма такой пары чисел равняться 2205?","ak":"yn","av":"ДА","steps":[{"t":"Кратность 45 = 5·9: число оканчивается на 0 или 5, а сумма цифр делится на 9.","f":["div_comp"]},{"t":"Пример: 1935 + 270 = 2205. Цифры 1, 9, 3, 5, 2, 7, 0 — весь набор. 1935: сумма цифр 18, оканчивается на 5; 270: сумма 9, оканчивается на 0. Ответ: да.","f":["div_rules"]}]},{"l":"б","q":"Может ли сумма такой пары чисел равняться 3435?","ak":"yn","av":"НЕТ","steps":[{"t":"Оба числа кратны 45 ⇒ их сумма кратна 45.","f":["div_sum"]},{"t":"3435 : 45 = 76,33… — не делится. Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наибольшее значение может принимать сумма чисел в такой паре?","ak":"num","av":"10035","steps":[{"t":"Сумма всех цифр 0+1+2+3+5+7+9 = 27. У каждого числа сумма цифр кратна 9 ⇒ суммы цифр (у четырёхзначного; у трёхзначного) = (18; 9) или (9; 18). Одно число оканчивается на 0, другое на 5.","f":["ds_mod9"]},{"t":"Случай (9; 18): у четырёхзначного 4 цифры с суммой 9 — это только {0, 1, 3, 5}, число ≤ 5310, сумма ≤ 5310 + 972 \u003c 10000.","f":[]},{"t":"Случай (18; 9): трёхзначное с суммой цифр 9 и последней 0 или 5 — это 720, 270, 135 или 315. Четырёхзначное из оставшихся цифр (наибольшее): при 720 и 270 — 9315; при 135 и 315 — 9720.","f":[]},{"t":"Суммы: 9315 + 720 = 10035, 9315 + 270 = 9585, 9720 + 135 = 9855, 9720 + 315 = 10035. Наибольшая 10035.","f":["est_ex"]}]}],"tags":["digits","div"],"facts":["div_comp","div_rules","div_sum","ds_mod9","est_ex"],"note":"","n":11},{"id":"90080","d":2,"from":"PDF №008","stem":"В порту имеются только заполненные контейнеры, масса каждого из которых равна 20 тонн или 80 тонн. В некоторых из этих контейнеров находится сахарный песок. Количество контейнеров с сахарным песком составляет 20% от общего количества контейнеров.","parts":[{"l":"а","q":"Может ли масса контейнеров с сахарным песком составить 40% от общей массы всех контейнеров?","ak":"yn","av":"ДА","steps":[{"t":"Пусть контейнеров 15, из них с сахаром 3 (20%).","f":["percent"]},{"t":"С сахаром: 3 по 80 т = 240 т. Остальные 12: 2 по 80 и 10 по 20 = 160 + 200 = 360 т. Всего 600 т.","f":[]},{"t":"240/600 = 40%. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли масса контейнеров с сахарным песком составить 80% от общей массы всех контейнеров?","ak":"yn","av":"НЕТ","steps":[{"t":"Пусть всего 5k контейнеров, с сахаром k. Масса сахарных ≤ 80k, масса остальных 4k контейнеров ≥ 20·4k = 80k.","f":[]},{"t":"Значит, доля сахарных ≤ 80k/(80k + 80k) = 50% \u003c 80%. Ответ: нет.","f":[]}]},{"l":"в","q":"Какую наибольшую долю (в процентах) может составить масса контейнеров с сахарным песком от общей массы всех контейнеров?","ak":"num","av":"50","steps":[{"t":"Оценка из пункта б: доля ≤ 50%.","f":["est_ex"]},{"t":"Пример: 1 контейнер 80 т с сахаром и 4 контейнера по 20 т без: 80/160 = 50%. Ответ: 50%.","f":[]}]}],"tags":["avg"],"facts":["percent","mean","est_ex"],"note":"","n":12},{"id":"64209","d":2,"from":"PDF №011","stem":"Есть числа A и B. Из них можно сделать числа A +2 и B− 1 или A − 1 и B + 2, только если следующая пара этих чисел будет натуральной. Известно, что A = 5, B = 7.","parts":[{"l":"а","q":"Можно ли за 50 ходов создать пару, где одно из чисел равно 100?","ak":"yn","av":"НЕТ","steps":[{"t":"Каждый ход сумма чисел увеличивается на 1. Начальная сумма 12 ⇒ после 50 ходов сумма 62.","f":["monovar"]},{"t":"Если одно из чисел 100, а другое натуральное, сумма ≥ 101 > 62. Ответ: нет.","f":[]}]},{"l":"б","q":"За сколько ходов можно сделать пару, где сумма чисел будет равна 400?","ak":"num","av":"388","steps":[{"t":"Сумма растёт на 1 за ход: 400 − 12 = 388 ходов.","f":["monovar"]},{"t":"Реализуем: чередуем ходы (A+2, B−1) и (A−1, B+2) — числа остаются натуральными. Ответ: 388.","f":[]}]},{"l":"в","q":"Какое наибольшее число ходов можно сделать, чтобы оба числа не превышали 100?","ak":"num","av":"187","steps":[{"t":"Оба числа ≤ 100 ⇒ сумма ≤ 200 ⇒ ходов ≤ 188.","f":["monovar"]},{"t":"Инвариант: A − B меняется на ±3 ⇒ A − B ≡ 5 − 7 ≡ 1 (mod 3).","f":["invariant"]},{"t":"Сумма 200 только при (100, 100), но 100 − 100 = 0 ≢ 1 (mod 3) ⇒ сумма ≤ 199, ходов ≤ 187.","f":["mod_def"]},{"t":"Пример: x ходов первого типа, y второго: 5 + 2x − y = 100, 7 − x + 2y = 99 ⇒ x = 94, y = 93; чередуя ходы, получаем (100; 99). Ответ: 187.","f":["est_ex"]}]}],"tags":["ops"],"facts":["monovar","invariant","mod_def","est_ex"],"note":"","n":13},{"id":"63293","d":2,"from":"PDF №016","stem":"Из пары натуральных чисел (a;b), где a > b, за один ход получают пару (a+ b;a− b).","parts":[{"l":"а","q":"Можно ли за несколько таких ходов получить из пары (100;1) пару, большее число в которой равно 400?","ak":"yn","av":"ДА","steps":[{"t":"(100; 1) → (101; 99) → (200; 2) → (202; 198) → (400; 4). Ответ: да.","f":[]}]},{"l":"б","q":"Можно ли за несколько таких ходов получить из пары (100;1) пару (806;788)?","ak":"yn","av":"НЕТ","steps":[{"t":"Ход обратим: (x; y) ← ((x+y)/2; (x−y)/2) — предыдущая пара единственна.","f":["reverse"]},{"t":"(806; 788) ← (797; 9) ← (403; 394). Для (403; 394) сумма 797 нечётна ⇒ предыдущей пары нет.","f":["parity"]},{"t":"Значит, получить (806; 788) можно только из (797; 9) или (403; 394), а не из (100; 1). Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наименьшее a может быть в паре (a;b), из которой за несколько ходов можно получить пару (806;788)?","ak":"num","av":"403","steps":[{"t":"Цепочка назад единственна: (797; 9), (403; 394), дальше нельзя.","f":["reverse"]},{"t":"Наименьшее a = 403: (403; 394) → (797; 9) → (806; 788). Ответ: 403.","f":["est_ex"]}]}],"tags":["ops"],"facts":["reverse","parity","est_ex"],"note":"","n":14},{"id":"159854","d":2,"from":"PDF №017","stem":"По окружности некоторым способом расставили натуральные числа от 1 до 12. Между каждыми двумя соседними числами написали модуль их разности. Затем исходные числа стёрли.","parts":[{"l":"а","q":"Приведите пример расстановки, когда сумма полученных чисел равна 32.","ak":"self","av":"Например: 1, 12, 11, 10, 9, 8, 2, 3, 4, 5, 6, 7 (по кругу). Разности: 11+1+1+1+1+6+1+1+1+1+1+6 = 32.","steps":[{"t":"Сумма разностей = 2·(сумма «вершин» − сумма «впадин»). При одной вершине 12 и одной впадине 1 получаем 22.","f":["abs_sum"]},{"t":"Нужно 32: добавим вершину p и впадину v, p − v = 5: например 7 и 2.","f":[]},{"t":"Расстановка: 1, 12, 11, 10, 9, 8, 2, 3, 4, 5, 6, 7. Разности: 11, 1, 1, 1, 1, 6, 1, 1, 1, 1, 1, 6 — сумма 32.","f":[]}]},{"l":"б","q":"Может ли сумма полученных чисел быть равна 29?","ak":"yn","av":"НЕТ","steps":[{"t":"|a − b| имеет ту же чётность, что a − b. Сумма разностей по кругу (x₁−x₂) + (x₂−x₃) + … + (x₁₂−x₁) = 0 ⇒ сумма модулей чётна.","f":["parity"]},{"t":"29 нечётно. Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наибольшее значение может принимать сумма полученных чисел?","ak":"num","av":"72","steps":[{"t":"Каждое число входит в две разности со знаком «+» или «−». Сумма ≤ 2·(12+11+10+9+8+7) − 2·(1+2+…+6) = 114 − 42 = 72.","f":["abs_sum"]},{"t":"Пример: 1, 12, 2, 11, 3, 10, 4, 9, 5, 8, 6, 7 — разности 11, 10, …, 1 и |7−1| = 6: 66 + 6 = 72. Ответ: 72.","f":["est_ex"]}]}],"tags":["est"],"facts":["abs_sum","parity","est_ex"],"note":"","n":15},{"id":"175399","d":2,"from":"PDF №019","stem":"Восемь различных натуральных чисел таковы, что никакие два не имеют общего делителя, большего 1.","parts":[{"l":"а","q":"Может ли сумма всех восьми чисел быть равна 65?","ak":"yn","av":"ДА","steps":[{"t":"Пример: 1, 2, 3, 5, 7, 11, 13, 23 — попарно взаимно простые, сумма 65. Ответ: да.","f":["coprime"]}]},{"l":"б","q":"Может ли сумма всех восьми чисел быть равна 62?","ak":"yn","av":"НЕТ","steps":[{"t":"Чётных чисел не больше одного. Если одно чётное — сумма 7 нечётных + чётное нечётна. Сумма 62 чётна ⇒ все числа нечётные.","f":["parity"]},{"t":"Нечётные числа > 1 имеют разные нечётные простые делители ⇒ сумма ≥ 1 + 3 + 5 + 7 + 11 + 13 + 17 + 19 = 76 > 62. Ответ: нет.","f":["prime_min"]}]},{"l":"в","q":"Какое наименьшее значение может принимать сумма всех восьми чисел?","ak":"num","av":"59","steps":[{"t":"Каждое число > 1 не меньше своего наименьшего простого делителя, а эти делители попарно различны.","f":["prime_min"]},{"t":"Сумма ≥ 1 + 2 + 3 + 5 + 7 + 11 + 13 + 17 = 59.","f":["coprime"]},{"t":"Пример: ровно эти числа. Ответ: 59.","f":["est_ex"]}]}],"tags":["div","est"],"facts":["coprime","prime_min","parity","est_ex"],"note":"","n":16},{"id":"126272","d":2,"from":"PDF №021","stem":"На доске записано некоторое количество последовательных натуральных чисел, среди которых ровно пять делятся на 15.","parts":[{"l":"а","q":"Могло ли среди записанных чисел быть больше пяти чисел, делящихся на 16?","ak":"yn","av":"ДА","steps":[{"t":"Ровно 5 кратных 15 ⇒ длина L от 61 до 89. Чтобы кратных 16 было 6, нужна L ≥ 81.","f":["div_count"]},{"t":"Пример: 16, 17, …, 96 (81 число). Кратные 16: 16, 32, 48, 64, 80, 96; кратные 15: 30, 45, 60, 75, 90. Ответ: да.","f":[]}]},{"l":"б","q":"Могло ли среди записанных чисел быть меньше пяти чисел, делящихся на 11?","ak":"yn","av":"НЕТ","steps":[{"t":"L ≥ 61 ≥ 55 = 5·11 ⇒ среди чисел есть 5 блоков по 11 подряд ⇒ кратных 11 не меньше пяти. Ответ: нет.","f":["div_count"]}]},{"l":"в","q":"Найдите наибольшее возможное число k такое, что среди записанных чисел больше пяти чисел делятся на k.","ak":"num","av":"17","steps":[{"t":"Больше пяти кратных k ⇒ L ≥ 5k + 1, а L ≤ 89 ⇒ k ≤ 17.","f":["div_count"]},{"t":"Пример: 17, 18, …, 102 (86 чисел): кратные 17 — 17, 34, 51, 68, 85, 102; кратные 15 — 30, 45, 60, 75, 90. Ответ: 17.","f":["est_ex"]}]}],"tags":["div"],"facts":["div_count","est_ex"],"note":"","n":17},{"id":"56126","d":2,"from":"PDF №024","stem":"Егор делит линейку на части. За одно действие он может отрезать от любого количества линеек равные части, имеющие целую длину.","parts":[{"l":"а","q":"Может ли Егор за 4 хода разделить линейку длиной в 16 см на части по 1 см?","ak":"yn","av":"ДА","steps":[{"t":"За ход от каждой линейки можно отрезать одинаковую часть. 16 → 8+8 (отрезали 8) → по 4 (отрезали 4 от каждой) → по 2 → по 1. Четыре хода. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли Егор за 5 ходов разделить линейку длиной в 100 см на части по 1 см?","ak":"yn","av":"НЕТ","steps":[{"t":"За один ход каждая линейка делится не более чем на 2 части ⇒ число частей за ход не более чем удваивается.","f":["double_bound"]},{"t":"За 5 ходов не больше 2⁵ = 32 частей, а нужно 100. Ответ: нет.","f":[]}]},{"l":"в","q":"За какое наименьшее количество ходов Егор может разделить линейку длиной в 300 см на части по 1 см?","ak":"num","av":"9","steps":[{"t":"Нужно 300 частей; после k ходов частей ≤ 2ᵏ; 2⁸ = 256 \u003c 300 ⇒ ходов ≥ 9.","f":["double_bound"]},{"t":"Пример за 9 ходов (каждый раз режем все куски): 300 → 150,150 → 75 (×4) → 37 и 38 → 18 и 19 → 9 и 10 → 4 и 5 → 2 и 3 → 1 и 2 → 1.","f":[]},{"t":"Подробно: отрезаем 150; 75; 37 (75 → 37+38); 19 (38 → 19+19, 37 → 19+18); 9; 5; 2; 1; 1. После каждого хода длины отличаются не больше чем на 1. Ответ: 9.","f":["est_ex"]}]}],"tags":["ops","est"],"facts":["double_bound","pow2","est_ex"],"note":"","n":18},{"id":"2457","d":2,"from":"PDF №025","stem":"Учитель задумал несколько необязательно различных натуральных чисел. Эти числа и результаты всех их возможных произведений по два числа, по три числа и так далее он выписал на доску. Если какое-то число, выписанное на доску, повторяется несколько раз, то на доске оставляют только одно такое число, а другие равные ему числа стирают. Например, если задуманы числа 1, 5, 6, 5, то на доске будет набор 1, 5, 6, 30, 25, 150.","parts":[{"l":"а","q":"Приведите пример задуманных чисел, для которых на доске будет записан набор 2, 3, 5, 6, 9, 10, 15, 18, 30, 45, 90.","ak":"self","av":"Например, задуманы 2, 3, 3, 5.","steps":[{"t":"90 = 2·3²·5 — наибольшее число, произведение всех задуманных. 9 на доске, а 27 нет ⇒ двоек-троек немного.","f":["fta"]},{"t":"Пробуем 2, 3, 3, 5: одиночные 2, 3, 5; пары 6, 9, 10, 15; тройки 18, 30, 45; все 90. Набор совпадает.","f":[]}]},{"l":"б","q":"Существует ли пример таких задуманных чисел, для которых на доске будет записан набор 3, 5, 7, 9, 15, 21, 35, 45, 105, 315, 945?","ak":"yn","av":"НЕТ","steps":[{"t":"1 на доске нет ⇒ единиц среди задуманных нет. Простые 3, 5, 7 можно получить только как задуманные числа ⇒ 3, 5, 7 задуманы.","f":["prime_only"]},{"t":"Наибольшее 945 = 3³·5·7 — произведение всех. Значит, остальные задуманные дают в произведении 9: это 9 или 3 и 3.","f":["fta"]},{"t":"В обоих случаях на доске появится 27 (3·9 или 3·3·3), а его в наборе нет. Ответ: нет.","f":[]}]},{"l":"в","q":"Приведите все примеры шести задуманных чисел, для которых на доске будет записан набор, наибольшее число в котором равно 82.","ak":"self","av":"82, 1, 1, 1, 1, 1 или 2, 41, 1, 1, 1, 1.","steps":[{"t":"Наибольшее число на доске — произведение всех шести задуманных: оно равно 82 = 2·41.","f":["fta"]},{"t":"Разложить 82 в произведение 6 натуральных: либо 82·1·1·1·1·1, либо 2·41·1·1·1·1.","f":["prime_only"]},{"t":"Оба варианта дают наибольшее 82. Ответ: 82, 1, 1, 1, 1, 1 или 2, 41, 1, 1, 1, 1.","f":[]}]}],"tags":["div"],"facts":["fta","prime_only","est_ex"],"note":"","n":19},{"id":"185802","d":2,"from":"PDF №026","stem":"На столе лежит N монет по 2 рубля и 1200− N по 5 рублей. N может принимать значения от 1 до 1199. Известно, что если взять любые 500 монет, то их сумма будет составлять не меньше четверти от общей суммы.","parts":[{"l":"а","q":"Может ли N равняться 400?","ak":"yn","av":"ДА","steps":[{"t":"Общая сумма 2N + 5(1200 − N) = 6000 − 3N. Худший случай — взять 500 самых дешёвых монет.","f":[]},{"t":"N = 400: 400 двухрублёвых и 100 пятирублёвых: 800 + 500 = 1300; четверть суммы (6000 − 1200)/4 = 1200. 1300 ≥ 1200. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли N равняться 600?","ak":"yn","av":"НЕТ","steps":[{"t":"N = 600: 500 двухрублёвых = 1000 р.; четверть (6000 − 1800)/4 = 1050 > 1000. Ответ: нет.","f":[]}]},{"l":"в","q":"Сколько различных значений может принимать N?","ak":"num","av":"977","steps":[{"t":"Если N ≥ 500: 1000 ≥ (6000 − 3N)/4 ⇒ N ≥ 666,7 ⇒ N ≥ 667.","f":[]},{"t":"Если N \u003c 500: 2N + 5(500 − N) ≥ (6000 − 3N)/4 ⇒ 10000 − 12N ≥ 6000 − 3N ⇒ N ≤ 444.","f":[]},{"t":"Подходят N = 1…444 и 667…1199: 444 + 533 = 977. Ответ: 977.","f":["est_ex"]}]}],"tags":["est"],"facts":["est_ex","lin_dioph"],"note":"","n":20},{"id":"1015","d":2,"from":"PDF №027","stem":"На доске написано несколько различных натуральных чисел, произведение любых двух из которых больше 40 и меньше 100.","parts":[{"l":"а","q":"Может ли на доске быть 5 чисел?","ak":"yn","av":"ДА","steps":[{"t":"Пример: 6, 7, 8, 9, 10. Наименьшее произведение 6·7 = 42 > 40, наибольшее 9·10 = 90 \u003c 100. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли на доске быть 6 чисел?","ak":"yn","av":"НЕТ","steps":[{"t":"a₁ \u003c … \u003c a₆. a₁a₂ > 40 ⇒ a₂ ≥ 7 (иначе a₁a₂ ≤ 5·6 = 30).","f":["extreme"]},{"t":"Тогда a₅ ≥ 10, a₆ ≥ 11 ⇒ a₅a₆ ≥ 110 > 100. Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наибольшее значение может принимать сумма чисел на доске, если их четыре?","ak":"num","av":"35","steps":[{"t":"a \u003c b \u003c c \u003c d. cd \u003c 100 и c \u003c d ⇒ c ≤ 9. ab > 40 при b \u003c c ≤ 9 ⇒ b ≤ 8, a ≥ 6.","f":["extreme"]},{"t":"c = 9: d ≤ 11 (9·11 = 99), a + b ≤ 7 + 8 = 15 ⇒ сумма ≤ 35. c = 8: d ≤ 12, a + b ≤ 13 ⇒ ≤ 33.","f":["est_ex"]},{"t":"Пример: 7, 8, 9, 11 — произведения 56, 63, 77, 72, 88, 99. Ответ: 35.","f":[]}]}],"tags":["est"],"facts":["est_ex","extreme"],"note":"","n":21},{"id":"26707","d":2,"from":"PDF №029","stem":"Из первых 22 натуральных чисел 1, 2, …, 22 выбрали 2k различных чисел. Выбранные числа разбили на пары и посчитали суммы чисел в каждой паре. Оказалось, что все полученные суммы различны и не превосходят 27.","parts":[{"l":"а","q":"Может ли получиться так, что сумма всех 2k выбранных чисел равняется 170 и в каждой паре одно из чисел ровно в три раза больше другого?","ak":"yn","av":"НЕТ","steps":[{"t":"Пара (x; 3x) даёт сумму 4x ⇒ сумма всех выбранных кратна 4.","f":["div_def"]},{"t":"170 не делится на 4. Ответ: нет.","f":[]}]},{"l":"б","q":"Может ли число k быть равным 11?","ak":"yn","av":"НЕТ","steps":[{"t":"k = 11 ⇒ выбраны все 22 числа, сумма 253.","f":["sum_1n"]},{"t":"11 разных сумм пар, каждая ≤ 27: ≤ 27 + 26 + … + 17 = 242 \u003c 253. Ответ: нет.","f":[]}]},{"l":"в","q":"Найдите наибольшее возможное значение числа k.","ak":"num","av":"10","steps":[{"t":"k = 11 нельзя (пункт б) ⇒ k ≤ 10. Проверим: 20 чисел дают ≥ 210, а 10 разных сумм ≤ 27 + … + 18 = 225 — оценка не мешает.","f":["est_ex"]},{"t":"Пример: (1;17), (3;16), (2;18), (6;15), (9;13), (11;12), (10;14), (4;21), (7;19), (5;22) — суммы 18, 19, …, 27. Ответ: 10.","f":[]}]}],"tags":["est"],"facts":["sum_1n","div_def","est_ex"],"note":"","n":22},{"id":"159865","d":2,"from":"PDF №032","stem":"Маша и Наташа делали фотографии в течении некоторого количества подряд идущих дней. В первый день Маша сделала m фотографий, а Наташа — n фотографий. В каждый следующий день каждая из девочек делала на одну фотографию больше, чем в предыдущий. Известно, что в общей сложности Наташа сделала суммарно на 1001 фотографию больше, чем Маша, и что фотографировали они больше одного дня.","parts":[{"l":"а","q":"Могли ли они фотографировать в течение 7 дней?","ak":"yn","av":"ДА","steps":[{"t":"За k дней разница фото Наташи и Маши: k(n − m) = 1001 = 7·11·13.","f":["ap"]},{"t":"k = 7: n − m = 143, например m = 1, n = 144. Ответ: да.","f":["fta"]}]},{"l":"б","q":"Могли ли они фотографировать в течение 8 дней?","ak":"yn","av":"НЕТ","steps":[{"t":"8 не делит 1001 (1001 нечётно). Ответ: нет.","f":["fta"]}]},{"l":"в","q":"Какое наибольшее суммарное число фотографий могла сделать Наташа за все дни фотографирования, если известно, что в последний день Маша сделала меньше 40 фотографий?","ak":"num","av":"1430","steps":[{"t":"Маша в последний день: m + k − 1 \u003c 40 ⇒ k ≤ 39 − m + 1. k | 1001, k > 1 ⇒ k ∈ {7, 11, 13} (77 > 39).","f":["fta"]},{"t":"Наташа всего: kn + k(k−1)/2 = km + 1001 + k(k−1)/2, максимум при m = 40 − k.","f":["ap"]},{"t":"k = 7: 231 + 1001 + 21 = 1253; k = 11: 319 + 1001 + 55 = 1375; k = 13: 351 + 1001 + 78 = 1430.","f":["est_ex"]},{"t":"Пример: 13 дней, m = 27, n = 104. Ответ: 1430.","f":[]}]}],"tags":["seq","div"],"facts":["ap","fta","est_ex"],"note":"","n":23},{"id":"63290","d":2,"from":"PDF №035","stem":"В классе больше 10, но не больше 26 учащихся, а доля девочек не превышает 21%.","parts":[{"l":"а","q":"Может ли в этом классе быть 5 девочек?","ak":"yn","av":"ДА","steps":[{"t":"24 ученика, 5 девочек: 5/24 ≈ 20,8% ≤ 21%. Ответ: да.","f":["percent"]}]},{"l":"б","q":"Может ли доля девочек составить 30%, если в этот класс придёт новая девочка?","ak":"yn","av":"НЕТ","steps":[{"t":"Было n учеников (11…26), стало n + 1 (12…27). 30% ⇒ n + 1 кратно 10 ⇒ n + 1 = 20, девочек стало 6, было 5.","f":[]},{"t":"5/19 ≈ 26% > 21%. Ответ: нет.","f":[]}]},{"l":"в","q":"В этот класс пришла новая девочка. Доля девочек в классе составила целое число процентов. Какое наибольшее число процентов может составить доля девочек в классе?","ak":"num","av":"25","steps":[{"t":"Девочек g ≤ 0,21n, доля после (g+1)/(n+1).","f":["percent"]},{"t":"Перебор n = 11…26 с g = [0,21n]: наибольшие доли 3/12 (n = 11) и 4/16 (n = 15) — 25%; при остальных n доля меньше 25% (например, 6/25 = 24%, 5/21 ≈ 23,8%).","f":["est_ex"]},{"t":"Пример: было 15 учеников, 3 девочки (20%), пришла девочка: 4/16 = 25%. Ответ: 25.","f":[]}]}],"tags":["avg"],"facts":["percent","est_ex"],"note":"","n":24},{"id":"159692","d":2,"from":"PDF №038","stem":"На доске написано несколько различных натуральных чисел, в записи которых могут быть только цифры 4 и 9 (возможно, только одна из этих цифр).","parts":[{"l":"а","q":"Может ли сумма этих чисел быть равна 107?","ak":"yn","av":"ДА","steps":[{"t":"Пример: 94 + 9 + 4 = 107. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли сумма этих чисел быть равна 289?","ak":"yn","av":"НЕТ","steps":[{"t":"Числа ≤ 289 из цифр 4 и 9: 4, 9, 44, 49, 94, 99 (444 уже больше). Их сумма 299.","f":[]},{"t":"Сумма 289 ⇒ не взяли числа с суммой 10 — а из этих чисел 10 не составить. Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наименьшее количество чисел может быть на доске, если их сумма равна 3986?","ak":"num","av":"9","steps":[{"t":"Каждое число оканчивается на 4 или 9 ⇒ по mod 5 каждое ≡ −1. Сумма k чисел ≡ −k (mod 5); 3986 ≡ 1 ⇒ k ≡ 4 (mod 5).","f":["mod_def"]},{"t":"k = 4: наибольшая сумма 999 + 994 + 949 + 944 = 3886 \u003c 3986 (четырёхзначные из 4 и 9 больше 3986). Значит, k ≥ 9.","f":["est_ex"]},{"t":"Пример: 4 + 9 + 44 + 49 + 444 + 494 + 949 + 994 + 999 = 3986. Ответ: 9.","f":[]}]}],"tags":["digits"],"facts":["last_digit","mod_def","est_ex"],"note":"","n":25},{"id":"159639","d":2,"from":"PDF №039","stem":"C трёхзначным числом производят следующую операцию: к нему прибавляют цифру десятков умноженную на 10, а затем к получившейся сумме прибавляют 3.","parts":[{"l":"а","q":"Могло ли в результате такой операции получиться число 224?","ak":"yn","av":"ДА","steps":[{"t":"N = 100a + 10b + c ⇒ результат 100a + 20b + c + 3.","f":["dec_repr"]},{"t":"100a + 20b + c = 221 ⇒ a = 2, b = 1, c = 1: 211 + 10 + 3 = 224. Ответ: да.","f":[]}]},{"l":"б","q":"Могло ли в результате такой операции получиться число 314?","ak":"yn","av":"НЕТ","steps":[{"t":"100a + 20b + c = 311. a = 3: 20b + c = 11 ⇒ b = 0, c = 11 — нет. a = 2: 20b + c = 111 — при b ≤ 9 и c ≤ 9 нельзя (20b ∈ [102;111] не кратно 20). a = 1: 211 > 189.","f":[]},{"t":"Ответ: нет.","f":[]}]},{"l":"в","q":"Найдите наибольшее отношение получившегося числа к исходному.","ak":"num","av":"283/190","steps":[{"t":"Отношение = 1 + (10b + 3)/(100a + 10b + c). Чтобы дробь была больше: a = 1, c = 0.","f":["frac_monot"]},{"t":"(10b + 3)/(100 + 10b) растёт с ростом b ⇒ b = 9: 93/190.","f":[]},{"t":"Наибольшее отношение 283/190 (для числа 190 → 283).","f":[]}]}],"tags":["digits"],"facts":["dec_repr","frac_monot"],"note":"В ключе файла к пункту в) указано 51 (вероятно, ответ перепутан с задачей 40). По условию, как оно записано, наибольшее отношение 283/190 (число 190).","n":26},{"id":"159633","d":2,"from":"PDF №040","stem":"C трёхзначным числом производят следующую операцию: вычитают из него сумму его цифр, а затем получившуюся разность делят на 3.","parts":[{"l":"а","q":"Может ли в результате такой операции получиться число 300?","ak":"yn","av":"ДА","steps":[{"t":"(100a + 10b + c − a − b − c)/3 = (99a + 9b)/3 = 33a + 3b.","f":["dec_repr"]},{"t":"33a + 3b = 300 ⇒ 11a + b = 100 ⇒ a = 9, b = 1. Например 910: (910 − 10)/3 = 300. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли в результате такой операции получиться число 151?","ak":"yn","av":"НЕТ","steps":[{"t":"Результат 33a + 3b делится на 3, а 151 — нет. Ответ: нет.","f":["div_sum"]}]},{"l":"в","q":"Сколько различных чисел может получиться в результате такой операции из чисел от 100 до 600 включительно?","ak":"num","av":"51","steps":[{"t":"Результат 3(11a + b), b ≤ 9 \u003c 11 ⇒ разные пары (a, b) дают разные результаты.","f":[]},{"t":"От 100 до 599: a = 1…5, b = 0…9 — 50 значений; 600 даёт a = 6, b = 0 — ещё одно. Итого 51.","f":["est_ex"]}]}],"tags":["digits"],"facts":["dec_repr","div_sum","est_ex"],"note":"","n":27},{"id":"159664","d":2,"from":"PDF №042","stem":"Дано трёхзначное натуральное число, не кратное 100.","parts":[{"l":"а","q":"Может ли частное этого числа и суммы его цифр быть равным 11?","ak":"yn","av":"ДА","steps":[{"t":"198: сумма цифр 18, 198 : 18 = 11. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли частное этого числа и суммы его цифр быть равным 5?","ak":"yn","av":"НЕТ","steps":[{"t":"100a + 10b + c = 5(a + b + c) ⇒ 95a + 5b = 4c. Но 95a ≥ 95 > 36 ≥ 4c. Ответ: нет.","f":["dec_repr"]}]},{"l":"в","q":"Какое наибольшее натуральное значение может иметь частное данного числа и суммы его цифр, если первая цифра данного числа равна 7?","ak":"num","av":"80","steps":[{"t":"N = 700 + 10b + c, s = 7 + b + c ≥ 8 (700 кратно 100).","f":[]},{"t":"s = 8: 710, 701 — не делятся на 8. s = 9: 720/9 = 80 ✓. s ≥ 10: частное ≤ 799/10 \u003c 80.","f":["est_ex"]},{"t":"Ответ: 80 (число 720).","f":[]}]}],"tags":["digits"],"facts":["dec_repr","est_ex"],"note":"","n":28},{"id":"91284","d":2,"from":"PDF №044","stem":"На доске написали несколько не обязательно различных двузначных натуральных чисел без нулей в десятичной записи. Сумма этих чисел оказалась равной 264. В каждом числе поменяли местами первую и вторую цифры, например, число 17 заменили на число 71.","parts":[{"l":"а","q":"Приведите пример исходных чисел, для которых сумма получившихся чисел ровно в 4 раза больше, чем сумма исходных чисел.","ak":"self","av":"Например, десять чисел 19 и числа 39, 35.","steps":[{"t":"A — сумма цифр десятков, B — единиц: 10A + B = 264, 10B + A = 4·264 = 1056.","f":["dec_repr"]},{"t":"Решаем: B = 104, A = 16. Чисел k: A ≥ k (десятки ≥ 1), B ≤ 9k ⇒ 12 ≤ k ≤ 16.","f":[]},{"t":"Пример k = 12: десять чисел 19, а также 39 и 35: 190 + 39 + 35 = 264; после перестановки 910 + 93 + 53 = 1056.","f":[]}]},{"l":"б","q":"Могла ли сумма получившихся чисел быть ровно в 2 раза больше, чем сумма исходных чисел?","ak":"yn","av":"НЕТ","steps":[{"t":"10A + B = 264, 10B + A = 528 ⇒ 99B = 5280 − 264 = 5016 ⇒ B = 50,67 — не целое. Ответ: нет.","f":["lin_dioph"]}]},{"l":"в","q":"Найдите наибольшее возможное значение суммы получившихся чисел.","ak":"num","av":"1254","steps":[{"t":"Новая сумма 10B + A = 10(264 − 10A) + A = 2640 − 99A — нужно минимизировать A.","f":["dec_repr"]},{"t":"Чисел k ≤ A, а B ≤ 9k ≤ 9A ⇒ 264 − 10A ≤ 9A ⇒ A ≥ 14.","f":["est_ex"]},{"t":"A = 14: 2640 − 1386 = 1254. Пример: двенадцать чисел 19 и два 18: 228 + 36 = 264 → 1092 + 162 = 1254. Ответ: 1254.","f":[]}]}],"tags":["digits"],"facts":["dec_repr","lin_dioph","est_ex"],"note":"","n":29},{"id":"91286","d":2,"from":"PDF №045","stem":"На доске написали несколько не обязательно различных двузначных натуральных чисел без нулей в десятичной записи. Сумма этих чисел оказалась равной 2376. В каждом числе поменяли местами первую и вторую цифры, например, число 17 заменили на число 71.","parts":[{"l":"а","q":"Приведите пример исходных чисел, для которых сумма получившихся чисел ровно в 3 раза больше, чем сумма исходных чисел.","ak":"self","av":"Например, 66 чисел 29, 11 чисел 39 и одно 33.","steps":[{"t":"10A + B = 2376, 10B + A = 3·2376 = 7128 ⇒ 99B = 71280 − 2376 ⇒ B = 696, A = 168.","f":["dec_repr"]},{"t":"Чисел k: 696/9 ≤ k ≤ 168. Возьмём k = 78: единицы — 77 девяток и одна 3; десятки — 66 двоек и 12 троек (156 + 12 = 168).","f":[]},{"t":"Пример: 66·29 + 11·39 + 33 = 1914 + 429 + 33 = 2376; после перестановки 66·92 + 11·93 + 33 = 6072 + 1023 + 33 = 7128.","f":[]}]},{"l":"б","q":"Могла ли сумма получившихся чисел быть ровно в 6 раз больше, чем сумма исходных чисел?","ak":"yn","av":"НЕТ","steps":[{"t":"10B + A = 6·2376 ⇒ B = 2376·59/99 = 1416, A = 96.","f":["lin_dioph"]},{"t":"Чисел k ≤ A = 96, но B ≤ 9k ≤ 864 \u003c 1416. Противоречие. Ответ: нет.","f":[]}]},{"l":"в","q":"Найдите наибольшее возможное значение суммы получившихся чисел.","ak":"num","av":"11286","steps":[{"t":"Новая сумма 10B + A = 10(2376 − 10A) + A = 23760 − 99A — минимизируем A.","f":["dec_repr"]},{"t":"B ≤ 9k ≤ 9A ⇒ 2376 − 10A ≤ 9A ⇒ A ≥ 125,05 ⇒ A ≥ 126.","f":["est_ex"]},{"t":"A = 126: 23760 − 12474 = 11286. Пример: 123 числа 19 и 3 числа 13 (2337 + 39 = 2376) → 11193 + 93 = 11286. Ответ: 11286.","f":[]}]}],"tags":["digits"],"facts":["dec_repr","lin_dioph","est_ex"],"note":"","n":30},{"id":"47426","d":2,"from":"PDF №047","stem":"На доске написаны три различных натуральных числа. Второе число равно сумме цифр первого, а третье равно сумме цифр второго.","parts":[{"l":"а","q":"Может ли сумма этих чисел быть равна 2022?","ak":"yn","av":"ДА","steps":[{"t":"Пример: 1994, 23, 5: 1994 + 23 + 5 = 2022. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли сумма этих чисел быть равна 2021?","ak":"yn","av":"НЕТ","steps":[{"t":"x ≡ S(x) ≡ S(S(x)) (mod 9) ⇒ сумма ≡ 3x (mod 9) — даёт остаток 0, 3 или 6.","f":["ds_mod9"]},{"t":"2021 ≡ 5 (mod 9). Ответ: нет.","f":[]}]},{"l":"в","q":"В тройке чисел первое число трёхзначное, а третье равно 2. Сколько существует таких троек?","ak":"num","av":"97","steps":[{"t":"Третье = 2 ⇒ второе ∈ {2, 11, 20} (второе ≤ 27). Числа различны ⇒ второе ≠ 2 ⇒ второе 11 или 20.","f":[]},{"t":"Трёхзначных с суммой цифр 11: 61; с суммой цифр 20: 36 (подсчёт по первой цифре).","f":["est_ex"]},{"t":"Всего 61 + 36 = 97 троек.","f":[]}]}],"tags":["digits"],"facts":["ds_mod9","est_ex"],"note":"","n":31},{"id":"16737","d":2,"from":"PDF №061","stem":"Квадратное уравнение x² + px + q = 0 имеет два различных натуральных корня.","parts":[{"l":"а","q":"Пусть q = 55. Найдите все возможные значения p.","ak":"set","av":"-56;-16","steps":[{"t":"Корни u \u003c v натуральные: uv = q = 55, p = −(u + v).","f":["vieta"]},{"t":"55 = 1·55 = 5·11 ⇒ p = −56 или p = −16.","f":[]}]},{"l":"б","q":"Пусть p + q = 30. Найдите все возможные значения q.","ak":"num","av":"64","steps":[{"t":"p + q = uv − u − v = 30 ⇒ (u − 1)(v − 1) = 31 — простое.","f":["factor"]},{"t":"u − 1 = 1, v − 1 = 31 ⇒ u = 2, v = 32, q = 64.","f":[]}]},{"l":"в","q":"Пусть q² − p² = 2108. Найдите все возможные корни исходного уравнения.","ak":"set","av":"6;8","steps":[{"t":"q² − p² = (uv − u − v)(uv + u + v) = 2108 = 2²·17·31. Множители одной чётности (разность 2(u+v)) ⇒ оба чётные: (2; 1054) или (34; 62).","f":["factor"]},{"t":"(34; 62): u + v = (62 − 34)/2 = 14, uv = (34 + 62)/2 = 48 ⇒ корни 6 и 8.","f":["vieta"]},{"t":"(2; 1054): u + v = 526, uv = 528 — дискриминант 274564 не квадрат. Ответ: 6 и 8.","f":[]}]}],"tags":["eq"],"facts":["vieta","factor","est_ex"],"note":"","n":32},{"id":"2447","d":2,"from":"PDF №065","stem":"На доске написано 30 различных натуральных чисел, десятичная запись каждого из которых оканчивается или на цифру 4, или на цифру 8. Сумма написанных чисел равна 2786.","parts":[{"l":"а","q":"Может ли на доске быть поровну чисел, оканчивающихся на 4 и на 8?","ak":"yn","av":"НЕТ","steps":[{"t":"15 чисел на 4 и 15 на 8: последняя цифра суммы 15·4 + 15·8 = 180 → 0. А 2786 оканчивается на 6. Ответ: нет.","f":["last_digit"]}]},{"l":"б","q":"Могут ли ровно четыре числа на доске оканчиваться на 8?","ak":"yn","av":"НЕТ","steps":[{"t":"26 различных чисел на 4: сумма ≥ 4 + 14 + … + 254 = 3354 > 2786. Ответ: нет.","f":["distinct_min"]}]},{"l":"в","q":"Какое наименьшее количество чисел, оканчивающихся на 8, может быть на доске?","ak":"num","av":"9","steps":[{"t":"k чисел на 8: последняя цифра суммы 120 + 4k ≡ 6 (mod 10) ⇒ k ≡ 4 (mod 5) ⇒ k ∈ {4, 9, …}; k = 4 нельзя (б).","f":["last_digit"]},{"t":"k = 9: минимум 4 + … + 204 (2184) + 8 + … + 88 (432) = 2616 ≤ 2786.","f":["est_ex"]},{"t":"Пример: 4, 14, …, 204 и 8, 18, …, 78, 258 — сумма 2786. Ответ: 9.","f":[]}]}],"tags":["digits"],"facts":["last_digit","distinct_min","est_ex"],"note":"","n":33},{"id":"1099","d":2,"from":"Школково","stem":"На доске написано несколько различных натуральных чисел, причем любые два из них отличаются не более чем в 3 раза.","parts":[{"l":"а","q":"Может ли на доске быть написано 5 чисел, сумма которых равна 47?","ak":"yn","av":"ДА","steps":[{"t":"Пример: 7, 8, 9, 10, 13 — сумма 47, 13 ≤ 3·7. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли на доске быть написано 10 чисел, сумма которых равна 94?","ak":"yn","av":"НЕТ","steps":[{"t":"m — наименьшее. 10 различных чисел в [m; 3m] ⇒ 2m + 1 ≥ 10 ⇒ m ≥ 5.","f":[]},{"t":"Сумма ≥ m + (m+1) + … + (m+9) = 10m + 45 ≥ 95 > 94. Ответ: нет.","f":["distinct_min"]}]},{"l":"в","q":"Сколько чисел может быть написано на доске, если их произведение равно 8000?","ak":"set","av":"2;3","steps":[{"t":"8000 = 2⁶·5³. Двух чисел: 80·100 (100 ≤ 240). Трёх: 16·20·25.","f":["fta"]},{"t":"Четыре и больше: наименьшее m ≤ 8 (иначе произведение > 8000), а делители 8000 в [m; 3m] — из {1, 2, 4, 5, 8, 10, 16, 20}; перебор показывает, что произведение 8000 не получается.","f":["est_ex"]},{"t":"Ответ: 2 или 3 числа.","f":[]}]}],"tags":["est","div"],"facts":["fta","distinct_min","est_ex"],"note":"","n":34},{"id":"2060","d":2,"from":"Школково","stem":"На доске написаны числа 1, 2, 3,…, 30. За один ход разрешается стереть три числа, сумма которых меньше 35 и отлична от каждой из сумм троек чисел, стёртых на предыдущих ходах.","parts":[{"l":"а","q":"Приведите пример 5 ходов.","ak":"self","av":"Например: (1, 14, 15), (2, 12, 13), (3, 10, 11), (4, 8, 9), (5, 6, 7) — суммы 30, 27, 24, 21, 18.","steps":[{"t":"Нужны 5 троек с разными суммами меньше 35.","f":[]},{"t":"(1,14,15) = 30, (2,12,13) = 27, (3,10,11) = 24, (4,8,9) = 21, (5,6,7) = 18.","f":[]}]},{"l":"б","q":"Можно ли сделать 10 ходов?","ak":"yn","av":"НЕТ","steps":[{"t":"10 ходов — стёрты все числа, сумма 465.","f":["sum_1n"]},{"t":"10 разных сумм \u003c 35: ≤ 34 + 33 + … + 25 = 295 \u003c 465. Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наибольшее число ходов можно сделать?","ak":"num","av":"6","steps":[{"t":"k ходов: сумма стёртых ≥ 1 + … + 3k = 3k(3k+1)/2, а разных сумм ≤ 34 + … + (35 − k) = k(69 − k)/2.","f":["sum_1n"]},{"t":"3(3k + 1) ≤ 69 − k ⇒ k ≤ 6.","f":["est_ex"]},{"t":"Пример: (5,11,14), (17,3,13), (2,15,7), (4,8,9), (1,18,10), (16,12,6) — суммы 30, 33, 24, 21, 29, 34. Ответ: 6.","f":[]}]}],"tags":["est"],"facts":["sum_1n","est_ex"],"note":"","n":35},{"id":"2061","d":2,"from":"Школково","stem":"Множество чисел назовём хорошим, если его можно разбить на два подмножества с одинаковой суммой чисел.","parts":[{"l":"а","q":"Является ли множество {100;101;102;...;199} хорошим?","ak":"yn","av":"ДА","steps":[{"t":"Разобьём на четвёрки a, a+1, a+2, a+3: a + (a+3) = (a+1) + (a+2).","f":[]},{"t":"100 чисел = 25 четвёрок, в каждой «крайние» в одно подмножество, «средние» в другое. Ответ: да.","f":[]}]},{"l":"б","q":"Является ли множество {2;4;8;...;2200} хорошим?","ak":"yn","av":"НЕТ","steps":[{"t":"2 + 4 + … + 2¹⁹⁹ = 2²⁰⁰ − 2 \u003c 2²⁰⁰ ⇒ подмножество с 2²⁰⁰ всегда тяжелее. Ответ: нет.","f":["pow2"]}]},{"l":"в","q":"Сколько хороших четырёхэлементных подмножеств у множества {3;4;5;6;8;10;12}?","ak":"num","av":"8","steps":[{"t":"Сумма четырёх чисел чётна, и половина — сумма одного или двух чисел.","f":["parity"]},{"t":"Перебор даёт 8: {3,4,5,6}, {3,4,5,12}, {3,5,6,8}, {3,5,8,10}, {3,5,10,12}, {4,6,8,10}, {4,6,10,12}, {6,8,10,12}. Ответ: 8.","f":[]}]}],"tags":["est"],"facts":["pow2","parity","est_ex"],"note":"","n":36},{"id":"2317","d":2,"from":"Школково","stem":"Дано трёхзначное натуральное число.","parts":[{"l":"в","q":"Какое наименьшее натуральное значение может иметь частное данного числа и суммы его цифр?","ak":"num","av":"11","steps":[{"t":"100a + 10b + c = q(a + b + c) ⇒ (100 − q)a + (10 − q)b = (q − 1)c ≤ 9(q − 1).","f":["dec_repr"]},{"t":"При q ≤ 10 левая часть ≥ 90a ≥ 90 > 81. Значит, q ≥ 11.","f":["est_ex"]},{"t":"198 = 11·18. Ответ: 11.","f":[]}]}],"tags":["digits"],"facts":["dec_repr","est_ex"],"note":"","n":37},{"id":"10820","d":2,"from":"Школково","stem":"Последовательность a₁, a₂, …, a₆ состоит из неотрицательных однозначных чисел. Mₖ — среднее арифметическое всех членов, кроме k-го. Известно, что M₁ = 1, M₂ = 2.","parts":[{"l":"а","q":"Приведите пример такой последовательности, для которой M3 =1,6.","ak":"self","av":"Например, 5, 0, 2, 1, 1, 1.","steps":[{"t":"Пусть S — сумма. S − a₁ = 5, S − a₂ = 10, нужно S − a₃ = 8.","f":["mean"]},{"t":"S = 10: a₁ = 5, a₂ = 0, a₃ = 2, остальные 1, 1, 1.","f":[]}]},{"l":"б","q":"Существует ли такая последовательность, для которой M3 = 3?","ak":"yn","av":"НЕТ","steps":[{"t":"S − a₃ = 15 ⇒ S ≥ 15, но a₁ = S − 5 ≤ 9 ⇒ S ≤ 14. Ответ: нет.","f":[]}]},{"l":"в","q":"Найдите наибольшее возможное значение M3.","ak":"num","av":"2,8","steps":[{"t":"M₃ = (S − a₃)/5 ≤ S/5 ≤ 14/5.","f":["est_ex"]},{"t":"Пример: 9, 4, 0, 1, 0, 0 (S = 14). Ответ: 2,8.","f":[]}]}],"tags":["avg"],"facts":["mean","est_ex"],"note":"","n":38},{"id":"13561","d":2,"from":"Школково","stem":"Дано трёхзначное число A, сумма цифр которого равна S.","parts":[{"l":"а","q":"Может ли выполняться равенство A ⋅S =1105?","ak":"yn","av":"ДА","steps":[{"t":"1105 = 5·13·17 = 221·5, сумма цифр 221 равна 5. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли выполняться равенство A ⋅S =1106?","ak":"yn","av":"НЕТ","steps":[{"t":"A ≡ S (mod 9) ⇒ A·S ≡ S² (mod 9) — остаток 0, 1, 4 или 7.","f":["ds_mod9"]},{"t":"1106 ≡ 8 (mod 9). Ответ: нет.","f":["mod_sq"]}]},{"l":"в","q":"Какое наименьшее значение может принимать выражение A ⋅S, если оно больше 1503?","ak":"num","av":"1507","steps":[{"t":"1504 ≡ 1: 1504 = 2⁵·47, трёхзначные делители 188, 376, 752 — суммы цифр не те. 1505 ≡ 2, 1506 ≡ 3 — нельзя.","f":["ds_mod9"]},{"t":"1507 = 137·11, сумма цифр 137 равна 11. Ответ: 1507.","f":["est_ex"]}]}],"tags":["digits","div"],"facts":["ds_mod9","mod_sq","est_ex"],"note":"","n":39},{"id":"14954","d":2,"from":"Школково","stem":"На доске написано несколько различных натуральных чисел, которые делятся на 3 и оканчиваются на 4.","parts":[{"l":"а","q":"Может ли их сумма составлять 282?","ak":"yn","av":"ДА","steps":[{"t":"Числа кратны 3 и оканчиваются на 4 ⇒ они ≡ 24 (mod 30): 24, 54, 84, 114, …","f":["div_comp"]},{"t":"24 + 54 + 204 = 282. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли их сумма составлять 390?","ak":"yn","av":"НЕТ","steps":[{"t":"Сумма k чисел ≡ 24k (mod 30); 390 ≡ 0 ⇒ k кратно 5.","f":["mod_def"]},{"t":"При k = 5 сумма ≥ 24 + 54 + 84 + 114 + 144 = 420 > 390. Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наибольшее количество чисел могло быть на доске, если их сумма равна 2226?","ak":"num","av":"9","steps":[{"t":"2226 ≡ 6 (mod 30) ⇒ 24k ≡ 6 ⇒ k ≡ 4 (mod 5).","f":["mod_def"]},{"t":"k = 14: сумма ≥ 3066 > 2226 ⇒ k ≤ 9.","f":["est_ex"]},{"t":"Пример: 24, 54, …, 234 и 1194 (вместо 264) — сумма 2226. Ответ: 9.","f":[]}]}],"tags":["div","digits"],"facts":["div_comp","last_digit","mod_def","est_ex"],"note":"","n":40},{"id":"18610","d":2,"from":"Школково","stem":"Натуральные числа от 1 до 12 разбивают на четыре группы, в каждой из которых есть по крайней мере два числа. Для каждой группы находят сумму чисел этой группы. Для каждой пары групп находят модуль разности полученных сумм и полученные 6 чисел складывают.","parts":[{"l":"а","q":"Может ли в результате получиться 0?","ak":"yn","av":"НЕТ","steps":[{"t":"Сумма 1 + … + 12 = 78 на 4 равные части не делится (19,5). Ответ: нет.","f":[]}]},{"l":"б","q":"Может ли в результате получиться 1?","ak":"yn","av":"НЕТ","steps":[{"t":"Сумма модулей разностей имеет ту же чётность, что сумма самих сумм по парам: каждая сумма входит 3 раза ⇒ 3·78 — чётно.","f":["parity"]},{"t":"1 нечётно. Отве
