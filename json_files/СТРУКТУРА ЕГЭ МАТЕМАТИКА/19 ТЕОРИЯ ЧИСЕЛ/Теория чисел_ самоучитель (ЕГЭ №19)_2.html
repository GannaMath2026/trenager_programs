ись. Ответ: да.","f":[]}]},{"l":"в","q":"Известно, что первоначально средний балл участников теста составил 90, средний балл сдавших тест учеников составил 100, а средний балл не сдавших тест учеников составил 75. После добавления баллов средний балл сдавших тест учеников стал равен 103, а не сдавших — 79. При каком наименьшем числе участников теста возможна такая ситуация?","ak":"num","av":"15","steps":[{"t":"До: 100p + 75f = 90(p + f) ⇒ 2p = 3f. После: 103p′ + 79f′ = 95(p′ + f′) ⇒ p′ = 2f′.","f":["mean"]},{"t":"N = p + f кратно 5 и N = p′ + f′ кратно 3 ⇒ N кратно 15.","f":[]},{"t":"Пример N = 15: 9 сдали (среднее 100), 6 не сдали: один с 80 баллами (переходит в сдавшие) и пятеро со средним 74. Проверка: после +5 сдавшие (945 + 85)/10 = 103, не сдавшие 79. Ответ: 15.","f":["est_ex"]}]}],"tags":["avg"],"facts":["mean","mean_move","est_ex"],"note":"","n":102},{"id":"26297","d":3,"from":"Школково","stem":"В нескольких одинаковых бочках налито некоторое необязательно одинаковое количество литров воды. За один раз можно перелить любое количество воды из одной бочки в другую.","parts":[{"l":"а","q":"Пусть есть четыре бочки, в которых 29, 32, 40 и 91 литр воды. Можно ли не более чем за четыре переливания уравнять количество воды во всех бочках?","ak":"yn","av":"ДА","steps":[{"t":"Всего 192 л ⇒ по 48 л. Из бочки с 91 л отливаем 19 л в первую, 16 л во вторую и 8 л в третью — 3 переливания. Ответ: да.","f":[]}]},{"l":"б","q":"Пусть есть семь бочек. Всегда ли можно уравнять количество воды во всех бочках не более чем за пять переливаний?","ak":"yn","av":"НЕТ","steps":[{"t":"Пусть в бочках 7, 0, 0, 0, 0, 0, 0 л (по 1 л на бочку). Никакая группа бочек без первой не имеет нужной суммы ⇒ каждая бочка должна быть связана переливаниями с остальными.","f":[]},{"t":"Связать 7 бочек нужно не меньше 6 переливаний > 5. Ответ: нет.","f":[]}]},{"l":"в","q":"За какое наименьшее количество переливаний можно заведомо уравнять количество воды в 26 бочках?","ak":"num","av":"25","steps":[{"t":"Всегда хватает 25: каждым переливанием доводим одну бочку до среднего (из бочки с избытком в бочку с недостатком), последнее уравнивает сразу две.","f":[]},{"t":"Меньше нельзя: если вся вода в одной бочке, каждую из 25 пустых нужно наполнить отдельно. Ответ: 25.","f":["est_ex"]}]}],"tags":["est"],"facts":["mean","est_ex"],"note":"","n":103},{"id":"26929","d":3,"from":"Школково","stem":"Даны четыре последовательных натуральных числа. Каждое из чисел поделили на его последнюю цифру, а затем четыре результата сложили.","parts":[{"l":"в","q":"Какое наибольшее целое значение может принимать сумма, если изначально могли быть только числа от 800 до 999 включительно?","ak":"num","av":"2004","steps":[{"t":"Последние цифры d, …, d + 3 (без нуля): сумма 4 + 10k·(1/d + … + 1/(d+3)) для чисел 10k + d, …","f":["dec_repr"]},{"t":"Наибольшая сумма при d = 1. Для 10k+1…10k+4: 4 + 10k·25/12 — целое при k кратном 6.","f":["frac_monot"]},{"t":"k ≤ 99, k кратно 6 ⇒ k = 96: 961/1 + 962/2 + 963/3 + 964/4 = 961 + 481 + 321 + 241 = 2004. Ответ: 2004.","f":["est_ex"]}]}],"tags":["digits"],"facts":["dec_repr","frac_monot","est_ex"],"note":"","n":104},{"id":"26930","d":3,"from":"Школково","stem":"Даны 4 последовательных натуральных числа. Каждое из них поделили на его первую цифру, а затем результаты сложили.","parts":[{"l":"в","q":"Какое максимальное целое значение суммы могло получиться, если брать числа от 400 до 999 включительно?","ak":"num","av":"478","steps":[{"t":"Если все четыре числа с первой цифрой a, сумма (4s + 6)/a, где s — первое число.","f":["dec_repr"]},{"t":"a = 4: 4s + 6 не делится на 4. a = 5: нужно 4s + 6 ⇒ s ≡ 1 (mod 5), наибольшее s = 596: (596 + … + 599)/5 = 478. a = 6…9: сумма ≤ 4·999/6 \u003c 478. Переходы через сотню дают нецелое.","f":["div_def"]},{"t":"Ответ: 478.","f":["est_ex"]}]}],"tags":["digits"],"facts":["dec_repr","div_def","est_ex"],"note":"","n":105},{"id":"27764","d":3,"from":"Школково","stem":"Семь экспертов оценивают кинофильм. Каждый из них выставляет оценку — целое число баллов от 0 до 12 включительно. Известно, что все эксперты выставили различные оценки. По старой системе оценивания рейтинг кинофильма — это среднее арифметическое всех оценок экспертов. По новой системе оценивания рейтинг кинофильма вычисляется следующим образом: отбрасываются наименьшая и наибольшая оценки и подсчитывается среднее арифметическое пяти оставшихся оценок.","parts":[{"l":"а","q":"Может ли разность рейтингов, вычисленных по старой и новой системам оценивания, равняться 1/25?","ak":"yn","av":"НЕТ","steps":[{"t":"Пусть a, b — наименьшая и наибольшая, M — сумма пяти средних. Разность = (a+b+M)/7 − M/5 = (5(a+b) − 2M)/35.","f":["mean"]},{"t":"1/25 со знаменателем 35 не записать. Ответ: нет.","f":[]}]},{"l":"б","q":"Может ли разность рейтингов, вычисленных по старой и новой системам оценивания, равняться 1/35?","ak":"yn","av":"ДА","steps":[{"t":"5(a + b) − 2M = 1: a = 1, b = 12, M = 32 — например, 2, 5, 7, 8, 10. Ответ: да.","f":[]}]},{"l":"в","q":"Найдите наибольшее возможное значение разности рейтингов, вычисленных по старой и новой системам оценивания.","ak":"num","av":"6/7","steps":[{"t":"Максимизируем 5(a + b) − 2M: a = 0, b = 12, а M ≥ 1 + 2 + 3 + 4 + 5 = 15 ⇒ 60 − 30 = 30.","f":["est_ex"]},{"t":"Разность ≤ 30/35 = 6/7 (при a ≥ 1 меньше). Пример: 0, 1, 2, 3, 4, 5, 12. Ответ: 6/7.","f":[]}]}],"tags":["avg"],"facts":["mean","est_ex"],"note":"","n":106},{"id":"30834","d":3,"from":"Школково","stem":"Несколько камней, каждый из которых весит не менее 100 г, разложили в три кучки. В первой кучке оказалось n1 камней с суммарным весом S1, во второй — n² камней с суммарным весом S2, а в третьей — n3 камней с суммарным весом S3. Оказалось так, что n1 \u003c n² \u003c n3.","parts":[{"l":"а","q":"Могло ли так случиться, что S1 >S2 > S3?","ak":"yn","av":"ДА","steps":[{"t":"Пример: 1-я кучка — 1 камень 1000 г; 2-я — 2 камня по 200 г; 3-я — 3 камня по 100 г. 1000 > 400 > 300. Ответ: да.","f":[]}]},{"l":"б","q":"Могло ли так случиться, что S1 >S2 > S3, а вес каждого камня не превышает 105 грамм?","ak":"yn","av":"ДА","steps":[{"t":"n₁ = a, n₂ = a + 1, n₃ = a + 2: нужно 105a > S₂ > S₃ ≥ 100(a + 2) ⇒ a ≥ 41.","f":[]},{"t":"a = 41: 1-я кучка — 41 камень по 105 г (4305), 2-я — 42 камня: 20 по 105 г, один 101 г, 21 по 100 г (4301), 3-я — 43 камня по 100 г (4300). 4305 > 4301 > 4300. Ответ: да.","f":[]}]},{"l":"в","q":"Вес каждого камня не более k грамм. При каком минимальном целом k могло оказаться, что S1 >S2 > S3?","ak":"num","av":"101","steps":[{"t":"k = 100 — все камни по 100 г, тогда S растёт с количеством. Нельзя.","f":[]},{"t":"k = 101: n₁ = 202, n₂ = 203, n₃ = 204: S₁ = 202·101 = 20402, S₂ = 20401, S₃ = 20400. Ответ: 101.","f":["est_ex"]}]}],"tags":["avg","est"],"facts":["mean","est_ex"],"note":"","n":107},{"id":"43707","d":3,"from":"Школково","stem":"На доске написано 11 различных натуральных чисел. Среднее арифметическое шести наименьших равно 8, а семи наибольших — 14.","parts":[{"l":"а","q":"Может ли наибольшее из этих одиннадцати чисел равняться 16?","ak":"yn","av":"НЕТ","steps":[{"t":"a₅ + … + a₁₁ = 98. Если a₁₁ = 16, то сумма ≤ 16 + 15 + … + 10 = 91 \u003c 98. Ответ: нет.","f":["distinct_min"]}]},{"l":"в","q":"Найдите наименьшее значение среднего арифметического всех одиннадцати чисел.","ak":"num","av":"123/11","steps":[{"t":"Сумма = 48 + 98 − (a₅ + a₆) — максимизируем a₅ + a₆.","f":["mean"]},{"t":"a₇…a₁₁ ≥ 5a₆ + 15 ⇒ a₅ + 6a₆ ≤ 83; a₅ ≤ a₆ − 1 ⇒ a₅ + a₆ ≤ 23 (a₆ = 12, a₅ = 11).","f":["distinct_min"]},{"t":"Пример: 4, 6, 7, 8, 11, 12, 13, 14, 15, 16, 17 — сумма 123. Ответ: 123/11.","f":["est_ex"]}]}],"tags":["avg"],"facts":["mean","distinct_min","est_ex"],"note":"","n":108},{"id":"46183","d":3,"from":"Школково","stem":"Каждый из 32 студентов написал или одну из двух контрольных работ, или обе контрольные работы. За каждую работу можно было получить целое число баллов от 0 до 20 включительно. По каждой из двух работ в отдельности средний балл составил 14. Затем каждый студент назвал наивысший из своих баллов. При этом если студент писал одну работу, то он назвал балл за нее. Среднее арифметическое названных баллов равно S.","parts":[{"l":"б","q":"Могло ли оказаться, что только два студента написали обе контрольные работы, если S = 11?","ak":"yn","av":"НЕТ","steps":[{"t":"Названо = 14(32 + z) − (сумма меньших у писавших обе) ≥ 448 + 14z − 20z = 448 − 6z.","f":["mean"]},{"t":"S = 11 ⇒ названо 352 ⇒ 448 − 6z ≤ 352 ⇒ z ≥ 16 > 2. Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наименьшее количество студентов могло написать обе контрольные работы, если S = 11?","ak":"num","av":"16","steps":[{"t":"Из пункта б: z ≥ 16.","f":["est_ex"]},{"t":"Пример: 16 студентов (20; 20), по 8 студентов писали только одну работу с суммой 16 (по 2 балла). Названо 320 + 16 + 16 = 352. Ответ: 16.","f":[]}]}],"tags":["avg"],"facts":["mean","est_ex"],"note":"","n":109},{"id":"46752","d":3,"from":"Школково","stem":"Все члены конечной последовательности являются натуральными числами. Каждый член этой последовательности, начиная со второго, либо в 7 раз больше, либо в 7 раз меньше предыдущего. Сумма всех членов последовательности равна 9177.","parts":[{"l":"а","q":"Может ли последовательность состоять из трёх членов?","ak":"yn","av":"ДА","steps":[{"t":"Три члена m, 7m, 49m: 57m = 9177 ⇒ m = 161: 161, 1127, 7889. Ответ: да.","f":["fta"]}]},{"l":"б","q":"Может ли последовательность состоять из пяти членов?","ak":"yn","av":"ДА","steps":[{"t":"Схема 7m, m, 7m, m, 7m: 23m = 9177 ⇒ m = 399: 2793, 399, 2793, 399, 2793. Ответ: да.","f":[]}]},{"l":"в","q":"Какое наибольшее количество членов может быть в последовательности?","ak":"num","av":"2295","steps":[{"t":"Два соседних члена — x и 7x, их сумма ≥ 8 ⇒ при n членах сумма ≥ 8·[n/2] (+1 при нечётном n).","f":["est_ex"]},{"t":"n = 2296 даёт ≥ 9184 > 9177. n = 2295: 1, 7, 1, 7, …, 1 — сумма 1148 + 7·1147 = 9177. Ответ: 2295.","f":[]}]}],"tags":["seq"],"facts":["fta","pow2","est_ex"],"note":"","n":110},{"id":"46754","d":3,"from":"Школково","stem":"Трёхзначное число, меньшее 910, поделили на сумму его цифр и получили натуральное число n.","parts":[{"l":"в","q":"Какое наибольшее значение может принимать n, если все цифры ненулевые?","ak":"num","av":"79","steps":[{"t":"Ненулевые цифры ⇒ сумма ≥ a + 2, число \u003c 100(a + 1).","f":["dec_repr"]},{"t":"Перебор по сумме цифр: n = 711/9 = 79; при сумме 9 и цифрах ≥ 1 число ≤ 711, при сумме ≥ 10 частное ≤ 909/10 \u003c 91, и проверка 80…90 даёт нецелые/недопустимые варианты.","f":["est_ex"]},{"t":"Ответ: 79 (число 711).","f":[]}]}],"tags":["digits"],"facts":["dec_repr","est_ex"],"note":"","n":111},{"id":"46763","d":3,"from":"Школково","stem":"Группу детей можно перевезти автобусами модели А (мест больше 30, но меньше 40) или модели Б (больше 40, но меньше 50). В обоих случаях все места заняты, но автобусов Б нужно на один меньше.","parts":[{"l":"б","q":"Найдите наименьшее возможное количество детей в группе, если их больше 150.","ak":"num","av":"180","steps":[{"t":"a·x = b·(x − 1) ⇒ a = (x−1)s, b = xs, детей x(x−1)s.","f":["lin_dioph"]},{"t":"Варианты: 96, 132, 144 (≤ 150), затем 180 = 36·5 = 45·4. Ответ: 180.","f":["est_ex"]}]}],"tags":["div","eq"],"facts":["lin_dioph","est_ex"],"note":"","n":112},{"id":"56127","d":3,"from":"Школково","stem":"У Пети дома лежат по 100 монет номинала 1, 2, 5 и 10 рублей. Он хочет купить пирожное в магазине без сдачи, но до момента покупки Петя не знает, сколько стоит пирожное.","parts":[{"l":"а","q":"Может ли Петя выбрать дома 16 монет так, чтобы гарантированно купить пирожное стоимостью до 100 рублей?","ak":"yn","av":"ДА","steps":[{"t":"1, 2, 2, 5 дают все суммы 1…10, девять монет по 10 — дальше до 100. Всего 13 ≤ 16 монет. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли Петя выбрать дома 5 монет так, чтобы гарантированно купить пирожное стоимостью до 25 рублей?","ak":"yn","av":"НЕТ","steps":[{"t":"Упорядочим монеты c₁ ≤ … ≤ c₅. Чтобы не было «дыры», каждая следующая ≤ 1 + сумма предыдущих.","f":[]},{"t":"c₁ = 1, c₂ ≤ 2, c₃ ≤ 2 (монет 3 и 4 нет), c₄ ≤ 5, c₅ ≤ 10 ⇒ сумма ≤ 20 \u003c 25. Ответ: нет.","f":["est_ex"]}]},{"l":"в","q":"Какое наименьшее количество монет нужно взять Пете, если он знает, что пирожное стоит не более 100 рублей?","ak":"num","av":"13","steps":[{"t":"Как в б): первые четыре монеты дают сумму ≤ 10, каждая следующая ≤ 10 ⇒ k монет дают ≤ 10 + 10(k − 4) ≥ 100 ⇒ k ≥ 13.","f":["est_ex"]},{"t":"Пример: 1, 2, 2, 5 и девять по 10. Ответ: 13.","f":[]}]}],"tags":["est"],"facts":["coins","pow2","est_ex"],"note":"","n":113},{"id":"56128","d":3,"from":"Школково","stem":"Дано натуральное число. Можно либо вычесть из него утроенную сумму его цифр, либо прибавить к нему утроенную сумму его цифр. При этом полученное число должно быть натуральным.","parts":[{"l":"а","q":"Можно ли с помощью таких операций из числа 128 получить число 29?","ak":"yn","av":"ДА","steps":[{"t":"128 − 33 = 95, 95 − 42 = 53, 53 − 24 = 29. Ответ: да.","f":[]}]},{"l":"б","q":"Можно ли с помощью таких операций из числа 128 получить число 31?","ak":"yn","av":"НЕТ","steps":[{"t":"n ± 3S(n) ≡ n (mod 3) — остаток по mod 3 не меняется.","f":["invariant"]},{"t":"128 ≡ 2, а 31 ≡ 1 (mod 3). Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наименьшее натуральное число можно получить из 128 с помощью таких операций?","ak":"num","av":"2","steps":[{"t":"Все получаемые числа ≡ 2 (mod 3) ⇒ наименьшее возможное — 2.","f":["invariant"]},{"t":"Цепочка: 128 → 95 → 53 → 29 → 62 → 38 → 5 → 20 → 26 → 2. Ответ: 2.","f":["est_ex"]}]}],"tags":["ops"],"facts":["invariant","ds_mod9","est_ex"],"note":"","n":114},{"id":"73698","d":3,"from":"Школково","stem":"Трёхзначное число A имеет k натуральных делителей (в том числе 1 и A).","parts":[{"l":"в","q":"Найдите все такие числа A, для которых k ≥ 30.","ak":"self","av":"720 и 840.","steps":[{"t":"30 делителей: 720 = 2⁴·3²·5 (5·3·2 = 30). 32 делителя: 840 = 2³·3·5·7.","f":["fta"]},{"t":"Остальные трёхзначные имеют меньше 30 делителей (например, 960 = 2⁶·3·5 — 28). Ответ: 720 и 840.","f":["est_ex"]}]}],"tags":["div"],"facts":["tau","fta","est_ex"],"note":"","n":115},{"id":"114814","d":3,"from":"Школково","stem":"Есть 2 камня, каждый массой 100 тонн, 6 камней, каждый массой 20 тонн, и 4 камня, каждый массой 4 тонны.","parts":[{"l":"а","q":"Можно ли разложить все эти камни на три группы так, чтобы суммарная масса первой группы была на 12 тонн больше суммарной массы второй группы, но на 12 тонн меньше суммарной массы третьей группы?","ak":"yn","av":"ДА","steps":[{"t":"Всего 336 т ⇒ группы 100, 112, 124.","f":[]},{"t":"100 = один камень 100 т; 112 = 100 + 4 + 4 + 4; 124 = 6·20 + 4. Ответ: да.","f":[]}]},{"l":"б","q":"Можно ли разложить все эти камни на три группы так, чтобы суммарные массы этих групп были равны?","ak":"yn","av":"НЕТ","steps":[{"t":"По 112 т. Одна группа без «сотен»: 112 = 20a + 4b ⇒ только a = 5, b = 3.","f":["lin_dioph"]},{"t":"Остаются 20 и 4 т, а двум группам с «сотнями» нужно по 12 т. Нельзя. Ответ: нет.","f":[]}]},{"l":"в","q":"Все камни хотят разложить на три группы с суммарными массами m,m 1 2 и m3 так, что m1 ≥ m2 ≥ m3. Найдите такое наименьшее число d, что m1 − m2 ≤d и m2− m3 ≤ d.","ak":"num","av":"8","steps":[{"t":"Массы кратны 4. d = 4: группы (116, 112, 108) — перебор раскладок «сотен» показывает, что не собрать; d = 0 нельзя (пункт б).","f":["mod_cases"]},{"t":"d = 8: 120 = 100 + 20, 112 = 100 + 4·3, 104 = 5·20 + 4. Ответ: 8.","f":["est_ex"]}]}],"tags":["est"],"facts":["lin_dioph","mod_cases","est_ex"],"note":"","n":116},{"id":"114819","d":3,"from":"Школково","stem":"Дан набор натуральных чисел, каждое из которых меньше 100 и записано с помощью цифр 1,3,5,7 или 9. В наборе есть хотя бы одно однозначное и хотя бы одно двузначное число. Из этого набора чисел получили второй набор чисел следующим образом: к каждому однозначному числу приписали цифру, с помощью которой это число было записано; вместо каждого двузначного числа записали среднее арифметическое двух его цифр.","parts":[{"l":"а","q":"Может ли сумма чисел первого набора быть на 6 меньше суммы чисел второго набора?","ak":"yn","av":"ДА","steps":[{"t":"Однозначное x → xx = 11x; двузначное pq → (p + q)/2.","f":["append"]},{"t":"Набор {1, 1, 19}: первая сумма 21, вторая 11 + 11 + 5 = 27. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли сумма чисел первого набора быть в два раза больше суммы чисел второго набора?","ak":"yn","av":"ДА","steps":[{"t":"Условие ⇔ 3·(сумма десятков двузначных) = 7·(сумма однозначных).","f":[]},{"t":"Набор {3, 71}: 74 и 33 + 4 = 37, 74 = 2·37. Ответ: да.","f":[]}]},{"l":"в","q":"Найдите наибольшее возможное отношение суммы чисел второго набора к сумме чисел первого набора, если в первом наборе не было одинаковых чисел, а однозначных чисел было столько же, сколько и двузначных.","ak":"num","av":"5","steps":[{"t":"Отношение (11Σx + Σ(p+q)/2)/(Σx + Σ(10p+q)). Однозначные дают ×11, двузначные — «тянут вниз».","f":["dec_repr"]},{"t":"При k = 1: x = 9, двузначное 11: 100/20 = 5. С ростом k двузначные (разные) становятся больше и отношение падает.","f":["est_ex"]},{"t":"Ответ: 5.","f":[]}]}],"tags":["digits"],"facts":["dec_repr","append","est_ex"],"note":"","n":117},{"id":"114826","d":3,"from":"Школково","stem":"Среднее геометрическое k чисел p₁, …, pₖ равно ᵏ√(p₁·p₂·…·pₖ).","parts":[{"l":"а","q":"Может ли среднее геометрическое трёх различных двузначных чисел быть равно 45?","ak":"yn","av":"ДА","steps":[{"t":"45³ = 3⁶·5³ = 25·45·81. Ответ: да.","f":["fta"]}]},{"l":"б","q":"Найдите наименьшее возможное целое значение среднего геометрического трёх различных двузначных чисел.","ak":"num","av":"18","steps":[{"t":"g³ = a·b·c, a \u003c b \u003c c двузначные ⇒ g ≥ 11. g = 11, 13, 17 — простые, нужно g·g·g. g = 12, 14, 15, 16: делители g³ среди двузначных не дают трёх различных множителей (например, 12³ = 1728: при a ≥ 10, b ≥ 11 c ≤ 15, а в [10;15] делится только 12).","f":["fta"]},{"t":"g = 18: 12·18·27 = 5832 = 18³. Ответ: 18.","f":["est_ex"]}]},{"l":"в","q":"Найдите наибольшее возможное целое значение среднего геометрического шести различных двузначных чисел.","ak":"num","av":"60","steps":[{"t":"Простой делитель p ≥ 17 у g невозможен: нужно 6 двузначных кратных p. p = 11, 13: все шесть чисел кратны p, частные 1…9 не дают шестой степени.","f":["fta"]},{"t":"Остаются g из 61…96 с делителями 2, 3, 5, 7 — проверка каждого показывает, что 6 различных двузначных множителей не находится.","f":["est_ex"]},{"t":"g = 60: 15·60·75·80·90·96 = 60⁶. Ответ: 60.","f":[]}]}],"tags":["div"],"facts":["gmean","fta","est_ex"],"note":"","n":118},{"id":"114831","d":3,"from":"Школково","stem":"Дано четырёхзначное число с цифрами a, b, c, d (тысячи, сотни, десятки, единицы), a ≠ 0.","parts":[{"l":"а","q":"Может ли произведение a⋅b⋅c ⋅d быть больше суммы a+ b+ c+ d в 3 раза?","ak":"yn","av":"ДА","steps":[{"t":"1168: произведение 48, сумма 16, 48 = 3·16. Ответ: да.","f":[]}]},{"l":"б","q":"Цифры a, b, c и d попарно различны. Сколько существует различных таких чисел, у которых a·b·c·d \u003c a + b + c + d?","ak":"num","av":"1512","steps":[{"t":"Без нуля: произведение четырёх различных ненулевых цифр больше суммы (уже 1·2·3·x = 6x > 6 + x при x ≥ 2).","f":[]},{"t":"Значит, нужен 0 среди цифр (a ≠ 0): всего чисел с разными цифрами 9·9·8·7 = 4536, без нуля 9·8·7·6 = 3024 ⇒ 1512. Ответ: 1512.","f":["est_ex"]}]},{"l":"в","q":"Известно, что a·b·c·d = k(a + b + c + d), где k — двузначное число. При каком наименьшем числе abcd число k будет наибольшим?","ak":"num","av":"5889","steps":[{"t":"k = P/S, наибольшее двузначное k получается 96: 5·8·8·9 = 2880 = 96·30.","f":["est_ex"]},{"t":"Перебор: k > 96 не бывает, а среди чисел с k = 96 наименьшее — 5889. Ответ: 5889.","f":[]}]}],"tags":["digits"],"facts":["dec_repr","est_ex"],"note":"","n":119},{"id":"114839","d":3,"from":"Школково","stem":"Есть три коробки: в первой — 97 камней; во второй — 80, а в третьей коробке камней нет. Берут по одному камню из двух коробок и кладут их в оставшуюся. Сделали некоторое количество таких ходов.","parts":[{"l":"б","q":"Может ли в первой и второй коробках камней оказаться поровну?","ak":"yn","av":"НЕТ","steps":[{"t":"Разности по mod 3 сохраняются: 97 − 80 = 17 ≡ 2.","f":["invariant"]},{"t":"Поровну ⇒ разность 0. Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наибольшее количество камней может оказаться во второй коробке?","ak":"num","av":"176","steps":[{"t":"Остатки трёх коробок по mod 3 всегда попарно различны ⇒ в первой и третьей вместе ≥ 0 + 1 ⇒ во второй ≤ 176.","f":["invariant"]},{"t":"32 хода в третью: (65, 48, 64), затем 64 хода во вторую: (1, 176, 0). Ответ: 176.","f":["est_ex"]}]}],"tags":["ops"],"facts":["invariant","mod_def","est_ex"],"note":"","n":120},{"id":"159775","d":3,"from":"Школково","stem":"У Ивана Ильича есть коллекция монет. Если все его монеты разложить в одинаковые большие кляссеры, то потребуется k кляссеров, причём 5 ячеек в одном кляссере останутся пустыми. Если же их разложить в одинаковые маленькие кляссеры, то потребуется k + 2 кляссеров и также 5 ячеек в одном кляссере останутся пустыми. Известно, что в большом кляссере больше 150, но меньше 160 ячеек, а в маленьком – больше 100, но меньше 120 ячеек.","parts":[{"l":"а","q":"Может ли k быть равно 3?","ak":"yn","av":"НЕТ","steps":[{"t":"Монет kL − 5 = (k + 2)m − 5 ⇒ kL = (k + 2)m. При k = 3: 3L = 5m ⇒ L = 5t, m = 3t.","f":["lin_dioph"]},{"t":"150 \u003c 5t \u003c 160 ⇒ t = 31, m = 93 — не больше 100. Ответ: нет.","f":[]}]},{"l":"б","q":"Какое наименьшее количество монет может быть в коллекции у Ивана Ильича?","ak":"num","av":"607","steps":[{"t":"L/m = 1 + 2/k ∈ (150/119; 159/101) ⇒ k ∈ {4, 5, 6, 7}.","f":[]},{"t":"k = 4: L = 153, m = 102 ⇒ монет 4·153 − 5 = 607 — это наименьшее (остальные k дают больше). Ответ: 607.","f":["est_ex"]}]},{"l":"в","q":"Какое наибольшее количество монет может быть в коллекции у Ивана Ильича?","ak":"num","av":"1066","steps":[{"t":"k = 7: 7L = 9m ⇒ L = 153, m = 119 ⇒ 7·153 − 5 = 1066.","f":[]},{"t":"Другие k: 4·159 − 5 = 631, 5·154 − 5 = 765, 6·156 − 5 = 931. Ответ: 1066.","f":["est_ex"]}]}],"tags":["div","eq"],"facts":["lin_dioph","est_ex"],"note":"","n":121},{"id":"159899","d":3,"from":"Школково","stem":"На доске написаны три различных натуральных числа. Второе равно удвоенной сумме цифр первого, третье — утроенной сумме цифр второго.","parts":[{"l":"в","q":"Найдите количество четырёхзначных чисел, которые могут быть первым числом в тройке, если третье число равно 12.","ak":"num","av":"880","steps":[{"t":"Третье 12 ⇒ сумма цифр второго 4. Второе чётное и ≤ 2·36 = 72: это 4, 22 или 40 ⇒ сумма цифр первого 2, 11 или 20.","f":[]},{"t":"Четырёхзначных с суммой цифр 2: 4, с суммой 11: 279, с суммой 20: 597.","f":["est_ex"]},{"t":"Всего 4 + 279 + 597 = 880. Ответ: 880.","f":[]}]}],"tags":["digits"],"facts":["ds_mod9","est_ex"],"note":"","n":122},{"id":"160015","d":3,"from":"Школково","stem":"В школах №1 и №2 учащиеся писали тест. Из каждой школы тест писали по крайней мере 2 учащихся. Каждый учащийся, писавший тест, набрал натуральное количество баллов. Оказалось, что в каждой школе средний балл за тест был целым числом, причем в школе №1 средний балл равнялся 18. Один из учащихся, писавших тест, перешёл из школы №1 в школу №2, а средние баллы за тест были пересчитаны в обеих школах. В результате средний балл в школе №1 вырос на 10%, средний балл в школе №2 также вырос на 10%.","parts":[{"l":"б","q":"В школе №1 все писавшие тест набрали разное количество баллов. Какое наибольшее количество баллов мог набрать учащийся этой школы?","ak":"num","av":"89","steps":[{"t":"Школа №1: (18n₁ − x)/(n₁ − 1) = 19,8 ⇒ x = 19,8 − 1,8n₁ ⇒ n₁ = 6, x = 9.","f":["mean_move"]},{"t":"Сумма баллов 108, все разные, один ученик 9. Остальные четыре ≥ 1, 2, 3, 4 ⇒ наибольший ≤ 108 − 9 − 10 = 89.","f":["est_ex"]},{"t":"Пример: 1, 2, 3, 4, 9, 89. Ответ: 89.","f":[]}]},{"l":"в","q":"Известно, что изначально в школе №2 писали тест более 10 учащихся. Какое наименьшее количество учащихся могло писать тест в школе №2 изначально?","ak":"num","av":"19","steps":[{"t":"Школа №2: (n₂m₂ + 9)/(n₂ + 1) = 1,1m₂ ⇒ m₂(n₂ + 11) = 90.","f":["mean_move"]},{"t":"n₂ > 10 ⇒ n₂ + 11 ∈ {30, 45, 90} ⇒ n₂ ∈ {19, 34, 79}.","f":["est_ex"]},{"t":"n₂ = 19, m₂ = 3: (57 + 9)/20 = 3,3 ✓. Ответ: 19.","f":[]}]}],"tags":["avg"],"facts":["mean_move","percent","est_ex"],"note":"","n":123},{"id":"185932","d":3,"from":"Школково","stem":"На столе лежит стопка из красных и синих карт, на каждой из которых написано целое число, большее −32. При этом числа на картах одного цвета различны. Числа на всех синих картах делятся на 5, а на всех красных – на 8. Известно, что самое большое число на красной карте равно утроенному количеству синих карт, а самое большое число на синей карте равно количеству красных карт.","parts":[{"l":"а","q":"Может ли количество синих карт быть равным 1?","ak":"yn","av":"НЕТ","steps":[{"t":"Наибольшее красное число равно 3·(число синих) и делится на 8 ⇒ 3B кратно 8 ⇒ B кратно 8.","f":["div_def"]},{"t":"При B = 1 наибольшее красное было бы 3 — на 8 не делится. Ответ: нет.","f":[]}]},{"l":"б","q":"Может ли количество синих карт быть равным 40?","ak":"yn","av":"НЕТ","steps":[{"t":"B = 40 ⇒ наибольшее красное 120. Красные — различные кратные 8 из (−32; 120]: −24, −16, …, 120 — всего 19 чисел ⇒ красных R ≤ 19.","f":["div_count"]},{"t":"Наибольшее синее = R ≤ 19, а 40 различных кратных 5 больше −32 — это −30, −25, …, минимум до 165. Противоречие. Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наибольшее количество синих карт может быть на столе?","ak":"num","av":"8","steps":[{"t":"B = 8t. Красных не больше, чем кратных 8 в (−32; 24t]: R ≤ 3t + 4.","f":["div_count"]},{"t":"Синих B ≤ числа кратных 5 в (−32; R]: B ≤ (R + 30)/5 + 1 ⇒ R ≥ 5B − 35 = 40t − 35.","f":[]},{"t":"40t − 35 ≤ 3t + 4 ⇒ t = 1 ⇒ B ≤ 8.","f":["est_ex"]},{"t":"Пример B = 8, R = 5: синие −30, −25, …, 5; красные −8, 0, 8, 16, 24. Ответ: 8.","f":[]}]}],"tags":["div","est"],"facts":["div_def","div_count","est_ex"],"note":"","n":124},{"id":"185987","d":3,"from":"Школково","stem":"На столе лежит некоторое количество карточек, часть из которых синего цвета, а остальные красного (есть хотя бы по одной карточке каждого цвета). На каждой карточке написано целое число. На синих карточках написаны различные числа, делящиеся на 3, а на красных — различные чётные числа (некоторые числа могут быть написаны дважды: на синей и на красной карточке). Все числа больше −60. Наибольшее число на красной карточке равно удвоенному количеству синих карточек, а наибольшее число на синей карточке равно количеству красных карточек.","parts":[{"l":"а","q":". На каждой карточке написано целое число. На карточках синего цвета написаны различные числа, делящиеся на 3, а на карточках красного цвета написаны различные чётные числа (при этом некоторые числа могут быть написаны дважды: один раз на синей карточке и один раз на красной карточке). Все числа на карточках больше -60. Оказалось, что наибольшее число, написанное на красной карточке, равно удвоенному количеству синих карточек, а наибольшее число, написанное на синей карточке, равно количеству красных карточек.","ak":"yn","av":"ДА","steps":[{"t":"R = 3 ⇒ наибольшее синее 3. Возьмём B = 1: синяя {3}; наибольшее красное 2: красные {−2, 0, 2}. Все условия выполнены. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли на столе лежать ровно 150 красных карточек?","ak":"yn","av":"НЕТ","steps":[{"t":"Синие — различные кратные 3 из (−60; 150]: их не больше (150 + 57)/3 + 1 = 70 ⇒ B ≤ 70.","f":["div_count"]},{"t":"Красных чётных в (−60; 2B] ровно B + 30 ⇒ R ≤ B + 30 ≤ 100 \u003c 150. Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наибольшее количество красных карточек может лежать на столе?","ak":"num","av":"75","steps":[{"t":"R ≤ B + 30 (чётные в (−60; 2B]) и B ≤ R/3 + 20 (кратные 3 в (−60; R]).","f":["div_count"]},{"t":"R ≤ R/3 + 50 ⇒ R ≤ 75.","f":["est_ex"]},{"t":"Пример: B = 45 (все кратные 3 от −57 до 75), R = 75 (все чётные от −58 до 90). Ответ: 75.","f":[]}]}],"tags":["div","est"],"facts":["div_count","est_ex"],"note":"","n":125},{"id":"190335","d":3,"from":"Школково","stem":"На доске записано некоторое натуральное число N. Учитель по очереди вызывает учеников, которые выполняют с любым из уже записанных на доске чисел одно из следующих действий: – умножить число на 4; – прибавить к числу 12; – если число не равно 9, то вычеркнуть из числа цифру 9. Затем каждый из учеников записывает новое число на доску.","parts":[{"l":"а","q":"Можно ли за несколько действий получить из числа 47 число 2?","ak":"yn","av":"ДА","steps":[{"t":"Прибавим 12 двадцать один раз: 47 + 252 = 299.","f":[]},{"t":"Вычеркнем 9: 29, ещё раз: 2. Ответ: да.","f":[]}]},{"l":"б","q":"Можно ли за несколько действий получить из числа 7 число 77?","ak":"yn","av":"НЕТ","steps":[{"t":"Инвариант — остаток по mod 3: умножение на 4 ≡ 1, прибавление 12 ≡ 0, вычёркивание девятки не меняет сумму цифр по mod 3.","f":["invariant"]},{"t":"7 ≡ 1, а 77 ≡ 2 (mod 3). Ответ: нет.","f":["ds_mod9"]}]},{"l":"в","q":"Какое наибольшее количество чисел, меньших 2015, может быть записано на доске, если N = 1.","ak":"num","av":"672","steps":[{"t":"Все числа на доске ≡ 1 (mod 3). Таких чисел меньше 2015: 1, 4, …, 2014 — 672.","f":["invariant"]},{"t":"Все они получаются: прибавляя 12, из 1 получаем всё ≡ 1 (mod 12), из 4 = 1·4 — всё ≡ 4, из 97 → 7 — всё ≡ 7, из 109 → 10 — всё ≡ 10 (mod 12).","f":["est_ex"]},{"t":"Ответ: 672.","f":[]}]}],"tags":["ops","div"],"facts":["invariant","mod_def","ds_mod9","est_ex"],"note":"","n":126},{"id":"190337","d":3,"from":"Школково","stem":"Дана конечная последовательность натуральных чисел, каждое из которых не меньше 80 и не больше 170. Каждое следующее число либо делится на предыдущее, либо меньше предыдущего на 2. Числа в последовательности могут повторяться.","parts":[{"l":"а","q":"Может ли быть 40 различных чисел в последовательности?","ak":"yn","av":"ДА","steps":[{"t":"Пример: 170, 168, 166, …, 92 — 40 различных чисел, каждое на 2 меньше предыдущего. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли быть 80 различных чисел в последовательности?","ak":"yn","av":"ДА","steps":[{"t":"169, 167, …, 81 (45 нечётных), затем 81 → 162 (делится на 81), потом 160, 158, …, 80 (42 чётных).","f":[]},{"t":"Итого 87 ≥ 80 различных чисел. Ответ: да.","f":[]}]},{"l":"в","q":"Найдите наибольшее количество различных чисел последовательности.","ak":"num","av":"90","steps":[{"t":"Следующее число: то же (×1), удвоенное (только если предыдущее ≤ 85) или на 2 меньше. Удвоение даёт чётное, «−2» сохраняет чётность ⇒ нечётные числа идут одним убывающим отрезком в начале.","f":["parity"]},{"t":"Всего чисел 91. Число 170 = 2·85 получается только из 85 (нечётного) или стоит первым. Если все 45 нечётных пройдены (до 81), то удвоение было из 81, и 85 уже позади ⇒ 170 недоступно. Если 170 есть, не все нечётные пройдены.","f":["extreme"]},{"t":"Значит, все 91 нельзя ⇒ не больше 90.","f":["est_ex"]},{"t":"Пример: 169 → … → 81 → 162 → 160 → … → 84 → 168 → 166 → 164 → 162 → … → 80: все нечётные и все чётные 80…168 — 90 чисел. Ответ: 90.","f":[]}]}],"tags":["seq","est"],"facts":["parity","extreme","est_ex"],"note":"","n":127},{"id":"190339","d":3,"from":"Школково","stem":"На доске написано не менее двух трёхзначных чисел (не обязательно различных), в записи которых нет нулей. У каждого из этих чисел стёрли вторую цифру (так, например, число 827 стало числом 87).","parts":[{"l":"а","q":"Приведите пример такого набора чисел, что сумма полученных чисел в 16 раз меньше суммы исходных.","ak":"self","av":"Например, 192 и 192: сумма 384, после стирания 12 + 12 = 24, 384 = 16·24.","steps":[{"t":"abc → ac: из 100a + 10b + c получаем 10a + c. Нужно Σ(100a+10b+c) = 16Σ(10a+c) ⇒ Σ2b = Σ(12a + 3c).","f":["dec_repr"]},{"t":"Для одного числа 2b = 12a + 3c: a = 1, c = 2, b = 9 — число 192 (192 = 16·12). Возьмём два числа 192.","f":[]}]},{"l":"б","q":"Может ли сумма полученных чисел быть в 5,5 раз меньше суммы исходных?","ak":"yn","av":"НЕТ","steps":[{"t":"Σ(100a+10b+c) = 5,5Σ(10a+c) ⇒ Σ(90a + 20b) = Σ9c.","f":["lin_dioph"]},{"t":"Для каждого числа 90a + 20b ≥ 110 > 81 ≥ 9c ⇒ левая часть больше. Ответ: нет.","f":[]}]},{"l":"в","q":"Найдите наименьшее количество чисел на доске, если сумма полученных чисел в 17 раз меньше суммы исходных.","ak":"num","av":"4","steps":[{"t":"Условие «в 17 раз»: Σ(10b − 70a − 16c) = 0. Слагаемое положительно только для 191 (+4); остальные отрицательны и чётны.","f":["lin_dioph"]},{"t":"Значений −2, −4, −8 у слагаемых не бывает (перебор a, c). Поэтому сумма 0 из двух или трёх чисел невозможна.","f":[]},{"t":"Пример из четырёх: 191, 191, 191, 192: 4 + 4 + 4 − 12 = 0. Ответ: 4.","f":["est_ex"]}]}],"tags":["digits","eq"],"facts":["dec_repr","lin_dioph","est_ex"],"note":"","n":128},{"id":"190342","d":3,"from":"Школково","stem":"Дано трёхзначное натуральное число, не кратное 100.","parts":[{"l":"в","q":"Какое наибольшее натуральное значение может иметь частное данного числа и суммы его цифр?","ak":"num","av":"91","steps":[{"t":"Пусть S — сумма цифр. Если S ≥ 11, частное \u003c 1000/11 \u003c 91.","f":[]},{"t":"S = 10: наибольшее число с суммой цифр 10 — 910, частное 91.","f":[]},{"t":"S ≤ 9 (и число не кратно 100): N ≤ 100(S − 1) + 10 ⇒ N/S ≤ 100 − 90/S ≤ 90.","f":["est_ex"]},{"t":"Ответ: 91 (число 910).","f":[]}]}],"tags":["digits"],"facts":["dec_repr","est_ex"],"note":"","n":129},{"id":"190455","d":3,"from":"Школково","stem":"Есть четыре коробки: в первой коробке 101 камень, во второй — 102, в третьей — 103, а в четвёртой коробке камней нет. За один ход берут по одному камню из любых трёх коробок и кладут в оставшуюся. Сделали некоторое количество таких ходов.","parts":[{"l":"в","q":"Какое наибольшее число камней могло оказаться в первой коробке?","ak":"num","av":"303","steps":[{"t":"Разности по mod 4 сохраняются ⇒ остатки коробок 2, 3, 4 различны и отличны от остатка первой ⇒ их сумма ≥ 0 + 1 + 2 = 3 ⇒ в первой ≤ 303.","f":["invariant"]},{"t":"Пример: 26 ходов в четвёртую — (75, 76, 77, 78), затем 76 ходов в первую — (303, 0, 1, 2). Ответ: 303.","f":["est_ex"]}]}],"tags":["ops"],"facts":["invariant","mod_def","est_ex"],"note":"","n":130},{"id":"15856","d":4,"from":"PDF №028","stem":"В течение n дней каждый день на доску записывают натуральные числа, каждое из которых меньше 6. При этом каждый день (кроме первого) сумма чисел, записанных на доску в этот день, больше, а количество меньше, чем в предыдущий день.","parts":[{"l":"а","q":"Может ли n быть больше 5?","ak":"yn","av":"ДА","steps":[{"t":"Пример на 6 дней (в k-й день: k − 1 троек и 12 − 2k единиц).","f":[]},{"t":"1-й: 10 единиц (10); 2-й: 3 и 8 единиц (11, 9 чисел); 3-й: 3,3 и 6 единиц (12, 8 чисел); 4-й: три 3 и 4 единицы (13, 7); 5-й: четыре 3 и 2 единицы (14, 6); 6-й: пять 3 (15, 5). Ответ: да.","f":[]}]},{"l":"б","q":"Может ли среднее арифметическое чисел, записанных в первый день, быть меньше 3, а среднее арифметическое всех чисел, записанных за все дни, быть больше 4?","ak":"yn","av":"ДА","steps":[{"t":"День 1: 11 чисел (десять 3 и одна 2), сумма 32, среднее ≈ 2,91 \u003c 3.","f":["mean"]},{"t":"День 2: 10 чисел (четыре 5 и шесть 4), сумма 44. День 3: девять 5, сумма 45.","f":[]},{"t":"Всего 121/30 ≈ 4,03 > 4. Количество убывает (11, 10, 9), сумма растёт (32, 44, 45). Ответ: да.","f":[]}]},{"l":"в","q":"Известно, что сумма чисел, записанных в первый день, равна 6. Какое наибольшее значение может принимать сумма всех чисел, записанных за все дни?","ak":"num","av":"48","steps":[{"t":"Сумма 6 в первый день ⇒ чисел c₁ ≤ 6. Количества убывают ⇒ дней ≤ 6. В последний день c чисел, сумма ≤ 5c, а все суммы растут ⇒ каждая сумма ≤ 5·c_последний.","f":[]},{"t":"Если дней n, то c_последний ≤ 7 − n. Сумма ≤ 6 + 5(7−n) + (5(7−n) − 1) + … (n − 1 слагаемых).","f":["est_ex"]},{"t":"n = 2: 31; n = 3: 6 + 20 + 19 = 45; n = 4: 6 + 15 + 14 + 13 = 48; n = 5: 6 + 10 + 9 + 8 + 7 = 40; n = 6 невозможно (одно число ≤ 5 \u003c 6).","f":[]},{"t":"Пример: 1,1,1,1,1,1 (6); 3,3,3,2,2 (13); 5,3,3,3 (14); 5,5,5 (15) — всего 48. Ответ: 48.","f":[]}]}],"tags":["est","avg"],"facts":["mean","est_ex"],"note":"","n":131},{"id":"18140","d":4,"from":"PDF №031","stem":"Последовательность натуральных чисел (aₙ) состоит из 400 членов. Каждый член последовательности, начиная со второго, либо вдвое больше предыдущего, либо на 98 меньше предыдущего.","parts":[{"l":"а","q":"Может ли последовательность (aₙ) содержать ровно 5 различных чисел?","ak":"yn","av":"ДА","steps":[{"t":"Цикл: 14 → 28 → 56 → 112 → 14 (112 − 98 = 14).","f":[]},{"t":"Последовательность 7, 14, 28, 56, 112, 14, 28, … (400 членов) содержит ровно 5 различных чисел. Ответ: да.","f":[]}]},{"l":"б","q":"Чему может равняться a₁, если a₁₀₀ = 75?","ak":"num","av":"9777","steps":[{"t":"Предыдущий член для x: x/2 или x + 98. Если x нечётно, x/2 не целое ⇒ предыдущий x + 98 — тоже нечётный.","f":["reverse"]},{"t":"75 нечётно ⇒ все члены до a₁₀₀ нечётны и каждый на 98 больше следующего.","f":["parity"]},{"t":"a₁ = 75 + 99·98 = 9777. Ответ: 9777.","f":[]}]},{"l":"в","q":"Какое наименьшее значение может принимать наибольший член последовательности (aₙ)?","ak":"num","av":"112","steps":[{"t":"400 членов из конечного набора ⇒ есть повтор ⇒ есть цикл. Пусть M — наибольший член цикла, и все члены ≤ 111.","f":["dirichlet"]},{"t":"После M идёт M − 98 (2M > M) ⇒ M ≥ 99. Перед M может стоять только M/2 (M + 98 > M) ⇒ M чётно, M ∈ {100, …, 110}.","f":["extreme"]},{"t":"Перед M/2 — M/4 (M/2 + 98 > M) ⇒ M ∈ {100, 104, 108}; перед M/4 — M/8 (M/4 + 98 > M) ⇒ M = 104, M/8 = 13. Перед 13: 6,5 или 111 > 104 — противоречие.","f":[]},{"t":"Значит, наибольший член ≥ 112. Пример: 14, 28, 56, 112, 14, … Ответ: 112.","f":["est_ex"]}]}],"tags":["seq","ops"],"facts":["reverse","parity","extreme","dirichlet","est_ex"],"note":"","n":132},{"id":"15852","d":4,"from":"PDF №033","stem":"Вася и Петя решали задачи из сборника, и они оба решили все задачи этого сборника. Каждый день Вася решал на одну задачу больше, чем в предыдущий день, а Петя решал на две задачи больше, чем в предыдущий день. Они начали решать задачи в один день, при этом в первый день каждый из них решил хотя бы одну задачу.","parts":[{"l":"а","q":"Могло ли получиться так, что Вася в первый день решил на одну задачу меньше, чем Петя, а Петя решил все задачи из сборника ровно за 5 дней?","ak":"yn","av":"ДА","steps":[{"t":"Петя: b, b+2, …, за 5 дней 5b + 20. Вася: b − 1, b, …, за p дней.","f":["ap"]},{"t":"b = 3: Петя 3+5+7+9+11 = 35. Вася с 2: 2+3+4+5+6+7+8 = 35 за 7 дней. Ответ: да.","f":[]}]},{"l":"б","q":"Могло ли получиться так, что Вася в первый день решил на одну задачу больше, чем Петя, а Петя решил все задачи из сборника ровно за 4 дня?","ak":"yn","av":"НЕТ","steps":[{"t":"Вася начинает с a, Петя с a − 1. Петя за 4 дня: 4(a−1) + 12 = 4a + 8.","f":["ap"]},{"t":"Вася за p дней: p ≤ 3 — не больше 3a + 3 \u003c 4a + 8; p = 4 — 4a + 6 ≠ 4a + 8; p ≥ 5 — ≥ 5a + 10 > 4a + 8. Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наименьшее количество задач могло быть в сборнике, если каждый из ребят решал задачи более 6 дней, причем в первый день один из мальчиков решил на одну задачу больше чем другой?","ak":"num","av":"84","steps":[{"t":"Петя q ≥ 7 дней: T = qb + q(q−1); Вася p ≥ 7: T = pa + p(p−1)/2, |a − b| = 1.","f":["ap"]},{"t":"Если T \u003c 84: q = 7 ⇒ T = 7(b + 6) ∈ {49, 56, 63, 70, 77}; q = 8 ⇒ T ∈ {64, 72, 80}; q = 9 ⇒ T = 81 (b = 1); q ≥ 10 ⇒ T ≥ 100.","f":[]},{"t":"Суммы Васи (p ≥ 7 дней) меньше 84: a=1: 28, 36, 45, 55, 66, 78; a=2: 35, 44, 54, 65, 77; a=3: 42, 52, 63, 75; a=4: 49, 60, 72; a=5: 56, 68, 81; a=6: 63, 76.","f":["lin_dioph"]},{"t":"Сверяем с Петей при a = b ± 1: b=1 (49, 64, 81) — у a=2 таких нет; b=2 (56, 72) — нет у a=1 и a=3; b=3 (63, 80) — нет у a=2 и a=4; b=4 (70) — нет у a=3, a=5; b=5 (77) — нет у a=4, a=6. Значит, T ≥ 84.","f":[]},{"t":"Пример T = 84: Вася 7, 8, …, 14 (8 дней), Петя 6, 8, …, 18 (7 дней). Ответ: 84.","f":["est_ex"]}]}],"tags":["seq","eq"],"facts":["ap","lin_dioph","est_ex"],"note":"","n":133},{"id":"46760","d":4,"from":"PDF №036","stem":"На доске было написано несколько различных натуральных чисел. Эти числа разбили на три группы, в каждой из которых оказалось хотя бы одно число. К каждому числу из первой группы приписали справа цифру 1, к каждому числу из второй группы – цифру 8, а числа третьей группы оставили без изменений.","parts":[{"l":"а","q":"Могла ли сумма всех этих чисел увеличиться в 4 раза?","ak":"yn","av":"ДА","steps":[{"t":"Число x из 1-й группы → 10x + 1, из 2-й → 10x + 8.","f":["append"]},{"t":"Пример: 1 (→11), 2 (→28), 9 (без изменений). Было 12, стало 11 + 28 + 9 = 48 = 4·12. Ответ: да.","f":[]}]},{"l":"б","q":"Могла ли сумма всех этих чисел увеличиться в 18 раз?","ak":"yn","av":"НЕТ","steps":[{"t":"A, B, C — суммы групп, a, b — количества. 10A + a + 10B + 8b + C = 18(A + B + C) ⇒ a + 8b = 8A + 8B + 17C.","f":["append"]},{"t":"Но A ≥ a, B ≥ b, C ≥ 1 ⇒ правая часть ≥ 8a + 8b + 17 > a + 8b. Ответ: нет.","f":[]}]},{"l":"в","q":"Сумма всех этих чисел увеличилась в 11 раз. Какое наибольшее количество чисел могло быть написано на доске?","ak":"num","av":"10","steps":[{"t":"Условие «в 11 раз»: a + 8b = A + B + 10C. Всего чисел n, сумма всех T = A + B + C ≥ n(n+1)/2.","f":["sum_1n"]},{"t":"T = a + 8b − 9C ≤ 8(a + b) − 7a − 9 ≤ 8(n − 1) − 7 − 9 = 8n − 24.","f":[]},{"t":"n(n+1)/2 ≤ 8n − 24 ⇒ n² − 15n + 48 ≤ 0 ⇒ n ≤ 10,37 ⇒ n ≤ 10.","f":["est_ex"]},{"t":"Пример: 1-я группа {2}, 2-я {3, 4, 5, 6, 7, 8, 9, 11}, 3-я {1}. Было 56, стало 21 + 594 + 1 = 616 = 11·56. Ответ: 10.","f":[]}]}],"tags":["digits","est"],"facts":["append","sum_1n","est_ex"],"note":"","n":134},{"id":"159703","d":4,"from":"PDF №049","stem":"На доске было написано несколько различных натуральных чисел. Эти числа разбили на три группы, в каждой из которых оказалось хотя бы одно число. К каждому числу из первой группы приписали справа цифру 3, к каждому числу из второй группы — цифру 7, а числа из третьей группы оставили без изменений.","parts":[{"l":"а","q":"Могла ли сумма всех этих чисел увеличиться в 8 раз?","ak":"yn","av":"ДА","steps":[{"t":"x → 10x + 3 (1-я группа), 10x + 7 (2-я).","f":["append"]},{"t":"Пример: {1}, {8}, {4}: было 13, стало 13 + 87 + 4 = 104 = 8·13. Ответ: да.","f":[]}]},{"l":"б","q":"Могла ли сумма всех этих чисел увеличиться в 17 раз?","ak":"yn","av":"НЕТ","steps":[{"t":"10A + 3a + 10B + 7b + C = 17(A+B+C) ⇒ 3a + 7b = 7A + 7B + 16C ≥ 7a + 7b + 16. Противоречие. Ответ: нет.","f":[]}]},{"l":"в","q":"В какое наибольшее число раз могла увеличиться сумма всех этих чисел?","ak":"num","av":"232/21","steps":[{"t":"Отношение t = 10 + (3a + 7b − 9C)/T, где T = A + B + C — сумма всех n чисел.","f":[]},{"t":"3a + 7b = 7(a + b) − 4a ≤ 7(n − 1) − 4, C ≥ 1, T ≥ n(n+1)/2 ⇒ t − 10 ≤ 2(7n − 20)/(n(n+1)).","f":["sum_1n"]},{"t":"n = 4: 0,8; n = 5: 1; n = 6: 22/21; n = 7: 58/56; n = 8: 1 — максимум при n = 6: t ≤ 232/21.","f":["est_ex"]},{"t":"Пример: {2}, {3, 4, 5, 6}, {1}: было 21, стало 23 + 37 + 47 + 57 + 67 + 1 = 232. Ответ: 232/21.","f":[]}]}],"tags":["digits","est"],"facts":["append","sum_1n","est_ex"],"note":"","n":135},{"id":"127722","d":4,"from":"PDF №055","stem":"На доске написано 30 чисел: десять «5», десять «4» и десять «3». Эти числа разбивают на две группы, в каждой из которых есть хотя бы одно число. Среднее арифметическое чисел в первой группе равно A, среднее арифметическое чисел во второй группе равно B. При этом для группы из единственного числа среднее арифметическое равно этому числу.","parts":[{"l":"а","q":"Приведите пример разбиения исходных чисел на две группы, при котором среднее арифметическое всех чисел меньше (A+ B)/2.","ak":"self","av":"Например, первая группа — одно число 5, вторая — остальные 29 чисел: A = 5, B = 115/29, (A+B)/2 ≈ 4,48 > 4.","steps":[{"t":"Среднее всех чисел (50+40+30)/30 = 4. Нужно A + B > 8.","f":["mean"]},{"t":"Группа {5}: A = 5; остальные 29 чисел: B = 115/29 ≈ 3,97. A + B ≈ 8,97 > 8.","f":[]}]},{"l":"б","q":"Докажите, что если разбить исходные числа на две группы по 15 чисел, то среднее арифметическое всех чисел будет равно (A+ B)/2","ak":"self","av":"Если группы по 15 чисел с суммами S₁ и S₂, то (A+B)/2 = (S₁/15 + S₂/15)/2 = (S₁+S₂)/30 — среднее всех.","steps":[{"t":"A = S₁/15, B = S₂/15.","f":["mean"]},{"t":"(A + B)/2 = (S₁ + S₂)/30 = 120/30 = 4 — среднее всех чисел.","f":[]}]},{"l":"в","q":"Найдите наибольшее возможное значение выражения (A+ B)/2","ak":"num","av":"130/29","steps":[{"t":"Пусть в первой группе k ≤ 15 чисел с суммой S₁: A + B = S₁(1/k − 1/(30−k)) + 120/(30 − k) — при k \u003c 15 растёт с S₁.","f":["frac_monot"]},{"t":"k ≤ 10: S₁ ≤ 5k ⇒ A + B ≤ 5 + (120 − 5k)/(30 − k) = 10 − 30/(30 − k) — максимум при k = 1: 5 + 115/29.","f":["est_ex"]},{"t":"При 10 \u003c k \u003c 15 оценка A + B ≤ 8 + 10/k − 10/(30−k) \u003c 8,4 — меньше. Значит, max (A+B)/2 = (5 + 115/29)/2 = 130/29 = 4 14/29.","f":[]}]}],"tags":["avg"],"facts":["mean","frac_monot","est_ex"],"note":"В ключе файла ответ к в) записан как «4 14 29» — это смешанное число 4 14/29 = 130/29.","n":136},{"id":"46762","d":4,"from":"PDF №060","stem":"В школах №1 и №2 учащиеся писали тест. Из каждой школы тест писали по крайней мере 2 учащихся, а суммарно тест писал 51 учащийся. Каждый учащийся, писавший тест, набрал натуральное количество баллов. Оказалось, что в каждой школе средний балл за тест был целым числом. После этого один из учащихся, писавших тест, перешёл из школы №1 в школу №2, а средние баллы за тест были пересчитаны в обеих школах.","parts":[{"l":"а","q":"Мог ли средний балл в школе №1 вырасти в 2 раза?","ak":"yn","av":"НЕТ","steps":[{"t":"(n₁m₁ − x)/(n₁ − 1) = 2m₁ ⇒ x = m₁(2 − n₁) ≤ 0 при n₁ ≥ 2. Ответ: нет.","f":["mean_move"]}]},{"l":"б","q":"Средний балл в школе №1 вырос на 10%, средний балл в школе №2 также вырос на 10%. Мог ли первоначальный средний балл в школе №2 равняться 1?","ak":"yn","av":"НЕТ","steps":[{"t":"Для школы №2: x = m₂(n₂ + 11)/10; для школы №1: x = m₁(11 − n₁)/10 ⇒ m₁(11 − n₁) = m₂(62 − n₁) (n₂ = 51 − n₁, 2 ≤ n₁ ≤ 10).","f":["mean_move"]},{"t":"m₂ = 1: x = (62 − n₁)/10 целое ⇒ n₁ = 2, x = 6 ⇒ 9m₁ = 60 — m₁ не целое. Ответ: нет.","f":[]}]},{"l":"в","q":"Средний балл в школе №1 вырос на 10%, средний балл в школе №2 также вырос на 10%. Найдите наименьшее значение первоначального среднего балла в школе №2.","ak":"num","av":"3","steps":[{"t":"m₂ = 2: x = (62 − n₁)/5 ⇒ n₁ ∈ {2, 7}: 9m₁ = 120 или 4m₁ = 110 — не целые.","f":["lin_dioph"]},{"t":"m₂ = 3: n₁ = 2, x = 18, m₁ = 20 ✓.","f":["est_ex"]},{"t":"Пример: школа №1 — 18 и 22 (среднее 20 → 22); школа №2 — 49 учеников со средним 3 (147), после (147 + 18)/50 = 3,3. Ответ: 3.","f":[]}]}],"tags":["avg"],"facts":["mean_move","percent","lin_dioph","est_ex"],"note":"","n":137},{"id":"159623","d":4,"from":"PDF №062","stem":"Из правильной несократимой дроби a/b где a и b – натуральные числа, за один ход получают дробь (a+b)/(2a+b).","parts":[{"l":"а","q":"Можно ли за несколько таких ходов из дроби 1/3 получить дробь 23/21?","ak":"yn","av":"НЕТ","steps":[{"t":"(a + b)/(2a + b) \u003c 1 всегда ⇒ после хода дробь правильная.","f":["frac_monot"]},{"t":"23/21 > 1 — получить нельзя. (Цепочка из 1/3: 4/5, 9/13, 22/31, … — все меньше 1.)","f":[]}]},{"l":"б","q":"Можно ли за два таких хода из некоторой дроби получить дробь, равную 7/12?","ak":"yn","av":"НЕТ","steps":[{"t":"f(x) = (x + 1)/(2x + 1) убывает; при 0 \u003c x \u003c 1: f(x) ∈ (2/3; 1).","f":["frac_monot"]},{"t":"7/12 \u003c 2/3 ⇒ нельзя получить даже за один ход. Ответ: нет.","f":[]}]},{"l":"в","q":"Несократимая дробь c/d больше 0,7. Найдите наименьшую дробь c/d которую нельзя получить ни из какой правильной несократимой дроби за два таких хода.","ak":"num","av":"5/7","steps":[{"t":"Два хода: f(f(x)) ∈ (f(1); f(2/3)) = (2/3; 5/7) ⇒ 5/7 и больше получить нельзя.","f":["frac_monot"]},{"t":"Обратно: c/d ∈ (2/3; 1) получается из (d − c)/(2c − d) — правильной и несократимой (НОД = НОД(c, d) = 1).","f":["gcd"]},{"t":"Для c/d ∈ (0,7; 5/7) первый прообраз в (2/3; 0,75) ⊂ (2/3; 1) ⇒ есть и второй ⇒ все такие дроби получаются. Наименьшая неполучаемая > 0,7 — это 5/7.","f":["est_ex"]}]}],"tags":["ops"],"facts":["gcd","frac_monot","reverse","est_ex"],"note":"В ключе файла к а) — «ДА», но при записанном условии (дробь 23/21 > 1) получить её нельзя. Вероятно, опечатка в дроби: например, 22/31 получается за три хода: 1/3 → 4/5 → 9/13 → 22/31.","n":138},{"id":"17434","d":4,"from":"Школково","stem":"Склад представляет собой прямоугольный параллелепипед с целыми сторонами, контейнеры — прямоугольные параллелепипеды с размерами 1× 1× 3 м. Контейнеры на складе можно класть как угодно, но параллельно границам склада.","parts":[{"l":"а","q":"Может ли оказаться, что полностью заполнить склад размером 120 кубометров нельзя?","ak":"yn","av":"НЕТ","steps":[{"t":"120 = 3·40 ⇒ одна из сторон склада делится на 3 (3 — простое).","f":["fta"]},{"t":"Кладём контейнеры вдоль этой стороны — склад заполняется полностью. Ответ: нет.","f":[]}]},{"l":"б","q":"Может ли оказаться, что на склад объемом 100 кубометров не удастся поместить 33 контейнера?","ak":"yn","av":"ДА","steps":[{"t":"Склад 2 × 2 × 25: контейнер можно положить только вдоль длинной стороны.","f":[]},{"t":"В каждый из 4 рядов помещается 8 контейнеров (24 м из 25) ⇒ всего 32 \u003c 33. Ответ: да.","f":[]}]},{"l":"в","q":"Пусть объем склада равен 800 кубометрам. Какой процент объема такого склада удастся гарантированно заполнить контейнерами при любой конфигурации склада?","ak":"num","av":"99","steps":[{"t":"800 = 2⁵·5² ⇒ ни одна сторона не кратна 3. Заполним a × b × c′ (c′ — наибольшее кратное 3 ≤ c), остаток a × b × r (r ≤ 2) — вдоль b, затем вдоль a.","f":[]},{"t":"Пустым остаётся не больше 2·2·2 = 8 м³ ⇒ заполняется ≥ 792/800 = 99%.","f":["est_ex"]},{"t":"Склад 2 × 2 × 200: помещается только 4·66 = 264 контейнера = 792 м³ — ровно 99%. Ответ: 99%.","f":[]}]}],"tags":["est"],"facts":["div_def","est_ex"],"note":"","n":139},{"id":"19982","d":4,"from":"Школково","stem":"В шахматы можно выиграть, проиграть или сыграть вничью. Шахматист записывает результат каждой сыгранной им партии и после каждой партии подсчитывает три показателя. «Победы» — процент побед, округлённый до целого, «ничьи» — процент ничьих, округлённый до целого, и «поражения», равный разности 100 и суммы показателей «побед» и «ничьих». Например, число 13,2 округляется до 13, число 14,5 округляется до 15, число 16,8 округляется до 17.","parts":[{"l":"а","q":"Может ли в какой-то момент показатель «побед» равняться 17, если было сыграно менее 50 партий?","ak":"yn","av":"ДА","steps":[{"t":"1 победа из 6 партий: 16,67% → 17. Ответ: да.","f":["rounding"]}]},{"l":"б","q":"Может ли после выигранной партии увеличиться показатель «поражений»?","ak":"yn","av":"ДА","steps":[{"t":"17 партий: 12 побед (70,6% → 71), 4 ничьих (23,5% → 24), «поражения» 100 − 95 = 5.","f":["rounding"]},{"t":"После победы: 13/18 = 72,2% → 72, 4/18 = 22,2% → 22, «поражения» 6 — увеличились. Ответ: да.","f":[]}]},{"l":"в","q":"Одна из партий была проиграна. При каком наименьшем количестве сыгранных партий показатель «поражений» может быть равным 1?","ak":"num","av":"51","steps":[{"t":"Пусть n партий, l ≥ 1 поражений. «Победы» + «ничьи» = 99, а каждое округление добавляет не больше 0,5: 99 ≤ 100(n − l)/n + 1 ⇒ 100l/n ≤ 2 ⇒ n ≥ 50.","f":["rounding"]},{"t":"n = 50: доли 2w% и 2d% — целые, сумма 2(w + d) ≤ 98 ⇒ «поражений» ≥ 2. Значит, n ≥ 51.","f":["est_ex"]},{"t":"Пример: 51 партия: 12 побед (23,53% → 24), 38 ничьих (74,51% → 75), 1 поражение: 100 − 99 = 1. Ответ: 51.","f":[]}]}],"tags":["avg"],"facts":["rounding","percent","est_ex"],"note":"","n":140},{"id":"24436","d":4,"from":"Школково","stem":"По кругу стоят несколько детей, среди которых есть хотя бы два мальчика и хотя бы две девочки. У каждого из детей есть натуральное число конфет. У любых двух мальчиков одинаковое число конфет, а у любых двух девочек — разное. По команде каждый отдал соседу справа четверть своих конфет. После этого у любых двух девочек оказалось одинаковое число конфет, а у любых двух мальчиков — разное. Известно, что каждый из детей отдал натуральное число конфет.","parts":[{"l":"а","q":"Может ли мальчиков быть ровно столько же, сколько девочек?","ak":"yn","av":"ДА","steps":[{"t":"Если два мальчика стоят справа от мальчиков, у них станет поровну (одинаковые доли). Если две девочки стоят справа от мальчиков, у них станет разное. Отсюда: мальчики идут одной группой, и мальчиков ровно 2.","f":[]},{"t":"Пример: М, М, Д, Д по кругу с конфетами 16, 16, 4, 8: после — 14, 16, 7, 7. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли мальчиков быть больше, чем девочек?","ak":"yn","av":"НЕТ","steps":[{"t":"Из а: мальчиков ровно 2, а девочек не меньше 2. Ответ: нет.","f":[]}]},{"l":"в","q":"Пусть девочек вдвое больше, чем мальчиков. Может ли у всех детей суммарно быть 328 конфет?","ak":"yn","av":"ДА","steps":[{"t":"Мальчиков 2, девочек 4: М, М, Д₁, Д₂, Д₃, Д₄.","f":[]},{"t":"Пример: мальчики по 112, девочки 4, 40, 28, 32 (всего 328). После: мальчики 92 и 112, все девочки по 31. Ответ: да.","f":["est_ex"]}]}],"tags":["est"],"facts":["extreme","est_ex"],"note":"","n":141},{"id":"24437","d":4,"from":"Школково","stem":"Десять мальчиков и семь девочек пошли в лес за грибами. Известно, что любые две девочки набрали больше грибов, чем любые три мальчика, но любые пять мальчиков набрали больше грибов, чем любые три девочки.","parts":[{"l":"а","q":"Может ли так случиться, что какая-то девочка набрала меньше грибов, чем какой-нибудь мальчик?","ak":"yn","av":"НЕТ","steps":[{"t":"Пусть g₁ \u003c b₁₀. Из g₁ + g₂ > b₈ + b₉ + b₁₀ ⇒ g₂ > b₈ + b₉ ⇒ g₅, g₆, g₇ > b₈ + b₉ ≥ 2b₅.","f":["extreme"]},{"t":"Тогда g₅ + g₆ + g₇ > 6b₅ ≥ b₁ + … + b₅ — противоречие. Ответ: нет.","f":[]}]},{"l":"б","q":"Может ли так случиться, что количество найденных грибов у всех детей будет различным?","ak":"yn","av":"ДА","steps":[{"t":"Мальчики 100, 101, …, 109; девочки 162, …, 168.","f":[]},{"t":"162 + 163 = 325 > 107 + 108 + 109 = 324; 100 + … + 104 = 510 > 166 + 167 + 168 = 501. Ответ: да.","f":[]}]},{"l":"в","q":"Найдите минимальное возможное количество грибов, собранное всеми детьми суммарно.","ak":"num","av":"106","steps":[{"t":"g₅, g₆, g₇ ≥ g₂ ≥ (b₈+b₉+b₁₀ + 1)/2, а b₁ + … + b₅ ≤ 5b₈ ≤ 5(b₈+b₉+b₁₀)/3. Отсюда сумма трёх старших мальчиков ≥ 15.","f":["extreme"]},{"t":"Девочки: g₁ + g₂ ≥ 16, g₂ ≥ 8, g₃…g₇ ≥ 8 ⇒ ≥ 56. Мальчики: b₁…b₅ ≥ g₅+g₆+g₇+1 ≥ 25, b₆, b₇ ≥ 5, b₈+b₉+b₁₀ ≥ 15 ⇒ ≥ 50. Всего ≥ 106.","f":["est_ex"]},{"t":"Пример: все мальчики по 5, все девочки по 8: 50 + 56 = 106. Ответ: 106.","f":[]}]}],"tags":["est"],"facts":["extreme","est_ex"],"note":"","n":142},{"id":"46753","d":4,"from":"Школково","stem":"Из k кг материала фабрика изготавливает n одинаковых деталей массой m кг каждая, причем k = nm + q, где q кг — остатки материала, и q \u003c m. После внедрения новых технологий на фабрике начали выпускать детали нового типа, каждая из которых стала на 0,2 кг легче детали старого типа, причём из 63 кг материала деталей нового типа стали делать на две больше, чем делали деталей старого типа из 64 кг материала.","parts":[{"l":"а","q":"Может ли новая деталь весить столько, что на изготовление 15 новых деталей будет достаточно 63 кг материала, а на 16 — уже нет?","ak":"yn","av":"НЕТ","steps":[{"t":"n = [k/m]. Пусть m′ = m − 0,2. Условие: [63/m′] = [64/m] + 2.","f":[]},{"t":"[63/m′] = 15 ⇒ m′ ∈ (3,94; 4,2] ⇒ m ∈ (4,14; 4,4] ⇒ [64/m] = 14 или 15, а нужно 13. Ответ: нет.","f":[]}]},{"l":"б","q":"Может ли новая деталь весить столько, что на изготовление 40 новых деталей будет достаточно 63 кг материала, а на 41 — уже нет?","ak":"yn","av":"НЕТ","steps":[{"t":"[63/m′] = 40 ⇒ m′ ∈ (1,537; 1,575] ⇒ m ∈ (1,737; 1,775] ⇒ [64/m] = 36, нужно 38. Ответ: нет.","f":[]}]},{"l":"в","q":"Найдите такое минимальное число n, что фабрика может выпускать n новых деталей из 80 кг материала, а n − 1 деталь не сможет, не нарушая условия q \u003cm.","ak":"num","av":"27","steps":[{"t":"Возможные значения [63/m′] — от 22 до 33. Наименьшие m′ дают наименьшие [80/m′]…","f":["lin_dioph"]},{"t":"При m′ ∈ (2,857; 2,8636] условие выполняется ([63/m′] = 22, [64/m] = 20) и [80/m′] = 27; меньше 27 не бывает (при m′ > 80/27 нарушается условие). Ответ: 27.","f":["est_ex"]}]}],"tags":["eq"],"facts":["lin_dioph","est_ex"],"note":"","n":143},{"id":"65025","d":4,"from":"Школково","stem":"Мужчина покупает капусту на ферме. Сосед попросил мужчину купить ему столько же капусты, сколько себе. На ферме продают кочаны капусты, которые весят 2, 4 или 6 кг. Мужчина купил N кг капусты.","parts":[{"l":"а","q":"Существует ли такой набор кочанов, в котором капусту нельзя поделить поровну, не разрезая ее, если N = 20?","ak":"yn","av":"ДА","steps":[{"t":"N = 20: кочаны 6, 6, 6, 2. Половина — 10, а суммы подмножеств 2, 6, 8, 12, 14, 18 — 10 нет. Ответ: да.","f":[]}]},{"l":"б","q":"Существует ли такой набор кочанов, в котором капусту нельзя поделить поровну, не разрезая ее, если N = 48?","ak":"yn","av":"НЕТ","steps":[{"t":"Считаем в «единицах» по 2 кг: кочаны 1, 2, 3, всего 24, нужно 12.","f":[]},{"t":"Берём тройки, пока сумма ≤ 12; если не хватило, остаток добираем двойками и единицами (число единиц той же чётности, что и число троек, поэтому нечётный остаток всегда закрывается единицей). Поделить можно всегда. Ответ: нет.","f":["parity"]}]},{"l":"в","q":"Найдите все четные значения N, при которых всегда можно разделить капусту поровну, не разрезая ее.","ak":"self","av":"N кратно 24.","steps":[{"t":"В единицах по 2 кг: всего T = N/2, кочаны 1, 2, 3. Если T/2 нечётно — все кочаны по 4 кг (двойки), поделить нельзя.","f":["parity"]},{"t":"T = 12j + 4: (4j + 1) троек и одна единица — половина 6j + 2 ≡ 2 (mod 3) не набирается. T = 12j + 8: (4j + 2) троек и одна двойка — половина ≡ 1 (mod 3) не набирается.","f":["mod_def"]},{"t":"T = 12j (N = 24j): алгоритм из пункта б работает всегда. Ответ: N кратно 24.","f":["est_ex"]}]}],"tags":["est","div"],"facts":["mod_def","parity","est_ex"],"note":"","n":144},{"id":"114803","d":4,"from":"Школково","stem":"Есть 60 карточек, на каждой из которых написано натуральное число больше 1. Все числа различные. На обратной стороне каждой карточки ставят цветовую отметку: если число делится на 3 — красную, если на 4 — синюю, если на 5 — зелёную. Получилось так, что на каждой карточке ровно две цветовые отметки.","parts":[{"l":"а","q":"Какое наибольшее количество карточек может быть с числами меньше 200?","ak":"num","av":"29","steps":[{"t":"Ровно две отметки: кратно 12, но не 5; кратно 20, но не 3; кратно 15, но не 4.","f":["div_comp"]},{"t":"Меньше 200: таких 13, 6 и 10 соответственно — всего 29. Ответ: 29.","f":["div_count"]}]},{"l":"б","q":"Получилось, что на 20 карточках есть синяя и зелёная отметки, на 20 карточках есть синяя и красная отметки, на 20 карточках есть красная и зелёная отметки. Найдите наименьшее возможное значение наибольшего числа среди чисел, указанных на карточках.","ak":"num","av":"580","steps":[{"t":"20 чисел вида 20k, k не кратно 3: k = 1, 2, 4, 5, …, 29 ⇒ наибольшее 580.","f":["div_count"]},{"t":"Другие типы укладываются меньше (12·24 = 288, 15·26 = 390). Ответ: 580.","f":["est_ex"]}]},{"l":"в","q":"Получилось, что на 45 карточках синяя отметка. Найдите наименьшее возможное значение наибольшего числа среди указанных на карточках.","ak":"num","av":"444","steps":[{"t":"45 «синих» — из чисел 12k (5 ∤ k) и 20k (3 ∤ k). До M их f(M) = (кол-во) + (кол-во); f(443) = 44, f(444) = 45.","f":["div_count"]},{"t":"15 «красно-зелёных» укладываются до 285. Ответ: 444.","f":["est_ex"]}]}],"tags":["div"],"facts":["div_comp","div_count","est_ex"],"note":"","n":145},{"id":"114804","d":4,"from":"Школково","stem":"Есть 60 карточек, на каждой — натуральное число больше 1, все числа различны. Отметки: делится на 3 — красная, на 4 — синяя, на 5 — зелёная. На каждой карточке не менее двух отметок.","parts":[{"l":"в","q":"Карточек ровно с двумя отметками, одна из которых синяя, оказалось 37. Найдите наименьшее возможное значение наибольшего числа на карточках.","ak":"num","av":"372","steps":[{"t":"37 карточек — числа 12k (5 ∤ k) и 20k (3 ∤ k). До 372: 25 + 12 = 37, до 371 меньше.","f":["div_count"]},{"t":"Остальные 23 — числа 15k (4 ∤ k) или кратные 60: до 372 их 18 + 6 = 24 ≥ 23. Ответ: 372.","f":["est_ex"]}]}],"tags":["div"],"facts":["div_comp","div_count","est_ex"],"note":"","n":146},{"id":"114836","d":4,"from":"Школково","stem":"Из k кг материала фабрика делает n одинаковых деталей массой m кг, k = nm + q, q \u003c m (q — остаток). Новые детали на 0,1 кг легче, и из 18 кг новых деталей делают на две больше, чем старых из 21 кг.","parts":[{"l":"в","q":"Найдите все такие n, что фабрика может выпускать n новых деталей из 10 кг материала, не нарушая условия q \u003c m.","ak":"set","av":"20;21;22;23;24","steps":[{"t":"Условие: [18/m′] = [21/m] + 2, m′ = m − 0,1; ищем n = [10/m′].","f":["lin_dioph"]},{"t":"Например, n = 24: m ∈ (0,509; 0,512] ⇒ [21/m] = 41, [18/m′] = 43 ✓. n = 25 и n = 19 условию противоречат.","f":["est_ex"]},{"t":"Ответ: 20, 21, 22, 23, 24.","f":[]}]}],"tags":["eq"],"facts":["lin_dioph","est_ex"],"note":"","n":147},{"id":"159983","d":4,"from":"Школково","stem":"Для набора из 60 различных целых чисел выполнено, что сумма любых двух чисел из этого набора больше суммы любых шести чисел из этого набора.","parts":[{"l":"а","q":"Может ли одним из этих чисел быть число –400?","ak":"yn","av":"ДА","steps":[{"t":"Достаточно, чтобы сумма двух наименьших была больше суммы шести наибольших.","f":["extreme"]},{"t":"Числа −400, −399, …, −341: −400 − 399 = −799 > −341 − 342 − … − 346 = −2061. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли одним из этих чисел быть число 400?","ak":"yn","av":"ДА","steps":[{"t":"Пусть a₁ = −1000, a₂ = −999, затем 53 числа от −998 вверх, a₅₅…a₅₉ = −482, −481, −480, −479, −478, a₆₀ = 400.","f":[]},{"t":"Шесть наибольших: 400 − 2400 = −2000 \u003c −1999 = a₁ + a₂. Ответ: да.","f":[]}]},{"l":"в","q":"Какое наибольшее значение может принимать сумма чисел этого набора?","ak":"num","av":"-3329","steps":[{"t":"Пусть x = a₅₅. Тогда a₅₆…a₆₀ ≥ x+1, …, x+5 ⇒ шесть наибольших ≥ 6x + 15; a₂ ≤ x − 53 ⇒ a₁ + a₂ ≤ 2x − 107. Условие ⇒ x ≤ −31.","f":["distinct_min"]},{"t":"Сумма = (a₁ + a₂) + (a₃ + … + a₅₄) + (шесть наибольших) ≤ 2(a₁ + a₂) − 1 + 52x − 1378 ≤ 56x − 1593 ≤ −3329.","f":["est_ex"]},{"t":"Пример: −85, −84, −83, …, −32, −31, −30, −29, −28, −27, −25: две наименьшие −169 > −170. Сумма −3329. Ответ: −3329.","f":[]}]}],"tags":["est"],"facts":["extreme","distinct_min","est_ex"],"note":"","n":148},{"id":"160539","d":4,"from":"Школково","stem":"На координатной прямой отмечены целые числа. Митя играет в следующую игру: фишка стоит на отметке 0; Митя бросает игральный кубик и сдвигает фишку на выпавшее число очков вправо (положительное направление прямой), если выпадает чётное число очков, и влево (отрицательное направление прямой), если выпадает нечётное число очков. Через некоторое время Митя закончил игру.","parts":[{"l":"а","q":"Может ли фишка оказаться на отметке «–50», если Митя 30 раз бросил кубик?","ak":"yn","av":"ДА","steps":[{"t":"14 раз выпало 5 (−70), 12 раз 2 (+24), 4 раза 1 (−4): −50 за 30 бросков. Ответ: да.","f":[]}]},{"l":"б","q":"Известно, что чётное число очков выпадало столько же раз, сколько и нечётное число очков. Какое наименьшее число бросков кубика понадобится, чтобы фишка оказалась на отметке «–50»?","ak":"num","av":"36","steps":[{"t":"k чётных и k нечётных: (сумма нечётных) − (сумма чётных) = 50, сумма нечётных ≤ 5k, чётных ≥ 2k ⇒ k ≥ 17.","f":["lin_dioph"]},{"t":"Сумма k нечётных ≡ k (mod 2) и равна (чётное) + 50 ⇒ k чётно ⇒ k ≥ 18.","f":["parity"]},{"t":"Пример: 18 двоек; 16 пятёрок и 2 тройки (86 − 36 = 50). Ответ: 36.","f":[]}]},{"l":"в","q":"Известно, что чётное число очков выпадало столько же раз, сколько и нечётное число очков. Какое наименьшее число бросков кубика понадобится, чтобы фишка оказалась на отметке «–57», если также известно, что при бросании кубика каждая грань выпадала хотя бы один раз, но любые две грани не выпадали одинаковое количество раз?","ak":"num","av":"58","steps":[{"t":"Через количества: 3k = 57 + 4(n₁ + n₆) + 2(n₃ + n₄) (n₁…n₆ — сколько раз выпала грань).","f":["lin_dioph"]},{"t":"k нечётно (как в б) ⇒ X = 4(n₁+n₆) + 2(n₃+n₄) делится на 6; при различных n ≥ 1 X ≥ 26 ⇒ X ≥ 30 ⇒ k ≥ 29.","f":["est_ex"]},{"t":"Пример: n₁=1, n₂=21, n₃=2, n₄=5, n₅=26, n₆=3: 137 − 80 = 57, бросков 58. Ответ: 58.","f":[]}]}],"tags":["eq","est"],"facts":["lin_dioph","parity","est_ex"],"note":"","n":149},{"id":"169030","d":4,"from":"Школково","stem":"Коля записал на доске 20 различных натуральных чисел, каждое из которых меньше 1000. Петя записал на доске квадраты всех чисел, которые записал Коля. Получилось так, что среднее арифметическое любых трёх чисел, которые записал Петя, — целое число. Одно из чисел, записанных на доске, равно 625.","parts":[{"l":"а","q":"Может ли на доске быть записано число 10816?","ak":"yn","av":"ДА","steps":[{"t":"Среднее любых трёх Петиных — целое ⇒ все квадраты сравнимы по mod 3 ⇒ все числа Коли либо кратны 3, либо нет. 625 = 25² не кратно 3.","f":["mod_shift"]},{"t":"10816 = 104², 104 не кратно 3 — Коля мог написать 104. Ответ: да.","f":["mod_sq"]}]},{"l":"б","q":"Может ли на доске быть записано число 93636?","ak":"yn","av":"НЕТ","steps":[{"t":"93636 = 306², 306 кратно 3 — противоречит. Коля сам написать его не мог (> 1000). Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наибольшее количество пар одинаковых чисел может быть написано на доске?","ak":"num","av":"12","steps":[{"t":"Пара равных: число Коли x = y², где y тоже у Коли (y ≤ 31, не кратно 3). Цепочки: 1 (1 = 1²), 2–4–16–256, 5–25–625, остальные y–y².","f":["mod_sq"]},{"t":"Выгоднее всего: 1 (1 число — 1 пара), 2,4,16,256 (4 числа — 3 пары), 5,25,625 (3 числа — 2 пары), дальше по 2 числа на пару: 12 чисел — 6 пар.","f":["est_ex"]},{"t":"Итого 20 чисел и 1 + 3 + 2 + 6 = 12 пар. Ответ: 12.","f":[]}]}],"tags":["div"],"facts":["mod_shift","mod_sq","est_ex"],"note":"","n":150},{"id":"159856","d":5,"from":"PDF №030","stem":"Тройку различных натуральных чисел назовём удачной, если любое число в ней хотя бы на 5 больше, чем треть суммы двух других чисел. Например, 40, 45, 50 — удачная тройка.","parts":[{"l":"а","q":"Сколько существует удачных троек, содержащих числа 50, 60 и ещё одно число, большее 60?","ak":"num","av":"15","steps":[{"t":"Удачная: для каждого числа 3x ≥ (сумма двух других) + 15.","f":[]},{"t":"Для 50: 150 ≥ 60 + x + 15 ⇒ x ≤ 75. Для 60: x ≤ 115. Для x: 3x ≥ 125.","f":[]},{"t":"x от 61 до 75 — 15 троек. Ответ: 15.","f":[]}]},{"l":"б","q":"Найдётся ли удачная тройка, одно из чисел которой равно 15?","ak":"yn","av":"НЕТ","steps":[{"t":"Пусть 15, y, z. Для 15: 45 ≥ y + z + 15 ⇒ y + z ≤ 30.","f":[]},{"t":"Для y и z: 3y ≥ z + 30, 3z ≥ y + 30 ⇒ сложим: y + z ≥ 30 ⇒ y + z = 30 и 4y ≥ 60, 4z ≥ 60 ⇒ y = z = 15 — не различны. Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наибольшее количество чисел от 1 до 100 включительно можно расставить по кругу так, чтобы каждое число встречалось не более одного раза и любые три подряд идущих числа образовывали удачную тройку?","ak":"num","av":"80","steps":[{"t":"Пусть m — наименьшее число на круге, по две соседки с каждой стороны: a′, a, m, b, b′. Тройки (a′,a,m), (a,m,b), (m,b,b′) удачны ⇒ для m: a + a′ ≤ 3m − 15, b + b′ ≤ 3m − 15, a + b ≤ 3m − 15.","f":["extreme"]},{"t":"Четыре различных числа > m разбиты на пары {a,a′} и {b,b′}; одна из пар ≥ (m+1)+(m+4) или (m+2)+(m+3) = 2m + 5 ⇒ 2m + 5 ≤ 3m − 15 ⇒ m ≥ 20.","f":[]},{"t":"Если m = 20: соседи — ровно 21, 22, 23, 24 (суммы пар 45). Если 21 стоит рядом с 20, а 24 за ним, то для тройки (x, 24, 21): 63 ≥ 24 + x + 15 ⇒ x ≤ 24 — но все числа 20…24 заняты. Если 21 дальний, то a = 24 и a + b ≤ 45 ⇒ b ≤ 21 — противоречие. Значит, m ≥ 21 и чисел ≤ 80.","f":["est_ex"]},{"t":"Пример: 21, 23, 25, …, 99, 100, 98, …, 24, 22 (по кругу). Проверка: (x, x+2, x+4) при x ≥ 21 удачна; на стыках (97,99,100), (24,22,21), (22,21,23) тоже. Ответ: 80.","f":[]}]}],"tags":["est"],"facts":["extreme","est_ex"],"note":"","n":151},{"id":"30822","d":5,"from":"Школково","stem":"На доске написано N различных натуральных чисел, каждое из которых не превосходит 99. Для любых двух написанных на доске чисел a и b таких, что a\u003c b, ни одно из написанных чисел не делится на b − a и ни одно из написанных чисел не является делителем числа b− a.","parts":[{"l":"а","q":"Могут ли быть написаны на доске какие-то два из чисел 18, 19 и 20?","ak":"yn","av":"НЕТ","steps":[{"t":"18 и 19, 19 и 20: разность 1 — на неё делится любое число. 18 и 20: разность 2, а 18 делится на 2. Ответ: нет.","f":[]}]},{"l":"б","q":"Среди написанных на доске чисел есть 17. Может ли N быть равным 25?","ak":"yn","av":"НЕТ","steps":[{"t":"Ключ: если x на доске, то все числа дают разные остатки при делении на x (иначе x делит разность) ⇒ N ≤ x для каждого x, в частности N ≤ 17.","f":["mod_def"]},{"t":"17 \u003c 25. Ответ: нет.","f":[]}]},{"l":"в","q":"Найдите наибольшее возможное значение N.","ak":"num","av":"33","steps":[{"t":"Пусть m — наименьшее. Остатки по mod m различны ⇒ N ≤ m.","f":["extreme"]},{"t":"Соседних чисел быть не может (разность 1) ⇒ в [m; 99] не больше (101 − m)/2 чисел. N ≤ min(m, (101 − m)/2) ≤ 33.","f":["est_ex"]},{"t":"Пример: нечётные 35, 37, …, 99 (33 числа). Разности чётные ≤ 64: нечётное не делится на чётное, а делитель разности ≤ 32 \u003c 35. Ответ: 33.","f":[]}]}],"tags":["div","est"],"facts":["mod_def","extreme","est_ex"],"note":"","n":152},{"id":"114807","d":5,"from":"Школково","stem":"Каждый год в соревнованиях, состоящих из 10 этапов, участвует 10 спортсменов. По итогам каждого этапа один спортсмен занимает первое место, один спортсмен второе и один — третье. В результате ежегодных соревнований каждый спортсмен занимает a первых, b вторых и c третьих мест. В зависимости от мест, занятых спортсменом на всех этапах (одного года), ему присваивается итоговый рейтинг соревнований. В этом году по итогам 10 этапов каждому спортсмену присваивается 10a+ 4b+ c очков; чем у спортсмена очков больше, тем рейтинг выше. Если количество очков у спортсменов совпадает, то рейтинги у них одинаковые. В прошлом году в таких же соревнованиях участвовали те же спортсмены. Но для подведения итогов соревнований рейтинги спортсменов определялись следующим образом. Если у спортсмена-1 количество первых, вторых и третьих мест соответственно равно a1,b1 и c1, а у спортсмена-2 — a2,b2 и c2, то рейтинг спортсмена-1 был выше рейтинга спортсмена-2 в следующих случаях: a1 > a2, a1 = a2 и b1 > b2, a1 = a2,b1 = b2 и c1 > c2. Если количество и первых, и вторых, и третьих мест у спортсменов совпадало, то рейтинги у них были одинаковые.","parts":[{"l":"а","q":"В этом году по итогам соревнований у спортсменов нет совпадающих рейтингов. Если бы рейтинги определялись, как в прошлом году, то у спортсменов тоже не было бы совпадающих рейтингов. Может ли порядок рейтингов спортсменов в этом году совпадать с порядком рейтингов прошлого года?","ak":"yn","av":"ДА","steps":[{"t":"(a, b, c): (4,0,0)=40, (3,1,0)=34, (2,2,0)=28, (1,3,0)=22, (0,4,0)=16, (0,0,4)=4, (0,0,3)=3, (0,0,2)=2, (0,0,1)=1, (0,0,0)=0.","f":[]},{"t":"Порядок по очкам и по правилам прошлого года совпадает. Ответ: да.","f":[]}]},{"l":"б","q":"По итогам соревнований этого года получилось, что у любых двух спортсменов нет одинаковых рейтингов. Какая наибольшая разница в очках может быть между двумя наименьшими рейтингами?","ak":"num","av":"12","steps":[{"t":"Сумма очков 10·10 + 4·10 + 10 = 150. Девять верхних различны и ≥ p₉ ⇒ 9p₉ + 36 ≤ 150 ⇒ p₉ ≤ 12, p₁₀ ≥ 0.","f":["est_ex"]},{"t":"Пример: очки 25, 20, 18, 17, 16, 15, 14, 13, 12, 0 — например (2,1,1), (2,0,0), (1,2,0), (0,4,1), (1,1,2), (1,1,1), (1,1,0), (1,0,3), (1,0,2), (0,0,0). Ответ: 12.","f":[]}]},{"l":"в","q":"Каждый год по результатам соревнований вычисляется средний балл Q для спортсменов, набравших хотя бы одно очко: отношение суммы всех набранных очков к количеству спортсменов, набравших хотя бы одно очко. В следующем году планируется проводить аналогичные соревнования (10 этапов) с участием 10 спортсменов, где каждому из них будут присваиваться 10a +k1b+ k2c очков. Организаторы обсуждают в данной формуле целые значения k1 и k2 такие, что 1 ≤k2 \u003c k1 ≤ 9. Найдите все пары (k1;k2), при которых возможно получить наибольшее количество целых значений среднего балла Q.","ak":"self","av":"(5; 3), (6; 2), (7; 1), (8; 6), (9; 5).","steps":[{"t":"Сумма очков 10(10 + k₁ + k₂), а число набравших очки m — любое от 3 до 10.","f":[]},{"t":"Q = 10(10 + k₁ + k₂)/m. Перебором s = 10 + k₁ + k₂: больше всего делителей m ∈ [3; 10] (шесть) у 10s при s = 18 (m = 3, 4, 5, 6, 9, 10) и s = 24 (m = 3, 4, 5, 6, 8, 10).","f":["est_ex"]},{"t":"k₁ + k₂ = 8: (5;3), (6;2), (7;1); k₁ + k₂ = 14: (8;6), (9;5).","f":[]}]}],"tags":["est"],"facts":["mean","est_ex"],"note":"","n":153},{"id":"114809","d":5,"from":"Школково","stem":"10 спортсменов, 10 этапов, на каждом — 1-е, 2-е и 3-е место. За год у спортсмена a первых, b вторых, c третьих мест; в этом году он получает 10a + 4b + c очков (больше очков — выше рейтинг). В прошлом году рейтинг сравнивали «по старшинству»: сначала по a, при равенстве — по b, затем по c.","parts":[{"l":"а","q":"В этом году по итогам соревнований и наивысший, и наименьший рейтинги имеют ровно по одному спортсмену. Если бы рейтинги определялись, как в прошлом году, то и наивысший, и наименьший рейтинги имели бы тоже ровно по одному спортсмену. Может ли спортсмен, получивший в этом году наивысший рейтинг, по расчётам прошлого года иметь наименьший рейтинг?","ak":"yn","av":"ДА","steps":[{"t":"Спортсмен X: (0, 10, 0) — 40 очков. Остальные: (2, 0, 3) — 23 очка и восемь человек (1, 0, c) с c = 0, 1, …, 1 (сумма 7).","f":[]},{"t":"В этом году X — единственный лидер (40), последний — (1,0,0) с 10 очками. По-прошлогоднему X — единственный последний (у остальных a ≥ 1), лидер (2,0,3). Ответ: да.","f":[]}]},{"l":"б","q":"По итогам соревнований этого года получилось, что у любых двух спортсменов нет одинаковых рейтингов, а модуль разности набранных очков у любых двух спортсменов не меньше p. Найдите наибольшее возможное значение p.","ak":"num","av":"3","steps":[{"t":"Очки различны с шагом ≥ p ⇒ сумма ≥ 0 + p + … + 9p = 45p ≤ 150 ⇒ p ≤ 3.","f":["est_ex"]},{"t":"Пример: 0, 3, 6, …, 24, 42 — (0,0,0), (0,0,3), (0,1,2), (0,2,1), (1,0,2), (1,1,1), (1,2,0), (2,0,1), (2,1,0), (3,3,0). Ответ: 3.","f":[]}]},{"l":"в","q":"По итогам соревнований этого года получилось, что у любых двух спортсменов нет одинаковых рейтингов. Найдите наименьшую возможную разницу между средним арифметическими значениями набранных очков у пяти спортсменов с наибольшими рейтингами и у пяти спортсменов с наименьшими рейтингами.","ak":"num","av":"6","steps":[{"t":"Разность средних = (T − B)/5, T + B = 150. Для упорядоченных q₁ \u003c … \u003c q₁₀: q₆ − q₁ ≥ 5 и т.д. ⇒ T − B ≥ 25 и T − B чётно.","f":[]},{"t":"T − B = 26 или 28: если наибольший нижний m, то B ≤ 5m − 10 и T ≥ 5m + 15 — несовместимо с B = 62 (61). Значит, T − B ≥ 30.","f":["est_ex"]},{"t":"Пример: 10, 11, 12, 13, 14 | 15, 16, 17, 18, 24 — реализуется: (1,0,0), (1,0,1), (1,0,2), (1,0,3), (1,1,0), (1,1,1), (1,1,2), (0,4,1), (1,2,0), (2,1,0). Ответ: 6.","f":[]}]}],"tags":["est"],"facts":["mean","est_ex"],"note":"","n":154}]}</script>
<script id="seed-progress" type="application/json">{}</script>
<script>
(function(){
"use strict";
// ---------- storage (с запасным вариантом в памяти)
var MEM = {};
var store = {
  get:function(k,d){ try{ var v = localStorage.getItem(k); return v==null? (k in MEM? MEM[k]:d) : JSON.parse(v);}catch(e){ return k in MEM? MEM[k]:d; } },
  set:function(k,v){ MEM[k]=v; try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del:function(k){ delete MEM[k]; try{ localStorage.removeItem(k);}catch(e){} }
};
var K = { content:"ntc_content", profiles:"ntc_profiles", prog:"ntc_p_", theme:"ntc_theme", cur:"ntc_current" };

var BUILTIN = JSON.parse(document.getElementById('app-data').textContent);
var content = store.get(K.content, null) || BUILTIN;
// семя прогресса (если приложение было сохранено вместе с прогрессом)
try{
  var seed = JSON.parse(document.getElementById('seed-progress').textContent||"{}");
  Object.keys(seed).forEach(function(name){ if(!store.get(K.prog+name,null)){ store.set(K.prog+name, seed[name]); addProfile(name); } });
}catch(e){}

function profiles(){ return store.get(K.profiles, []); }
function addProfile(name){ var l = profiles(); if(l.indexOf(name)<0){ l.push(name); store.set(K.profiles,l);} }
function loadProg(name){ var p = store.get(K.prog+name, null); if(!p) p = {name:name, parts:{}, fav:{}, last:null, created:Date.now()}; p.parts=p.parts||{}; p.fav=p.fav||{}; return p; }

var DLAB=['','разминка','базовая','средняя','сложная','олимпиадная'];
var S = { diff:0, user:null, prog:null, cur:null, part:0, filter:"all", tag:"", q:"", drawer:false, drawerAll:false, hl:null, dq:"", listOpen:false };
var theme = store.get(K.theme, (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)?"dark":"light");
document.documentElement.setAttribute('data-theme', theme);

var factById = {}; function indexFacts(){ factById={}; content.facts.forEach(function(f){ factById[f.id]=f; }); }
indexFacts();
function probByN(n){ for(var i=0;i<content.problems.length;i++) if(content.problems[i].id===n) return content.problems[i]; return null; }

// ---------- DOM helper
function h(tag, attrs){
  var el = document.createElement(tag);
  if(attrs) for(var k in attrs){ var v=attrs[k]; if(v==null||v===false) continue;
    if(k==="class") el.className=v; else if(k==="text") el.textContent=v; else if(k.slice(0,2)==="on") el.addEventListener(k.slice(2),v); else if(k==="style") el.setAttribute('style',v); else el.setAttribute(k, v===true?"":v); }
  for(var i=2;i<arguments.length;i++){ var c=arguments[i]; if(c==null||c===false) continue; if(Array.isArray(c)) c.forEach(function(x){ if(x!=null&&x!==false) el.appendChild(typeof x==="string"?document.createTextNode(x):x);}); else el.appendChild(typeof c==="string"?document.createTextNode(c):c); }
  return el;
}
var root = document.getElementById('app');

// ---------- прогресс
function pkey(n,i){ return n+"-"+i; }
function partSt(n,i){ return S.prog.parts[pkey(n,i)] || {}; }
function setPart(n,i,patch){ var k=pkey(n,i); var o=S.prog.parts[k]||{}; for(var x in patch) o[x]=patch[x]; S.prog.parts[k]=o; save(); }
function save(){ store.set(K.prog+S.user, S.prog); }
function probDone(p){ for(var i=0;i<p.parts.length;i++) if(!partSt(p.id,i).ok) return false; return true; }
function totals(){ var all=0, ok=0, full=0; content.problems.forEach(function(p){ all+=p.parts.length; var d=true; p.parts.forEach(function(_,i){ if(partSt(p.id,i).ok) ok++; else d=false; }); if(d) full++; }); return {all:all, ok:ok, full:full}; }

// ---------- проверка ответов
function parseNum(s){
  s = String(s).trim().toLowerCase().replace(/−/g,'-').replace(/%/g,'').replace(/\s+/g,' ');
  if(/^(√|sqrt|корень)/.test(s)){ var m=s.replace(/^(√|sqrt|корень( из)?)\s*\(?/,'').replace(/\)$/,''); var v=parseNum(m); return v==null?null:Math.sqrt(v); }
  var mixed = s.match(/^(-?\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(mixed){ var w=+mixed[1]; var fr=(+mixed[2])/(+mixed[3]); return w<0? w-fr : w+fr; }
  s = s.replace(/\s/g,'').replace(',', '.');
  var fm = s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
  if(fm){ var d=+fm[2]; return d? (+fm[1])/d : null; }
  if(/^-?\d+(\.\d+)?$/.test(s)) return +s;
  return null;
}
function near(a,b){ return Math.abs(a-b) < 1e-9*Math.max(1,Math.abs(b)); }
function checkAnswer(part, input){
  if(part.ak==="yn") return input===part.av;
  if(part.ak==="num"){ var a=parseNum(input), b=parseNum(part.av); return a!=null && b!=null && near(a,b); }
  if(part.ak==="set"){
    var want = part.av.split(';').map(parseNum).sort(function(x,y){return x-y;});
    var got = String(input).replace(/−/g,'-').split(/[;,]|\s*и\s*|\s+/i).map(function(x){return x.trim();}).filter(Boolean).map(parseNum);
    if(got.some(function(x){return x==null;})) return false;
    got.sort(function(x,y){return x-y;});
    if(got.length!==want.length) return false;
    for(var i=0;i<got.length;i++) if(!near(got[i],want[i])) return false; return true;
  }
  return false;
}

// ---------- экраны
function render(){
