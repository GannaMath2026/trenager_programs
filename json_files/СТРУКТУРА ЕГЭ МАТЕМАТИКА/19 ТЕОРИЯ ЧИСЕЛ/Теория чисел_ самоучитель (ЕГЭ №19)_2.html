  var m=document.getElementById('main'); var top=m? m.scrollTop:0;
  if(S.resetScroll){ top=0; S.resetScroll=false; }
  root.innerHTML="";
  if(!S.user) return renderLogin();
  renderApp();
  var m2=document.getElementById('main'); if(m2) m2.scrollTop=top;
}

function renderLogin(){
  var inp = h('input',{class:'field',placeholder:'Имя ученика',maxlength:'40',autocomplete:'off'});
  function go(){ var v=inp.value.trim(); if(!v){ inp.focus(); return;} login(v); }
  inp.addEventListener('keydown',function(e){ if(e.key==="Enter") go(); });
  var list = profiles();
  var card = h('div',{class:'login-card'},
    h('h1',null,'Теория чисел'),
    h('p',null,'Самоучитель по задачам ЕГЭ №19: '+content.problems.length+' задач (от простых к сложным), '+content.facts.length+' фактов теории с примерами, пошаговые решения. Прогресс хранится на этом устройстве отдельно для каждого ученика.'),
    h('div',{class:'row'}, inp, h('button',{class:'btn primary',onclick:go},'Начать')),
    list.length? h('div',{class:'names'}, h('div',{class:'sec',style:'margin:6px 0 2px'},'Уже занимались'),
      list.map(function(nm){ var p=loadProg(nm); var c=0; for(var k in p.parts) if(p.parts[k].ok) c++;
        return h('button',{class:'name-item',onclick:function(){login(nm);}}, h('span',null,h('b',null,nm)), h('small',null,'решено пунктов: '+c)); })) : null,
    h('div',{class:'row',style:'margin-top:18px;justify-content:space-between'},
      h('button',{class:'btn small ghost',onclick:importDialog},'⇪ Импорт JSON'),
      h('button',{class:'btn small ghost',onclick:toggleTheme}, theme==="dark"?'☀ Светлая тема':'☾ Тёмная тема'))
  );
  root.appendChild(h('div',{class:'login'},card));
  setTimeout(function(){ inp.focus(); },50);
}
function login(name){
  addProfile(name); S.user=name; S.prog=loadProg(name); S.prog.name=name; save(); store.set(K.cur,name);
  S.cur = (S.prog.last && probByN(S.prog.last)) ? S.prog.last : (firstUnsolved() || content.problems[0].id); S.part=firstUnsolvedPart(probByN(S.cur));
  render();
}
function firstUnsolved(after){
  var ps=content.problems, start=0;
  if(after!=null){ for(var i=0;i<ps.length;i++) if(ps[i].id===after){ start=i+1; break; } }
  for(var j=0;j<ps.length;j++){ var p=ps[(start+j)%ps.length]; if(!probDone(p)) return p.id; }
  return null;
}
function firstUnsolvedPart(p){ if(!p) return 0; for(var i=0;i<p.parts.length;i++) if(!partSt(p.id,i).ok) return i; return 0; }

function toggleTheme(){ theme = theme==="dark"?"light":"dark"; document.documentElement.setAttribute('data-theme',theme); store.set(K.theme,theme); render(); }

// ---------- основной экран
var menuEl=null;
function renderApp(){
  var t = totals();
  var pct = t.all? Math.round(100*t.ok/t.all):0;
  var header = h('header',{class:'top'},
    h('button',{class:'iconbtn mobile-only',title:'Список задач',onclick:function(){ S.listOpen=!S.listOpen; render(); }},'☰'),
    h('div',{class:'brand'},'Теория чисел · №19'),
    h('div',{class:'who'},
      h('span',{class:'nm'},S.user),
      h('div',{class:'bar',title:'Решено пунктов: '+t.ok+' из '+t.all},h('i',{style:'width:'+pct+'%'})),
      h('span',{class:'pc'},pct+'%')),
    h('button',{class:'iconbtn',title:'Теория',onclick:function(){ openDrawer(null,true); }},'📘'),
    h('button',{class:'iconbtn',title:'Меню',onclick:function(e){ e.stopPropagation(); toggleMenu(); }},'⋯')
  );
  var body = h('div',{class:'body'}, renderList(), h('main',{id:'main'}, renderProblem()));
  root.appendChild(h('div',{class:'app'}, header, body));
  if(S.listOpen) root.appendChild(h('div',{class:'scrim',style:'z-index:25',onclick:function(){S.listOpen=false;render();}}));
  root.appendChild(renderDrawer());
  if(S.drawer) root.appendChild(h('div',{class:'scrim',onclick:closeDrawer}));
}
function toggleMenu(){
  if(menuEl){ menuEl.remove(); menuEl=null; return; }
  function item(txt,fn){ return h('button',{onclick:function(){ menuEl&&menuEl.remove(); menuEl=null; fn(); }},txt); }
  menuEl = h('div',{class:'menu'},
    item('📊 Прогресс ученика', statsDialog),
    item(theme==="dark"?'☀ Светлая тема':'☾ Тёмная тема', toggleTheme),
    h('hr'),
    item('⇩ Экспорт JSON…', exportDialog),
    item('⇪ Импорт JSON…', importDialog),
    item('💾 Сохранить приложение целиком (.html)', saveAppDialog),
    h('hr'),
    item('↺ Сбросить прогресс ученика…', resetProgress),
    item('👤 Сменить ученика', function(){ S.user=null; S.prog=null; render(); })
  );
  document.body.appendChild(menuEl);
  setTimeout(function(){ document.addEventListener('click', function cl(e){ if(menuEl && !menuEl.contains(e.target)){ menuEl.remove(); menuEl=null; } document.removeEventListener('click',cl); }); },0);
}

function filtered(){
  var q=S.q.trim().toLowerCase();
  return content.problems.filter(function(p){
    if(S.tag && p.tags.indexOf(S.tag)<0) return false;
    if(S.diff && p.d!==S.diff) return false;
    var done=probDone(p);
    if(S.filter==="todo" && done) return false;
    if(S.filter==="done" && !done) return false;
    if(S.filter==="fav" && !S.prog.fav[p.id]) return false;
    if(q){ var hay=(p.n+" "+p.id+" "+p.stem+" "+p.parts.map(function(x){return x.q;}).join(' ')).toLowerCase(); if(hay.indexOf(q)<0) return false; }
    return true;
  });
}
function renderList(){
  var seg = h('div',{class:'seg'}, [["all","Все"],["todo","Решить"],["done","Решены"],["fav","★"]].map(function(x){
    return h('button',{class:S.filter===x[0]?'on':'',onclick:function(){ S.filter=x[0]; render(); }},x[1]); }));
  var sel = h('select',{class:'tagsel',onchange:function(e){ S.tag=e.target.value; render(); }}, h('option',{value:''},'Все темы'),
    Object.keys(content.tags||{}).map(function(k){ var o=h('option',{value:k},content.tags[k]); if(S.tag===k) o.selected=true; return o; }));
  var dsel = h('select',{class:'tagsel',onchange:function(e){ S.diff=+e.target.value; render(); }}, [0,1,2,3,4,5].map(function(k){ var o=h('option',{value:String(k)}, k? stars(k)+' '+DLAB[k] : 'Любая сложность'); if(S.diff===k) o.selected=true; return o; }));
  var search = h('input',{class:'field',placeholder:'Поиск по тексту или номеру',value:S.q,style:'padding:8px 10px;font-size:14px'});

function applyImport(obj){
  var msgs=[];
  if(obj && Array.isArray(obj.problems) && Array.isArray(obj.facts)) obj = {content:obj};
  if(obj.content && Array.isArray(obj.content.problems)){
    var c=obj.content; if(!c.facts) c.facts=content.facts; if(!c.sections) c.sections=content.sections; if(!c.tags) c.tags=content.tags;
    c.problems.forEach(function(p){ p.parts=p.parts||[]; p.tags=p.tags||[]; p.facts=p.facts||[]; p.parts.forEach(function(pt){ pt.steps=pt.steps||[]; }); });
    content=c; store.set(K.content,c); indexFacts(); msgs.push('задач: '+c.problems.length+', фактов: '+c.facts.length);
  }
  if(obj.progress){
    Object.keys(obj.progress).forEach(function(name){
      var inc=obj.progress[name]; var cur=loadProg(name);
      Object.keys(inc.parts||{}).forEach(function(k){ var a=cur.parts[k]||{}, b=inc.parts[k];
        cur.parts[k]={ok:a.ok||b.ok, tries:Math.max(a.tries||0,b.tries||0), steps:Math.max(a.steps||0,b.steps||0), clean:(a.ok&&a.clean)||(b.ok&&b.clean), at:Math.max(a.at||0,b.at||0)}; });
      Object.keys(inc.fav||{}).forEach(function(k){ cur.fav[k]=true; });
      if(!cur.last) cur.last=inc.last;
      store.set(K.prog+name,cur); addProfile(name);
      if(S.user===name) S.prog=cur;
    });
    msgs.push('прогресс учеников: '+Object.keys(obj.progress).join(', '));
  }
  return msgs;
}

    h('p',null,'Решено пунктов: '+t.ok+' из '+t.all+'. Полностью решено задач: '+t.full+' из '+content.problems.length+'.'),
    h('p',{style:'font-size:13px;color:var(--muted)'},'✓ — решён сам, ✓ᵖ — решён с подсказками, … — начат, · — не начат.'),
    h('table',{class:'stat'}, h('tr',null,h('th',null,'№'),h('th',null,'Пункты'),h('th',null,'')), rows)
  ]);
}
function resetProgress(){
  modal('Сбросить прогресс?',[ h('p',null,'Будет удалён весь прогресс ученика «'+S.user+'» на этом устройстве. Сначала можно сделать экспорт JSON.'),
    h('div',{class:'row'}, h('button',{class:'btn',style:'border-color:var(--bad);color:var(--bad)',onclick:function(){ S.prog={name:S.user,parts:{},fav:{},last:null,created:Date.now()}; save(); var m=document.querySelector('.modal'); if(m) m.remove(); render(); }},'Да, сбросить'))]);
}

// старт
var last = store.get(K.cur,null);
if(last && profiles().indexOf(last)>=0){ S.user=last; S.prog=loadProg(last); S.cur=(S.prog.last && probByN(S.prog.last))? S.prog.last : content.problems[0].id; S.part=firstUnsolvedPart(probByN(S.cur)); }
render();
document.addEventListener('keydown',function(e){ if(e.key==="Escape"){ if(S.drawer) closeDrawer(); var m=document.querySelector('.modal'); if(m) m.remove(); } });
})();
</script>
