т: нет.","f":[]}]},{"l":"в","q":"Какое наименьшее возможное значение полученного результата?","ak":"num","av":"4","steps":[{"t":"Для s₁ ≤ s₂ ≤ s₃ ≤ s₄: результат = 3(s₄ − s₁) + (s₃ − s₂) ≥ 3, и он чётен ⇒ ≥ 4.","f":["est_ex"]},{"t":"Пример: {12,7}, {11,8}, {10,9,1}, {6,5,4,3,2} — суммы 19, 19, 20, 20. Ответ: 4.","f":[]}]}],"tags":["est"],"facts":["parity","est_ex"],"note":"","n":41},{"id":"25083","d":2,"from":"Школково","stem":"Вася перемножил несколько различных натуральных чисел из отрезка [23;84]. Петя увеличил каждое из Васиных чисел на 1 и перемножил все полученные числа.","parts":[{"l":"а","q":"Может ли Петин результат быть ровно вдвое больше Васиного?","ak":"yn","av":"ДА","steps":[{"t":"Петин/Васин = Π(x+1)/x — для подряд идущих чисел дробь «телескопируется».","f":[]},{"t":"23, 24, …, 45: 46/23 = 2. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли Петин результат быть ровно в 6 раз больше Васиного?","ak":"yn","av":"НЕТ","steps":[{"t":"Наибольшее отношение — для всех чисел 23…84: 85/23 \u003c 4 \u003c 6. Ответ: нет.","f":[]}]},{"l":"в","q":"В какое наибольшее целое число раз Петин результат может быть больше Васиного?","ak":"num","av":"3","steps":[{"t":"Отношение ≤ 85/23 \u003c 4 ⇒ не больше 3.","f":["est_ex"]},{"t":"28, 29, …, 83: 84/28 = 3. Ответ: 3.","f":[]}]}],"tags":["est"],"facts":["frac_monot","est_ex"],"note":"","n":42},{"id":"26931","d":2,"from":"Школково","stem":"Даны четыре последовательных натуральных числа. Каждое из чисел поделили на одну из его цифр, не равную нулю, а затем четыре результата сложили.","parts":[{"l":"в","q":"Какое наибольшее целое значение может принимать сумма, если каждое из исходных чисел не меньше 200 и не больше 699?","ak":"num","av":"2470","steps":[{"t":"Делим на цифру ≥ 1 ⇒ сумма не больше суммы самих чисел; равенство, если в каждом числе есть единица.","f":[]},{"t":"Наибольшие четыре подряд числа ≤ 699, каждое с цифрой 1: 616, 617, 618, 619. Сумма 2470 — целая.","f":["est_ex"]},{"t":"Ответ: 2470.","f":[]}]}],"tags":["digits"],"facts":["est_ex"],"note":"","n":43},{"id":"27765","d":2,"from":"Школково","stem":"Даны n различных натуральных чисел, составляющих арифметическую прогрессию (n ≥ 3).","parts":[{"l":"а","q":"Может ли сумма всех данных чисел быть равной 14?","ak":"yn","av":"ДА","steps":[{"t":"2 + 3 + 4 + 5 = 14. Ответ: да.","f":[]}]},{"l":"б","q":"Каково наибольшее значение n, если сумма всех данных чисел меньше 900?","ak":"num","av":"41","steps":[{"t":"Сумма n различных натуральных ≥ n(n + 1)/2 \u003c 900 ⇒ n ≤ 41 (42·43/2 = 903).","f":["sum_1n"]},{"t":"Пример: 1, 2, …, 41 — сумма 861. Ответ: 41.","f":[]}]},{"l":"в","q":"Найдите все возможные значения n, если сумма всех данных чисел равна 123.","ak":"set","av":"3;6","steps":[{"t":"n(2a + (n − 1)d) = 246 = 2·3·41, причём 2a + (n − 1)d ≥ n + 1.","f":["fta"]},{"t":"n = 3: a + d = 41 (40, 41, 42). n = 6: 2a + 5d = 41 (18, …, 23). n = 41 и больше — слишком мало. Ответ: 3 или 6.","f":[]}]}],"tags":["seq"],"facts":["ap","sum_1n","fta"],"note":"","n":44},{"id":"46757","d":2,"from":"Школково","stem":"a, b, c, d, e и f — различные числа 2, 3, 4, 5, 6 и 16, расставленные в некотором порядке.","parts":[{"l":"а","q":"Может ли выполняться равенство a/b + c/d + e/f = 6?","ak":"yn","av":"ДА","steps":[{"t":"2/6 + 5/3 + 16/4 = 1/3 + 5/3 + 4 = 6. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли выполняться равенство a/b + c/d + e/f = 961/240?","ak":"yn","av":"НЕТ","steps":[{"t":"240 = 2⁴·3·5 ⇒ среди знаменателей 16, 5 и 3 или 6.","f":[]},{"t":"Знаменатели {16, 5, 3}: числители 2, 4, 6; {16, 5, 6}: числители 2, 3, 4 — 12 вариантов, ни один не даёт 961/240. Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наименьшее значение может принимать сумма a/b + c/d + e/f?","ak":"num","av":"23/20","steps":[{"t":"Числители — три меньших (2, 3, 4), знаменатели — три больших (5, 6, 16); больший числитель — к большему знаменателю.","f":["frac_monot"]},{"t":"2/5 + 3/6 + 4/16 = 0,4 + 0,5 + 0,25 = 23/20. Ответ: 23/20.","f":["est_ex"]}]}],"tags":["est"],"facts":["frac_monot","est_ex"],"note":"","n":45},{"id":"46758","d":2,"from":"Школково","stem":"[x] — наибольшее целое число, не превосходящее x. Например, [11/4] = 2, так как 2 ≤ 11/4 \u003c 3.","parts":[{"l":"а","q":"Существует ли натуральное n, что [n/2] + [n/3] + [n/9] = n?","ak":"yn","av":"НЕТ","steps":[{"t":"[n/2] + [n/3] + [n/9] ≤ n/2 + n/3 + n/9 = 17n/18 \u003c n. Ответ: нет.","f":[]}]},{"l":"б","q":"Существует ли натуральное n, что [n/2] + [n/3] + [n/5] = n + 2?","ak":"yn","av":"ДА","steps":[{"t":"n = 60: 30 + 20 + 12 = 62 = 60 + 2. Ответ: да.","f":[]}]}],"tags":["eq"],"facts":["floor","est_ex"],"note":"","n":46},{"id":"46759","d":2,"from":"Школково","stem":"На доске написано более 35, но менее 49 целых чисел. Среднее арифметическое этих чисел равно 5, среднее арифметическое всех положительных из них равно 14, а среднее арифметическое всех отрицательных из них равно − 7.","parts":[{"l":"а","q":"Сколько чисел написано на доске?","ak":"num","av":"42","steps":[{"t":"p положительных, q отрицательных: 14p − 7q = 5N ⇒ 5N кратно 7 ⇒ N кратно 7.","f":["mean"]},{"t":"35 \u003c N \u003c 49 ⇒ N = 42. Ответ: 42.","f":[]}]},{"l":"б","q":"Каких чисел больше: положительных или отрицательных?","ak":"self","av":"Положительных больше.","steps":[{"t":"14p − 7q = 210 ⇒ q = 2p − 30; нулей z = 42 − p − q = 72 − 3p ≥ 0 ⇒ p ≤ 24.","f":[]},{"t":"q − p = p − 30 \u003c 0 ⇒ положительных больше.","f":[]}]},{"l":"в","q":"Какое наибольшее количество положительных чисел может быть среди них?","ak":"num","av":"24","steps":[{"t":"p ≤ 24 (из б).","f":[]},{"t":"Пример: 24 числа по 14, 18 чисел по −7: сумма 336 − 126 = 210 = 5·42. Ответ: 24.","f":[]}]}],"tags":["avg"],"facts":["mean","div_def"],"note":"","n":47},{"id":"46761","d":2,"from":"Школково","stem":"У Миши в копилке есть 2-рублёвые, 5-рублёвые и 10-рублёвые монеты. Если взять 10 монет, то среди них обязательно найдётся хотя бы одна 2-рублёвая. Если взять 15 монет, то среди них обязательно найдётся хотя бы одна 5-рублёвая. Если взять 20 монет, то среди них обязательно найдётся хотя бы одна 10-рублёвая.","parts":[{"l":"а","q":"Может ли у Миши быть 30 монет?","ak":"yn","av":"НЕТ","steps":[{"t":"Не двухрублёвых ≤ 9, не пятирублёвых ≤ 14, не десятирублёвых ≤ 19.","f":["dirichlet"]},{"t":"Сложим: 2·(всего) ≤ 42 ⇒ монет ≤ 21 \u003c 30. Ответ: нет.","f":[]}]},{"l":"б","q":"Какое наибольшее количество монет может быть у Миши?","ak":"num","av":"21","steps":[{"t":"Из а: ≤ 21.","f":[]},{"t":"Пример: 12 по 2 р., 7 по 5 р., 2 по 10 р. Ответ: 21.","f":["est_ex"]}]},{"l":"в","q":"Какая наибольшая сумма рублей может быть у Миши?","ak":"num","av":"97","steps":[{"t":"Сумма = 2(x₂ + x₁₀) + 5(x₅ + x₁₀) + 3x₁₀ ≤ 28 + 45 + 3x₁₀, а x₁₀ ≤ 9 − x₅ ≤ 8.","f":["est_ex"]},{"t":"Пример: 6 по 2, 1 по 5, 8 по 10: 12 + 5 + 80 = 97. Ответ: 97.","f":[]}]}],"tags":["est"],"facts":["dirichlet","est_ex"],"note":"","n":48},{"id":"51636","d":2,"from":"Школково","stem":"","parts":[{"l":"а","q":"Существует ли конечная арифметическая прогрессия, состоящая из пяти натуральных чисел, такая, что сумма наибольшего и наименьшего членов этой прогрессии равна 99?","ak":"yn","av":"НЕТ","steps":[{"t":"a + (a + 4d) = 2a + 4d — чётно, а 99 нечётно. Ответ: нет.","f":["parity"]}]},{"l":"б","q":"Конечная арифметическая прогрессия состоит из шести натуральных чисел. Сумма наибольшего и наименьшего членов этой прогрессии равна 9. Найдите все числа, из которых состоит эта прогрессия.","ak":"self","av":"2, 3, 4, 5, 6, 7.","steps":[{"t":"a + (a + 5d) = 9 ⇒ 2a + 5d = 9 ⇒ d нечётно, d = 1, a = 2.","f":["ap"]},{"t":"Прогрессия 2, 3, 4, 5, 6, 7 (или в обратном порядке).","f":[]}]},{"l":"в","q":"Среднее арифметическое членов конечной арифметической прогрессии, состоящей из натуральных чисел, равно 6,5. Какое наибольшее количество членов может быть в этой прогрессии?","ak":"num","av":"12","steps":[{"t":"Среднее 6,5 ⇒ a₁ + aₙ = 13; d ≠ 0 (иначе 6,5 не натуральное) ⇒ (n − 1)|d| ≤ 13 − 2 = 11 ⇒ n ≤ 12.","f":["ap"]},{"t":"Пример: 1, 2, …, 12. Ответ: 12.","f":["est_ex"]}]}],"tags":["seq"],"facts":["ap","parity","est_ex"],"note":"","n":49},{"id":"58738","d":2,"from":"Школково","stem":"Трехзначное число, все цифры которого ненулевые, разделили на произведение его цифр.","parts":[{"l":"а","q":"Могло ли в результате деления получиться частное, равное 8?","ak":"yn","av":"ДА","steps":[{"t":"128: произведение цифр 16, 128 : 16 = 8. Ответ: да.","f":[]}]},{"l":"б","q":"Могло ли в результате деления получиться частное, равное 222?","ak":"yn","av":"НЕТ","steps":[{"t":"n = 222·P ≤ 999 ⇒ P ≤ 4 ⇒ n ∈ {222, 444, 666, 888}.","f":[]},{"t":"Их произведения цифр 8, 64, 216, 512 — не равны P. Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наибольшее частное можно было получить в результате деления?","ak":"num","av":"111","steps":[{"t":"Пусть P = a·b·c. Если b = c = 1: n/P = (100a + 11)/a = 100 + 11/a ≤ 111 (равенство при n = 111).","f":[]},{"t":"Если bc ≥ 2: n/P ≤ (100a + 99)/(2a) ≤ 50 + 49,5 \u003c 111.","f":["est_ex"]},{"t":"Ответ: 111.","f":[]}]}],"tags":["digits"],"facts":["dec_repr","est_ex"],"note":"","n":50},{"id":"65026","d":2,"from":"Школково","stem":"Имеются контейнеры массой в 2 тонны и 7 тонн и корабли грузоподъемностью в 10 тонн.","parts":[{"l":"а","q":"Можно ли 11 контейнеров массой 7 тонн и 22 контейнера массой 2 тонны погрузить на 14 кораблей?","ak":"yn","av":"ДА","steps":[{"t":"На корабль — не больше одного контейнера 7 т (7 + 7 > 10) и к нему не больше одного 2 т.","f":[]},{"t":"11 кораблей по 7 + 2, оставшиеся 11 контейнеров по 2 т — на 3 корабля (5, 5, 1). Всего 14. Ответ: да.","f":[]}]},{"l":"б","q":"Можно ли 11 контейнеров массой 7 тонн и 17 контейнеров массой 2 тонны погрузить на 12 кораблей?","ak":"yn","av":"НЕТ","steps":[{"t":"11 кораблей с «семёрками» берут не больше 11 двухтонных, оставшиеся ≥ 6 двухтонных на один корабль не влезут (≤ 5). Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наименьшее количество кораблей требуется для погрузки 11 контейнеров массой 7 тонн и 77 контейнеров массой 2 тонны?","ak":"num","av":"25","steps":[{"t":"Масса 77 + 154 = 231 т. 11 кораблей с «семёрками» везут ≤ 9 т ⇒ остальным ≥ 231 − 99 = 132 т ⇒ ещё ≥ 14 кораблей.","f":["est_ex"]},{"t":"Пример: 11 кораблей (7 + 2), 13 кораблей по 5 «двоек» и один с одной. Ответ: 25.","f":[]}]}],"tags":["est"],"facts":["est_ex"],"note":"","n":51},{"id":"114823","d":2,"from":"Школково","stem":"Трёхзначное число A имеет k натуральных делителей (в том числе 1 и A ).","parts":[{"l":"а","q":"Может ли k быть равно 7?","ak":"yn","av":"ДА","steps":[{"t":"Число делителей pᵃqᵇ… равно (a+1)(b+1)… ⇒ 7 делителей у p⁶.","f":["fta"]},{"t":"3⁶ = 729. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли k быть равно 25?","ak":"yn","av":"НЕТ","steps":[{"t":"25 = 25·1 = 5·5 ⇒ p²⁴ или p⁴q⁴ = (pq)⁴ ≥ 6⁴ = 1296 — не трёхзначные. Ответ: нет.","f":[]}]},{"l":"в","q":"Найдите наибольшее k.","ak":"num","av":"32","steps":[{"t":"Произведение (aᵢ + 1) максимально при многих малых простых: 840 = 2³·3·5·7 — 4·2·2·2 = 32.","f":["fta"]},{"t":"Пять различных простых: 2·3·5·7·11 = 2310 > 999; варианты с 36 и более делителями (например, 2⁵·3²·… ) превышают 999. Ответ: 32.","f":["est_ex"]}]}],"tags":["div"],"facts":["tau","fta","est_ex"],"note":"","n":52},{"id":"114827","d":2,"from":"Школково","stem":"Даны два набора чисел: в первом наборе каждое число равно 150, а во втором — каждое число равно 50. Среднее арифметическое всех чисел двух наборов равно 78.","parts":[{"l":"а","q":"Каждое число первого набора уменьшили на натуральное число n. Может ли среднее арифметическое всех чисел двух наборов быть равно 71?","ak":"yn","av":"ДА","steps":[{"t":"150n₁ + 50n₂ = 78(n₁ + n₂) ⇒ 18n₁ = 7n₂ ⇒ n₁ = 7t, n₂ = 18t.","f":["mean"]},{"t":"Уменьшение среднего на 7: 7t·n = 7·25t ⇒ n = 25. Ответ: да.","f":[]}]},{"l":"б","q":"Каждое число первого набора уменьшили на натуральное число m. Может ли среднее арифметическое всех чисел двух наборов быть равно 70?","ak":"yn","av":"НЕТ","steps":[{"t":"Нужно 7t·m = 8·25t ⇒ m = 200/7 — не натуральное. Ответ: нет.","f":[]}]},{"l":"в","q":"Каждое число одного набора увеличили на натуральное число k, одновременно уменьшив на k каждое число другого набора, при условии, что все числа остались положительными. Какие целые значения может принимать среднее арифметическое всех чисел двух наборов?","ak":"set","av":"67;89;100;111;122;133","steps":[{"t":"Изменение суммы ±(7t − 18t)k ⇒ среднее 78 ± 11k/25 — целое при k = 25j.","f":["lin_dioph"]},{"t":"Первый +k, второй −k: 50 − k > 0 ⇒ k = 25 ⇒ 67. Первый −k, второй +k: k \u003c 150 ⇒ j = 1…5 ⇒ 89, 100, 111, 122, 133.","f":[]}]}],"tags":["avg"],"facts":["mean","lin_dioph"],"note":"","n":53},{"id":"159788","d":2,"from":"Школково","stem":"В школах №1 и №2 учащиеся писали тест. Из каждой школы тест писали по крайней мере 2 учащихся, а суммарно тест писали 9 учащихся. Каждый учащийся, писавший тест, набрал натуральное количество баллов. Оказалось, что в каждой школе средний балл за тест был целым числом. После этого один из учащихся, писавших тест, перешёл из школы №1 в школу №2, а средние баллы за тест были пересчитаны в обеих школах.","parts":[{"l":"а","q":"Мог ли средний балл в школе №1 уменьшиться в 10 раз?","ak":"yn","av":"ДА","steps":[{"t":"Школа №1: 2 ученика, баллы 19 и 1 (среднее 10). Ученик с 19 баллами переходит: осталось 1 = 10/10.","f":["mean_move"]},{"t":"Школа №2: остальные 7 учеников с целым средним, например все по 5. Ответ: да.","f":[]}]}],"tags":["avg"],"facts":["mean_move","est_ex"],"note":"","n":54},{"id":"185985","d":2,"from":"Школково","stem":"На столе лежит некоторое количество карточек, часть из которых синего цвета, а остальные красного (есть хотя бы по одной карточке каждого цвета). На каждой карточке написано целое число. На карточках синего цвета написаны различные числа, делящиеся на 5, а на карточках красного цвета написаны различные чётные числа (при этом некоторые числа могут быть написаны дважды: один раз на синей карточке и один раз на красной карточке). Все числа на карточках больше -120. Оказалось, что наибольшее число, написанное на красной карточке, равно удвоенному количеству синих карточек, а наибольшее число, написанное на синей карточке, равно количеству красных карточек.","parts":[{"l":"б","q":"Может ли число красных карточек на столе быть на 90 больше числа синих карточек на столе?","ak":"yn","av":"НЕТ","steps":[{"t":"Наибольшее красное = 2B, красные — различные чётные числа больше −120: −118, −116, …, 2B — их B + 60.","f":["div_count"]},{"t":"Значит, R ≤ B + 60 \u003c B + 90. Ответ: нет.","f":[]}]}],"tags":["div","est"],"facts":["div_count","est_ex"],"note":"","n":55},{"id":"186103","d":2,"from":"Школково","stem":"На доске написано некоторое количество двузначных натуральных чисел, среди которых могут быть одинаковые. С каждым из этих чисел проделывают одну из двух операций: либо увеличивают цифру в разряде десятков на 2 и уменьшают цифру в разряде единиц на 5, либо уменьшают цифру в разряде десятков на 2 и увеличивают цифру в разряде единиц на 2. Все числа, получившиеся в результате, оказались двузначными натуральными.","parts":[{"l":"а","q":"Может ли сумма исходных чисел оказаться на 128 меньше суммы получившихся чисел?","ak":"yn","av":"НЕТ","steps":[{"t":"Первая операция меняет число на +20 − 5 = +15, вторая на −20 + 2 = −18.","f":["dec_repr"]},{"t":"Изменение суммы 15x − 18y делится на 3, а 128 — нет. Ответ: нет.","f":[]}]},{"l":"б","q":"Может ли количество чисел на доске равняться 25, если сумма исходных чисел равна сумме получившихся чисел?","ak":"yn","av":"НЕТ","steps":[{"t":"15x = 18y ⇒ 5x = 6y ⇒ x = 6k, y = 5k ⇒ чисел 11k.","f":["lin_dioph"]},{"t":"25 не делится на 11. Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наибольшее количество чисел может быть написано на доске, если сумма исходных чисел равна сумме получившихся чисел и меньше 1198?","ak":"num","av":"44","steps":[{"t":"Чисел 11k: 6k с первой операцией (десятки ≤ 7, единицы ≥ 5 ⇒ число ≥ 15) и 5k со второй (десятки ≥ 3 ⇒ число ≥ 30).","f":[]},{"t":"Сумма ≥ 6k·15 + 5k·30 = 240k \u003c 1198 ⇒ k ≤ 4.","f":["est_ex"]},{"t":"Пример k = 4: 24 числа 15 и 20 чисел 30, сумма 960. Ответ: 44.","f":[]}]}],"tags":["digits","eq"],"facts":["dec_repr","lin_dioph","est_ex"],"note":"","n":56},{"id":"190118","d":2,"from":"Школково","stem":"В ящике лежат 73 овоща, масса каждого из которых выражается целым числом граммов. В ящике есть хотя бы два овоща различной массы, а средняя масса всех овощей равна 1000 г. Средняя масса овощей, масса каждого из которых меньше 1000 г, равна 988 г. Средняя масса овощей, масса каждого из которых больше 1000 г, равна 1010 г.","parts":[{"l":"а","q":"Могло ли в ящике оказаться поровну овощей массой меньше 1000 г и овощей массой больше 1000 г?","ak":"yn","av":"НЕТ","steps":[{"t":"x лёгких (среднее 988), y тяжёлых (1010), z по 1000: 988x + 1010y + 1000z = 1000·73 ⇒ 10y = 12x ⇒ x = 5t, y = 6t.","f":["mean"]},{"t":"x = y ⇒ t = 0, но есть овощи разной массы. Ответ: нет.","f":[]}]},{"l":"б","q":"Могло ли в ящике оказаться ровно 11 овощей, масса каждого из которых равна 1000 г?","ak":"yn","av":"НЕТ","steps":[{"t":"z = 11 ⇒ x + y = 62 = 11t — не делится на 11. Ответ: нет.","f":[]}]},{"l":"в","q":"Какую наименьшую массу может иметь овощ в этом ящике?","ak":"num","av":"669","steps":[{"t":"11t ≤ 73 ⇒ t ≤ 6 ⇒ лёгких x ≤ 30. Каждый лёгкий ≤ 999.","f":[]},{"t":"Наименьший лёгкий ≥ 988x − 999(x − 1) = 999 − 11x ≥ 999 − 330 = 669.","f":["est_ex"]},{"t":"Пример: 29 овощей по 999 и один 669 (среднее 988), 36 по 1010, 7 по 1000. Ответ: 669.","f":[]}]}],"tags":["avg"],"facts":["mean","lin_dioph","est_ex"],"note":"","n":57},{"id":"190120","d":2,"from":"Школково","stem":"В ящике лежат 95 фруктов, масса каждого — целое число граммов. Есть хотя бы два фрукта различной массы, средняя масса всех фруктов 100 г. Средняя масса фруктов легче 100 г равна 73 г, а фруктов тяжелее 100 г — 115 г.","parts":[{"l":"в","q":"Какую наибольшую массу может иметь фрукт в этом ящике?","ak":"num","av":"857","steps":[{"t":"−27x + 15y = 0 ⇒ x = 5t, y = 9t, 14t ≤ 95 ⇒ t ≤ 6 ⇒ тяжёлых y ≤ 54.","f":["mean"]},{"t":"Каждый тяжёлый ≥ 101 ⇒ наибольший ≤ 115y − 101(y − 1) = 14y + 101 ≤ 857.","f":["est_ex"]},{"t":"Пример: 53 фрукта по 101 и один 857 (среднее 115), 30 по 73, 11 по 100. Ответ: 857.","f":[]}]}],"tags":["avg"],"facts":["mean","est_ex"],"note":"","n":58},{"id":"39640","d":3,"from":"PDF №006","stem":"В группе поровну юношей и девушек. Юноши отправляли электронные письма девушкам. Каждый юноша отправил или 4 письма, или 21 письмо, причём и тех и других юношей было не менее двух. Возможно, что какой-то юноша отправил какой-то девушке несколько писем.","parts":[{"l":"а","q":"Могло ли оказаться так, что каждая девушка получила ровно 7 писем?","ak":"yn","av":"ДА","steps":[{"t":"Пусть a юношей отправили по 4 письма, b — по 21, девушек n = a + b. Каждая получила 7: 7(a + b) = 4a + 21b ⇒ 3a = 14b.","f":["lin_dioph"]},{"t":"a = 14, b = 3, n = 17: писем 56 + 63 = 119 = 17·7.","f":[]},{"t":"Распределяем письма по девушкам «по очереди» (несколько писем одной девушке разрешены), каждой по 7. Ответ: да.","f":[]}]},{"l":"б","q":"Какое наименьшее количество девушек могло быть в группе, если известно, что все они получили писем поровну?","ak":"num","av":"17","steps":[{"t":"Каждая девушка получила k писем: k(a + b) = 4a + 21b ⇒ (k − 4)a = (21 − k)b, 4 \u003c k \u003c 21.","f":["lin_dioph"]},{"t":"(k − 4) + (21 − k) = 17 — простое ⇒ НОД(k − 4, 21 − k) = НОД(k − 4, 17) = 1. Тогда a = (21 − k)t, b = (k − 4)t, n = a + b = 17t ≥ 17.","f":["gcd"]},{"t":"Пример n = 17 — в пункте а. Ответ: 17.","f":["est_ex"]}]},{"l":"в","q":"Пусть все девушки получили различное количество писем (возможно, какая-то девушка не получила писем вообще). Какое наибольшее количество девушек в такой группе?","ak":"num","av":"41","steps":[{"t":"Девушек n, все получили разное число писем (≥ 0) ⇒ всего писем ≥ 0 + 1 + … + (n − 1) = n(n−1)/2.","f":["sum_1n"]},{"t":"Писем 4a + 21b = 21n − 17a ≤ 21n − 34 (так как a ≥ 2).","f":[]},{"t":"n(n−1)/2 ≤ 21n − 34 ⇒ n² − 43n + 68 ≤ 0 ⇒ n ≤ (43 + √1577)/2 ≈ 41,4 ⇒ n ≤ 41.","f":["est_ex"]},{"t":"Пример n = 41: a = 2, b = 39, писем 8 + 819 = 827. Девушки получили 0, 1, 2, …, 39 и 47 писем: сумма 780 + 47 = 827. Ответ: 41.","f":[]}]}],"tags":["est","eq"],"facts":["lin_dioph","sum_1n","est_ex","coprime"],"note":"","n":59},{"id":"125163","d":3,"from":"PDF №007","stem":"В парке n аттракционов. С 11 до 12 часов дня парк посетило только n детей. Стоимость посещения каждого аттракциона составляет 10 рублей. Каждый ребёнок потратил или 30, или 140 рублей, причём не все дети потратили поровну денег. Один аттракцион можно посетить много раз.","parts":[{"l":"а","q":"Может ли выручка каждого аттракциона составить ровно 80 рублей?","ak":"yn","av":"ДА","steps":[{"t":"30 р. — 3 посещения, 140 р. — 14 посещений. Пусть a детей по 3 посещения, b — по 14, n = a + b. Каждый аттракцион 8 посещений: 8(a + b) = 3a + 14b ⇒ 5a = 6b.","f":["lin_dioph"]},{"t":"a = 6, b = 5, n = 11: 18 + 70 = 88 = 11·8 посещений. Распределяем посещения по 8 на аттракцион. Ответ: да.","f":[]}]},{"l":"б","q":"Какое наименьшее количество детей могло быть, если известно, что все аттракционы получили одинаковую выручку?","ak":"num","av":"11","steps":[{"t":"Одинаковая выручка: k посещений у каждого ⇒ (k − 3)a = (14 − k)b, 3 \u003c k \u003c 14.","f":["lin_dioph"]},{"t":"(k − 3) + (14 − k) = 11 — простое ⇒ дробь (14 − k)/(k − 3) несократима ⇒ a + b кратно 11 ⇒ n ≥ 11.","f":["gcd"]},{"t":"Пример n = 11 — пункт а. Ответ: 11.","f":["est_ex"]}]},{"l":"в","q":"Любые два аттракциона имеют разную выручку (возможно, нулевую). Каково наибольшее возможное количество посетивших парк детей?","ak":"num","av":"28","steps":[{"t":"Выручки разные ⇒ числа посещений аттракционов различны (≥ 0) ⇒ всего посещений ≥ n(n−1)/2.","f":["sum_1n"]},{"t":"Посещений 3a + 14b = 14n − 11a ≤ 14n − 11 (не все потратили поровну ⇒ a ≥ 1).","f":[]},{"t":"n(n−1)/2 ≤ 14n − 11 ⇒ n² − 29n + 22 ≤ 0 ⇒ n ≤ 28,2 ⇒ n ≤ 28.","f":["est_ex"]},{"t":"Пример n = 28: a = 1, b = 27, посещений 3 + 378 = 381 = (0 + 1 + … + 26) + 30. Ответ: 28.","f":[]}]}],"tags":["est","eq"],"facts":["lin_dioph","sum_1n","est_ex"],"note":"В ключе файла к пункту б) стоит «НЕТ», но вопрос «какое наименьшее количество детей» требует числа. По условию, как оно записано, ответ 11 — вероятно, в исходнике пункт б) сформулирован иначе.","n":60},{"id":"159820","d":3,"from":"PDF №009","stem":"На доске написано 30 натуральных чисел (числа могут повторяться), каждое из которых либо зелёного, либо красного цвета. Каждое зелёное число кратно 3, а каждое красное число кратно 7. При этом все зелёные числа различны и все красные различны (какое-то зелёное число может равняться какому-то красному числу).","parts":[{"l":"а","q":"Может ли сумма написанных чисел быть меньше 1395 = 3+ 6+ ⋅⋅⋅+ 90, если все числа на доске кратны 3?","ak":"yn","av":"ДА","steps":[{"t":"Если все числа кратны 3, то красные кратны 3 и 7, т.е. 21.","f":["div_comp"]},{"t":"Пример: зелёные 3, 6, …, 87 (29 чисел), красное 21. Сумма 3·(1 + … + 29) + 21 = 1305 + 21 = 1326 \u003c 1395. Ответ: да.","f":["sum_1n"]}]},{"l":"б","q":"Может ли ровно одно число на доске быть красным, если сумма написанных чисел равна 1067?","ak":"yn","av":"НЕТ","steps":[{"t":"Если красное одно, зелёных 29 различных кратных 3: их сумма ≥ 3·(1 + … + 29) = 1305 > 1067. Ответ: нет.","f":["distinct_min"]}]},{"l":"в","q":"Какое наименьшее количество красных чисел может быть на доске, если сумма написанных чисел равна 1067?","ak":"num","av":"6","steps":[{"t":"Пусть r красных, 30 − r зелёных. Минимальная сумма: 3·(1+…+(30−r)) + 7·(1+…+r).","f":["distinct_min"]},{"t":"r = 5: 3·325 + 7·15 = 975 + 105 = 1080 > 1067. При меньших r сумма ещё больше. Значит, r ≥ 6.","f":["est_ex"]},{"t":"r = 6: минимум 3·300 + 7·21 = 900 + 147 = 1047. Нужно добавить 20 = 6 + 14: зелёное 72 заменим на 78, красное 42 на 56.","f":["lin_dioph"]},{"t":"Пример: зелёные 3, 6, …, 69, 78; красные 7, 14, 21, 28, 35, 56. Сумма 1067. Ответ: 6.","f":[]}]}],"tags":["div","est"],"facts":["sum_1n","distinct_min","lin_dioph","est_ex"],"note":"","n":61},{"id":"106603","d":3,"from":"PDF №012","stem":"Есть три коробки: в первой коробке 97 камней, во второй — 104 камня, а в третьей коробке камней нет. За один ход берут по одному камню из любых двух коробок и кладут в оставшуюся. Сделали некоторое количество таких ходов.","parts":[{"l":"а","q":"Может ли в первой коробке оказаться 97 камней, во второй — 89 камней, а в третьей — 15 камней?","ak":"yn","av":"ДА","steps":[{"t":"Ход «по камню из двух коробок в третью»: изменения (−1, −1, +2). По mod 3 все три числа уменьшаются на 1 ⇒ попарные разности по mod 3 не меняются.","f":["invariant"]},{"t":"(97, 104, 0) → (97, 89, 15): остатки 1, 2, 0 у обоих — противоречия нет.","f":["mod_def"]},{"t":"Пример: 10 ходов «в третью»: (87, 94, 20); затем 5 ходов «в первую»: (97, 89, 15). Ответ: да.","f":[]}]},{"l":"б","q":"Может ли в третьей коробке оказаться 201 камень?","ak":"yn","av":"НЕТ","steps":[{"t":"Было: 104 − 97 = 7 ≡ 1 (mod 3). В состоянии (0, 0, 201) разность 0 − 0 = 0. Инвариант нарушен. Ответ: нет.","f":["invariant"]}]},{"l":"в","q":"В первой коробке оказался 1 камень. Какое наибольшее число камней может оказаться в третьей коробке?","ak":"num","av":"198","steps":[{"t":"Инвариант: b − a ≡ 1, c − a ≡ −97 ≡ 2 (mod 3). При a = 1: b ≡ 2, c ≡ 0 (mod 3).","f":["invariant"]},{"t":"b ≡ 2 (mod 3) ⇒ b ≥ 2 ⇒ c ≤ 201 − 1 − 2 = 198.","f":["est_ex"]},{"t":"Пример: 95 ходов «в третью»: (2, 9, 190); 2 хода «в первую»: (6, 7, 188); ещё 5 ходов «в третью»: (1, 2, 198). Ответ: 198.","f":[]}]}],"tags":["ops"],"facts":["invariant","mod_def","est_ex"],"note":"","n":62},{"id":"90095","d":3,"from":"PDF №013","stem":"Над парами целых чисел проводится операция: из пары (a;b) получается пара (3a+ b;3b− a).","parts":[{"l":"а","q":"Можно ли из какой-то пары получить пару (5;5)?","ak":"yn","av":"ДА","steps":[{"t":"Решаем 3a + b = 5, 3b − a = 5: a = 3b − 5, 9b − 15 + b = 5 ⇒ b = 2, a = 1.","f":["lin_map"]},{"t":"Проверка: (1; 2) → (3 + 2; 6 − 1) = (5; 5). Ответ: да.","f":[]}]},{"l":"б","q":"Верно ли, что если пара (c;d) может быть получена из какой-то пары с помощью данной операции, то и пара (−d;c) тоже может быть получена из какой-то пары с помощью данной операции?","ak":"yn","av":"ДА","steps":[{"t":"(c; d) = (3a + b; 3b − a). Тогда (−d; c) = (a − 3b; 3a + b).","f":[]},{"t":"Возьмём пару (−b; a): (3·(−b) + a; 3a − (−b)) = (a − 3b; 3a + b) = (−d; c). Ответ: да.","f":["lin_map"]}]},{"l":"в","q":"Зададим расстояние между парами целых чисел (a;b) и (c;d) выражением |a− c|+ |b− d|. Найдите наименьшее расстояние от пары (9;2) до пары, полученной из какой-то пары с помощью данной операции.","ak":"num","av":"3","steps":[{"t":"(c; d) получается ⇔ a = (3c − d)/10 и b = (c + 3d)/10 целые ⇔ c + 3d ≡ 0 (mod 10).","f":["lin_map"]},{"t":"Для (9; 2): 9 + 6 = 15 ≡ 5. Сдвиг (Δc, Δd) должен дать Δc + 3Δd ≡ 5 (mod 10).","f":["mod_def"]},{"t":"Расстояние 1: Δc + 3Δd ∈ {±1, ±3}. Расстояние 2: (±2; 0) → ±2, (0; ±2) → ±6, (±1; ±1) → ±2, ±4. Ни одно не ≡ 5 (mod 10).","f":[]},{"t":"Расстояние 3: Δc = 2, Δd = 1 ⇒ (11; 3) = из пары (3; 2). Ответ: 3.","f":["est_ex"]}]}],"tags":["ops","eq"],"facts":["lin_map","mod_def","est_ex"],"note":"","n":63},{"id":"91755","d":3,"from":"PDF №014","stem":"Над парами целых чисел проводится операция: из пары (a;b) получается пара (3a+ b;3b+ a).","parts":[{"l":"а","q":"Можно ли из какой-то пары получить пару (5;− 1)?","ak":"yn","av":"ДА","steps":[{"t":"3a + b = 5, a + 3b = −1 ⇒ a = 2, b = −1.","f":["lin_map"]},{"t":"(2; −1) → (6 − 1; −3 + 2) = (5; −1). Ответ: да.","f":[]}]},{"l":"б","q":"Верно ли, что если пара (c;d) может быть получена из какой-то пары с помощью данной операции, то и пара (c− d;d− c) тоже может быть получена из какой-то пары с помощью данной операции?","ak":"yn","av":"ДА","steps":[{"t":"(c; d) = (3a + b; a + 3b) ⇒ c − d = 2(a − b), d − c = 2(b − a).","f":[]},{"t":"Пара (a − b; b − a): (3(a−b) + (b−a); (a−b) + 3(b−a)) = (2(a−b); 2(b−a)). Ответ: да.","f":["lin_map"]}]},{"l":"в","q":"Зададим расстояние между парами целых чисел (a;b) и (c;d) выражением √((a − c)² + (b − d)²) Найдите наименьшее расстояние от пары (9;1) до пары, полученной из какой-то пары с помощью данной операции.","ak":"num","av":"√2","steps":[{"t":"a = (3c − d)/8, b = (3d − c)/8 целые ⇔ d ≡ 3c (mod 8).","f":["lin_map"]},{"t":"Для (9; 1): 3·9 = 27 ≡ 3, а d = 1 — не подходит. Нужно Δd − 3Δc ≡ 2 (mod 8).","f":["mod_def"]},{"t":"Расстояние 1: (0; ±1) даёт ±1, (±1; 0) даёт ∓3 — не 2.","f":[]},{"t":"Расстояние √2: Δc = −1, Δd = −1 даёт −1 + 3 = 2 ✓ ⇒ пара (8; 0) = из (3; −1). Меньших расстояний (кроме 1) между целыми точками нет. Ответ: √2.","f":["est_ex"]}]}],"tags":["ops","eq"],"facts":["lin_map","mod_def","est_ex"],"note":"","n":64},{"id":"105261","d":3,"from":"PDF №015","stem":"Есть четыре коробки: в первой коробке 101 камень, во второй — 102 камня, в третьей — 103 камня, а в четвёртой камней нет. За один ход берут по одному камню из любых трех коробок и кладут в оставшуюся. Сделали некоторое количество таких ходов.","parts":[{"l":"а","q":"Может ли в первой коробке оказаться 97 камней, во второй — 102 камня, в третьей — 103 камней, а в четвёртой 4 камня?","ak":"yn","av":"ДА","steps":[{"t":"Ход: три коробки −1, четвёртая +3 ≡ −1 (mod 4) ⇒ все разности по mod 4 сохраняются.","f":["invariant"]},{"t":"Если в коробку i сделано mᵢ ходов из M, её изменение 4mᵢ − M. Нужно (−4, 0, 0, +4): M = 4, m = (0, 1, 1, 2).","f":[]},{"t":"Пример: в 4-ю: (100,101,102,3); в 4-ю: (99,100,101,6); во 2-ю: (98,103,100,5); в 3-ю: (97,102,103,4). Ответ: да.","f":[]}]},{"l":"б","q":"Может ли в четвертой коробке быть 306 камней?","ak":"yn","av":"НЕТ","steps":[{"t":"Было 102 − 101 = 1 (mod 4); в (0, 0, 0, 306) разность 0. Инвариант нарушен. Ответ: нет.","f":["invariant"]}]},{"l":"в","q":"Какое максимальное число камней может быть в четвертой коробке?","ak":"num","av":"303","steps":[{"t":"Остатки первых трёх коробок по mod 4 всегда попарно различны (разности 1, 2 — инвариант) ⇒ эти три числа различны ⇒ их сумма ≥ 0 + 1 + 2 = 3.","f":["invariant"]},{"t":"Значит, в четвёртой ≤ 306 − 3 = 303.","f":["est_ex"]},{"t":"Пример: 101 ход в четвёртую коробку: (0, 1, 2, 303). Ответ: 303.","f":[]}]}],"tags":["ops"],"facts":["invariant","mod_def","est_ex"],"note":"","n":65},{"id":"159718","d":3,"from":"PDF №018","stem":"На доске написано n единиц подряд. Между некоторыми из них расставляют знаки «+» и считают получившуюся сумму. Например, если было написано 10 единиц, то можно получить сумму 136: 1+ 1+ 111+ 11 +11 +1 = 136.","parts":[{"l":"а","q":"Можно ли получить сумму 132, если n= 60?","ak":"yn","av":"ДА","steps":[{"t":"Пусть a единиц «1» и b чисел «11»: a + 11b = 132 (сумма), a + 2b = 60 (единиц в записи).","f":["lin_dioph"]},{"t":"Вычитая: 9b = 72 ⇒ b = 8, a = 44. Пример: 44 слагаемых «1» и 8 слагаемых «11». Ответ: да.","f":[]}]},{"l":"б","q":"Можно ли получить сумму 132, если n= 80?","ak":"yn","av":"НЕТ","steps":[{"t":"Число из k единиц ≡ k (mod 9) ⇒ сумма ≡ n (mod 9).","f":["repunit"]},{"t":"132 ≡ 1+3+2 = 6 (mod 9), а 80 ≡ 8. Ответ: нет.","f":["ds_mod9"]}]},{"l":"в","q":"Для скольких значений n можно получить сумму 132?","ak":"num","av":"14","steps":[{"t":"n ≡ 6 (mod 9) и n ≤ 132 (больше единиц, чем сумма, быть не может).","f":["repunit"]},{"t":"Наименьшее n: 132 = 111 + 11 + 10·1 — единиц 3 + 2 + 10 = 15. Без 111: 11b + a = 132 даёт единиц 132 − 9b ≥ 24. Меньше 15 нельзя.","f":[]},{"t":"Все n = 15, 24, 33, …, 132 реализуются: от 132 единиц заменяем по 11 единиц на «11» (минус 9 единиц), и 15 = 111 + 11 + 10 единиц.","f":[]},{"t":"Количество: (132 − 15)/9 + 1 = 14. Ответ: 14.","f":["est_ex"]}]},{"l":"г","q":"Какую наибольшую четырёхзначную сумму можно получить, если n = 50?","ak":"num","av":"9554","steps":[{"t":"Слагаемые: a штук 1111, b штук 111, c штук 11, d единиц: 4a + 3b + 2c + d = 50. Сумма = 50 + 1107a + 108b + 9c = 50 + 9(123a + 12b + c).","f":["lin_dioph"]},{"t":"Сумма ≤ 9999 ⇒ 123a + 12b + c ≤ 1105 ⇒ a ≤ 8.","f":[]},{"t":"При a = 8 осталось 18 единиц: 12b + c при 3b + 2c ≤ 18 максимально при b = 6: 984 + 72 = 1056. При a ≤ 7 меньше.","f":["est_ex"]},{"t":"Сумма 50 + 9·1056 = 9554 = 8·1111 + 6·111. Ответ: 9554.","f":[]}]}],"tags":["digits"],"facts":["repunit","ds_mod9","lin_dioph","est_ex"],"note":"","n":66},{"id":"125976","d":3,"from":"PDF №022","stem":"На доске записано k последовательных натуральных чисел. Оказалось, что среди них чисел, делящихся на 20, меньше, чем чисел, делящихся на 23.","parts":[{"l":"а","q":"Могло ли среди записанных чисел быть ровно три числа, делящихся на 20?","ak":"yn","av":"ДА","steps":[{"t":"Кратных 23 хотя бы 4 ⇒ L ≥ 70; кратных 20 ровно 3 ⇒ L ≤ 79.","f":["div_count"]},{"t":"Пример: 23, 24, …, 92: кратные 23 — 23, 46, 69, 92; кратные 20 — 40, 60, 80. Ответ: да.","f":[]}]},{"l":"б","q":"Могло ли среди записанных чисел быть ровно десять чисел, делящихся на 20?","ak":"yn","av":"НЕТ","steps":[{"t":"10 кратных 20 ⇒ L ≤ 11·20 − 1 = 219. Не меньше 11 кратных 23 ⇒ L ≥ 10·23 + 1 = 231. Противоречие. Ответ: нет.","f":["div_count"]}]},{"l":"в","q":"Найдите наибольшее возможное значение k.","ak":"num","av":"139","steps":[{"t":"m кратных 20 и ≥ m + 1 кратных 23: 23m + 1 ≤ L ≤ 20m + 19 ⇒ m ≤ 6 ⇒ L ≤ 139.","f":["div_count"]},{"t":"При L = 139 и m = 6 отрезок начинается и кончается кратными 23, а начало ≡ 1 (mod 20): 23t ≡ 1 (mod 20) ⇒ t = 7, начало 161.","f":["mod_def"]},{"t":"Пример: 161, …, 299. Кратные 23: 161, 184, 207, 230, 253, 276, 299 (7); кратные 20: 180, 200, 220, 240, 260, 280 (6). Ответ: 139.","f":["est_ex"]}]}],"tags":["div"],"facts":["div_count","est_ex","mod_def"],"note":"","n":67},{"id":"159632","d":3,"from":"PDF №023","stem":"По кругу расставлено N различных натуральных чисел, каждое из которых не превосходит 400. Сумма любых четырёх идущих подряд чисел делится на 3, а сумма любых трёх идущих подряд чисел не делится на 3.","parts":[{"l":"а","q":"Может ли N быть равным 360?","ak":"yn","av":"НЕТ","steps":[{"t":"Суммы 4 подряд кратны 3 ⇒ aᵢ₊₄ ≡ aᵢ (mod 3).","f":["mod_shift"]},{"t":"Если какое-то число ≡ 0, то сумма трёх других из той же четвёрки ≡ 0 — запрещено. Значит, кратных 3 нет, а в каждой четвёрке два остатка 1 и два остатка 2 ⇒ чисел с остатком 1 и с остатком 2 поровну, по N/2.","f":["mod_def"]},{"t":"Чисел ≤ 400 с остатком 2: 2, 5, …, 398 — их 133 ⇒ N ≤ 266 \u003c 360. Ответ: нет.","f":[]}]},{"l":"б","q":"Может ли N быть равным 149?","ak":"yn","av":"НЕТ","steps":[{"t":"По кругу период 4 и период N ⇒ при нечётном N период 1: все остатки одинаковы, r. Тогда 4r ≡ 0 ⇒ r = 0 — а кратных 3 быть не может.","f":["mod_shift"]},{"t":"149 нечётно. Ответ: нет.","f":[]}]},{"l":"в","q":"Найдите наибольшее значение N.","ak":"num","av":"266","steps":[{"t":"Из пункта а: N ≤ 2·133 = 266.","f":["est_ex"]},{"t":"Пример: по кругу чередуем числа с остатком 1 (1, 4, …, 397 — берём 133 из 134) и с остатком 2 (2, 5, …, 398 — все 133). Тройки дают 1+2+1 = 4 или 2+1+2 = 5 (не кратны 3), четвёрки 6. Ответ: 266.","f":[]}]}],"tags":["div","est"],"facts":["mod_shift","mod_def","est_ex"],"note":"","n":68},{"id":"23745","d":3,"from":"PDF №027","stem":"На доске написано 100 различных натуральных чисел, сумма которых равна 5120.","parts":[{"l":"а","q":"Может ли оказаться, что на доске написано число 230?","ak":"yn","av":"НЕТ","steps":[{"t":"Остальные 99 чисел различны ⇒ их сумма ≥ 1 + … + 99 = 4950.","f":["sum_1n"]},{"t":"Вместе с 230: ≥ 5180 > 5120. Ответ: нет.","f":[]}]},{"l":"б","q":"Может ли оказаться, что на доске нет числа 14?","ak":"yn","av":"НЕТ","steps":[{"t":"Без 14 наименьшая сумма 100 различных: 1 + … + 101 − 14 = 5151 − 14 = 5137 > 5120. Ответ: нет.","f":["distinct_min"]}]},{"l":"в","q":"Какое наименьшее количество чисел, кратных 14, может быть на доске?","ak":"num","av":"4","steps":[{"t":"Пусть кратных 14 не больше 3. Тогда некратных ≥ 97. 97 наименьших некратных 14 — это числа 1…104 без 14, 28, …, 98: сумма 5460 − 392 = 5068.","f":["distinct_min"]},{"t":"Плюс ещё 3 числа, кратных 14 (≥ 14 + 28 + 42 = 84): сумма ≥ 5152 > 5120. Значит, кратных 14 хотя бы 4.","f":["est_ex"]},{"t":"Пример: 1…102 без 70, 84, 98 и число 119: сумма 5120, кратные 14 только 14, 28, 42, 56. Ответ: 4.","f":[]}]}],"tags":["est","div"],"facts":["sum_1n","distinct_min","est_ex"],"note":"","n":69},{"id":"91754","d":3,"from":"PDF №034","stem":"На сайте проводится опрос, кого из футболистов посетители сайта считают лучшим по итогам сезона. Каждый посетитель голосует за одного футболиста. На сайте отображается рейтинг каждого футболиста — доля голосов, отданных за него, в процентах, округленная до целого числа. Например, числа 9,3, 10,5 и 12,7 округляются до 9, 11 и 13 соответственно.","parts":[{"l":"а","q":"Всего проголосовало 13 посетителей сайта. Голоса распределились так, что рейтинг некоторого футболиста стал равным 31. Затем Вася проголосовал за этого футболиста. Каков теперь рейтинг футболиста с учётом голоса Васи?","ak":"num","av":"36","steps":[{"t":"30,5 ≤ 100v/13 \u003c 31,5 ⇒ 3,97 ≤ v \u003c 4,1 ⇒ v = 4.","f":["rounding"]},{"t":"После голоса Васи: 5/14 ≈ 35,7% → 36. Ответ: 36.","f":[]}]},{"l":"б","q":"Голоса распределяют между двумя футболистами. Может ли суммарный рейтинг быть больше 100?","ak":"yn","av":"ДА","steps":[{"t":"Пример: 8 голосов, 1 и 7: 12,5% → 13, 87,5% → 88. Сумма 101 > 100. Ответ: да.","f":["rounding"]}]},{"l":"в","q":"На сайте отображалось, что рейтинг некоторого футболиста равен 7. После того, как Вася отдал свой голос за этого футболиста, рейтинг стал равен 9. При каком наибольшем числе отданных за всех футболистов голосов, включая Васин голос, такое возможно?","ak":"num","av":"82","steps":[{"t":"Было N голосов, v за футболиста: 6,5 ≤ 100v/N \u003c 7,5; после: 8,5 ≤ 100(v+1)/(N+1) \u003c 9,5.","f":["rounding"]},{"t":"Отсюда 0,085(N+1) − 1 ≤ v \u003c 0,075N ⇒ 0,01N \u003c 0,915 ⇒ N ≤ 91 ⇒ v \u003c 0,075·91 \u003c 7 ⇒ v ≤ 6.","f":[]},{"t":"v + 1 ≥ 0,085(N + 1) ⇒ 7 ≥ 0,085(N+1) ⇒ N + 1 ≤ 82.","f":["est_ex"]},{"t":"Пример: N = 81, v = 6: 6/81 ≈ 7,4% → 7; 7/82 ≈ 8,5% → 9. Голосов с Васиным 82. Ответ: 82.","f":[]}]}],"tags":["avg"],"facts":["rounding","percent","est_ex"],"note":"","n":70},{"id":"125987","d":3,"from":"PDF №037","stem":"","parts":[{"l":"а","q":"Приведите пример семизначного числа, из которого, вычеркивая цифры, можно получить каждое из чисел: 206, 835, 930.","ak":"self","av":"Например, 2893506.","steps":[{"t":"Нужны цифры 2,0,6 / 8,3,5 / 9,3,0 в этом порядке. Общая 3 и 0: 2 8 9 3 5 0 6.","f":["subseq"]},{"t":"Проверка: 2…0 6 ✓; 8 3 5 ✓; 9 3 0 ✓.","f":[]}]},{"l":"б","q":"Существует ли восьмизначное число, из которого, вычеркивая цифры, можно получить каждое из чисел: 247, 345, 586, 812?","ak":"yn","av":"НЕТ","steps":[{"t":"В числах участвуют 8 разных цифр 2,4,7,3,5,8,6,1 ⇒ в восьмизначном каждая ровно один раз.","f":["subseq"]},{"t":"Порядок: 2 раньше 4 (247), 4 раньше 5 (345), 5 раньше 8 (586), 8 раньше 1 и 1 раньше 2 (812) ⇒ 2 раньше 2 — противоречие. Ответ: нет.","f":[]}]},{"l":"в","q":"Найдите наименьшее натуральное число, из которого можно получить все натуральные числа от 1 до 50, вычеркивая цифры.","ak":"num","av":"12341234506789","steps":[{"t":"Нужны 11, 22, 33, 44 ⇒ цифры 1–4 хотя бы по два раза; 5–9 и 0 хотя бы по разу ⇒ не меньше 8 + 6 = 14 цифр.","f":["subseq"]},{"t":"Чтобы число было наименьшим, при 14 цифрах в начале как можно меньшие цифры: 1 2 3 4, а затем снова 1 2 3 4 (для 21, 31, 41, 32, 42, 43).","f":[]},{"t":"0 нужен после 5 (для 50), 5 — после 1…4 (для 15…45), 6–9 — в конце по возрастанию. Поставить 0 раньше 5 нельзя без второго нуля (15 цифр — больше).","f":["est_ex"]},{"t":"Ответ: 12341234506789.","f":[]}]}],"tags":["digits"],"facts":["subseq","est_ex"],"note":"","n":71},{"id":"1104","d":3,"from":"PDF №041","stem":"С натуральным числом проводят следующую операцию: между каждыми двумя его соседними цифрами записывают сумму этих цифр. Например, из числа 194 получается число 1109134.","parts":[{"l":"а","q":"Приведите пример числа, из которого получается число 176148179.","ak":"self","av":"1689","steps":[{"t":"Разбираем 176148179: 1 | 7 | 6 | 14 | 8 | 17 | 9. Проверка: 1+6 = 7, 6+8 = 14, 8+9 = 17 ✓.","f":[]},{"t":"Исходное число 1689.","f":[]}]},{"l":"б","q":"Может ли из какого-нибудь числа получиться число 3107611090?","ak":"yn","av":"НЕТ","steps":[{"t":"Первая цифра 3, дальше сумма 3 + d ≥ 3: «1» нельзя, «10» ⇒ d = 7.","f":[]},{"t":"Дальше идёт сумма 7 + e ∈ [7; 16]: «6» мало, «61» много. Разбор невозможен. Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наибольшее число, кратное 11, может получиться из трехзначного числа?","ak":"num","av":"9167169","steps":[{"t":"Из abc получаем a (a+b) b (b+c) c. Наибольшие — семизначные (обе суммы двузначные) с a = 9.","f":["dec_repr"]},{"t":"Цифры: 9, 1, b−1, b, 1, b+c−10, c. Знакочередующаяся сумма: 9 − 1 + (b−1) − b + 1 − (b+c−10) + c = 18 − b.","f":["div_rules"]},{"t":"Делится на 11 ⇒ b = 7; c наибольшее — 9: 9167169.","f":["est_ex"]}]}],"tags":["digits","div"],"facts":["dec_repr","div_rules","est_ex"],"note":"","n":72},{"id":"175401","d":3,"from":"PDF №043","stem":"","parts":[{"l":"а","q":"Можно ли представить число 2043 в виде суммы двух различных натуральных чисел с одинаковой суммой цифр?","ak":"yn","av":"ДА","steps":[{"t":"Пример: 1017 + 1026 = 2043, суммы цифр 9 и 9. Ответ: да.","f":[]}]},{"l":"б","q":"Можно ли представить число 599 в виде суммы двух различных натуральных чисел с одинаковой суммой цифр?","ak":"yn","av":"НЕТ","steps":[{"t":"x + y = 599: в разряде единиц x₀ + y₀ = 9 (19 нельзя), в десятках тоже 9, в сотнях 5 — переносов нет.","f":["ds_carry"]},{"t":"S(x) + S(y) = 5 + 9 + 9 = 23 — нечётно ⇒ S(x) ≠ S(y). Ответ: нет.","f":[]}]},{"l":"в","q":"Найдите наименьшее натуральное число, которое можно представить в виде суммы семи различных натуральных чисел с одинаковой суммой цифр.","ak":"num","av":"231","steps":[{"t":"При сумме цифр s берём 7 наименьших чисел с этой суммой цифр.","f":["distinct_min"]},{"t":"s = 1…5: чисел \u003c 100 с такой суммой цифр только s + 1 ≤ 6 ⇒ нужно хотя бы одно ≥ 100. Наименьшие суммы: s=1: 1+10+100+…+10⁶; s=2: 2+11+20+101+110+200+1001; s=3: 399; s=4: 325; s=5: 5+14+23+32+41+50+104 = 269.","f":[]},{"t":"s = 6: 6+15+24+33+42+51+60 = 231; s = 7: 238; s = 8: 245; s = 9: 252; при s ≥ 10 ещё больше.","f":["est_ex"]},{"t":"Ответ: 231.","f":[]}]}],"tags":["digits"],"facts":["ds_mod9","ds_carry","est_ex"],"note":"","n":73},{"id":"26928","d":3,"from":"PDF №046","stem":"Каждое из четырёх последовательных натуральных чисел, последние цифры которых не равны нулю, поделили на его последнюю цифру. Сумма получившихся чисел равна S.","parts":[{"l":"а","q":"Может ли S быть равной 16 5/6?","ak":"yn","av":"ДА","steps":[{"t":"Пример: 12, 13, 14, 15: 12/2 + 13/3 + 14/4 + 15/5 = 6 + 4⅓ + 3½ + 3 = 16⅚. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли S быть равной 569 29/126?","ak":"yn","av":"НЕТ","steps":[{"t":"Знаменатель 126 = 2·7·9. Множитель 7 даёт только последняя цифра 7, множитель 9 — только цифра 9.","f":["fta"]},{"t":"Четыре подряд числа без нуля на конце имеют последние цифры d, d+1, d+2, d+3 ≤ 9 ⇒ с 7 и 9 это 6, 7, 8, 9: числа 10k+6, …, 10k+9.","f":[]},{"t":"S = 4 + 10k(1/6 + 1/7 + 1/8 + 1/9) = 4 + 1375k/252. Уравнение 4 + 1375k/252 = 569 29/126 ⇒ 1375k = 142438 — k не целое. Ответ: нет.","f":[]}]},{"l":"в","q":"Найдите наибольшее значение S, если каждое из исходных чисел было трёхзначным.","ak":"num","av":"2066,5","steps":[{"t":"Для чисел 10k+d, …, 10k+d+3: S = 4 + 10k·(1/d + 1/(d+1) + 1/(d+2) + 1/(d+3)). Больше всего при наибольшем k и d = 1.","f":["frac_monot"]},{"t":"k = 99 (числа 991–994): S = 4 + 990·(1 + 1/2 + 1/3 + 1/4) = 4 + 990·25/12 = 2066,5. Ответ: 2066,5.","f":["est_ex"]}]}],"tags":["digits"],"facts":["dec_repr","fta","frac_monot","est_ex"],"note":"","n":74},{"id":"159663","d":3,"from":"PDF №048","stem":"Для чисел A и B, состоящих из одинакового количества цифр, вычисляют S – сумму произведений соответствующих цифр. Например, для чисел A = 123 и B = 579 получается сумма S = 1⋅5 +2 ⋅7 +3 ⋅9= 46.","parts":[{"l":"а","q":"Существуют ли трёхзначные числа A и B, для которых S = 200?","ak":"yn","av":"ДА","steps":[{"t":"Пример: A = 977, B = 998: 9·9 + 7·9 + 7·8 = 81 + 63 + 56 = 200. Ответ: да.","f":[]}]},{"l":"б","q":"Существуют ли четырёхзначные числа A и B, для которых S = 320?","ak":"yn","av":"НЕТ","steps":[{"t":"Произведения цифр ≤ 81; следующее после 81 — 72. Нужно 4 произведения с суммой 320.","f":[]},{"t":"Три по 81 ⇒ четвёртое 77 — не произведение цифр. Не больше двух по 81 ⇒ сумма ≤ 81·2 + 72·2 = 306 \u003c 320. Ответ: нет.","f":[]}]},{"l":"в","q":"Верно ли, что любое натуральное число от 1 до 340 является суммой S для некоторых пятизначных чисел A и B?","ak":"yn","av":"ДА","steps":[{"t":"Любое число 0…81 = 9·u + 1·v (u ≤ 8, v ≤ 9) — два слагаемых-произведения.","f":[]},{"t":"n ≤ 323: n = 81q + r, q ≤ 3, r ≤ 80 — q слагаемых 9·9 и два слагаемых 9·u, 1·v: всего ≤ 5 разрядов.","f":[]},{"t":"n = 324…340: 81·3 + (81…97): 81…90 = 81 + v; 91 = 81 + 10 (2·5); 92 = 72 + 20; 93 = 72 + 21; 94 = 64 + 30; 95 = 81 + 14; 96 = 72 + 24; 97 = 81 + 16. Ответ: да.","f":["est_ex"]}]}],"tags":["digits"],"facts":["dec_repr","lin_dioph","est_ex"],"note":"","n":75},{"id":"159624","d":3,"from":"PDF №050","stem":"Ваня написал на доске трёхзначное число A. Серёжа переписал это число A, вычеркнул из него одну цифру и получил двузначное число B. Коля тоже переписал это число A, вычеркнул из него одну цифру (возможно, ту же самую, что и Серёжа) и получил двузначное число C.","parts":[{"l":"а","q":"Может ли быть верным равенство A = B ⋅C, если A> 150?","ak":"yn","av":"ДА","steps":[{"t":"Пример: A = 160, B = 16 (вычеркнули 0), C = 10 (вычеркнули 6): 16·10 = 160. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли быть верным равенство A = B ⋅C, если 540 ≤A \u003c 600?","ak":"yn","av":"НЕТ","steps":[{"t":"A = 5bc, b ≥ 4. Варианты B, C: 5b, 5c (начинаются с 5) или bc (≥ 40).","f":[]},{"t":"Если оба начинаются с 5: ≥ 50·50 = 2500. Иначе одно ≥ 40, другое ≥ 40: ≥ 1600 > 600. Ответ: нет.","f":[]}]},{"l":"в","q":"Найдите наибольшее число A, для которого может быть верным равенство A = B ⋅C.","ak":"num","av":"910","steps":[{"t":"A = abc. Если B и C оба начинаются с a: A ≥ 100a² ⇒ a = 1. При a ≥ 2 одно из них — bc.","f":["extreme"]},{"t":"A = (10a + x)(10b + c) \u003c 100(a + 1) ⇒ 10b + c \u003c 10 + 10/a. Для a = 9: bc ∈ {10, 11} ⇒ A ∈ {910, 911}.","f":[]},{"t":"910 = 91·10 ✓, 911 не подходит. Ответ: 910.","f":["est_ex"]}]}],"tags":["digits"],"facts":["dec_repr","extreme","est_ex"],"note":"","n":76},{"id":"91288","d":3,"from":"PDF №051","stem":"Из 24 последовательных нечётных чисел 1, 3, 5, …, 47 выбрали 9 различных чисел, которые записали в порядке возрастания. Пусть A — пятое по величине среди этих чисел, а B — их среднее арифметическое.","parts":[{"l":"а","q":"Может ли B − A равняться 2/9?","ak":"yn","av":"ДА","steps":[{"t":"Нужно: сумма 9 чисел = 9A + 2.","f":["mean"]},{"t":"Пример: 1, 3, 5, 7, 9, 11, 13, 15, 19: A = 9, сумма 83 = 81 + 2. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли B − A равняться 5/9?","ak":"yn","av":"НЕТ","steps":[{"t":"Сумма девяти нечётных — нечётна. 9A + 5 при нечётном A чётно. Ответ: нет.","f":["parity"]}]},{"l":"в","q":"Найдите наибольшее возможное значение B− A.","ak":"num","av":"40/3","steps":[{"t":"9(B − A) = Σ(aᵢ − A). Четыре меньших: aᵢ ≤ A − 2(5 − i) ⇒ их вклад ≤ −20. Четыре больших ≤ 41 + 43 + 45 + 47 = 176 ⇒ вклад ≤ 176 − 4A.","f":["distinct_min"]},{"t":"9(B − A) ≤ 156 − 4A, A ≥ 9 ⇒ ≤ 120 ⇒ B − A ≤ 40/3.","f":["est_ex"]},{"t":"Пример: 1, 3, 5, 7, 9, 41, 43, 45, 47: B = 201/9, B − A = 40/3. Ответ: 40/3.","f":[]}]}],"tags":["avg"],"facts":["mean","parity","est_ex","distinct_min"],"note":"","n":77},{"id":"126263","d":3,"from":"PDF №052","stem":"На доске записано 10 натуральных чисел, среди которых нет одинаковых. Оказалось, что среднее арифметическое любых трёх или пяти чисел из записанных является целым числом.","parts":[{"l":"а","q":"Могут ли среди записанных на доске чисел одновременно быть числа 305 и 1511?","ak":"yn","av":"НЕТ","steps":[{"t":"Сумма любых 3 кратна 3 ⇒ все числа сравнимы по mod 3; любых 5 ⇒ по mod 5 ⇒ по mod 15.","f":["mod_shift"]},{"t":"1511 − 305 = 1206 не делится на 15. Ответ: нет.","f":[]}]},{"l":"б","q":"Может ли одно из записанных на доске чисел быть квадратом другого, если среди записанных на доске чисел есть число 305?","ak":"yn","av":"НЕТ","steps":[{"t":"Все числа ≡ 305 ≡ 5 (mod 15). Если n ≡ 5, то n² ≡ 25 ≡ 10 ≢ 5. Ответ: нет.","f":["mod_def"]}]},{"l":"в","q":"Известно, что среди записанных на доске чисел есть число n и его квадрат n². Найдите наименьшее возможное значение n.","ak":"num","av":"6","steps":[{"t":"n² ≡ n (mod 15) ⇒ n(n − 1) делится на 3 и на 5 ⇒ n ≡ 0 или 1 по mod 3 и mod 5.","f":["mod_def"]},{"t":"n = 2, 3, 4, 5 не подходят; n = 6: 6 ≡ 0 (mod 3), 6 ≡ 1 (mod 5) ✓.","f":["est_ex"]},{"t":"Пример: 6, 21, 36, 51, 66, 81, 96, 111, 126, 141 (все ≡ 6 mod 15, есть 6 и 36). Ответ: 6.","f":[]}]}],"tags":["div"],"facts":["mod_shift","mod_def","mod_sq","est_ex"],"note":"","n":78},{"id":"125979","d":3,"from":"PDF №053","stem":"На доске записано 10 натуральных чисел, среди которых нет одинаковых. Оказалось, что среднее арифметическое любых четырёх или семи чисел из записанных является целым числом.","parts":[{"l":"а","q":"Могут ли среди записанных на доске чисел одновременно быть числа 563 и 1417?","ak":"yn","av":"НЕТ","steps":[{"t":"Любые 4 и любые 7 ⇒ все числа сравнимы по mod 4 и mod 7, т.е. по mod 28.","f":["mod_shift"]},{"t":"1417 − 563 = 854 = 2·7·61 — не делится на 4. Ответ: нет.","f":[]}]},{"l":"б","q":"Может ли одно из записанных на доске чисел быть квадратом натурального числа, если среди записанных на доске чисел есть число 563?","ak":"yn","av":"НЕТ","steps":[{"t":"Все ≡ 563 ≡ 3 (mod 28) ⇒ ≡ 3 (mod 4), а квадрат даёт остаток 0 или 1 по mod 4. Ответ: нет.","f":["mod_sq"]}]},{"l":"в","q":"Известно, что среди записанных на доске чисел есть число 1 и квадрат натурального числа n, большего 1. Найдите наименьшее возможное значение n.","ak":"num","av":"13","steps":[{"t":"Есть 1 ⇒ все ≡ 1 (mod 28) ⇒ n² ≡ 1 (mod 4) и (mod 7) ⇒ n нечётно и n ≡ ±1 (mod 7).","f":["mod_sq"]},{"t":"n = 3, 5, 7, 9, 11 не подходят; n = 13 ≡ 6 (mod 7) ✓ (169 = 6·28 + 1).","f":["est_ex"]},{"t":"Пример: 1, 29, 57, 85, 113, 141, 169, 197, 225, 253. Ответ: 13.","f":[]}]}],"tags":["div"],"facts":["mod_shift","mod_sq","mod_def","est_ex"],"note":"","n":79},{"id":"1312","d":3,"from":"PDF №054","stem":"На доске написано 10 различных натуральных чисел. Среднее арифметическое шести наименьших из них равно 5, а среднее арифметическое шести наибольших равно 15.","parts":[{"l":"а","q":"Может ли наименьшее из этих десяти чисел равняться 3?","ak":"yn","av":"НЕТ","steps":[{"t":"a₁ + … + a₆ = 30. Если a₁ = 3, то сумма ≥ 3 + 4 + … + 8 = 33 > 30. Ответ: нет.","f":["distinct_min"]}]},{"l":"б","q":"Может ли среднее арифметическое всех десяти чисел равняться 11?","ak":"yn","av":"НЕТ","steps":[{"t":"Сумма всех = 30 + 90 − (a₅ + a₆). Среднее 11 ⇒ a₅ + a₆ = 10.","f":["mean"]},{"t":"a₁ + … + a₄ = 20 ≤ 4a₅ − 10 ⇒ a₅ ≥ 8 ⇒ a₅ + a₆ ≥ 17. Противоречие. Ответ: нет.","f":["distinct_min"]}]},{"l":"в","q":"Найдите наибольшее значение среднего арифметического всех десяти чисел.","ak":"num","av":"10,5","steps":[{"t":"Минимизируем s = a₅ + a₆: 30 − s ≤ 4a₅ − 10 и a₅ ≤ (s − 1)/2.","f":["distinct_min"]},{"t":"s = 14: a₅ ≤ 6, a₁…a₄ = 16 > 4·6 − 10 = 14 — нельзя. s ≥ 15 ⇒ сумма ≤ 120 − 15 = 105.","f":["est_ex"]},{"t":"Пример: 2, 3, 4, 6, 7, 8, 9, 10, 11, 45 — среднее 10,5. Ответ: 10,5.","f":[]}]},{"l":"г","q":"На доске написано 11 различных натуральных чисел. Среднее арифметическое шести наименьших из них равно 5, а среднее арифметическое шести наибольших из них равно 15. Пусть B — шестое по величине число, а S — среднее арифметическое всех одиннадцати чисел. Найдите наибольшее значение выражения S− B.","ak":"num","av":"24/11","steps":[{"t":"11 чисел: a₁…a₆ = 30, a₆…a₁₁ = 90 ⇒ сумма = 120 − B, S − B = (120 − 12B)/11.","f":["mean"]},{"t":"a₁…a₅ = 30 − B ≤ 5B − 15 ⇒ B ≥ 7,5 ⇒ B ≥ 8.","f":["distinct_min"]},{"t":"B = 8: S − B = 24/11. Пример: 1, 3, 5, 6, 7, 8, 9, 10, 11, 12, 40. Ответ: 24/11.","f":["est_ex"]}]}],"tags":["avg"],"facts":["mean","distinct_min","est_ex"],"note":"","n":80},{"id":"159994","d":3,"from":"PDF №056","stem":"В школах №1 и №2 учащиеся писали тест. Из каждой школы тест писали по крайней мере 2 учащихся. Каждый учащийся, писавший тест, набрал натуральное количество баллов. Оказалось, что в каждой школе средний балл за тест был целым числом, причем в школе №2 средний балл равнялся 42. Один из учащихся, писавших тест, перешёл из школы №1 в школу №2, а средние баллы за тест были пересчитаны в обеих школах. В результате средний балл в школе №1 уменьшился на 10%, средний балл в школе №2 также уменьшился на 10%.","parts":[{"l":"а","q":"Сколько учащихся могло писать тест в школе №2 изначально?","ak":"num","av":"4","steps":[{"t":"Школа №2: n₂ учеников, среднее 42, пришёл ученик с x баллами: (42n₂ + x)/(n₂ + 1) = 37,8 ⇒ x = 37,8 − 4,2n₂.","f":["mean_move"]},{"t":"x > 0 ⇒ n₂ ≤ 8; x целое ⇒ 0,2n₂ даёт дробную часть 0,8 ⇒ n₂ ≡ 4 (mod 5) ⇒ n₂ = 4, x = 21.","f":[]},{"t":"Пример существует (например, школа №1: 5 учеников со средним 15). Ответ: 4.","f":[]}]},{"l":"б","q":"Каждый учащийся школы №2, писавший тест, набрал больше баллов, чем перешедший в неё учащийся школы №1. Какое наибольшее количество баллов мог набрать учащийся школы №2?","ak":"num","av":"102","steps":[{"t":"В школе №2 четыре ученика, сумма 168. Каждый > 21 ⇒ ≥ 22.","f":[]},{"t":"Наибольший ≤ 168 − 3·22 = 102. Пример: 22, 22, 22, 102. Ответ: 102.","f":["est_ex"]}]},{"l":"в","q":"Какое наибольшее количество участников могло писать тест в школе №1 изначально?","ak":"num","av":"96","steps":[{"t":"Школа №1: (m₁n₁ − 21)/(n₁ − 1) = 0,9m₁ ⇒ m₁(n₁ + 9) = 210.","f":["mean_move"]},{"t":"Сумма баллов m₁n₁ ≥ 21 + (n₁ − 1) ⇒ m₁ ≥ 2 при больших n₁. n₁ + 9 = 210 (m₁ = 1) не подходит: 201 \u003c 221.","f":["est_ex"]},{"t":"n₁ + 9 = 105, m₁ = 2: n₁ = 96, сумма 192 = 21 + 171 (76 двоек и 19 единиц). После ухода: 171/95 = 1,8 = 0,9·2 ✓. Ответ: 96.","f":[]}]}],"tags":["avg"],"facts":["mean_move","percent","lin_dioph","est_ex"],"note":"","n":81},{"id":"125982","d":3,"from":"PDF №057","stem":"На доске записано 10 натуральных чисел, среди которых нет одинаковых. Оказалось, что среднее арифметическое любых трех, четырех, пяти или шести чисел из записанных является целым числом. Одно из записанных чисел равно 30 035.","parts":[{"l":"а","q":"Может ли среди записанных на доске чисел быть число 325?","ak":"yn","av":"НЕТ","steps":[{"t":"Среднее любых 3, 4, 5, 6 — целое ⇒ все числа сравнимы по mod 3, 4, 5, 6 ⇒ по mod 60.","f":["mod_shift"]},{"t":"30035 ≡ 35 (mod 60), а 325 ≡ 25. Ответ: нет.","f":[]}]},{"l":"б","q":"Может ли отношение двух записанных на доске чисел равняться 7?","ak":"yn","av":"НЕТ","steps":[{"t":"x = 7y и x ≡ y (mod 60) ⇒ 6y ≡ 0 (mod 60) ⇒ y кратно 10.","f":["mod_def"]},{"t":"Но y ≡ 35 (mod 60) — нечётно. Ответ: нет.","f":[]}]},{"l":"в","q":"Отношение двух записанных на доске чисел является целым числом n. Найдите наименьшее возможное значение n.","ak":"num","av":"13","steps":[{"t":"x = ny ⇒ (n − 1)y ≡ 0 (mod 60). y ≡ 35 (mod 60) ⇒ y нечётно и не кратно 3 ⇒ НОД(y, 60) = 5 ⇒ n − 1 кратно 12 ⇒ n ≥ 13.","f":["div_comp"]},{"t":"Пример: 35 и 455 = 13·35 (≡ 35 mod 60), 30035 и ещё 7 чисел ≡ 35 (mod 60). Ответ: 13.","f":["est_ex"]}]}],"tags":["div"],"facts":["mod_shift","div_comp","mod_def","est_ex"],"note":"","n":82},{"id":"130185","d":3,"from":"PDF №058","stem":"На доске написано 20 натуральных необязательно различных чисел, каждое из которых не превосходит 50. Одно или несколько из чисел на доске увеличили на 1. Числа, которые после этого оказались равны 51, с доски стёрли.","parts":[{"l":"а","q":"Могло ли среднее арифметическое всех чисел на доске уменьшиться?","ak":"yn","av":"ДА","steps":[{"t":"Пример: 50 и 19 единиц: среднее 69/20. Увеличили 50 → 51, стёрли. Осталось 19 единиц, среднее 1 — уменьшилось. Ответ: да.","f":[]}]},{"l":"б","q":"Могло ли быть так, что сначала среднее арифметическое было равно 24, а потом стало равно 17?","ak":"yn","av":"НЕТ","steps":[{"t":"Сумма 480. Пусть стёрли k чисел (были 50), остальные увеличили суммарно на t ≤ 20 − k.","f":["mean"]},{"t":"(480 − 50k + t)/(20 − k) = 17 ⇒ t = 33k − 140 ≥ 0 ⇒ k ≥ 5, но t ≤ 20 − k ⇒ 34k ≤ 160 ⇒ k ≤ 4. Ответ: нет.","f":[]}]},{"l":"в","q":"Чему может быть равно наименьшее среднее арифметическое чисел, оставшихся на доске, если изначально оно было равно 24?","ak":"num","av":"30/11","steps":[{"t":"Среднее (480 − 50k + t)/(20 − k) ≥ (480 − 50k)/(20 − k) = 50 − 520/(20 − k) — убывает с ростом k.","f":["mean"]},{"t":"Остальные 20 − k чисел ≥ 1: 480 − 50k ≥ 20 − k ⇒ k ≤ 9. При k = 9: 30/11.","f":["est_ex"]},{"t":"Пример: девять 50, десять 1 и одно 20 (сумма 480). Увеличили все 50 и стёрли: среднее 30/11. Ответ: 30/11.","f":[]}]}],"tags":["avg"],"facts":["mean","est_ex"],"note":"","n":83},{"id":"130188","d":3,"from":"PDF №059","stem":"На доске написано 30 натуральных необязательно различных чисел, каждое из которых больше 16, но не превосходит 56. Среднее арифметическое написанных чисел равно 23. Вместо каждого из чисел на доске написали число, в два раза меньшее первоначального. Числа, которые после этого оказались меньше 9, с доски стёрли.","parts":[{"l":"а","q":"Могло ли оказаться так, что среднее арифметическое чисел, оставшихся на доске, больше 21?","ak":"yn","av":"ДА","steps":[{"t":"Стираются только числа 17 (17/2 = 8,5 \u003c 9). Пусть их k. Среднее оставшихся: (690 − 17k)/(2(30 − k)).","f":["mean"]},{"t":"> 21 ⇔ 25k > 570 ⇔ k ≥ 23. Пример: 23 числа 17, шесть 43 и одно 41: среднее после 299/14 ≈ 21,36. Ответ: да.","f":[]}]},{"l":"б","q":"Могло ли среднее арифметическое оставшихся на доске чисел оказаться больше 20, но меньше 21?","ak":"yn","av":"НЕТ","steps":[{"t":"g(k) = (690 − 17k)/(60 − 2k) возрастает по k.","f":["frac_monot"]},{"t":"k = 22: 19,75 ≤ 20; k = 23: ≈ 21,36 > 21. Значений между 20 и 21 нет. Ответ: нет.","f":[]}]},{"l":"в","q":"Найдите наибольшее возможное значение среднего арифметического чисел, которые остались на доске.","ak":"num","av":"26,5","steps":[{"t":"Оставшиеся 30 − k чисел ≤ 56: 690 − 17k ≤ 56(30 − k) ⇒ k ≤ 25.","f":["est_ex"]},{"t":"k = 25: пять чисел по 53, среднее после 265/10 = 26,5. Ответ: 26,5.","f":[]}]}],"tags":["avg"],"facts":["mean","frac_monot","est_ex"],"note":"","n":84},{"id":"127782","d":3,"from":"PDF №063","stem":"Для любых трёх натуральных чисел a, b и c (необязательно различных) вычисляют четвёртое число d по формуле: d = a² + b² + c² − ab − bc − ac.","parts":[{"l":"а","q":"Существуют ли a, b и c, для которых d = 19?","ak":"yn","av":"ДА","steps":[{"t":"d = x² + xy + y², x = a − b, y = b − c.","f":["squares_sum"]},{"t":"x = 3, y = 2: 9 + 6 + 4 = 19; a = 6, b = 3, c = 1. Ответ: да.","f":[]}]},{"l":"б","q":"Существуют ли a, b и c, для которых d = 58?","ak":"yn","av":"НЕТ","steps":[{"t":"Если x или y нечётно, x² + xy + y² нечётно. 58 чётно ⇒ x, y чётные ⇒ d кратно 4.","f":["parity"]},{"t":"58 не делится на 4. Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наибольшее значение может принимать d, если a, b и c — двузначные числа и d делится на 4?","ak":"num","av":"7744","steps":[{"t":"d кратно 4 ⇒ x, y чётные ⇒ a, b, c одной чётности ⇒ наибольшая разность D ≤ 98 − 10 = 88.","f":["parity"]},{"t":"d = ½(D² + p² + q²), p + q = D ⇒ d ≤ D² ≤ 7744.","f":["squares_sum"]},{"t":"Пример: 98, 10, 10 ⇒ d = 88² = 7744. Ответ: 7744.","f":["est_ex"]}]}],"tags":["eq"],"facts":["squares_sum","parity","est_ex"],"note":"","n":85},{"id":"30820","d":3,"from":"PDF №066","stem":"По кругу расставлено N различных натуральных чисел, каждое из которых меньше 365. Сумма любых четырёх идущих подряд чисел делится на 4, а сумма любых трёх идущих подряд чисел нечётна.","parts":[{"l":"а","q":"Может ли N быть равным 200?","ak":"yn","av":"НЕТ","steps":[{"t":"Суммы трёх подряд нечётны ⇒ aᵢ₊₃ ≡ aᵢ (mod 2); суммы четырёх кратны 4 ⇒ aᵢ₊₄ ≡ aᵢ (mod 4) ⇒ чётность имеет период 1 ⇒ все одной чётности ⇒ все нечётные.","f":["mod_shift"]},{"t":"Нечётных чисел меньше 365 всего 182 \u003c 200. Ответ: нет.","f":[]}]},{"l":"б","q":"Может ли N быть равным 109?","ak":"yn","av":"НЕТ","steps":[{"t":"При нечётном N остатки по mod 4 имеют период НОД(4, N) = 1 ⇒ все числа одинаковы по mod 4.","f":["mod_shift"]},{"t":"Нечётных \u003c 365 с одним остатком по mod 4 — 91 штука \u003c 109. Ответ: нет.","f":[]}]},{"l":"в","q":"Найдите наибольшее значение N.","ak":"num","av":"182","steps":[{"t":"Все числа нечётны ⇒ N ≤ 182.","f":["est_ex"]},{"t":"Пример: по кругу чередуем числа ≡ 1 (1, 5, …, 361) и ≡ 3 (3, 7, …, 363) mod 4. Четвёрка: 1+3+1+3 ≡ 0 (mod 4), тройка нечётна. Ответ: 182.","f":[]}]}],"tags":["div","est"],"facts":["mod_shift","parity","est_ex"],"note":"","n":86},{"id":"776","d":3,"from":"Школково","stem":"Последовательность a1, a2, …, an, где n ≥ 3, состоит из натуральных чисел. При этом каждый член последовательности, кроме первого и последнего, больше среднего арифметического соседних с ним членов.","parts":[{"l":"а","q":"Приведите пример такой последовательности, состоящей из пяти членов, сумма которых равна 60.","ak":"self","av":"Например, 10, 13, 14, 13, 10.","steps":[{"t":"Условие ⇔ разности соседних членов строго убывают.","f":["ap"]},{"t":"10, 13, 14, 13, 10: разности 3, 1, −1, −3; сумма 60.","f":[]}]},{"l":"б","q":"Может ли такая последовательность состоять из пяти членов и содержать два одинаковых числа?","ak":"yn","av":"ДА","steps":[{"t":"В примере из а) есть одинаковые числа (10 и 10, 13 и 13). Ответ: да.","f":[]}]},{"l":"в","q":"Какое наименьшее значение может принимать сумма членов такой последовательности при n= 8?","ak":"num","av":"36","steps":[{"t":"Разности d₁ > d₂ > … > d₇ — целые. Пусть d₄ = t (можно считать t ≥ 0, иначе развернём). Тогда d₁ ≥ t + 3, d₂ ≥ t + 2, d₃ ≥ t + 1 и d₅ ≤ t − 1, d₆ ≤ t − 2, d₇ ≤ t − 3.","f":[]},{"t":"a₁ + … + a₄ = 4a₁ + 3d₁ + 2d₂ + d₃ ≥ 4 + 3(t+3) + 2(t+2) + (t+1) = 18 + 6t; a₅ + … + a₈ = 4a₈ − d₅ − 2d₆ − 3d₇ ≥ 4 + (1−t) + 2(2−t) + 3(3−t) = 18 − 6t. Сумма ≥ 36.","f":["est_ex"]},{"t":"Пример: 1, 4, 6, 7, 7, 6, 4, 1. Ответ: 36.","f":[]}]}],"tags":["seq"],"facts":["ap","est_ex"],"note":"","n":87},{"id":"2298","d":3,"from":"Школково","stem":"Пусть n — натуральное трёхзначное число, в десятичной записи которого нет нулей.","parts":[{"l":"а","q":"Приведите пример такого n, что его отношение к произведению его цифр равно 109/18.","ak":"self","av":"436: 436/(4·3·6) = 436/72 = 109/18.","steps":[{"t":"n кратно 109: 218, 327, 436, … Проверяем: 436/72 = 109/18 ✓.","f":[]}]},{"l":"б","q":"Может ли отношение n к произведению его цифр быть равно 113/18?","ak":"yn","av":"НЕТ","steps":[{"t":"113 — простое, произведение цифр на него не делится ⇒ n кратно 113: 113, 226, 339, 452, 565, 678, 791.","f":["fta"]},{"t":"Отношения: 113/3, 113/12, 113/27, 113/20, 113/30, 113/56, 113/9 — нигде не 18. Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наибольшее значение может принимать отношение n к произведению его цифр, если это отношение равно несократимой дроби со знаменателем 18?","ak":"num","av":"631/18","steps":[{"t":"Знаменатель 18 ⇒ произведение P цифр кратно 18. Если P ≥ 36, отношение ≤ 999/36 \u003c 28.","f":["est_ex"]},{"t":"P = 18: цифры {1,2,9}, {1,3,6}, {2,3,3}. Несократимость: n нечётно и не кратно 3 — подходят 631, 613, 361, 163, 323, 233.","f":[]},{"t":"Наибольшее — 631/18. Ответ: 631/18.","f":[]}]}],"tags":["digits"],"facts":["fta","frac_monot","est_ex"],"note":"","n":88},{"id":"2441","d":3,"from":"Школково","stem":"С натуральным числом проводят операцию: между каждыми двумя соседними цифрами записывают их сумму (например, из 194 получается 1109134).","parts":[{"l":"в","q":"Какое наибольшее число, кратное 9, может получиться из трехзначного числа, в десятичной записи которого нет девяток?","ak":"num","av":"8168157","steps":[{"t":"Из abc получаем a (a+b) b (b+c) c. По mod 9 оно ≡ a + (a+b) + b + (b+c) + c = 2a + 3b + 2c.","f":["ds_mod9"]},{"t":"Девяток нет ⇒ a = 8 — наибольшая первая цифра; затем b = 8 (a + b = 16 — наибольшее).","f":[]},{"t":"2·8 + 24 + 2c ≡ 0 (mod 9) ⇒ c = 7: 8168157. Ответ: 8168157.","f":["est_ex"]}]}],"tags":["digits","div"],"facts":["ds_mod9","dec_repr","est_ex"],"note":"","n":89},{"id":"2448","d":3,"from":"Школково","stem":"Каждый из 28 студентов написал или одну из двух контрольных работ, или обе контрольные работы. За каждую работу можно было получить целое число баллов от 0 до 20 включительно. По каждой из двух работ в отдельности средний балл составил 15. Затем каждый студент назвал наивысший из своих баллов. При этом если студент писал одну работу, то он назвал балл за нее. Среднее арифметическое названных баллов равно S.","parts":[{"l":"а","q":"Приведите пример, когда S \u003c 15.","ak":"self","av":"Например: 2 студента писали обе работы на 20 и 20, по 13 студентов — только одну, их суммы баллов по 185. Тогда S = 410/28 \u003c 15.","steps":[{"t":"Сумма названных = (сумма всех баллов) − (сумма меньших баллов у писавших обе).","f":["mean"]},{"t":"2 студента написали обе на (20; 20), по 13 — только первую и только вторую с суммами 15·15 − 40 = 185. Названо 40 + 185 + 185 = 410, S ≈ 14,6.","f":[]}]},{"l":"б","q":"Могло ли значение S быть равным 5?","ak":"yn","av":"НЕТ","steps":[{"t":"z — писали обе. Все баллы 15(28 + z), минимум у писавших обе ≤ 20 ⇒ названо ≥ 420 + 15z − 20z = 420 − 5z ≥ 280.","f":["mean"]},{"t":"S ≥ 10 > 5. Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наименьшее значение могло принимать S, если обе контрольные писали только 10 студентов?","ak":"num","av":"185/14","steps":[{"t":"z = 10: названо ≥ 420 − 50 = 370 ⇒ S ≥ 370/28 = 185/14.","f":["est_ex"]},{"t":"Пример: 10 студентов (20; 20), по 9 — только одну работу с суммой 85. Ответ: 185/14.","f":[]}]}],"tags":["avg"],"facts":["mean","est_ex"],"note":"","n":90},{"id":"15851","d":3,"from":"Школково","stem":"В наборе 100 гирек весом 1, 2, …, 100 граммов. Их разложили на две кучки так, что в каждой кучке есть хотя бы одна гирька. Потом из второй кучки переложили одну гирьку в первую кучку. В результате средняя масса гирек в первой кучке увеличилась ровно на один грамм.","parts":[{"l":"а","q":"Могла ли первая кучка (до перекладывания) состоять из гирек с весами 1 г, 5 г, 9 г?","ak":"yn","av":"НЕТ","steps":[{"t":"Среднее 5, нужно (15 + x)/4 = 6 ⇒ x = 9 — эта гирька уже в первой кучке. Ответ: нет.","f":["mean_move"]}]},{"l":"б","q":"Мог ли средний вес гирек в первой кучке до перекладывания равняться 7,5 грамма?","ak":"yn","av":"НЕТ","steps":[{"t":"(7,5n + x)/(n + 1) = 8,5 ⇒ x = n + 8,5 — не целое. Ответ: нет.","f":[]}]},{"l":"в","q":"Какое максимальное количество гирек могло быть первоначально в первой кучке?","ak":"num","av":"65","steps":[{"t":"Среднее m, n гирек: x = m + n + 1 ≤ 100, m ≥ (n + 1)/2 ⇒ 3(n + 1)/2 ≤ 100 ⇒ n ≤ 65.","f":["mean_move"]},{"t":"Пример: 1…65 (среднее 33), перекладываем 99: (2145 + 99)/66 = 34. Ответ: 65.","f":["est_ex"]}]}],"tags":["avg"],"facts":["mean_move","est_ex"],"note":"","n":91},{"id":"18141","d":3,"from":"Школково","stem":"Несколько экспертов оценивают несколько кинофильмов. Каждый выставляет каждому фильму целое число баллов от 1 до 10, причём одному фильму все эксперты ставят различные оценки. Рейтинг фильма — среднее геометрическое оценок: ⁿ√(a₁·…·aₙ). Оказалось, что рейтинги всех фильмов — различные целые числа.","parts":[{"l":"а","q":"Могло ли быть 2 эксперта и 5 кинофильмов?","ak":"yn","av":"НЕТ","steps":[{"t":"Нужно a·b = r², a ≠ b из 1…10: 1·4, 1·9, 2·8, 4·9 — рейтинги только 2, 3, 4, 6.","f":["fta"]},{"t":"Разных рейтингов 4 \u003c 5. Ответ: нет.","f":[]}]},{"l":"б","q":"Могло ли быть 3 эксперта и 4 кинофильма?","ak":"yn","av":"ДА","steps":[{"t":"1·2·4 = 2³, 1·3·9 = 3³, 2·4·8 = 4³, 3·8·9 = 6³ — четыре фильма с рейтингами 2, 3, 4, 6. Ответ: да.","f":[]}]},{"l":"в","q":"При каком наибольшем количестве экспертов описанная ситуация возможна для одного кинофильма?","ak":"num","av":"4","steps":[{"t":"Произведение — n-я степень. Число 7 входит в первой степени ⇒ при n ≥ 2 его нет; 5 и 10 дают 5 не больше чем во 2-й степени ⇒ при n ≥ 3 их нет.","f":["fta"]},{"t":"Остаются 1, 2, 3, 4, 6, 8, 9: тройка входит не больше чем в 4-й степени ⇒ при n ≥ 5 убираем 3, 6, 9 — остаётся 4 числа \u003c 5.","f":["est_ex"]},{"t":"Пример n = 4: 3·6·8·9 = 1296 = 6⁴. Ответ: 4.","f":[]}]}],"tags":["div"],"facts":["gmean","fta","est_ex"],"note":"","n":92},{"id":"18500","d":3,"from":"Школково","stem":"В каждой клетке квадратной таблицы 6× 6 стоит натуральное число, меньшее 7. Вася в каждом столбце находит наименьшее число и складывает шесть найденных чисел. Петя в каждой строке находит наименьшее число и складывает шесть найденных чисел.","parts":[{"l":"а","q":"Может ли сумма у Пети получиться в два раза больше, чем сумма у Васи?","ak":"yn","av":"ДА","steps":[{"t":"Строка из единиц ⇒ в каждом столбце минимум 1 ⇒ у Васи 6.","f":["extreme"]},{"t":"Остальные строки: четыре из двоек и одна из троек ⇒ у Пети 1 + 8 + 3 = 12 = 2·6. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли сумма у Пети получиться в шесть раз больше, чем сумма у Васи?","ak":"yn","av":"НЕТ","steps":[{"t":"У Васи ≥ 6, у Пети ≤ 36. Равенство в 6 раз ⇒ Вася 6, Петя 36 ⇒ все числа 6 ⇒ Вася 36. Противоречие. Ответ: нет.","f":[]}]},{"l":"в","q":"В какое наибольшее число раз сумма у Пети может быть больше, чем сумма у Васи?","ak":"num","av":"31/6","steps":[{"t":"Пусть a — наименьшее число таблицы. В его строке минимум a ⇒ Петя ≤ a + 5·6. В каждом столбце числа ≥ a ⇒ Вася ≥ 6a.","f":["extreme"]},{"t":"Отношение ≤ (a + 30)/(6a) = 1/6 + 5/a ≤ 31/6.","f":["est_ex"]},{"t":"Пример: одна строка единиц, остальные шестёрки: 31/6. Ответ: 31/6.","f":[]}]}],"tags":["est"],"facts":["extreme","est_ex"],"note":"","n":93},{"id":"18501","d":3,"from":"Школково","stem":"Каждое из чисел 1, −2, −3, 4, −5, 7, −8, 9, 10, −11 по одному записывают на 10 карточках. Карточки переворачивают и на чистых сторонах снова пишут по одному каждое из этих чисел. Числа на каждой карточке складывают, а 10 сумм перемножают.","parts":[{"l":"а","q":"Может ли в результате получиться 0?","ak":"yn","av":"НЕТ","steps":[{"t":"Ноль — если на карточке x и −x. Противоположных чисел в наборе нет. Ответ: нет.","f":[]}]},{"l":"б","q":"Может ли в результате получиться 1?","ak":"yn","av":"НЕТ","steps":[{"t":"Нечётных чисел 6 на каждой стороне, всего 12, а карточек 10 ⇒ есть карточка с двумя нечётными — её сумма чётна.","f":["parity"]},{"t":"Произведение чётно ≠ 1. Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наименьшее целое неотрицательное число может в результате получиться?","ak":"num","av":"4","steps":[{"t":"Карточек «нечёт + нечёт» не меньше 2 ⇒ произведение делится на 4 и не равно 0 ⇒ ≥ 4.","f":["parity"]},{"t":"Пары: 1|−2, −2|1, −3|4, 4|−3, −5|7, 7|−5, −8|9, 9|−8, 10|−11, −11|10: суммы −1, −1, 1, 1, 2, 2, 1, 1, −1, −1 — произведение 4. Ответ: 4.","f":["est_ex"]}]}],"tags":["est","div"],"facts":["parity","est_ex"],"note":"","n":94},{"id":"19534","d":3,"from":"Школково","stem":"Есть синие и красные карточки. Всего карточек 50 штук. На каждой карточке написано натуральное число. Среднее арифметическое всех записанных на карточках чисел равно 16. Все числа на синих карточках разные. При этом любое число на синей карточке больше, чем любое число на красной. Числа на синих карточках увеличили в 2 раза, после чего среднее арифметическое всех записанных на карточках чисел стало равно 31,2.","parts":[{"l":"а","q":"Может ли быть 10 синих карточек?","ak":"yn","av":"ДА","steps":[{"t":"Сумма 800, после удвоения синих 1560 ⇒ синие 760, красные 40.","f":["mean"]},{"t":"10 синих: 40 красных по 1, синие 71, 72, …, 79, 85 (сумма 760). Ответ: да.","f":[]}]},{"l":"б","q":"Может ли быть 10 красных карточек?","ak":"yn","av":"НЕТ","steps":[{"t":"40 синих различных, каждое > наибольшего красного r ≥ 1: сумма ≥ 40r + 820 > 760. Ответ: нет.","f":["distinct_min"]}]},{"l":"в","q":"Какое наибольшее количество синих карточек может быть?","ak":"num","av":"35","steps":[{"t":"b синих, 50 − b красных с суммой 40 ⇒ наибольшее красное r ≥ 40/(50 − b); синих ≥ br + b(b + 1)/2 ≤ 760.","f":["distinct_min"]},{"t":"b = 36: r ≥ 3, 108 + 666 = 774 > 760 ⇒ b ≤ 35.","f":["est_ex"]},{"t":"Пример: красные десять 3 и пять 2; синие 4, 5, …, 37 и 63. Ответ: 35.","f":[]}]}],"tags":["avg"],"facts":["mean","distinct_min","est_ex"],"note":"","n":95},{"id":"21796","d":3,"from":"Школково","stem":"","parts":[{"l":"а","q":"Можно ли вычеркнуть несколько цифр из числа 123456789 так, чтобы получилось число, кратное 72?","ak":"yn","av":"ДА","steps":[{"t":"72 = 8·9: последние три цифры делятся на 8, сумма цифр — на 9.","f":["div_comp"]},{"t":"Из 123456789 получаем 3456 = 72·48. Ответ: да.","f":[]}]},{"l":"б","q":"Можно ли вычеркнуть несколько цифр из числа 846927531 так, чтобы получилось число, кратное 72?","ak":"yn","av":"НЕТ","steps":[{"t":"Число чётное ⇒ оканчивается на 8, 4, 6 или 2 (позиции 1, 2, 3, 5).","f":["div_rules"]},{"t":"Окончание на 2: остальные цифры из 8, 4, 6, 9 — нужна сумма ≡ 7 (mod 9), таких подмножеств нет. На 6: 846 (на 8 не делится). На 4 и 8 — 84, 4, 8 не кратны 9. Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наибольшее количество цифр можно вычеркнуть из числа 124875963 так, чтобы получилось число, кратное 72?","ak":"num","av":"5","steps":[{"t":"Трёхзначных (и короче) чисел, кратных 72, из 124875963 вычёркиванием не получить — перебор окончаний, как в б).","f":["subseq"]},{"t":"Четырёхзначное есть: 1296 = 72·18 ⇒ вычёркиваем 5 цифр. Ответ: 5.","f":["est_ex"]}]}],"tags":["div","digits"],"facts":["div_comp","div_rules","subseq","est_ex"],"note":"","n":96},{"id":"23301","d":3,"from":"Школково","stem":"Саша берёт пять различных натуральных чисел и проделывает с ними следующие операции. Сначала вычисляет среднее арифметическое первых двух чисел, затем среднее арифметическое результата и третьего числа, потом среднее арифметическое полученного результата и четвёртого числа, потом среднее арифметическое полученного результата и пятого числа — число A.","parts":[{"l":"а","q":"Может ли число A равняться среднему арифметическому пяти чисел, выбранных изначально?","ak":"yn","av":"ДА","steps":[{"t":"A = a/16 + b/16 + c/8 + d/4 + e/2.","f":[]},{"t":"Пример: 1, 3, 4, 5, 2: A = 1/16 + 3/16 + 1/2 + 5/4 + 1 = 3 = среднее (15/5). Ответ: да.","f":[]}]},{"l":"б","q":"Может ли число A быть в пять раз больше среднего арифметического пяти чисел, выбранных изначально?","ak":"yn","av":"НЕТ","steps":[{"t":"Все коэффициенты меньше 1 ⇒ A \u003c a + b + c + d + e = 5·среднее. Ответ: нет.","f":[]}]},{"l":"в","q":"В какое наибольшее целое число раз число A может быть больше среднего арифметического пяти чисел, выбранных изначально?","ak":"num","av":"2","steps":[{"t":"Коэффициенты ≤ 1/2, а у a, b, c, d меньше ⇒ A \u003c сумма/2 ⇒ A/среднее \u003c 2,5 ⇒ не больше 2.","f":["est_ex"]},{"t":"Пример: 1, 3, 2, 4, 25: A = 1/16 + 3/16 + 1/4 + 1 + 12,5 = 14, среднее 7. Ответ: 2.","f":[]}]}],"tags":["avg"],"facts":["mean","est_ex"],"note":"","n":97},{"id":"24200","d":3,"from":"Школково","stem":"На доске написаны числа 2 и 3. За один ход из чисел a и b можно получить числа a+ b и 2a− 1 или числа a+ b и 2b− 1. Например, из чисел 2 и 3 можно получить числа 5 и 3 или числа 5 и 5.","parts":[{"l":"а","q":"Приведите пример последовательности ходов, после которых одно из чисел на доске окажется равным 19.","ak":"self","av":"(2, 3) → (5, 5) → (10, 9) → (19, 19).","steps":[{"t":"(2,3) → (5, 2·3 − 1) = (5,5) → (10, 9) → (19, 2·10 − 1) = (19, 19).","f":[]}]},{"l":"б","q":"Может ли после 100 ходов одно из двух чисел на доске оказаться равным 200?","ak":"yn","av":"НЕТ","steps":[{"t":"После первого хода меньшее число ≥ 3, и каждый ход меньшее число m переходит в min(сумма, 2m − 1) ≥ m + 2.","f":["monovar"]},{"t":"После 100 ходов меньшее ≥ 3 + 2·99 = 201 > 200. Ответ: нет.","f":[]}]},{"l":"в","q":"Сделали 1007 ходов, причем на доске не было равных чисел. Какое наименьшее значение может принимать разность большего и меньшего из двух полученных чисел?","ak":"num","av":"2","steps":[{"t":"Разность d = b − a становится d + 1 или 1 − d ⇒ модуль разности меняется ровно на 1.","f":["invariant"]},{"t":"Начальный модуль 1, ходов 1007 (нечётно) ⇒ в конце модуль чётный, а числа не равны ⇒ ≥ 2.","f":["parity"]},{"t":"Чередуем модули 1, 2, 1, 2, … — в конце 2. Ответ: 2.","f":["est_ex"]}]}],"tags":["ops"],"facts":["invariant","parity","monovar","est_ex"],"note":"","n":98},{"id":"24439","d":3,"from":"Школково","stem":"Первый член конечной геометрической прогрессии, состоящей из трёхзначных натуральных чисел, равен 128. Известно, что в прогрессии не меньше трёх чисел.","parts":[{"l":"а","q":"Может ли число 686 являться членом такой прогрессии?","ak":"yn","av":"ДА","steps":[{"t":"686/128 = 343/64 = (7/4)³ ⇒ 128, 224, 392, 686. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли число 496 являться членом такой прогрессии?","ak":"yn","av":"НЕТ","steps":[{"t":"496/128 = 31/8 — не степень дроби с показателем ≥ 2 ⇒ 496 мог бы быть только вторым членом, а третий 496·31/8 > 999. Ответ: нет.","f":["fta"]}]},{"l":"в","q":"Какое наибольшее число может являться членом такой прогрессии?","ak":"num","av":"972","steps":[{"t":"q = p/r, r — степень двойки (128 = 2⁷). Целые q: максимум 512 (128, 256, 512).","f":[]},{"t":"r = 2: q = 3/2 даёт 128, 192, 288, 432, 648, 972; q = 5/2 — до 800. r = 4: q = 11/4 даёт 968; остальные меньше. r ≥ 16 — только 2 члена.","f":["est_ex"]},{"t":"Наибольший член 972. Ответ: 972.","f":[]}]}],"tags":["seq"],"facts":["gp","fta","est_ex"],"note":"","n":99},{"id":"24440","d":3,"from":"Школково","stem":"В последовательности из 80 целых чисел каждое число (кроме первого и последнего) больше среднего арифметического соседних чисел. Первый и последний члены последовательности равны 0.","parts":[{"l":"а","q":"Может ли второй член такой последовательности быть отрицательным?","ak":"yn","av":"НЕТ","steps":[{"t":"Условие ⇔ разности соседних d₁ > d₂ > … > d₇₉ строго убывают, их сумма 0 (концы равны 0).","f":["ap"]},{"t":"Тогда d₁ > 0 ⇒ a₂ = d₁ > 0. Ответ: нет.","f":[]}]},{"l":"б","q":"Может ли второй член такой последовательности быть равным 20?","ak":"yn","av":"НЕТ","steps":[{"t":"dₖ ≤ d₁ − (k − 1) ⇒ 0 = Σdₖ ≤ 79d₁ − (0 + 1 + … + 78) = 79d₁ − 3081 ⇒ d₁ ≥ 39.","f":["sum_1n"]},{"t":"20 \u003c 39. Ответ: нет.","f":[]}]},{"l":"в","q":"Найдите наименьшее значение второго члена такой последовательности.","ak":"num","av":"39","steps":[{"t":"Из пункта б: a₂ ≥ 39.","f":["est_ex"]},{"t":"Разности 39, 38, …, −39 (сумма 0) дают нужную последовательность. Ответ: 39.","f":[]}]}],"tags":["seq"],"facts":["ap","sum_1n","est_ex"],"note":"","n":100},{"id":"24442","d":3,"from":"Школково","stem":"Трёхзначное натуральное число делят на сумму его цифр; частное — целое число.","parts":[{"l":"в","q":"Найдите наименьшее возможное частное, если число не делится на 100, а его первая цифра равна 7.","ak":"num","av":"37","steps":[{"t":"N = 7bc, S = 7 + b + c ≤ 25 ⇒ частное ≥ 700/25 = 28.","f":[]},{"t":"Для q = 28…36 проверяем S от ⌈700/q⌉ до ⌊799/q⌋: число qS не имеет суммы цифр S (например, q = 36: S = 20, 21, 22 → 720, 756, 792 — суммы 9, 18, 18).","f":["est_ex"]},{"t":"q = 37: 777 = 37·21 ✓. Ответ: 37.","f":[]}]}],"tags":["digits"],"facts":["dec_repr","est_ex"],"note":"","n":101},{"id":"26296","d":3,"from":"Школково","stem":"Ученики некоторой школы написали тест. Результатом каждого участника стало целое неотрицательное число баллов. Ученик считается сдавшим тест, если он набрал не менее 83 баллов. Из-за того, что задания оказались слишком трудными, было принято решение всем участникам теста добавить по 5 баллов, благодаря чему количество сдавших тест увеличилось.","parts":[{"l":"а","q":"Могло ли оказаться так, что после этого средний балл не сдавших тест учеников понизился?","ak":"yn","av":"ДА","steps":[{"t":"После +5 сдавшими становятся те, у кого было 78–82; несдавшими остаются набравшие ≤ 77.","f":["mean_move"]},{"t":"Пример: баллы 0 и 80 (не сдали, среднее 40). После: 5 и 85 — не сдал один со средним 5 \u003c 40. Ответ: да.","f":[]}]},{"l":"б","q":"Могло ли оказаться так, что после этого средний балл не сдавших тест учеников понизился и средний балл сдавших тест учеников понизился?","ak":"yn","av":"ДА","steps":[{"t":"Пример: 0, 80, 100. До: не сдавшие {0, 80} — 40, сдавшие {100} — 100.","f":[]},{"t":"После: 5, 85, 105: не сдавшие {5} — 5, сдавшие {85, 105} — 95. Оба средних понизил
