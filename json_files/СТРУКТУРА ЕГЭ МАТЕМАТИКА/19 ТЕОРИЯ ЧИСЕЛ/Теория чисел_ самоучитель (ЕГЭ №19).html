<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Теория чисел: самоучитель (ЕГЭ №19)</title>
<style>
:root{
  --bg:#f6f1e7; --paper:#fffdf8; --ink:#1f2328; --muted:#6b6f76; --line:#e4dccb; --soft:#efe7d6;
  --accent:#1d5fd1; --accent-soft:#e3ecfb; --ok:#1f8a4c; --ok-soft:#dff3e6; --bad:#c2372d; --bad-soft:#fbe4e1;
  --warn:#9a6400; --warn-soft:#fff1d1; --sticker:#ffd84d; --sticker-ink:#4a3a00; --fact:#6a3fb5; --fact-soft:#efe8fb;
  --shadow:0 1px 2px rgba(60,40,0,.06),0 6px 18px rgba(60,40,0,.06);
  --serif: "Iowan Old Style","Palatino Linotype",Palatino,"PT Serif",Georgia,serif;
  --sans: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
[data-theme="dark"]{
  --bg:#15171b; --paper:#1d2026; --ink:#e8e6e1; --muted:#9aa0a8; --line:#2f333b; --soft:#262a31;
  --accent:#7aa7ff; --accent-soft:#22304a; --ok:#5fd18f; --ok-soft:#1b3326; --bad:#ff8a80; --bad-soft:#3a2120;
  --warn:#f1c25b; --warn-soft:#3a3018; --sticker:#ffd84d; --sticker-ink:#3a2e00; --fact:#b99bf2; --fact-soft:#2c2540;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
/* ---------- login */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:28px;max-width:440px;width:100%}
.login h1{font-family:var(--serif);font-size:28px;margin:0 0 4px;line-height:1.15}
.login p{color:var(--muted);margin:0 0 18px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{flex:1;min-width:0;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.field:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.btn{border:1px solid var(--line);background:var(--paper);padding:9px 14px;border-radius:10px;font-weight:600;font-size:15px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
[data-theme="dark"] .btn.primary{color:#0d1424}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--soft)}
.names{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.name-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);text-align:left;width:100%}
.name-item:hover{border-color:var(--accent)}
.name-item small{color:var(--muted)}
/* ---------- app shell */
.app{display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);height:100%}
header.top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:20}
.brand{font-family:var(--serif);font-weight:700;font-size:18px;white-space:nowrap}
.who{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:14px;color:var(--muted)}
.bar{width:120px;height:8px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok)}
.iconbtn{border:1px solid var(--line);background:var(--paper);width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.iconbtn:hover{border-color:var(--accent)}
.menu{position:absolute;right:12px;top:54px;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:260px;z-index:40}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:8px}
.menu button:hover{background:var(--soft)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.body{display:grid;grid-template-columns:320px 1fr;min-height:0}
aside.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--paper)}
.filters{padding:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;padding:6px 4px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tagsel{padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:14px}
.plist{overflow:auto;flex:1;padding:6px}
.pitem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;width:100%;text-align:left;padding:10px;border:1px solid transparent;border-radius:12px;background:transparent;margin-bottom:2px;position:relative}
.pitem:hover{background:var(--soft)}
.pitem.cur{background:var(--accent-soft);border-color:var(--accent)}
.pnum{font-family:var(--serif);font-weight:700;font-size:15px;min-width:30px;color:var(--muted)}
.ptxt{font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dots{display:flex;gap:3px;margin-top:5px}
.dots i{width:16px;height:5px;border-radius:3px;background:var(--line)}
.dots i.ok{background:var(--ok)}
.dots i.seen{background:var(--warn)}
.sticker{position:absolute;right:6px;top:6px;background:var(--sticker);color:var(--sticker-ink);font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;transform:rotate(4deg);box-shadow:0 1px 0 rgba(0,0,0,.15);letter-spacing:.02em}
.fav{color:#e2a400}
main{overflow:auto;min-height:0;min-width:0}
.wrap{max-width:860px;margin:0 auto;padding:20px 18px 80px}
.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.phead h2{font-family:var(--serif);margin:0;font-size:24px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:var(--soft);font-size:12.5px;color:var(--muted);border:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:14px}
.stem{font-family:var(--serif);font-size:18px;line-height:1.55;white-space:pre-wrap}
.note{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.tabs{display:flex;gap:6px;margin:6px 0 12px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--paper);padding:7px 16px;border-radius:10px;font-weight:700;font-family:var(--serif);font-size:17px;position:relative}
.tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab .mk{position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;background:var(--ok);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;font-family:var(--sans)}
.q{font-family:var(--serif);font-size:18px;margin:0 0 14px}
.ans{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.yn{min-width:84px;padding:10px 16px;border-radius:12px;border:2px solid var(--line);background:var(--paper);font-weight:800;font-size:16px}
.yn:hover{border-color:var(--accent)}
.feedback{margin-top:12px;padding:10px 14px;border-radius:12px;font-weight:600}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.feedback.info{background:var(--soft);color:var(--ink);font-weight:500}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.steps{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:32px 1fr;gap:10px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.snum{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.stext{font-size:16px;line-height:1.55;padding-top:2px}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.fchip{border:1px solid transparent;background:var(--fact-soft);color:var(--fact);padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600}
.fchip:hover{border-color:var(--fact)}
.navrow{display:flex;justify-content:space-between;gap:8px;margin-top:6px}
/* ---------- theory drawer */
.drawer{position:fixed;top:0;right:0;height:100%;width:min(460px,100%);background:var(--paper);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.12);z-index:50;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .22s ease}
.drawer.open{transform:none}
.dhead{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.dtitle{display:flex;align-items:center;gap:8px}
.dtitle b{font-family:var(--serif);font-size:19px;flex:1}
.dbody{overflow:auto;padding:12px 14px 40px;flex:1}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 8px;font-weight:700}
.fact{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--bg)}
.fact.hl{border-color:var(--fact);box-shadow:0 0 0 3px var(--fact-soft)}
.fact h4{margin:0 0 4px;font-size:15.5px;color:var(--fact)}
.fact p{margin:0;font-size:14.5px}
.fact .ex{margin-top:8px;padding:8px 10px;border-left:3px solid var(--fact);background:var(--paper);border-radius:0 8px 8px 0;font-size:14px}
.fact .ex b{color:var(--fact)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:45}
/* ---------- modal */
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:60;padding:16px;background:rgba(0,0,0,.35)}
.mbox{background:var(--paper);border-radius:16px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:20px;border:1px solid var(--line);box-shadow:var(--shadow)}
.mbox h3{margin:0 0 10px;font-family:var(--serif);font-size:22px}
.mbox textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
table.stat{width:100%;border-collapse:collapse;font-size:14px}
table.stat td,table.stat th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:12px;z-index:70;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);max-width:92vw}
.toast button{background:var(--paper);color:var(--ink);border:0;border-radius:8px;padding:5px 10px;font-weight:700}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.mobile-only{display:none}
@media (max-width:860px){
  .body{grid-template-columns:minmax(0,1fr)}
  header.top{gap:6px;padding:8px 10px}
  .brand{display:none}
  .who .pc{display:none}
  .phead h2{font-size:21px}
  aside.list{position:fixed;left:0;top:53px;bottom:0;width:min(340px,92vw);z-index:30;transform:translateX(-105%);transition:transform .22s ease;box-shadow:10px 0 30px rgba(0,0,0,.15)}
  aside.list.open{transform:none}
  .mobile-only{display:inline-flex}
  .bar{width:60px}
  .brand{font-size:16px}
  .who .nm{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wrap{padding:14px 12px 80px}
  .card{padding:14px}
  .stem,.q{font-size:17px}
}
@media print{header.top,aside.list,.tools,.drawer{display:none!important}}
</style>
</head>

<script id="app-data" type="application/json">{"version":1,"title":"Теория чисел: самоучитель (ЕГЭ №19)","tags":{"digits":"Цифры и запись числа","div":"Делимость и остатки","ops":"Операции и инварианты","avg":"Средние и проценты","est":"Оценка + пример","seq":"Последовательности","eq":"Уравнения в целых"},"sections":[["div","Делимость и признаки делимости"],["fta","Простые числа, НОД, НОК"],["mod","Остатки и сравнения"],["dec","Десятичная запись числа"],["par","Чётность"],["inv","Инварианты и операции"],["seq","Прогрессии и суммы"],["eq","Уравнения в целых числах"],["avg","Средние, доли, проценты"],["est","Оценка + пример, крайний, Дирихле"]],"facts":[{"id":"div_def","s":"div","n":"Определение делимости","t":"Число a делится на b (b ≠ 0), если a = b·k для некоторого целого k. Пишут b | a.","e":"84 = 14·6, значит 14 | 84. А 230 не делится на 14: 230 = 14·16 + 6."},{"id":"div_sum","s":"div","n":"Делимость суммы и разности","t":"Если a и b делятся на m, то a ± b делится на m. Если сумма a + b делится на m и a делится на m, то и b делится на m. Сумма двух чисел, кратных m, кратна m.","e":"Оба числа кратны 45 ⇒ их сумма кратна 45. 3435 : 45 = 76,33… ⇒ 3435 не может быть суммой двух чисел, кратных 45."},{"id":"div_rules","s":"div","n":"Признаки делимости","t":"На 2 — последняя цифра чётная; на 5 — последняя 0 или 5; на 10 — последняя 0; на 4 — число из двух последних цифр делится на 4; на 8 — из трёх последних; на 3 и на 9 — сумма цифр делится на 3 (на 9); на 11 — знакочередующаяся сумма цифр делится на 11.","e":"9720: сумма цифр 18 ⇒ делится на 9, оканчивается на 0 ⇒ делится на 5, значит делится на 45. 9167169: 9−1+6−7+1−6+9 = 11 ⇒ делится на 11."},{"id":"div_comp","s":"div","n":"Делимость на составное число","t":"Если число делится на взаимно простые a и b, то оно делится на a·b. Поэтому: на 36 = 4·9 — проверяем 4 и 9; на 45 = 5·9; на 15 = 3·5; на 60 = 3·4·5.","e":"Двузначные кратные 36: 36 и 72 — других нет (108 уже трёхзначное)."},{"id":"div_count","s":"div","n":"Кратные среди подряд идущих чисел","t":"Среди любых k подряд идущих натуральных чисел ровно одно делится на k. Если среди L подряд идущих чисел ровно m делятся на k, то (m−1)·k + 1 ≤ L ≤ (m+1)·k − 1.","e":"Ровно 5 чисел, делящихся на 15 ⇒ 61 ≤ L ≤ 89. Чтобы 6 чисел делились на 17, нужно L ≥ 5·17 + 1 = 86."},{"id":"fta","s":"fta","n":"Основная теорема арифметики","t":"Любое натуральное число больше 1 раскладывается на простые множители, и притом единственным образом (с точностью до порядка).","e":"945 = 3³·5·7. 2108 = 2²·17·31. 1001 = 7·11·13."},{"id":"prime_min","s":"fta","n":"Наименьший делитель — простой","t":"Наименьший делитель числа n > 1, больший 1, — простое число. Поэтому n ≥ своего наименьшего простого делителя.","e":"У числа 35 наименьший делитель 5, и 35 ≥ 5. Если числа имеют разные наименьшие простые делители p₁, p₂, …, то их сумма ≥ p₁ + p₂ + …"},{"id":"coprime","s":"fta","n":"Взаимно простые числа","t":"Числа взаимно просты, если НОД = 1. У попарно взаимно простых чисел нет общих простых делителей ⇒ у каждого числа (кроме 1) свой простой делитель. Среди попарно взаимно простых чисел не больше одного чётного.","e":"1, 2, 3, 5, 7, 11, 13, 17 — попарно взаимно простые, сумма 59."},{"id":"gcd","s":"fta","n":"НОД и алгоритм Евклида","t":"НОД(a, b) = НОД(a − b, b) = НОД(a + b, b). Дробь a/b несократима, если НОД(a, b) = 1.","e":"НОД(a + b, 2a + b) = НОД(a + b, a) = НОД(b, a). Значит, если a/b несократима, то и (a+b)/(2a+b) несократима."},{"id":"prime_only","s":"fta","n":"Простое число как произведение","t":"Простое число p нельзя получить как произведение двух чисел, больших 1. Если p записано как произведение натуральных, то один множитель равен p, а остальные равны 1.","e":"Если на доске стоит простое 7, а единицы нет, то 7 — одно из задуманных чисел."},{"id":"mod_def","s":"mod","n":"Сравнения по модулю","t":"a ≡ b (mod m), если a и b дают одинаковые остатки при делении на m, т.е. m | (a − b). Сравнения можно складывать, вычитать и умножать.","e":"563 = 28·20 + 3 ⇒ 563 ≡ 3 (mod 28). 1417 − 563 = 854 не делится на 4 ⇒ остатки по mod 4 разные."},{"id":"mod_shift","s":"mod","n":"Метод сдвига (все числа сравнимы)","t":"Если сумма ЛЮБЫХ k чисел из набора делится на m (и чисел больше k), то все числа набора дают одинаковый остаток при делении на m: заменим в k-ке одно число x на y — сумма останется кратной m, значит x ≡ y. Для чисел по кругу: если сумма любых k подряд кратна m, то aᵢ ≡ aᵢ₊ₖ (mod m).","e":"Среднее любых трёх и любых пяти — целое ⇒ все числа сравнимы по mod 3 и mod 5, т.е. по mod 15."},{"id":"mod_sq","s":"mod","n":"Остатки квадратов","t":"Квадрат при делении на 3 даёт остаток 0 или 1; на 4 — 0 или 1; на 8 (для нечётного) — 1. n² ≡ 1 (mod p) для простого p ⇔ n ≡ ±1 (mod p).","e":"Число ≡ 3 (mod 4) не может быть квадратом. n² ≡ 1 (mod 7) ⇔ n ≡ 1 или 6 (mod 7)."},{"id":"last_digit","s":"mod","n":"Последняя цифра","t":"Последняя цифра суммы (произведения) определяется последними цифрами слагаемых (множителей) — это остаток по mod 10.","e":"26 чисел на 4 и 4 числа на 8: 26·4 + 4·8 = 136 ⇒ сумма оканчивается на 6."},{"id":"mod_cases","s":"mod","n":"Перебор остатков","t":"Чтобы проверить, решается ли уравнение, удобно перебрать остатки по подходящему модулю: если ни один остаток не подходит — решений нет.","e":"101 = 5a + 14b при a ≤ 4: 101 − 5a ∈ {101, 96, 91, 86, 81} — ни одно не делится на 14."},{"id":"dec_repr","s":"dec","n":"Десятичная запись","t":"Трёхзначное число с цифрами a, b, c равно 100a + 10b + c; двузначное с цифрами a, b равно 10a + b. При перестановке цифр двузначного числа: 10a + b → 10b + a.","e":"Если A — сумма цифр десятков, B — сумма цифр единиц, то сумма чисел 10A + B, а после перестановки 10B + A."},{"id":"append","s":"dec","n":"Приписывание цифры","t":"Приписать к числу x справа цифру d — получить 10x + d. Приписать k-значное число y — получить x·10ᵏ + y.","e":"К 13 приписали 7: 137 = 10·13 + 7."},{"id":"ds_mod9","s":"dec","n":"Сумма цифр и деление на 9","t":"Число и его сумма цифр дают одинаковый остаток при делении на 9 (и на 3): S(n) ≡ n (mod 9). Сумма цифр k-значного числа ≤ 9k.","e":"1994: S = 23, 23 ≡ 5 ≡ 1994 (mod 9). Если x + S(x) + S(S(x)) = N, то 3x ≡ N (mod 9)."},{"id":"ds_carry","s":"dec","n":"Сумма цифр и переносы","t":"S(x) + S(y) = S(x + y) + 9·(число переносов при сложении столбиком).","e":"x + y = 599 без переносов ⇒ S(x) + S(y) = 5 + 9 + 9 = 23 — нечётно, поэтому S(x) ≠ S(y)."},{"id":"repunit","s":"dec","n":"Числа из единиц","t":"Число из k единиц 11…1 = (10ᵏ − 1)/9, и оно ≡ k (mod 9).","e":"1 + 11 + 111 = 123, в записи 6 единиц, 123 ≡ 6 (mod 9). Замена 11 единиц на одно «11» уменьшает число единиц на 9, а сумма не меняется."},{"id":"subseq","s":"dec","n":"Вычёркивание цифр","t":"Вычёркивая цифры, получаем подпоследовательность: порядок цифр сохраняется. Если каждая цифра встречается один раз, условия «x раньше y» должны быть непротиворечивы.","e":"Из 2893506 вычёркиванием получаются 206, 835, 930."},{"id":"parity","s":"par","n":"Чётность","t":"Сумма чётного количества нечётных чисел чётна, нечётного — нечётна. |a − b| и a + b одной чётности. Если a + b чётно, то a и b одной чётности.","e":"Сумма модулей разностей соседей по кругу ≡ сумме самих разностей ≡ 0 (mod 2) ⇒ всегда чётна."},{"id":"invariant","s":"inv","n":"Инвариант","t":"Инвариант — величина, которая не меняется при операции (например, остаток разности, чётность, сумма). Если у начального и конечного состояний инвариант разный — перейти нельзя.","e":"Ход «+2 одному, −1 двум другим»: все числа меняются на −1 по mod 3 ⇒ разности чисел по mod 3 не меняются."},{"id":"monovar","s":"inv","n":"Полуинвариант (монотонная величина)","t":"Величина, которая при каждом ходе меняется в одну сторону (например, растёт ровно на 1), позволяет посчитать число ходов или доказать, что процесс закончится.","e":"(A+2, B−1) и (A−1, B+2): сумма каждый ход растёт на 1 ⇒ число ходов = (новая сумма − старая сумма)."},{"id":"reverse","s":"inv","n":"Обратный ход","t":"Если операция обратима, можно восстановить предыдущее состояние однозначно и идти «назад» от конечного состояния.","e":"(a, b) → (a+b, a−b): обратно (x, y) ← ((x+y)/2, (x−y)/2). Для (806; 788) предыдущая пара (797; 9)."},{"id":"double_bound","s":"inv","n":"Удвоение за ход","t":"Если за один ход каждый кусок можно разрезать не более чем на две части, то после k ходов кусков не больше 2ᵏ.","e":"За 5 ходов не больше 32 частей, а нужно 100 ⇒ нельзя."},{"id":"lin_map","s":"inv","n":"Линейная операция над парами","t":"Если (a, b) → (pa + qb, ra + sb), то пара (c, d) получается из целой пары, когда система pa + qb = c, ra + sb = d имеет целое решение. Это даёт условие делимости на c и d.","e":"(3a + b, 3b − a) = (c, d) ⇒ a = (3c − d)/10, b = (c + 3d)/10 ⇒ нужно c + 3d ≡ 0 (mod 10)."},{"id":"sum_1n","s":"seq","n":"Сумма 1 + 2 + … + n","t":"1 + 2 + … + n = n(n+1)/2. Сумма n различных натуральных чисел не меньше n(n+1)/2; различных неотрицательных — не меньше n(n−1)/2.","e":"Сумма 100 различных натуральных ≥ 5050. Сумма 41 различного неотрицательного ≥ 0 + 1 + … + 40 = 820."},{"id":"ap","s":"seq","n":"Арифметическая прогрессия","t":"Сумма n членов: Sₙ = n·a₁ + n(n−1)d/2 = n(a₁ + aₙ)/2.","e":"Если каждый день решать на 2 задачи больше, начав с b: за q дней qb + q(q−1)."},{"id":"pow2","s":"seq","n":"Степени двойки, двоичная запись","t":"1 + 2 + 4 + … + 2ᵏ⁻¹ = 2ᵏ − 1. Набором гирь 1, 2, 4, …, 2ᵏ⁻¹ отвешивается любой вес от 1 до 2ᵏ − 1. Непустых поднаборов из k предметов — 2ᵏ − 1.","e":"Гири 1, 2, 4, 8, 16: веса 1…31. Четыре гири дают не более 15 разных сумм."},{"id":"lin_dioph","s":"eq","n":"Линейные уравнения в целых числах","t":"ax + by = c. Решения ищут перебором одной переменной в небольшом диапазоне или по остаткам. Из двух уравнений с тремя неизвестными часто удаётся выразить всё через одну.","e":"5a = 6b в натуральных ⇒ a = 6t, b = 5t."},{"id":"factor","s":"eq","n":"Разложение на множители","t":"Приём: привести уравнение к виду (…)(…) = число и перебрать делители. uv − u − v = (u−1)(v−1) − 1; x² − y² = (x−y)(x+y).","e":"uv − u − v = 30 ⇒ (u−1)(v−1) = 31 — простое ⇒ u − 1 = 1, v − 1 = 31."},{"id":"vieta","s":"eq","n":"Теорема Виета","t":"Для x² + px + q = 0 с корнями x₁, x₂: x₁ + x₂ = −p, x₁·x₂ = q.","e":"Корни 5 и 11 ⇒ p = −16, q = 55."},{"id":"squares_sum","s":"eq","n":"Выражение через квадраты разностей","t":"a² + b² + c² − ab − bc − ca = ½[(a−b)² + (b−c)² + (c−a)²] = x² + xy + y², где x = a − b, y = b − c.","e":"a = 6, b = 3, c = 1: x = 3, y = 2, d = 9 + 6 + 4 = 19."},{"id":"mean","s":"avg","n":"Среднее арифметическое","t":"Среднее = сумма / количество, значит сумма = среднее · количество. Среднее не меньше наименьшего и не больше наибольшего числа.","e":"Шесть наименьших со средним 5 ⇒ их сумма 30."},{"id":"mean_move","s":"avg","n":"Перенос элемента между группами","t":"Если из группы (n чисел, среднее m) убрать число x, новое среднее (nm − x)/(n − 1). Среднее увеличится ⇔ x \u003c m. Если добавить x к группе — среднее растёт ⇔ x > m.","e":"Школа: 4 ученика со средним 42, пришёл ученик с 21 баллом: (168 + 21)/5 = 37,8 — уменьшилось на 10%."},{"id":"percent","s":"avg","n":"Проценты и доли","t":"p% от N = pN/100. «Увеличилось на 10%» ⇒ стало 1,1 от прежнего. Доля k из n — это 100k/n %.","e":"Доля девочек 30% при 20 учениках — 6 девочек."},{"id":"rounding","s":"avg","n":"Округление","t":"Число x округляется до целого k ⇔ k − 0,5 ≤ x \u003c k + 0,5.","e":"Рейтинг 31 при 13 голосах: 30,5 ≤ 100v/13 \u003c 31,5 ⇒ v = 4."},{"id":"frac_monot","s":"avg","n":"Монотонность дроби","t":"Дробь (x + a)/(x + b) при b > a > 0 возрастает с ростом x. Чтобы максимизировать дробь — увеличиваем числитель и уменьшаем знаменатель; для дробно-линейной функции исследуем знак a·d − b·c.","e":"(10b + 3)/(100 + 10b) растёт с ростом b."},{"id":"est_ex","s":"est","n":"Схема «оценка + пример»","t":"Чтобы найти наибольшее (наименьшее) значение, нужно: 1) доказать оценку — значение не может быть больше (меньше); 2) привести пример, где оценка достигается. Без примера ответ не засчитывается.","e":"Сумма 8 попарно взаимно простых ≥ 59 (оценка), и 1 + 2 + 3 + 5 + 7 + 11 + 13 + 17 = 59 (пример)."},{"id":"extreme","s":"est","n":"Принцип крайнего","t":"Рассмотрите наименьший (наибольший) элемент — для него условия задачи дают самые сильные ограничения.","e":"Наибольший член цикла M: перед ним может стоять только M/2, а после — только M − 98."},{"id":"dirichlet","s":"est","n":"Принцип Дирихле","t":"Если n + 1 предмет разложить в n ящиков, то в каком-то ящике окажется хотя бы 2 предмета. Бесконечная (длинная) последовательность из конечного числа значений повторяется.","e":"400 членов из чисел 1…111 ⇒ какое-то число повторится ⇒ в последовательности есть цикл."},{"id":"distinct_min","s":"est","n":"Различные числа — минимальная сумма","t":"Если k различных натуральных чисел, то наименьшая их сумма — когда это k наименьших подходящих чисел. Если числа меньше x и различны, их сумма ≤ (x−1) + (x−2) + … + (x−k).","e":"4 различных числа меньше a₅: сумма ≤ 4a₅ − 10."},{"id":"abs_sum","s":"est","n":"Сумма модулей разностей","t":"Каждое число входит в две разности по кругу со знаком «+» или «−». Сумма максимальна, когда большие числа всегда со знаком «+», малые — «−»: большие и малые чередуются.","e":"Для 1…12: максимум 2·(7+…+12) − 2·(1+…+6) = 114 − 42 = 72."}],"problems":[{"n":1,"code":"001","src":"159671","stem":"Из набора цифр 1, 2, 3, 4, 6, 7 и 8 составляют пару чисел, используя каждую цифру ровно один раз. Оказалось, что одно из этих чисел пятизначное, другое — двузначное и кратно 36.","parts":[{"l":"а","q":"Может ли сумма такой пары чисел равняться 14 908?","ak":"yn","av":"ДА","steps":[{"t":"Двузначные числа, кратные 36 = 4·9: это только 36 и 72.","f":["div_comp"]},{"t":"Если двузначное 72, то пятизначное = 14908 − 72 = 14836. Его цифры 1, 4, 8, 3, 6 вместе с 7 и 2 дают ровно набор 1, 2, 3, 4, 6, 7, 8.","f":[]},{"t":"Пример: 14836 + 72 = 14908. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли сумма такой пары чисел равняться 74 134?","ak":"yn","av":"НЕТ","steps":[{"t":"Двузначное число — 36 или 72. Найдём пятизначное: 74134 − 36 = 74098; 74134 − 72 = 74062.","f":[]},{"t":"В обоих числах есть цифра 0 (и 9), которой нет в наборе. Значит, такой суммы не бывает. Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наибольшее значение может принимать сумма чисел в этой паре?","ak":"num","av":"87457","steps":[{"t":"Сумма = пятизначное + двузначное. Двузначное — 36 или 72; при каждом из них пятизначное составлено из оставшихся пяти цифр.","f":["est_ex"]},{"t":"Если двузначное 72: остаются 1, 3, 4, 6, 8, наибольшее пятизначное 86431, сумма 86431 + 72 = 86503.","f":[]},{"t":"Если двузначное 36: остаются 1, 2, 4, 7, 8, наибольшее пятизначное 87421, сумма 87421 + 36 = 87457.","f":[]},{"t":"Других вариантов нет, наибольшая сумма 87457 (пример: 87421 и 36).","f":[]}]}],"tags":["digits","div"],"facts":["div_comp","div_rules","dec_repr","est_ex"],"note":""},{"n":2,"code":"002","src":"120330","stem":"В школе перед началом учебного года было сформировано несколько одиннадцатых классов, в каждом из которых количество мальчиков относилось к количеству девочек как 7 :2 или как 2 :7. После этого в параллель одиннадцатых классов школы приняли ещё четырёх мальчиков и трёх девочек.","parts":[{"l":"а","q":"Удастся ли теперь разбить всех одиннадцатиклассников на классы так, чтобы в каждом классе отношение количества мальчиков к количеству девочек было 5:4 или 4 :5?","ak":"yn","av":"НЕТ","steps":[{"t":"В каждом классе мальчиков и девочек 7k и 2k (или 2k и 7k) ⇒ в классе 9k человек. Значит, всего учеников кратно 9: N = 9m.","f":["div_sum"]},{"t":"После приёма стало 9m + 7 учеников — остаток 7 при делении на 9.","f":["mod_def"]},{"t":"При отношении 5:4 каждый класс снова кратен 9 ⇒ всё количество кратно 9. Но 9m + 7 на 9 не делится. Ответ: нет.","f":[]}]},{"l":"б","q":"Всех одиннадцатиклассников удалось разбить на классы так, чтобы в каждом классе отношение количества мальчиков к количеству девочек было 7 :3 или 3:7. Могло ли при этом получиться ровно семь классов?","ak":"yn","av":"ДА","steps":[{"t":"При 7:3 каждый класс — 10t человек. Ищем пример с 7 классами.","f":[]},{"t":"Пусть сначала было 3 класса (7 м, 2 д) и 4 класса (2 м, 7 д): мальчиков 21 + 8 = 29, девочек 6 + 28 = 34. Добавим 4 и 3: стало 33 мальчика и 37 девочек.","f":[]},{"t":"Разобьём: 3 класса по (7 м, 3 д) и 4 класса по (3 м, 7 д): мальчиков 21 + 12 = 33, девочек 9 + 28 = 37. Ровно семь классов. Ответ: да.","f":[]}]},{"l":"в","q":"Всех одиннадцатиклассников удалось разбить на классы так, чтобы в каждом классе отношение количества мальчиков к количеству девочек было 7 :3 или 3:7. Было решено отправить всех одиннадцатиклассников на экскурсию группами по 90 человек, при этом одна из групп оказалась неполной. Сколько в этой группе было одиннадцатиклассников?","ak":"num","av":"70","steps":[{"t":"Всего учеников N = 9m + 7 (из пункта а) и N кратно 10 (классы 7:3).","f":["div_sum"]},{"t":"N = 10s и 10s ≡ 7 (mod 9) ⇒ s ≡ 7 (mod 9) ⇒ N ≡ 70 (mod 90).","f":["mod_def"]},{"t":"Значит, при делении на группы по 90 неполная группа содержит 70 человек. Такая ситуация возможна — пример из пункта б (70 человек).","f":[]}]}],"tags":["div"],"facts":["div_def","div_sum","mod_def","est_ex"],"note":""},{"n":3,"code":"003","src":"83776","stem":"Из набора цифр 0, 1, 2, 3, 5, 7 и 9 составляют пару чисел, используя каждую цифру ровно один раз. Оказалось, что одно из этих чисел четырёхзначное, другое – трёхзначное и оба кратны 45.","parts":[{"l":"а","q":"Может ли сумма такой пары чисел равняться 2205?","ak":"yn","av":"ДА","steps":[{"t":"Кратность 45 = 5·9: число оканчивается на 0 или 5, а сумма цифр делится на 9.","f":["div_comp"]},{"t":"Пример: 1935 + 270 = 2205. Цифры 1, 9, 3, 5, 2, 7, 0 — весь набор. 1935: сумма цифр 18, оканчивается на 5; 270: сумма 9, оканчивается на 0. Ответ: да.","f":["div_rules"]}]},{"l":"б","q":"Может ли сумма такой пары чисел равняться 3435?","ak":"yn","av":"НЕТ","steps":[{"t":"Оба числа кратны 45 ⇒ их сумма кратна 45.","f":["div_sum"]},{"t":"3435 : 45 = 76,33… — не делится. Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наибольшее значение может принимать сумма чисел в такой паре?","ak":"num","av":"10035","steps":[{"t":"Сумма всех цифр 0+1+2+3+5+7+9 = 27. У каждого числа сумма цифр кратна 9 ⇒ суммы цифр (у четырёхзначного; у трёхзначного) = (18; 9) или (9; 18). Одно число оканчивается на 0, другое на 5.","f":["ds_mod9"]},{"t":"Случай (9; 18): у четырёхзначного 4 цифры с суммой 9 — это только {0, 1, 3, 5}, число ≤ 5310, сумма ≤ 5310 + 972 \u003c 10000.","f":[]},{"t":"Случай (18; 9): трёхзначное с суммой цифр 9 и последней 0 или 5 — это 720, 270, 135 или 315. Четырёхзначное из оставшихся цифр (наибольшее): при 720 и 270 — 9315; при 135 и 315 — 9720.","f":[]},{"t":"Суммы: 9315 + 720 = 10035, 9315 + 270 = 9585, 9720 + 135 = 9855, 9720 + 315 = 10035. Наибольшая 10035.","f":["est_ex"]}]}],"tags":["digits","div"],"facts":["div_comp","div_rules","div_sum","ds_mod9","est_ex"],"note":""},{"n":4,"code":"004","src":"90076","stem":"Есть 4 камня, каждый массой 5 тонн, и 13 камней, каждый массой 14 тонн.","parts":[{"l":"а","q":"Можно ли разложить все эти камни на две группы так, чтобы разность суммарных масс камней в этих группах составила 6 тонн?","ak":"yn","av":"ДА","steps":[{"t":"Общая масса 4·5 + 13·14 = 202 т. Разность 6 ⇒ группы 104 и 98 т.","f":[]},{"t":"98 = 7·14. Группа 1: семь камней по 14 т (98 т). Группа 2: шесть по 14 и четыре по 5: 84 + 20 = 104 т. Ответ: да.","f":[]}]},{"l":"б","q":"Можно ли разложить все эти камни на две группы, суммарные массы камней в которых равны?","ak":"yn","av":"НЕТ","steps":[{"t":"Равные группы — по 101 т. В группе a камней по 5 т (0 ≤ a ≤ 4) и b по 14 т: 5a + 14b = 101.","f":["lin_dioph"]},{"t":"101 − 5a при a = 0…4: 101, 96, 91, 86, 81 — ни одно не делится на 14. Ответ: нет.","f":["mod_cases"]}]},{"l":"в","q":"Все камни хотят разложить на две группы. Какое наименьшее положительное значение (в тоннах) может принимать разность суммарных масс камней в этих группах?","ak":"num","av":"4","steps":[{"t":"Если в одной группе S т, разность |202 − 2S| — чётное число ⇒ ≥ 2; разность 0 невозможна (пункт б).","f":["parity"]},{"t":"Разность 2 ⇒ S = 100: 100 − 5a = 100, 95, 90, 85, 80 — не делятся на 14. Нельзя.","f":["mod_cases"]},{"t":"Разность 4 ⇒ S = 99: 99 − 5·3 = 84 = 6·14. Группа: три камня по 5 и шесть по 14 (99 т), другая 103 т.","f":["est_ex"]},{"t":"Наименьшая разность 4.","f":[]}]}],"tags":["div","est"],"facts":["lin_dioph","mod_cases","parity","est_ex"],"note":""},{"n":5,"code":"005","src":"90090","stem":"Есть 16 монет по 2 рубля и 29 монет по 5 рублей.","parts":[{"l":"а","q":"Можно ли этими монетами набрать сумму 175 рублей?","ak":"yn","av":"ДА","steps":[{"t":"Все монеты: 16·2 + 29·5 = 32 + 145 = 177 р.","f":[]},{"t":"175 = 177 − 2: берём все монеты, кроме одной двухрублёвой. Ответ: да.","f":[]}]},{"l":"б","q":"Можно ли этими монетами набрать сумму 176 рублей?","ak":"yn","av":"НЕТ","steps":[{"t":"176 = 177 − 1. Если набрать 176, то оставшиеся монеты дают 1 рубль — а монет в 1 рубль нет. Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наименьшее количество монет, каждая по 1 рублю, нужно добавить, чтобы иметь возможность набрать любую целую сумму от 1 рубля до 180 рублей включительно?","ak":"num","av":"3","steps":[{"t":"Оценка: чтобы набрать 180, всего денег должно быть ≥ 180 ⇒ 177 + k ≥ 180 ⇒ k ≥ 3.","f":["est_ex"]},{"t":"Пример с тремя рублёвыми монетами. Сумму s ≤ 180 набираем так: берём b = min(29, [s/5]) пятирублёвых, остаток r = s − 5b.","f":[]},{"t":"Если b \u003c 29, то r ≤ 4: r = 0, 1 (1), 2 (2), 3 (2+1), 4 (2+2). Если b = 29, то r = s − 145 ≤ 35: берём min(16, [r/2]) двухрублёвых, остаток ≤ 3 добираем рублёвыми.","f":[]},{"t":"Значит, 3 монеты достаточно и меньше нельзя. Ответ: 3.","f":[]}]}],"tags":["est"],"facts":["lin_dioph","est_ex"],"note":""},{"n":6,"code":"006","src":"39640","stem":"В группе поровну юношей и девушек. Юноши отправляли электронные письма девушкам. Каждый юноша отправил или 4 письма, или 21 письмо, причём и тех и других юношей было не менее двух. Возможно, что какой-то юноша отправил какой-то девушке несколько писем.","parts":[{"l":"а","q":"Могло ли оказаться так, что каждая девушка получила ровно 7 писем?","ak":"yn","av":"ДА","steps":[{"t":"Пусть a юношей отправили по 4 письма, b — по 21, девушек n = a + b. Каждая получила 7: 7(a + b) = 4a + 21b ⇒ 3a = 14b.","f":["lin_dioph"]},{"t":"a = 14, b = 3, n = 17: писем 56 + 63 = 119 = 17·7.","f":[]},{"t":"Распределяем письма по девушкам «по очереди» (несколько писем одной девушке разрешены), каждой по 7. Ответ: да.","f":[]}]},{"l":"б","q":"Какое наименьшее количество девушек могло быть в группе, если известно, что все они получили писем поровну?","ak":"num","av":"17","steps":[{"t":"Каждая девушка получила k писем: k(a + b) = 4a + 21b ⇒ (k − 4)a = (21 − k)b, 4 \u003c k \u003c 21.","f":["lin_dioph"]},{"t":"(k − 4) + (21 − k) = 17 — простое ⇒ НОД(k − 4, 21 − k) = НОД(k − 4, 17) = 1. Тогда a = (21 − k)t, b = (k − 4)t, n = a + b = 17t ≥ 17.","f":["gcd"]},{"t":"Пример n = 17 — в пункте а. Ответ: 17.","f":["est_ex"]}]},{"l":"в","q":"Пусть все девушки получили различное количество писем (возможно, какая-то девушка не получила писем вообще). Какое наибольшее количество девушек в такой группе?","ak":"num","av":"41","steps":[{"t":"Девушек n, все получили разное число писем (≥ 0) ⇒ всего писем ≥ 0 + 1 + … + (n − 1) = n(n−1)/2.","f":["sum_1n"]},{"t":"Писем 4a + 21b = 21n − 17a ≤ 21n − 34 (так как a ≥ 2).","f":[]},{"t":"n(n−1)/2 ≤ 21n − 34 ⇒ n² − 43n + 68 ≤ 0 ⇒ n ≤ (43 + √1577)/2 ≈ 41,4 ⇒ n ≤ 41.","f":["est_ex"]},{"t":"Пример n = 41: a = 2, b = 39, писем 8 + 819 = 827. Девушки получили 0, 1, 2, …, 39 и 47 писем: сумма 780 + 47 = 827. Ответ: 41.","f":[]}]}],"tags":["est","eq"],"facts":["lin_dioph","sum_1n","est_ex","coprime"],"note":""},{"n":7,"code":"007","src":"125163","stem":"В парке n аттракционов. С 11 до 12 часов дня парк посетило только n детей. Стоимость посещения каждого аттракциона составляет 10 рублей. Каждый ребёнок потратил или 30, или 140 рублей, причём не все дети потратили поровну денег. Один аттракцион можно посетить много раз.","parts":[{"l":"а","q":"Может ли выручка каждого аттракциона составить ровно 80 рублей?","ak":"yn","av":"ДА","steps":[{"t":"30 р. — 3 посещения, 140 р. — 14 посещений. Пусть a детей по 3 посещения, b — по 14, n = a + b. Каждый аттракцион 8 посещений: 8(a + b) = 3a + 14b ⇒ 5a = 6b.","f":["lin_dioph"]},{"t":"a = 6, b = 5, n = 11: 18 + 70 = 88 = 11·8 посещений. Распределяем посещения по 8 на аттракцион. Ответ: да.","f":[]}]},{"l":"б","q":"Какое наименьшее количество детей могло быть, если известно, что все аттракционы получили одинаковую выручку?","ak":"num","av":"11","steps":[{"t":"Одинаковая выручка: k посещений у каждого ⇒ (k − 3)a = (14 − k)b, 3 \u003c k \u003c 14.","f":["lin_dioph"]},{"t":"(k − 3) + (14 − k) = 11 — простое ⇒ дробь (14 − k)/(k − 3) несократима ⇒ a + b кратно 11 ⇒ n ≥ 11.","f":["gcd"]},{"t":"Пример n = 11 — пункт а. Ответ: 11.","f":["est_ex"]}]},{"l":"в","q":"Любые два аттракциона имеют разную выручку (возможно, нулевую). Каково наибольшее возможное количество посетивших парк детей?","ak":"num","av":"28","steps":[{"t":"Выручки разные ⇒ числа посещений аттракционов различны (≥ 0) ⇒ всего посещений ≥ n(n−1)/2.","f":["sum_1n"]},{"t":"Посещений 3a + 14b = 14n − 11a ≤ 14n − 11 (не все потратили поровну ⇒ a ≥ 1).","f":[]},{"t":"n(n−1)/2 ≤ 14n − 11 ⇒ n² − 29n + 22 ≤ 0 ⇒ n ≤ 28,2 ⇒ n ≤ 28.","f":["est_ex"]},{"t":"Пример n = 28: a = 1, b = 27, посещений 3 + 378 = 381 = (0 + 1 + … + 26) + 30. Ответ: 28.","f":[]}]}],"tags":["est","eq"],"facts":["lin_dioph","sum_1n","est_ex"],"note":"В ключе файла к пункту б) стоит «НЕТ», но вопрос «какое наименьшее количество детей» требует числа. По условию, как оно записано, ответ 11 — вероятно, в исходнике пункт б) сформулирован иначе."},{"n":8,"code":"008","src":"90080","stem":"В порту имеются только заполненные контейнеры, масса каждого из которых равна 20 тонн или 80 тонн. В некоторых из этих контейнеров находится сахарный песок. Количество контейнеров с сахарным песком составляет 20% от общего количества контейнеров.","parts":[{"l":"а","q":"Может ли масса контейнеров с сахарным песком составить 40% от общей массы всех контейнеров?","ak":"yn","av":"ДА","steps":[{"t":"Пусть контейнеров 15, из них с сахаром 3 (20%).","f":["percent"]},{"t":"С сахаром: 3 по 80 т = 240 т. Остальные 12: 2 по 80 и 10 по 20 = 160 + 200 = 360 т. Всего 600 т.","f":[]},{"t":"240/600 = 40%. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли масса контейнеров с сахарным песком составить 80% от общей массы всех контейнеров?","ak":"yn","av":"НЕТ","steps":[{"t":"Пусть всего 5k контейнеров, с сахаром k. Масса сахарных ≤ 80k, масса остальных 4k контейнеров ≥ 20·4k = 80k.","f":[]},{"t":"Значит, доля сахарных ≤ 80k/(80k + 80k) = 50% \u003c 80%. Ответ: нет.","f":[]}]},{"l":"в","q":"Какую наибольшую долю (в процентах) может составить масса контейнеров с сахарным песком от общей массы всех контейнеров?","ak":"num","av":"50","steps":[{"t":"Оценка из пункта б: доля ≤ 50%.","f":["est_ex"]},{"t":"Пример: 1 контейнер 80 т с сахаром и 4 контейнера по 20 т без: 80/160 = 50%. Ответ: 50%.","f":[]}]}],"tags":["avg"],"facts":["percent","mean","est_ex"],"note":""},{"n":9,"code":"009","src":"159820","stem":"На доске написано 30 натуральных чисел (числа могут повторяться), каждое из которых либо зелёного, либо красного цвета. Каждое зелёное число кратно 3, а каждое красное число кратно 7. При этом все зелёные числа различны и все красные различны (какое-то зелёное число может равняться какому-то красному числу).","parts":[{"l":"а","q":"Может ли сумма написанных чисел быть меньше 1395 = 3+ 6+ ⋅⋅⋅+ 90, если все числа на доске кратны 3?","ak":"yn","av":"ДА","steps":[{"t":"Если все числа кратны 3, то красные кратны 3 и 7, т.е. 21.","f":["div_comp"]},{"t":"Пример: зелёные 3, 6, …, 87 (29 чисел), красное 21. Сумма 3·(1 + … + 29) + 21 = 1305 + 21 = 1326 \u003c 1395. Ответ: да.","f":["sum_1n"]}]},{"l":"б","q":"Может ли ровно одно число на доске быть красным, если сумма написанных чисел равна 1067?","ak":"yn","av":"НЕТ","steps":[{"t":"Если красное одно, зелёных 29 различных кратных 3: их сумма ≥ 3·(1 + … + 29) = 1305 > 1067. Ответ: нет.","f":["distinct_min"]}]},{"l":"в","q":"Какое наименьшее количество красных чисел может быть на доске, если сумма написанных чисел равна 1067?","ak":"num","av":"6","steps":[{"t":"Пусть r красных, 30 − r зелёных. Минимальная сумма: 3·(1+…+(30−r)) + 7·(1+…+r).","f":["distinct_min"]},{"t":"r = 5: 3·325 + 7·15 = 975 + 105 = 1080 > 1067. При меньших r сумма ещё больше. Значит, r ≥ 6.","f":["est_ex"]},{"t":"r = 6: минимум 3·300 + 7·21 = 900 + 147 = 1047. Нужно добавить 20 = 6 + 14: зелёное 72 заменим на 78, красное 42 на 56.","f":["lin_dioph"]},{"t":"Пример: зелёные 3, 6, …, 69, 78; красные 7, 14, 21, 28, 35, 56. Сумма 1067. Ответ: 6.","f":[]}]}],"tags":["div","est"],"facts":["sum_1n","distinct_min","lin_dioph","est_ex"],"note":""},{"n":10,"code":"010","src":"88570","stem":"В продуктовом магазине есть весы с двумя чашами. На одну чашу весов кладут только продукты, на другую — гири. На чашу для гирь можно положить несколько гирь. Магазину разрешено продавать только целое число килограммов продуктов.","parts":[{"l":"а","q":"Можно ли некоторым набором из пяти гирь отвесить любое целое число килограммов от 1 до 25?","ak":"yn","av":"ДА","steps":[{"t":"Гири 1, 2, 4, 8, 16 кг: любое число от 1 до 31 записывается в двоичной системе ⇒ отвешивается. Ответ: да.","f":["pow2"]}]},{"l":"б","q":"Можно ли некоторым набором из четырех гирь отвесить любое целое число килограммов от 1 до 25?","ak":"yn","av":"НЕТ","steps":[{"t":"Из 4 гирь можно составить 2⁴ − 1 = 15 непустых наборов ⇒ не больше 15 разных весов, а нужно 25. Ответ: нет.","f":["pow2"]}]},{"l":"в","q":"Найдите наибольшее значение n такое, что любой вес от 1 до n килограммов можно отвесить каким-нибудь набором из пяти гирь.","ak":"num","av":"31","steps":[{"t":"Из 5 гирь — не больше 2⁵ − 1 = 31 разных весов ⇒ n ≤ 31.","f":["pow2"]},{"t":"Гири 1, 2, 4, 8, 16 дают все веса 1…31. Ответ: 31.","f":["est_ex"]}]}],"tags":["est","seq"],"facts":["pow2","est_ex"],"note":""},{"n":11,"code":"011","src":"64209","stem":"Есть числа A и B. Из них можно сделать числа A +2 и B− 1 или A − 1 и B + 2, только если следующая пара этих чисел будет натуральной. Известно, что A = 5, B = 7.","parts":[{"l":"а","q":"Можно ли за 50 ходов создать пару, где одно из чисел равно 100?","ak":"yn","av":"НЕТ","steps":[{"t":"Каждый ход сумма чисел увеличивается на 1. Начальная сумма 12 ⇒ после 50 ходов сумма 62.","f":["monovar"]},{"t":"Если одно из чисел 100, а другое натуральное, сумма ≥ 101 > 62. Ответ: нет.","f":[]}]},{"l":"б","q":"За сколько ходов можно сделать пару, где сумма чисел будет равна 400?","ak":"num","av":"388","steps":[{"t":"Сумма растёт на 1 за ход: 400 − 12 = 388 ходов.","f":["monovar"]},{"t":"Реализуем: чередуем ходы (A+2, B−1) и (A−1, B+2) — числа остаются натуральными. Ответ: 388.","f":[]}]},{"l":"в","q":"Какое наибольшее число ходов можно сделать, чтобы оба числа не превышали 100?","ak":"num","av":"187","steps":[{"t":"Оба числа ≤ 100 ⇒ сумма ≤ 200 ⇒ ходов ≤ 188.","f":["monovar"]},{"t":"Инвариант: A − B меняется на ±3 ⇒ A − B ≡ 5 − 7 ≡ 1 (mod 3).","f":["invariant"]},{"t":"Сумма 200 только при (100, 100), но 100 − 100 = 0 ≢ 1 (mod 3) ⇒ сумма ≤ 199, ходов ≤ 187.","f":["mod_def"]},{"t":"Пример: x ходов первого типа, y второго: 5 + 2x − y = 100, 7 − x + 2y = 99 ⇒ x = 94, y = 93; чередуя ходы, получаем (100; 99). Ответ: 187.","f":["est_ex"]}]}],"tags":["ops"],"facts":["monovar","invariant","mod_def","est_ex"],"note":""},{"n":12,"code":"012","src":"106603","stem":"Есть три коробки: в первой коробке 97 камней, во второй — 104 камня, а в третьей коробке камней нет. За один ход берут по одному камню из любых двух коробок и кладут в оставшуюся. Сделали некоторое количество таких ходов.","parts":[{"l":"а","q":"Может ли в первой коробке оказаться 97 камней, во второй — 89 камней, а в третьей — 15 камней?","ak":"yn","av":"ДА","steps":[{"t":"Ход «по камню из двух коробок в третью»: изменения (−1, −1, +2). По mod 3 все три числа уменьшаются на 1 ⇒ попарные разности по mod 3 не меняются.","f":["invariant"]},{"t":"(97, 104, 0) → (97, 89, 15): остатки 1, 2, 0 у обоих — противоречия нет.","f":["mod_def"]},{"t":"Пример: 10 ходов «в третью»: (87, 94, 20); затем 5 ходов «в первую»: (97, 89, 15). Ответ: да.","f":[]}]},{"l":"б","q":"Может ли в третьей коробке оказаться 201 камень?","ak":"yn","av":"НЕТ","steps":[{"t":"Было: 104 − 97 = 7 ≡ 1 (mod 3). В состоянии (0, 0, 201) разность 0 − 0 = 0. Инвариант нарушен. Ответ: нет.","f":["invariant"]}]},{"l":"в","q":"В первой коробке оказался 1 камень. Какое наибольшее число камней может оказаться в третьей коробке?","ak":"num","av":"198","steps":[{"t":"Инвариант: b − a ≡ 1, c − a ≡ −97 ≡ 2 (mod 3). При a = 1: b ≡ 2, c ≡ 0 (mod 3).","f":["invariant"]},{"t":"b ≡ 2 (mod 3) ⇒ b ≥ 2 ⇒ c ≤ 201 − 1 − 2 = 198.","f":["est_ex"]},{"t":"Пример: 95 ходов «в третью»: (2, 9, 190); 2 хода «в первую»: (6, 7, 188); ещё 5 ходов «в третью»: (1, 2, 198). Ответ: 198.","f":[]}]}],"tags":["ops"],"facts":["invariant","mod_def","est_ex"],"note":""},{"n":13,"code":"013","src":"90095","stem":"Над парами целых чисел проводится операция: из пары (a;b) получается пара (3a+ b;3b− a).","parts":[{"l":"а","q":"Можно ли из какой-то пары получить пару (5;5)?","ak":"yn","av":"ДА","steps":[{"t":"Решаем 3a + b = 5, 3b − a = 5: a = 3b − 5, 9b − 15 + b = 5 ⇒ b = 2, a = 1.","f":["lin_map"]},{"t":"Проверка: (1; 2) → (3 + 2; 6 − 1) = (5; 5). Ответ: да.","f":[]}]},{"l":"б","q":"Верно ли, что если пара (c;d) может быть получена из какой-то пары с помощью данной операции, то и пара (−d;c) тоже может быть получена из какой-то пары с помощью данной операции?","ak":"yn","av":"ДА","steps":[{"t":"(c; d) = (3a + b; 3b − a). Тогда (−d; c) = (a − 3b; 3a + b).","f":[]},{"t":"Возьмём пару (−b; a): (3·(−b) + a; 3a − (−b)) = (a − 3b; 3a + b) = (−d; c). Ответ: да.","f":["lin_map"]}]},{"l":"в","q":"Зададим расстояние между парами целых чисел (a;b) и (c;d) выражением |a− c|+ |b− d|. Найдите наименьшее расстояние от пары (9;2) до пары, полученной из какой-то пары с помощью данной операции.","ak":"num","av":"3","steps":[{"t":"(c; d) получается ⇔ a = (3c − d)/10 и b = (c + 3d)/10 целые ⇔ c + 3d ≡ 0 (mod 10).","f":["lin_map"]},{"t":"Для (9; 2): 9 + 6 = 15 ≡ 5. Сдвиг (Δc, Δd) должен дать Δc + 3Δd ≡ 5 (mod 10).","f":["mod_def"]},{"t":"Расстояние 1: Δc + 3Δd ∈ {±1, ±3}. Расстояние 2: (±2; 0) → ±2, (0; ±2) → ±6, (±1; ±1) → ±2, ±4. Ни одно не ≡ 5 (mod 10).","f":[]},{"t":"Расстояние 3: Δc = 2, Δd = 1 ⇒ (11; 3) = из пары (3; 2). Ответ: 3.","f":["est_ex"]}]}],"tags":["ops","eq"],"facts":["lin_map","mod_def","est_ex"],"note":""},{"n":14,"code":"014","src":"91755","stem":"Над парами целых чисел проводится операция: из пары (a;b) получается пара (3a+ b;3b+ a).","parts":[{"l":"а","q":"Можно ли из какой-то пары получить пару (5;− 1)?","ak":"yn","av":"ДА","steps":[{"t":"3a + b = 5, a + 3b = −1 ⇒ a = 2, b = −1.","f":["lin_map"]},{"t":"(2; −1) → (6 − 1; −3 + 2) = (5; −1). Ответ: да.","f":[]}]},{"l":"б","q":"Верно ли, что если пара (c;d) может быть получена из какой-то пары с помощью данной операции, то и пара (c− d;d− c) тоже может быть получена из какой-то пары с помощью данной операции?","ak":"yn","av":"ДА","steps":[{"t":"(c; d) = (3a + b; a + 3b) ⇒ c − d = 2(a − b), d − c = 2(b − a).","f":[]},{"t":"Пара (a − b; b − a): (3(a−b) + (b−a); (a−b) + 3(b−a)) = (2(a−b); 2(b−a)). Ответ: да.","f":["lin_map"]}]},{"l":"в","q":"Зададим расстояние между парами целых чисел (a;b) и (c;d) выражением √((a − c)² + (b − d)²) Найдите наименьшее расстояние от пары (9;1) до пары, полученной из какой-то пары с помощью данной операции.","ak":"num","av":"√2","steps":[{"t":"a = (3c − d)/8, b = (3d − c)/8 целые ⇔ d ≡ 3c (mod 8).","f":["lin_map"]},{"t":"Для (9; 1): 3·9 = 27 ≡ 3, а d = 1 — не подходит. Нужно Δd − 3Δc ≡ 2 (mod 8).","f":["mod_def"]},{"t":"Расстояние 1: (0; ±1) даёт ±1, (±1; 0) даёт ∓3 — не 2.","f":[]},{"t":"Расстояние √2: Δc = −1, Δd = −1 даёт −1 + 3 = 2 ✓ ⇒ пара (8; 0) = из (3; −1). Меньших расстояний (кроме 1) между целыми точками нет. Ответ: √2.","f":["est_ex"]}]}],"tags":["ops","eq"],"facts":["lin_map","mod_def","est_ex"],"note":""},{"n":15,"code":"015","src":"105261","stem":"Есть четыре коробки: в первой коробке 101 камень, во второй — 102 камня, в третьей — 103 камня, а в четвёртой камней нет. За один ход берут по одному камню из любых трех коробок и кладут в оставшуюся. Сделали некоторое количество таких ходов.","parts":[{"l":"а","q":"Может ли в первой коробке оказаться 97 камней, во второй — 102 камня, в третьей — 103 камней, а в четвёртой 4 камня?","ak":"yn","av":"ДА","steps":[{"t":"Ход: три коробки −1, четвёртая +3 ≡ −1 (mod 4) ⇒ все разности по mod 4 сохраняются.","f":["invariant"]},{"t":"Если в коробку i сделано mᵢ ходов из M, её изменение 4mᵢ − M. Нужно (−4, 0, 0, +4): M = 4, m = (0, 1, 1, 2).","f":[]},{"t":"Пример: в 4-ю: (100,101,102,3); в 4-ю: (99,100,101,6); во 2-ю: (98,103,100,5); в 3-ю: (97,102,103,4). Ответ: да.","f":[]}]},{"l":"б","q":"Может ли в четвертой коробке быть 306 камней?","ak":"yn","av":"НЕТ","steps":[{"t":"Было 102 − 101 = 1 (mod 4); в (0, 0, 0, 306) разность 0. Инвариант нарушен. Ответ: нет.","f":["invariant"]}]},{"l":"в","q":"Какое максимальное число камней может быть в четвертой коробке?","ak":"num","av":"303","steps":[{"t":"Остатки первых трёх коробок по mod 4 всегда попарно различны (разности 1, 2 — инвариант) ⇒ эти три числа различны ⇒ их сумма ≥ 0 + 1 + 2 = 3.","f":["invariant"]},{"t":"Значит, в четвёртой ≤ 306 − 3 = 303.","f":["est_ex"]},{"t":"Пример: 101 ход в четвёртую коробку: (0, 1, 2, 303). Ответ: 303.","f":[]}]}],"tags":["ops"],"facts":["invariant","mod_def","est_ex"],"note":""},{"n":16,"code":"016","src":"63293","stem":"Из пары натуральных чисел (a;b), где a > b, за один ход получают пару (a+ b;a− b).","parts":[{"l":"а","q":"Можно ли за несколько таких ходов получить из пары (100;1) пару, большее число в которой равно 400?","ak":"yn","av":"ДА","steps":[{"t":"(100; 1) → (101; 99) → (200; 2) → (202; 198) → (400; 4). Ответ: да.","f":[]}]},{"l":"б","q":"Можно ли за несколько таких ходов получить из пары (100;1) пару (806;788)?","ak":"yn","av":"НЕТ","steps":[{"t":"Ход обратим: (x; y) ← ((x+y)/2; (x−y)/2) — предыдущая пара единственна.","f":["reverse"]},{"t":"(806; 788) ← (797; 9) ← (403; 394). Для (403; 394) сумма 797 нечётна ⇒ предыдущей пары нет.","f":["parity"]},{"t":"Значит, получить (806; 788) можно только из (797; 9) или (403; 394), а не из (100; 1). Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наименьшее a может быть в паре (a;b), из которой за несколько ходов можно получить пару (806;788)?","ak":"num","av":"403","steps":[{"t":"Цепочка назад единственна: (797; 9), (403; 394), дальше нельзя.","f":["reverse"]},{"t":"Наименьшее a = 403: (403; 394) → (797; 9) → (806; 788). Ответ: 403.","f":["est_ex"]}]}],"tags":["ops"],"facts":["reverse","parity","est_ex"],"note":""},{"n":17,"code":"017","src":"159854","stem":"По окружности некоторым способом расставили натуральные числа от 1 до 12. Между каждыми двумя соседними числами написали модуль их разности. Затем исходные числа стёрли.","parts":[{"l":"а","q":"Приведите пример расстановки, когда сумма полученных чисел равна 32.","ak":"self","av":"Например: 1, 12, 11, 10, 9, 8, 2, 3, 4, 5, 6, 7 (по кругу). Разности: 11+1+1+1+1+6+1+1+1+1+1+6 = 32.","steps":[{"t":"Сумма разностей = 2·(сумма «вершин» − сумма «впадин»). При одной вершине 12 и одной впадине 1 получаем 22.","f":["abs_sum"]},{"t":"Нужно 32: добавим вершину p и впадину v, p − v = 5: например 7 и 2.","f":[]},{"t":"Расстановка: 1, 12, 11, 10, 9, 8, 2, 3, 4, 5, 6, 7. Разности: 11, 1, 1, 1, 1, 6, 1, 1, 1, 1, 1, 6 — сумма 32.","f":[]}]},{"l":"б","q":"Может ли сумма полученных чисел быть равна 29?","ak":"yn","av":"НЕТ","steps":[{"t":"|a − b| имеет ту же чётность, что a − b. Сумма разностей по кругу (x₁−x₂) + (x₂−x₃) + … + (x₁₂−x₁) = 0 ⇒ сумма модулей чётна.","f":["parity"]},{"t":"29 нечётно. Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наибольшее значение может принимать сумма полученных чисел?","ak":"num","av":"72","steps":[{"t":"Каждое число входит в две разности со знаком «+» или «−». Сумма ≤ 2·(12+11+10+9+8+7) − 2·(1+2+…+6) = 114 − 42 = 72.","f":["abs_sum"]},{"t":"Пример: 1, 12, 2, 11, 3, 10, 4, 9, 5, 8, 6, 7 — разности 11, 10, …, 1 и |7−1| = 6: 66 + 6 = 72. Ответ: 72.","f":["est_ex"]}]}],"tags":["est"],"facts":["abs_sum","parity","est_ex"],"note":""},{"n":18,"code":"018","src":"159718","stem":"На доске написано n единиц подряд. Между некоторыми из них расставляют знаки «+» и считают получившуюся сумму. Например, если было написано 10 единиц, то можно получить сумму 136: 1+ 1+ 111+ 11 +11 +1 = 136.","parts":[{"l":"а","q":"Можно ли получить сумму 132, если n= 60?","ak":"yn","av":"ДА","steps":[{"t":"Пусть a единиц «1» и b чисел «11»: a + 11b = 132 (сумма), a + 2b = 60 (единиц в записи).","f":["lin_dioph"]},{"t":"Вычитая: 9b = 72 ⇒ b = 8, a = 44. Пример: 44 слагаемых «1» и 8 слагаемых «11». Ответ: да.","f":[]}]},{"l":"б","q":"Можно ли получить сумму 132, если n= 80?","ak":"yn","av":"НЕТ","steps":[{"t":"Число из k единиц ≡ k (mod 9) ⇒ сумма ≡ n (mod 9).","f":["repunit"]},{"t":"132 ≡ 1+3+2 = 6 (mod 9), а 80 ≡ 8. Ответ: нет.","f":["ds_mod9"]}]},{"l":"в","q":"Для скольких значений n можно получить сумму 132?","ak":"num","av":"14","steps":[{"t":"n ≡ 6 (mod 9) и n ≤ 132 (больше единиц, чем сумма, быть не может).","f":["repunit"]},{"t":"Наименьшее n: 132 = 111 + 11 + 10·1 — единиц 3 + 2 + 10 = 15. Без 111: 11b + a = 132 даёт единиц 132 − 9b ≥ 24. Меньше 15 нельзя.","f":[]},{"t":"Все n = 15, 24, 33, …, 132 реализуются: от 132 единиц заменяем по 11 единиц на «11» (минус 9 единиц), и 15 = 111 + 11 + 10 единиц.","f":[]},{"t":"Количество: (132 − 15)/9 + 1 = 14. Ответ: 14.","f":["est_ex"]}]},{"l":"г","q":"Какую наибольшую четырёхзначную сумму можно получить, если n = 50?","ak":"num","av":"9554","steps":[{"t":"Слагаемые: a штук 1111, b штук 111, c штук 11, d единиц: 4a + 3b + 2c + d = 50. Сумма = 50 + 1107a + 108b + 9c = 50 + 9(123a + 12b + c).","f":["lin_dioph"]},{"t":"Сумма ≤ 9999 ⇒ 123a + 12b + c ≤ 1105 ⇒ a ≤ 8.","f":[]},{"t":"При a = 8 осталось 18 единиц: 12b + c при 3b + 2c ≤ 18 максимально при b = 6: 984 + 72 = 1056. При a ≤ 7 меньше.","f":["est_ex"]},{"t":"Сумма 50 + 9·1056 = 9554 = 8·1111 + 6·111. Ответ: 9554.","f":[]}]}],"tags":["digits"],"facts":["repunit","ds_mod9","lin_dioph","est_ex"],"note":""},{"n":19,"code":"019","src":"175399","stem":"Восемь различных натуральных чисел таковы, что никакие два не имеют общего делителя, большего 1.","parts":[{"l":"а","q":"Может ли сумма всех восьми чисел быть равна 65?","ak":"yn","av":"ДА","steps":[{"t":"Пример: 1, 2, 3, 5, 7, 11, 13, 23 — попарно взаимно простые, сумма 65. Ответ: да.","f":["coprime"]}]},{"l":"б","q":"Может ли сумма всех восьми чисел быть равна 62?","ak":"yn","av":"НЕТ","steps":[{"t":"Чётных чисел не больше одного. Если одно чётное — сумма 7 нечётных + чётное нечётна. Сумма 62 чётна ⇒ все числа нечётные.","f":["parity"]},{"t":"Нечётные числа > 1 имеют разные нечётные простые делители ⇒ сумма ≥ 1 + 3 + 5 + 7 + 11 + 13 + 17 + 19 = 76 > 62. Ответ: нет.","f":["prime_min"]}]},{"l":"в","q":"Какое наименьшее значение может принимать сумма всех восьми чисел?","ak":"num","av":"59","steps":[{"t":"Каждое число > 1 не меньше своего наименьшего простого делителя, а эти делители попарно различны.","f":["prime_min"]},{"t":"Сумма ≥ 1 + 2 + 3 + 5 + 7 + 11 + 13 + 17 = 59.","f":["coprime"]},{"t":"Пример: ровно эти числа. Ответ: 59.","f":["est_ex"]}]}],"tags":["div","est"],"facts":["coprime","prime_min","parity","est_ex"],"note":""},{"n":20,"code":"021","src":"126272","stem":"На доске записано некоторое количество последовательных натуральных чисел, среди которых ровно пять делятся на 15.","parts":[{"l":"а","q":"Могло ли среди записанных чисел быть больше пяти чисел, делящихся на 16?","ak":"yn","av":"ДА","steps":[{"t":"Ровно 5 кратных 15 ⇒ длина L от 61 до 89. Чтобы кратных 16 было 6, нужна L ≥ 81.","f":["div_count"]},{"t":"Пример: 16, 17, …, 96 (81 число). Кратные 16: 16, 32, 48, 64, 80, 96; кратные 15: 30, 45, 60, 75, 90. Ответ: да.","f":[]}]},{"l":"б","q":"Могло ли среди записанных чисел быть меньше пяти чисел, делящихся на 11?","ak":"yn","av":"НЕТ","steps":[{"t":"L ≥ 61 ≥ 55 = 5·11 ⇒ среди чисел есть 5 блоков по 11 подряд ⇒ кратных 11 не меньше пяти. Ответ: нет.","f":["div_count"]}]},{"l":"в","q":"Найдите наибольшее возможное число k такое, что среди записанных чисел больше пяти чисел делятся на k.","ak":"num","av":"17","steps":[{"t":"Больше пяти кратных k ⇒ L ≥ 5k + 1, а L ≤ 89 ⇒ k ≤ 17.","f":["div_count"]},{"t":"Пример: 17, 18, …, 102 (86 чисел): кратные 17 — 17, 34, 51, 68, 85, 102; кратные 15 — 30, 45, 60, 75, 90. Ответ: 17.","f":["est_ex"]}]}],"tags":["div"],"facts":["div_count","est_ex"],"note":""},{"n":21,"code":"022","src":"125976","stem":"На доске записано k последовательных натуральных чисел. Оказалось, что среди них чисел, делящихся на 20, меньше, чем чисел, делящихся на 23.","parts":[{"l":"а","q":"Могло ли среди записанных чисел быть ровно три числа, делящихся на 20?","ak":"yn","av":"ДА","steps":[{"t":"Кратных 23 хотя бы 4 ⇒ L ≥ 70; кратных 20 ровно 3 ⇒ L ≤ 79.","f":["div_count"]},{"t":"Пример: 23, 24, …, 92: кратные 23 — 23, 46, 69, 92; кратные 20 — 40, 60, 80. Ответ: да.","f":[]}]},{"l":"б","q":"Могло ли среди записанных чисел быть ровно десять чисел, делящихся на 20?","ak":"yn","av":"НЕТ","steps":[{"t":"10 кратных 20 ⇒ L ≤ 11·20 − 1 = 219. Не меньше 11 кратных 23 ⇒ L ≥ 10·23 + 1 = 231. Противоречие. Ответ: нет.","f":["div_count"]}]},{"l":"в","q":"Найдите наибольшее возможное значение k.","ak":"num","av":"139","steps":[{"t":"m кратных 20 и ≥ m + 1 кратных 23: 23m + 1 ≤ L ≤ 20m + 19 ⇒ m ≤ 6 ⇒ L ≤ 139.","f":["div_count"]},{"t":"При L = 139 и m = 6 отрезок начинается и кончается кратными 23, а начало ≡ 1 (mod 20): 23t ≡ 1 (mod 20) ⇒ t = 7, начало 161.","f":["mod_def"]},{"t":"Пример: 161, …, 299. Кратные 23: 161, 184, 207, 230, 253, 276, 299 (7); кратные 20: 180, 200, 220, 240, 260, 280 (6). Ответ: 139.","f":["est_ex"]}]}],"tags":["div"],"facts":["div_count","est_ex","mod_def"],"note":""},{"n":22,"code":"023","src":"159632","stem":"По кругу расставлено N различных натуральных чисел, каждое из которых не превосходит 400. Сумма любых четырёх идущих подряд чисел делится на 3, а сумма любых трёх идущих подряд чисел не делится на 3.","parts":[{"l":"а","q":"Может ли N быть равным 360?","ak":"yn","av":"НЕТ","steps":[{"t":"Суммы 4 подряд кратны 3 ⇒ aᵢ₊₄ ≡ aᵢ (mod 3).","f":["mod_shift"]},{"t":"Если какое-то число ≡ 0, то сумма трёх других из той же четвёрки ≡ 0 — запрещено. Значит, кратных 3 нет, а в каждой четвёрке два остатка 1 и два остатка 2 ⇒ чисел с остатком 1 и с остатком 2 поровну, по N/2.","f":["mod_def"]},{"t":"Чисел ≤ 400 с остатком 2: 2, 5, …, 398 — их 133 ⇒ N ≤ 266 \u003c 360. Ответ: нет.","f":[]}]},{"l":"б","q":"Может ли N быть равным 149?","ak":"yn","av":"НЕТ","steps":[{"t":"По кругу период 4 и период N ⇒ при нечётном N период 1: все остатки одинаковы, r. Тогда 4r ≡ 0 ⇒ r = 0 — а кратных 3 быть не может.","f":["mod_shift"]},{"t":"149 нечётно. Ответ: нет.","f":[]}]},{"l":"в","q":"Найдите наибольшее значение N.","ak":"num","av":"266","steps":[{"t":"Из пункта а: N ≤ 2·133 = 266.","f":["est_ex"]},{"t":"Пример: по кругу чередуем числа с остатком 1 (1, 4, …, 397 — берём 133 из 134) и с остатком 2 (2, 5, …, 398 — все 133). Тройки дают 1+2+1 = 4 или 2+1+2 = 5 (не кратны 3), четвёрки 6. Ответ: 266.","f":[]}]}],"tags":["div","est"],"facts":["mod_shift","mod_def","est_ex"],"note":""},{"n":23,"code":"024","src":"56126","stem":"Егор делит линейку на части. За одно действие он может отрезать от любого количества линеек равные части, имеющие целую длину.","parts":[{"l":"а","q":"Может ли Егор за 4 хода разделить линейку длиной в 16 см на части по 1 см?","ak":"yn","av":"ДА","steps":[{"t":"За ход от каждой линейки можно отрезать одинаковую часть. 16 → 8+8 (отрезали 8) → по 4 (отрезали 4 от каждой) → по 2 → по 1. Четыре хода. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли Егор за 5 ходов разделить линейку длиной в 100 см на части по 1 см?","ak":"yn","av":"НЕТ","steps":[{"t":"За один ход каждая линейка делится не более чем на 2 части ⇒ число частей за ход не более чем удваивается.","f":["double_bound"]},{"t":"За 5 ходов не больше 2⁵ = 32 частей, а нужно 100. Ответ: нет.","f":[]}]},{"l":"в","q":"За какое наименьшее количество ходов Егор может разделить линейку длиной в 300 см на части по 1 см?","ak":"num","av":"9","steps":[{"t":"Нужно 300 частей; после k ходов частей ≤ 2ᵏ; 2⁸ = 256 \u003c 300 ⇒ ходов ≥ 9.","f":["double_bound"]},{"t":"Пример за 9 ходов (каждый раз режем все куски): 300 → 150,150 → 75 (×4) → 37 и 38 → 18 и 19 → 9 и 10 → 4 и 5 → 2 и 3 → 1 и 2 → 1.","f":[]},{"t":"Подробно: отрезаем 150; 75; 37 (75 → 37+38); 19 (38 → 19+19, 37 → 19+18); 9; 5; 2; 1; 1. После каждого хода длины отличаются не больше чем на 1. Ответ: 9.","f":["est_ex"]}]}],"tags":["ops","est"],"facts":["double_bound","pow2","est_ex"],"note":""},{"n":24,"code":"025","src":"2457","stem":"Учитель задумал несколько необязательно различных натуральных чисел. Эти числа и результаты всех их возможных произведений по два числа, по три числа и так далее он выписал на доску. Если какое-то число, выписанное на доску, повторяется несколько раз, то на доске оставляют только одно такое число, а другие равные ему числа стирают. Например, если задуманы числа 1, 5, 6, 5, то на доске будет набор 1, 5, 6, 30, 25, 150.","parts":[{"l":"а","q":"Приведите пример задуманных чисел, для которых на доске будет записан набор 2, 3, 5, 6, 9, 10, 15, 18, 30, 45, 90.","ak":"self","av":"Например, задуманы 2, 3, 3, 5.","steps":[{"t":"90 = 2·3²·5 — наибольшее число, произведение всех задуманных. 9 на доске, а 27 нет ⇒ двоек-троек немного.","f":["fta"]},{"t":"Пробуем 2, 3, 3, 5: одиночные 2, 3, 5; пары 6, 9, 10, 15; тройки 18, 30, 45; все 90. Набор совпадает.","f":[]}]},{"l":"б","q":"Существует ли пример таких задуманных чисел, для которых на доске будет записан набор 3, 5, 7, 9, 15, 21, 35, 45, 105, 315, 945?","ak":"yn","av":"НЕТ","steps":[{"t":"1 на доске нет ⇒ единиц среди задуманных нет. Простые 3, 5, 7 можно получить только как задуманные числа ⇒ 3, 5, 7 задуманы.","f":["prime_only"]},{"t":"Наибольшее 945 = 3³·5·7 — произведение всех. Значит, остальные задуманные дают в произведении 9: это 9 или 3 и 3.","f":["fta"]},{"t":"В обоих случаях на доске появится 27 (3·9 или 3·3·3), а его в наборе нет. Ответ: нет.","f":[]}]},{"l":"в","q":"Приведите все примеры шести задуманных чисел, для которых на доске будет записан набор, наибольшее число в котором равно 82.","ak":"self","av":"82, 1, 1, 1, 1, 1 или 2, 41, 1, 1, 1, 1.","steps":[{"t":"Наибольшее число на доске — произведение всех шести задуманных: оно равно 82 = 2·41.","f":["fta"]},{"t":"Разложить 82 в произведение 6 натуральных: либо 82·1·1·1·1·1, либо 2·41·1·1·1·1.","f":["prime_only"]},{"t":"Оба варианта дают наибольшее 82. Ответ: 82, 1, 1, 1, 1, 1 или 2, 41, 1, 1, 1, 1.","f":[]}]}],"tags":["div"],"facts":["fta","prime_only","est_ex"],"note":""},{"n":25,"code":"026","src":"185802","stem":"На столе лежит N монет по 2 рубля и 1200− N по 5 рублей. N может принимать значения от 1 до 1199. Известно, что если взять любые 500 монет, то их сумма будет составлять не меньше четверти от общей суммы.","parts":[{"l":"а","q":"Может ли N равняться 400?","ak":"yn","av":"ДА","steps":[{"t":"Общая сумма 2N + 5(1200 − N) = 6000 − 3N. Худший случай — взять 500 самых дешёвых монет.","f":[]},{"t":"N = 400: 400 двухрублёвых и 100 пятирублёвых: 800 + 500 = 1300; четверть суммы (6000 − 1200)/4 = 1200. 1300 ≥ 1200. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли N равняться 600?","ak":"yn","av":"НЕТ","steps":[{"t":"N = 600: 500 двухрублёвых = 1000 р.; четверть (6000 − 1800)/4 = 1050 > 1000. Ответ: нет.","f":[]}]},{"l":"в","q":"Сколько различных значений может принимать N?","ak":"num","av":"977","steps":[{"t":"Если N ≥ 500: 1000 ≥ (6000 − 3N)/4 ⇒ N ≥ 666,7 ⇒ N ≥ 667.","f":[]},{"t":"Если N \u003c 500: 2N + 5(500 − N) ≥ (6000 − 3N)/4 ⇒ 10000 − 12N ≥ 6000 − 3N ⇒ N ≤ 444.","f":[]},{"t":"Подходят N = 1…444 и 667…1199: 444 + 533 = 977. Ответ: 977.","f":["est_ex"]}]}],"tags":["est"],"facts":["est_ex","lin_dioph"],"note":""},{"n":26,"code":"027","src":"1015","stem":"На доске написано несколько различных натуральных чисел, произведение любых двух из которых больше 40 и меньше 100.","parts":[{"l":"а","q":"Может ли на доске быть 5 чисел?","ak":"yn","av":"ДА","steps":[{"t":"Пример: 6, 7, 8, 9, 10. Наименьшее произведение 6·7 = 42 > 40, наибольшее 9·10 = 90 \u003c 100. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли на доске быть 6 чисел?","ak":"yn","av":"НЕТ","steps":[{"t":"a₁ \u003c … \u003c a₆. a₁a₂ > 40 ⇒ a₂ ≥ 7 (иначе a₁a₂ ≤ 5·6 = 30).","f":["extreme"]},{"t":"Тогда a₅ ≥ 10, a₆ ≥ 11 ⇒ a₅a₆ ≥ 110 > 100. Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наибольшее значение может принимать сумма чисел на доске, если их четыре?","ak":"num","av":"35","steps":[{"t":"a \u003c b \u003c c \u003c d. cd \u003c 100 и c \u003c d ⇒ c ≤ 9. ab > 40 при b \u003c c ≤ 9 ⇒ b ≤ 8, a ≥ 6.","f":["extreme"]},{"t":"c = 9: d ≤ 11 (9·11 = 99), a + b ≤ 7 + 8 = 15 ⇒ сумма ≤ 35. c = 8: d ≤ 12, a + b ≤ 13 ⇒ ≤ 33.","f":["est_ex"]},{"t":"Пример: 7, 8, 9, 11 — произведения 56, 63, 77, 72, 88, 99. Ответ: 35.","f":[]}]}],"tags":["est"],"facts":["est_ex","extreme"],"note":""},{"n":27,"code":"027","src":"23745","stem":"На доске написано 100 различных натуральных чисел, сумма которых равна 5120.","parts":[{"l":"а","q":"Может ли оказаться, что на доске написано число 230?","ak":"yn","av":"НЕТ","steps":[{"t":"Остальные 99 чисел различны ⇒ их сумма ≥ 1 + … + 99 = 4950.","f":["sum_1n"]},{"t":"Вместе с 230: ≥ 5180 > 5120. Ответ: нет.","f":[]}]},{"l":"б","q":"Может ли оказаться, что на доске нет числа 14?","ak":"yn","av":"НЕТ","steps":[{"t":"Без 14 наименьшая сумма 100 различных: 1 + … + 101 − 14 = 5151 − 14 = 5137 > 5120. Ответ: нет.","f":["distinct_min"]}]},{"l":"в","q":"Какое наименьшее количество чисел, кратных 14, может быть на доске?","ak":"num","av":"4","steps":[{"t":"Пусть кратных 14 не больше 3. Тогда некратных ≥ 97. 97 наименьших некратных 14 — это числа 1…104 без 14, 28, …, 98: сумма 5460 − 392 = 5068.","f":["distinct_min"]},{"t":"Плюс ещё 3 числа, кратных 14 (≥ 14 + 28 + 42 = 84): сумма ≥ 5152 > 5120. Значит, кратных 14 хотя бы 4.","f":["est_ex"]},{"t":"Пример: 1…102 без 70, 84, 98 и число 119: сумма 5120, кратные 14 только 14, 28, 42, 56. Ответ: 4.","f":[]}]}],"tags":["est","div"],"facts":["sum_1n","distinct_min","est_ex"],"note":""},{"n":28,"code":"028","src":"15856","stem":"В течение n дней каждый день на доску записывают натуральные числа, каждое из которых меньше 6. При этом каждый день (кроме первого) сумма чисел, записанных на доску в этот день, больше, а количество меньше, чем в предыдущий день.","parts":[{"l":"а","q":"Может ли n быть больше 5?","ak":"yn","av":"ДА","steps":[{"t":"Пример на 6 дней (в k-й день: k − 1 троек и 12 − 2k единиц).","f":[]},{"t":"1-й: 10 единиц (10); 2-й: 3 и 8 единиц (11, 9 чисел); 3-й: 3,3 и 6 единиц (12, 8 чисел); 4-й: три 3 и 4 единицы (13, 7); 5-й: четыре 3 и 2 единицы (14, 6); 6-й: пять 3 (15, 5). Ответ: да.","f":[]}]},{"l":"б","q":"Может ли среднее арифметическое чисел, записанных в первый день, быть меньше 3, а среднее арифметическое всех чисел, записанных за все дни, быть больше 4?","ak":"yn","av":"ДА","steps":[{"t":"День 1: 11 чисел (десять 3 и одна 2), сумма 32, среднее ≈ 2,91 \u003c 3.","f":["mean"]},{"t":"День 2: 10 чисел (четыре 5 и шесть 4), сумма 44. День 3: девять 5, сумма 45.","f":[]},{"t":"Всего 121/30 ≈ 4,03 > 4. Количество убывает (11, 10, 9), сумма растёт (32, 44, 45). Ответ: да.","f":[]}]},{"l":"в","q":"Известно, что сумма чисел, записанных в первый день, равна 6. Какое наибольшее значение может принимать сумма всех чисел, записанных за все дни?","ak":"num","av":"48","steps":[{"t":"Сумма 6 в первый день ⇒ чисел c₁ ≤ 6. Количества убывают ⇒ дней ≤ 6. В последний день c чисел, сумма ≤ 5c, а все суммы растут ⇒ каждая сумма ≤ 5·c_последний.","f":[]},{"t":"Если дней n, то c_последний ≤ 7 − n. Сумма ≤ 6 + 5(7−n) + (5(7−n) − 1) + … (n − 1 слагаемых).","f":["est_ex"]},{"t":"n = 2: 31; n = 3: 6 + 20 + 19 = 45; n = 4: 6 + 15 + 14 + 13 = 48; n = 5: 6 + 10 + 9 + 8 + 7 = 40; n = 6 невозможно (одно число ≤ 5 \u003c 6).","f":[]},{"t":"Пример: 1,1,1,1,1,1 (6); 3,3,3,2,2 (13); 5,3,3,3 (14); 5,5,5 (15) — всего 48. Ответ: 48.","f":[]}]}],"tags":["est","avg"],"facts":["mean","est_ex"],"note":""},{"n":29,"code":"029","src":"26707","stem":"Из первых 22 натуральных чисел 1, 2, …, 22 выбрали 2k различных чисел. Выбранные числа разбили на пары и посчитали суммы чисел в каждой паре. Оказалось, что все полученные суммы различны и не превосходят 27.","parts":[{"l":"а","q":"Может ли получиться так, что сумма всех 2k выбранных чисел равняется 170 и в каждой паре одно из чисел ровно в три раза больше другого?","ak":"yn","av":"НЕТ","steps":[{"t":"Пара (x; 3x) даёт сумму 4x ⇒ сумма всех выбранных кратна 4.","f":["div_def"]},{"t":"170 не делится на 4. Ответ: нет.","f":[]}]},{"l":"б","q":"Может ли число k быть равным 11?","ak":"yn","av":"НЕТ","steps":[{"t":"k = 11 ⇒ выбраны все 22 числа, сумма 253.","f":["sum_1n"]},{"t":"11 разных сумм пар, каждая ≤ 27: ≤ 27 + 26 + … + 17 = 242 \u003c 253. Ответ: нет.","f":[]}]},{"l":"в","q":"Найдите наибольшее возможное значение числа k.","ak":"num","av":"10","steps":[{"t":"k = 11 нельзя (пункт б) ⇒ k ≤ 10. Проверим: 20 чисел дают ≥ 210, а 10 разных сумм ≤ 27 + … + 18 = 225 — оценка не мешает.","f":["est_ex"]},{"t":"Пример: (1;17), (3;16), (2;18), (6;15), (9;13), (11;12), (10;14), (4;21), (7;19), (5;22) — суммы 18, 19, …, 27. Ответ: 10.","f":[]}]}],"tags":["est"],"facts":["sum_1n","div_def","est_ex"],"note":""},{"n":30,"code":"030","src":"159856","stem":"Тройку различных натуральных чисел назовём удачной, если любое число в ней хотя бы на 5 больше, чем треть суммы двух других чисел. Например, 40, 45, 50 — удачная тройка.","parts":[{"l":"а","q":"Сколько существует удачных троек, содержащих числа 50, 60 и ещё одно число, большее 60?","ak":"num","av":"15","steps":[{"t":"Удачная: для каждого числа 3x ≥ (сумма двух других) + 15.","f":[]},{"t":"Для 50: 150 ≥ 60 + x + 15 ⇒ x ≤ 75. Для 60: x ≤ 115. Для x: 3x ≥ 125.","f":[]},{"t":"x от 61 до 75 — 15 троек. Ответ: 15.","f":[]}]},{"l":"б","q":"Найдётся ли удачная тройка, одно из чисел которой равно 15?","ak":"yn","av":"НЕТ","steps":[{"t":"Пусть 15, y, z. Для 15: 45 ≥ y + z + 15 ⇒ y + z ≤ 30.","f":[]},{"t":"Для y и z: 3y ≥ z + 30, 3z ≥ y + 30 ⇒ сложим: y + z ≥ 30 ⇒ y + z = 30 и 4y ≥ 60, 4z ≥ 60 ⇒ y = z = 15 — не различны. Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наибольшее количество чисел от 1 до 100 включительно можно расставить по кругу так, чтобы каждое число встречалось не более одного раза и любые три подряд идущих числа образовывали удачную тройку?","ak":"num","av":"80","steps":[{"t":"Пусть m — наименьшее число на круге, по две соседки с каждой стороны: a′, a, m, b, b′. Тройки (a′,a,m), (a,m,b), (m,b,b′) удачны ⇒ для m: a + a′ ≤ 3m − 15, b + b′ ≤ 3m − 15, a + b ≤ 3m − 15.","f":["extreme"]},{"t":"Четыре различных числа > m разбиты на пары {a,a′} и {b,b′}; одна из пар ≥ (m+1)+(m+4) или (m+2)+(m+3) = 2m + 5 ⇒ 2m + 5 ≤ 3m − 15 ⇒ m ≥ 20.","f":[]},{"t":"Если m = 20: соседи — ровно 21, 22, 23, 24 (суммы пар 45). Если 21 стоит рядом с 20, а 24 за ним, то для тройки (x, 24, 21): 63 ≥ 24 + x + 15 ⇒ x ≤ 24 — но все числа 20…24 заняты. Если 21 дальний, то a = 24 и a + b ≤ 45 ⇒ b ≤ 21 — противоречие. Значит, m ≥ 21 и чисел ≤ 80.","f":["est_ex"]},{"t":"Пример: 21, 23, 25, …, 99, 100, 98, …, 24, 22 (по кругу). Проверка: (x, x+2, x+4) при x ≥ 21 удачна; на стыках (97,99,100), (24,22,21), (22,21,23) тоже. Ответ: 80.","f":[]}]}],"tags":["est"],"facts":["extreme","est_ex"],"note":""},{"n":31,"code":"031","src":"18140","stem":"Последовательность натуральных чисел (aₙ) состоит из 400 членов. Каждый член последовательности, начиная со второго, либо вдвое больше предыдущего, либо на 98 меньше предыдущего.","parts":[{"l":"а","q":"Может ли последовательность (aₙ) содержать ровно 5 различных чисел?","ak":"yn","av":"ДА","steps":[{"t":"Цикл: 14 → 28 → 56 → 112 → 14 (112 − 98 = 14).","f":[]},{"t":"Последовательность 7, 14, 28, 56, 112, 14, 28, … (400 членов) содержит ровно 5 различных чисел. Ответ: да.","f":[]}]},{"l":"б","q":"Чему может равняться a₁, если a₁₀₀ = 75?","ak":"num","av":"9777","steps":[{"t":"Предыдущий член для x: x/2 или x + 98. Если x нечётно, x/2 не целое ⇒ предыдущий x + 98 — тоже нечётный.","f":["reverse"]},{"t":"75 нечётно ⇒ все члены до a₁₀₀ нечётны и каждый на 98 больше следующего.","f":["parity"]},{"t":"a₁ = 75 + 99·98 = 9777. Ответ: 9777.","f":[]}]},{"l":"в","q":"Какое наименьшее значение может принимать наибольший член последовательности (aₙ)?","ak":"num","av":"112","steps":[{"t":"400 членов из конечного набора ⇒ есть повтор ⇒ есть цикл. Пусть M — наибольший член цикла, и все члены ≤ 111.","f":["dirichlet"]},{"t":"После M идёт M − 98 (2M > M) ⇒ M ≥ 99. Перед M может стоять только M/2 (M + 98 > M) ⇒ M чётно, M ∈ {100, …, 110}.","f":["extreme"]},{"t":"Перед M/2 — M/4 (M/2 + 98 > M) ⇒ M ∈ {100, 104, 108}; перед M/4 — M/8 (M/4 + 98 > M) ⇒ M = 104, M/8 = 13. Перед 13: 6,5 или 111 > 104 — противоречие.","f":[]},{"t":"Значит, наибольший член ≥ 112. Пример: 14, 28, 56, 112, 14, … Ответ: 112.","f":["est_ex"]}]}],"tags":["seq","ops"],"facts":["reverse","parity","extreme","dirichlet","est_ex"],"note":""},{"n":32,"code":"032","src":"159865","stem":"Маша и Наташа делали фотографии в течении некоторого количества подряд идущих дней. В первый день Маша сделала m фотографий, а Наташа — n фотографий. В каждый следующий день каждая из девочек делала на одну фотографию больше, чем в предыдущий. Известно, что в общей сложности Наташа сделала суммарно на 1001 фотографию больше, чем Маша, и что фотографировали они больше одного дня.","parts":[{"l":"а","q":"Могли ли они фотографировать в течение 7 дней?","ak":"yn","av":"ДА","steps":[{"t":"За k дней разница фото Наташи и Маши: k(n − m) = 1001 = 7·11·13.","f":["ap"]},{"t":"k = 7: n − m = 143, например m = 1, n = 144. Ответ: да.","f":["fta"]}]},{"l":"б","q":"Могли ли они фотографировать в течение 8 дней?","ak":"yn","av":"НЕТ","steps":[{"t":"8 не делит 1001 (1001 нечётно). Ответ: нет.","f":["fta"]}]},{"l":"в","q":"Какое наибольшее суммарное число фотографий могла сделать Наташа за все дни фотографирования, если известно, что в последний день Маша сделала меньше 40 фотографий?","ak":"num","av":"1430","steps":[{"t":"Маша в последний день: m + k − 1 \u003c 40 ⇒ k ≤ 39 − m + 1. k | 1001, k > 1 ⇒ k ∈ {7, 11, 13} (77 > 39).","f":["fta"]},{"t":"Наташа всего: kn + k(k−1)/2 = km + 1001 + k(k−1)/2, максимум при m = 40 − k.","f":["ap"]},{"t":"k = 7: 231 + 1001 + 21 = 1253; k = 11: 319 + 1001 + 55 = 1375; k = 13: 351 + 1001 + 78 = 1430.","f":["est_ex"]},{"t":"Пример: 13 дней, m = 27, n = 104. Ответ: 1430.","f":[]}]}],"tags":["seq","div"],"facts":["ap","fta","est_ex"],"note":""},{"n":33,"code":"033","src":"15852","stem":"Вася и Петя решали задачи из сборника, и они оба решили все задачи этого сборника. Каждый день Вася решал на одну задачу больше, чем в предыдущий день, а Петя решал на две задачи больше, чем в предыдущий день. Они начали решать задачи в один день, при этом в первый день каждый из них решил хотя бы одну задачу.","parts":[{"l":"а","q":"Могло ли получиться так, что Вася в первый день решил на одну задачу меньше, чем Петя, а Петя решил все задачи из сборника ровно за 5 дней?","ak":"yn","av":"ДА","steps":[{"t":"Петя: b, b+2, …, за 5 дней 5b + 20. Вася: b − 1, b, …, за p дней.","f":["ap"]},{"t":"b = 3: Петя 3+5+7+9+11 = 35. Вася с 2: 2+3+4+5+6+7+8 = 35 за 7 дней. Ответ: да.","f":[]}]},{"l":"б","q":"Могло ли получиться так, что Вася в первый день решил на одну задачу больше, чем Петя, а Петя решил все задачи из сборника ровно за 4 дня?","ak":"yn","av":"НЕТ","steps":[{"t":"Вася начинает с a, Петя с a − 1. Петя за 4 дня: 4(a−1) + 12 = 4a + 8.","f":["ap"]},{"t":"Вася за p дней: p ≤ 3 — не больше 3a + 3 \u003c 4a + 8; p = 4 — 4a + 6 ≠ 4a + 8; p ≥ 5 — ≥ 5a + 10 > 4a + 8. Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наименьшее количество задач могло быть в сборнике, если каждый из ребят решал задачи более 6 дней, причем в первый день один из мальчиков решил на одну задачу больше чем другой?","ak":"num","av":"84","steps":[{"t":"Петя q ≥ 7 дней: T = qb + q(q−1); Вася p ≥ 7: T = pa + p(p−1)/2, |a − b| = 1.","f":["ap"]},{"t":"Если T \u003c 84: q = 7 ⇒ T = 7(b + 6) ∈ {49, 56, 63, 70, 77}; q = 8 ⇒ T ∈ {64, 72, 80}; q = 9 ⇒ T = 81 (b = 1); q ≥ 10 ⇒ T ≥ 100.","f":[]},{"t":"Суммы Васи (p ≥ 7 дней) меньше 84: a=1: 28, 36, 45, 55, 66, 78; a=2: 35, 44, 54, 65, 77; a=3: 42, 52, 63, 75; a=4: 49, 60, 72; a=5: 56, 68, 81; a=6: 63, 76.","f":["lin_dioph"]},{"t":"Сверяем с Петей при a = b ± 1: b=1 (49, 64, 81) — у a=2 таких нет; b=2 (56, 72) — нет у a=1 и a=3; b=3 (63, 80) — нет у a=2 и a=4; b=4 (70) — нет у a=3, a=5; b=5 (77) — нет у a=4, a=6. Значит, T ≥ 84.","f":[]},{"t":"Пример T = 84: Вася 7, 8, …, 14 (8 дней), Петя 6, 8, …, 18 (7 дней). Ответ: 84.","f":["est_ex"]}]}],"tags":["seq","eq"],"facts":["ap","lin_dioph","est_ex"],"note":""},{"n":34,"code":"034","src":"91754","stem":"На сайте проводится опрос, кого из футболистов посетители сайта считают лучшим по итогам сезона. Каждый посетитель голосует за одного футболиста. На сайте отображается рейтинг каждого футболиста — доля голосов, отданных за него, в процентах, округленная до целого числа. Например, числа 9,3, 10,5 и 12,7 округляются до 9, 11 и 13 соответственно.","parts":[{"l":"а","q":"Всего проголосовало 13 посетителей сайта. Голоса распределились так, что рейтинг некоторого футболиста стал равным 31. Затем Вася проголосовал за этого футболиста. Каков теперь рейтинг футболиста с учётом голоса Васи?","ak":"num","av":"36","steps":[{"t":"30,5 ≤ 100v/13 \u003c 31,5 ⇒ 3,97 ≤ v \u003c 4,1 ⇒ v = 4.","f":["rounding"]},{"t":"После голоса Васи: 5/14 ≈ 35,7% → 36. Ответ: 36.","f":[]}]},{"l":"б","q":"Голоса распределяют между двумя футболистами. Может ли суммарный рейтинг быть больше 100?","ak":"yn","av":"ДА","steps":[{"t":"Пример: 8 голосов, 1 и 7: 12,5% → 13, 87,5% → 88. Сумма 101 > 100. Ответ: да.","f":["rounding"]}]},{"l":"в","q":"На сайте отображалось, что рейтинг некоторого футболиста равен 7. После того, как Вася отдал свой голос за этого футболиста, рейтинг стал равен 9. При каком наибольшем числе отданных за всех футболистов голосов, включая Васин голос, такое возможно?","ak":"num","av":"82","steps":[{"t":"Было N голосов, v за футболиста: 6,5 ≤ 100v/N \u003c 7,5; после: 8,5 ≤ 100(v+1)/(N+1) \u003c 9,5.","f":["rounding"]},{"t":"Отсюда 0,085(N+1) − 1 ≤ v \u003c 0,075N ⇒ 0,01N \u003c 0,915 ⇒ N ≤ 91 ⇒ v \u003c 0,075·91 \u003c 7 ⇒ v ≤ 6.","f":[]},{"t":"v + 1 ≥ 0,085(N + 1) ⇒ 7 ≥ 0,085(N+1) ⇒ N + 1 ≤ 82.","f":["est_ex"]},{"t":"Пример: N = 81, v = 6: 6/81 ≈ 7,4% → 7; 7/82 ≈ 8,5% → 9. Голосов с Васиным 82. Ответ: 82.","f":[]}]}],"tags":["avg"],"facts":["rounding","percent","est_ex"],"note":""},{"n":35,"code":"035","src":"63290","stem":"В классе больше 10, но не больше 26 учащихся, а доля девочек не превышает 21%.","parts":[{"l":"а","q":"Может ли в этом классе быть 5 девочек?","ak":"yn","av":"ДА","steps":[{"t":"24 ученика, 5 девочек: 5/24 ≈ 20,8% ≤ 21%. Ответ: да.","f":["percent"]}]},{"l":"б","q":"Может ли доля девочек составить 30%, если в этот класс придёт новая девочка?","ak":"yn","av":"НЕТ","steps":[{"t":"Было n учеников (11…26), стало n + 1 (12…27). 30% ⇒ n + 1 кратно 10 ⇒ n + 1 = 20, девочек стало 6, было 5.","f":[]},{"t":"5/19 ≈ 26% > 21%. Ответ: нет.","f":[]}]},{"l":"в","q":"В этот класс пришла новая девочка. Доля девочек в классе составила целое число процентов. Какое наибольшее число процентов может составить доля девочек в классе?","ak":"num","av":"25","steps":[{"t":"Девочек g ≤ 0,21n, доля после (g+1)/(n+1).","f":["percent"]},{"t":"Перебор n = 11…26 с g = [0,21n]: наибольшие доли 3/12 (n = 11) и 4/16 (n = 15) — 25%; при остальных n доля меньше 25% (например, 6/25 = 24%, 5/21 ≈ 23,8%).","f":["est_ex"]},{"
