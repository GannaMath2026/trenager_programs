t":"Пример: было 15 учеников, 3 девочки (20%), пришла девочка: 4/16 = 25%. Ответ: 25.","f":[]}]}],"tags":["avg"],"facts":["percent","est_ex"],"note":""},{"n":36,"code":"036","src":"46760","stem":"На доске было написано несколько различных натуральных чисел. Эти числа разбили на три группы, в каждой из которых оказалось хотя бы одно число. К каждому числу из первой группы приписали справа цифру 1, к каждому числу из второй группы – цифру 8, а числа третьей группы оставили без изменений.","parts":[{"l":"а","q":"Могла ли сумма всех этих чисел увеличиться в 4 раза?","ak":"yn","av":"ДА","steps":[{"t":"Число x из 1-й группы → 10x + 1, из 2-й → 10x + 8.","f":["append"]},{"t":"Пример: 1 (→11), 2 (→28), 9 (без изменений). Было 12, стало 11 + 28 + 9 = 48 = 4·12. Ответ: да.","f":[]}]},{"l":"б","q":"Могла ли сумма всех этих чисел увеличиться в 18 раз?","ak":"yn","av":"НЕТ","steps":[{"t":"A, B, C — суммы групп, a, b — количества. 10A + a + 10B + 8b + C = 18(A + B + C) ⇒ a + 8b = 8A + 8B + 17C.","f":["append"]},{"t":"Но A ≥ a, B ≥ b, C ≥ 1 ⇒ правая часть ≥ 8a + 8b + 17 > a + 8b. Ответ: нет.","f":[]}]},{"l":"в","q":"Сумма всех этих чисел увеличилась в 11 раз. Какое наибольшее количество чисел могло быть написано на доске?","ak":"num","av":"10","steps":[{"t":"Условие «в 11 раз»: a + 8b = A + B + 10C. Всего чисел n, сумма всех T = A + B + C ≥ n(n+1)/2.","f":["sum_1n"]},{"t":"T = a + 8b − 9C ≤ 8(a + b) − 7a − 9 ≤ 8(n − 1) − 7 − 9 = 8n − 24.","f":[]},{"t":"n(n+1)/2 ≤ 8n − 24 ⇒ n² − 15n + 48 ≤ 0 ⇒ n ≤ 10,37 ⇒ n ≤ 10.","f":["est_ex"]},{"t":"Пример: 1-я группа {2}, 2-я {3, 4, 5, 6, 7, 8, 9, 11}, 3-я {1}. Было 56, стало 21 + 594 + 1 = 616 = 11·56. Ответ: 10.","f":[]}]}],"tags":["digits","est"],"facts":["append","sum_1n","est_ex"],"note":""},{"n":37,"code":"037","src":"125987","stem":"","parts":[{"l":"а","q":"Приведите пример семизначного числа, из которого, вычеркивая цифры, можно получить каждое из чисел: 206, 835, 930.","ak":"self","av":"Например, 2893506.","steps":[{"t":"Нужны цифры 2,0,6 / 8,3,5 / 9,3,0 в этом порядке. Общая 3 и 0: 2 8 9 3 5 0 6.","f":["subseq"]},{"t":"Проверка: 2…0 6 ✓; 8 3 5 ✓; 9 3 0 ✓.","f":[]}]},{"l":"б","q":"Существует ли восьмизначное число, из которого, вычеркивая цифры, можно получить каждое из чисел: 247, 345, 586, 812?","ak":"yn","av":"НЕТ","steps":[{"t":"В числах участвуют 8 разных цифр 2,4,7,3,5,8,6,1 ⇒ в восьмизначном каждая ровно один раз.","f":["subseq"]},{"t":"Порядок: 2 раньше 4 (247), 4 раньше 5 (345), 5 раньше 8 (586), 8 раньше 1 и 1 раньше 2 (812) ⇒ 2 раньше 2 — противоречие. Ответ: нет.","f":[]}]},{"l":"в","q":"Найдите наименьшее натуральное число, из которого можно получить все натуральные числа от 1 до 50, вычеркивая цифры.","ak":"num","av":"12341234506789","steps":[{"t":"Нужны 11, 22, 33, 44 ⇒ цифры 1–4 хотя бы по два раза; 5–9 и 0 хотя бы по разу ⇒ не меньше 8 + 6 = 14 цифр.","f":["subseq"]},{"t":"Чтобы число было наименьшим, при 14 цифрах в начале как можно меньшие цифры: 1 2 3 4, а затем снова 1 2 3 4 (для 21, 31, 41, 32, 42, 43).","f":[]},{"t":"0 нужен после 5 (для 50), 5 — после 1…4 (для 15…45), 6–9 — в конце по возрастанию. Поставить 0 раньше 5 нельзя без второго нуля (15 цифр — больше).","f":["est_ex"]},{"t":"Ответ: 12341234506789.","f":[]}]}],"tags":["digits"],"facts":["subseq","est_ex"],"note":""},{"n":38,"code":"038","src":"159692","stem":"На доске написано несколько различных натуральных чисел, в записи которых могут быть только цифры 4 и 9 (возможно, только одна из этих цифр).","parts":[{"l":"а","q":"Может ли сумма этих чисел быть равна 107?","ak":"yn","av":"ДА","steps":[{"t":"Пример: 94 + 9 + 4 = 107. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли сумма этих чисел быть равна 289?","ak":"yn","av":"НЕТ","steps":[{"t":"Числа ≤ 289 из цифр 4 и 9: 4, 9, 44, 49, 94, 99 (444 уже больше). Их сумма 299.","f":[]},{"t":"Сумма 289 ⇒ не взяли числа с суммой 10 — а из этих чисел 10 не составить. Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наименьшее количество чисел может быть на доске, если их сумма равна 3986?","ak":"num","av":"9","steps":[{"t":"Каждое число оканчивается на 4 или 9 ⇒ по mod 5 каждое ≡ −1. Сумма k чисел ≡ −k (mod 5); 3986 ≡ 1 ⇒ k ≡ 4 (mod 5).","f":["mod_def"]},{"t":"k = 4: наибольшая сумма 999 + 994 + 949 + 944 = 3886 \u003c 3986 (четырёхзначные из 4 и 9 больше 3986). Значит, k ≥ 9.","f":["est_ex"]},{"t":"Пример: 4 + 9 + 44 + 49 + 444 + 494 + 949 + 994 + 999 = 3986. Ответ: 9.","f":[]}]}],"tags":["digits"],"facts":["last_digit","mod_def","est_ex"],"note":""},{"n":39,"code":"039","src":"159639","stem":"C трёхзначным числом производят следующую операцию: к нему прибавляют цифру десятков умноженную на 10, а затем к получившейся сумме прибавляют 3.","parts":[{"l":"а","q":"Могло ли в результате такой операции получиться число 224?","ak":"yn","av":"ДА","steps":[{"t":"N = 100a + 10b + c ⇒ результат 100a + 20b + c + 3.","f":["dec_repr"]},{"t":"100a + 20b + c = 221 ⇒ a = 2, b = 1, c = 1: 211 + 10 + 3 = 224. Ответ: да.","f":[]}]},{"l":"б","q":"Могло ли в результате такой операции получиться число 314?","ak":"yn","av":"НЕТ","steps":[{"t":"100a + 20b + c = 311. a = 3: 20b + c = 11 ⇒ b = 0, c = 11 — нет. a = 2: 20b + c = 111 — при b ≤ 9 и c ≤ 9 нельзя (20b ∈ [102;111] не кратно 20). a = 1: 211 > 189.","f":[]},{"t":"Ответ: нет.","f":[]}]},{"l":"в","q":"Найдите наибольшее отношение получившегося числа к исходному.","ak":"num","av":"283/190","steps":[{"t":"Отношение = 1 + (10b + 3)/(100a + 10b + c). Чтобы дробь была больше: a = 1, c = 0.","f":["frac_monot"]},{"t":"(10b + 3)/(100 + 10b) растёт с ростом b ⇒ b = 9: 93/190.","f":[]},{"t":"Наибольшее отношение 283/190 (для числа 190 → 283).","f":[]}]}],"tags":["digits"],"facts":["dec_repr","frac_monot"],"note":"В ключе файла к пункту в) указано 51 (вероятно, ответ перепутан с задачей 40). По условию, как оно записано, наибольшее отношение 283/190 (число 190)."},{"n":40,"code":"040","src":"159633","stem":"C трёхзначным числом производят следующую операцию: вычитают из него сумму его цифр, а затем получившуюся разность делят на 3.","parts":[{"l":"а","q":"Может ли в результате такой операции получиться число 300?","ak":"yn","av":"ДА","steps":[{"t":"(100a + 10b + c − a − b − c)/3 = (99a + 9b)/3 = 33a + 3b.","f":["dec_repr"]},{"t":"33a + 3b = 300 ⇒ 11a + b = 100 ⇒ a = 9, b = 1. Например 910: (910 − 10)/3 = 300. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли в результате такой операции получиться число 151?","ak":"yn","av":"НЕТ","steps":[{"t":"Результат 33a + 3b делится на 3, а 151 — нет. Ответ: нет.","f":["div_sum"]}]},{"l":"в","q":"Сколько различных чисел может получиться в результате такой операции из чисел от 100 до 600 включительно?","ak":"num","av":"51","steps":[{"t":"Результат 3(11a + b), b ≤ 9 \u003c 11 ⇒ разные пары (a, b) дают разные результаты.","f":[]},{"t":"От 100 до 599: a = 1…5, b = 0…9 — 50 значений; 600 даёт a = 6, b = 0 — ещё одно. Итого 51.","f":["est_ex"]}]}],"tags":["digits"],"facts":["dec_repr","div_sum","est_ex"],"note":""},{"n":41,"code":"041","src":"1104","stem":"С натуральным числом проводят следующую операцию: между каждыми двумя его соседними цифрами записывают сумму этих цифр. Например, из числа 194 получается число 1109134.","parts":[{"l":"а","q":"Приведите пример числа, из которого получается число 176148179.","ak":"self","av":"1689","steps":[{"t":"Разбираем 176148179: 1 | 7 | 6 | 14 | 8 | 17 | 9. Проверка: 1+6 = 7, 6+8 = 14, 8+9 = 17 ✓.","f":[]},{"t":"Исходное число 1689.","f":[]}]},{"l":"б","q":"Может ли из какого-нибудь числа получиться число 3107611090?","ak":"yn","av":"НЕТ","steps":[{"t":"Первая цифра 3, дальше сумма 3 + d ≥ 3: «1» нельзя, «10» ⇒ d = 7.","f":[]},{"t":"Дальше идёт сумма 7 + e ∈ [7; 16]: «6» мало, «61» много. Разбор невозможен. Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наибольшее число, кратное 11, может получиться из трехзначного числа?","ak":"num","av":"9167169","steps":[{"t":"Из abc получаем a (a+b) b (b+c) c. Наибольшие — семизначные (обе суммы двузначные) с a = 9.","f":["dec_repr"]},{"t":"Цифры: 9, 1, b−1, b, 1, b+c−10, c. Знакочередующаяся сумма: 9 − 1 + (b−1) − b + 1 − (b+c−10) + c = 18 − b.","f":["div_rules"]},{"t":"Делится на 11 ⇒ b = 7; c наибольшее — 9: 9167169.","f":["est_ex"]}]}],"tags":["digits","div"],"facts":["dec_repr","div_rules","est_ex"],"note":""},{"n":42,"code":"042","src":"159664","stem":"Дано трёхзначное натуральное число, не кратное 100.","parts":[{"l":"а","q":"Может ли частное этого числа и суммы его цифр быть равным 11?","ak":"yn","av":"ДА","steps":[{"t":"198: сумма цифр 18, 198 : 18 = 11. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли частное этого числа и суммы его цифр быть равным 5?","ak":"yn","av":"НЕТ","steps":[{"t":"100a + 10b + c = 5(a + b + c) ⇒ 95a + 5b = 4c. Но 95a ≥ 95 > 36 ≥ 4c. Ответ: нет.","f":["dec_repr"]}]},{"l":"в","q":"Какое наибольшее натуральное значение может иметь частное данного числа и суммы его цифр, если первая цифра данного числа равна 7?","ak":"num","av":"80","steps":[{"t":"N = 700 + 10b + c, s = 7 + b + c ≥ 8 (700 кратно 100).","f":[]},{"t":"s = 8: 710, 701 — не делятся на 8. s = 9: 720/9 = 80 ✓. s ≥ 10: частное ≤ 799/10 \u003c 80.","f":["est_ex"]},{"t":"Ответ: 80 (число 720).","f":[]}]}],"tags":["digits"],"facts":["dec_repr","est_ex"],"note":""},{"n":43,"code":"043","src":"175401","stem":"","parts":[{"l":"а","q":"Можно ли представить число 2043 в виде суммы двух различных натуральных чисел с одинаковой суммой цифр?","ak":"yn","av":"ДА","steps":[{"t":"Пример: 1017 + 1026 = 2043, суммы цифр 9 и 9. Ответ: да.","f":[]}]},{"l":"б","q":"Можно ли представить число 599 в виде суммы двух различных натуральных чисел с одинаковой суммой цифр?","ak":"yn","av":"НЕТ","steps":[{"t":"x + y = 599: в разряде единиц x₀ + y₀ = 9 (19 нельзя), в десятках тоже 9, в сотнях 5 — переносов нет.","f":["ds_carry"]},{"t":"S(x) + S(y) = 5 + 9 + 9 = 23 — нечётно ⇒ S(x) ≠ S(y). Ответ: нет.","f":[]}]},{"l":"в","q":"Найдите наименьшее натуральное число, которое можно представить в виде суммы семи различных натуральных чисел с одинаковой суммой цифр.","ak":"num","av":"231","steps":[{"t":"При сумме цифр s берём 7 наименьших чисел с этой суммой цифр.","f":["distinct_min"]},{"t":"s = 1…5: чисел \u003c 100 с такой суммой цифр только s + 1 ≤ 6 ⇒ нужно хотя бы одно ≥ 100. Наименьшие суммы: s=1: 1+10+100+…+10⁶; s=2: 2+11+20+101+110+200+1001; s=3: 399; s=4: 325; s=5: 5+14+23+32+41+50+104 = 269.","f":[]},{"t":"s = 6: 6+15+24+33+42+51+60 = 231; s = 7: 238; s = 8: 245; s = 9: 252; при s ≥ 10 ещё больше.","f":["est_ex"]},{"t":"Ответ: 231.","f":[]}]}],"tags":["digits"],"facts":["ds_mod9","ds_carry","est_ex"],"note":""},{"n":44,"code":"044","src":"91284","stem":"На доске написали несколько не обязательно различных двузначных натуральных чисел без нулей в десятичной записи. Сумма этих чисел оказалась равной 264. В каждом числе поменяли местами первую и вторую цифры, например, число 17 заменили на число 71.","parts":[{"l":"а","q":"Приведите пример исходных чисел, для которых сумма получившихся чисел ровно в 4 раза больше, чем сумма исходных чисел.","ak":"self","av":"Например, десять чисел 19 и числа 39, 35.","steps":[{"t":"A — сумма цифр десятков, B — единиц: 10A + B = 264, 10B + A = 4·264 = 1056.","f":["dec_repr"]},{"t":"Решаем: B = 104, A = 16. Чисел k: A ≥ k (десятки ≥ 1), B ≤ 9k ⇒ 12 ≤ k ≤ 16.","f":[]},{"t":"Пример k = 12: десять чисел 19, а также 39 и 35: 190 + 39 + 35 = 264; после перестановки 910 + 93 + 53 = 1056.","f":[]}]},{"l":"б","q":"Могла ли сумма получившихся чисел быть ровно в 2 раза больше, чем сумма исходных чисел?","ak":"yn","av":"НЕТ","steps":[{"t":"10A + B = 264, 10B + A = 528 ⇒ 99B = 5280 − 264 = 5016 ⇒ B = 50,67 — не целое. Ответ: нет.","f":["lin_dioph"]}]},{"l":"в","q":"Найдите наибольшее возможное значение суммы получившихся чисел.","ak":"num","av":"1254","steps":[{"t":"Новая сумма 10B + A = 10(264 − 10A) + A = 2640 − 99A — нужно минимизировать A.","f":["dec_repr"]},{"t":"Чисел k ≤ A, а B ≤ 9k ≤ 9A ⇒ 264 − 10A ≤ 9A ⇒ A ≥ 14.","f":["est_ex"]},{"t":"A = 14: 2640 − 1386 = 1254. Пример: двенадцать чисел 19 и два 18: 228 + 36 = 264 → 1092 + 162 = 1254. Ответ: 1254.","f":[]}]}],"tags":["digits"],"facts":["dec_repr","lin_dioph","est_ex"],"note":""},{"n":45,"code":"045","src":"91286","stem":"На доске написали несколько не обязательно различных двузначных натуральных чисел без нулей в десятичной записи. Сумма этих чисел оказалась равной 2376. В каждом числе поменяли местами первую и вторую цифры, например, число 17 заменили на число 71.","parts":[{"l":"а","q":"Приведите пример исходных чисел, для которых сумма получившихся чисел ровно в 3 раза больше, чем сумма исходных чисел.","ak":"self","av":"Например, 66 чисел 29, 11 чисел 39 и одно 33.","steps":[{"t":"10A + B = 2376, 10B + A = 3·2376 = 7128 ⇒ 99B = 71280 − 2376 ⇒ B = 696, A = 168.","f":["dec_repr"]},{"t":"Чисел k: 696/9 ≤ k ≤ 168. Возьмём k = 78: единицы — 77 девяток и одна 3; десятки — 66 двоек и 12 троек (156 + 12 = 168).","f":[]},{"t":"Пример: 66·29 + 11·39 + 33 = 1914 + 429 + 33 = 2376; после перестановки 66·92 + 11·93 + 33 = 6072 + 1023 + 33 = 7128.","f":[]}]},{"l":"б","q":"Могла ли сумма получившихся чисел быть ровно в 6 раз больше, чем сумма исходных чисел?","ak":"yn","av":"НЕТ","steps":[{"t":"10B + A = 6·2376 ⇒ B = 2376·59/99 = 1416, A = 96.","f":["lin_dioph"]},{"t":"Чисел k ≤ A = 96, но B ≤ 9k ≤ 864 \u003c 1416. Противоречие. Ответ: нет.","f":[]}]},{"l":"в","q":"Найдите наибольшее возможное значение суммы получившихся чисел.","ak":"num","av":"11286","steps":[{"t":"Новая сумма 10B + A = 10(2376 − 10A) + A = 23760 − 99A — минимизируем A.","f":["dec_repr"]},{"t":"B ≤ 9k ≤ 9A ⇒ 2376 − 10A ≤ 9A ⇒ A ≥ 125,05 ⇒ A ≥ 126.","f":["est_ex"]},{"t":"A = 126: 23760 − 12474 = 11286. Пример: 123 числа 19 и 3 числа 13 (2337 + 39 = 2376) → 11193 + 93 = 11286. Ответ: 11286.","f":[]}]}],"tags":["digits"],"facts":["dec_repr","lin_dioph","est_ex"],"note":""},{"n":46,"code":"046","src":"26928","stem":"Каждое из четырёх последовательных натуральных чисел, последние цифры которых не равны нулю, поделили на его последнюю цифру. Сумма получившихся чисел равна S.","parts":[{"l":"а","q":"Может ли S быть равной 16 5/6?","ak":"yn","av":"ДА","steps":[{"t":"Пример: 12, 13, 14, 15: 12/2 + 13/3 + 14/4 + 15/5 = 6 + 4⅓ + 3½ + 3 = 16⅚. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли S быть равной 569 29/126?","ak":"yn","av":"НЕТ","steps":[{"t":"Знаменатель 126 = 2·7·9. Множитель 7 даёт только последняя цифра 7, множитель 9 — только цифра 9.","f":["fta"]},{"t":"Четыре подряд числа без нуля на конце имеют последние цифры d, d+1, d+2, d+3 ≤ 9 ⇒ с 7 и 9 это 6, 7, 8, 9: числа 10k+6, …, 10k+9.","f":[]},{"t":"S = 4 + 10k(1/6 + 1/7 + 1/8 + 1/9) = 4 + 1375k/252. Уравнение 4 + 1375k/252 = 569 29/126 ⇒ 1375k = 142438 — k не целое. Ответ: нет.","f":[]}]},{"l":"в","q":"Найдите наибольшее значение S, если каждое из исходных чисел было трёхзначным.","ak":"num","av":"2066,5","steps":[{"t":"Для чисел 10k+d, …, 10k+d+3: S = 4 + 10k·(1/d + 1/(d+1) + 1/(d+2) + 1/(d+3)). Больше всего при наибольшем k и d = 1.","f":["frac_monot"]},{"t":"k = 99 (числа 991–994): S = 4 + 990·(1 + 1/2 + 1/3 + 1/4) = 4 + 990·25/12 = 2066,5. Ответ: 2066,5.","f":["est_ex"]}]}],"tags":["digits"],"facts":["dec_repr","fta","frac_monot","est_ex"],"note":""},{"n":47,"code":"047","src":"47426","stem":"На доске написаны три различных натуральных числа. Второе число равно сумме цифр первого, а третье равно сумме цифр второго.","parts":[{"l":"а","q":"Может ли сумма этих чисел быть равна 2022?","ak":"yn","av":"ДА","steps":[{"t":"Пример: 1994, 23, 5: 1994 + 23 + 5 = 2022. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли сумма этих чисел быть равна 2021?","ak":"yn","av":"НЕТ","steps":[{"t":"x ≡ S(x) ≡ S(S(x)) (mod 9) ⇒ сумма ≡ 3x (mod 9) — даёт остаток 0, 3 или 6.","f":["ds_mod9"]},{"t":"2021 ≡ 5 (mod 9). Ответ: нет.","f":[]}]},{"l":"в","q":"В тройке чисел первое число трёхзначное, а третье равно 2. Сколько существует таких троек?","ak":"num","av":"97","steps":[{"t":"Третье = 2 ⇒ второе ∈ {2, 11, 20} (второе ≤ 27). Числа различны ⇒ второе ≠ 2 ⇒ второе 11 или 20.","f":[]},{"t":"Трёхзначных с суммой цифр 11: 61; с суммой цифр 20: 36 (подсчёт по первой цифре).","f":["est_ex"]},{"t":"Всего 61 + 36 = 97 троек.","f":[]}]}],"tags":["digits"],"facts":["ds_mod9","est_ex"],"note":""},{"n":48,"code":"048","src":"159663","stem":"Для чисел A и B, состоящих из одинакового количества цифр, вычисляют S – сумму произведений соответствующих цифр. Например, для чисел A = 123 и B = 579 получается сумма S = 1⋅5 +2 ⋅7 +3 ⋅9= 46.","parts":[{"l":"а","q":"Существуют ли трёхзначные числа A и B, для которых S = 200?","ak":"yn","av":"ДА","steps":[{"t":"Пример: A = 977, B = 998: 9·9 + 7·9 + 7·8 = 81 + 63 + 56 = 200. Ответ: да.","f":[]}]},{"l":"б","q":"Существуют ли четырёхзначные числа A и B, для которых S = 320?","ak":"yn","av":"НЕТ","steps":[{"t":"Произведения цифр ≤ 81; следующее после 81 — 72. Нужно 4 произведения с суммой 320.","f":[]},{"t":"Три по 81 ⇒ четвёртое 77 — не произведение цифр. Не больше двух по 81 ⇒ сумма ≤ 81·2 + 72·2 = 306 \u003c 320. Ответ: нет.","f":[]}]},{"l":"в","q":"Верно ли, что любое натуральное число от 1 до 340 является суммой S для некоторых пятизначных чисел A и B?","ak":"yn","av":"ДА","steps":[{"t":"Любое число 0…81 = 9·u + 1·v (u ≤ 8, v ≤ 9) — два слагаемых-произведения.","f":[]},{"t":"n ≤ 323: n = 81q + r, q ≤ 3, r ≤ 80 — q слагаемых 9·9 и два слагаемых 9·u, 1·v: всего ≤ 5 разрядов.","f":[]},{"t":"n = 324…340: 81·3 + (81…97): 81…90 = 81 + v; 91 = 81 + 10 (2·5); 92 = 72 + 20; 93 = 72 + 21; 94 = 64 + 30; 95 = 81 + 14; 96 = 72 + 24; 97 = 81 + 16. Ответ: да.","f":["est_ex"]}]}],"tags":["digits"],"facts":["dec_repr","lin_dioph","est_ex"],"note":""},{"n":49,"code":"049","src":"159703","stem":"На доске было написано несколько различных натуральных чисел. Эти числа разбили на три группы, в каждой из которых оказалось хотя бы одно число. К каждому числу из первой группы приписали справа цифру 3, к каждому числу из второй группы — цифру 7, а числа из третьей группы оставили без изменений.","parts":[{"l":"а","q":"Могла ли сумма всех этих чисел увеличиться в 8 раз?","ak":"yn","av":"ДА","steps":[{"t":"x → 10x + 3 (1-я группа), 10x + 7 (2-я).","f":["append"]},{"t":"Пример: {1}, {8}, {4}: было 13, стало 13 + 87 + 4 = 104 = 8·13. Ответ: да.","f":[]}]},{"l":"б","q":"Могла ли сумма всех этих чисел увеличиться в 17 раз?","ak":"yn","av":"НЕТ","steps":[{"t":"10A + 3a + 10B + 7b + C = 17(A+B+C) ⇒ 3a + 7b = 7A + 7B + 16C ≥ 7a + 7b + 16. Противоречие. Ответ: нет.","f":[]}]},{"l":"в","q":"В какое наибольшее число раз могла увеличиться сумма всех этих чисел?","ak":"num","av":"232/21","steps":[{"t":"Отношение t = 10 + (3a + 7b − 9C)/T, где T = A + B + C — сумма всех n чисел.","f":[]},{"t":"3a + 7b = 7(a + b) − 4a ≤ 7(n − 1) − 4, C ≥ 1, T ≥ n(n+1)/2 ⇒ t − 10 ≤ 2(7n − 20)/(n(n+1)).","f":["sum_1n"]},{"t":"n = 4: 0,8; n = 5: 1; n = 6: 22/21; n = 7: 58/56; n = 8: 1 — максимум при n = 6: t ≤ 232/21.","f":["est_ex"]},{"t":"Пример: {2}, {3, 4, 5, 6}, {1}: было 21, стало 23 + 37 + 47 + 57 + 67 + 1 = 232. Ответ: 232/21.","f":[]}]}],"tags":["digits","est"],"facts":["append","sum_1n","est_ex"],"note":""},{"n":50,"code":"050","src":"159624","stem":"Ваня написал на доске трёхзначное число A. Серёжа переписал это число A, вычеркнул из него одну цифру и получил двузначное число B. Коля тоже переписал это число A, вычеркнул из него одну цифру (возможно, ту же самую, что и Серёжа) и получил двузначное число C.","parts":[{"l":"а","q":"Может ли быть верным равенство A = B ⋅C, если A> 150?","ak":"yn","av":"ДА","steps":[{"t":"Пример: A = 160, B = 16 (вычеркнули 0), C = 10 (вычеркнули 6): 16·10 = 160. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли быть верным равенство A = B ⋅C, если 540 ≤A \u003c 600?","ak":"yn","av":"НЕТ","steps":[{"t":"A = 5bc, b ≥ 4. Варианты B, C: 5b, 5c (начинаются с 5) или bc (≥ 40).","f":[]},{"t":"Если оба начинаются с 5: ≥ 50·50 = 2500. Иначе одно ≥ 40, другое ≥ 40: ≥ 1600 > 600. Ответ: нет.","f":[]}]},{"l":"в","q":"Найдите наибольшее число A, для которого может быть верным равенство A = B ⋅C.","ak":"num","av":"910","steps":[{"t":"A = abc. Если B и C оба начинаются с a: A ≥ 100a² ⇒ a = 1. При a ≥ 2 одно из них — bc.","f":["extreme"]},{"t":"A = (10a + x)(10b + c) \u003c 100(a + 1) ⇒ 10b + c \u003c 10 + 10/a. Для a = 9: bc ∈ {10, 11} ⇒ A ∈ {910, 911}.","f":[]},{"t":"910 = 91·10 ✓, 911 не подходит. Ответ: 910.","f":["est_ex"]}]}],"tags":["digits"],"facts":["dec_repr","extreme","est_ex"],"note":""},{"n":51,"code":"051","src":"91288","stem":"Из 24 последовательных нечётных чисел 1, 3, 5, …, 47 выбрали 9 различных чисел, которые записали в порядке возрастания. Пусть A — пятое по величине среди этих чисел, а B — их среднее арифметическое.","parts":[{"l":"а","q":"Может ли B − A равняться 2/9?","ak":"yn","av":"ДА","steps":[{"t":"Нужно: сумма 9 чисел = 9A + 2.","f":["mean"]},{"t":"Пример: 1, 3, 5, 7, 9, 11, 13, 15, 19: A = 9, сумма 83 = 81 + 2. Ответ: да.","f":[]}]},{"l":"б","q":"Может ли B − A равняться 5/9?","ak":"yn","av":"НЕТ","steps":[{"t":"Сумма девяти нечётных — нечётна. 9A + 5 при нечётном A чётно. Ответ: нет.","f":["parity"]}]},{"l":"в","q":"Найдите наибольшее возможное значение B− A.","ak":"num","av":"40/3","steps":[{"t":"9(B − A) = Σ(aᵢ − A). Четыре меньших: aᵢ ≤ A − 2(5 − i) ⇒ их вклад ≤ −20. Четыре больших ≤ 41 + 43 + 45 + 47 = 176 ⇒ вклад ≤ 176 − 4A.","f":["distinct_min"]},{"t":"9(B − A) ≤ 156 − 4A, A ≥ 9 ⇒ ≤ 120 ⇒ B − A ≤ 40/3.","f":["est_ex"]},{"t":"Пример: 1, 3, 5, 7, 9, 41, 43, 45, 47: B = 201/9, B − A = 40/3. Ответ: 40/3.","f":[]}]}],"tags":["avg"],"facts":["mean","parity","est_ex","distinct_min"],"note":""},{"n":52,"code":"052","src":"126263","stem":"На доске записано 10 натуральных чисел, среди которых нет одинаковых. Оказалось, что среднее арифметическое любых трёх или пяти чисел из записанных является целым числом.","parts":[{"l":"а","q":"Могут ли среди записанных на доске чисел одновременно быть числа 305 и 1511?","ak":"yn","av":"НЕТ","steps":[{"t":"Сумма любых 3 кратна 3 ⇒ все числа сравнимы по mod 3; любых 5 ⇒ по mod 5 ⇒ по mod 15.","f":["mod_shift"]},{"t":"1511 − 305 = 1206 не делится на 15. Ответ: нет.","f":[]}]},{"l":"б","q":"Может ли одно из записанных на доске чисел быть квадратом другого, если среди записанных на доске чисел есть число 305?","ak":"yn","av":"НЕТ","steps":[{"t":"Все числа ≡ 305 ≡ 5 (mod 15). Если n ≡ 5, то n² ≡ 25 ≡ 10 ≢ 5. Ответ: нет.","f":["mod_def"]}]},{"l":"в","q":"Известно, что среди записанных на доске чисел есть число n и его квадрат n². Найдите наименьшее возможное значение n.","ak":"num","av":"6","steps":[{"t":"n² ≡ n (mod 15) ⇒ n(n − 1) делится на 3 и на 5 ⇒ n ≡ 0 или 1 по mod 3 и mod 5.","f":["mod_def"]},{"t":"n = 2, 3, 4, 5 не подходят; n = 6: 6 ≡ 0 (mod 3), 6 ≡ 1 (mod 5) ✓.","f":["est_ex"]},{"t":"Пример: 6, 21, 36, 51, 66, 81, 96, 111, 126, 141 (все ≡ 6 mod 15, есть 6 и 36). Ответ: 6.","f":[]}]}],"tags":["div"],"facts":["mod_shift","mod_def","mod_sq","est_ex"],"note":""},{"n":53,"code":"053","src":"125979","stem":"На доске записано 10 натуральных чисел, среди которых нет одинаковых. Оказалось, что среднее арифметическое любых четырёх или семи чисел из записанных является целым числом.","parts":[{"l":"а","q":"Могут ли среди записанных на доске чисел одновременно быть числа 563 и 1417?","ak":"yn","av":"НЕТ","steps":[{"t":"Любые 4 и любые 7 ⇒ все числа сравнимы по mod 4 и mod 7, т.е. по mod 28.","f":["mod_shift"]},{"t":"1417 − 563 = 854 = 2·7·61 — не делится на 4. Ответ: нет.","f":[]}]},{"l":"б","q":"Может ли одно из записанных на доске чисел быть квадратом натурального числа, если среди записанных на доске чисел есть число 563?","ak":"yn","av":"НЕТ","steps":[{"t":"Все ≡ 563 ≡ 3 (mod 28) ⇒ ≡ 3 (mod 4), а квадрат даёт остаток 0 или 1 по mod 4. Ответ: нет.","f":["mod_sq"]}]},{"l":"в","q":"Известно, что среди записанных на доске чисел есть число 1 и квадрат натурального числа n, большего 1. Найдите наименьшее возможное значение n.","ak":"num","av":"13","steps":[{"t":"Есть 1 ⇒ все ≡ 1 (mod 28) ⇒ n² ≡ 1 (mod 4) и (mod 7) ⇒ n нечётно и n ≡ ±1 (mod 7).","f":["mod_sq"]},{"t":"n = 3, 5, 7, 9, 11 не подходят; n = 13 ≡ 6 (mod 7) ✓ (169 = 6·28 + 1).","f":["est_ex"]},{"t":"Пример: 1, 29, 57, 85, 113, 141, 169, 197, 225, 253. Ответ: 13.","f":[]}]}],"tags":["div"],"facts":["mod_shift","mod_sq","mod_def","est_ex"],"note":""},{"n":54,"code":"054","src":"1312","stem":"На доске написано 10 различных натуральных чисел. Среднее арифметическое шести наименьших из них равно 5, а среднее арифметическое шести наибольших равно 15.","parts":[{"l":"а","q":"Может ли наименьшее из этих десяти чисел равняться 3?","ak":"yn","av":"НЕТ","steps":[{"t":"a₁ + … + a₆ = 30. Если a₁ = 3, то сумма ≥ 3 + 4 + … + 8 = 33 > 30. Ответ: нет.","f":["distinct_min"]}]},{"l":"б","q":"Может ли среднее арифметическое всех десяти чисел равняться 11?","ak":"yn","av":"НЕТ","steps":[{"t":"Сумма всех = 30 + 90 − (a₅ + a₆). Среднее 11 ⇒ a₅ + a₆ = 10.","f":["mean"]},{"t":"a₁ + … + a₄ = 20 ≤ 4a₅ − 10 ⇒ a₅ ≥ 8 ⇒ a₅ + a₆ ≥ 17. Противоречие. Ответ: нет.","f":["distinct_min"]}]},{"l":"в","q":"Найдите наибольшее значение среднего арифметического всех десяти чисел.","ak":"num","av":"10,5","steps":[{"t":"Минимизируем s = a₅ + a₆: 30 − s ≤ 4a₅ − 10 и a₅ ≤ (s − 1)/2.","f":["distinct_min"]},{"t":"s = 14: a₅ ≤ 6, a₁…a₄ = 16 > 4·6 − 10 = 14 — нельзя. s ≥ 15 ⇒ сумма ≤ 120 − 15 = 105.","f":["est_ex"]},{"t":"Пример: 2, 3, 4, 6, 7, 8, 9, 10, 11, 45 — среднее 10,5. Ответ: 10,5.","f":[]}]},{"l":"г","q":"На доске написано 11 различных натуральных чисел. Среднее арифметическое шести наименьших из них равно 5, а среднее арифметическое шести наибольших из них равно 15. Пусть B — шестое по величине число, а S — среднее арифметическое всех одиннадцати чисел. Найдите наибольшее значение выражения S− B.","ak":"num","av":"24/11","steps":[{"t":"11 чисел: a₁…a₆ = 30, a₆…a₁₁ = 90 ⇒ сумма = 120 − B, S − B = (120 − 12B)/11.","f":["mean"]},{"t":"a₁…a₅ = 30 − B ≤ 5B − 15 ⇒ B ≥ 7,5 ⇒ B ≥ 8.","f":["distinct_min"]},{"t":"B = 8: S − B = 24/11. Пример: 1, 3, 5, 6, 7, 8, 9, 10, 11, 12, 40. Ответ: 24/11.","f":["est_ex"]}]}],"tags":["avg"],"facts":["mean","distinct_min","est_ex"],"note":""},{"n":55,"code":"055","src":"127722","stem":"На доске написано 30 чисел: десять «5», десять «4» и десять «3». Эти числа разбивают на две группы, в каждой из которых есть хотя бы одно число. Среднее арифметическое чисел в первой группе равно A, среднее арифметическое чисел во второй группе равно B. При этом для группы из единственного числа среднее арифметическое равно этому числу.","parts":[{"l":"а","q":"Приведите пример разбиения исходных чисел на две группы, при котором среднее арифметическое всех чисел меньше (A+ B)/2.","ak":"self","av":"Например, первая группа — одно число 5, вторая — остальные 29 чисел: A = 5, B = 115/29, (A+B)/2 ≈ 4,48 > 4.","steps":[{"t":"Среднее всех чисел (50+40+30)/30 = 4. Нужно A + B > 8.","f":["mean"]},{"t":"Группа {5}: A = 5; остальные 29 чисел: B = 115/29 ≈ 3,97. A + B ≈ 8,97 > 8.","f":[]}]},{"l":"б","q":"Докажите, что если разбить исходные числа на две группы по 15 чисел, то среднее арифметическое всех чисел будет равно (A+ B)/2","ak":"self","av":"Если группы по 15 чисел с суммами S₁ и S₂, то (A+B)/2 = (S₁/15 + S₂/15)/2 = (S₁+S₂)/30 — среднее всех.","steps":[{"t":"A = S₁/15, B = S₂/15.","f":["mean"]},{"t":"(A + B)/2 = (S₁ + S₂)/30 = 120/30 = 4 — среднее всех чисел.","f":[]}]},{"l":"в","q":"Найдите наибольшее возможное значение выражения (A+ B)/2","ak":"num","av":"130/29","steps":[{"t":"Пусть в первой группе k ≤ 15 чисел с суммой S₁: A + B = S₁(1/k − 1/(30−k)) + 120/(30 − k) — при k \u003c 15 растёт с S₁.","f":["frac_monot"]},{"t":"k ≤ 10: S₁ ≤ 5k ⇒ A + B ≤ 5 + (120 − 5k)/(30 − k) = 10 − 30/(30 − k) — максимум при k = 1: 5 + 115/29.","f":["est_ex"]},{"t":"При 10 \u003c k \u003c 15 оценка A + B ≤ 8 + 10/k − 10/(30−k) \u003c 8,4 — меньше. Значит, max (A+B)/2 = (5 + 115/29)/2 = 130/29 = 4 14/29.","f":[]}]}],"tags":["avg"],"facts":["mean","frac_monot","est_ex"],"note":"В ключе файла ответ к в) записан как «4 14 29» — это смешанное число 4 14/29 = 130/29."},{"n":56,"code":"056","src":"159994","stem":"В школах №1 и №2 учащиеся писали тест. Из каждой школы тест писали по крайней мере 2 учащихся. Каждый учащийся, писавший тест, набрал натуральное количество баллов. Оказалось, что в каждой школе средний балл за тест был целым числом, причем в школе №2 средний балл равнялся 42. Один из учащихся, писавших тест, перешёл из школы №1 в школу №2, а средние баллы за тест были пересчитаны в обеих школах. В результате средний балл в школе №1 уменьшился на 10%, средний балл в школе №2 также уменьшился на 10%.","parts":[{"l":"а","q":"Сколько учащихся могло писать тест в школе №2 изначально?","ak":"num","av":"4","steps":[{"t":"Школа №2: n₂ учеников, среднее 42, пришёл ученик с x баллами: (42n₂ + x)/(n₂ + 1) = 37,8 ⇒ x = 37,8 − 4,2n₂.","f":["mean_move"]},{"t":"x > 0 ⇒ n₂ ≤ 8; x целое ⇒ 0,2n₂ даёт дробную часть 0,8 ⇒ n₂ ≡ 4 (mod 5) ⇒ n₂ = 4, x = 21.","f":[]},{"t":"Пример существует (например, школа №1: 5 учеников со средним 15). Ответ: 4.","f":[]}]},{"l":"б","q":"Каждый учащийся школы №2, писавший тест, набрал больше баллов, чем перешедший в неё учащийся школы №1. Какое наибольшее количество баллов мог набрать учащийся школы №2?","ak":"num","av":"102","steps":[{"t":"В школе №2 четыре ученика, сумма 168. Каждый > 21 ⇒ ≥ 22.","f":[]},{"t":"Наибольший ≤ 168 − 3·22 = 102. Пример: 22, 22, 22, 102. Ответ: 102.","f":["est_ex"]}]},{"l":"в","q":"Какое наибольшее количество участников могло писать тест в школе №1 изначально?","ak":"num","av":"96","steps":[{"t":"Школа №1: (m₁n₁ − 21)/(n₁ − 1) = 0,9m₁ ⇒ m₁(n₁ + 9) = 210.","f":["mean_move"]},{"t":"Сумма баллов m₁n₁ ≥ 21 + (n₁ − 1) ⇒ m₁ ≥ 2 при больших n₁. n₁ + 9 = 210 (m₁ = 1) не подходит: 201 \u003c 221.","f":["est_ex"]},{"t":"n₁ + 9 = 105, m₁ = 2: n₁ = 96, сумма 192 = 21 + 171 (76 двоек и 19 единиц). После ухода: 171/95 = 1,8 = 0,9·2 ✓. Ответ: 96.","f":[]}]}],"tags":["avg"],"facts":["mean_move","percent","lin_dioph","est_ex"],"note":""},{"n":57,"code":"057","src":"125982","stem":"На доске записано 10 натуральных чисел, среди которых нет одинаковых. Оказалось, что среднее арифметическое любых трех, четырех, пяти или шести чисел из записанных является целым числом. Одно из записанных чисел равно 30 035.","parts":[{"l":"а","q":"Может ли среди записанных на доске чисел быть число 325?","ak":"yn","av":"НЕТ","steps":[{"t":"Среднее любых 3, 4, 5, 6 — целое ⇒ все числа сравнимы по mod 3, 4, 5, 6 ⇒ по mod 60.","f":["mod_shift"]},{"t":"30035 ≡ 35 (mod 60), а 325 ≡ 25. Ответ: нет.","f":[]}]},{"l":"б","q":"Может ли отношение двух записанных на доске чисел равняться 7?","ak":"yn","av":"НЕТ","steps":[{"t":"x = 7y и x ≡ y (mod 60) ⇒ 6y ≡ 0 (mod 60) ⇒ y кратно 10.","f":["mod_def"]},{"t":"Но y ≡ 35 (mod 60) — нечётно. Ответ: нет.","f":[]}]},{"l":"в","q":"Отношение двух записанных на доске чисел является целым числом n. Найдите наименьшее возможное значение n.","ak":"num","av":"13","steps":[{"t":"x = ny ⇒ (n − 1)y ≡ 0 (mod 60). y ≡ 35 (mod 60) ⇒ y нечётно и не кратно 3 ⇒ НОД(y, 60) = 5 ⇒ n − 1 кратно 12 ⇒ n ≥ 13.","f":["div_comp"]},{"t":"Пример: 35 и 455 = 13·35 (≡ 35 mod 60), 30035 и ещё 7 чисел ≡ 35 (mod 60). Ответ: 13.","f":["est_ex"]}]}],"tags":["div"],"facts":["mod_shift","div_comp","mod_def","est_ex"],"note":""},{"n":58,"code":"058","src":"130185","stem":"На доске написано 20 натуральных необязательно различных чисел, каждое из которых не превосходит 50. Одно или несколько из чисел на доске увеличили на 1. Числа, которые после этого оказались равны 51, с доски стёрли.","parts":[{"l":"а","q":"Могло ли среднее арифметическое всех чисел на доске уменьшиться?","ak":"yn","av":"ДА","steps":[{"t":"Пример: 50 и 19 единиц: среднее 69/20. Увеличили 50 → 51, стёрли. Осталось 19 единиц, среднее 1 — уменьшилось. Ответ: да.","f":[]}]},{"l":"б","q":"Могло ли быть так, что сначала среднее арифметическое было равно 24, а потом стало равно 17?","ak":"yn","av":"НЕТ","steps":[{"t":"Сумма 480. Пусть стёрли k чисел (были 50), остальные увеличили суммарно на t ≤ 20 − k.","f":["mean"]},{"t":"(480 − 50k + t)/(20 − k) = 17 ⇒ t = 33k − 140 ≥ 0 ⇒ k ≥ 5, но t ≤ 20 − k ⇒ 34k ≤ 160 ⇒ k ≤ 4. Ответ: нет.","f":[]}]},{"l":"в","q":"Чему может быть равно наименьшее среднее арифметическое чисел, оставшихся на доске, если изначально оно было равно 24?","ak":"num","av":"30/11","steps":[{"t":"Среднее (480 − 50k + t)/(20 − k) ≥ (480 − 50k)/(20 − k) = 50 − 520/(20 − k) — убывает с ростом k.","f":["mean"]},{"t":"Остальные 20 − k чисел ≥ 1: 480 − 50k ≥ 20 − k ⇒ k ≤ 9. При k = 9: 30/11.","f":["est_ex"]},{"t":"Пример: девять 50, десять 1 и одно 20 (сумма 480). Увеличили все 50 и стёрли: среднее 30/11. Ответ: 30/11.","f":[]}]}],"tags":["avg"],"facts":["mean","est_ex"],"note":""},{"n":59,"code":"059","src":"130188","stem":"На доске написано 30 натуральных необязательно различных чисел, каждое из которых больше 16, но не превосходит 56. Среднее арифметическое написанных чисел равно 23. Вместо каждого из чисел на доске написали число, в два раза меньшее первоначального. Числа, которые после этого оказались меньше 9, с доски стёрли.","parts":[{"l":"а","q":"Могло ли оказаться так, что среднее арифметическое чисел, оставшихся на доске, больше 21?","ak":"yn","av":"ДА","steps":[{"t":"Стираются только числа 17 (17/2 = 8,5 \u003c 9). Пусть их k. Среднее оставшихся: (690 − 17k)/(2(30 − k)).","f":["mean"]},{"t":"> 21 ⇔ 25k > 570 ⇔ k ≥ 23. Пример: 23 числа 17, шесть 43 и одно 41: среднее после 299/14 ≈ 21,36. Ответ: да.","f":[]}]},{"l":"б","q":"Могло ли среднее арифметическое оставшихся на доске чисел оказаться больше 20, но меньше 21?","ak":"yn","av":"НЕТ","steps":[{"t":"g(k) = (690 − 17k)/(60 − 2k) возрастает по k.","f":["frac_monot"]},{"t":"k = 22: 19,75 ≤ 20; k = 23: ≈ 21,36 > 21. Значений между 20 и 21 нет. Ответ: нет.","f":[]}]},{"l":"в","q":"Найдите наибольшее возможное значение среднего арифметического чисел, которые остались на доске.","ak":"num","av":"26,5","steps":[{"t":"Оставшиеся 30 − k чисел ≤ 56: 690 − 17k ≤ 56(30 − k) ⇒ k ≤ 25.","f":["est_ex"]},{"t":"k = 25: пять чисел по 53, среднее после 265/10 = 26,5. Ответ: 26,5.","f":[]}]}],"tags":["avg"],"facts":["mean","frac_monot","est_ex"],"note":""},{"n":60,"code":"060","src":"46762","stem":"В школах №1 и №2 учащиеся писали тест. Из каждой школы тест писали по крайней мере 2 учащихся, а суммарно тест писал 51 учащийся. Каждый учащийся, писавший тест, набрал натуральное количество баллов. Оказалось, что в каждой школе средний балл за тест был целым числом. После этого один из учащихся, писавших тест, перешёл из школы №1 в школу №2, а средние баллы за тест были пересчитаны в обеих школах.","parts":[{"l":"а","q":"Мог ли средний балл в школе №1 вырасти в 2 раза?","ak":"yn","av":"НЕТ","steps":[{"t":"(n₁m₁ − x)/(n₁ − 1) = 2m₁ ⇒ x = m₁(2 − n₁) ≤ 0 при n₁ ≥ 2. Ответ: нет.","f":["mean_move"]}]},{"l":"б","q":"Средний балл в школе №1 вырос на 10%, средний балл в школе №2 также вырос на 10%. Мог ли первоначальный средний балл в школе №2 равняться 1?","ak":"yn","av":"НЕТ","steps":[{"t":"Для школы №2: x = m₂(n₂ + 11)/10; для школы №1: x = m₁(11 − n₁)/10 ⇒ m₁(11 − n₁) = m₂(62 − n₁) (n₂ = 51 − n₁, 2 ≤ n₁ ≤ 10).","f":["mean_move"]},{"t":"m₂ = 1: x = (62 − n₁)/10 целое ⇒ n₁ = 2, x = 6 ⇒ 9m₁ = 60 — m₁ не целое. Ответ: нет.","f":[]}]},{"l":"в","q":"Средний балл в школе №1 вырос на 10%, средний балл в школе №2 также вырос на 10%. Найдите наименьшее значение первоначального среднего балла в школе №2.","ak":"num","av":"3","steps":[{"t":"m₂ = 2: x = (62 − n₁)/5 ⇒ n₁ ∈ {2, 7}: 9m₁ = 120 или 4m₁ = 110 — не целые.","f":["lin_dioph"]},{"t":"m₂ = 3: n₁ = 2, x = 18, m₁ = 20 ✓.","f":["est_ex"]},{"t":"Пример: школа №1 — 18 и 22 (среднее 20 → 22); школа №2 — 49 учеников со средним 3 (147), после (147 + 18)/50 = 3,3. Ответ: 3.","f":[]}]}],"tags":["avg"],"facts":["mean_move","percent","lin_dioph","est_ex"],"note":""},{"n":61,"code":"061","src":"16737","stem":"Квадратное уравнение x² + px + q = 0 имеет два различных натуральных корня.","parts":[{"l":"а","q":"Пусть q = 55. Найдите все возможные значения p.","ak":"set","av":"-56;-16","steps":[{"t":"Корни u \u003c v натуральные: uv = q = 55, p = −(u + v).","f":["vieta"]},{"t":"55 = 1·55 = 5·11 ⇒ p = −56 или p = −16.","f":[]}]},{"l":"б","q":"Пусть p + q = 30. Найдите все возможные значения q.","ak":"num","av":"64","steps":[{"t":"p + q = uv − u − v = 30 ⇒ (u − 1)(v − 1) = 31 — простое.","f":["factor"]},{"t":"u − 1 = 1, v − 1 = 31 ⇒ u = 2, v = 32, q = 64.","f":[]}]},{"l":"в","q":"Пусть q² − p² = 2108. Найдите все возможные корни исходного уравнения.","ak":"set","av":"6;8","steps":[{"t":"q² − p² = (uv − u − v)(uv + u + v) = 2108 = 2²·17·31. Множители одной чётности (разность 2(u+v)) ⇒ оба чётные: (2; 1054) или (34; 62).","f":["factor"]},{"t":"(34; 62): u + v = (62 − 34)/2 = 14, uv = (34 + 62)/2 = 48 ⇒ корни 6 и 8.","f":["vieta"]},{"t":"(2; 1054): u + v = 526, uv = 528 — дискриминант 274564 не квадрат. Ответ: 6 и 8.","f":[]}]}],"tags":["eq"],"facts":["vieta","factor","est_ex"],"note":""},{"n":62,"code":"062","src":"159623","stem":"Из правильной несократимой дроби a/b где a и b – натуральные числа, за один ход получают дробь (a+b)/(2a+b).","parts":[{"l":"а","q":"Можно ли за несколько таких ходов из дроби 1/3 получить дробь 23/21?","ak":"yn","av":"НЕТ","steps":[{"t":"(a + b)/(2a + b) \u003c 1 всегда ⇒ после хода дробь правильная.","f":["frac_monot"]},{"t":"23/21 > 1 — получить нельзя. (Цепочка из 1/3: 4/5, 9/13, 22/31, … — все меньше 1.)","f":[]}]},{"l":"б","q":"Можно ли за два таких хода из некоторой дроби получить дробь, равную 7/12?","ak":"yn","av":"НЕТ","steps":[{"t":"f(x) = (x + 1)/(2x + 1) убывает; при 0 \u003c x \u003c 1: f(x) ∈ (2/3; 1).","f":["frac_monot"]},{"t":"7/12 \u003c 2/3 ⇒ нельзя получить даже за один ход. Ответ: нет.","f":[]}]},{"l":"в","q":"Несократимая дробь c/d больше 0,7. Найдите наименьшую дробь c/d которую нельзя получить ни из какой правильной несократимой дроби за два таких хода.","ak":"num","av":"5/7","steps":[{"t":"Два хода: f(f(x)) ∈ (f(1); f(2/3)) = (2/3; 5/7) ⇒ 5/7 и больше получить нельзя.","f":["frac_monot"]},{"t":"Обратно: c/d ∈ (2/3; 1) получается из (d − c)/(2c − d) — правильной и несократимой (НОД = НОД(c, d) = 1).","f":["gcd"]},{"t":"Для c/d ∈ (0,7; 5/7) первый прообраз в (2/3; 0,75) ⊂ (2/3; 1) ⇒ есть и второй ⇒ все такие дроби получаются. Наименьшая неполучаемая > 0,7 — это 5/7.","f":["est_ex"]}]}],"tags":["ops"],"facts":["gcd","frac_monot","reverse","est_ex"],"note":"В ключе файла к а) — «ДА», но при записанном условии (дробь 23/21 > 1) получить её нельзя. Вероятно, опечатка в дроби: например, 22/31 получается за три хода: 1/3 → 4/5 → 9/13 → 22/31."},{"n":63,"code":"063","src":"127782","stem":"Для любых трёх натуральных чисел a, b и c (необязательно различных) вычисляют четвёртое число d по формуле: d = a² + b² + c² − ab − bc − ac.","parts":[{"l":"а","q":"Существуют ли a, b и c, для которых d = 19?","ak":"yn","av":"ДА","steps":[{"t":"d = x² + xy + y², x = a − b, y = b − c.","f":["squares_sum"]},{"t":"x = 3, y = 2: 9 + 6 + 4 = 19; a = 6, b = 3, c = 1. Ответ: да.","f":[]}]},{"l":"б","q":"Существуют ли a, b и c, для которых d = 58?","ak":"yn","av":"НЕТ","steps":[{"t":"Если x или y нечётно, x² + xy + y² нечётно. 58 чётно ⇒ x, y чётные ⇒ d кратно 4.","f":["parity"]},{"t":"58 не делится на 4. Ответ: нет.","f":[]}]},{"l":"в","q":"Какое наибольшее значение может принимать d, если a, b и c — двузначные числа и d делится на 4?","ak":"num","av":"7744","steps":[{"t":"d кратно 4 ⇒ x, y чётные ⇒ a, b, c одной чётности ⇒ наибольшая разность D ≤ 98 − 10 = 88.","f":["parity"]},{"t":"d = ½(D² + p² + q²), p + q = D ⇒ d ≤ D² ≤ 7744.","f":["squares_sum"]},{"t":"Пример: 98, 10, 10 ⇒ d = 88² = 7744. Ответ: 7744.","f":["est_ex"]}]}],"tags":["eq"],"facts":["squares_sum","parity","est_ex"],"note":""},{"n":64,"code":"064","src":"21797","stem":"За прохождение каждого уровня игры на планшете можно получить от одной до трёх звёзд. При этом заряд аккумулятора планшета уменьшается на 3 пункта при получении трёх звёзд, на 6 пунктов при получении двух звёзд и на 9 пунктов при получении одной звезды. Витя прошёл несколько уровней игры подряд.","parts":[{"l":"а","q":"Мог ли заряд аккумулятора уменьшиться ровно на 32 пункта? Считайте, что максимальный заряд планшета достаточно большой.","ak":"yn","av":"НЕТ","steps":[{"t":"Каждый уровень уменьшает заряд на 3, 6 или 9 ⇒ уменьшение кратно 3. 32 не кратно 3. Ответ: нет.","f":["div_def"]}]},{"l":"б","q":"Сколько уровней игры было пройдено, если заряд аккумулятора уменьшился на 33 пункта и суммарно было получено 17 звёзд?","ak":"num","av":"7","steps":[{"t":"x, y, z — уровни с 3, 2, 1 звездой: 3x + 6y + 9z = 33 ⇒ x + 2y + 3z = 11; 3x + 2y + z = 17.","f":["lin_dioph"]},{"t":"Сложим: 4(x + y + z) = 28 ⇒ x + y + z = 7. Ответ: 7.","f":[]}]},{"l":"в","q":"За пройденный уровень начисляется 9000 очков при получении трёх звёзд, 5000 — при получении двух звёзд и 2000 — при получении одной звезды. Какое наибольшее количество очков мог получить Витя, если заряд аккумулятора уменьшился на 33 пункта и суммарно было получено 17 звёзд?","ak":"num","av":"49000","steps":[{"t":"Из уравнений: y = 10 − 2x, z = x − 3, 3 ≤ x ≤ 5.","f":["lin_dioph"]},{"t":"Очки: 9000x + 5000(10 − 2x) + 2000(x − 3) = 44000 + 1000x — максимум при x = 5.","f":["est_ex"]},{"t":"x = 5, y = 0, z = 2: 49000. Ответ: 49000.","f":[]}]}],"tags":["eq"],"facts":["lin_dioph","div_def","est_ex"],"note":""},{"n":65,"code":"065","src":"2447","stem":"На доске написано 30 различных натуральных чисел, десятичная запись каждого из которых оканчивается или на цифру 4, или на цифру 8. Сумма написанных чисел равна 2786.","parts":[{"l":"а","q":"Может ли на доске быть поровну чисел, оканчивающихся на 4 и на 8?","ak":"yn","av":"НЕТ","steps":[{"t":"15 чисел на 4 и 15 на 8: последняя цифра суммы 15·4 + 15·8 = 180 → 0. А 2786 оканчивается на 6. Ответ: нет.","f":["last_digit"]}]},{"l":"б","q":"Могут ли ровно четыре числа на доске оканчиваться на 8?","ak":"yn","av":"НЕТ","steps":[{"t":"26 различных чисел на 4: сумма ≥ 4 + 14 + … + 254 = 3354 > 2786. Ответ: нет.","f":["distinct_min"]}]},{"l":"в","q":"Какое наименьшее количество чисел, оканчивающихся на 8, может быть на доске?","ak":"num","av":"9","steps":[{"t":"k чисел на 8: последняя цифра суммы 120 + 4k ≡ 6 (mod 10) ⇒ k ≡ 4 (mod 5) ⇒ k ∈ {4, 9, …}; k = 4 нельзя (б).","f":["last_digit"]},{"t":"k = 9: минимум 4 + … + 204 (2184) + 8 + … + 88 (432) = 2616 ≤ 2786.","f":["est_ex"]},{"t":"Пример: 4, 14, …, 204 и 8, 18, …, 78, 258 — сумма 2786. Ответ: 9.","f":[]}]}],"tags":["digits"],"facts":["last_digit","distinct_min","est_ex"],"note":""},{"n":66,"code":"066","src":"30820","stem":"По кругу расставлено N различных натуральных чисел, каждое из которых меньше 365. Сумма любых четырёх идущих подряд чисел делится на 4, а сумма любых трёх идущих подряд чисел нечётна.","parts":[{"l":"а","q":"Может ли N быть равным 200?","ak":"yn","av":"НЕТ","steps":[{"t":"Суммы трёх подряд нечётны ⇒ aᵢ₊₃ ≡ aᵢ (mod 2); суммы четырёх кратны 4 ⇒ aᵢ₊₄ ≡ aᵢ (mod 4) ⇒ чётность имеет период 1 ⇒ все одной чётности ⇒ все нечётные.","f":["mod_shift"]},{"t":"Нечётных чисел меньше 365 всего 182 \u003c 200. Ответ: нет.","f":[]}]},{"l":"б","q":"Может ли N быть равным 109?","ak":"yn","av":"НЕТ","steps":[{"t":"При нечётном N остатки по mod 4 имеют период НОД(4, N) = 1 ⇒ все числа одинаковы по mod 4.","f":["mod_shift"]},{"t":"Нечётных \u003c 365 с одним остатком по mod 4 — 91 штука \u003c 109. Ответ: нет.","f":[]}]},{"l":"в","q":"Найдите наибольшее значение N.","ak":"num","av":"182","steps":[{"t":"Все числа нечётны ⇒ N ≤ 182.","f":["est_ex"]},{"t":"Пример: по кругу чередуем числа ≡ 1 (1, 5, …, 361) и ≡ 3 (3, 7, …, 363) mod 4. Четвёрка: 1+3+1+3 ≡ 0 (mod 4), тройка нечётна. Ответ: 182.","f":[]}]}],"tags":["div","est"],"facts":["mod_shift","parity","est_ex"],"note":""}]}</script>

function parseNum(s){
  s = String(s).trim().toLowerCase().replace(/−/g,'-').replace(/%/g,'').replace(/\s+/g,' ');
  if(/^(√|sqrt|корень)/.test(s)){ var m=s.replace(/^(√|sqrt|корень( из)?)\s*\(?/,'').replace(/\)$/,''); var v=parseNum(m); return v==null?null:Math.sqrt(v); }
  var mixed = s.match(/^(-?\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(mixed){ var w=+mixed[1]; var fr=(+mixed[2])/(+mixed[3]); return w<0? w-fr : w+fr; }
  s = s.replace(/\s/g,'').replace(',', '.');
  var fm = s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
  if(fm){ var d=+fm[2]; return d? (+fm[1])/d : null; }
  if(/^-?\d+(\.\d+)?$/.test(s)) return +s;
  return null;
}
function near(a,b){ return Math.abs(a-b) < 1e-9*Math.max(1,Math.abs(b)); }
function checkAnswer(part, input){
  if(part.ak==="yn") return input===part.av;
  if(part.ak==="num"){ var a=parseNum(input), b=parseNum(part.av); return a!=null && b!=null && near(a,b); }
  if(part.ak==="set"){
    var want = part.av.split(';').map(parseNum).sort(function(x,y){return x-y;});
    var got = String(input).replace(/−/g,'-').split(/[;,]|\s*и\s*|\s+/i).map(function(x){return x.trim();}).filter(Boolean).map(parseNum);
    if(got.some(function(x){return x==null;})) return false;
    got.sort(function(x,y){return x-y;});
    if(got.length!==want.length) return false;
    for(var i=0;i<got.length;i++) if(!near(got[i],want[i])) return false; return true;
  }
  return false;
}

function firstUnsolved(after){
  var ps=content.problems, start=0;
  if(after!=null){ for(var i=0;i<ps.length;i++) if(ps[i].n===after){ start=i+1; break; } }
  for(var j=0;j<ps.length;j++){ var p=ps[(start+j)%ps.length]; if(!probDone(p)) return p.n; }
  return null;
}
function firstUnsolvedPart(p){ if(!p) return 0; for(var i=0;i<p.parts.length;i++) if(!partSt(p.n,i).ok) return i; return 0; }

function filtered(){

  return content.problems.filter(function(p){
    if(S.tag && p.tags.indexOf(S.tag)<0) return false;
    var done=probDone(p);
    if(S.filter==="todo" && done) return false;
    if(S.filter==="done" && !done) return false;
    if(S.filter==="fav" && !S.prog.fav[p.n]) return false;
    if(q){ var hay=(p.n+" "+p.code+" "+p.src+" "+p.stem+" "+p.parts.map(function(x){return x.q;}).join(' ')).toLowerCase(); if(hay.indexOf(q)<0) return false; }
    return true;
  });
}

function renderPart(p, i){
  var pt = p.parts[i]; var st = partSt(p.n,i);
  var card = h('div',{class:'card'});
  card.appendChild(h('p',{class:'q'}, h('b',null,pt.l+') '), pt.q));
  var fb = h('div');
  function verdict(ok, msg){
    fb.innerHTML=""; fb.appendChild(h('div',{class:'feedback '+(ok?'ok':'bad')}, msg));
  }
  function onResult(ok){
    var tries=(st.tries||0)+1;
    if(ok){
      setPart(p.n,i,{ok:true,tries:tries,at:Date.now(),clean:!(st.steps>0)});
      verdict(true,'Верно! '+(st.steps>0?'(с подсказками)':'Отлично — без подсказок.'));
      afterSolve(p,i);
    } else {
      setPart(p.n,i,{tries:tries});
      verdict(false,'Пока неверно. Откройте факты 📘 или следующий шаг решения.');
    }
    st = partSt(p.n,i);
  }
  var ansRow = h('div',{class:'ans'});
  if(pt.ak==="yn"){
    ["ДА","НЕТ"].forEach(function(v){ ansRow.appendChild(h('button',{class:'yn',onclick:function(){ onResult(checkAnswer(pt,v)); }},v)); });
  } else if(pt.ak==="num"||pt.ak==="set"){
    var inp = h('input',{class:'field',style:'max-width:260px',placeholder: pt.ak==="set"?'значения через ;':'ответ (можно дробь 5/7)',autocomplete:'off'});
    inp.addEventListener('keydown',function(e){ if(e.key==="Enter") onResult(checkAnswer(pt,inp.value)); });
    ansRow.appendChild(inp);
    ansRow.appendChild(h('button',{class:'btn primary',onclick:function(){ onResult(checkAnswer(pt,inp.value)); }},'Проверить'));
  } else {
    ansRow.appendChild(h('span',{style:'color:var(--muted);font-size:14px'},'Здесь нужен пример или доказательство. Решите в тетради, затем сверьтесь.'));
    ansRow.appendChild(h('button',{class:'btn primary',onclick:function(){
      fb.innerHTML="";
      fb.appendChild(h('div',{class:'feedback info'}, h('b',null,'Ожидаемый ответ: '), pt.av));
      fb.appendChild(h('div',{class:'row',style:'margin-top:8px'},
        h('button',{class:'btn',style:'border-color:var(--ok);color:var(--ok)',onclick:function(){ onResult(true); }},'✓ У меня так же / верно'),
        h('button',{class:'btn',onclick:function(){ setPart(p.n,i,{tries:(st.tries||0)+1}); fb.appendChild(h('div',{class:'feedback bad'},'Разберите решение по шагам ниже.')); }},'✗ Не получилось')));
    }},'Сверить с ответом'));
  }
  card.appendChild(ansRow);
  if(st.ok) fb.appendChild(h('div',{class:'feedback ok'},'✓ Пункт решён'+(st.clean?' без подсказок':'')+'. Ответ: '+(pt.ak==="yn"?pt.av:pt.av.replace(/;/g,'; '))));
  card.appendChild(fb);

  var shown = Math.min(st.steps||0, pt.steps.length);
  var stepsBox = h('div',{class:'steps'});
  pt.steps.slice(0,shown).forEach(function(s,k){ stepsBox.appendChild(renderStep(s,k)); });
  var more = h('button',{class:'btn primary',onclick:function(){ setPart(p.n,i,{steps:shown+1}); render(); }}, shown===0?'Показать 1-й шаг решения':'Следующий шаг ('+(shown+1)+' из '+pt.steps.length+')');
  var all = h('button',{class:'btn',onclick:function(){ setPart(p.n,i,{steps:pt.steps.length}); render(); }},'Показать всё решение');
  var hide = h('button',{class:'btn ghost',onclick:function(){ setPart(p.n,i,{steps:0}); render(); }},'Скрыть шаги');
  card.appendChild(h('div',{class:'tools'},
    h('button',{class:'btn',style:'border-color:var(--fact);color:var(--fact)',onclick:function(){ openDrawer(null,false); }},'📘 Факты для применения'),
    shown<pt.steps.length? more:null, shown<pt.steps.length? all:null, shown>0? hide:null));
  card.appendChild(stepsBox);
  return card;
}
function renderStep(s,k){
  return h('div',{class:'step'}, h('div',{class:'snum'},String(k+1)),
    h('div',null, h('div',{class:'stext'},s.t),
      s.f && s.f.length? h('div',{class:'fchips'}, s.f.map(function(id){ var f=factById[id]; return f? h('button',{class:'fchip',onclick:function(){ openDrawer(id,false); }},'📘 '+f.n):null; })):null));
}
var autoTimer=null;
function afterSolve(p,i){
  var nextPart=-1; for(var j=0;j<p.parts.length;j++) if(!partSt(p.n,j).ok){ nextPart=j; break; }
  setTimeout(function(){
    if(nextPart>=0){ S.part=nextPart; render(); toast('Переходим к пункту '+p.parts[nextPart].l+')'); return; }
    var nx = firstUnsolved(p.n);
    render();
    if(nx==null){ toast('🎉 Все задачи решены!'); return; }
    var t = toast('Задача '+p.n+' решена! Следующая через 3 с', [['Остаться',function(){ clearTimeout(autoTimer); }],['Перейти',function(){ clearTimeout(autoTimer); go(nx); render(); }]], 4500);
    autoTimer = setTimeout(function(){ go(nx); render(); }, 3000);
  }, 900);
}
var toastEl=null;
function toast(msg, actions, ms){
  if(toastEl) toastEl.remove();
  toastEl = h('div',{class:'toast'}, h('span',null,msg), (actions||[]).map(function(a){ return h('button',{onclick:function(){ a[1](); if(toastEl){toastEl.remove();toastEl=null;} }},a[0]); }));
  document.body.appendChild(toastEl);
  var me=toastEl; setTimeout(function(){ if(toastEl===me){ me.remove(); toastEl=null; } }, ms||2200);
  return me;
}

function openDrawer(hl, all){ S.drawer=true; S.hl=hl; S.drawerAll=!!all || (!S.cur); render(); if(hl) setTimeout(function(){ var el=document.getElementById('f_'+hl); if(el) el.scrollIntoView({block:'center',behavior:'smooth'}); },60); }
function closeDrawer(){ S.drawer=false; S.hl=null; render(); }
function factCard(f){
  return h('div',{class:'fact'+(S.hl===f.id?' hl':''),id:'f_'+f.id}, h('h4',null,f.n), h('p',null,f.t), f.e? h('div',{class:'ex'},h('b',null,'Пример: '),f.e):null);
}
function renderDrawer(){
  var p = probByN(S.cur);
  var dr = h('div',{class:'drawer'+(S.drawer?' open':'')});
  if(!S.drawer) return dr;
  var seg = h('div',{class:'seg'},
    h('button',{class:!S.drawerAll?'on':'',disabled:p?null:true,onclick:function(){ S.drawerAll=false; render(); }},'К этой задаче'),
    h('button',{class:S.drawerAll?'on':'',onclick:function(){ S.drawerAll=true; render(); }},'Все факты ('+content.facts.length+')'));
  var search = h('input',{class:'field',placeholder:'Поиск по теории',value:S.dq,style:'padding:8px 10px;font-size:14px'});
  var bodyEl = h('div',{class:'dbody'});
  function fill(){
    bodyEl.innerHTML="";
    var q=S.dq.trim().toLowerCase();
    function match(f){ return !q || (f.n+' '+f.t+' '+(f.e||'')).toLowerCase().indexOf(q)>=0; }
    if(!S.drawerAll && p){
      var ids = p.facts.slice();
      // добавим факты из шагов текущего пункта
      p.parts.forEach(function(pt){ pt.steps.forEach(function(s){ (s.f||[]).forEach(function(id){ if(ids.indexOf(id)<0) ids.push(id); }); }); });
      if(S.hl && ids.indexOf(S.hl)<0) ids.unshift(S.hl);
      bodyEl.appendChild(h('div',{class:'sec'},'Что пригодится в задаче '+p.n));
      var any=false;
      ids.forEach(function(id){ var f=factById[id]; if(f && match(f)){ any=true; bodyEl.appendChild(factCard(f)); } });
      if(!any) bodyEl.appendChild(h('div',{class:'empty'},'Ничего не найдено'));
      bodyEl.appendChild(h('button',{class:'btn small',style:'margin-top:6px',onclick:function(){ S.drawerAll=true; render(); }},'Показать все факты теории →'));
    } else {
      (content.sections||[]).forEach(function(sec){
        var fs = content.facts.filter(function(f){ return f.s===sec[0] && match(f); });
        if(!fs.length) return;
        bodyEl.appendChild(h('div',{class:'sec'},sec[1]));
        fs.forEach(function(f){ bodyEl.appendChild(factCard(f)); });
      });
      var other = content.facts.filter(function(f){ return !(content.sections||[]).some(function(s){return s[0]===f.s;}) && match(f); });
      if(other.length){ bodyEl.appendChild(h('div',{class:'sec'},'Другое')); other.forEach(function(f){ bodyEl.appendChild(factCard(f)); }); }
    }
  }
  search.addEventListener('input',function(e){ S.dq=e.target.value; fill(); });
  fill();
  dr.appendChild(h('div',{class:'dhead'}, h('div',{class:'dtitle'}, h('b',null,'📘 Теория чисел'), h('button',{class:'iconbtn',onclick:closeDrawer,title:'Закрыть'},'✕')), seg, search));
  dr.appendChild(bodyEl);
  return dr;
}

      .catch(function(e){ if(e && e.code==='declined') toast('Сохранение отменено'); else toast('Скачивание недоступно — скопируйте текст'); });

    return obj;
  }
  function act(kind, fname){ var txt=JSON.stringify(prep(kind),null,1); ta.value=txt; if(!download(fname, txt)) toast('Скачивание недоступно — скопируйте текст из поля'); }
  modal('Экспорт JSON',[
    h('p',null,'Файл JSON можно перенести на другое устройство и загрузить через «Импорт».'),
    h('div',{class:'row'},
      h('button',{class:'btn',onclick:function(){ act('me','progress-'+S.user+'-'+stamp()+'.json'); }},'Прогресс: '+S.user),
      h('button',{class:'btn',onclick:function(){ act('content','teoriya-chisel-zadachi-'+stamp()+'.json'); }},'Задачи и теория'),
      h('button',{class:'btn primary',onclick:function(){ act('all','teoriya-chisel-vse-'+stamp()+'.json'); }},'Всё (задачи + все ученики)')),
    h('div',{style:'margin-top:12px'},ta),
    h('div',{class:'row',style:'margin-top:8px'}, h('button',{class:'btn small',onclick:function(){ ta.select(); try{document.execCommand('copy'); toast('Скопировано');}catch(e){} }},'Копировать'))
  ]);
}
function applyImport(obj){
  var msgs=[];
  if(obj && Array.isArray(obj.problems) && Array.isArray(obj.facts)) obj = {content:obj};
  if(obj.content && Array.isArray(obj.content.problems)){
    var c=obj.content; if(!c.facts) c.facts=content.facts; if(!c.sections) c.sections=content.sections; if(!c.tags) c.tags=content.tags;
    c.problems.forEach(function(p){ p.parts=p.parts||[]; p.tags=p.tags||[]; p.facts=p.facts||[]; p.parts.forEach(function(pt){ pt.steps=pt.steps||[]; }); });
    content=c; store.set(K.content,c); indexFacts(); msgs.push('задач: '+c.problems.length+', фактов: '+c.facts.length);
  }
  if(obj.progress){
    Object.keys(obj.progress).forEach(function(name){
      var inc=obj.progress[name]; var cur=loadProg(name);
      Object.keys(inc.parts||{}).forEach(function(k){ var a=cur.parts[k]||{}, b=inc.parts[k];
        cur.parts[k]={ok:a.ok||b.ok, tries:Math.max(a.tries||0,b.tries||0), steps:Math.max(a.steps||0,b.steps||0), clean:(a.ok&&a.clean)||(b.ok&&b.clean), at:Math.max(a.at||0,b.at||0)}; });
      Object.keys(inc.fav||{}).forEach(function(k){ cur.fav[k]=true; });
      if(!cur.last) cur.last=inc.last;
      store.set(K.prog+name,cur); addProfile(name);
      if(S.user===name) S.prog=cur;
    });
    msgs.push('прогресс учеников: '+Object.keys(obj.progress).join(', '));
  }
  return msgs;
}
function importDialog(){
  var file = h('input',{type:'file',accept:'.json,application/json'});
  var ta = h('textarea',{placeholder:'…или вставьте JSON сюда'});
  var out = h('div');
  function run(txt){
    out.innerHTML="";
    try{ var obj=JSON.parse(txt); var msgs=applyImport(obj);
      if(!msgs.length) throw new Error('В файле нет ни задач, ни прогресса');
      out.appendChild(h('div',{class:'feedback ok'},'Загружено: '+msgs.join('; ')));
      if(S.user && !probByN(S.cur)) S.cur=content.problems[0].n;
      setTimeout(function(){ var m=document.querySelector('.modal'); if(m) m.remove(); render(); },900);
    }catch(e){ out.appendChild(h('div',{class:'feedback bad'},'Ошибка: '+e.message)); }
  }
  file.addEventListener('change',function(){ var f=file.files[0]; if(!f) return; var r=new FileReader(); r.onload=function(){ run(String(r.result)); }; r.readAsText(f,'utf-8'); });
  modal('Импорт JSON',[
    h('p',null,'Можно загрузить: прогресс ученика (объединится с текущим), набор задач и теории (заменит встроенный) или полный файл «Всё».'),
    file, h('div',{style:'margin-top:10px'},ta),
    h('div',{class:'row',style:'margin-top:8px'}, h('button',{class:'btn primary',onclick:function(){ run(ta.value); }},'Загрузить из поля'),
      store.get(K.content,null)? h('button',{class:'btn',onclick:function(){ store.del(K.content); content=BUILTIN; indexFacts(); toast('Возвращены встроенные задачи'); var m=document.querySelector('.modal'); if(m) m.remove(); render(); }},'Вернуть встроенные задачи'):null),
    h('details',{style:'margin-top:12px;font-size:13px;color:var(--muted)'}, h('summary',null,'Формат задач в JSON'),
      h('pre',{style:'white-space:pre-wrap'},'{"problems":[{"n":67,"code":"067","stem":"Условие…","tags":["div"],"facts":["div_def"],\n  "parts":[{"l":"а","q":"Вопрос?","ak":"yn","av":"ДА",\n    "steps":[{"t":"Шаг 1…","f":["div_def"]}]}]}],\n "facts":[{"id":"div_def","s":"div","n":"Название","t":"Формулировка","e":"Пример"}]}\nak: yn (ДА/НЕТ), num (число или дробь), set (значения через ;), self (пример/доказательство)')),
    out
  ]);
}
function buildAppHtml(withProgress){
  var clone = document.documentElement.cloneNode(true);
  var app = clone.querySelector('#app'); if(app) app.innerHTML='';
  Array.prototype.slice.call(clone.querySelectorAll('body > :not(script):not(#app)')).forEach(function(el){ el.remove(); });
  clone.querySelector('#app-data').textContent = JSON.stringify(content).replace(/</g,'\\u003c');
  clone.querySelector('#seed-progress').textContent = withProgress? JSON.stringify(allProgress()).replace(/</g,'\\u003c') : '{}';
  clone.removeAttribute('data-theme');
  return '<!DOCTYPE html>\n'+clone.outerHTML;
}
function saveAppDialog(){
  modal('Сохранить приложение целиком',[
    h('p',null,'Скачается один HTML-файл со всеми задачами, теорией и решениями (включая загруженные через импорт). Он открывается в любом браузере без интернета.'),
    h('div',{class:'row'},
      h('button',{class:'btn primary',onclick:function(){ if(!download('teoriya-chisel-'+stamp()+'.html', buildAppHtml(true),'text/html')) toast('Скачивание недоступно в этом окне'); }},'С прогрессом учеников'),
      h('button',{class:'btn',onclick:function(){ if(!download('teoriya-chisel-chistyj-'+stamp()+'.html', buildAppHtml(false),'text/html')) toast('Скачивание недоступно в этом окне'); }},'Без прогресса'))
  ]);
}
function statsDialog(){
  var t=totals();
  var rows = content.problems.map(function(p){
    return h('tr',null, h('td',null,String(p.n)), h('td',null, p.parts.map(function(pt,i){ var st=partSt(p.n,i); return pt.l+(st.ok?(st.clean?'✓':'✓ᵖ'):(st.steps||st.tries?'…':'·'))+' '; }).join('')),
      h('td',null, probDone(p)?'решена':''));
  });
  modal('Прогресс: '+S.user,[
    h('p',null,'Решено пунктов: '+t.ok+' из '+t.all+'. Полностью решено задач: '+t.full+' из '+content.problems.length+'.'),
    h('p',{style:'font-size:13px;color:var(--muted)'},'✓ — решён сам, ✓ᵖ — решён с подсказками, … — начат, · — не начат.'),
    h('table',{class:'stat'}, h('tr',null,h('th',null,'№'),h('th',null,'Пункты'),h('th',null,'')), rows)
  ]);
}
function resetProgress(){
  modal('Сбросить прогресс?',[ h('p',null,'Будет удалён весь прогресс ученика «'+S.user+'» на этом устройстве. Сначала можно сделать экспорт JSON.'),
    h('div',{class:'row'}, h('button',{class:'btn',style:'border-color:var(--bad);color:var(--bad)',onclick:function(){ S.prog={name:S.user,parts:{},fav:{},last:null,created:Date.now()}; save(); var m=document.querySelector('.modal'); if(m) m.remove(); render(); }},'Да, сбросить'))]);
}

// старт
var last = store.get(K.cur,null);
if(last && profiles().indexOf(last)>=0){ S.user=last; S.prog=loadProg(last); S.cur=S.prog.last||content.problems[0].n; S.part=firstUnsolvedPart(probByN(S.cur)); }
render();
document.addEventListener('keydown',function(e){ if(e.key==="Escape"){ if(S.drawer) closeDrawer(); var m=document.querySelector('.modal'); if(m) m.remove(); } });
})();
</script>
