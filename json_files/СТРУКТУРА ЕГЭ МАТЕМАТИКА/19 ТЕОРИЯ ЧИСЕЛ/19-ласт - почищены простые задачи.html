тьдесят два — и спускаемся по чётным до восьмидесяти. Всего восемьдесят семь разных чисел. Ответ: да."}],"rich":true},{"l":"в","q":"Найдите наибольшее количество различных чисел последовательности.","ak":"num","av":"90","steps":[{"w":["📌 Чисел от 80 до 170 — **91**. Удвоение возможно только из чисел ≤ 85.","📌 Нечётные можно пройти только одним отрезком в начале."],"f":[]},{"w":["📏 170 = 2·85 получается только из 85 или стоит первым.","👉 Если пройдены все нечётные (до 81), то 85 уже позади → 170 не получить.","👉 Значит, **все 91** взять нельзя → **≤ 90**."],"f":["extreme"]},{"w":["🔨 **Пример на 90:** 169 → … → 81 → 162 → 160 → … → 84 → 168 → 166 → 164 → 162 → … → 80","✅ **Ответ: 90.**"],"f":[]}],"v":[{"b":0,"s":"Всего чисел от восьмидесяти до ста семидесяти — девяносто одно. Следующее число может быть тем же, удвоенным или на два меньше. Удвоить можно только число не больше восьмидесяти пяти, иначе выйдем за сто семьдесят."},{"b":1,"s":"Возьмём число сто семьдесят. Его можно получить только удвоением восьмидесяти пяти или поставить в самое начало. Если мы хотим пройти все нечётные числа, мы спускаемся до восьмидесяти одного, и восемьдесят пять остаётся позади — значит, сто семидесяти не будет. Поэтому все девяносто одно число взять нельзя."},{"b":1,"f":"extreme"},{"b":2,"s":"А девяносто получить можно: проходим все нечётные, удваиваем восемьдесят один, спускаемся до восьмидесяти четырёх, удваиваем его — сто шестьдесят восемь — и спускаемся до восьмидесяти. Ответ: девяносто."}],"rich":true}],"tags":["seq","est"],"facts":["parity","extreme","est_ex"],"note":"","n":127},{"id":"190339","d":3,"from":"Школково","stem":"На доске написано не менее двух трёхзначных чисел (не обязательно различных), в записи которых нет нулей. У каждого из этих чисел стёрли вторую цифру (так, например, число 827 стало числом 87).","parts":[{"l":"а","q":"Приведите пример такого набора чисел, что сумма полученных чисел в 16 раз меньше суммы исходных.","ak":"self","av":"Например, 192 и 192: сумма 384, после стирания 12 + 12 = 24, 384 = 16·24.","steps":[{"w":["✏️ abc → ac:  из 100a + 10b + c получаем 10a + c.","📌 Для одного числа «в 16 раз»:","=100a + 10b + c = 16(10a + c)   →   2b = 12a + 3c","=a = 1,   c = 2,   b = 9:   192 = 16·12 ✔️"],"f":["dec_repr"]},{"w":["🔨 **Пример:** 192 и 192","=384 = 16·24"],"f":[]}],"v":[{"b":0,"s":"Запишем трёхзначное число через цифры. После стирания средней цифры остаётся десять а плюс цэ. Попробуем добиться, чтобы каждое число по отдельности уменьшалось в шестнадцать раз — тогда и сумма уменьшится в шестнадцать раз."},{"b":0,"f":"dec_repr"},{"b":0,"s":"Получаем уравнение два бэ равно двенадцать а плюс три цэ. Подходит а равно одному, цэ двум, бэ девяти: сто девяносто два превращается в двенадцать, ровно в шестнадцать раз меньше."},{"b":1,"s":"Чисел нужно хотя бы два, поэтому берём сто девяносто два дважды."}],"rich":true},{"l":"б","q":"Может ли сумма полученных чисел быть в 5,5 раз меньше суммы исходных?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 «В 5,5 раза»:","=Σ(100a + 10b + c) = 5,5·Σ(10a + c)   →   Σ(90a + 20b) = Σ9c","❌ Для каждого числа 90a + 20b ≥ 110 > 81 ≥ 9c.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Записываем условие и упрощаем: сумма девяноста а плюс двадцати бэ должна равняться сумме девяти цэ. Но для каждого числа левая часть хотя бы сто десять, ведь цифры не нулевые, а правая не больше восьмидесяти одного. Равенства быть не может. Ответ: нет."}],"rich":true},{"l":"в","q":"Найдите наименьшее количество чисел на доске, если сумма полученных чисел в 17 раз меньше суммы исходных.","ak":"num","av":"4","steps":[{"w":["📌 «В 17 раз»: сумма слагаемых 10b − 70a − 16c должна быть **0**.","👉 Положительно только у 191: **+4**. У остальных — отрицательные чётные числа, но не −2, −4, −8."],"f":[]},{"w":["📏 Из двух или трёх чисел сумму 0 не собрать.","🔨 **Четыре числа:** 191, 191, 191, 192","=4 + 4 + 4 − 12 = 0 ✔️","✅ **Ответ: 4.**"],"f":[]}],"v":[{"b":0,"s":"Запишем условие для семнадцати. Для каждого числа получается своё слагаемое — десять бэ минус семьдесят а минус шестнадцать цэ — и сумма этих слагаемых должна быть ноль."},{"b":0,"s":"Положительным это слагаемое бывает только у числа сто девяносто один — плюс четыре. У всех остальных оно отрицательное, и значений минус два, минус четыре и минус восемь не бывает."},{"b":1,"s":"Поэтому из двух или трёх чисел ноль не получить. А из четырёх можно: три раза сто девяносто один и одно сто девяносто два — плюс двенадцать и минус двенадцать. Ответ: четыре."}],"rich":true}],"tags":["digits","eq"],"facts":["dec_repr","lin_dioph","est_ex"],"note":"","n":128},{"id":"190342","d":3,"from":"Школково","stem":"Дано трёхзначное натуральное число, не кратное 100.","parts":[{"l":"в","q":"Какое наибольшее натуральное значение может иметь частное данного числа и суммы его цифр?","ak":"num","av":"91","steps":[{"w":["🔎 Разбираем сумму цифр **S**:","👉 S ≥ 11: частное \u003c 1000 : 11 \u003c 91","👉 **S = 10:** наибольшее число — 910, частное **91**","👉 S ≤ 9 (не кратно 100): частное ≤ 90"],"f":[]},{"w":["✅ **Ответ: 91** (число 910)."],"f":[]}],"v":[{"b":0,"s":"Переберём сумму цифр. Если она одиннадцать или больше, частное меньше тысячи, делённой на одиннадцать, то есть меньше девяноста одного."},{"b":0,"s":"Если сумма цифр десять, самое большое такое число — девятьсот десять, и частное как раз девяносто один."},{"b":0,"s":"Если сумма цифр меньше десяти, а число не кратно ста, то оценка показывает, что частное не больше девяноста."},{"b":1,"s":"Значит, наибольшее частное девяносто один. Ответ: девяносто один."}],"rich":true}],"tags":["digits"],"facts":["dec_repr","est_ex"],"note":"","n":129},{"id":"190455","d":3,"from":"Школково","stem":"Есть четыре коробки: в первой коробке 101 камень, во второй — 102, в третьей — 103, а в четвёртой коробке камней нет. За один ход берут по одному камню из любых трёх коробок и кладут в оставшуюся. Сделали некоторое количество таких ходов.","parts":[{"l":"в","q":"Какое наибольшее число камней могло оказаться в первой коробке?","ak":"num","av":"303","steps":[{"w":["📌 Разности по mod 4 сохраняются → остатки коробок 2, 3, 4 **разные**.","=в коробках 2, 3, 4 вместе ≥ 0 + 1 + 2 = 3   →   в первой ≤ 303"],"f":["invariant"]},{"w":["🔨 **Пример:**","👉 26 ходов в 4-ю: (75, 76, 77, 78)","👉 76 ходов в 1-ю: (303, 0, 1, 2) ✔️","✅ **Ответ: 303.**"],"f":[]}],"v":[{"b":0,"s":"Как в задаче про четыре коробки: при каждом ходе разности между коробками по модулю четыре сохраняются. Значит, во второй, третьей и четвёртой коробках всегда разные остатки, и в них вместе хотя бы ноль плюс один плюс два камня. В первой остаётся не больше трёхсот трёх."},{"b":0,"f":"invariant"},{"b":1,"s":"Пример: сначала двадцать шесть ходов в четвёртую коробку, чтобы выровнять числа, а потом семьдесят шесть ходов в первую. Получаем триста три, ноль, один, два. Ответ: триста три."}],"rich":true}],"tags":["ops"],"facts":["invariant","mod_def","est_ex"],"note":"","n":130},{"id":"15856","d":4,"from":"PDF №028","stem":"В течение n дней каждый день на доску записывают натуральные числа, каждое из которых меньше 6. При этом каждый день (кроме первого) сумма чисел, записанных на доску в этот день, больше, а количество меньше, чем в предыдущий день.","parts":[{"l":"а","q":"Может ли n быть больше 5?","ak":"yn","av":"ДА","steps":[{"w":["💡 **Идея:** каждый день заменяем **две единицы на одну тройку** → чисел на 1 меньше, сумма на 1 больше.","🔨 **6 дней:**","=1-й: 10 единиц  →  сумма 10, чисел 10","=2-й: 3 и 8 единиц  →  11, чисел 9","=3-й: 3, 3 и 6 единиц  →  12, чисел 8","=4-й: 3, 3, 3 и 4 единицы  →  13, чисел 7","=5-й: четыре 3 и 2 единицы  →  14, чисел 6","=6-й: пять 3  →  15, чисел 5","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Нужно, чтобы каждый день чисел становилось меньше, а сумма больше. Удобный приём: заменить две единицы одной тройкой. Тогда чисел на одно меньше, а сумма на один больше."},{"b":0,"s":"Начнём с десяти единиц и будем каждый день делать такую замену. Получается шесть дней — все записаны в решении. Ответ: да."}],"rich":true},{"l":"б","q":"Может ли среднее арифметическое чисел, записанных в первый день, быть меньше 3, а среднее арифметическое всех чисел, записанных за все дни, быть больше 4?","ak":"yn","av":"ДА","steps":[{"w":["🔨 **Пример на 3 дня:**","=1-й: десять 3 и одна 2  →  11 чисел, сумма 32, среднее ≈ 2,91 \u003c 3","=2-й: четыре 5 и шесть 4  →  10 чисел, сумма 44","=3-й: девять 5  →  9 чисел, сумма 45"],"f":["mean"]},{"w":["=всего 121 : 30 ≈ 4,03 > 4 ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"В первый день среднее меньше трёх, значит, числа маленькие. Но потом нужно, чтобы общее среднее стало больше четырёх. Поэтому в следующие дни пишем большие числа: пятёрки и четвёрки, а дней делаем мало, чтобы первый день не перевесил."},{"b":0,"f":"mean"},{"b":0,"s":"Первый день: десять троек и двойка, среднее чуть меньше трёх. Второй: четыре пятёрки и шесть четвёрок. Третий: девять пятёрок. Количество чисел уменьшается, сумма растёт."},{"b":1,"s":"Всего тридцать чисел с суммой сто двадцать один — среднее больше четырёх. Ответ: да."}],"rich":true},{"l":"в","q":"Известно, что сумма чисел, записанных в первый день, равна 6. Какое наибольшее значение может принимать сумма всех чисел, записанных за все дни?","ak":"num","av":"48","steps":[{"w":["📌 В первый день сумма 6 → чисел **не больше 6**. Количество уменьшается каждый день.","📌 Сумма последнего дня ≤ 5·(чисел в последний день), а суммы растут."],"f":[]},{"w":["🔎 Перебираем число дней n:","=n = 3:  6 + 20 + 19 = 45","=n = 4:  6 + 15 + 14 + 13 = **48**","=n = 5:  6 + 10 + 9 + 8 + 7 = 40"],"f":["est_ex"]},{"w":["🔨 **Пример:** 1,1,1,1,1,1 (6);  3,3,3,2,2 (13);  5,3,3,3 (14);  5,5,5 (15)","✅ **Ответ: 48.**"],"f":[]}],"v":[{"b":0,"s":"В первый день сумма шесть, значит, чисел не больше шести. Каждый день чисел меньше, поэтому дней не больше шести. А сумма последнего дня не больше пяти раз количество его чисел, и все предыдущие суммы ещё меньше."},{"b":1,"s":"Если дней много, в последний день чисел совсем мало, и суммы маленькие. Если дней мало — дней мало. Переберём количество дней. Больше всего получается при четырёх днях — сорок восемь."},{"b":1,"f":"est_ex"},{"b":2,"s":"Пример выписан в решении: суммы шесть, тринадцать, четырнадцать и пятнадцать. Ответ: сорок восемь."}],"rich":true}],"tags":["est","avg"],"facts":["mean","est_ex"],"note":"","n":131},{"id":"18140","d":4,"from":"PDF №031","stem":"Последовательность натуральных чисел (aₙ) состоит из 400 членов. Каждый член последовательности, начиная со второго, либо вдвое больше предыдущего, либо на 98 меньше предыдущего.","parts":[{"l":"а","q":"Может ли последовательность (aₙ) содержать ровно 5 различных чисел?","ak":"yn","av":"ДА","steps":[{"w":["💡 **Идея:** найдём **цикл**:","=14 → 28 → 56 → 112 → 14   (112 − 98 = 14)","🔨 Последовательность: 7, 14, 28, 56, 112, 14, 28, … — ровно **5** разных чисел.","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Хочется, чтобы числа повторялись по кругу. Будем удваивать, пока не сможем вернуться назад вычитанием девяноста восьми. Четырнадцать, двадцать восемь, пятьдесят шесть, сто двенадцать — и сто двенадцать минус девяносто восемь снова четырнадцать."},{"b":0,"s":"Начнём с семи, а дальше крутимся по этому циклу. Разных чисел ровно пять. Ответ: да."}],"rich":true},{"l":"б","q":"Чему может равняться a₁, если a₁₀₀ = 75?","ak":"num","av":"9777","steps":[{"w":["💡 Идём **назад**. Перед числом x стоит x/2 или x + 98.","📌 Если x **нечётное**, x/2 не целое → перед ним x + 98 — тоже нечётное.","👉 75 нечётное → все члены до него нечётные и уменьшаются на 98."],"f":["reverse"]},{"w":["=a₁ = 75 + 99·98 = 9777","✅ **Ответ: 9777.**"],"f":[]}],"v":[{"b":0,"s":"Пойдём назад от сотого члена. Перед любым числом стоит либо его половина, либо оно плюс девяносто восемь. У нечётного числа половина не целая, поэтому перед нечётным стоит число на девяносто восемь больше — и оно тоже нечётное."},{"b":0,"f":"reverse"},{"b":1,"s":"Семьдесят пять нечётное, значит, все девяносто девять предыдущих шагов — это вычитание девяноста восьми. Первый член — семьдесят пять плюс девяносто девять раз по девяносто восемь, то есть девять тысяч семьсот семьдесят семь. Ответ: девять тысяч семьсот семьдесят семь."}],"rich":true},{"l":"в","q":"Какое наименьшее значение может принимать наибольший член последовательности (aₙ)?","ak":"num","av":"112","steps":[{"w":["📌 400 членов, а значений немного → что-то **повторяется** → есть цикл.","✏️ Пусть все члены ≤ 111, M — наибольший в цикле."],"f":["dirichlet"]},{"w":["🔎 Смотрим на соседей M:","👉 после M — только M − 98 → **M ≥ 99**","👉 перед M — только M/2 → M чётное","👉 перед M/2 — M/4, перед M/4 — M/8 → M = 104, M/8 = 13","❌ Перед 13 должно стоять 6,5 или 111 > 104 — противоречие."],"f":["extreme"]},{"w":["📌 Значит, наибольший член **≥ 112**.","🔨 **Пример:** 14, 28, 56, 112, 14, … — наибольший 112.","✅ **Ответ: 112.**"],"f":[]}],"v":[{"b":0,"s":"В последовательности четыреста членов. Если все они не больше ста одиннадцати, то какое-то число повторится, а значит, последовательность зацикливается."},{"b":0,"f":"dirichlet"},{"b":1,"s":"Посмотрим на самое большое число цикла, эм. После него нельзя удваивать — получится ещё больше, значит, идёт эм минус девяносто восемь, и эм хотя бы девяносто девять. Перед ним нельзя стоять числу эм плюс девяносто восемь, значит, стоит половина эм."},{"b":1,"f":"extreme"},{"b":1,"s":"Продолжая так назад, получаем, что перед половиной стоит четверть, перед четвертью — восьмая часть. Подходит только эм равное ста четырём и восьмая часть тринадцать. А перед тринадцатью может стоять только сто одиннадцать — больше, чем эм. Противоречие."},{"b":2,"s":"Значит, наибольший член хотя бы сто двенадцать, и цикл из пункта а это показывает. Ответ: сто двенадцать."}],"rich":true}],"tags":["seq","ops"],"facts":["reverse","parity","extreme","dirichlet","est_ex"],"note":"","n":132},{"id":"15852","d":4,"from":"PDF №033","stem":"Вася и Петя решали задачи из сборника, и они оба решили все задачи этого сборника. Каждый день Вася решал на одну задачу больше, чем в предыдущий день, а Петя решал на две задачи больше, чем в предыдущий день. Они начали решать задачи в один день, при этом в первый день каждый из них решил хотя бы одну задачу.","parts":[{"l":"а","q":"Могло ли получиться так, что Вася в первый день решил на одну задачу меньше, чем Петя, а Петя решил все задачи из сборника ровно за 5 дней?","ak":"yn","av":"ДА","steps":[{"w":["✏️ Петя начал с **b**, Вася — с **b − 1**.","=Петя за 5 дней: 5b + 20"],"f":["ap"]},{"w":["🔨 **b = 3:**","=Петя: 3 + 5 + 7 + 9 + 11 = 35","=Вася: 2 + 3 + 4 + 5 + 6 + 7 + 8 = 35  (7 дней) ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Пусть Петя в первый день решил бэ задач, а Вася на одну меньше. Петя прибавляет по две задачи в день, поэтому за пять дней он решает пять бэ плюс двадцать."},{"b":0,"f":"ap"},{"b":1,"s":"Попробуем бэ равное трём: Петя решает тридцать пять задач. Вася начинает с двух и прибавляет по одной — за семь дней как раз тридцать пять. Ответ: да."}],"rich":true},{"l":"б","q":"Могло ли получиться так, что Вася в первый день решил на одну задачу больше, чем Петя, а Петя решил все задачи из сборника ровно за 4 дня?","ak":"yn","av":"НЕТ","steps":[{"w":["✏️ Вася начал с **a**, Петя — с **a − 1**.","=Петя за 4 дня: 4a + 8"],"f":[]},{"w":["🔎 Вася за p дней:","👉 p ≤ 3: не больше 3a + 3 \u003c 4a + 8 ❌","👉 p = 4: 4a + 6 ≠ 4a + 8 ❌","👉 p ≥ 5: не меньше 5a + 10 > 4a + 8 ❌","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Теперь Вася начинает с а задач, а Петя с а минус одной. За четыре дня Петя решает четыре а плюс восемь."},{"b":1,"s":"Посмотрим, сколько может решить Вася за разное число дней. За три дня и меньше — слишком мало. За четыре дня — четыре а плюс шесть, на два меньше. За пять дней и больше — уже слишком много. Ни один вариант не подходит. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое наименьшее количество задач могло быть в сборнике, если каждый из ребят решал задачи более 6 дней, причем в первый день один из мальчиков решил на одну задачу больше чем другой?","ak":"num","av":"84","steps":[{"w":["📌 Каждый решал **не меньше 7 дней**, первые числа отличаются на 1.","🔎 Выписываем все возможные суммы меньше 84:","👉 Петя: 7 дней — 49, 56, 63, 70, 77;  8 дней — 64, 72, 80;  9 дней — 81","👉 Вася: суммы 7 и более дней подряд — 28, 35, 36, 42, 44, 45, …"],"f":[]},{"w":["❌ Сверяем, учитывая разницу первых чисел в 1, — совпадений нет.","📌 Значит, задач **≥ 84**."],"f":[]},{"w":["🔨 **Пример:** Вася 7, 8, …, 14 (8 дней); Петя 6, 8, …, 18 (7 дней) — по 84 задачи.","✅ **Ответ: 84.**"],"f":[]}],"v":[{"b":0,"s":"Ищем наименьшее количество задач. Здесь удобнее всего аккуратный перебор. Выпишем все суммы меньше восьмидесяти четырёх, которые может получить Петя за семь, восемь или девять дней, и все суммы, которые может получить Вася за семь дней и больше."},{"b":1,"s":"Теперь сверяем их, помня, что первые числа отличаются на единицу. Совпадений нет — значит, меньше восьмидесяти четырёх задач быть не может."},{"b":2,"s":"А восемьдесят четыре получается: Вася решает от семи до четырнадцати задач в день восемь дней, а Петя — от шести до восемнадцати через две, семь дней. Ответ: восемьдесят четыре."}],"rich":true}],"tags":["seq","eq"],"facts":["ap","lin_dioph","est_ex"],"note":"","n":133},{"id":"46760","d":4,"from":"PDF №036","stem":"На доске было написано несколько различных натуральных чисел. Эти числа разбили на три группы, в каждой из которых оказалось хотя бы одно число. К каждому числу из первой группы приписали справа цифру 1, к каждому числу из второй группы – цифру 8, а числа третьей группы оставили без изменений.","parts":[{"l":"а","q":"Могла ли сумма всех этих чисел увеличиться в 4 раза?","ak":"yn","av":"ДА","steps":[{"w":["📌 Число из 1-й группы → **10x + 1**, из 2-й → **10x + 8**, 3-я без изменений.","🔨 **Пример:** 1 (→ 11), 2 (→ 28), 9 (без изменений)","=было 12,   стало 11 + 28 + 9 = 48 = 4·12 ✔️","✅ **Ответ: да.**"],"f":["append"]}],"v":[{"b":0,"s":"Приписать цифру справа — значит умножить число на десять и прибавить эту цифру. Числа в первых двух группах сильно растут, а в третьей не меняются."},{"b":0,"f":"append"},{"b":0,"s":"Чтобы сумма выросла только в четыре раза, третья группа должна быть тяжёлой. Возьмём один и два в первые группы, а девять в третью. Было двенадцать, стало сорок восемь. Ответ: да."}],"rich":true},{"l":"б","q":"Могла ли сумма всех этих чисел увеличиться в 18 раз?","ak":"yn","av":"НЕТ","steps":[{"w":["✏️ **A, B, C** — суммы групп, **a, b** — количества чисел в 1-й и 2-й:","=10A + a + 10B + 8b + C = 18(A + B + C)   →   a + 8b = 8A + 8B + 17C"],"f":[]},{"w":["📌 A ≥ a, B ≥ b, C ≥ 1:","=правая часть ≥ 8a + 8b + 17 > a + 8b","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Обозначим суммы групп большими буквами, а количество чисел в первых двух группах — маленькими. Записываем новую сумму и приравниваем к восемнадцати старым. После упрощения слева остаются только приписанные цифры, а справа — суммы групп с большими коэффициентами."},{"b":1,"s":"Но сумма группы не меньше количества чисел в ней, а третья группа не пустая. Поэтому правая часть заведомо больше левой. Ответ: нет."}],"rich":true},{"l":"в","q":"Сумма всех этих чисел увеличилась в 11 раз. Какое наибольшее количество чисел могло быть написано на доске?","ak":"num","av":"10","steps":[{"w":["📌 «В 11 раз»:","=a + 8b = A + B + 10C","📌 Сумма всех n чисел T ≥ 1 + 2 + … + n, а из условия T ≤ 8n − 24."],"f":["sum_1n"]},{"w":["=n(n + 1) : 2 ≤ 8n − 24   →   n ≤ 10"],"f":[]},{"w":["🔨 **Пример:** 1-я {2}, 2-я {3, 4, 5, 6, 7, 8, 9, 11}, 3-я {1}","=было 56,   стало 21 + 594 + 1 = 616 = 11·56 ✔️","✅ **Ответ: 10.**"],"f":[]}],"v":[{"b":0,"s":"Записываем условие для одиннадцати раз так же, как в пункте бэ. С одной стороны, сумма всех чисел не меньше суммы чисел от одного до эн, ведь числа разные. С другой стороны, из уравнения сумма всех чисел ограничена через количество чисел — не больше восьми эн минус двадцать четыре."},{"b":0,"f":"sum_1n"},{"b":1,"s":"Сравниваем и решаем квадратное неравенство: эн не больше десяти."},{"b":2,"s":"Пример на десять чисел выписан в решении: в первой группе двойка, в третьей единица, остальные во второй. Ответ: десять."}],"rich":true}],"tags":["digits","est"],"facts":["append","sum_1n","est_ex"],"note":"","n":134},{"id":"159703","d":4,"from":"PDF №049","stem":"На доске было написано несколько различных натуральных чисел. Эти числа разбили на три группы, в каждой из которых оказалось хотя бы одно число. К каждому числу из первой группы приписали справа цифру 3, к каждому числу из второй группы — цифру 7, а числа из третьей группы оставили без изменений.","parts":[{"l":"а","q":"Могла ли сумма всех этих чисел увеличиться в 8 раз?","ak":"yn","av":"ДА","steps":[{"w":["📌 Число из 1-й группы → **10x + 3**, из 2-й → **10x + 7**.","🔨 **Пример:** {1}, {8}, {4}","=было 13,   стало 13 + 87 + 4 = 104 = 8·13 ✔️","✅ **Ответ: да.**"],"f":["append"]}],"v":[{"b":0,"s":"Как в похожей задаче: приписывание цифры умножает число на десять и добавляет цифру. Подберём пример: единица в первой группе станет тринадцатью, восьмёрка во второй — восемьюдесятью семью, четвёрка останется. Было тринадцать, стало сто четыре — в восемь раз больше. Ответ: да."},{"b":0,"f":"append"}],"rich":true},{"l":"б","q":"Могла ли сумма всех этих чисел увеличиться в 17 раз?","ak":"yn","av":"НЕТ","steps":[{"w":["=10A + 3a + 10B + 7b + C = 17(A + B + C)   →   3a + 7b = 7A + 7B + 16C","📌 A ≥ a, B ≥ b, C ≥ 1 → правая часть ≥ 7a + 7b + 16 > 3a + 7b","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Записываем условие для семнадцати раз и упрощаем. Слева остаются приписанные цифры, справа — суммы групп с коэффициентами. Сумма группы не меньше количества её чисел, а третья группа не пустая, поэтому правая часть больше левой. Ответ: нет."}],"rich":true},{"l":"в","q":"В какое наибольшее число раз могла увеличиться сумма всех этих чисел?","ak":"num","av":"232/21","steps":[{"w":["📌 Во сколько раз выросла сумма:","=t = 10 + (3a + 7b − 9C) : T","📌 3a + 7b ≤ 7(n − 1) − 4,   C ≥ 1,   T ≥ n(n + 1) : 2"],"f":[]},{"w":["🔎 Перебираем n:","=n = 4:  0,8;   n = 5:  1;   **n = 6:  22/21**;   n = 7:  58/56;   n = 8:  1","👉 Наибольшее при n = 6:  t ≤ 232/21"],"f":[]},{"w":["🔨 **Пример:** {2}, {3, 4, 5, 6}, {1}","=было 21,   стало 23 + 37 + 47 + 57 + 67 + 1 = 232","✅ **Ответ: 232/21.**"],"f":[]}],"v":[{"b":0,"s":"Новая сумма — это десять старых плюс приписанные цифры минус девять сумм третьей группы. Значит, коэффициент роста — десять плюс добавка, делённая на старую сумму."},{"b":0,"s":"Добавка не больше семи раз количество чисел без третьей группы, минус немного, а старая сумма не меньше суммы первых эн натуральных чисел. Получаем оценку, зависящую только от эн."},{"b":1,"s":"Перебираем эн — лучше всего получается при шести числах: двадцать две двадцать первых."},{"b":2,"s":"Пример: двойка в первой группе, тройка, четвёрка, пятёрка и шестёрка во второй, единица в третьей. Было двадцать один, стало двести тридцать два. Ответ: двести тридцать два двадцать первых."}],"rich":true}],"tags":["digits","est"],"facts":["append","sum_1n","est_ex"],"note":"","n":135},{"id":"127722","d":4,"from":"PDF №055","stem":"На доске написано 30 чисел: десять «5», десять «4» и десять «3». Эти числа разбивают на две группы, в каждой из которых есть хотя бы одно число. Среднее арифметическое чисел в первой группе равно A, среднее арифметическое чисел во второй группе равно B. При этом для группы из единственного числа среднее арифметическое равно этому числу.","parts":[{"l":"а","q":"Приведите пример разбиения исходных чисел на две группы, при котором среднее арифметическое всех чисел меньше (A+ B)/2.","ak":"self","av":"Например, первая группа — одно число 5, вторая — остальные 29 чисел: A = 5, B = 115/29, (A+B)/2 ≈ 4,48 > 4.","steps":[{"w":["📌 Среднее всех чисел:","=(50 + 40 + 30) : 30 = 4","👉 Нужно A + B > 8."],"f":["mean"]},{"w":["🔨 **Пример:** первая группа — одно число **5**, вторая — остальные 29:","=A = 5,   B = 115 : 29 ≈ 3,97,   (A + B) : 2 ≈ 4,48 > 4 ✔️"],"f":[]}],"v":[{"b":0,"s":"Среднее всех тридцати чисел равно четырём. Нужно, чтобы полусумма средних групп была больше четырёх."},{"b":0,"f":"mean"},{"b":1,"s":"Хитрость: маленькая группа влияет на полусумму так же сильно, как большая. Положим в первую группу одну пятёрку — её среднее пять. Во второй группе среднее чуть меньше четырёх. Полусумма около четырёх с половиной. Пример готов."}],"rich":true},{"l":"б","q":"Докажите, что если разбить исходные числа на две группы по 15 чисел, то среднее арифметическое всех чисел будет равно (A+ B)/2","ak":"self","av":"Если группы по 15 чисел с суммами S₁ и S₂, то (A+B)/2 = (S₁/15 + S₂/15)/2 = (S₁+S₂)/30 — среднее всех.","steps":[{"w":["✏️ Суммы групп **S₁** и **S₂**, в каждой 15 чисел:","=(A + B) : 2 = (S₁ : 15 + S₂ : 15) : 2 = (S₁ + S₂) : 30","👉 Это и есть **среднее всех** чисел ✔️"],"f":[]}],"v":[{"b":0,"s":"Если в группах по пятнадцать чисел, то каждое среднее — сумма группы, делённая на пятнадцать. Полусумма средних — это сумма обеих групп, делённая на тридцать, то есть среднее всех чисел. Что и требовалось доказать."}],"rich":true},{"l":"в","q":"Найдите наибольшее возможное значение выражения (A+ B)/2","ak":"num","av":"130/29","steps":[{"w":["✏️ В первой группе k ≤ 15 чисел с суммой S₁:","=A + B = S₁·(1/k − 1/(30 − k)) + 120 : (30 − k)","📌 При k \u003c 15 выражение растёт с S₁ → берём в первую группу **пятёрки**."],"f":["frac_monot"]},{"w":["📏 k ≤ 10:  A + B ≤ 10 − 30 : (30 − k) — наибольшее при **k = 1**:","=A + B ≤ 5 + 115/29","👉 При 10 \u003c k \u003c 15 получается меньше."],"f":[]},{"w":["=(A + B) : 2 = 130/29","✅ **Ответ: 130/29.**"],"f":[]}],"v":[{"b":0,"s":"Пусть в меньшей группе ка чисел с суммой эс один. Запишем сумму средних через эс один и ка. Если ка меньше пятнадцати, эта сумма растёт вместе с эс один. Значит, в маленькую группу выгодно класть самые большие числа — пятёрки."},{"b":0,"f":"frac_monot"},{"b":1,"s":"Если в маленькой группе только пятёрки, получается выражение, которое тем больше, чем меньше ка. Лучше всего — одна пятёрка. А группы от одиннадцати до четырнадцати чисел дают меньше."},{"b":2,"s":"Значит, наибольшая полусумма — пять плюс сто пятнадцать двадцать девятых, делённое пополам, то есть сто тридцать двадцать девятых. Ответ: сто тридцать двадцать девятых."}],"rich":true}],"tags":["avg"],"facts":["mean","frac_monot","est_ex"],"note":"В ключе файла ответ к в) записан как «4 14 29» — это смешанное число 4 14/29 = 130/29.","n":136},{"id":"46762","d":4,"from":"PDF №060","stem":"В школах №1 и №2 учащиеся писали тест. Из каждой школы тест писали по крайней мере 2 учащихся, а суммарно тест писал 51 учащийся. Каждый учащийся, писавший тест, набрал натуральное количество баллов. Оказалось, что в каждой школе средний балл за тест был целым числом. После этого один из учащихся, писавших тест, перешёл из школы №1 в школу №2, а средние баллы за тест были пересчитаны в обеих школах.","parts":[{"l":"а","q":"Мог ли средний балл в школе №1 вырасти в 2 раза?","ak":"yn","av":"НЕТ","steps":[{"w":["✏️ Школа №1: n₁ учеников, среднее m₁, ушёл ученик с **x** баллами:","=(n₁m₁ − x) : (n₁ − 1) = 2m₁   →   x = m₁(2 − n₁)","❌ При n₁ ≥ 2 получаем x ≤ 0, а баллы натуральные.","✅ **Ответ: нет.**"],"f":["mean_move"]}],"v":[{"b":0,"s":"Пусть в первой школе эн один учеников со средним эм один, а ушёл ученик с икс баллами. Если новое среднее вдвое больше, то, выразив икс, получаем эм один на два минус эн один. Учеников хотя бы два, поэтому икс не больше нуля. А баллы натуральные. Ответ: нет."},{"b":0,"f":"mean_move"}],"rich":true},{"l":"б","q":"Средний балл в школе №1 вырос на 10%, средний балл в школе №2 также вырос на 10%. Мог ли первоначальный средний балл в школе №2 равняться 1?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Обе школы — рост на 10%:","=x = m₁(11 − n₁) : 10     (школа №1)","=x = m₂(n₂ + 11) : 10 = m₂(62 − n₁) : 10     (школа №2)"],"f":[]},{"w":["🔎 **m₂ = 1:** x = (62 − n₁) : 10 целое → n₁ = 2, x = 6","=тогда 9m₁ = 60 — m₁ не целое ❌","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"В первой школе среднее выросло на десять процентов — значит, ушёл слабый ученик. Во второй тоже выросло — значит, пришедший сильнее её среднего. Записываем оба условия и выражаем икс двумя способами."},{"b":1,"s":"Если среднее во второй школе было один, то икс равно шестидесяти двум минус эн один, делённому на десять. Чтобы это было целым при эн один от двух до десяти, эн один равно двум, а икс шести. Но тогда для первой школы среднее эм один получается дробным. Ответ: нет."}],"rich":true},{"l":"в","q":"Средний балл в школе №1 вырос на 10%, средний балл в школе №2 также вырос на 10%. Найдите наименьшее значение первоначального среднего балла в школе №2.","ak":"num","av":"3","steps":[{"w":["🔎 **m₂ = 2:** x = (62 − n₁) : 5 → n₁ = 2 или 7 → m₁ не целое ❌"],"f":[]},{"w":["🔨 **m₂ = 3:** n₁ = 2, x = 18, m₁ = 20 ✔️","👉 Школа №1: 18 и 22 (среднее 20 → 22)","👉 Школа №2: 49 учеников со средним 3, после (147 + 18) : 50 = 3,3","✅ **Ответ: 3.**"],"f":[]}],"v":[{"b":0,"s":"Продолжаем перебор. Среднее два во второй школе тоже не подходит: снова получается дробное эм один."},{"b":1,"s":"При среднем три подходит: в первой школе два ученика с баллами восемнадцать и двадцать два, ученик с восемнадцатью переходит. В первой школе среднее было двадцать, стало двадцать два. Во второй сорок девять учеников со средним три, после перехода — три целых три десятых. Ответ: три."}],"rich":true}],"tags":["avg"],"facts":["mean_move","percent","lin_dioph","est_ex"],"note":"","n":137},{"id":"159623","d":4,"from":"PDF №062","stem":"Из правильной несократимой дроби a/b где a и b – натуральные числа, за один ход получают дробь (a+b)/(2a+b).","parts":[{"l":"а","q":"Можно ли за несколько таких ходов из дроби 1/3 получить дробь 23/21?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Новая дробь всегда **правильная**:","=a + b \u003c 2a + b   →   (a + b) : (2a + b) \u003c 1","❌ 23/21 > 1 — получить нельзя.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Посмотрите на новую дробь: числитель а плюс бэ меньше знаменателя два а плюс бэ. Значит, после хода дробь всегда меньше единицы. А двадцать три двадцать первых больше единицы. Ответ: нет."}],"rich":true},{"l":"б","q":"Можно ли за два таких хода из некоторой дроби получить дробь, равную 7/12?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Если x = a/b между 0 и 1, то новая дробь (x + 1) : (2x + 1) лежит **между 2/3 и 1**.","❌ 7/12 \u003c 2/3 — не получить даже за один ход.","✅ **Ответ: нет.**"],"f":["frac_monot"]}],"v":[{"b":0,"s":"Запишем ход через икс, равное а делить на бэ: новая дробь — икс плюс один, делённое на два икс плюс один. Чем больше икс, тем меньше эта дробь. При икс между нулём и единицей она лежит между двумя третями и единицей."},{"b":0,"f":"frac_monot"},{"b":0,"s":"А семь двенадцатых меньше двух третей. Значит, её нельзя получить даже за один ход, не то что за два. Ответ: нет."}],"rich":true},{"l":"в","q":"Несократимая дробь c/d больше 0,7. Найдите наименьшую дробь c/d которую нельзя получить ни из какой правильной несократимой дроби за два таких хода.","ak":"num","av":"5/7","steps":[{"w":["📌 После двух ходов дробь лежит **между 2/3 и 5/7**.","👉 5/7 и больше получить нельзя."],"f":[]},{"w":["📌 Любую дробь c/d между 2/3 и 1 можно получить из (d − c) : (2c − d) — правильной и несократимой.","👉 Дроби между 0,7 и 5/7 получаются за два хода."],"f":["gcd"]},{"w":["✅ **Ответ: 5/7.**"],"f":[]}],"v":[{"b":0,"s":"После первого хода дробь между двумя третями и единицей. Подставим такие значения ещё раз — после второго хода дробь окажется между двумя третями и пятью седьмыми. Значит, пять седьмых и всё, что больше, за два хода не получить."},{"b":1,"s":"С другой стороны, если идти назад, то любая дробь между двумя третями и единицей получается из правильной несократимой дроби. Для дробей больше семи десятых, но меньше пяти седьмых этот шаг назад можно сделать дважды."},{"b":1,"f":"gcd"},{"b":2,"s":"Значит, наименьшая дробь больше семи десятых, которую нельзя получить, — пять седьмых. Ответ: пять седьмых."}],"rich":true}],"tags":["ops"],"facts":["gcd","frac_monot","reverse","est_ex"],"note":"В ключе файла к а) — «ДА», но при записанном условии (дробь 23/21 > 1) получить её нельзя. Вероятно, опечатка в дроби: например, 22/31 получается за три хода: 1/3 → 4/5 → 9/13 → 22/31.","n":138},{"id":"17434","d":4,"from":"Школково","stem":"Склад представляет собой прямоугольный параллелепипед с целыми сторонами, контейнеры — прямоугольные параллелепипеды с размерами 1× 1× 3 м. Контейнеры на складе можно класть как угодно, но параллельно границам склада.","parts":[{"l":"а","q":"Может ли оказаться, что полностью заполнить склад размером 120 кубометров нельзя?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 120 = 3·40, а 3 — простое → **одна из сторон** склада делится на 3.","🔨 Кладём контейнеры вдоль этой стороны — склад заполнен полностью.","✅ **Ответ: нет.**"],"f":["fta"]}],"v":[{"b":0,"s":"Объём склада сто двадцать — это произведение трёх сторон. Сто двадцать делится на три, а три — простое число, поэтому хотя бы одна сторона делится на три."},{"b":0,"f":"fta"},{"b":0,"s":"Кладём все контейнеры вдоль этой стороны — они плотно заполнят весь склад. Значит, заполнить можно всегда. Ответ: нет."}],"rich":true},{"l":"б","q":"Может ли оказаться, что на склад объемом 100 кубометров не удастся поместить 33 контейнера?","ak":"yn","av":"ДА","steps":[{"w":["🔨 **Склад 2 × 2 × 25:** контейнер помещается только вдоль длинной стороны.","👉 В каждый из 4 рядов — 8 контейнеров (24 м из 25):","=4·8 = 32 \u003c 33","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Подберём неудобную форму склада. Пусть он два на два на двадцать пять. Контейнер длиной три помещается только вдоль длинной стороны."},{"b":0,"s":"Получается четыре ряда, и в каждом восемь контейнеров — они занимают двадцать четыре метра из двадцати пяти. Всего тридцать два, тридцать третий не влезает. Ответ: да."}],"rich":true},{"l":"в","q":"Пусть объем склада равен 800 кубометрам. Какой процент объема такого склада удастся гарантированно заполнить контейнерами при любой конфигурации склада?","ak":"num","av":"99","steps":[{"w":["📌 800 = 2⁵·5² → **ни одна** сторона не делится на 3.","🔨 Заполняем по шагам: сначала часть, кратную 3 по длине, потом остатки поперёк.","📏 Пустым остаётся не больше 2·2·2 = **8 м³** → заполнено ≥ 792 : 800 = 99%."],"f":[]},{"w":["📌 **Склад 2 × 2 × 200:** помещается только 4·66 = 264 контейнера = 792 м³ — ровно 99%.","✅ **Ответ: 99%.**"],"f":[]}],"v":[{"b":0,"s":"Восемьсот на три не делится, поэтому ни одна сторона не кратна трём, и идеально заполнить склад нельзя. Но заполним как можно больше: сначала кладём контейнеры вдоль одной стороны, сколько помещается, а оставшийся слой толщиной один или два метра заполняем контейнерами поперёк."},{"b":0,"s":"В итоге пустым остаётся кубик не больше двух на два на два — восемь кубометров. Значит, всегда заполняется хотя бы девяносто девять процентов."},{"b":1,"s":"А лучше гарантировать нельзя: склад два на два на двести вмещает только двести шестьдесят четыре контейнера — ровно девяносто девять процентов объёма. Ответ: девяносто девять процентов."}],"rich":true}],"tags":["est"],"facts":["div_def","est_ex"],"note":"","n":139},{"id":"19982","d":4,"from":"Школково","stem":"В шахматы можно выиграть, проиграть или сыграть вничью. Шахматист записывает результат каждой сыгранной им партии и после каждой партии подсчитывает три показателя. «Победы» — процент побед, округлённый до целого, «ничьи» — процент ничьих, округлённый до целого, и «поражения», равный разности 100 и суммы показателей «побед» и «ничьих». Например, число 13,2 округляется до 13, число 14,5 округляется до 15, число 16,8 округляется до 17.","parts":[{"l":"а","q":"Может ли в какой-то момент показатель «побед» равняться 17, если было сыграно менее 50 партий?","ak":"yn","av":"ДА","steps":[{"w":["🔨 **Пример:** 1 победа из 6 партий","=1 : 6 ≈ 16,67%  →  17 ✔️","✅ **Ответ: да.**"],"f":["rounding"]}],"v":[{"b":0,"f":"rounding"},{"b":0,"s":"Одна победа из шести партий — это шестнадцать целых шестьдесят семь сотых процента, округляется до семнадцати. Ответ: да."}],"rich":true},{"l":"б","q":"Может ли после выигранной партии увеличиться показатель «поражений»?","ak":"yn","av":"ДА","steps":[{"w":["🔨 **17 партий:** 12 побед, 4 ничьи","=победы 70,6% → 71,   ничьи 23,5% → 24,   «поражения» 100 − 95 = 5"],"f":[]},{"w":["👉 После ещё одной победы — 18 партий:","=победы 72,2% → 72,   ничьи 22,2% → 22,   «поражения» 6","📌 Показатель «поражений» **вырос** ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Показатель поражений считается как сто минус два округлённых числа, поэтому из-за округлений он может вести себя странно. Нужен случай, когда сначала оба показателя округляются вверх, а потом — вниз."},{"b":0,"s":"Пусть сыграно семнадцать партий: двенадцать побед и четыре ничьи. Оба показателя округляются вверх, и поражений пять."},{"b":1,"s":"Шахматист выигрывает ещё одну партию. Теперь оба показателя округляются вниз, и поражений становится шесть — больше, хотя он выиграл. Ответ: да."}],"rich":true},{"l":"в","q":"Одна из партий была проиграна. При каком наименьшем количестве сыгранных партий показатель «поражений» может быть равным 1?","ak":"num","av":"51","steps":[{"w":["📌 «Победы» + «ничьи» = 99, а каждое округление добавляет не больше 0,5:","=100l : n ≤ 2   →   n ≥ 50","📌 n = 50: доли целые, сумма ≤ 98 → «поражений» ≥ 2 ❌ → **n ≥ 51**."],"f":[]},{"w":["🔨 **51 партия:** 12 побед, 38 ничьих, 1 поражение","=23,53% → 24,     74,51% → 75,     100 − 99 = 1 ✔️","✅ **Ответ: 51.**"],"f":[]}],"v":[{"b":0,"s":"Хотя бы одна партия проиграна, а показатель поражений один. Значит, победы и ничьи вместе дают девяносто девять. Каждое округление добавляет не больше половины, поэтому настоящая доля поражений не больше двух процентов, и партий хотя бы пятьдесят."},{"b":0,"s":"Ровно пятьдесят не подходит: тогда каждая партия — ровно два процента, округлять нечего, и при одном поражении показатель два. Значит, партий хотя бы пятьдесят одна."},{"b":1,"s":"Пример: пятьдесят одна партия, двенадцать побед и тридцать восемь ничьих. Обе доли округляются вверх, в сумме девяносто девять, и показатель поражений один. Ответ: пятьдесят одна."}],"rich":true}],"tags":["avg"],"facts":["rounding","percent","est_ex"],"note":"","n":140},{"id":"24436","d":4,"from":"Школково","stem":"По кругу стоят несколько детей, среди которых есть хотя бы два мальчика и хотя бы две девочки. У каждого из детей есть натуральное число конфет. У любых двух мальчиков одинаковое число конфет, а у любых двух девочек — разное. По команде каждый отдал соседу справа четверть своих конфет. После этого у любых двух девочек оказалось одинаковое число конфет, а у любых двух мальчиков — разное. Известно, что каждый из детей отдал натуральное число конфет.","parts":[{"l":"а","q":"Может ли мальчиков быть ровно столько же, сколько девочек?","ak":"yn","av":"ДА","steps":[{"w":["💡 Каждый отдаёт четверть → у ребёнка остаётся ¾ своих и приходит ¼ от соседа слева.","📌 Два мальчика с соседями-мальчиками стали бы равными → мальчики стоят **одной группой**, и мальчиков **ровно 2**."],"f":[]},{"w":["🔨 **Пример:** М, М, Д, Д по кругу — 16, 16, 4, 8 конфет","=после: 14, 16, 7, 7 ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"После команды у каждого остаётся три четверти своих конфет и приходит четверть от соседа. У мальчиков конфет поровну. Если у двух мальчиков слева тоже мальчики, у них после передачи снова будет поровну, а должно стать разное. Отсюда получается, что мальчики стоят рядом и их ровно двое."},{"b":1,"s":"Пример: два мальчика и две девочки по кругу, у мальчиков по шестнадцать конфет, у девочек четыре и восемь. После передачи у мальчиков четырнадцать и шестнадцать, а у девочек по семь. Ответ: да."}],"rich":true},{"l":"б","q":"Может ли мальчиков быть больше, чем девочек?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Из пункта а: мальчиков **ровно 2**, а девочек хотя бы 2.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Мы выяснили, что мальчиков всегда ровно два, а девочек хотя бы две. Значит, мальчиков не может быть больше. Ответ: нет."}],"rich":true},{"l":"в","q":"Пусть девочек вдвое больше, чем мальчиков. Может ли у всех детей суммарно быть 328 конфет?","ak":"yn","av":"ДА","steps":[{"w":["📌 Мальчиков 2, девочек 4: М, М, Д₁, Д₂, Д₃, Д₄.","🔨 **Пример:** мальчики по 112, девочки 4, 40, 28, 32 (всего 328)","=после: мальчики 92 и 112, все девочки по 31 ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Мальчиков два, значит, девочек четыре. Подберём числа: у мальчиков по сто двенадцать, у девочек четыре, сорок, двадцать восемь и тридцать два — всего триста двадцать восемь. После передачи у всех девочек становится по тридцать одной конфете, а у мальчиков разное. Ответ: да."}],"rich":true}],"tags":["est"],"facts":["extreme","est_ex"],"note":"","n":141},{"id":"24437","d":4,"from":"Школково","stem":"Десять мальчиков и семь девочек пошли в лес за грибами. Известно, что любые две девочки набрали больше грибов, чем любые три мальчика, но любые пять мальчиков набрали больше грибов, чем любые три девочки.","parts":[{"l":"а","q":"Может ли так случиться, что какая-то девочка набрала меньше грибов, чем какой-нибудь мальчик?","ak":"yn","av":"НЕТ","steps":[{"w":["✏️ Пусть какая-то девочка g₁ набрала меньше мальчика b₁₀.","📌 g₁ + g₂ > b₈ + b₉ + b₁₀ → g₂ > b₈ + b₉ → у трёх старших девочек больше 2b₅ каждая."],"f":["extreme"]},{"w":["=g₅ + g₆ + g₇ > 6b₅ ≥ b₁ + … + b₅","❌ Противоречит условию про пять мальчиков.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Предположим, что какая-то девочка набрала меньше какого-то мальчика. Упорядочим всех по количеству грибов. Две девочки вместе набрали больше трёх самых сильных мальчиков, а первая девочка слабее самого сильного мальчика. Значит, вторая девочка набрала больше двух других сильных мальчиков."},{"b":0,"f":"extreme"},{"b":1,"s":"Тогда три самые сильные девочки набрали очень много — больше шести раз пятого мальчика, а это больше, чем пять слабых мальчиков вместе. Но по условию любые пять мальчиков набрали больше любых трёх девочек. Противоречие. Ответ: нет."}],"rich":true},{"l":"б","q":"Может ли так случиться, что количество найденных грибов у всех детей будет различным?","ak":"yn","av":"ДА","steps":[{"w":["🔨 **Пример:** мальчики 100, 101, …, 109;  девочки 162, …, 168","=162 + 163 = 325 > 107 + 108 + 109 = 324","=100 + … + 104 = 510 > 166 + 167 + 168 = 501","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Подберём пример: у мальчиков от ста до ста девяти, у девочек от ста шестидесяти двух до ста шестидесяти восьми. Проверяем самые трудные случаи: две самые слабые девочки против трёх самых сильных мальчиков и пять самых слабых мальчиков против трёх самых сильных девочек. Оба неравенства выполняются. Ответ: да."}],"rich":true},{"l":"в","q":"Найдите минимальное возможное количество грибов, собранное всеми детьми суммарно.","ak":"num","av":"106","steps":[{"w":["📏 Из условий: три старших мальчика вместе **≥ 15**, каждая девочка ≥ 8.","=девочки ≥ 7·8 = 56"],"f":[]},{"w":["=мальчики: b₁ + … + b₅ ≥ 25,   b₆, b₇ ≥ 5,   b₈ + b₉ + b₁₀ ≥ 15   →   ≥ 50","=всего ≥ 106"],"f":[]},{"w":["🔨 **Пример:** все мальчики по 5, все девочки по 8: 50 + 56 = 106 ✔️","✅ **Ответ: 106.**"],"f":[]}],"v":[{"b":0,"s":"Ищем наименьшую сумму. Связывая два условия, получаем, что три самых сильных мальчика вместе набрали хотя бы пятнадцать грибов, а каждая девочка — хотя бы восемь. Девочек семь, значит, у них хотя бы пятьдесят шесть грибов."},{"b":1,"s":"Для мальчиков: пять слабых вместе больше трёх девочек, то есть хотя бы двадцать пять; остальные тоже не слишком малы. Всего у мальчиков хотя бы пятьдесят, а у всех детей хотя бы сто шесть."},{"b":2,"s":"Пример: каждый мальчик набрал пять грибов, каждая девочка — восемь. Две девочки — шестнадцать, больше пятнадцати; пять мальчиков — двадцать пять, больше двадцати четырёх. Ответ: сто шесть."}],"rich":true}],"tags":["est"],"facts":["extreme","est_ex"],"note":"","n":142},{"id":"46753","d":4,"from":"Школково","stem":"Из k кг материала фабрика изготавливает n одинаковых деталей массой m кг каждая, причем k = nm + q, где q кг — остатки материала, и q \u003c m. После внедрения новых технологий на фабрике начали выпускать детали нового типа, каждая из которых стала на 0,2 кг легче детали старого типа, причём из 63 кг материала деталей нового типа стали делать на две больше, чем делали деталей старого типа из 64 кг материала.","parts":[{"l":"а","q":"Может ли новая деталь весить столько, что на изготовление 15 новых деталей будет достаточно 63 кг материала, а на 16 — уже нет?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Число деталей — целая часть: n = [k : m]. Новая деталь m′ = m − 0,2:","=[63 : m′] = [64 : m] + 2","🔎 [63 : m′] = 15 → m′ от 3,94 до 4,2 → m от 4,14 до 4,4 → [64 : m] = 14 или 15","❌ А нужно 13.","✅ **Ответ: нет.**"],"f":["floor"]}],"v":[{"b":0,"s":"Число деталей — это сколько раз масса детали целиком помещается в массу материала, то есть целая часть частного. Условие: новых деталей из шестидесяти трёх килограммов на две больше, чем старых из шестидесяти четырёх."},{"b":0,"f":"floor"},{"b":0,"s":"Если новых пятнадцать, то новая деталь весит примерно от трёх целых девяноста четырёх сотых до четырёх целых двух десятых килограмма. Тогда старая — на две десятых больше, и старых деталей получается четырнадцать или пятнадцать, а не тринадцать. Ответ: нет."}],"rich":true},{"l":"б","q":"Может ли новая деталь весить столько, что на изготовление 40 новых деталей будет достаточно 63 кг материала, а на 41 — уже нет?","ak":"yn","av":"НЕТ","steps":[{"w":["🔎 [63 : m′] = 40 → m′ от 1,537 до 1,575 → m от 1,737 до 1,775 → [64 : m] = 36","❌ А нужно 38.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Рассуждаем так же. Если новых деталей сорок, то масса новой детали в узком диапазоне, а старой — на две десятых больше. Тогда старых деталей тридцать шесть, а нужно тридцать восемь. Ответ: нет."}],"rich":true},{"l":"в","q":"Найдите такое минимальное число n, что фабрика может выпускать n новых деталей из 80 кг материала, а n − 1 деталь не сможет, не нарушая условия q \u003cm.","ak":"num","av":"27","steps":[{"w":["🔎 Перебираем возможные массы новой детали, при которых выполняется условие задачи.","📌 При m′ от 2,857 до 2,8636: [63 : m′] = 22, [64 : m] = 20 ✔️ и [80 : m′] = **27**.","📏 Меньше 27 не бывает: для этого нужна m′ > 80 : 27, а там условие нарушается."],"f":[]},{"w":["✅ **Ответ: 27.**"],"f":[]}],"v":[{"b":0,"s":"Нужно найти, сколько новых деталей можно сделать из восьмидесяти килограммов. Чем тяжелее деталь, тем их меньше. Поэтому ищем самую тяжёлую новую деталь, для которой ещё выполняется условие про шестьдесят три и шестьдесят четыре килограмма."},{"b":0,"s":"Перебор показывает: подходит масса около двух целых восьмидесяти шести сотых килограмма. Тогда из восьмидесяти килограммов получается двадцать семь деталей. Если деталь сделать тяжелее, чтобы деталей было двадцать шесть, условие задачи нарушается."},{"b":1,"s":"Ответ: двадцать семь."}],"rich":true}],"tags":["eq"],"facts":["lin_dioph","est_ex"],"note":"","n":143},{"id":"65025","d":4,"from":"Школково","stem":"Мужчина покупает капусту на ферме. Сосед попросил мужчину купить ему столько же капусты, сколько себе. На ферме продают кочаны капусты, которые весят 2, 4 или 6 кг. Мужчина купил N кг капусты.","parts":[{"l":"а","q":"Существует ли такой набор кочанов, в котором капусту нельзя поделить поровну, не разрезая ее, если N = 20?","ak":"yn","av":"ДА","steps":[{"w":["🔨 **N = 20:** кочаны 6, 6, 6, 2","📌 Половина — 10. Возможные суммы части: 2, 6, 8, 12, 14, 18","❌ 10 нет.","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Подберём неудобный набор на двадцать килограммов: три кочана по шесть и один по два. Чтобы поделить поровну, нужно набрать десять. Но из этих кочанов получаются суммы два, шесть, восемь, двенадцать и так далее — десяти нет. Ответ: да."}],"rich":true},{"l":"б","q":"Существует ли такой набор кочанов, в котором капусту нельзя поделить поровну, не разрезая ее, если N = 48?","ak":"yn","av":"НЕТ","steps":[{"w":["💡 Считаем в «единицах» по 2 кг: кочаны 1, 2, 3, всего 24, нужно **12**.","🔨 **Как делить:** берём тройки, пока сумма ≤ 12, потом добираем двойками и единицами.","📌 Нечётный остаток всегда закрывается единицей (единиц и троек — одной чётности).","✅ **Ответ: нет.**"],"f":["parity"]}],"v":[{"b":0,"s":"Удобно считать в единицах по два килограмма: кочаны весят один, два или три, всего двадцать четыре, а каждому нужно двенадцать."},{"b":0,"s":"Будем набирать половину жадно: сначала берём тройки, пока сумма не больше двенадцати, потом добираем двойками и единицами. Можно проверить, что единиц всегда хватает, чтобы закрыть нечётный остаток, — ведь общая сумма двадцать четыре чётная."},{"b":0,"f":"parity"},{"b":0,"s":"Значит, при сорока восьми килограммах капусту всегда можно поделить. Ответ: нет."}],"rich":true},{"l":"в","q":"Найдите все четные значения N, при которых всегда можно разделить капусту поровну, не разрезая ее.","ak":"self","av":"N кратно 24.","steps":[{"w":["💡 В единицах по 2 кг: всего T = N : 2, кочаны 1, 2, 3.","❌ T/2 нечётное: все кочаны по 4 кг — поровну не поделить."],"f":[]},{"w":["❌ T = 12j + 4: (4j + 1) троек и одна единица — половину не набрать.","❌ T = 12j + 8: (4j + 2) троек и одна двойка — половину не набрать."],"f":["mod_def"]},{"w":["✔️ T = 12j (N = 24j): способ из пункта б работает всегда.","✅ **Ответ:** N кратно 24."],"f":[]}],"v":[{"b":0,"s":"Снова считаем в единицах по два килограмма. Для каждого чётного эн, не кратного двадцати четырём, построим плохой набор."},{"b":0,"s":"Если половина нечётная, а все кочаны по две единицы, половину набрать нельзя."},{"b":1,"s":"В остальных случаях берём почти все кочаны тройками и один маленький кочан. Тогда половина даёт неудачный остаток при делении на три, и её не набрать."},{"b":1,"f":"mod_def"},{"b":2,"s":"А если эн кратно двадцати четырём, работает способ из пункта бэ. Ответ: эн кратно двадцати четырём."}],"rich":true}],"tags":["est","div"],"facts":["mod_def","parity","est_ex"],"note":"","n":144},{"id":"114803","d":4,"from":"Школково","stem":"Есть 60 карточек, на каждой из которых написано натуральное число больше 1. Все числа различные. На обратной стороне каждой карточки ставят цветовую отметку: если число делится на 3 — красную, если на 4 — синюю, если на 5 — зелёную. Получилось так, что на каждой карточке ровно две цветовые отметки.","parts":[{"l":"а","q":"Какое наибольшее количество карточек может быть с числами меньше 200?","ak":"num","av":"29","steps":[{"w":["📌 Ровно две отметки:","👉 кратно 12, но не 5","👉 кратно 20, но не 3","👉 кратно 15, но не 4"],"f":["div_comp"]},{"w":["🔎 Меньше 200 таких чисел: 13 + 6 + 10 = **29**","✅ **Ответ: 29.**"],"f":[]}],"v":[{"b":0,"s":"Ровно две отметки бывают в трёх случаях: число делится на три и на четыре, но не на пять; на четыре и на пять, но не на три; на три и на пять, но не на четыре."},{"b":0,"f":"div_comp"},{"b":1,"s":"Посчитаем, сколько таких чисел меньше двухсот, для каждого типа. Получается тринадцать, шесть и десять — всего двадцать девять. Больше карточек с такими числами не бывает. Ответ: двадцать девять."}],"rich":true},{"l":"б","q":"Получилось, что на 20 карточках есть синяя и зелёная отметки, на 20 карточках есть синяя и красная отметки, на 20 карточках есть красная и зелёная отметки. Найдите наименьшее возможное значение наибольшего числа среди чисел, указанных на карточках.","ak":"num","av":"580","steps":[{"w":["📌 20 чисел, кратных 20, но не 3: 20k, k = 1, 2, 4, 5, …, 29","=наибольшее 20·29 = 580"],"f":[]},{"w":["📌 Остальные типы помещаются раньше (12·24 = 288, 15·26 = 390).","✅ **Ответ: 580.**"],"f":[]}],"v":[{"b":0,"s":"Самый «дорогой» тип — числа, кратные двадцати, но не трём. Чтобы набрать двадцать таких чисел, нужно взять двадцать ка для ка, не кратных трём. Двадцатое такое ка — двадцать девять, значит, наибольшее число пятьсот восемьдесят."},{"b":1,"s":"Два других типа помещаются в меньшие числа. Значит, наибольшее число не может быть меньше пятисот восьмидесяти. Ответ: пятьсот восемьдесят."}],"rich":true},{"l":"в","q":"Получилось, что на 45 карточках синяя отметка. Найдите наименьшее возможное значение наибольшего числа среди указанных на карточках.","ak":"num","av":"444","steps":[{"w":["📌 «Синие» — это числа 12k (k не кратно 5) и 20k (k не кратно 3).","🔎 Считаем, сколько их не больше M: при M = 443 — 44, при M = 444 — **45**."],"f":[]},{"w":["📌 15 «красно-зелёных» укладываются до 285.","✅ **Ответ: 444.**"],"f":[]}],"v":[{"b":0,"s":"Синюю отметку имеют числа двух типов: кратные двенадцати, но не пяти, и кратные двадцати, но не трём. Будем считать, сколько таких чисел до данного эм. До четырёхсот сорока трёх их сорок четыре, а до четырёхсот сорока четырёх — ровно сорок пять."},{"b":1,"s":"Остальные пятнадцать карточек — с красной и зелёной отметкой — укладываются в числа до двухсот восьмидесяти пяти. Ответ: четыреста сорок четыре."}],"rich":true}],"tags":["div"],"facts":["div_comp","div_count","est_ex"],"note":"","n":145},{"id":"114804","d":4,"from":"Школково","stem":"Есть 60 карточек, на каждой — натуральное число больше 1, все числа различны. Отметки: делится на 3 — красная, на 4 — синяя, на 5 — зелёная. На каждой карточке не менее двух отметок.","parts":[{"l":"в","q":"Карточек ровно с двумя отметками, одна из которых синяя, оказалось 37. Найдите наименьшее возможное значение наибольшего числа на карточках.","ak":"num","av":"372","steps":[{"w":["📌 Две отметки, одна из них синяя: числа **12k** (k не кратно 5) и **20k** (k не кратно 3).","🔎 Считаем такие числа до M: до 372 — 25 + 12 = **37**, до 371 — меньше."],"f":["div_count"]},{"w":["📌 Остальные 23 карточки — 15k (k не кратно 4) или кратные 60: до 372 их 24 ≥ 23 ✔️","✅ **Ответ: 372.**"],"f":[]}],"v":[{"b":0,"s":"Карточки ровно с двумя отметками, одна из которых синяя, — это числа, кратные двенадцати, но не пяти, и кратные двадцати, но не трём. Нужно тридцать семь таких чисел. Считаем, сколько их до данного числа: до трёхсот семидесяти двух — ровно тридцать семь, а до трёхсот семидесяти одного меньше."},{"b":0,"f":"div_count"},{"b":1,"s":"Остальные двадцать три карточки — числа с красной и зелёной отметкой или со всеми тремя. До трёхсот семидесяти двух их достаточно. Значит, наибольшее число не меньше трёхсот семидесяти двух, и этого хватает. Ответ: триста семьдесят два."}],"rich":true}],"tags":["div"],"facts":["div_comp","div_count","est_ex"],"note":"","n":146},{"id":"114836","d":4,"from":"Школково","stem":"Из k кг материала фабрика делает n одинаковых деталей массой m кг, k = nm + q, q \u003c m (q — остаток). Новые детали на 0,1 кг легче, и из 18 кг новых деталей делают на две больше, чем старых из 21 кг.","parts":[{"l":"в","q":"Найдите все такие n, что фабрика может выпускать n новых деталей из 10 кг материала, не нарушая условия q \u003c m.","ak":"set","av":"20;21;22;23;24","steps":[{"w":["📌 Число деталей — целая часть: условие","=[18 : m′] = [21 : m] + 2,   m′ = m − 0,1","💡 Ищем, какие значения принимает n = [10 : m′]."],"f":["floor"]},{"w":["🔎 Например, n = 24: m от 0,509 до 0,512 → [21 : m] = 41, [18 : m′] = 43 ✔️","❌ n = 25 и n = 19 противоречат условию.","✅ **Ответ:** 20, 21, 22, 23, 24."],"f":[]}],"v":[{"b":0,"s":"Это та же идея, что в задаче про детали на две десятых легче. Количество деталей — целая часть деления массы материала на массу детали. Условие задачи связывает целые части для восемнадцати и двадцати одного килограмма."},{"b":0,"f":"floor"},{"b":1,"s":"Перебираем возможные значения эн. Например, при двадцати четырёх деталях из десяти килограммов масса детали лежит в узком промежутке, и условие выполняется. Проверка показывает, что подходят эн от двадцати до двадцати четырёх, а двадцать пять и девятнадцать уже нет."}],"rich":true}],"tags":["eq"],"facts":["lin_dioph","est_ex"],"note":"","n":147},{"id":"159983","d":4,"from":"Школково","stem":"Для набора из 60 различных целых чисел выполнено, что сумма любых двух чисел из этого набора больше суммы любых шести чисел из этого набора.","parts":[{"l":"а","q":"Может ли одним из этих чисел быть число –400?","ak":"yn","av":"ДА","steps":[{"w":["💡 Самое трудное — **две наименьших** против **шести наибольших**.","🔨 **Пример:** −400, −399, …, −341","=−400 − 399 = −799 > −341 − 342 − … − 346 = −2061 ✔️","✅ **Ответ: да.**"],"f":["extreme"]}],"v":[{"b":0,"s":"Условие самое строгое, когда берём два самых маленьких числа и шесть самых больших. Если тут всё выполняется, то и в остальных случаях тоже."},{"b":0,"f":"extreme"},{"b":0,"s":"Возьмём шестьдесят отрицательных чисел подряд, начиная с минус четырёхсот. Сумма двух самых маленьких минус семьсот девяносто девять, а шесть самых больших дают минус две тысячи шестьдесят один — меньше. Ответ: да."}],"rich":true},{"l":"б","q":"Может ли одним из этих чисел быть число 400?","ak":"yn","av":"ДА","steps":[{"w":["🔨 **Пример:**","👉 a₁ = −1000, a₂ = −999 и ещё 53 числа от −998 вверх","👉 a₅₅…a₅₉ = −482, −481, −480, −479, −478,   a₆₀ = 400","=шесть наибольших: 400 − 2400 = −2000 \u003c −1999 = a₁ + a₂ ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Чтобы число четыреста не мешало, остальные пять самых больших чисел должны быть сильно отрицательными. Тогда сумма шести наибольших всё равно меньше суммы двух наименьших. Пример выписан в решении. Ответ: да."}],"rich":true},{"l":"в","q":"Какое наибольшее значение может принимать сумма чисел этого набора?","ak":"num","av":"-3329","steps":[{"w":["✏️ Пусть x = a₅₅. Тогда:","=шесть наибольших ≥ 6x + 15,     a₁ + a₂ ≤ 2x − 107","📌 Условие → **x ≤ −31**."],"f":[]},{"w":["📏 Сумма всех ≤ 56x − 1593 ≤ −3329."],"f":[]},{"w":["🔨 **Пример:** −85, −84, …, −27, −25","=две наименьшие: −169 > −170 — шесть наибольших ✔️,   сумма −3329","✅ **Ответ: −3329.**"],"f":[]}],"v":[{"b":0,"s":"Обозначим через икс пятьдесят пятое по величине число. Шесть наибольших чисел больше икса и разные, поэтому их сумма не меньше шести икс плюс пятнадцать. А два наименьших далеко внизу, их сумма не больше двух икс минус сто семь. Сравнивая, получаем, что икс не больше минус тридцати одного."},{"b":1,"s":"Теперь оцениваем сумму всех чисел через икс — она не больше минус трёх тысяч трёхсот двадцати девяти."},{"b":2,"s":"Пример строим так, чтобы все неравенства стали почти равенствами: числа от минус восьмидесяти пяти до минус двадцати семи и ещё минус двадцать пять. Ответ: минус три тысячи триста двадцать девять."}],"rich":true}],"tags":["est"],"facts":["extreme","distinct_min","est_ex"],"note":"","n":148},{"id":"160539","d":4,"from":"Школково","stem":"На координатной прямой отмечены целые числа. Митя играет в следующую игру: фишка стоит на отметке 0; Митя бросает игральный кубик и сдвигает фишку на выпавшее число очков вправо (положительное направление прямой), если выпадает чётное число очков, и влево (отрицательное направление прямой), если выпадает нечётное число очков. Через некоторое время Митя закончил игру.","parts":[{"l":"а","q":"Может ли фишка оказаться на отметке «–50», если Митя 30 раз бросил кубик?","ak":"yn","av":"ДА","steps":[{"w":["🔨 **30 бросков:**","=14 раз по 5 (−70),   12 раз по 2 (+24),   4 раза по 1 (−4)","=−70 + 24 − 4 = −50 ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Подберём броски. Пятёрки сильно сдвигают влево, двойки немного вправо, единицы чуть-чуть влево. Четырнадцать пятёрок, двенадцать двоек и четыре единицы — это тридцать бросков, и фишка оказывается на минус пятидесяти. Ответ: да."}],"rich":true},{"l":"б","q":"Известно, что чётное число очков выпадало столько же раз, сколько и нечётное число очков. Какое наименьшее число бросков кубика понадобится, чтобы фишка оказалась на отметке «–50»?","ak":"num","av":"36","steps":[{"w":["✏️ **k** чётных и **k** нечётных бросков:","=(сумма нечётных) − (сумма чётных) = 50","📌 Сумма нечётных ≤ 5k, чётных ≥ 2k → 3k ≥ 50 → **k ≥ 17**."],"f":[]},{"w":["📌 Сумма k нечётных имеет ту же чётность, что k, а она равна «чётное + 50» → **k чётное** → k ≥ 18.","🔨 **Пример:** 18 двоек; 16 пятёрок и 2 тройки:  86 − 36 = 50","✅ **Ответ: 36.**"],"f":["parity"]}],"v":[{"b":0,"s":"Пусть чётных и нечётных бросков по ка. Нечётные двигают влево, чётные вправо, и разница должна быть пятьдесят. Сумма нечётных не больше пяти ка, сумма чётных не меньше двух ка, поэтому три ка не меньше пятидесяти, и ка хотя бы семнадцать."},{"b":1,"s":"Теперь чётность. Сумма ка нечётных чисел той же чётности, что ка. А она равна сумме чётных плюс пятьдесят — чётному числу. Значит, ка чётное, хотя бы восемнадцать."},{"b":1,"f":"parity"},{"b":1,"s":"Пример: восемнадцать двоек, шестнадцать пятёрок и две тройки — всего тридцать шесть бросков. Ответ: тридцать шесть."}],"rich":true},{"l":"в","q":"Известно, что чётное число очков выпадало столько же раз, сколько и нечётное число очков. Какое наименьшее число бросков кубика понадобится, чтобы фишка оказалась на отметке «–57», если также известно, что при бросании кубика каждая грань выпадала хотя бы один раз, но любые две грани не выпадали одинаковое количество раз?","ak":"num","av":"58","steps":[{"w":["✏️ n₁, …, n₆ — сколько раз выпала каждая грань. Условие:","=3k = 57 + 4(n₁ + n₆) + 2(n₃ + n₄)","📌 k нечётное (как в пункте б), все n различны и ≥ 1 → добавка ≥ 30 → **k ≥ 29**."],"f":[]},{"w":["🔨 **Пример:** n₁ = 1, n₂ = 21, n₃ = 2, n₄ = 5, n₅ = 26, n₆ = 3","=137 − 80 = 57,   бросков 58","✅ **Ответ: 58.**"],"f":[]}],"v":[{"b":0,"s":"Теперь важно, сколько раз выпала каждая грань. Обозначим эти количества и выразим условие: получается, что три ка равно пятидесяти семи плюс добавка, зависящая от количеств граней. Все количества разные и хотя бы один, поэтому добавка не может быть маленькой."},{"b":0,"s":"С учётом чётности, как в пункте бэ, добавка хотя бы тридцать, и ка хотя бы двадцать девять — то есть бросков хотя бы пятьдесят восемь."},{"b":1,"s":"Пример подобран в решении: все грани выпадали разное число раз, и фишка приходит на минус пятьдесят семь за пятьдесят восемь бросков. Ответ: пятьдесят восемь."}],"rich":true}],"tags":["eq","est"],"facts":["lin_dioph","parity","est_ex"],"note":"","n":149},{"id":"169030","d":4,"from":"Школково","stem":"Коля записал на доске 20 различных натуральных чисел, каждое из которых меньше 1000. Петя записал на доске квадраты всех чисел, которые записал Коля. Получилось так, что среднее арифметическое любых трёх чисел, которые записал Петя, — целое число. Одно из чисел, записанных на доске, равно 625.","parts":[{"l":"а","q":"Может ли на доске быть записано число 10816?","ak":"yn","av":"ДА","steps":[{"w":["📌 Среднее любых трёх квадратов целое → все квадраты дают **одинаковый остаток** при делении на 3.","👉 625 = 25², 25 не кратно 3 → все числа Коли **не кратны 3**.","=10816 = 104²,   104 не кратно 3 ✔️","✅ **Ответ: да.**"],"f":["mod_shift"]}],"v":[{"b":0,"s":"Если среднее любых трёх чисел Пети целое, то, как в задачах про метод сдвига, все его числа дают одинаковый остаток при делении на три."},{"b":0,"f":"mod_shift"},{"b":0,"s":"Квадрат даёт остаток ноль, если число кратно трём, и один — если нет. Двадцать пять не кратно трём, значит, все числа Коли не кратны трём."},{"b":0,"s":"Десять тысяч восемьсот шестнадцать — это сто четыре в квадрате, а сто четыре на три не делится. Коля мог написать сто четыре. Ответ: да."}],"rich":true},{"l":"б","q":"Может ли на доске быть записано число 93636?","ak":"yn","av":"НЕТ","steps":[{"w":["=93636 = 306²,   306 кратно 3 ❌","📌 Коля сам написать его не мог — оно больше 1000.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Девяносто три тысячи шестьсот тридцать шесть — квадрат трёхсот шести, а триста шесть делится на три. Петя такое написать не мог. А Коля пишет числа меньше тысячи. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое наибольшее количество пар одинаковых чисел может быть написано на доске?","ak":"num","av":"12","steps":[{"w":["📌 Пара равных чисел: у Коли есть x = y², где y тоже у Коли (y ≤ 31, не кратно 3).","🔎 Цепочки:","👉 1 = 1² — одно число даёт пару","👉 2 → 4 → 16 → 256 — 4 числа, 3 пары","👉 5 → 25 → 625 — 3 числа, 2 пары","👉 остальные: y и y² — 2 числа на пару"],"f":[]},{"w":["=1 + 4 + 3 + 12 = 20 чисел:   1 + 3 + 2 + 6 = 12 пар","✅ **Ответ: 12.**"],"f":["est_ex"]}],"v":[{"b":0,"s":"Одинаковые числа на доске появляются, когда Коля написал и число, и его квадрат — тогда квадрат есть и у Коли, и у Пети. Выгоднее всего использовать цепочки, где квадрат снова можно возвести в квадрат."},{"b":0,"s":"Единица даёт пару сама с собой. Цепочка два, четыре, шестнадцать, двести пятьдесят шесть — четыре числа и три пары. Цепочка пять, двадцать пять, шестьсот двадцать пять — три числа и две пары. Остальные пары требуют двух чисел каждая."},{"b":1,"s":"Распределяем двадцать чисел самым выгодным образом и получаем двенадцать пар. Ответ: двенадцать."},{"b":1,"f":"est_ex"}],"rich":true}],"tags":["div"],"facts":["mod_shift","mod_sq","est_ex"],"note":"","n":150},{"id":"159856","d":5,"from":"PDF №030","stem":"Тройку различных натуральных чисел назовём удачной, если любое число в ней хотя бы на 5 больше, чем треть суммы двух других чисел. Например, 40, 45, 50 — удачная тройка.","parts":[{"l":"а","q":"Сколько существует удачных троек, содержащих числа 50, 60 и ещё одно число, большее 60?","ak":"num","av":"15","steps":[{"w":["📌 Удачная: для каждого числа **3x ≥ (сумма двух других) + 15**.","👉 для 50:  150 ≥ 60 + x + 15  →  x ≤ 75","👉 для 60:  x ≤ 115;   для x:  3x ≥ 125","=x = 61, 62, …, 75   →   15 троек","✅ **Ответ: 15.**"],"f":[]}],"v":[{"b":0,"s":"Переведём условие: число хотя бы на пять больше трети суммы двух других — то же самое, что утроенное число хотя бы на пятнадцать больше этой суммы."},{"b":0,"s":"Запишем это для пятидесяти, шестидесяти и третьего числа икс. Самое строгое ограничение даёт пятьдесят: икс не больше семидесяти пяти. Значит, икс от шестидесяти одного до семидесяти пяти — пятнадцать вариантов. Ответ: пятнадцать."}],"rich":true},{"l":"б","q":"Найдётся ли удачная тройка, одно из чисел которой равно 15?","ak":"yn","av":"НЕТ","steps":[{"w":["✏️ Тройка 15, y, z:","=для 15:  y + z ≤ 30","=для y и z:  3y ≥ z + 30,   3z ≥ y + 30   →   y + z ≥ 30"],"f":[]},{"w":["👉 Значит, y + z = 30 и y = z = 15 — числа **не различны** ❌","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Пусть в тройке есть пятнадцать и ещё игрек и зет. Условие для пятнадцати даёт: игрек плюс зет не больше тридцати. Условия для игрек и зет, если их сложить, дают: игрек плюс зет не меньше тридцати."},{"b":1,"s":"Значит, ровно тридцать, и тогда игрек и зет оба равны пятнадцати. Но числа должны быть разными. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое наибольшее количество чисел от 1 до 100 включительно можно расставить по кругу так, чтобы каждое число встречалось не более одного раза и любые три подряд идущих числа образовывали удачную тройку?","ak":"num","av":"80","steps":[{"w":["✏️ Пусть **m** — наименьшее число, рядом с ним a′, a, m, b, b′.","📌 Из удачности троек: a + a′ ≤ 3m − 15,   b + b′ ≤ 3m − 15.","📏 Четыре числа больше m → одна пара ≥ 2m + 5 → **m ≥ 20**."],"f":["extreme"]},{"w":["📏 m = 20 тоже не получается (соседи — ровно 21…24, разбор даёт противоречие) → **m ≥ 21** → чисел ≤ 80."],"f":[]},{"w":["🔨 **Пример:** 21, 23, 25, …, 99, 100, 98, …, 24, 22 по кругу","✅ **Ответ: 80.**"],"f":[]}],"v":[{"b":0,"s":"Посмотрим на самое маленькое число на круге, эм. Рядом с ним с каждой стороны по два числа, и все тройки с эм должны быть удачными. Для эм это значит, что пары его соседей в сумме не больше трёх эм минус пятнадцать."},{"b":0,"f":"extreme"},{"b":0,"s":"А четыре соседних числа больше эм и разные, поэтому одна из пар в сумме хотя бы два эм плюс пять. Отсюда эм не меньше двадцати."},{"b":1,"s":"Случай эм равное двадцати разбирается отдельно: соседями должны быть ровно двадцать один, двадцать два, двадцать три и двадцать четыре, и тогда какая-то тройка оказывается неудачной. Значит, наименьшее число хотя бы двадцать один, а чисел не больше восьмидесяти."},{"b":2,"s":"Пример: идём по нечётным от двадцати одного до девяноста девяти, потом по чётным обратно от ста до двадцати двух. Ответ: восемьдесят."}],"rich":true}],"tags":["est"],"facts":["extreme","est_ex"],"note":"","n":151},{"id":"30822","d":5,"from":"Школково","stem":"На доске написано N различных натуральных чисел, каждое из которых не превосходит 99. Для любых двух написанных на доске чисел a и b таких, что a\u003c b, ни одно из написанных чисел не делится на b − a и ни одно из написанных чисел не является делителем числа b− a.","parts":[{"l":"а","q":"Могут ли быть написаны на доске какие-то два из чисел 18, 19 и 20?","ak":"yn","av":"НЕТ","steps":[{"w":["👉 18 и 19, 19 и 20 — разность 1, на неё делится любое число ❌","👉 18 и 20 — разность 2, а 18 делится на 2 ❌","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Проверим все пары. У соседних чисел разность один, а на единицу делится любое число. У восемнадцати и двадцати разность два, а восемнадцать на два делится. Ответ: нет."}],"rich":true},{"l":"б","q":"Среди написанных на доске чисел есть 17. Может ли N быть равным 25?","ak":"yn","av":"НЕТ","steps":[{"w":["💡 Если x на доске, то все числа дают **разные остатки** при делении на x — иначе x делит разность.","=N ≤ x   →   N ≤ 17 \u003c 25","✅ **Ответ: нет.**"],"f":["mod_def"]}],"v":[{"b":0,"s":"Ключевое наблюдение. Если два числа дают одинаковый остаток при делении на семнадцать, то их разность делится на семнадцать — запрещено. Значит, все числа дают разные остатки при делении на семнадцать, и чисел не больше семнадцати. Ответ: нет."},{"b":0,"f":"mod_def"}],"rich":true},{"l":"в","q":"Найдите наибольшее возможное значение N.","ak":"num","av":"33","steps":[{"w":["✏️ **m** — наименьшее число. Остатки по mod m разные → **N ≤ m**.","📌 Соседних чисел нет (разность 1) → в [m; 99] не больше (101 − m) : 2 чисел.","=N ≤ min(m, (101 − m) : 2) ≤ 33"],"f":["extreme"]},{"w":["🔨 **Пример:** нечётные 35, 37, …, 99 (33 числа).","👉 Разности чётные и ≤ 64: нечётное число на чётное не делится, а делители разности ≤ 32 \u003c 35 ✔️","✅ **Ответ: 33.**"],"f":[]}],"v":[{"b":0,"s":"Возьмём наименьшее число эм. Как в пункте бэ, все числа дают разные остатки при делении на эм, поэтому чисел не больше эм. С другой стороны, соседних чисел быть не может, значит, от эм до девяноста девяти помещается не больше половины чисел."},{"b":0,"f":"extreme"},{"b":0,"s":"Одна оценка растёт с эм, другая убывает, и лучше тридцати трёх ничего не получается."},{"b":1,"s":"Пример: все нечётные числа от тридцати пяти до девяноста девяти. Разности чётные, а нечётные числа на чётные не делятся. И делители разностей слишком маленькие, чтобы быть на доске. Ответ: тридцать три."}],"rich":true}],"tags":["div","est"],"facts":["mod_def","extreme","est_ex"],"note":"","n":152},{"id":"114807","d":5,"from":"Школково","stem":"Каждый год в соревнованиях, состоящих из 10 этапов, участвует 10 спортсменов. По итогам каждого этапа один спортсмен занимает первое место, один спортсмен второе и один — третье. В результате ежегодных соревнований каждый спортсмен занимает a первых, b вторых и c третьих мест. В зависимости от мест, занятых спортсменом на всех этапах (одного года), ему присваивается итоговый рейтинг соревнований. В этом году по итогам 10 этапов каждому спортсмену присваивается 10a+ 4b+ c очков; чем у спортсмена очков больше, тем рейтинг выше. Если количество очков у спортсменов совпадает, то рейтинги у них одинаковые. В прошлом году в таких же соревнованиях участвовали те же спортсмены. Но для подведения итогов соревнований рейтинги спортсменов определялись следующим образом. Если у спортсмена-1 количество первых, вторых и третьих мест соответственно равно a1,b1 и c1, а у спортсмена-2 — a2,b2 и c2, то рейтинг спортсмена-1 был выше рейтинга спортсмена-2 в следующих случаях: a1 > a2, a1 = a2 и b1 > b2, a1 = a2,b1 = b2 и c1 > c2. Если количество и первых, и вторых, и третьих мест у спортсменов совпадало, то рейтинги у них были одинаковые.","parts":[{"l":"а","q":"В этом году по итогам соревнований у спортсменов нет совпадающих рейтингов. Если бы рейтинги определялись, как в прошлом году, то у спортсменов тоже не было бы совпадающих рейтингов. Может ли порядок рейтингов спортсменов в этом году совпадать с порядком рейтингов прошлого года?","ak":"yn","av":"ДА","steps":[{"w":["🔨 **Пример:** (a, b, c) и очки:","=(4,0,0) = 40,   (3,1,0) = 34,   (2,2,0) = 28,   (1,3,0) = 22,   (0,4,0) = 16","=(0,0,4) = 4,   (0,0,3) = 3,   (0,0,2) = 2,   (0,0,1) = 1,   (0,0,0) = 0","👉 Порядок по очкам и по правилам прошлого года **совпадает** ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Подберём результаты так, чтобы оба способа давали одинаковый порядок. Пусть у пяти спортсменов все первые и вторые места распределены так, что первых мест становится всё меньше, а вторых больше. Остальные пятеро делят третьи места."},{"b":0,"s":"Очки получаются сорок, тридцать четыре, двадцать восемь и так далее — порядок такой же, как по количеству первых, затем вторых, затем третьих мест. Ответ: да."}],"rich":true},{"l":"б","q":"По итогам соревнований этого года получилось, что у любых двух спортсменов нет одинаковых рейтингов. Какая наибольшая разница в очках может быть между двумя наименьшими рейтингами?","ak":"num","av":"12","steps":[{"w":["📌 Всего очков: 10·10 + 4·10 + 10 = 150.","📏 Девять верхних различны и не меньше p₉:","=9p₉ + 36 ≤ 150   →   p₉ ≤ 12,   p₁₀ ≥ 0"],"f":["est_ex"]},{"w":["🔨 **Пример:** 25, 20, 18, 17, 16, 15, 14, 13, 12, 0","✅ **Ответ: 12.**"],"f":[]}],"v":[{"b":0,"s":"Всего за сезон раздаётся сто пятьдесят очков. Пусть предпоследний набрал пэ девять очков. Девять верхних спортсменов набрали разное количество, не меньше пэ девять, пэ девять плюс один и так далее. Их сумма не больше ста пятидесяти, отсюда пэ девять не больше двенадцати. А последний набрал не меньше нуля."},{"b":0,"f":"est_ex"},{"b":1,"s":"Пример с разницей двенадцать выписан в решении: последний ничего не набрал, а предпоследний — двенадцать. Ответ: двенадцать."}],"rich":true},{"l":"в","q":"Каждый год по результатам соревнований вычисляется средний балл Q для спортсменов, набравших хотя бы одно очко: отношение суммы всех набранных очков к количеству спортсменов, набравших хотя бы одно очко. В следующем году планируется проводить аналогичные соревнования (10 этапов) с участием 10 спортсменов, где каждому из них будут присваиваться 10a +k1b+ k2c очков. Организаторы обсуждают в данной формуле целые значения k1 и k2 такие, что 1 ≤k2 \u003c k1 ≤ 9. Найдите все пары (k1;k2), при которых возможно получить наибольшее количество целых значений среднего балла Q.","ak":"self","av":"(5; 3), (6; 2), (7; 1), (8; 6), (9; 5).","steps":[{"w":["📌 Сумма всех очков 10(10 + k₁ + k₂), набравших очки — **m** от 3 до 10.","=Q = 10(10 + k₁ + k₂) : m"],"f":[]},{"w":["🔎 Ищем s = 10 + k₁ + k₂, у которого 10s делится на **больше всего** m от 3 до 10:","=s = 18:  m = 3, 4, 5, 6, 9, 10","=s = 24:  m = 3, 4, 5, 6, 8, 10"],"f":[]},{"w":["=k₁ + k₂ = 8:  (5; 3), (6; 2), (7; 1)","=k₁ + k₂ = 14:  (8; 6), (9; 5)","✅ **Ответ:** (5; 3), (6; 2), (7; 1), (8; 6), (9; 5)."],"f":[]}],"v":[{"b":0,"s":"Общая сумма очков за сезон всегда одна и та же: десять раз десять плюс ка один плюс ка два. А число спортсменов, набравших очки, может быть от трёх до десяти. Средний балл — сумма, делённая на это число."},{"b":1,"s":"Чтобы целых значений было как можно больше, сумма должна делиться на как можно большее число вариантов эм. Перебор показывает: лучше всего, когда десять плюс ка один плюс ка два равно восемнадцати или двадцати четырём — по шесть подходящих делителей."},{"b":2,"s":"Остаётся выписать пары ка один и ка два с суммой восемь или четырнадцать, где ка один больше ка два и оба не больше девяти. Все пары — в ответе."}],"rich":true}],"tags":["est"],"facts":["mean","est_ex"],"note":"","n":153},{"id":"114809","d":5,"from":"Школково","stem":"10 спортсменов, 10 этапов, на каждом — 1-е, 2-е и 3-е место. За год у спортсмена a первых, b вторых, c третьих мест; в этом году он получает 10a + 4b + c очков (больше очков — выше рейтинг). В прошлом году рейтинг сравнивали «по старшинству»: сначала по a, при равенстве — по b, затем по c.","parts":[{"l":"а","q":"В этом году по итогам соревнований и наивысший, и наименьший рейтинги имеют ровно по одному спортсмену. Если бы рейтинги определялись, как в прошлом году, то и наивысший, и наименьший рейтинги имели бы тоже ровно по одному спортсмену. Может ли спортсмен, получивший в этом году наивысший рейтинг, по расчётам прошлого года иметь наименьший рейтинг?","ak":"yn","av":"ДА","steps":[{"w":["🔨 **Пример:**","👉 X: (0, 10, 0) — **40** очков","👉 один: (2, 0, 3) — 23 очка","👉 восемь: (1, 0, c) — от 10 до 11 очков"],"f":[]},{"w":["📌 В этом году X — единственный лидер (40), последний — (1, 0, 0).","📌 По-прошлогоднему X — единственный **последний** (у всех остальных есть первые места).","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Идея: пусть спортсмен икс собрал все вторые места, но ни одного первого. В этом году вторые места стоят дорого, по четыре очка, и у него сорок очков — больше всех."},{"b":0,"s":"Остальные получили по одному-два первых места и немного третьих — по очкам они меньше."},{"b":1,"s":"А по правилам прошлого года главное — количество первых мест. У всех остальных хотя бы одно первое место, а у икс ни одного, поэтому он единственный последний. Ответ: да."}],"rich":true},{"l":"б","q":"По итогам соревнований этого года получилось, что у любых двух спортсменов нет одинаковых рейтингов, а модуль разности набранных очков у любых двух спортсменов не меньше p. Найдите наибольшее возможное значение p.","ak":"num","av":"3","steps":[{"w":["📏 Очки различны с шагом ≥ p:","=0 + p + 2p + … + 9p = 45p ≤ 150   →   p ≤ 3"],"f":[]},{"w":["🔨 **Пример:** 0, 3, 6, …, 24 и 42","✅ **Ответ: 3.**"],"f":[]}],"v":[{"b":0,"s":"Если любые два спортсмена отличаются хотя бы на пэ очков, то, расставив их по возрастанию, получаем: наименьший хотя бы ноль, следующий хотя бы пэ, и так далее до девяти пэ. Сумма хотя бы сорок пять пэ, а всего очков сто пятьдесят. Значит, пэ не больше трёх."},{"b":1,"s":"Пример: очки ноль, три, шесть и так далее до двадцати четырёх, а у лидера сорок два. Как распределить места — показано в решении. Ответ: три."}],"rich":true},{"l":"в","q":"По итогам соревнований этого года получилось, что у любых двух спортсменов нет одинаковых рейтингов. Найдите наименьшую возможную разницу между средним арифметическими значениями набранных очков у пяти спортсменов с наибольшими рейтингами и у пяти спортсменов с наименьшими рейтингами.","ak":"num","av":"6","steps":[{"w":["📌 T — очки пятёрки лидеров, B — пятёрки отстающих, T + B = 150.","=разность средних = (T − B) : 5","📏 Очки различны → T − B ≥ 25, и T − B чётное."],"f":[]},{"w":["📏 T − B = 26 или 28 тоже невозможно (разбор по наибольшему из нижней пятёрки) → **T − B ≥ 30**."],"f":[]},{"w":["🔨 **Пример:** 10, 11, 12, 13, 14 | 15, 16, 17, 18, 24","=T = 90,   B = 60   →   (90 − 60) : 5 = 6","✅ **Ответ: 6.**"],"f":[]}],"v":[{"b":0,"s":"Пусть верхняя пятёрка набрала тэ очков, нижняя — бэ. Вместе сто пятьдесят. Разность средних — тэ минус бэ, делённое на пять."},{"b":0,"s":"Все очки разные, поэтому каждый из верхней пятёрки хотя бы на пять больше соответствующего из нижней — разность сумм хотя бы двадцать пять. А так как тэ плюс бэ чётное, то и разность чётная."},{"b":1,"s":"Аккуратный разбор показывает, что разности двадцать шесть и двадцать восемь тоже невозможны. Значит, разность сумм хотя бы тридцать, а разность средних хотя бы шесть."},{"b":2,"s":"Пример: нижняя пятёрка от десяти до четырнадцати очков, верхняя — пятнадцать, шестнадцать, семнадцать, восемнадцать и двадцать четыре. Распределение мест — в решении. Ответ: шесть."}],"rich":true}],"tags":["est"],"facts":["mean","est_ex"],"note":"","n":154}]}</script>
