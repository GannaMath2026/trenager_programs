<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap" rel="stylesheet">
<title>Теория чисел: самоучитель (ЕГЭ №19)</title>
<style>
:root{
  --bg:#f6f1e7; --paper:#fffdf8; --ink:#1f2328; --muted:#6b6f76; --line:#e4dccb; --soft:#efe7d6;
  --accent:#1d5fd1; --accent-soft:#e3ecfb; --ok:#1f8a4c; --ok-soft:#dff3e6; --bad:#c2372d; --bad-soft:#fbe4e1;
  --warn:#9a6400; --warn-soft:#fff1d1; --sticker:#ffd84d; --sticker-ink:#4a3a00; --fact:#6a3fb5; --fact-soft:#efe8fb;
  --shadow:0 1px 2px rgba(60,40,0,.06),0 6px 18px rgba(60,40,0,.06);
  --serif: "Iowan Old Style","Palatino Linotype",Palatino,"PT Serif",Georgia,serif;
  --sans: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
[data-theme="dark"]{
  --bg:#15171b; --paper:#1d2026; --ink:#e8e6e1; --muted:#9aa0a8; --line:#2f333b; --soft:#262a31;
  --accent:#7aa7ff; --accent-soft:#22304a; --ok:#5fd18f; --ok-soft:#1b3326; --bad:#ff8a80; --bad-soft:#3a2120;
  --warn:#f1c25b; --warn-soft:#3a3018; --sticker:#ffd84d; --sticker-ink:#3a2e00; --fact:#b99bf2; --fact-soft:#2c2540;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
/* ---------- login */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:28px;max-width:440px;width:100%}
.login h1{font-family:var(--serif);font-size:28px;margin:0 0 4px;line-height:1.15}
.login p{color:var(--muted);margin:0 0 18px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{flex:1;min-width:0;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.field:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.btn{border:1px solid var(--line);background:var(--paper);padding:9px 14px;border-radius:10px;font-weight:600;font-size:15px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
[data-theme="dark"] .btn.primary{color:#0d1424}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--soft)}
.names{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.name-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);text-align:left;width:100%}
.name-item:hover{border-color:var(--accent)}
.name-item small{color:var(--muted)}
/* ---------- app shell */
.app{display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);height:100%}
header.top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:20}
.brand{font-family:var(--serif);font-weight:700;font-size:18px;white-space:nowrap}
.who{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:14px;color:var(--muted)}
.bar{width:120px;height:8px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok)}
.iconbtn{border:1px solid var(--line);background:var(--paper);width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.iconbtn:hover{border-color:var(--accent)}
.menu{position:absolute;right:12px;top:54px;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:260px;z-index:40}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:8px}
.menu button:hover{background:var(--soft)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.body{display:grid;grid-template-columns:320px 1fr;min-height:0}
aside.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--paper)}
.filters{padding:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;padding:6px 4px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tagsel{flex:1;min-width:0;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:14px}
.plist{overflow:auto;flex:1;padding:6px}
.pitem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;width:100%;text-align:left;padding:10px;border:1px solid transparent;border-radius:12px;background:transparent;margin-bottom:2px;position:relative}
.pitem:hover{background:var(--soft)}
.pitem.cur{background:var(--accent-soft);border-color:var(--accent)}
.pnum{font-family:var(--serif);font-weight:700;font-size:15px;min-width:30px;color:var(--muted)}
.ptxt{font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dots{display:flex;gap:3px;margin-top:5px}
.dots i{width:16px;height:5px;border-radius:3px;background:var(--line)}
.dots i.ok{background:var(--ok)}
.dots i.seen{background:var(--warn)}
.sticker{position:absolute;right:6px;top:6px;background:var(--sticker);color:var(--sticker-ink);font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;transform:rotate(4deg);box-shadow:0 1px 0 rgba(0,0,0,.15);letter-spacing:.02em}
.fav{color:#e2a400}
main{overflow:auto;min-height:0;min-width:0}
.wrap{max-width:860px;margin:0 auto;padding:20px 18px 80px}
.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.phead h2{font-family:var(--serif);margin:0;font-size:24px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:var(--soft);font-size:12.5px;color:var(--muted);border:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:14px}
.stem{font-family:var(--serif);font-size:18px;line-height:1.55;white-space:pre-wrap}
.note{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.tabs{display:flex;gap:6px;margin:6px 0 12px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--paper);padding:7px 16px;border-radius:10px;font-weight:700;font-family:var(--serif);font-size:17px;position:relative}
.tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab .mk{position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;background:var(--ok);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;font-family:var(--sans)}
.q{font-family:var(--serif);font-size:18px;margin:0 0 14px}
.ans{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.yn{min-width:84px;padding:10px 16px;border-radius:12px;border:2px solid var(--line);background:var(--paper);font-weight:800;font-size:16px}
.yn:hover{border-color:var(--accent)}
.feedback{margin-top:12px;padding:10px 14px;border-radius:12px;font-weight:600}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.feedback.info{background:var(--soft);color:var(--ink);font-weight:500}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.steps{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:32px 1fr;gap:10px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.snum{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.stext{font-size:16px;line-height:1.55;padding-top:2px}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.fchip{border:0;background:#fff3a8;color:#4a3a00;padding:3px 10px 4px;border-radius:2px;font-size:13px;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.18);transform:rotate(-1.2deg)}
.fchip:nth-child(even){background:#ffd9e2;transform:rotate(1deg)}
.fchip:nth-child(3n){background:#d4f5dc}
.fchip:hover{transform:rotate(0) scale(1.05)}
.diff{color:#e29a00;letter-spacing:1px;font-size:12px}
.navrow{display:flex;justify-content:space-between;gap:8px;margin-top:6px}
/* ---------- theory drawer */
.drawer{position:fixed;top:0;right:0;height:100%;width:min(460px,100%);background:var(--paper);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.12);z-index:50;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .22s ease}
.drawer.open{transform:none}
.dhead{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.dtitle{display:flex;align-items:center;gap:8px}
.dtitle b{font-family:var(--serif);font-size:19px;flex:1}
.dbody{overflow:auto;padding:14px 16px 40px;flex:1}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 8px;font-weight:700}
.fact{position:relative;border:0;border-radius:3px 3px 14px 3px;padding:16px 16px 14px;margin:6px 4px 18px;background:var(--st1);color:#2b2a26;box-shadow:0 1px 1px rgba(0,0,0,.08),0 8px 16px -8px rgba(60,40,0,.35);transform:rotate(var(--rot,-.6deg));transition:transform .15s}
.fact:hover{transform:rotate(0deg) scale(1.01)}
.fact::before{content:"";position:absolute;top:-9px;left:50%;width:70px;height:18px;margin-left:-35px;background:rgba(255,255,255,.55);border:1px solid rgba(0,0,0,.06);transform:rotate(-2deg)}
.fact.c1{background:var(--st1)} .fact.c2{background:var(--st2)} .fact.c3{background:var(--st3)} .fact.c4{background:var(--st4)}
.fact.hl{box-shadow:0 0 0 3px var(--fact),0 8px 16px -8px rgba(60,40,0,.35)}
.fact h4{margin:0 0 4px;font-family:"Caveat","Segoe Print","Bradley Hand","Comic Sans MS",cursive;font-size:24px;line-height:1.1;color:#3b2f7a}
.fact p{margin:0;font-size:14.5px;line-height:1.5}
.fact .ex{display:block;margin:12px -4px 2px 18px;padding:9px 12px 10px;background:#fffdf3;border-radius:2px;box-shadow:0 2px 6px rgba(0,0,0,.15);transform:rotate(1.6deg);font-size:14px;color:#33302a;position:relative}
.fact .ex b{display:block;font-family:"Caveat","Segoe Print","Comic Sans MS",cursive;font-size:20px;font-weight:700;color:#c2410c;margin-bottom:1px}
:root{--st1:#fff3a8;--st2:#ffd9e2;--st3:#d4f5dc;--st4:#d9ecff}
[data-theme="dark"]{--st1:#efe08a;--st2:#f0c3cf;--st3:#bfe5c8;--st4:#c4dcf3}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:45}
/* ---------- modal */
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:60;padding:16px;background:rgba(0,0,0,.35)}
.mbox{background:var(--paper);border-radius:16px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:20px;border:1px solid var(--line);box-shadow:var(--shadow)}
.mbox h3{margin:0 0 10px;font-family:var(--serif);font-size:22px}
.mbox textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
table.stat{width:100%;border-collapse:collapse;font-size:14px}
table.stat td,table.stat th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:12px;z-index:70;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);max-width:92vw}
.toast button{background:var(--paper);color:var(--ink);border:0;border-radius:8px;padding:5px 10px;font-weight:700}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.mobile-only{display:none}
@media (max-width:860px){
  .body{grid-template-columns:minmax(0,1fr)}
  header.top{gap:6px;padding:8px 10px}
  .brand{display:none}
  .who .pc{display:none}
  .phead h2{font-size:21px}
  aside.list{position:fixed;left:0;top:53px;bottom:0;width:min(340px,92vw);z-index:30;transform:translateX(-105%);transition:transform .22s ease;box-shadow:10px 0 30px rgba(0,0,0,.15)}
  aside.list.open{transform:none}
  .mobile-only{display:inline-flex}
  .bar{width:60px}
  .brand{font-size:16px}
  .who .nm{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wrap{padding:14px 12px 80px}
  .card{padding:14px}
  .stem,.q{font-size:17px}
}
@media print{header.top,aside.list,.tools,.drawer{display:none!important}}
</style>

<script id="app-data" type="application/json">{"version":2,"title":"Теория чисел: самоучитель (ЕГЭ №19)","tags":{"digits":"Цифры и запись числа","div":"Делимость и остатки","ops":"Операции и инварианты","avg":"Средние и проценты","est":"Оценка + пример","seq":"Последовательности","eq":"Уравнения в целых"},"sections":[["div","Делимость и признаки делимости"],["fta","Простые числа, НОД, НОК"],["mod","Остатки и сравнения"],["dec","Десятичная запись числа"],["par","Чётность"],["inv","Инварианты и операции"],["seq","Прогрессии и суммы"],["eq","Уравнения в целых числах"],["avg","Средние, доли, проценты"],["est","Оценка + пример, крайний, Дирихле"]],"facts":[{"id":"div_def","s":"div","n":"Определение делимости","t":"Число a делится на b (b ≠ 0), если a = b·k для некоторого целого k. Говорят: b — делитель числа a, или a кратно b.","e":"84 = 14·6, значит 14 | 84. А 230 не делится на 14: 230 = 14·16 + 6.","w":["📌 **a делится на b** (b ≠ 0), если a = b·k, где k — целое.","👉 Говорят: **b — делитель числа a**, или **a кратно b**.","💡 Примеры:","=12 = 3·4  →  3 — делитель 12","=13 = 3·4 + 1  →  13 на 3 не делится (остаток 1)"],"say":"Число а делится на число бэ, если а можно записать как бэ, умноженное на целое число. Тогда бэ называют делителем числа а, а число а — кратным бэ. Если же при делении остаётся остаток, то делимости нет."},{"id":"div_sum","s":"div","n":"Делимость суммы и разности","t":"Если a и b делятся на m, то a ± b делится на m. Если сумма a + b делится на m и a делится на m, то и b делится на m. Сумма двух чисел, кратных m, кратна m.","e":"Оба числа кратны 45 ⇒ их сумма кратна 45. 3435 : 45 = 76,33… ⇒ 3435 не может быть суммой двух чисел, кратных 45.","w":["📌 Если **a** и **b** делятся на m, то **a + b** и **a − b** тоже делятся на m.","📌 Если **a + b** и **a** делятся на m, то и **b** делится на m.","❗ Если одно слагаемое делится на m, а другое — нет, то сумма на m **не делится**.","💡 Примеры:","=15 + 25 = 40 — все кратны 5","=15 + 7 = 22 — на 5 не делится"],"say":"Если два числа делятся на одно и то же число эм, то их сумма и их разность тоже делятся на эм. А если одно слагаемое делится на эм, а другое — нет, то сумма на эм уже не делится. Этим удобно доказывать, что какое-то число получить нельзя."},{"id":"div_rules","s":"div","n":"Признаки делимости","t":"На 2 — последняя цифра чётная; на 5 — последняя 0 или 5; на 10 — последняя 0; на 4 — число из двух последних цифр делится на 4; на 8 — из трёх последних; на 3 и на 9 — сумма цифр делится на 3 (на 9); на 11 — знакочередующаяся сумма цифр делится на 11.","e":"9720: сумма цифр 18 ⇒ делится на 9, оканчивается на 0 ⇒ делится на 5, значит делится на 45. 9167169: 9−1+6−7+1−6+9 = 11 ⇒ делится на 11.","w":["📌 **Признаки делимости:**","👉 на **2** — последняя цифра чётная","👉 на **5** — последняя цифра 0 или 5;  на **10** — последняя 0","👉 на **4** — число из двух последних цифр делится на 4;  на **8** — из трёх последних","👉 на **3** и на **9** — сумма цифр делится на 3 (на 9)","👉 на **11** — сумма цифр со знаками «+ − + −» делится на 11","💡 Пример: 2376 — сумма цифр 18 → делится на 9; 76 делится на 4 → делится на 4."],"say":"На два делится число с чётной последней цифрой. На пять — если на конце ноль или пять, на десять — если на конце ноль. На четыре — если делится число из двух последних цифр, на восемь — из трёх последних. На три и на девять смотрим на сумму цифр. А на одиннадцать — складываем цифры, чередуя знаки плюс и минус."},{"id":"div_comp","s":"div","n":"Делимость на составное число","t":"Если число делится на взаимно простые a и b, то оно делится на a·b. Поэтому: на 36 = 4·9 — проверяем 4 и 9; на 45 = 5·9; на 15 = 3·5; на 60 = 3·4·5.","e":"Двузначные кратные 36: 36 и 72 — других нет (108 уже трёхзначное).","w":["📌 Если число делится на **взаимно простые** a и b, то оно делится на **a·b** (и наоборот).","👉 на 6 = 2·3,   на 12 = 3·4,   на 15 = 3·5,   на 36 = 4·9,   на 45 = 5·9","❗ Множители должны быть взаимно простыми: делимость на 2 и на 4 **не** даёт делимости на 8.","💡 Пример: 90 делится на 5 и на 9 → делится на 45."],"say":"Чтобы проверить делимость на составное число, его раскладывают на множители без общих делителей и проверяют каждый. Например, на сорок пять делится число, которое делится и на пять, и на девять. Важно, чтобы множители были взаимно простыми."},{"id":"div_count","s":"div","n":"Кратные среди подряд идущих чисел","t":"Среди любых k подряд идущих натуральных чисел ровно одно делится на k. Если среди L подряд идущих чисел ровно m делятся на k, то (m−1)·k + 1 ≤ L ≤ (m+1)·k − 1.","e":"Ровно 5 чисел, делящихся на 15 ⇒ 61 ≤ L ≤ 89. Чтобы 6 чисел делились на 17, нужно L ≥ 5·17 + 1 = 86.","w":["📌 Среди **k подряд идущих** чисел ровно одно делится на k.","📌 Кратные k идут **через каждые k** чисел. Поэтому если среди L подряд идущих чисел ровно **m** кратных k, то","=(m − 1)·k + 1 ≤ L ≤ (m + 1)·k − 1","💡 Пример: среди любых 10 подряд идущих чисел ровно одно оканчивается на 0."],"say":"Кратные числу ка встречаются ровно через каждые ка чисел. Поэтому среди любых ка подряд идущих чисел ровно одно делится на ка. А если известно, сколько кратных попало на отрезок, можно оценить его длину: он не может быть слишком коротким и не может быть слишком длинным."},{"id":"fta","s":"fta","n":"Основная теорема арифметики","t":"Любое натуральное число больше 1 раскладывается на простые множители, и притом единственным образом (с точностью до порядка).","e":"945 = 3³·5·7. 2108 = 2²·17·31. 1001 = 7·11·13.","w":["📌 Любое число больше 1 раскладывается на **простые множители**, причём **единственным образом**.","💡 Примеры:","=60 = 2²·3·5","=360 = 2³·3²·5","👉 Все делители числа «собираются» из его простых множителей."],"say":"Любое натуральное число больше единицы можно разложить на простые множители, и только одним способом, если не считать порядок. Поэтому по разложению видно всё о делимости: каждый делитель числа составлен из его простых множителей."},{"id":"prime_min","s":"fta","n":"Наименьший делитель — простой","t":"Наименьший делитель числа n > 1, больший 1, — простое число. Поэтому n ≥ своего наименьшего простого делителя.","e":"У числа 35 наименьший делитель 5, и 35 ≥ 5. Если числа имеют разные наименьшие простые делители p₁, p₂, …, то их сумма ≥ p₁ + p₂ + …","w":["📌 Наименьший делитель числа n (больший 1) — **простое число**.","📌 Значит, **n ≥ своего наименьшего простого делителя**.","💡 Пример: у 91 = 7·13 наименьший делитель 7 — простой."],"say":"Самый маленький делитель числа, больший единицы, всегда простой: если бы он был составным, у него нашёлся бы делитель ещё меньше. А само число не меньше этого делителя. Это помогает оценивать суммы чисел снизу."},{"id":"coprime","s":"fta","n":"Взаимно простые числа","t":"Числа взаимно просты, если НОД = 1. У попарно взаимно простых чисел нет общих простых делителей ⇒ у каждого числа (кроме 1) свой простой делитель. Среди попарно взаимно простых чисел не больше одного чётного.","e":"1, 2, 3, 5, 7, 11, 13, 17 — попарно взаимно простые, сумма 59.","w":["📌 Числа **взаимно простые**, если их НОД = 1 (нет общих делителей, кроме 1).","📌 У попарно взаимно простых чисел **у каждого свой** простой делитель (кроме числа 1).","📌 Среди них **не больше одного чётного**.","💡 Пример: 4, 9, 25 — попарно взаимно простые (делители 2, 3, 5)."],"say":"Два числа взаимно простые, если у них нет общих делителей, кроме единицы. Если в наборе все числа попарно взаимно простые, то никакие два не делятся на одно и то же простое число. Значит, у каждого числа свой простой делитель, и чётное число в наборе может быть только одно."},{"id":"gcd","s":"fta","n":"НОД и алгоритм Евклида","t":"НОД(a, b) = НОД(a − b, b) = НОД(a + b, b). Дробь a/b несократима, если НОД(a, b) = 1.","e":"НОД(a + b, 2a + b) = НОД(a + b, a) = НОД(b, a). Значит, если a/b несократима, то и (a+b)/(2a+b) несократима.","w":["📌 НОД не меняется, если из одного числа вычесть другое (или прибавить):","=НОД(a, b) = НОД(a − b, b) = НОД(a + b, b)","📌 Дробь a/b **несократима**, если НОД(a, b) = 1.","💡 Пример: НОД(91, 35) = НОД(56, 35) = НОД(21, 35) = НОД(21, 14) = 7"],"say":"Наибольший общий делитель двух чисел не изменится, если из одного числа вычесть другое. Так его и находят — алгоритм Евклида. А дробь несократима, когда наибольший общий делитель числителя и знаменателя равен единице."},{"id":"prime_only","s":"fta","n":"Простое число как произведение","t":"Простое число p нельзя получить как произведение двух чисел, больших 1. Если p записано как произведение натуральных, то один множитель равен p, а остальные равны 1.","e":"Если на доске стоит простое 7, а единицы нет, то 7 — одно из задуманных чисел.","w":["📌 Простое число **p** нельзя получить как произведение двух чисел, больших 1.","📌 Если p — произведение натуральных чисел, то один множитель равен **p**, а остальные — **1**.","💡 Пример: 13 = 13·1·1 — других разложений нет."],"say":"Простое число делится только на единицу и на себя. Поэтому его нельзя получить, перемножив числа больше единицы. Если простое число записано как произведение, то один множитель — само это число, а все остальные — единицы."},{"id":"mod_def","s":"mod","n":"Сравнения по модулю","t":"a ≡ b (mod m), если a и b дают одинаковые остатки при делении на m, то есть разность a − b делится на m. Сравнения можно складывать, вычитать и умножать.","e":"563 = 28·20 + 3 ⇒ 563 ≡ 3 (mod 28). 1417 − 563 = 854 не делится на 4 ⇒ остатки по mod 4 разные.","w":["📌 **a ≡ b (mod m)** — «a сравнимо с b по модулю m»: у a и b **одинаковые остатки** при делении на m.","👉 То же самое: **a − b делится на m**.","📌 Остатки можно **складывать, вычитать и умножать**.","💡 Примеры:","=17 ≡ 2 (mod 5),   23 ≡ 3 (mod 5)","=17 + 23 = 40 ≡ 2 + 3 = 5 ≡ 0 (mod 5)"],"say":"Два числа сравнимы по модулю эм, если при делении на эм у них одинаковые остатки, то есть их разность делится на эм. С остатками можно работать как с числами: остаток суммы равен сумме остатков, остаток произведения — произведению остатков. Поэтому остаток большого выражения считается по остаткам его частей."},{"id":"mod_shift","s":"mod","n":"Метод сдвига (все числа сравнимы)","t":"Если сумма ЛЮБЫХ k чисел из набора делится на m (и чисел больше k), то все числа набора дают одинаковый остаток при делении на m: заменим в k-ке одно число x на y — сумма останется кратной m, значит x ≡ y. Для чисел по кругу: если сумма любых k подряд кратна m, то aᵢ ≡ aᵢ₊ₖ (mod m).","e":"Среднее любых трёх и любых пяти — целое ⇒ все числа сравнимы по mod 3 и mod 5, т.е. по mod 15.","w":["📌 Если **сумма любых k чисел** набора делится на m (а чисел больше k), то **все числа дают одинаковый остаток** при делении на m.","🔎 Почему: заменим в группе одно число x на y. Обе суммы кратны m, значит, x − y кратно m.","📌 По кругу: если сумма любых k подряд кратна m, то числа через k мест дают одинаковые остатки."],"say":"Метод сдвига. Возьмём две группы по ка чисел, которые отличаются только одним числом. Обе суммы делятся на эм, значит, и их разность делится на эм. А разность — это как раз разность двух отличающихся чисел. Поэтому все числа дают один и тот же остаток."},{"id":"mod_sq","s":"mod","n":"Остатки квадратов","t":"Квадрат при делении на 3 даёт остаток 0 или 1; на 4 — 0 или 1; на 8 (для нечётного) — 1. n² ≡ 1 (mod p) для простого p ⇔ n ≡ ±1 (mod p).","e":"Число ≡ 3 (mod 4) не может быть квадратом. n² ≡ 1 (mod 7) ⇔ n ≡ 1 или 6 (mod 7).","w":["📌 **Остатки квадратов:**","|делим на|возможные остатки квадрата","|3|0, 1","|4|0, 1","|8 (нечётный квадрат)|1","|9|0, 1, 4, 7","💡 Пример: число с остатком 2 при делении на 3 — **не квадрат**."],"say":"Квадраты дают не любые остатки. При делении на три — только ноль или один, при делении на четыре — тоже только ноль или один, при делении на девять — ноль, один, четыре или семь. Если у числа другой остаток, оно точно не квадрат."},{"id":"last_digit","s":"mod","n":"Последняя цифра","t":"Последняя цифра суммы (произведения) определяется последними цифрами слагаемых (множителей) — это остаток по mod 10.","e":"26 чисел на 4 и 4 числа на 8: 26·4 + 4·8 = 136 ⇒ сумма оканчивается на 6.","w":["📌 Последняя цифра суммы и произведения зависит **только от последних цифр** слагаемых и множителей.","💡 Примеры:","=…7 + …5 = …2","=…7 · …3 = …1"],"say":"Последняя цифра суммы или произведения определяется только последними цифрами чисел. Поэтому, чтобы узнать, на что оканчивается результат, всё остальное можно не учитывать."},{"id":"mod_cases","s":"mod","n":"Перебор остатков","t":"Чтобы проверить, решается ли уравнение, удобно перебрать остатки по подходящему модулю: если ни один остаток не подходит — решений нет.","e":"101 = 5a + 14b при a ≤ 4: 101 − 5a ∈ {101, 96, 91, 86, 81} — ни одно не делится на 14.","w":["📌 Если у переменной **мало возможных значений**, их можно **перебрать все**.","👉 Удобно оформлять перебор таблицей.","❌ Если **ни один** вариант не подходит — решений нет. Это полноценное доказательство."],"say":"Если у какой-то величины немного возможных значений или остатков, можно просто проверить их все по очереди, лучше всего — в таблице. Если ни один вариант не подходит, значит, решений нет, и это полноценное доказательство."},{"id":"dec_repr","s":"dec","n":"Десятичная запись","t":"Трёхзначное число с цифрами a, b, c равно 100a + 10b + c; двузначное с цифрами a, b равно 10a + b. При перестановке цифр двузначного числа: 10a + b → 10b + a.","e":"Если A — сумма цифр десятков, B — сумма цифр единиц, то сумма чисел 10A + B, а после перестановки 10B + A.","w":["📌 Число через цифры:","=двузначное  ab = 10a + b","=трёхзначное  abc = 100a + 10b + c","👉 Переставили цифры:  10a + b  →  10b + a","💡 Пример: 47 = 10·4 + 7,   74 − 47 = 9·(7 − 4) = 27"],"say":"Любое число можно записать через его цифры: у двузначного первая цифра — это десятки, поэтому число равно десять а плюс бэ. У трёхзначного — сто а плюс десять бэ плюс цэ. Такая запись помогает, когда в задаче переставляют, вычёркивают или приписывают цифры."},{"id":"append","s":"dec","n":"Приписывание цифры","t":"Приписать к числу x справа цифру d — получить 10x + d. Приписать k-значное число y — получить x·10ᵏ + y.","e":"К 13 приписали 7: 137 = 10·13 + 7.","w":["📌 Приписать к числу **x** справа цифру **d**:","=10x + d","📌 Приписать справа k-значное число **y**:","=x·10ᵏ + y","💡 Пример: к 25 приписали 3 → 253 = 25·10 + 3"],"say":"Если к числу приписать справа одну цифру, старое число становится в десять раз больше, и к нему прибавляется эта цифра. Если приписать двузначное число — старое умножается на сто, и так далее."},{"id":"ds_mod9","s":"dec","n":"Сумма цифр и деление на 9","t":"Число и его сумма цифр дают одинаковый остаток при делении на 9 (и на 3): S(n) ≡ n (mod 9). Сумма цифр k-значного числа ≤ 9k.","e":"1994: S = 23, 23 ≡ 5 ≡ 1994 (mod 9). Если x + S(x) + S(S(x)) = N, то 3x ≡ N (mod 9).","w":["📌 Число и его **сумма цифр** дают **одинаковый остаток** при делении на 9 (и на 3).","🔎 Почему: вычтем из числа сумму его цифр:","=10a + b − (a + b) = 9a","=100a + 10b + c − (a + b + c) = 99a + 9b","👉 Разность всегда кратна 9.","📌 Сумма цифр: двузначного **≤ 18**, трёхзначного **≤ 27**, n-значного **≤ 9n**."],"say":"Число и сумма его цифр дают одинаковый остаток при делении на девять и при делении на три. Чтобы понять почему, вычтем из числа сумму его цифр: у двузначного остаётся девять а, у трёхзначного — девяносто девять а плюс девять бэ. Это всегда делится на девять. А ещё сумма цифр не бывает больше, чем девять, умноженное на количество цифр."},{"id":"ds_carry","s":"dec","n":"Сумма цифр и переносы","t":"S(x) + S(y) = S(x + y) + 9·(число переносов при сложении столбиком).","e":"x + y = 599 без переносов ⇒ S(x) + S(y) = 5 + 9 + 9 = 23 — нечётно, поэтому S(x) ≠ S(y).","w":["📌 При сложении столбиком **каждый перенос** уменьшает сумму цифр на **9**:","=S(x) + S(y) = S(x + y) + 9·(число переносов)","💡 Пример: 38 + 45 = 83:  11 + 9 = 20 = 11 + 9·1 (один перенос)"],"say":"Когда складываем два числа столбиком без переносов, суммы цифр просто складываются. Но каждый перенос превращает десять единиц разряда в одну единицу следующего — и сумма цифр уменьшается на девять."},{"id":"repunit","s":"dec","n":"Числа из единиц","t":"Число из k единиц 11…1 = (10ᵏ − 1)/9, и оно ≡ k (mod 9).","e":"1 + 11 + 111 = 123, в записи 6 единиц, 123 ≡ 6 (mod 9). Замена 11 единиц на одно «11» уменьшает число единиц на 9, а сумма не меняется.","w":["📌 Число из **k единиц** 11…1 при делении на 9 даёт остаток **k** (сумма его цифр равна k).","💡 Примеры: 111 → остаток 3,   1111111111 (10 единиц) → остаток 1"],"say":"Число, записанное одними единицами, при делении на девять даёт такой же остаток, как количество единиц. Это частный случай правила о сумме цифр."},{"id":"subseq","s":"dec","n":"Вычёркивание цифр","t":"Вычёркивая цифры, получаем подпоследовательность: порядок цифр сохраняется. Если каждая цифра встречается один раз, условия «x раньше y» должны быть непротиворечивы.","e":"Из 2893506 вычёркиванием получаются 206, 835, 930.","w":["📌 Вычёркивая цифры, мы **не меняем порядок** оставшихся.","👉 Если цифра встречается один раз, условия «x стоит раньше y» не должны противоречить друг другу.","💡 Пример: из 52 813 можно получить 581, но нельзя 185."],"say":"Когда из числа вычёркивают цифры, оставшиеся цифры идут в том же порядке. Поэтому, если из одной записи нужно получить несколько чисел, порядок цифр в них должен быть согласован."},{"id":"parity","s":"par","n":"Чётность","t":"Сумма чётного количества нечётных чисел чётна, нечётного — нечётна. Разность a − b и сумма a + b — одной чётности. Если a + b чётно, то a и b одной чётности.","e":"Сумма модулей разностей соседей по кругу ≡ сумме самих разностей ≡ 0 (mod 2) ⇒ всегда чётна.","w":["📌 Сумма **чётного** количества нечётных чисел — чётная, **нечётного** — нечётная.","📌 Сумма a + b и разность a − b — **одной чётности**.","📌 Если a + b чётно, то a и b — одной чётности.","💡 Примеры:  3 + 5 + 7 = 15 (три нечётных → нечётно);   9 + 4 = 13 и 9 − 4 = 5 — оба нечётные"],"say":"Если сложить чётное количество нечётных чисел, получится чётное число, а если нечётное количество — нечётное. Сумма и разность двух чисел всегда одной чётности, потому что отличаются на удвоенное число."},{"id":"invariant","s":"inv","n":"Инвариант","t":"Инвариант — величина, которая не меняется при операции (например, остаток разности, чётность, сумма). Если у начального и конечного состояний инвариант разный — перейти нельзя.","e":"Ход «+2 одному, −1 двум другим»: все числа меняются на −1 по mod 3 ⇒ разности чисел по mod 3 не меняются.","w":["📌 **Инвариант** — величина, которая **не меняется** при каждой операции: остаток, чётность, сумма…","❌ Если у начального и конечного положения инвариант **разный** — перейти **нельзя**.","💡 Пример: если к числу каждый раз прибавлять 3, его остаток при делении на 3 не меняется — из 1 никогда не получить 9."],"say":"Инвариант — это то, что не меняется при каждом ходе: чётность, остаток или сумма. Если в начале инвариант один, а в нужном положении другой, то прийти туда невозможно, сколько ни ходи."},{"id":"monovar","s":"inv","n":"Полуинвариант (монотонная величина)","t":"Величина, которая при каждом ходе меняется в одну сторону (например, растёт ровно на 1), позволяет посчитать число ходов или доказать, что процесс закончится.","e":"(A+2, B−1) и (A−1, B+2): сумма каждый ход растёт на 1 ⇒ число ходов = (новая сумма − старая сумма).","w":["📌 **Полуинвариант** — величина, которая при каждом ходе меняется **в одну сторону** (например, растёт ровно на 1).","👉 По ней можно **посчитать число ходов** или доказать, что процесс закончится.","💡 Пример: если за ход сумма растёт ровно на 1, то за 10 ходов она вырастет ровно на 10."],"say":"Полуинвариант — величина, которая с каждым ходом меняется всегда в одну сторону, например растёт ровно на единицу. Тогда по ней можно сосчитать число ходов или доказать, что процесс когда-нибудь закончится."},{"id":"reverse","s":"inv","n":"Обратный ход","t":"Если операция обратима, можно восстановить предыдущее состояние однозначно и идти «назад» от конечного состояния.","e":"(a, b) → (a+b, a−b): обратно (x, y) ← ((x+y)/2, (x−y)/2). Для (806; 788) предыдущая пара (797; 9).","w":["📌 Если по результату операции можно **однозначно восстановить**, что было до неё, — идём **назад** от конца.","💡 Пример: (a; b) → (a + b; a − b). Обратно:","=a = (x + y) : 2,     b = (x − y) : 2","👉 Прежние числа — полусумма и полуразность новых."],"say":"Обратный ход. Если по результату можно однозначно восстановить предыдущее положение, удобно идти от конца к началу. Так часто проще понять, можно ли вообще получить нужное."},{"id":"double_bound","s":"inv","n":"Удвоение за ход","t":"Если за один ход каждый кусок можно разрезать не более чем на две части, то после k ходов кусков не больше 2ᵏ.","e":"За 5 ходов не больше 32 частей, а нужно 100 ⇒ нельзя.","w":["📌 Если за ход каждый кусок режут **не больше чем на 2 части**, то кусков за ход становится **не больше чем вдвое** больше.","=после k ходов кусков ≤ 2ᵏ","💡 Пример: за 3 хода — не больше 8 кусков."],"say":"Если за один ход каждый кусок можно разрезать максимум на две части, то количество кусков за ход увеличивается не больше чем вдвое. После ка ходов кусков не больше двух в степени ка."},{"id":"lin_map","s":"inv","n":"Линейная операция над парами","t":"Если (a, b) → (pa + qb, ra + sb), то пара (c, d) получается из целой пары, когда система pa + qb = c, ra + sb = d имеет целое решение. Это даёт условие делимости на c и d.","e":"(3a + b, 3b − a) = (c, d) ⇒ a = (3c − d)/10, b = (c + 3d)/10 ⇒ нужно c + 3d ≡ 0 (mod 10).","w":["📌 Если пара (a; b) переходит в (pa + qb; ra + sb), то пару (c; d) можно получить, только если система","{pa + qb = c","{ra + sb = d","👉 имеет **целое** решение. Выразив a и b, получаем условие делимости на c и d."],"say":"Если пара чисел превращается в новую пару по линейным формулам, то, чтобы проверить, можно ли получить данную пару, составляем систему и выражаем исходные числа. Они должны оказаться целыми — это и даёт условие."},{"id":"sum_1n","s":"seq","n":"Сумма 1 + 2 + … + n","t":"1 + 2 + … + n = n(n+1)/2. Сумма n различных натуральных чисел не меньше n(n+1)/2; различных неотрицательных — не меньше n(n−1)/2.","e":"Сумма 100 различных натуральных ≥ 5050. Сумма 41 различного неотрицательного ≥ 0 + 1 + … + 40 = 820.","w":["📌 Сумма первых n натуральных чисел:","=1 + 2 + … + n = n(n + 1) : 2","📌 Сумма n **различных** натуральных чисел **не меньше** этой суммы.","💡 Пример: 1 + 2 + … + 10 = 55, поэтому 10 разных натуральных чисел в сумме дают хотя бы 55."],"say":"Сумма чисел от одного до эн равна эн, умноженному на эн плюс один, пополам. А эн любых разных натуральных чисел дают в сумме не меньше: самые маленькие разные числа — это как раз один, два, три и так далее."},{"id":"ap","s":"seq","n":"Арифметическая прогрессия","t":"Сумма n членов: Sₙ = n·a₁ + n(n−1)d/2 = n(a₁ + aₙ)/2.","e":"Если каждый день решать на 2 задачи больше, начав с b: за q дней qb + q(q−1).","w":["📌 **Арифметическая прогрессия:** каждое следующее число больше предыдущего на одно и то же **d**.","=Sₙ = n(a₁ + aₙ) : 2","💡 Пример: 3 + 5 + 7 + 9 = 4·(3 + 9) : 2 = 24"],"say":"В арифметической прогрессии каждое следующее число больше предыдущего на одно и то же число дэ. Сумма её членов — это полусумма первого и последнего, умноженная на количество членов."},{"id":"pow2","s":"seq","n":"Степени двойки, двоичная запись","t":"1 + 2 + 4 + … + 2ᵏ⁻¹ = 2ᵏ − 1. Набором гирь 1, 2, 4, …, 2ᵏ⁻¹ отвешивается любой вес от 1 до 2ᵏ − 1. Непустых поднаборов из k предметов — 2ᵏ − 1.","e":"Гири 1, 2, 4, 8, 16: веса 1…31. Четыре гири дают не более 15 разных сумм.","w":["📌 Сумма степеней двойки, идущих подряд с 1, **на 1 меньше** следующей степени:","=1 + 2 = 3 = 4 − 1","=1 + 2 + 4 = 7 = 8 − 1","=1 + 2 + 4 + 8 = 15 = 16 − 1","📌 Любое натуральное число **единственным образом** раскладывается в сумму разных степеней двойки (двоичная запись):","=13 = 8 + 4 + 1,     22 = 16 + 4 + 2","👉 Гирями 1, 2, 4, …, 2ᵏ⁻¹ можно отвесить любой вес от 1 до 2ᵏ − 1."],"say":"Если сложить степени двойки подряд, начиная с единицы, получится на один меньше следующей степени: один плюс два — три, это четыре без единицы; один плюс два плюс четыре — семь, восемь без единицы. А любое натуральное число можно единственным способом записать как сумму разных степеней двойки — это его двоичная запись. Поэтому гирями один, два, четыре, восемь и так далее отвешивается любой вес до их общей суммы."},{"id":"lin_dioph","s":"eq","n":"Линейные уравнения в целых числах","t":"ax + by = c. Решения ищут перебором одной переменной в небольшом диапазоне или по остаткам. Из двух уравнений с тремя неизвестными часто удаётся выразить всё через одну.","e":"5a = 6b в натуральных ⇒ a = 6t, b = 5t.","w":["📌 Уравнения в **целых** числах вида","=ax + by = c","👉 Решаем **перебором** той переменной, у которой **мало вариантов** (таблицей), или смотрим на остатки.","👉 Из двух уравнений с тремя неизвестными выражаем всё **через одну** переменную.","💡 Пример: 3x = 5y в натуральных → x = 5t, y = 3t."],"say":"В таких уравнениях неизвестные — целые числа. Их удобно решать перебором той переменной, у которой мало возможных значений, оформляя перебор таблицей. Можно также смотреть на остатки. А если неизвестных три, а уравнений два, выражаем всё через одну переменную."},{"id":"factor","s":"eq","n":"Разложение на множители","t":"Приём: привести уравнение к виду (…)(…) = число и перебрать делители. uv − u − v = (u−1)(v−1) − 1; x² − y² = (x−y)(x+y).","e":"uv − u − v = 30 ⇒ (u−1)(v−1) = 31 — простое ⇒ u − 1 = 1, v − 1 = 31.","w":["📌 Приём: приводим уравнение к виду **(…)·(…) = число** и перебираем делители этого числа.","=x² − y² = (x − y)(x + y)","=uv − u − v = (u − 1)(v − 1) − 1","💡 Пример: (x − 1)(y − 1) = 7 → одна скобка 1, другая 7."],"say":"Если удаётся записать уравнение так, что слева произведение двух скобок, а справа число, то каждая скобка — делитель этого числа. Делителей обычно немного, их легко перебрать."},{"id":"vieta","s":"eq","n":"Теорема Виета","t":"Для x² + px + q = 0 с корнями x₁, x₂: x₁ + x₂ = −p, x₁·x₂ = q.","e":"Корни 5 и 11 ⇒ p = −16, q = 55.","w":["📌 **Теорема Виета** для x² + px + q = 0 с корнями x₁, x₂:","=x₁ + x₂ = −p,     x₁·x₂ = q","💡 Пример: x² − 7x + 10 = 0 → корни 2 и 5 (сумма 7, произведение 10)."],"say":"Для приведённого квадратного уравнения сумма корней равна второму коэффициенту с обратным знаком, а произведение корней равно свободному члену."},{"id":"squares_sum","s":"eq","n":"Выражение через квадраты разностей","t":"a² + b² + c² − ab − bc − ca = ½[(a−b)² + (b−c)² + (c−a)²] = x² + xy + y², где x = a − b, y = b − c.","e":"a = 6, b = 3, c = 1: x = 3, y = 2, d = 9 + 6 + 4 = 19.","w":["📌 Выражение через квадраты разностей:","=a² + b² + c² − ab − bc − ca = ½·[(a − b)² + (b − c)² + (c − a)²]","👉 Если x = a − b, y = b − c, то это равно x² + xy + y²."],"say":"Сумма квадратов трёх чисел минус их попарные произведения равна половине суммы квадратов попарных разностей. Если обозначить разности через икс и игрек, выражение становится икс в квадрате плюс икс игрек плюс игрек в квадрате."},{"id":"mean","s":"avg","n":"Среднее арифметическое","t":"Среднее = сумма / количество, значит сумма = среднее · количество. Среднее не меньше наименьшего и не больше наибольшего числа.","e":"Шесть наименьших со средним 5 ⇒ их сумма 30.","w":["📌 **Среднее = сумма : количество**, значит","=сумма = среднее · количество","📌 Среднее **не меньше наименьшего** и **не больше наибольшего** числа.","💡 Пример: 4 числа со средним 6 → их сумма 24."],"say":"Среднее арифметическое — это сумма, делённая на количество. Значит, сумму всегда можно найти как среднее, умноженное на количество. И среднее всегда лежит между самым маленьким и самым большим числом."},{"id":"mean_move","s":"avg","n":"Перенос элемента между группами","t":"Если из группы (n чисел, среднее m) убрать число x, новое среднее (nm − x)/(n − 1). Среднее увеличится ⇔ x \u003c m. Если добавить x к группе — среднее растёт ⇔ x > m.","e":"Школа: 4 ученика со средним 42, пришёл ученик с 21 баллом: (168 + 21)/5 = 37,8 — уменьшилось на 10%.","w":["📌 Убираем из группы число **меньше среднего** → среднее **растёт**.","📌 Добавляем в группу число **больше среднего** → среднее **растёт**.","=новое среднее = (n·m ± x) : (n ± 1)","👉 n — сколько было чисел, m — их среднее.","💡 Пример: 2, 4, 9 (среднее 5); убрали 2 → 4, 9 (среднее 6,5)."],"say":"Если из группы убрать число меньше среднего, среднее вырастет, а если больше — уменьшится. Если добавить число больше среднего, среднее вырастет. Новое среднее удобно считать так: старая сумма — это количество, умноженное на среднее; исправляем её и делим на новое количество."},{"id":"percent","s":"avg","n":"Проценты и доли","t":"p% от N = pN/100. «Увеличилось на 10%» ⇒ стало 1,1 от прежнего. Доля k из n — это 100k/n %.","e":"Доля девочек 30% при 20 учениках — 6 девочек.","w":["📌 **p% от числа N:**","=N · p : 100","📌 **Какую долю в процентах составляет k от n:**","=k : n · 100%","👉 «Увеличилось на 10%» → стало 1,1 от прежнего.","💡 Примеры:  20% от 30 = 30·20 : 100 = 6;   6 из 30 — это 6 : 30 · 100% = 20%"],"say":"Процент — это сотая часть. Чтобы найти пэ процентов от числа эн, умножаем эн на пэ и делим на сто. А чтобы узнать, сколько процентов составляет ка от эн, делим ка на эн и умножаем на сто процентов."},{"id":"rounding","s":"avg","n":"Округление","t":"Число x округляется до целого k ⇔ k − 0,5 ≤ x \u003c k + 0,5.","e":"Рейтинг 31 при 13 голосах: 30,5 ≤ 100v/13 \u003c 31,5 ⇒ v = 4.","w":["📌 Число x **округляется до целого k**, если","=k − 0,5 ≤ x \u003c k + 0,5","💡 Пример: 7,49 → 7,   7,5 → 8"],"say":"Число округляется до целого ка, если отличается от ка меньше чем на половину: оно не меньше ка минус ноль целых пять десятых и меньше ка плюс ноль целых пять десятых. Так округление превращается в двойное неравенство."},{"id":"frac_monot","s":"avg","n":"Монотонность дроби","t":"Дробь (x + a)/(x + b) при b > a > 0 возрастает с ростом x. Чтобы максимизировать дробь — увеличиваем числитель и уменьшаем знаменатель; для дробно-линейной функции исследуем знак a·d − b·c.","e":"(10b + 3)/(100 + 10b) растёт с ростом b.","w":["📌 Дробь **больше**, если **числитель больше** или **знаменатель меньше**.","📌 Если к числителю и знаменателю правильной дроби прибавлять одно и то же число, дробь **растёт**.","💡 Пример: 1/3 \u003c 2/4 \u003c 3/5 \u003c 4/6"],"say":"Дробь тем больше, чем больше числитель и чем меньше знаменатель. А если к числителю и знаменателю правильной дроби прибавлять одно и то же число, дробь растёт и приближается к единице."},{"id":"est_ex","s":"est","n":"Схема «оценка + пример»","t":"Чтобы найти наибольшее (наименьшее) значение, нужно: 1) доказать оценку — значение не может быть больше (меньше); 2) привести пример, где оценка достигается. Без примера ответ не засчитывается.","e":"Сумма 8 попарно взаимно простых ≥ 59 (оценка), и 1 + 2 + 3 + 5 + 7 + 11 + 13 + 17 = 59 (пример).","w":["📌 Чтобы найти **наибольшее** или **наименьшее** значение:","1️⃣ **Оценка** — доказываем, что лучше быть **не может**.","2️⃣ **Пример** — показываем, что это значение **достигается**.","❗ Без примера ответ не засчитывается."],"say":"Нужно сделать две вещи. Первое — доказать, что лучше быть не может: это оценка. Второе — привести пример, где это значение действительно получается. Без примера ответ не засчитывают."},{"id":"extreme","s":"est","n":"Принцип крайнего","t":"Рассмотрите наименьший (наибольший) элемент — для него условия задачи дают самые сильные ограничения.","e":"Наибольший член цикла M: перед ним может стоять только M/2, а после — только M − 98.","w":["📌 Рассмотрите **наименьший** или **наибольший** элемент.","👉 Для него условия задачи дают **самые сильные ограничения** — с него удобно начинать рассуждение."],"say":"Посмотрите на самое большое или самое маленькое число. Для него условия задачи обычно дают самые жёсткие ограничения, и с него легче всего начать."},{"id":"dirichlet","s":"est","n":"Принцип Дирихле","t":"Если n + 1 предмет разложить в n ящиков, то в каком-то ящике окажется хотя бы 2 предмета. Бесконечная (длинная) последовательность из конечного числа значений повторяется.","e":"400 членов из чисел 1…111 ⇒ какое-то число повторится ⇒ в последовательности есть цикл.","w":["📌 Если **n + 1** предмет разложить в **n** ящиков, то в каком-то ящике окажутся **хотя бы 2** предмета.","👉 Длинная последовательность из небольшого набора значений обязательно **повторяется**.","💡 Пример: среди любых 13 человек двое родились в одном месяце."],"say":"Если кроликов больше, чем клеток, то в какой-то клетке сидят хотя бы два кролика. Так же, если в длинной последовательности бывает лишь несколько разных значений, какое-то значение обязательно повторится."},{"id":"distinct_min","s":"est","n":"Различные числа — минимальная сумма","t":"Если k различных натуральных чисел, то наименьшая их сумма — когда это k наименьших подходящих чисел. Если числа меньше x и различны, их сумма ≤ (x−1) + (x−2) + … + (x−k).","e":"4 различных числа меньше a₅: сумма ≤ 4a₅ − 10.","w":["📌 Сумма k **различных** натуральных чисел **наименьшая**, когда это k самых маленьких подходящих чисел.","📌 Если все числа **меньше x** и различны, их сумма не больше","=(x − 1) + (x − 2) + … + (x − k)","💡 Пример: 5 разных чётных чисел в сумме дают хотя бы 2 + 4 + 6 + 8 + 10 = 30."],"say":"Если числа разные, их сумма не может быть слишком маленькой: она не меньше суммы самых маленьких подходящих чисел. А если все числа меньше какого-то икс, то сумма не больше суммы самых больших возможных: икс минус один, икс минус два и так далее."},{"id":"tau","s":"fta","n":"Количество делителей","t":"Если n = p₁^a₁·p₂^a₂·…·pₖ^aₖ, то у n ровно (a₁+1)(a₂+1)…(aₖ+1) натуральных делителей.","e":"840 = 2³·3·5·7 ⇒ 4·2·2·2 = 32 делителя. 7 делителей бывает только у p⁶ (например, 729 = 3⁶).","w":["📌 Если n = p₁^a₁ · p₂^a₂ · …, то **количество делителей**","=(a₁ + 1)(a₂ + 1)…","💡 Пример: 12 = 2²·3 → (2 + 1)(1 + 1) = 6 делителей: 1, 2, 3, 4, 6, 12"],"say":"Раскладываем число на простые множители. Каждый делитель получается выбором степени каждого простого — от нулевой до той, что в разложении. Поэтому число делителей равно произведению показателей, увеличенных на единицу."},{"id":"gmean","s":"avg","n":"Среднее геометрическое","t":"ⁿ√(a₁·…·aₙ) — целое число g ⇔ произведение равно gⁿ. Удобно смотреть на показатели простых: каждый должен делиться на n.","e":"3·8·9 = 216 = 6³ ⇒ среднее геометрическое 3, 8, 9 равно 6.","w":["📌 **Среднее геометрическое** n чисел — корень n-й степени из их произведения.","👉 Оно целое, если произведение — это **n-я степень** целого числа (все показатели в разложении делятся на n).","💡 Пример: 2·8 = 16 = 4² → среднее геометрическое 2 и 8 равно 4."],"say":"Среднее геометрическое эн чисел — это корень эн-ной степени из их произведения. Оно целое, если произведение — точная эн-ная степень. Удобно смотреть на разложение на простые множители: каждый показатель должен делиться на эн."},{"id":"floor","s":"eq","n":"Целая часть [x]","t":"[x] — наибольшее целое, не превосходящее x: [x] ≤ x \u003c [x] + 1. Поэтому [n/a] ≤ n/a.","e":"[11/4] = 2. [n/2] + [n/3] + [n/9] ≤ 17n/18 \u003c n.","w":["📌 **[x] — целая часть**: наибольшее целое, не больше x.","=[x] ≤ x \u003c [x] + 1","💡 Примеры: [3,7] = 3,   [5] = 5,   [7 : 2] = 3"],"say":"Целая часть числа — наибольшее целое число, которое не больше него. Целая часть никогда не больше самого числа и меньше его не больше чем на единицу."},{"id":"gp","s":"seq","n":"Геометрическая прогрессия","t":"bₖ = b₁·qᵏ⁻¹. Если члены целые и q = p/r — несократимая дробь, то rᵏ⁻¹ делит b₁.","e":"128, 192, 288, 432, 648, 972: q = 3/2, а 2⁵ делит 128.","w":["📌 **Геометрическая прогрессия:** каждый член в q раз больше предыдущего.","=bₖ = b₁·qᵏ⁻¹","👉 Если члены целые, а q = p : r — несократимая дробь, то b₁ должен делиться на rᵏ⁻¹.","💡 Пример: 16, 24, 36, 54, 81 (q = 3 : 2, и 16 = 2⁴)."],"say":"В геометрической прогрессии каждый член получается из предыдущего умножением на одно и то же число ку. Если члены целые, а ку — несократимая дробь, то первый член должен делиться на нужную степень её знаменателя, иначе дальше получатся дроби."},{"id":"coins","s":"est","n":"Набор монет без «дыр»","t":"Монеты c₁ ≤ c₂ ≤ … позволяют набрать любую сумму до общей суммы ⇔ каждая следующая монета не больше 1 + сумма предыдущих.","e":"1, 2, 2, 5, 10, 10, … — подходит; 1, 2, 5 — нет (4 не набрать).","w":["📌 Разложим монеты по возрастанию. Любую сумму до общей можно набрать, если","=каждая следующая монета ≤ 1 + сумма всех предыдущих","💡 Примеры: 1, 2, 3, 7 — подходит (все суммы до 13);   1, 2, 5 — нет (4 не набрать)."],"say":"Если разложить монеты по возрастанию и каждая следующая монета не больше суммы всех предыдущих плюс один, то можно набрать любую сумму до общей суммы. А если какая-то монета слишком большая, перед ней появится сумма, которую не набрать."},{"id":"abs_sum","s":"est","n":"Сумма модулей разностей","t":"Каждое число входит в две разности по кругу со знаком «+» или «−». Сумма максимальна, когда большие числа всегда со знаком «+», малые — «−»: большие и малые чередуются.","e":"Для 1…12: максимум 2·(7+…+12) − 2·(1+…+6) = 114 − 42 = 72.","w":["📌 В сумме модулей разностей соседей по кругу каждое число входит **дважды** — со знаком «+» или «−».","👉 Сумма **наибольшая**, когда **большие** числа всегда с «+», а **малые** — с «−»: большие и малые **чередуются**.","💡 Пример: 1, 4, 2, 3 по кругу: 3 + 2 + 1 + 2 = 8 — больше, чем 1, 2, 3, 4 (1 + 1 + 1 + 3 = 6)."],"say":"Каждое число участвует в двух разностях с соседями и в каждой берётся со знаком плюс или минус. Сумма модулей будет наибольшей, если большие числа всегда идут с плюсом, а маленькие — с минусом. Для этого большие и маленькие числа нужно чередовать."}],"problems":[{"id":"90076","d":1,"from":"PDF №004","stem":"Есть 4 камня, каждый массой 5 тонн, и 13 камней, каждый массой 14 тонн.","parts":[{"l":"а","q":"Можно ли разложить все эти камни на две группы так, чтобы разность суммарных масс камней в этих группах составила 6 тонн?","ak":"yn","av":"ДА","steps":[{"w":["💡 **Идея:** найдём общую массу и разделим её на две группы с разницей 6 т.","=4·5 + 13·14 = 20 + 182 = 202 т","=(202 − 6) : 2 = 98 т,     98 + 6 = 104 т"],"f":[]},{"w":["🔎 **Собираем группы.** 98 делится на 14:","=98 = 7·14","👉 **Группа 1:** 7 камней по 14 т → **98 т**","👉 **Группа 2:** 6 камней по 14 т и 4 камня по 5 т → 84 + 20 = **104 т**","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Сначала узнаем, сколько весят все камни вместе: четыре камня по пять тонн и тринадцать по четырнадцать — всего двести две тонны."},{"b":0,"s":"Одна группа должна быть тяжелее другой на шесть тонн. Уберём эти лишние шесть тонн, а остаток разделим пополам — получим лёгкую группу, девяносто восемь тонн. Тяжёлая на шесть тонн больше — сто четыре тонны."},{"b":1,"s":"Девяносто восемь делится на четырнадцать. Значит, лёгкую группу можно собрать из одних тяжёлых камней — семь камней по четырнадцать тонн."},{"b":1,"s":"Все остальные камни — во вторую группу: шесть тяжёлых и четыре лёгких, это ровно сто четыре тонны. Ответ: да."}],"rich":true},{"l":"б","q":"Можно ли разложить все эти камни на две группы, суммарные массы камней в которых равны?","ak":"yn","av":"НЕТ","steps":[{"w":["💡 **Идея:** если группы равны, каждая весит половину всей массы.","=202 : 2 = 101 т","✏️ Пусть в первой группе **x** камней по 5 т и **y** камней по 14 т (x — от 0 до 4).","=5x + 14y = 101"],"f":["lin_dioph"]},{"w":["🔎 **Перебираем x** — всего 5 вариантов. На тяжёлые камни остаётся 101 − 5x тонн, и это число должно делиться на 14:","|x|5x|101 − 5x|остаток при делении на 14|делится на 14?","|0|0|101|3|❌","|1|5|96|12|❌","|2|10|91|7|❌","|3|15|86|2|❌","|4|20|81|11|❌","✅ **Ответ: нет.**"],"f":["mod_cases"]}],"v":[{"b":0,"s":"Если группы равны, каждая весит половину от двухсот двух тонн, то есть сто одну тонну."},{"b":0,"s":"Обозначим через икс число лёгких камней в первой группе, а через игрек — число тяжёлых. Лёгких камней всего четыре, поэтому икс — от нуля до четырёх. Получаем уравнение: пять икс плюс четырнадцать игрек равно ста одному."},{"b":0,"f":"lin_dioph"},{"b":1,"s":"У икс всего пять значений, переберём их в таблице. Для каждого икс считаем, сколько тонн остаётся на тяжёлые камни, и смотрим остаток от деления на четырнадцать."},{"b":1,"f":"mod_cases"},{"b":1,"s":"В таблице ни в одной строке остаток не равен нулю. Значит, набрать сто одну тонну нельзя. Ответ: нет."}],"rich":true},{"l":"в","q":"Все камни хотят разложить на две группы. Какое наименьшее положительное значение (в тоннах) может принимать разность суммарных масс камней в этих группах?","ak":"num","av":"4","steps":[{"w":["💡 **Оценка.** Если в одной группе S т, то в другой 202 − S т. Разность:","=(202 − S) − S = 202 − 2S — **чётное** число","👉 Разность 0 невозможна (пункт б) ⇒ разность **не меньше 2**."],"f":["parity"]},{"w":["🔎 **Разность 2?** Тогда группы 100 т и 102 т. Ищем 5x + 14y = 100:","|x|100 − 5x|остаток при делении на 14|делится на 14?","|0|100|2|❌","|1|95|11|❌","|2|90|6|❌","|3|85|1|❌","|4|80|10|❌","❌ Разность 2 получить нельзя ⇒ разность **не меньше 4**."],"f":[]},{"w":["🔎 **Разность 4?** Тогда группы 99 т и 103 т. Ищем 5x + 14y = 99:","|x|99 − 5x|делится на 14?","|0|99|❌","|1|94|❌","|2|89|❌","|!3|84 = 6·14|✅","|4|79|❌","👉 **Пример:** 3 камня по 5 т и 6 камней по 14 т → 15 + 84 = **99 т**; остальные камни — **103 т**."],"f":[]},{"w":["✅ **Ответ: 4.**"],"f":["est_ex"]}],"v":[{"b":0,"s":"Пусть одна группа весит эс тонн, тогда другая — двести две минус эс. Разность равна двести две минус два эс. Это чётное число: из чётного вычитаем чётное."},{"b":0,"f":"parity"},{"b":0,"s":"Разность ноль мы уже исключили в пункте бэ. Значит, разность не меньше двух."},{"b":1,"s":"Проверим разность два. Тогда группы — сто и сто две тонны. Перебираем число лёгких камней в таблице: ни одно из чисел на четырнадцать не делится. Значит, разность не меньше четырёх."},{"b":2,"s":"Проверим разность четыре: группы девяносто девять и сто три тонны. В таблице есть подходящая строка: при трёх лёгких камнях остаётся восемьдесят четыре тонны — ровно шесть тяжёлых камней."},{"b":2,"s":"Итак, три камня по пять тонн и шесть по четырнадцать дают девяносто девять тонн, а все остальные камни — сто три тонны. Разность четыре получилась."},{"b":3,"s":"Мы доказали, что меньше четырёх быть не может, и показали, как получить четыре. Именно так оформляется задача на наименьшее значение."},{"b":3,"f":"est_ex"},{"b":3,"s":"Ответ: четыре."}],"rich":true}],"tags":["div","est"],"facts":["lin_dioph","mod_cases","parity","est_ex"],"note":"","n":1},{"id":"90090","d":1,"from":"PDF №005","stem":"Есть 16 монет по 2 рубля и 29 монет по 5 рублей.","parts":[{"l":"а","q":"Можно ли этими монетами набрать сумму 175 рублей?","ak":"yn","av":"ДА","steps":[{"w":["💡 Сколько денег всего?","=16·2 + 29·5 = 32 + 145 = 177 р."],"f":[]},{"w":["🔎 175 = 177 − 2: берём **все монеты, кроме одной двухрублёвой**.","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Сначала посчитаем все деньги: шестнадцать монет по два рубля — это тридцать два рубля, двадцать девять монет по пять — сто сорок пять. Всего сто семьдесят семь рублей."},{"b":1,"s":"Сто семьдесят пять — это на два рубля меньше. Просто отложим одну двухрублёвую монету, а все остальные возьмём. Ответ: да."}],"rich":true},{"l":"б","q":"Можно ли этими монетами набрать сумму 176 рублей?","ak":"yn","av":"НЕТ","steps":[{"w":["💡 176 = 177 − 1.","👉 Если взять монеты на 176 р., то **отложенные** монеты дают 177 − 176 = **1 р.**","❌ Но монеты в 1 рубль нет, а любая отложенная монета — это хотя бы 2 р.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Удобно смотреть не на взятые монеты, а на отложенные. Если мы взяли сто семьдесят шесть рублей, то отложили ровно один рубль."},{"b":0,"s":"Но рублёвых монет нет: любая отложенная монета — это два или пять рублей. Отложить ровно один рубль невозможно. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое наименьшее количество монет, каждая по 1 рублю, нужно добавить, чтобы иметь возможность набрать любую целую сумму от 1 рубля до 180 рублей включительно?","ak":"num","av":"3","steps":[{"w":["💡 **Оценка.** Чтобы набрать 180 р., всего денег должно быть не меньше 180:","=177 + k ≥ 180  ⇒  k ≥ 3"],"f":["est_ex"]},{"w":["🔎 **Пример: добавим 3 монеты по 1 р.** Как набрать любую сумму s от 1 до 180:","1️⃣ Берём пятирублёвые, пока можно (но не больше 29).","2️⃣ Остаток добираем двухрублёвыми, пока можно (но не больше 16).","3️⃣ То, что осталось, добираем рублёвыми."],"f":[]},{"w":["🤔 **Почему в конце не больше 3 рублей?**","|что произошло|сколько осталось добрать|чем добираем","|пятирублёвые не кончились|остаток от деления на 5: 0, 1, 2, 3 или 4|0 → ничего, 1 → 1, 2 → 2, 3 → 2 + 1, 4 → 2 + 2","|пятирублёвые кончились, двухрублёвые — нет|0 или 1|1 → одна рублёвая","|!кончились и те, и другие|отдали уже 177 р., осталось s − 177 ≤ 180 − 177 = 3|до трёх рублёвых","👉 Значит, трёх рублёвых монет всегда хватает.","💡 Например: 180 = 29·5 + 16·2 + 3·1."],"f":[]},{"w":["✅ **Ответ: 3.**"],"f":[]}],"v":[{"b":0,"s":"Сначала оценка. Чтобы набрать сто восемьдесят рублей, всех денег должно быть хотя бы сто восемьдесят. У нас сто семьдесят семь, значит, нужно добавить не меньше трёх рублёвых монет."},{"b":0,"f":"est_ex"},{"b":1,"s":"Теперь пример. Добавим три монеты по рублю и покажем, как набрать любую сумму. Сначала берём пятирублёвые монеты, сколько можно. Потом добираем двухрублёвыми. А то, что осталось, — рублёвыми."},{"b":2,"s":"Осталось понять, почему в самом конце не хватает не больше трёх рублей. Смотрите на таблицу. Если пятирублёвые не кончились, то мы взяли их столько, сколько помещается в сумму, и недобрали меньше пяти рублей. Такой остаток набирается двушками и одной рублёвой монетой."},{"b":2,"s":"Если пятирублёвые кончились, а двухрублёвые ещё есть, то двушками мы добрали всё, кроме, может быть, одного рубля. Его даём рублёвой монетой."},{"b":2,"s":"А если кончились и те и другие, то мы уже отдали все сто семьдесят семь рублей. Сумма не больше ста восьмидесяти, значит, осталось не больше трёх рублей — как раз три рублёвые монеты."},{"b":3,"s":"Итак, меньше трёх монет не хватит, а трёх достаточно. Ответ: три."}],"rich":true}],"tags":["est"],"facts":["lin_dioph","est_ex"],"note":"","n":2},{"id":"88570","d":1,"from":"PDF №010","stem":"В продуктовом магазине есть весы с двумя чашами. На одну чашу весов кладут только продукты, на другую — гири. На чашу для гирь можно положить несколько гирь. Магазину разрешено продавать только целое число килограммов продуктов.","parts":[{"l":"а","q":"Можно ли некоторым набором из пяти гирь отвесить любое целое число килограммов от 1 до 25?","ak":"yn","av":"ДА","steps":[{"w":["🔎 **Подбираем гири по одной.** Каждый раз берём самую тяжёлую гирю, при которой не будет пропусков:","|гиря|набор|какие веса отвешиваем","|1|1|1","|2|1, 2|1 … 3","|4|1, 2, 4|1 … 7","|8|1, 2, 4, 8|1 … 15","|!16|1, 2, 4, 8, 16|1 … 31","👉 Гири — **степени двойки**: 1, 2, 4, 8, 16. Пять гирь отвешивают всё от 1 до 31, в том числе от 1 до 25.","✅ **Ответ: да.**"],"f":["pow2"]},{"w":["📝 **Замечание.** Если бы гири можно было класть **на обе чаши**, хватило бы **степеней тройки**: 1, 3, 9, 27…","👉 Гиря на чаше с продуктом **вычитается**:","=2 = 3 − 1  (на одной чаше гиря 3, на другой — продукт и гиря 1)","=5 = 9 − 3 − 1,     7 = 9 − 3 + 1","👉 Гирями 1, 3, 9 отвешивается всё от 1 до 13. В нашей задаче так нельзя: гири кладут только на одну чашу."],"f":[]}],"v":[{"b":0,"s":"Будем подбирать гири по одной. Гиря в один килограмм нам понадобится точно, иначе один килограмм не отвесить."},{"b":0,"s":"Какую взять вторую? Можно снова взять единицу, но тогда гири растут слишком медленно, и до двадцати пяти пятью гирями не дотянуть. Поэтому возьмём два: теперь отвешиваем один, два и три."},{"b":0,"s":"Гирю три брать не нужно: три мы уже отвешиваем как один плюс два. Берём четыре — теперь получается всё до семи. Дальше восемь — всё до пятнадцати. И наконец шестнадцать — всё до тридцати одного."},{"b":0,"s":"Посмотрите на столбец гирь: один, два, четыре, восемь, шестнадцать. Это степени двойки."},{"b":0,"f":"pow2"},{"b":0,"s":"Пятью такими гирями отвешивается любой вес от одного до тридцати одного, а значит, и от одного до двадцати пяти. Ответ: да."},{"b":1,"s":"Небольшое замечание. Если бы гири разрешалось класть на обе чаши, хватило бы степеней тройки: один, три, девять. Гиря на чаше с продуктом как бы вычитается. Например, два килограмма: на одну чашу гирю три, на другую — продукт и гирю один."},{"b":1,"s":"Так гирями один, три и девять можно отвесить всё от одного до тринадцати. Но в нашей задаче гири кладут только на одну чашу, поэтому нужны степени двойки."}],"rich":true},{"l":"б","q":"Можно ли некоторым набором из четырех гирь отвесить любое целое число килограммов от 1 до 25?","ak":"yn","av":"НЕТ","steps":[{"w":["💡 Каждая гиря либо лежит на чаше, либо нет — **2 варианта**.","=2·2·2·2 = 16 наборов","👉 Один из них пустой ⇒ **непустых наборов 15**."],"f":[]},{"w":["❌ Разных весов — не больше 15, а нужно отвесить 25 разных весов.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Посчитаем, сколько вообще разных наборов можно положить на чашу. Каждая из четырёх гирь либо лежит, либо не лежит — два варианта. Всего два на два на два на два — шестнадцать наборов."},{"b":0,"s":"Один из них — пустой, он ничего не взвешивает. Остаётся пятнадцать наборов."},{"b":1,"s":"Каждый набор даёт один вес, значит, разных весов не больше пятнадцати. А нужно двадцать пять разных весов. Ответ: нет."}],"rich":true},{"l":"в","q":"Найдите наибольшее значение n такое, что любой вес от 1 до n килограммов можно отвесить каким-нибудь набором из пяти гирь.","ak":"num","av":"31","steps":[{"w":["💡 **Оценка.** Из 5 гирь — не больше 2⁵ − 1 = 31 непустого набора ⇒ не больше 31 разного веса ⇒ **n ≤ 31**."],"f":[]},{"w":["🔎 **Пример:** гири 1, 2, 4, 8, 16 отвешивают все веса от 1 до 31 (пункт а).","✅ **Ответ: 31.**"],"f":["est_ex"]}],"v":[{"b":0,"s":"Рассуждаем, как в пункте бэ. У пяти гирь два в пятой, то есть тридцать два набора, и один из них пустой. Значит, разных весов не больше тридцати одного, и эн не больше тридцати одного."},{"b":1,"s":"А пример у нас уже есть из пункта а: гири один, два, четыре, восемь и шестнадцать дают все веса до тридцати одного."},{"b":1,"f":"est_ex"},{"b":1,"s":"Ответ: тридцать один."}],"rich":true}],"tags":["est","seq"],"facts":["pow2","est_ex"],"note":"","n":3},{"id":"21797","d":1,"from":"PDF №064","stem":"За прохождение каждого уровня игры на планшете можно получить от одной до трёх звёзд. При этом заряд аккумулятора планшета уменьшается на 3 пункта при получении трёх звёзд, на 6 пунктов при получении двух звёзд и на 9 пунктов при получении одной звезды. Витя прошёл несколько уровней игры подряд.","parts":[{"l":"а","q":"Мог ли заряд аккумулятора уменьшиться ровно на 32 пункта? Считайте, что максимальный заряд планшета достаточно большой.","ak":"yn","av":"НЕТ","steps":[{"w":["✏️ Пусть x уровней пройдено на 3 звезды, y — на 2, z — на 1. Тогда","=3x + 6y + 9z = 32"],"f":[]},{"w":["🔎 Каждое слагаемое слева делится на 3 ⇒ **левая часть делится на 3**.","❌ 32 на 3 не делится (32 = 3·10 + 2).","✅ **Ответ: нет.**"],"f":["div_sum"]}],"v":[{"b":0,"s":"Обозначим через икс число уровней, пройденных на три звезды, через игрек — на две звезды, через зэт — на одну. За три звезды заряд падает на три, за две — на шесть, за одну — на девять. Получаем уравнение: три икс плюс шесть игрек плюс девять зэт равно тридцати двум."},{"b":1,"s":"Три, шесть и девять делятся на три. Значит, вся левая часть делится на три."},{"b":1,"f":"div_sum"},{"b":1,"s":"А тридцать два на три не делится. Равенство невозможно. Ответ: нет."}],"rich":true},{"l":"б","q":"Сколько уровней игры было пройдено, если заряд аккумулятора уменьшился на 33 пункта и суммарно было получено 17 звёзд?","ak":"num","av":"7","steps":[{"w":["✏️ x, y, z — уровни на 3, 2 и 1 звезду.","{3x + 6y + 9z = 33   (заряд)","{3x + 2y + z = 17   (звёзды)","👉 Первое делим на 3:  x + 2y + 3z = 11"],"f":["lin_dioph"]},{"w":["🔎 **Складываем** два уравнения:","=(x + 2y + 3z) + (3x + 2y + z) = 11 + 17","=4x + 4y + 4z = 28","👉 Делим на 4:","=x + y + z = 7","✅ **Ответ: 7.**"],"f":[]}],"v":[{"b":0,"s":"Обозначения те же: икс, игрек и зэт — уровни на три, две и одну звезду. Первое уравнение — про заряд, второе — про звёзды. Первое уравнение делим на три, оно становится проще."},{"b":0,"f":"lin_dioph"},{"b":1,"s":"Заметим, что если сложить два уравнения, у каждой переменной получится коэффициент четыре. Складываем: четыре икс плюс четыре игрек плюс четыре зэт равно двадцати восьми."},{"b":1,"s":"Делим на четыре: икс плюс игрек плюс зэт равно семи. А это и есть число уровней. Ответ: семь."}],"rich":true},{"l":"в","q":"За пройденный уровень начисляется 9000 очков при получении трёх звёзд, 5000 — при получении двух звёзд и 2000 — при получении одной звезды. Какое наибольшее количество очков мог получить Витя, если заряд аккумулятора уменьшился на 33 пункта и суммарно было получено 17 звёзд?","ak":"num","av":"49000","steps":[{"w":["✏️ **Выразим всё через x.** Вычтем из x + 2y + 3z = 11 уравнение x + y + z = 7:","=y + 2z = 4","👉 Подставим y = 7 − x − z:  7 − x − z + 2z = 4","{z = x − 3","{y = 10 − 2x","👉 y ≥ 0 и z ≥ 0  ⇒  **3 ≤ x ≤ 5**.","=очки = 9000x + 5000(10 − 2x) + 2000(x − 3) = 44000 + 1000x"],"f":[]},{"w":["🔎 **Способ 1: подставим все три x** в таблицу:","|x|y = 10 − 2x|z = x − 3|очки","|3|4|0|47 000","|4|2|1|48 000","|!5|0|2|49 000"],"f":[]},{"w":["🔎 **Способ 2: линейная функция.** 44000 + 1000x — коэффициент при x **положительный** (угловой коэффициент, или производная, равен 1000 > 0) ⇒ функция **возрастает** ⇒ максимум при **наибольшем x = 5**.","👉 Подставляем x = 5:","=y = 10 − 2·5 = 0,     z = 5 − 3 = 2","=9000·5 + 2000·2 = 49 000","✔️ Проверка: заряд 15 + 18 = 33, звёзды 15 + 2 = 17.","✅ **Ответ: 49 000.**"],"f":["est_ex"]}],"v":[{"b":0,"s":"Используем то, что уже знаем из пункта бэ: икс плюс игрек плюс зэт равно семи. Вычтем это из уравнения икс плюс два игрек плюс три зэт равно одиннадцати: остаётся игрек плюс два зэт равно четырём."},{"b":0,"s":"Подставив игрек, получаем: зэт равно икс минус три, а игрек равно десять минус два икс. Количества не бывают отрицательными, поэтому икс от трёх до пяти."},{"b":0,"s":"Теперь запишем очки через икс. После раскрытия скобок получается сорок четыре тысячи плюс тысяча икс."},{"b":1,"s":"Первый способ — просто подставить все три значения икс. В таблице видно: больше всего очков при икс, равном пяти, — сорок девять тысяч."},{"b":2,"s":"Второй способ. Очки — это линейная функция от икс, и коэффициент при икс положительный, тысяча. Можно сказать и так: производная равна тысяче, она больше нуля. Значит, функция возрастает, и наибольшее значение — при самом большом икс, то есть при пяти."},{"b":2,"s":"Подставим икс равно пяти в выражения для игрек и зэт: игрек равен нулю, зэт равен двум. Пять уровней на три звезды и два уровня на одну звезду дают сорок девять тысяч очков."},{"b":2,"f":"est_ex"},{"b":2,"s":"Ответ: сорок девять тысяч."}],"rich":true}],"tags":["eq"],"facts":["lin_dioph","div_def","est_ex"],"note":"","n":4},{"id":"23760","d":1,"from":"Школково","stem":"На доске написано 30 различных натуральных чисел, каждое из которых либо чётное, либо его десятичная запись оканчивается на цифру 7. Сумма написанных чисел равна 810.","parts":[{"l":"а","q":"Может ли на доске быть ровно 24 чётных числа?","ak":"yn","av":"ДА","steps":[{"w":["💡 **Наименьшая возможная сумма.** Все числа различны — берём самые маленькие:","👉 24 чётных: 2 + 4 + … + 48 = 2·(1 + 2 + … + 24) = 2·300 = **600**","👉 6 чисел на 7: 7 + 17 + 27 + 37 + 47 + 57 = **192**","=600 + 192 = 792 ≤ 810"],"f":["distinct_min"]},{"w":["🔎 **Добавим недостающее:** 810 − 792 = 18. Увеличим самое большое чётное число:","=48 → 48 + 18 = 66","👉 Числа остаются различными, чётность не изменилась, сумма стала 810.","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Числа различные, поэтому их сумма не может быть слишком маленькой. Возьмём самые маленькие подходящие числа и посмотрим, не получится ли больше восьмисот десяти."},{"b":0,"f":"distinct_min"},{"b":0,"s":"Двадцать четыре самых маленьких чётных числа — от двух до сорока восьми, их сумма шестьсот. Шесть самых маленьких чисел, оканчивающихся на семь, — от семи до пятидесяти семи, их сумма сто девяносто два."},{"b":0,"s":"Вместе семьсот девяносто два. Это меньше восьмисот десяти, значит, запас есть."},{"b":1,"s":"Не хватает восемнадцати. Прибавим их к самому большому чётному числу: сорок восемь превращается в шестьдесят шесть. Оно чётное и ни с чем не совпадает. Сумма стала ровно восемьсот десять. Ответ: да."}],"rich":true}],"tags":["est"],"facts":["parity","distinct_min"],"note":"","n":5},{"id":"43735","d":1,"from":"Школково","stem":"Красный карандаш стоит 17 рублей, синий — 13 рублей. Нужно купить карандаши, имея всего 495 рублей и соблюдая дополнительное условие: число синих карандашей не должно отличаться от числа красных карандашей больше чем на пять.","parts":[{"l":"а","q":"Можно ли купить при таких условиях 32 карандаша?","ak":"yn","av":"ДА","steps":[{"w":["✏️ Пусть красных **r**, синих 32 − r. Стоимость:","=17r + 13(32 − r) = 416 + 4r","👉 Разница количеств не больше 5."],"f":[]},{"w":["🔎 **Все варианты:**","|красных|синих|разница|стоимость|подходит?","|-13|19|6|468|❌ разница > 5","|!14|18|4|472|✅","|!15|17|2|476|✅","|!16|16|0|480|✅","|!17|15|2|484|✅","|!18|14|4|488|✅","|-19|13|6|492|❌ разница > 5","👉 Например, **14 красных и 18 синих** за 472 р.","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Пусть красных карандашей эр, тогда синих тридцать два минус эр. Стоимость удобно записать так: четыреста шестнадцать плюс четыре эр. Каждый красный вместо синего добавляет четыре рубля."},{"b":1,"s":"Составим таблицу всех вариантов. Разница количеств не больше пяти, поэтому красных от четырнадцати до восемнадцати. Строки, где разница больше пяти, зачёркнуты."},{"b":1,"s":"Посмотрите на стоимость в выделенных строках: везде не больше четырёхсот девяноста пяти. Подходит, например, четырнадцать красных и восемнадцать синих. Ответ: да."}],"rich":true},{"l":"б","q":"Можно ли купить при таких условиях 35 карандашей?","ak":"yn","av":"НЕТ","steps":[{"w":["✏️ Красных **r**, синих 35 − r. Стоимость:","=17r + 13(35 − r) = 455 + 4r"],"f":[]},{"w":["🔎 **Все варианты с разницей не больше 5:**","|красных|синих|разница|стоимость|подходит?","|-14|21|7|511|❌ разница > 5","|15|20|5|515|❌ > 495","|16|19|3|519|❌ > 495","|17|18|1|523|❌ > 495","|18|17|1|527|❌ > 495","|19|16|3|531|❌ > 495","|20|15|5|535|❌ > 495","❌ Во всех строках стоимость больше 495 р.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Делаем так же: красных эр, синих тридцать пять минус эр, стоимость — четыреста пятьдесят пять плюс четыре эр."},{"b":1,"s":"Из-за условия на разницу красных от пятнадцати до двадцати. В таблице видно, что даже самый дешёвый вариант, пятнадцать красных и двадцать синих, стоит пятьсот пятнадцать рублей. Это больше четырёхсот девяноста пяти. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое наибольшее число карандашей можно купить при таких условиях?","ak":"num","av":"33","steps":[{"w":["💡 **Оценка.** Пусть всего n карандашей, красных r. Стоимость 13n + 4r.","👉 Синих не больше, чем красных + 5 ⇒ r ≥ (n − 5) : 2.","=стоимость ≥ 13n + 2(n − 5) = 15n − 10","👉 При n ≥ 34: 15·34 − 10 = 500 > 495 ⇒ **34 и больше нельзя**."],"f":[]},{"w":["🔎 **34 карандаша** — проверим таблицей:","|красных|синих|стоимость","|15|19|502 ❌","|16|18|506 ❌","|17|17|510 ❌","|18|16|514 ❌","|19|15|518 ❌"],"f":[]},{"w":["🔎 **33 карандаша:** стоимость 429 + 4r.","|красных|синих|разница|стоимость|подходит?","|!14|19|5|485|✅","|!15|18|3|489|✅","|!16|17|1|493|✅","|17|16|1|497|❌ > 495","|18|15|3|501|❌ > 495","|19|14|5|505|❌ > 495","👉 Пример: **14 красных и 19 синих** за 485 р.","✅ **Ответ: 33.**"],"f":["est_ex"]}],"v":[{"b":0,"s":"Сначала оценка. Пусть всего эн карандашей, из них эр красных. Стоимость — тринадцать эн плюс четыре эр. Синих не больше, чем красных плюс пять, поэтому красных не меньше половины от эн минус пять."},{"b":0,"s":"Значит, стоимость не меньше пятнадцати эн минус десять. Уже при тридцати четырёх карандашах это пятьсот рублей — больше, чем у нас есть. А чем больше карандашей, тем дороже."},{"b":1,"s":"Для наглядности вот таблица для тридцати четырёх карандашей: все варианты дороже четырёхсот девяноста пяти."},{"b":2,"s":"А тридцать три карандаша купить можно. В таблице выделены три подходящих варианта, например четырнадцать красных и девятнадцать синих за четыреста восемьдесят пять рублей."},{"b":2,"f":"est_ex"},{"b":2,"s":"Ответ: тридцать три."}],"rich":true}],"tags":["eq"],"facts":["lin_dioph","est_ex"],"note":"","n":6},{"id":"44861","d":1,"from":"Школково","stem":"Петя участвовал в викторине по истории. За каждый правильный ответ участнику начисляется 8 баллов, за каждый неверный — списывается 8 баллов, за отсутствие ответа списывается 3 балла. По результатам викторины Петя набрал 35 баллов.","parts":[{"l":"а","q":"На сколько вопросов Петя не дал ответа, если в викторине 30 вопросов?","ak":"num","av":"7","steps":[{"w":["✏️ x — верных ответов, y — неверных, z — без ответа.","=8x − 8y − 3z = 35","👉 Переносим 3z вправо и выносим 8:","=8(x − y) = 35 + 3z","👉 Левая часть делится на 8 ⇒ **35 + 3z делится на 8**.","👉 35 = 32 + 3 даёт остаток 3 ⇒ **3z должно давать остаток 5**."],"f":["mod_def"]},{"w":["🔎 **Таблица остатков:**","|z|3z|остаток при делении на 8","|0|0|0","|1|3|3","|2|6|6","|3|9|1","|4|12|4","|5|15|7","|6|18|2","|!7|21|5","👉 Остатки повторяются через 8 ⇒ **z = 7, 15, 23** (z ≤ 30)."],"f":["mod_cases"]},{"w":["🔎 **Решаем систему** для каждого z:","{x + y = 30 − z","{x − y = (35 + 3z) : 8","|z|x + y|x − y|x|y|подходит?","|!7|23|7|15|8|✅","|15|15|10|12,5|2,5|❌ не целые","|23|7|13|10|−3|❌ y \u003c 0","✅ **Ответ: 7.**"],"f":[]}],"v":[{"b":0,"s":"Обозначим: икс — правильные ответы, игрек — неправильные, зэт — вопросы без ответа. За правильный плюс восемь, за неправильный минус восемь, за пропуск минус три. Получаем уравнение: восемь икс минус восемь игрек минус три зэт равно тридцати пяти."},{"b":0,"s":"Перенесём три зэт вправо и вынесем восьмёрку слева: восемь, умноженное на икс минус игрек, равно тридцать пять плюс три зэт. Левая часть делится на восемь, значит, и правая должна делиться на восемь."},{"b":0,"f":"mod_def"},{"b":0,"s":"Тридцать пять при делении на восемь даёт остаток три. Чтобы вместе получилось кратное восьми, три зэт должно давать остаток пять."},{"b":1,"s":"Составим таблицу остатков. Нужный остаток пять получается при зэт, равном семи. Дальше остатки повторяются через восемь, поэтому подходят зэт равно семи, пятнадцати и двадцати трём."},{"b":1,"f":"mod_cases"},{"b":2,"s":"Теперь для каждого зэт составим систему: сумма икс и игрек — это оставшиеся вопросы, а разность находим из уравнения. Решаем её: икс — полусумма, игрек — полуразность."},{"b":2,"s":"По таблице подходит только зэт, равное семи: пятнадцать правильных и восемь неправильных. Ответ: семь."}],"rich":true},{"l":"б","q":"На сколько вопросов Петя не дал ответа, если в викторине 35 вопросов?","ak":"num","av":"15","steps":[{"w":["✏️ Теперь x + y = 35 − z, а z = 7, 15, 23 или 31.","|z|x + y|x − y|x|y|подходит?","|7|28|7|17,5|10,5|❌","|!15|20|10|15|5|✅","|23|12|13|12,5|−0,5|❌","|31|4|16|10|−6|❌","✅ **Ответ: 15.**"],"f":[]}],"v":[{"b":0,"s":"Возможные зэт мы нашли в пункте а; теперь вопросов тридцать пять, поэтому добавляется зэт, равное тридцати одному. Заполняем таблицу так же."},{"b":0,"s":"Из таблицы: подходит только зэт, равное пятнадцати. Ответ: пятнадцать."}],"rich":true},{"l":"в","q":"На сколько вопросов Петя ответил правильно, если в викторине 33 вопроса?","ak":"num","av":"14","steps":[{"w":["✏️ x + y = 33 − z, z = 7, 15, 23 или 31.","|z|x + y|x − y|x|y|подходит?","|7|26|7|16,5|9,5|❌","|!15|18|10|14|4|✅","|23|10|13|11,5|−1,5|❌","|31|2|16|9|−7|❌","✅ **Ответ: 14.**"],"f":[]}],"v":[{"b":0,"s":"Вопросов тридцать три. Заполняем ту же таблицу."},{"b":0,"s":"Из таблицы: подходит только зэт, равное пятнадцати, и тогда правильных ответов четырнадцать. Ответ: четырнадцать."}],"rich":true}],"tags":["eq"],"facts":["lin_dioph","mod_cases"],"note":"","n":7},{"id":"65028","d":1,"from":"Школково","stem":"Дано квадратное уравнение x² − px + q = 0 с натуральными коэффициентами p и q и натуральными корнями x₁ и x₂.","parts":[{"l":"а","q":"Найдите все различные значения p, если q = 4.","ak":"set","av":"4;5","steps":[{"w":["💡 По теореме Виета для x² − px + q = 0:","=x₁ + x₂ = p,     x₁·x₂ = q"],"f":["vieta"]},{"w":["🔎 q = 4 — раскладываем 4 в произведение натуральных чисел:","|x₁|x₂|q = x₁·x₂|p = x₁ + x₂","|1|4|4|**5**","|2|2|4|**4**","✅ **Ответ: 4; 5.**"],"f":[]}],"v":[{"b":0,"s":"Свяжем корни с коэффициентами. У нашего уравнения перед пэ стоит минус, поэтому сумма корней равна пэ, а произведение равно ку."},{"b":0,"f":"vieta"},{"b":1,"s":"Произведение корней равно четырём. Натуральных разложений два: один на четыре и два на два. Суммы — пять и четыре. Ответ: четыре и пять."}],"rich":true},{"l":"б","q":"Может ли быть p \u003c 8, если q > 20?","ak":"yn","av":"НЕТ","steps":[{"w":["💡 p \u003c 8 ⇒ сумма корней **не больше 7**. Какое наибольшее произведение?"],"f":[]},{"w":["🔎 **Способ 1: перебор.** При сумме 7:","|x₁|x₂|сумма|произведение","|1|6|7|6","|2|5|7|10","|!3|4|7|12","👉 При меньшей сумме произведение ещё меньше (если увеличить один корень, произведение растёт).","❌ Наибольшее произведение 12 \u003c 20."],"f":[]},{"w":["🔎 **Способ 2:** при фиксированной сумме произведение наибольшее, когда числа равны или ближе всего друг к другу:","=x₁·x₂ ≤ ((x₁ + x₂) : 2)² ≤ 3,5² = 12,25 \u003c 20","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Если пэ меньше восьми, то сумма корней не больше семи. Нужно понять, может ли при этом произведение быть больше двадцати."},{"b":1,"s":"Переберём пары корней с суммой семь: один и шесть, два и пять, три и четыре. Произведения шесть, десять и двенадцать. Если сумма меньше, произведение ещё меньше. Значит, больше двенадцати не бывает, а нужно больше двадцати."},{"b":2,"s":"Второй способ: при постоянной сумме произведение наибольшее, когда числа равны. Половина от семи — три с половиной, а её квадрат — двенадцать с четвертью. Это меньше двадцати. Ответ: нет."}],"rich":true},{"l":"в","q
