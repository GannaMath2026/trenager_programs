аленькие из них дают слишком много:","=4 + 14 + 24 + … + 254 = 3354 > 2786","✅ **Ответ: нет.**"],"f":["distinct_min"]}],"v":[{"b":0,"s":"Если на восемь оканчиваются ровно четыре числа, то на четыре — двадцать шесть, и они все разные."},{"b":0,"f":"distinct_min"},{"b":0,"s":"Возьмём самые маленькие двадцать шесть разных чисел, оканчивающихся на четыре: четыре, четырнадцать и так далее до двухсот пятидесяти четырёх. Даже их сумма больше двух тысяч семисот восьмидесяти шести. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое наименьшее количество чисел, оканчивающихся на 8, может быть на доске?","ak":"num","av":"9","steps":[{"w":["✏️ Пусть **k** чисел оканчиваются на 8, а 30 − k — на 4.","📌 Последняя цифра суммы должна быть 6:","=4·(30 − k) + 8k = 120 + 4k  →  k = 4, 9, 14, …","❌ k = 4 нельзя (пункт б) → **k ≥ 9**."],"f":[]},{"w":["🔎 **k = 9** — проверим самые маленькие числа:","=(4 + 14 + … + 204) + (8 + 18 + … + 88) = 2184 + 432 = 2616 ≤ 2786 ✔️"],"f":[]},{"w":["🔨 **Пример:** не хватает 170 → увеличим 88 до 258:","=4, 14, …, 204   и   8, 18, …, 78, 258","✅ **Ответ: 9.**"],"f":[]}],"v":[{"b":0,"s":"Пусть ка чисел оканчиваются на восемь. Посмотрим, при каких ка последняя цифра суммы будет шесть. Считаем последнюю цифру выражения в решении — подходят ка, равные четырём, девяти, четырнадцати и так далее."},{"b":0,"s":"Четыре мы уже исключили в пункте бэ. Значит, чисел на восемь не меньше девяти."},{"b":1,"s":"Проверим, получится ли девять. Возьмём самые маленькие подходящие числа: двадцать одно число на четыре и девять чисел на восемь. Их сумма две тысячи шестьсот шестнадцать — меньше нужной, значит, место есть."},{"b":2,"s":"Не хватает ста семидесяти. Добавим их к самому большому числу на восемь: вместо восьмидесяти восьми напишем двести пятьдесят восемь. Сумма стала ровно нужной. Ответ: девять."}],"rich":true}],"tags":["digits"],"facts":["last_digit","distinct_min","est_ex"],"note":"","n":33},{"id":"1099","d":2,"from":"Школково","stem":"На доске написано несколько различных натуральных чисел, причем любые два из них отличаются не более чем в 3 раза.","parts":[{"l":"а","q":"Может ли на доске быть написано 5 чисел, сумма которых равна 47?","ak":"yn","av":"ДА","steps":[{"w":["🔨 **Пример:** 7, 8, 9, 10, 13","=7 + 8 + 9 + 10 + 13 = 47,     13 ≤ 3·7 ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Пять чисел с суммой сорок семь — в среднем около девяти. Возьмём числа рядом с девятью: семь, восемь, девять, десять и тринадцать. Сумма сорок семь, а самое большое меньше, чем три раза самое маленькое. Ответ: да."}],"rich":true},{"l":"б","q":"Может ли на доске быть написано 10 чисел, сумма которых равна 94?","ak":"yn","av":"НЕТ","steps":[{"w":["✏️ Пусть **m** — наименьшее число. Все числа от m до 3m.","📌 10 различных чисел помещаются, только если 2m + 1 ≥ 10 → **m ≥ 5**."],"f":[]},{"w":["📌 Сумма не меньше суммы 10 чисел подряд, начиная с m:","=m + (m + 1) + … + (m + 9) = 10m + 45 ≥ 95 > 94","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Пусть эм — самое маленькое число. Тогда все числа лежат от эм до трёх эм. На этом отрезке всего два эм плюс одно целое число, а нам нужно разместить десять разных. Значит, эм хотя бы пять."},{"b":1,"s":"Числа разные, поэтому их сумма не меньше суммы десяти чисел подряд, начиная с эм. Это десять эм плюс сорок пять, то есть не меньше девяноста пяти. А нужно девяносто четыре. Ответ: нет."}],"rich":true},{"l":"в","q":"Сколько чисел может быть написано на доске, если их произведение равно 8000?","ak":"set","av":"2;3","steps":[{"w":["📌 Разложение:","=8000 = 2⁶·5³","🔨 **Два числа:** 80 и 100 (100 ≤ 3·80)","🔨 **Три числа:** 16, 20, 25"],"f":[]},{"w":["📏 **Четыре и больше:** наименьшее число не больше 8, все остальные — не больше утроенного наименьшего.","👉 Перебор делителей 8000 в таких пределах показывает: произведение 8000 не получается."],"f":[]},{"w":["✅ **Ответ: 2 или 3.**"],"f":[]}],"v":[{"b":0,"s":"Разложим восемь тысяч на простые множители: две в шестой степени и пять в кубе. Подберём примеры. Два числа — восемьдесят и сто: они отличаются меньше чем в три раза. Три числа — шестнадцать, двадцать и двадцать пять."},{"b":1,"s":"А четыре числа уже не получится. Если чисел хотя бы четыре, то самое маленькое не больше восьми — иначе произведение было бы больше восьми тысяч. Тогда остальные числа не больше двадцати четырёх, и это делители восьми тысяч. Их немного, и перебор показывает, что нужное произведение не собирается."},{"b":2,"s":"Значит, на доске может быть два или три числа. Ответ: два или три."}],"rich":true}],"tags":["est","div"],"facts":["fta","distinct_min","est_ex"],"note":"","n":34},{"id":"2060","d":2,"from":"Школково","stem":"На доске написаны числа 1, 2, 3,…, 30. За один ход разрешается стереть три числа, сумма которых меньше 35 и отлична от каждой из сумм троек чисел, стёртых на предыдущих ходах.","parts":[{"l":"а","q":"Приведите пример 5 ходов.","ak":"self","av":"Например: (1, 14, 15), (2, 12, 13), (3, 10, 11), (4, 8, 9), (5, 6, 7) — суммы 30, 27, 24, 21, 18.","steps":[{"w":["💡 **Идея:** берём тройки из **соседних** чисел — суммы получаются разными.","=(1, 14, 15) = 30,   (2, 12, 13) = 27","=(3, 10, 11) = 24,   (4, 8, 9) = 21,   (5, 6, 7) = 18","✔️ Все суммы разные и меньше 35."],"f":[]}],"v":[{"b":0,"s":"Нужно пять троек с разными суммами меньше тридцати пяти. Возьмём каждый раз одно маленькое число и два соседних побольше: один, четырнадцать, пятнадцать; потом два, двенадцать, тринадцать и так далее."},{"b":0,"s":"Суммы получаются тридцать, двадцать семь, двадцать четыре, двадцать один и восемнадцать — все разные и меньше тридцати пяти."}],"rich":true},{"l":"б","q":"Можно ли сделать 10 ходов?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 10 ходов → стёрты **все** 30 чисел:","=1 + 2 + … + 30 = 465"],"f":["sum_1n"]},{"w":["📌 10 разных сумм, каждая меньше 35 — вместе не больше","=34 + 33 + … + 25 = 295 \u003c 465","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"За десять ходов стираются все тридцать чисел, и сумма всех стёртых — четыреста шестьдесят пять."},{"b":0,"f":"sum_1n"},{"b":1,"s":"С другой стороны, это десять разных сумм, каждая не больше тридцати четырёх. Самое большее — тридцать четыре, тридцать три и так далее до двадцати пяти, всего двести девяносто пять. Мало. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое наибольшее число ходов можно сделать?","ak":"num","av":"6","steps":[{"w":["📏 **Оценка.** За k ходов стёрто 3k разных чисел:","=сумма ≥ 1 + 2 + … + 3k","📌 А k разных сумм не больше 34 + 33 + … + (35 − k).","=3(3k + 1) ≤ 69 − k   →   k ≤ 6"],"f":[]},{"w":["🔨 **Пример на 6 ходов:**","=(5, 11, 14) = 30,   (3, 13, 17) = 33,   (2, 7, 15) = 24","=(4, 8, 9) = 21,   (1, 10, 18) = 29,   (6, 12, 16) = 34","✅ **Ответ: 6.**"],"f":[]}],"v":[{"b":0,"s":"Ищем наибольшее число ходов — оценка плюс пример. Рассуждаем как в пункте бэ, но для ка ходов."},{"b":0,"s":"С одной стороны, стёрто три ка разных чисел, их сумма не меньше суммы чисел от одного до три ка. С другой стороны, ка разных сумм, каждая меньше тридцати пяти. Сравнивая, получаем неравенство из решения, и из него ка не больше шести."},{"b":1,"s":"Пример на шесть ходов выписан в решении: шесть троек с разными суммами, все меньше тридцати пяти. Ответ: шесть."}],"rich":true}],"tags":["est"],"facts":["sum_1n","est_ex"],"note":"","n":35},{"id":"2061","d":2,"from":"Школково","stem":"Множество чисел назовём хорошим, если его можно разбить на два подмножества с одинаковой суммой чисел.","parts":[{"l":"а","q":"Является ли множество {100;101;102;...;199} хорошим?","ak":"yn","av":"ДА","steps":[{"w":["💡 **Идея:** в четырёх числах подряд a, a + 1, a + 2, a + 3:","=a + (a + 3) = (a + 1) + (a + 2)","📌 100 чисел = 25 четвёрок. В каждой: **крайние** — в одну группу, **средние** — в другую.","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Посмотрим на четыре числа подряд. Сумма двух крайних равна сумме двух средних."},{"b":0,"s":"Числа от ста до ста девяноста девяти — это ровно двадцать пять таких четвёрок. В каждой четвёрке крайние числа кладём в первую группу, а средние — во вторую. Суммы групп получаются равными. Ответ: да."}],"rich":true},{"l":"б","q":"Является ли множество {2;4;8;...;2200} хорошим?","ak":"yn","av":"НЕТ","steps":[{"w":["💡 **Идея:** самое большое число **больше суммы всех остальных**:","=2 + 4 + … + 2¹⁹⁹ = 2²⁰⁰ − 2 \u003c 2²⁰⁰","👉 Группа с числом 2²⁰⁰ всегда тяжелее.","✅ **Ответ: нет.**"],"f":["pow2"]}],"v":[{"b":0,"s":"Здесь числа — степени двойки. Сумма всех степеней двойки до двухсот девятой меньше, чем следующая степень."},{"b":0,"f":"pow2"},{"b":0,"s":"Значит, самое большое число больше суммы всех остальных вместе. Та группа, где оно лежит, всегда тяжелее. Ответ: нет."}],"rich":true},{"l":"в","q":"Сколько хороших четырёхэлементных подмножеств у множества {3;4;5;6;8;10;12}?","ak":"num","av":"8","steps":[{"w":["📌 Сумма четырёх чисел должна быть **чётной**, а половина — суммой одного или двух из них.","🔎 **Перебираем** четвёрки:"],"f":["parity"]},{"w":["=(3, 4, 5, 6),   (3, 4, 5, 12),   (3, 5, 6, 8),   (3, 5, 8, 10)","=(3, 5, 10, 12),   (4, 6, 8, 10),   (4, 6, 10, 12),   (6, 8, 10, 12)","✅ **Ответ: 8.**"],"f":[]}],"v":[{"b":0,"s":"Чтобы разбить четыре числа на две равные по сумме группы, их общая сумма должна быть чётной. А разбиение может быть только двумя способами: одно число против трёх или два против двух."},{"b":0,"f":"parity"},{"b":1,"s":"Остаётся аккуратно перебрать четвёрки. Подходящих получается восемь, они выписаны в решении. Ответ: восемь."}],"rich":true}],"tags":["est"],"facts":["pow2","parity","est_ex"],"note":"","n":36},{"id":"2317","d":2,"from":"Школково","stem":"Дано трёхзначное натуральное число.","parts":[{"l":"в","q":"Какое наименьшее натуральное значение может иметь частное данного числа и суммы его цифр?","ak":"num","av":"11","steps":[{"w":["✏️ Число 100a + 10b + c, частное **q**:","=100a + 10b + c = q(a + b + c)","=(100 − q)a + (10 − q)b = (q − 1)c"],"f":[]},{"w":["📏 **Оценка.** При q ≤ 10 слева не меньше 90, а справа не больше 9·9 = 81 ❌","👉 Значит, **q ≥ 11**."],"f":[]},{"w":["🔨 **Пример:** 198 = 11·18, а 1 + 9 + 8 = 18 ✔️","✅ **Ответ: 11.**"],"f":[]}],"v":[{"b":0,"s":"Запишем число через цифры и приравняем к ку раз сумме цифр. Перенесём всё так, чтобы слева были а и бэ, а справа цэ."},{"b":1,"s":"Если ку не больше десяти, то левая часть не меньше девяноста, ведь а хотя бы один. А правая часть не больше девяти раз по девять, то есть восьмидесяти одного. Не может быть. Значит, частное хотя бы одиннадцать."},{"b":2,"s":"Пример: сто девяносто восемь. Сумма цифр восемнадцать, и сто девяносто восемь ровно в одиннадцать раз больше. Ответ: одиннадцать."}],"rich":true}],"tags":["digits"],"facts":["dec_repr","est_ex"],"note":"","n":37},{"id":"10820","d":2,"from":"Школково","stem":"Последовательность a₁, a₂, …, a₆ состоит из неотрицательных однозначных чисел. Mₖ — среднее арифметическое всех членов, кроме k-го. Известно, что M₁ = 1, M₂ = 2.","parts":[{"l":"а","q":"Приведите пример такой последовательности, для которой M3 =1,6.","ak":"self","av":"Например, 5, 0, 2, 1, 1, 1.","steps":[{"w":["✏️ Пусть **S** — сумма всех шести чисел. Без a₁ среднее 1, без a₂ — среднее 2:","=S − a₁ = 5,     S − a₂ = 10","📌 Нужно M₃ = 1,6:  S − a₃ = 8"],"f":["mean"]},{"w":["🔨 Возьмём **S = 10**:","=a₁ = 5,   a₂ = 0,   a₃ = 2,   остальные три — 1, 1, 1","✅ **Пример:** 5, 0, 2, 1, 1, 1."],"f":[]}],"v":[{"b":0,"s":"Удобно ввести сумму всех шести чисел — назовём её эс. Тогда среднее всех чисел без первого — это эс минус первое число, делённое на пять."},{"b":0,"f":"mean"},{"b":0,"s":"Из условия получаем: эс минус первое число равно пяти, эс минус второе — десяти. А чтобы третье среднее было одна целая шесть десятых, нужно эс минус третье число равное восьми."},{"b":1,"s":"Возьмём эс равное десяти. Тогда первое число пять, второе ноль, третье два, а остальным трём остаётся три — по единице. Пример готов."}],"rich":true},{"l":"б","q":"Существует ли такая последовательность, для которой M3 = 3?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 M₃ = 3 → S − a₃ = 15 → **S ≥ 15**.","📌 Но a₁ = S − 5 — однозначное → a₁ ≤ 9 → **S ≤ 14**.","❌ Противоречие.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Если третье среднее равно трём, то эс минус третье число равно пятнадцати, и сумма эс не меньше пятнадцати."},{"b":0,"s":"Но первое число — это эс минус пять, а оно однозначное, то есть не больше девяти. Значит, эс не больше четырнадцати. Противоречие. Ответ: нет."}],"rich":true},{"l":"в","q":"Найдите наибольшее возможное значение M3.","ak":"num","av":"2,8","steps":[{"w":["📏 **Оценка:** S ≤ 14 (из пункта б):","=M₃ = (S − a₃) : 5 ≤ 14 : 5 = 2,8"],"f":[]},{"w":["🔨 **Пример:** 9, 4, 0, 1, 0, 0 (S = 14) ✔️","✅ **Ответ: 2,8.**"],"f":[]}],"v":[{"b":0,"s":"Ищем наибольшее значение. Сумма не больше четырнадцати, как мы выяснили. Значит, третье среднее не больше четырнадцати пятых, то есть двух целых восьми десятых."},{"b":1,"s":"Чтобы так было, сумма должна быть четырнадцать, а третье число — ноль. Пример: девять, четыре, ноль, один, ноль, ноль. Ответ: две целых восемь десятых."}],"rich":true}],"tags":["avg"],"facts":["mean","est_ex"],"note":"","n":38},{"id":"13561","d":2,"from":"Школково","stem":"Дано трёхзначное число A, сумма цифр которого равна S.","parts":[{"l":"а","q":"Может ли выполняться равенство A ⋅S =1105?","ak":"yn","av":"ДА","steps":[{"w":["💡 **Идея:** разложим 1105 и поищем трёхзначный делитель с подходящей суммой цифр.","=1105 = 5·13·17 = 221·5","📌 Сумма цифр 221 равна **5** ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Разложим тысячу сто пять на множители: пять, тринадцать и семнадцать. Значит, тысяча сто пять — это двести двадцать один на пять."},{"b":0,"s":"А сумма цифр двухсот двадцати одного как раз пять. Подходит. Ответ: да."}],"rich":true},{"l":"б","q":"Может ли выполняться равенство A ⋅S =1106?","ak":"yn","av":"НЕТ","steps":[{"w":["💡 **Идея:** A и S дают **одинаковый остаток** при делении на 9.","📌 Тогда A·S даёт такой же остаток, как S² — квадрат.","👉 Квадраты при делении на 9 дают только **0, 1, 4, 7**.","❌ 1106 даёт остаток 8.","✅ **Ответ: нет.**"],"f":["ds_mod9"]}],"v":[{"b":0,"s":"Число и его сумма цифр дают одинаковый остаток при делении на девять."},{"b":0,"f":"ds_mod9"},{"b":0,"s":"Значит, произведение А на эс даёт такой же остаток, как эс в квадрате. А квадраты при делении на девять дают только остатки ноль, один, четыре и семь."},{"b":0,"s":"Тысяча сто шесть даёт остаток восемь — такого у квадратов не бывает. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое наименьшее значение может принимать выражение A ⋅S, если оно больше 1503?","ak":"num","av":"1507","steps":[{"w":["🔎 Проверяем числа по порядку:","👉 **1504** — остаток 1 подходит, но трёхзначные делители 188, 376, 752 не имеют нужной суммы цифр ❌","👉 **1505, 1506** — остатки 2 и 3, у квадратов их не бывает ❌"],"f":[]},{"w":["👉 **1507** = 137·11, а сумма цифр 137 равна **11** ✔️","✅ **Ответ: 1507.**"],"f":[]}],"v":[{"b":0,"s":"Будем проверять числа больше тысячи пятисот трёх по порядку. Для каждого сначала смотрим остаток при делении на девять: он должен быть таким, как у квадрата."},{"b":0,"s":"Тысяча пятьсот четыре по остатку подходит, но её трёхзначные делители не имеют нужной суммы цифр. Тысяча пятьсот пять и тысяча пятьсот шесть отпадают сразу по остатку."},{"b":1,"s":"А тысяча пятьсот семь — это сто тридцать семь на одиннадцать, и сумма цифр ста тридцати семи как раз одиннадцать. Ответ: тысяча пятьсот семь."}],"rich":true}],"tags":["digits","div"],"facts":["ds_mod9","mod_sq","est_ex"],"note":"","n":39},{"id":"14954","d":2,"from":"Школково","stem":"На доске написано несколько различных натуральных чисел, которые делятся на 3 и оканчиваются на 4.","parts":[{"l":"а","q":"Может ли их сумма составлять 282?","ak":"yn","av":"ДА","steps":[{"w":["💡 **Идея:** выпишем, какие вообще бывают такие числа.","📌 Кратны 3 и оканчиваются на 4:","=24, 54, 84, 114, 144, …   (через каждые 30)"],"f":[]},{"w":["🔨 **Пример:**","=24 + 54 + 204 = 282","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Сначала выпишем подходящие числа. Числа, оканчивающиеся на четыре и делящиеся на три, — это двадцать четыре, пятьдесят четыре, восемьдесят четыре и дальше через каждые тридцать."},{"b":1,"s":"Подберём несколько с суммой двести восемьдесят два. Например, двадцать четыре, пятьдесят четыре и двести четыре. Ответ: да."}],"rich":true},{"l":"б","q":"Может ли их сумма составлять 390?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Каждое число при делении на 30 даёт остаток **24**.","👉 Сумма k чисел даёт такой же остаток, как 24k. А 390 делится на 30:","=24k делится на 30   →   k кратно 5"],"f":["mod_def"]},{"w":["📏 Но 5 самых маленьких чисел уже дают больше:","=24 + 54 + 84 + 114 + 144 = 420 > 390","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Все наши числа при делении на тридцать дают остаток двадцать четыре. Значит, сумма ка таких чисел даёт такой же остаток, как двадцать четыре ка."},{"b":0,"f":"mod_def"},{"b":0,"s":"Триста девяносто делится на тридцать. Чтобы двадцать четыре ка делилось на тридцать, ка должно делиться на пять. Значит, чисел пять, десять и так далее."},{"b":1,"s":"Но даже пять самых маленьких подходящих чисел дают четыреста двадцать — больше трёхсот девяноста. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое наибольшее количество чисел могло быть на доске, если их сумма равна 2226?","ak":"num","av":"9","steps":[{"w":["📌 2226 при делении на 30 даёт остаток 6:","=24k ≡ 6 (mod 30)   →   k = 4, 9, 14, …"],"f":[]},{"w":["📏 **Оценка:** 14 самых маленьких чисел дают 3066 > 2226 → **k ≤ 9**."],"f":[]},{"w":["🔨 **Пример, k = 9:** 24, 54, …, 234 и вместо 264 — 1194:","=сумма = 2226 ✔️","✅ **Ответ: 9.**"],"f":[]}],"v":[{"b":0,"s":"Снова смотрим на остатки при делении на тридцать. Две тысячи двести двадцать шесть даёт остаток шесть. Подходят ка, равные четырём, девяти, четырнадцати и так далее."},{"b":1,"s":"Ищем наибольшее ка. Четырнадцать чисел даже самых маленьких дают больше нужной суммы, поэтому чисел не больше девяти."},{"b":2,"s":"Пример на девять чисел: берём восемь самых маленьких, а девятое делаем большим, чтобы добрать сумму. Подходит тысяча сто девяносто четыре — оно тоже оканчивается на четыре и делится на три. Ответ: девять."}],"rich":true}],"tags":["div","digits"],"facts":["div_comp","last_digit","mod_def","est_ex"],"note":"","n":40},{"id":"18610","d":2,"from":"Школково","stem":"Натуральные числа от 1 до 12 разбивают на четыре группы, в каждой из которых есть по крайней мере два числа. Для каждой группы находят сумму чисел этой группы. Для каждой пары групп находят модуль разности полученных сумм и полученные 6 чисел складывают.","parts":[{"l":"а","q":"Может ли в результате получиться 0?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Результат 0 → все четыре суммы **равны**.","=1 + 2 + … + 12 = 78,     78 : 4 = 19,5","❌ Не целое.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Результат ноль бывает, только если все четыре суммы групп одинаковые. Но сумма всех чисел семьдесят восемь, а на четыре равные целые части она не делится. Ответ: нет."}],"rich":true},{"l":"б","q":"Может ли в результате получиться 1?","ak":"yn","av":"НЕТ","steps":[{"w":["💡 **Идея:** чётность.","📌 Модуль разности той же чётности, что и сумма.","📌 Каждая сумма группы входит в **3** пары:","=результат той же чётности, что 3·78 — **чётный**","❌ 1 нечётное.","✅ **Ответ: нет.**"],"f":["parity"]}],"v":[{"b":0,"s":"Посмотрим на чётность. Модуль разности двух чисел той же чётности, что и их сумма."},{"b":0,"f":"parity"},{"b":0,"s":"Значит, результат той же чётности, что сумма всех шести пар сумм. В эти пары каждая сумма группы входит три раза, поэтому это три раза по семьдесят восемь — чётное число. А единица нечётная. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое наименьшее возможное значение полученного результата?","ak":"num","av":"4","steps":[{"w":["✏️ Упорядочим суммы: s₁ ≤ s₂ ≤ s₃ ≤ s₄.","=результат = 3(s₄ − s₁) + (s₃ − s₂)","📏 Суммы не все равны → s₄ − s₁ ≥ 1 → результат ≥ 3, и он чётный → **≥ 4**."],"f":[]},{"w":["🔨 **Пример:**","=(12, 7),   (11, 8),   (10, 9, 1),   (6, 5, 4, 3, 2)","=суммы 19, 19, 20, 20  →  результат 4","✅ **Ответ: 4.**"],"f":[]}],"v":[{"b":0,"s":"Ищем наименьший результат. Расставим суммы групп по возрастанию и распишем все шесть модулей. Получается формула из решения: три раза разность крайних плюс разность средних."},{"b":0,"s":"Суммы не могут быть все равны — это пункт а. Значит, разность крайних хотя бы один, и результат хотя бы три. А мы знаем, что он чётный. Значит, хотя бы четыре."},{"b":1,"s":"Пример: делаем две группы с суммой девятнадцать и две с суммой двадцать. Тогда результат как раз четыре. Ответ: четыре."}],"rich":true}],"tags":["est"],"facts":["parity","est_ex"],"note":"","n":41},{"id":"25083","d":2,"from":"Школково","stem":"Вася перемножил несколько различных натуральных чисел из отрезка [23;84]. Петя увеличил каждое из Васиных чисел на 1 и перемножил все полученные числа.","parts":[{"l":"а","q":"Может ли Петин результат быть ровно вдвое больше Васиного?","ak":"yn","av":"ДА","steps":[{"w":["💡 **Идея:** Петин результат : Васин — это произведение дробей (x + 1) : x.","📌 Для чисел **подряд** почти всё сокращается:","=24/23 · 25/24 · … · 46/45 = 46/23 = 2","🔨 Вася берёт числа 23, 24, …, 45.","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Разделим Петин результат на Васин. Получится произведение дробей: каждое число плюс один, делённое на само число."},{"b":0,"s":"Если Вася взял числа подряд, то в этом произведении почти всё сокращается — знаменатель следующей дроби совпадает с числителем предыдущей. Остаётся последнее число плюс один, делённое на первое."},{"b":0,"s":"Нужно, чтобы получилось два. Возьмём числа от двадцати трёх до сорока пяти: остаётся сорок шесть делить на двадцать три — ровно два. Ответ: да."}],"rich":true},{"l":"б","q":"Может ли Петин результат быть ровно в 6 раз больше Васиного?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Каждая дробь (x + 1) : x больше 1 → отношение **наибольшее**, если взять **все** числа.","=24/23 · 25/24 · … · 85/84 = 85/23 \u003c 4","❌ 6 недостижимо.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Каждая дробь больше единицы, поэтому чем больше чисел взять, тем больше отношение. Самое большое — если взять все числа от двадцати трёх до восьмидесяти четырёх."},{"b":0,"s":"Тогда всё сокращается, и остаётся восемьдесят пять делить на двадцать три — это меньше четырёх. Шести не получится. Ответ: нет."}],"rich":true},{"l":"в","q":"В какое наибольшее целое число раз Петин результат может быть больше Васиного?","ak":"num","av":"3","steps":[{"w":["📏 **Оценка:** отношение ≤ 85/23 \u003c 4 → целое значение **≤ 3**."],"f":[]},{"w":["🔨 **Пример:** числа 28, 29, …, 83:","=84/28 = 3 ✔️","✅ **Ответ: 3.**"],"f":[]}],"v":[{"b":0,"s":"Из пункта бэ отношение всегда меньше четырёх. Значит, наибольшее целое значение — не больше трёх."},{"b":1,"s":"Пример на три: снова берём числа подряд, так чтобы последнее плюс один было втрое больше первого. Подходят числа от двадцати восьми до восьмидесяти трёх: остаётся восемьдесят четыре делить на двадцать восемь. Ответ: три."}],"rich":true}],"tags":["est"],"facts":["frac_monot","est_ex"],"note":"","n":42},{"id":"26931","d":2,"from":"Школково","stem":"Даны четыре последовательных натуральных числа. Каждое из чисел поделили на одну из его цифр, не равную нулю, а затем четыре результата сложили.","parts":[{"l":"в","q":"Какое наибольшее целое значение может принимать сумма, если каждое из исходных чисел не меньше 200 и не больше 699?","ak":"num","av":"2470","steps":[{"w":["📏 **Оценка:** делим на цифру ≥ 1 → результат **не больше самого числа**.","👉 Сумма ≤ сумма самих чисел. Равенство — если в каждом числе есть цифра **1**."],"f":[]},{"w":["🔎 Ищем **наибольшие** четыре подряд числа до 699, в каждом из которых есть единица:","=616, 617, 618, 619","=616 + 617 + 618 + 619 = 2470","✅ **Ответ: 2470.**"],"f":[]}],"v":[{"b":0,"s":"Если число поделить на свою ненулевую цифру, результат не больше самого числа. Ровно само число получится, только если делить на единицу."},{"b":0,"s":"Значит, сумма не больше суммы самих четырёх чисел, а чтобы взять её полностью, в каждом числе должна быть единица."},{"b":1,"s":"Ищем самые большие четыре числа подряд, не больше шестисот девяноста девяти, где в каждом есть единица. Подходят шестьсот шестнадцать, семнадцать, восемнадцать и девятнадцать. Их сумма две тысячи четыреста семьдесят. Ответ: две тысячи четыреста семьдесят."}],"rich":true}],"tags":["digits"],"facts":["est_ex"],"note":"","n":43},{"id":"27765","d":2,"from":"Школково","stem":"Даны n различных натуральных чисел, составляющих арифметическую прогрессию (n ≥ 3).","parts":[{"l":"а","q":"Может ли сумма всех данных чисел быть равной 14?","ak":"yn","av":"ДА","steps":[{"w":["🔨 **Пример:**","=2 + 3 + 4 + 5 = 14","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Подберём пример. Числа два, три, четыре и пять идут с шагом один, и их сумма четырнадцать. Ответ: да."}],"rich":true},{"l":"б","q":"Каково наибольшее значение n, если сумма всех данных чисел меньше 900?","ak":"num","av":"41","steps":[{"w":["📏 **Оценка:** сумма n различных натуральных чисел не меньше 1 + 2 + … + n:","=n(n + 1) : 2 \u003c 900   →   n ≤ 41   (42·43 : 2 = 903)"],"f":["sum_1n"]},{"w":["🔨 **Пример:** 1, 2, …, 41 — сумма 861 \u003c 900.","✅ **Ответ: 41.**"],"f":[]}],"v":[{"b":0,"s":"Ищем наибольшее эн. Числа разные и натуральные, поэтому их сумма не меньше суммы чисел от одного до эн."},{"b":0,"f":"sum_1n"},{"b":0,"s":"Для сорока двух чисел это уже девятьсот три — больше девятисот. Значит, эн не больше сорока одного."},{"b":1,"s":"Пример: числа от одного до сорока одного, их сумма восемьсот шестьдесят один. Ответ: сорок один."}],"rich":true},{"l":"в","q":"Найдите все возможные значения n, если сумма всех данных чисел равна 123.","ak":"set","av":"3;6","steps":[{"w":["✏️ Первый член **a**, разность **d**:","=n·(2a + (n − 1)d) = 246 = 2·3·41","📌 Вторая скобка не меньше n + 1 → n — делитель 246 с n·(n + 1) ≤ 246."],"f":["ap"]},{"w":["🔎 **n = 3:** a + d = 41 → например 40, 41, 42 ✔️","🔎 **n = 6:** 2a + 5d = 41 → 18, 19, …, 23 ✔️","❌ Другие делители не подходят.","✅ **Ответ: 3; 6.**"],"f":[]}],"v":[{"b":0,"s":"Запишем сумму прогрессии через первый член а и разность дэ. Удвоенная сумма двести сорок шесть равна эн, умноженному на скобку."},{"b":0,"f":"ap"},{"b":0,"s":"Значит, эн — делитель двухсот сорока шести. При этом скобка не может быть слишком маленькой: она больше эн. Это сильно ограничивает варианты."},{"b":1,"s":"Подходят три числа — например, сорок, сорок один и сорок два — и шесть чисел — от восемнадцати до двадцати трёх. Остальные делители не дают натуральных чисел. Ответ: три или шесть."}],"rich":true}],"tags":["seq"],"facts":["ap","sum_1n","fta"],"note":"","n":44},{"id":"46757","d":2,"from":"Школково","stem":"a, b, c, d, e и f — различные числа 2, 3, 4, 5, 6 и 16, расставленные в некотором порядке.","parts":[{"l":"а","q":"Может ли выполняться равенство a/b + c/d + e/f = 6?","ak":"yn","av":"ДА","steps":[{"w":["🔨 **Пример:**","=2/6 + 5/3 + 16/4 = 1/3 + 5/3 + 4 = 6","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Подберём пример. Шестнадцать делить на четыре — это четыре. Остаётся получить два из двух других дробей: две шестых и пять третьих как раз дают две целых. Ответ: да."}],"rich":true},{"l":"б","q":"Может ли выполняться равенство a/b + c/d + e/f = 961/240?","ak":"yn","av":"НЕТ","steps":[{"w":["💡 **Идея:** знаменатель 240 = 16·3·5 → среди знаменателей должны быть **16 и 5**, и ещё 3 или 6."],"f":[]},{"w":["🔎 Перебираем расстановки:","👉 знаменатели 16, 5, 3 → числители 2, 4, 6 (6 вариантов)","👉 знаменатели 16, 5, 6 → числители 2, 3, 4 (6 вариантов)","❌ Ни один не даёт 961/240.","✅ **Ответ: нет.**"],"f":["mod_cases"]}],"v":[{"b":0,"s":"Посмотрим на знаменатель двести сорок. Чтобы он получился, среди знаменателей дробей должны быть шестнадцать и пять, и ещё тройка или шестёрка."},{"b":1,"s":"Остаётся немного вариантов: двенадцать способов расставить числители. Проверяем их все — ни один не даёт нужную сумму. Ответ: нет."},{"b":1,"f":"mod_cases"}],"rich":true},{"l":"в","q":"Какое наименьшее значение может принимать сумма a/b + c/d + e/f?","ak":"num","av":"23/20","steps":[{"w":["💡 **Идея:** чтобы сумма была маленькой — **маленькие числители**, **большие знаменатели**.","👉 Числители 2, 3, 4, знаменатели 5, 6, 16.","👉 Самому большому знаменателю — самый большой числитель."],"f":[]},{"w":["=2/5 + 3/6 + 4/16 = 0,4 + 0,5 + 0,25 = 23/20","✅ **Ответ: 23/20.**"],"f":[]}],"v":[{"b":0,"s":"Чтобы сумма дробей была наименьшей, в числители ставим три самых маленьких числа, а в знаменатели — три самых больших."},{"b":0,"s":"Ещё важно, как их распределить. Выгоднее всего делить самый большой числитель на самый большой знаменатель: шестнадцать сильнее всего уменьшает дробь."},{"b":1,"s":"Получаем две пятых плюс три шестых плюс четыре шестнадцатых — это двадцать три двадцатых. Ответ: двадцать три двадцатых."}],"rich":true}],"tags":["est"],"facts":["frac_monot","est_ex"],"note":"","n":45},{"id":"46758","d":2,"from":"Школково","stem":"[x] — наибольшее целое число, не превосходящее x. Например, [11/4] = 2, так как 2 ≤ 11/4 \u003c 3.","parts":[{"l":"а","q":"Существует ли натуральное n, что [n/2] + [n/3] + [n/9] = n?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Целая часть не больше самого числа:","=[n/2] + [n/3] + [n/9] ≤ n/2 + n/3 + n/9 = 17n/18 \u003c n","✅ **Ответ: нет.**"],"f":["floor"]}],"v":[{"b":0,"f":"floor"},{"b":0,"s":"Каждая целая часть не больше самой дроби. Значит, вся левая часть не больше, чем эн пополам плюс эн третьих плюс эн девятых. А это семнадцать восемнадцатых эн — меньше эн. Равенства быть не может. Ответ: нет."}],"rich":true},{"l":"б","q":"Существует ли натуральное n, что [n/2] + [n/3] + [n/5] = n + 2?","ak":"yn","av":"ДА","steps":[{"w":["💡 **Идея:** n/2 + n/3 + n/5 = 31n/30 — чуть больше n. Возьмём n, которое делится на 2, 3 и 5:","=n = 60:   30 + 20 + 12 = 62 = 60 + 2 ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Сумма эн пополам, эн третьих и эн пятых — это тридцать одна тридцатая эн, то есть эн плюс тридцатая часть эн. Чтобы лишнее было ровно два, возьмём эн равное шестидесяти. Оно делится на два, три и пять, поэтому целые части равны самим дробям."},{"b":0,"s":"Получаем тридцать плюс двадцать плюс двенадцать — шестьдесят два. Ответ: да."}],"rich":true}],"tags":["eq"],"facts":["floor","est_ex"],"note":"","n":46},{"id":"46759","d":2,"from":"Школково","stem":"На доске написано более 35, но менее 49 целых чисел. Среднее арифметическое этих чисел равно 5, среднее арифметическое всех положительных из них равно 14, а среднее арифметическое всех отрицательных из них равно − 7.","parts":[{"l":"а","q":"Сколько чисел написано на доске?","ak":"num","av":"42","steps":[{"w":["✏️ **N** — всего чисел, **p** — положительных, **q** — отрицательных (остальные — нули).","📌 Сумма через средние:","=14p − 7q = 5N","📌 Левая часть делится на 7 → **5N делится на 7** → N кратно 7."],"f":["mean"]},{"w":["🔎 Кратные 7 между 35 и 49: только **42**.","✅ **Ответ: 42.**"],"f":[]}],"v":[{"b":0,"s":"Обозначим: эн — сколько всего чисел, пэ — сколько положительных, ку — сколько отрицательных. Остальные числа — нули, они на сумму не влияют."},{"b":0,"f":"mean"},{"b":0,"s":"Посчитаем сумму всех чисел двумя способами. С одной стороны, это пять эн. С другой — четырнадцать пэ минус семь ку. Правая сторона делится на семь, значит, пять эн делится на семь, то есть эн кратно семи."},{"b":1,"s":"Между тридцатью пятью и сорока девятью только одно число, кратное семи, — сорок два. Ответ: сорок два."}],"rich":true},{"l":"б","q":"Каких чисел больше: положительных или отрицательных?","ak":"self","av":"Положительных больше.","steps":[{"w":["📌 N = 42:","=14p − 7q = 210   →   q = 2p − 30","📌 Нулей 42 − p − q = 72 − 3p ≥ 0 → **p ≤ 24**."],"f":[]},{"w":["=q − p = p − 30 \u003c 0","👉 Отрицательных **меньше**.","✅ **Ответ: положительных больше.**"],"f":[]}],"v":[{"b":0,"s":"Подставим эн равное сорока двум. Из уравнения получаем, что ку равно два пэ минус тридцать. А количество нулей не может быть отрицательным — отсюда пэ не больше двадцати четырёх."},{"b":1,"s":"Теперь сравним: ку минус пэ равно пэ минус тридцать, а это отрицательное число, потому что пэ не больше двадцати четырёх. Значит, отрицательных меньше. Ответ: положительных больше."}],"rich":true},{"l":"в","q":"Какое наибольшее количество положительных чисел может быть среди них?","ak":"num","av":"24","steps":[{"w":["📏 **Оценка** из пункта б: **p ≤ 24**."],"f":[]},{"w":["🔨 **Пример:** 24 числа 14 и 18 чисел −7:","=24·14 − 18·7 = 336 − 126 = 210 = 5·42 ✔️","✅ **Ответ: 24.**"],"f":[]}],"v":[{"b":0,"s":"Мы уже знаем, что положительных не больше двадцати четырёх. Это оценка."},{"b":1,"s":"Пример: двадцать четыре раза число четырнадцать и восемнадцать раз минус семь, нулей нет. Средние получаются как нужно. Ответ: двадцать четыре."}],"rich":true}],"tags":["avg"],"facts":["mean","div_def"],"note":"","n":47},{"id":"46761","d":2,"from":"Школково","stem":"У Миши в копилке есть 2-рублёвые, 5-рублёвые и 10-рублёвые монеты. Если взять 10 монет, то среди них обязательно найдётся хотя бы одна 2-рублёвая. Если взять 15 монет, то среди них обязательно найдётся хотя бы одна 5-рублёвая. Если взять 20 монет, то среди них обязательно найдётся хотя бы одна 10-рублёвая.","parts":[{"l":"а","q":"Может ли у Миши быть 30 монет?","ak":"yn","av":"НЕТ","steps":[{"w":["💡 **Идея:** переведём условия в **ограничения**.","👉 «Из любых 10 есть двухрублёвая» → **не двухрублёвых ≤ 9**","👉 не пятирублёвых ≤ 14,   не десятирублёвых ≤ 19"],"f":[]},{"w":["📌 Сложим: каждая монета посчитана **дважды** (она «не» для двух других видов):","=2·(всего монет) ≤ 9 + 14 + 19 = 42   →   монет ≤ 21","❌ 30 > 21.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Переведём условия на понятный язык. Если среди любых десяти монет есть двухрублёвая, значит, монет другого достоинства не больше девяти — иначе мы взяли бы десять монет без двухрублёвых."},{"b":0,"s":"Точно так же не пятирублёвых монет не больше четырнадцати, а не десятирублёвых — не больше девятнадцати."},{"b":1,"s":"Сложим эти три неравенства. Каждая монета входит в два из них: например, двухрублёвая — это и «не пятирублёвая», и «не десятирублёвая». Получаем, что удвоенное число монет не больше сорока двух, то есть монет не больше двадцати одной. Ответ: нет."}],"rich":true},{"l":"б","q":"Какое наибольшее количество монет может быть у Миши?","ak":"num","av":"21","steps":[{"w":["📏 **Оценка** из пункта а: монет **≤ 21**."],"f":[]},{"w":["🔨 **Пример:** 12 по 2 р., 7 по 5 р., 2 по 10 р.","👉 не двухрублёвых 9,  не пятирублёвых 14,  не десятирублёвых 19 ✔️","✅ **Ответ: 21.**"],"f":[]}],"v":[{"b":0,"s":"Оценку мы уже получили: монет не больше двадцати одной."},{"b":1,"s":"Пример строим так, чтобы все три неравенства стали равенствами: двенадцать двухрублёвых, семь пятирублёвых и две десятирублёвых. Проверьте по решению — всё совпадает. Ответ: двадцать одна."}],"rich":true},{"l":"в","q":"Какая наибольшая сумма рублей может быть у Миши?","ak":"num","av":"97","steps":[{"w":["💡 **Идея:** выгодно иметь больше **десятирублёвых**.","📌 Не двухрублёвых ≤ 9 → пятирублёвых + десятирублёвых ≤ 9.","📌 Сумма выражается через ограничения из пункта а:","=сумма ≤ 28 + 45 + 3·x₁₀,     x₁₀ ≤ 8"],"f":[]},{"w":["🔨 **Пример:** 6 по 2 р., 1 по 5 р., 8 по 10 р.","=12 + 5 + 80 = 97","✅ **Ответ: 97.**"],"f":[]}],"v":[{"b":0,"s":"Ищем наибольшую сумму. Ясно, что выгодно иметь как можно больше десятирублёвых монет. Но пятирублёвых и десятирублёвых вместе не больше девяти, а пятирублёвая хотя бы одна должна быть, иначе условие про пятнадцать монет не выполнится. Значит, десятирублёвых не больше восьми."},{"b":0,"s":"Если аккуратно записать сумму через наши ограничения, получится оценка из решения: не больше девяноста семи рублей."},{"b":1,"s":"Пример: шесть двухрублёвых, одна пятирублёвая и восемь десятирублёвых. Это девяносто семь рублей. Ответ: девяносто семь."}],"rich":true}],"tags":["est"],"facts":["dirichlet","est_ex"],"note":"","n":48},{"id":"51636","d":2,"from":"Школково","stem":"","parts":[{"l":"а","q":"Существует ли конечная арифметическая прогрессия, состоящая из пяти натуральных чисел, такая, что сумма наибольшего и наименьшего членов этой прогрессии равна 99?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Наименьший a, наибольший a + 4d:","=a + (a + 4d) = 2a + 4d — **чётное**","❌ 99 нечётное.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Пусть наименьший член а, а разность дэ. Тогда наибольший — а плюс четыре дэ. Их сумма — два а плюс четыре дэ, это всегда чётное число. А девяносто девять нечётное. Ответ: нет."}],"rich":true},{"l":"б","q":"Конечная арифметическая прогрессия состоит из шести натуральных чисел. Сумма наибольшего и наименьшего членов этой прогрессии равна 9. Найдите все числа, из которых состоит эта прогрессия.","ak":"self","av":"2, 3, 4, 5, 6, 7.","steps":[{"w":["=a + (a + 5d) = 9   →   2a + 5d = 9","📌 5d нечётное → d нечётное → **d = 1**, a = 2.","=2, 3, 4, 5, 6, 7","✅ **Ответ:** 2, 3, 4, 5, 6, 7."],"f":[]}],"v":[{"b":0,"s":"Теперь членов шесть, поэтому наибольший — а плюс пять дэ. Сумма крайних: два а плюс пять дэ равно девяти."},{"b":0,"s":"Два а чётное, девять нечётное, значит, пять дэ нечётное, и дэ нечётное. Если дэ три или больше, пять дэ уже больше девяти. Значит, дэ равно единице, а а равно двум. Прогрессия: два, три, четыре, пять, шесть, семь."}],"rich":true},{"l":"в","q":"Среднее арифметическое членов конечной арифметической прогрессии, состоящей из натуральных чисел, равно 6,5. Какое наибольшее количество членов может быть в этой прогрессии?","ak":"num","av":"12","steps":[{"w":["📌 Среднее прогрессии — полусумма крайних:","=a₁ + aₙ = 13","📌 Числа разные и натуральные → разность крайних не больше 13 − 2 = 11 → **n ≤ 12**."],"f":["ap"]},{"w":["🔨 **Пример:** 1, 2, …, 12 — среднее 6,5 ✔️","✅ **Ответ: 12.**"],"f":[]}],"v":[{"b":0,"s":"Среднее арифметическое прогрессии равно полусумме первого и последнего членов. Значит, крайние члены в сумме дают тринадцать."},{"b":0,"f":"ap"},{"b":0,"s":"Шаг не может быть нулевым — иначе все числа равны шести с половиной, а они натуральные. Значит, крайние отличаются хотя бы на эн минус один. А самое большое отличие при сумме тринадцать — двенадцать и один, разница одиннадцать. Отсюда эн не больше двенадцати."},{"b":1,"s":"Пример: числа от одного до двенадцати, их среднее как раз шесть с половиной. Ответ: двенадцать."}],"rich":true}],"tags":["seq"],"facts":["ap","parity","est_ex"],"note":"","n":49},{"id":"58738","d":2,"from":"Школково","stem":"Трехзначное число, все цифры которого ненулевые, разделили на произведение его цифр.","parts":[{"l":"а","q":"Могло ли в результате деления получиться частное, равное 8?","ak":"yn","av":"ДА","steps":[{"w":["🔨 **Пример:** 128","=1·2·8 = 16,     128 : 16 = 8 ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Подберём пример. Число сто двадцать восемь: произведение цифр шестнадцать, а сто двадцать восемь делить на шестнадцать — ровно восемь. Ответ: да."}],"rich":true},{"l":"б","q":"Могло ли в результате деления получиться частное, равное 222?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Число = 222·P ≤ 999 → **P ≤ 4**.","👉 Кандидаты: 222, 444, 666, 888."],"f":[]},{"w":["🔎 Их произведения цифр: 8, 64, 216, 512 — **не совпадают** с P.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Пусть произведение цифр равно пэ. Тогда само число двести двадцать два пэ, и оно трёхзначное. Значит, пэ не больше четырёх, и кандидатов всего четыре: двести двадцать два, четыреста сорок четыре, шестьсот шестьдесят шесть и восемьсот восемьдесят восемь."},{"b":1,"s":"Проверим: у каждого из них произведение цифр совсем не то, что нужно. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое наибольшее частное можно было получить в результате деления?","ak":"num","av":"111","steps":[{"w":["👉 **Если b = c = 1:** число 100a + 11, произведение a:","=(100a + 11) : a = 100 + 11 : a ≤ 111   (при a = 1)"],"f":[]},{"w":["👉 **Если b·c ≥ 2:**","=частное ≤ (100a + 99) : (2a) \u003c 111"],"f":[]},{"w":["📌 Наибольшее частное — у числа **111**.","✅ **Ответ: 111.**"],"f":[]}],"v":[{"b":0,"s":"Ищем наибольшее частное. Чтобы оно было большим, произведение цифр должно быть маленьким. Сначала пусть две последние цифры — единицы. Тогда частное равно сто плюс одиннадцать делить на а, и самое большое — при а равном одному: сто одиннадцать."},{"b":1,"s":"Если же произведение двух последних цифр хотя бы два, то знаменатель вырастает минимум вдвое, и частное получается меньше ста одиннадцати — оценка в решении."},{"b":2,"s":"Значит, наибольшее частное сто одиннадцать — у числа сто одиннадцать. Ответ: сто одиннадцать."}],"rich":true}],"tags":["digits"],"facts":["dec_repr","est_ex"],"note":"","n":50},{"id":"65026","d":2,"from":"Школково","stem":"Имеются контейнеры массой в 2 тонны и 7 тонн и корабли грузоподъемностью в 10 тонн.","parts":[{"l":"а","q":"Можно ли 11 контейнеров массой 7 тонн и 22 контейнера массой 2 тонны погрузить на 14 кораблей?","ak":"yn","av":"ДА","steps":[{"w":["📌 На корабль влезает **не больше одного** контейнера 7 т и к нему **не больше одного** 2 т."],"f":[]},{"w":["🔨 **Погрузка:**","👉 11 кораблей: 7 т + 2 т","👉 осталось 11 контейнеров по 2 т → 3 корабля: 5 + 5 + 1","=11 + 3 = 14 ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Сначала поймём, как можно загрузить корабль. Два контейнера по семь тонн уже весят четырнадцать — не влезут. Значит, на корабле не больше одной «семёрки», а к ней можно добавить только один контейнер в две тонны."},{"b":1,"s":"Ставим каждую «семёрку» на свой корабль и добавляем к ней по «двойке». Это одиннадцать кораблей. Осталось одиннадцать «двоек», а на корабль влезает пять «двоек». Хватит ещё трёх кораблей. Всего четырнадцать. Ответ: да."}],"rich":true},{"l":"б","q":"Можно ли 11 контейнеров массой 7 тонн и 17 контейнеров массой 2 тонны погрузить на 12 кораблей?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 «Семёрки» занимают **11 кораблей**, на них не больше 11 «двоек».","📌 Остаётся хотя бы 17 − 11 = 6 «двоек» на **один** корабль.","❌ На корабль влезает не больше 5 «двоек».","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Каждой «семёрке» нужен свой корабль — это одиннадцать кораблей, и на них можно взять не больше одиннадцати «двоек»."},{"b":0,"s":"Остаётся хотя бы шесть «двоек», а свободный корабль всего один, и на него влезает только пять. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое наименьшее количество кораблей требуется для погрузки 11 контейнеров массой 7 тонн и 77 контейнеров массой 2 тонны?","ak":"num","av":"25","steps":[{"w":["📏 **Оценка.** Общая масса:","=11·7 + 77·2 = 231 т","📌 11 кораблей с «семёрками» везут не больше 9 т каждый → **≤ 99 т**.","=231 − 99 = 132 т   →   ещё ≥ 14 кораблей","👉 Всего **≥ 25**."],"f":[]},{"w":["🔨 **Пример:** 11 кораблей (7 + 2), 13 кораблей по 5 «двоек» и один с одной «двойкой».","✅ **Ответ: 25.**"],"f":[]}],"v":[{"b":0,"s":"Ищем наименьшее число кораблей — оценка плюс пример. Общая масса двести тридцать одна тонна."},{"b":0,"s":"Корабли с «семёрками» загружены неполностью: максимум девять тонн каждый, всего не больше девяноста девяти тонн. Остальные сто тридцать две тонны везут другие корабли, по десять тонн, — их нужно хотя бы четырнадцать. Всего не меньше двадцати пяти."},{"b":1,"s":"Пример: одиннадцать кораблей с «семёркой» и «двойкой», тринадцать кораблей по пять «двоек» и один корабль с последней «двойкой». Ответ: двадцать пять."}],"rich":true}],"tags":["est"],"facts":["est_ex"],"note":"","n":51},{"id":"114823","d":2,"from":"Школково","stem":"Трёхзначное число A имеет k натуральных делителей (в том числе 1 и A ).","parts":[{"l":"а","q":"Может ли k быть равно 7?","ak":"yn","av":"ДА","steps":[{"w":["📌 Формула числа делителей:","=n = p^a · q^b · …   →   (a + 1)(b + 1)…","📌 7 — простое → нужно **p⁶**.","=3⁶ = 729 — трёхзначное ✔️","✅ **Ответ: да.**"],"f":["tau"]}],"v":[{"b":0,"f":"tau"},{"b":0,"s":"Семь — простое число, поэтому произведение скобок равно семи только в одном случае: число — это простое в шестой степени."},{"b":0,"s":"Подходит три в шестой степени — семьсот двадцать девять, трёхзначное. Ответ: да."}],"rich":true},{"l":"б","q":"Может ли k быть равно 25?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 25 = 25 или 5·5:","👉 p²⁴ — огромное ❌","👉 p⁴q⁴ = (pq)⁴ ≥ 6⁴ = 1296 — не трёхзначное ❌","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Двадцать пять можно получить как двадцать пять или как пять на пять. В первом случае число — простое в двадцать четвёртой степени, это огромное число. Во втором — произведение двух простых в четвёртой степени, и даже самое маленькое такое число, шесть в четвёртой, больше тысячи. Ответ: нет."}],"rich":true},{"l":"в","q":"Найдите наибольшее k.","ak":"num","av":"32","steps":[{"w":["💡 **Идея:** много делителей — у чисел из **маленьких простых** множителей.","=840 = 2³·3·5·7   →   4·2·2·2 = 32 делителя"],"f":[]},{"w":["📏 Пять разных простых: 2·3·5·7·11 = 2310 > 999.","📏 Варианты с 36 делителями и больше тоже дают числа больше 999.","✅ **Ответ: 32.**"],"f":[]}],"v":[{"b":0,"s":"Чтобы делителей было много, число должно состоять из маленьких простых множителей. Хороший кандидат — восемьсот сорок: два в кубе, три, пять и семь. У него тридцать два делителя."},{"b":1,"s":"Больше не получится. Пять разных простых множителей дают уже больше тысячи. А если попробовать набрать тридцать шесть делителей или больше другими степенями, число тоже выходит за тысячу. Ответ: тридцать два."}],"rich":true}],"tags":["div"],"facts":["tau","fta","est_ex"],"note":"","n":52},{"id":"114827","d":2,"from":"Школково","stem":"Даны два набора чисел: в первом наборе каждое число равно 150, а во втором — каждое число равно 50. Среднее арифметическое всех чисел двух наборов равно 78.","parts":[{"l":"а","q":"Каждое число первого набора уменьшили на натуральное число n. Может ли среднее арифметическое всех чисел двух наборов быть равно 71?","ak":"yn","av":"ДА","steps":[{"w":["✏️ **n₁** чисел по 150, **n₂** по 50:","=150n₁ + 50n₂ = 78(n₁ + n₂)   →   18n₁ = 7n₂","👉 n₁ = 7t,   n₂ = 18t,   всего 25t"],"f":["mean"]},{"w":["📌 Среднее уменьшилось на 7 → сумма уменьшилась на 7·25t:","=7t·n = 7·25t   →   n = 25 ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Пусть в первом наборе эн один чисел, а во втором эн два. Запишем сумму двумя способами и получим, что восемнадцать эн один равно семи эн два. Значит, наборы относятся как семь к восемнадцати: в первом семь тэ чисел, во втором восемнадцать тэ, всего двадцать пять тэ."},{"b":0,"f":"mean"},{"b":1,"s":"Если каждое число первого набора уменьшить на эн, сумма уменьшится на семь тэ раз эн. А среднее должно уменьшиться на семь, то есть сумма — на семь раз двадцать пять тэ. Отсюда эн равно двадцати пяти. Ответ: да."}],"rich":true},{"l":"б","q":"Каждое число первого набора уменьшили на натуральное число m. Может ли среднее арифметическое всех чисел двух наборов быть равно 70?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Среднее уменьшилось на 8:","=7t·m = 8·25t   →   m = 200/7","❌ Не натуральное.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Рассуждаем так же. Теперь среднее уменьшилось на восемь, и получается, что эм равно двумстам седьмым — это не целое число. Ответ: нет."}],"rich":true},{"l":"в","q":"Каждое число одного набора увеличили на натуральное число k, одновременно уменьшив на k каждое число другого набора, при условии, что все числа остались положительными. Какие целые значения может принимать среднее арифметическое всех чисел двух наборов?","ak":"set","av":"67;89;100;111;122;133","steps":[{"w":["📌 Изменение суммы: ±(18t − 7t)·k = ±11tk → среднее меняется на 11k/25.","👉 Целое → **k кратно 25**."],"f":[]},{"w":["🔎 **Первый +k, второй −k:** 50 − k > 0 → k = 25 → среднее 78 − 11 = **67**.","🔎 **Первый −k, второй +k:** 150 − k > 0 → k = 25, 50, …, 125:","=78 + 11, 78 + 22, …, 78 + 55   →   89, 100, 111, 122, 133","✅ **Ответ:** 67; 89; 100; 111; 122; 133."],"f":[]}],"v":[{"b":0,"s":"Если один набор увеличить на ка, а другой уменьшить на ка, сумма меняется на разность количеств, умноженную на ка, — это одиннадцать тэ ка. Делим на двадцать пять тэ: среднее меняется на одиннадцать ка двадцать пятых. Чтобы среднее было целым, ка должно делиться на двадцать пять."},{"b":1,"s":"Разберём два случая. Если увеличиваем стопятидесятки, а уменьшаем пятидесятки, то числа пятьдесят должны остаться положительными — подходит только ка равное двадцати пяти, и среднее становится шестьдесят семь."},{"b":1,"s":"Если наоборот, то сто пятьдесят минус ка должно быть положительным, и ка может быть двадцать пять, пятьдесят, семьдесят пять, сто или сто двадцать пять. Среднее каждый раз растёт на одиннадцать. Все значения выписаны в ответе."}],"rich":true}],"tags":["avg"],"facts":["mean","lin_dioph"],"note":"","n":53},{"id":"159788","d":2,"from":"Школково","stem":"В школах №1 и №2 учащиеся писали тест. Из каждой школы тест писали по крайней мере 2 учащихся, а суммарно тест писали 9 учащихся. Каждый учащийся, писавший тест, набрал натуральное количество баллов. Оказалось, что в каждой школе средний балл за тест был целым числом. После этого один из учащихся, писавших тест, перешёл из школы №1 в школу №2, а средние баллы за тест были пересчитаны в обеих школах.","parts":[{"l":"а","q":"Мог ли средний балл в школе №1 уменьшиться в 10 раз?","ak":"yn","av":"ДА","steps":[{"w":["💡 **Идея:** средний балл сильно падает, если уходит **самый сильный** ученик.","🔨 **Школа №1:** 2 ученика — 19 и 1 балл, среднее 10.","👉 Ученик с 19 баллами уходит → осталось 1 = 10 : 10 ✔️"],"f":["mean_move"]},{"w":["🔨 **Школа №2:** 7 учеников, например все по 5 баллов — среднее целое.","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Среднее уменьшается, если уходит ученик с баллом выше среднего. Чтобы среднее упало в десять раз, уходящий должен быть очень сильным, а оставшиеся — слабыми."},{"b":0,"f":"mean_move"},{"b":0,"s":"Пусть в первой школе два ученика: один набрал девятнадцать баллов, другой — один балл. Среднее десять. Сильный ученик переходит в другую школу — остаётся один балл, ровно в десять раз меньше."},{"b":1,"s":"Во второй школе остальные семь учеников, например все по пять баллов: среднее целое. Ответ: да."}],"rich":true}],"tags":["avg"],"facts":["mean_move","est_ex"],"note":"","n":54},{"id":"185985","d":2,"from":"Школково","stem":"На столе лежит некоторое количество карточек, часть из которых синего цвета, а остальные красного (есть хотя бы по одной карточке каждого цвета). На каждой карточке написано целое число. На карточках синего цвета написаны различные числа, делящиеся на 5, а на карточках красного цвета написаны различные чётные числа (при этом некоторые числа могут быть написаны дважды: один раз на синей карточке и один раз на красной карточке). Все числа на карточках больше -120. Оказалось, что наибольшее число, написанное на красной карточке, равно удвоенному количеству синих карточек, а наибольшее число, написанное на синей карточке, равно количеству красных карточек.","parts":[{"l":"б","q":"Может ли число красных карточек на столе быть на 90 больше числа синих карточек на столе?","ak":"yn","av":"НЕТ","steps":[{"w":["✏️ **B** — синих карточек, **R** — красных.","📌 Наибольшее красное число = **2B**, а все красные — различные **чётные** числа больше −120."],"f":[]},{"w":["📌 Чётные числа от −118 до 2B — их всего:","=B + 60","👉 Значит, **R ≤ B + 60 \u003c B + 90**.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Пусть синих карточек Бэ, а красных Эр. На красных — разные чётные числа, все больше минус ста двадцати, а самое большое из них — два Бэ."},{"b":1,"s":"Сколько вообще есть чётных чисел от минус ста восемнадцати до два Бэ? Ровно Бэ плюс шестьдесят. Значит, красных карточек не может быть больше, чем Бэ плюс шестьдесят, и уж точно не Бэ плюс девяносто. Ответ: нет."}],"rich":true}],"tags":["div","est"],"facts":["div_count","est_ex"],"note":"","n":55},{"id":"186103","d":2,"from":"Школково","stem":"На доске написано некоторое количество двузначных натуральных чисел, среди которых могут быть одинаковые. С каждым из этих чисел проделывают одну из двух операций: либо увеличивают цифру в разряде десятков на 2 и уменьшают цифру в разряде единиц на 5, либо уменьшают цифру в разряде десятков на 2 и увеличивают цифру в разряде единиц на 2. Все числа, получившиеся в результате, оказались двузначными натуральными.","parts":[{"l":"а","q":"Может ли сумма исходных чисел оказаться на 128 меньше суммы получившихся чисел?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Как меняется число:","=1-я операция:  +20 − 5 = +15","=2-я операция:  −20 + 2 = −18","👉 Обе величины **кратны 3** → изменение суммы кратно 3.","❌ 128 на 3 не делится.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Посмотрим, на сколько меняется число при каждой операции. Если десятки увеличить на два, число вырастет на двадцать, а уменьшение единиц на пять отнимет пять — итого плюс пятнадцать. Вторая операция даёт минус восемнадцать."},{"b":0,"s":"И пятнадцать, и восемнадцать делятся на три. Значит, изменение всей суммы тоже делится на три. А сто двадцать восемь не делится. Ответ: нет."}],"rich":true},{"l":"б","q":"Может ли количество чисел на доске равняться 25, если сумма исходных чисел равна сумме получившихся чисел?","ak":"yn","av":"НЕТ","steps":[{"w":["✏️ **x** чисел с первой операцией, **y** — со второй:","=15x = 18y   →   5x = 6y   →   x = 6k,  y = 5k","👉 Всего чисел **11k**.","❌ 25 не делится на 11.","✅ **Ответ: нет.**"],"f":["lin_dioph"]}],"v":[{"b":0,"s":"Пусть икс чисел изменили первой операцией, а игрек — второй. Сумма не изменилась, значит, пятнадцать икс равно восемнадцати игрек. Отсюда икс относится к игрек как шесть к пяти, и всего чисел одиннадцать ка."},{"b":0,"f":"lin_dioph"},{"b":0,"s":"Двадцать пять на одиннадцать не делится. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое наибольшее количество чисел может быть написано на доске, если сумма исходных чисел равна сумме получившихся чисел и меньше 1198?","ak":"num","av":"44","steps":[{"w":["📌 6k чисел — с первой операцией: десятки ≤ 7, единицы ≥ 5 → число **≥ 15**.","📌 5k чисел — со второй: десятки ≥ 3 → число **≥ 30**."],"f":[]},{"w":["📏 **Оценка:**","=сумма ≥ 6k·15 + 5k·30 = 240k \u003c 1198   →   k ≤ 4"],"f":[]},{"w":["🔨 **Пример, k = 4:** 24 числа 15 и 20 чисел 30, сумма 960.","✅ **Ответ: 44.**"],"f":[]}],"v":[{"b":0,"s":"Чисел одиннадцать ка. Оценим их сумму снизу. Числа с первой операцией должны иметь единицы хотя бы пять — иначе нельзя отнять пять, значит, такое число хотя бы пятнадцать. Числа со второй операцией имеют десятки хотя бы три — иначе не отнять два и остаться двузначным, значит, хотя бы тридцать."},{"b":1,"s":"Тогда сумма не меньше двухсот сорока ка, и она меньше тысячи ста девяноста восьми. Отсюда ка не больше четырёх, а чисел не больше сорока четырёх."},{"b":2,"s":"Пример: двадцать четыре числа пятнадцать и двадцать чисел тридцать. Сумма девятьсот шестьдесят. Ответ: сорок четыре."}],"rich":true}],"tags":["digits","eq"],"facts":["dec_repr","lin_dioph","est_ex"],"note":"","n":56},{"id":"190118","d":2,"from":"Школково","stem":"В ящике лежат 73 овоща, масса каждого из которых выражается целым числом граммов. В ящике есть хотя бы два овоща различной массы, а средняя масса всех овощей равна 1000 г. Средняя масса овощей, масса каждого из которых меньше 1000 г, равна 988 г. Средняя масса овощей, масса каждого из которых больше 1000 г, равна 1010 г.","parts":[{"l":"а","q":"Могло ли в ящике оказаться поровну овощей массой меньше 1000 г и овощей массой больше 1000 г?","ak":"yn","av":"НЕТ","steps":[{"w":["✏️ **x** лёгких (среднее 988), **y** тяжёлых (среднее 1010), **z** — по 1000 г.","=988x + 1010y + 1000z = 1000·73   →   10y = 12x","👉 x = 5t,   y = 6t"],"f":["mean"]},{"w":["📌 x = y возможно, только если t = 0 — тогда все овощи по 1000 г.","❌ Но есть овощи разной массы.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Обозначим: икс — сколько лёгких овощей, игрек — тяжёлых, зет — ровно по тысяче граммов. Запишем общую массу через средние. После упрощения получаем: десять игрек равно двенадцати икс."},{"b":0,"f":"mean"},{"b":0,"s":"Это значит, что лёгкие и тяжёлые относятся как пять к шести: лёгких пять тэ, тяжёлых шесть тэ."},{"b":1,"s":"Поровну их быть может, только если тэ равно нулю. Но тогда все овощи весят по тысяче граммов, а по условию есть овощи разной массы. Ответ: нет."}],"rich":true},{"l":"б","q":"Могло ли в ящике оказаться ровно 11 овощей, масса каждого из которых равна 1000 г?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 z = 11 → x + y = 62.","=x + y = 5t + 6t = 11t","❌ 62 не делится на 11.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Если по тысяче граммов ровно одиннадцать овощей, то лёгких и тяжёлых вместе шестьдесят два. Но их всегда одиннадцать тэ, а шестьдесят два на одиннадцать не делится. Ответ: нет."}],"rich":true},{"l":"в","q":"Какую наименьшую массу может иметь овощ в этом ящике?","ak":"num","av":"669","steps":[{"w":["📌 11t ≤ 73 → t ≤ 6 → лёгких **x ≤ 30**.","💡 **Идея:** самый лёгкий овощ — самый маленький, когда остальные лёгкие **как можно тяжелее** (по 999 г)."],"f":[]},{"w":["📏 **Оценка:**","=самый лёгкий ≥ 988x − 999(x − 1) = 999 − 11x ≥ 999 − 330 = 669"],"f":[]},{"w":["🔨 **Пример:** 29 овощей по 999 г и один 669 г (среднее 988), 36 по 1010 г, 7 по 1000 г.","✅ **Ответ: 669 г.**"],"f":[]}],"v":[{"b":0,"s":"Лёгких и тяжёлых одиннадцать тэ, и их не больше семидесяти трёх, поэтому тэ не больше шести, а лёгких не больше тридцати."},{"b":0,"s":"Самый лёгкий овощ — среди лёгких. Чтобы он был как можно легче, остальные лёгкие должны быть как можно тяжелее — по девятьсот девяносто девять граммов. Ведь их сумма фиксирована: девятьсот восемьдесят восемь, умноженное на их количество."},{"b":1,"s":"Считаем: суммарная масса лёгких минус масса остальных лёгких. Получается девятьсот девяносто девять минус одиннадцать икс, а при икс равном тридцати — шестьсот шестьдесят девять."},{"b":2,"s":"Пример: двадцать девять овощей по девятьсот девяносто девять граммов и один в шестьсот шестьдесят девять; тридцать шесть тяжёлых по тысяче десять и семь по тысяче. Ответ: шестьсот шестьдесят девять граммов."}],"rich":true}],"tags":["avg"],"facts":["mean","lin_dioph","est_ex"],"note":"","n":57},{"id":"190120","d":2,"from":"Школково","stem":"В ящике лежат 95 фруктов, масса каждого — целое число граммов. Есть хотя бы два фрукта различной массы, средняя масса всех фруктов 100 г. Средняя масса фруктов легче 100 г равна 73 г, а фруктов тяжелее 100 г — 115 г.","parts":[{"l":"в","q":"Какую наибольшую массу может иметь фрукт в этом ящике?","ak":"num","av":"857","steps":[{"w":["✏️ **x** лёгких (73 г), **y** тяжёлых (115 г):","=−27x + 15y = 0   →   x = 5t,  y = 9t","📌 14t ≤ 95 → t ≤ 6 → тяжёлых **y ≤ 54**."],"f":[]},{"w":["💡 Самый тяжёлый — наибольший, когда остальные тяжёлые **как можно легче** (по 101 г):","=наибольший ≤ 115y − 101(y − 1) = 14y + 101 ≤ 857"],"f":[]},{"w":["🔨 **Пример:** 53 фрукта по 101 г и один 857 г, 30 по 73 г, 11 по 100 г.","✅ **Ответ: 857 г.**"],"f":[]}],"v":[{"b":0,"s":"Пусть лёгких фруктов икс, тяжёлых игрек. Каждый лёгкий в среднем легче ста граммов на двадцать семь, каждый тяжёлый тяжелее на пятнадцать. Общее среднее сто, значит, недостачи и излишки уравновешиваются. Отсюда лёгкие и тяжёлые относятся как пять к девяти."},{"b":0,"s":"Всего фруктов девяносто пять, поэтому тэ не больше шести, и тяжёлых не больше пятидесяти четырёх."},{"b":1,"s":"Самый тяжёлый фрукт будет тяжелее всего, если остальные тяжёлые как можно легче — по сто одному грамму. Считаем по формуле в решении: получается не больше восьмисот пятидесяти семи граммов."},{"b":2,"s":"Пример выписан в решении. Ответ: восемьсот пятьдесят семь граммов."}],"rich":true}],"tags":["avg"],"facts":["mean","est_ex"],"note":"","n":58},{"id":"39640","d":3,"from":"PDF №006","stem":"В группе поровну юношей и девушек. Юноши отправляли электронные письма девушкам. Каждый юноша отправил или 4 письма, или 21 письмо, причём и тех и других юношей было не менее двух. Возможно, что какой-то юноша отправил какой-то девушке несколько писем.","parts":[{"l":"а","q":"Могло ли оказаться так, что каждая девушка получила ровно 7 писем?","ak":"yn","av":"ДА","steps":[{"w":["✏️ **a** юношей отправили по 4 письма, **b** — по 21. Девушек n = a + b.","📌 Каждая получила 7:","=7(a + b) = 4a + 21b   →   3a = 14b"],"f":["lin_dioph"]},{"w":["🔨 **a = 14, b = 3, n = 17:**","=56 + 63 = 119 = 17·7 ✔️","👉 Раздаём письма «по очереди» — каждой девушке по 7.","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Пусть а юношей отправили по четыре письма, а бэ юношей — по двадцать одному. Девушек столько же, сколько юношей, то есть а плюс бэ."},{"b":0,"s":"Если каждая девушка получила семь писем, то всего писем семь раз а плюс бэ. С другой стороны, это четыре а плюс двадцать одно бэ. Приравняв, получаем: три а равно четырнадцати бэ."},{"b":0,"f":"lin_dioph"},{"b":1,"s":"Самое простое решение: а равно четырнадцати, бэ равно трём, всего семнадцать юношей и семнадцать девушек. Писем сто девятнадцать — ровно по семь на каждую. Остаётся раздать их по очереди, ведь одной девушке можно отправить несколько писем. Ответ: да."}],"rich":true},{"l":"б","q":"Какое наименьшее количество девушек могло быть в группе, если известно, что все они получили писем поровну?","ak":"num","av":"17","steps":[{"w":["✏️ Каждая получила **k** писем:","=(k − 4)a = (21 − k)b,     4 \u003c k \u003c 21"],"f":[]},{"w":["💡 **Идея:** сумма коэффициентов (k − 4) + (21 − k) = **17** — простое.","📌 Значит, у них нет общих делителей → a = (21 − k)t, b = (k − 4)t.","=n = a + b = 17t ≥ 17"],"f":["gcd"]},{"w":["🔨 **Пример n = 17** — из пункта а.","✅ **Ответ: 17.**"],"f":[]}],"v":[{"b":0,"s":"Пусть каждая девушка получила ка писем. Составим такое же уравнение, как в пункте а: ка минус четыре, умноженное на а, равно двадцать один минус ка, умноженное на бэ."},{"b":1,"s":"Заметим хитрость: если сложить коэффициенты ка минус четыре и двадцать один минус ка, всегда получается семнадцать, а это простое число. Поэтому у коэффициентов нет общих делителей."},{"b":1,"f":"gcd"},{"b":1,"s":"Тогда а и бэ пропорциональны этим коэффициентам, и их сумма — то есть число девушек — кратна семнадцати. Значит, девушек не меньше семнадцати."},{"b":2,"s":"А пример с семнадцатью девушками у нас уже есть. Ответ: семнадцать."}],"rich":true},{"l":"в","q":"Пусть все девушки получили различное количество писем (возможно, какая-то девушка не получила писем вообще). Какое наибольшее количество девушек в такой группе?","ak":"num","av":"41","steps":[{"w":["📌 Все получили **разное** число писем (от 0):","=писем ≥ 0 + 1 + … + (n − 1) = n(n − 1) : 2","📌 А писем 4a + 21b = 21n − 17a ≤ 21n − 34 (a ≥ 2)."],"f":["sum_1n"]},{"w":["📏 **Оценка:**","=n(n − 1) : 2 ≤ 21n − 34   →   n ≤ 41"],"f":[]},{"w":["🔨 **Пример n = 41:** a = 2, b = 39 → 827 писем.","👉 Девушки получили 0, 1, 2, …, 39 и 47 писем: 780 + 47 = 827 ✔️","✅ **Ответ: 41.**"],"f":[]}],"v":[{"b":0,"s":"Если все девушки получили разное количество писем, то писем не меньше, чем ноль плюс один плюс два и так далее до эн минус один."},{"b":0,"f":"sum_1n"},{"b":0,"s":"С другой стороны, писем не так много: юношей с четырьмя письмами хотя бы двое, поэтому писем не больше двадцати одного эн минус тридцать четыре."},{"b":1,"s":"Сравниваем две оценки и решаем квадратное неравенство — получаем, что эн не больше сорока одного."},{"b":2,"s":"Пример: двое юношей отправили по четыре письма, тридцать девять — по двадцать одному. Девушки получили ноль, один, два и так далее до тридцати девяти, а последняя — сорок семь писем. Сумма сходится. Ответ: сорок один."}],"rich":true}],"tags":["est","eq"],"facts":["lin_dioph","sum_1n","est_ex","coprime"],"note":"","n":59},{"id":"125163","d":3,"from":"PDF №007","stem":"В парке n аттракционов. С 11 до 12 часов дня парк посетило только n детей. Стоимость посещения каждого аттракциона составляет 10 рублей. Каждый ребёнок потратил или 30, или 140 рублей, причём не все дети потратили поровну денег. Один аттракцион можно посетить много раз.","parts":[{"l":"а","q":"Может ли выручка каждого аттракциона составить ровно 80 рублей?","ak":"yn","av":"ДА","steps":[{"w":["📌 30 р. — **3** посещения, 140 р. — **14** посещений.","✏️ **a** детей по 3 посещения, **b** — по 14; n = a + b.","📌 Каждому аттракциону по 8 посещений:","=8(a + b) = 3a + 14b   →   5a = 6b"],"f":[]},{"w":["🔨 **a = 6, b = 5, n = 11:**","=18 + 70 = 88 = 11·8 ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Переведём рубли в посещения: тридцать рублей — это три посещения, сто сорок — четырнадцать. Пусть а детей сделали по три посещения, а бэ — по четырнадцать. Аттракционов столько же, сколько детей."},{"b":0,"s":"Выручка восемьдесят рублей — это восемь посещений каждого аттракциона. Сравнивая общее число посещений, получаем: пять а равно шести бэ."},{"b":1,"s":"Берём а равное шести и бэ равное пяти: одиннадцать детей и одиннадцать аттракционов. Посещений восемьдесят восемь — ровно по восемь на каждый аттракцион. Ответ: да."}],"rich":true},{"l":"б","q":"Какое наименьшее количество детей могло быть, если известно, что все аттракционы получили одинаковую выручку?","ak":"num","av":"11","steps":[{"w":["✏️ Каждому аттракциону **k** посещений:","=(k − 3)a = (14 − k)b","💡 (k − 3) + (14 − k) = **11** — простое → a + b кратно 11 → **n ≥ 11**."],"f":["gcd"]},{"w":["🔨 **Пример n = 11** — пункт а.","✅ **Ответ: 11.**"],"f":[]}],"v":[{"b":0,"s":"Это та же идея, что в задаче про письма. Если каждому аттракциону досталось ка посещений, получаем уравнение с коэффициентами ка минус три и четырнадцать минус ка. Их сумма всегда одиннадцать — простое число. Поэтому число детей кратно одиннадцати."},{"b":0,"f":"gcd"},{"b":1,"s":"Значит, детей не меньше одиннадцати, а пример с одиннадцатью у нас есть. Ответ: одиннадцать."}],"rich":true},{"l":"в","q":"Любые два аттракциона имеют разную выручку (возможно, нулевую). Каково наибольшее возможное количество посетивших парк детей?","ak":"num","av":"28","steps":[{"w":["📌 Выручки разные → числа посещений разные (от 0):","=посещений ≥ 0 + 1 + … + (n − 1) = n(n − 1) : 2","📌 Посещений 3a + 14b = 14n − 11a ≤ 14n − 11 (a ≥ 1)."],"f":[]},{"w":["📏 **Оценка:**","=n(n − 1) : 2 ≤ 14n − 11   →   n ≤ 28"],"f":[]},{"w":["🔨 **Пример n = 28:** a = 1, b = 27 → 381 посещение.","👉 Аттракционы: 0, 1, …, 26 и 30 посещений: 351 + 30 = 381 ✔️","✅ **Ответ: 28.**"],"f":[]}],"v":[{"b":0,"s":"Если все выручки разные, то и числа посещений разные, и всего посещений не меньше суммы от нуля до эн минус один."},{"b":0,"s":"А посещений не так много: хотя бы один ребёнок потратил тридцать рублей, поэтому посещений не больше четырнадцати эн минус одиннадцать."},{"b":1,"s":"Сравнив эти оценки, получаем квадратное неравенство, и из него эн не больше двадцати восьми."},{"b":2,"s":"Пример: один ребёнок сделал три посещения, а двадцать семь — по четырнадцать. Распределяем: аттракционы получают ноль, один, два и так далее до двадцати шести посещений, а последний — тридцать. Ответ: двадцать восемь."}],"rich":true}],"tags":["est","eq"],"facts":["lin_dioph","sum_1n","est_ex"],"note":"В ключе файла к пункту б) стоит «НЕТ», но вопрос «какое наименьшее количество детей» требует числа. По условию, как оно записано, ответ 11 — вероятно, в исходнике пункт б) сформулирован иначе.","n":60},{"id":"159820","d":3,"from":"PDF №009","stem":"На доске написано 30 натуральных чисел (числа могут повторяться), каждое из которых либо зелёного, либо красного цвета. Каждое зелёное число кратно 3, а каждое красное число кратно 7. При этом все зелёные числа различны и все красные различны (какое-то зелёное число может равняться какому-то красному числу).","parts":[{"l":"а","q":"Может ли сумма написанных чисел быть меньше 1395 = 3+ 6+ ⋅⋅⋅+ 90, если все числа на доске кратны 3?","ak":"yn","av":"ДА","steps":[{"w":["📌 Все числа кратны 3 → красные кратны и 3, и 7, то есть **21**.","💡 **Идея:** одно красное число **21** «заменяет» большое зелёное."],"f":[]},{"w":["🔨 **Пример:** зелёные 3, 6, …, 87 (29 чисел), красное 21:","=3·(1 + 2 + … + 29) + 21 = 1305 + 21 = 1326 \u003c 1395 ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Если все числа кратны трём, то красные числа кратны и трём, и семи, то есть кратны двадцати одному."},{"b":0,"s":"Сумма тысяча триста девяносто пять — это тридцать разных кратных трёх. Хитрость в том, что красное число может повторять зелёное. Возьмём одно красное число двадцать один, а зелёных — двадцать девять самых маленьких."},{"b":1,"s":"Зелёные — от трёх до восьмидесяти семи, их сумма тысяча триста пять. Плюс двадцать один — тысяча триста двадцать шесть, это меньше тысячи трёхсот девяноста пяти. Ответ: да."}],"rich":true},{"l":"б","q":"Может ли ровно одно число на доске быть красным, если сумма написанных чисел равна 1067?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Красное одно → **29 зелёных**, все различны и кратны 3:","=сумма ≥ 3·(1 + 2 + … + 29) = 1305 > 1067","✅ **Ответ: нет.**"],"f":["distinct_min"]}],"v":[{"b":0,"s":"Если красное число одно, то зелёных двадцать девять, они разные и кратны трём. Даже самые маленькие из них дают тысячу триста пять — больше тысячи шестидесяти семи. Ответ: нет."},{"b":0,"f":"distinct_min"}],"rich":true},{"l":"в","q":"Какое наименьшее количество красных чисел может быть на доске, если сумма написанных чисел равна 1067?","ak":"num","av":"6","steps":[{"w":["✏️ **r** красных, **30 − r** зелёных. Наименьшая сумма:","=3·(1 + … + (30 − r)) + 7·(1 + … + r)"],"f":[]},{"w":["📏 **r = 5:**  975 + 105 = 1080 > 1067 ❌   (при меньших r ещё больше)","👉 Значит, **r ≥ 6**."],"f":[]},{"w":["🔨 **r = 6:** минимум 900 + 147 = 1047, не хватает 20 = 6 + 14.","👉 Зелёное 72 → 78 (+6),  красное 42 → 56 (+14)","=зелёные 3, 6, …, 69, 78;   красные 7, 14, 21, 28, 35, 56","✅ **Ответ: 6.**"],"f":[]}],"v":[{"b":0,"s":"Пусть красных чисел эр. Самая маленькая возможная сумма — когда зелёные это самые маленькие кратные трёх, а красные — самые маленькие кратные семи."},{"b":1,"s":"Чем меньше красных, тем больше зелёных, а зелёные дорожают быстрее. При пяти красных минимальная сумма уже тысяча восемьдесят — больше нужной. При меньшем числе красных ещё больше. Значит, красных хотя бы шесть."},{"b":2,"s":"Проверим шесть. Минимальная сумма тысяча сорок семь, не хватает двадцати. Двадцать — это шесть плюс четырнадцать. Увеличим одно зелёное на шесть, а одно красное на четырнадцать, следя, чтобы числа не совпали с другими того же цвета."},{"b":2,"s":"Например, зелёное семьдесят два заменим на семьдесят восемь, а красное сорок два — на пятьдесят шесть. Сумма ровно тысяча шестьдесят семь. Ответ: шесть."}],"rich":true}],"tags":["div","est"],"facts":["sum_1n","distinct_min","lin_dioph","est_ex"],"note":"","n":61},{"id":"106603","d":3,"from":"PDF №012","stem":"Есть три коробки: в первой коробке 97 камней, во второй — 104 камня, а в третьей коробке камней нет. За один ход берут по одному камню из любых двух коробок и кладут в оставшуюся. Сделали некоторое количество таких ходов.","parts":[{"l":"а","q":"Может ли в первой коробке оказаться 97 камней, во второй — 89 камней, а в третьей — 15 камней?","ak":"yn","av":"ДА","steps":[{"w":["💡 **Идея:** инвариант по остаткам от деления на 3.","📌 Ход меняет коробки на (−1, −1, +2). А +2 и −1 дают одинаковый остаток при делении на 3.","👉 Все числа «сдвигаются» одинаково → **разности по mod 3 не меняются**."],"f":["invariant"]},{"w":["🔨 **Пример:**","👉 10 ходов «в третью»: (87, 94, 20)","👉 5 ходов «в первую»: (97, 89, 15) ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Сначала ищем, что не меняется. При ходе две коробки теряют по камню, а третья получает два. С точки зрения остатков от деления на три прибавить два — то же самое, что отнять один. Значит, все три числа как бы уменьшаются на одно и то же, и разности между ними по модулю три сохраняются."},{"b":0,"f":"invariant"},{"b":0,"s":"Для нужного положения разности дают те же остатки, поэтому запрета нет. Попробуем дойти."},{"b":1,"s":"Сначала десять раз кладём камни в третью коробку, потом пять раз — в первую. Получаем ровно девяносто семь, восемьдесят девять и пятнадцать. Ответ: да."}],"rich":true},{"l":"б","q":"Может ли в третьей коробке оказаться 201 камень?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Было: 104 − 97 = 7 — остаток **1** при делении на 3.","📌 Хотим (0, 0, 201): разность 0 − 0 = 0 — остаток **0**.","❌ Инвариант нарушен.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Посмотрим на разность второй и первой коробки. Вначале она семь, остаток при делении на три — один. Если все камни в третьей коробке, то в первых двух по нулю, и разность ноль. Остаток другой, а он не может меняться. Ответ: нет."}],"rich":true},{"l":"в","q":"В первой коробке оказался 1 камень. Какое наибольшее число камней может оказаться в третьей коробке?","ak":"num","av":"198","steps":[{"w":["📌 Инвариант: при a = 1 вторая коробка даёт остаток 2, третья — 0 (mod 3).","📏 **Оценка:** во второй хотя бы 2 камня:","=c ≤ 201 − 1 − 2 = 198"],"f":[]},{"w":["🔨 **Пример:**","👉 95 ходов «в третью»: (2, 9, 190)","👉 2 хода «в первую»: (6, 7, 188)","👉 5 ходов «в третью»: (1, 2, 198) ✔️","✅ **Ответ: 198.**"],"f":[]}],"v":[{"b":0,"s":"Если в первой коробке один камень, то из инварианта во второй коробке остаток два при делении на три. Значит, там хотя бы два камня. Всего камней двести один, поэтому в третьей не больше ста девяноста восьми."},{"b":1,"s":"Пример строим ходами по шагам — вся цепочка выписана в решении. В конце получаем один, два и сто девяносто восемь. Ответ: сто девяносто восемь."}],"rich":true}],"tags":["ops"],"facts":["invariant","mod_def","est_ex"],"note":"","n":62},{"id":"90095","d":3,"from":"PDF №013","stem":"Над парами целых чисел проводится операция: из пары (a;b) получается пара (3a+ b;3b− a).","parts":[{"l":"а","q":"Можно ли из какой-то пары получить пару (5;5)?","ak":"yn","av":"ДА","steps":[{"w":["💡 **Идея:** решим систему — найдём, из какой пары получается (5; 5).","=3a + b = 5,     3b − a = 5","=a = 1,     b = 2"],"f":["lin_map"]},{"w":["🔨 **Проверка:** (1; 2) → (3 + 2; 6 − 1) = (5; 5) ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Пусть пара пять, пять получена из пары а, бэ. Тогда три а плюс бэ равно пяти и три бэ минус а равно пяти. Решая систему, находим а равное единице и бэ равное двум."},{"b":0,"f":"lin_map"},{"b":1,"s":"Проверяем: из пары один, два действительно получается пять, пять. Ответ: да."}],"rich":true},{"l":"б","q":"Верно ли, что если пара (c;d) может быть получена из какой-то пары с помощью данной операции, то и пара (−d;c) тоже может быть получена из какой-то пары с помощью данной операции?","ak":"yn","av":"ДА","steps":[{"w":["📌 Пусть (c; d) = (3a + b; 3b − a). Тогда","=(−d; c) = (a − 3b; 3a + b)"],"f":[]},{"w":["💡 Возьмём пару **(−b; a)**:","=(3·(−b) + a;  3a − (−b)) = (a − 3b; 3a + b) = (−d; c) ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Пусть пара цэ, дэ получена из пары а, бэ. Распишем, чему равна пара минус дэ, цэ через а и бэ."},{"b":1,"s":"Попробуем угадать исходную пару для неё. Подходит пара минус бэ, а: подставьте в операцию — получается ровно то, что нужно. Ответ: да."}],"rich":true},{"l":"в","q":"Зададим расстояние между парами целых чисел (a;b) и (c;d) выражением |a− c|+ |b− d|. Найдите наименьшее расстояние от пары (9;2) до пары, полученной из какой-то пары с помощью данной операции.","ak":"num","av":"3","steps":[{"w":["📌 Пара (c; d) получается, если","=a = (3c − d) : 10,    b = (c + 3d) : 10 — целые","👉 Это значит: **c + 3d делится на 10**.","📌 У (9; 2): 9 + 6 = 15 — остаток 5."],"f":[]},{"w":["🔎 Сдвиг (Δc; Δd) должен дать Δc + 3Δd с остатком 5 при делении на 10:","👉 расстояние 1: ±1, ±3 ❌","👉 расстояние 2: ±2, ±4, ±6 ❌"],"f":[]},{"w":["🔨 **Расстояние 3:** Δc = 2, Δd = 1 → (11; 3), она получается из (3; 2) ✔️","✅ **Ответ: 3.**"],"f":["est_ex"]}],"v":[{"b":0,"s":"Сначала поймём, какие пары вообще получаются. Если решить систему в общем виде, исходные числа выражаются дробями со знаменателем десять. Они целые, только когда цэ плюс три дэ делится на десять."},{"b":0,"s":"У пары девять, два эта величина пятнадцать — остаток пять. Значит, нужно сдвинуть пару так, чтобы изменение цэ плюс три изменения дэ давало остаток пять."},{"b":1,"s":"Перебираем маленькие сдвиги. На расстоянии один изменения дают плюс-минус один или три. На расстоянии два — плюс-минус два, четыре или шесть. Пятёрки нет."},{"b":2,"s":"А на расстоянии три подходит сдвиг на два по первой координате и на один по второй: пара одиннадцать, три. Она получается из пары три, два. Ответ: три."},{"b":2,"f":"est_ex"}],"rich":true}],"tags":["ops","eq"],"facts":["lin_map","mod_def","est_ex"],"note":"","n":63},{"id":"91755","d":3,"from":"PDF №014","stem":"Над парами целых чисел проводится операция: из пары (a;b) получается пара (3a+ b;3b+ a).","parts":[{"l":"а","q":"Можно ли из какой-то пары получить пару (5;− 1)?","ak":"yn","av":"ДА","steps":[{"w":["=3a + b = 5,     a + 3b = −1","=a = 2,     b = −1"],"f":["lin_map"]},{"w":["🔨 **Проверка:** (2; −1) → (6 − 1; −3 + 2) = (5; −1) ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Ищем пару, из которой получится пять, минус один. Составляем систему и решаем её: а равно двум, бэ равно минус одному."},{"b":0,"f":"lin_map"},{"b":1,"s":"Проверяем подстановкой — всё сходится. Ответ: да."}],"rich":true},{"l":"б","q":"Верно ли, что если пара (c;d) может быть получена из какой-то пары с помощью данной операции, то и пара (c− d;d− c) тоже может быть получена из какой-то пары с помощью данной операции?","ak":"yn","av":"ДА","steps":[{"w":["📌 (c; d) = (3a + b; a + 3b):","=c − d = 2(a − b),     d − c = 2(b − a)"],"f":[]},{"w":["💡 Возьмём пару **(a − b; b − a)**:","=(3(a − b) + (b − a);  (a − b) + 3(b − a)) = (2(a − b); 2(b − a)) ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Пусть пара цэ, дэ получена из а, бэ. Посчитаем цэ минус дэ и дэ минус цэ — получаются удвоенные разности а и бэ."},{"b":1,"s":"Угадаем исходную пару: а минус бэ и бэ минус а. Подставив её в операцию, получаем ровно нужную пару. Ответ: да."}],"rich":true},{"l":"в","q":"Зададим расстояние между парами целых чисел (a;b) и (c;d) выражением √((a − c)² + (b − d)²) Найдите наименьшее расстояние от пары (9;1) до пары, полученной из какой-то пары с помощью данной операции.","ak":"num","av":"√2","steps":[{"w":["📌 Пара (c; d) получается, если a = (3c − d) : 8 и b = (3d − c) : 8 — целые:","=d ≡ 3c (mod 8)","📌 У (9; 1): 3·9 = 27 — остаток 3, а d = 1 ❌"],"f":[]},{"w":["🔎 Сдвиг должен дать Δd − 3Δc с остатком 2 при делении на 8:","👉 расстояние 1: ±1, ±3 ❌"],"f":[]},{"w":["🔨 **Расстояние √2:** Δc = −1, Δd = −1 → (8; 0), получается из (3; −1) ✔️","✅ **Ответ: √2.**"],"f":[]}],"v":[{"b":0,"s":"Решим систему в общем виде: исходные числа выражаются дробями со знаменателем восемь. Получается условие: дэ и три цэ дают одинаковый остаток при делении на восемь. Для пары девять, один это не так."},{"b":1,"s":"Ищем ближайшую подходящую пару. Сдвиги на расстояние один не помогают — проверка в решении."},{"b":2,"s":"Следующее возможное расстояние между целыми точками — корень из двух, сдвиг по обеим координатам на единицу. Сдвиг на минус один и минус один даёт пару восемь, ноль — она получается из пары три, минус один. Ответ: корень из двух."}],"rich":true}],"tags":["ops","eq"],"facts":["lin_map","mod_def","est_ex"],"note":"","n":64},{"id":"105261","d":3,"from":"PDF №015","stem":"Есть четыре коробки: в первой коробке 101 камень, во второй — 102 камня, в третьей — 103 камня, а в четвёртой камней нет. За один ход берут по одному камню из любых трех коробок и кладут в оставшуюся. Сделали некоторое количество таких ходов.","parts":[{"l":"а","q":"Может ли в первой коробке оказаться 97 камней, во второй — 102 камня, в третьей — 103 камней, а в четвёртой 4 камня?","ak":"yn","av":"ДА","steps":[{"w":["💡 **Инвариант:** ход — три коробки −1, четвёртая +3. А +3 и −1 дают одинаковый остаток при делении на 4.","👉 **Разности** между коробками по mod 4 не меняются."],"f":["invariant"]},{"w":["🔨 **Пример за 4 хода:**","=(101, 102, 103, 0) → (100, 101, 102, 3) → (99, 100, 101, 6)","=→ (98, 103, 100, 5) → (97, 102, 103, 4) ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Ищем, что не меняется. При ходе три коробки теряют по камню, а четвёртая получает три. По модулю четыре прибавить три — то же, что отнять один. Значит, все четыре числа сдвигаются одинаково, и разности по модулю четыре сохраняются."},{"b":0,"f":"invariant"},{"b":1,"s":"Для нужного положения запрета нет, и пример находится за четыре хода: два раза кладём в четвёртую коробку, потом один раз во вторую и од
