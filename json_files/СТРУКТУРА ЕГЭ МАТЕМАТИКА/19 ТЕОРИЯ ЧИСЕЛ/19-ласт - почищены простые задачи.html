<script>
(function(){
"use strict";
// ---------- storage (с запасным вариантом в памяти)
var MEM = {};
var store = {
  get:function(k,d){ try{ var v = localStorage.getItem(k); return v==null? (k in MEM? MEM[k]:d) : JSON.parse(v);}catch(e){ return k in MEM? MEM[k]:d; } },
  set:function(k,v){ MEM[k]=v; try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del:function(k){ delete MEM[k]; try{ localStorage.removeItem(k);}catch(e){} }
};
var K = { content:"ntc_content", profiles:"ntc_profiles", prog:"ntc_p_", theme:"ntc_theme", cur:"ntc_current" };

var BUILTIN = JSON.parse(document.getElementById('app-data').textContent);
var content = store.get(K.content, null) || BUILTIN;
// семя прогресса (если приложение было сохранено вместе с прогрессом)
try{
  var seed = JSON.parse(document.getElementById('seed-progress').textContent||"{}");
  Object.keys(seed).forEach(function(name){ if(!store.get(K.prog+name,null)){ store.set(K.prog+name, seed[name]); addProfile(name); } });
}catch(e){}

function profiles(){ return store.get(K.profiles, []); }
function addProfile(name){ var l = profiles(); if(l.indexOf(name)<0){ l.push(name); store.set(K.profiles,l);} }
function loadProg(name){ var p = store.get(K.prog+name, null); if(!p) p = {name:name, parts:{}, fav:{}, last:null, created:Date.now()}; p.parts=p.parts||{}; p.fav=p.fav||{}; return p; }

var DLAB=['','разминка','базовая','средняя','сложная','олимпиадная'];
var S = { diff:0, user:null, prog:null, cur:null, part:0, filter:"all", tag:"", q:"", drawer:false, drawerAll:false, hl:null, dq:"", listOpen:false };
var theme = store.get(K.theme, (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)?"dark":"light");
document.documentElement.setAttribute('data-theme', theme);

var factById = {}; function indexFacts(){ factById={}; content.facts.forEach(function(f){ factById[f.id]=f; }); }
indexFacts();
function probByN(n){ for(var i=0;i<content.problems.length;i++) if(content.problems[i].id===n) return content.problems[i]; return null; }

// ---------- DOM helper
function h(tag, attrs){
  var el = document.createElement(tag);
  if(attrs) for(var k in attrs){ var v=attrs[k]; if(v==null||v===false) continue;
    if(k==="class") el.className=v; else if(k==="text") el.textContent=v; else if(k.slice(0,2)==="on") el.addEventListener(k.slice(2),v); else if(k==="style") el.setAttribute('style',v); else el.setAttribute(k, v===true?"":v); }
  for(var i=2;i<arguments.length;i++){ var c=arguments[i]; if(c==null||c===false) continue; if(Array.isArray(c)) c.forEach(function(x){ if(x!=null&&x!==false) el.appendChild(typeof x==="string"?document.createTextNode(x):x);}); else el.appendChild(typeof c==="string"?document.createTextNode(c):c); }
  return el;
}
var root = document.getElementById('app');

// ---------- прогресс
function pkey(n,i){ return n+"-"+i; }
function partSt(n,i){ return S.prog.parts[pkey(n,i)] || {}; }
function setPart(n,i,patch){ var k=pkey(n,i); var o=S.prog.parts[k]||{}; for(var x in patch) o[x]=patch[x]; S.prog.parts[k]=o; save(); }
function save(){ store.set(K.prog+S.user, S.prog); }
function probDone(p){ for(var i=0;i<p.parts.length;i++) if(!partSt(p.id,i).ok) return false; return true; }
function totals(){ var all=0, ok=0, full=0; content.problems.forEach(function(p){ all+=p.parts.length; var d=true; p.parts.forEach(function(_,i){ if(partSt(p.id,i).ok) ok++; else d=false; }); if(d) full++; }); return {all:all, ok:ok, full:full}; }

// ---------- проверка ответов
function parseNum(s){
  s = String(s).trim().toLowerCase().replace(/−/g,'-').replace(/%/g,'').replace(/\s+/g,' ');
  if(/^(√|sqrt|корень)/.test(s)){ var m=s.replace(/^(√|sqrt|корень( из)?)\s*\(?/,'').replace(/\)$/,''); var v=parseNum(m); return v==null?null:Math.sqrt(v); }
  var mixed = s.match(/^(-?\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(mixed){ var w=+mixed[1]; var fr=(+mixed[2])/(+mixed[3]); return w<0? w-fr : w+fr; }
  s = s.replace(/\s/g,'').replace(',', '.');
  var fm = s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
  if(fm){ var d=+fm[2]; return d? (+fm[1])/d : null; }
  if(/^-?\d+(\.\d+)?$/.test(s)) return +s;
  return null;
}
function near(a,b){ return Math.abs(a-b) < 1e-9*Math.max(1,Math.abs(b)); }
function checkAnswer(part, input){
  if(part.ak==="yn") return input===part.av;
  if(part.ak==="num"){ var a=parseNum(input), b=parseNum(part.av); return a!=null && b!=null && near(a,b); }
  if(part.ak==="set"){
    var want = part.av.split(';').map(parseNum).sort(function(x,y){return x-y;});
    var got = String(input).replace(/−/g,'-').split(/[;,]|\s*и\s*|\s+/i).map(function(x){return x.trim();}).filter(Boolean).map(parseNum);
    if(got.some(function(x){return x==null;})) return false;
    got.sort(function(x,y){return x-y;});
    if(got.length!==want.length) return false;
    for(var i=0;i<got.length;i++) if(!near(got[i],want[i])) return false; return true;
  }
  return false;
}

// ---------- экраны
function render(){
  var m=document.getElementById('main'); var top=m? m.scrollTop:0;
  if(S.resetScroll){ top=0; S.resetScroll=false; }
  root.innerHTML="";
  if(!S.user) return renderLogin();
  renderApp();
  var m2=document.getElementById('main'); if(m2) m2.scrollTop=top;
}

function renderLogin(){
  var inp = h('input',{class:'field',placeholder:'Имя ученика',maxlength:'40',autocomplete:'off'});
  function go(){ var v=inp.value.trim(); if(!v){ inp.focus(); return;} login(v); }
  inp.addEventListener('keydown',function(e){ if(e.key==="Enter") go(); });
  var list = profiles();
  var card = h('div',{class:'login-card'},
    h('h1',null,'Теория чисел'),
    h('p',null,'Самоучитель по задачам ЕГЭ №19: '+content.problems.length+' задач (от простых к сложным), '+content.facts.length+' фактов теории с примерами, пошаговые решения. Прогресс хранится на этом устройстве отдельно для каждого ученика.'),
    h('div',{class:'row'}, inp, h('button',{class:'btn primary',onclick:go},'Начать')),
    list.length? h('div',{class:'names'}, h('div',{class:'sec',style:'margin:6px 0 2px'},'Уже занимались'),
      list.map(function(nm){ var p=loadProg(nm); var c=0; for(var k in p.parts) if(p.parts[k].ok) c++;
        return h('button',{class:'name-item',onclick:function(){login(nm);}}, h('span',null,h('b',null,nm)), h('small',null,'решено пунктов: '+c)); })) : null,
    h('div',{class:'row',style:'margin-top:18px;justify-content:space-between'},
      h('button',{class:'btn small ghost',onclick:importDialog},'⇪ Импорт JSON'),
      h('button',{class:'btn small ghost',onclick:toggleTheme}, theme==="dark"?'☀ Светлая тема':'☾ Тёмная тема'))
  );
  root.appendChild(h('div',{class:'login'},card));
  setTimeout(function(){ inp.focus(); },50);
}
function login(name){
  addProfile(name); S.user=name; S.prog=loadProg(name); S.prog.name=name; save(); store.set(K.cur,name);
  S.cur = (S.prog.last && probByN(S.prog.last)) ? S.prog.last : (firstUnsolved() || content.problems[0].id); S.part=firstUnsolvedPart(probByN(S.cur));
  render();
}
function firstUnsolved(after){
  var ps=content.problems, start=0;
  if(after!=null){ for(var i=0;i<ps.length;i++) if(ps[i].id===after){ start=i+1; break; } }
  for(var j=0;j<ps.length;j++){ var p=ps[(start+j)%ps.length]; if(!probDone(p)) return p.id; }
  return null;
}
function firstUnsolvedPart(p){ if(!p) return 0; for(var i=0;i<p.parts.length;i++) if(!partSt(p.id,i).ok) return i; return 0; }

function toggleTheme(){ theme = theme==="dark"?"light":"dark"; document.documentElement.setAttribute('data-theme',theme); store.set(K.theme,theme); render(); }

// ---------- основной экран
var menuEl=null;
function renderApp(){
  var t = totals();
  var pct = t.all? Math.round(100*t.ok/t.all):0;
  var header = h('header',{class:'top'},
    h('button',{class:'iconbtn mobile-only',title:'Список задач',onclick:function(){ S.listOpen=!S.listOpen; render(); }},'☰'),
    h('div',{class:'brand'},'Теория чисел · №19'),
    h('div',{class:'who'},
      h('span',{class:'nm'},S.user),
      h('div',{class:'bar',title:'Решено пунктов: '+t.ok+' из '+t.all},h('i',{style:'width:'+pct+'%'})),
      h('span',{class:'pc'},pct+'%')),
    h('button',{class:'iconbtn',title:'Теория',onclick:function(){ openDrawer(null,true); }},'📘'),
    h('button',{class:'iconbtn',title:'Меню',onclick:function(e){ e.stopPropagation(); toggleMenu(); }},'⋯')
  );
  var body = h('div',{class:'body'}, renderList(), h('main',{id:'main'}, renderProblem()));
  root.appendChild(h('div',{class:'app'}, header, body));
  if(S.listOpen) root.appendChild(h('div',{class:'scrim',style:'z-index:25',onclick:function(){S.listOpen=false;render();}}));
  root.appendChild(renderDrawer());
  if(S.drawer) root.appendChild(h('div',{class:'scrim',onclick:closeDrawer}));
}
function toggleMenu(){
  if(menuEl){ menuEl.remove(); menuEl=null; return; }
  function item(txt,fn){ return h('button',{onclick:function(){ menuEl&&menuEl.remove(); menuEl=null; fn(); }},txt); }
  menuEl = h('div',{class:'menu'},
    item('📊 Прогресс ученика', statsDialog),
    item(theme==="dark"?'☀ Светлая тема':'☾ Тёмная тема', toggleTheme),
    h('hr'),
    item('⇩ Экспорт JSON…', exportDialog),
    item('⇪ Импорт JSON…', importDialog),
    item('💾 Сохранить приложение целиком (.html)', saveAppDialog),
    h('hr'),
    item('↺ Сбросить прогресс ученика…', resetProgress),
    item('👤 Сменить ученика', function(){ S.user=null; S.prog=null; render(); })
  );
  document.body.appendChild(menuEl);
  setTimeout(function(){ document.addEventListener('click', function cl(e){ if(menuEl && !menuEl.contains(e.target)){ menuEl.remove(); menuEl=null; } document.removeEventListener('click',cl); }); },0);
}

function filtered(){
  var q=S.q.trim().toLowerCase();
  return content.problems.filter(function(p){
    if(S.tag && p.tags.indexOf(S.tag)<0) return false;
    if(S.diff && p.d!==S.diff) return false;
    var done=probDone(p);
    if(S.filter==="todo" && done) return false;
    if(S.filter==="done" && !done) return false;
    if(S.filter==="fav" && !S.prog.fav[p.id]) return false;
    if(q){ var hay=(p.n+" "+p.id+" "+p.stem+" "+p.parts.map(function(x){return x.q;}).join(' ')).toLowerCase(); if(hay.indexOf(q)<0) return false; }
    return true;
  });
}
function renderList(){
  var seg = h('div',{class:'seg'}, [["all","Все"],["todo","Решить"],["done","Решены"],["fav","★"]].map(function(x){
    return h('button',{class:S.filter===x[0]?'on':'',onclick:function(){ S.filter=x[0]; render(); }},x[1]); }));
  var sel = h('select',{class:'tagsel',onchange:function(e){ S.tag=e.target.value; render(); }}, h('option',{value:''},'Все темы'),
    Object.keys(content.tags||{}).map(function(k){ var o=h('option',{value:k},content.tags[k]); if(S.tag===k) o.selected=true; return o; }));

function applyImport(obj){
  var msgs=[];
  if(obj && Array.isArray(obj.problems) && Array.isArray(obj.facts)) obj = {content:obj};
  if(obj.content && Array.isArray(obj.content.problems)){
    var c=obj.content; if(!c.facts) c.facts=content.facts; if(!c.sections) c.sections=content.sections; if(!c.tags) c.tags=content.tags;
    c.problems.forEach(function(p){ p.parts=p.parts||[]; p.tags=p.tags||[]; p.facts=p.facts||[]; p.parts.forEach(function(pt){ pt.steps=pt.steps||[]; }); });
    content=c; store.set(K.content,c); indexFacts(); msgs.push('задач: '+c.problems.length+', фактов: '+c.facts.length);
  }
  if(obj.progress){
    Object.keys(obj.progress).forEach(function(name){
      var inc=obj.progress[name]; var cur=loadProg(name);
      Object.keys(inc.parts||{}).forEach(function(k){ var a=cur.parts[k]||{}, b=inc.parts[k];
        cur.parts[k]={ok:a.ok||b.ok, tries:Math.max(a.tries||0,b.tries||0), steps:Math.max(a.steps||0,b.steps||0), clean:(a.ok&&a.clean)||(b.ok&&b.clean), at:Math.max(a.at||0,b.at||0)}; });
      Object.keys(inc.fav||{}).forEach(function(k){ cur.fav[k]=true; });
      if(!cur.last) cur.last=inc.last;
      store.set(K.prog+name,cur); addProfile(name);
      if(S.user===name) S.prog=cur;
    });
    msgs.push('прогресс учеников: '+Object.keys(obj.progress).join(', '));
  }
  return msgs;
}

pow2: {w: ['📌 Сумма степеней двойки, идущих подряд с 1, **на 1 меньше** следующей степени:', '=1 + 2 = 3 = 4 − 1', '=1 + 2 + 4 = 7 = 8 − 1', '=1 + 2 + 4 + 8 = 15 = 16 − 1', '📌 Любое натуральное число **единственным образом** раскладывается в сумму разных степеней двойки (двоичная запись):', '=13 = 8 + 4 + 1,     22 = 16 + 4 + 2', '👉 Гирями 1, 2, 4, …, 2ᵏ⁻¹ можно отвесить любой вес от 1 до 2ᵏ − 1.'],

lin_dioph: {w: ['📌 Уравнения в **целых** числах вида', '=ax + by = c', '👉 Решаем **перебором** той переменной, у которой **мало вариантов** (таблицей), или смотрим на остатки.', '👉 Из двух уравнений с тремя неизвестными выражаем всё **через одну** переменную.', '💡 Пример: 3x = 5y в натуральных → x = 5t, y = 3t.'],

factor: {w: ['📌 Приём: приводим уравнение к виду **(…)·(…) = число** и перебираем делители этого числа.', '=x² − y² = (x − y)(x + y)', '=uv − u − v = (u − 1)(v − 1) − 1', '💡 Пример: (x − 1)(y − 1) = 7 → одна скобка 1, другая 7.'],

vieta: {w: ['📌 **Теорема Виета** для x² + px + q = 0 с корнями x₁, x₂:', '=x₁ + x₂ = −p,     x₁·x₂ = q', '💡 Пример: x² − 7x + 10 = 0 → корни 2 и 5 (сумма 7, произведение 10).'],
  say: 'Для приведённого квадратного уравнения сумма корней равна второму коэффициенту с обратным знаком, а произведение корней равно свободному члену.'},
squares_sum: {w: ['📌 Выражение через квадраты разностей:', '=a² + b² + c² − ab − bc − ca = ½·[(a − b)² + (b − c)² + (c − a)²]', '👉 Если x = a − b, y = b − c, то это равно x² + xy + y².'],
  say: 'Сумма квадратов трёх чисел минус их попарные произведения равна половине суммы квадратов попарных разностей. Если обозначить разности через икс и игрек, выражение становится икс в квадрате плюс икс игрек плюс игрек в квадрате.'},
mean: {w: ['📌 **Среднее = сумма : количество**, значит', '=сумма = среднее · количество', '📌 Среднее **не меньше наименьшего** и **не больше наибольшего** числа.', '💡 Пример: 4 числа со средним 6 → их сумма 24.'],
  say: 'Среднее арифметическое — это сумма, делённая на количество. Значит, сумму всегда можно найти как среднее, умноженное на количество. И среднее всегда лежит между самым маленьким и самым большим числом.'},
mean_move: {w: ['📌 Убираем из группы число **меньше среднего** → среднее **растёт**.', '📌 Добавляем в группу число **больше среднего** → среднее **растёт**.', '=новое среднее = (n·m ± x) : (n ± 1)', '👉 n — сколько было чисел, m — их среднее.', '💡 Пример: 2, 4, 9 (среднее 5); убрали 2 → 4, 9 (среднее 6,5).'],
  say: 'Если из группы убрать число меньше среднего, среднее вырастет, а если больше — уменьшится. Если добавить число больше среднего, среднее вырастет. Новое среднее удобно считать так: старая сумма — это количество, умноженное на среднее; исправляем её и делим на новое количество.'},
percent: {w: ['📌 **p% от числа N:**', '=N · p : 100', '📌 **Какую долю в процентах составляет k от n:**', '=k : n · 100%', '👉 «Увеличилось на 10%» → стало 1,1 от прежнего.', '💡 Примеры:  20% от 30 = 30·20 : 100 = 6;   6 из 30 — это 6 : 30 · 100% = 20%'],

rounding: {w: ['📌 Число x **округляется до целого k**, если', '=k − 0,5 ≤ x < k + 0,5', '💡 Пример: 7,49 → 7,   7,5 → 8'],
  say: 'Число округляется до целого ка, если отличается от ка меньше чем на половину: оно не меньше ка минус ноль целых пять десятых и меньше ка плюс ноль целых пять десятых. Так округление превращается в двойное неравенство.'},
frac_monot: {w: ['📌 Дробь **больше**, если **числитель больше** или **знаменатель меньше**.', '📌 Если к числителю и знаменателю правильной дроби прибавлять одно и то же число, дробь **растёт**.', '💡 Пример: 1/3 < 2/4 < 3/5 < 4/6'],

est_ex: {w: ['📌 Чтобы найти **наибольшее** или **наименьшее** значение:', '1️⃣ **Оценка** — доказываем, что лучше быть **не может**.', '2️⃣ **Пример** — показываем, что это значение **достигается**.', '❗ Без примера ответ не засчитывается.'],

extreme: {w: ['📌 Рассмотрите **наименьший** или **наибольший** элемент.', '👉 Для него условия задачи дают **самые сильные ограничения** — с него удобно начинать рассуждение.'],

dirichlet: {w: ['📌 Если **n + 1** предмет разложить в **n** ящиков, то в каком-то ящике окажутся **хотя бы 2** предмета.', '👉 Длинная последовательность из небольшого набора значений обязательно **повторяется**.', '💡 Пример: среди любых 13 человек двое родились в одном месяце.'],

distinct_min: {w: ['📌 Сумма k **различных** натуральных чисел **наименьшая**, когда это k самых маленьких подходящих чисел.', '📌 Если все числа **меньше x** и различны, их сумма не больше', '=(x − 1) + (x − 2) + … + (x − k)', '💡 Пример: 5 разных чётных чисел в сумме дают хотя бы 2 + 4 + 6 + 8 + 10 = 30.'],

tau: {w: ['📌 Если n = p₁^a₁ · p₂^a₂ · …, то **количество делителей**', '=(a₁ + 1)(a₂ + 1)…', '💡 Пример: 12 = 2²·3 → (2 + 1)(1 + 1) = 6 делителей: 1, 2, 3, 4, 6, 12'],

gmean: {w: ['📌 **Среднее геометрическое** n чисел — корень n-й степени из их произведения.', '👉 Оно целое, если произведение — это **n-я степень** целого числа (все показатели в разложении делятся на n).', '💡 Пример: 2·8 = 16 = 4² → среднее геометрическое 2 и 8 равно 4.'],

floor: {w: ['📌 **[x] — целая часть**: наибольшее целое, не больше x.', '=[x] ≤ x < [x] + 1', '💡 Примеры: [3,7] = 3,   [5] = 5,   [7 : 2] = 3'],

  var st = document.createElement('style'); st.textContent =
