 тоже 36 ❌","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"У Васи сумма хотя бы шесть, у Пети — не больше тридцати шести. В шесть раз больше может быть только при шести и тридцати шести. Но тогда у Пети все минимумы строк шесть, то есть вся таблица из шестёрок, и у Васи тоже тридцать шесть. Ответ: нет."}],"rich":true},{"l":"в","q":"В какое наибольшее число раз сумма у Пети может быть больше, чем сумма у Васи?","ak":"num","av":"31/6","steps":[{"w":["✏️ Пусть **a** — наименьшее число в таблице.","📌 В его строке минимум a → Петя ≤ a + 5·6.","📌 Все числа ≥ a → Вася ≥ 6a.","=отношение ≤ (a + 30) : (6a) = 1/6 + 5/a ≤ 31/6"],"f":[]},{"w":["🔨 **Пример:** одна строка единиц, остальные шестёрки: 31 : 6.","✅ **Ответ: 31/6.**"],"f":[]}],"v":[{"b":0,"s":"Посмотрим на самое маленькое число таблицы а. В его строке Петя найдёт а, а остальные пять строк дают не больше шести каждая. У Васи все минимумы не меньше а, то есть сумма хотя бы шесть а."},{"b":0,"s":"Отношение не больше, чем а плюс тридцать, делённое на шесть а. Оно наибольшее при а равном единице — тридцать одна шестая."},{"b":1,"s":"Пример: одна строка единиц, а всё остальное — шестёрки. У Пети тридцать один, у Васи шесть. Ответ: тридцать одна шестая."}],"rich":true}],"tags":["est"],"facts":["extreme","est_ex"],"note":"","n":93},{"id":"18501","d":3,"from":"Школково","stem":"Каждое из чисел 1, −2, −3, 4, −5, 7, −8, 9, 10, −11 по одному записывают на 10 карточках. Карточки переворачивают и на чистых сторонах снова пишут по одному каждое из этих чисел. Числа на каждой карточке складывают, а 10 сумм перемножают.","parts":[{"l":"а","q":"Может ли в результате получиться 0?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Сумма на карточке равна 0, только если там x и −x.","❌ Противоположных чисел в наборе нет.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Произведение равно нулю, только если одна из сумм равна нулю, то есть на карточке число и противоположное ему. В нашем наборе таких пар нет. Ответ: нет."}],"rich":true},{"l":"б","q":"Может ли в результате получиться 1?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Нечётных чисел в наборе 6 → на двух сторонах всего **12** нечётных, а карточек 10.","👉 Есть карточка с **двумя нечётными** → её сумма чётная.","❌ Произведение чётное, не 1.","✅ **Ответ: нет.**"],"f":["parity"]}],"v":[{"b":0,"s":"В наборе шесть нечётных чисел, и на каждой стороне они встречаются по разу — всего двенадцать нечётных на десяти карточках. Значит, на какой-то карточке оба числа нечётные, и сумма чётная."},{"b":0,"f":"parity"},{"b":0,"s":"Тогда и всё произведение чётное, единицей оно быть не может. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое наименьшее целое неотрицательное число может в результате получиться?","ak":"num","av":"4","steps":[{"w":["📏 Карточек «нечётное + нечётное» хотя бы **2** → произведение делится на 4 и не равно 0 → **≥ 4**."],"f":[]},{"w":["🔨 **Пример:** карточки 1|−2, −2|1, −3|4, 4|−3, −5|7, 7|−5, −8|9, 9|−8, 10|−11, −11|10","=суммы: −1, −1, 1, 1, 2, 2, 1, 1, −1, −1   →   произведение 4","✅ **Ответ: 4.**"],"f":[]}],"v":[{"b":0,"s":"Двенадцать нечётных чисел на десяти карточках — значит, карточек с двумя нечётными хотя бы две. Каждая даёт чётную сумму, и произведение делится на четыре. Нулём оно быть не может, поэтому наименьшее неотрицательное значение хотя бы четыре."},{"b":1,"s":"Пример: ставим на обороте соседнее по величине число, чтобы суммы были маленькими — плюс-минус один, и только две суммы равны двум. Произведение четыре. Ответ: четыре."}],"rich":true}],"tags":["est","div"],"facts":["parity","est_ex"],"note":"","n":94},{"id":"19534","d":3,"from":"Школково","stem":"Есть синие и красные карточки. Всего карточек 50 штук. На каждой карточке написано натуральное число. Среднее арифметическое всех записанных на карточках чисел равно 16. Все числа на синих карточках разные. При этом любое число на синей карточке больше, чем любое число на красной. Числа на синих карточках увеличили в 2 раза, после чего среднее арифметическое всех записанных на карточках чисел стало равно 31,2.","parts":[{"l":"а","q":"Может ли быть 10 синих карточек?","ak":"yn","av":"ДА","steps":[{"w":["📌 Сумма была 50·16 = 800, стала 50·31,2 = 1560 → синие добавили 760, то есть **синие = 760**, красные = 40."],"f":["mean"]},{"w":["🔨 **10 синих:** 40 красных по 1, синие 71, 72, …, 79 и 85","=71 + … + 79 + 85 = 675 + 85 = 760 ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Сумма всех чисел была восемьсот, а стала тысяча пятьсот шестьдесят. Удвоение синих чисел добавило ровно их сумму, значит, синие в сумме дают семьсот шестьдесят, а красные — сорок."},{"b":0,"f":"mean"},{"b":1,"s":"Пусть синих десять. Тогда красных сорок, и они дают сумму сорок — все единицы. Синие — разные числа больше единицы с суммой семьсот шестьдесят, например от семидесяти одного до семидесяти девяти и ещё восемьдесят пять. Ответ: да."}],"rich":true},{"l":"б","q":"Может ли быть 10 красных карточек?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 10 красных → **40 синих**, все разные и больше любого красного (≥ 1):","=синие ≥ 2 + 3 + … + 41 = 860 > 760","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Если красных десять, то синих сорок. Они разные и больше любого красного, то есть хотя бы два, три и так далее до сорока одного. Их сумма уже больше семисот шестидесяти. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое наибольшее количество синих карточек может быть?","ak":"num","av":"35","steps":[{"w":["✏️ **b** синих, 50 − b красных с суммой 40 → наибольшее красное **r ≥ 40 : (50 − b)**.","📌 Синие больше r и различны:","=сумма синих ≥ (r + 1) + … + (r + b)"],"f":[]},{"w":["📏 **b = 36:** r ≥ 3 → синие ≥ 4 + … + 39 = 774 > 760 ❌ → **b ≤ 35**."],"f":[]},{"w":["🔨 **Пример, b = 35:** красные — десять троек и пять двоек (сумма 40); синие 4, 5, …, 37 и 63 (сумма 760).","✅ **Ответ: 35.**"],"f":[]}],"v":[{"b":0,"s":"Пусть синих Бэ. Тогда красных пятьдесят минус Бэ с суммой сорок, поэтому самое большое красное число хотя бы сорок, делённое на их количество."},{"b":0,"s":"Синие числа все разные и больше этого красного. Значит, их сумма не меньше суммы Бэ чисел подряд, начиная с эр плюс один."},{"b":1,"s":"При тридцати шести синих красных четырнадцать, и наибольшее красное хотя бы три. Тогда синие не меньше четырёх, пяти и так далее, и их сумма больше семисот шестидесяти. Значит, синих не больше тридцати пяти."},{"b":2,"s":"Пример на тридцать пять синих выписан в решении. Ответ: тридцать пять."}],"rich":true}],"tags":["avg"],"facts":["mean","distinct_min","est_ex"],"note":"","n":95},{"id":"21796","d":3,"from":"Школково","stem":"","parts":[{"l":"а","q":"Можно ли вычеркнуть несколько цифр из числа 123456789 так, чтобы получилось число, кратное 72?","ak":"yn","av":"ДА","steps":[{"w":["📌 72 = 8·9 → нужно: **три последние цифры** делятся на 8, **сумма цифр** делится на 9.","🔨 Из 123456789 оставим **3456**:","=3 + 4 + 5 + 6 = 18,     456 = 8·57","=3456 = 72·48 ✔️","✅ **Ответ: да.**"],"f":["div_comp"]}],"v":[{"b":0,"s":"Семьдесят два — это восемь на девять, поэтому число должно делиться на восемь и на девять. На восемь — если делится число из трёх последних цифр, на девять — если сумма цифр делится на девять."},{"b":0,"f":"div_comp"},{"b":0,"s":"Оставим цифры три, четыре, пять и шесть. Сумма цифр восемнадцать, а четыреста пятьдесят шесть делится на восемь. Число три тысячи четыреста пятьдесят шесть — это семьдесят два на сорок восемь. Ответ: да."}],"rich":true},{"l":"б","q":"Можно ли вычеркнуть несколько цифр из числа 846927531 так, чтобы получилось число, кратное 72?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Число чётное → оканчивается на 8, 4, 6 или 2.","🔎 Перебираем последнюю цифру:","👉 на **2**: перед ней можно взять 8, 4, 6, 9 — нужной суммы цифр не набрать ❌","👉 на **6**: возможно только 846 и его части — на 8 и 9 не делятся ❌","👉 на **4** или **8**: числа 84, 4, 8 — на 9 не делятся ❌","✅ **Ответ: нет.**"],"f":["div_rules"]}],"v":[{"b":0,"s":"Число должно быть чётным, значит, оно оканчивается на восемь, четыре, шесть или два. Переберём эти варианты."},{"b":0,"f":"div_rules"},{"b":0,"s":"Если в конце двойка, то перед ней можно взять только цифры восемь, четыре, шесть и девять, и ни один набор не даёт сумму цифр, кратную девяти. Если в конце шестёрка, получаются числа из цифр восемь, четыре, шесть — не подходят. Если в конце четвёрка или восьмёрка — совсем короткие числа, на девять не делятся."},{"b":0,"s":"Ни один вариант не работает. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое наибольшее количество цифр можно вычеркнуть из числа 124875963 так, чтобы получилось число, кратное 72?","ak":"num","av":"5","steps":[{"w":["📏 Числа из трёх и меньше цифр, кратные 72, из 124875963 не получить — перебор окончаний, как в пункте б.","🔨 Четырёхзначное можно:","=1296 = 72·18","👉 Вычеркнули 9 − 4 = **5** цифр.","✅ **Ответ: 5.**"],"f":[]}],"v":[{"b":0,"s":"Чем меньше цифр останется, тем больше вычеркнули. Проверим, можно ли оставить три цифры или меньше: перебирая окончания, как в пункте бэ, убеждаемся, что нельзя."},{"b":0,"s":"А четыре цифры оставить можно: тысяча двести девяносто шесть — это семьдесят два на восемнадцать. Значит, вычеркнули пять цифр. Ответ: пять."}],"rich":true}],"tags":["div","digits"],"facts":["div_comp","div_rules","subseq","est_ex"],"note":"","n":96},{"id":"23301","d":3,"from":"Школково","stem":"Саша берёт пять различных натуральных чисел и проделывает с ними следующие операции. Сначала вычисляет среднее арифметическое первых двух чисел, затем среднее арифметическое результата и третьего числа, потом среднее арифметическое полученного результата и четвёртого числа, потом среднее арифметическое полученного результата и пятого числа — число A.","parts":[{"l":"а","q":"Может ли число A равняться среднему арифметическому пяти чисел, выбранных изначально?","ak":"yn","av":"ДА","steps":[{"w":["📌 Распишем A:","=A = a/16 + b/16 + c/8 + d/4 + e/2","🔨 **Пример:** 1, 3, 4, 5, 2","=A = 1/16 + 3/16 + 1/2 + 5/4 + 1 = 3,     среднее 15 : 5 = 3 ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Посмотрим, с каким весом каждое число входит в результат. Каждое новое усреднение делит всё предыдущее пополам. Поэтому последнее число входит с весом одна вторая, предпоследнее — одна четвёртая, и так далее, а первые два — по одной шестнадцатой."},{"b":0,"s":"Подбираем числа так, чтобы получилось среднее. Например, один, три, четыре, пять, два: А равно трём, и среднее арифметическое тоже три. Ответ: да."}],"rich":true},{"l":"б","q":"Может ли число A быть в пять раз больше среднего арифметического пяти чисел, выбранных изначально?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Все коэффициенты в формуле A **меньше 1**:","=A \u003c a + b + c + d + e = 5·(среднее)","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Каждое число входит в А с коэффициентом меньше единицы. Значит, А меньше суммы всех чисел, а сумма — это ровно пять средних. Ответ: нет."}],"rich":true},{"l":"в","q":"В какое наибольшее целое число раз число A может быть больше среднего арифметического пяти чисел, выбранных изначально?","ak":"num","av":"2","steps":[{"w":["📏 Все коэффициенты **не больше 1/2**, а у четырёх чисел меньше:","=A \u003c сумма : 2 = 2,5·(среднее)","👉 Целое отношение не больше **2**."],"f":[]},{"w":["🔨 **Пример:** 1, 3, 2, 4, 25","=A = 1/16 + 3/16 + 1/4 + 1 + 12,5 = 14,     среднее 7","✅ **Ответ: 2.**"],"f":[]}],"v":[{"b":0,"s":"Наибольший вес — одна вторая, у последнего числа. Значит, А меньше половины суммы, то есть меньше двух с половиной средних. Целое отношение не больше двух."},{"b":1,"s":"Чтобы получить два, последнее число должно быть очень большим. Пример: один, три, два, четыре и двадцать пять. А равно четырнадцати, а среднее семи. Ответ: два."}],"rich":true}],"tags":["avg"],"facts":["mean","est_ex"],"note":"","n":97},{"id":"24200","d":3,"from":"Школково","stem":"На доске написаны числа 2 и 3. За один ход из чисел a и b можно получить числа a+ b и 2a− 1 или числа a+ b и 2b− 1. Например, из чисел 2 и 3 можно получить числа 5 и 3 или числа 5 и 5.","parts":[{"l":"а","q":"Приведите пример последовательности ходов, после которых одно из чисел на доске окажется равным 19.","ak":"self","av":"(2, 3) → (5, 5) → (10, 9) → (19, 19).","steps":[{"w":["🔨 **Ходы:**","=(2, 3) → (5, 5) → (10, 9) → (19, 19)","👉 каждый раз: сумма и удвоенное число минус 1."],"f":[]}],"v":[{"b":0,"s":"Просто попробуем. Из двух и трёх получаем пять и пять — сумму и удвоенную тройку минус один. Из пяти и пяти — десять и девять. Из десяти и девяти — девятнадцать и девятнадцать. Пример готов."}],"rich":true},{"l":"б","q":"Может ли после 100 ходов одно из двух чисел на доске оказаться равным 200?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 После хода меньшее из чисел **растёт хотя бы на 2**:","=после 1-го хода меньшее ≥ 3,   после 100-го ≥ 3 + 2·99 = 201","❌ Тогда оба числа больше 200.","✅ **Ответ: нет.**"],"f":["monovar"]}],"v":[{"b":0,"s":"Проследим за меньшим из двух чисел. Новые числа — это сумма и удвоенное число минус один, и обе величины хотя бы на два больше прежнего меньшего числа."},{"b":0,"f":"monovar"},{"b":0,"s":"После первого хода меньшее число хотя бы три, и каждый следующий ход добавляет хотя бы два. После сотого хода меньшее хотя бы двести один, и двухсот на доске быть не может. Ответ: нет."}],"rich":true},{"l":"в","q":"Сделали 1007 ходов, причем на доске не было равных чисел. Какое наименьшее значение может принимать разность большего и меньшего из двух полученных чисел?","ak":"num","av":"2","steps":[{"w":["💡 **Идея:** следим за **разностью** чисел. Каждый ход её модуль меняется **ровно на 1**.","📌 Вначале модуль 1, ходов 1007 — **нечётное** число → в конце модуль **чётный**.","👉 Числа не равны → разность **≥ 2**."],"f":["invariant"]},{"w":["🔨 Чередуем: модуль разности 1, 2, 1, 2, … → в конце 2.","✅ **Ответ: 2.**"],"f":[]}],"v":[{"b":0,"s":"Посмотрим на разность чисел. Если расписать новые числа, окажется, что модуль разности каждый ход увеличивается или уменьшается ровно на единицу."},{"b":0,"f":"invariant"},{"b":0,"s":"Вначале разность один. Каждый ход меняет её чётность. Ходов тысяча семь — нечётное число, значит, в конце разность чётная. А числа не равны, поэтому разность хотя бы два."},{"b":1,"s":"И двойка достигается: можно ходить так, чтобы разность всё время была один, два, один, два — в конце окажется два. Ответ: два."}],"rich":true}],"tags":["ops"],"facts":["invariant","parity","monovar","est_ex"],"note":"","n":98},{"id":"24439","d":3,"from":"Школково","stem":"Первый член конечной геометрической прогрессии, состоящей из трёхзначных натуральных чисел, равен 128. Известно, что в прогрессии не меньше трёх чисел.","parts":[{"l":"а","q":"Может ли число 686 являться членом такой прогрессии?","ak":"yn","av":"ДА","steps":[{"w":["=686 : 128 = 343/64 = (7/4)³","🔨 **Прогрессия** с q = 7/4:","=128, 224, 392, 686 ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Разделим шестьсот восемьдесят шесть на сто двадцать восемь: получается триста сорок три шестьдесят четвёртых. Это семь четвёртых в кубе. Значит, знаменатель прогрессии семь четвёртых."},{"b":0,"s":"Прогрессия: сто двадцать восемь, двести двадцать четыре, триста девяносто два, шестьсот восемьдесят шесть. Все трёхзначные. Ответ: да."}],"rich":true},{"l":"б","q":"Может ли число 496 являться членом такой прогрессии?","ak":"yn","av":"НЕТ","steps":[{"w":["=496 : 128 = 31/8","📌 31/8 — не квадрат и не куб дроби → 496 может быть только **вторым** членом.","❌ Тогда третий 496·31/8 > 999 — не трёхзначный.","✅ **Ответ: нет.**"],"f":["gp"]}],"v":[{"b":0,"s":"Отношение четырёхсот девяноста шести к ста двадцати восьми — тридцать одна восьмая. Это не квадрат и не куб никакой дроби, значит, четыреста девяносто шесть может быть только вторым членом."},{"b":0,"f":"gp"},{"b":0,"s":"Но тогда третий член ещё в тридцать одну восьмую раза больше — это уже не трёхзначное число. А членов хотя бы три. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое наибольшее число может являться членом такой прогрессии?","ak":"num","av":"972","steps":[{"w":["📌 Знаменатель q = p/r, и r — степень двойки (128 = 2⁷).","🔎 Перебираем:","👉 целые q: максимум 512 (128, 256, 512)","👉 q = 3/2: 128, 192, 288, 432, 648, **972**","👉 q = 5/2: до 800;   q = 11/4: до 968","👉 r ≥ 16 — помещаются только 2 члена"],"f":[]},{"w":["✅ **Ответ: 972.**"],"f":[]}],"v":[{"b":0,"s":"Знаменатель прогрессии — дробь. Чтобы члены были целыми, на её знаменатель должен делиться сто двадцать восемь, то есть это степень двойки. Переберём варианты."},{"b":0,"s":"Целый знаменатель даёт не больше пятисот двенадцати. Знаменатель три вторых даёт длинную прогрессию, последний член девятьсот семьдесят два. Остальные варианты дают меньше, а с большими степенями двойки в знаменателе помещается всего два члена."},{"b":1,"s":"Ответ: девятьсот семьдесят два."}],"rich":true}],"tags":["seq"],"facts":["gp","fta","est_ex"],"note":"","n":99},{"id":"24440","d":3,"from":"Школково","stem":"В последовательности из 80 целых чисел каждое число (кроме первого и последнего) больше среднего арифметического соседних чисел. Первый и последний члены последовательности равны 0.","parts":[{"l":"а","q":"Может ли второй член такой последовательности быть отрицательным?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Условие = **шаги убывают**: d₁ > d₂ > … > d₇₉.","📌 Концы равны 0 → сумма шагов 0 → первый шаг d₁ > 0.","=a₂ = 0 + d₁ > 0","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Как и в похожей задаче, условие означает, что шаги между соседними числами строго уменьшаются. Первое и последнее числа равны нулю, поэтому сумма всех шагов ноль."},{"b":0,"s":"Если шаги убывают и в сумме дают ноль, то первый, самый большой шаг положительный. А второй член как раз равен первому шагу. Значит, он положительный. Ответ: нет."}],"rich":true},{"l":"б","q":"Может ли второй член такой последовательности быть равным 20?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Шаги целые и убывают → d_k ≤ d₁ − (k − 1):","=0 = d₁ + … + d₇₉ ≤ 79d₁ − (0 + 1 + … + 78) = 79d₁ − 3081","=d₁ ≥ 39","❌ 20 \u003c 39.","✅ **Ответ: нет.**"],"f":["sum_1n"]}],"v":[{"b":0,"s":"Шаги целые и строго убывают, поэтому каждый следующий хотя бы на единицу меньше предыдущего. Тогда сумма всех семидесяти девяти шагов не больше, чем семьдесят девять раз первый шаг минус ноль, один, два и так далее до семидесяти восьми."},{"b":0,"f":"sum_1n"},{"b":0,"s":"А сумма шагов ноль. Отсюда первый шаг, то есть второй член, не меньше тридцати девяти. Двадцать не подходит. Ответ: нет."}],"rich":true},{"l":"в","q":"Найдите наименьшее значение второго члена такой последовательности.","ak":"num","av":"39","steps":[{"w":["📏 Из пункта б: **a₂ ≥ 39**.","🔨 **Пример:** шаги 39, 38, …, 1, 0, −1, …, −39 — сумма 0 ✔️","✅ **Ответ: 39.**"],"f":[]}],"v":[{"b":0,"s":"Оценку мы уже получили: второй член не меньше тридцати девяти. Пример: берём шаги тридцать девять, тридцать восемь и так далее до минус тридцати девяти. Они убывают, их сумма ноль, а второй член тридцать девять. Ответ: тридцать девять."}],"rich":true}],"tags":["seq"],"facts":["ap","sum_1n","est_ex"],"note":"","n":100},{"id":"24442","d":3,"from":"Школково","stem":"Трёхзначное натуральное число делят на сумму его цифр; частное — целое число.","parts":[{"l":"в","q":"Найдите наименьшее возможное частное, если число не делится на 100, а его первая цифра равна 7.","ak":"num","av":"37","steps":[{"w":["📏 Сумма цифр S = 7 + b + c ≤ 25 → частное ≥ 700 : 25 = **28**."],"f":[]},{"w":["🔎 Для частных 28, 29, …, 36 проверяем возможные суммы цифр — не подходит ни одно.","💡 Например, q = 36: 720, 756, 792 — суммы цифр 9, 18, 18, а нужны 20, 21, 22 ❌"],"f":[]},{"w":["🔨 **q = 37:** 777 = 37·21, сумма цифр 21 ✔️","✅ **Ответ: 37.**"],"f":[]}],"v":[{"b":0,"s":"Число от семисот до семисот девяноста девяти, сумма цифр не больше двадцати пяти. Значит, частное не меньше двадцати восьми."},{"b":1,"s":"Проверяем частные по порядку, начиная с двадцати восьми. Для каждого частного ку число равно ку, умноженному на сумму цифр, и сумма цифр может быть только в небольшом диапазоне. Проверяем — сумма цифр получившегося числа не совпадает."},{"b":2,"s":"Первым подходит тридцать семь: семьсот семьдесят семь — это тридцать семь на двадцать один, и сумма цифр как раз двадцать один. Ответ: тридцать семь."}],"rich":true}],"tags":["digits"],"facts":["dec_repr","est_ex"],"note":"","n":101},{"id":"26296","d":3,"from":"Школково","stem":"Ученики некоторой школы написали тест. Результатом каждого участника стало целое неотрицательное число баллов. Ученик считается сдавшим тест, если он набрал не менее 83 баллов. Из-за того, что задания оказались слишком трудными, было принято решение всем участникам теста добавить по 5 баллов, благодаря чему количество сдавших тест увеличилось.","parts":[{"l":"а","q":"Могло ли оказаться так, что после этого средний балл не сдавших тест учеников понизился?","ak":"yn","av":"ДА","steps":[{"w":["💡 **Идея:** после +5 в сдавшие переходят **самые сильные** из несдавших (78–82 балла) — у несдавших среднее может упасть.","🔨 **Пример:** баллы 0 и 80 — оба не сдали, среднее 40.","👉 После +5: 5 и 85 → не сдал один ученик со средним **5** \u003c 40.","✅ **Ответ: да.**"],"f":["mean_move"]}],"v":[{"b":0,"s":"После прибавки пяти баллов в сдавшие переходят те, у кого было от семидесяти восьми до восьмидесяти двух. Это лучшие из несдавших, и без них среднее несдавших может упасть."},{"b":0,"f":"mean_move"},{"b":0,"s":"Пример: двое учеников с баллами ноль и восемьдесят, оба не сдали, среднее сорок. После прибавки второй сдал, а первый — нет, со средним пять. Понизилось. Ответ: да."}],"rich":true},{"l":"б","q":"Могло ли оказаться так, что после этого средний балл не сдавших тест учеников понизился и средний балл сдавших тест учеников понизился?","ak":"yn","av":"ДА","steps":[{"w":["💡 Переходящий ученик — **слабее** прежних сдавших → среднее сдавших тоже может упасть.","🔨 **Пример:** 0, 80, 100.","👉 До: не сдали {0, 80} — 40;  сдали {100} — 100","👉 После: не сдали {5} — 5;  сдали {85, 105} — 95","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Тот же переходящий ученик для сдавших — слабый, ведь у него восемьдесят пять, а сдавшие могли иметь гораздо больше. Поэтому оба средних могут понизиться одновременно."},{"b":0,"s":"Добавим к прошлому примеру ученика со ста баллами. До прибавки средние сорок и сто, после — пять и девяносто пять. Оба понизились. Ответ: да."}],"rich":true},{"l":"в","q":"Известно, что первоначально средний балл участников теста составил 90, средний балл сдавших тест учеников составил 100, а средний балл не сдавших тест учеников составил 75. После добавления баллов средний балл сдавших тест учеников стал равен 103, а не сдавших — 79. При каком наименьшем числе участников теста возможна такая ситуация?","ak":"num","av":"15","steps":[{"w":["✏️ До: **p** сдали, **f** не сдали:","=100p + 75f = 90(p + f)   →   2p = 3f   →   N кратно 5","✏️ После: p′ и f′:","=103p′ + 79f′ = 95(p′ + f′)   →   p′ = 2f′   →   N кратно 3","👉 N кратно **15**."],"f":["mean"]},{"w":["🔨 **N = 15:** 9 сдали (среднее 100), 6 не сдали: один с 80 и пятеро со средним 74.","👉 После +5: сдавшие (945 + 85) : 10 = 103,  не сдавшие 79 ✔️","✅ **Ответ: 15.**"],"f":[]}],"v":[{"b":0,"s":"Пусть сначала пэ учеников сдали, эф не сдали. Записываем общий средний балл через средние групп. Получаем, что сдавших и несдавших было как три к двум, значит, всех участников кратно пяти."},{"b":0,"f":"mean"},{"b":0,"s":"После прибавки общее среднее девяносто пять. Снова записываем то же самое и получаем, что сдавших стало вдвое больше, чем несдавших. Значит, участников кратно трём. Вместе — кратно пятнадцати."},{"b":1,"s":"Пример на пятнадцать человек: девять сдавших со средним сто и шесть несдавших — один ученик с восемьюдесятью баллами и пятеро со средним семьдесят четыре. После прибавки ученик с восемьюдесятью переходит в сдавшие, и средние становятся сто три и семьдесят девять. Ответ: пятнадцать."}],"rich":true}],"tags":["avg"],"facts":["mean","mean_move","est_ex"],"note":"","n":102},{"id":"26297","d":3,"from":"Школково","stem":"В нескольких одинаковых бочках налито некоторое необязательно одинаковое количество литров воды. За один раз можно перелить любое количество воды из одной бочки в другую.","parts":[{"l":"а","q":"Пусть есть четыре бочки, в которых 29, 32, 40 и 91 литр воды. Можно ли не более чем за четыре переливания уравнять количество воды во всех бочках?","ak":"yn","av":"ДА","steps":[{"w":["📌 Всего 29 + 32 + 40 + 91 = 192 л → в каждой должно быть **48 л**.","🔨 Из бочки с 91 л отливаем:","=19 л → в 1-ю,   16 л → во 2-ю,   8 л → в 3-ю","👉 Всего **3** переливания.","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Сначала поймём, сколько должно быть в каждой бочке: всего сто девяносто два литра, значит, по сорок восемь."},{"b":0,"s":"Лишняя вода есть только в бочке с девяноста одним литром. Из неё доливаем каждой из остальных столько, сколько не хватает до сорока восьми. Хватает трёх переливаний. Ответ: да."}],"rich":true},{"l":"б","q":"Пусть есть семь бочек. Всегда ли можно уравнять количество воды во всех бочках не более чем за пять переливаний?","ak":"yn","av":"НЕТ","steps":[{"w":["🔨 **Пример:** 7, 0, 0, 0, 0, 0, 0 л — в каждой должно быть по 1 л.","📌 Каждую пустую бочку нужно наполнить → в каждую хотя бы одно переливание.","👉 Пустых бочек 6 → нужно **≥ 6** переливаний.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Достаточно найти один плохой случай. Пусть вся вода, семь литров, в одной бочке, а остальные шесть пустые. Каждая пустая бочка должна получить свой литр, поэтому в каждую нужно хотя бы одно переливание."},{"b":0,"s":"Пустых бочек шесть, значит, переливаний хотя бы шесть — больше пяти. Ответ: нет."}],"rich":true},{"l":"в","q":"За какое наименьшее количество переливаний можно заведомо уравнять количество воды в 26 бочках?","ak":"num","av":"25","steps":[{"w":["🔨 **Всегда хватает 25:** каждым переливанием доводим одну бочку до среднего — переливаем между бочкой с избытком и бочкой с недостатком.","👉 Последнее переливание выравнивает сразу две бочки."],"f":[]},{"w":["📏 **Меньше нельзя:** если вся вода в одной бочке, каждую из 25 пустых нужно наполнить отдельно.","✅ **Ответ: 25.**"],"f":["est_ex"]}],"v":[{"b":0,"s":"Сначала покажем, что двадцати пяти переливаний всегда хватает. Каждый раз берём бочку, где воды не столько, сколько нужно, и доводим её до среднего, переливая из бочки с избытком или в бочку с недостатком. После этого с этой бочкой больше не работаем."},{"b":0,"s":"Так каждое переливание доводит до нормы хотя бы одну бочку, а последнее — сразу две. Для двадцати шести бочек хватит двадцати пяти переливаний."},{"b":1,"s":"А меньше в худшем случае нельзя: если вся вода в одной бочке, то каждую из двадцати пяти пустых бочек нужно наполнить отдельным переливанием. Ответ: двадцать пять."},{"b":1,"f":"est_ex"}],"rich":true}],"tags":["est"],"facts":["mean","est_ex"],"note":"","n":103},{"id":"26929","d":3,"from":"Школково","stem":"Даны четыре последовательных натуральных числа. Каждое из чисел поделили на его последнюю цифру, а затем четыре результата сложили.","parts":[{"l":"в","q":"Какое наибольшее целое значение может принимать сумма, если изначально могли быть только числа от 800 до 999 включительно?","ak":"num","av":"2004","steps":[{"w":["✏️ Числа 10k + d, …, 10k + d + 3:","=сумма = 4 + 10k·(1/d + 1/(d + 1) + 1/(d + 2) + 1/(d + 3))","💡 Больше всего при **d = 1** и большом k."],"f":[]},{"w":["📌 При d = 1: сумма = 4 + 10k·25/12 — **целая**, когда k кратно 6.","👉 k ≤ 99 → k = 96:"],"f":[]},{"w":["=961 + 962 : 2 + 963 : 3 + 964 : 4 = 961 + 481 + 321 + 241 = 2004","✅ **Ответ: 2004.**"],"f":[]}],"v":[{"b":0,"s":"Запишем числа как десять ка плюс последняя цифра. Каждое делим на последнюю цифру: получается единица плюс десять ка, делённое на цифру. Чтобы сумма была большой, последние цифры должны быть маленькими — один, два, три, четыре."},{"b":1,"s":"Тогда сумма равна четырём плюс десять ка, умноженное на двадцать пять двенадцатых. Чтобы это было целым, ка должно делиться на шесть."},{"b":1,"s":"Самое большое подходящее ка в нашем диапазоне — девяносто шесть: числа девятьсот шестьдесят один, два, три и четыре."},{"b":2,"s":"Считаем — получается две тысячи четыре. Ответ: две тысячи четыре."}],"rich":true}],"tags":["digits"],"facts":["dec_repr","frac_monot","est_ex"],"note":"","n":104},{"id":"26930","d":3,"from":"Школково","stem":"Даны 4 последовательных натуральных числа. Каждое из них поделили на его первую цифру, а затем результаты сложили.","parts":[{"l":"в","q":"Какое максимальное целое значение суммы могло получиться, если брать числа от 400 до 999 включительно?","ak":"num","av":"478","steps":[{"w":["✏️ Если у всех четырёх чисел первая цифра **a**, а первое число **s**:","=сумма = (s + (s + 1) + (s + 2) + (s + 3)) : a = (4s + 6) : a"],"f":[]},{"w":["🔎 Перебираем a:","👉 a = 4: 4s + 6 на 4 не делится ❌","👉 **a = 5:** нужно s с остатком 1 при делении на 5, наибольшее **596**:","=(596 + 597 + 598 + 599) : 5 = 478","👉 a ≥ 6: сумма ≤ 4·999 : 6 \u003c 478"],"f":[]},{"w":["✅ **Ответ: 478.**"],"f":[]}],"v":[{"b":0,"s":"Если у всех четырёх чисел одна и та же первая цифра а, то сумма — это сумма четырёх чисел подряд, делённая на а."},{"b":1,"s":"Чем меньше первая цифра, тем больше результат. При первой цифре четыре сумма не может быть целой. При пятёрке нужно подобрать первое число так, чтобы сумма делилась на пять, и как можно больше — подходит пятьсот девяносто шесть. Получается четыреста семьдесят восемь."},{"b":1,"s":"При первой цифре шесть и больше сумма точно меньше: даже максимальные числа, делённые на шесть, дают меньше четырёхсот семидесяти восьми. А если четвёрка чисел переходит через сотню, сумма получается нецелой."},{"b":2,"s":"Ответ: четыреста семьдесят восемь."}],"rich":true}],"tags":["digits"],"facts":["dec_repr","div_def","est_ex"],"note":"","n":105},{"id":"27764","d":3,"from":"Школково","stem":"Семь экспертов оценивают кинофильм. Каждый из них выставляет оценку — целое число баллов от 0 до 12 включительно. Известно, что все эксперты выставили различные оценки. По старой системе оценивания рейтинг кинофильма — это среднее арифметическое всех оценок экспертов. По новой системе оценивания рейтинг кинофильма вычисляется следующим образом: отбрасываются наименьшая и наибольшая оценки и подсчитывается среднее арифметическое пяти оставшихся оценок.","parts":[{"l":"а","q":"Может ли разность рейтингов, вычисленных по старой и новой системам оценивания, равняться 1/25?","ak":"yn","av":"НЕТ","steps":[{"w":["✏️ **a** — наименьшая, **b** — наибольшая, **M** — сумма пяти средних оценок:","=разность = (a + b + M) : 7 − M : 5 = (5(a + b) − 2M) : 35","❌ Число вида «целое : 35» не может равняться 1/25.","✅ **Ответ: нет.**"],"f":["mean"]}],"v":[{"b":0,"s":"Обозначим наименьшую оценку а, наибольшую бэ и сумму пяти средних эм. Старый рейтинг — сумма всех, делённая на семь, новый — эм, делённое на пять. Их разность — целое число, делённое на тридцать пять."},{"b":0,"f":"mean"},{"b":0,"s":"А одна двадцать пятая так не записывается: если умножить её на тридцать пять, получится не целое. Ответ: нет."}],"rich":true},{"l":"б","q":"Может ли разность рейтингов, вычисленных по старой и новой системам оценивания, равняться 1/35?","ak":"yn","av":"ДА","steps":[{"w":["📌 Нужно 5(a + b) − 2M = 1.","🔨 a = 1, b = 12, M = 32: пять средних — 2, 5, 7, 8, 10","=5·13 − 64 = 1 ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Теперь нужно, чтобы пять раз сумма крайних оценок минус два эм было равно одному. Возьмём крайние один и двенадцать — тогда эм должно быть тридцать два. Подбираем пять разных средних оценок с такой суммой: два, пять, семь, восемь, десять. Ответ: да."}],"rich":true},{"l":"в","q":"Найдите наибольшее возможное значение разности рейтингов, вычисленных по старой и новой системам оценивания.","ak":"num","av":"6/7","steps":[{"w":["💡 Чтобы разность была большой: крайние **как можно больше в сумме**, средние — **как можно меньше**.","=a = 0,   b = 12,   M ≥ 1 + 2 + 3 + 4 + 5 = 15","=5·12 − 2·15 = 30   →   разность ≤ 30 : 35 = 6/7"],"f":[]},{"w":["🔨 **Пример:** 0, 1, 2, 3, 4, 5, 12","✅ **Ответ: 6/7.**"],"f":[]}],"v":[{"b":0,"s":"Чтобы разность была наибольшей, нужно, чтобы пять раз а плюс бэ было большим, а эм — маленьким. Берём наибольшую оценку двенадцать, наименьшую ноль, а средние — самые маленькие возможные: один, два, три, четыре, пять. Тогда числитель тридцать."},{"b":0,"s":"Если сделать наименьшую оценку больше нуля, средние оценки тоже вырастут, и результат только уменьшится. Значит, разность не больше шести седьмых."},{"b":1,"s":"Пример: ноль, один, два, три, четыре, пять и двенадцать. Ответ: шесть седьмых."}],"rich":true}],"tags":["avg"],"facts":["mean","est_ex"],"note":"","n":106},{"id":"30834","d":3,"from":"Школково","stem":"Несколько камней, каждый из которых весит не менее 100 г, разложили в три кучки. В первой кучке оказалось n1 камней с суммарным весом S1, во второй — n² камней с суммарным весом S2, а в третьей — n3 камней с суммарным весом S3. Оказалось так, что n1 \u003c n² \u003c n3.","parts":[{"l":"а","q":"Могло ли так случиться, что S1 >S2 > S3?","ak":"yn","av":"ДА","steps":[{"w":["🔨 **Пример:**","👉 1-я кучка: 1 камень 1000 г","👉 2-я: 2 камня по 200 г → 400 г","👉 3-я: 3 камня по 100 г → 300 г","=1000 > 400 > 300 ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Пусть в маленькой кучке один очень тяжёлый камень, в средней — два камня поменьше, а в большой — три самых лёгких. Например, тысяча граммов, два по двести и три по сто. Веса кучек: тысяча, четыреста и триста. Ответ: да."}],"rich":true},{"l":"б","q":"Могло ли так случиться, что S1 >S2 > S3, а вес каждого камня не превышает 105 грамм?","ak":"yn","av":"ДА","steps":[{"w":["💡 Кучки почти одинаковые по количеству: a, a + 1, a + 2 камней.","📌 Нужно 105a > S₂ > S₃ ≥ 100(a + 2) → **a ≥ 41**."],"f":[]},{"w":["🔨 **a = 41:**","👉 1-я: 41 камень по 105 г → 4305 г","👉 2-я: 42 камня — 20 по 105 г, один 101 г, 21 по 100 г → 4301 г","👉 3-я: 43 камня по 100 г → 4300 г","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Теперь камни почти одинаковые, от ста до ста пяти граммов. Чтобы маленькая кучка была тяжелее, её камни должны быть самыми тяжёлыми, а в большой кучке — самыми лёгкими. Возьмём кучки из а, а плюс один и а плюс два камней."},{"b":0,"s":"Первая кучка весит не больше ста пяти а, третья — не меньше ста раз а плюс два. Чтобы первая была тяжелее, нужно а хотя бы сорок один."},{"b":1,"s":"Пример при сорока одном: первая кучка — сорок один камень по сто пять граммов, третья — сорок три камня по сто граммов, а среднюю подбираем так, чтобы её вес оказался между ними. Ответ: да."}],"rich":true},{"l":"в","q":"Вес каждого камня не более k грамм. При каком минимальном целом k могло оказаться, что S1 >S2 > S3?","ak":"num","av":"101","steps":[{"w":["❌ **k = 100:** все камни по 100 г → больше камней — тяжелее кучка."],"f":[]},{"w":["🔨 **k = 101:** 202, 203 и 204 камня:","=S₁ = 202·101 = 20402","=S₂ = 20401  (101 по 101 г и 102 по 100 г)","=S₃ = 20400  (204 по 100 г)","✅ **Ответ: 101.**"],"f":[]}],"v":[{"b":0,"s":"Если камни не тяжелее ста граммов, то все они ровно по сто, и кучка с большим числом камней всегда тяжелее. Так не получится."},{"b":1,"s":"При ста одном грамме уже можно, но кучки нужны большие. Возьмём двести два, двести три и двести четыре камня. В первой все по сто одному грамму, в третьей все по сто, а во второй почти все по сто одному. Веса отличаются на граммы, но порядок нужный. Ответ: сто один."}],"rich":true}],"tags":["avg","est"],"facts":["mean","est_ex"],"note":"","n":107},{"id":"43707","d":3,"from":"Школково","stem":"На доске написано 11 различных натуральных чисел. Среднее арифметическое шести наименьших равно 8, а семи наибольших — 14.","parts":[{"l":"а","q":"Может ли наибольшее из этих одиннадцати чисел равняться 16?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Семь наибольших в сумме **98**.","👉 Если наибольшее 16, то семь наибольших не больше","=16 + 15 + 14 + 13 + 12 + 11 + 10 = 91 \u003c 98","✅ **Ответ: нет.**"],"f":["distinct_min"]}],"v":[{"b":0,"s":"Семь наибольших чисел дают в сумме девяносто восемь. Если самое большое шестнадцать, то семь наибольших — это в лучшем случае числа от десяти до шестнадцати, их сумма девяносто один. Мало. Ответ: нет."},{"b":0,"f":"distinct_min"}],"rich":true},{"l":"в","q":"Найдите наименьшее значение среднего арифметического всех одиннадцати чисел.","ak":"num","av":"123/11","steps":[{"w":["📌 Шестёрка и семёрка пересекаются по a₅ и a₆:","=сумма всех = 48 + 98 − (a₅ + a₆)","💡 Нужно сделать **a₅ + a₆ как можно больше**."],"f":["mean"]},{"w":["📏 Пять чисел после a₆ больше него: a₇ + … + a₁₁ ≥ 5a₆ + 15 → a₅ + 6a₆ ≤ 83, и a₅ \u003c a₆:","=a₅ + a₆ ≤ 23   (a₅ = 11,  a₆ = 12)"],"f":[]},{"w":["🔨 **Пример:** 4, 6, 7, 8, 11, 12, 13, 14, 15, 16, 17 — сумма 123","✅ **Ответ: 123/11.**"],"f":[]}],"v":[{"b":0,"s":"Шесть наименьших и семь наибольших чисел пересекаются: пятое и шестое числа входят в обе группы. Поэтому сумма всех — сорок восемь плюс девяносто восемь минус пятое и шестое. Чтобы среднее было наименьшим, пятое и шестое должны быть как можно больше."},{"b":0,"f":"mean"},{"b":1,"s":"Но они ограничены: пять чисел после шестого больше него, а вместе с пятым и шестым дают девяносто восемь. Отсюда получается, что пятое и шестое вместе не больше двадцати трёх — одиннадцать и двенадцать."},{"b":2,"s":"Пример выписан в решении: сумма сто двадцать три. Ответ: сто двадцать три одиннадцатых."}],"rich":true}],"tags":["avg"],"facts":["mean","distinct_min","est_ex"],"note":"","n":108},{"id":"46183","d":3,"from":"Школково","stem":"Каждый из 32 студентов написал или одну из двух контрольных работ, или обе контрольные работы. За каждую работу можно было получить целое число баллов от 0 до 20 включительно. По каждой из двух работ в отдельности средний балл составил 14. Затем каждый студент назвал наивысший из своих баллов. При этом если студент писал одну работу, то он назвал балл за нее. Среднее арифметическое названных баллов равно S.","parts":[{"l":"б","q":"Могло ли оказаться, что только два студента написали обе контрольные работы, если S = 11?","ak":"yn","av":"НЕТ","steps":[{"w":["✏️ **z** — писали обе работы. Названо:","=14·(32 + z) − (меньшие баллы этих z) ≥ 448 + 14z − 20z = 448 − 6z","📌 S = 11 → названо 352:","=448 − 6z ≤ 352   →   z ≥ 16","❌ 2 \u003c 16.","✅ **Ответ: нет.**"],"f":["mean"]}],"v":[{"b":0,"s":"Это та же идея, что в задаче про двадцать восемь студентов. Пусть обе работы писали зет студентов. Все баллы вместе — четырнадцать раз тридцать два плюс зет. Не названы только меньшие баллы этих зет студентов, а каждый из них не больше двадцати."},{"b":0,"f":"mean"},{"b":0,"s":"Если среднее одиннадцать, названо триста пятьдесят два балла. Из неравенства получаем, что зет хотя бы шестнадцать. Двое — слишком мало. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое наименьшее количество студентов могло написать обе контрольные работы, если S = 11?","ak":"num","av":"16","steps":[{"w":["📏 Из пункта б: **z ≥ 16**."],"f":[]},{"w":["🔨 **Пример:** 16 студентов писали обе работы на 20 и 20; по 8 студентов — только одну работу, по 2 балла.","=названо 320 + 16 + 16 = 352,   S = 11 ✔️","✅ **Ответ: 16.**"],"f":[]}],"v":[{"b":0,"s":"Оценка уже есть: обе работы писали хотя бы шестнадцать студентов."},{"b":1,"s":"Пример: шестнадцать студентов пишут обе работы на двадцать, а по восемь студентов пишут только одну работу на два балла. Средние по работам четырнадцать, а среднее названных — одиннадцать. Ответ: шестнадцать."}],"rich":true}],"tags":["avg"],"facts":["mean","est_ex"],"note":"","n":109},{"id":"46752","d":3,"from":"Школково","stem":"Все члены конечной последовательности являются натуральными числами. Каждый член этой последовательности, начиная со второго, либо в 7 раз больше, либо в 7 раз меньше предыдущего. Сумма всех членов последовательности равна 9177.","parts":[{"l":"а","q":"Может ли последовательность состоять из трёх членов?","ak":"yn","av":"ДА","steps":[{"w":["🔨 Три члена **m, 7m, 49m**:","=57m = 9177   →   m = 161","=161, 1127, 7889 ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Попробуем самую простую схему: каждый следующий в семь раз больше. Тогда члены эм, семь эм и сорок девять эм, а сумма пятьдесят семь эм. Делим девять тысяч сто семьдесят семь на пятьдесят семь — получается сто шестьдесят один, целое число. Ответ: да."}],"rich":true},{"l":"б","q":"Может ли последовательность состоять из пяти членов?","ak":"yn","av":"ДА","steps":[{"w":["🔨 Схема **7m, m, 7m, m, 7m**:","=23m = 9177   →   m = 399","=2793, 399, 2793, 399, 2793 ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Пять членов: будем чередовать большой и маленький. Сумма семь эм плюс эм плюс семь эм плюс эм плюс семь эм — двадцать три эм. Девять тысяч сто семьдесят семь делится на двадцать три, получаем триста девяносто девять. Ответ: да."}],"rich":true},{"l":"в","q":"Какое наибольшее количество членов может быть в последовательности?","ak":"num","av":"2295","steps":[{"w":["📌 Два соседних члена — x и 7x, их сумма **≥ 8**.","📏 n = 2296 членов → 1148 пар → сумма ≥ 9184 > 9177 ❌"],"f":["est_ex"]},{"w":["🔨 **n = 2295:** 1, 7, 1, 7, …, 1","=1148·1 + 1147·7 = 9177 ✔️","✅ **Ответ: 2295.**"],"f":[]}],"v":[{"b":0,"s":"Ищем наибольшее количество членов. Любые два соседних члена — это какое-то число и в семь раз большее, вместе хотя бы восемь. Если членов две тысячи двести девяносто шесть, их можно разбить на пары, и сумма будет не меньше девяти тысяч ста восьмидесяти четырёх. Это больше нужного."},{"b":0,"f":"est_ex"},{"b":1,"s":"А две тысячи двести девяносто пять членов получить можно: чередуем единицы и семёрки, начиная и заканчивая единицей. Сумма как раз девять тысяч сто семьдесят семь. Ответ: две тысячи двести девяносто пять."}],"rich":true}],"tags":["seq"],"facts":["fta","pow2","est_ex"],"note":"","n":110},{"id":"46754","d":3,"from":"Школково","stem":"Трёхзначное число, меньшее 910, поделили на сумму его цифр и получили натуральное число n.","parts":[{"l":"в","q":"Какое наибольшее значение может принимать n, если все цифры ненулевые?","ak":"num","av":"79","steps":[{"w":["💡 **Идея:** частное большое, если **сумма цифр маленькая**, а число большое.","📌 Число меньше 910, цифры ненулевые."],"f":[]},{"w":["🔎 Перебираем суммы цифр и наибольшие числа с такой суммой:","👉 сумма 9: наибольшее число без нулей — 711 → 711 : 9 = **79**","👉 сумма ≥ 10: частное \u003c 910 : 10 = 91, но проверка 80–90 не даёт подходящих чисел","👉 сумма ≤ 8: числа меньше 700 → частное меньше"],"f":[]},{"w":["✅ **Ответ: 79** (число 711)."],"f":[]}],"v":[{"b":0,"s":"Чтобы частное было большим, само число должно быть большим, а сумма цифр — маленькой. Но цифры ненулевые, поэтому сумма цифр хотя бы первая цифра плюс два."},{"b":1,"s":"Если сумма цифр девять, то самое большое число без нулей — семьсот одиннадцать, и частное семьдесят девять. Если сумма цифр десять или больше, частное меньше девяноста одного; проверка значений от восьмидесяти до девяноста показывает, что таких чисел нет. А при сумме цифр восемь и меньше число меньше семисот, и частное меньше."},{"b":2,"s":"Ответ: семьдесят девять."}],"rich":true}],"tags":["digits"],"facts":["dec_repr","est_ex"],"note":"","n":111},{"id":"46763","d":3,"from":"Школково","stem":"Группу детей можно перевезти автобусами модели А (мест больше 30, но меньше 40) или модели Б (больше 40, но меньше 50). В обоих случаях все места заняты, но автобусов Б нужно на один меньше.","parts":[{"l":"б","q":"Найдите наименьшее возможное количество детей в группе, если их больше 150.","ak":"num","av":"180","steps":[{"w":["✏️ Автобусов Б **x − 1**, автобусов А **x**; мест a и b:","=a·x = b·(x − 1)","📌 x и x − 1 не имеют общих делителей → a = (x − 1)s, b = x·s","=детей = x(x − 1)s"],"f":[]},{"w":["🔎 a от 31 до 39, b от 41 до 49. Варианты по возрастанию:","=96,   132,   144,   180 = 36·5 = 45·4","👉 Первое больше 150 — **180**.","✅ **Ответ: 180.**"],"f":[]}],"v":[{"b":0,"s":"Пусть автобусов А нужно икс, а автобусов Бэ на один меньше. Если в автобусе А а мест, а в Бэ — бэ мест, то а икс равно бэ на икс минус один."},{"b":0,"s":"Соседние числа икс и икс минус один не имеют общих делителей, поэтому а кратно икс минус один, а бэ кратно икс. Получаем формулы из решения."},{"b":1,"s":"Теперь перебираем, учитывая вместимость автобусов. Подходящие количества детей по возрастанию: девяносто шесть, сто тридцать два, сто сорок четыре и сто восемьдесят. Первое больше ста пятидесяти — сто восемьдесят: пять автобусов по тридцать шесть мест или четыре по сорок пять. Ответ: сто восемьдесят."}],"rich":true}],"tags":["div","eq"],"facts":["lin_dioph","est_ex"],"note":"","n":112},{"id":"56127","d":3,"from":"Школково","stem":"У Пети дома лежат по 100 монет номинала 1, 2, 5 и 10 рублей. Он хочет купить пирожное в магазине без сдачи, но до момента покупки Петя не знает, сколько стоит пирожное.","parts":[{"l":"а","q":"Может ли Петя выбрать дома 16 монет так, чтобы гарантированно купить пирожное стоимостью до 100 рублей?","ak":"yn","av":"ДА","steps":[{"w":["🔨 **Набор:** 1, 2, 2, 5 — дают любую сумму от 1 до 10.","👉 Добавим 9 монет по 10 р. → любая сумма до 100.","=4 + 9 = 13 ≤ 16 монет ✔️","✅ **Ответ: да.**"],"f":["coins"]}],"v":[{"b":0,"s":"Сначала соберём маленькие монеты так, чтобы набирать любую сумму до десяти: один, два, два и пять. Проверьте — от одного до десяти всё получается."},{"b":0,"f":"coins"},{"b":0,"s":"Потом добавляем девять десяток — и можно набрать любую сумму до ста. Всего тринадцать монет, меньше шестнадцати. Ответ: да."}],"rich":true},{"l":"б","q":"Может ли Петя выбрать дома 5 монет так, чтобы гарантированно купить пирожное стоимостью до 25 рублей?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Упорядочим монеты c₁ ≤ … ≤ c₅. Без «дыр» каждая следующая ≤ 1 + сумма предыдущих.","=c₁ = 1,   c₂ ≤ 2,   c₃ ≤ 2 (монет 3 и 4 нет),   c₄ ≤ 5,   c₅ ≤ 10","=сумма ≤ 1 + 2 + 2 + 5 + 10 = 20 \u003c 25","✅ **Ответ: нет.**"],"f":["coins"]}],"v":[{"b":0,"s":"Расставим монеты по возрастанию. Чтобы не было сумм, которые не набрать, каждая следующая монета не может быть больше, чем сумма предыдущих плюс один."},{"b":0,"f":"coins"},{"b":0,"s":"Первая монета — один рубль, вторая не больше двух, третья тоже не больше двух, ведь монет по три и четыре рубля нет, четвёртая не больше пяти, пятая не больше десяти. Всего не больше двадцати рублей — до двадцати пяти не хватает. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое наименьшее количество монет нужно взять Пете, если он знает, что пирожное стоит не более 100 рублей?","ak":"num","av":"13","steps":[{"w":["📏 Первые четыре монеты дают ≤ 10, каждая следующая ≤ 10:","=10 + 10·(k − 4) ≥ 100   →   k ≥ 13"],"f":[]},{"w":["🔨 **Пример:** 1, 2, 2, 5 и девять монет по 10.","✅ **Ответ: 13.**"],"f":[]}],"v":[{"b":0,"s":"Рассуждаем как в пункте бэ: первые четыре монеты вместе не больше десяти рублей, а каждая следующая не больше десяти. Чтобы набрать сто, нужно хотя бы тринадцать монет."},{"b":1,"s":"Пример из пункта а — как раз тринадцать монет. Ответ: тринадцать."}],"rich":true}],"tags":["est"],"facts":["coins","pow2","est_ex"],"note":"","n":113},{"id":"56128","d":3,"from":"Школково","stem":"Дано натуральное число. Можно либо вычесть из него утроенную сумму его цифр, либо прибавить к нему утроенную сумму его цифр. При этом полученное число должно быть натуральным.","parts":[{"l":"а","q":"Можно ли с помощью таких операций из числа 128 получить число 29?","ak":"yn","av":"ДА","steps":[{"w":["🔨 **Цепочка:**","=128 − 3·11 = 95,     95 − 3·14 = 53,     53 − 3·8 = 29","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Просто попробуем уменьшать. У ста двадцати восьми сумма цифр одиннадцать, вычитаем тридцать три — девяносто пять. Потом вычитаем утроенную сумму цифр девяноста пяти — пятьдесят три. Потом двадцать девять. Ответ: да."}],"rich":true},{"l":"б","q":"Можно ли с помощью таких операций из числа 128 получить число 31?","ak":"yn","av":"НЕТ","steps":[{"w":["💡 **Инвариант:** прибавляем или вычитаем число, кратное 3 → **остаток при делении на 3 не меняется**.","=128 → остаток 2,     31 → остаток 1","✅ **Ответ: нет.**"],"f":["invariant"]}],"v":[{"b":0,"s":"Утроенная сумма цифр делится на три. Поэтому остаток числа при делении на три никогда не меняется."},{"b":0,"f":"invariant"},{"b":0,"s":"Сто двадцать восемь даёт остаток два, а тридцать один — остаток один. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое наименьшее натуральное число можно получить из 128 с помощью таких операций?","ak":"num","av":"2","steps":[{"w":["📏 Все числа дают остаток 2 при делении на 3 → наименьшее возможное — **2**."],"f":[]},{"w":["🔨 **Цепочка:**","=128 → 95 → 53 → 29 → 62 → 38 → 5 → 20 → 26 → 2","✅ **Ответ: 2.**"],"f":[]}],"v":[{"b":0,"s":"Из инварианта все получаемые числа дают остаток два при делении на три. Самое маленькое натуральное число с таким остатком — два."},{"b":1,"s":"Остаётся показать, что до двойки действительно можно дойти. Иногда приходится сначала прибавлять, чтобы потом удачно вычесть. Цепочка выписана в решении. Ответ: два."}],"rich":true}],"tags":["ops"],"facts":["invariant","ds_mod9","est_ex"],"note":"","n":114},{"id":"73698","d":3,"from":"Школково","stem":"Трёхзначное число A имеет k натуральных делителей (в том числе 1 и A).","parts":[{"l":"в","q":"Найдите все такие числа A, для которых k ≥ 30.","ak":"self","av":"720 и 840.","steps":[{"w":["💡 Много делителей — у чисел из **маленьких простых** множителей.","=720 = 2⁴·3²·5   →   5·3·2 = 30","=840 = 2³·3·5·7   →   4·2·2·2 = 32"],"f":["tau"]},{"w":["📏 У остальных трёхзначных меньше 30 делителей (например, 960 = 2⁶·3·5 — 28).","✅ **Ответ:** 720 и 840."],"f":[]}],"v":[{"b":0,"f":"tau"},{"b":0,"s":"Чтобы делителей было много, число должно раскладываться на маленькие простые множители. Подходят семьсот двадцать — тридцать делителей, и восемьсот сорок — тридцать два делителя."},{"b":1,"s":"Проверка остальных кандидатов показывает, что у них меньше тридцати делителей. Например, у девятисот шестидесяти — двадцать восемь. Ответ: семьсот двадцать и восемьсот сорок."}],"rich":true}],"tags":["div"],"facts":["tau","fta","est_ex"],"note":"","n":115},{"id":"114814","d":3,"from":"Школково","stem":"Есть 2 камня, каждый массой 100 тонн, 6 камней, каждый массой 20 тонн, и 4 камня, каждый массой 4 тонны.","parts":[{"l":"а","q":"Можно ли разложить все эти камни на три группы так, чтобы суммарная масса первой группы была на 12 тонн больше суммарной массы второй группы, но на 12 тонн меньше суммарной массы третьей группы?","ak":"yn","av":"ДА","steps":[{"w":["📌 Всего 2·100 + 6·20 + 4·4 = 336 т → группы **100, 112, 124**.","🔨 **Раскладка:**","👉 100 = один камень 100 т","👉 112 = 100 + 4 + 4 + 4","👉 124 = 6·20 + 4","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Вся масса триста тридцать шесть тонн. Если группы отличаются на двенадцать, то средняя группа весит треть от всего — сто двенадцать, а остальные — сто и сто двадцать четыре."},{"b":0,"s":"Собираем: сто — один большой камень; сто двенадцать — второй большой и три камня по четыре; сто двадцать четыре — все шесть камней по двадцать и один по четыре. Ответ: да."}],"rich":true},{"l":"б","q":"Можно ли разложить все эти камни на три группы так, чтобы суммарные массы этих групп были равны?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Равные группы — по **112 т**. Два камня по 100 т — в разных группах, третья группа без них:","=112 = 20a + 4b   →   a = 5, b = 3"],"f":[]},{"w":["❌ Остаются один камень 20 т и один 4 т, а каждой «сотне» нужно ещё по 12 т.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Если группы равны, каждая весит сто двенадцать тонн. Два камня по сто тонн не могут быть вместе, значит, одна группа вообще без них. Её сто двенадцать тонн набираются из двадцаток и четвёрок только одним способом: пять по двадцать и три по четыре."},{"b":1,"s":"Остаются один камень в двадцать тонн и один в четыре. А к каждой «сотне» нужно добавить ровно двенадцать тонн. Из двадцати и четырёх так не разделить. Ответ: нет."}],"rich":true},{"l":"в","q":"Все камни хотят разложить на три группы с суммарными массами m,m 1 2 и m3 так, что m1 ≥ m2 ≥ m3. Найдите такое наименьшее число d, что m1 − m2 ≤d и m2− m3 ≤ d.","ak":"num","av":"8","steps":[{"w":["📌 Все массы кратны 4. d = 0 нельзя (пункт б).","🔎 **d = 4:** группы 116, 112, 108 — перебор раскладок «сотен» показывает, что не собрать ❌"],"f":["mod_cases"]},{"w":["🔨 **d = 8:**","=120 = 100 + 20,     112 = 100 + 4·3,     104 = 5·20 + 4","✅ **Ответ: 8.**"],"f":[]}],"v":[{"b":0,"s":"Ищем наименьшее дэ. Все массы делятся на четыре, поэтому разности тоже кратны четырём. Ноль мы исключили в пункте бэ. Для дэ равного четырём группы должны быть сто шестнадцать, сто двенадцать и сто восемь — перебор показывает, что так разложить нельзя."},{"b":0,"f":"mod_cases"},{"b":1,"s":"А при восьми получается: сто двадцать, сто двенадцать и сто четыре — раскладка в решении. Ответ: восемь."}],"rich":true}],"tags":["est"],"facts":["lin_dioph","mod_cases","est_ex"],"note":"","n":116},{"id":"114819","d":3,"from":"Школково","stem":"Дан набор натуральных чисел, каждое из которых меньше 100 и записано с помощью цифр 1,3,5,7 или 9. В наборе есть хотя бы одно однозначное и хотя бы одно двузначное число. Из этого набора чисел получили второй набор чисел следующим образом: к каждому однозначному числу приписали цифру, с помощью которой это число было записано; вместо каждого двузначного числа записали среднее арифметическое двух его цифр.","parts":[{"l":"а","q":"Может ли сумма чисел первого набора быть на 6 меньше суммы чисел второго набора?","ak":"yn","av":"ДА","steps":[{"w":["📌 Как меняются числа:","=однозначное x → xx = 11x","=двузначное pq → (p + q) : 2","💡 Однозначные **сильно растут**, двузначные **сильно уменьшаются**."],"f":["append"]},{"w":["🔨 **Пример:** {1, 1, 19}","=первая сумма 1 + 1 + 19 = 21","=вторая сумма 11 + 11 + 5 = 27 = 21 + 6 ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Посмотрим, что происходит с числами. Однозначное число превращается в число из двух одинаковых цифр, то есть становится в одиннадцать раз больше. А двузначное заменяется средним своих цифр — оно резко уменьшается."},{"b":0,"f":"append"},{"b":1,"s":"Нужно, чтобы вторая сумма была на шесть больше первой. Возьмём две единицы и число девятнадцать. Единицы превращаются в одиннадцать каждая, а девятнадцать — в пять. Первая сумма двадцать один, вторая двадцать семь. Ответ: да."}],"rich":true},{"l":"б","q":"Может ли сумма чисел первого набора быть в два раза больше суммы чисел второго набора?","ak":"yn","av":"ДА","steps":[{"w":["🔨 **Пример:** {3, 71}","=первая сумма 3 + 71 = 74","=вторая сумма 33 + (7 + 1) : 2 = 33 + 4 = 37","=74 = 2·37 ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Теперь первая сумма должна быть вдвое больше второй. Значит, нужно большое двузначное число, которое во втором наборе станет маленьким. Пробуем тройку и семьдесят один: первая сумма семьдесят четыре, вторая — тридцать три плюс четыре, тридцать семь. Ровно вдвое. Ответ: да."}],"rich":true},{"l":"в","q":"Найдите наибольшее возможное отношение суммы чисел второго набора к сумме чисел первого набора, если в первом наборе не было одинаковых чисел, а однозначных чисел было столько же, сколько и двузначных.","ak":"num","av":"5","steps":[{"w":["📌 Отношение = (11·Σx + Σ(p + q) : 2) : (Σx + Σpq).","💡 Однозначные хотим **большими**, двузначные — **маленькими**."],"f":[]},{"w":["🔨 **k = 1:** однозначное 9, двузначное 11:","=(99 + 1) : (9 + 11) = 100 : 20 = 5","📏 При k ≥ 2 двузначные (разные) становятся больше, и отношение **падает**.","✅ **Ответ: 5.**"],"f":["est_ex"]}],"v":[{"b":0,"s":"Отношение второй суммы к первой будет большим, если однозначные числа большие — они умножаются на одиннадцать, — а двузначные числа маленькие, ведь они почти целиком пропадают."},{"b":1,"s":"Одна пара: однозначное девять и двузначное одиннадцать. Получаем сто к двадцати, то есть пять."},{"b":1,"s":"Если пар больше, двузначные числа разные, и приходится брать всё большие — они сильнее увеличивают первую сумму, и отношение падает. Ответ: пять."},{"b":1,"f":"est_ex"}],"rich":true}],"tags":["digits"],"facts":["dec_repr","append","est_ex"],"note":"","n":117},{"id":"114826","d":3,"from":"Школково","stem":"Среднее геометрическое k чисел p₁, …, pₖ равно ᵏ√(p₁·p₂·…·pₖ).","parts":[{"l":"а","q":"Может ли среднее геометрическое трёх различных двузначных чисел быть равно 45?","ak":"yn","av":"ДА","steps":[{"w":["📌 Нужно произведение трёх двузначных чисел равное 45³:","=45³ = 3⁶·5³ = 25·45·81 ✔️","✅ **Ответ: да.**"],"f":["gmean"]}],"v":[{"b":0,"f":"gmean"},{"b":0,"s":"Нужно, чтобы произведение трёх разных двузначных чисел было сорок пять в кубе. Разложим: три в шестой степени на пять в кубе. Раскладываем на три двузначных множителя: двадцать пять, сорок пять и восемьдесят один. Ответ: да."}],"rich":true},{"l":"б","q":"Найдите наименьшее возможное целое значение среднего геометрического трёх различных двузначных чисел.","ak":"num","av":"18","steps":[{"w":["📌 g³ = a·b·c, a \u003c b \u003c c — двузначные → g ≥ 11.","🔎 Проверяем по порядку:","👉 g = 11, 13, 17 — простые → нужно g·g·g (числа равны) ❌","👉 g = 12, 14, 15, 16 — подходящих трёх **разных** двузначных множителей нет ❌"],"f":[]},{"w":["🔨 **g = 18:**","=12·18·27 = 5832 = 18³ ✔️","✅ **Ответ: 18.**"],"f":[]}],"v":[{"b":0,"s":"Произведение трёх двузначных чисел не меньше чем десять на одиннадцать на двенадцать, поэтому среднее геометрическое хотя бы одиннадцать. Проверим значения по порядку."},{"b":0,"s":"Если эр простое, как одиннадцать или тринадцать, то куб раскладывается только как эр на эр на эр — числа одинаковые. Для двенадцати, четырнадцати, пятнадцати и шестнадцати трёх разных двузначных множителей тоже не находится."},{"b":1,"s":"А восемнадцать подходит: двенадцать на восемнадцать на двадцать семь — ровно восемнадцать в кубе. Ответ: восемнадцать."}],"rich":true},{"l":"в","q":"Найдите наибольшее возможное целое значение среднего геометрического шести различных двузначных чисел.","ak":"num","av":"60","steps":[{"w":["📏 Если у g есть простой делитель p ≥ 17 — нужно 6 двузначных кратных p, их нет ❌","📏 p = 11 или 13 — шестой степени не получить ❌","👉 g составлен из 2, 3, 5, 7; проверка g от 61 до 96 — не подходит ни одно."],"f":[]},{"w":["🔨 **g = 60:**","=15·60·75·80·90·96 = 60⁶ ✔️","✅ **Ответ: 60.**"],"f":[]}],"v":[{"b":0,"s":"Ищем наибольшее среднее геометрическое шести разных двузначных чисел. Произведение должно быть шестой степенью числа же. Если у же есть большой простой делитель, например семнадцать, то все шесть чисел должны делиться на него — а двузначных кратных семнадцати меньше шести. С одиннадцатью и тринадцатью тоже не выходит."},{"b":0,"s":"Значит, же состоит из двоек, троек, пятёрок и семёрок. Проверка всех таких чисел от шестидесяти одного до девяноста шести показывает, что шести разных двузначных множителей не находится."},{"b":1,"s":"А для шестидесяти пример есть — он выписан в решении. Ответ: шестьдесят."}],"rich":true}],"tags":["div"],"facts":["gmean","fta","est_ex"],"note":"","n":118},{"id":"114831","d":3,"from":"Школково","stem":"Дано четырёхзначное число с цифрами a, b, c, d (тысячи, сотни, десятки, единицы), a ≠ 0.","parts":[{"l":"а","q":"Может ли произведение a⋅b⋅c ⋅d быть больше суммы a+ b+ c+ d в 3 раза?","ak":"yn","av":"ДА","steps":[{"w":["🔨 **Пример:** 1168","=1·1·6·8 = 48,     1 + 1 + 6 + 8 = 16,     48 = 3·16 ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Подберём пример. Единицы почти не меняют произведение, но добавляют к сумме. Пробуем тысяча сто шестьдесят восемь: произведение сорок восемь, сумма шестнадцать. Ровно в три раза. Ответ: да."}],"rich":true},{"l":"б","q":"Цифры a, b, c и d попарно различны. Сколько существует различных таких чисел, у которых a·b·c·d \u003c a + b + c + d?","ak":"num","av":"1512","steps":[{"w":["📌 Если все четыре цифры **ненулевые** и различные, произведение больше суммы (уже 1·2·3·x = 6x > 6 + x).","👉 Значит, среди цифр есть **0** — тогда произведение 0, а сумма больше."],"f":[]},{"w":["🔎 Считаем числа с разными цифрами и нулём:","=всего с разными цифрами:  9·9·8·7 = 4536","=без нуля:  9·8·7·6 = 3024","=4536 − 3024 = 1512","✅ **Ответ: 1512.**"],"f":[]}],"v":[{"b":0,"s":"Если все четыре цифры разные и ненулевые, то произведение уже больше суммы: даже для самых маленьких один, два, три и икс произведение шесть икс больше суммы."},{"b":0,"s":"Значит, условие выполняется, только если среди цифр есть ноль: тогда произведение ноль."},{"b":1,"s":"Остаётся посчитать четырёхзначные числа с разными цифрами, среди которых есть ноль. Проще посчитать все числа с разными цифрами и вычесть те, где нуля нет. Получается тысяча пятьсот двенадцать. Ответ: тысяча пятьсот двенадцать."}],"rich":true},{"l":"в","q":"Известно, что a·b·c·d = k(a + b + c + d), где k — двузначное число. При каком наименьшем числе abcd число k будет наибольшим?","ak":"num","av":"5889","steps":[{"w":["📌 k = произведение : сумма. Наибольшее двузначное k:","=5·8·8·9 = 2880 = 96·30   →   k = 96"],"f":[]},{"w":["🔎 Больше 96 не бывает; среди чисел с k = 96 наименьшее — **5889**.","✅ **Ответ: 5889.**"],"f":[]}],"v":[{"b":0,"s":"Чтобы ка было большим, цифры должны быть крупными: произведение растёт гораздо быстрее суммы. Перебирая наборы крупных цифр, находим наибольшее двузначное значение — девяносто шесть, у цифр пять, восемь, восемь, девять."},{"b":1,"s":"Из этих цифр самое маленькое число — пять тысяч восемьсот восемьдесят девять. Ответ: пять тысяч восемьсот восемьдесят девять."}],"rich":true}],"tags":["digits"],"facts":["dec_repr","est_ex"],"note":"","n":119},{"id":"114839","d":3,"from":"Школково","stem":"Есть три коробки: в первой — 97 камней; во второй — 80, а в третьей коробке камней нет. Берут по одному камню из двух коробок и кладут их в оставшуюся. Сделали некоторое количество таких ходов.","parts":[{"l":"б","q":"Может ли в первой и второй коробках камней оказаться поровну?","ak":"yn","av":"НЕТ","steps":[{"w":["💡 **Инвариант:** разности чисел по mod 3 не меняются (как в задаче про коробки 97 и 104).","=97 − 80 = 17 — остаток 2","❌ Поровну → разность 0.","✅ **Ответ: нет.**"],"f":["invariant"]}],"v":[{"b":0,"s":"Это задача на тот же инвариант, что и с коробками девяносто семь и сто четыре: при каждом ходе остатки всех трёх чисел при делении на три сдвигаются одинаково, и разности по модулю три сохраняются."},{"b":0,"f":"invariant"},{"b":0,"s":"Разность первой и второй коробки семнадцать, остаток два. Если камней поровну, разность ноль. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое наибольшее количество камней может оказаться во второй коробке?","ak":"num","av":"176","steps":[{"w":["📌 Остатки трёх коробок всегда **попарно различны** → в первой и третьей вместе ≥ 0 + 1.","=во второй ≤ 177 − 1 = 176"],"f":[]},{"w":["🔨 **Пример:**","👉 32 хода в третью: (65, 48, 64)","👉 64 хода во вторую: (1, 176, 0) ✔️","✅ **Ответ: 176.**"],"f":[]}],"v":[{"b":0,"s":"Вначале остатки трёх коробок при делении на три — один, два и ноль, все разные. Разности сохраняются, поэтому остатки всегда остаются попарно различными. Значит, в первой и третьей коробке вместе хотя бы один камень, и во второй не больше ста семидесяти шести."},{"b":1,"s":"Пример строим за два этапа, он выписан в решении. Ответ: сто семьдесят шесть."}],"rich":true}],"tags":["ops"],"facts":["invariant","mod_def","est_ex"],"note":"","n":120},{"id":"159775","d":3,"from":"Школково","stem":"У Ивана Ильича есть коллекция монет. Если все его монеты разложить в одинаковые большие кляссеры, то потребуется k кляссеров, причём 5 ячеек в одном кляссере останутся пустыми. Если же их разложить в одинаковые маленькие кляссеры, то потребуется k + 2 кляссеров и также 5 ячеек в одном кляссере останутся пустыми. Известно, что в большом кляссере больше 150, но меньше 160 ячеек, а в маленьком – больше 100, но меньше 120 ячеек.","parts":[{"l":"а","q":"Может ли k быть равно 3?","ak":"yn","av":"НЕТ","steps":[{"w":["✏️ Большой кляссер — **L** ячеек, маленький — **m**. Монет:","=kL − 5 = (k + 2)m − 5   →   kL = (k + 2)m","📌 k = 3: 3L = 5m → L = 5t, m = 3t","=150 \u003c 5t \u003c 160   →   t = 31,   m = 93 \u003c 100 ❌","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Пусть в большом кляссере эль ячеек, в маленьком эм. В обоих случаях пять ячеек пустые, поэтому ка эль равно ка плюс два, умноженное на эм."},{"b":0,"s":"При ка равном трём получаем три эль равно пяти эм, то есть эль кратно пяти, а эм кратно трём. Большой кляссер от ста пятидесяти до ста шестидесяти — значит, эль сто пятьдесят пять, тогда эм девяносто три. Но маленький кляссер должен быть больше ста. Ответ: нет."}],"rich":true},{"l":"б","q":"Какое наименьшее количество монет может быть в коллекции у Ивана Ильича?","ak":"num","av":"607","steps":[{"w":["📌 L : m = (k + 2) : k = 1 + 2/k, и это между 150/119 и 159/101 → **k = 4, 5, 6 или 7**."],"f":[]},{"w":["🔎 Наименьшее количество монет — при **k = 4**:","=L = 153,   m = 102   →   монет 4·153 − 5 = 607","✅ **Ответ: 607.**"],"f":[]}],"v":[{"b":0,"s":"Отношение размеров кляссеров равно один плюс два ка-ых. А по ограничениям на размеры это отношение лежит в определённых пределах. Отсюда ка может быть только четыре, пять, шесть или семь."},{"b":1,"s":"Монет меньше всего при самом маленьком ка. При ка равном четырём кляссеры на сто пятьдесят три и сто две ячейки, монет шестьсот семь. Ответ: шестьсот семь."}],"rich":true},{"l":"в","q":"Какое наибольшее количество монет может быть в коллекции у Ивана Ильича?","ak":"num","av":"1066","steps":[{"w":["🔎 Проверяем все k:","=k = 4:  631,   k = 5:  765,   k = 6:  931","=k = 7:  7L = 9m → L = 153, m = 119 → 7·153 − 5 = 1066","✅ **Ответ: 1066.**"],"f":[]}],"v":[{"b":0,"s":"Теперь ищем наибольшее количество. Для каждого возможного ка берём наибольший подходящий размер кляссера. Больше всего монет получается при ка равном семи: кляссеры на сто пятьдесят три и сто девятнадцать ячеек, монет тысяча шестьдесят шесть. Ответ: тысяча шестьдесят шесть."}],"rich":true}],"tags":["div","eq"],"facts":["lin_dioph","est_ex"],"note":"","n":121},{"id":"159899","d":3,"from":"Школково","stem":"На доске написаны три различных натуральных числа. Второе равно удвоенной сумме цифр первого, третье — утроенной сумме цифр второго.","parts":[{"l":"в","q":"Найдите количество четырёхзначных чисел, которые могут быть первым числом в тройке, если третье число равно 12.","ak":"num","av":"880","steps":[{"w":["📌 Третье 12 → сумма цифр второго **4**.","📌 Второе — удвоенная сумма цифр четырёхзначного, чётное, ≤ 72: это **4, 22 или 40**.","👉 Сумма цифр первого: **2, 11 или 20**."],"f":[]},{"w":["🔎 Считаем четырёхзначные:","=сумма цифр 2:  4 числа,   11:  279,   20:  597","=4 + 279 + 597 = 880","✅ **Ответ: 880.**"],"f":[]}],"v":[{"b":0,"s":"Идём от конца. Третье число двенадцать — это утроенная сумма цифр второго, значит, у второго сумма цифр четыре."},{"b":0,"s":"Второе число — удвоенная сумма цифр четырёхзначного, поэтому оно чётное и не больше семидесяти двух. Чётные числа до семидесяти двух с суммой цифр четыре — четыре, двадцать два и сорок. Значит, сумма цифр первого числа два, одиннадцать или двадцать."},{"b":1,"s":"Осталось посчитать четырёхзначные числа с такими суммами цифр. Это аккуратный подсчёт по первой цифре. Получается всего восемьсот восемьдесят. Ответ: восемьсот восемьдесят."}],"rich":true}],"tags":["digits"],"facts":["ds_mod9","est_ex"],"note":"","n":122},{"id":"160015","d":3,"from":"Школково","stem":"В школах №1 и №2 учащиеся писали тест. Из каждой школы тест писали по крайней мере 2 учащихся. Каждый учащийся, писавший тест, набрал натуральное количество баллов. Оказалось, что в каждой школе средний балл за тест был целым числом, причем в школе №1 средний балл равнялся 18. Один из учащихся, писавших тест, перешёл из школы №1 в школу №2, а средние баллы за тест были пересчитаны в обеих школах. В результате средний балл в школе №1 вырос на 10%, средний балл в школе №2 также вырос на 10%.","parts":[{"l":"б","q":"В школе №1 все писавшие тест набрали разное количество баллов. Какое наибольшее количество баллов мог набрать учащийся этой школы?","ak":"num","av":"89","steps":[{"w":["✏️ Школа №1: **n₁** учеников, среднее 18, ушёл ученик с **x** баллами, среднее стало 19,8:","=x = 19,8 − 1,8n₁   →   n₁ = 6,  x = 9"],"f":["mean_move"]},{"w":["📌 Сумма 6·18 = 108, все баллы разные, один — 9.","📏 Остальные четыре ≥ 1, 2, 3, 4:","=наибольший ≤ 108 − 9 − 10 = 89"],"f":[]},{"w":["🔨 **Пример:** 1, 2, 3, 4, 9, 89","✅ **Ответ: 89.**"],"f":[]}],"v":[{"b":0,"s":"Среднее в первой школе выросло, значит, ушёл слабый ученик. Пусть там было эн один учеников, а ушедший набрал икс баллов. Записываем новое среднее и находим: учеников шесть, а ушедший набрал девять."},{"b":0,"f":"mean_move"},{"b":1,"s":"Сумма баллов в первой школе сто восемь. Чтобы один ученик набрал как можно больше, остальные должны набрать как можно меньше. Они все разные, один из них девять, а другие четыре — хотя бы один, два, три и четыре."},{"b":2,"s":"Тогда лучший набрал не больше восьмидесяти девяти, и такой пример есть. Ответ: восемьдесят девять."}],"rich":true},{"l":"в","q":"Известно, что изначально в школе №2 писали тест более 10 учащихся. Какое наименьшее количество учащихся могло писать тест в школе №2 изначально?","ak":"num","av":"19","steps":[{"w":["✏️ Школа №2: **n₂** учеников, среднее **m₂**, пришёл ученик с 9 баллами:","=(n₂m₂ + 9) : (n₂ + 1) = 1,1m₂   →   m₂(n₂ + 11) = 90"],"f":[]},{"w":["📌 n₂ > 10 → n₂ + 11 — делитель 90, больший 21: 30, 45 или 90.","=n₂ = 19, 34 или 79","🔨 **n₂ = 19, m₂ = 3:**  (57 + 9) : 20 = 3,3 ✔️","✅ **Ответ: 19.**"],"f":[]}],"v":[{"b":0,"s":"Во вторую школу пришёл ученик с девятью баллами, и среднее выросло на десять процентов. Записываем это и упрощаем — получаем, что эм два, умноженное на эн два плюс одиннадцать, равно девяноста."},{"b":1,"s":"Учеников больше десяти, значит, эн два плюс одиннадцать — делитель девяноста, больший двадцати одного: тридцать, сорок пять или девяносто. Наименьшее эн два — девятнадцать, при среднем три. Проверка в решении. Ответ: девятнадцать."}],"rich":true}],"tags":["avg"],"facts":["mean_move","percent","est_ex"],"note":"","n":123},{"id":"185932","d":3,"from":"Школково","stem":"На столе лежит стопка из красных и синих карт, на каждой из которых написано целое число, большее −32. При этом числа на картах одного цвета различны. Числа на всех синих картах делятся на 5, а на всех красных – на 8. Известно, что самое большое число на красной карте равно утроенному количеству синих карт, а самое большое число на синей карте равно количеству красных карт.","parts":[{"l":"а","q":"Может ли количество синих карт быть равным 1?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Наибольшее красное = 3·(число синих B), и оно делится на 8.","=3B делится на 8   →   B делится на 8","❌ B = 1 не подходит.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Самое большое красное число равно утроенному количеству синих карт и при этом делится на восемь. Три на восемь не делится, значит, количество синих карт делится на восемь. Одна карта не подходит. Ответ: нет."}],"rich":true},{"l":"б","q":"Может ли количество синих карт быть равным 40?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 B = 40 → наибольшее красное 120. Красные — разные кратные 8 от −24 до 120: **не больше 19**.","👉 Наибольшее синее = R ≤ 19."],"f":["div_count"]},{"w":["❌ А 40 разных кратных 5, больших −32, начинаются с −30 и доходят **хотя бы до 165**.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Если синих сорок, то самое большое красное сто двадцать. Красные — разные числа, кратные восьми, больше минус тридцати двух и не больше ста двадцати. Таких всего девятнадцать, значит, красных не больше девятнадцати."},{"b":0,"f":"div_count"},{"b":1,"s":"А самое большое синее равно числу красных, то есть не больше девятнадцати. Но сорок разных синих чисел, кратных пяти и больших минус тридцати двух, — это минимум от минус тридцати до ста шестидесяти пяти. Противоречие. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое наибольшее количество синих карт может быть на столе?","ak":"num","av":"8","steps":[{"w":["✏️ B = 8t. Красных не больше, чем кратных 8 до 24t:","=R ≤ 3t + 4","📌 Синих не больше, чем кратных 5 до R:","=B ≤ (R + 30) : 5 + 1   →   R ≥ 40t − 35"],"f":[]},{"w":["=40t − 35 ≤ 3t + 4   →   t = 1   →   **B ≤ 8**"],"f":[]},{"w":["🔨 **Пример:** B = 8, R = 5","👉 синие: −30, −25, …, 5;   красные: −8, 0, 8, 16, 24","✅ **Ответ: 8.**"],"f":[]}],"v":[{"b":0,"s":"Пусть синих восемь тэ. Самое большое красное двадцать четыре тэ, поэтому красных не больше, чем кратных восьми от минус двадцати четырёх до двадцати четырёх тэ."},{"b":0,"s":"С другой стороны, самое большое синее равно числу красных, и все синие — разные кратные пяти от минус тридцати до этого числа. Чтобы поместились восемь тэ синих, красных должно быть достаточно много."},{"b":1,"s":"Сравнивая две оценки, получаем, что тэ может быть только единицей. Значит, синих не больше восьми."},{"b":2,"s":"Пример: восемь синих — от минус тридцати до пяти, пять красных — от минус восьми до двадцати четырёх. Проверьте условия по решению. Ответ: восемь."}],"rich":true}],"tags":["div","est"],"facts":["div_def","div_count","est_ex"],"note":"","n":124},{"id":"185987","d":3,"from":"Школково","stem":"На столе лежит некоторое количество карточек, часть из которых синего цвета, а остальные красного (есть хотя бы по одной карточке каждого цвета). На каждой карточке написано целое число. На синих карточках написаны различные числа, делящиеся на 3, а на красных — различные чётные числа (некоторые числа могут быть написаны дважды: на синей и на красной карточке). Все числа больше −60. Наибольшее число на красной карточке равно удвоенному количеству синих карточек, а наибольшее число на синей карточке равно количеству красных карточек.","parts":[{"l":"а","q":". На каждой карточке написано целое число. На карточках синего цвета написаны различные числа, делящиеся на 3, а на карточках красного цвета написаны различные чётные числа (при этом некоторые числа могут быть написаны дважды: один раз на синей карточке и один раз на красной карточке). Все числа на карточках больше -60. Оказалось, что наибольшее число, написанное на красной карточке, равно удвоенному количеству синих карточек, а наибольшее число, написанное на синей карточке, равно количеству красных карточек.","ak":"yn","av":"ДА","steps":[{"w":["🔨 **Пример:** красных R = 3 → наибольшее синее 3.","👉 Синяя одна: {3} → наибольшее красное 2·1 = 2.","👉 Красные: {−2, 0, 2} ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Подберём пример. Пусть красных карточек три, тогда наибольшее синее число три. Возьмём одну синюю карточку с тройкой. Тогда наибольшее красное — удвоенное число синих, то есть два. Красные: минус два, ноль и два. Все условия выполнены. Ответ: да."}],"rich":true},{"l":"б","q":"Может ли на столе лежать ровно 150 красных карточек?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Синие — разные кратные 3 от −57 до R = 150: **B ≤ 70**.","📌 Красные — разные чётные от −58 до 2B: **R ≤ B + 30 ≤ 100**.","❌ 150 > 100.","✅ **Ответ: нет.**"],"f":["div_count"]}],"v":[{"b":0,"s":"Если красных сто пятьдесят, то наибольшее синее сто пятьдесят, а синие — разные кратные трёх больше минус шестидесяти. Их не больше семидесяти."},{"b":0,"f":"div_count"},{"b":0,"s":"Тогда наибольшее красное не больше ста сорока, а чётных чисел от минус пятидесяти восьми до ста сорока — всего сто. Значит, красных не больше ста. Противоречие. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое наибольшее количество красных карточек может лежать на столе?","ak":"num","av":"75","steps":[{"w":["📌 Две оценки:","=R ≤ B + 30,     B ≤ R : 3 + 20","=R ≤ R : 3 + 50   →   R ≤ 75"],"f":[]},{"w":["🔨 **Пример:** B = 45 — все кратные 3 от −57 до 75; R = 75 — все чётные от −58 до 90.","✅ **Ответ: 75.**"],"f":[]}],"v":[{"b":0,"s":"Запишем две оценки. Красных не больше, чем чётных чисел от минус пятидесяти восьми до два Бэ — это Бэ плюс тридцать. Синих не больше, чем кратных трёх от минус пятидесяти семи до эр — это эр третьих плюс двадцать."},{"b":0,"s":"Подставим одно в другое: эр не больше эр третьих плюс пятьдесят, откуда эр не больше семидесяти пяти."},{"b":1,"s":"Пример: берём все возможные числа — синие от минус пятидесяти семи до семидесяти пяти, их сорок пять, красные от минус пятидесяти восьми до девяноста, их семьдесят пять. Ответ: семьдесят пять."}],"rich":true}],"tags":["div","est"],"facts":["div_count","est_ex"],"note":"","n":125},{"id":"190335","d":3,"from":"Школково","stem":"На доске записано некоторое натуральное число N. Учитель по очереди вызывает учеников, которые выполняют с любым из уже записанных на доске чисел одно из следующих действий: – умножить число на 4; – прибавить к числу 12; – если число не равно 9, то вычеркнуть из числа цифру 9. Затем каждый из учеников записывает новое число на доску.","parts":[{"l":"а","q":"Можно ли за несколько действий получить из числа 47 число 2?","ak":"yn","av":"ДА","steps":[{"w":["🔨 Прибавляем 12 двадцать один раз:","=47 + 21·12 = 299","👉 Вычёркиваем девятки: 299 → 29 → 2 ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Нужно добраться до числа с девятками, из которого вычёркиванием получится двойка. Прибавим двенадцать двадцать один раз — получится двести девяносто девять. Вычёркиваем одну девятку — двадцать девять, потом вторую — два. Ответ: да."}],"rich":true},{"l":"б","q":"Можно ли за несколько действий получить из числа 7 число 77?","ak":"yn","av":"НЕТ","steps":[{"w":["💡 **Инвариант:** остаток при делении на 3.","👉 ×4 — остаток не меняется (4 = 3 + 1)","👉 +12 — не меняется","👉 вычеркнуть 9 — сумма цифр меняется на 9, остаток тот же","=7 → остаток 1,     77 → остаток 2","✅ **Ответ: нет.**"],"f":["invariant"]}],"v":[{"b":0,"s":"Посмотрим на остаток при делении на три. Умножение на четыре его не меняет, ведь четыре даёт остаток один. Прибавление двенадцати тоже не меняет. А вычёркивание девятки уменьшает сумму цифр на девять — остаток опять тот же."},{"b":0,"f":"invariant"},{"b":0,"s":"Семь даёт остаток один, а семьдесят семь — два. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое наибольшее количество чисел, меньших 2015, может быть записано на доске, если N = 1.","ak":"num","av":"672","steps":[{"w":["📏 Все числа дают остаток 1 при делении на 3. Таких чисел меньше 2015:","=1, 4, 7, …, 2014   →   672 числа"],"f":[]},{"w":["🔨 **Все они получаются** (прибавляя 12):","👉 из 1 — все с остатком 1 при делении на 12","👉 из 4 = 1·4 — с остатком 4","👉 из 97 → 7 — с остатком 7;   из 109 → 10 — с остатком 10","✅ **Ответ: 672.**"],"f":[]}],"v":[{"b":0,"s":"Из инварианта все числа на доске дают остаток один при делении на три. Чисел меньше двух тысяч пятнадцати с таким остатком — шестьсот семьдесят два. Больше быть не может."},{"b":1,"s":"Покажем, что получаются все. Прибавляя двенадцать к единице, получаем все числа с остатком один при делении на двенадцать. Умножив единицу на четыре, получаем четвёрку, а от неё — все с остатком четыре. Через вычёркивание девятки из девяноста семи и ста девяти получаем семь и десять, а от них — остальные. Ответ: шестьсот семьдесят два."}],"rich":true}],"tags":["ops","div"],"facts":["invariant","mod_def","ds_mod9","est_ex"],"note":"","n":126},{"id":"190337","d":3,"from":"Школково","stem":"Дана конечная последовательность натуральных чисел, каждое из которых не меньше 80 и не больше 170. Каждое следующее число либо делится на предыдущее, либо меньше предыдущего на 2. Числа в последовательности могут повторяться.","parts":[{"l":"а","q":"Может ли быть 40 различных чисел в последовательности?","ak":"yn","av":"ДА","steps":[{"w":["🔨 **Пример:** 170, 168, 166, …, 92","👉 каждое на 2 меньше предыдущего — **40** различных чисел.","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Самый простой способ — каждый раз уменьшать на два. Начнём со ста семидесяти и спустимся до девяноста двух — это сорок разных чисел. Ответ: да."}],"rich":true},{"l":"б","q":"Может ли быть 80 различных чисел в последовательности?","ak":"yn","av":"ДА","steps":[{"w":["💡 **Идея:** сначала идём по **нечётным**, потом **удваиваем** и идём по **чётным**.","=169, 167, …, 81   (45 чисел)","=81 → 162   (162 делится на 81)","=160, 158, …, 80   (42 числа)","👉 Всего **87** различных чисел ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Вычитание двойки сохраняет чётность, поэтому за одну «лесенку» мы проходим только нечётные или только чётные числа. Перейти с нечётных на чётные можно удвоением: следующее число делится на предыдущее."},{"b":0,"s":"Идём по нечётным от ста шестидесяти девяти до восьмидесяти одного, удваиваем восемьдесят один — получаем сто шес
