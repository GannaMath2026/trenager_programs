ин раз в третью. Ответ: да."}],"rich":true},{"l":"б","q":"Может ли в четвертой коробке быть 306 камней?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Было: 102 − 101 = 1. В (0, 0, 0, 306) разность 0.","❌ Остатки разные — инвариант нарушен.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Разность второй и первой коробки вначале равна одному. Если все камни в четвёртой, разность первых двух коробок ноль. Остаток при делении на четыре другой. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое максимальное число камней может быть в четвертой коробке?","ak":"num","av":"303","steps":[{"w":["📌 Первые три коробки всегда дают **разные** остатки при делении на 4 (их разности 1 и 2 сохраняются).","👉 Значит, в них разное число камней → вместе не меньше 0 + 1 + 2 = 3.","=в четвёртой ≤ 306 − 3 = 303"],"f":[]},{"w":["🔨 **Пример:** 101 ход в четвёртую коробку:","=(0, 1, 2, 303) ✔️","✅ **Ответ: 303.**"],"f":[]}],"v":[{"b":0,"s":"Из инварианта первые три коробки всегда дают разные остатки при делении на четыре. Значит, количества камней в них разные, и вместе их хотя бы ноль плюс один плюс два, то есть три. В четвёртой остаётся не больше трёхсот трёх."},{"b":1,"s":"Пример: сто один раз подряд кладём камни в четвёртую коробку. Получаем ноль, один, два и триста три. Ответ: триста три."}],"rich":true}],"tags":["ops"],"facts":["invariant","mod_def","est_ex"],"note":"","n":65},{"id":"159718","d":3,"from":"PDF №018","stem":"На доске написано n единиц подряд. Между некоторыми из них расставляют знаки «+» и считают получившуюся сумму. Например, если было написано 10 единиц, то можно получить сумму 136: 1+ 1+ 111+ 11 +11 +1 = 136.","parts":[{"l":"а","q":"Можно ли получить сумму 132, если n= 60?","ak":"yn","av":"ДА","steps":[{"w":["✏️ Пусть **a** слагаемых «1» и **b** слагаемых «11».","=сумма:  a + 11b = 132","=единиц в записи:  a + 2b = 60"],"f":[]},{"w":["=9b = 72   →   b = 8,   a = 44","🔨 **Пример:** 44 слагаемых «1» и 8 слагаемых «11».","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Попробуем обойтись слагаемыми один и одиннадцать. Пусть единиц а штук, а одиннадцатых — бэ. Тогда сумма а плюс одиннадцать бэ, а единиц в записи а плюс два бэ, ведь в «одиннадцати» две единицы."},{"b":1,"s":"Вычтем одно уравнение из другого: девять бэ равно семидесяти двум, бэ равно восьми, а равно сорока четырём. Пример готов. Ответ: да."}],"rich":true},{"l":"б","q":"Можно ли получить сумму 132, если n= 80?","ak":"yn","av":"НЕТ","steps":[{"w":["💡 **Идея:** число из k единиц даёт при делении на 9 остаток **k**.","👉 Значит, сумма даёт такой же остаток, как **n**.","=132 → остаток 6,     80 → остаток 8","❌ Не совпадают.","✅ **Ответ: нет.**"],"f":["repunit"]}],"v":[{"b":0,"f":"repunit"},{"b":0,"s":"Значит, вся сумма при делении на девять даёт такой же остаток, как общее количество единиц эн. Сто тридцать два даёт остаток шесть, а восемьдесят — остаток восемь. Ответ: нет."}],"rich":true},{"l":"в","q":"Для скольких значений n можно получить сумму 132?","ak":"num","av":"14","steps":[{"w":["📌 Нужно: n даёт остаток 6 при делении на 9, и n ≤ 132.","📌 Наименьшее n: 132 = 111 + 11 + 10 единиц → **15** единиц."],"f":[]},{"w":["🔨 Все n = 15, 24, 33, …, 132 получаются: замена одиннадцати «1» на одно «11» убирает 9 единиц, а сумма не меняется.","=(132 − 15) : 9 + 1 = 14","✅ **Ответ: 14.**"],"f":[]}],"v":[{"b":0,"s":"Из пункта бэ эн должно давать остаток шесть при делении на девять. И эн не больше ста тридцати двух — сумма не может быть меньше числа единиц."},{"b":0,"s":"Самое маленькое эн получится, если использовать большие слагаемые: сто одиннадцать плюс одиннадцать плюс десять единиц — всего пятнадцать единиц."},{"b":1,"s":"А дальше можно увеличивать эн по девять: если одиннадцать слагаемых «один» заменить на одно «одиннадцать», сумма та же, а единиц на девять меньше. Так получаются все значения от пятнадцати до ста тридцати двух с шагом девять — их четырнадцать. Ответ: четырнадцать."}],"rich":true},{"l":"г","q":"Какую наибольшую четырёхзначную сумму можно получить, если n = 50?","ak":"num","av":"9554","steps":[{"w":["✏️ a слагаемых 1111, b — 111, c — 11, d — 1:","=4a + 3b + 2c + d = 50","=сумма = 50 + 9·(123a + 12b + c)"],"f":[]},{"w":["📏 Сумма ≤ 9999 → 123a + 12b + c ≤ 1105 → **a ≤ 8**.","👉 a = 8: осталось 18 единиц → лучше всего b = 6:","=123·8 + 12·6 = 1056"],"f":[]},{"w":["=50 + 9·1056 = 9554 = 8·1111 + 6·111","✅ **Ответ: 9554.**"],"f":[]}],"v":[{"b":0,"s":"Теперь можно использовать и тысяча сто одиннадцать. Пусть таких слагаемых а, по сто одиннадцать — бэ, по одиннадцать — цэ, единиц — дэ. Всего единиц в записи пятьдесят. Сумму удобно записать как пятьдесят плюс девять, умноженное на скобку — формула в решении."},{"b":1,"s":"Сумма четырёхзначная, поэтому скобка не больше тысячи ста пяти, и а не больше восьми. Выгоднее всего взять восемь слагаемых тысяча сто одиннадцать — они дают больше всего. Остаются восемнадцать единиц, из них лучше всего составить шесть слагаемых сто одиннадцать."},{"b":2,"s":"Получаем девять тысяч пятьсот пятьдесят четыре. Ответ: девять тысяч пятьсот пятьдесят четыре."}],"rich":true}],"tags":["digits"],"facts":["repunit","ds_mod9","lin_dioph","est_ex"],"note":"","n":66},{"id":"125976","d":3,"from":"PDF №022","stem":"На доске записано k последовательных натуральных чисел. Оказалось, что среди них чисел, делящихся на 20, меньше, чем чисел, делящихся на 23.","parts":[{"l":"а","q":"Могло ли среди записанных чисел быть ровно три числа, делящихся на 20?","ak":"yn","av":"ДА","steps":[{"w":["📌 Кратных 23 хотя бы 4 → чисел **≥ 70**.","📌 Кратных 20 ровно 3 → чисел **≤ 79**."],"f":["div_count"]},{"w":["🔨 **Пример:** 23, 24, …, 92 (70 чисел)","👉 кратные 23: 23, 46, 69, 92 — **четыре**","👉 кратные 20: 40, 60, 80 — **три** ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Если кратных двадцати три, то кратных двадцати трём хотя бы четыре. Оценим длину отрезка: чтобы поместились четыре кратных двадцати трём, нужно хотя бы семьдесят чисел. А чтобы кратных двадцати было не больше трёх — не больше семидесяти девяти."},{"b":0,"f":"div_count"},{"b":1,"s":"Начнём прямо с двадцати трёх и закончим девяноста двумя. Кратных двадцати трём — четыре, кратных двадцати — три. Ответ: да."}],"rich":true},{"l":"б","q":"Могло ли среди записанных чисел быть ровно десять чисел, делящихся на 20?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 10 кратных 20 → чисел ≤ 11·20 − 1 = 219.","📌 Хотя бы 11 кратных 23 → чисел ≥ 10·23 + 1 = 231.","❌ Противоречие.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Если кратных двадцати ровно десять, чисел не больше двухсот девятнадцати. А кратных двадцати трём должно быть хотя бы одиннадцать — для этого нужно хотя бы двести тридцать одно число. Не помещается. Ответ: нет."}],"rich":true},{"l":"в","q":"Найдите наибольшее возможное значение k.","ak":"num","av":"139","steps":[{"w":["📏 m кратных 20 и хотя бы m + 1 кратных 23:","=23m + 1 ≤ k ≤ 20m + 19   →   m ≤ 6   →   k ≤ 139"],"f":[]},{"w":["🔨 **Пример k = 139:** отрезок начинается и кончается кратным 23 →","=161, 162, …, 299","👉 кратные 23: 161, 184, …, 299 — **семь**","👉 кратные 20: 180, 200, …, 280 — **шесть** ✔️","✅ **Ответ: 139.**"],"f":[]}],"v":[{"b":0,"s":"Пусть кратных двадцати эм. Тогда кратных двадцати трём хотя бы эм плюс один, и чисел хотя бы двадцать три эм плюс один. С другой стороны, при эм кратных двадцати чисел не больше двадцати эм плюс девятнадцать. Отсюда эм не больше шести, а чисел не больше ста тридцати девяти."},{"b":1,"s":"Для примера нужен отрезок из ста тридцати девяти чисел, который начинается и заканчивается кратным двадцати трём и захватывает ровно шесть кратных двадцати. Подходит отрезок от ста шестидесяти одного до двухсот девяноста девяти. Ответ: сто тридцать девять."}],"rich":true}],"tags":["div"],"facts":["div_count","est_ex","mod_def"],"note":"","n":67},{"id":"159632","d":3,"from":"PDF №023","stem":"По кругу расставлено N различных натуральных чисел, каждое из которых не превосходит 400. Сумма любых четырёх идущих подряд чисел делится на 3, а сумма любых трёх идущих подряд чисел не делится на 3.","parts":[{"l":"а","q":"Может ли N быть равным 360?","ak":"yn","av":"НЕТ","steps":[{"w":["💡 **Идея:** если сумма любых 4 подряд кратна 3, то числа через 4 места дают **одинаковый остаток**:","=aᵢ₊₄ ≡ aᵢ (mod 3)"],"f":["mod_shift"]},{"w":["📌 Если бы было число, кратное 3, то сумма трёх других из его четвёрки была бы кратна 3 — запрещено.","👉 Значит, кратных 3 нет, и в каждой четвёрке **два** остатка 1 и **два** остатка 2.","👉 Чисел с остатком 1 и с остатком 2 — поровну, по N : 2."],"f":[]},{"w":["📌 Чисел до 400 с остатком 2: 2, 5, …, 398 — их **133**.","=N ≤ 2·133 = 266 \u003c 360","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Возьмём две соседние четвёрки чисел подряд: они отличаются только одним числом в начале и одним в конце. Обе суммы делятся на три, значит, эти два числа дают одинаковый остаток. Получается, что числа, стоящие через четыре места, имеют одинаковые остатки."},{"b":0,"f":"mod_shift"},{"b":1,"s":"Теперь посмотрим на одну четвёрку. Если в ней есть число, кратное трём, то сумма трёх остальных тоже кратна трём, а так нельзя. Значит, кратных трём нет вовсе, и в каждой четвёрке два числа с остатком один и два с остатком два — иначе какая-то тройка дала бы сумму, кратную трём."},{"b":2,"s":"Значит, чисел с остатком два ровно половина. А всего чисел до четырёхсот с остатком два — сто тридцать три. Поэтому эн не больше двухсот шестидесяти шести. Ответ: нет."}],"rich":true},{"l":"б","q":"Может ли N быть равным 149?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Остатки повторяются через 4 места и через N мест (круг).","👉 Если N **нечётное**, то все остатки **одинаковые**.","❌ Тогда сумма четырёх даёт остаток как 4r → r = 0, а кратных 3 быть не может.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Остатки повторяются через каждые четыре места. Но на круге они повторяются и через эн мест. Если эн нечётное, из этих двух повторений следует, что все остатки одинаковые."},{"b":0,"s":"Но тогда четыре одинаковых остатка в сумме кратны трём, только если сам остаток ноль, а кратных трём чисел, как мы выяснили, быть не может. Сто сорок девять нечётное. Ответ: нет."}],"rich":true},{"l":"в","q":"Найдите наибольшее значение N.","ak":"num","av":"266","steps":[{"w":["📏 **Оценка** из пункта а: **N ≤ 266**."],"f":[]},{"w":["🔨 **Пример:** чередуем по кругу числа с остатком 1 и с остатком 2:","👉 остаток 1: 133 числа из 1, 4, …, 397","👉 остаток 2: все 133 числа 2, 5, …, 398","📌 Тройки дают 1 + 2 + 1 или 2 + 1 + 2 — не кратно 3; четвёрки — 6 ✔️","✅ **Ответ: 266.**"],"f":[]}],"v":[{"b":0,"s":"Оценка у нас уже есть: не больше двухсот шестидесяти шести."},{"b":1,"s":"Пример: ставим по кругу числа с остатком один и с остатком два через одно. Тогда любые три подряд дают остатки один, два, один или два, один, два — сумма не делится на три. А любые четыре подряд — два единицы и две двойки, сумма шесть по остаткам, делится на три. Ответ: двести шестьдесят шесть."}],"rich":true}],"tags":["div","est"],"facts":["mod_shift","mod_def","est_ex"],"note":"","n":68},{"id":"23745","d":3,"from":"PDF №027","stem":"На доске написано 100 различных натуральных чисел, сумма которых равна 5120.","parts":[{"l":"а","q":"Может ли оказаться, что на доске написано число 230?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Остальные 99 чисел различны:","=сумма ≥ 1 + 2 + … + 99 = 4950","=4950 + 230 = 5180 > 5120","✅ **Ответ: нет.**"],"f":["sum_1n"]}],"v":[{"b":0,"s":"Если на доске есть двести тридцать, то остальные девяносто девять чисел разные, и их сумма не меньше суммы чисел от одного до девяноста девяти — это четыре тысячи девятьсот пятьдесят. Вместе с двумястами тридцатью уже больше пяти тысяч ста двадцати. Ответ: нет."},{"b":0,"f":"sum_1n"}],"rich":true},{"l":"б","q":"Может ли оказаться, что на доске нет числа 14?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Без 14 самые маленькие 100 чисел — это 1, 2, …, 101 без 14:","=5151 − 14 = 5137 > 5120","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Если числа четырнадцать нет, то самые маленькие сто разных чисел — это числа от одного до ста одного, кроме четырнадцати. Их сумма пять тысяч сто тридцать семь — больше нужной. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое наименьшее количество чисел, кратных 14, может быть на доске?","ak":"num","av":"4","steps":[{"w":["📏 Пусть кратных 14 **не больше 3**. Тогда не кратных — хотя бы 97.","👉 97 самых маленьких не кратных 14 — числа 1…104 без 14, 28, …, 98:","=5460 − 392 = 5068","👉 Плюс три кратных 14 — хотя бы 14 + 28 + 42 = 84:","=5068 + 84 = 5152 > 5120 ❌"],"f":[]},{"w":["🔨 **Пример с 4 кратными:** числа 1…102 без 70, 84, 98 и число 119.","=сумма 5120, кратные 14 — только 14, 28, 42, 56 ✔️","✅ **Ответ: 4.**"],"f":[]}],"v":[{"b":0,"s":"Ищем наименьшее количество кратных четырнадцати. Предположим, что их не больше трёх. Тогда остальных хотя бы девяносто семь, и даже самые маленькие такие числа дают пять тысяч шестьдесят восемь."},{"b":0,"s":"Добавим ещё самые маленькие кратные четырнадцати — получается больше пяти тысяч ста двадцати. Значит, кратных четырнадцати хотя бы четыре."},{"b":1,"s":"Пример: берём числа от одного до ста двух, убираем семьдесят, восемьдесят четыре и девяносто восемь, а добавляем сто девятнадцать. Сумма ровно пять тысяч сто двадцать, а кратных четырнадцати осталось четыре. Ответ: четыре."}],"rich":true}],"tags":["est","div"],"facts":["sum_1n","distinct_min","est_ex"],"note":"","n":69},{"id":"91754","d":3,"from":"PDF №034","stem":"На сайте проводится опрос, кого из футболистов посетители сайта считают лучшим по итогам сезона. Каждый посетитель голосует за одного футболиста. На сайте отображается рейтинг каждого футболиста — доля голосов, отданных за него, в процентах, округленная до целого числа. Например, числа 9,3, 10,5 и 12,7 округляются до 9, 11 и 13 соответственно.","parts":[{"l":"а","q":"Всего проголосовало 13 посетителей сайта. Голоса распределились так, что рейтинг некоторого футболиста стал равным 31. Затем Вася проголосовал за этого футболиста. Каков теперь рейтинг футболиста с учётом голоса Васи?","ak":"num","av":"36","steps":[{"w":["✏️ **v** — голосов за футболиста из 13. Рейтинг 31:","=30,5 ≤ 100v : 13 \u003c 31,5   →   v = 4"],"f":["rounding"]},{"w":["👉 После голоса Васи — 5 из 14:","=5 : 14 ≈ 35,7%  →  36","✅ **Ответ: 36.**"],"f":[]}],"v":[{"b":0,"f":"rounding"},{"b":0,"s":"Пусть за футболиста отдали вэ голосов из тринадцати. Рейтинг тридцать один значит, что доля в процентах от тридцати с половиной до тридцати одного с половиной. Подходит только вэ равное четырём."},{"b":1,"s":"После голоса Васи стало пять голосов из четырнадцати — это примерно тридцать пять целых семь десятых процента, округляется до тридцати шести. Ответ: тридцать шесть."}],"rich":true},{"l":"б","q":"Голоса распределяют между двумя футболистами. Может ли суммарный рейтинг быть больше 100?","ak":"yn","av":"ДА","steps":[{"w":["💡 **Идея:** обе доли должны округлиться **вверх**.","🔨 **Пример:** 8 голосов — 1 и 7:","=12,5% → 13,     87,5% → 88","=13 + 88 = 101 > 100","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Сумма округлённых рейтингов больше ста, если обе доли округляются вверх. Это бывает, когда доли оканчиваются на половину. Например, восемь голосов: один и семь. Это двенадцать с половиной и восемьдесят семь с половиной процента, они округляются до тринадцати и восьмидесяти восьми. Сумма сто один. Ответ: да."}],"rich":true},{"l":"в","q":"На сайте отображалось, что рейтинг некоторого футболиста равен 7. После того, как Вася отдал свой голос за этого футболиста, рейтинг стал равен 9. При каком наибольшем числе отданных за всех футболистов голосов, включая Васин голос, такое возможно?","ak":"num","av":"82","steps":[{"w":["✏️ Было **N** голосов, **v** — за футболиста:","=6,5 ≤ 100v : N \u003c 7,5,     8,5 ≤ 100(v + 1) : (N + 1) \u003c 9,5"],"f":[]},{"w":["📏 Из этих неравенств: N ≤ 91, тогда **v ≤ 6**.","=v + 1 ≥ 0,085(N + 1)   →   N + 1 ≤ 7 : 0,085 ≈ 82,4   →   N + 1 ≤ 82"],"f":[]},{"w":["🔨 **Пример:** N = 81, v = 6:","=6 : 81 ≈ 7,4% → 7,     7 : 82 ≈ 8,54% → 9 ✔️","✅ **Ответ: 82.**"],"f":[]}],"v":[{"b":0,"s":"Пусть до Васи было эн голосов, и вэ из них за нашего футболиста. Записываем оба округления как двойные неравенства: сначала доля от шести с половиной до семи с половиной процентов, потом — от восьми с половиной до девяти с половиной."},{"b":1,"s":"Один голос Васи должен поднять долю почти на два процента — значит, голосов не очень много. Аккуратно сравнивая неравенства, получаем, что голосов до Васи не больше девяноста одного, а за футболиста было не больше шести."},{"b":1,"s":"Тогда после Васи за него не больше семи голосов, и это должно быть хотя бы восемь с половиной процентов от всех. Отсюда всех голосов не больше восьмидесяти двух."},{"b":2,"s":"Пример: из восьмидесяти одного голоса шесть за футболиста — рейтинг семь. Вася голосует — семь из восьмидесяти двух, рейтинг девять. Ответ: восемьдесят два."}],"rich":true}],"tags":["avg"],"facts":["rounding","percent","est_ex"],"note":"","n":70},{"id":"125987","d":3,"from":"PDF №037","stem":"","parts":[{"l":"а","q":"Приведите пример семизначного числа, из которого, вычеркивая цифры, можно получить каждое из чисел: 206, 835, 930.","ak":"self","av":"Например, 2893506.","steps":[{"w":["💡 **Идея:** цифры 3 и 0 нужны в нескольких числах — пусть они будут **общими**.","🔨 **Пример:** 2 8 9 3 5 0 6","👉 2 _ _ _ _ 0 6 → **206**","👉 _ 8 _ 3 5 _ _ → **835**","👉 _ _ 9 3 _ 0 _ → **930** ✔️"],"f":["subseq"]}],"v":[{"b":0,"s":"Нам нужно спрятать в семи цифрах три числа: двести шесть, восемьсот тридцать пять и девятьсот тридцать. Всего разных цифр восемь, а места семь — значит, какие-то цифры должны быть общими. Удобно сделать общими тройку и ноль."},{"b":0,"f":"subseq"},{"b":0,"s":"Подходит число два, восемь, девять, три, пять, ноль, шесть. Проверьте по решению: вычёркивая цифры, получаем все три числа."}],"rich":true},{"l":"б","q":"Существует ли восьмизначное число, из которого, вычеркивая цифры, можно получить каждое из чисел: 247, 345, 586, 812?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 В числах 247, 345, 586, 812 — **8 разных цифр**: 2, 4, 7, 3, 5, 8, 6, 1.","👉 В восьмизначном числе каждая из них ровно **один раз**."],"f":[]},{"w":["🔎 Порядок цифр:","=2 → 4 (247),   4 → 5 (345),   5 → 8 (586),   8 → 1 → 2 (812)","❌ Получается, что 2 стоит раньше самой себя.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"В четырёх числах участвуют восемь разных цифр, а в восьмизначном числе восемь мест. Значит, каждая цифра встречается ровно один раз, и её место определено."},{"b":1,"s":"Выпишем, что должно стоять раньше чего. Двойка раньше четвёрки, четвёрка раньше пятёрки, пятёрка раньше восьмёрки, восьмёрка раньше единицы, а единица раньше двойки. Получился круг: двойка раньше самой себя. Так не бывает. Ответ: нет."}],"rich":true},{"l":"в","q":"Найдите наименьшее натуральное число, из которого можно получить все натуральные числа от 1 до 50, вычеркивая цифры.","ak":"num","av":"12341234506789","steps":[{"w":["📌 Нужны 11, 22, 33, 44 → цифры 1, 2, 3, 4 хотя бы **по два раза**; 5–9 и 0 — хотя бы по разу.","📏 Значит, цифр не меньше 8 + 6 = **14**."],"f":[]},{"w":["💡 Чтобы число было наименьшим, в начале — самые маленькие цифры:","=1 2 3 4 1 2 3 4 …","👉 Вторая группа 1 2 3 4 даёт числа 21, 31, 32, 41, 42, 43."],"f":[]},{"w":["📌 0 должен стоять после 5 (для 50), 5 — после 1…4 (для 15, 25, …), 6–9 — в конце по возрастанию.","=12341234506789","✅ **Ответ: 12341234506789.**"],"f":["est_ex"]}],"v":[{"b":0,"s":"Сначала поймём, сколько нужно цифр. Чтобы получить одиннадцать, двадцать два, тридцать три и сорок четыре, цифры от одного до четырёх нужны хотя бы по два раза. Остальные шесть цифр — хотя бы по разу. Всего не меньше четырнадцати цифр."},{"b":1,"s":"Чтобы число было как можно меньше, в начале должны стоять маленькие цифры: один, два, три, четыре. Повторим их ещё раз — тогда можно получить и числа вроде двадцати одного или сорока трёх."},{"b":2,"s":"Дальше пятёрка, после неё ноль — чтобы получилось пятьдесят, а затем шесть, семь, восемь, девять. Проверьте: все числа от одного до пятидесяти получаются. Ответ записан в решении."},{"b":2,"f":"est_ex"}],"rich":true}],"tags":["digits"],"facts":["subseq","est_ex"],"note":"","n":71},{"id":"1104","d":3,"from":"PDF №041","stem":"С натуральным числом проводят следующую операцию: между каждыми двумя его соседними цифрами записывают сумму этих цифр. Например, из числа 194 получается число 1109134.","parts":[{"l":"а","q":"Приведите пример числа, из которого получается число 176148179.","ak":"self","av":"1689","steps":[{"w":["💡 **Идея:** разбираем число **по частям**: цифра, сумма, цифра, сумма, …","=1 | 7 | 6 | 14 | 8 | 17 | 9","📌 Проверка: 1 + 6 = 7,   6 + 8 = 14,   8 + 9 = 17 ✔️","✅ **Ответ:** 1689."],"f":[]}],"v":[{"b":0,"s":"Будем читать число слева направо: цифра, потом сумма, потом снова цифра. Первая цифра один, потом сумма семь, значит, следующая цифра шесть. Потом сумма шести и следующей цифры — это четырнадцать, значит, следующая цифра восемь. Потом семнадцать — значит, последняя цифра девять."},{"b":0,"s":"Исходное число — тысяча шестьсот восемьдесят девять."}],"rich":true},{"l":"б","q":"Может ли из какого-нибудь числа получиться число 3107611090?","ak":"yn","av":"НЕТ","steps":[{"w":["🔎 Разбираем 3107611090:","👉 первая цифра 3, дальше сумма ≥ 3: «1» нельзя → **10** → следующая цифра 7","👉 дальше сумма от 7 до 16: «6» мало, «61» много ❌","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Пробуем разобрать число так же. Первая цифра три. Дальше идёт сумма тройки и следующей цифры — она не меньше трёх, поэтому «один» не подходит, остаётся «десять», и следующая цифра семь."},{"b":0,"s":"Потом должна идти сумма семёрки и следующей цифры, то есть от семи до шестнадцати. Но дальше в записи «шесть» — мало, или «шестьдесят один» — много. Разобрать невозможно. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое наибольшее число, кратное 11, может получиться из трехзначного числа?","ak":"num","av":"9167169","steps":[{"w":["✏️ Из числа abc получается a (a + b) b (b + c) c.","💡 Наибольшее — **семизначное** (обе суммы двузначные), начинается с 9."],"f":[]},{"w":["📌 Цифры: 9, 1, b − 1, b, 1, b + c − 10, c. Знакочередующаяся сумма:","=9 − 1 + (b − 1) − b + 1 − (b + c − 10) + c = 18 − b","👉 Кратно 11 → **b = 7**."],"f":["div_rules"]},{"w":["📌 c — наибольшее: **9**.","=9167169","✅ **Ответ: 9 167 169.**"],"f":[]}],"v":[{"b":0,"s":"Из трёхзначного числа а, бэ, цэ получается запись: а, потом а плюс бэ, потом бэ, потом бэ плюс цэ, потом цэ. Самые большие результаты — семизначные, когда обе суммы двузначные. И первая цифра должна быть девять."},{"b":1,"s":"Проверим делимость на одиннадцать по знакочередующейся сумме цифр."},{"b":1,"f":"div_rules"},{"b":1,"s":"Если выписать все семь цифр и сложить их с чередованием знаков, почти всё сокращается и остаётся восемнадцать минус бэ. Это делится на одиннадцать только при бэ равном семи."},{"b":2,"s":"Цифру цэ берём наибольшей — девять. Число девятьсот семьдесят девять превращается в девять миллионов сто шестьдесят семь тысяч сто шестьдесят девять. Ответ: это число."}],"rich":true}],"tags":["digits","div"],"facts":["dec_repr","div_rules","est_ex"],"note":"","n":72},{"id":"175401","d":3,"from":"PDF №043","stem":"","parts":[{"l":"а","q":"Можно ли представить число 2043 в виде суммы двух различных натуральных чисел с одинаковой суммой цифр?","ak":"yn","av":"ДА","steps":[{"w":["🔨 **Пример:**","=1017 + 1026 = 2043","📌 Суммы цифр: 1 + 0 + 1 + 7 = 9,   1 + 0 + 2 + 6 = 9 ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Подберём пример. Тысяча семнадцать плюс тысяча двадцать шесть — как раз две тысячи сорок три. У обоих чисел сумма цифр девять. Ответ: да."}],"rich":true},{"l":"б","q":"Можно ли представить число 599 в виде суммы двух различных натуральных чисел с одинаковой суммой цифр?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Складываем x + y = 599 столбиком — переносов **нет** (в единицах 9, в десятках 9, в сотнях 5).","=S(x) + S(y) = 5 + 9 + 9 = 23","❌ 23 нечётное — его нельзя разделить на две **равные** суммы.","✅ **Ответ: нет.**"],"f":["ds_carry"]}],"v":[{"b":0,"s":"Сложим два числа столбиком. Чтобы получилось пятьсот девяносто девять, в единицах цифры дают девять — девятнадцать не получится, это слишком много. В десятках тоже девять, в сотнях пять. Значит, переносов нет."},{"b":0,"f":"ds_carry"},{"b":0,"s":"Без переносов сумма цифр слагаемых равна сумме цифр результата — двадцати трём. Это нечётное число, его нельзя разделить на две равные части. Ответ: нет."}],"rich":true},{"l":"в","q":"Найдите наименьшее натуральное число, которое можно представить в виде суммы семи различных натуральных чисел с одинаковой суммой цифр.","ak":"num","av":"231","steps":[{"w":["💡 **Идея:** для каждой суммы цифр s берём **7 самых маленьких** чисел с этой суммой цифр."],"f":[]},{"w":["🔎 Считаем:","👉 s = 1…5: среди чисел меньше 100 их не хватает, нужно число ≥ 100 → суммы от 269 и больше","👉 **s = 6:** 6 + 15 + 24 + 33 + 42 + 51 + 60 = **231**","👉 s = 7, 8, 9: 238, 245, 252;  s ≥ 10 — ещё больше"],"f":[]},{"w":["✅ **Ответ: 231.**"],"f":[]}],"v":[{"b":0,"s":"Пусть у всех семи чисел сумма цифр эс. Тогда выгоднее всего взять семь самых маленьких чисел с такой суммой цифр. Переберём эс."},{"b":1,"s":"Если сумма цифр маленькая, от одного до пяти, то двузначных чисел с такой суммой мало — не больше шести. Придётся брать трёхзначное число, и сумма выходит большой."},{"b":1,"s":"При сумме цифр шесть семь чисел помещаются среди двузначных: шесть, пятнадцать, двадцать четыре и так далее до шестидесяти. Их сумма двести тридцать один. При большей сумме цифр числа больше, и сумма растёт."},{"b":2,"s":"Значит, наименьшее число — двести тридцать один. Ответ: двести тридцать один."}],"rich":true}],"tags":["digits"],"facts":["ds_mod9","ds_carry","est_ex"],"note":"","n":73},{"id":"26928","d":3,"from":"PDF №046","stem":"Каждое из четырёх последовательных натуральных чисел, последние цифры которых не равны нулю, поделили на его последнюю цифру. Сумма получившихся чисел равна S.","parts":[{"l":"а","q":"Может ли S быть равной 16 5/6?","ak":"yn","av":"ДА","steps":[{"w":["🔨 **Пример:** 12, 13, 14, 15","=12/2 + 13/3 + 14/4 + 15/5 = 6 + 4⅓ + 3½ + 3 = 16⅚","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Подберём пример. Возьмём двенадцать, тринадцать, четырнадцать и пятнадцать и поделим каждое на свою последнюю цифру. Получаем шесть, четыре и одна треть, три с половиной и три. Сумма шестнадцать и пять шестых. Ответ: да."}],"rich":true},{"l":"б","q":"Может ли S быть равной 569 29/126?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Знаменатель 126 = 2·7·9 → среди последних цифр есть **7 и 9**.","👉 Четыре подряд без нуля на конце → последние цифры 6, 7, 8, 9."],"f":[]},{"w":["✏️ Числа 10k + 6, …, 10k + 9:","=S = 4 + 10k·(1/6 + 1/7 + 1/8 + 1/9) = 4 + 1375k : 252","❌ Уравнение даёт нецелое k.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Посмотрим на знаменатель сто двадцать шесть: это два на семь на девять. Множитель семь может появиться только при делении на семь, а девять — при делении на девять. Значит, последние цифры чисел — шесть, семь, восемь и девять."},{"b":1,"s":"Запишем числа как десять ка плюс шесть и так далее. Каждое делится на свою последнюю цифру: получается единица плюс десять ка, делённое на цифру. Сумма — формула в решении."},{"b":1,"s":"Приравниваем её к нужному числу и находим ка — оно получается не целым. Ответ: нет."}],"rich":true},{"l":"в","q":"Найдите наибольшее значение S, если каждое из исходных чисел было трёхзначным.","ak":"num","av":"2066,5","steps":[{"w":["📌 Для чисел 10k + d, …, 10k + d + 3:","=S = 4 + 10k·(1/d + 1/(d + 1) + 1/(d + 2) + 1/(d + 3))","💡 Больше всего при **наибольшем k** и **d = 1**."],"f":[]},{"w":["👉 k = 99, числа 991–994:","=S = 4 + 990·(1 + 1/2 + 1/3 + 1/4) = 4 + 990·25/12 = 2066,5","✅ **Ответ: 2066,5.**"],"f":[]}],"v":[{"b":0,"s":"Запишем сумму в общем виде: четыре плюс десять ка, умноженное на сумму дробей с последними цифрами в знаменателях. Чтобы сумма была наибольшей, нужно взять ка как можно больше, а знаменатели как можно меньше — то есть последние цифры один, два, три и четыре."},{"b":1,"s":"Числа трёхзначные, поэтому самые большие такие — девятьсот девяносто один, два, три и четыре. Считаем — получается две тысячи шестьдесят шесть с половиной. Ответ: две тысячи шестьдесят шесть целых пять десятых."}],"rich":true}],"tags":["digits"],"facts":["dec_repr","fta","frac_monot","est_ex"],"note":"","n":74},{"id":"159663","d":3,"from":"PDF №048","stem":"Для чисел A и B, состоящих из одинакового количества цифр, вычисляют S – сумму произведений соответствующих цифр. Например, для чисел A = 123 и B = 579 получается сумма S = 1⋅5 +2 ⋅7 +3 ⋅9= 46.","parts":[{"l":"а","q":"Существуют ли трёхзначные числа A и B, для которых S = 200?","ak":"yn","av":"ДА","steps":[{"w":["💡 **Идея:** берём большие цифры — произведения будут крупными.","🔨 **Пример:** A = 977, B = 998","=9·9 + 7·9 + 7·8 = 81 + 63 + 56 = 200","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Произведение двух цифр не больше восьмидесяти одного, поэтому для двухсот нужны большие цифры. Подбираем: девять на девять, семь на девять и семь на восемь — восемьдесят один, шестьдесят три и пятьдесят шесть, вместе двести. Ответ: да."}],"rich":true},{"l":"б","q":"Существуют ли четырёхзначные числа A и B, для которых S = 320?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Произведение цифр не больше **81**, а следующее по величине — **72**.","👉 Три произведения по 81 → четвёртое 77 — не произведение цифр ❌","👉 Не больше двух по 81 → сумма ≤ 81·2 + 72·2 = 306 \u003c 320 ❌","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Самое большое произведение двух цифр — восемьдесят один, а следующее — семьдесят два. Нужно четыре произведения с суммой триста двадцать."},{"b":0,"s":"Если три произведения по восемьдесят одному, то четвёртое должно быть семьдесят семь, а так цифры не перемножаются. Если по восемьдесят одному не больше двух, то сумма не больше трёхсот шести. Не хватает. Ответ: нет."}],"rich":true},{"l":"в","q":"Верно ли, что любое натуральное число от 1 до 340 является суммой S для некоторых пятизначных чисел A и B?","ak":"yn","av":"ДА","steps":[{"w":["💡 **Идея:** любое число от 0 до 81 — это **9·u + 1·v** (два разряда).","👉 n ≤ 323: n = 81q + r — q разрядов 9·9 и два разряда для r (всего ≤ 5)."],"f":[]},{"w":["🔎 n = 324…340 — разбираем остаток после 81·3:","=81…90 = 81 + v,   91 = 81 + 2·5,   92 = 72 + 4·5","=93 = 72 + 3·7,   94 = 8·8 + 5·6,   95 = 81 + 2·7,   96 = 72 + 4·6,   97 = 81 + 4·4","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Ключевой приём: любое число от нуля до восьмидесяти одного можно получить двумя разрядами — девять, умноженное на что-то, плюс один, умноженный на что-то."},{"b":0,"s":"Тогда любое число до трёхсот двадцати трёх получается так: сначала несколько разрядов девять на девять, а остаток — двумя разрядами. Всего не больше пяти разрядов."},{"b":1,"s":"Остаются числа от трёхсот двадцати четырёх до трёхсот сорока. Для них берём три разряда по восемьдесят одному, а остаток от восьмидесяти одного до девяноста семи раскладываем на два произведения цифр — все варианты выписаны в решении. Ответ: да."}],"rich":true}],"tags":["digits"],"facts":["dec_repr","lin_dioph","est_ex"],"note":"","n":75},{"id":"159624","d":3,"from":"PDF №050","stem":"Ваня написал на доске трёхзначное число A. Серёжа переписал это число A, вычеркнул из него одну цифру и получил двузначное число B. Коля тоже переписал это число A, вычеркнул из него одну цифру (возможно, ту же самую, что и Серёжа) и получил двузначное число C.","parts":[{"l":"а","q":"Может ли быть верным равенство A = B ⋅C, если A> 150?","ak":"yn","av":"ДА","steps":[{"w":["🔨 **Пример:** A = 160","👉 вычеркнули 0 → B = 16;   вычеркнули 6 → C = 10","=16·10 = 160 ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Подберём пример. Пусть одно из чисел десять — тогда произведение получается приписыванием нуля. Число сто шестьдесят: вычеркнем ноль — получим шестнадцать, вычеркнем шестёрку — получим десять. Шестнадцать на десять — сто шестьдесят. Ответ: да."}],"rich":true},{"l":"б","q":"Может ли быть верным равенство A = B ⋅C, если 540 ≤A \u003c 600?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 A = 5bc, где b ≥ 4. После вычёркивания: 5b, 5c или bc.","👉 Оба начинаются с 5 → произведение ≥ 50·50 = 2500 ❌","👉 Иначе одно из них bc ≥ 40, другое ≥ 40 → ≥ 1600 ❌","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Число начинается с пятёрки, а вторая цифра хотя бы четыре. После вычёркивания получаются двузначные числа, начинающиеся с пяти, или число из двух последних цифр — оно хотя бы сорок."},{"b":0,"s":"В любом случае оба двузначных числа не меньше сорока, и их произведение не меньше тысячи шестисот — а это совсем не трёхзначное число. Ответ: нет."}],"rich":true},{"l":"в","q":"Найдите наибольшее число A, для которого может быть верным равенство A = B ⋅C.","ak":"num","av":"910","steps":[{"w":["💡 Если первая цифра a ≥ 2, то одно из чисел — **bc** (две последние цифры), иначе произведение слишком большое.","=A = (10a + x)·(10b + c) \u003c 100(a + 1)   →   10b + c \u003c 10 + 10 : a"],"f":[]},{"w":["👉 Для a = 9: bc = 10 или 11 → A = 910 или 911.","=910 = 91·10 ✔️,   911 — нет","✅ **Ответ: 910.**"],"f":["est_ex"]}],"v":[{"b":0,"s":"Ищем наибольшее А. Если оба двузначных числа начинаются с первой цифры а, то произведение не меньше ста а в квадрате — это слишком много при а от двух. Значит, одно из чисел — это две последние цифры."},{"b":0,"s":"Другое число начинается с цифры а, то есть оно хотя бы десять а. А их произведение меньше, чем сто раз а плюс один. Отсюда две последние цифры образуют совсем маленькое число — примерно десять."},{"b":1,"s":"Для первой цифры девять подходят только девятьсот десять и девятьсот одиннадцать. Девятьсот десять — это девяносто один на десять, подходит. Ответ: девятьсот десять."},{"b":1,"f":"est_ex"}],"rich":true}],"tags":["digits"],"facts":["dec_repr","extreme","est_ex"],"note":"","n":76},{"id":"91288","d":3,"from":"PDF №051","stem":"Из 24 последовательных нечётных чисел 1, 3, 5, …, 47 выбрали 9 различных чисел, которые записали в порядке возрастания. Пусть A — пятое по величине среди этих чисел, а B — их среднее арифметическое.","parts":[{"l":"а","q":"Может ли B − A равняться 2/9?","ak":"yn","av":"ДА","steps":[{"w":["📌 B − A = 2/9 → сумма девяти чисел = 9A + 2.","🔨 **Пример:** 1, 3, 5, 7, 9, 11, 13, 15, 19","=A = 9,   сумма 83 = 81 + 2 ✔️","✅ **Ответ: да.**"],"f":["mean"]}],"v":[{"b":0,"s":"Разница среднего и пятого числа две девятых означает, что сумма девяти чисел на два больше, чем девять пятых чисел."},{"b":0,"f":"mean"},{"b":0,"s":"Возьмём девять самых маленьких нечётных чисел, но последнее чуть увеличим: вместо семнадцати — девятнадцать. Пятое число девять, сумма восемьдесят три — ровно на два больше восьмидесяти одного. Ответ: да."}],"rich":true},{"l":"б","q":"Может ли B − A равняться 5/9?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 B − A = 5/9 → сумма = 9A + 5.","👉 Сумма девяти нечётных — **нечётная**, а 9A + 5 при нечётном A — **чётное**.","✅ **Ответ: нет.**"],"f":["parity"]}],"v":[{"b":0,"s":"Тогда сумма должна быть девять А плюс пять. Но сумма девяти нечётных чисел нечётная, а девять А плюс пять при нечётном А чётное. Ответ: нет."},{"b":0,"f":"parity"}],"rich":true},{"l":"в","q":"Найдите наибольшее возможное значение B− A.","ak":"num","av":"40/3","steps":[{"w":["💡 **Идея:** B − A большое, если **4 меньших** числа как можно ближе к A, а **4 больших** — как можно больше.","=9(B − A) ≤ −(2 + 4 + 6 + 8) + (41 + 43 + 45 + 47 − 4A) = 156 − 4A","📌 A ≥ 9 → 9(B − A) ≤ 120 → B − A ≤ 40/3"],"f":[]},{"w":["🔨 **Пример:** 1, 3, 5, 7, 9, 41, 43, 45, 47","=B = 201/9,   B − A = 40/3 ✔️","✅ **Ответ: 40/3.**"],"f":[]}],"v":[{"b":0,"s":"Ищем наибольшую разность. Удобно посчитать девять раз разность — это сумма отклонений всех чисел от пятого. Четыре меньших числа дают отрицательные отклонения, и они хотя бы два, четыре, шесть и восемь по модулю. Четыре больших числа не больше сорока одного, сорока трёх, сорока пяти и сорока семи."},{"b":0,"s":"Получаем оценку из решения, и она тем лучше, чем меньше А. Но А — пятое число, оно хотя бы девять. Отсюда разность не больше сорока третьих."},{"b":1,"s":"Пример: первые пять нечётных чисел и четыре самых больших. Разность ровно сорок третьих. Ответ: сорок третьих."}],"rich":true}],"tags":["avg"],"facts":["mean","parity","est_ex","distinct_min"],"note":"","n":77},{"id":"126263","d":3,"from":"PDF №052","stem":"На доске записано 10 натуральных чисел, среди которых нет одинаковых. Оказалось, что среднее арифметическое любых трёх или пяти чисел из записанных является целым числом.","parts":[{"l":"а","q":"Могут ли среди записанных на доске чисел одновременно быть числа 305 и 1511?","ak":"yn","av":"НЕТ","steps":[{"w":["💡 **Метод сдвига:** сумма любых 3 кратна 3 → все числа дают **одинаковый остаток** при делении на 3.","👉 Аналогично по 5 → по 15."],"f":["mod_shift"]},{"w":["=1511 − 305 = 1206 — не делится на 15","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Если среднее любых трёх чисел целое, то сумма любых трёх делится на три. Возьмём две тройки, отличающиеся одним числом: их разность делится на три, значит, эти два числа дают одинаковый остаток. Так все числа дают одинаковый остаток при делении на три."},{"b":0,"f":"mod_shift"},{"b":0,"s":"Точно так же с пятёрками — все числа одинаковы по модулю пять. Значит, и по модулю пятнадцать."},{"b":1,"s":"Разность тысячи пятисот одиннадцати и трёхсот пяти на пятнадцать не делится. Ответ: нет."}],"rich":true},{"l":"б","q":"Может ли одно из записанных на доске чисел быть квадратом другого, если среди записанных на доске чисел есть число 305?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Все числа дают остаток **5** при делении на 15 (как 305).","👉 Если n даёт остаток 5, то n² даёт остаток 25 → **10**.","❌ 10 ≠ 5.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Все числа дают такой же остаток при делении на пятнадцать, как триста пять, то есть пять. Если число даёт остаток пять, то его квадрат даёт остаток двадцать пять, а это десять. Остаток другой. Ответ: нет."}],"rich":true},{"l":"в","q":"Известно, что среди записанных на доске чисел есть число n и его квадрат n². Найдите наименьшее возможное значение n.","ak":"num","av":"6","steps":[{"w":["📌 n и n² дают одинаковый остаток при делении на 15 → n(n − 1) делится на 3 и на 5.","🔎 Проверяем по порядку: n = 2, 3, 4, 5 ❌,  **n = 6** ✔️"],"f":[]},{"w":["🔨 **Пример:** 6, 21, 36, 51, 66, 81, 96, 111, 126, 141","👉 все дают остаток 6, есть 6 и 36 = 6² ✔️","✅ **Ответ: 6.**"],"f":[]}],"v":[{"b":0,"s":"Число эн и его квадрат должны давать одинаковый остаток при делении на пятнадцать. Значит, эн в квадрате минус эн, то есть эн на эн минус один, делится на пятнадцать."},{"b":0,"s":"Проверим маленькие эн по порядку. Два, три, четыре и пять не подходят. Шесть подходит: шесть на пять — тридцать, делится на пятнадцать."},{"b":1,"s":"Пример: десять чисел с остатком шесть при делении на пятнадцать, среди них шесть и тридцать шесть. Ответ: шесть."}],"rich":true}],"tags":["div"],"facts":["mod_shift","mod_def","mod_sq","est_ex"],"note":"","n":78},{"id":"125979","d":3,"from":"PDF №053","stem":"На доске записано 10 натуральных чисел, среди которых нет одинаковых. Оказалось, что среднее арифметическое любых четырёх или семи чисел из записанных является целым числом.","parts":[{"l":"а","q":"Могут ли среди записанных на доске чисел одновременно быть числа 563 и 1417?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Метод сдвига: все числа одинаковы по mod 4 и по mod 7 → по **mod 28**.","=1417 − 563 = 854 — не делится на 4","✅ **Ответ: нет.**"],"f":["mod_shift"]}],"v":[{"b":0,"s":"Как и в предыдущей задаче, из условия про четвёрки все числа дают одинаковый остаток при делении на четыре, а из условия про семёрки — при делении на семь. Значит, одинаковы и по модулю двадцать восемь."},{"b":0,"f":"mod_shift"},{"b":0,"s":"Разность тысячи четырёхсот семнадцати и пятисот шестидесяти трёх — восемьсот пятьдесят четыре — даже на четыре не делится. Ответ: нет."}],"rich":true},{"l":"б","q":"Может ли одно из записанных на доске чисел быть квадратом натурального числа, если среди записанных на доске чисел есть число 563?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Все числа как 563 → остаток **3** при делении на 4.","👉 Квадраты при делении на 4 дают только **0 или 1**.","✅ **Ответ: нет.**"],"f":["mod_sq"]}],"v":[{"b":0,"s":"Все числа дают такой же остаток при делении на четыре, как пятьсот шестьдесят три, то есть три."},{"b":0,"f":"mod_sq"},{"b":0,"s":"А квадрат при делении на четыре даёт только ноль или один. Ответ: нет."}],"rich":true},{"l":"в","q":"Известно, что среди записанных на доске чисел есть число 1 и квадрат натурального числа n, большего 1. Найдите наименьшее возможное значение n.","ak":"num","av":"13","steps":[{"w":["📌 Есть 1 → все числа дают остаток 1 при делении на 28.","👉 n² ≡ 1 (mod 4) → n нечётное;   n² ≡ 1 (mod 7) → n даёт остаток 1 или 6."],"f":[]},{"w":["🔎 n = 3, 5, 7, 9, 11 ❌,   **n = 13** ✔️ (169 = 6·28 + 1)","🔨 **Пример:** 1, 29, 57, 85, 113, 141, 169, 197, 225, 253","✅ **Ответ: 13.**"],"f":[]}],"v":[{"b":0,"s":"Раз среди чисел есть единица, все числа дают остаток один при делении на двадцать восемь. Значит, эн в квадрате даёт остаток один и при делении на четыре, и при делении на семь. Отсюда эн нечётное и при делении на семь даёт остаток один или шесть."},{"b":1,"s":"Проверяем нечётные числа по порядку: три, пять, семь, девять, одиннадцать не подходят, а тринадцать подходит. Пример — десять чисел с остатком один, среди них сто шестьдесят девять. Ответ: тринадцать."}],"rich":true}],"tags":["div"],"facts":["mod_shift","mod_sq","mod_def","est_ex"],"note":"","n":79},{"id":"1312","d":3,"from":"PDF №054","stem":"На доске написано 10 различных натуральных чисел. Среднее арифметическое шести наименьших из них равно 5, а среднее арифметическое шести наибольших равно 15.","parts":[{"l":"а","q":"Может ли наименьшее из этих десяти чисел равняться 3?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Шесть наименьших в сумме **30**.","👉 Если наименьшее 3:","=3 + 4 + 5 + 6 + 7 + 8 = 33 > 30","✅ **Ответ: нет.**"],"f":["distinct_min"]}],"v":[{"b":0,"s":"Шесть наименьших чисел дают в сумме тридцать. Если самое маленькое три, то даже самые маленькие варианты остальных дают тридцать три — больше тридцати. Ответ: нет."},{"b":0,"f":"distinct_min"}],"rich":true},{"l":"б","q":"Может ли среднее арифметическое всех десяти чисел равняться 11?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Шестёрки «наименьших» и «наибольших» пересекаются по a₅ и a₆:","=сумма всех = 30 + 90 − (a₅ + a₆)","👉 Среднее 11 → a₅ + a₆ = 10."],"f":["mean"]},{"w":["📌 Но a₁ + … + a₄ = 30 − a₅ − a₆ = 20, а четыре разных числа меньше a₅ дают не больше 4a₅ − 10:","=a₅ ≥ 8   →   a₅ + a₆ ≥ 17","❌ Противоречие.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Шесть наименьших и шесть наибольших чисел пересекаются: пятое и шестое числа входят в обе группы. Поэтому сумма всех десяти — тридцать плюс девяносто минус сумма пятого и шестого."},{"b":0,"f":"mean"},{"b":0,"s":"Если среднее одиннадцать, то сумма всех сто десять, и пятое с шестым дают десять."},{"b":1,"s":"Но тогда первые четыре числа дают двадцать, а они все меньше пятого и разные — значит, пятое число довольно большое, хотя бы восемь. Тогда пятое и шестое вместе хотя бы семнадцать. Противоречие. Ответ: нет."}],"rich":true},{"l":"в","q":"Найдите наибольшее значение среднего арифметического всех десяти чисел.","ak":"num","av":"10,5","steps":[{"w":["📌 Сумма всех = 120 − s, где s = a₅ + a₆. Нужно **s как можно меньше**.","🔎 s = 14 → a₅ ≤ 6, а a₁ + … + a₄ = 16 > 4·6 − 10 ❌","👉 Значит, **s ≥ 15** → сумма ≤ 105 → среднее ≤ 10,5."],"f":[]},{"w":["🔨 **Пример:** 2, 3, 4, 6, 7, 8, 9, 10, 11, 45","=среднее 105 : 10 = 10,5 ✔️","✅ **Ответ: 10,5.**"],"f":[]}],"v":[{"b":0,"s":"Сумма всех чисел — сто двадцать минус пятое и шестое. Чтобы среднее было наибольшим, пятое и шестое должны быть как можно меньше."},{"b":0,"s":"Но пятое и шестое не могут быть слишком маленькими: первые четыре числа меньше них и в сумме дают тридцать минус эту сумму. Проверка показывает, что четырнадцать уже не подходит, а пятнадцать — минимум. Тогда сумма всех не больше ста пяти."},{"b":1,"s":"Пример выписан в решении — среднее ровно десять с половиной. Ответ: десять целых пять десятых."}],"rich":true},{"l":"г","q":"На доске написано 11 различных натуральных чисел. Среднее арифметическое шести наименьших из них равно 5, а среднее арифметическое шести наибольших из них равно 15. Пусть B — шестое по величине число, а S — среднее арифметическое всех одиннадцати чисел. Найдите наибольшее значение выражения S− B.","ak":"num","av":"24/11","steps":[{"w":["📌 Теперь 11 чисел: шестое B входит в обе шестёрки.","=сумма = 120 − B,   S − B = (120 − 12B) : 11","👉 Чем меньше B, тем больше S − B."],"f":[]},{"w":["📏 a₁ + … + a₅ = 30 − B ≤ 5B − 15 → **B ≥ 8**."],"f":[]},{"w":["🔨 **B = 8:** 1, 3, 5, 6, 7, 8, 9, 10, 11, 12, 40","=S − B = (120 − 96) : 11 = 24/11","✅ **Ответ: 24/11.**"],"f":[]}],"v":[{"b":0,"s":"Теперь чисел одиннадцать, и общим для двух шестёрок является только шестое число Бэ. Сумма всех — сто двадцать минус Бэ. Выразим эс минус Бэ — формула в решении. Чем меньше Бэ, тем больше значение."},{"b":1,"s":"Но Бэ не может быть маленьким: пять чисел меньше него в сумме дают тридцать минус Бэ, и они разные. Отсюда Бэ не меньше восьми."},{"b":2,"s":"При Бэ равном восьми пример выписан в решении. Получаем двадцать четыре одиннадцатых. Ответ: двадцать четыре одиннадцатых."}],"rich":true}],"tags":["avg"],"facts":["mean","distinct_min","est_ex"],"note":"","n":80},{"id":"159994","d":3,"from":"PDF №056","stem":"В школах №1 и №2 учащиеся писали тест. Из каждой школы тест писали по крайней мере 2 учащихся. Каждый учащийся, писавший тест, набрал натуральное количество баллов. Оказалось, что в каждой школе средний балл за тест был целым числом, причем в школе №2 средний балл равнялся 42. Один из учащихся, писавших тест, перешёл из школы №1 в школу №2, а средние баллы за тест были пересчитаны в обеих школах. В результате средний балл в школе №1 уменьшился на 10%, средний балл в школе №2 также уменьшился на 10%.","parts":[{"l":"а","q":"Сколько учащихся могло писать тест в школе №2 изначально?","ak":"num","av":"4","steps":[{"w":["✏️ В школе №2 было **n₂** учеников (среднее 42), пришёл ученик с **x** баллами. Новое среднее 37,8:","=(42n₂ + x) : (n₂ + 1) = 37,8   →   x = 37,8 − 4,2n₂"],"f":["mean_move"]},{"w":["📌 x > 0 → n₂ ≤ 8;   x целое → **n₂ = 4**, x = 21.","✅ **Ответ: 4.**"],"f":[]}],"v":[{"b":0,"s":"В школу номер два пришёл новый ученик, и средний балл упал на десять процентов — с сорока двух до тридцати семи и восьми десятых. Значит, новичок набрал меньше среднего."},{"b":0,"f":"mean_move"},{"b":0,"s":"Пусть в школе было эн два учеников, а новичок набрал икс баллов. Записываем новое среднее и выражаем икс — формула в решении."},{"b":1,"s":"Икс должен быть положительным и целым. Положительность даёт эн два не больше восьми, а целость оставляет только эн два равное четырём. Тогда новичок набрал двадцать один балл. Ответ: четыре."}],"rich":true},{"l":"б","q":"Каждый учащийся школы №2, писавший тест, набрал больше баллов, чем перешедший в неё учащийся школы №1. Какое наибольшее количество баллов мог набрать учащийся школы №2?","ak":"num","av":"102","steps":[{"w":["📌 В школе №2 четыре ученика, сумма 4·42 = 168. Каждый набрал больше 21 → **≥ 22**.","=наибольший ≤ 168 − 3·22 = 102"],"f":[]},{"w":["🔨 **Пример:** 22, 22, 22, 102.","✅ **Ответ: 102.**"],"f":[]}],"v":[{"b":0,"s":"В школе номер два было четыре ученика с суммой сто шестьдесят восемь. Каждый набрал больше двадцати одного, то есть хотя бы двадцать два. Чтобы один набрал как можно больше, остальные трое должны набрать как можно меньше — по двадцать два."},{"b":1,"s":"Тогда у лучшего сто два балла. Ответ: сто два."}],"rich":true},{"l":"в","q":"Какое наибольшее количество участников могло писать тест в школе №1 изначально?","ak":"num","av":"96","steps":[{"w":["✏️ В школе №1 было **n₁** учеников со средним **m₁**. Ушёл ученик с 21 баллом, среднее стало 0,9m₁:","=m₁(n₁ + 9) = 210"],"f":[]},{"w":["📌 n₁ + 9 — делитель 210. Самый большой вариант n₁ + 9 = 210 даёт m₁ = 1 — баллов не хватает ❌","🔨 **n₁ + 9 = 105, m₁ = 2:** n₁ = 96, сумма 192 = 21 + 171","👉 Остальные 95 учеников: 76 по 2 балла и 19 по 1 баллу ✔️","✅ **Ответ: 96.**"],"f":[]}],"v":[{"b":0,"s":"Теперь школа номер один. Пусть там было эн один учеников со средним эм один. Ушёл ученик с двадцатью одним баллом, и среднее стало девять десятых от прежнего. Если записать это и упростить, получится: эм один, умноженное на эн один плюс девять, равно двумстам десяти."},{"b":1,"s":"Значит, эн один плюс девять — делитель двухсот десяти. Чтобы учеников было как можно больше, берём этот делитель побольше. Двести десять не подходит: среднее было бы один, а один ученик уже набрал двадцать один."},{"b":1,"s":"Следующий делитель — сто пять: тогда учеников девяносто шесть, а среднее два. Пример: ушедший ученик с двадцатью одним баллом, семьдесят шесть учеников по два балла и девятнадцать по одному. Ответ: девяносто шесть."}],"rich":true}],"tags":["avg"],"facts":["mean_move","percent","lin_dioph","est_ex"],"note":"","n":81},{"id":"125982","d":3,"from":"PDF №057","stem":"На доске записано 10 натуральных чисел, среди которых нет одинаковых. Оказалось, что среднее арифметическое любых трех, четырех, пяти или шести чисел из записанных является целым числом. Одно из записанных чисел равно 30 035.","parts":[{"l":"а","q":"Может ли среди записанных на доске чисел быть число 325?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Метод сдвига: все числа одинаковы по mod 3, 4, 5, 6 → по **mod 60**.","=30035 → остаток 35,     325 → остаток 25","❌ Остатки разные.","✅ **Ответ: нет.**"],"f":["mod_shift"]}],"v":[{"b":0,"s":"Как и в похожих задачах, из того, что сумма любых трёх чисел делится на три, следует, что все числа дают одинаковый остаток при делении на три. Так же для четырёх, пяти и шести. Значит, все числа одинаковы по модулю шестьдесят."},{"b":0,"f":"mod_shift"},{"b":0,"s":"Тридцать тысяч тридцать пять при делении на шестьдесят даёт остаток тридцать пять, а триста двадцать пять — остаток двадцать пять. Остатки разные. Ответ: нет."}],"rich":true},{"l":"б","q":"Может ли отношение двух записанных на доске чисел равняться 7?","ak":"yn","av":"НЕТ","steps":[{"w":["✏️ Пусть x = 7y, и x, y дают одинаковый остаток при делении на 60:","=7y − y = 6y делится на 60   →   y делится на 10","❌ Но все числа дают остаток 35 — **нечётные**.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Пусть одно число в семь раз больше другого. Они дают одинаковый остаток при делении на шестьдесят, поэтому их разность, шесть игрек, делится на шестьдесят. Значит, игрек делится на десять, то есть чётное."},{"b":0,"s":"Но все наши числа дают остаток тридцать пять при делении на шестьдесят, значит, они нечётные. Противоречие. Ответ: нет."}],"rich":true},{"l":"в","q":"Отношение двух записанных на доске чисел является целым числом n. Найдите наименьшее возможное значение n.","ak":"num","av":"13","steps":[{"w":["📌 x = n·y → (n − 1)y делится на 60.","📌 y даёт остаток 35 → y нечётное и не делится на 3.","👉 Значит, **n − 1 делится на 12** → n ≥ 13."],"f":[]},{"w":["🔨 **Пример:** 35 и 455 = 13·35 (оба дают остаток 35), плюс 30035 и ещё 7 таких чисел.","✅ **Ответ: 13.**"],"f":[]}],"v":[{"b":0,"s":"Пусть одно число в эн раз больше другого. Тогда разность, то есть эн минус один, умноженное на игрек, делится на шестьдесят."},{"b":0,"s":"Число игрек нечётное и на три не делится, поэтому множители два, два и три должны прийти из скобки эн минус один. Значит, эн минус один делится на двенадцать, и эн не меньше тринадцати."},{"b":1,"s":"Пример: тридцать пять и четыреста пятьдесят пять — второе в тринадцать раз больше, и оба дают остаток тридцать пять. Добавляем остальные числа с тем же остатком. Ответ: тринадцать."}],"rich":true}],"tags":["div"],"facts":["mod_shift","div_comp","mod_def","est_ex"],"note":"","n":82},{"id":"130185","d":3,"from":"PDF №058","stem":"На доске написано 20 натуральных необязательно различных чисел, каждое из которых не превосходит 50. Одно или несколько из чисел на доске увеличили на 1. Числа, которые после этого оказались равны 51, с доски стёрли.","parts":[{"l":"а","q":"Могло ли среднее арифметическое всех чисел на доске уменьшиться?","ak":"yn","av":"ДА","steps":[{"w":["🔨 **Пример:** число 50 и 19 единиц.","=среднее было (50 + 19) : 20 = 3,45","👉 Увеличили 50 → 51, стёрли. Осталось 19 единиц — среднее **1**.","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Среднее может уменьшиться, если с доски сотрут большое число. Возьмём одно число пятьдесят и девятнадцать единиц. Увеличим пятьдесят до пятидесяти одного — его сотрут. Остаются одни единицы, среднее один, а было больше трёх. Ответ: да."}],"rich":true},{"l":"б","q":"Могло ли быть так, что сначала среднее арифметическое было равно 24, а потом стало равно 17?","ak":"yn","av":"НЕТ","steps":[{"w":["✏️ Сумма была 24·20 = 480. Стёрли **k** чисел (это были 50), остальные увеличили в сумме на **t ≤ 20 − k**:","=(480 − 50k + t) : (20 − k) = 17   →   t = 33k − 140"],"f":["mean"]},{"w":["📌 t ≥ 0 → k ≥ 5;   t ≤ 20 − k → k ≤ 4.","❌ Противоречие.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Сначала сумма четыреста восемьдесят. Пусть стёрли ка чисел — до увеличения они были по пятьдесят. Остальные числа увеличились в сумме на тэ, и тэ не больше количества оставшихся чисел."},{"b":0,"f":"mean"},{"b":0,"s":"Записываем новое среднее и приравниваем к семнадцати. Выражаем тэ — формула в решении."},{"b":1,"s":"Тэ не может быть отрицательным, отсюда ка хотя бы пять. А тэ не больше двадцати минус ка, отсюда ка не больше четырёх. Противоречие. Ответ: нет."}],"rich":true},{"l":"в","q":"Чему может быть равно наименьшее среднее арифметическое чисел, оставшихся на доске, если изначально оно было равно 24?","ak":"num","av":"30/11","steps":[{"w":["📌 Новое среднее не меньше, чем без прибавок t:","=(480 − 50k) : (20 − k) = 50 − 520 : (20 − k) — **уменьшается** с ростом k","📌 Оставшиеся числа хотя бы 1: 480 − 50k ≥ 20 − k → **k ≤ 9**.","=k = 9:   30/11"],"f":[]},{"w":["🔨 **Пример:** девять чисел 50, десять единиц и одно 20 (сумма 480).","👉 Увеличиваем все пятидесятки — их стирают:  (10 + 20) : 11 = 30/11","✅ **Ответ: 30/11.**"],"f":[]}],"v":[{"b":0,"s":"Ищем наименьшее новое среднее. Выгодно, чтобы стёрли как можно больше пятидесяток, а остальные числа почти не увеличивали. Если записать среднее без прибавок, видно, что оно уменьшается, когда ка растёт."},{"b":0,"s":"Но ка не может быть слишком большим: оставшиеся числа хотя бы по единице, и их сумма должна быть не меньше их количества. Отсюда ка не больше девяти. При ка равном девяти получается тридцать одиннадцатых."},{"b":1,"s":"Пример: девять пятидесяток, десять единиц и число двадцать. Увеличиваем только пятидесятки — их стирают. Остаётся одиннадцать чисел с суммой тридцать. Ответ: тридцать одиннадцатых."}],"rich":true}],"tags":["avg"],"facts":["mean","est_ex"],"note":"","n":83},{"id":"130188","d":3,"from":"PDF №059","stem":"На доске написано 30 натуральных необязательно различных чисел, каждое из которых больше 16, но не превосходит 56. Среднее арифметическое написанных чисел равно 23. Вместо каждого из чисел на доске написали число, в два раза меньшее первоначального. Числа, которые после этого оказались меньше 9, с доски стёрли.","parts":[{"l":"а","q":"Могло ли оказаться так, что среднее арифметическое чисел, оставшихся на доске, больше 21?","ak":"yn","av":"ДА","steps":[{"w":["📌 После деления пополам стираются только числа **17** (17 : 2 = 8,5 \u003c 9). Пусть их **k**.","=среднее оставшихся = (690 − 17k) : (2·(30 − k))","👉 Больше 21 при **k ≥ 23**."],"f":["mean"]},{"w":["🔨 **Пример:** 23 числа 17, шесть чисел 43 и одно 41:","=после деления:  (6·43 + 41) : 2 : 7 = 299/14 ≈ 21,36 ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Числа больше шестнадцати, поэтому после деления пополам меньше девяти становится только число семнадцать — оно превращается в восемь с половиной и стирается. Пусть семнадцатых было ка штук."},{"b":0,"f":"mean"},{"b":0,"s":"Сумма всех чисел шестьсот девяносто. Сумма оставшихся — шестьсот девяносто минус семнадцать ка, а после деления пополам ещё вдвое меньше. Делим на количество — формула в решении. Неравенство показывает: среднее больше двадцати одного, если ка хотя бы двадцать три."},{"b":1,"s":"Пример: двадцать три числа семнадцать, а остальные семь подбираем так, чтобы общее среднее было двадцать три. Новое среднее около двадцати одной целой и трёх десятых. Ответ: да."}],"rich":true},{"l":"б","q":"Могло ли среднее арифметическое оставшихся на доске чисел оказаться больше 20, но меньше 21?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Среднее оставшихся зависит только от k и **растёт** с ростом k:","=k = 22:  19,75","=k = 23:  ≈ 21,36","❌ Значений между 20 и 21 нет.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Новое среднее зависит только от того, сколько было семнадцатых, и растёт вместе с ка. При двадцати двух оно девятнадцать целых семьдесят пять сотых, а при двадцати трёх — уже больше двадцати одного. Между двадцатью и двадцатью одним оно попасть не может. Ответ: нет."}],"rich":true},{"l":"в","q":"Найдите наибольшее возможное значение среднего арифметического чисел, которые остались на доске.","ak":"num","av":"26,5","steps":[{"w":["📏 Оставшиеся числа не больше 56:","=690 − 17k ≤ 56·(30 − k)   →   k ≤ 25"],"f":[]},{"w":["🔨 **k = 25:** 25 чисел 17 и пять чисел 53.","=после деления:  53 : 2 = 26,5 — среднее **26,5**","✅ **Ответ: 26,5.**"],"f":[]}],"v":[{"b":0,"s":"Чем больше семнадцатых, тем больше новое среднее. Но оставшиеся числа не больше пятидесяти шести, и их сумма шестьсот девяносто минус семнадцать ка должна поместиться. Отсюда ка не больше двадцати пяти."},{"b":1,"s":"При двадцати пяти семнадцатых остальные пять чисел по пятьдесят три. После деления каждое двадцать шесть с половиной. Ответ: двадцать шесть целых пять десятых."}],"rich":true}],"tags":["avg"],"facts":["mean","frac_monot","est_ex"],"note":"","n":84},{"id":"127782","d":3,"from":"PDF №063","stem":"Для любых трёх натуральных чисел a, b и c (необязательно различных) вычисляют четвёртое число d по формуле: d = a² + b² + c² − ab − bc − ac.","parts":[{"l":"а","q":"Существуют ли a, b и c, для которых d = 19?","ak":"yn","av":"ДА","steps":[{"w":["💡 **Идея:** перепишем d через разности:","=d = x² + xy + y²,   x = a − b,   y = b − c","🔨 x = 3, y = 2:  9 + 6 + 4 = 19","=a = 6,   b = 3,   c = 1","✅ **Ответ: да.**"],"f":["squares_sum"]}],"v":[{"b":0,"f":"squares_sum"},{"b":0,"s":"Обозначим икс — разность а и бэ, игрек — разность бэ и цэ. Тогда дэ равно икс в квадрате плюс икс игрек плюс игрек в квадрате."},{"b":0,"s":"Подбираем: икс три и игрек два дают девять плюс шесть плюс четыре — девятнадцать. Например, а шесть, бэ три, цэ один. Ответ: да."}],"rich":true},{"l":"б","q":"Существуют ли a, b и c, для которых d = 58?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Если x или y нечётное, то x² + xy + y² **нечётное**.","👉 58 чётное → x и y чётные → d **делится на 4**.","❌ 58 на 4 не делится.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Посмотрим на чётность. Если хотя бы одно из чисел икс, игрек нечётное, то сумма икс в квадрате плюс икс игрек плюс игрек в квадрате нечётная — проверьте все случаи."},{"b":0,"s":"Значит, при чётном дэ оба числа чётные, и тогда каждое слагаемое делится на четыре. А пятьдесят восемь на четыре не делится. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое наибольшее значение может принимать d, если a, b и c — двузначные числа и d делится на 4?","ak":"num","av":"7744","steps":[{"w":["📌 d кратно 4 → x, y чётные → a, b, c **одной чётности** → наибольшая разность D ≤ 98 − 10 = 88.","=d = ½(D² + p² + q²),   p + q = D   →   d ≤ D² ≤ 7744"],"f":[]},{"w":["🔨 **Пример:** 98, 10, 10 → d = 88² = 7744","✅ **Ответ: 7744.**"],"f":[]}],"v":[{"b":0,"s":"Если дэ делится на четыре, то, как мы выяснили, все разности чётные, то есть а, бэ, цэ одной чётности. Двузначные числа одной чётности отличаются не больше чем на восемьдесят восемь — от десяти до девяноста восьми."},{"b":0,"s":"Дэ — это половина суммы квадратов трёх попарных разностей. Наибольшая разность дэ большое, а две другие в сумме дают её. Тогда дэ не больше квадрата наибольшей разности, то есть семи тысяч семисот сорока четырёх."},{"b":1,"s":"Пример: девяносто восемь, десять и десять. Ответ: семь тысяч семьсот сорок четыре."}],"rich":true}],"tags":["eq"],"facts":["squares_sum","parity","est_ex"],"note":"","n":85},{"id":"30820","d":3,"from":"PDF №066","stem":"По кругу расставлено N различных натуральных чисел, каждое из которых меньше 365. Сумма любых четырёх идущих подряд чисел делится на 4, а сумма любых трёх идущих подряд чисел нечётна.","parts":[{"l":"а","q":"Может ли N быть равным 200?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Тройки нечётны → чётность повторяется через 3 места.","📌 Четвёрки кратны 4 → остатки по mod 4 (и чётность) повторяются через 4 места.","👉 Значит, чётность у **всех одинаковая** → все числа **нечётные**."],"f":["mod_shift"]},{"w":["📌 Нечётных чисел меньше 365 — **182** \u003c 200.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Сравним две соседние тройки: они отличаются одним числом в начале и одним в конце. Обе суммы нечётные, значит, эти два числа одной чётности — чётность повторяется через три места."},{"b":0,"f":"mod_shift"},{"b":0,"s":"Так же из четвёрок: числа через четыре места дают одинаковый остаток при делении на четыре, а значит, и одинаковую чётность. Если чётность повторяется и через три, и через четыре места, то она повторяется через одно место — все числа одной чётности. Сумма трёх нечётна, поэтому все нечётные."},{"b":1,"s":"Но нечётных чисел меньше трёхсот шестидесяти пяти всего сто восемьдесят два. Двести не поместится. Ответ: нет."}],"rich":true},{"l":"б","q":"Может ли N быть равным 109?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Остатки по mod 4 повторяются через 4 места и через N мест.","👉 N нечётное → все числа дают **одинаковый остаток** при делении на 4.","📌 Таких нечётных чисел меньше 365 — **91** \u003c 109.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Остатки при делении на четыре повторяются через четыре места. На круге из эн чисел они повторяются и через эн мест. Если эн нечётное, отсюда следует, что все остатки одинаковые."},{"b":0,"s":"Нечётных чисел меньше трёхсот шестидесяти пяти с одним и тем же остатком при делении на четыре — всего девяносто одно. Сто девять не помещается. Ответ: нет."}],"rich":true},{"l":"в","q":"Найдите наибольшее значение N.","ak":"num","av":"182","steps":[{"w":["📏 **Оценка:** все нечётные → N ≤ 182."],"f":[]},{"w":["🔨 **Пример:** чередуем числа с остатком 1 (1, 5, …, 361) и с остатком 3 (3, 7, …, 363).","👉 Четвёрка: 1 + 3 + 1 + 3 — делится на 4;  тройка — нечётная ✔️","✅ **Ответ: 182.**"],"f":[]}],"v":[{"b":0,"s":"Оценка: все числа нечётные, значит, их не больше ста восьмидесяти двух."},{"b":1,"s":"Пример: ставим по кругу через одно числа с остатком один и с остатком три при делении на четыре. Любые четыре подряд дают в сумме остаток восемь, то есть делятся на четыре, а любые три подряд — сумма нечётных, нечётная. Ответ: сто восемьдесят два."}],"rich":true}],"tags":["div","est"],"facts":["mod_shift","parity","est_ex"],"note":"","n":86},{"id":"776","d":3,"from":"Школково","stem":"Последовательность a1, a2, …, an, где n ≥ 3, состоит из натуральных чисел. При этом каждый член последовательности, кроме первого и последнего, больше среднего арифметического соседних с ним членов.","parts":[{"l":"а","q":"Приведите пример такой последовательности, состоящей из пяти членов, сумма которых равна 60.","ak":"self","av":"Например, 10, 13, 14, 13, 10.","steps":[{"w":["💡 **Идея:** условие значит, что **шаги (разности соседей) строго уменьшаются**.","🔨 **Пример:** 10, 13, 14, 13, 10","=шаги: +3, +1, −1, −3;   сумма 60 ✔️"],"f":[]}],"v":[{"b":0,"s":"Переведём условие. Член больше среднего соседей — значит, шаг до него больше, чем шаг после него. То есть разности соседних членов строго уменьшаются: последовательность сначала растёт всё медленнее, потом убывает всё быстрее — как горка."},{"b":0,"s":"Пример: десять, тринадцать, четырнадцать, тринадцать, десять. Шаги плюс три, плюс один, минус один, минус три — уменьшаются. Сумма шестьдесят."}],"rich":true},{"l":"б","q":"Может ли такая последовательность состоять из пяти членов и содержать два одинаковых числа?","ak":"yn","av":"ДА","steps":[{"w":["📌 В примере из пункта а есть **одинаковые** числа: 10 и 10, 13 и 13.","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Посмотрите на пример из пункта а: там дважды встречается десять и дважды тринадцать. Ответ: да."}],"rich":true},{"l":"в","q":"Какое наименьшее значение может принимать сумма членов такой последовательности при n= 8?","ak":"num","av":"36","steps":[{"w":["✏️ Шаги d₁ > d₂ > … > d₇ — целые. Пусть средний шаг d₄ = t ≥ 0 (иначе развернём последовательность).","📌 Тогда шаги слева ≥ t + 3, t + 2, t + 1, справа ≤ t − 1, t − 2, t − 3."],"f":[]},{"w":["📏 Первые четыре члена ≥ 18 + 6t, последние четыре ≥ 18 − 6t:","=сумма ≥ 36"],"f":[]},{"w":["🔨 **Пример:** 1, 4, 6, 7, 7, 6, 4, 1 — сумма 36 ✔️","✅ **Ответ: 36.**"],"f":[]}],"v":[{"b":0,"s":"Ищем наименьшую сумму восьми членов. Шаги между соседями — семь разных целых чисел, они строго убывают. Посмотрим на средний, четвёртый шаг и назовём его тэ."},{"b":0,"s":"Шаги до него больше хотя бы на один, два и три, а шаги после — меньше на один, два и три. Крайние члены не меньше единицы."},{"b":1,"s":"Если сложить первые четыре члена, выразив их через первый член и шаги, получится не меньше восемнадцати плюс шесть тэ. А последние четыре — не меньше восемнадцати минус шесть тэ. Вместе — не меньше тридцати шести."},{"b":2,"s":"Пример: один, четыре, шесть, семь, семь, шесть, четыре, один — сумма ровно тридцать шесть. Ответ: тридцать шесть."}],"rich":true}],"tags":["seq"],"facts":["ap","est_ex"],"note":"","n":87},{"id":"2298","d":3,"from":"Школково","stem":"Пусть n — натуральное трёхзначное число, в десятичной записи которого нет нулей.","parts":[{"l":"а","q":"Приведите пример такого n, что его отношение к произведению его цифр равно 109/18.","ak":"self","av":"436: 436/(4·3·6) = 436/72 = 109/18.","steps":[{"w":["💡 109 — простое, а произведение цифр на него не делится → **n кратно 109**.","🔎 Пробуем: 218, 327, 436, …","=436 : (4·3·6) = 436 : 72 = 109/18 ✔️","✅ **Пример:** 436."],"f":[]}],"v":[{"b":0,"s":"Сто девять — простое число, а произведение цифр на него точно не делится. Значит, само число делится на сто девять. Будем перебирать кратные: двести восемнадцать, триста двадцать семь, четыреста тридцать шесть."},{"b":0,"s":"У четырёхсот тридцати шести произведение цифр семьдесят два, и отношение как раз сто девять восемнадцатых. Пример найден."}],"rich":true},{"l":"б","q":"Может ли отношение n к произведению его цифр быть равно 113/18?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 113 — простое → n кратно 113: 113, 226, 339, 452, 565, 678, 791.","🔎 Отношения n к произведению цифр:","=113/3,  113/12,  113/27,  113/20,  113/30,  113/56,  113/9","❌ Знаменателя 18 нет.","✅ **Ответ: нет.**"],"f":["mod_cases"]}],"v":[{"b":0,"s":"Рассуждаем так же: сто тринадцать простое, поэтому число кратно ста тринадцати. Трёхзначных кратных без нулей всего семь."},{"b":0,"s":"Для каждого считаем отношение к произведению цифр. Нигде в знаменателе не получается восемнадцать. Ответ: нет."},{"b":0,"f":"mod_cases"}],"rich":true},{"l":"в","q":"Какое наибольшее значение может принимать отношение n к произведению его цифр, если это отношение равно несократимой дроби со знаменателем 18?","ak":"num","av":"631/18","steps":[{"w":["📌 Знаменатель 18 → произведение цифр P кратно 18.","📏 Если P ≥ 36, отношение ≤ 999 : 36 \u003c 28. Выгоднее **P = 18**."],"f":[]},{"w":["🔎 P = 18: цифры {1, 2, 9}, {1, 3, 6}, {2, 3, 3}.","👉 Дробь несократима → n нечётное и не кратно 3: подходят 631, 613, 361, 163, 323, 233.","=наибольшее:  631/18","✅ **Ответ: 631/18.**"],"f":[]}],"v":[{"b":0,"s":"Чтобы в несократимой дроби был знаменатель восемнадцать, произведение цифр должно делиться на восемнадцать. Чем меньше произведение, тем больше отношение. Если произведение тридцать шесть или больше, отношение меньше двадцати восьми — это мало."},{"b":1,"s":"Значит, произведение цифр ровно восемнадцать. Такие наборы цифр: один, два, девять; один, три, шесть; два, три, три."},{"b":1,"s":"Чтобы дробь не сокращалась, число должно быть нечётным и не делиться на три. Из подходящих чисел самое большое — шестьсот тридцать один. Ответ: шестьсот тридцать одна восемнадцатая."}],"rich":true}],"tags":["digits"],"facts":["fta","frac_monot","est_ex"],"note":"","n":88},{"id":"2441","d":3,"from":"Школково","stem":"С натуральным числом проводят операцию: между каждыми двумя соседними цифрами записывают их сумму (например, из 194 получается 1109134).","parts":[{"l":"в","q":"Какое наибольшее число, кратное 9, может получиться из трехзначного числа, в десятичной записи которого нет девяток?","ak":"num","av":"8168157","steps":[{"w":["📌 Из abc получаем a (a + b) b (b + c) c. Остаток при делении на 9 — как у суммы цифр:","=a + (a + b) + b + (b + c) + c = 2a + 3b + 2c"],"f":["ds_mod9"]},{"w":["💡 Делаем число как можно больше: **a = 8** (девяток нет), потом **b = 8** (a + b = 16).","=16 + 24 + 2c делится на 9   →   c = 7"],"f":[]},{"w":["=887 → 8168157","✅ **Ответ: 8 168 157.**"],"f":[]}],"v":[{"b":0,"s":"Число делится на девять, если сумма его цифр делится на девять, а для записи суммы можно брать сами суммы соседних цифр — остаток от этого не меняется. Получается, что остаток результата такой же, как у два а плюс три бэ плюс два цэ."},{"b":0,"f":"ds_mod9"},{"b":1,"s":"Чтобы число было наибольшим, первая цифра должна быть самой большой. Девяток нет, поэтому а равно восьми. Дальше идёт сумма а плюс бэ — её тоже делаем максимальной, бэ равно восьми."},{"b":1,"s":"Остаётся подобрать цэ так, чтобы всё делилось на девять. Подходит цэ равное семи."},{"b":2,"s":"Число восемьсот восемьдесят семь превращается в восемь миллионов сто шестьдесят восемь тысяч сто пятьдесят семь. Ответ: это число."}],"rich":true}],"tags":["digits","div"],"facts":["ds_mod9","dec_repr","est_ex"],"note":"","n":89},{"id":"2448","d":3,"from":"Школково","stem":"Каждый из 28 студентов написал или одну из двух контрольных работ, или обе контрольные работы. За каждую работу можно было получить целое число баллов от 0 до 20 включительно. По каждой из двух работ в отдельности средний балл составил 15. Затем каждый студент назвал наивысший из своих баллов. При этом если студент писал одну работу, то он назвал балл за нее. Среднее арифметическое названных баллов равно S.","parts":[{"l":"а","q":"Приведите пример, когда S \u003c 15.","ak":"self","av":"Например: 2 студента писали обе работы на 20 и 20, по 13 студентов — только одну, их суммы баллов по 185. Тогда S = 410/28 \u003c 15.","steps":[{"w":["💡 **Идея:** если студент писал обе работы, его **меньший** балл никто не назовёт → среднее названных падает.","🔨 **Пример:**","👉 2 студента писали обе работы на 20 и 20","👉 13 студентов — только первую, 13 — только вторую; у каждой группы сумма 15·15 − 40 = 185"],"f":[]},{"w":["=названо 40 + 185 + 185 = 410,     S = 410 : 28 ≈ 14,6 \u003c 15 ✔️"],"f":[]}],"v":[{"b":0,"s":"Если студент писал обе работы, он называет только больший балл, а меньший пропадает. Поэтому среднее названных баллов может оказаться ниже пятнадцати."},{"b":0,"s":"Пусть двое студентов написали обе работы на двадцать. Остальные писали только одну работу: тринадцать — первую и тринадцать — вторую. Подберём их баллы так, чтобы по каждой работе среднее было пятнадцать — сумма каждой группы сто восемьдесят пять."},{"b":1,"s":"Тогда названо четыреста десять баллов на двадцать восемь студентов — меньше пятнадцати в среднем. Пример готов."}],"rich":true},{"l":"б","q":"Могло ли значение S быть равным 5?","ak":"yn","av":"НЕТ","steps":[{"w":["✏️ **z** — писали обе работы. Всего работ 28 + z, все баллы:","=15·(28 + z)","📌 Не названы меньшие баллы этих z студентов — каждый ≤ 20:","=названо ≥ 420 + 15z − 20z = 420 − 5z ≥ 280"],"f":["mean"]},{"w":["=S ≥ 280 : 28 = 10 > 5","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Пусть зет студентов писали обе работы. Тогда всего написано двадцать восемь плюс зет работ, и сумма всех баллов — пятнадцать раз столько."},{"b":0,"f":"mean"},{"b":0,"s":"Пропадают только меньшие баллы этих зет студентов, а каждый из них не больше двадцати. Значит, названная сумма не меньше четырёхсот двадцати минус пять зет. А зет не больше двадцати восьми, поэтому не меньше двухсот восьмидесяти."},{"b":1,"s":"Тогда среднее хотя бы десять, а не пять. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое наименьшее значение могло принимать S, если обе контрольные писали только 10 студентов?","ak":"num","av":"185/14","steps":[{"w":["📏 **Оценка, z = 10:**","=названо ≥ 420 − 50 = 370   →   S ≥ 370 : 28 = 185/14"],"f":[]},{"w":["🔨 **Пример:** 10 студентов писали обе на 20 и 20; по 9 студентов — только одну работу, сумма каждой группы 85.","✅ **Ответ: 185/14.**"],"f":[]}],"v":[{"b":0,"s":"Теперь обе работы писали десять студентов. По той же оценке названная сумма не меньше трёхсот семидесяти, а среднее — не меньше ста восьмидесяти пяти четырнадцатых."},{"b":1,"s":"Чтобы оценка достигалась, пропавшие меньшие баллы должны быть по двадцать: десять студентов пишут обе работы на двадцать. Остальные по девять пишут одну работу так, чтобы средние были пятнадцать. Ответ: сто восемьдесят пять четырнадцатых."}],"rich":true}],"tags":["avg"],"facts":["mean","est_ex"],"note":"","n":90},{"id":"15851","d":3,"from":"Школково","stem":"В наборе 100 гирек весом 1, 2, …, 100 граммов. Их разложили на две кучки так, что в каждой кучке есть хотя бы одна гирька. Потом из второй кучки переложили одну гирьку в первую кучку. В результате средняя масса гирек в первой кучке увеличилась ровно на один грамм.","parts":[{"l":"а","q":"Могла ли первая кучка (до перекладывания) состоять из гирек с весами 1 г, 5 г, 9 г?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 В первой кучке среднее 5. После добавления гирьки x среднее должно стать 6:","=(15 + x) : 4 = 6   →   x = 9","❌ Но гирька 9 г уже в первой кучке.","✅ **Ответ: нет.**"],"f":["mean_move"]}],"v":[{"b":0,"s":"В первой кучке гирьки один, пять и девять — среднее пять. После перекладывания одной гирьки среднее должно стать шесть. Значит, четыре гирьки весят двадцать четыре грамма, и добавленная весит девять."},{"b":0,"f":"mean_move"},{"b":0,"s":"Но гирька в девять граммов уже лежит в первой кучке, во второй её нет. Ответ: нет."}],"rich":true},{"l":"б","q":"Мог ли средний вес гирек в первой кучке до перекладывания равняться 7,5 грамма?","ak":"yn","av":"НЕТ","steps":[{"w":["✏️ В первой кучке n гирек, среднее 7,5; добавили гирьку x:","=(7,5n + x) : (n + 1) = 8,5   →   x = n + 8,5","❌ x не целое.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Пусть в первой кучке эн гирек со средним семь с половиной, а переложили гирьку икс. Новое среднее восемь с половиной. Выражаем икс и получаем эн плюс восемь с половиной — дробное число. А гирьки целые. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое максимальное количество гирек могло быть первоначально в первой кучке?","ak":"num","av":"65","steps":[{"w":["✏️ n гирек, среднее m. Добавленная гирька:","=x = m + n + 1 ≤ 100","📌 Среднее n разных гирек **m ≥ (n + 1) : 2**:","=3(n + 1) : 2 ≤ 100   →   n ≤ 65"],"f":[]},{"w":["🔨 **Пример:** гирьки 1…65 (среднее 33), перекладываем 99:","=(2145 + 99) : 66 = 34 ✔️","✅ **Ответ: 65.**"],"f":[]}],"v":[{"b":0,"s":"Пусть в первой кучке эн гирек со средним эм. Если среднее выросло ровно на один, то добавленная гирька весит эм плюс эн плюс один — это следует из формулы нового среднего. Она не тяжелее ста граммов."},{"b":0,"s":"А среднее эн разных гирек не меньше, чем у самых лёгких: один, два и так далее, то есть не меньше эн плюс один пополам. Подставив, получаем, что эн не больше шестидесяти пяти."},{"b":1,"s":"Пример: в первой кучке гирьки от одного до шестидесяти пяти граммов, среднее тридцать три. Перекладываем гирьку девяносто девять — среднее становится тридцать четыре. Ответ: шестьдесят пять."}],"rich":true}],"tags":["avg"],"facts":["mean_move","est_ex"],"note":"","n":91},{"id":"18141","d":3,"from":"Школково","stem":"Несколько экспертов оценивают несколько кинофильмов. Каждый выставляет каждому фильму целое число баллов от 1 до 10, причём одному фильму все эксперты ставят различные оценки. Рейтинг фильма — среднее геометрическое оценок: ⁿ√(a₁·…·aₙ). Оказалось, что рейтинги всех фильмов — различные целые числа.","parts":[{"l":"а","q":"Могло ли быть 2 эксперта и 5 кинофильмов?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Рейтинг целый → произведение двух разных оценок — **точный квадрат**:","=1·4 = 2²,   1·9 = 3²,   2·8 = 4²,   4·9 = 6²","👉 Возможных рейтингов только 4, а нужно 5 разных.","✅ **Ответ: нет.**"],"f":["gmean"]}],"v":[{"b":0,"f":"gmean"},{"b":0,"s":"При двух экспертах рейтинг — корень из произведения двух разных оценок, он целый, если произведение — точный квадрат. Перебираем пары от одного до десяти: подходят один и четыре, один и девять, два и восемь, четыре и девять."},{"b":0,"s":"Рейтинги получаются два, три, четыре и шесть — всего четыре разных. А фильмов пять. Ответ: нет."}],"rich":true},{"l":"б","q":"Могло ли быть 3 эксперта и 4 кинофильма?","ak":"yn","av":"ДА","steps":[{"w":["📌 Нужно произведение трёх разных оценок — **точный куб**:","=1·2·4 = 2³,   1·3·9 = 3³,   2·4·8 = 4³,   3·8·9 = 6³","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Теперь произведение трёх разных оценок должно быть точным кубом. Подбираем: один, два, четыре — восемь; один, три, девять — двадцать семь; два, четыре, восемь — шестьдесят четыре; три, восемь, девять — двести шестнадцать. Четыре фильма с разными рейтингами. Ответ: да."}],"rich":true},{"l":"в","q":"При каком наибольшем количестве экспертов описанная ситуация возможна для одного кинофильма?","ak":"num","av":"4","steps":[{"w":["📌 Произведение n разных оценок — **n-я степень**. Смотрим на простые множители:","👉 7 встречается только в одной оценке → при n ≥ 2 её нет","👉 5 — только в 5 и 10 → при n ≥ 3 их нет","👉 3 — в 3, 6, 9 (всего в степени 4) → при n ≥ 5 их нет"],"f":[]},{"w":["📏 При n ≥ 5 остаются 1, 2, 4, 8 — только **4** оценки \u003c n ❌"],"f":[]},{"w":["🔨 **n = 4:** 3·6·8·9 = 1296 = 6⁴ ✔️","✅ **Ответ: 4.**"],"f":[]}],"v":[{"b":0,"s":"Произведение эн разных оценок должно быть эн-ной степенью. Тогда каждое простое число входит в разложение в степени, кратной эн. Семёрка есть только в оценке семь — при двух экспертах и больше её брать нельзя. Пятёрка — только в пяти и десяти, при трёх и больше их не взять. Тройка входит в три, шесть и девять — всего в четвёртой степени."},{"b":1,"s":"Значит, при пяти экспертах и больше остаются только оценки один, два, четыре и восемь — четыре числа, а экспертов больше. Не хватает разных оценок."},{"b":2,"s":"А для четырёх экспертов пример есть: три, шесть, восемь и девять, их произведение — шесть в четвёртой степени. Ответ: четыре."}],"rich":true}],"tags":["div"],"facts":["gmean","fta","est_ex"],"note":"","n":92},{"id":"18500","d":3,"from":"Школково","stem":"В каждой клетке квадратной таблицы 6× 6 стоит натуральное число, меньшее 7. Вася в каждом столбце находит наименьшее число и складывает шесть найденных чисел. Петя в каждой строке находит наименьшее число и складывает шесть найденных чисел.","parts":[{"l":"а","q":"Может ли сумма у Пети получиться в два раза больше, чем сумма у Васи?","ak":"yn","av":"ДА","steps":[{"w":["💡 **Идея:** одна строка из единиц делает **все** минимумы столбцов равными 1.","🔨 **Пример:**","👉 одна строка — единицы, четыре строки — двойки, одна — тройки","=Вася: 6·1 = 6,     Петя: 1 + 4·2 + 3 = 12 = 2·6 ✔️","✅ **Ответ: да.**"],"f":["extreme"]}],"v":[{"b":0,"s":"Если в таблице есть строка из одних единиц, то в каждом столбце минимум равен единице, и у Васи сумма шесть."},{"b":0,"f":"extreme"},{"b":0,"s":"А у Пети каждая строка даёт свой минимум. Пусть одна строка из единиц, четыре из двоек и одна из троек. У Пети двенадцать — вдвое больше. Ответ: да."}],"rich":true},{"l":"б","q":"Может ли сумма у Пети получиться в шесть раз больше, чем сумма у Васи?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 У Васи **≥ 6**, у Пети **≤ 36**.","👉 В 6 раз → Вася 6, Петя 36 → все числа 6 → у Васи
