":"Найдите наименьшее значение p, если q > 20.","ak":"num","av":"10","steps":[{"w":["🔎 **Таблица сумм и произведений:**","|p = x₁ + x₂|пары корней|произведения q|есть q > 20?","|8|1·7, 2·6, 3·5, 4·4|7, 12, 15, 16|❌","|9|1·8, 2·7, 3·6, 4·5|8, 14, 18, 20|❌ (20 не больше 20)","|!10|1·9, 2·8, **3·7**, 4·6, 5·5|9, 16, **21**, 24, 25|✅","👉 При p ≤ 9 произведение не больше 20 ⇒ **p ≥ 10**."],"f":[]},{"w":["👉 **Пример:** корни 3 и 7: p = 10, q = 21.","=x² − 10x + 21 = 0","✅ **Ответ: 10.**"],"f":["est_ex"]}],"v":[{"b":0,"s":"Продолжим таблицу из пункта бэ. При сумме восемь самое большое произведение шестнадцать, при сумме девять — двадцать. Но двадцать не больше двадцати, значит, не подходит. Пэ не меньше десяти."},{"b":1,"s":"При сумме десять подходит, например, пара три и семь: произведение двадцать один. Это и есть пример."},{"b":1,"f":"est_ex"},{"b":1,"s":"Ответ: десять."}],"rich":true}],"tags":["eq"],"facts":["vieta","est_ex"],"note":"","n":8},{"id":"159671","d":2,"from":"PDF №001","stem":"Из набора цифр 1, 2, 3, 4, 6, 7 и 8 составляют пару чисел, используя каждую цифру ровно один раз. Оказалось, что одно из этих чисел пятизначное, другое — двузначное и кратно 36.","parts":[{"l":"а","q":"Может ли сумма такой пары чисел равняться 14 908?","ak":"yn","av":"ДА","steps":[{"w":["💡 Двузначные числа, кратные 36: **36** и **72** (следующее, 108, уже трёхзначное)."],"f":[]},{"w":["🔎 **Пробуем оба:**","|двузначное|пятизначное = 14908 − двузначное|все цифры вместе","|!36|14872|1, 4, 8, 7, 2 + 3, 6 ✅","|!72|14836|1, 4, 8, 3, 6 + 7, 2 ✅","👉 Например, 14836 + 72 = 14908.","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Сначала найдём, каким может быть двузначное число. Кратных тридцати шести двузначных чисел всего два: тридцать шесть и семьдесят два."},{"b":1,"s":"Попробуем оба. Вычитаем тридцать шесть из четырнадцати тысяч девятисот восьми — получаем четырнадцать тысяч восемьсот семьдесят два. Вместе с тройкой и шестёркой — как раз все цифры набора."},{"b":1,"s":"С числом семьдесят два тоже получается: четырнадцать тысяч восемьсот тридцать шесть, и цифры как раз совпадают с набором. Ответ: да."}],"rich":true},{"l":"б","q":"Может ли сумма такой пары чисел равняться 74 134?","ak":"yn","av":"НЕТ","steps":[{"w":["🔎 Двузначное — 36 или 72. Находим пятизначное:","|двузначное|пятизначное = 74134 − двузначное|цифры из набора?","|-36|74098|❌ есть 0 и 9","|-72|74062|❌ есть 0","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Двузначное число снова тридцать шесть или семьдесят два. Вычитаем и смотрим на пятизначное."},{"b":0,"s":"В обоих случаях в пятизначном числе есть ноль, а нуля в наборе нет. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое наибольшее значение может принимать сумма чисел в этой паре?","ak":"num","av":"87457","steps":[{"w":["💡 Сумма ≈ пятизначное число ⇒ делаем пятизначное **как можно больше**: цифры по убыванию."],"f":[]},{"w":["|двузначное|оставшиеся цифры|наибольшее пятизначное|сумма","|72|1, 3, 4, 6, 8|86431|86503","|!36|1, 2, 4, 7, 8|87421|**87457**","👉 Других двузначных нет ⇒ наибольшая сумма 87457 (пример: 87421 + 36).","✅ **Ответ: 87 457.**"],"f":["est_ex"]}],"v":[{"b":0,"s":"Сумма почти целиком определяется пятизначным числом, поэтому его надо сделать как можно больше: записать оставшиеся цифры по убыванию."},{"b":1,"s":"Двузначных вариантов два, разберём оба в таблице. Если двузначное семьдесят два, то сумма восемьдесят шесть тысяч пятьсот три. Если тридцать шесть, — восемьдесят семь тысяч четыреста пятьдесят семь. Это больше."},{"b":1,"f":"est_ex"},{"b":1,"s":"Ответ: восемьдесят семь тысяч четыреста пятьдесят семь."}],"rich":true}],"tags":["digits","div"],"facts":["div_comp","div_rules","dec_repr","est_ex"],"note":"","n":9},{"id":"120330","d":2,"from":"PDF №002","stem":"В школе перед началом учебного года было сформировано несколько одиннадцатых классов, в каждом из которых количество мальчиков относилось к количеству девочек как 7 :2 или как 2 :7. После этого в параллель одиннадцатых классов школы приняли ещё четырёх мальчиков и трёх девочек.","parts":[{"l":"а","q":"Удастся ли теперь разбить всех одиннадцатиклассников на классы так, чтобы в каждом классе отношение количества мальчиков к количеству девочек было 5:4 или 4 :5?","ak":"yn","av":"НЕТ","steps":[{"w":["💡 В классе мальчиков и девочек 7k и 2k (или 2k и 7k) ⇒ в классе **9k** человек.","👉 Значит, всего было **9m** учеников."],"f":[]},{"w":["🔎 Пришли 4 + 3 = 7 человек: стало **9m + 7**.","👉 При 5:4 в каждом классе тоже 9t человек ⇒ всего было бы 9t:","=9m + 7 = 9t","=9(t − m) = 7","❌ Левая часть делится на 9, правая — нет.","✅ **Ответ: нет.**"],"f":["div_sum"]}],"v":[{"b":0,"s":"В каждом классе мальчиков и девочек поровну частей: семь частей и две. Значит, в классе девять частей, и число учеников делится на девять. Тогда и всего учеников было кратно девяти, обозначим девять эм."},{"b":1,"s":"Пришли четыре мальчика и три девочки — семь человек. Стало девять эм плюс семь."},{"b":1,"s":"Если разбить всех на классы с отношением пять к четырём, в каждом классе снова девять частей, и всего получится девять тэ. Приравняем: девять эм плюс семь равно девять тэ. Перенесём: девять, умноженное на тэ минус эм, равно семи."},{"b":1,"f":"div_sum"},{"b":1,"s":"Слева число делится на девять, а семь на девять не делится. Так не бывает. Ответ: нет."}],"rich":true},{"l":"б","q":"Всех одиннадцатиклассников удалось разбить на классы так, чтобы в каждом классе отношение количества мальчиков к количеству девочек было 7 :3 или 3:7. Могло ли при этом получиться ровно семь классов?","ak":"yn","av":"ДА","steps":[{"w":["💡 При 7:3 в каждом классе 10t человек. В 7 классах **не меньше 70** человек.","🔎 Было кратно 9, стало кратно 10 (было = стало − 7):","|стало|было|делится на 9?","|10|3|❌","|20|13|❌","|30|23|❌","|40|33|❌","|50|43|❌","|60|53|❌","|!70|63|✅","👉 Берём **70 = 7 классов по 10**, а было **63 = 7 классов по 9**."],"f":[]},{"w":["🔎 **Как перераспределить:** было 3 класса (7 м, 2 д) и 4 класса (2 м, 7 д).","|было|кто пришёл|стало","|7 м, 2 д|➜ + 1 девочка|7 м, 3 д","|7 м, 2 д|➜ + 1 девочка|7 м, 3 д","|7 м, 2 д|➜ + 1 девочка|7 м, 3 д","|2 м, 7 д|➜ + 1 мальчик|3 м, 7 д","|2 м, 7 д|➜ + 1 мальчик|3 м, 7 д","|2 м, 7 д|➜ + 1 мальчик|3 м, 7 д","|2 м, 7 д|➜ + 1 мальчик|3 м, 7 д","👉 Ушли ровно 3 девочки и 4 мальчика — как и пришло.","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"При отношении семь к трём в классе десять частей, то есть число учеников делится на десять. В семи классах хотя бы по десять человек, значит, всего не меньше семидесяти."},{"b":0,"s":"Посмотрим на таблицу. Слева — сколько стало, справа — сколько было, на семь меньше. Было кратно девяти. Из чисел до семидесяти подходит только семьдесят: тогда было шестьдесят три."},{"b":0,"s":"Значит, было семь классов по девять человек, а станет семь классов по десять."},{"b":1,"s":"Остаётся распределить новичков. Пусть было три класса, где семь мальчиков и две девочки, и четыре класса, где два мальчика и семь девочек."},{"b":1,"s":"В каждый из первых трёх классов добавим по девочке — станет семь мальчиков и три девочки. В каждый из четырёх других — по мальчику, станет три мальчика и семь девочек. Как раз три девочки и четыре мальчика. Ответ: да."}],"rich":true},{"l":"в","q":"Всех одиннадцатиклассников удалось разбить на классы так, чтобы в каждом классе отношение количества мальчиков к количеству девочек было 7 :3 или 3:7. Было решено отправить всех одиннадцатиклассников на экскурсию группами по 90 человек, при этом одна из групп оказалась неполной. Сколько в этой группе было одиннадцатиклассников?","ak":"num","av":"70","steps":[{"w":["💡 Всего N учеников: по пункту а **N = 9m + 7**, по классам 7:3 **N кратно 10**.","🔎 Кратные 10 до 90 и их остатки при делении на 9:","|N|10|20|30|40|50|60|!70|80|90","|остаток|1|2|3|4|5|6|**7**|8|0","👉 Дальше остатки повторяются через 90 ⇒ **N = 70, 160, 250, …** — всегда 70 + 90k."],"f":["mod_def"]},{"w":["🔎 Значит, при делении на группы по 90 неполная группа — **70 человек**.","👉 Пример такой школы — из пункта б: 3 класса (7 м, 3 д) и 4 класса (3 м, 7 д), всего 70 человек — одна неполная группа.","✅ **Ответ: 70.**"],"f":[]}],"v":[{"b":0,"s":"Всего учеников эн. Из пункта а мы знаем: эн даёт остаток семь при делении на девять. А раз классы семь к трём, эн делится на десять."},{"b":0,"s":"Смотрим в таблицу: среди чисел, кратных десяти, остаток семь при делении на девять даёт семьдесят. Дальше всё повторяется через девяносто: подходят семьдесят, сто шестьдесят, двести пятьдесят и так далее."},{"b":0,"f":"mod_def"},{"b":1,"s":"Каждое такое число — это несколько полных групп по девяносто и ещё семьдесят человек. Значит, в неполной группе семьдесят одиннадцатиклассников."},{"b":1,"s":"Такая ситуация возможна: пример из пункта бэ — три класса по семь мальчиков и три девочки и четыре класса по три мальчика и семь девочек. Ответ: семьдесят."}],"rich":true}],"tags":["div"],"facts":["div_def","div_sum","mod_def","est_ex"],"note":"","n":10},{"id":"83776","d":2,"from":"PDF №003","stem":"Из набора цифр 0, 1, 2, 3, 5, 7 и 9 составляют пару чисел, используя каждую цифру ровно один раз. Оказалось, что одно из этих чисел четырёхзначное, другое – трёхзначное и оба кратны 45.","parts":[{"l":"а","q":"Может ли сумма такой пары чисел равняться 2205?","ak":"yn","av":"ДА","steps":[{"w":["💡 45 = 5·9: число кратно 45, если оно **оканчивается на 0 или 5** и его **сумма цифр делится на 9**."],"f":["div_comp"]},{"w":["🔎 **Все трёхзначные числа, кратные 45.** Вычёркиваем те, что нельзя составить из цифр 0, 1, 2, 3, 5, 7, 9 (без повторов):","|выделено — можно составить||||","|+135|~180|~225|+270|+315","|~360|~405|~450|~495|~540","|~585|~630|~675|+720|~765","|~810|~855|~900|~945|~990","👉 Остаются **135, 270, 315, 720**."],"f":[]},{"w":["🔎 **Для каждого находим четырёхзначное:**","|трёхзначное|2205 − трёхзначное|можно составить?","|135|2070|❌ два нуля","|!270|1935|✅ цифры 1, 9, 3, 5 + 2, 7, 0","|315|1890|❌ нет цифры 8","|720|1485|❌ нет цифр 4 и 8","👉 **1935 + 270 = 2205.**","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Сорок пять — это пять на девять. Значит, число кратно сорока пяти, если оно делится и на пять, и на девять: оканчивается на ноль или пять, а сумма цифр делится на девять."},{"b":0,"f":"div_comp"},{"b":1,"s":"Выпишем все трёхзначные числа, кратные сорока пяти, и вычеркнем те, которые нельзя составить из наших цифр: где есть четвёрка, шестёрка, восьмёрка или повторяющиеся цифры. Остаются четыре числа: сто тридцать пять, двести семьдесят, триста пятнадцать и семьсот двадцать."},{"b":2,"s":"Для каждого вычтем его из двух тысяч двухсот пяти и посмотрим, можно ли составить получившееся четырёхзначное число из оставшихся цифр."},{"b":2,"s":"Подходит только одна строка: тысяча девятьсот тридцать пять плюс двести семьдесят. Вместе это ровно все семь цифр. Ответ: да."}],"rich":true},{"l":"б","q":"Может ли сумма такой пары чисел равняться 3435?","ak":"yn","av":"НЕТ","steps":[{"w":["💡 Оба числа кратны 45 ⇒ **их сумма кратна 45**.","🔎 3435 = 45·76 + 15 — остаток 15.","✅ **Ответ: нет.**"],"f":["div_sum"]}],"v":[{"b":0,"s":"Оба числа делятся на сорок пять, значит, и их сумма делится на сорок пять."},{"b":0,"f":"div_sum"},{"b":0,"s":"А три тысячи четыреста тридцать пять при делении на сорок пять даёт остаток пятнадцать. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое наибольшее значение может принимать сумма чисел в такой паре?","ak":"num","av":"10035","steps":[{"w":["💡 Трёхзначное число — одно из **135, 270, 315, 720** (таблица из пункта а).","👉 Для каждого составим **наибольшее** четырёхзначное из оставшихся цифр, оканчивающееся на 0 или 5.","👉 Сумма всех цифр 27, у трёхзначного 9 ⇒ у четырёхзначного 18 — на 9 делится автоматически."],"f":[]},{"w":["|трёхзначное|оставшиеся цифры|наибольшее четырёхзначное|сумма","|135|0, 2, 7, 9|9720|9855","|270|1, 3, 5, 9|9315|9585","|!315|0, 2, 7, 9|9720|**10 035**","|!720|1, 3, 5, 9|9315|**10 035**","✅ **Ответ: 10 035** (например, 9720 + 315)."],"f":["est_ex"]},{"w":["🔁 **Другой способ — через суммы цифр.** Сумма всех цифр 27. У каждого числа сумма цифр кратна 9 ⇒ суммы цифр (четырёхзначного; трёхзначного) = (18; 9) или (9; 18).","👉 (9; 18): четыре цифры с суммой 9 — только 0, 1, 3, 5 ⇒ число ≤ 5310, сумма \u003c 10 000.","👉 (18; 9): трёхзначное с суммой 9 — те же 135, 270, 315, 720, дальше — таблица выше."],"f":["ds_mod9"]}],"v":[{"b":0,"s":"Все трёхзначные числа, которые подходят, мы уже нашли в пункте а: их всего четыре. Для каждого составим самое большое четырёхзначное из оставшихся цифр — оно тоже должно оканчиваться на ноль или пять."},{"b":0,"s":"Про девятку можно не беспокоиться: сумма всех цифр двадцать семь, у трёхзначного девять, значит, у четырёхзначного восемнадцать."},{"b":1,"s":"Смотрим на таблицу. Наибольшая сумма — десять тысяч тридцать пять, и получается она двумя способами, например девять тысяч семьсот двадцать плюс триста пятнадцать."},{"b":1,"f":"est_ex"},{"b":2,"s":"Можно рассуждать и через суммы цифр. Сумма всех цифр двадцать семь, а у каждого числа сумма цифр делится на девять."},{"b":2,"f":"ds_mod9"},{"b":2,"s":"Поэтому суммы цифр — восемнадцать и девять в каком-то порядке. Если у четырёхзначного девять, то его цифры — ноль, один, три, пять, и сумма пары меньше десяти тысяч. Значит, у четырёхзначного восемнадцать, а трёхзначное — одно из тех же четырёх чисел. Ответ: десять тысяч тридцать пять."}],"rich":true}],"tags":["digits","div"],"facts":["div_comp","div_rules","div_sum","ds_mod9","est_ex"],"note":"","n":11},{"id":"90080","d":2,"from":"PDF №008","stem":"В порту имеются только заполненные контейнеры, масса каждого из которых равна 20 тонн или 80 тонн. В некоторых из этих контейнеров находится сахарный песок. Количество контейнеров с сахарным песком составляет 20% от общего количества контейнеров.","parts":[{"l":"а","q":"Может ли масса контейнеров с сахарным песком составить 40% от общей массы всех контейнеров?","ak":"yn","av":"ДА","steps":[{"w":["✏️ Пусть контейнеров с сахаром **x**. Они составляют 20% = 1/5 всех ⇒ всего **5x**, без сахара **4x**.","💡 Сахарных мало, а весить они должны почти половину ⇒ сахар кладём в **тяжёлые** контейнеры (80 т).","✏️ Среди контейнеров без сахара **y** тяжёлых и **4x − y** лёгких."],"f":["percent"]},{"w":["🔎 **Уравнение:** масса сахарных = 40% от всей массы:","=80x = 0,4·(80x + 80y + 20(4x − y))","=80x = 0,4·(160x + 60y)","=80x = 64x + 24y","=16x = 24y   ⇒   2x = 3y","👉 Наименьшее натуральное решение: **x = 3, y = 2**."],"f":["lin_dioph"]},{"w":["✔️ **Проверка:** всего 15 контейнеров, с сахаром 3 по 80 т = 240 т.","👉 Без сахара: 2 по 80 т и 10 по 20 т = 160 + 200 = 360 т.","=240 : 600 · 100% = 40%","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Пусть контейнеров с сахаром икс. Это двадцать процентов, то есть пятая часть всех. Значит, всего контейнеров пять икс, а без сахара — четыре икс."},{"b":0,"f":"percent"},{"b":0,"s":"Сахарных контейнеров мало, а весить они должны почти половину. Поэтому сахар положим в тяжёлые контейнеры по восемьдесят тонн. Среди остальных пусть игрек тяжёлых и четыре икс минус игрек лёгких."},{"b":1,"s":"Составим уравнение: масса сахарных, восемьдесят икс, равна сорока процентам всей массы. Раскрываем скобки и упрощаем: шестнадцать икс равно двадцать четыре игрек, то есть два икс равно три игрек."},{"b":1,"f":"lin_dioph"},{"b":1,"s":"Самое маленькое натуральное решение — икс равно трём, игрек равно двум."},{"b":2,"s":"Проверим. Пятнадцать контейнеров, из них три с сахаром по восемьдесят тонн — двести сорок тонн. Остальные весят триста шестьдесят. Двести сорок от шестисот — ровно сорок процентов. Ответ: да."}],"rich":true},{"l":"б","q":"Может ли масса контейнеров с сахарным песком составить 80% от общей массы всех контейнеров?","ak":"yn","av":"НЕТ","steps":[{"w":["💡 Пусть с сахаром **x** контейнеров, без сахара **4x**.","👉 Сахарные весят **не больше 80x** (все по 80 т).","👉 Остальные весят **не меньше 20·4x = 80x** (все по 20 т)."],"f":[]},{"w":["🔎 Значит, сахарные весят **не больше**, чем остальные ⇒ сахар — **не больше половины** всей массы:","=доля ≤ 50% \u003c 80%","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Пусть контейнеров с сахаром икс, без сахара — в четыре раза больше. Даже если все сахарные тяжёлые, они весят не больше восьмидесяти икс. А остальные, даже если все лёгкие, весят не меньше двадцати на четыре икс — тоже восемьдесят икс."},{"b":1,"s":"Получается, что сахарные весят не больше, чем все остальные. Значит, сахар — не больше половины, а несахарные — не меньше половины. Половина — это пятьдесят процентов, а восемьдесят больше. Ответ: нет."}],"rich":true},{"l":"в","q":"Какую наибольшую долю (в процентах) может составить масса контейнеров с сахарным песком от общей массы всех контейнеров?","ak":"num","av":"50","steps":[{"w":["💡 **Оценка** — из пункта б: доля **≤ 50%**."],"f":[]},{"w":["🔎 **Пример через уравнение из пункта а:** все сахарные тяжёлые, все остальные лёгкие (y = 0):","=80x : (80x + 20·4x) = 80x : 160x = 1/2 = 50%","👉 Подходит **любое x**, например x = 1: один контейнер 80 т с сахаром и четыре по 20 т без.","✅ **Ответ: 50.**"],"f":["est_ex"]}],"v":[{"b":0,"s":"Оценка у нас уже есть из пункта бэ: больше пятидесяти процентов не получится."},{"b":1,"s":"Пример возьмём из того же уравнения, что в пункте а. Пусть все сахарные контейнеры тяжёлые, а все остальные лёгкие, то есть игрек равен нулю. Тогда сахарные весят восемьдесят икс, а все вместе — сто шестьдесят икс. Ровно половина, при любом икс."},{"b":1,"f":"est_ex"},{"b":1,"s":"Например, один контейнер с сахаром и четыре лёгких без сахара. Ответ: пятьдесят."}],"rich":true}],"tags":["avg"],"facts":["percent","mean","est_ex"],"note":"","n":12},{"id":"64209","d":2,"from":"PDF №011","stem":"Есть числа A и B. Из них можно сделать числа A +2 и B− 1 или A − 1 и B + 2, только если следующая пара этих чисел будет натуральной. Известно, что A = 5, B = 7.","parts":[{"l":"а","q":"Можно ли за 50 ходов создать пару, где одно из чисел равно 100?","ak":"yn","av":"НЕТ","steps":[{"w":["💡 **Полуинвариант — сумма A + B.** За любой ход она растёт ровно на 1:","=(A + 2) + (B − 1) = A + B + 1,     (A − 1) + (B + 2) = A + B + 1"],"f":["monovar"]},{"w":["🔎 Сначала сумма 5 + 7 = 12 ⇒ после 50 ходов сумма **62**.","❌ Если одно число 100, а другое натуральное, сумма ≥ 101 > 62.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Здесь главное — полуинвариант: сумма двух чисел. При любом ходе одно число растёт на два, другое уменьшается на один, и сумма увеличивается ровно на единицу."},{"b":0,"f":"monovar"},{"b":1,"s":"Значит, легко сосчитать сумму после пятидесяти ходов: было двенадцать, станет шестьдесят два. А если одно из чисел сто, сумма хотя бы сто один. Ответ: нет."}],"rich":true},{"l":"б","q":"За сколько ходов можно сделать пару, где сумма чисел будет равна 400?","ak":"num","av":"388","steps":[{"w":["💡 Сумма растёт на 1 за ход:","=400 − 12 = 388 ходов"],"f":[]},{"w":["🔎 **Можно ли столько сделать?** Чередуем ходы: (A + 2, B − 1), потом (A − 1, B + 2).","=(5; 7) → (7; 6) → (6; 8) → (8; 7) → (7; 9) → …","👉 За пару ходов оба числа растут на 1 — числа остаются натуральными.","✅ **Ответ: 388.**"],"f":[]}],"v":[{"b":0,"s":"Сумма растёт на единицу за ход. От двенадцати до четырёхсот — триста восемьдесят восемь ходов."},{"b":1,"s":"Нужно убедиться, что столько ходов действительно можно сделать и числа не станут ненатуральными. Будем чередовать ходы: за пару ходов каждое число вырастает на единицу. Числа только растут, поэтому всё в порядке. Ответ: триста восемьдесят восемь."}],"rich":true},{"l":"в","q":"Какое наибольшее число ходов можно сделать, чтобы оба числа не превышали 100?","ak":"num","av":"187","steps":[{"w":["💡 **Оценка по сумме.** Оба числа ≤ 100 ⇒ сумма ≤ 200 ⇒ ходов ≤ 200 − 12 = **188**."],"f":[]},{"w":["🔎 **Инвариант — разность A − B.** За ход она меняется на 3:","=(A + 2) − (B − 1) = A − B + 3,     (A − 1) − (B + 2) = A − B − 3","👉 Значит, **остаток A − B при делении на 3 не меняется**.","=5 − 7 = −2 = −3 + 1  ⇒  остаток **1**","👉 −2 — это «двух не хватает до нуля», то есть на один больше, чем −3."],"f":["invariant"]},{"w":["🔎 **Сумма 200** — только пара (100; 100): разность 0, остаток **0 ≠ 1** ❌.","👉 Значит, сумма ≤ 199, ходов ≤ **187**.","👉 Сумма 199: (100; 99) — разность 1 ✅,  (99; 100) — разность −1 ❌. Цель — **(100; 99)**."],"f":[]},{"w":["🔎 **Пример.** Пусть x ходов первого типа (A + 2, B − 1) и y второго (A − 1, B + 2).","👉 A каждый ход первого типа растёт на 2, второго — падает на 1:  5 + 2x − y = 100","👉 B каждый ход первого типа падает на 1, второго — растёт на 2:  7 − x + 2y = 99","{2x − y = 95","{−x + 2y = 92","👉 Из первого y = 2x − 95; подставляем: −x + 4x − 190 = 92 ⇒ 3x = 282","=x = 94,     y = 93,     x + y = 187","👉 Чередуем ходы (первый, второй, …, первый) — получаем (100; 99).","✅ **Ответ: 187.**"],"f":["est_ex"]}],"v":[{"b":0,"s":"Сначала простая оценка по сумме. Оба числа не больше ста, значит, сумма не больше двухсот, и ходов не больше ста восьмидесяти восьми."},{"b":1,"s":"Но можно ли дойти до суммы двести? Посмотрим на разность чисел. При любом ходе она меняется на три: увеличивается или уменьшается."},{"b":1,"f":"invariant"},{"b":1,"s":"Значит, остаток разности при делении на три не меняется. В начале разность минус два. Минус два — это двух не хватает до нуля, то есть на единицу больше, чем минус три. Остаток равен единице."},{"b":2,"s":"Сумма двести бывает только у пары сто и сто. Её разность ноль, остаток ноль, а должен быть один. Значит, сумма не больше ста девяноста девяти, и ходов не больше ста восьмидесяти семи."},{"b":2,"s":"Сумма сто девяносто девять — это сто и девяносто девять. Разность плюс один подходит, а минус один — нет. Целимся в пару сто и девяносто девять."},{"b":3,"s":"Пусть икс ходов первого типа и игрек второго. Число А при каждом ходе первого типа увеличивается на два, а при ходе второго типа уменьшается на один. Из пяти должно получиться сто: пять плюс два икс минус игрек равно ста."},{"b":3,"s":"Число Бэ, наоборот, при ходе первого типа уменьшается на один, а при ходе второго — растёт на два. Из семи должно получиться девяносто девять: семь минус икс плюс два игрек равно девяноста девяти."},{"b":3,"s":"Решим систему. Из первого уравнения игрек равно два икс минус девяносто пять. Подставляем во второе: три икс равно двумстам восьмидесяти двум, икс равен девяноста четырём, а игрек — девяноста трём. Всего сто восемьдесят семь ходов."},{"b":3,"f":"est_ex"},{"b":3,"s":"Ходы чередуем, начиная и заканчивая первым типом, тогда числа всё время натуральные. Ответ: сто восемьдесят семь."}],"rich":true}],"tags":["ops"],"facts":["monovar","invariant","mod_def","est_ex"],"note":"","n":13},{"id":"63293","d":2,"from":"PDF №016","stem":"Из пары натуральных чисел (a;b), где a > b, за один ход получают пару (a+ b;a− b).","parts":[{"l":"а","q":"Можно ли за несколько таких ходов получить из пары (100;1) пару, большее число в которой равно 400?","ak":"yn","av":"ДА","steps":[{"w":["💡 **Два хода подряд удваивают пару:**","=(a; b) → (a + b; a − b) → (2a; 2b)"],"f":[]},{"w":["🔎 Значит, из (100; 1) за 4 хода получаем учетверённую пару:","=(100; 1) → (101; 99) → (200; 2) → (202; 198) → (400; 4)","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Заметим полезную вещь. После первого хода получаем а плюс бэ и а минус бэ. На втором ходе эти числа складываем — выходит два а, и вычитаем — выходит два бэ. Значит, два хода подряд просто удваивают пару."},{"b":1,"s":"Из пары сто и один за два хода получаем двести и два, ещё за два хода — четыреста и четыре. Большее число равно четырёмстам. Ответ: да."}],"rich":true},{"l":"б","q":"Можно ли за несколько таких ходов получить из пары (100;1) пару (806;788)?","ak":"yn","av":"НЕТ","steps":[{"w":["💡 **Идём назад.** Если (a; b) → (x; y), то x = a + b, y = a − b, откуда","=a = (x + y) : 2 — полусумма,     b = (x − y) : 2 — полуразность","👉 Предыдущая пара **единственная**, и она есть, только если x + y чётно."],"f":["reverse"]},{"w":["🔎 **Таблица обратного хода:**","|пара|полусумма|полуразность|предыдущая пара","|(806; 788)|(806 + 788) : 2 = 797|(806 − 788) : 2 = 9|(797; 9)","|(797; 9)|(797 + 9) : 2 = 403|(797 − 9) : 2 = 394|(403; 394)","|-(403; 394)|797 : 2 — не целое|—|нет ❌"],"f":["parity"]},{"w":["👉 Пару (806; 788) можно получить только из (797; 9) или (403; 394). Пары (100; 1) в этой цепочке нет.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Пойдём от конца. Если из пары а и бэ получилась пара икс и игрек, то икс — это сумма, а игрек — разность. Тогда а — полусумма икс и игрек, а бэ — их полуразность. Значит, предыдущая пара всегда одна-единственная."},{"b":0,"f":"reverse"},{"b":1,"s":"Заполним таблицу, шаг за шагом двигаясь назад. От пары восемьсот шесть и семьсот восемьдесят восемь: полусумма семьсот девяносто семь, полуразность девять."},{"b":1,"s":"От пары семьсот девяносто семь и девять: полусумма четыреста три, полуразность триста девяносто четыре."},{"b":1,"s":"А у пары четыреста три и триста девяносто четыре сумма нечётная, её пополам не разделить. Дальше назад идти некуда."},{"b":1,"f":"parity"},{"b":2,"s":"Значит, всю цепочку мы нашли, и пары сто и один в ней нет. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое наименьшее a может быть в паре (a;b), из которой за несколько ходов можно получить пару (806;788)?","ak":"num","av":"403","steps":[{"w":["🔎 Из таблицы пункта б: получить (806; 788) можно только из пар","|пара|a","|(806; 788)|806","|(797; 9)|797","|!(403; 394)|**403**","👉 (403; 394) → (797; 9) → (806; 788).","✅ **Ответ: 403.**"],"f":["est_ex"]}],"v":[{"b":0,"s":"Цепочка назад единственная, мы выписали её в пункте бэ. В ней три пары, и самое маленькое а — четыреста три."},{"b":0,"f":"est_ex"},{"b":0,"s":"Ответ: четыреста три."}],"rich":true}],"tags":["ops"],"facts":["reverse","parity","est_ex"],"note":"","n":14},{"id":"159854","d":2,"from":"PDF №017","stem":"По окружности некоторым способом расставили натуральные числа от 1 до 12. Между каждыми двумя соседними числами написали модуль их разности. Затем исходные числа стёрли.","parts":[{"l":"а","q":"Приведите пример расстановки, когда сумма полученных чисел равна 32.","ak":"self","av":"Например: 1, 12, 11, 10, 9, 8, 2, 3, 4, 5, 6, 7 (по кругу). Разности: 11+1+1+1+1+6+1+1+1+1+1+6 = 32.","steps":[{"w":["💡 **Идея:** если числа идут **по порядку**, все разности маленькие. Большие разности дают «скачки».","📌 1, 12, 11, …, 2 по кругу: разности 11, 1, 1, …, 1, и в конце снова 1 → сумма 22.","👉 Чтобы добавить 10, сделаем **ещё один скачок** вверх-вниз (на 5 туда и обратно)."],"f":["abs_sum"]},{"w":["🔨 **Пример:** 1, 12, 11, 10, 9, 8, 2, 3, 4, 5, 6, 7 (по кругу)","=11 + 1 + 1 + 1 + 1 + 6 + 1 + 1 + 1 + 1 + 1 + 6 = 32 ✔️"],"f":[]}],"v":[{"b":0,"s":"Если идти по кругу от единицы к двенадцати и обратно вниз, сумма разностей равна удвоенной разности между самым большим и самым маленьким числом, то есть двадцати двум."},{"b":0,"f":"abs_sum"},{"b":0,"s":"Нам нужно на десять больше. Значит, нужен ещё один спуск и подъём, которые вместе дают лишние десять. Например, спуститься с восьми до двух и потом снова подниматься."},{"b":1,"s":"Вот расстановка: один, двенадцать, одиннадцать, десять, девять, восемь, потом два, три, четыре, пять, шесть, семь. Разности выписаны в решении — их сумма ровно тридцать два."}],"rich":true},{"l":"б","q":"Может ли сумма полученных чисел быть равна 29?","ak":"yn","av":"НЕТ","steps":[{"w":["💡 **Идея:** чётность.","📌 Модуль разности той же чётности, что и сама разность.","=(x₁ − x₂) + (x₂ − x₃) + … + (x₁₂ − x₁) = 0","👉 Значит, сумма модулей — **чётная**.","❌ 29 — нечётное.","✅ **Ответ: нет.**"],"f":["parity"]}],"v":[{"b":0,"s":"Посмотрим на чётность. Модуль разности и сама разность — одной чётности."},{"b":0,"f":"parity"},{"b":0,"s":"Если сложить все разности по кругу без модулей, каждое число один раз войдёт с плюсом и один раз с минусом, и всё сократится — получится ноль, чётное число. Значит, и сумма модулей всегда чётная. А двадцать девять нечётное. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое наибольшее значение может принимать сумма полученных чисел?","ak":"num","av":"72","steps":[{"w":["📏 **Оценка.** Каждое число входит в две разности: с «+» или с «−».","=сумма ≤ 2·(7 + 8 + … + 12) − 2·(1 + 2 + … + 6) = 114 − 42 = 72"],"f":["abs_sum"]},{"w":["🔨 **Пример:** большие и маленькие **чередуются**:","=1, 12, 2, 11, 3, 10, 4, 9, 5, 8, 6, 7","=11 + 10 + 9 + … + 1 + 6 = 72 ✔️","✅ **Ответ: 72.**"],"f":[]}],"v":[{"b":0,"s":"Ищем наибольшую сумму — оценка плюс пример."},{"b":0,"f":"abs_sum"},{"b":0,"s":"Каждое число участвует в двух разностях и в каждой берётся либо с плюсом, либо с минусом. Лучшее, что может быть, — шесть самых больших чисел дважды с плюсом, а шесть самых маленьких дважды с минусом. Это даёт семьдесят два."},{"b":1,"s":"Чтобы так получилось, большие и маленькие числа должны чередоваться: один, двенадцать, два, одиннадцать и так далее. Проверьте разности в решении — ровно семьдесят два. Ответ: семьдесят два."}],"rich":true}],"tags":["est"],"facts":["abs_sum","parity","est_ex"],"note":"","n":15},{"id":"175399","d":2,"from":"PDF №019","stem":"Восемь различных натуральных чисел таковы, что никакие два не имеют общего делителя, большего 1.","parts":[{"l":"а","q":"Может ли сумма всех восьми чисел быть равна 65?","ak":"yn","av":"ДА","steps":[{"w":["💡 **Идея:** взаимно простые числа проще всего брать из **простых** и единицы.","🔨 **Пример:**","=1 + 2 + 3 + 5 + 7 + 11 + 13 + 23 = 65","✅ **Ответ: да.**"],"f":["coprime"]}],"v":[{"b":0,"s":"Числа, у которых нет общих делителей, удобно брать среди простых чисел, и ещё можно взять единицу."},{"b":0,"f":"coprime"},{"b":0,"s":"Возьмём единицу и первые простые числа: два, три, пять, семь, одиннадцать, тринадцать. Их сумма сорок два. До шестидесяти пяти не хватает двадцати трёх — а это тоже простое число. Ответ: да."}],"rich":true},{"l":"б","q":"Может ли сумма всех восьми чисел быть равна 62?","ak":"yn","av":"НЕТ","steps":[{"w":["💡 **Идея:** чётность.","📌 Чётных среди них **не больше одного** (иначе общий делитель 2).","📌 Если одно чётное, то сумма = 7 нечётных + чётное = **нечётная**, а 62 чётное.","👉 Значит, **все 8 чисел нечётные**."],"f":[]},{"w":["📌 У нечётных чисел (кроме 1) разные **нечётные простые** делители:","=сумма ≥ 1 + 3 + 5 + 7 + 11 + 13 + 17 + 19 = 76 > 62","✅ **Ответ: нет.**"],"f":["prime_min"]}],"v":[{"b":0,"s":"Сначала посмотрим на чётность. Чётным может быть не больше одного числа, ведь два чётных числа имеют общий делитель два."},{"b":0,"s":"Если одно число чётное, остальные семь нечётные, и сумма семи нечётных чисел нечётная. Добавив чётное, получим нечётную сумму. А шестьдесят два чётное. Значит, все восемь чисел нечётные."},{"b":1,"s":"Теперь оценим сумму. У каждого нечётного числа, кроме единицы, есть свой нечётный простой делитель, и у разных чисел они разные. А само число не меньше своего наименьшего простого делителя."},{"b":1,"f":"prime_min"},{"b":1,"s":"Поэтому сумма не меньше, чем единица плюс семь самых маленьких нечётных простых. Это семьдесят шесть — больше шестидесяти двух. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое наименьшее значение может принимать сумма всех восьми чисел?","ak":"num","av":"59","steps":[{"w":["📏 **Оценка.** У каждого числа (кроме 1) свой простой делитель, и число не меньше его:","=сумма ≥ 1 + 2 + 3 + 5 + 7 + 11 + 13 + 17 = 59"],"f":[]},{"w":["🔨 **Пример:** ровно эти числа — 1, 2, 3, 5, 7, 11, 13, 17.","✅ **Ответ: 59.**"],"f":["est_ex"]}],"v":[{"b":0,"s":"Ищем наименьшую сумму — оценка плюс пример."},{"b":0,"s":"Рассуждаем как в пункте бэ, но теперь одно число может быть чётным. У каждого числа, кроме единицы, свой простой делитель, и число не меньше него. Значит, сумма не меньше, чем единица плюс семь самых маленьких простых чисел — это пятьдесят девять."},{"b":1,"s":"А пример — как раз эти числа: единица и простые от двух до семнадцати. Ответ: пятьдесят девять."},{"b":1,"f":"est_ex"}],"rich":true}],"tags":["div","est"],"facts":["coprime","prime_min","parity","est_ex"],"note":"","n":16},{"id":"126272","d":2,"from":"PDF №021","stem":"На доске записано некоторое количество последовательных натуральных чисел, среди которых ровно пять делятся на 15.","parts":[{"l":"а","q":"Могло ли среди записанных чисел быть больше пяти чисел, делящихся на 16?","ak":"yn","av":"ДА","steps":[{"w":["💡 **Идея:** оценим, **сколько чисел** записано.","📌 Ровно 5 кратных 15 → длина L от **61 до 89**.","📌 Чтобы кратных 16 было 6, нужно L ≥ 5·16 + 1 = 81."],"f":["div_count"]},{"w":["🔨 **Пример:** числа 16, 17, …, 96 (81 число).","👉 Кратные 16: 16, 32, 48, 64, 80, 96 — **шесть**","👉 Кратные 15: 30, 45, 60, 75, 90 — **пять** ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Сначала поймём, сколько чисел может быть на доске. Кратные пятнадцати встречаются через каждые пятнадцать чисел. Если их ровно пять, то отрезок не короче шестидесяти одного числа и не длиннее восьмидесяти девяти."},{"b":0,"f":"div_count"},{"b":0,"s":"Чтобы на отрезке поместились шесть кратных шестнадцати, нужно хотя бы восемьдесят одно число. Это укладывается в наши границы — значит, стоит попробовать."},{"b":1,"s":"Начнём прямо с шестнадцати и закончим девяноста шестью. Кратных шестнадцати получается шесть, а кратных пятнадцати — ровно пять. Ответ: да."}],"rich":true},{"l":"б","q":"Могло ли среди записанных чисел быть меньше пяти чисел, делящихся на 11?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Чисел не меньше **61**, а 61 > 5·11 = 55.","👉 Из чисел можно составить **5 блоков по 11 подряд**, в каждом есть кратное 11.","❌ Значит, кратных 11 **не меньше пяти**.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Мы знаем, что чисел на доске не меньше шестидесяти одного. Разобьём первые пятьдесят пять из них на пять кусков по одиннадцать подряд идущих чисел."},{"b":0,"s":"В каждом куске из одиннадцати подряд идущих чисел обязательно есть число, кратное одиннадцати. Значит, кратных одиннадцати хотя бы пять. Ответ: нет."}],"rich":true},{"l":"в","q":"Найдите наибольшее возможное число k такое, что среди записанных чисел больше пяти чисел делятся на k.","ak":"num","av":"17","steps":[{"w":["📏 **Оценка.** Больше пяти кратных k → чисел не меньше 5k + 1, а чисел не больше 89:","=5k + 1 ≤ 89   →   k ≤ 17"],"f":[]},{"w":["🔨 **Пример:** числа 17, 18, …, 102.","👉 Кратные 17: 17, 34, 51, 68, 85, 102 — **шесть**","👉 Кратные 15: 30, 45, 60, 75, 90 — **пять** ✔️","✅ **Ответ: 17.**"],"f":[]}],"v":[{"b":0,"s":"Ищем наибольшее ка — оценка плюс пример. Если кратных ка хотя бы шесть, то между первым и последним из них пять промежутков по ка чисел, значит, всего чисел не меньше пяти ка плюс один."},{"b":0,"s":"А чисел не больше восьмидесяти девяти. Отсюда ка не больше семнадцати."},{"b":1,"s":"Пример: берём числа от семнадцати до ста двух. Кратных семнадцати шесть, а кратных пятнадцати — ровно пять. Ответ: семнадцать."}],"rich":true}],"tags":["div"],"facts":["div_count","est_ex"],"note":"","n":17},{"id":"56126","d":2,"from":"PDF №024","stem":"Егор делит линейку на части. За одно действие он может отрезать от любого количества линеек равные части, имеющие целую длину.","parts":[{"l":"а","q":"Может ли Егор за 4 хода разделить линейку длиной в 16 см на части по 1 см?","ak":"yn","av":"ДА","steps":[{"w":["💡 **Идея:** каждый раз режем **все** куски пополам.","=16 → 8 + 8 → 4 (×4) → 2 (×8) → 1 (×16)","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Будем каждый раз резать все куски ровно пополам. Ведь за один ход можно отрезать одинаковые части сразу от нескольких линеек."},{"b":0,"s":"Шестнадцать сантиметров превращаются в два куска по восемь, потом в четыре по четыре, потом в восемь по два и, наконец, в шестнадцать по одному. Ровно четыре хода. Ответ: да."}],"rich":true},{"l":"б","q":"Может ли Егор за 5 ходов разделить линейку длиной в 100 см на части по 1 см?","ak":"yn","av":"НЕТ","steps":[{"w":["💡 **Идея:** за ход каждый кусок делится **не больше чем на 2** → количество кусков не больше чем удваивается.","=после 5 ходов кусков ≤ 2⁵ = 32","❌ А нужно 100.","✅ **Ответ: нет.**"],"f":["double_bound"]}],"v":[{"b":0,"s":"За один ход от каждой линейки отрезают одну часть, то есть каждый кусок делится максимум на два. Значит, за ход количество кусков увеличивается не больше чем вдвое."},{"b":0,"f":"double_bound"},{"b":0,"s":"Было один, после пяти ходов не больше тридцати двух. А нужно сто кусков. Ответ: нет."}],"rich":true},{"l":"в","q":"За какое наименьшее количество ходов Егор может разделить линейку длиной в 300 см на части по 1 см?","ak":"num","av":"9","steps":[{"w":["📏 **Оценка.** После k ходов кусков ≤ 2ᵏ.","=2⁸ = 256 \u003c 300   →   ходов ≥ 9"],"f":[]},{"w":["🔨 **Пример за 9 ходов:** каждый раз режем **все** куски почти пополам:","=300 → 150 → 75 → 37 и 38 → 18 и 19 → 9 и 10 → 4 и 5 → 2 и 3 → 1 и 2 → 1","📌 После каждого хода длины отличаются не больше чем на 1.","✅ **Ответ: 9.**"],"f":[]}],"v":[{"b":0,"s":"Ищем наименьшее число ходов. Оценка — как в пункте бэ: после восьми ходов кусков не больше двухсот пятидесяти шести, а нужно триста. Значит, ходов не меньше девяти."},{"b":1,"s":"Пример. Каждый раз режем все куски пополам, а если длина нечётная — почти пополам. Например, семьдесят пять сантиметров делим на тридцать семь и тридцать восемь."},{"b":1,"s":"Тогда все куски всё время почти одинаковые, и примерно за девять ходов длины доходят до одного сантиметра. Вся цепочка выписана в решении. Ответ: девять."}],"rich":true}],"tags":["ops","est"],"facts":["double_bound","pow2","est_ex"],"note":"","n":18},{"id":"2457","d":2,"from":"PDF №025","stem":"Учитель задумал несколько необязательно различных натуральных чисел. Эти числа и результаты всех их возможных произведений по два числа, по три числа и так далее он выписал на доску. Если какое-то число, выписанное на доску, повторяется несколько раз, то на доске оставляют только одно такое число, а другие равные ему числа стирают. Например, если задуманы числа 1, 5, 6, 5, то на доске будет набор 1, 5, 6, 30, 25, 150.","parts":[{"l":"а","q":"Приведите пример задуманных чисел, для которых на доске будет записан набор 2, 3, 5, 6, 9, 10, 15, 18, 30, 45, 90.","ak":"self","av":"Например, задуманы 2, 3, 3, 5.","steps":[{"w":["💡 **Идея:** наибольшее число на доске — **произведение всех** задуманных.","=90 = 2·3·3·5","📌 На доске есть 9, но нет 27 → троек ровно две."],"f":["fta"]},{"w":["🔨 **Пробуем 2, 3, 3, 5:**","👉 по одному: 2, 3, 5","👉 по два: 6, 9, 10, 15","👉 по три: 18, 30, 45","👉 все четыре: 90","✔️ Набор совпадает."],"f":[]}],"v":[{"b":0,"s":"Самое большое число на доске — это произведение всех задуманных чисел. Здесь это девяносто. Разложим его на простые множители: два, три, три и пять."},{"b":0,"f":"fta"},{"b":0,"s":"На доске есть девять — это три на три. А двадцати семи нет, значит, троек не три, а две. Попробуем задумать числа два, три, три и пять."},{"b":1,"s":"Выпишем все произведения: сами числа, произведения по два, по три и всех четырёх. Получается ровно набор из условия — сверьте по строчкам решения."}],"rich":true},{"l":"б","q":"Существует ли пример таких задуманных чисел, для которых на доске будет записан набор 3, 5, 7, 9, 15, 21, 35, 45, 105, 315, 945?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 На доске **нет 1** → единиц среди задуманных нет.","📌 3, 5, 7 — **простые** → их можно получить только как сами задуманные числа."],"f":["prime_only"]},{"w":["📌 Наибольшее число — произведение всех:","=945 = 3·3·3·5·7","👉 Кроме 3, 5, 7 задумано ещё что-то с произведением **9**: это 9 или 3 и 3."],"f":[]},{"w":["❌ В обоих случаях на доске появится **27** (3·9 или 3·3·3), а его нет.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Единицы на доске нет — значит, единицу не задумывали. А простые числа три, пять и семь нельзя получить как произведение чисел больше единицы. Значит, они сами были задуманы."},{"b":0,"f":"prime_only"},{"b":1,"s":"Самое большое число, девятьсот сорок пять, — произведение всех задуманных. Разделим его на три, пять и семь — остаётся девять. Значит, остальные задуманные числа в произведении дают девять: это либо одна девятка, либо две тройки."},{"b":2,"s":"Но в обоих случаях на доске появится двадцать семь: три на девять или три тройки. А двадцати семи в наборе нет. Ответ: нет."}],"rich":true},{"l":"в","q":"Приведите все примеры шести задуманных чисел, для которых на доске будет записан набор, наибольшее число в котором равно 82.","ak":"self","av":"82, 1, 1, 1, 1, 1 или 2, 41, 1, 1, 1, 1.","steps":[{"w":["📌 Наибольшее число — произведение всех шести задуманных:","=82 = 2·41","💡 Раскладываем 82 на **6 натуральных множителей**:"],"f":[]},{"w":["👉 82, 1, 1, 1, 1, 1","👉 2, 41, 1, 1, 1, 1","📌 Других способов нет: 2 и 41 — простые.","✅ **Ответ:** 82, 1, 1, 1, 1, 1 или 2, 41, 1, 1, 1, 1."],"f":[]}],"v":[{"b":0,"s":"Самое большое число на доске — произведение всех шести задуманных чисел, и оно равно восьмидесяти двум. Восемьдесят два — это два на сорок один, оба множителя простые."},{"b":1,"s":"Значит, шесть множителей можно получить только двумя способами: либо одно число восемьдесят два и пять единиц, либо два, сорок один и четыре единицы. Оба варианта подходят. Это и есть ответ."}],"rich":true}],"tags":["div"],"facts":["fta","prime_only","est_ex"],"note":"","n":19},{"id":"185802","d":2,"from":"PDF №026","stem":"На столе лежит N монет по 2 рубля и 1200− N по 5 рублей. N может принимать значения от 1 до 1199. Известно, что если взять любые 500 монет, то их сумма будет составлять не меньше четверти от общей суммы.","parts":[{"l":"а","q":"Может ли N равняться 400?","ak":"yn","av":"ДА","steps":[{"w":["💡 **Идея:** проверяем **худший случай** — берём 500 самых **дешёвых** монет.","=вся сумма = 2N + 5(1200 − N) = 6000 − 3N"],"f":[]},{"w":["👉 N = 400: 400 монет по 2 р. и 100 по 5 р.","=800 + 500 = 1300","=четверть суммы = (6000 − 1200) : 4 = 1200","✔️ 1300 ≥ 1200","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Условие должно выполняться для любых пятисот монет. Самая трудная проверка — когда мы берём пятьсот самых дешёвых монет: если даже они дают четверть суммы, то и любые другие тоже."},{"b":0,"s":"Сначала запишем общую сумму: двухрублёвые и пятирублёвые монеты вместе. Формула — в решении."},{"b":1,"s":"При эн равном четырёхстам самые дешёвые пятьсот монет — это все четыреста двухрублёвых и ещё сто пятирублёвых. Это тысяча триста рублей. А четверть всей суммы — тысяча двести. Тысяча триста больше. Ответ: да."}],"rich":true},{"l":"б","q":"Может ли N равняться 600?","ak":"yn","av":"НЕТ","steps":[{"w":["👉 N = 600: 500 самых дешёвых — все по 2 р.","=500·2 = 1000","=четверть суммы = (6000 − 1800) : 4 = 1050","❌ 1000 \u003c 1050","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"При эн равном шестистам двухрублёвых монет больше пятисот, поэтому самые дешёвые пятьсот монет — все по два рубля. Это тысяча рублей."},{"b":0,"s":"А четверть всей суммы — тысяча пятьдесят. Тысячи не хватает, значит, условие нарушено. Ответ: нет."}],"rich":true},{"l":"в","q":"Сколько различных значений может принимать N?","ak":"num","av":"977","steps":[{"w":["💡 **Идея:** два случая — двухрублёвых больше 500 или меньше."],"f":[]},{"w":["👉 **N ≥ 500:** берём 500 двухрублёвых:","=1000 ≥ (6000 − 3N) : 4   →   N ≥ 667"],"f":[]},{"w":["👉 **N \u003c 500:** берём все двухрублёвые и добавляем пятирублёвые:","=2N + 5(500 − N) ≥ (6000 − 3N) : 4   →   N ≤ 444"],"f":[]},{"w":["📌 Подходят N от 1 до 444 и от 667 до 1199:","=444 + 533 = 977","✅ **Ответ: 977.**"],"f":[]}],"v":[{"b":0,"s":"Разберём два случая: когда двухрублёвых монет хотя бы пятьсот и когда меньше."},{"b":1,"s":"Если двухрублёвых хотя бы пятьсот, самые дешёвые пятьсот монет дают тысячу рублей. Тысяча должна быть не меньше четверти суммы. Решив это неравенство, получаем, что эн не меньше шестисот шестидесяти семи."},{"b":2,"s":"Если двухрублёвых меньше пятисот, берём их все и добираем пятирублёвыми до пятисот монет. Составляем такое же неравенство — и получаем, что эн не больше четырёхсот сорока четырёх."},{"b":3,"s":"Значит, подходят эн от одного до четырёхсот сорока четырёх и от шестисот шестидесяти семи до тысячи ста девяноста девяти. Считаем, сколько это чисел: девятьсот семьдесят семь. Ответ: девятьсот семьдесят семь."}],"rich":true}],"tags":["est"],"facts":["est_ex","lin_dioph"],"note":"","n":20},{"id":"1015","d":2,"from":"PDF №027","stem":"На доске написано несколько различных натуральных чисел, произведение любых двух из которых больше 40 и меньше 100.","parts":[{"l":"а","q":"Может ли на доске быть 5 чисел?","ak":"yn","av":"ДА","steps":[{"w":["💡 **Идея:** берём числа **подряд и примерно равные** — тогда все произведения близки.","🔨 **Пример:** 6, 7, 8, 9, 10","=наименьшее 6·7 = 42 > 40,     наибольшее 9·10 = 90 \u003c 100","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Чтобы все произведения попали между сорока и ста, числа должны быть примерно одинаковыми, около корня из шестидесяти — то есть около семи-восьми."},{"b":0,"s":"Возьмём пять чисел подряд: шесть, семь, восемь, девять и десять. Самое маленькое произведение — шесть на семь, сорок два, а самое большое — девять на десять, девяносто. Всё подходит. Ответ: да."}],"rich":true},{"l":"б","q":"Может ли на доске быть 6 чисел?","ak":"yn","av":"НЕТ","steps":[{"w":["✏️ Упорядочим: a₁ \u003c a₂ \u003c … \u003c a₆.","💡 **Идея:** смотрим на **два самых маленьких** и **два самых больших**.","📌 a₁·a₂ > 40 → a₂ ≥ 7 (иначе a₁·a₂ ≤ 5·6 = 30)."],"f":["extreme"]},{"w":["📌 Тогда a₅ ≥ 10, a₆ ≥ 11:","=a₅·a₆ ≥ 10·11 = 110 > 100","❌ Противоречие.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Расставим числа по возрастанию и посмотрим на крайние. Произведение двух самых маленьких больше сорока. Если бы второе число было шесть или меньше, произведение было бы не больше пяти на шесть, то есть тридцати. Значит, второе число хотя бы семь."},{"b":0,"f":"extreme"},{"b":1,"s":"Числа различные и растут, поэтому пятое хотя бы десять, а шестое хотя бы одиннадцать. Их произведение не меньше ста десяти — больше ста. Противоречие. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое наибольшее значение может принимать сумма чисел на доске, если их четыре?","ak":"num","av":"35","steps":[{"w":["✏️ Числа a \u003c b \u003c c \u003c d.","📌 c·d \u003c 100 и c \u003c d → **c ≤ 9**.","📌 a·b > 40 и b \u003c c → b ≤ 8, a ≥ 6."],"f":[]},{"w":["📏 **Оценка.**","👉 c = 9: d ≤ 11 (9·11 = 99), a + b ≤ 7 + 8 → сумма ≤ 35","👉 c ≤ 8: сумма ещё меньше (≤ 33)"],"f":["est_ex"]},{"w":["🔨 **Пример:** 7, 8, 9, 11","=произведения: 56, 63, 77, 72, 88, 99 — все от 40 до 100 ✔️","✅ **Ответ: 35.**"],"f":[]}],"v":[{"b":0,"s":"Пусть числа а, бэ, цэ, дэ расположены по возрастанию. Произведение двух самых больших меньше ста, поэтому третье число цэ не больше девяти — иначе цэ на дэ было бы не меньше десяти на одиннадцать."},{"b":0,"s":"Два самых маленьких числа меньше девяти, а их произведение больше сорока. Отсюда первое число хотя бы шесть."},{"b":1,"s":"Ищем наибольшую сумму. Если цэ равно девяти, то дэ не больше одиннадцати, а а и бэ не больше семи и восьми. Сумма не больше тридцати пяти. Если цэ меньше девяти, сумма получается ещё меньше."},{"b":1,"f":"est_ex"},{"b":2,"s":"Пример: семь, восемь, девять, одиннадцать. Все попарные произведения выписаны в решении — они от пятидесяти шести до девяноста девяти. Ответ: тридцать пять."}],"rich":true}],"tags":["est"],"facts":["est_ex","extreme"],"note":"","n":21},{"id":"26707","d":2,"from":"PDF №029","stem":"Из первых 22 натуральных чисел 1, 2, …, 22 выбрали 2k различных чисел. Выбранные числа разбили на пары и посчитали суммы чисел в каждой паре. Оказалось, что все полученные суммы различны и не превосходят 27.","parts":[{"l":"а","q":"Может ли получиться так, что сумма всех 2k выбранных чисел равняется 170 и в каждой паре одно из чисел ровно в три раза больше другого?","ak":"yn","av":"НЕТ","steps":[{"w":["💡 **Идея:** если в паре числа x и 3x, то сумма пары","=x + 3x = 4x — делится на 4","👉 Значит, **сумма всех** выбранных чисел делится на 4.","❌ 170 на 4 не делится.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Если в каждой паре одно число втрое больше другого, то сумма пары — это четыре раза меньшее число, то есть она делится на четыре."},{"b":0,"s":"Тогда и сумма всех выбранных чисел — сумма всех пар — делится на четыре. А сто семьдесят на четыре не делится. Ответ: нет."}],"rich":true},{"l":"б","q":"Может ли число k быть равным 11?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 k = 11 → выбраны **все 22 числа**:","=1 + 2 + … + 22 = 253"],"f":["sum_1n"]},{"w":["📌 11 **разных** сумм, каждая ≤ 27 — их сумма не больше","=27 + 26 + … + 17 = 242","❌ 242 \u003c 253.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Если ка равно одиннадцати, то выбраны все двадцать два числа, и их общая сумма двести пятьдесят три."},{"b":0,"f":"sum_1n"},{"b":1,"s":"С другой стороны, это одиннадцать разных сумм пар, и каждая не больше двадцати семи. Самое большее — это двадцать семь, двадцать шесть и так далее до семнадцати, всего двести сорок два. Меньше, чем двести пятьдесят три. Противоречие. Ответ: нет."}],"rich":true},{"l":"в","q":"Найдите наибольшее возможное значение числа k.","ak":"num","av":"10","steps":[{"w":["📏 **Оценка:** k = 11 нельзя (пункт б) → **k ≤ 10**."],"f":[]},{"w":["🔨 **Пример для k = 10** — суммы пар 18, 19, …, 27:","=(1; 17), (3; 16), (2; 18), (6; 15), (9; 13),","=(11; 12), (10; 14), (4; 21), (7; 19), (5; 22)","✅ **Ответ: 10.**"],"f":[]}],"v":[{"b":0,"s":"Ищем наибольшее ка. Из пункта бэ мы знаем, что одиннадцать не получится, значит, ка не больше десяти."},{"b":1,"s":"Осталось построить пример с десятью парами. Удобно сделать так, чтобы суммы пар были подряд: восемнадцать, девятнадцать и так далее до двадцати семи. Подбираем пары так, чтобы все числа были разными — например, как в решении. Ответ: десять."}],"rich":true}],"tags":["est"],"facts":["sum_1n","div_def","est_ex"],"note":"","n":22},{"id":"159865","d":2,"from":"PDF №032","stem":"Маша и Наташа делали фотографии в течении некоторого количества подряд идущих дней. В первый день Маша сделала m фотографий, а Наташа — n фотографий. В каждый следующий день каждая из девочек делала на одну фотографию больше, чем в предыдущий. Известно, что в общей сложности Наташа сделала суммарно на 1001 фотографию больше, чем Маша, и что фотографировали они больше одного дня.","parts":[{"l":"а","q":"Могли ли они фотографировать в течение 7 дней?","ak":"yn","av":"ДА","steps":[{"w":["💡 **Идея:** каждый день Наташа делает на **n − m** фото больше Маши.","✏️ Пусть фотографировали **k** дней:","=k·(n − m) = 1001 = 7·11·13"],"f":[]},{"w":["🔨 **k = 7:**","=n − m = 143,   например m = 1,  n = 144","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Обе девочки каждый день добавляют по одной фотографии, поэтому разница между ними каждый день одна и та же — эн минус эм. Пусть они фотографировали ка дней. Тогда за все дни Наташа сделала на ка раз эн минус эм фотографий больше."},{"b":0,"s":"Значит, ка, умноженное на эн минус эм, равно тысяче одной. Разложим тысячу одну: семь на одиннадцать на тринадцать. Значит, ка — делитель тысячи одной."},{"b":1,"s":"Семь — делитель тысячи одной, поэтому семь дней возможны: тогда эн минус эм равно ста сорока трём. Например, Маша начала с одной фотографии, а Наташа со ста сорока четырёх. Ответ: да."}],"rich":true},{"l":"б","q":"Могли ли они фотографировать в течение 8 дней?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 k должно быть делителем 1001.","❌ 1001 нечётное, на 8 не делится.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Число дней должно быть делителем тысячи одной. Но тысяча одна нечётная, на восемь она не делится. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое наибольшее суммарное число фотографий могла сделать Наташа за все дни фотографирования, если известно, что в последний день Маша сделала меньше 40 фотографий?","ak":"num","av":"1430","steps":[{"w":["📌 Маша в последний день сделала m + k − 1 \u003c 40 фото → **k \u003c 40**.","📌 k — делитель 1001, больше 1 → **k = 7, 11 или 13**."],"f":[]},{"w":["📌 Наташа за все дни:","=k·m + 1001 + k(k − 1) : 2","👉 Чем больше m, тем лучше → берём **m = 40 − k**."],"f":["ap"]},{"w":["🔎 Считаем:","=k = 7:  1253,     k = 11:  1375,     k = 13:  1430","🔨 **Пример:** 13 дней, m = 27, n = 104.","✅ **Ответ: 1430.**"],"f":[]}],"v":[{"b":0,"s":"Маша в последний день сделала эм плюс ка минус одну фотографию, и это меньше сорока. Значит, дней меньше сорока. А число дней — делитель тысячи одной, больший единицы. Подходят только семь, одиннадцать и тринадцать."},{"b":1,"s":"Посчитаем, сколько всего сняла Наташа. Это столько же, сколько Маша, плюс тысяча одна. А Маша за ка дней сняла ка раз по эм плюс ещё ноль, один, два и так далее — формула в решении."},{"b":1,"f":"ap"},{"b":1,"s":"Чем больше эм, тем больше фотографий, поэтому берём эм наибольшим: так, чтобы в последний день у Маши было ровно тридцать девять."},{"b":2,"s":"Считаем для каждого из трёх вариантов числа дней. Больше всего получается при тринадцати днях — тысяча четыреста тридцать. Пример: тринадцать дней, Маша начинает с двадцати семи, Наташа со ста четырёх. Ответ: тысяча четыреста тридцать."}],"rich":true}],"tags":["seq","div"],"facts":["ap","fta","est_ex"],"note":"","n":23},{"id":"63290","d":2,"from":"PDF №035","stem":"В классе больше 10, но не больше 26 учащихся, а доля девочек не превышает 21%.","parts":[{"l":"а","q":"Может ли в этом классе быть 5 девочек?","ak":"yn","av":"ДА","steps":[{"w":["🔨 **Пример:** 24 ученика, из них 5 девочек.","=5 : 24 ≈ 20,8% ≤ 21% ✔️","✅ **Ответ: да.**"],"f":["percent"]}],"v":[{"b":0,"s":"Пять девочек — это не больше двадцати одного процента, если учеников достаточно много. Возьмём двадцать четыре ученика: пять из двадцати четырёх — примерно двадцать целых восемь десятых процента. Подходит. Ответ: да."},{"b":0,"f":"percent"}],"rich":true},{"l":"б","q":"Может ли доля девочек составить 30%, если в этот класс придёт новая девочка?","ak":"yn","av":"НЕТ","steps":[{"w":["✏️ Было **n** учеников (от 11 до 26), стало n + 1 (от 12 до 27).","📌 30% от n + 1 — целое число → **n + 1 кратно 10** → n + 1 = 20.","=девочек стало 6, было 5"],"f":[]},{"w":["🔎 Проверяем, как было:","=5 : 19 ≈ 26% > 21%","❌ Противоречит условию.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Пусть в классе было эн учеников, а стало на одного больше. Тридцать процентов от числа учеников — это целое число девочек, поэтому новое число учеников делится на десять. В нашем диапазоне это только двадцать."},{"b":0,"s":"Тридцать процентов от двадцати — шесть девочек. Значит, до прихода новенькой девочек было пять из девятнадцати."},{"b":1,"s":"Но пять из девятнадцати — это около двадцати шести процентов, а по условию было не больше двадцати одного. Противоречие. Ответ: нет."}],"rich":true},{"l":"в","q":"В этот класс пришла новая девочка. Доля девочек в классе составила целое число процентов. Какое наибольшее число процентов может составить доля девочек в классе?","ak":"num","av":"25","steps":[{"w":["💡 **Идея:** переберём число учеников n и возьмём **наибольшее** допустимое число девочек.","📌 Нужна доля (g + 1) : (n + 1) — целое число процентов."],"f":[]},{"w":["🔎 Наибольшая доля получается при:","=n = 11, g = 2:  3 : 12 = 25%","=n = 15, g = 3:  4 : 16 = 25%","📌 При остальных n доля меньше 25% (например, 6 : 25 = 24%)."],"f":[]},{"w":["🔨 **Пример:** было 15 учеников, 3 девочки (20%), пришла девочка → 4 из 16 = 25%.","✅ **Ответ: 25.**"],"f":[]}],"v":[{"b":0,"s":"Ищем наибольший процент. Чтобы доля после прихода девочки была большой, девочек должно быть как можно больше — столько, сколько позволяет ограничение в двадцать один процент."},{"b":1,"s":"Перебираем число учеников от одиннадцати до двадцати шести. Лучше всего получается в двух случаях: одиннадцать учеников с двумя девочками и пятнадцать учеников с тремя девочками. После прихода новенькой это три из двенадцати и четыре из шестнадцати — в обоих случаях ровно четверть, двадцать пять процентов."},{"b":1,"s":"В остальных случаях доля выходит меньше двадцати пяти процентов."},{"b":2,"s":"Пример: в классе было пятнадцать учеников и три девочки — это двадцать процентов. Пришла девочка — стало четыре из шестнадцати, двадцать пять процентов. Ответ: двадцать пять."}],"rich":true}],"tags":["avg"],"facts":["percent","est_ex"],"note":"","n":24},{"id":"159692","d":2,"from":"PDF №038","stem":"На доске написано несколько различных натуральных чисел, в записи которых могут быть только цифры 4 и 9 (возможно, только одна из этих цифр).","parts":[{"l":"а","q":"Может ли сумма этих чисел быть равна 107?","ak":"yn","av":"ДА","steps":[{"w":["🔨 **Пример:**","=94 + 9 + 4 = 107","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Подберём пример. Девяносто четыре плюс девять плюс четыре — ровно сто семь. Все числа разные и состоят из четвёрок и девяток. Ответ: да."}],"rich":true},{"l":"б","q":"Может ли сумма этих чисел быть равна 289?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Числа из 4 и 9, не больше 289:","=4, 9, 44, 49, 94, 99   (444 уже больше)","=4 + 9 + 44 + 49 + 94 + 99 = 299"],"f":[]},{"w":["💡 **Идея:** сумма 289 — это все числа, **кроме** нескольких с суммой 10.","❌ Из этих чисел 10 не составить.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Выпишем все числа из четвёрок и девяток, которые не больше двухсот восьмидесяти девяти. Их всего шесть, и вместе они дают двести девяносто девять."},{"b":1,"s":"Чтобы получить двести восемьдесят девять, нужно не взять какие-то числа с суммой ровно десять. Но из четырёх, девяти и больших чисел десять не составить. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое наименьшее количество чисел может быть на доске, если их сумма равна 3986?","ak":"num","av":"9","steps":[{"w":["💡 **Идея:** каждое число оканчивается на 4 или 9 → при делении на 5 даёт остаток **4**.","📌 k чисел дают остаток, как у 4k, а 3986 даёт остаток 1.","=4k ≡ 1 (mod 5)   →   k = 4, 9, 14, …"],"f":["mod_def"]},{"w":["📏 **Оценка:** 4 числа дают не больше","=999 + 994 + 949 + 944 = 3886 \u003c 3986","👉 Четырёхзначные числа из 4 и 9 больше 3986. Значит, **k ≥ 9**."],"f":[]},{"w":["🔨 **Пример:**","=4 + 9 + 44 + 49 + 444 + 494 + 949 + 994 + 999 = 3986","✅ **Ответ: 9.**"],"f":["est_ex"]}],"v":[{"b":0,"s":"Посмотрим на остатки при делении на пять. Каждое наше число оканчивается на четыре или на девять, поэтому при делении на пять даёт остаток четыре."},{"b":0,"f":"mod_def"},{"b":0,"s":"Значит, сумма ка чисел даёт такой же остаток, как четыре ка. А три тысячи девятьсот восемьдесят шесть даёт остаток один. Подходят только ка, равные четырём, девяти, четырнадцати и так далее."},{"b":1,"s":"Проверим четыре числа. Четырёхзначные числа из четвёрок и девяток слишком большие, поэтому берём четыре самых больших трёхзначных. Их сумма три тысячи восемьсот восемьдесят шесть — не хватает. Значит, чисел хотя бы девять."},{"b":2,"s":"А девятью числами получить можно — пример в решении. Ответ: девять."},{"b":2,"f":"est_ex"}],"rich":true}],"tags":["digits"],"facts":["last_digit","mod_def","est_ex"],"note":"","n":25},{"id":"159639","d":2,"from":"PDF №039","stem":"C трёхзначным числом производят следующую операцию: к нему прибавляют цифру десятков умноженную на 10, а затем к получившейся сумме прибавляют 3.","parts":[{"l":"а","q":"Могло ли в результате такой операции получиться число 224?","ak":"yn","av":"ДА","steps":[{"w":["✏️ Число с цифрами a, b, c:","=N = 100a + 10b + c","📌 После операции:","=100a + 10b + c + 10b + 3 = 100a + 20b + c + 3"],"f":["dec_repr"]},{"w":["🔎 Нужно 100a + 20b + c = 221:","=a = 2,   b = 1,   c = 1","🔨 **Проверка:** 211 + 10 + 3 = 224 ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Запишем трёхзначное число через его цифры: а сотен, бэ десятков и цэ единиц."},{"b":0,"f":"dec_repr"},{"b":0,"s":"К числу прибавляют ещё десять бэ и три. Получается, что десятки учитываются дважды — формула в решении."},{"b":1,"s":"Нам нужно, чтобы без тройки получилось двести двадцать один. Подходит число двести одиннадцать: прибавляем десять и три — получаем двести двадцать четыре. Ответ: да."}],"rich":true},{"l":"б","q":"Могло ли в результате такой операции получиться число 314?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Нужно 100a + 20b + c = 311.","👉 **a = 3:** 20b + c = 11 → b = 0, c = 11 — не цифра ❌","👉 **a = 2:** 20b + c = 111 → 20b от 102 до 111 (c — цифра) — таких b нет ❌","👉 **a = 1:** 20b + c = 211 > 189 ❌","✅ **Ответ: нет.**"],"f":["mod_cases"]}],"v":[{"b":0,"s":"Теперь нужно, чтобы сто а плюс двадцать бэ плюс цэ было триста одиннадцать. Переберём цифру сотен."},{"b":0,"s":"Если сотен три, то на двадцать бэ плюс цэ остаётся одиннадцать — тогда цэ должно быть одиннадцать, а это не цифра. Если сотни две, остаётся сто одиннадцать, но цэ не больше девяти, и двадцать бэ должно быть от ста двух до ста одиннадцати — таких чисел, кратных двадцати, нет. Если сотня одна, остаётся слишком много."},{"b":0,"f":"mod_cases"},{"b":0,"s":"Ни один вариант не подходит. Ответ: нет."}],"rich":true},{"l":"в","q":"Найдите наибольшее отношение получившегося числа к исходному.","ak":"num","av":"283/190","steps":[{"w":["📌 Отношение:","=(N + 10b + 3) : N = 1 + (10b + 3) : (100a + 10b + c)","💡 Дробь больше, когда **знаменатель меньше**: a = 1, c = 0."],"f":[]},{"w":["📌 Дробь (10b + 3) : (100 + 10b) растёт вместе с b → **b = 9**.","=190 → 190 + 90 + 3 = 283","✅ **Ответ: 283/190.**"],"f":["frac_monot"]}],"v":[{"b":0,"s":"Запишем отношение нового числа к старому. Это единица плюс дробь: в числителе десять бэ плюс три, в знаменателе само число."},{"b":0,"s":"Чтобы дробь была как можно больше, знаменатель должен быть маленьким. Цифры а и цэ влияют только на знаменатель, поэтому берём их наименьшими: а равно одному, цэ равно нулю."},{"b":1,"s":"Остаётся дробь, где бэ есть и в числителе, и в знаменателе. Такая дробь растёт, когда бэ растёт, поэтому берём бэ равным девяти."},{"b":1,"f":"frac_monot"},{"b":1,"s":"Получается число сто девяносто, которое превращается в двести восемьдесят три. Ответ: двести восемьдесят три сто девяностых."}],"rich":true}],"tags":["digits"],"facts":["dec_repr","frac_monot"],"note":"В ключе файла к пункту в) указано 51 (вероятно, ответ перепутан с задачей 40). По условию, как оно записано, наибольшее отношение 283/190 (число 190).","n":26},{"id":"159633","d":2,"from":"PDF №040","stem":"C трёхзначным числом производят следующую операцию: вычитают из него сумму его цифр, а затем получившуюся разность делят на 3.","parts":[{"l":"а","q":"Может ли в результате такой операции получиться число 300?","ak":"yn","av":"ДА","steps":[{"w":["✏️ Число 100a + 10b + c, сумма цифр a + b + c:","=(100a + 10b + c − a − b − c) : 3 = (99a + 9b) : 3 = 33a + 3b"],"f":["dec_repr"]},{"w":["🔎 Нужно 33a + 3b = 300, то есть 11a + b = 100:","=a = 9,   b = 1","🔨 **Пример:** 910 → (910 − 10) : 3 = 300 ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Запишем число через цифры и вычтем сумму цифр. Цифра единиц сокращается полностью, и остаётся девяносто девять а плюс девять бэ. Делим на три — получаем тридцать три а плюс три бэ."},{"b":0,"f":"dec_repr"},{"b":1,"s":"Нужно, чтобы это равнялось трёмстам. Сократим на три: одиннадцать а плюс бэ равно ста. Подходит а равное девяти и бэ равное одному. Например, число девятьсот десять: вычитаем десять, делим на три — ровно триста. Ответ: да."}],"rich":true},{"l":"б","q":"Может ли в результате такой операции получиться число 151?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Результат 33a + 3b = 3·(11a + b) — **всегда делится на 3**.","❌ 151 на 3 не делится.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Из пункта а: результат равен тридцати трём а плюс три бэ, это три, умноженное на что-то. Значит, результат всегда делится на три. А сто пятьдесят один на три не делится. Ответ: нет."}],"rich":true},{"l":"в","q":"Сколько различных чисел может получиться в результате такой операции из чисел от 100 до 600 включительно?","ak":"num","av":"51","steps":[{"w":["📌 Результат = 3·(11a + b), и b ≤ 9 \u003c 11.","👉 Разные пары (a, b) дают **разные** результаты (как цифры числа в «одиннадцатеричной» записи)."],"f":[]},{"w":["🔎 Числа от 100 до 599: a от 1 до 5, b от 0 до 9 → **50** результатов.","👉 Число 600 даёт ещё один (a = 6, b = 0).","=50 + 1 = 51","✅ **Ответ: 51.**"],"f":[]}],"v":[{"b":0,"s":"Результат зависит только от цифр а и бэ: это три раза одиннадцать а плюс бэ. Важно, что бэ не больше девяти, то есть меньше одиннадцати. Поэтому по результату можно однозначно восстановить и а, и бэ. Значит, разные пары цифр дают разные результаты."},{"b":1,"s":"Числа от ста до пятисот девяноста девяти дают пять вариантов для а и десять для бэ — пятьдесят разных результатов. И ещё число шестьсот даёт свой, новый результат. Всего пятьдесят один. Ответ: пятьдесят один."}],"rich":true}],"tags":["digits"],"facts":["dec_repr","div_sum","est_ex"],"note":"","n":27},{"id":"159664","d":2,"from":"PDF №042","stem":"Дано трёхзначное натуральное число, не кратное 100.","parts":[{"l":"а","q":"Может ли частное этого числа и суммы его цифр быть равным 11?","ak":"yn","av":"ДА","steps":[{"w":["🔨 **Пример:** 198","=1 + 9 + 8 = 18,     198 : 18 = 11 ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Подберём пример. Число сто девяносто восемь: сумма цифр восемнадцать, а сто девяносто восемь, делённое на восемнадцать, — ровно одиннадцать. Ответ: да."}],"rich":true},{"l":"б","q":"Может ли частное этого числа и суммы его цифр быть равным 5?","ak":"yn","av":"НЕТ","steps":[{"w":["✏️ Число 100a + 10b + c, сумма цифр a + b + c:","=100a + 10b + c = 5(a + b + c)   →   95a + 5b = 4c"],"f":[]},{"w":["❌ Слева не меньше 95, а справа не больше 4·9 = 36.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Запишем число через цифры и приравняем к пяти суммам цифр. После переноса всё влево получаем: девяносто пять а плюс пять бэ равно четырём цэ."},{"b":1,"s":"Но слева не меньше девяноста пяти, ведь а хотя бы один, а справа не больше тридцати шести. Равенство невозможно. Ответ: нет."}],"rich":true},{"l":"в","q":"Какое наибольшее натуральное значение может иметь частное данного числа и суммы его цифр, если первая цифра данного числа равна 7?","ak":"num","av":"80","steps":[{"w":["✏️ Число 7bc, сумма цифр **s = 7 + b + c**.","📌 Число не 700 (кратно 100) → **s ≥ 8**."],"f":[]},{"w":["🔎 **s = 8:** числа 710, 701 — не делятся на 8 ❌","🔎 **s = 9:** число 720 — 720 : 9 = **80** ✔️","📏 **s ≥ 10:** частное ≤ 799 : 10 \u003c 80"],"f":[]},{"w":["✅ **Ответ: 80** (число 720)."],"f":[]}],"v":[{"b":0,"s":"Число начинается с семёрки, значит, оно от семисот до семисот девяноста девяти. Чтобы частное было большим, сумма цифр должна быть маленькой. Сумма цифр не меньше восьми — ведь семьсот брать нельзя."},{"b":1,"s":"Проверим сумму цифр восемь: это числа семьсот десять и семьсот один, но на восемь они не делятся. Проверим сумму девять: подходит семьсот двадцать, частное восемьдесят."},{"b":1,"s":"А если сумма цифр десять или больше, то частное меньше, чем восемьсот на десять, то есть меньше восьмидесяти. Это оценка."},{"b":2,"s":"Значит, наибольшее частное восемьдесят. Ответ: восемьдесят."}],"rich":true}],"tags":["digits"],"facts":["dec_repr","est_ex"],"note":"","n":28},{"id":"91284","d":2,"from":"PDF №044","stem":"На доске написали несколько не обязательно различных двузначных натуральных чисел без нулей в десятичной записи. Сумма этих чисел оказалась равной 264. В каждом числе поменяли местами первую и вторую цифры, например, число 17 заменили на число 71.","parts":[{"l":"а","q":"Приведите пример исходных чисел, для которых сумма получившихся чисел ровно в 4 раза больше, чем сумма исходных чисел.","ak":"self","av":"Например, десять чисел 19 и числа 39, 35.","steps":[{"w":["✏️ **A** — сумма цифр десятков, **B** — сумма цифр единиц.","=сумма исходных:  10A + B = 264","=сумма новых:  10B + A = 4·264 = 1056","=A = 16,     B = 104"],"f":["dec_repr"]},{"w":["📌 Сколько может быть чисел k: каждая цифра от 1 до 9 → A ≥ k и B ≤ 9k → **12 ≤ k ≤ 16**.","🔨 **Пример, k = 12:** десять чисел 19, а также 39 и 35:","=190 + 39 + 35 = 264,     910 + 93 + 53 = 1056 ✔️"],"f":[]}],"v":[{"b":0,"s":"Главная идея: не важно, какие именно числа, важны только две суммы. Пусть А — сумма всех цифр десятков, а Бэ — сумма всех цифр единиц. Тогда сумма чисел равна десяти А плюс Бэ."},{"b":0,"f":"dec_repr"},{"b":0,"s":"После перестановки цифр десятки и единицы меняются местами, и сумма становится десять Бэ плюс А. Получаем систему из двух уравнений. Решив её, находим: А шестнадцать, Бэ сто четыре."},{"b":1,"s":"Теперь подберём числа. Цифры от одного до девяти, поэтому если чисел ка, то А не меньше ка, а Бэ не больше девяти ка. Отсюда чисел от двенадцати до шестнадцати."},{"b":1,"s":"Возьмём двенадцать чисел: десять чисел девятнадцать и ещё тридцать девять и тридцать пять. Проверка — в решении."}],"rich":true},{"l":"б","q":"Могла ли сумма получившихся чисел быть ровно в 2 раза больше, чем сумма исходных чисел?","ak":"yn","av":"НЕТ","steps":[{"w":["=10A + B = 264,     10B + A = 528","📌 Выразим B:","=99B = 5280 − 264 = 5016   →   B = 50,67…","❌ B должно быть целым.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Используем те же суммы цифр А и Бэ. Теперь сумма после перестановки вдвое больше, то есть пятьсот двадцать восемь."},{"b":0,"s":"Решаем систему: умножим второе уравнение на десять и вычтем первое — получится девяносто девять Бэ равно пяти тысячам шестнадцати. Но это число на девяносто девять не делится, и Бэ выходит дробным. А сумма цифр — целое число. Ответ: нет."}],"rich":true},{"l":"в","q":"Найдите наибольшее возможное значение суммы получившихся чисел.","ak":"num","av":"1254","steps":[{"w":["📌 Новая сумма через A:","=10B + A = 10(264 − 10A) + A = 2640 − 99A","💡 Чтобы она была больше — **A как можно меньше**."],"f":[]},{"w":["📏 **Оценка:** чисел k ≤ A, а B ≤ 9k ≤ 9A:","=264 − 10A ≤ 9A   →   A ≥ 14"],"f":["est_ex"]},{"w":["🔨 **Пример, A = 14:** двенадцать чисел 19 и два числа 18:","=228 + 36 = 264   →   1092 + 162 = 1254","✅ **Ответ: 1254.**"],"f":[]}],"v":[{"b":0,"s":"Выразим новую сумму через А. Получается две тысячи шестьсот сорок минус девяносто девять А. Чем меньше А, тем больше новая сумма."},{"b":1,"s":"Но А не может быть слишком маленьким. Чисел не больше, чем А, а каждая цифра единиц не больше девяти, поэтому Бэ не больше девяти А. Подставив Бэ, получаем, что А не меньше четырнадцати."},{"b":1,"f":"est_ex"},{"b":2,"s":"Пример с А равным четырнадцати: двенадцать чисел девятнадцать и два числа восемнадцать. Сумма двести шестьдесят четыре, а после перестановки — тысяча двести пятьдесят четыре. Ответ: тысяча двести пятьдесят четыре."}],"rich":true}],"tags":["digits"],"facts":["dec_repr","lin_dioph","est_ex"],"note":"","n":29},{"id":"91286","d":2,"from":"PDF №045","stem":"На доске написали несколько не обязательно различных двузначных натуральных чисел без нулей в десятичной записи. Сумма этих чисел оказалась равной 2376. В каждом числе поменяли местами первую и вторую цифры, например, число 17 заменили на число 71.","parts":[{"l":"а","q":"Приведите пример исходных чисел, для которых сумма получившихся чисел ровно в 3 раза больше, чем сумма исходных чисел.","ak":"self","av":"Например, 66 чисел 29, 11 чисел 39 и одно 33.","steps":[{"w":["✏️ **A** — сумма цифр десятков, **B** — единиц:","=10A + B = 2376,     10B + A = 3·2376 = 7128","=A = 168,     B = 696"],"f":[]},{"w":["📌 Чисел k: B ≤ 9k → k ≥ 78, и k ≤ A = 168. Берём **k = 78**.","👉 Единицы: 77 девяток и одна тройка → 696","👉 Десятки: 66 двоек и 12 троек → 168"],"f":[]},{"w":["🔨 **Пример:** 66 чисел 29, 11 чисел 39 и одно 33:","=1914 + 429 + 33 = 2376","=после перестановки:  6072 + 1023 + 33 = 7128 ✔️"],"f":[]}],"v":[{"b":0,"s":"Снова работаем с суммами цифр: А — сумма цифр десятков, Бэ — сумма цифр единиц. Составляем два уравнения — для исходной суммы и для суммы после перестановки. Решив систему, получаем: А сто шестьдесят восемь, Бэ шестьсот девяносто шесть."},{"b":1,"s":"Теперь подбираем сами числа. Бэ большое, поэтому чисел нужно много: каждое даёт не больше девяти единиц, так что чисел хотя бы семьдесят восемь. Возьмём ровно семьдесят восемь."},{"b":1,"s":"Цифры единиц: семьдесят семь девяток и одна тройка — вместе как раз шестьсот девяносто шесть. Цифры десятков: шестьдесят шесть двоек и двенадцать троек — сто шестьдесят восемь."},{"b":2,"s":"Собираем числа: шестьдесят шесть чисел двадцать девять, одиннадцать чисел тридцать девять и одно тридцать три. Проверка в решении."}],"rich":true},{"l":"б","q":"Могла ли сумма получившихся чисел быть ровно в 6 раз больше, чем сумма исходных чисел?","ak":"yn","av":"НЕТ","steps":[{"w":["=10A + B = 2376,     10B + A = 6·2376","=B = 1416,     A = 96"],"f":[]},{"w":["📌 Чисел k ≤ A = 96 → B ≤ 9k ≤ 864.","❌ А B = 1416 > 864.","✅ **Ответ: нет.**"],"f":[]}],"v":[{"b":0,"s":"Составляем ту же систему, только новая сумма в шесть раз больше. Получаем: Бэ тысяча четыреста шестнадцать, А девяносто шесть."},{"b":1,"s":"Но цифр десятков столько же, сколько чисел, и каждая хотя бы один, поэтому чисел не больше девяноста шести. А тогда сумма цифр единиц не больше девяти на девяносто шесть, то есть восьмисот шестидесяти четырёх. Это меньше, чем нужно. Ответ: нет."}],"rich":true},{"l":"в","q":"Найдите наибольшее возможное значение суммы получившихся чисел.","ak":"num","av":"11286","steps":[{"w":["📌 Новая сумма:","=10B + A = 10(2376 − 10A) + A = 23760 − 99A","💡 Делаем **A как можно меньше**."],"f":[]},{"w":["📏 **Оценка:** B ≤ 9k ≤ 9A:","=2376 − 10A ≤ 9A   →   A ≥ 126"],"f":[]},{"w":["🔨 **Пример, A = 126:** 123 числа 19 и 3 числа 13:","=2337 + 39 = 2376   →   11193 + 93 = 11286","✅ **Ответ: 11 286.**"],"f":[]}],"v":[{"b":0,"s":"Как и в задаче с суммой двести шестьдесят четыре, выразим новую сумму через А. Чем меньше А, тем больше новая сумма."},{"b":1,"s":"Ограничение то же: Бэ не больше девяти раз по числу чисел, а чисел не больше А. Отсюда А не меньше ста двадцати шести."},{"b":2,"s":"Пример: сто двадцать три числа девятнадцать и три числа тринадцать. Их сумма две тысячи триста семьдесят шесть, а после перестановки — одиннадцать тысяч двести восемьдесят шесть. Ответ: одиннадцать тысяч двести восемьдесят шесть."}],"rich":true}],"tags":["digits"],"facts":["dec_repr","lin_dioph","est_ex"],"note":"","n":30},{"id":"47426","d":2,"from":"PDF №047","stem":"На доске написаны три различных натуральных числа. Второе число равно сумме цифр первого, а третье равно сумме цифр второго.","parts":[{"l":"а","q":"Может ли сумма этих чисел быть равна 2022?","ak":"yn","av":"ДА","steps":[{"w":["🔨 **Пример:** 1994 → 1 + 9 + 9 + 4 = 23 → 2 + 3 = 5","=1994 + 23 + 5 = 2022 ✔️","✅ **Ответ: да.**"],"f":[]}],"v":[{"b":0,"s":"Подберём пример. Возьмём тысяча девятьсот девяносто четыре. Сумма его цифр двадцать три, а сумма цифр двадцати трёх — пять. Вместе ровно две тысячи двадцать два. Ответ: да."}],"rich":true},{"l":"б","q":"Может ли сумма этих чисел быть равна 2021?","ak":"yn","av":"НЕТ","steps":[{"w":["💡 **Идея:** число и его сумма цифр дают **одинаковый остаток** при делении на 9.","📌 Все три числа дают один и тот же остаток → сумма как 3x:","👉 остаток суммы при делении на 9 — только **0, 3 или 6**.","❌ 2021 даёт остаток 5.","✅ **Ответ: нет.**"],"f":["ds_mod9"]}],"v":[{"b":0,"s":"Вспомним важное свойство суммы цифр."},{"b":0,"f":"ds_mod9"},{"b":0,"s":"Значит, все три числа на доске дают одинаковый остаток при делении на девять. Тогда их сумма — это как три одинаковых остатка, и остаток суммы может быть только ноль, три или шесть."},{"b":0,"s":"А две тысячи двадцать одна при делении на девять даёт остаток пять. Ответ: нет."}],"rich":true},{"l":"в","q":"В тройке чисел первое число трёхзначное, а третье равно 2. Сколько существует таких троек?","ak":"num","av":"97","steps":[{"w":["📌 Сумма цифр трёхзначного ≤ 27, значит, второе число не больше 27.","📌 Сумма цифр второго равна 2 → второе: 2, 11 или 20.","👉 Числа различны → второе **11 или 20**."],"f":[]},{"w":["🔎 Считаем трёхзначные числа:","👉 с суммой цифр **11** — 61 число","👉 с суммой цифр **20** — 36 чисел","=61 + 36 = 97","✅ **Ответ: 97.**"],"f":[]}],"v":[{"b":0,"s":"Третье число — два, это сумма цифр второго. А второе — сумма цифр трёхзначного числа, поэтому оно не больше двадцати семи. Числа до двадцати семи с суммой цифр два — это два, одиннадцать и двадцать. Двойку брать нельзя: числа должны быть разными."},{"b":1,"s":"Значит, осталось посчитать трёхзначные числа с суммой цифр одиннадцать и с суммой цифр двадцать. Удобно перебирать первую цифру и для каждой считать, сколькими способами добрать остальные две. Получается шестьдесят одно и тридцать шесть чисел."},{"b":1,"s":"Вместе девяносто семь троек. Ответ: девяносто семь."}],"rich":true}],"tags":["digits"],"facts":["ds_mod9","est_ex"],"note":"","n":31},{"id":"16737","d":2,"from":"PDF №061","stem":"Квадратное уравнение x² + px + q = 0 имеет два различных натуральных корня.","parts":[{"l":"а","q":"Пусть q = 55. Найдите все возможные значения p.","ak":"set","av":"-56;-16","steps":[{"w":["✏️ Корни **u \u003c v** — натуральные. По теореме Виета:","=u·v = q = 55,     p = −(u + v)","🔎 55 = 1·55 = 5·11:","=p = −56   или   p = −16","✅ **Ответ: −56; −16.**"],"f":["vieta"]}],"v":[{"b":0,"f":"vieta"},{"b":0,"s":"Пусть корни — натуральные числа у и вэ. По теореме Виета их произведение пятьдесят пять, а пэ — их сумма со знаком минус."},{"b":0,"s":"Пятьдесят пять раскладывается на два разных натуральных множителя двумя способами: один на пятьдесят пять или пять на одиннадцать. Суммы — пятьдесят шесть и шестнадцать. Ответ: минус пятьдесят шесть и минус шестнадцать."}],"rich":true},{"l":"б","q":"Пусть p + q = 30. Найдите все возможные значения q.","ak":"num","av":"64","steps":[{"w":["📌 p + q = uv − u − v = 30.","💡 **Идея:** дополним до произведения скобок:","=(u − 1)(v − 1) = 31"],"f":["factor"]},{"w":["📌 31 — простое → u − 1 = 1, v − 1 = 31:","=u = 2,   v = 32,   q = 64","✅ **Ответ: 64.**"],"f":[]}],"v":[{"b":0,"s":"По Виета пэ плюс ку — это произведение корней минус их сумма. Такое выражение удобно превратить в произведение скобок: если прибавить единицу, получится у минус один, умноженное на вэ минус один."},{"b":0,"f":"factor"},{"b":1,"s":"Получаем, что произведение двух натуральных чисел равно тридцати одному, а это простое число. Значит, одна скобка равна единице, другая — тридцати одному. Корни два и тридцать два, а ку — их произведение, шестьдесят четыре. Ответ: шестьдесят четыре."}],"rich":true},{"l":"в","q":"Пусть q² − p² = 2108. Найдите все возможные корни исходного уравнения.","ak":"set","av":"6;8","steps":[{"w":["📌 Разность квадратов:","=q² − p² = (q − p)(q + p) = (uv + u + v)(uv − u − v) = 2108","=2108 = 2·2·17·31","📌 Множители одной чётности → **оба чётные**: (2; 1054) или (34; 62)."],"f":[]},{"w":["🔎 **(34; 62):** u + v = (62 − 34) : 2 = 14,   uv = (62 + 34) : 2 = 48","=корни 6 и 8 ✔️","🔎 **(2; 1054):** u + v = 526, uv = 528 — натуральных корней нет ❌","✅ **Ответ: 6; 8.**"],"f":[]}],"v":[{"b":0,"s":"Ку в квадрате минус пэ в квадрате — это разность квадратов, она раскладывается на произведение двух скобок. Через корни эти скобки — произведение корней плюс сумма и произведение корней минус сумма."},{"b":0,"s":"Две тысячи сто восемь раскладываем на простые множители. Скобки отличаются на удвоенную сумму корней, то есть они одной чётности. Поэтому обе чётные, и остаётся всего два варианта — они выписаны в решении."},{"b":1,"s":"Для каждого варианта находим сумму и произведение корней. Во втором варианте корни получаются шесть и восемь — подходит. В первом натуральных корней с такими суммой и произведением нет. Ответ: шесть и восемь."}],"rich":true}],"tags":["eq"],"facts":["vieta","factor","est_ex"],"note":"","n":32},{"id":"2447","d":2,"from":"PDF №065","stem":"На доске написано 30 различных натуральных чисел, десятичная запись каждого из которых оканчивается или на цифру 4, или на цифру 8. Сумма написанных чисел равна 2786.","parts":[{"l":"а","q":"Может ли на доске быть поровну чисел, оканчивающихся на 4 и на 8?","ak":"yn","av":"НЕТ","steps":[{"w":["💡 **Идея:** смотрим на **последнюю цифру** суммы.","📌 15 чисел на 4 и 15 чисел на 8:","=15·4 + 15·8 = 180  →  сумма оканчивается на **0**","❌ А 2786 оканчивается на 6.","✅ **Ответ: нет.**"],"f":["last_digit"]}],"v":[{"b":0,"s":"Последняя цифра суммы зависит только от последних цифр чисел."},{"b":0,"f":"last_digit"},{"b":0,"s":"Если чисел на четыре и на восемь поровну, по пятнадцать, то последняя цифра суммы такая же, как у ста восьмидесяти, то есть ноль. А наша сумма оканчивается на шесть. Ответ: нет."}],"rich":true},{"l":"б","q":"Могут ли ровно четыре числа на доске оканчиваться на 8?","ak":"yn","av":"НЕТ","steps":[{"w":["📌 Тогда 26 чисел оканчиваются на 4 и все **различны**.","💡 **Идея:** даже самые м
