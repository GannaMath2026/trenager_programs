<!doctype html>
<html lang="ru" style="--c: #10b981;"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ЕГЭ №6 · Уравнения — тренажёр</title>
<style>
:root{--bg:#f6f4ef;--panel:#fff;--panel2:#f8f7f3;--ink:#1d2433;--muted:#6d7385;--line:#e6e2d8;--blue:#4f6bff;--ok:#16a06a;--okbg:#e3f6ec;--bad:#e2475b;--badbg:#fdecee;--warn:#e89a12;--warnbg:#fff3d6;--fix:#0f9488;--c:#4f6bff;--sh:0 1px 2px #1d24330d,0 8px 26px #1d243314;--r:18px;--fs:16px;--hand:"Comic Sans MS","Segoe Print","Bradley Hand","Marker Felt","Chalkboard SE",cursive;--mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace}
body.theme-dark{--bg:#11151f;--panel:#1a202d;--panel2:#202737;--ink:#e8ebf3;--muted:#9aa3b8;--line:#2d3546;--okbg:#14382b;--badbg:#45202a;--warnbg:#3d3116;--sh:0 1px 2px #0006,0 10px 30px #0007}
body.font-small{--fs:14px}body.font-medium{--fs:16px}body.font-large{--fs:18px}body.font-xlarge{--fs:21px}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:var(--fs)/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(900px 520px at -5% -10%,#fde9c8 0,transparent 60%),radial-gradient(800px 600px at 110% 0%,#e3e9ff 0,transparent 55%),var(--bg);background-attachment:fixed;min-height:100vh}
body.theme-dark{background:radial-gradient(900px 500px at 0% -10%,#3a2c18 0,transparent 60%),radial-gradient(800px 600px at 110% 0%,#1d2a55 0,transparent 55%),var(--bg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:8px 16px;background:color-mix(in srgb,var(--panel) 85%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;user-select:none;cursor:pointer}
.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#ff8a3d,#ff4f8b 55%,#7a5cff);color:#fff;font-weight:900;font-size:14px;box-shadow:0 4px 14px #ff6a5a55;transform:rotate(-4deg)}
.brand b{display:block;font-size:16px;line-height:1.1}.brand small{color:var(--muted);font-size:12px;font-weight:600}
.hbtn{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:7px 12px;font-size:14px;font-weight:650;cursor:pointer;white-space:nowrap;transition:.15s}
.hbtn:hover{border-color:var(--blue);color:var(--blue)}.hbtn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.hbtn.active{background:var(--ink);color:var(--panel);border-color:var(--ink)}
#menuBtn{display:none}
.fonts{display:inline-flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--panel)}.fonts button{border:0;background:none;padding:7px 8px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}.fonts button.active{background:var(--blue);color:#fff}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 15px;font-weight:650;cursor:pointer;transition:.15s;font-size:calc(var(--fs) - 1px)}
.btn:hover{border-color:var(--c);color:var(--c)}.btn.primary{background:var(--c);border-color:var(--c);color:#fff}.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.small{padding:5px 10px;font-size:13px;border-radius:9px}.btn:disabled{opacity:.45;cursor:default}.btn.on{background:color-mix(in srgb,var(--c) 14%,var(--panel));border-color:var(--c);color:var(--c)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:750;background:var(--panel2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.c{background:color-mix(in srgb,var(--c) 14%,var(--panel));color:var(--c);border-color:transparent}.chip.ok{background:var(--okbg);color:var(--ok);border-color:transparent}.chip.bad{background:var(--badbg);color:var(--bad);border-color:transparent}.chip.warn{background:var(--warnbg);color:#a86a00;border-color:transparent}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
/* layout */
#app{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px;max-width:1500px;margin:0 auto;padding:16px 18px 50px}
#side{position:sticky;top:68px;align-self:start;max-height:calc(100vh - 84px);overflow:auto;padding:12px 10px 14px}
.me{padding:4px 6px 10px;border-bottom:1px dashed var(--line);margin-bottom:8px}
.me b{font-size:15px}.me .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:650;margin-top:4px}
.bar{height:7px;border-radius:9px;background:var(--line);overflow:hidden;display:flex}.bar i{display:block;height:100%;transition:width .4s}.bar i.g{background:var(--ok)}.bar i.y{background:var(--warn)}
.seg2{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px;margin:8px 0 4px}.seg2 button{border:0;background:none;border-radius:8px;padding:4px 2px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}.seg2 button.active{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px #0002}
.egeh{display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:12px;cursor:pointer;font-weight:800;margin-top:6px}
.egeh:hover{background:var(--panel2)}.egeh .n{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#ff8a3d,#ff4f8b);font-size:14px;flex:none}
.egeh.soon{opacity:.45;cursor:default;font-weight:650}.egeh.soon .n{background:var(--muted)}.egeh .pr{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700}
.toph{display:flex;align-items:center;gap:7px;padding:6px 8px 6px 12px;margin:6px 0 2px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:800;color:var(--ink)}
.toph:hover{background:var(--panel2)}.toph .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}.toph .pr{margin-left:auto;font-size:11px;color:var(--muted)}
.toph.all{background:var(--okbg)}.toph.all .pr{color:var(--ok)}
.ti{display:flex;align-items:center;gap:7px;padding:6px 8px;margin:2px 0 2px 14px;border-radius:11px;cursor:pointer;border:1px solid transparent;font-size:calc(var(--fs) - 2.5px);line-height:1.25}
.ti:hover{background:var(--panel2)}.ti.active{border-color:var(--c);background:color-mix(in srgb,var(--c) 9%,var(--panel))}
.ti .st{width:22px;height:22px;flex:none;border-radius:7px;display:grid;place-items:center;font-size:12px;background:var(--panel2);border:1px solid var(--line);font-weight:800;color:var(--muted)}
.ti.s-ok .st,.ti.s-ok2 .st{background:var(--ok);color:#fff;border-color:var(--ok)}.ti.s-fix .st{background:var(--fix);color:#fff;border-color:var(--fix)}
.ti.s-ok,.ti.s-ok2,.ti.s-fix{background:color-mix(in srgb,var(--ok) 7%,transparent)}
.ti.s-bad .st{background:var(--badbg);color:var(--bad);border-color:var(--bad)}.ti.s-pend .st{background:var(--warnbg);color:#a86a00;border-color:var(--warn)}.ti.s-seen .st{border-style:dashed}
.ti .tt{flex:1;min-width:0}.ti .tt small{color:var(--muted);font-weight:700;margin-right:4px}
.ti .lv{font-size:10px;color:#e8a400;letter-spacing:-1px;white-space:nowrap}.ti .pin{font-size:11px}
.lvh{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:10px 8px 4px 14px}
.workrow{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;cursor:pointer;margin:3px 0;border:1px solid var(--line);background:var(--panel2);font-size:14px;font-weight:700}
.workrow:hover{border-color:var(--c)}.workrow.active{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--panel))}.workrow.done{background:var(--okbg);border-color:transparent}
.workrow small{margin-left:auto;color:var(--muted);font-weight:700;white-space:nowrap}
.sideh{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:10px 6px 4px}
main{min-width:0}
/* task card */
.taskcard{padding:clamp(16px,2vw,26px)}
.thead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}.thead h2{margin:0 auto 0 0;font-size:calc(var(--fs) + 5px);line-height:1.2}
.banner{display:flex;gap:10px;align-items:center;border-radius:14px;padding:10px 14px;margin-bottom:12px;font-weight:650}.banner.an{background:var(--warnbg)}.banner.wk{background:color-mix(in srgb,var(--c) 12%,var(--panel))}
.itabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}.itab{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:4px 10px;font-size:13px;font-weight:700;cursor:pointer}.itab.active{border-color:var(--c);color:var(--c);background:var(--panel)}.itab.ok{color:var(--ok)}
.cond{background:var(--panel2);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;padding:14px 16px;margin:8px 0 12px;font-size:calc(var(--fs) + 2px)}
.solved .cond{border-left-color:var(--ok)}
.figbox{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;margin:6px 0 4px}
.drawwrap{position:relative;flex:0 1 460px;min-width:240px;background:#fff;border-radius:14px;border:1px solid var(--line);padding:8px}
.drawwrap canvas{position:absolute;left:8px;top:8px;touch-action:none;pointer-events:none}.drawwrap.drawing canvas{pointer-events:auto;cursor:crosshair}
.drawtools{display:flex;flex-direction:column;gap:6px}
.ansrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 4px}
.ansrow input{flex:1;min-width:200px;max-width:380px;padding:11px 14px;border:2px solid var(--line);border-radius:13px;background:var(--panel);font-size:calc(var(--fs) + 3px);font-weight:800;outline:none;transition:.15s}.ansrow input:focus{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 18%,transparent)}
.pv{font-size:13px;color:var(--muted);min-height:18px;font-weight:650}
.fb{min-height:26px;font-weight:750;margin:6px 0}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}.fb.warn{color:#a86a00}
.hintbox{margin-top:10px}.step{display:flex;gap:11px;padding:10px 12px;border-radius:13px;background:var(--warnbg);margin:6px 0;animation:pop .3s}.step b.n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--warn);color:#fff;display:grid;place-items:center;font-size:13px}
.step .h{font-weight:800;margin-bottom:2px}
@keyframes pop{from{transform:translateY(6px);opacity:0}}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.9em;margin:0 2px;line-height:1.15}.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}.fr>span:last-child{padding:0 3px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
.wchips{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto}.wchip{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:800;border:1px solid var(--line);background:var(--panel);cursor:pointer}.wchip.cur{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 30%,transparent)}.wchip.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.wchip.bad{background:var(--badbg);color:var(--bad)}.wchip.pend{background:var(--warnbg)}
/* figures */
.figsvg{width:100%;height:auto;max-height:340px;display:block;background:#fff}
.figsvg .fl{stroke:#1b2233;stroke-width:1.9;fill:none;stroke-linecap:round}
.figsvg .fd{stroke:#1b2233;stroke-width:1.5;fill:none;stroke-dasharray:6 4}
.figsvg .fh{stroke:#e2475b;stroke-width:2.6;fill:none;stroke-linecap:round}
.figsvg .fr2{stroke:#1b2233;stroke-width:1.4;fill:none}
.figsvg .ftk{stroke:#1b2233;stroke-width:1.7}
.figsvg .fdt{fill:#1b2233}
.figsvg .fpn{font:italic 600 17px "Times New Roman",Georgia,serif;fill:#1b2233;text-anchor:middle;dominant-baseline:central}
.figsvg .ftx{font:700 14px system-ui,Arial,sans-serif;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.gridsvg{max-height:380px}.gridsvg .gtl{font:italic 700 16px system-ui;fill:#16213a}.gridsvg .gtn{font:600 12px system-ui;fill:#64748b}.gridsvg .gvl{font:italic 800 19px Georgia,serif}.gridsvg .gva{font:700 13px system-ui}.gridsvg .glg{font:800 14px system-ui;fill:#d97706}

/* vectors & scenes */
.vc{position:relative;display:inline-block;font-style:italic;font-weight:700;padding-top:.18em}.vc::before{content:"";position:absolute;left:5%;right:-5%;top:.12em;border-top:1.6px solid currentColor}.vc::after{content:"";position:absolute;right:-8%;top:-.04em;border:.2em solid transparent;border-left:.36em solid currentColor;border-right:0}
svg.vg{width:100%;height:auto;background:#fff;border-radius:12px;border:1px solid var(--line)}.vg .gl{stroke:#e3e8f0;stroke-width:1}.vg .ax{stroke:#16213a;stroke-width:2}.vg .tl{font:italic 700 16px system-ui;fill:#16213a}.vg .tn{font:600 12px system-ui;fill:#64748b}.vg .vl{font:italic 800 19px Georgia,serif}.vg .va{font:700 13px system-ui}.vg .lg{font:800 14px system-ui;fill:#d97706}.vg .dl{stroke:#64748b;stroke-dasharray:4 4}.vg .pl{font:700 13px system-ui;fill:#16213a}
.scwrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(240px,1fr);gap:14px;align-items:start}@media(max-width:900px){.scwrap{grid-template-columns:1fr}}.scsvg svg{max-width:100%!important;touch-action:none}.hd{cursor:grab}.hdc{fill:#4f6bff33;stroke:#4f6bff;stroke-width:2}
.scinfo{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}.big2{font-size:calc(var(--fs) + 2px);line-height:1.9}.hint2{color:var(--muted);font-size:14px}.sctip{font-size:12px;color:var(--muted);margin-top:8px}.ok2{color:var(--ok);font-weight:800}.no2{color:var(--bad);font-weight:700}
.hd.dragging .hdc{fill:#4f6bff55;stroke-width:3}.hd.dragging{cursor:grabbing}
.scpanel{border:2px solid color-mix(in srgb,var(--c) 40%,var(--line));border-radius:16px;padding:12px;margin:12px 0;background:color-mix(in srgb,var(--c) 4%,var(--panel))}.scpanel h4{margin:0 0 6px}
.ti.scn .st{background:#fff3c4;border-color:#f0c94d}
.sticker .ex{font-size:12px;font-style:italic;color:#555;text-align:center;margin-top:4px}
.sticker .vec{position:relative;display:inline-block;font-style:italic;padding:0 .12em}.sticker .vec::after{content:"→";position:absolute;top:-.85em;left:50%;transform:translateX(-50%);font-size:.7em;font-style:normal}
.sticker svg .lbl-sm{font-size:6.5px;fill:#444}.sticker svg .ln3{stroke:#bbb;stroke-width:.5;fill:none;stroke-dasharray:1.5 1.5}.sticker svg .blue{stroke:#1f5fbf;stroke-width:1.2;fill:none}.sticker svg .green{stroke:#2e9e4f;stroke-width:1.2;fill:none}.sticker svg .orange{stroke:#e8862a;stroke-width:1.2;fill:none}
.sticker svg .ah-red{fill:#d43a3a}.sticker svg .ah-blue{fill:#1f5fbf}.sticker svg .ah-green{fill:#2e9e4f}.sticker svg .ah-orange{fill:#e8862a}.sticker svg .ah-black{fill:#222}
#dlg .modal{width:min(520px,100%)}
/* stickers */
.board{display:flex;flex-wrap:wrap;gap:20px;padding:18px 6px 8px}
.sticker{--rot:-1.5deg;--sc:#fff6a8;position:relative;flex:1 1 220px;max-width:300px;background:var(--sc);color:#2b2a26;padding:18px 14px 12px;border-radius:3px 3px 14px 3px;box-shadow:0 1px 1px #0001,0 10px 18px -6px #0003;transform:rotate(var(--rot));transition:.2s;font-size:calc(var(--fs) - 1px);line-height:1.4}
.sticker:hover{transform:rotate(0) scale(1.03);z-index:2}
.sticker::before{content:"";position:absolute;top:-10px;left:50%;width:84px;height:22px;transform:translateX(-50%) rotate(-3deg);background:#ffffff8c;border:1px solid #0000000d}
.sticker h4{font-family:var(--hand);font-size:calc(var(--fs) + 2px);margin:0 0 4px;line-height:1.2}.sticker h4 small{font-family:system-ui;font-size:11px;opacity:.6;margin-right:4px}
.sticker p{margin:4px 0}
.sticker:nth-child(5n+1){--sc:#fff3a0;--rot:-1.6deg}.sticker:nth-child(5n+2){--sc:#ffd7e4;--rot:1.3deg}.sticker:nth-child(5n+3){--sc:#cdeffd;--rot:-.6deg}.sticker:nth-child(5n+4){--sc:#d4f5d0;--rot:1.8deg}.sticker:nth-child(5n+5){--sc:#ffe1c2;--rot:-1.1deg}
.sticker .fact{background:#ffffffc0;border-radius:9px;padding:4px;margin:6px 0}.sticker .fact svg{width:100%;height:auto;max-height:150px;display:block}
.sticker .ff{font-weight:800;color:#1f5fbf;text-align:center;font-size:calc(var(--fs) + 1px);margin-top:4px}
.sticker svg text{font-family:"Segoe UI",Arial,sans-serif;font-size:6px;fill:#111}.sticker svg .lbl{font-size:6px;fill:#222;font-weight:600}
.sticker svg .ln{stroke:#222;stroke-width:.7;fill:none}.sticker svg .ln2{stroke:#444;stroke-width:.5;fill:none;stroke-dasharray:1.5 1.2}
.sticker svg .arc{stroke:#d43a3a;stroke-width:1;fill:none}.sticker svg .arcb{stroke:#1f5fbf;stroke-width:.9;fill:none}.sticker svg .hl{stroke:#d43a3a;stroke-width:1.1;fill:none}
.sticker svg .red{stroke:#d43a3a;stroke-width:1.2;fill:none}.sticker svg .red-dash{stroke:#d43a3a;stroke-width:1.2;fill:none;stroke-dasharray:2.5 2}
.sticker svg .dot{fill:#111}.sticker svg .sq{stroke:#d43a3a;stroke-width:.7;fill:none}.sticker svg .sq-black{stroke:#111;stroke-width:.7;fill:none}.sticker svg .tick{stroke:#d43a3a;stroke-width:.9}.sticker svg .shade{fill:#2e9e4f;opacity:.25}
.ic{display:inline-block;width:1.05em;height:1.05em;vertical-align:-.15em;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.thpanel{border:2px dashed #e8c54a;border-radius:16px;margin:12px 0;padding:4px 8px 10px;background:color-mix(in srgb,#fff6a8 18%,var(--panel))}

/* pages */
#page{max-width:1400px;margin:0 auto;padding:18px}
.ptitle{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}.ptitle h1{margin:0;font-size:clamp(22px,3vw,32px);margin-right:auto}
.ttabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.ttabs button{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 14px;font-weight:750;cursor:pointer}.ttabs button.active{background:var(--ink);color:var(--panel);border-color:var(--ink)}

.mtable td.c{text-align:center;cursor:pointer;white-space:nowrap}.mtable td.c:hover{background:var(--panel2)}.mtable tr.grp td{background:var(--panel2);font-weight:800}
.tgrid{display:grid;grid-template-columns:260px minmax(0,1fr) 300px;gap:14px;align-items:start}@media(max-width:1100px){.tgrid{grid-template-columns:1fr}}
.pane{padding:14px}.pane h3{margin:0 0 8px;font-size:15px}

<script>
// ================= ЯДРО: выражения, шаблоны, генерация, чертежи =================
const ENG=(()=>{
// ---------- форматирование ----------
function fmt(x){if(typeof x==='string')return x;if(typeof x==='boolean')return x?'да':'нет';if(!Number.isFinite(x))return '?';
 let r=Math.round(x*1e6)/1e6;if(Object.is(r,-0))r=0;let s=String(r);if(/e/.test(s))s=r.toFixed(6).replace(/0+$/,'').replace(/\.$/,'');return s.replace('.',',').replace(/^-/,'−')}
function dec(x){for(let i=0;i<=8;i++){const v=x*10**i;if(Math.abs(v-Math.round(v))<1e-7*Math.max(1,Math.abs(v)))return i}return 99}
function rootStr(n){if(!Number.isFinite(n)||n<0)return '?';const s=Math.sqrt(n);if(Math.abs(s-Math.round(s))<1e-9)return fmt(Math.round(s));
 if(Math.abs(n-Math.round(n))>1e-9)return '√'+fmt(n);n=Math.round(n);let k=1,m=n;for(let d=2;d*d<=m;d++)while(m%(d*d)===0){m/=d*d;k*=d}return (k>1?k:'')+'√'+m}
const gcd=(a,b)=>{a=Math.abs(Math.round(a));b=Math.abs(Math.round(b));while(b){[a,b]=[b,a%b]}return a};
const issq=n=>n>=0&&Math.abs(Math.sqrt(n)-Math.round(Math.sqrt(n)))<1e-9;
const D=Math.PI/180;
const FN={sqrt:Math.sqrt,cbrt:Math.cbrt,abs:Math.abs,min:Math.min,max:Math.max,floor:Math.floor,ceil:Math.ceil,
 round:(x,n=0)=>Math.round(x*10**n)/10**n,sin:x=>Math.sin(x*D),cos:x=>Math.cos(x*D),tg:x=>Math.tan(x*D),tan:x=>Math.tan(x*D),ctg:x=>1/Math.tan(x*D),
 ln:Math.log,log:(a,b)=>b===undefined?Math.log10(a):Math.log(b)/Math.log(a),gcd,issq,dec,R:rootStr,F:fmt};
const CONST={pi:Math.PI};
// ---------- разбор выражений (без eval) ----------
function tokenize(s){const T=[];let i=0;
 while(i<s.length){const c=s[i];
  if(/\s/.test(c)){i++;continue}
  if(/[0-9.]/.test(c)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;const t=s.slice(i,j);if((t.match(/\./g)||[]).length>1||t==='.')throw Error('число');T.push({t:'n',v:parseFloat(t)});i=j;continue}
  if(/[A-Za-z_]/.test(c)){let j=i;while(j<s.length&&/[A-Za-z_0-9]/.test(s[j]))j++;T.push({t:'id',v:s.slice(i,j)});i=j;continue}
  if(c==="'"){const j=s.indexOf("'",i+1);if(j<0)throw Error('строка');T.push({t:'s',v:s.slice(i+1,j)});i=j+1;continue}
  const two=s.slice(i,i+2);if(['==','!=','<=','>=','&&','||'].includes(two)){T.push({t:'op',v:two});i+=2;continue}
  if('+-*/%^()?:,<>!√'.includes(c)){T.push({t:'op',v:c});i++;continue}
  throw Error('символ «'+c+'»')}
 return T}
function parse(src,implicit){const T=tokenize(src);let p=0;const peek=()=>T[p],is=v=>T[p]&&T[p].t==='op'&&T[p].v===v,eat=v=>{if(!is(v))throw Error('ожидалось '+v);p++};
 const startsPrimary=()=>{const t=T[p];return t&&(t.t==='n'||t.t==='id'||t.t==='s'||(t.t==='op'&&(t.v==='('||t.v==='√')))};
 function tern(){const c=or();if(is('?')){p++;const a=tern();eat(':');const b=tern();return{k:'?',c,a,b}}return c}
 function or(){let l=and();while(is('||')){p++;l={k:'||',l,r:and()}}return l}
 function and(){let l=eq();while(is('&&')){p++;l={k:'&&',l,r:eq()}}return l}
 function eq(){let l=rel();while(is('==')||is('!=')){const o=T[p++].v;l={k:o,l,r:rel()}}return l}
 function rel(){let l=add();while(is('<')||is('>')||is('<=')||is('>=')){const o=T[p++].v;l={k:o,l,r:add()}}return l}
 function add(){let l=mul();while(is('+')||is('-')){const o=T[p++].v;l={k:o,l,r:mul()}}return l}
 function mul(){let l=un();for(;;){if(is('*')||is('/')||is('%')){const o=T[p++].v;l={k:o,l,r:un()}}else if(implicit&&startsPrimary()){l={k:'*',l,r:un()}}else break}return l}
 function un(){if(is('-')){p++;return{k:'neg',a:un()}}if(is('+')){p++;return un()}if(is('!')){p++;return{k:'!',a:un()}}if(is('√')){p++;return{k:'call',f:'sqrt',a:[un()]}}return pow()}
 function pow(){const b=prim();if(is('^')){p++;return{k:'^',l:b,r:un()}}return b}
 function prim(){const t=peek();if(!t)throw Error('выражение оборвалось');
  if(t.t==='n'){p++;return{k:'n',v:t.v}}if(t.t==='s'){p++;return{k:'n',v:t.v}}
  if(t.t==='op'&&t.v==='('){p++;const e=tern();eat(')');return e}
  if(t.t==='id'){p++;if(is('(')&&FN[t.v]){p++;const a=[];if(!is(')')){a.push(tern());while(is(',')){p++;a.push(tern())}}eat(')');return{k:'call',f:t.v,a}}
   if(FN[t.v]&&implicit&&startsPrimary())return{k:'call',f:t.v,a:[un()]};return{k:'v',n:t.v}}
  throw Error('неожиданное «'+t.v+'»')}

 case'call':return FN[e.f](...e.a.map(x=>ev(x,env)));

 case'==':return Math.abs(a-b)<1e-9||a===b;case'!=':return !(Math.abs(a-b)<1e-9||a===b);case'<':return a<b;case'>':return a>b;case'<=':return a<=b+1e-12;case'>=':return a>=b-1e-12}}

// ---------- ответ ученика ----------
function prepStudent(s){return String(s??'').toLowerCase().replace(/\s+/g,'').replace(/,/g,'.').replace(/[×·∙•]/g,'*').replace(/[:÷]/g,'/').replace(/[−–—]/g,'-')
 .replace(/²/g,'^2').replace(/³/g,'^3').replace(/π/g,'pi').replace(/°/g,'').replace(/корень/g,'sqrt').replace(/tan/g,'tg').replace(/([a-z])(\d)/g,'$1 $2')}
function studentValue(s){const src=prepStudent(s);if(!src)return {err:'пусто'};
 try{const v=ev(parse(src,true),{});if(typeof v!=='number'||!Number.isFinite(v))return {err:'не число'};return {v,expr:!/^-?\d+(\.\d+)?$/.test(src)}}catch(e){return {err:e.message}}}
function same(v,ans){return Math.abs(v-ans)<=1e-6*Math.max(1,Math.abs(ans))}
// ---------- шаблоны ----------
function tpl(s,env){return String(s??'').replace(/\{([^{}]+)\}/g,(m,e)=>{try{return fmt(calc(e,env))}catch(_){return m}})}
const mk=s=>String(s).replace(/\(x\/1\)/g,'x').replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,'<span class="fr"><span>$1</span><span>$2</span></span>').replace(/\$([A-Z]{2}|[a-z])/g,'<span class="vc">$1</span>');
// ---------- экземпляры задач ----------
function envOf(task,vars){const env={...vars};for(const[k,e]of Object.entries(task.calc||{}))env[k]=calc(e,env);env.ans=calc(task.ans,env);return env}
function pick(spec,rnd){if(Array.isArray(spec)){const[a,b]=spec;return a+Math.floor(rnd()*(b-a+1))}
 if(spec.list)return spec.list[Math.floor(rnd()*spec.list.length)];
 if(spec.min!==undefined){const st=spec.step||1,n=Math.floor((spec.max-spec.min)/st+1e-9);return Math.round((spec.min+st*Math.floor(rnd()*(n+1)))*1e9)/1e9}

function valid(task,env){const a=env.ans;if(typeof a!=='number'||!Number.isFinite(a))return false;if(dec(a)>(task.dec??2))return false;
 if(task.ok&&!calc(task.ok,env))return false;return true}
function gen(task,avoid=[],rnd=Math.random){const keys=JSON.stringify;const av=new Set(avoid.map(keys));
 for(let i=0;i<4000;i++){const vars={};for(const[k,s]of Object.entries(task.v||{})){const x=pick(s,rnd);if(s.set){s.as.forEach((n,j)=>vars[n]=x[j])}else vars[k]=x}
  let env;try{env=envOf(task,vars)}catch(e){continue}if(!valid(task,env))continue;
  const key=keys(vars);if(av.has(key)&&i<3500)continue;return vars}

// ---------- чертежи ----------
function figPoints(fig,env){const P={},meta={},src=fig.pts||{};const num=x=>typeof x==='number'?x:calc(x,env);
 const get=n=>{if(P[n])return P[n];const d=src[n];if(d===undefined)throw Error('нет точки '+n);P[n]=[0,0];let r;
  if(Array.isArray(d))r=[num(d[0]),num(d[1])];
  else if(d.c!==undefined){const O=get(d.c),a=num(d.a)*D,rr=num(d.r);r=[O[0]+rr*Math.cos(a),O[1]-rr*Math.sin(a)];meta[n]={center:d.c}}
  else if(d.mid){const A=get(d.mid[0]),B=get(d.mid[1]);r=[(A[0]+B[0])/2,(A[1]+B[1])/2]}
  else if(d.on){const A=get(d.on[0]),B=get(d.on[1]),t=num(d.on[2]);r=[A[0]+t*(B[0]-A[0]),A[1]+t*(B[1]-A[1])]}
  else if(d.foot){const C=get(d.foot[0]),A=get(d.foot[1][0]),B=get(d.foot[1][1]);const ux=B[0]-A[0],uy=B[1]-A[1],t=((C[0]-A[0])*ux+(C[1]-A[1])*uy)/(ux*ux+uy*uy);r=[A[0]+t*ux,A[1]+t*uy]}

  else if(d.bis){const C=get(d.bis[0]),A=get(d.bis[1]),B=get(d.bis[2]);const ca=Math.hypot(A[0]-C[0],A[1]-C[1]),cb=Math.hypot(B[0]-C[0],B[1]-C[1]),t=ca/(ca+cb);r=[A[0]+t*(B[0]-A[0]),A[1]+t*(B[1]-A[1])]}

  else if(d.to){const O=get(d.to[0]),C=get(d.to[1]),L=num(d.to[2]),dd=Math.hypot(C[0]-O[0],C[1]-O[1]);r=[O[0]+(C[0]-O[0])*L/dd,O[1]+(C[1]-O[1])*L/dd];meta[n]={center:d.to[0]}}
  else throw Error('не понимаю точку '+n);

 tri3:{title:'Треугольная призма = 3 равные пирамиды',yaw:-0.2,pitch:.4,text:'Призму ABCA₁B₁C₁ можно разрезать на <b>три пирамиды с общей вершиной C₁</b>: C₁ABC, C₁AA₁B₁ и C₁ABB₁. Их объёмы равны, значит каждая — <b>[[1|3]]</b> призмы. Отсюда V<sub>пир</sub> = [[1|3]]S·h. Подвигай «разлёт», чтобы увидеть куски.',
  r:3.9,modes:[['all','все три'],['abc','C₁ABC'],['aa1b1','C₁AA₁B₁'],['ab1b','C₁ABB₁']],s:[{k:'e',lab:'разлёт',min:0,max:1.6,step:.05,v:.6},{k:'h',lab:'высота',min:2,max:5,step:.5,v:3.4}],
  draw:S=>{const{A,B,C,A1,B1,C1}=triPts(S.h);const ctr=cen3([A,B,C,A1,B1,C1]);const defs={abc:[[A,B,C],CR],aa1b1:[[A,A1,B1],CB],ab1b:[[A,B1,B],CG]};
   const bods=[prismB([A,B,C],S.h,CK,{op:.03,ec:'#cbd5e1',ew:1.2})];const pts=[];
   for(const[k,[bs,c]]of Object.entries(defs)){if(S.mode!=='all'&&S.mode!==k)continue;const pyr=pyrB(bs,C1,c,{op:.42});const dir=s3(cen3([...bs,C1]),ctr);const L=Math.hypot(...dir)||1;const pe=explodeP(pyr,m3(dir,1/L),S.e);bods.push(pe)}
   const why={all:'C₁ABC и C₁A₁B₁A — это пирамиды C·ABC и A·A₁B₁C₁: равные основания (△ABC = △A₁B₁C₁) и одна высота h. А C₁AA₁B₁ и C₁ABB₁ — общая вершина C₁ и равные основания: △AA₁B₁ и △ABB₁ — половинки грани ABB₁A₁. Значит, все три пирамиды равны по объёму.',abc:'Основание ABC, высота — боковое ребро CC₁.',aa1b1:'Это то же самое, что пирамида A·A₁B₁C₁: основание A₁B₁C₁, высота h.',ab1b:'Основание — половина грани ABB₁A₁, вершина C₁.'}[S.mode];
   return{bodies:bods,pts:[[A,'A'],[B,'B'],[C,'C'],[A1,'A₁'],[B1,'B₁'],[C1,'C₁']].map(([p,n])=>[p,n]),info:`<p>${why}</p><div class="big2">V<sub>призмы</sub> = V₁ + V₂ + V₃ = 3V<sub>пир</sub><br>V<sub>пир</sub> = [[1|3]] S<sub>осн</sub> · h</div>`}}},
 quad3:{title:'Четырёхугольная призма = 3 равные пирамиды',text:'Прямоугольный параллелепипед (и куб) режется на <b>три пирамиды с общей вершиной A₁</b>: основания — три грани, которые <b>не</b> проходят через A₁: ABCD, BCC₁B₁ и DCC₁D₁. Объём каждой — [[1|3]]·a·b·h, то есть ровно [[1|3]] параллелепипеда.',
  r:4.4,modes:[['all','все три'],['p1','A₁ABCD'],['p2','A₁BCC₁B₁'],['p3','A₁DCC₁D₁']],s:[{k:'e',lab:'разлёт',min:0,max:1.6,step:.05,v:.6},{k:'a',lab:'AB = a',min:2,max:5,step:.5,v:3.5},{k:'b',lab:'AD = b',min:2,max:5,step:.5,v:3},{k:'h',lab:'AA₁ = h',min:2,max:5,step:.5,v:3}],
  draw:S=>{const{a,b,h}=S,x0=-a/2,y0=-b/2,z0=-h/2;const A=[x0,y0,z0],B=[x0+a,y0,z0],C=[x0+a,y0+b,z0],D=[x0,y0+b,z0],up=p=>[p[0],p[1],p[2]+h],A1=up(A),B1=up(B),C1=up(C),D1=up(D);const ctr=[0,0,0];
   const defs={p1:[[A,B,C,D],CR,'ABCD',`[[1|3]]·(ab)·h`],p2:[[B,C,C1,B1],CB,'BCC₁B₁',`[[1|3]]·(bh)·a`],p3:[[D,C,C1,D1],CG,'DCC₁D₁',`[[1|3]]·(ah)·b`]};const bods=[boxB(x0,y0,z0,a,b,h,CK,{op:.03,ec:'#cbd5e1',ew:1.2})];let rows='';
   for(const[k,[bs,c,nm,f]]of Object.entries(defs)){rows+=`<div>${nm}: ${f} = [[abh|3]]</div>`;if(S.mode!=='all'&&S.mode!==k)continue;const pyr=pyrB(bs,A1,c,{op:.42});const dir=s3(cen3(bs),ctr);const L=Math.hypot(...dir)||1;bods.push(explodeP(pyr,m3(dir,1/L),S.e))}
   return{bodies:bods,pts:[[A,'A'],[B,'B'],[C,'C'],[D,'D'],[A1,'A₁'],[B1,'B₁'],[C1,'C₁'],[D1,'D₁']],info:`<div class="big2">${rows}</div><p>Высота каждой пирамиды — ребро, выходящее из A₁ перпендикулярно её основанию.</p><div class="big2">3 · [[abh|3]] = abh = V<sub>пар</sub> ✓</div><p class="hint2">Сейчас: V<sub>пар</sub> = ${nf(a*b*h)}, каждая пирамида = ${nf(a*b*h/3)}.</p>`}}},
 mid:{title:'Средняя линия режет площадь на 4',text:'Если стороны треугольника уменьшить в k раз, площадь уменьшится в <b>k²</b> раз. Средняя линия: k = [[1|2]] ⇒ площадь — [[1|4]]. Высота у кусочка та же, значит и объём — [[1|4]]. А боковая поверхность призмы зависит от периметра — она уменьшается только в 2 раза.',
  r:3.6,modes:[['pr','призма'],['py','пирамида']],s:[{k:'k',lab:'AM : AB',min:.2,max:1,step:.05,v:.5}],
  draw:S=>{const k=S.k,z0=-1.6,h=3.2,A=[-2.2,-1.4,z0],B=[2.4,-1.2,z0],C=[-.4,2.2,z0],M=lerp(A,B,k),N=lerp(A,C,k),bod=[];let api=null;
   if(S.mode==='pr'){bod.push(prismB([A,B,C],h,CK,{op:.04,ec:'#94a3b8',ew:1.6}),prismB([A,M,N],h,CO,{op:.3}))}
   else{api=[A[0],A[1],z0+h];bod.push(pyrB([A,B,C],api,CK,{op:.04,ec:'#94a3b8',ew:1.6}),pyrB([A,M,N],api,CO,{op:.3}))}
   return{bodies:bod,pts:[[A,'A'],[B,'B'],[C,'C'],[M,'M',CO],[N,'N',CO]].concat(api?[[api,'S']]:[]),info:`<div class="big2">k = ${nf(k)}<br>S<sub>AMN</sub> = k²·S = <b>${nf(k*k,3)}</b>·S<br>V<sub>куска</sub> = <b>${nf(k*k,3)}</b>·V</div>${S.mode==='pr'?`<p>S<sub>бок</sub> = P·h ⇒ меняется как k = <b>${nf(k)}</b></p>`:''}<p class="hint2">Поставь k = 0,5: объём [[1|4]], боковая поверхность [[1|2]].</p>`}}},
 emid:{title:'Точка на боковом ребре',text:'Когда вершину пирамиды заменяют точкой E на ребре SB, высота уменьшается во столько же раз, во сколько E ближе к основанию. Плюс основание ABC — половина квадрата.',
  r:3.4,s:[{k:'t',lab:'BE : BS',min:.1,max:1,step:.05,v:.5}],
  draw:S=>{const t=S.t,z0=-1.5,H=3.4,[A,B,C,D]=[[-1.8,-1.8,z0],[1.8,-1.8,z0],[1.8,1.8,z0],[-1.8,1.8,z0]],Sx=[0,0,z0+H],E=lerp(B,Sx,t),Ep=[E[0],E[1],z0];
   return{bodies:[pyrB([A,B,C,D],Sx,CK,{op:.04,ec:'#94a3b8',ew:1.6}),pyrB([A,B,C],E,CR,{op:.3})],lines:[ln(E,Ep,CR,'h·'+nf(t),{dash:true,w:2}),ln(Sx,[0,0,z0],CK,'h',{dash:true,w:1.6})],pts:[[A,'A'],[B,'B'],[C,'C'],[D,'D'],[Sx,'S'],[E,'E',CR]],
    info:`<p>Основание: S<sub>ABC</sub> = [[1|2]] S<sub>ABCD</sub></p><p>Высота: ${nf(t)} · h</p><div class="big2">V<sub>EABC</sub> = [[1|2]] · ${nf(t)} · V = <b>${nf(t/2,3)}</b> V</div><p class="hint2">E — середина: [[1|2]]·[[1|2]] = [[1|4]].</p>`}}},
 corner:{title:'Уголок куба',text:'Плоскость через точки M и N на двух рёбрах из одной вершины, параллельная третьему ребру, отрезает от куба <b>треугольную призму</b>. Её основание — прямоугольный треугольник AMN, высота — целое ребро.',
  r:3.4,s:[{k:'t',lab:'AM : AB',min:.2,max:1,step:.05,v:.5}],
  draw:S=>{const a=3.4,t=S.t,x0=-a/2,z0=-a/2;const A=[x0,x0,z0],B=[x0+a,x0,z0],D=[x0,x0+a,z0],up=p=>[p[0],p[1],p[2]+a],M=lerp(A,B,t),N=lerp(A,D,t);
   return{bodies:[boxB(x0,x0,z0,a,a,a,CK,{op:.04,ec:'#94a3b8',ew:1.6}),prismB([A,M,N],a,CO,{op:.35})],pts:[[A,'A'],[B,'B'],[D,'D'],[up(A),'A₁'],[M,'M',CO],[N,'N',CO]],
    info:`<p>S<sub>AMN</sub> = [[1|2]]·AM·AN = [[1|2]]·${nf(t)}a·${nf(t)}a = <b>${nf(t*t/2,4)}</b>·a²</p><div class="big2">V = ${nf(t*t/2,4)} · V<sub>куба</sub></div><p class="hint2">M, N — середины: [[1|2]]·[[1|2]]·[[1|2]] = [[1|8]] куба.</p>`}}},
 cylcone:{title:'Цилиндр и конус: в 3 раза',text:'Конус с тем же основанием и высотой, что у цилиндра, занимает ровно <b>[[1|3]]</b> его объёма (как пирамида — [[1|3]] призмы).',
  r:3.8,cz:0,s:[{k:'R',lab:'R',min:.8,max:2.6,step:.1,v:1.8},{k:'h',lab:'h',min:1,max:5,step:.1,v:3.6}],
  draw:S=>{const{R,h}=S,z0=-h/2,l=sq(R*R+h*h);
   return{bodies:[cylB(0,0,z0,R,h,CB,{op:.08}),coneB(0,0,z0,R,h,CO,{op:.3})],lines:[ln([0,0,z0],[R,0,z0],CR,'R'),ln([0,0,z0],[0,0,z0+h],CK,'h',{dash:true,w:1.8}),ln([R,0,z0],[0,0,z0+h],CV,'l')],
    info:`<div class="big2">V<sub>цил</sub> = πR²h ≈ <b>${nf(PI*R*R*h)}</b><br>V<sub>кон</sub> = [[1|3]]πR²h ≈ <b>${nf(PI*R*R*h/3)}</b></div><p>Отношение всегда <b>3</b>.</p><p>S<sub>бок цил</sub> = 2πRh ≈ ${nf(2*PI*R*h)}<br>S<sub>бок кон</sub> = πRl, l = √(R² + h²) ≈ ${nf(l)} ⇒ ≈ ${nf(PI*R*l)}</p><p class="hint2">Поставь h = R: l = R√2.</p>`}}},
 axial:{title:'Осевое сечение и развёртка',text:'Осевое сечение — разрез через ось. У конуса это равнобедренный треугольник со сторонами l, l, 2R и высотой h. У цилиндра — прямоугольник 2R × h.',
  r:3.6,modes:[['cone','конус'],['cyl','цилиндр']],s:[{k:'R',lab:'R',min:.8,max:2.6,step:.1,v:2},{k:'h',lab:'h',min:1,max:4.5,step:.1,v:3}],
  draw:S=>{const{R,h}=S,z0=-h/2,l=sq(R*R+h*h),C=2*PI*R;
   if(S.mode==='cone')return{bodies:[coneB(0,0,z0,R,h,CB,{op:.06}),flatB([[-R,0,z0],[R,0,z0],[0,0,z0+h]],CO,{op:.35,lift:.01})],lines:[ln([0,0,z0],[0,0,z0+h],CK,'h',{dash:true,w:1.8}),ln([0,0,z0],[R,0,z0],CR,'R'),ln([R,0,z0],[0,0,z0+h],CV,'l')],
    info:`<div class="big2">l = √(R² + h²) = <b>${nf(l)}</b><br>S<sub>сеч</sub> = [[1|2]]·2R·h = R·h = <b>${nf(R*h)}</b><br>S<sub>бок</sub> = πRl ≈ ${nf(PI*R*l)}</div><p class="hint2">Длина окружности C = 2πR ⇒ πR = [[C|2]] — само R искать не нужно.</p>`};
   return{bodies:[cylB(0,0,z0,R,h,CB,{op:.06}),flatB([[-R,0,z0],[R,0,z0],[R,0,z0+h],[-R,0,z0+h]],CO,{op:.35,lift:.01})],lines:[ln([R,0,z0],[R,0,z0+h],CK,'h'),ln([0,0,z0],[R,0,z0],CR,'R')],
    info:`<div class="big2">S<sub>сеч</sub> = 2R·h = <b>${nf(2*R*h)}</b><br>C = 2πR ≈ ${nf(C)}<br>S<sub>бок</sub> = C·h ≈ <b>${nf(C*h)}</b></div><p class="hint2">Боковая поверхность цилиндра — прямоугольник C × h (см. «Формулы: развёртка цилиндра»).</p>`}}},
 coneball:{title:'Конус в шаре: h = R',text:'Если радиус основания конуса равен радиусу шара, основание проходит через центр шара, а вершина лежит на сфере. Тогда <b>h = R</b>, образующая <b>l = R√2</b>, а объём конуса ровно в 4 раза меньше шара.',
  r:2.8,cz:0,yaw:-0.4,pitch:.3,s:[{k:'R',lab:'R',min:1,max:2.4,step:.1,v:2}],
  draw:S=>{const R=S.R;return{bodies:[sphB([0,0,0],R,CB),coneB(0,0,0,R,R,CO,{op:.3})],lines:[ln([0,0,0],[R,0,0],CR,'R'),ln([0,0,0],[0,0,R],CK,'h = R',{dash:true,w:1.8}),ln([R,0,0],[0,0,R],CV,'l')],pts:[[[0,0,0],'O']],
   info:`<div class="big2">V<sub>шара</sub> = [[4|3]]πR³ ≈ <b>${nf(4/3*PI*R**3)}</b><br>V<sub>кон</sub> = [[1|3]]πR²·R ≈ <b>${nf(PI*R**3/3)}</b></div><p>Отношение — ровно <b>4</b>.</p><div class="big2">l = R√2 ≈ ${nf(R*Math.SQRT2)}</div>`}}},
 ballcyl:{title:'Шар в цилиндре',text:'Шар, вписанный в цилиндр, касается обоих оснований и боковой поверхности: радиус цилиндра = R, высота = <b>2R</b>. И объём, и полная поверхность цилиндра в <b>1,5 раза</b> больше, чем у шара (это открыл Архимед).',
  r:2.9,cz:0,s:[{k:'R',lab:'R',min:1,max:2.2,step:.1,v:1.8}],
  draw:S=>{const R=S.R;return{bodies:[cylB(0,0,-R,R,2*R,CB,{op:.07}),sphB([0,0,0],R,CO)],lines:[ln([0,0,0],[R,0,0],CR,'R'),ln([R,0,-R],[R,0,R],CK,'2R')],
   info:`<div class="big2">V<sub>шара</sub> = [[4|3]]πR³ ≈ ${nf(4/3*PI*R**3)}<br>V<sub>цил</sub> = πR²·2R = 2πR³ ≈ ${nf(2*PI*R**3)}</div><div class="big2">S<sub>шара</sub> = 4πR² ≈ ${nf(4*PI*R*R)}<br>S<sub>цил</sub> = 2πR² + 2πR·2R = 6πR² ≈ ${nf(6*PI*R*R)}</div><p>И там и там — <b>×1,5</b>.</p>`}}},
 section:{title:'Сечение шара',text:'Любое сечение шара плоскостью — круг. Если плоскость на расстоянии d от центра, его радиус r = √(R² − d²). Самое большое сечение — через центр (d = 0): круг радиуса R. Его площадь πR² — ровно [[1|4]] площади сферы.',
  r:2.8,cz:0,yaw:-0.5,pitch:.35,s:[{k:'d',lab:'d',min:0,max:1.9,step:.05,v:0}],
  draw:S=>{const R=2,d=S.d,r=sq(Math.max(0,R*R-d*d));return{bodies:[sphB([0,0,0],R,CB),flatB(ngon(60,r,d,0),CO,{op:.35,lift:5})],lines:[ln([0,0,0],[0,0,d],CK,d>.1?'d':'',{dash:true,w:1.8}),ln([0,0,d],[r,0,d],CR,d>.1?'r':'r = R'),ln([0,0,0],[r,0,d],CV,d>.1?'R':'')],pts:[[[0,0,0],'O']],
   info:`<div class="big2">R = 2, d = ${nf(d)}<br>r = √(R² − d²) = <b>${nf(r)}</b><br>S<sub>сеч</sub> = πr² ≈ ${nf(PI*r*r)}</div><p>S<sub>сферы</sub> = 4πR² ≈ ${nf(16*PI)}</p><p class="hint2">При d = 0: S<sub>сферы</sub> = 4·S<sub>сеч</sub>.</p>`}}},
 inscr:{title:'Вписанные тела: круг в квадрате',text:'Цилиндр, вписанный в правильную четырёхугольную призму, касается всех боковых граней — значит, сторона квадрата = диаметру: <b>a = 2R</b>. Шар, вписанный в параллелепипед: все измерения = 2R, то есть это куб.',
  r:3.2,cz:0,modes:[['cyl','цилиндр в призме'],['ball','шар в кубе']],s:[{k:'R',lab:'R',min:.8,max:2,step:.1,v:1.5},{k:'h',lab:'h (цилиндр)',min:1,max:4,step:.1,v:2.5}],
  draw:S=>{const{R,h}=S;if(S.mode==='cyl')return{bodies:[boxB(-R,-R,-h/2,2*R,2*R,h,CK,{op:.05,ec:'#64748b',ew:1.8}),cylB(0,0,-h/2,R,h,CO,{op:.28})],lines:[ln([0,0,h/2],[R,0,h/2],CR,'R'),ln([-R,-R,h/2],[R,-R,h/2],CV,'2R')],
    info:`<div class="big2">a = 2R = ${nf(2*R)}<br>V<sub>пр</sub> = (2R)²·h = <b>${nf(4*R*R*h)}</b><br>S<sub>бок</sub> = 4·2R·h = <b>${nf(8*R*h)}</b><br>V<sub>цил</sub> = πR²h ≈ ${nf(PI*R*R*h)}</div>`};
   return{bodies:[boxB(-R,-R,-R,2*R,2*R,2*R,CK,{op:.05,ec:'#64748b',ew:1.8}),sphB([0,0,0],R,CO)],lines:[ln([0,0,0],[R,0,0],CR,'R'),ln([-R,-R,R],[R,-R,R],CV,'a = 2R')],
    info:`<div class="big2">a = 2R = ${nf(2*R)}<br>S<sub>куба</sub> = 6a² = <b>${nf(24*R*R)}</b><br>V<sub>куба</sub> = a³ = <b>${nf(8*R**3)}</b></div>`}}},
 simcone:{title:'Подобие: k, k², k³',text:'Плоскость, параллельная основанию, отрезает от конуса (пирамиды) маленький <b>подобный</b> конус. Если все размеры меньше в k раз, то площади — в k² раз, а объёмы — в k³ раз.',
  r:3.2,cz:0,s:[{k:'k',lab:'k = h₁ : h',min:.15,max:1,step:.05,v:.5}],
  draw:S=>{const k=S.k,H=4,R=2.4,z0=-2,zc=z0+H*(1-k),r=R*k;return{bodies:[coneB(0,0,z0,R,H,CB,{op:.05}),coneB(0,0,zc,r,H*k,CO,{op:.3}),flatB(ngon(48,r,zc,0),CO,{op:.25,lift:-.01})],lines:[ln([0,0,z0+H],[0,0,zc],CR,'h₁',{w:3}),ln([0,0,zc],[0,0,z0],CK,'',{dash:true,w:1.6}),ln([0,0,zc],[r,0,zc],CO,'r')],
   info:`<div class="big2">k = ${nf(k)}<br>площади: k² = <b>${nf(k*k,4)}</b><br>объёмы: k³ = <b>${nf(k**3,4)}</b></div><p class="hint2">«Делит высоту пополам» ⇒ k = [[1|2]]. Отрезки 4 и 12 от вершины ⇒ k = [[4|16]] — делим на ВСЮ высоту!</p>`}}},
 scale:{title:'Меняем размеры — что с объёмом?',text:'Смотри на формулу: что в квадрате, то и даёт квадрат. V<sub>цил</sub> = πR²h: радиус ×m ⇒ объём ×m², высота ×n ⇒ объём ×n. У шара S = 4πR² ⇒ ×m², V = [[4|3]]πR³ ⇒ ×m³.',
  r:4.2,cz:1,modes:[['cyl','цилиндр'],['cone','конус'],['ball','шар']],s:[{k:'m',lab:'R × m',min:.5,max:2.5,step:.5,v:2},{k:'n',lab:'h × n',min:.5,max:3,step:.5,v:1}],
  draw:S=>{const{m,n}=S,R=1,h=1.6;
   if(S.mode==='ball')return{bodies:[sphB([-2.6,0,R],R,CK,{op:.6}),sphB([1.2,0,R*m],R*m,CO)],r:4.2,cz:1.4,info:`<p>Радиус ×${nf(m)}:</p><div class="big2">S ×m² = <b>${nf(m*m)}</b><br>V ×m³ = <b>${nf(m**3)}</b></div>`};
   const f=S.mode==='cyl'?cylB:coneB;return{bodies:[f(-2.6,0,0,R,h,CK,{op:.08,ec:'#94a3b8'}),f(1.4,0,0,R*m,h*n,CO,{op:.25})],
    info:`<div class="big2">V ×m²·n = ${nf(m)}²·${nf(n)} = <b>${nf(m*m*n)}</b></div>${S.mode==='cyl'?`<p>S<sub>бок</sub> = 2πRh ×m·n = ${nf(m*n)}</p>`:''}`}}},
 pyr:{title:'Правильная пирамида: апофема и высота',text:'В правильной пирамиде вершина S проектируется в центр O основания. Почти все задачи решаются через <b>прямоугольные треугольники</b>: SOM (высота, r, апофема) и SOA (высота, R, боковое ребро).',
  r:3.4,cz:0,modes:[['4','4-угольная'],['3','3-угольная'],['6','6-угольная']],s:[{k:'a',lab:'сторона a',min:2,max:6,step:1,v:6},{k:'h',lab:'высота h',min:1,max:12,step:1,v:4}],
  draw:S=>{const n=+S.mode,{a,h}=S,Rr=a/(2*Math.sin(PI/n)),r=a/(2*Math.tan(PI/n)),sc=3/Math.max(Rr,h*.8),z0=-h*sc/2,base=n===6?hexAt(Rr*sc,z0):ngon(n,Rr*sc,z0),Sx=[0,0,z0+h*sc],O=[0,0,z0],Mi=lerp(base[0],base[1],.5),ap=sq(h*h+r*r),ed=sq(h*h+Rr*Rr),Sb=n*a*a/(4*Math.tan(PI/n)),Sl=n*a*ap/2;
   const bod=[pyrB(base,Sx,CB,{op:.1})];if(n===6)base.forEach((p,i)=>bod.push(flatB([O,p,base[(i+1)%6]],i%2?'#93c5fd':'#c7d2fe',{op:.55,w:1,sc:'#6b83f5',lift:-50})));
   return{bodies:bod,lines:[ln(Sx,O,CK,'h',{dash:true,w:2}),ln(O,Mi,CG,'r',{w:2.2}),ln(Sx,Mi,CR,'апофема',{w:3}),ln(O,base[1],CO,'R',{w:2,dash:true}),ln(Sx,base[1],CV,'ребро',{w:3})],pts:[[Sx,'S'],[O,'O'],[Mi,'M',CR]],
    info:`<div class="big2">r = ${nf(r)} (до середины стороны)<br>R = ${nf(Rr)} (до вершины)<br>апофема = √(h² + r²) = <b>${nf(ap)}</b><br>ребро = √(h² + R²) = <b>${nf(ed)}</b></div><p>S<sub>осн</sub> = ${nf(Sb)}; S<sub>бок</sub> = [[1|2]]P·апофема = ${nf(Sl)}<br>S<sub>полн</sub> = <b>${nf(Sb+Sl)}</b>; V = [[1|3]]S<sub>осн</sub>h = <b>${nf(Sb*h/3)}</b></p><p class="hint2">Квадрат: r = [[a|2]]. Шестиугольник: R = a.</p>`}}},
 vessel:{title:'Сосуд: вода и деталь',text:'Когда деталь полностью погружают в воду, вода поднимается ровно на объём детали: <b>V<sub>дет</sub> = S<sub>дна</sub> · Δh</b>. Двигай бегунок «размер детали» — чем больше деталь, тем выше поднимается вода.',
  r:3.4,cz:0,s:[{k:'h0',lab:'уровень h',min:1,max:3,step:.25,v:2},{k:'c',lab:'размер детали',min:.3,max:1.9,step:.05,v:1.1}],
  draw:S=>{const R=1.8,{h0,c}=S,z0=-2.2,Sd=PI*R*R,Vd=c**3,dh=Vd/Sd,top=h0+dh,under=c<=top+1e-9;
   return{bodies:[cylB(0,0,z0,R,4.4,CK,{fill:false,ec:'#64748b',ew:1.6}),cylB(0,0,z0,R,top,CW,{op:.18,hid:false,ec:CW,ew:1.4}),boxB(-c/2,-c/2,z0,c,c,c,CO,{op:.55}),flatB(ngon(48,R,z0+h0,0),'#16213a',{op:0,w:2,dash:true,lift:9})],lines:[ln([R,0,z0],[R,0,z0+h0],CK,'h',{w:1.4}),ln([R,0,z0+h0],[R,0,z0+top],CR,'Δh',{w:3})],
    info:`<p>S<sub>дна</sub> = πR² ≈ ${nf(Sd)}</p><div class="big2">V<sub>дет</sub> = c³ = ${nf(Vd)}<br>Δh = [[V<sub>дет</sub>|S<sub>дна</sub>]] ≈ <b>${nf(dh)}</b></div>${under?'':'<p class="no2">Деталь торчит из воды — так в задачах не бывает: она должна быть погружена полностью.</p>'}<p class="hint2">Обратно: V<sub>дет</sub> = S<sub>дна</sub>·Δh, а S<sub>дна</sub> = V<sub>воды</sub> : h. Уровень вырос в q раз ⇒ V<sub>дет</sub> = (q − 1)·V<sub>воды</sub>.</p>`}}},
 pour:{title:'Переливаем в сосуд шире',text:'Объём жидкости не меняется. Если сторона основания стала в k раз больше, площадь основания выросла в <b>k²</b> раз, и уровень упал в k² раз.',
  r:4.3,cz:0,s:[{k:'k',lab:'сторона × k',min:1,max:3,step:.5,v:2}],
  draw:S=>{const k=S.k,a=1.5,H=4,h1=3.2,z0=-2,tri=(s,cx)=>ngon(3,s/sq(3),z0,-PI/2+.5,cx,0),h2=h1/(k*k);
   return{bodies:[prismB(tri(a,-3),H,CK,{fill:false,ec:'#64748b'}),prismB(tri(a,-3),h1,CW,{op:.25,ec:CW,hid:false}),prismB(tri(a*k,-.8+k*.85),H*.6,CK,{fill:false,ec:'#64748b'}),prismB(tri(a*k,-.8+k*.85),h2,CW,{op:.25,ec:CW,hid:false})],
    info:`<div class="big2">S<sub>2</sub> = k²·S<sub>1</sub> = ${nf(k*k)}·S<sub>1</sub><br>h<sub>2</sub> = [[h<sub>1</sub>|k²]] = [[${nf(h1)}|${nf(k*k)}]] = <b>${nf(h2,3)}</b></div>`}}},

// ======================= ВИЗУАЛИЗАТОР ФОРМУЛ =======================
 fm_prismV:{title:'V = S·h: призма и цилиндр из слоёв',text:'Разрежем призму (или цилиндр) на тонкие <b>слои</b> толщины Δh. Каждый слой — та же фигура основания S, объём слоя S·Δh. Слоёв h : Δh, значит <b>V = S·h</b>. Форма основания не важна!',
  r:3.6,cz:0,modes:[['tri','треугольник'],['hex','шестиугольник'],['cyl','круг']],s:[{k:'n',lab:'слоёв',min:1,max:10,step:1,v:4}],
  draw:S=>{const N=10,H=4,dz=H/N,z0=-2,base=S.mode==='tri'?ngon(3,2.2,z0):S.mode==='hex'?hexAt(2,z0):ngon(48,2,z0,0);const bods=[prismB(base,H,CK,{fill:false,ec:'#cbd5e1',ew:1.1})];
   for(let i=0;i<S.n;i++){const b=prismB(base.map(p=>[p[0],p[1],z0+i*dz]),dz*.92,i%2?CB:CW,{op:.32,ew:1.2});if(S.mode==='cyl')b.smooth=new Set(b.F.map((_,j)=>j).slice(2));bods.push(b)}
   return{bodies:bods,info:`<div class="big2">V<sub>слоя</sub> = S · Δh<br>V = ${S.n} слоёв · S·Δh</div><p>Когда сложим все ${N} слоёв: V = ${N} · S · [[h|${N}]] = <b>S · h</b>.</p><p class="hint2">Призма: S — многоугольник. Цилиндр: S = πR² ⇒ V = πR²h.</p>`}}},
 fm_coneV:{title:'Конус = ⅓ цилиндра: пирамида с «круглым» основанием',text:'Впишем в конус пирамиду с правильным n-угольником в основании. Для любой пирамиды V = [[1|3]]S·h. Чем больше сторон, тем ближе n-угольник к кругу, а пирамида — к конусу. В пределе: <b>V<sub>кон</sub> = [[1|3]]πR²h</b>.',
  r:3.2,cz:0,s:[{k:'n',lab:'сторон n',min:3,max:40,step:1,v:6}],
  draw:S=>{const n=S.n,R=2.2,h=3.8,z0=-1.9,base=ngon(n,R,z0,-PI/2-PI/n),Sn=n*R*R*Math.sin(2*PI/n)/2;
   return{bodies:[coneB(0,0,z0,R,h,CK,{op:.04,ec:'#cbd5e1',ew:1}),pyrB(base,[0,0,z0+h],CO,{op:.3,ew:1.6})],lines:[ln([0,0,z0],[0,0,z0+h],CK,'h',{dash:true,w:1.6}),ln([0,0,z0],[R,0,z0],CR,'R')],
    info:`<div class="big2">S<sub>${n}-угольника</sub> = <b>${nf(Sn/(R*R),4)}</b>·R²<br>πR² = <b>${nf(PI,4)}</b>·R²</div><p>Площадь n-угольника → πR², поэтому</p><div class="big2">V<sub>кон</sub> = [[1|3]]·πR²·h</div><p class="hint2">А пирамида = [[1|3]] призмы — смотри «Треугольная призма = 3 пирамиды».</p>`}}},
 fm_ballV:{title:'Объём шара: доказательство Архимеда',text:'Рядом стоят <b>полушар</b> радиуса R и <b>цилиндр</b> (радиус R, высота R), из которого вынули <b>конус</b> вершиной вниз. Режем оба тела одной горизонтальной плоскостью на высоте z. У полушара в сечении круг π(R² − z²). У цилиндра без конуса — кольцо πR² − πz². <b>Площади равны на любой высоте</b> ⇒ равны и объёмы (принцип Кавальери).',
  r:4.2,cz:.2,yaw:-0.25,pitch:.35,s:[{k:'z',lab:'высота z',min:0,max:1.95,step:.05,v:1}],
  draw:S=>{const R=2,z=S.z,L=[-2.4,0,-1],Rt=[2.4,0,-1],r1=sq(Math.max(0,R*R-z*z));
   const hemi=zoneB(L,R,0,R,CB,{op:.12,capBottom:true},40,12);hemi.edges=false;
   const cyl=cylB(Rt[0],Rt[1],Rt[2],R,R,CK,{op:.06,ec:'#94a3b8'});
   const cone=pyrB(ngon(48,R,Rt[2]+R,0,Rt[0],Rt[1]),Rt,CO,{op:.25});cone.smooth=new Set(cone.F.map((_,i)=>i).slice(1));
   const disk=flatB(ngon(60,r1,L[2]+z,0,L[0],L[1]),CR,{op:.55,lift:20,w:2});
   const ring=flatB(ngon(60,R,Rt[2]+z,0,Rt[0],Rt[1]),CR,{op:.55,lift:20,w:2,hole:ngon(60,Math.max(.001,z),Rt[2]+z,0,Rt[0],Rt[1])});
   const rim=ngon(60,R,L[2],0,L[0],L[1]);const lines=rim.map((p,i)=>ln(p,rim[(i+1)%60],CB,'',{w:1.6}));
   return{bodies:[hemi,cyl,cone,disk,ring],lines:[...lines,ln(L,[L[0],L[1],L[2]+z],CK,'z',{dash:true,w:1.6}),ln([L[0],L[1],L[2]+z],[L[0]+r1,L[1],L[2]+z],CR,'',{w:2.4}),ln(Rt,[Rt[0],Rt[1],Rt[2]+z],CK,'z',{dash:true,w:1.6})],
    info:`<div class="big2">Полушар: π(R² − z²) = <b>${nf(PI*(R*R-z*z))}</b><br>Кольцо: πR² − πz² = <b>${nf(PI*(R*R-z*z))}</b></div><p>Совпадает при любом z! Значит</p><div class="big2">V<sub>полушара</sub> = πR²·R − [[1|3]]πR²·R = [[2|3]]πR³<br>V<sub>шара</sub> = <b>[[4|3]]πR³</b></div>`}}},
 fm_ballS:{title:'Площадь сферы: «шляпная коробка» Архимеда',text:'Опишем около шара цилиндр. Разрежем оба двумя горизонтальными плоскостями. Пояс на сфере и пояс на цилиндре между ними имеют <b>одинаковую площадь</b> 2πR·Δz (сфера там уже, но круче). Вся сфера = вся боковая поверхность цилиндра: <b>S = 2πR·2R = 4πR²</b>. Второй способ — шар из «пирамидок» с вершиной в центре: V = [[1|3]]·S·R ⇒ S = [[3V|R]] = 4πR².',
  r:2.9,cz:0,yaw:-0.4,pitch:.28,modes:[['hat','пояс'],['pyr','пирамидки']],s:[{k:'z',lab:'положение пояса',min:-1.6,max:1.2,step:.05,v:.2},{k:'w',lab:'ширина Δz',min:.2,max:1.6,step:.05,v:.5}],
  draw:S=>{const R=2;if(S.mode==='pyr'){const bods=[sphB([0,0,0],R,CB,{op:.5})];const mk2=(th,ph,d)=>{const P=(t,p)=>[R*Math.cos(p)*Math.cos(t),R*Math.cos(p)*Math.sin(t),R*Math.sin(p)];return pyrB([P(th-d,ph-d),P(th+d,ph-d),P(th+d,ph+d),P(th-d,ph+d)],[0,0,0],CO,{op:.45})};
    bods.push(mk2(-PI/2,.25,S.w*.3),mk2(-PI/2-.9,-.4,S.w*.3),mk2(-PI/2+.8,.7,S.w*.3));
    return{bodies:bods,pts:[[[0,0,0],'O']],info:`<p>Каждая пирамидка: высота R, основание s<sub>i</sub> (кусочек сферы), объём [[1|3]]s<sub>i</sub>R.</p><div class="big2">V<sub>шара</sub> = [[1|3]]R·(s₁ + s₂ + …) = [[1|3]]R·S<br>[[4|3]]πR³ = [[1|3]]R·S ⇒ <b>S = 4πR²</b></div>`}}
   const z1=Math.max(-R,S.z),z2=Math.min(R,S.z+S.w);const band=zoneB([0,0,0],R,z1,z2,CR,{op:.65},40,6);band.edges=false;
   const cb=cylB(0,0,z1,R*1.001,z2-z1,CO,{op:.08,ec:CO,ew:2.6});band.lift=30;
   return{bodies:[sphB([0,0,0],R,CB,{op:.55}),cylB(0,0,-R,R,2*R,CK,{op:.04,ec:'#94a3b8'}),cb,band],lines:[ln([R,0,z1],[R,0,z2],CR,'Δz',{w:3})],
    info:`<div class="big2">S<sub>пояса цил</sub> = 2πR·Δz = <b>${nf(2*PI*R*(z2-z1))}</b><br>S<sub>пояса сферы</sub> = 2πR·Δz = <b>${nf(2*PI*R*(z2-z1))}</b></div><p>Растянем пояс на всю высоту 2R:</p><div class="big2">S<sub>сферы</sub> = 2πR·2R = <b>4πR²</b></div><p class="hint2">Поэтому S<sub>сферы</sub> = 4·πR² — четыре больших круга (сечения через центр).</p>`}}},
 fm_cylS:{title:'Развёртка цилиндра: S<sub>бок</sub> = 2πR·h',text:'Разрежем боковую поверхность цилиндра по образующей и развернём. Получится <b>прямоугольник</b>: одна сторона — высота h, другая — длина окружности C = 2πR. Тяни бегунок «развернуть».',
  r:5.6,cz:0,yaw:-0.3,pitch:.55,s:[{k:'t',lab:'развернуть',min:0,max:1,step:.02,v:.4},{k:'R',lab:'R',min:.6,max:1.6,step:.1,v:1.1}],
  draw:S=>{const R=S.R,h=2.6,z0=-h/2,N=48,k=(1-S.t)/R,L=2*PI*R;const pt=(s,z)=>k>1e-4?[Math.sin(k*s)/k,-R+(1-Math.cos(k*s))/k,z]:[s,-R,z];
   const V=[],F=[];for(let i=0;i<=N;i++){const s=-L/2+L*i/N;V.push(pt(s,z0),pt(s,z0+h))}for(let i=0;i<N;i++)F.push([2*i,2*i+2,2*i+3,2*i+1]);
   const sheet=poly(V,F,CB,{op:.28,smooth:new Set(F.map((_,i)=>i).slice(1,-1)),edges:false,ctr:[0,10,0]});const lines=[];
   for(let i=0;i<N;i++){lines.push(ln(V[2*i],V[2*i+2],CB,'',{w:2}),ln(V[2*i+1],V[2*i+3],CB,'',{w:2}))}
   lines.push(ln(V[0],V[1],CR,'',{w:3}),ln(V[2*N],V[2*N+1],CR,'h',{w:3}));if(S.t>.85)lines.push(ln(V[0],V[2*N],CO,'C = 2πR',{w:.01}));
   const bods=[sheet];if(S.t<.5){bods.push(flatB(ngon(48,R,z0+h,0),CK,{op:.06*(1-2*S.t),w:1}),flatB(ngon(48,R,z0,0),CK,{op:.06*(1-2*S.t),w:1}))}
   return{bodies:bods,lines,r:Math.max(2.6,L/2+.4),info:`<div class="big2">C = 2πR ≈ ${nf(L)}<br>S<sub>бок</sub> = C · h = <b>2πRh</b> ≈ ${nf(L*h)}</div><p>S<sub>полн</sub> = 2πRh + 2·πR² (добавили два круга-основания).</p>`}}},
 fm_coneS:{title:'Развёртка конуса: S<sub>бок</sub> = πRl',text:'Боковая поверхность конуса разворачивается в <b>сектор круга</b> радиуса l (образующая). Длина дуги сектора — это окружность основания 2πR. Площадь сектора = [[1|2]]·дуга·радиус = [[1|2]]·2πR·l = <b>πRl</b>.',flat:true,
  s:[{k:'R',lab:'R',min:.6,max:2.4,step:.1,v:1.4},{k:'h',lab:'h',min:1,max:4,step:.1,v:2.8}],
  draw:S=>{const{R,h}=S,l=sq(R*R+h*h),ang=2*PI*R/l,sc=70/Math.max(l,2.2);const cx=330,cy=150,Ls=l*sc;
   let p=`M${cx},${cy}`;const N=60;for(let i=0;i<=N;i++){const a=-PI/2-ang/2+ang*i/N;p+=`L${cx+Ls*Math.cos(a)},${cy-Ls*Math.sin(a)}`}p+='Z';
   const k=45/Math.max(R,h*.6),bx=100,by=220,Rx=R*k,hy=h*k;
   const svg=`<svg viewBox="0 0 460 300" class="v3" style="cursor:default"><path d="M${bx-Rx},${by} L${bx},${by-hy} L${bx+Rx},${by}" fill="#c7d2fe" stroke="#4f6bff" stroke-width="2.5"/><ellipse cx="${bx}" cy="${by}" rx="${Rx}" ry="${Rx*.3}" fill="#e0e7ff" stroke="#4f6bff" stroke-width="2"/><line x1="${bx}" y1="${by}" x2="${bx+Rx}" y2="${by}" stroke="#e2475b" stroke-width="2.5"/><text x="${bx+Rx/2}" y="${by+18}" class="l3" fill="#e2475b" text-anchor="middle">R</text><text x="${bx+Rx/2+14}" y="${by-hy/2}" class="l3" fill="#8b5cf6">l</text><text x="${bx}" y="${by+Rx*.3+28}" text-anchor="middle" font-size="13">конус</text>

function wireWork(I,env,steps,hl){const {task,R}=I;
 const inp=$('ans');if(inp){const pv=()=>{const v=inp.value.trim();if(!v){$('pv').textContent='';return}const r=ENG.studentValue(v);$('pv').textContent=r.err?'':(r.expr?'= '+ENG.fmt(r.v):'')};
  inp.oninput=()=>{R.ans=inp.value;save();pv()};inp.onkeydown=e=>{if(e.key==='Enter')doCheck()};pv();if(!R.done&&matchMedia('(pointer:fine)').matches)inp.focus({preventScroll:true})}

 if($('thB'))$('thB').onclick=()=>{if(!needStu())return;thOpen=!thOpen;if(thOpen&&!R.done){R.th=(R.th||0)+1}else if(thOpen){R.thAfter=(R.thAfter||0)+1}save();renderWork();renderSide()};

 else{const L=order(),i=L.findIndex(t=>t.id===task.id);$('prevB').disabled=i<=0;$('nextB').disabled=i>=L.length-1;$('prevB').onclick=()=>openTask(L[i-1].id);$('nextB').onclick=()=>openTask(L[i+1].id)}
 // рисование
 if(task.fig)setupDraw();

function setupDraw(){const wrap=$('dw'),cv=$('dCv');if(!wrap||!cv)return;const svg=wrap.querySelector('svg');if(!svg)return;const key=drawKey(),st=DRAW[key]||(DRAW[key]=[]);let col=DRAW._col||'#e2475b',curS=null;const g=cv.getContext('2d');

function originalCheck(){if(!needStu())return;const I=inst();if(!I||I.R.done)return;const {task,R}=I;const v=$('ans').value.trim();const fb=$('fb');
 if(!v){fb.className='fb bad';fb.textContent='Впиши ответ.';return}
 const r=ENG.studentValue(v);if(r.err){fb.className='fb bad';fb.textContent='Не получается прочитать запись. Пиши числа и знаки + − * / ( ) √, например 180-2*73 или 3√2.';return}
 const env=ENG.envOf(task,I.vars);R.ans=v;
 if(ENG.same(r.v,env.ans)){R.done=true;R.expr=r.expr;R.at=Date.now();save();afterSolve(I)}
 else{R.tries=(R.tries||0)+1;R.bad=[...(R.bad||[]),v].slice(-6);save();fb.className='fb bad';fb.textContent=`✗ Неверно${r.expr?` (твоё выражение = ${ENG.fmt(r.v)})`:''}. Проверь рассуждение и попробуй ещё раз.`;renderSide();
  const c=document.querySelector('.taskcard');c&&c.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:260})}}
function afterSolve(I){const {task,R}=I;const exprNote=R.expr?' Ответ засчитан по выражению.':'';
 if(cur.mode==='work'){const W=I.W;let msg='✓ Верно!'+exprNote;
  if(needAn(R)){const vars=ENG.gen(task,[task.proto,...W.items.filter(x=>x.tid===task.id).map(x=>x.vars)]);if(vars){W.items.push({...blankR(),tid:task.id,mode:'a',vars,extra:true});msg='✓ Верно, но с подсказкой — в конец работы добавлен аналог для закрепления.'}}
  else if(W.kind==='err'){TS(task.id).fixed=true}
  save();renderWork();const fb=$('fb');fb.className='fb '+(needAn(R)?'warn':'ok');fb.textContent=msg;renderSide();
  const nx=W.items.findIndex((x,j)=>!x.done&&j>cur.i),nx2=nx>=0?nx:W.items.findIndex(x=>!x.done);
  if(nx2>=0){fb.innerHTML+=' <span class="note">Переходим дальше…</span>';advTimer=setTimeout(()=>openWork(W.id,nx2),6500)}else{confetti();fb.innerHTML+=' <b>Работа выполнена! 🎉</b>'}return}
 const T=I.T;
 if(needAn(R)){const vars=ENG.gen(task,[task.proto,...T.a.map(a=>a.vars)]);save();renderWork();renderSide();const fb=$('fb');
  if(vars){T.a.push({...blankR(),vars,created:Date.now()});save();renderSide();fb.className='fb warn';fb.innerHTML=`✓ Верно!${exprNote} Но была подсказка${R.hint?'':' или ошибка'} — сейчас будет <b>такая же задача с другими числами</b>.`;advTimer=setTimeout(()=>{cur.k=T.a.length-1;thOpen=false;renderWork()},6500)}
  return}
 save();renderWork();renderSide();confetti();const fb=$('fb');fb.className='fb ok';fb.textContent=(cur.k==='p'?'✓ Верно! Задача решена.':'✓ Верно! Аналог решён — задача закрыта.')+exprNote;
 const nx=nextTask(task.id);if(nx){fb.innerHTML+=' <span class="note">Переходим к следующей…</span>';advTimer=setTimeout(()=>openTask(nx.id),6500)}else fb.innerHTML+=' <b>Все задачи решены! 🎉</b>'}
function confetti(){const box=document.createElement('div');box.className='confetti';const C=['#ff8a3d','#ff4f8b','#10b981','#4f6bff','#f5c400'];for(let i=0;i<34;i++){const s=document.createElement('i');const x=Math.random()*100,dx=(Math.random()-.5)*160,dur=900+Math.random()*700;s.style.cssText=`position:absolute;left:${x}%;top:-12px;width:8px;height:12px;border-radius:2px;background:${C[i%5]}`;s.animate([{transform:'translate(0,0) rotate(0)'},{transform:`translate(${dx}px,${innerHeight*.7}px) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:dur,easing:'cubic-bezier(.2,.6,.4,1)'});box.appendChild(s)}document.body.appendChild(box);setTimeout(()=>box.remove(),6500)}

function validateTask(t,ids){const E=[];if(!t||typeof t!=='object')return ['Задача должна быть объектом {…}'];
 for(const k of['id','topic','text','ans','proto'])if(t[k]===undefined)E.push('нет поля «'+k+'»');if(E.length)return E;

 let env;try{env=ENG.envOf(t,t.proto);if(!Number.isFinite(env.ans))E.push('ответ прототипа не число: '+env.ans)}catch(e){E.push('вычисление прототипа: '+e.message);return E}
 try{ENG.tpl(t.text,env);(t.steps||[]).forEach(s=>ENG.tpl(s[1],env))}catch(e){E.push('шаблон: '+e.message)}
 if(t.fig)try{ENG.figSVG(t.fig,env)}catch(e){E.push('чертёж: '+e.message)}
 if(t.v&&Object.keys(t.v).length){const g=ENG.gen(t,[t.proto]);if(!g)E.push('не удалось подобрать ни одного аналога: проверьте диапазоны v и условие ok (ответ должен быть конечной дробью, не больше dec знаков)')}
 (t.th||[]).forEach(id=>{if(!(BANK.theory||{})[id]&&!(ids&&ids.theory&&ids.theory[id]))E.push('нет стикера теории «'+id+'»')});return E}
function previewHtml(t){let h='';try{const env=ENG.envOf(t,t.proto);h+=`<div class="card"><b>Прототип</b> · ответ <b>${ENG.fmt(env.ans)}</b><p>${ENG.mk(ENG.tpl(t.text,env))}</p>${t.fig?safeFig(t.fig,env):''}</div>`;
 for(let i=0;i<3;i++){const v=ENG.gen(t,[t.proto]);if(!v){h+='<div class="card err">Аналог не подобрался</div>';break}const e=ENG.envOf(t,v);h+=`<div class="card"><b>Аналог ${i+1}</b> · ответ <b>${ENG.fmt(e.ans)}</b><p>${ENG.mk(ENG.tpl(t.text,e))}</p>${t.fig?safeFig(t.fig,e):''}<details><summary class="note">решение</summary>${(t.steps||[]).map(s=>`<p><b>${ENG.tpl(s[0],e)}.</b> ${ENG.mk(ENG.tpl(s[1],e))}</p>`).join('')}</details></div>`}}catch(e){h+=`<div class="err">${esc(e.message)}</div>`}return `<div class="prevgrid">${h}</div>`}

 <details class="note" style="margin-bottom:8px"><summary><b>Как устроена задача (шпаргалка)</b></summary><div style="columns:2;column-gap:24px;font-size:13px">
 <p><b>v</b> — переменные для аналогов: <code>[10,80]</code> целые от 10 до 80; <code>{"min":1,"max":10,"step":0.5}</code>; <code>{"list":[120,135,150]}</code>; <code>{"set":[[3,4,5],[7,24,25]],"as":["p","q","r"]}</code> — наборы.</p>

 <p><b>steps</b> — шаги подсказки [заголовок, текст]. <b>th</b> — номера стикеров теории (вкладка «Весь банк» → theory). <b>lvl</b> — уровень 1–3. <b>q</b> — короткое имя в меню.</p>
