<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>:root{--bg:#f4f6fb;--card:#fff;--ink:#1d2640;--mut:#6b7491;--line:#e3e7f1;--pri:#4f6bff;--pri2:#7b5cff;--ok:#16a36a;--okl:#dff6ea;--warn:#f0a400;--warnl:#fff2cc;--bad:#e5484d;--badl:#ffe3e3;--sh:0 6px 24px rgba(30,40,80,.08);--r:16px}

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito','Segoe UI',Roboto,Arial,sans-serif;font-size:16px}
button{font:inherit;cursor:pointer}input,select{font:inherit}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;line-height:1.15;font-size:.92em}.fr .nu{border-bottom:1.5px solid currentColor;padding:0 3px}.fr .de{padding:0 3px}

.btn{border:0;border-radius:12px;padding:10px 16px;background:var(--line);color:var(--ink);font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap}
.btn:hover{filter:brightness(.96);transform:translateY(-1px)}.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 4px 14px rgba(79,107,255,.35)}
.btn.ok{background:var(--ok);color:#fff}.btn.ghost{background:transparent;border:1.5px solid var(--line)}.btn.sm{padding:7px 11px;font-size:14px;border-radius:10px}.btn:disabled{opacity:.45;pointer-events:none}

.lcard{background:var(--card);border-radius:24px;box-shadow:var(--sh);padding:32px;max-width:460px;width:100%;text-align:center}.lcard h1{margin:6px 0 2px;font-size:26px}.lcard .sub{color:var(--mut);margin-bottom:22px}.logo{font-size:44px;line-height:1}

.prof{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}.prof button{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:700}.prof button small{color:var(--mut);font-weight:600}
.lfoot{margin-top:18px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

.ptxt{font-weight:800;font-size:14px;color:var(--mut)}.tbtns{display:flex;gap:6px;flex-wrap:wrap}
.wrap{display:grid;grid-template-columns:290px 1fr;gap:18px;padding:18px;max-width:1300px;margin:0 auto}
.side{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:12px;align-self:start;position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}
.tp{border-radius:12px;padding:8px 8px 10px;margin-bottom:6px}.tp.cur{background:var(--bg)}

.tp.fin .tph .ic{background:var(--ok)}.mini{height:5px;background:var(--line);border-radius:9px;margin:7px 0 7px 38px;overflow:hidden}.mini i{display:block;height:100%;background:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-left:38px}

.chip.ok{background:var(--ok);border-color:var(--ok);color:#fff}.chip.err{background:#7bd3a7;border-color:#7bd3a7;color:#08321f}.chip.hint{background:#ffd666;border-color:#ffd666;color:#4a3500}.chip.sol{background:#ffb27a;border-color:#ffb27a;color:#4a2000}
.chip.skip{border-style:dashed;border-color:var(--mut)}.chip.cur{outline:3px solid var(--pri);outline-offset:1px}.chip.an::after{content:'';position:absolute;top:2px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--pri2)}
.legend{font-size:12px;color:var(--mut);display:flex;flex-wrap:wrap;gap:8px;margin:8px 4px 2px}.legend span{display:inline-flex;align-items:center;gap:4px}.legend b{width:12px;height:12px;border-radius:4px;display:inline-block}
.main{min-width:0}.card{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:22px 24px;position:relative;overflow:hidden}

.lvl{color:#f0a400;font-size:15px;letter-spacing:1px}.qtext{font-size:20px;line-height:1.55;font-weight:600;margin:4px 0 12px}
.figbox{background:#fff;border-radius:16px;border:1px solid #edf0f7;padding:10px;margin-bottom:16px;color:#1d2640}
.gfig{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}.gp{text-align:center;font-weight:800;font-size:18px}.gp svg{width:210px;max-width:46vw;height:auto;background:#fff;border:1px solid #e3e8f3;border-radius:12px;display:block}
.gfig.one .gp svg{width:300px;max-width:80vw}.gfig.four .gp svg{width:190px}
.fopts{display:flex;flex-wrap:wrap;gap:8px 22px;justify-content:center;margin-top:10px;font-size:19px}.fopts .foh{font-weight:800;color:#6b7491}.fo b{color:#4f6bff}
.ans{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.ans label{font-weight:800}
.ans input{width:180px;padding:12px 14px;border-radius:14px;border:2.5px solid var(--line);font-size:22px;font-weight:800;text-align:center;background:var(--bg);color:var(--ink)}
.ans input:focus{outline:none;border-color:var(--pri)}.ans input.bad{border-color:var(--bad);animation:shake .4s}.ans input.good{border-color:var(--ok);background:var(--okl)}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.fb{margin-top:12px;padding:12px 14px;border-radius:14px;font-weight:700;display:none}.fb.show{display:block}.fb.bad{background:var(--badl);color:var(--bad)}.fb.good{background:var(--okl);color:var(--ok)}
.fb .nx{height:5px;background:rgba(22,163,106,.25);border-radius:9px;margin-top:8px;overflow:hidden}.fb .nx i{display:block;height:100%;background:var(--ok);width:0;transition:width .9s linear}
.helpers{margin-top:16px;padding:10px 12px 12px;border-radius:16px;background:color-mix(in srgb,var(--c,#4f6bff) 7%,var(--bg));border:1.5px dashed color-mix(in srgb,var(--c,#4f6bff) 45%,transparent)}
.helpers .hlh{font-size:11.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.3px;margin-bottom:8px}.helpers .hrow{display:flex;gap:8px;flex-wrap:wrap}
.hintzone{margin-top:14px}.hintzone.on{padding:12px;border-radius:14px;background:var(--bg);border:1.5px solid var(--line)}.hz-t{font-weight:800;margin:10px 0 8px;display:flex;align-items:center;gap:8px}
.steps{display:flex;flex-direction:column;gap:8px}.step{background:var(--bg);border-left:4px solid var(--pri);border-radius:10px;padding:10px 12px;line-height:1.6;animation:pop .3s}.step b.k{color:var(--pri);margin-right:6px}.step.vcur{box-shadow:0 0 0 3px #f0a02088}
.fref{border:1px solid #b9a4ea;background:#f3eefe;color:#5b3cc4;border-radius:7px;font-weight:800;font-size:12px;padding:1px 6px;cursor:pointer;margin-left:6px}
.btn.vbtn{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;font-weight:800;box-shadow:0 4px 14px #ef444455}.btn.on2{background:#6b46c1;color:#fff}.btn.vbtn.on2{box-shadow:0 0 0 3px #f59e0b88}
.stks{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;padding:6px 2px 4px}
.stk{background:var(--sc);border-radius:6px 6px 18px 6px;padding:14px 14px 12px;color:#1d2640;box-shadow:0 8px 18px rgba(40,40,80,.13),inset 0 -3px 0 rgba(0,0,0,.04);transform:rotate(var(--rot));position:relative;border-top:6px solid var(--se);transition:.2s}
.stk:hover{transform:rotate(0) scale(1.02)}.stk-pin{position:absolute;top:-11px;left:50%;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff 0,var(--se) 45%,#0003 100%);transform:translateX(-50%)}
.stk-t{font-weight:900;font-size:15px;margin-bottom:6px}.stk-b{display:flex;flex-direction:column;gap:8px}.stk-x{font-size:14px;line-height:1.6}
.stk-f{display:flex;justify-content:center;background:#ffffff8c;border-radius:10px;padding:4px}.stk-f svg{width:190px;height:auto;display:block}
.stk-no{display:inline-block;background:#ffffffb0;border-radius:6px;padding:0 6px;margin-right:6px;font-size:12.5px;border:1px solid #0002}
.stk-l{margin-top:8px;font-size:12px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;color:#4a5170}.stk-l .tl{border:0;background:#fff;border-radius:6px;padding:2px 6px;font-weight:800;font-size:12px;cursor:pointer;color:#1d2640}.stk-l .tl.off{opacity:.45}
.stk.flash{animation:flash 1.3s ease}@keyframes flash{0%,60%{box-shadow:0 0 0 6px var(--pri)}100%{box-shadow:0 8px 18px rgba(40,40,80,.13)}}.stk.vcur{box-shadow:0 0 0 4px #f0a020aa,0 10px 24px rgba(0,0,0,.2);transform:none}
.tt{border-collapse:collapse;margin-top:6px;font-size:13px}.tt td,.tt th{border:1px solid #0002;padding:3px 6px;text-align:center}.tt th{background:#fff8}
.memo h2{margin:22px 0 10px;display:flex;align-items:center;gap:10px}.memo h2 i{width:18px;height:18px;border-radius:5px;display:inline-block}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.toc button{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 10px;font-weight:700;font-size:13px}
.mbg{position:fixed;inset:0;background:rgba(15,20,40,.45);z-index:50;display:grid;place-items:center;padding:16px}
.mdl{background:var(--card);border-radius:20px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}.mdl.wide{max-width:1150px}.mdl.full{max-width:min(1320px,97vw);width:97vw;max-height:96vh;padding:16px}.mdl h2{margin-top:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}.stat{background:var(--bg);border-radius:14px;padding:12px}.stat b{font-size:26px;display:block}.stat span{font-size:13px;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2640;color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:300;box-shadow:var(--sh);animation:pop .3s}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.fld span{font-size:13px;color:var(--mut);font-weight:700}.fld input,.fld select{padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs button{border:0;padding:9px 14px;border-radius:10px;background:var(--bg);color:var(--ink);font-weight:800}.tabs button.on{background:var(--pri);color:#fff}
.pgrid{display:grid;grid-template-columns:1fr 300px;gap:16px}.plist{max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px}.plist .pt{font-weight:800;margin:8px 0 4px;display:flex;align-items:center;gap:6px}
.plist label{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;margin:3px 8px 3px 0;padding:3px 7px;border-radius:8px;background:var(--bg)}.opts label{display:flex;gap:8px;align-items:center;padding:5px 0;font-weight:600}
table.st{width:100%;border-collapse:collapse;font-size:14px}table.st td,table.st th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.done-card{text-align:center;padding:40px 24px}.done-card .big{font-size:64px}.conf{position:absolute;pointer-events:none;font-size:22px;animation:fly 1.2s ease-out forwards}@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}

.flagg .pt{font-weight:800;margin:10px 0 4px;display:flex;align-items:center;gap:8px}.flag{display:inline-flex;align-items:center;gap:4px;margin:3px 6px 3px 0;padding:5px 9px;border-radius:9px;background:var(--bg);font-size:14px;cursor:pointer;border:1.5px solid transparent;user-select:none}
.flag.on{border-color:#e5484d;background:#ffe9e9;color:#1d2640}.flag .fl{opacity:.25}.flag.on .fl{opacity:1}
.switch{display:flex;align-items:center;gap:10px;font-weight:700;padding:12px;border-radius:12px;background:var(--bg);margin:10px 0;cursor:pointer}.switch input{width:22px;height:22px}
.modeb{font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;background:#e3f6ec;color:#0f7a4d;white-space:nowrap}.modeb.home{background:#fff0e0;color:#b25e00}
.modesel{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap}.modesel button{flex:1;min-width:200px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:3px}.modesel button small{color:var(--mut);font-weight:600}.modesel button.on{border-color:var(--pri);background:#eef1ff}

.scwrap{display:grid;grid-template-columns:210px 1fr;gap:14px}.sclist{display:flex;flex-direction:column;gap:6px;max-height:88vh;overflow:auto}

.blks{display:flex;gap:6px;margin:6px 0 4px}.blk{flex:1;border:1.5px solid color-mix(in srgb,var(--c) 40%,transparent);background:color-mix(in srgb,var(--c) 8%,var(--card));color:var(--ink);border-radius:10px;padding:6px 8px;font-weight:750;font-size:13px;display:flex;gap:4px;align-items:center;justify-content:center}
.blk.on{background:var(--c);color:#fff;border-color:var(--c)}.tbd{font-size:11px;padding:1px 6px;border-radius:8px;background:#fff2cc;color:#8a6400}.tbd.ok{background:var(--okl);color:var(--ok)}.tbd.sk{background:var(--line);color:var(--mut)}

<script>
const SOURCE='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
/* ===== Разметка формул: √{x}, {a/b}, ^{n}, _{n}, **жирный** ===== */
function tok(s){const out=[];let buf='';const flush=()=>{if(buf){out.push({k:'t',s:buf});buf='';}};
 const match=i=>{let d=0;for(let j=i;j<s.length;j++){if(s[j]==='{')d++;else if(s[j]==='}'){d--;if(d===0)return j;}}return s.length-1;};
 for(let i=0;i<s.length;i++){const ch=s[i];
  if((ch==='√'||ch==='^'||ch==='_')&&s[i+1]==='{'){flush();const e=match(i+1);out.push({k:ch==='√'?'sq':ch==='^'?'sup':'sub',s:s.slice(i+2,e)});i=e;continue;}
  if(ch==='{'){const e=match(i);const inner=s.slice(i+1,e);let d=0,cut=-1;for(let j=0;j<inner.length;j++){const c=inner[j];if(c==='{')d++;else if(c==='}')d--;else if(c==='/'&&d===0){cut=j;break;}}
   flush();if(cut>=0)out.push({k:'fr',n:inner.slice(0,cut),d:inner.slice(cut+1)});else out.push({k:'g',s:inner});i=e;continue;}
  buf+=ch;}
 flush();return out;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function M(s){if(s==null)return '';return tok(String(s)).map(t=>{
 if(t.k==='t')return t.s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
 if(t.k==='sq')return '<span class="sq">√<span class="ov">'+M(t.s)+'</span></span>';
 if(t.k==='sup')return '<sup>'+M(t.s)+'</sup>';if(t.k==='sub')return '<sub>'+M(t.s)+'</sub>';
 if(t.k==='fr')return '<span class="fr"><span class="nu">'+M(t.n)+'</span><span class="de">'+M(t.d)+'</span></span>';
 return M(t.s);}).join('');}
/* ===== Формулы из чисел ===== */
const MN='−';
const nf=v=>String(+(+v).toFixed(4)).replace('.',',').replace('-',MN);
function fr(v){const s=v<0?MN:'';const a=Math.abs(v);if(Math.abs(a-Math.round(a))<1e-9)return s+Math.round(a);
 for(const d of [2,3,4,5,6,8]){const n=a*d;if(Math.abs(n-Math.round(n))<1e-9)return s+'{'+Math.round(n)+'/'+d+'}';}return s+nf(a);}
function terms(parts){let o='';parts.forEach(([c,v])=>{if(!c)return;const a=Math.abs(c);const body=(v&&a===1)?v:fr(a)+v;if(!o)o=(c<0?MN:'')+body;else o+=(c<0?' '+MN+' ':' + ')+body;});return o||'0';}
const linF=(k,b)=>'y = '+terms([[k,'x'],[b,'']]);
const quadF=(a,b,c)=>'y = '+terms([[a,'x^{2}'],[b,'x'],[c,'']]);
function hypF(k){const s=k<0?MN:'';const a=Math.abs(k);if(Math.abs(a-Math.round(a))<1e-9)return 'y = '+s+'{'+Math.round(a)+'/x}';return 'y = '+s+'{1/'+Math.round(1/a)+'x}';}
const SG=v=>v>0?'> 0':v<0?'< 0':'= 0';
/* ===== Рисование графиков ===== */
let _pc=0;
function plot(o){o=o||{};const R=o.R||6,Rx=o.Rx||R,Ry=o.Ry||R,W=o.w||220,pad=o.pad==null?16:o.pad;const s=(W-2*pad)/(2*Rx),H=2*Ry*s+2*pad;
 const X=x=>pad+(x+Rx)*s,Y=y=>pad+(Ry-y)*s;const id='c'+(++_pc);let g='';const f1=v=>v.toFixed(1);
 if(o.grid){for(let i=-Math.floor(Rx);i<=Math.floor(Rx);i++)g+=`<line x1="${f1(X(i))}" y1="${pad}" x2="${f1(X(i))}" y2="${f1(H-pad)}" stroke="#dfe6f1" stroke-width="1"/>`;
  for(let j=-Math.floor(Ry);j<=Math.floor(Ry);j++)g+=`<line x1="${pad}" y1="${f1(Y(j))}" x2="${f1(W-pad)}" y2="${f1(Y(j))}" stroke="#dfe6f1" stroke-width="1"/>`;}
 const y0=Y(0),x0=X(0);
 g+=`<line x1="${pad-6}" y1="${f1(y0)}" x2="${W-pad+6}" y2="${f1(y0)}" stroke="#22304d" stroke-width="1.5"/><line x1="${f1(x0)}" y1="${f1(H-pad+6)}" x2="${f1(x0)}" y2="${pad-6}" stroke="#22304d" stroke-width="1.5"/>`;
 g+=`<polygon points="${W-pad+7},${f1(y0)} ${W-pad-1},${f1(y0-3.5)} ${W-pad-1},${f1(y0+3.5)}" fill="#22304d"/><polygon points="${f1(x0)},${pad-7} ${f1(x0-3.5)},${pad+1} ${f1(x0+3.5)},${pad+1}" fill="#22304d"/>`;
 const T=(x,y,t,an,sz,c,st)=>`<text x="${f1(x)}" y="${f1(y)}" font-size="${sz||10}" fill="${c||'#22304d'}" text-anchor="${an||'middle'}"${st?' font-style="italic"':''} font-weight="700">${t}</text>`;
 g+=T(W-pad+2,y0-7,'x',0,12,0,1)+T(x0+10,pad-2,'y',0,12,0,1)+T(x0-7,y0+12,'0','end',10);
 if(o.nums){const st=o.step||1;for(let i=-Math.floor(Rx);i<=Math.floor(Rx);i+=st){if(!i)continue;g+=T(X(i),y0+12,String(i).replace('-',MN),0,8.5);}for(let j=-Math.floor(Ry);j<=Math.floor(Ry);j+=st){if(!j)continue;g+=T(x0-4,Y(j)+3,String(j).replace('-',MN),'end',8.5);}}
 else if(o.grid){g+=T(X(1),y0+12,'1')+T(x0-4,Y(1)+3,'1','end');}
 (o.segs||[]).forEach(q=>{g+=`<line x1="${f1(X(q.x0))}" y1="${f1(y0)}" x2="${f1(X(q.x1))}" y2="${f1(y0)}" stroke="${q.col}" stroke-width="${q.w||5}" stroke-linecap="round" opacity=".7"/>`;});
 let cv='';(o.fns||[]).forEach(F=>{const a=F.x0!=null?F.x0:-Rx-.5,b=F.x1!=null?F.x1:Rx+.5;const n=Math.ceil((b-a)/0.04);let d='',pen=false,py=null;
  for(let i=0;i<=n;i++){const x=a+(b-a)*i/n;const y=F.f(x);if(!isFinite(y)||Math.abs(y)>Ry*4){pen=false;py=null;continue;}if(py!=null&&Math.abs(y-py)>Ry*1.5)pen=false;d+=(pen?'L':'M')+f1(X(x))+','+f1(Y(y));pen=true;py=y;}
  cv+=`<path d="${d}" fill="none" stroke="${F.col||'#2f6fe4'}" stroke-width="${F.w||2.4}"${F.dash?' stroke-dasharray="5 4"':''} stroke-linecap="round" stroke-linejoin="round"/>`;});
 g+=`<g clip-path="url(#${id})">${cv}</g>`;
 (o.pts||[]).forEach(p=>{g+=`<circle cx="${f1(X(p.x))}" cy="${f1(Y(p.y))}" r="${p.r||3.4}" fill="${p.col||'#e5484d'}"/>`;if(p.t)g+=T(X(p.x)+(p.dx||8),Y(p.y)+(p.dy||-6),p.t,p.an||'start',p.sz||11,p.col||'#e5484d');});
 return `<svg viewBox="0 0 ${W} ${f1(H)}" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',Arial,sans-serif"><defs><clipPath id="${id}"><rect x="${pad-2}" y="${pad-2}" width="${W-2*pad+4}" height="${f1(H-2*pad+4)}"/></clipPath></defs>${g}</svg>`;}
function figHTML(f){if(!f)return '';const n=(f.plots||[]).length;let h=`<div class="gfig ${n===1?'one':n>=4?'four':''}">`+(f.plots||[]).map(p=>`<div class="gp">${plot(p)}${p.cap?'<span>'+p.cap+'</span>':''}</div>`).join('')+'</div>';
 if(f.opts)h+=`<div class="fopts">${f.optHead?'<span class="foh">'+f.optHead+'</span>':''}${f.opts.map((t,i)=>`<span class="fo"><b>${f.ol?f.ol[i]:(i+1)}</b> ${M(t)}</span>`).join('')}</div>`;return h;}
/* ===== Факты (памятки) ===== */
const STICK_GROUPS=[{id:'g1',name:'Прямая y = kx + b',color:'#dbeaff',edge:'#5b8def'},{id:'g2',name:'Парабола y = ax² + bx + c',color:'#d9f7e6',edge:'#3ec68a'},{id:'g3',name:'Гипербола и корень',color:'#ffe8cc',edge:'#f59f00'},{id:'g4',name:'Как разбирать и читать график',color:'#ece3ff',edge:'#9b7bea'}];
const LF=(k,b,c)=>({f:x=>k*x+b,col:c||'#2f6fe4'}),PF=(a,b,c,col)=>({f:x=>a*x*x+b*x+c,col:col||'#2f6fe4'}),HF=(k,col)=>({f:x=>k/x,col:col||'#2f6fe4'});
const SQF={f:x=>Math.sqrt(x),x0:0,col:'#2f6fe4'};
const STICKERS=[
{id:'lin_def',g:'g1',title:'Линейная функция',text:'y = kx + b — график <b>прямая</b>.<br>k — наклон, b — где прямая пересекает ось Oy.<br>Для построения хватит двух точек.',fig:{R:4,grid:1,fns:[LF(1,1)]},
 d:'Линейная функция задаётся формулой y = kx + b. Её график — прямая линия. Число k отвечает за наклон прямой, число b — за то, где прямая пересекает ось Oy. Чтобы построить прямую, достаточно двух точек.',s:'График y = kx + b — прямая. k — наклон, b — пересечение с осью Oy.'},
{id:'lin_k',g:'g1',title:'Коэффициент k — наклон',text:'k > 0 — прямая идёт <b>вверх</b> (слева направо).<br>k < 0 — идёт <b>вниз</b>.<br>Чем больше |k|, тем круче. k — шаг по y при шаге 1 по x.',fig:{R:4,grid:1,fns:[LF(2,-1,'#e5484d'),LF(0.5,-1,'#13a37a'),LF(-1,-1,'#7b5cff')]},
 d:'Коэффициент k — это наклон. Если k больше нуля, прямая идёт вверх слева направо. Если k меньше нуля — вниз. Чем больше модуль k, тем круче прямая. Число k показывает, на сколько изменяется y, когда x увеличивается на единицу.',s:'k больше нуля — прямая вверх, меньше нуля — вниз. Больше модуль k — круче.'},
{id:'lin_b',g:'g1',title:'Коэффициент b — пересечение с Oy',text:'При x = 0 получаем y = b.<br>Прямая пересекает ось Oy в точке <b>(0; b)</b>.<br>b > 0 — выше начала координат, b < 0 — ниже.',fig:{R:4,grid:1,fns:[LF(1,2)],pts:[{x:0,y:2,t:'(0; b)'}]},
 d:'Подставим x равно нулю: получится y равно b. Значит, прямая пересекает ось Oy в точке с координатами ноль и b. Если b больше нуля, эта точка выше начала координат, если меньше нуля — ниже.',s:'Прямая пересекает ось Oy в точке (0; b).'},
{id:'lin_sp',g:'g1',title:'Особые прямые',text:'b = 0: y = kx — прямая через начало координат.<br>k = 0: y = b — горизонтальная прямая.<br>Одинаковые k — прямые параллельны.',fig:{R:4,grid:1,fns:[LF(2,0,'#e5484d'),LF(0,3,'#13a37a'),LF(-1,0,'#7b5cff')]},
 d:'Если b равно нулю, получается y = kx, и прямая проходит через начало координат. Если k равно нулю, получается y = b, это горизонтальная прямая. Прямые с одинаковыми значениями k параллельны.',s:'b равно нулю — через начало координат. k равно нулю — горизонтальная прямая.'},
{id:'lin_sign',g:'g1',title:'Знаки k и b по картинке',text:'<table class="tt"><tr><th></th><th>b > 0</th><th>b < 0</th></tr><tr><th>k > 0</th><td>вверх, пересекает Oy выше нуля</td><td>вверх, Oy ниже нуля</td></tr><tr><th>k < 0</th><td>вниз, Oy выше нуля</td><td>вниз, Oy ниже нуля</td></tr></table>Сначала смотри на наклон (k), потом — где прямая режет ось Oy (b).',fig:{R:4,fns:[LF(1,-1.5,'#e5484d'),LF(-1,2,'#13a37a')]},
 d:'Чтобы определить знаки, сначала посмотри на наклон. Идёт вверх — k больше нуля, вниз — k меньше нуля. Потом посмотри, где прямая пересекает ось Oy. Выше начала координат — b больше нуля, ниже — b меньше нуля.',s:'Наклон вверх — k больше нуля. Пересечение с Oy выше нуля — b больше нуля.'},
{id:'par_def',g:'g2',title:'Парабола: вид и ветви',text:'y = ax² + bx + c, a ≠ 0 — график <b>парабола</b>.<br>a > 0 — ветви <b>вверх</b> (улыбка).<br>a < 0 — ветви <b>вниз</b>.',fig:{R:5,grid:1,fns:[PF(1,0,-2,'#e5484d'),PF(-1,0,2,'#13a37a')]},
 d:'Квадратичная функция y = ax² + bx + c, где a не равно нулю, имеет графиком параболу. Если a больше нуля, ветви параболы направлены вверх. Если a меньше нуля — вниз.',s:'a больше нуля — ветви вверх, a меньше нуля — вниз.'},
{id:'par_a',g:'g2',title:'Коэффициент a — раскрытие ветвей',text:'Чем больше |a|, тем парабола <b>уже</b>; чем меньше |a| — тем шире.<br>y = x², y = 2x², y = {1/2}x².',fig:{R:5,grid:1,fns:[PF(2,0,0,'#e5484d'),PF(1,0,0),PF(0.5,0,0,'#13a37a')]},

 const m=document.createElement('div');m.className='mbg';m.id='scm';m.onclick=e=>{if(e.target===m)m.remove();};
 m.innerHTML=`<div class="mdl wide"><div class="row"><h2 style="flex:1">🎛 ${esc(c.n)}</h2><button class="btn" onclick="$('scm').remove();stop()">✕</button></div><div class="schint">${c.h}</div>
 <div class="scwrap" style="grid-template-columns:1fr"><div class="scgrid"><div class="scstage" id="scs"></div><div class="scinfo"><div class="sliders">${c.sl.map(s=>`<label class="sld">${s[0]}<input type="range" min="${s[1]}" max="${s[2]}" step="${s[3]}" value="${s[4]}" oninput="_sp['${s[0]}']=+this.value;drawScene()"><output id="o_${s[0]}">${s[4]}</output></label>`).join('')}</div><div id="sci"></div>
 ${vbar(()=>c.h,()=>c.h+' '+(window._si||[]).map(r=>r.join(': ')).join('. '))}</div></div></div></div>`;document.body.appendChild(m);drawScene();}
function drawScene(){const c=SC[_sc],p=_sp;const o=c.mk(p);$('scs').innerHTML=plot({R:7,w:520,grid:1,nums:1,fns:o.fns,pts:o.pts,segs:o.segs});
 for(const k in p){const e=$('o_'+k);if(e)e.textContent=nf(p[k]);}window._si=c.info(p);$('sci').innerHTML=window._si.map(r=>`<div class="srow val"><span>${M(r[0])}</span><b>${M(r[1])}</b></div>`).join('');}
/* ===== ПАМЯТКИ ===== */
function stickerCard(id){const s=STICK[id];return stickerHTML(s,{flat:1});}
function openStk(ids,title){const m=document.createElement('div');m.className='mbg';m.onclick=e=>{if(e.target===m){m.remove();stop();}};
 m.innerHTML=`<div class="mdl wide"><div class="row"><h2 style="flex:1">${title||'📌 Памятки'}</h2><button class="btn" onclick="this.closest('.mbg').remove();stop()">✕</button></div><div class="stks" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:10px">${ids.map(i=>`<div>${stickerCard(i)}<div class="row" style="margin-top:6px"><button class="btn sm" onclick="say(STICK['${i}'].s)">🔊 Кратко</button><button class="btn sm" onclick="say(STICK['${i}'].d)">🔊 Подробно</button></div></div>`).join('')}</div></div>`;document.body.appendChild(m);}
const allMemo=()=>openStk(STICKERS.map(s=>s.id),'📌 Все памятки');
/* ===== ВХОД ===== */
function loginView(){const n=Object.keys(DB.users);return `<div class="login"><div class="lcard"><div class="logo">📈</div><h1>Графики функций</h1><div class="sub">ОГЭ · задание 11 · тренажёр</div>
 <input id="nm" placeholder="Твоё имя" onkeydown="if(event.key==='Enter')enter($('nm').value)"><button class="btn pri" style="width:100%;justify-content:center" onclick="enter($('nm').value)">Начать</button>
 ${n.length?`<div class="prof">${n.map(x=>`<button onclick="enter('${esc(x).replace(/'/g,'')}')">${esc(x)}</button>`).join('')}</div>`:''}
 <div class="lfoot"><button class="btn sm ghost" onclick="toggleTheme()">🌙 Тема</button></div></div></div>`;}
function enter(n){n=(n||'').trim();if(!n)return toast('Введи имя');S.user=n;U();save();S.t='t1';S.m='theory';render();}
function toggleTheme(){DB.theme=DB.theme==='dark'?'light':'dark';save();render();}
/* ===== ПРОГРЕСС ===== */
const tkey=(t)=>t.key||(t.type+':'+t.seed);
function prog(t){const u=U();const L=taskList(t);const d=L.filter(x=>u.tasks[tkey(x)]&&u.tasks[tkey(x)].st).length;return {done:d,total:L.length};}
function totalProg(){let d=0,n=0;TOPICS.forEach(t=>{const p=prog(t);d+=p.done;n+=p.total;});return [d,n];}
function sideHTML(){const u=U();return TOPICS.map(t=>{const p=prog(t),L=taskList(t),tdone=u.tests[t.id];return `<div class="tp ${S.t===t.id?'cur':''} ${p.done===p.total&&tdone?'fin':''}"><div class="tph" onclick="go('${t.id}','theory')"><span class="ic">${t.ic}</span>${t.n}<span class="done">${p.done}/${p.total}</span></div>
 <div class="blks" style="--c:${t.c};margin-left:38px"><button class="blk ${S.t===t.id&&S.m==='theory'?'on':''}" style="--c:${t.c}" onclick="go('${t.id}','theory')">📖</button><button class="blk ${S.t===t.id&&S.m==='test'?'on':''}" style="--c:${t.c}" onclick="go('${t.id}','test')">✅ ${tdone?'✓':''}</button></div>
 <div class="chips">${L.map((x,i)=>{const r=u.tasks[tkey(x)];const cl=r&&r.st?r.st:'';return `<button class="chip ${cl} ${S.t===t.id&&S.m==='task'&&S.i===i?'cur':''} ${x.kind==='a'?'an':''}" onclick="go('${t.id}','task',${i})">${i+1}</button>`;}).join('')}</div></div>`;}).join('')+`<div class="legend"><span><b style="background:var(--ok)"></b>сразу</span><span><b style="background:#7bd3a7"></b>с ошибкой</span><span><b style="background:#ffd666"></b>подсказка</span><span><b style="background:#ffb27a"></b>решение</span></div>`;}
function go(t,m,i){stop();S.t=t;S.m=m;S.i=i||0;S.ts=null;S.cur=null;render();window.scrollTo(0,0);}
/* ===== ТЕОРИЯ ===== */
function theoryHTML(t){return `<div class="card pop"><div class="chead"><span class="badge tpc">Теория</span><h2 style="margin:0">${t.ic} ${t.n}</h2></div>
 ${vbar(()=>t.stk.map(i=>STICK[i].s).join(' '),()=>t.stk.map(i=>STICK[i].d).join(' '))}
 <div class="stks" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin:12px 0">${t.stk.map(i=>stickerCard(i)).join('')}</div>
 <div class="row">${t.sc.map(s=>`<button class="btn" onclick="openScene('${s}')">🎛 Сцена: ${SCN[s]}</button>`).join('')}</div>
 <div class="row" style="margin-top:16px"><button class="btn pri" onclick="go('${t.id}','test')">Дальше: тест по теории →</button></div></div>`;}
/* ===== ТЕСТ: все вопросы, ошибочные повторяются до верного ответа ===== */
function testHTML(t){const Q=TESTS[t.id];if(!S.ts)S.ts={queue:Q.map((_,i)=>i),pos:0,wrong:[],ok:0,ans:null};const s=S.ts;
 if(s.pos>=s.queue.length){if(s.wrong.length){s.queue=s.wrong;s.wrong=[];s.pos=0;s.round=(s.round||1)+1;return testHTML(t);}U().tests[t.id]=1;save();
 return `<div class="card done-card"><div class="big">🎉</div><h2>Тест пройден!</h2><p>Теория усвоена. Можно переходить к задачам.</p><button class="btn pri" onclick="go('${t.id}','task',0)">К задачам →</button> <button class="btn" onclick="S.ts=null;render()">Пройти заново</button></div>`;}
 const qi=s.queue[s.pos],q=Q[qi];const a=s.ans;
 return `<div class="card tcard pop" style="--c:${t.c}"><div class="chead"><span class="badge tpc">Тест · ${t.n}</span><span class="num">Вопрос ${s.pos+1} из ${s.queue.length}${s.round?' (повтор ошибок)':''}</span></div>
 <div class="qtext">${M(q[0])}</div><div class="topts">${q[1].map((o,i)=>`<button class="topt ${a?(i===q[2]?'good':(i===a.pick?'bad':'')):''}" ${a?'disabled':''} onclick="tAns(${i})">${M(o)}</button>`).join('')}</div>
 ${a?`<div class="redo" style="margin-top:12px">${a.pick===q[2]?'✅ Верно! ':'❌ Не совсем. '}${M(q[3])}</div><button class="btn pri" onclick="S.ts.pos++;S.ts.ans=null;render()">Дальше →</button>`:''}
 ${vbar(()=>q[0],()=>q[0]+' Варианты: '+q[1].map((o,i)=>(i+1)+'. '+o).join('. '))}</div>`;}
function tAns(i){const s=S.ts,q=TESTS[S.t][s.queue[s.pos]];s.ans={pick:i};if(i!==q[2])s.wrong.push(s.queue[s.pos]);else s.ok++;render();}
/* ===== ЗАДАЧИ ===== */
function taskObj(){const t=topicOf(S.t),L=taskList(t);const e=L[S.i];if(!e)return null;if(!S.cur||S.cur.key!==tkey(e)||S.cur._i!==S.i){S.cur=mkTask(e);S.cur._i=S.i;S.cur.kind=e.kind;S.cur.h=0;S.cur.res=null;S.cur.showSol=false;}return S.cur;}
function inputHTML(t){if(t.in.k==='sel')return `<div class="row">${[0,1,2].map(i=>`${LET[i]}) <select id="s${i}"><option value="">?</option><option>1</option><option>2</option><option>3</option></select>`).join(' ')}</div>`;
 return `<input id="ai" class="fld" style="padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:180px" placeholder="${t.in.k==='num'?'число':'номера цифрами'}" onkeydown="if(event.key==='Enter')chk()">`;}
function taskHTML(t0){const t=taskObj();if(!t)return '<div class="card">Нет задач</div>';const T=TYPES[t.type];
 return `<div class="card pop"><div class="chead"><span class="num">Задача ${S.i+1}</span><span class="badge ${t.kind==='a'?'an':t.kind==='h'?'hw':''}">${KIND[t.kind]||'Аналог'}</span><span class="badge tpc">${T.n}</span></div>
 <div class="qtext">${M(t.q)}</div><div class="figbox">${figHTML(t.fig)}</div>${inputHTML(t)}
 <div class="row" style="margin-top:12px"><button class="btn pri" onclick="chk()">Проверить</button><button class="btn" onclick="hint()">💡 Подсказка (${t.h}/${t.hints.length})</button><button class="btn" onclick="showSol()">📝 Решение</button><button class="btn" onclick="openScene('${t.sc}')">🎛 Сцена</button><button class="btn" onclick="openStk(S.cur.stk,'📌 Памятки к задаче')">📌 Памятки</button><button class="btn" onclick="newAnalog()">🔁 Новый аналог</button></div>
 <div id="fb">${t.res?`<div class="redo">${t.res}</div>`:''}</div>${t.h?`<div class="redo">${t.hints.slice(0,t.h).map((h,i)=>'💡 '+(i+1)+') '+M(h)).join('<br>')}</div>`:''}
 ${t.showSol?`<div class="redo" style="background:var(--okl)"><b>Решение.</b><br>${t.sol.map(M).join('<br>')}<br><b>Ответ: ${t.ans}</b></div>`:''}
 ${vbar(()=>t.q.replace(/\{|\}/g,'')+' '+(t.hints[0]||''),()=>t.q+' '+t.hints.join(' ')+' '+t.sol.join(' '))}
 <div class="row" style="margin-top:12px">${S.i>0?`<button class="btn" onclick="go(S.t,'task',S.i-1)">← Назад</button>`:''}<button class="btn ok" onclick="nextT()">Дальше →</button></div></div>`;}
function nextT(){const L=taskList(topicOf(S.t));if(S.i+1<L.length)go(S.t,'task',S.i+1);else{const k=TOPICS.findIndex(x=>x.id===S.t);go(TOPICS[(k+1)%TOPICS.length].id,'theory');}}
function getAns(){const t=S.cur;if(t.in.k==='sel')return [0,1,2].map(i=>$('s'+i).value).join('');return $('ai').value;}
function mark(st){const t=S.cur,r=U().tasks[tkey(t)]||(U().tasks[tkey(t)]={});const rank={ok:0,err:1,hint:2,sol:3};if(!r.st||rank[st]>rank[r.st]&&r.st!=='ok'||st==='ok'&&!r.st)r.st=r.st||st;save();}
function chk(){const t=S.cur,v=getAns();if(!String(v).trim())return toast('Введи ответ');const ok=checkAns(t,v);const r=U().tasks[tkey(t)]||(U().tasks[tkey(t)]={});
 if(ok){t.res='✅ Верно!';if(!r.st)r.st=t.h?'hint':t.wrong?'err':t.showSol?'sol':'ok';}else{t.wrong=1;t.res='❌ Пока неверно. Загляни в подсказку или в сцену.';}save();render();}
function hint(){const t=S.cur;if(t.h<t.hints.length)t.h++;const r=U().tasks[tkey(t)]||(U().tasks[tkey(t)]={});render();}
function showSol(){const t=S.cur;t.showSol=true;const r=U().tasks[tkey(t)]||(U().tasks[tkey(t)]={});if(!r.st)r.st='sol';save();render();}
function newAnalog(){const t=S.cur,seed=Math.floor(Math.random()*90000)+200;S.cur=mkTask({type:t.type,seed,kind:'a'});S.cur._i=S.i;S.cur.h=0;S.cur.key='free'+seed;S.cur.free=1;render();}
/* ===== УЧИТЕЛЬ: ДЗ ===== */
function openHW(){const m=document.createElement('div');m.className='mbg';m.id='hwm';m.onclick=e=>{if(e.target===m)m.remove();};const hw=DB.hw[S.user]||[];
 m.innerHTML=`<div class="mdl"><div class="row"><h2 style="flex:1">🏫 Домашнее задание</h2><button class="btn" onclick="$('hwm').remove()">✕</button></div><p class="schint">Выбери тип задачи и количество — приложение создаст новые аналоги (ДЗ). Они появятся в разделе у ученика.</p>
 <div class="fld"><span>Тип задачи</span><select id="hwt">${Object.keys(TYPES).map(k=>`<option value="${k}">${TYPES[k].n}</option>`).join('')}</select></div><div class="fld"><span>Сколько</span><input id="hwn" type="number" min="1" max="10" value="3"></div>
 <div class="row"><button class="btn pri" onclick="addHW()">➕ Добавить ДЗ</button><button class="btn" onclick="DB.hw[S.user]=[];save();$('hwm').remove();render()">🧹 Очистить ДЗ</button></div><p>Сейчас заданий ДЗ: <b>${hw.length}</b></p>
 <div class="row"><button class="btn" onclick="stats()">📊 Статистика</button><button class="btn" onclick="if(confirm('Стереть прогресс ученика?')){delete DB.users[S.user];save();S.user=null;render()}">🗑 Сбросить ученика</button></div></div>`;document.body.appendChild(m);}
function addHW(){const ty=$('hwt').value,n=Math.min(10,Math.max(1,+$('hwn').value||1));const l=DB.hw[S.user]||(DB.hw[S.user]=[]);for(let i=0;i<n;i++)l.push({type:ty,seed:Math.floor(Math.random()*900000)+1000,kind:'h'});save();$('hwm').remove();toast('ДЗ добавлено: '+n);render();}
function stats(){const [d,n]=totalProg();const u=U();const c=k=>Object.values(u.tasks).filter(x=>x.st===k).length;alert(`Решено: ${d} из ${n}\nСразу верно: ${c('ok')}\nС ошибкой: ${c('err')}\nС подсказкой: ${c('hint')}\nСо смотрением решения: ${c('sol')}\nТестов пройдено: ${Object.keys(u.tests).length} из ${TOPICS.length}`);}
/* ===== КАРКАС ===== */
function render(){document.documentElement.setAttribute('data-theme',DB.theme);const app=$('app');if(!S.user){app.innerHTML=loginView();return;}
 const t=topicOf(S.t),[d,n]=totalProg();
 const body=S.m==='theory'?theoryHTML(t):S.m==='test'?testHTML(t):taskHTML(t);
 app.innerHTML=`<div class="top"><div class="ttl">📈<span>Графики функций · ОГЭ №11</span></div><span class="who">👤 ${esc(S.user)}</span><div class="pbar"><i style="width:${n?d/n*100:0}%"></i></div><span class="ptxt">${d}/${n}</span>
 <div class="tbtns"><button class="btn sm" onclick="allMemo()">📌 Памятки</button><button class="btn sm" onclick="galScenes()">🎛 Сцены</button><button class="btn sm" onclick="openHW()">🏫 Учитель / ДЗ</button><button class="btn sm" onclick="toggleTheme()">${DB.theme==='dark'?'☀️':'🌙'}</button><button class="btn sm ghost" onclick="S.user=null;render()">Выйти</button></div></div>
 <div class="wrap"><div class="side">${sideHTML()}</div><div class="main">${body}</div></div>`;}
function galScenes(){const m=document.createElement('div');m.className='mbg';m.onclick=e=>{if(e.target===m)m.remove();};m.innerHTML=`<div class="mdl wide"><div class="row"><h2 style="flex:1">🎛 Сцены</h2><button class="btn" onclick="this.closest('.mbg').remove()">✕</button></div><div class="scgal">${Object.keys(SC).map(k=>`<button class="scard" onclick="this.closest('.mbg').remove();openScene('${k}')"><b>${SC[k].n}</b><span>${SC[k].h}</span></button>`).join('')}</div></div>`;document.body.appendChild(m);}
render();
</script></body></html>
