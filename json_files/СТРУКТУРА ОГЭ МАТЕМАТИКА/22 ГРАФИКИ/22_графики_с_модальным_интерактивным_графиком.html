<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Графики · ОГЭ №22 — тренажёр</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;family=Caveat:wght@500;700&amp;display=swap" rel="stylesheet">
<style>:root{--bg:#f4f6fb;--card:#fff;--ink:#1d2640;--mut:#6b7491;--line:#e3e7f1;--pri:#4f6bff;--pri2:#7b5cff;--ok:#16a36a;--okl:#dff6ea;--warn:#f0a400;--warnl:#fff2cc;--bad:#e5484d;--badl:#ffe3e3;--sol:#f07a2a;--soll:#ffe8d6;--sh:0 6px 24px rgba(30,40,80,.08);--r:16px}
[data-theme=dark]{--bg:#12151f;--card:#1b2030;--ink:#e8ecf7;--mut:#9aa3bd;--line:#2b3247;--okl:#173a2b;--warnl:#3d3214;--badl:#43191c;--soll:#45281a;--sh:0 6px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito','Segoe UI',Roboto,Arial,sans-serif;font-size:16px}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
.sq{white-space:nowrap}.sq .rd{font-size:1.05em}.sq .ov{border-top:1.5px solid currentColor;padding:0 1px;margin-left:1px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;line-height:1.15;font-size:.92em}
.fr .nu{border-bottom:1.5px solid currentColor;padding:0 3px}.fr .de{padding:0 3px}
sup,sub{font-size:.7em}
.btn{border:0;border-radius:12px;padding:10px 16px;background:var(--line);color:var(--ink);font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap}
.btn:hover{filter:brightness(.96);transform:translateY(-1px)}
.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 4px 14px rgba(79,107,255,.35)}
.btn.ok{background:var(--ok);color:#fff}.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.sm{padding:7px 11px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;pointer-events:none}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 20%,#dfe6ff 0,transparent 40%),radial-gradient(circle at 85% 80%,#ffe1ec 0,transparent 40%),var(--bg)}
[data-theme=dark] .login{background:var(--bg)}
.lcard{background:var(--card);border-radius:24px;box-shadow:var(--sh);padding:32px;max-width:460px;width:100%;text-align:center}
.lcard h1{margin:6px 0 2px;font-size:26px}.lcard .sub{color:var(--mut);margin-bottom:22px}
.logo{font-size:44px;line-height:1}
.lcard input{width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px;text-align:center;margin-bottom:12px}
.lcard input:focus{outline:none;border-color:var(--pri)}
.prof{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.prof button{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:700}
.prof button small{color:var(--mut);font-weight:600}
.lfoot{margin-top:18px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
/* layout */
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.top .ttl{font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px}
.top .who{background:var(--bg);border-radius:999px;padding:6px 12px;font-weight:700}
.pbar{flex:1;min-width:120px;height:10px;background:var(--line);border-radius:99px;overflow:hidden;position:relative}
.pbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--ok),#5ad19b);border-radius:99px}
.ptxt{font-weight:800;font-size:14px;color:var(--mut)}
.tbtns{display:flex;gap:6px;flex-wrap:wrap}
.wrap{display:grid;grid-template-columns:290px 1fr;gap:18px;padding:18px;max-width:1300px;margin:0 auto}
.side{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:12px;align-self:start;position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}
.tp{border-radius:12px;padding:8px 8px 10px;margin-bottom:6px}
.tp.cur{background:var(--bg)}
.tph{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;cursor:pointer}
.tph .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-size:12px;flex:none}
.tph .done{margin-left:auto;font-size:12px;color:var(--mut)}
.tp.fin .tph .ic{background:var(--ok)}
.mini{height:5px;background:var(--line);border-radius:9px;margin:7px 0 7px 38px;overflow:hidden}.mini i{display:block;height:100%;background:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-left:38px}
.chip{width:34px;height:30px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:13px;font-weight:800;display:grid;place-items:center;position:relative}
.chip.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.err{background:#7bd3a7;border-color:#7bd3a7;color:#08321f}
.chip.hint{background:#ffd666;border-color:#ffd666;color:#4a3500}
.chip.sol{background:#ffb27a;border-color:#ffb27a;color:#4a2000}
.chip.skip{border-style:dashed;border-color:var(--mut)}
.chip.cur{outline:3px solid var(--pri);outline-offset:1px}
.chip.an::after{content:'';position:absolute;top:2px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--pri2)}
.legend{font-size:12px;color:var(--mut);display:flex;flex-wrap:wrap;gap:8px;margin:8px 4px 2px}
.legend span{display:inline-flex;align-items:center;gap:4px}.legend b{width:12px;height:12px;border-radius:4px;display:inline-block}
.main{min-width:0}
.card{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:22px 24px;position:relative;overflow:hidden}
.card.pop{animation:pop .35s ease}
@keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.chead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.num{font-size:15px;font-weight:800;color:var(--mut)}
.badge{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:#e8ecff;color:#3b4fd8;letter-spacing:.3px}
.badge.an{background:#f1e8ff;color:#7343d6}.badge.nf{background:#fff0e0;color:#b25e00}
.badge.tpc{background:var(--bg);color:var(--mut)}
.qtext{font-size:20px;line-height:1.55;font-weight:600;margin:4px 0 12px}
.figbox{background:#fff;border-radius:16px;border:1px solid #edf0f7;display:flex;justify-content:center;padding:6px;margin-bottom:16px}
.figbox svg{width:100%;max-width:520px;max-height:330px;height:auto}
.ans{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ans label{font-weight:800}
.ans input{width:180px;padding:12px 14px;border-radius:14px;border:2.5px solid var(--line);font-size:22px;font-weight:800;text-align:center;background:var(--bg);color:var(--ink)}
.ans input:focus{outline:none;border-color:var(--pri)}
.ans input.bad{border-color:var(--bad);animation:shake .4s}
.ans input.good{border-color:var(--ok);background:var(--okl)}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.fb{margin-top:12px;padding:12px 14px;border-radius:14px;font-weight:700;display:none}
.fb.show{display:block}.fb.bad{background:var(--badl);color:var(--bad)}.fb.good{background:var(--okl);color:var(--ok)}
.fb .nx{height:5px;background:rgba(22,163,106,.25);border-radius:9px;margin-top:8px;overflow:hidden}.fb .nx i{display:block;height:100%;background:var(--ok);width:0;transition:width .9s linear}
.help{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);align-items:center}
.help .note{font-size:12.5px;color:var(--mut);margin-left:auto}
.hintzone{margin-top:14px}
.hz-t{font-weight:800;margin:10px 0 8px;display:flex;align-items:center;gap:8px}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:8px}
.step{background:var(--bg);border-left:4px solid var(--pri);border-radius:10px;padding:10px 12px;line-height:1.6;animation:pop .3s}
.step b.k{color:var(--pri);margin-right:6px}
.tnote{font-size:13px;color:var(--mut);background:var(--warnl);border-radius:10px;padding:8px 10px;margin-top:10px}
/* stickers */
.stks{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;padding:6px 2px 4px}
.stk{background:var(--sc);border-radius:6px 6px 18px 6px;padding:14px 14px 12px;color:#1d2640;box-shadow:0 8px 18px rgba(40,40,80,.13),inset 0 -3px 0 rgba(0,0,0,.04);transform:rotate(var(--rot));position:relative;border-top:6px solid var(--se);transition:.2s}
.stk:hover{transform:rotate(0) scale(1.02)}
.stk-pin{position:absolute;top:-11px;left:50%;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff 0,var(--se) 45%,#0003 100%);transform:translateX(-50%)}
.stk-t{font-weight:900;font-size:15px;margin-bottom:6px}
.stk-b{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.stk-x{flex:1;font-size:14px;line-height:1.55}
.stk-f{display:flex;justify-content:center;background:#ffffff8c;border-radius:10px;padding:4px}.stk-f svg{width:200px;max-height:150px;height:auto;display:block}
.tt{border-collapse:collapse;margin-top:6px;font-size:13px}.tt td,.tt th{border:1px solid #0002;padding:3px 6px;text-align:center}.tt th{background:#fff8}
.memo h2{margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.memo h2 i{width:18px;height:18px;border-radius:5px;display:inline-block}
/* modal */
.mbg{position:fixed;inset:0;background:rgba(15,20,40,.45);z-index:50;display:grid;place-items:center;padding:16px}
.mdl{background:var(--card);border-radius:20px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mdl.wide{max-width:1150px}
.mdl h2{margin-top:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--bg);border-radius:14px;padding:12px}.stat b{font-size:26px;display:block}.stat span{font-size:13px;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2640;color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:60;box-shadow:var(--sh);animation:pop .3s}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.fld span{font-size:13px;color:var(--mut);font-weight:700}
.fld input,.fld select{padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs button{border:0;padding:9px 14px;border-radius:10px;background:var(--bg);color:var(--ink);font-weight:800}.tabs button.on{background:var(--pri);color:#fff}
.pgrid{display:grid;grid-template-columns:1fr 300px;gap:16px}
.plist{max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px}
.plist .pt{font-weight:800;margin:8px 0 4px;display:flex;align-items:center;gap:6px}
.plist label{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;margin:3px 8px 3px 0;padding:3px 7px;border-radius:8px;background:var(--bg)}
.opts label{display:flex;gap:8px;align-items:center;padding:5px 0;font-weight:600}
table.st{width:100%;border-collapse:collapse;font-size:14px}table.st td,table.st th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.done-card{text-align:center;padding:40px 24px}.done-card .big{font-size:64px}
.conf{position:absolute;pointer-events:none;font-size:22px;animation:fly 1.2s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
#printArea{display:none}
@media (max-width:860px){
  .wrap{grid-template-columns:1fr;padding:10px}
  .side{position:static;max-height:none}
  .qtext{font-size:18px}.card{padding:16px}
  .pgrid{grid-template-columns:1fr}
  .top .ttl span{display:none}
  .help .note{margin-left:0}
}
/* печать */
@media print{
  body.printing>*:not(#printArea){display:none!important}
  body.printing #printArea{display:block!important}
  body{background:#fff!important;color:#000}
  @page{size:A4;margin:12mm}
}
#printArea{font-family:'Segoe UI',Arial,sans-serif;color:#111;background:#fff}
.pr-head{display:flex;justify-content:space-between;border-bottom:2px solid #333;padding-bottom:6px;margin-bottom:10px;font-size:13px}
.pr-title{font-size:18px;font-weight:800;margin:0 0 6px}
.pr-grid{columns:var(--cols,1);column-gap:10mm}
.pr-task{break-inside:avoid;border-bottom:1px dashed #bbb;padding:8px 0 10px;font-size:13.5px;line-height:1.45}
.pr-n{font-weight:800}.pr-k{font-size:11px;color:#555;border:1px solid #999;border-radius:6px;padding:0 5px;margin-left:6px}
.pr-fig{text-align:center;margin:4px 0}.pr-fig svg{width:auto;max-width:62%;max-height:150px}
.pr-cols2 .pr-fig svg{max-width:95%;max-height:140px}
.pr-line{margin-top:6px}
.pr-ans{margin-top:4px;font-weight:700;color:#0a6b3d}
.pr-sol{margin-top:4px;font-size:12.5px;color:#222}.pr-sol ol{margin:2px 0;padding-left:18px}
.pr-key{break-before:page}.pr-key table{border-collapse:collapse;width:100%}.pr-key td{border:1px solid #888;padding:4px;text-align:center;font-size:12.5px}.pr-key td b{display:block;font-size:11px;color:#555}
.pr-memo{break-before:page}.pr-memo .stks{grid-template-columns:repeat(3,1fr);gap:8px}.pr-memo .stk{transform:none;box-shadow:none;border:1px solid #0002;border-top:5px solid var(--se);-webkit-print-color-adjust:exact;print-color-adjust:exact;break-inside:avoid;padding:8px}
.pr-memo .stk-x{font-size:11.5px}.pr-memo .stk-f svg{width:150px;max-height:110px}.pr-memo .stk-pin{display:none}
.prev{background:#fff;color:#111;padding:14px;border-radius:12px;border:1px solid var(--line);max-height:65vh;overflow:auto}
@media (max-width:860px){.main{order:-1}}

.lvl{color:#f0a400;font-size:15px;letter-spacing:1px}
.calcout{font-size:22px;font-weight:800;color:var(--pri);min-width:90px}.calcout.bad{color:var(--mut)}
.ans input.calcin{width:260px;text-align:left}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}.key{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;min-width:42px;padding:7px 10px;font-weight:800;font-size:16px}
.khint{font-size:12.5px;color:var(--mut);margin-left:4px}
.redo{background:var(--warnl);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.flagg .pt{font-weight:800;margin:10px 0 4px;display:flex;align-items:center;gap:8px}
.flag{display:inline-flex;align-items:center;gap:4px;margin:3px 6px 3px 0;padding:5px 9px;border-radius:9px;background:var(--bg);font-size:14px;cursor:pointer;border:1.5px solid transparent;user-select:none}
.flag.on{border-color:#e5484d;background:#ffe9e9;color:#1d2640}.flag .fl{opacity:.25}.flag.on .fl{opacity:1}
.switch{display:flex;align-items:center;gap:10px;font-weight:700;padding:12px;border-radius:12px;background:var(--bg);margin:10px 0;cursor:pointer}
.switch input{width:22px;height:22px}
/* ===== ОГЭ22 ===== */
.cs{display:inline-flex;align-items:center;vertical-align:middle;margin:2px 4px}
.cs .cb{font-size:2.6em;line-height:1;font-weight:200;margin-right:2px;transform:scaleX(.7)}
.cs .cr{display:inline-flex;flex-direction:column;gap:2px}
.cs .crow{display:flex;gap:18px;white-space:nowrap}.cs .cc{opacity:.85;font-size:.92em}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.lnk{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--bg);color:var(--pri);font-weight:800;font-size:14px;text-decoration:none;border:1.5px solid var(--line)}
.lnk:hover{border-color:var(--pri)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.tool{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;transition:.15s}
.tool:hover{border-color:var(--pri);transform:translateY(-1px)}
.tool b{font-size:24px}.tool span{font-weight:800}.tool small{color:var(--mut);font-size:12.5px}
.tool.warn{border-color:#ffd2a8;background:#fff6ec}[data-theme=dark] .tool.warn{background:#2c2216;border-color:#5a3d1f}
.ansbox{border:2px dashed var(--line);border-radius:18px;padding:14px 16px}
.abt{font-weight:800;font-size:17px;margin-bottom:10px}.abt small{color:var(--mut);font-weight:600}
.photos{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.photos .ph{position:relative}.photos img{height:120px;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;display:block}
.photos.big img{height:auto;max-width:100%;max-height:520px}
.phx{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:26px;height:26px;background:#000a;color:#fff;font-weight:800}
.nophoto{color:var(--mut);font-size:14px}
.tans{flex:1;min-width:220px;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px}
.tcom{margin-top:10px;background:var(--warnl);border-radius:10px;padding:8px 12px;font-weight:700}
.chip{width:auto;min-width:36px;padding:0 6px}
.chip .sc{position:absolute;bottom:-6px;right:-5px;background:#6b3fd1;color:#fff;font-style:normal;font-size:10px;border-radius:9px;padding:0 5px;line-height:15px}
.mdl.gmdl{max-width:900px}.mdl.smdl{max-width:900px}.mdl.rvmdl{max-width:1300px}
.gq{background:var(--bg);border-radius:12px;padding:10px 14px;margin:8px 0 12px;font-weight:600;line-height:1.6}
.gwrap{position:relative;background:#fff;border-radius:14px;border:1px solid #e6e9f2;touch-action:none}
.gwrap svg{display:block;width:100%;height:auto}
.gov{position:absolute;inset:0;width:100%;height:100%;cursor:ns-resize}
.gctl{display:flex;justify-content:space-between;align-items:center;margin:10px 0;gap:10px;flex-wrap:wrap}
.gval{font-size:20px}.gval .snap{background:#ffe1c2;color:#a04a00;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800;margin-left:6px}
.gcnt span{font-size:20px;font-weight:900;padding:6px 14px;border-radius:12px;background:var(--bg)}
.gcnt .n0{color:#888}.gcnt .n1{color:#16a36a}.gcnt .n2{color:#2f6fe4}.gcnt .n3{color:#b04e10}.gcnt .n4{color:#7343d6}
.ghint{color:var(--mut);font-size:13.5px}
/* рукописный образец */
.hw{font-family:'Caveat','Segoe Print','Comic Sans MS',cursive;font-size:24px;line-height:30px;color:#1d3fa6;background-color:#fff;
 background-image:linear-gradient(#cfe0f7 1px,transparent 1px),linear-gradient(90deg,#cfe0f7 1px,transparent 1px);background-size:15px 15px;
 border-radius:10px;padding:18px 26px 22px 46px;box-shadow:inset 3px 0 0 #f2a0a0;position:relative}
.hw p{margin:4px 0}.hw u{text-decoration-color:#1d3fa6}
.hw-h{font-size:30px;font-weight:700;margin-bottom:4px}
.hw .hole{color:#c0262c;font-weight:700}
.hw .hn{color:#555;font-size:21px}
.hw .htab{border-collapse:collapse;margin:6px 0 8px}.hw .htab th,.hw .htab td{border:1.6px solid #1d3fa6;padding:0 12px;min-width:38px;text-align:center;font-weight:600}
.hw .hgraph{background:transparent;margin:10px 0;display:flex;justify-content:center}.hw .hgraph svg{width:100%;max-width:560px;height:auto}
.hw .hl{margin:4px 0 6px;padding-left:26px}.hw .hl li{margin:1px 0}
.hw .hans{display:inline-block;border:2.2px solid #1d3fa6;border-radius:8px;padding:2px 14px;margin-top:8px;font-weight:700;font-size:27px}
.hw .fr{font-size:.95em}.hw .sq .ov{border-top-color:#1d3fa6}
.rv{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}
.rvs{max-height:70vh;overflow:auto;border-radius:10px}

<script>
const SOURCE='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
/* ===== Мини-разметка формул: √{x}, {a/b}, ^{n} ===== */
function tok(s){
  const out=[];let buf='';
  const flush=()=>{if(buf){out.push({k:'t',s:buf});buf='';}};
  const match=(i)=>{let d=0;for(let j=i;j<s.length;j++){if(s[j]==='{')d++;else if(s[j]==='}'){d--;if(d===0)return j;}}return s.length-1;};
  for(let i=0;i<s.length;i++){
    const ch=s[i];
    if(ch==='['&&s[i+1]==='['){flush();const e=s.indexOf(']]',i);const body=s.slice(i+2,e);out.push({k:'cs',rows:body.split('||').map(r=>r.split(' ; ').map(x=>x.trim()))});i=e+1;continue;}
    if(ch==='√'&&s[i+1]==='{'){flush();const e=match(i+1);out.push({k:'sq',s:s.slice(i+2,e)});i=e;continue;}
    if(ch==='^'&&s[i+1]==='{'){flush();const e=match(i+1);out.push({k:'sup',s:s.slice(i+2,e)});i=e;continue;}
    if(ch==='_'&&s[i+1]==='{'){flush();const e=match(i+1);out.push({k:'sub',s:s.slice(i+2,e)});i=e;continue;}
    if(ch==='{'){
      const e=match(i);const inner=s.slice(i+1,e);
      let d=0,cut=-1;for(let j=0;j<inner.length;j++){const c=inner[j];if(c==='{')d++;else if(c==='}')d--;else if(c==='/'&&d===0){cut=j;break;}}
      flush();
      if(cut>=0)out.push({k:'fr',n:inner.slice(0,cut),d:inner.slice(cut+1)});
      else out.push({k:'g',s:inner});
      i=e;continue;
    }
    buf+=ch;
  }
  flush();return out;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
/* HTML-вывод формул. Текст в $...$ выделяется курсивом-формулой (не обязательно). */
function M(s){
  if(s==null)return '';
  return tok(String(s)).map(t=>{
    if(t.k==='t')return t.s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    if(t.k==='sq')return '<span class="sq"><span class="rd">√</span><span class="ov">'+M(t.s)+'</span></span>';
    if(t.k==='sup')return '<sup>'+M(t.s)+'</sup>';
    if(t.k==='sub')return '<sub>'+M(t.s)+'</sub>';
    if(t.k==='fr')return '<span class="fr"><span class="nu">'+M(t.n)+'</span><span class="de">'+M(t.d)+'</span></span>';
    if(t.k==='cs')return '<span class="cs"><span class="cb">{</span><span class="cr">'+t.rows.map(r=>'<span class="crow"><span class="ce">'+M(r[0])+'</span><span class="cc">'+M(r[1]||'')+'</span></span>').join('')+'</span></span>';
    return M(t.s);
  }).join('');
}

/* ===== SVG-текст с формулами ===== */
function cw(ch,sz){
  if(/[0-9]/.test(ch))return sz*0.56;
  if(ch===' ')return sz*0.28;
  if(/[,.:;]/.test(ch))return sz*0.28;
  if(/[−\-=+]/.test(ch))return sz*0.62;
  if(/[A-ZА-Я]/.test(ch))return sz*0.66;
  if(ch==='?')return sz*0.55;
  if(ch==='°')return sz*0.4;
  return sz*0.52;
}
function mw(s,sz){
  let w=0;
  for(const t of tok(s)){
    if(t.k==='t')for(const ch of t.s)w+=cw(ch,sz);
    else if(t.k==='sq')w+=sz*0.6+mw(t.s,sz)+1;
    else if(t.k==='sup'||t.k==='sub')w+=mw(t.s,sz*0.65);
    else if(t.k==='fr')w+=Math.max(mw(t.n,sz*0.84),mw(t.d,sz*0.84))+sz*0.3;
    else if(t.k==='cs')w+=sz*0.7+Math.max(...t.rows.map(r=>mw(r[0],sz)))+sz*0.9+Math.max(...t.rows.map(r=>mw(r[1]||'',sz*0.85)));
    else w+=mw(t.s,sz);
  }
  return w;
}
/* рисует строку s, центр по вертикали cy, x — левый край. Возвращает svg */
function sdraw(s,x,cy,sz,col,wt){
  let o='';const base=cy+sz*0.36;
  for(const t of tok(s)){
    if(t.k==='t'){
      o+=`<text x="${x.toFixed(1)}" y="${base.toFixed(1)}" font-size="${sz}" fill="${col}" font-weight="${wt||600}" xml:space="preserve">${esc(t.s)}</text>`;
      for(const ch of t.s)x+=cw(ch,sz);
    }else if(t.k==='sq'){
      const iw=mw(t.s,sz);
      o+=`<text x="${x.toFixed(1)}" y="${base.toFixed(1)}" font-size="${sz}" fill="${col}" font-weight="${wt||600}">√</text>`;
      x+=sz*0.6;
      o+=`<line x1="${(x-1).toFixed(1)}" y1="${(cy-sz*0.62).toFixed(1)}" x2="${(x+iw+1).toFixed(1)}" y2="${(cy-sz*0.62).toFixed(1)}" stroke="${col}" stroke-width="${Math.max(1,sz/14).toFixed(2)}"/>`;
      o+=sdraw(t.s,x,cy,sz,col,wt);x+=iw+1;
    }else if(t.k==='sup'){
      o+=sdraw(t.s,x,cy-sz*0.38,sz*0.65,col,wt);x+=mw(t.s,sz*0.65);
    }else if(t.k==='sub'){
      o+=sdraw(t.s,x,cy+sz*0.3,sz*0.65,col,wt);x+=mw(t.s,sz*0.65);
    }else if(t.k==='fr'){
      const fs=sz*0.84,wn=mw(t.n,fs),wd=mw(t.d,fs),W=Math.max(wn,wd)+sz*0.2;
      o+=sdraw(t.n,x+(W-wn)/2,cy-fs*0.62,fs,col,wt);
      o+=sdraw(t.d,x+(W-wd)/2,cy+fs*0.66,fs,col,wt);
      o+=`<line x1="${x.toFixed(1)}" y1="${cy.toFixed(1)}" x2="${(x+W).toFixed(1)}" y2="${cy.toFixed(1)}" stroke="${col}" stroke-width="${Math.max(1.1,sz/13).toFixed(2)}"/>`;
      x+=W+sz*0.1;
    }else if(t.k==='cs'){
      const n=t.rows.length,lh=sz*1.35,top=cy-(n-1)*lh/2,we=Math.max(...t.rows.map(r=>mw(r[0],sz)));
      const bh=n*lh*0.5+sz*0.2;
      o+=`<path d="M${x+sz*0.45},${cy-bh} q${-sz*0.25},0 ${-sz*0.25},${sz*0.3} v${bh-sz*0.5} q0,${sz*0.2} ${-sz*0.18},${sz*0.2} q${sz*0.18},0 ${sz*0.18},${sz*0.2} v${bh-sz*0.5} q0,${sz*0.3} ${sz*0.25},${sz*0.3}" fill="none" stroke="${col}" stroke-width="${Math.max(1.2,sz/12)}"/>`;
      x+=sz*0.7;
      t.rows.forEach((r,i)=>{o+=sdraw(r[0],x,top+i*lh,sz,col,wt);o+=sdraw(r[1]||'',x+we+sz*0.9,top+i*lh,sz*0.85,col,wt);});
      x+=we+sz*0.9+Math.max(...t.rows.map(r=>mw(r[1]||'',sz*0.85)));
    }else{o+=sdraw(t.s,x,cy,sz,col,wt);x+=mw(t.s,sz);}
  }
  return o;
}
function stext(s,x,cy,sz,col,anchor,wt){
  const w=mw(s,sz);const x0=anchor==='start'?x:anchor==='end'?x-w:x-w/2;
  return sdraw(s,x0,cy,sz,col,wt);
}

/* ===== Геометрия ===== */
const rad=d=>d*Math.PI/180;
const mid=(p,q)=>[(p[0]+q[0])/2,(p[1]+q[1])/2];
const lerp=(p,q,t)=>[p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t];
function foot(P,A,B){const dx=B[0]-A[0],dy=B[1]-A[1];const t=((P[0]-A[0])*dx+(P[1]-A[1])*dy)/(dx*dx+dy*dy);return [A[0]+dx*t,A[1]+dy*t];}
function dist(p,q){return Math.hypot(p[0]-q[0],p[1]-q[1]);}
/* треугольник: A=(0,0), C=(L,0), углы при A и C заданы */
function triAC(a,c,L){L=L||10;const b=180-a-c;const AB=L*Math.sin(rad(c))/Math.sin(rad(b));return {A:[0,0],C:[L,0],B:[AB*Math.cos(rad(a)),AB*Math.sin(rad(a))]};}
/* основание биссектрисы из V на противоположную сторону PQ */
function bisFoot(V,P,Q){const a=dist(V,P),b=dist(V,Q);return lerp(P,Q,a/(a+b));}
function centroid(ps){let x=0,y=0;ps.forEach(p=>{x+=p[0];y+=p[1];});return [x/ps.length,y/ps.length];}

const COL={line:'#22304d',fill:'#e9f0ff',val:'#e5484d',aux:'#2f6fe4',aux2:'#13a37a',name:'#22304d',hl:'#ffe1df',hl2:'#dff5ea',hl3:'#fff1c9'};

/* ===== Рендер чертежа =====
 spec: P{имя:[x,y]} (y вверх), poly:['ABC' | {p:'ABC',fill}], seg:['AB' | ['AB','aux'|'dash'|'aux2']],
 ext:[['A','C',0.3]] продолжение за C, right:[['H','A','B']], ticks:[['A','M',n]],
 arcs:[{v,a,b,t,r,n,q,mark,c}], side:[{s:'AB',t,in,d,c}], lab:[{at:'A'|[x,y],dx,dy,t,c,anchor,sz}],
 N:'ABC' — подписываемые точки, No:{A:[dx,dy]} — ручные смещения подписей, dots:'MO' */
function figSVG(sp,opt){
  opt=opt||{};
  const P=sp.P,keys=Object.keys(P);
  const W=opt.W||300,H=opt.H||190,pad=opt.pad||44;
  let xs=keys.map(k=>P[k][0]),ys=keys.map(k=>P[k][1]);
  if(sp.extra)sp.extra.forEach(p=>{xs.push(p[0]);ys.push(p[1]);});
  const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
  const s=Math.min(W/Math.max(maxx-minx,1e-6),H/Math.max(maxy-miny,1e-6));
  const padX=pad+(sp.padX||0),padT=pad+(sp.padT||0),padB=pad+(sp.padB||0);
  const S={};keys.forEach(k=>S[k]=[padX+(P[k][0]-minx)*s,padT+(maxy-P[k][1])*s]);
  const vw=(maxx-minx)*s+padX*2,vh=(maxy-miny)*s+padT+padB;
  const sc=opt.sc||1;
  const lw=2.2*sc;
  const polyPts=sp.poly&&sp.poly.length?(typeof sp.poly[0]==='string'?sp.poly[0]:sp.poly[0].p).split(''):keys;
  const cen=centroid(polyPts.map(k=>S[k]));
  const pt=a=>typeof a==='string'?S[a]:[padX+(a[0]-minx)*s,padT+(maxy-a[1])*s];
  const u=(p,q)=>{const dx=q[0]-p[0],dy=q[1]-p[1],l=Math.hypot(dx,dy)||1;return [dx/l,dy/l];};
  let g='',top='';
  // polygons
  (sp.poly||[]).forEach((pp,i)=>{
    const p=typeof pp==='string'?pp:pp.p;const fill=typeof pp==='string'?(i===0?COL.fill:'none'):(pp.fill||'none');
    g+=`<polygon points="${p.split('').map(k=>S[k].map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="${fill}" stroke="none"/>`;
  });
  // extension lines
  (sp.ext||[]).forEach(e=>{const a=S[e[0]],b=S[e[1]],d=u(a,b),L=(e[2]||0.35)*dist(a,b);
    g+=`<line x1="${b[0]}" y1="${b[1]}" x2="${b[0]+d[0]*L}" y2="${b[1]+d[1]*L}" stroke="${COL.line}" stroke-width="${lw}" stroke-linecap="round"/>`;});

/* Точные пересечения для задач с касанием и выколотыми точками.
   Это убирает численные пропуски корней рядом с критическими значениями. */
TASKS.forEach(t=>{
  if(t.code==='07'){
    const c=t.kind==='П'?0.25:4, holeX=t.kind==='П'?-1:1;
    t.g.exactIntersections=k=>{
      const D=k*k-4*c;
      if(D < -1e-12)return [];
      const xs=Math.abs(D)<=1e-12?[-k/2]:[(-k-Math.sqrt(Math.max(0,D)))/2,(-k+Math.sqrt(Math.max(0,D)))/2];
      const uniq=[];
      xs.forEach(x=>{if(Math.abs(x-holeX)>1e-7&&!uniq.some(v=>Math.abs(v-x)<1e-7))uniq.push(x);});
      return uniq.map(x=>({x,y:k*x}));
    };
  }
  if(t.code==='15'){
    const a=t.kind==='П'?4.5:3;
    t.g.exactIntersections=m=>{
      const xs=[];
      if((m>=-1&&m<0)||m>=1)xs.push(a*m);
      if((m>-1&&m<0)||m>1)xs.push(a/m);
      return xs.map(x=>({x,y:m}));
    };
  }
});

/* ===== Набор задач ===== */
function activeList(){const a=DB.teacher.active;return ORDER.filter(n=>!a||a.includes(n));}
function redoOn(s){return !!(s&&s.redo&&s.redo.list&&s.redo.list.some(n=>!solved(s.tasks[n])));}
function vis(s){s=s||stu();if(redoOn(s))return ORDER.filter(n=>s.redo.list.includes(n));const a=activeList();return a.length?a:ORDER.slice();}
function nextUnsolved(from){const s=stu();const L=vis(s);const i=Math.max(0,L.indexOf(from));for(let k=1;k<=L.length;k++){const n=L[(i+k)%L.length];if(!solved(s.tasks[n]))return n;}return null;}
function counts(s){s=s||stu();const L=vis(s);const c={ok:0,hint:0,sol:0,new:0,total:L.length,scored:0,points:0};L.forEach(n=>{const x=s.tasks[n];c[x&&x.st?x.st:'new']++;if(x&&x.score!=null){c.scored++;c.points+=x.score;}});c.done=L.length-c.new;return c;}

/* ===== Шапка и меню ===== */
function topbar(){
  const c=counts();
  return `<div class="top"><div class="ttl">📈 <span>${APPNAME}</span></div><div class="who">👤 ${esc(cur.name)}</div>
  <div class="pbar"><i style="width:${c.done/c.total*100}%"></i></div><div class="ptxt">${c.done}/${c.total}</div>
  <div class="tbtns"><button class="btn sm" id="bMemo">📒 Памятка</button><button class="btn sm" id="bSave" title="Сохранить приложение с прогрессом и фото в файл">💾 Сохранить</button><button class="btn sm pri" id="bRep">📄 Отчёт учителю</button><button class="btn sm ghost" id="bClr" title="Очистить мой прогресс">🧹 Очистить</button><button class="btn sm ghost" id="bOut">🚪 Выйти</button></div></div>`;
}
function bindTop(){
  $('#bMemo').onclick=()=>{tickTime();viewMemo();};
  $('#bSave').onclick=saveApp;
  $('#bClr').onclick=()=>confirmBox('Очистить весь прогресс ученика «'+esc(cur.name)+'»?<br><small style="font-weight:600;color:var(--mut)">Будут удалены фото, отметки и подсказки. Отменить нельзя.</small>',()=>{DB.students[cur.name]=newStudent(cur.name);persist();toast('Прогресс очищен');enter(cur.name);},'🧹 Очистить');
  $('#bRep').onclick=()=>{tickTime();reportDialog(cur.name);};
  $('#bOut').onclick=()=>{tickTime();persist();
    modal(`<h2>Выйти?</h2><p>Чтобы прогресс и фото не потерялись — сохрани файл.</p><div class="row"><button class="btn pri" id="sx">💾 Сохранить и выйти</button><button class="btn" id="nx">Выйти</button><button class="btn ghost" id="cx">Отмена</button></div>`);
    $('#sx').onclick=()=>{saveApp();closeModal();viewLogin();};$('#nx').onclick=()=>{closeModal();viewLogin();};$('#cx').onclick=closeModal;};
}
function sidebar(){
  const s=stu();const L=vis(s);
  return `<aside class="side">${redoOn(s)?`<div class="redo">🔁 <b>Работа над ошибками</b><br>${s.redo.list.filter(n=>solved(s.tasks[n])).length} из ${s.redo.list.length} задач</div>`:''}${TOPICS.map(tp=>{
    const ns=L.filter(n=>TASK[n].topic===tp.id);if(!ns.length)return '';const d=ns.filter(n=>solved(s.tasks[n])).length;
    const isCur=cur.n&&TASK[cur.n].topic===tp.id;
    return `<div class="tp ${isCur?'cur':''} ${d===ns.length?'fin':''}"><div class="tph" data-tp="${tp.id}"><span class="ic">${tp.icon}</span>${tp.name}<span class="done">${d}/${ns.length}</span></div>
     <div class="mini"><i style="width:${d/ns.length*100}%"></i></div>
     <div class="chips">${ns.map(n=>{const x=s.tasks[n];const cl=(x&&x.st&&x.st!=='new'?x.st:(x&&x.skip?'skip':''));return `<button class="chip ${cl} ${n===cur.n?'cur':''} ${TASK[n].kind==='А'?'an':''}" data-n="${n}" title="${TASK[n].label}">${TASK[n].code}${TASK[n].kind==='А'?'а':''}${x&&x.score!=null?'<i class="sc">'+x.score+'</i>':''}</button>`;}).join('')}</div></div>`;}).join('')}
   <div class="legend"><span><b style="background:var(--ok)"></b>сам</span><span><b style="background:#ffd666"></b>с подсказкой</span><span><b style="background:#ffb27a"></b>после образца</span><span><b style="background:var(--pri2);border-radius:50%;width:7px;height:7px"></b>аналог</span></div></aside>`;
}
function bindSide(){
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{tickTime();openTask(+b.dataset.n);});
  document.querySelectorAll('.tph').forEach(h=>h.onclick=()=>{tickTime();const s=stu();const ns=vis(s).filter(n=>TASK[n].topic===h.dataset.tp);openTask(ns.find(n=>!solved(s.tasks[n]))||ns[0]);});
}

/* ===== Карточка задачи ===== */
function linksHTML(t,clickable){
  const L=t.links||{};const a=[];
  if(L.an)a.push(`<a class="lnk" data-l="an" href="${L.an}" target="_blank" rel="noopener">🔗 Аналог на Школково</a>`);
  if(L.sol)a.push(`<a class="lnk" data-l="sol" href="${L.sol}" target="_blank" rel="noopener">📝 Решение (Школково)</a>`);
  if(L.vid)a.push(`<a class="lnk" data-l="vid" href="${L.vid}" target="_blank" rel="noopener">🎬 Видеоразбор</a>`);
  return a.length?`<div class="links">${a.join('')}</div>`:'';
}
function openTask(n){
  clearTimeout(cur.timer);
  cur.n=n;cur.since=Date.now();cur.view='train';
  const s=stu();s.cur=n;s.updated=Date.now();persist();
  const t=TASK[n],x=T(n),tp=topicOf(n),L=vis(s),idx=L.indexOf(n)+1;
  const done=solved(x);
  app().innerHTML=topbar()+`<div class="wrap">${sidebar()}<main class="main"><div class="card pop" id="card">
   <div class="chead"><span class="num">Задача ${idx} из ${L.length}</span><span class="lvl">${'★'.repeat(LEVEL[n])}${'☆'.repeat(3-LEVEL[n])}</span><span class="badge ${t.kind==='А'?'an':''}">${t.label}</span><span class="badge tpc">${t.title}</span></div>
   <div class="qtext">${M(t.q)}</div>
   ${linksHTML(t)}
   <div class="tools">${toolsHTML(t,x)}</div>
   <div class="ansbox">
     <div class="abt">📷 Ответ — фото твоего решения <small>(график + рассуждение + ответ)</small></div>
     <div class="photos" id="ph">${photosHTML(x,!done)}</div>
     <div class="row">
       <label class="btn ${x.photos.length?'':'pri'}" for="fi">📷 ${x.photos.length?'Добавить фото':'Сфотографировать / выбрать'}</label>
       <input type="file" id="fi" accept="image/*" capture="environment" multiple hidden>
       <input id="ta" class="tans" placeholder="Ответ, который получился (по желанию)" value="${esc(x.txt||'')}">
     </div>
     <div class="row" style="margin-top:10px">
       ${done?`<span class="btn ok">✓ ${ST_LABEL[x.st]}${x.score!=null?' · оценка: '+x.score+' из 2':''}</span><button class="btn pri" id="bNext">Дальше ➜</button>`:`<button class="btn pri" id="bSub" ${x.photos.length?'':'disabled'}>✅ Сдать решение</button><button class="btn ghost sm" id="bSkip">⏭ Пропустить</button>`}
     </div>
     ${x.comment?`<div class="tcom">💬 Учитель: ${esc(x.comment)}</div>`:''}
     <div class="fb" id="fb"></div>
   </div>
   <div class="hintzone" id="hz"></div>
   ${t.note?`<div class="tnote">✏️ Примечание: ${t.note}</div>`:''}
  </div></main></div>`;
  bindTop();bindSide();
  const cc=document.querySelector('.chip.cur');if(cc&&window.innerWidth>860)cc.scrollIntoView({block:'nearest'});
  if(x.stick)renderStick();
  document.querySelectorAll('.lnk').forEach(a=>a.addEventListener('click',()=>{x.links[a.dataset.l]=(x.links[a.dataset.l]||0)+1;if(!solved(x))x.helpBefore=1;bump();}));
  bindTools(t,x);
  $('#fi').onchange=async e=>{const fs=[...e.target.files];for(const f of fs){const d=await compress(f);if(d)x.photos.push({d,at:Date.now()});}bump();$('#ph').innerHTML=photosHTML(x,!done);bindPhotos(x,done);const b=$('#bSub');if(b)b.disabled=!x.photos.length;e.target.value='';};
  bindPhotos(x,done);
  $('#ta').oninput=e=>{x.txt=e.target.value;bump();};
  if(done)$('#bNext').onclick=goNext;
  else{$('#bSub').onclick=()=>submit(n);$('#bSkip').onclick=()=>{x.skip=(x.skip||0)+1;bump();tickTime();goNext();};}
  window.scrollTo({top:0,behavior:'smooth'});
}
function photosHTML(x,canDel){
  if(!x.photos.length)return '<div class="nophoto">Фото пока нет</div>';
  return x.photos.map((p,i)=>`<div class="ph"><img src="${p.d}" data-i="${i}">${canDel?`<button class="phx" data-x="${i}" title="Удалить">✕</button>`:''}</div>`).join('');
}
function bindPhotos(x,done){
  document.querySelectorAll('.ph img').forEach(im=>im.onclick=()=>modal(`<img src="${im.src}" style="width:100%;border-radius:12px"><div class="row" style="margin-top:10px"><button class="btn" onclick="closeModal()">Закрыть</button></div>`,true));
  document.querySelectorAll('.phx').forEach(b=>b.onclick=()=>{x.photos.splice(+b.dataset.x,1);bump();$('#ph').innerHTML=photosHTML(x,!done);bindPhotos(x,done);const s=$('#bSub');if(s)s.disabled=!x.photos.length;});
}
function compress(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const mx=1400;let w=im.width,h=im.height;const k=Math.min(1,mx/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(im,0,0,w,h);res(c.toDataURL('image/jpeg',0.72));};im.onerror=()=>res(null);im.src=r.result;};r.onerror=()=>res(null);r.readAsDataURL(file);});}
function bump(){const s=stu();if(s){s.updated=Date.now();}persist();}
function submit(n){
  const x=T(n);tickTime();
  x.st=x.ownBefore?'sol':x.helpBefore?'hint':'ok';x.when=Date.now();bump();
  const fb=$('#fb');const nx=nextUnsolved(n);
  fb.className='fb show good';fb.innerHTML=`Решение сдано! 🎉 ${x.st==='ok'?'Сам(а), без подсказок — супер!':''}<br><span style="font-weight:600">${nx?'Переходим к следующей карточке…':'Это была последняя задача!'}</span><div class="nx"><i id="nxb"></i></div>`;
  setTimeout(()=>{const b=$('#nxb');if(b)b.style.width='100%';},30);
  const side=document.querySelector('.side');if(side){side.outerHTML=sidebar();bindSide();}
  const c=counts();const pb=document.querySelector('.pbar i');if(pb)pb.style.width=(c.done/c.total*100)+'%';const pt=document.querySelector('.ptxt');if(pt)pt.textContent=c.done+'/'+c.total;
  $('#bSub').disabled=true;
  cur.timer=setTimeout(()=>{if(cur.n===n&&cur.view==='train')goNext();},950);
}
function goNext(){clearTimeout(cur.timer);const nx=nextUnsolved(cur.n);if(!nx){viewDone();return;}openTask(nx);}
function renderStick(scroll){const t=TASK[cur.n];$('#hz').innerHTML=`<div class="hz-t">📌 Что нужно знать для этой задачи</div><div class="stks">${t.st.map(id=>stickerHTML(STICK[id])).join('')}</div>`;const b=$('#tS small');if(b)b.textContent='открыта';if(scroll)$('#hz').scrollIntoView({behavior:'smooth',block:'nearest'});}
function viewDone(){
  cur.view='done';tickTime();
  const s=stu();const c=counts();
  app().innerHTML=topbar()+`<div class="wrap">${sidebar()}<main class="main"><div class="card done-card pop"><div class="big">🏆</div><h1>${s.redo&&s.redo.list.length&&s.redo.list.every(n=>solved(s.tasks[n]))?'Работа над ошибками сдана!':'Все задачи сданы!'}</h1>
  <div class="stats" style="max-width:700px;margin:16px auto">${statTiles(cur.name)}</div>
  <p>Сформируй отчёт для учителя — в нём будут твои фото. И сохрани файл с прогрессом.</p>
  <div class="row" style="justify-content:center"><button class="btn pri" id="dR">📄 Отчёт учителю</button><button class="btn" id="dS">💾 Сохранить прогресс</button></div></div></main></div>`;
  bindTop();bindSide();$('#dR').onclick=()=>reportDialog(cur.name);$('#dS').onclick=saveApp;
}
function statTiles(name){
  const r=calcReport(name);
  return [['📷',r.c.done+' из '+r.c.total,'сдано'],['🎯',r.c.ok,'сам(а), без подсказок'],['💡',r.c.hint,'с подсказкой'],['✍️',r.c.sol,'после образца'],['⭐',r.c.scored?r.c.points+' / '+r.c.scored*2:'—','баллы учителя'],['⏱',fmtT(r.s.totalMs||0),'время']]
   .map(a=>`<div class="stat"><b>${a[0]} ${a[1]}</b><span>${a[2]}</span></div>`).join('');
}

/* ===== Интерактивный график ===== */
function openGraph(n,preserveSample){
  const t=TASK[n],g=t.g;const isK=g.family==='k';
  let val=isK?0.5:(g.view[2]+g.view[3])/2;val=Math.round(val*2)/2;
  const W=760;
  const base=graphSVG(g,{W,maxH:520});
  const graphModalHTML=`<div class="row" style="justify-content:space-between;margin-bottom:6px"><h2 style="margin:0">📈 Интерактивный график</h2><button class="btn ghost" id="gX">✕</button></div>
   <div class="gq">${M(t.q)}</div>
   <div class="gwrap" id="gw">${base}<svg class="gov" id="gov"></svg></div>
   <div class="gctl"><div class="gval" id="gv"></div><div class="gcnt" id="gc"></div></div>
   <div class="row" style="gap:7px;align-items:center"><button class="btn pri sm" id="gPlay">▶ Пуск по особым точкам</button><button class="btn ghost sm" id="gReset">↻ Сначала</button><button class="btn sm" id="gm">−</button><input type="range" id="gr" min="${isK?-10:g.view[2]}" max="${isK?10:g.view[3]}" step="0.01" style="flex:1"><button class="btn sm" id="gp">+</button></div>
   <div class="ghint" id="gStatus" style="margin-top:7px;min-height:18px">Критические значения: ${runnerCritical(g).map(fmtV).join(', ')}. Бегунок остановится точно на каждом из них.</div>
   <p class="ghint">${isK?'Тяни прямую мышкой/пальцем — она вращается вокруг точки O(0; 0).':'Тяни прямую вверх-вниз мышкой или пальцем.'} Оранжевые точки — общие точки с графиком. ○ — выколотые точки.</p>`;
  if(preserveSample){
    const bg=document.createElement('div');bg.className='mbg';bg.id='graphOverlayModal';bg.style.zIndex='75';
    bg.innerHTML=`<div class="mdl gmdl">${graphModalHTML}</div>`;
    bg.addEventListener('click',e=>{if(e.target===bg)bg.remove();});document.body.appendChild(bg);
  }else modal(graphModalHTML,'gmdl');
  $('#gX').onclick=()=>{if(preserveSample)document.getElementById('graphOverlayModal')?.remove();else closeModal();};
  const svg=document.querySelector('#gw .gsvg');const vb=svg.getAttribute('viewBox');const u=+svg.dataset.u,pad=+svg.dataset.pad;
  const ov=$('#gov');ov.setAttribute('viewBox',vb);
  const [x0,x1,y0,y1]=g.view;const X=x=>pad+(x-x0)*u,Y=y=>pad+(y1-y)*u;
  const min=isK?-10:y0,max=isK?10:y1,critical=runnerCritical(g);
  // Range step is 0.01. Never snap prematurely from a wide 0.06–0.12 neighbourhood.
  const snapSlider=v=>{for(const c of critical)if(Math.abs(v-c)<=0.0051)return c;return Math.round(v*100)/100;};
  const snapDrag=v=>{for(const c of critical)if(Math.abs(v-c)<=0.025)return c;return Math.round(v*100)/100;};
  const draw=()=>{
    const pts=countInter(g,val);
    let o='';const col='#ff7a00';
    if(isK)o+=`<line x1="${X(x0-50)}" y1="${Y(val*(x0-50))}" x2="${X(x1+50)}" y2="${Y(val*(x1+50))}" stroke="${col}" stroke-width="2.6"/><circle cx="${X(0)}" cy="${Y(0)}" r="4" fill="${col}"/>`;
    else o+=`<line x1="0" y1="${Y(val)}" x2="${X(x1)+pad}" y2="${Y(val)}" stroke="${col}" stroke-width="2.6"/><circle cx="${X(x1)+pad-12}" cy="${Y(val)}" r="9" fill="${col}" opacity=".85"/><path d="M${X(x1)+pad-12},${Y(val)-5} l-4,4 h8z M${X(x1)+pad-12},${Y(val)+5} l-4,-4 h8z" fill="#fff"/>`;
    pts.forEach(P=>{if(P.x>=x0-0.01&&P.x<=x1+0.01&&P.y>=y0-0.01&&P.y<=y1+0.01)o+=`<circle cx="${X(P.x)}" cy="${Y(P.y)}" r="7" fill="${col}" stroke="#fff" stroke-width="2.4"/>`;});
    ov.innerHTML=`<defs><clipPath id="ovc"><rect x="0" y="0" width="${X(x1)+pad}" height="${Y(y0)+pad}"/></clipPath></defs><g clip-path="url(#ovc)">${o}</g>`;
    const isCrit=critical.some(c=>Math.abs(c-val)<1e-9);
    $('#gv').innerHTML=(isK?'y = kx,&nbsp; k = ':'y = m,&nbsp; m = ')+'<b>'+M(isCrit?labOf(g,val):fmtV(val))+'</b>'+(isCrit?' <span class="snap">особое положение!</span>':'');
    $('#gc').innerHTML=`<span class="n${Math.min(pts.length,4)}">${plural(pts.length)}</span>`;
    $('#gr').value=val;
  };
  let running=false,raf=0,last=0,pauseUntil=0,ci=0;
  const play=$('#gPlay'),reset=$('#gReset'),status=$('#gStatus');
  const stop=()=>{running=false;if(raf)cancelAnimationFrame(raf);raf=0;last=0;play.textContent='▶ Пуск по особым точкам';};
  const animate=ts=>{
    if(!running)return;if(!last)last=ts;const dt=Math.min(50,ts-last);last=ts;
    if(ts<pauseUntil){raf=requestAnimationFrame(animate);return;}
    const speed=Math.max(0.2,(max-min)*0.07),next=val+speed*dt/1000,c=critical[ci];
    if(c!==undefined&&val<c-1e-9&&next>=c-1e-9){
      val=c;ci++;draw();status.textContent='Точная остановка: '+(isK?'k = ':'m = ')+fmtV(val)+'. Число общих точек: '+countInter(g,val).length+'.';
      pauseUntil=ts+2200;
    }else{
      val=Math.min(max,next);draw();
      if(val>=max-1e-9){stop();status.textContent='Конец шкалы. Все особые положения пройдены.';return;}
    }
    raf=requestAnimationFrame(animate);
  };
  const start=()=>{
    val=min;ci=0;pauseUntil=0;last=0;running=true;draw();
    play.textContent='Ⅱ Пауза';status.textContent='Движение от '+fmtV(min)+'. Остановка на каждом особом значении.';
    raf=requestAnimationFrame(animate);
  };
  play.onclick=()=>{if(running){stop();status.textContent='Движение приостановлено.';}else start();};
  reset.onclick=()=>{stop();val=min;ci=0;draw();status.textContent='Исходное положение. Особые значения: '+critical.map(fmtV).join(', ');};
  const fromEvt=e=>{const p=ov.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(ov.getScreenCTM().inverse());const wx=x0+(q.x-pad)/u,wy=y1-(q.y-pad)/u;
    if(isK){if(Math.abs(wx)<0.15)return;val=snapDrag(wy/wx);val=Math.max(-10,Math.min(10,val));}else{val=snapDrag(Math.max(y0,Math.min(y1,wy)));}ci=critical.findIndex(c=>c>val+1e-9);if(ci<0)ci=critical.length;draw();};
  let drag=false;
  ov.addEventListener('pointerdown',e=>{stop();drag=true;ov.setPointerCapture(e.pointerId);fromEvt(e);});
  ov.addEventListener('pointermove',e=>{if(drag)fromEvt(e);});
  ov.addEventListener('pointerup',()=>drag=false);ov.addEventListener('pointercancel',()=>drag=false);
  $('#gr').oninput=e=>{stop();val=snapSlider(+e.target.value);ci=critical.findIndex(c=>c>val+1e-9);if(ci<0)ci=critical.length;draw();};
  const st=isK?0.05:0.1;
  $('#gm').onclick=()=>{stop();val=snapSlider(Math.round((val-st)*100)/100);ci=critical.findIndex(c=>c>val+1e-9);if(ci<0)ci=critical.length;draw();};
  $('#gp').onclick=()=>{stop();val=snapSlider(Math.round((val+st)*100)/100);ci=critical.findIndex(c=>c>val+1e-9);if(ci<0)ci=critical.length;draw();};
  draw();
}

/* ===== Образец решения (рукописный) ===== */
/* ===== Видимость образцов и графиков (настройка учителя) ===== */
function visOf(code){const v=(DB.teacher.vis||{})[code];return Object.assign({as:1,ag:1,ps:0,pg:0},v||{});}
function pairOf(t){const o=TASK[t.pair];return t.kind==='П'?{pr:t,an:o}:{pr:o,an:t};}
function toolsHTML(t,x){
  const v=visOf(t.code),{pr,an}=pairOf(t),isP=t.kind==='П';const V=x.views||{};
  const tool=(id,ic,title,sub,cls)=>`<button class="tool ${cls||''}" id="${id}"><b>${ic}</b><span>${title}</span><small>${sub}</small></button>`;
  const seen=k=>V[k]?' · открыт':'';
  let h='';
  if(isP){
    if(v.as)h+=tool('tAS','✍️','Образец аналога','похожая задача, решение на 2 балла'+seen('as'));
    if(v.ps)h+=tool('tOWN','✍️','Образец этой задачи','учитель увидит, если до сдачи'+seen('own'),'warn');
  }else{
    h+=tool('tPC','📄','Прототип','условие задачи-прототипа'+seen('pc'));

function showUpTo(t,steps,k){
  const sh={p:new Set(),g:new Set(),h:new Set(),o:new Set(),e:new Set(),a:new Set(),O:[],V:[],s:[],pts:[],L:false};
  const isHO=(x,y)=>[...(t.g.holes||[]),...(t.g.opens||[])].some(H=>Math.abs(H[0]-x)<1e-6&&Math.abs(H[1]-y)<1e-6);
  for(let i=0;i<=k&&i<steps.length;i++){
    const st=steps[i];
    (st.d||[]).forEach(d=>{
      if(typeof d==='object'){if(d.O)sh.O.push(d.O);if(d.V)sh.V.push(d.V);if(d.s!=null)sh.s.push(d.s);return;}
      if(d==='L'){sh.L=true;return;}
      if(d==='T'){st.w.forEach(w=>{if(!w.tab)return;const xs=w.tab[0].slice(1).map(numP),ys=w.tab[1].slice(1).map(numP);xs.forEach((x,j)=>{if(isFinite(x)&&isFinite(ys[j])&&!isHO(x,ys[j]))sh.pts.push([x,ys[j]]);});});return;}

function buildPrint(){
  const o=PR.o;const list=ORDER.filter(n=>PR.sel.has(n));
  if(!list.length&&!o.memo)return '<p>Не выбрано ни одной задачи.</p>';
  let h='';
  if(o.head)h+=`<div class="pr-head"><span>Фамилия, имя: ________________________________</span><span>Дата: ____________</span></div>`;
  if(PR.title)h+=`<div class="pr-title">${esc(PR.title)}</div>`;
  list.forEach((n,i)=>{const t=TASK[n];const num=PR.numMode==='seq'?(i+1)+'.':t.label;
    if(!(o.cond||o.sample||o.graph||o.ans||o.space))return;
    h+=`<div class="pr-task ${o.sample?'brk':''}">`;
    if(o.num||o.kind)h+=`<div>${o.num?`<span class="pr-n">${PR.numMode==='seq'?num:'№ '+t.code}</span>`:''}${o.kind?`<span class="pr-k">${t.kind==='П'?'прототип':'аналог'}</span>`:''}</div>`;
    if(o.cond)h+=`<div class="pr-q">${M(t.q)}</div>`;
    if(o.links&&t.links){const L=t.links;h+=`<div class="pr-l">${L.an?'Аналог: '+L.an+'<br>':''}${L.vid?'Видео: '+L.vid:''}</div>`;}
    if(o.space)h+=`<div class="pr-space"></div>`;
    if(o.graph&&!o.sample)h+=`<div class="pr-fig">${graphSVG(t.g,{W:420,maxH:300,count:{test:t.need==='max'?null:NEED[t.need]}})}</div>`;
    if(o.sample)h+=sampleHTML(t,true);
    if(o.ans&&!o.sample)h+=`<div class="pr-ans">Ответ: ${MA(t.ans)}</div>`;
    h+=`</div>`;});
  if(o.key&&list.length){h+=`<div class="pr-key"><div class="pr-title">Ключ ответов${PR.title?': '+esc(PR.title):''}</div><table>${list.map((n,i)=>`<tr><td><b>${PR.numMode==='seq'?i+1:TASK[n].label}</b></td><td>${MA(TASK[n].ans)}</td></tr>`).join('')}</table></div>`;}
  if(o.memo)h+=`<div class="pr-memo"><div class="pr-title">Памятка: графики</div><div class="stks">${STICKERS.map(s=>stickerHTML(s,{flat:1})).join('')}</div></div>`;
  return h;
}
function doPrint(){
  const pa=document.getElementById('printArea');pa.innerHTML=buildPrint();document.body.classList.add('printing');
  const done=()=>{document.body.classList.remove('printing');window.removeEventListener('afterprint',done);};
  window.addEventListener('afterprint',done);
  setTimeout(()=>{try{window.print();}catch(e){toast('Печать недоступна в этом окне');}setTimeout(done,1500);},80);
}

function calcReport(name){
  const s=DB.students[name];const c=counts(s);
  const rows=vis(s).map(n=>{const x=T(n,s);return {n,t:TASK[n],x,st:x.st||'new'};});
  const byTopic=TOPICS.filter(tp=>rows.some(r=>r.t.topic===tp.id)).map(tp=>{const rs=rows.filter(r=>r.t.topic===tp.id);return {tp,total:rs.length,done:rs.filter(r=>r.st!=='new').length,self:rs.filter(r=>r.st==='ok').length,help:rs.filter(r=>r.st==='hint'||r.st==='sol').length,pts:rs.reduce((a,r)=>a+(r.x.score||0),0),sc:rs.filter(r=>r.x.score!=null).length};});
  return {s,c,rows,byTopic};
}

function svgImg(svg){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);});}
function urlImg(u){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=u;});}
function splitWords(s){const out=[];let d=0,b=0,cur='';for(let i=0;i<s.length;i++){const ch=s[i];if(ch==='{')d++;if(ch==='}')d--;if(ch==='['&&s[i+1]==='[')b++;if(ch===']'&&s[i+1]===']')b--;if(ch===' '&&d===0&&b===0){if(cur)out.push(cur);cur='';}else cur+=ch;}if(cur)out.push(cur);return out;}
function wrapM(s,w,sz){const ws=splitWords(s);const lines=[];let line='';ws.forEach(x=>{const t=line?line+' '+x:x;if(mw(t,sz)>w&&line){lines.push(line);line=x;}else line=t;});if(line)lines.push(line);return lines;}
function condSVG(t,W){
  const SZ=22,P=4;const ls=t.q.split('<br>').flatMap(par=>wrapM(par,W-2*P,SZ));let y=0,o='';
  ls.forEach(l=>{const h=Math.max(mh(l,SZ),SZ)+12;o+=sdraw(l,P,y+h/2,SZ,'#1d2640',500);y+=h;});
  return {o,h:y};
}
async function makeReportPDF(name){

  r.byTopic.forEach((b,i)=>{if(i%2)rr(MX,y,W-2*MX,42,8,'#fafbfe');text(b.tp.name,tcol[0]+12,y+29,21);text(b.done+' / '+b.total,tcol[1]+12,y+29,21,'#1d2640',1);text(String(b.self),tcol[2]+12,y+29,21);text(String(b.help),tcol[3]+12,y+29,21,b.help?'#8a6400':'#1d2640');text(b.sc?b.pts+' / '+b.sc*2:'—',tcol[4]+12,y+29,21);y+=42;});

function pdfFromJpegs(imgs,w,h){
  const enc=new TextEncoder();const parts=[];let len=0;const offs=[];
  const add=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length;};
  const PW=595.28,PH=841.89;const n=imgs.length;
  add('%PDF-1.4\n');
  const obj=(id,body)=>{offs[id]=len;add(id+' 0 obj\n');body();add('\nendobj\n');};
  obj(1,()=>add('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>add(`<< /Type /Pages /Count ${n} /Kids [${imgs.map((_,i)=>(3+i*3)+' 0 R').join(' ')}] >>`));
  imgs.forEach((im,i)=>{const p=3+i*3,c=p+1,x=p+2;
    obj(p,()=>add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im${i} ${x} 0 R >> >> /Contents ${c} 0 R >>`));
    const cs=`q ${PW} 0 0 ${PH} 0 0 cm /Im${i} Do Q`;
    obj(c,()=>add(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(x,()=>{add(`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.length} >>\nstream\n`);add(im);add('\nendstream');});});
  const total=3+n*3;const xref=len;let x=`xref\n0 ${total}\n0000000000 65535 f \n`;for(let i=1;i<total;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  add(x);add(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'});
}
