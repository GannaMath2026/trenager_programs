<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ОГЭ №25 · Геометрия · Тренажёр</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f6fb;
  --card: #fff;
  --ink: #1d2640;
  --mut: #6b7491;
  --line: #e3e7f1;
  --pri: #4f6bff;
  --pri2: #7b5cff;
  --ok: #16a36a;
  --okl: #dff6ea;
  --warn: #f0a400;
  --warnl: #fff2cc;
  --bad: #e5484d;
  --glow: #ffb547;
  --sh: 0 6px 24px rgba(30,40,80,.08);
  --r: 16px;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Nunito', system-ui, sans-serif;
  overflow: hidden;
}
button {
  font: inherit; cursor: pointer;
  border: 0; border-radius: 12px;
  padding: 9px 16px; font-weight: 700;
  background: var(--card); color: var(--ink);
  border: 1.5px solid var(--line);
  box-shadow: 0 4px 12px rgba(30,40,80,.06);
  transition: .15s;
}
button:hover:not(:disabled) {
  background: var(--pri); color: #fff; border-color: var(--pri);
  transform: translateY(-1px);
}
button:disabled { opacity: .45; cursor: not-allowed; transform: none; }

/* Layout */
.app {
  display: grid;
  grid-template-columns: 260px 1fr 380px;
  height: 100vh;
}
@media (max-width: 1100px) {
  .app { grid-template-columns: 220px 1fr 320px; }
}
@media (max-width: 860px) {
  .app {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr auto;
  }
  .side { max-height: 28vh; border-right: 0; border-bottom: 1px solid var(--line); }
  .text-panel { max-height: 38vh; border-left: 0; border-top: 1px solid var(--line); }
}

/* Sidebar */
.side {
  background: var(--card);
  border-right: 1px solid var(--line);
  padding: 16px 12px;
  overflow-y: auto;
  display: flex; flex-direction: column; gap: 8px;
}
.side h1 {
  margin: 0 0 4px;
  font-size: 15px; font-weight: 900;
  letter-spacing: .04em; text-transform: uppercase;
  color: var(--mut);
}
.side .sub {
  font-size: 13px; color: var(--mut); margin-bottom: 10px;
}
.group {
  background: #f8faff;
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: 6px;
}
.group-title {
  display: block; width: 100%;
  text-align: left; border: 0; border-radius: 0;
  background: #eef2ff; color: #2a3a6e;
  padding: 11px 12px; font-size: 13.5px; font-weight: 800;
  box-shadow: none;
}
.group-title:hover { background: #e0e7ff; color: #1e2d5a; }
.task-btn {
  display: block; width: calc(100% - 12px);
  margin: 4px 6px; text-align: left;
  border: 0; border-radius: 10px;
  background: transparent; color: #536982;
  font-size: 13px; padding: 9px 10px; line-height: 1.3;
  box-shadow: none;
}
.task-btn:hover { background: #e9f1ff; color: #194fb3; }
.task-btn.active {
  color: #194fb3; background: #e9f1ff;
  box-shadow: inset 3px 0 #4779df;
}

/* Canvas area */
.canvas-wrap {
  position: relative;
  background: radial-gradient(ellipse at 50% 45%, #fff 0, #f9fbff 68%, #f1f5fc 100%);
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
#board {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  cursor: grab; touch-action: none;
}
#board:active { cursor: grabbing; }
#board .geo-line { stroke-linecap: round; stroke-linejoin: round; }
#board .geo-label {
  font-family: 'Nunito', system-ui, sans-serif;
  font-weight: 800;
  paint-order: stroke;
  stroke: #fff; stroke-width: 5px; stroke-linejoin: round;
}
#board .glow-halo {
  fill: none; stroke-width: 8; opacity: .58;
  filter: blur(5px);
  animation: glowFade 1.15s ease-out forwards;
  pointer-events: none;
}
#board .soft-flash {
  animation: softFlash 1s ease-out both;
  transform-box: fill-box; transform-origin: center;
}
#board .draw-in {
  stroke-dasharray: 1; stroke-dashoffset: 1;
  animation: vectorDraw .75s cubic-bezier(.3,.05,.2,1) forwards;
}
@keyframes vectorDraw { to { stroke-dashoffset: 0; } }
@keyframes glowFade { to { opacity: 0; } }
@keyframes softFlash {
  0% { filter: none; transform: scale(.96); }
  35% { filter: drop-shadow(0 0 10px var(--glow)); transform: scale(1.03); }
  100% { filter: none; transform: scale(1); }
}
@keyframes numberIn {
  0% { opacity: 0; transform: scale(.72); }
  38% { opacity: 1; transform: scale(1.12); filter: drop-shadow(0 0 9px #ffbd58); }
  100% { opacity: 1; transform: scale(1); filter: none; }
}
#board .number-arrive { animation: numberIn .8s ease-out both; transform-box: fill-box; transform-origin: center; }

.toolbar {
  position: absolute; top: 14px; left: 14px;
  display: flex; gap: 8px; z-index: 20;
}
.tool-btn {
  font-size: 15px; padding: 7px 12px;
  background: rgba(255,255,255,.92);
}
.tool-btn.active {
  background: var(--pri); color: #fff; border-color: var(--pri);
}

#drawCanvas {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none; z-index: 10;
}
#drawCanvas.active { pointer-events: auto; cursor: crosshair; }

.controls {
  position: absolute; bottom: 18px; left: 50%;
  transform: translateX(-50%);
  display: flex; gap: 12px; z-index: 20;
}
.controls button {
  min-width: 110px;
  background: rgba(255,255,255,.95);
}
.controls button.pri {
  background: linear-gradient(135deg, var(--pri), var(--pri2));
  color: #fff; border-color: transparent;
  box-shadow: 0 4px 14px rgba(79,107,255,.35);
}
.controls button.pri:hover:not(:disabled) {
  filter: brightness(1.05);
}

/* Text panel */
.text-panel {
  background: var(--card);
  border-left: 1px solid var(--line);
  padding: 20px 22px;
  overflow-y: auto;
  display: flex; flex-direction: column;
}
.step-card {
  display: none;
  margin-bottom: 14px;
  padding: 16px 18px;
  border: 1px solid #e0e9f5;
  border-radius: 16px;
  background: linear-gradient(145deg, #fff, #f8fbff);
  box-shadow: 0 8px 24px rgba(43,75,125,.07);
  font-size: 16.5px; line-height: 1.5;
}
.step-card.visible { display: block; animation: fadeUp .35s ease; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
.step-card .red { color: #d32f2f; font-weight: 800; }
.step-card .blue { color: #1976d2; font-weight: 800; }
.step-card .green { color: #2e7d32; font-weight: 800; }
.step-card .violet { color: #7956d8; font-weight: 800; }
.frac {
  display: inline-block; vertical-align: middle;
  text-align: center; margin: 0 4px;
  font-size: .95em; line-height: 1.1;
}
.frac span { display: block; }
.frac .top { border-bottom: 2px solid #1e2d46; padding-bottom: 2px; }
.frac .bottom { padding-top: 2px; }

.progress-dots {
  display: flex; gap: 6px; flex-wrap: wrap;
  margin-bottom: 14px;
}
.dot {
  width: 28px; height: 28px; border-radius: 8px;
  border: 1.5px solid var(--line);
  background: var(--bg); color: var(--mut);
  font-size: 12px; font-weight: 800;
  display: grid; place-items: center;
}
.dot.done { background: var(--ok); border-color: var(--ok); color: #fff; }
.dot.cur { outline: 2.5px solid var(--pri); outline-offset: 1px; background: #e9f1ff; color: var(--pri); }

.badge {
  display: inline-block;
  font-size: 11px; font-weight: 800;
  padding: 3px 9px; border-radius: 999px;
  background: #e8ecff; color: #3b4fd8;
  margin-bottom: 8px;
}

#final-grade {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0);
  background: rgba(255,255,255,.97);
  padding: 36px 52px; border-radius: 20px;
  border: 4px solid var(--ok);
  box-shadow: 0 16px 50px rgba(0,0,0,.18);
  text-align: center; z-index: 100;
  transition: transform .45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
#final-grade.show { transform: translate(-50%, -50%) scale(1); }
#final-grade h1 { margin: 0; font-size: 32px; color: var(--ok); }
#final-grade h2 { margin: 8px 0 0; font-size: 28px; color: #d32f2f; }
#final-grade .star { font-size: 48px; }

body.fullscreen .canvas-wrap {
  position: fixed; inset: 0; z-index: 1000;
}
body.fullscreen .text-panel {
  position: fixed; z-index: 1001;
  right: 16px; top: 70px; bottom: 16px;
  width: min(42vw, 420px);
  border-radius: 18px;
  box-shadow: 0 20px 60px rgba(22,40,68,.25);
  background: rgba(255,255,255,.97);
}
body.fullscreen .side, body.fullscreen .toolbar { z-index: 1002; }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <h1>ОГЭ №25</h1>
    <div class="sub">Геометрия · 3 задачи</div>
    <div id="outline"></div>
  </aside>

  <div class="canvas-wrap">
    <div class="toolbar">
      <button id="drawBtn" class="tool-btn">✏️ Рисовать</button>
      <button id="eraseBtn" class="tool-btn">🧹 Стереть</button>
      <button id="showAllBtn" class="tool-btn">📄 Решение целиком</button>
    </div>
    <svg id="board" viewBox="0 0 1000 900" preserveAspectRatio="xMidYMid meet" aria-label="Чертёж"></svg>
    <canvas id="drawCanvas" width="1000" height="900"></canvas>
    <div class="controls">
      <button id="prevBtn" disabled>← Назад</button>
      <button id="nextBtn" class="pri">Далее →</button>
    </div>
  </div>

  <div class="text-panel">
    <div class="progress-dots" id="dots"></div>
    <div id="text-container"></div>
  </div>
</div>

<div id="final-grade">
  <div class="star">⭐</div>
  <h1>РЕШЕНО ОТЛИЧНО!</h1>
  <h2>ОЦЕНКА: 5</h2>
</div>

<script>
const board = document.getElementById('board');
const drawCanvas = document.getElementById('drawCanvas');
const dctx = drawCanvas.getContext('2d');
const nextBtn = document.getElementById('nextBtn');
const prevBtn = document.getElementById('prevBtn');
const drawBtn = document.getElementById('drawBtn');
const eraseBtn = document.getElementById('eraseBtn');
const showAllBtn = document.getElementById('showAllBtn');
const textContainer = document.getElementById('text-container');
const finalGrade = document.getElementById('final-grade');
const dotsEl = document.getElementById('dots');

let currentTask = 0;
let currentStep = 0;
let isAnimating = false;
let animQueue = [];
let typingTimeout = null;
let isPanning = false;
let panStartX, panStartY, panX = 0, panY = 0;
let isDrawMode = false;
let drawing = false;

const NS = 'http://www.w3.org/2000/svg';

/* ========== ЗАДАЧИ ========== */
const tasks = [
  // ===== Задача 1: Радиус окружности (трапеция) =====
  {
    title: 'Радиус окружности',
    short: 'Трапеция + касание CD',
    cfg: { scale: 15, offsetX: 520, offsetY: 480 },
    pts: {
      A: {x: -17, y: 0}, D: {x: 17, y: 0},
      E: {x: -4.76, y: 16.32},
      B: {x: -9.8, y: 9.6}, C: {x: 4.2, y: 9.6},
      O: {x: -23.87, y: 12.65},
      H: {x: -13.4, y: 4.8},
      T: {x: -15.23, y: 24.17}
    },
    texts: [
      `Дано:<br>Трапеция <i>ABCD</i>.<br>Основания <i>AD</i> = <span class="red">34</span>, <i>BC</i> = <span class="red">14</span>.<br>Сумма углов при основании <i>AD</i> равна <span class="red">90°</span>.<br>Боковая сторона <i>AB</i> = <span class="red">12</span>.<br>Окружность проходит через <i>A</i> и <i>B</i> и касается <i>CD</i>.<br><br><b>Найти радиус окружности.</b>`,
      `Шаг 1. Достраиваем до треугольника<br>Продлим стороны <i>AB</i> и <i>CD</i> до пересечения в точке <i>E</i>. Так как сумма углов при <i>AD</i> равна 90°, треугольник <i>AED</i> — <span class="red">прямоугольный</span> (∠E = 90°).`,
      `Шаг 2. Подобие треугольников<br><span class="blue">∠EBC = ∠EAD</span> и <span class="violet">∠ECB = ∠EDA</span> — накрест лежащие при <i>BC</i> ∥ <i>AD</i>.<br><span class="red">∠BEC = ∠AED = 90°</span> — общий прямой угол.<br>Значит <i>△EBC ∼ △EAD</i>. Коэффициент подобия <i>k</i> = 14/34 = <b>7/17</b>.`,
      `Шаг 3. Вводим неизвестное<br>Пусть <i>EB</i> = <i>x</i>. Тогда <i>EA</i> = <i>x</i> + 12.`,
      `Шаг 4. Пропорция<br><span class="frac"><span class="top"><i>x</i></span><span class="bottom"><i>x</i>+12</span></span> = <span class="frac"><span class="top">7</span><span class="bottom">17</span></span><br>17<i>x</i> = 7<i>x</i> + 84 → 10<i>x</i> = 84 → <span class="red"><i>x</i> = 8.4</span>.<br>Итак <i>EB</i> = 8.4, <i>EA</i> = 20.4.`,
      `Шаг 5. Свойства окружности<br>Окружность с центром <i>O</i> проходит через <i>A</i>, <i>B</i> и касается <i>CD</i> в точке <i>T</i>.<br>Радиусы <i>OA</i>, <i>OB</i>, <i>OT</i>. Радиус в точку касания <span class="red">перпендикулярен касательной</span>: <i>OT</i> ⊥ <i>CD</i>.`,
      `Шаг 6. Высота к хорде<br>Из центра <i>O</i> опускаем перпендикуляр <i>OH</i> на хорду <i>AB</i>.<br><span class="blue"><i>OH</i> ⟂ <i>AB</i></span>.`,
      `Шаг 7. Половина хорды<br>В равнобедренном <i>△AOB</i> высота к основанию — медиана.<br><span class="blue"><i>AH</i> = <i>HB</i></span>. Так как <i>AB</i> = 12, получаем <span class="red"><i>AH</i> = <i>HB</i> = 6</span>.`,
      `Шаг 8. Прямоугольник<br>В четырёхугольнике <i>OHTE</i> три угла по 90° (∠E, ∠H, ∠T). Если три угла прямые — это <span class="red">прямоугольник</span>.<br>Значит <i>OT</i> = <i>HE</i>.`,
      `Шаг 9. Радиус<br><i>HE</i> = <i>EA</i> − <i>AH</i> = 20.4 − 6 = <span class="red">14.4</span>.<br>Так как <i>OHTE</i> — прямоугольник, <i>OT</i> = <i>HE</i>. Следовательно <span class="red"><i>R</i> = 14.4</span>.<br><br><b>Ответ: 14.4</b>`
    ]
  },
  // ===== Задача 2: Площадь трапеции =====
  {
    title: 'Площадь трапеции',
    short: 'Биссектриса через середину AB',
    cfg: { scale: 18, offsetX: 480, offsetY: 560 },
    pts: {
      A: {x: 0, y: 0}, B: {x: 0, y: 10}, C: {x: 1, y: 10}, D: {x: 25, y: 0},
      M: {x: 0, y: 5}, P: {x: -25, y: 10}, E: {x: 1, y: 0}
    },
    texts: [
      `Дано: трапеция <i>ABCD</i>, <i>AB</i> = <span class="red">10</span>, <i>CD</i> = <span class="red">26</span>, <i>BC</i> = <span class="red">1</span>. Биссектриса угла <i>ADC</i> проходит через середину стороны <i>AB</i>.<br><br><b>Найти площадь трапеции.</b>`,
      `Шаг 1. Середина и продолжение<br>Обозначим середину <i>AB</i> буквой <i>M</i>. Тогда <span class="blue"><i>AM</i> = <i>BM</i></span>. Продлим биссектрису <i>DM</i> до пересечения с прямой <i>BC</i> в точке <i>P</i>.`,
      `Шаг 2. Подобные треугольники<br>Так как <i>PC</i> ∥ <i>AD</i>, углы <span class="blue">∠PBM = ∠DAM</span> — накрест лежащие. Углы <span class="violet">∠PMB = ∠DMA</span> — вертикальные. Значит <i>△PBM ∼ △DAM</i>.`,
      `Шаг 3. Биссектриса и равнобедренность<br><i>PC</i> ∥ <i>AD</i>, поэтому <span class="blue">∠CPD = ∠PDA</span>. А <i>DM</i> — биссектриса ∠CDA, значит <span class="red">∠PDA = ∠CDP</span>. Тогда ∠CPD = ∠CDP → <i>△PCD</i> равнобедренный и <span class="red"><i>PC = CD = 26</i></span>.`,
      `Шаг 4. Основание AD<br>Из подобия <i>△PBM</i> и <i>△DAM</i>: <i>PB/DA = BM/AM = 1</i>, поэтому <i>PB = AD</i>. На верхней прямой <i>PC = PB + BC</i>, значит <span class="red"><i>PB = 26 − 1 = 25</i></span> и <i>AD = 25</i>.`,
      `Шаг 5. Высота через параллелограмм<br>Через <i>C</i> проведём <i>CE</i> ∥ <i>AB</i>, где <i>E</i> лежит на <i>AD</i>. Так как <i>BC</i> ∥ <i>AD</i>, четырёхугольник <i>ABCE</i> — параллелограмм. Поэтому <span class="blue"><i>CE = AB = 10</i></span> и <span class="blue"><i>AE = BC = 1</i></span>.`,
      `Шаг 6. Стороны прямоугольного треугольника<br><i>ED = AD − AE = 25 − 1 = <span class="red">24</span></i>. В треугольнике <i>CED</i> стороны 10, 24 и 26.`,
      `Шаг 7. Прямой угол<br><i>CE</i>² + <i>ED</i>² = 10² + 24² = 100 + 576 = 676 = 26² = <i>CD</i>². По обратной теореме Пифагора <span class="red">∠CED = 90°</span>, следовательно <i>CE</i> — высота трапеции.`,
      `Шаг 8. Площадь<br><i>S</i> = ((<i>BC</i> + <i>AD</i>) / 2) · <i>CE</i> = ((1 + 25) / 2) · 10 = <span class="red">130</span>.<br><br><b>Ответ: 130</b>`
    ]
  },
  // ===== Задача 3: Стороны треугольника =====
  {
    title: 'Стороны треугольника',
    short: 'Медиана ⟂ биссектрисе = 12',
    cfg: { scale: 22, offsetX: 500, offsetY: 420 },
    pts: {
      A: {x: 0, y: 6}, B: {x: -9, y: 0}, C: {x: 9, y: -12},
      D: {x: 0, y: -6}, E: {x: 3, y: 0}, F: {x: 0, y: 0}
    },
    texts: [
      `Дано: в треугольнике <i>ABC</i> медиана <i>AD</i> и биссектриса <i>BE</i> перпендикулярны и равны <span class="red">12</span>.<br><br><b>Найти стороны треугольника.</b>`,
      `Шаг 1. Точка пересечения<br>Обозначим <i>F = AD ∩ BE</i>. Точка <i>D</i> — середина <i>BC</i>, а в <i>F</i> — прямой угол. Поэтому <i>BD = DC</i> и <i>BF ⟂ AD</i>.`,
      `Шаг 2. Равные прямоугольные треугольники<br>Так как <i>D</i> лежит на <i>BC</i>, отрезок <i>BF</i> делит угол <i>ABD</i> пополам. Треугольники <i>ABF</i> и <i>DBF</i> прямоугольные, имеют общий катет <i>BF</i> и равные углы при <i>B</i>. Они равны → <span class="blue"><i>AF = FD</i></span> и <span class="red"><i>AB = BD</i></span>.`,
      `Шаг 3. Половина медианы<br><i>AD = 12</i>, значит <span class="red"><i>AF = FD = 6</i></span>. Так как <i>D</i> — середина <i>BC</i>, а <i>BD = AB</i>, получаем <span class="blue"><i>BC = 2·AB</i></span>.`,
      `Шаг 4. Теорема о биссектрисе<br><i>AE/EC = AB/BC = 1/2</i>. Значит <i>AE : EC = 1 : 2</i>, поэтому <i>AC : AE = 3 : 1</i>.`,
      `Шаг 5. Теорема Менелая<br>В треугольнике <i>BCE</i> прямая <i>A–F</i> пересекает прямые <i>CE</i>, <i>BE</i> и <i>BC</i>. По теореме Менелая: <i>(CA/AE)·(EF/FB)·(BD/DC) = 1</i>.<br>Так как <i>CA/AE = 3</i> и <i>BD/DC = 1</i>, получаем <span class="red"><i>BF : FE = 3 : 1</i></span>.`,

/* ========== ОТРИСОВКА ========== */
function pt(p, cfg) {
  return {
    x: cfg.offsetX + p.x * cfg.scale + panX,
    y: cfg.offsetY - p.y * cfg.scale + panY
  };
}

function svgEl(tag, attrs = {}) {
  const el = document.createElementNS(NS, tag);
  Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
  board.appendChild(el);
  return el;
}

function addGlow(x, y, color = '#ffb547', r = 15) {
  const g = svgEl('circle', { cx: x, cy: y, r, class: 'glow-halo', stroke: color });
  setTimeout(() => g.remove(), 1200);
}

function drawTextDirect(text, p, ox, oy, color, size, cfg, isItalic = false, animate = false) {
  const s = pt(p, cfg);
  const el = svgEl('text', {
    x: s.x + ox, y: s.y + oy,
    fill: color, 'font-size': size || 26,
    class: `geo-label${animate ? ' soft-flash number-arrive' : ''}`,
    'font-style': isItalic ? 'italic' : 'normal'
  });
  el.textContent = text;
  if (animate) addGlow(s.x + ox, s.y + oy, color, 14);
  return el;
}

function drawRightAngle(v, p1, p2, size, color, cfg) {
  const vx = pt(v, cfg), p1x = pt(p1, cfg), p2x = pt(p2, cfg);
  const dx1 = p1x.x - vx.x, dy1 = p1x.y - vx.y;
  const len1 = Math.hypot(dx1, dy1) || 1;
  const ux1 = dx1 / len1, uy1 = dy1 / len1;
  const dx2 = p2x.x - vx.x, dy2 = p2x.y - vx.y;
  const len2 = Math.hypot(dx2, dy2) || 1;
  const ux2 = dx2 / len2, uy2 = dy2 / len2;
  const pA = { x: vx.x + ux1 * size, y: vx.y + uy1 * size };
  const pB = { x: pA.x + ux2 * size, y: pA.y + uy2 * size };
  const pC = { x: vx.x + ux2 * size, y: vx.y + uy2 * size };
  svgEl('polyline', {
    points: `${pA.x},${pA.y} ${pB.x},${pB.y} ${pC.x},${pC.y}`,
    fill: 'none', stroke: color, 'stroke-width': 2, class: 'geo-line'
  });
}

function drawTick(p1, p2, size, color, cfg) {
  const pt1 = pt(p1, cfg), pt2 = pt(p2, cfg);
  const midX = (pt1.x + pt2.x) / 2, midY = (pt1.y + pt2.y) / 2;
  const angle = Math.atan2(pt2.y - pt1.y, pt2.x - pt1.x) + Math.PI / 2;
  svgEl('line', {
    x1: midX + size * Math.cos(angle), y1: midY + size * Math.sin(angle),
    x2: midX - size * Math.cos(angle), y2: midY - size * Math.sin(angle),
    stroke: color, 'stroke-width': 2, class: 'geo-line'
  });
}

function drawArc(v, p1, p2, radius, color, cfg) {
  const vertex = pt(v, cfg), pt1 = pt(p1, cfg), pt2 = pt(p2, cfg);
  let a1 = Math.atan2(pt1.y - vertex.y, pt1.x - vertex.x);
  let a2 = Math.atan2(pt2.y - vertex.y, pt2.x - vertex.x);
  let diff = a2 - a1;
  if (diff > Math.PI) a2 -= Math.PI * 2;
  if (diff < -Math.PI) a2 += Math.PI * 2;
  const rr = radius;
  const x1 = vertex.x + rr * Math.cos(a1), y1 = vertex.y + rr * Math.sin(a1);
  const x2 = vertex.x + rr * Math.cos(a2), y2 = vertex.y + rr * Math.sin(a2);
  svgEl('path', {
    d: `M ${x1} ${y1} A ${rr} ${rr} 0 0 ${a1 > a2 ? 0 : 1} ${x2} ${y2}`,
    fill: 'none', stroke: color, 'stroke-width': 3, class: 'geo-line soft-flash'
  });
  addGlow(vertex.x, vertex.y, color, 15);
}

function drawLineAnim(p1, p2, color, width, isDashed, cfg, callback) {
  const start = pt(p1, cfg), end = pt(p2, cfg);
  const el = svgEl('line', {
    x1: start.x, y1: start.y, x2: end.x, y2: end.y,
    stroke: color, 'stroke-width': width,
    class: 'geo-line draw-in', pathLength: 1
  });
  if (isDashed) el.setAttribute('stroke-dasharray', '7 6');
  setTimeout(() => {
    addGlow((start.x + end.x) / 2, (start.y + end.y) / 2, color, 8);
    if (callback) callback();
  }, 280);
}

function drawCircleAnim(center, radius, color, cfg, callback) {
  const c = pt(center, cfg);
  const r = radius * cfg.scale;
  svgEl('circle', {
    cx: c.x, cy: c.y, r,
    fill: 'none', stroke: color, 'stroke-width': 2.5,
    class: 'geo-line draw-in', pathLength: 1
  });
  setTimeout(() => {
    addGlow(c.x, c.y, color, r * 0.4);
    if (callback) callback();
  }, 700);
}

      animQueue.push({ type: 'text', text: '9√5', p: { x: 4.5, y: -3 }, ox: 8, oy: -10, color: '#2e7d32', size: 23, animate: true });
      animQueue.push({ type: 'flash', p: p.E, color: '#69c69a', r: 25 });
    }
  ]
];

/* ========== ОЧЕРЕДЬ И РЕНДЕР ========== */
function processQueue() {
  if (animQueue.length === 0) {
    isAnimating = false;
    prevBtn.disabled = currentStep === 0;
    nextBtn.disabled = currentStep === tasks[currentTask].texts.length - 1;
    const el = document.getElementById(`step-${currentTask}-${currentStep}`);
    if (el) typeText(el, tasks[currentTask].texts[currentStep]);
    updateDots();
    return;
  }
  const item = animQueue.shift();
  const cfg = tasks[currentTask].cfg;

  if (item.type === 'line') {
    drawLineAnim(item.p1, item.p2, item.color, item.w, item.dash, cfg, processQueue);
  } else if (item.type === 'multiLine') {
    Promise.all(item.lines.map(l => new Promise(res => {
      drawLineAnim(l.p1, l.p2, item.color, item.w, false, cfg, res);
    }))).then(processQueue);
  } else if (item.type === 'circle') {
    drawCircleAnim(item.center, item.radius, item.color, cfg, processQueue);
  } else if (item.type === 'text') {
    drawTextDirect(item.text, item.p, item.ox, item.oy, item.color, item.size || 26, cfg, item.italic, item.animate);
    processQueue();
  } else if (item.type === 'eraseText') {
    [...board.querySelectorAll('text')].filter(n => n.textContent === item.text).forEach(n => n.remove());
    processQueue();
  } else if (item.type === 'flash') {
    const p = pt(item.p, cfg);
    addGlow(p.x, p.y, item.color || '#ffb547', item.r || 18);
    processQueue();
  } else if (item.type === 'polygon') {
    const points = item.points.map(p => {
      const q = pt(p, cfg);
      return `${q.x},${q.y}`;
    }).join(' ');
    svgEl('polygon', {
      points, fill: item.fill || '#7c8ff522',
      stroke: item.color || '#7183a5', 'stroke-width': item.w || 2,
      class: 'soft-flash'
    });
    processQueue();
  } else if (item.type === 'func') {
    item.fn();
    processQueue();
  } else if (item.type === 'delay') {
    setTimeout(processQueue, item.ms);
  }
}

function redrawAll() {
  board.replaceChildren();
  animQueue = [];
  for (let s = 0; s <= currentStep; s++) {
    stepDrawers[currentTask][s](tasks[currentTask].cfg, tasks[currentTask].pts);
  }
  while (animQueue.length > 0) {
    const item = animQueue.shift();
    const cfg = tasks[currentTask].cfg;
    if (item.type === 'line') {
      const p1 = pt(item.p1, cfg), p2 = pt(item.p2, cfg);
      svgEl('line', {
        x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y,
        stroke: item.color, 'stroke-width': item.w, class: 'geo-line',
        ...(item.dash ? { 'stroke-dasharray': '7 6' } : {})
      });
    } else if (item.type === 'multiLine') {
      item.lines.forEach(l => {
        const p1 = pt(l.p1, cfg), p2 = pt(l.p2, cfg);
        svgEl('line', { x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, stroke: item.color, 'stroke-width': item.w, class: 'geo-line' });
      });
    } else if (item.type === 'circle') {
      const c = pt(item.center, cfg);
      svgEl('circle', { cx: c.x, cy: c.y, r: item.radius * cfg.scale, fill: 'none', stroke: item.color, 'stroke-width': 2.5 });
    } else if (item.type === 'text') {
      drawTextDirect(item.text, item.p, item.ox, item.oy, item.color, item.size || 26, cfg, item.italic, false);
    } else if (item.type === 'eraseText') {
      [...board.querySelectorAll('text')].filter(n => n.textContent === item.text).forEach(n => n.remove());
    } else if (item.type === 'polygon') {
      const points = item.points.map(p => { const q = pt(p, cfg); return `${q.x},${q.y}`; }).join(' ');
      svgEl('polygon', { points, fill: item.fill || '#7c8ff522', stroke: item.color || '#7183a5', 'stroke-width': item.w || 2 });
    } else if (item.type === 'func') {
      item.fn();
    }
  }
}

function typeText(element, text, speed = 8) {
  clearInterval(typingTimeout);
  element.innerHTML = '';
  element.classList.add('visible');
  let i = 0;
  let chars = [];
  let isTag = false, tagBuf = '';
  for (let c of text) {
    if (c === '<') isTag = true;
    if (isTag) tagBuf += c;
    if (c === '>') { isTag = false; chars.push(tagBuf); tagBuf = ''; }
    else if (!isTag) chars.push(c);
  }
  let displayHtml = '';
  typingTimeout = setInterval(() => {
    if (i < chars.length) {
      displayHtml += chars[i];
      element.innerHTML = displayHtml;
      i++;
    } else clearInterval(typingTimeout);
  }, speed);
}

function setupTexts() {
  textContainer.innerHTML = '';
  tasks[currentTask].texts.forEach((_, sIdx) => {
    const div = document.createElement('div');
    div.className = 'step-card';
    div.id = `step-${currentTask}-${sIdx}`;
    textContainer.appendChild(div);
  });
}

function updateDots() {
  const n = tasks[currentTask].texts.length;
  dotsEl.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i < currentStep ? ' done' : i === currentStep ? ' cur' : '');
    d.textContent = i + 1;
    dotsEl.appendChild(d);
  }
}

function updateUI() {
  document.querySelectorAll('.step-card').forEach(el => el.classList.remove('visible'));
  const el = document.getElementById(`step-${currentTask}-${currentStep}`);
  if (el) el.classList.add('visible');
  prevBtn.disabled = currentStep === 0;
  nextBtn.disabled = true;
  finalGrade.classList.remove('show');
  updateDots();
}

function switchTask(index) {
  if (isAnimating) return;
  clearInterval(typingTimeout);
  board.replaceChildren();
  document.querySelectorAll('.task-btn').forEach(btn => {
    btn.classList.toggle('active', Number(btn.dataset.task) === index);
  });
  currentTask = index;
  currentStep = 0;
  panX = 0; panY = 0;
  setupTexts();
  updateUI();
  animQueue = [];
  stepDrawers[currentTask][0](tasks[currentTask].cfg, tasks[currentTask].pts);
  isAnimating = true;
  processQueue();
}

/* ========== УПРАВЛЕНИЕ ========== */
nextBtn.addEventListener('click', () => {
  if (isAnimating) return;
  if (currentStep < tasks[currentTask].texts.length - 1) {
    currentStep++;
    updateUI();
    animQueue = [];
    stepDrawers[currentTask][currentStep](tasks[currentTask].cfg, tasks[currentTask].pts);
    isAnimating = true;
    processQueue();
  } else {
    finalGrade.classList.add('show');
    nextBtn.disabled = true;
  }
});

prevBtn.addEventListener('click', () => {
  if (isAnimating) return;
  if (currentStep > 0) {
    clearInterval(typingTimeout);
    currentStep--;
    redrawAll();
    const el = document.getElementById(`step-${currentTask}-${currentStep}`);
    if (el) {
      el.classList.add('visible');
      el.innerHTML = tasks[currentTask].texts[currentStep];
    }
    prevBtn.disabled = currentStep === 0;
    nextBtn.disabled = currentStep === tasks[currentTask].texts.length - 1;
    finalGrade.classList.remove('show');
    updateDots();
  }
});

showAllBtn.addEventListener('click', () => {
  if (document.body.classList.contains('fullscreen')) {
    document.body.classList.remove('fullscreen');
    showAllBtn.textContent = '📄 Решение целиком';
    setupTexts();
    updateUI();
    redrawAll();
    const e = document.getElementById(`step-${currentTask}-${currentStep}`);
    if (e) {
      e.innerHTML = tasks[currentTask].texts[currentStep];
      e.classList.add('visible');
    }
    nextBtn.disabled = currentStep === tasks[currentTask].texts.length - 1;
    return;
  }
  if (isAnimating) return;
  clearInterval(typingTimeout);
  currentStep = tasks[currentTask].texts.length - 1;
  redrawAll();
  tasks[currentTask].texts.forEach((txt, i) => {
    const el = document.getElementById(`step-${currentTask}-${i}`);
    if (el) { el.innerHTML = txt; el.classList.add('visible'); }
  });
  document.body.classList.add('fullscreen');
  showAllBtn.textContent = '✕ Закрыть';
  nextBtn.disabled = true;
  prevBtn.disabled = false;
  finalGrade.classList.remove('show');
  updateDots();
});

/* Pan */
board.addEventListener('mousedown', e => {
  if (isDrawMode) return;
  isPanning = true;
  panStartX = e.clientX - panX;
  panStartY = e.clientY - panY;
  board.style.cursor = 'grabbing';
  if (isAnimating) {
    animQueue = [];
    isAnimating = false;
    redrawAll();
    const el = document.getElementById(`step-${currentTask}-${currentStep}`);
    if (el) el.innerHTML = tasks[currentTask].texts[currentStep];
    prevBtn.disabled = currentStep === 0;
    nextBtn.disabled = currentStep === tasks[currentTask].texts.length - 1;
  }
});
window.addEventListener('mousemove', e => {
  if (!isPanning) return;
  panX = e.clientX - panStartX;
  panY = e.clientY - panStartY;
  redrawAll();
});
window.addEventListener('mouseup', () => {
  if (isPanning) {
    isPanning = false;
    board.style.cursor = 'grab';
  }
});

/* Draw mode */
drawBtn.addEventListener('click', () => {
  isDrawMode = !isDrawMode;
  drawCanvas.classList.toggle('active', isDrawMode);
  drawBtn.classList.toggle('active', isDrawMode);
});
eraseBtn.addEventListener('click', () => {
  dctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
});
drawCanvas.addEventListener('mousedown', e => {
  if (!isDrawMode) return;
  drawing = true;
  const rect = drawCanvas.getBoundingClientRect();
  const scaleX = drawCanvas.width / rect.width;
  const scaleY = drawCanvas.height / rect.height;
  dctx.beginPath();
  dctx.moveTo((e.clientX - rect.left) * scaleX, (e.clientY - rect.top) * scaleY);
});
drawCanvas.addEventListener('mousemove', e => {
  if (!drawing) return;
  const rect = drawCanvas.getBoundingClientRect();
  const scaleX = drawCanvas.width / rect.width;
  const scaleY = drawCanvas.height / rect.height;
  dctx.lineTo((e.clientX - rect.left) * scaleX, (e.clientY - rect.top) * scaleY);
  dctx.strokeStyle = '#d32f2f';
  dctx.lineWidth = 3;
  dctx.lineCap = 'round';
  dctx.stroke();
});
window.addEventListener('mouseup', () => { drawing = false; });

window.addEventListener('keydown', e => {
  if (e.code === 'Space' && !isDrawMode) {
    e.preventDefault();
    nextBtn.click();
  }
  if (e.code === 'Escape' && isDrawMode) {
    isDrawMode = false;
    drawCanvas.classList.remove('active');
    drawBtn.classList.remove('active');
  }
  if (e.ctrlKey && e.key === 'z') {
    dctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  }
});

/* Outline */
const outline = document.getElementById('outline');
tasks.forEach((t, i) => {
  const btn = document.createElement('button');
  btn.className = 'task-btn' + (i === 0 ? ' active' : '');
  btn.dataset.task = i;
  btn.innerHTML = `<b>${i + 1}. ${t.title}</b><br><span style="font-size:12px;opacity:.75">${t.short}</span>`;
  btn.addEventListener('click', () => switchTask(i));
  outline.appendChild(btn);
});

/* Init */
switchTask(0);
</script>
