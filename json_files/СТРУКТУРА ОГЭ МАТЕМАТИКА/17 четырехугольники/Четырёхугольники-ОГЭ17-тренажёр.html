<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Четырёхугольники · ОГЭ №17 — тренажёр</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>:root{--bg:#f4f6fb;--card:#fff;--ink:#1d2640;--mut:#6b7491;--line:#e3e7f1;--pri:#4f6bff;--pri2:#7b5cff;--ok:#16a36a;--okl:#dff6ea;--warn:#f0a400;--warnl:#fff2cc;--bad:#e5484d;--badl:#ffe3e3;--sol:#f07a2a;--soll:#ffe8d6;--sh:0 6px 24px rgba(30,40,80,.08);--r:16px}
[data-theme=dark]{--bg:#12151f;--card:#1b2030;--ink:#e8ecf7;--mut:#9aa3bd;--line:#2b3247;--okl:#173a2b;--warnl:#3d3214;--badl:#43191c;--soll:#45281a;--sh:0 6px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito','Segoe UI',Roboto,Arial,sans-serif;font-size:16px}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
.sq{white-space:nowrap}.sq .rd{font-size:1.05em}.sq .ov{border-top:1.5px solid currentColor;padding:0 1px;margin-left:1px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;line-height:1.15;font-size:.92em}
.fr .nu{border-bottom:1.5px solid currentColor;padding:0 3px}.fr .de{padding:0 3px}
sup,sub{font-size:.7em}
.btn{border:0;border-radius:12px;padding:10px 16px;background:var(--line);color:var(--ink);font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap}
.btn:hover{filter:brightness(.96);transform:translateY(-1px)}
.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 4px 14px rgba(79,107,255,.35)}
.btn.ok{background:var(--ok);color:#fff}.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.sm{padding:7px 11px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;pointer-events:none}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 20%,#dfe6ff 0,transparent 40%),radial-gradient(circle at 85% 80%,#ffe1ec 0,transparent 40%),var(--bg)}
[data-theme=dark] .login{background:var(--bg)}
.lcard{background:var(--card);border-radius:24px;box-shadow:var(--sh);padding:32px;max-width:460px;width:100%;text-align:center}
.lcard h1{margin:6px 0 2px;font-size:26px}.lcard .sub{color:var(--mut);margin-bottom:22px}
.logo{font-size:44px;line-height:1}
.lcard input{width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px;text-align:center;margin-bottom:12px}
.lcard input:focus{outline:none;border-color:var(--pri)}
.prof{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.prof button{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:700}
.prof button small{color:var(--mut);font-weight:600}
.lfoot{margin-top:18px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
/* layout */
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.top .ttl{font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px}
.top .who{background:var(--bg);border-radius:999px;padding:6px 12px;font-weight:700}
.pbar{flex:1;min-width:120px;height:10px;background:var(--line);border-radius:99px;overflow:hidden;position:relative}
.pbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--ok),#5ad19b);border-radius:99px}
.ptxt{font-weight:800;font-size:14px;color:var(--mut)}
.tbtns{display:flex;gap:6px;flex-wrap:wrap}
.wrap{display:grid;grid-template-columns:290px 1fr;gap:18px;padding:18px;max-width:1300px;margin:0 auto}
.side{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:12px;align-self:start;position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}
.tp{border-radius:12px;padding:8px 8px 10px;margin-bottom:6px}
.tp.cur{background:var(--bg)}
.tph{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;cursor:pointer}
.tph .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-size:12px;flex:none}
.tph .done{margin-left:auto;font-size:12px;color:var(--mut)}
.tp.fin .tph .ic{background:var(--ok)}
.mini{height:5px;background:var(--line);border-radius:9px;margin:7px 0 7px 38px;overflow:hidden}.mini i{display:block;height:100%;background:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-left:38px}
.chip{width:34px;height:30px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:13px;font-weight:800;display:grid;place-items:center;position:relative}
.chip.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.err{background:#7bd3a7;border-color:#7bd3a7;color:#08321f}
.chip.hint{background:#ffd666;border-color:#ffd666;color:#4a3500}
.chip.sol{background:#ffb27a;border-color:#ffb27a;color:#4a2000}
.chip.skip{border-style:dashed;border-color:var(--mut)}
.chip.cur{outline:3px solid var(--pri);outline-offset:1px}
.chip.an::after{content:'';position:absolute;top:2px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--pri2)}
.legend{font-size:12px;color:var(--mut);display:flex;flex-wrap:wrap;gap:8px;margin:8px 4px 2px}
.legend span{display:inline-flex;align-items:center;gap:4px}.legend b{width:12px;height:12px;border-radius:4px;display:inline-block}
.main{min-width:0}
.card{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:22px 24px;position:relative;overflow:hidden}
.card.pop{animation:pop .35s ease}
@keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.chead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.num{font-size:15px;font-weight:800;color:var(--mut)}
.badge{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:#e8ecff;color:#3b4fd8;letter-spacing:.3px}
.badge.an{background:#f1e8ff;color:#7343d6}.badge.nf{background:#fff0e0;color:#b25e00}
.badge.tpc{background:var(--bg);color:var(--mut)}
.qtext{font-size:20px;line-height:1.55;font-weight:600;margin:4px 0 12px}
.figbox{background:#fff;border-radius:16px;border:1px solid #edf0f7;display:flex;justify-content:center;padding:6px;margin-bottom:16px}
.figbox svg{width:100%;max-width:520px;max-height:330px;height:auto}
.ans{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ans label{font-weight:800}
.ans input{width:180px;padding:12px 14px;border-radius:14px;border:2.5px solid var(--line);font-size:22px;font-weight:800;text-align:center;background:var(--bg);color:var(--ink)}
.ans input:focus{outline:none;border-color:var(--pri)}
.ans input.bad{border-color:var(--bad);animation:shake .4s}
.ans input.good{border-color:var(--ok);background:var(--okl)}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.fb{margin-top:12px;padding:12px 14px;border-radius:14px;font-weight:700;display:none}
.fb.show{display:block}.fb.bad{background:var(--badl);color:var(--bad)}.fb.good{background:var(--okl);color:var(--ok)}
.fb .nx{height:5px;background:rgba(22,163,106,.25);border-radius:9px;margin-top:8px;overflow:hidden}.fb .nx i{display:block;height:100%;background:var(--ok);width:0;transition:width .9s linear}
.help{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);align-items:center}
.help .note{font-size:12.5px;color:var(--mut);margin-left:auto}
.hintzone{margin-top:14px}
.hz-t{font-weight:800;margin:10px 0 8px;display:flex;align-items:center;gap:8px}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:8px}
.step{background:var(--bg);border-left:4px solid var(--pri);border-radius:10px;padding:10px 12px;line-height:1.6;animation:pop .3s}
.step b.k{color:var(--pri);margin-right:6px}
.tnote{font-size:13px;color:var(--mut);background:var(--warnl);border-radius:10px;padding:8px 10px;margin-top:10px}
/* stickers */
.stks{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;padding:6px 2px 4px}
.stk{background:var(--sc);border-radius:6px 6px 18px 6px;padding:14px 14px 12px;color:#1d2640;box-shadow:0 8px 18px rgba(40,40,80,.13),inset 0 -3px 0 rgba(0,0,0,.04);transform:rotate(var(--rot));position:relative;border-top:6px solid var(--se);transition:.2s}
.stk:hover{transform:rotate(0) scale(1.02)}
.stk-pin{position:absolute;top:-11px;left:50%;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff 0,var(--se) 45%,#0003 100%);transform:translateX(-50%)}
.stk-t{font-weight:900;font-size:15px;margin-bottom:6px}
.stk-b{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.stk-x{flex:1;font-size:14px;line-height:1.55}
.stk-f{display:flex;justify-content:center;background:#ffffff8c;border-radius:10px;padding:4px}.stk-f svg{width:200px;max-height:150px;height:auto;display:block}
.tt{border-collapse:collapse;margin-top:6px;font-size:13px}.tt td,.tt th{border:1px solid #0002;padding:3px 6px;text-align:center}.tt th{background:#fff8}
.memo h2{margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.memo h2 i{width:18px;height:18px;border-radius:5px;display:inline-block}
/* modal */
.mbg{position:fixed;inset:0;background:rgba(15,20,40,.45);z-index:50;display:grid;place-items:center;padding:16px}
.mdl{background:var(--card);border-radius:20px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mdl.wide{max-width:1150px}
.mdl h2{margin-top:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--bg);border-radius:14px;padding:12px}.stat b{font-size:26px;display:block}.stat span{font-size:13px;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2640;color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:60;box-shadow:var(--sh);animation:pop .3s}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.fld span{font-size:13px;color:var(--mut);font-weight:700}
.fld input,.fld select{padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs button{border:0;padding:9px 14px;border-radius:10px;background:var(--bg);color:var(--ink);font-weight:800}.tabs button.on{background:var(--pri);color:#fff}
.pgrid{display:grid;grid-template-columns:1fr 300px;gap:16px}
.plist{max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px}
.plist .pt{font-weight:800;margin:8px 0 4px;display:flex;align-items:center;gap:6px}
.plist label{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;margin:3px 8px 3px 0;padding:3px 7px;border-radius:8px;background:var(--bg)}
.opts label{display:flex;gap:8px;align-items:center;padding:5px 0;font-weight:600}
table.st{width:100%;border-collapse:collapse;font-size:14px}table.st td,table.st th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.done-card{text-align:center;padding:40px 24px}.done-card .big{font-size:64px}
.conf{position:absolute;pointer-events:none;font-size:22px;animation:fly 1.2s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
#printArea{display:none}
@media (max-width:860px){
  .wrap{grid-template-columns:1fr;padding:10px}
  .side{position:static;max-height:none}
  .qtext{font-size:18px}.card{padding:16px}
  .pgrid{grid-template-columns:1fr}
  .top .ttl span{display:none}
  .help .note{margin-left:0}
}
/* печать */
@media print{
  body.printing>*:not(#printArea){display:none!important}
  body.printing #printArea{display:block!important}
  body{background:#fff!important;color:#000}
  @page{size:A4;margin:12mm}
}
#printArea{font-family:'Segoe UI',Arial,sans-serif;color:#111;background:#fff}
.pr-head{display:flex;justify-content:space-between;border-bottom:2px solid #333;padding-bottom:6px;margin-bottom:10px;font-size:13px}
.pr-title{font-size:18px;font-weight:800;margin:0 0 6px}
.pr-grid{columns:var(--cols,1);column-gap:10mm}
.pr-task{break-inside:avoid;border-bottom:1px dashed #bbb;padding:8px 0 10px;font-size:13.5px;line-height:1.45}
.pr-n{font-weight:800}.pr-k{font-size:11px;color:#555;border:1px solid #999;border-radius:6px;padding:0 5px;margin-left:6px}
.pr-fig{text-align:center;margin:4px 0}.pr-fig svg{width:auto;max-width:62%;max-height:150px}
.pr-cols2 .pr-fig svg{max-width:95%;max-height:140px}
.pr-line{margin-top:6px}
.pr-ans{margin-top:4px;font-weight:700;color:#0a6b3d}
.pr-sol{margin-top:4px;font-size:12.5px;color:#222}.pr-sol ol{margin:2px 0;padding-left:18px}
.pr-key{break-before:page}.pr-key table{border-collapse:collapse;width:100%}.pr-key td{border:1px solid #888;padding:4px;text-align:center;font-size:12.5px}.pr-key td b{display:block;font-size:11px;color:#555}
.pr-memo{break-before:page}.pr-memo .stks{grid-template-columns:repeat(3,1fr);gap:8px}.pr-memo .stk{transform:none;box-shadow:none;border:1px solid #0002;border-top:5px solid var(--se);-webkit-print-color-adjust:exact;print-color-adjust:exact;break-inside:avoid;padding:8px}
.pr-memo .stk-x{font-size:11.5px}.pr-memo .stk-f svg{width:150px;max-height:110px}.pr-memo .stk-pin{display:none}
.prev{background:#fff;color:#111;padding:14px;border-radius:12px;border:1px solid var(--line);max-height:65vh;overflow:auto}
@media (max-width:860px){.main{order:-1}}

.lvl{color:#f0a400;font-size:15px;letter-spacing:1px}
.calcout{font-size:22px;font-weight:800;color:var(--pri);min-width:90px}.calcout.bad{color:var(--mut)}
.ans input.calcin{width:260px;text-align:left}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}.key{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;min-width:42px;padding:7px 10px;font-weight:800;font-size:16px}
.khint{font-size:12.5px;color:var(--mut);margin-left:4px}
.redo{background:var(--warnl);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.flagg .pt{font-weight:800;margin:10px 0 4px;display:flex;align-items:center;gap:8px}
.flag{display:inline-flex;align-items:center;gap:4px;margin:3px 6px 3px 0;padding:5px 9px;border-radius:9px;background:var(--bg);font-size:14px;cursor:pointer;border:1.5px solid transparent;user-select:none}
.flag.on{border-color:#e5484d;background:#ffe9e9;color:#1d2640}.flag .fl{opacity:.25}.flag.on .fl{opacity:1}
.switch{display:flex;align-items:center;gap:10px;font-weight:700;padding:12px;border-radius:12px;background:var(--bg);margin:10px 0;cursor:pointer}
.switch input{width:22px;height:22px}

.modeb{font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;background:#e3f6ec;color:#0f7a4d;white-space:nowrap}
.modeb.home{background:#fff0e0;color:#b25e00}
.mdl.full{max-width:min(1320px,97vw);width:97vw;max-height:96vh;padding:16px}
.modesel{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.modesel button{flex:1;min-width:200px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:3px}
.modesel button small{color:var(--mut);font-weight:600}
.modesel button.on{border-color:var(--pri);background:#eef1ff}
[data-theme=dark] .modesel button.on{background:#232a45}
/* сцены */
.scwrap{display:grid;grid-template-columns:230px 1fr;gap:14px}
.sclist{display:flex;flex-direction:column;gap:6px;max-height:88vh;overflow:auto}
.sclist button{border:0;text-align:left;padding:9px 10px;border-radius:10px;background:var(--bg);color:var(--ink);font-weight:700;font-size:14px}
.sclist button.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.schint{color:var(--mut);font-size:14.5px;max-width:760px}
.scgrid{display:grid;grid-template-columns:1fr 310px;gap:14px;margin-top:10px}
.scstage{background:#fff;border:1px solid #edf0f7;border-radius:16px;touch-action:none;user-select:none}
.scstage svg{width:100%;height:auto;display:block;max-height:74vh}
.hd{cursor:grab}.hd:hover{fill-opacity:.6}
.scinfo{display:flex;flex-direction:column;gap:6px}
.srow{display:flex;justify-content:space-between;gap:8px;background:var(--bg);border-radius:10px;padding:8px 10px;font-size:14px;border-left:5px solid var(--line);align-items:center}
.srow b{white-space:nowrap;text-align:right}
.srow.val{border-color:#e5484d}.srow.aux{border-color:#7b5cff}.srow.aux2{border-color:#13a37a}.srow.arc{border-color:#f08c00}
.snote{font-size:13px;color:var(--mut);padding:4px 2px;line-height:1.45}
.scst{display:flex;flex-direction:column;gap:6px;margin-top:10px;align-items:flex-start}.scst .btn{white-space:normal;text-align:left}
.scgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.scard{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px}
.scard span{font-size:13.5px;color:var(--mut)}.scard small{font-size:12px;color:var(--pri);font-weight:700}
.scard:hover{border-color:var(--pri)}
.stkpop{position:fixed;right:20px;bottom:20px;z-index:70;width:330px;background:var(--card);padding:14px;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
/* памятка */
.stk-no{display:inline-block;background:#ffffffb0;border-radius:6px;padding:0 6px;margin-right:6px;font-size:12.5px;border:1px solid #0002}
.stk-l{margin-top:8px;font-size:12px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;color:#4a5170}
.stk-l .tl{border:0;background:#fff;border-radius:6px;padding:2px 6px;font-weight:800;font-size:12px;cursor:pointer;color:#1d2640}
.stk-l .tl.off{opacity:.45}
.stk.flash{animation:flash 1.3s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 6px var(--pri)}100%{box-shadow:0 8px 18px rgba(40,40,80,.13)}}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.toc button{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 10px;font-weight:700;font-size:13px}
.toc button:hover{border-color:var(--pri)}
/* доска */
.bwrap{display:flex;flex-direction:column;gap:10px;height:90vh}
.btool{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bq{font-size:20px;font-weight:600;line-height:1.5;background:var(--bg);border-radius:12px;padding:8px 12px}
.bstage{position:relative;flex:1;background:#fff;border-radius:16px;border:1px solid #edf0f7;overflow:hidden;min-height:300px}
.bstage .bfig{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px}
.bstage .bfig svg{width:100%;height:100%}
.bstage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.pcol{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer}.pcol.on{box-shadow:0 0 0 3px var(--pri)}
.store{background:var(--bg);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}

  const match=(i)=>{let d=0;for(let j=i;j<s.length;j++){if(s[j]==='{')d++;else if(s[j]==='}'){d--;if(d===0)return j;}}return s.length-1;};

    if(ch==='^'&&s[i+1]==='{'){flush();const e=match(i+1);out.push({k:'sup',s:s.slice(i+2,e)});i=e;continue;}

    if(fill!=='none')g+=`<polygon points="${p.split('').map(k=>S[k].map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="${fill}" stroke="none"/>`;
  });
  // окружности
  (sp.circ||[]).forEach(c=>{const cs=pt(cpt(c.c||'O'));g+=`<circle cx="${cs[0].toFixed(1)}" cy="${cs[1].toFixed(1)}" r="${(c.r*s).toFixed(1)}" fill="${c.fill||'none'}" stroke="${ccol(c.col||'circ')}" stroke-width="${lw}"${c.dash?' stroke-dasharray="6 5"':''}/>`;});
  // выделенные дуги

    g+=`<path d="${A.d}" fill="none" stroke="${col}" stroke-width="${(q.w||5)*sc}" stroke-linecap="round" opacity=".85"/>`;
    if(q.t){const lr=A.rr+(q.lr||20)*sc;top+=stext(q.t,A.cs[0]+Math.cos(A.mid)*lr+(q.dx||0)*sc,A.cs[1]-Math.sin(A.mid)*lr+(q.dy||0)*sc,(q.sz||15)*sc,q.tc?ccol(q.tc):col,'middle',q.t==='?'?800:700);}});
  // продолжения

    g+=`<line x1="${b[0].toFixed(1)}" y1="${b[1].toFixed(1)}" x2="${(b[0]+d[0]*L).toFixed(1)}" y2="${(b[1]+d[1]*L).toFixed(1)}" stroke="${COL.line}" stroke-width="${lw}" stroke-linecap="round"${e[3]?' stroke-dasharray="6 5"':''}/>`;});
  // контуры
  (sp.poly||[]).forEach(pp=>{const p=typeof pp==='string'?pp:pp.p;if(pp.noline)return;
    g+=`<polygon points="${p.split('').map(k=>S[k].map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${COL.line}" stroke-width="${lw}" stroke-linejoin="round"/>`;});
  // отрезки
  (sp.seg||[]).forEach(sg=>{
    const name=typeof sg==='string'?sg:sg[0],st=typeof sg==='string'?'':sg[1];
    const a=S[name[0]],b=S[name[1]];
    const col=st==='aux'?COL.aux:st==='aux2'?COL.aux2:st==='val'?COL.val:COL.line;
    const dash=st==='dash'||sg[2]==='dash'?' stroke-dasharray="6 5"':'';
    g+=`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="${col}" stroke-width="${st&&st!=='dash'?lw*0.95:lw}" stroke-linecap="round"${dash}/>`;
  });
  // прямые углы
  (sp.right||[]).forEach(r=>{const v=S[r[0]],a=u(v,S[r[1]]),b=u(v,S[r[2]]),k=11*sc;
    g+=`<polyline points="${v[0]+a[0]*k},${v[1]+a[1]*k} ${v[0]+a[0]*k+b[0]*k},${v[1]+a[1]*k+b[1]*k} ${v[0]+b[0]*k},${v[1]+b[1]*k}" fill="none" stroke="${COL.line}" stroke-width="${1.5*sc}"/>`;});
  // засечки

    let a1=Math.atan2(a[1],a[0]),a2=Math.atan2(b[1],b[0]);let d=a2-a1;while(d<=-Math.PI)d+=2*Math.PI;while(d>Math.PI)d-=2*Math.PI;

    for(let i=0;i<n;i++){const rr=r+i*4*sc;

    if(A.t){const lr=r+(A.lr||16)*sc;const sz=(A.sz||15)*sc;

  (sp.side||[]).forEach(L=>{const a=S[L.s[0]],b=S[L.s[1]],m=lerp(a,b,L.at||0.5),d=u(a,b);let n=[-d[1],d[0]];
    const tc=[cen[0]-m[0],cen[1]-m[1]];if(n[0]*tc[0]+n[1]*tc[1]>0)n=[-n[0],-n[1]];if(L.in)n=[-n[0],-n[1]];
    const sz=(L.sz||16)*sc;const w=mw(L.t,sz);

  (sp.dots||'').split('').forEach(k=>{if(S[k])g+=`<circle cx="${S[k][0].toFixed(1)}" cy="${S[k][1].toFixed(1)}" r="${2.8*sc}" fill="${COL.line}"/>`;});

    let x,y;if(off){x=p[0]+off[0]*sc;y=p[1]+off[1]*sc;}else{
      let from=cen;if(cc0&&Math.abs(dist(P[k],cc0)-C0.r)<C0.r*0.04)from=pt(cc0);

  return `<svg class="fig" viewBox="0 0 ${vw.toFixed(0)} ${vh.toFixed(0)}" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',Roboto,Arial,sans-serif">${g}${top}</svg>`;

const gr=n=>{const t=String(n).replace('.',',');if(/,/.test(t))return t+' градуса';n=Math.abs(+n);const k=n%100,l=n%10;return t+(k>=11&&k<=14?' градусов':l===1?' градус':l>=2&&l<=4?' градуса':' градусов');};
const fx=v=>String(+(+v).toFixed(6)).replace('.',',');
const dg=v=>fx(v)+'°';
function PG(al,a,b){const r=rad(al);const B=[b*Math.cos(r),b*Math.sin(r)];return {A:[0,0],B,C:[B[0]+a,B[1]],D:[a,0]};}
function TR(bot,top,h,sh){if(sh==null)sh=(bot-top)/2;return {A:[0,0],B:[sh,h],C:[sh+top,h],D:[bot,0]};}
function RC(w,h){return {A:[0,0],B:[0,h],C:[w,h],D:[w,0]};}
const TH=a=>Math.max(1.7,Math.min(3.6,2*Math.tan(rad(a))));
const XO=P=>inter(P.A,P.C,P.B,P.D);
function bisd(V,A,B){const u=p=>{const dx=p[0]-V[0],dy=p[1]-V[1],l=Math.hypot(dx,dy);return [dx/l,dy/l];};const a=u(A),b=u(B);return [a[0]+b[0],a[1]+b[1]];}
function FS(P,x){return Object.assign({P,poly:['ABCD'],N:'ABCD',dots:'',padX:16},x||{});}

 {id:'rhomb',title:'Ромб: диагонали и углы',st:['rh_diag','rh_area','par_adj'],

 {id:'trap',title:'Трапеция: углы',st:['tr_ang','tr_iso','tr_proj'],

  init:p=>{const a=p&&p.a||65;const h=170;const S={bot:400,top:170,h};if(p&&p.rect){S.sh=0;S.top=400-h/Math.tan(rad(a));}else{S.sh=h/Math.tan(rad(a));S.top=cl(400-2*S.sh,60,330);}S.iso=!(p&&p.rect);return S;},

  draw:S=>{const {A,B,C,D}=trPts(S),c=cenOf([A,B,C,D]);const aA=angV(A,D,B),aB=angV(B,A,C),aC=angV(C,B,D),aD=angV(D,C,A);

    g+=nm(A,'A',c)+nm(B,'B',c)+nm(C,'C',c)+nm(D,'D',c)+sv.hd('B',B)+sv.hd('C',C);

 {id:'parmid',title:'Части параллелограмма',st:['par_mid','median','tri_area'],

function parseAns(v){
  v=String(v).trim().replace(/\s+/g,'').replace(/,/g,'.').replace(/[−–—]/g,'-');
  if(!v)return NaN;
  const m=v.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);if(m)return +m[1]/+m[2];
  if(!/^-?(\d+\.?\d*|\.\d+)$/.test(v))return NaN;
  return +v;
}
/* ===== Калькулятор выражений (без eval) ===== */
function calcEval(src){
  let str=String(src).toLowerCase().replace(/\s+/g,'').replace(/,/g,'.').replace(/[−–—]/g,'-').replace(/[·×*]/g,'*').replace(/[:÷]/g,'/').replace(/sqrt/g,'√').replace(/корень/g,'√').replace(/pi|пи/g,'π');
  if(!str)return NaN;let i=0;
  const peek=()=>str[i];
  const num=()=>{const m=str.slice(i).match(/^(\d+\.?\d*|\.\d+)/);if(!m)return null;i+=m[0].length;return +m[0];};
  function expr(){let v=term();while(peek()==='+'||peek()==='-'){const o=str[i++];const w=term();v=o==='+'?v+w:v-w;}return v;}
  function term(){let v=power();for(;;){const c=peek();if(c==='*'||c==='/'){i++;const w=power();v=c==='*'?v*w:v/w;}else if(c==='('||c==='√'||c==='π'||(c&&/[\d.]/.test(c))){v*=power();}else break;}return v;}
  function power(){let v=unary();for(;;){if(peek()==='²'){i++;v=v*v;}else if(peek()==='³'){i++;v=v*v*v;}else if(peek()==='^'){i++;const w=unary();v=Math.pow(v,w);}else break;}return v;}
  function unary(){if(peek()==='-'){i++;return -power();}if(peek()==='+'){i++;return power();}return prim();}
  function prim(){const c=peek();
    if(c==='('){i++;const v=expr();if(peek()!==')')throw 0;i++;return v;}
    if(c==='√'){i++;let v;if(peek()==='('){i++;v=expr();if(peek()!==')')throw 0;i++;}else{v=prim();while(peek()==='²'||peek()==='^'){if(peek()==='²'){i++;v=v*v;}else{i++;v=Math.pow(v,unary());}}}return Math.sqrt(v);}
    if(c==='π'){i++;return Math.PI;}
    const n=num();if(n===null)throw 0;return n;}
  try{const v=expr();if(i!==str.length)return NaN;return isFinite(v)?v:NaN;}catch(e){return NaN;}
}

  const cv=$('#bcv'),st=$('#bst');const dpr=window.devicePixelRatio||1;

  const ctx=cv.getContext('2d');let col='#e5484d',w=3,er=false,drawing=false,last=null;

  cv.addEventListener('pointerdown',e=>{drawing=true;last=pos(e);cv.setPointerCapture(e.pointerId);});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);ctx.globalCompositeOperation=er?'destination-out':'source-over';ctx.strokeStyle=col;ctx.lineWidth=(er?w*6:w)*dpr;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p;});

  }
  if(o.key&&list.length){
    const per=8;let rows='';
    for(let i=0;i<list.length;i+=per){rows+='<tr>'+list.slice(i,i+per).map((n,j)=>`<td><b>${PR.numMode==='seq'?i+j+1:n}</b>${TASK[n].ansT}</td>`).join('')+'</tr>';}

function calcReport(name){
  const s=DB.students[name];const c={ok:0,err:0,hint:0,sol:0,new:0};let wrongTotal=0,stick=0,steps=0,skips=0;
  const L=vis(s);
  const rows=L.map(n=>{const x=s.tasks[n]||{st:'new',wrong:[],stick:0,steps:0,t:0};const st=x.st||'new';c[st]++;wrongTotal+=x.wrong.length;if(x.stick)stick++;steps+=x.steps||0;if(x.skip&&st==='new')skips++;return {n,t:TASK[n],x,st};});
  c.done=L.length-c.new;c.total=L.length;
  const byTopic=TOPICS.filter(tp=>rows.some(r=>r.t.topic===tp.id)).map(tp=>{const rs=rows.filter(r=>r.t.topic===tp.id);return {tp,total:rs.length,done:rs.filter(r=>r.st!=='new').length,self:rs.filter(r=>r.st==='ok'||r.st==='err').length,help:rs.filter(r=>r.st==='hint'||r.st==='sol').length,wrong:rs.reduce((a,r)=>a+r.x.wrong.length,0)};});
  const mc=rows.filter(r=>r.st!=='new'&&r.x.md==='class').length,mh=rows.filter(r=>r.st!=='new'&&r.x.md==='home').length;
  const byMode=(mc||mh)?`· решено в классе: ${mc}, дома: ${mh}`:'';
  return {s,c,rows,byTopic,wrongTotal,stick,steps,skips,mc,mh,byMode};
}

function taskCardSVG(w,W,showAns){

  const stc={ok:['#dff6ea','#0f7a4d'],err:['#e6f7ef','#2e8a5f'],hint:['#fff2cc','#8a6400'],sol:['#ffe8d6','#b04e10'],new:['#f1f3fa','#777']}[w.st];
  const ql=wrapM(t.q,W-2*P-40,SZ);
  let o='',y=P+16;
  o+=`<text x="${P}" y="${y+8}" font-size="24" font-weight="800" fill="#1d2640">№${dispN(t.n)}</text><text x="${P+70}" y="${y+8}" font-size="17" fill="#666">${esc(t.label.toLowerCase())} · ${esc(topicOf(t.n).name)}</text>`;
  const stl=w.st==='new'?(x.skip?'пропущена':'не решена'):ST_LABEL[w.st].toLowerCase();
  o+=`<rect x="${W-P-300}" y="${y-14}" width="300" height="32" rx="16" fill="${stc[0]}"/><text x="${W-P-150}" y="${y+8}" font-size="17" font-weight="800" fill="${stc[1]}" text-anchor="middle">${esc(stl)}</text>`;
  y+=24;
  ql.forEach(l=>{y+=LH;o+=sdraw(l,P,y-10,SZ,'#1d2640',500);});
  y+=14;
  const fw=Math.round(W*0.48),fh=250;
  const fsvg=figSVG(t.fig).replace('<svg class="fig"',`<svg x="${P}" y="${y}" width="${fw}" height="${fh}" class="fig"`);
  o+=`<rect x="${P}" y="${y}" width="${fw}" height="${fh}" rx="12" fill="#fff" stroke="#e6e9f2"/>`+fsvg;
  let ry=y+28;const rx=P+fw+30,rw=W-rx-P;
  const line=(lab,val,col)=>{o+=`<text x="${rx}" y="${ry}" font-size="17" fill="#777">${esc(lab)}</text>`;ry+=30;wrapM(val,rw,21).forEach(l=>{o+=sdraw(l,rx,ry-8,21,col||'#1d2640',700);ry+=30;});ry+=8;};
  if(showAns)line('Правильный ответ',t.ansT,'#0f7a4d');
  line('Неверные ответы ученика',x.wrong.length?x.wrong.join(';  '):'нет',x.wrong.length?'#c0262c':'#999');
  const hp=[];if(x.stick)hp.push('памятка');if(x.steps)hp.push(x.steps>=t.sol.length?'смотрел решение':'шагов решения: '+x.steps+' из '+t.sol.length);
  if(x.sc)hp.push('смотрел сцену');
  line('Подсказки',hp.join(', ')||'не брал',hp.length?'#8a6400':'#999');
  if(x.md)line('Режим',x.md==='home'?'домашняя работа':'классная работа','#555');
  if(x.hist&&x.hist.length){const h=x.hist[x.hist.length-1];line('До работы над ошибками',ST_LABEL[h.st]+(h.wrong.length?' · ошибки: '+h.wrong.join('; '):''),'#b04e10');}
  const H=Math.max(y+fh,ry)+P;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="Segoe UI,Roboto,Arial,sans-serif"><rect x="1" y="1" width="${W-2}" height="${H-2}" rx="18" fill="#fbfcff" stroke="#dde2ee" stroke-width="2"/>${o}</svg>`;
  return {svg,h:H};
}
function pdfFromJpegs(imgs,w,h){
  const enc=new TextEncoder();const parts=[];let len=0;const offs=[];
  const add=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length;};
  const PW=595.28,PH=841.89;const n=imgs.length;
  add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  const obj=(id,body)=>{offs[id]=len;add(id+' 0 obj\n');body();add('\nendobj\n');};
  obj(1,()=>add('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>add(`<< /Type /Pages /Count ${n} /Kids [${imgs.map((_,i)=>(3+i*3)+' 0 R').join(' ')}] >>`));
  imgs.forEach((im,i)=>{const p=3+i*3,c=p+1,x=p+2;
    obj(p,()=>add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im${i} ${x} 0 R >> >> /Contents ${c} 0 R >>`));
    const cs=`q ${PW} 0 0 ${PH} 0 0 cm /Im${i} Do Q`;
    obj(c,()=>add(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(x,()=>{add(`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.length} >>\nstream\n`);add(im);add('\nendstream');});
  });
  const total=3+n*3;const xref=len;
  let x=`xref\n0 ${total}\n0000000000 65535 f \n`;for(let i=1;i<total;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  add(x);add(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'});
}

 t7:[{g:1,q:'Средняя линия трапеции равна…',o:['полусумме оснований','полуразности оснований','большему основанию','высоте'],a:0},{g:1,q:'Средняя линия трапеции соединяет…',o:['середины оснований','середины боковых сторон','вершины','середины диагоналей'],a:1},
  {g:2,q:'Средняя линия треугольника равна…',o:['стороне','половине параллельной стороны','трети стороны','медиане'],a:1},{g:2,q:'Диагональ делит среднюю линию трапеции на отрезки. Чему они равны?',o:['половинам оснований','высоте','основаниям','они всегда равны'],a:0},
  {g:3,q:'Треугольники AOD и COB при диагоналях трапеции…',o:['равны','подобны','ничем не связаны','прямоугольные'],a:1},{g:3,q:'Коэффициент подобия треугольников AOD и COB равен…',o:['AD : BC','AB : CD','1','h : AD'],a:0},
  {g:4,q:'Под каким углом пересекаются биссектрисы углов при боковой стороне трапеции?',o:['45°','90°','60°','180°'],a:1},{g:4,q:'Почему эти биссектрисы перпендикулярны?',o:['половинки углов в сумме дают 90°','трапеция равнобедренная','диагонали равны','так нарисовано'],a:0}],
 t8:[{g:1,q:'Сумма углов выпуклого четырёхугольника равна…',o:['180°','270°','360°','540°'],a:2},{g:1,q:'Сумма углов треугольника равна…',o:['90°','180°','360°','зависит от треугольника'],a:1},
  {g:2,q:'В трапеции AB = CD. Какая это трапеция?',o:['прямоугольная','равнобедренная','любая','это параллелограмм'],a:1},{g:2,q:'AC = AD. Какие углы треугольника ACD равны?',o:['∠ACD и ∠ADC','∠CAD и ∠ACD','∠CAD и ∠ADC','никакие'],a:0},
  {g:3,q:'Два треугольника имеют три пары равных сторон. Что следует?',o:['они подобны, но не равны','они равны','ничего','у них равны площади, но не углы'],a:1},{g:3,q:'Если треугольники равны, то…',o:['соответствующие углы равны','их углы дают 360°','у них разные площади','их стороны пропорциональны 1 : 2'],a:0}],
 t9:[{g:1,q:'В четырёхугольник вписана окружность. Что верно?',o:['суммы противоположных углов равны 180°','суммы противоположных сторон равны','все стороны равны','диагонали равны'],a:1},{g:1,q:'В параллелограмм вписана окружность. Это…',o:['прямоугольник','ромб','трапеция','любой параллелограмм'],a:1},
  {g:2,q:'Высота трапеции, описанной около окружности, равна…',o:['радиусу','диаметру','средней линии','боковой стороне'],a:1},{g:2,q:'Сумма оснований описанной трапеции равна…',o:['сумме боковых сторон','средней линии','высоте','диаметру'],a:0},
  {g:3,q:'Внешний угол четырёхугольника и внутренний при той же вершине в сумме…',o:['90°','180°','360°','равны'],a:1},{g:3,q:'Прямоугольник разрезан на 4 прямоугольника двумя разрезами. Как связаны площади S₁, S₂ (соседние) и S₃, S₄?',o:['S₁·S₃ = S₂·S₄ для противоположных','S₁ + S₂ = S₃ + S₄ всегда','все равны','никак'],a:0}]
};
function testState(tp){const s=stu();s.tests=s.tests||{};return s.tests[tp]||null}
function viewTest(tpId){cur.tp=tpId;vStop(true);hideFact();cur.view='test';clearTimeout(cur.timer);const tp=TOPICS.find(x=>x.id===tpId);const pool=QB[tpId]||[];
 const groups=[...new Set(pool.map(q=>q.g))];const used=new Set();
 const pick=gs=>gs.map(g=>{const c=pool.filter(q=>q.g===g&&!used.has(q));const q=c.length?c[Math.floor(Math.random()*c.length)]:pool.filter(q=>q.g===g)[Math.floor(Math.random()*pool.filter(q=>q.g===g).length)];used.add(q);return q;});
 let round=1,list=pick(groups),i=0,wrongG=new Set(),total=0,ok=0;
 const shell=b=>{app().innerHTML=topbar()+`<div class="wrap">${sidebar()}<main class="main">${stripHTML()}<div class="card pop tcard" style="--c:${tp.color}">${b}</div></main></div>`;bindTop();bindSide();bindStrip();};
 const show=()=>{const q=list[i];
  shell(`<div class="chead"><span class="badge tpc">${tp.icon} ${tp.name}</span><span class="num">✅ Устный тест · вопрос ${i+1} из ${list.length}</span>${round>1?`<span class="qround">Дополнительный круг ${round-1}: похожие вопросы</span>`:''}</div>
   <div class="qtext" style="margin-top:10px">${M(q.q)} <button class="btn sm ghost" id="tSay" title="прочитать вслух">🔊</button></div>
   <div class="topts">${q.o.map((o,j)=>`<button class="topt" data-o="${j}">${M(o)}</button>`).join('')}</div><div class="fb" id="tfb"></div>
   <div class="row" style="margin-top:12px"><button class="btn sm ghost" id="tSkip">⏭ Пропустить тест</button><button class="btn sm ghost" id="tTh">📘 К теории</button></div>`);
  $('#tSay').onclick=()=>{const P={bar:document.createElement('div'),build:()=>[{say:spk(q.q)+'. Варианты: '+q.o.map((o,j)=>(j+1)+') '+spk(o)).join('; ')}]};vStart(P,0);};
  $('#tSkip').onclick=()=>{const s=stu();s.tests=s.tests||{};s.tests[tpId]={skip:1,at:Date.now()};bump();goTasks(tpId);};
  $('#tTh').onclick=()=>viewTheory(tpId);
  document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const j=+b.dataset.o;total++;document.querySelectorAll('[data-o]').forEach(x=>{x.disabled=true;if(+x.dataset.o===q.a)x.classList.add('good')});
   const fb=$('#tfb');if(j===q.a){ok++;fb.className='fb show good';fb.textContent='Верно! ✅';}else{b.classList.add('bad');wrongG.add(q.g);fb.className='fb show bad';fb.innerHTML='Не так. Правильно: <b>'+M(q.o[q.a])+'</b>';}
   setTimeout(()=>{i++;if(i<list.length){show();return}
    if(wrongG.size&&round<3){round++;list=pick([...wrongG]);wrongG=new Set();i=0;show();return}
    const s=stu();s.tests=s.tests||{};s.tests[tpId]={ok,total,rounds:round,clean:!wrongG.size,at:Date.now()};bump();
    shell(`<div class="big" style="font-size:48px;text-align:center">${wrongG.size?'🙂':'🏅'}</div><h2 style="text-align:center">Тест «${tp.name}» пройден</h2><p style="text-align:center">Верных ответов: <b>${ok} из ${total}</b>${round>1?' · дополнительных кругов: '+(round-1):''}</p>
     <div class="row" style="justify-content:center"><button class="btn pri" id="tGo">➜ К задачам</button><button class="btn" id="tRe">↻ Пройти ещё раз</button></div>`);
    $('#tGo').onclick=()=>goTasks(tpId);$('#tRe').onclick=()=>viewTest(tpId);},j===q.a?700:1600);});};
 show();}
function goTasks(tpId){const s=stu();const ns=vis(s).filter(n=>!isPr(n)&&TASK[n].topic===tpId);if(!ns.length){toast('В этой теме нет задач в текущем задании');return}openTask(ns.find(n=>!solved(s.tasks[n]))||ns[0]);}

/* ---------- теория раздела ---------- */
function viewTheory(tpId){cur.tp=tpId;vStop(true);hideFact();cur.view='theory';clearTimeout(cur.timer);const tp=TOPICS.find(x=>x.id===tpId);const ids=TOPIC_ST[tpId]||[];const scs=TOPIC_SC[tpId]||[];
 if(cur.name){const s=stu();s.theory=s.theory||{};s.theory[tpId]=(s.theory[tpId]||0)+1;bump();}
 app().innerHTML=topbar()+`<div class="wrap">${sidebar()}<main class="main">${stripHTML()}<div class="card pop" style="--c:${tp.color}">
  <div class="row" style="justify-content:space-between"><h1 style="margin:0">📘 Теория: ${tp.name}</h1><div class="row"><button class="btn sm" id="thT">✅ К тесту</button><button class="btn sm pri" id="thZ">➜ К задачам</button></div></div>
  <div id="thV"></div>
  ${scs.length?`<div class="hz-t" style="margin-top:12px">🎬 Живые чертежи — подвигай точки, послушай объяснение</div><div class="row">${scs.map(id=>SCENE[id]?`<button class="btn sm" data-osc="${id}">🎬 ${SCENE[id].title}</button>`:'').join('')}</div>`:''}
  <div class="hz-t" style="margin-top:12px">📌 Факты раздела</div><div class="stks thstks">${ids.map(id=>stickerHTML(STICK[id],{links:1})).join('')}</div></div></main></div>`;
 bindTop();bindSide();bindStrip();bindMemo();
 $('#thT').onclick=()=>viewTest(tpId);$('#thZ').onclick=()=>goTasks(tpId);
 document.querySelectorAll('[data-osc]').forEach(b=>b.onclick=()=>openScene(b.dataset.osc,null,false));
 const hl=id=>{document.querySelectorAll('.thstks .stk').forEach(e=>e.classList.toggle('vcur',e.id==='stk-'+id));const e=document.getElementById('stk-'+id);if(e)e.scrollIntoView({behavior:'smooth',block:'center'});};
 const P={bar:$('#thV'),title:'Теория голосом',note:'Подробно — читаю каждый факт целиком; кратко — только главное.',
  build:()=>ids.map(id=>({say:'Факт '+STICK[id].no+'. '+spk(STICK[id].title)+'. '+(VZ.mode==='short'?STICK[id].s:STICK[id].d),act:()=>hl(id)})),onEnd:()=>hl(null)};vBar(P);}

/* ---------- меню: блоки теория / тест / задачи ---------- */
function testBadge(tp){const r=cur.name?testState(tp):null;if(!r)return '';return r.skip?'<span class="tbd sk">пропущен</span>':`<span class="tbd ${r.clean?'ok':''}">${r.ok}/${r.total}</span>`;}
sidebar=function(){const s=stu();const L=vis(s);const coll=s.coll||{};
 return `<aside class="side"><button class="btn sm ghost sidehide" id="sHide">◀ Скрыть меню</button>${redoOn(s)?`<div class="redo">🔁 <b>Работа над ошибками</b><br>${s.redo.list.filter(n=>solved(s.tasks[n])).length} из ${s.redo.list.length} задач</div>`:''}${TOPICS.map(tp=>{
  const ns=L.filter(n=>!isPr(n)&&TASK[n].topic===tp.id);if(!ns.length)return '';const d=ns.filter(n=>solved(s.tasks[n])).length;
  const isCur=(cur.n&&cur.view==='train'&&TASK[cur.n].topic===tp.id)||cur.tp===tp.id;const open=coll[tp.id]==null?isCur:coll[tp.id];
  return `<div class="tp ${isCur?'cur':''} ${d===ns.length?'fin':''}" style="--c:${tp.color}"><div class="tph" data-tgl="${tp.id}"><span class="ic" style="background:${tp.color}">${tp.icon}</span>${tp.name}<span class="done">${d}/${ns.length}</span></div>
   <div class="mini"><i style="width:${d/ns.length*100}%;background:${tp.color}"></i></div>
   ${open?`<div class="blks"><button class="blk ${cur.view==='theory'&&cur.tp===tp.id?'on':''}" data-th="${tp.id}">📘 Теория</button><button class="blk ${cur.view==='test'&&cur.tp===tp.id?'on':''}" data-ts="${tp.id}">✅ Тест ${testBadge(tp.id)}</button></div>
   <div class="chips">${ns.map(n=>{const x=s.tasks[n];const cl=(x&&x.st&&x.st!=='new'?x.st:(x&&x.skip?'skip':''));return `<button class="chip ${cl} ${n===cur.n&&cur.view==='train'?'cur':''} ${TASK[n].kind==='А'?'an':''}" data-n="${n}" title="№${n} · ${TASK[n].label}">${n}${TASK[n].star?'<sup>*</sup>':''}</button>`;}).join('')}</div>`:''}</div>`;}).join('')}${(()=>{const P=L.filter(isPr);if(!P.length)return '';const d=P.filter(n=>solved(s.tasks[n])).length;
  return `<div class="tp ${cur.n&&isPr(cur.n)?'cur':''} ${d===P.length?'fin':''}"><div class="tph"><span class="ic" style="background:#f0a400">🔁</span>Отработка<span class="done">${d}/${P.length}</span></div><div class="mini"><i style="width:${d/P.length*100}%"></i></div>
  <div class="chips">${P.map(n=>{const x=s.tasks[n];const cl=x&&x.st&&x.st!=='new'?x.st:'';return `<button class="chip ${cl} ${n===cur.n?'cur':''}" data-n="${n}" title="Отработка к задаче №${TASK[n].src}">${dispN(n)}</button>`;}).join('')}</div></div>`;})()}
  <div class="legend"><span><b style="background:var(--ok)"></b>сам</span><span><b style="background:#7bd3a7"></b>с ошибками</span><span><b style="background:#ffd666"></b>с подсказкой</span><span><b style="background:#ffb27a"></b>по решению</span></div></aside>`;};
bindSide=function(){
 document.querySelectorAll('.side .chip').forEach(b=>b.onclick=()=>{tickTime();openTask(+b.dataset.n);});
 document.querySelectorAll('[data-tgl]').forEach(h=>h.onclick=()=>{const s=stu();s.coll=s.coll||{};const id=h.dataset.tgl;const isCur=(cur.n&&cur.view==='train'&&TASK[cur.n].topic===id)||cur.tp===id;const was=s.coll[id]==null?isCur:s.coll[id];s.coll[id]=!was;bump();const side=document.querySelector('.side');side.outerHTML=sidebar();bindSide();});
 document.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{tickTime();cur.tp=b.dataset.th;viewTheory(b.dataset.th);});
 document.querySelectorAll('[data-ts]').forEach(b=>b.onclick=()=>{tickTime();cur.tp=b.dataset.ts;viewTest(b.dataset.ts);});
 const h=$('#sHide');if(h)h.onclick=()=>{DB.sideHidden=true;persist();applySide();};
 applySide();};
function applySide(){document.body.classList.toggle('side-hidden',!!DB.sideHidden);}
/* верхняя полоса: группы по темам с метками теория / тест / задачи */
function stripHTML(){if(!cur.name)return '';const s=stu();const L=vis(s);
 return `<div class="card tstrip"><button class="btn sm" id="sShow" title="Показать меню">☰ Меню</button><div class="tsrows">${TOPICS.map(tp=>{const ns=L.filter(n=>!isPr(n)&&TASK[n].topic===tp.id);if(!ns.length)return '';
  const here=(cur.view==='train'&&cur.n&&TASK[cur.n].topic===tp.id)||cur.tp===tp.id;
  return `<div class="tsg ${here?'here':''}" style="--c:${tp.color}"><span class="tsl">${tp.icon} ${tp.name}</span><span class="tsk"><i>теория</i><button class="tsc ${cur.view==='theory'&&cur.tp===tp.id?'cur':''}" data-sth="${tp.id}">📘</button></span><span class="tsk"><i>тест</i><button class="tsc ${cur.view==='test'&&cur.tp===tp.id?'cur':''} ${testState(tp.id)?'ok':''}" data-sts="${tp.id}">✅</button></span><span class="tsk tsz"><i>задачи</i>${ns.map(n=>{const x=s.tasks[n];const cl=x&&x.st&&x.st!=='new'?(x.st==='ok'||x.st==='err'?'ok':'pend'):'';return `<button class="tsc ${cl} ${n===cur.n&&cur.view==='train'?'cur':''}" data-sn="${n}">${n}</button>`}).join('')}</span></div>`}).join('')}</div></div>`;}
function bindStrip(){const b=$('#sShow');if(b)b.onclick=()=>{DB.sideHidden=false;persist();applySide();};
 document.querySelectorAll('[data-sn]').forEach(b=>b.onclick=()=>{tickTime();openTask(+b.dataset.sn)});
 document.querySelectorAll('[data-sth]').forEach(b=>b.onclick=()=>{cur.tp=b.dataset.sth;viewTheory(b.dataset.sth)});
 document.querySelectorAll('[data-sts]').forEach(b=>b.onclick=()=>{cur.tp=b.dataset.sts;viewTest(b.dataset.sts)});}
function renderStrip(){const main=document.querySelector('.main');if(!main||main.querySelector('.tstrip'))return;main.insertAdjacentHTML('afterbegin',stripHTML());bindStrip();cur.tp=TASK[cur.n].topic;}
/* после успешной проверки обновляем полосу */
const _check=check;check=function(){_check();const st=document.querySelector('.tstrip');if(st){st.outerHTML=stripHTML();bindStrip();}};
/* голос останавливаем при выходе со страницы задачи */
const _viewMemo=viewMemo;viewMemo=function(f){vStop(true);_viewMemo(f);};

function aidsText(r){const A={facts:0,steps:0,voice:0,scene:0,draft:0};r.rows.forEach(x=>{const a=x.x.aids||{};for(const k in A)A[k]+=a[k]||0;});
 const T=r.s.tests||{};const tl=TOPICS.filter(tp=>T[tp.id]).map(tp=>tp.icon+' '+(T[tp.id].skip?'пропущен':T[tp.id].ok+'/'+T[tp.id].total)).join(', ');
 return `<br>Помощники: 📘 факты ${A.facts} · 👣 шаги ${A.steps} · 🔊 голос ${A.voice} · 🎬 сцены ${A.scene} · ✏️ черновик ${A.draft}${tl?'<br>Устные тесты: '+tl:''}`;}

</script></body></html>
