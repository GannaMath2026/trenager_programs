<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>

body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}

.stk:nth-child(3n+1){--r:-1deg}.stk:nth-child(3n+2){--r:.8deg}

/* modal */
.ov{position:fixed;inset:0;background:rgba(10,14,25,.72);z-index:50;display:flex;align-items:center;justify-content:center}

@media(max-width:850px){.bb{grid-template-columns:1fr;grid-template-rows:45% 55%}}
.bl{padding:10px;display:flex;align-items:center;justify-content:center;background:var(--paper);min-height:0}

.br{overflow:auto;padding:14px 20px 30px;background:var(--paper);background-image:repeating-linear-gradient(transparent 0,transparent 33px,var(--rule) 34px);border-left:3px double #e57373;font-family:Caveat,'Segoe Print','Bradley Hand','Comic Sans MS',cursive;font-size:26px;line-height:34px}

.br .st{margin:4px 0}

.br .em{margin-right:6px}

r{color:#e53935;font-weight:700}bl{color:#1565c0;font-weight:700}gr{color:#2e7d32;font-weight:700}or{color:#ef6c00;font-weight:700}
u{text-decoration-thickness:2.5px;text-underline-offset:3px;text-decoration-color:#f9a825}

/* svg */
.ln{fill:none;stroke-width:3.2;stroke-linecap:round}

.ft{font-family:Caveat,'Segoe Print',cursive;font-weight:700}

.new{animation:fd .7s both}
.ln.new:not(.dsh){stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes fd{from{opacity:0}to{opacity:1}}
/* full solution */
.full{width:min(900px,96vw);max-height:94vh;overflow:auto;background:#fff;color:#1c1c1c;border-radius:12px;padding:26px 34px;font-family:'Times New Roman',serif;font-size:21px;line-height:1.55}
.full h3{text-align:center;margin:0 0 12px;font-family:Nunito,sans-serif}
.full .row{margin:8px 0}

.pc{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;text-align:left;color:var(--ink);font-size:16px}
.pc:hover{border-color:var(--pri)}
.pc.bad{animation:shk .4s;border-color:#e53935}.pc.hl{border-color:#43a047;box-shadow:0 0 0 4px #a5d6a7}

.login{max-width:420px;margin:12vh auto;text-align:center}

</style></head><body><div id="app"></div>
<script>
/* ============ ГЕОМЕТРИЯ-УТИЛИТЫ ============ */
const sub=(p,q)=>[p[0]-q[0],p[1]-q[1]],add=(p,q)=>[p[0]+q[0],p[1]+q[1]],mul=(p,k)=>[p[0]*k,p[1]*k],mid=(p,q)=>[(p[0]+q[0])/2,(p[1]+q[1])/2],len=v=>Math.hypot(v[0],v[1]),unit=v=>{const l=len(v)||1;return[v[0]/l,v[1]/l]};
const inter=(a,b,c,d)=>{const den=(a[0]-b[0])*(c[1]-d[1])-(a[1]-b[1])*(c[0]-d[0]);const t=((a[0]-c[0])*(c[1]-d[1])-(a[1]-c[1])*(c[0]-d[0]))/den;return[a[0]+t*(b[0]-a[0]),a[1]+t*(b[1]-a[1])]};
const foot=(p,a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1];const t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/(dx*dx+dy*dy);return[a[0]+t*dx,a[1]+t*dy]};
const onC=(c,r,deg)=>[c[0]+r*Math.cos(deg*Math.PI/180),c[1]-r*Math.sin(deg*Math.PI/180)];
const sec=(M,deg,O,r)=>{const d=[Math.cos(deg*Math.PI/180),-Math.sin(deg*Math.PI/180)];const m=sub(M,O);const b=d[0]*m[0]+d[1]*m[1];const c=m[0]*m[0]+m[1]*m[1]-r*r;const s=Math.sqrt(b*b-c);return[add(M,mul(d,-b-s)),add(M,mul(d,-b+s))]};
/* элементы чертежа */
const L=(a,b,s=0,c,d)=>({k:'L',a,b,s,c,d});
const G=(p,s=0,c='#90caf9',o=.25)=>({k:'G',p:p.split(' '),s,c,o});
const T=(a,b,n=1,s=1,c='#e53935')=>({k:'T',a,b,n,s,c});
const R=(v,a,b,s=0)=>({k:'R',v,a,b,s});
const Q=(v,a,b,n=1,s=1,c='#e53935',r)=>({k:'Q',v,a,b,n,s,c,r});
const Ci=(o,r,s=0,c='#5c6bc0')=>({k:'C',o,r,s,c});
const X=(t,p,s=0,c='#e53935',z=22)=>({k:'X',t,p,s,c,z});
const E=(it,e)=>(it.e=e,it);
const RED='#e53935',BLU='#1e88e5',GRN='#2e9d4f',ORG='#fb8c00',PUR='#8e24aa';
const sb=s=>s.replace(/\d/g,d=>'₀₁₂₃₄₅₆₇₈₉'[d]);
function para(){return{A:[50,240],D:[310,240],B:[115,128],C:[375,128]}}
const base4=(a,b,c,d,fill=true)=>[...(fill?[G(a+' '+b+' '+c+' '+d,0,'#90caf9',.08)]:[]),L(a,b),L(b,c),L(c,d),L(d,a)];

/* ============ ДВИЖОК РИСУНКА ============ */
function svg(f,k,st){
  const P=f.P,[W,H]=f.vb||[400,300];
  const pt=n=>typeof n==='string'?P[n]:n;
  const vis=i=>i.s<=k&&(i.e==null||k<i.e);
  const nw=i=>(!st&&i.s===k)?' new':'';
  let a='',b='',c='';
  for(const i of f.it){ if(!vis(i))continue;
    if(i.k==='G') a+=`<polygon class="${nw(i)}" points="${i.p.map(n=>pt(n).join(',')).join(' ')}" fill="${i.c}" fill-opacity="${i.o}"/>`;
    else if(i.k==='C'){const o=pt(i.o);a+=`<circle class="ln${nw(i)}" pathLength="1" cx="${o[0]}" cy="${o[1]}" r="${i.r}" style="stroke:${i.c}"/>`}
    else if(i.k==='L'){const p=pt(i.a),q=pt(i.b);b+=`<path class="ln${i.c?'':' bs'}${i.d?' dsh':''}${nw(i)}" ${i.d?'stroke-dasharray="6 5"':'pathLength="1"'} style="${i.c?'stroke:'+i.c:''}" d="M${p[0]} ${p[1]}L${q[0]} ${q[1]}"/>`}
    else if(i.k==='T'){const p=pt(i.a),q=pt(i.b),m=mid(p,q),u=unit(sub(q,p)),nr=[-u[1],u[0]];let g='';for(let j=0;j<i.n;j++){const o=(j-(i.n-1)/2)*6,cx=m[0]+u[0]*o,cy=m[1]+u[1]*o;g+=`<line x1="${cx+nr[0]*8}" y1="${cy+nr[1]*8}" x2="${cx-nr[0]*8}" y2="${cy-nr[1]*8}" stroke="${i.c}" stroke-width="3" stroke-linecap="round"/>`}c+=`<g class="${nw(i)}">${g}</g>`}
    else if(i.k==='R'){const v=pt(i.v),u1=unit(sub(pt(i.a),v)),u2=unit(sub(pt(i.b),v)),s=10;const p1=add(v,mul(u1,s)),p2=add(p1,mul(u2,s)),p3=add(v,mul(u2,s));c+=`<path class="ln${nw(i)}" pathLength="1" style="stroke:#8e24aa;stroke-width:2.5" d="M${p1[0]} ${p1[1]}L${p2[0]} ${p2[1]}L${p3[0]} ${p3[1]}"/>`}
    else if(i.k==='Q'){const v=pt(i.v),u1=unit(sub(pt(i.a),v)),u2=unit(sub(pt(i.b),v)),cr=u1[0]*u2[1]-u1[1]*u2[0];for(let j=0;j<i.n;j++){const r=(i.r||24)+j*5,s=add(v,mul(u1,r)),e=add(v,mul(u2,r));c+=`<path class="ln${nw(i)}" pathLength="1" style="stroke:${i.c};stroke-width:2.6" d="M${s[0]} ${s[1]}A${r} ${r} 0 0 ${cr>0?1:0} ${e[0]} ${e[1]}"/>`}}
    else if(i.k==='X'){const p=pt(i.p);c+=`<text class="ft${nw(i)}" x="${p[0]}" y="${p[1]}" text-anchor="middle" font-size="${i.z}" fill="${i.c}">${i.t}</text>`}
  }
  const bp=Object.values(P).filter(p=>!(p[2]>0));const cen=[bp.reduce((s,p)=>s+p[0],0)/bp.length,bp.reduce((s,p)=>s+p[1],0)/bp.length];
  let pts='';
  for(const n in P){const p=P[n];if((p[2]||0)>k)continue;if(f.nl&&f.nl.includes(n))continue;
    let d=unit(sub(p,cen));if(len(sub(p,cen))<1)d=[0,-1];const lx=p[0]+d[0]*17,ly=p[1]+d[1]*17+6;
    pts+=`<g class="${(!st&&(p[2]||0)===k&&k>0)?'new':''}"><circle cx="${p[0]}" cy="${p[1]}" r="3.6" fill="var(--ink)"/><text class="lab" x="${lx}" y="${ly}" text-anchor="middle" font-size="19">${sb(n)}</text></g>`}
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${a}${b}${c}${pts}</svg>`;
}

/* ============ ФАКТЫ (сцены и стикеры) ============ */
const FS=[
{id:'par',t:'Параллелограмм',col:'#1e88e5',txt:'<b>Противоположные стороны</b> параллельны и <b>равны</b>. <b>Противоположные углы</b> равны. <b>Диагонали</b> точкой пересечения делятся <u>пополам</u>.',
 fig(){const P={A:[50,220],B:[110,90],C:[330,90],D:[270,220]};P.O=inter(P.A,P.C,P.B,P.D);P.O[2]=3;
  return{P,it:[...base4('A','B','C','D'),T('A','B',1,1,RED),T('C','D',1,1,RED),T('B','C',2,1,BLU),T('A','D',2,1,BLU),Q('A','D','B',1,2,GRN),Q('C','B','D',1,2,GRN),Q('B','A','C',2,2,ORG),Q('D','C','A',2,2,ORG),L('A','C',3,PUR),L('B','D',3,PUR),T('A','O',1,3,PUR),T('O','C',1,3,PUR),T('B','O',2,3,PUR),T('O','D',2,3,PUR)]}},
 steps:[['📐','Параллелограмм <bl>ABCD</bl>: <bl>AB ∥ CD</bl> и <bl>BC ∥ AD</bl>.'],['📏','Противоположные стороны <r>равны</r>: <r>AB = CD</r>, <bl>BC = AD</bl>.'],['📐','Противоположные углы <gr>равны</gr>: <gr>∠A = ∠C</gr>, <or>∠B = ∠D</or>.'],['✂️','Диагонали точкой пересечения делятся <u>пополам</u>: <bl>AO = OC</bl>, <bl>BO = OD</bl>.']]},
{id:'ang',t:'Параллельные прямые и секущая',col:'#8e24aa',txt:'Если <b>a ∥ b</b>: <b>накрест лежащие</b> углы равны, <b>односторонние</b> в сумме дают 180°. <b>Вертикальные</b> углы равны, <b>смежные</b> — в сумме 180°.',
 fig(){const P={K:[0,0],M:[0,0],A:[40,80],B:[360,80],C:[40,200],D:[360,200],E:[150,30],F:[250,250]};P.K=inter(P.E,P.F,P.A,P.B);P.M=inter(P.E,P.F,P.C,P.D);
  return{P,nl:['A','B','C','D','E','F'],it:[L('A','B'),L('C','D'),L('E','F'),X('a',[20,70],0,BLU,26),X('b',[20,190],0,BLU,26),Q('K','A','M',1,1,RED),Q('M','D','K',1,1,RED),E(Q('K','A','M',2,2,BLU),3),E(Q('M','C','K',2,2,BLU),3),Q('K','A','E',1,3,GRN),Q('K','B','M',1,3,GRN)]}},
 steps:[['📐','Две параллельные прямые <bl>a ∥ b</bl> и секущая.'],['↔️','<r>Накрест лежащие</r> углы равны.'],['🔗','<bl>Односторонние</bl> углы дают в сумме <u>180°</u>.'],['✖️','<gr>Вертикальные</gr> углы равны, а смежные — в сумме 180°.']]},
{id:'bis',t:'Биссектриса параллелограмма',col:'#e53935',txt:'Биссектриса угла параллелограмма <b>отсекает равнобедренный треугольник</b>: ∠BAK = ∠KAD = ∠AKB, значит <u>BK = AB</u>.',
 fig(){const P={A:[50,220],D:[310,220],B:[115,100],C:[375,100]};P.K=[115+len(sub(P.B,P.A)),100];
  return{P,it:[...base4('A','B','C','D'),L('A','K',0,RED),Q('A','B','K',1,1,BLU),Q('A','K','D',1,1,BLU),Q('K','A','B',1,2,BLU),T('A','B',2,3,GRN),T('B','K',2,3,GRN),G('A B K',3,'#a5d6a7',.35)]}},
 steps:[['📐','Биссектриса угла <bl>A</bl> пересекает <bl>BC</bl> в точке <bl>K</bl>.'],['✂️','<bl>AK</bl> — биссектриса: <bl>∠BAK = ∠KAD</bl>.'],['↔️','<bl>BC ∥ AD</bl> ⇒ <r>∠AKB = ∠KAD</r> (накрест лежащие).'],['🔺','Значит <bl>∠BAK = ∠AKB</bl>: △ABK <u>равнобедренный</u>, <gr>BK = AB</gr>.']]},
{id:'iso',t:'Равнобедренный треугольник',col:'#43a047',txt:'При основании <b>равные углы</b>. Медиана к основанию — ещё и <b>высота</b> и <b>биссектриса</b>. Обратно: равные углы ⇒ <u>равные стороны</u>.',

{id:'a1b',no:'1',pg:2,sec:'tri',lv:2,title:'ABC — равнобедренный (BD = BE)',

{id:'a21',no:'21',pg:2,sec:'trap',lv:2,title:'M равноудалена от AB, AD, CD',
 q:'В трапеции ABCD биссектрисы углов A и D пересекаются в точке M, лежащей на стороне BC. Докажите, что точка M равноудалена от прямых AB, AD и CD.',
 given:'ABCD — трапеция, AM и DM — биссектрисы, M ∈ BC.',prove:'Расстояния от M до прямых AB, AD, CD равны.',facts:['bloc'],
 h:'Опусти из M перпендикуляры на три прямые. Используй биссектрису каждого угла отдельно.',
 fig(){const h=Math.sqrt(120*120-40*40);const P={A:[40,240],D:[360,240],B:[80,240-h],C:[320,240-h]};P.M=mid(P.B,P.C);P.K=foot(P.M,P.A,P.B);P.H=foot(P.M,P.A,P.D);P.N=foot(P.M,P.C,P.D);
  return{P,it:[...base4('A','B','C','D'),L('A','M',0,RED),L('D','M',0,RED),Q('A','B','M',1,0,BLU,34),Q('A','M','D',1,0,BLU,34),Q('D','C','M',1,0,BLU,34),Q('D','M','A',1,0,BLU,34),L('B','K',1,'#999',1),L('C','N',1,'#999',1),L('M','K',1,PUR),L('M','H',1,PUR),L('M','N',1,PUR),R('K','M','B',1),R('H','M','D',1),R('N','M','C',1),T('M','K',1,2),T('M','H',1,2),T('M','N',1,3,GRN),T('M','H',1,3,GRN)]}},
 steps:[['📐','Проведём из <bl>M</bl> перпендикуляры: <bl>MK ⟂ AB</bl>, <bl>MH ⟂ AD</bl>, <bl>MN ⟂ CD</bl>.'],
  ['📐','Перпендикуляры построены. Расстояния до прямых — это длины <bl>MK</bl>, <bl>MH</bl>, <bl>MN</bl>.'],
  ['✂️','<bl>M</bl> лежит на биссектрисе угла <bl>A</bl> ⇒ <r>MK = MH</r>.'],
  ['✂️','<bl>M</bl> лежит на биссектрисе угла <bl>D</bl> ⇒ <gr>MH = MN</gr>. Итак, <r>MK = MH = MN</r>. Что и требовалось доказать.']]},
{id:'a14',no:'14',pg:2,sec:'trap',lv:2,title:'S(AOB) = S(COD)',
 q:'В трапеции ABCD с основаниями AD и BC диагонали пересекаются в точке O. Докажите, что площади треугольников AOB и COD равны.',
 given:'ABCD — трапеция, BC ∥ AD, O = AC ∩ BD.',prove:'S(AOB) = S(COD).',facts:['area','trap'],
 h:'Сравни площади △ABD и △ACD, потом вычти общую часть.',
 fig(){const P={A:[40,240],D:[360,240],B:[120,110],C:[300,110],H:[120,240],K:[300,240]};P.O=inter(P.A,P.C,P.B,P.D);
  return{P,it:[...base4('A','B','C','D'),L('A','C'),L('B','D'),L('B','H',1,PUR,1),L('C','K',1,PUR,1),R('H','B','D',1),R('K','C','A',1),T('B','H',1,1,PUR),T('C','K',1,1,PUR),E(G('A B D',2,'#90caf9',.4),4),E(G('A C D',2,'#ffcc80',.4),4),E(G('A O D',3,'#b0bec5',.7),4),G('A O B',4,'#a5d6a7',.6),G('C O D',4,'#a5d6a7',.6)]}},
 steps:[['📐','Трапеция <bl>ABCD</bl>, диагонали пересекаются в <bl>O</bl>.'],
  ['📏','<bl>BC ∥ AD</bl> ⇒ высоты <bl>BH</bl> и <bl>CK</bl> равны: <r>BH = CK = h</r>.'],
  ['🟰','<bl>S(ABD) = ½·AD·BH</bl> и <or>S(ACD) = ½·AD·CK</or> ⇒ <r>S(ABD) = S(ACD)</r>.'],
  ['➖','Из обеих площадей вычтем общую часть — △<bl>AOD</bl>.'],
  ['🎯','<bl>S(AOB) = S(ABD) − S(AOD) = S(ACD) − S(AOD) = S(COD)</bl>. Что и требовалось доказать.']]},
{id:'a16',no:'16',pg:3,sec:'trap',lv:3,title:'Точка на средней линии трапеции',
 q:'На средней линии трапеции ABCD с основаниями AD и BC выбрали произвольную точку E. Докажите, что сумма площадей треугольников BEC и AED равна половине площади трапеции.',
 given:'ABCD — трапеция, MN — средняя линия, E ∈ MN.',prove:'S(BEC) + S(AED) = ½·S(ABCD).',facts:['trap','area'],
 h:'Расстояния от E до BC и до AD одинаковы. Чему они равны?',
 fig(){const P={A:[40,240],D:[360,240],B:[110,110],C:[290,110]};P.M=mid(P.A,P.B);P.N=mid(P.D,P.C);P.E=[210,175];P.K=[210,110];P.H=[210,240];
  return{P,it:[...base4('A','B','C','D'),L('M','N',0,ORG),L('E','B',0,'#90a4ae'),L('E','C',0,'#90a4ae'),L('E','A',0,'#90a4ae'),L('E','D',0,'#90a4ae'),L('K','H',1,PUR,1),R('K','E','C',1),R('H','E','D',1),T('E','K',1,1,PUR),T('E','H',1,1,PUR),G('B E C',2,'#ffcc80',.5),G('A E D',3,'#90caf9',.5),G('A B C D',4,'#a5d6a7',.2)]}},
 steps:[['📐','<bl>MN</bl> — средняя линия, <bl>E ∈ MN</bl>. Проведём <bl>EK ⟂ BC</bl> и <bl>EH ⟂ AD</bl>.'],
  ['📏','<bl>MN ∥ основаниям</bl> и делит высоту пополам ⇒ <r>EK = EH = h/2</r>.'],
  ['🔺','<or>S(BEC) = ½·BC·EK = ¼·BC·h</or>.'],
  ['🔺','<bl>S(AED) = ½·AD·EH = ¼·AD·h</bl>.'],
  ['🎯','Сумма: <r>¼·(AD+BC)·h = ½·[½(AD+BC)·h] = ½·S(ABCD)</r>. Что и требовалось доказать.']]},
{id:'a19',no:'19',pg:3,sec:'trap',lv:3,title:'S(ECD) — половина площади трапеции',

 given:'ABCD — трапеция, E — середина AB.',prove:'S(ECD) = ½·S(ABCD).',facts:['trap','area'],
 h:'Проведи через E среднюю линию EF. Раздели △ECD на две части.',
 fig(){const P={A:[40,240],D:[360,240],B:[110,110],C:[290,110]};P.E=mid(P.A,P.B);P.F=mid(P.D,P.C);P.P=[290,175];P.Q=[360,175];
  return{P,it:[...base4('A','B','C','D'),L('E','C',0,RED),L('E','D',0,RED),L('E','F',1,ORG),L('F','Q',1,'#999',1),T('C','F',1,1,BLU),T('F','D',1,1,BLU),L('C','P',2,PUR,1),L('D','Q',2,PUR,1),R('P','C','F',2),R('Q','D','F',2),G('E C F',3,'#ffcc80',.5),G('E D F',4,'#90caf9',.5),G('E C D',5,'#a5d6a7',.4)]}},
 steps:[['📐','Соединим <bl>E</bl> с <bl>C</bl> и <bl>D</bl>.'],
  ['✂️','<bl>F</bl> — середина <bl>CD</bl>. <or>EF</or> — средняя линия: <or>EF ∥ AD</or>, <r>EF = ½(AD + BC)</r>.'],
  ['📏','<bl>F</bl> — середина <bl>CD</bl> ⇒ точки <bl>C</bl> и <bl>D</bl> равноудалены от <bl>EF</bl>: <r>CP = DQ = h/2</r>.'],
  ['🔺','<or>S(ECF) = ½·EF·CP = ½·EF·h/2</or>.'],
  ['🔺','<bl>S(EDF) = ½·EF·DQ = ½·EF·h/2</bl>.'],
  ['🎯','<r>S(ECD) = ½·EF·h = ½·(AD+BC)/2·h = ½·S(ABCD)</r>. Что и требовалось доказать.']]},
{id:'a34',no:'34',pg:1,sec:'circ',lv:3,title:'∠CC₁A₁ = ∠CAA₁',
 q:'В остроугольном треугольнике ABC проведены высоты AA₁ и CC₁. Докажите, что углы CC₁A₁ и CA₁A равны.',
 note:'Внимание: в условии записано ∠CA₁A. Но AA₁ — высота, поэтому ∠CA₁A = 90° и равенство в общем случае неверно. Скорее всего, имелось в виду ∠CAA₁. Приложение доказывает именно ∠CC₁A₁ = ∠CAA₁. Сверьте с исходным листом.',
 given:'△ABC остроугольный, AA₁ ⟂ BC, CC₁ ⟂ AB.',prove:'∠CC₁A₁ = ∠CAA₁.',facts:['thales','cyc'],
 h:'Из каких точек отрезок AC виден под прямым углом? На какой окружности они лежат?',
 fig(){const P={A:[100,230],C:[300,230],B:[220,40]};P.A1=foot(P.A,P.B,P.C);P.C1=foot(P.C,P.A,P.B);P.O=mid(P.A,P.C);P.O[2]=1;
  return{P,vb:[400,360],nl:['O'],it:[L('A','B'),L('B','C'),L('C','A'),L('A','A1',0,ORG),L('C','C1',0,ORG),R('A1','A','C',0),R('C1','C','A',0),L('C1','A1',0,'#999',1),Ci('O',100,1,'#7986cb'),Q('C1','C','A1',1,2,RED,30),Q('A','C','A1',1,2,RED,30),L('C','A1',2,GRN)]}},
 steps:[['📐','Высоты <bl>AA₁</bl> и <bl>CC₁</bl>, проведём <bl>C₁A₁</bl>. Докажем: <r>∠CC₁A₁ = ∠CAA₁</r>.'],
  ['⭕','<bl>∠AA₁C = ∠AC₁C = 90°</bl> ⇒ точки <gr>A₁</gr> и <gr>C₁</gr> лежат на окружности с <u>диаметром AC</u>.'],
  ['🎯','<r>∠CC₁A₁</r> и <r>∠CAA₁</r> — вписанные углы, опирающиеся на одну дугу <gr>CA₁</gr> ⇒ <r>∠CC₁A₁ = ∠CAA₁</r>. Что и требовалось доказать.']]},

 h:'Докажи, что M и N равноудалены от концов отрезка ST.',

  ['📐','Радиусы в точки касания: <gr>IP ⟂ PQ</gr>, <gr>JQ ⟂ PQ</gr> ⇒ <r>∠IPT = ∠JQT = 90°</r>.'],
  ['✖️','<r>∠ITP = ∠JTQ</r> (вертикальные) ⇒ △<bl>IPT</bl> ∼ △<or>JQT</or> по двум углам.'],
  ['🎯','<r>IP / JQ = IT / JT = m / n</r>. Диаметры вдвое больше радиусов, поэтому <gr>d₁ : d₂ = m : n</gr>. Что и требовалось доказать.']]}

/* ============ СОСТОЯНИЕ ============ */
const $=s=>document.querySelector(s);
let DB={};try{DB=JSON.parse(localStorage.getItem('og24')||'{}')}catch(e){}
DB.stud=DB.stud||{};
const sv=()=>{try{localStorage.setItem('og24',JSON.stringify(DB))}catch(e){}};
const me=()=>DB.stud[DB.cur];
const rec=id=>me().t[id]||(me().t[id]={});
function stat(id){const r=me().t[id]||{};return r.done?((r.seen||r.h||r.e)?'help':'ok'):r.seen?'seen':(r.h||r.e)?'try':'new'}
const ST={ok:['✅','Сам'],help:['🟡','С помощью'],seen:['👁','Смотрел решение'],try:['✏️','Пробовал'],new:['⚪','Новая']};
let V={v:'tasks',sec:'all',sort:'sec',id:null,hint:0};
const esc=s=>s;
const stars=n=>'★'.repeat(n)+'☆'.repeat(3-n);
const strip=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent};

/* ============ ЭКРАНЫ ============ */
function render(){
  if(!DB.cur||!me()){ $('#app').innerHTML=`<div class="login card"><h2>📐 ОГЭ · №24 · Доказательства</h2><p>Тренажёр доказательств с анимированными чертежами</p><input id="nm" placeholder="Как тебя зовут?" maxlength="30"><button class="btn" id="go">Начать</button>${Object.keys(DB.stud).length?'<p>Или выбери: '+Object.keys(DB.stud).map(n=>`<button class="chip" data-u="${n}">${n}</button>`).join(' ')+'</p>':''}</div>`;
    $('#go').onclick=()=>{const n=$('#nm').value.trim();if(!n)return;DB.stud[n]=DB.stud[n]||{t:{}};DB.cur=n;sv();render()};
    $('#nm').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
    document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{DB.cur=b.dataset.u;sv();render()});return}
  document.body.classList.toggle('dark',!!DB.dark);
  const done=TS.filter(t=>['ok','help','seen'].includes(stat(t.id))&&me().t[t.id].done).length;
  const body=V.v==='tasks'?listHTML():V.v==='facts'?factsHTML():V.v==='memo'?memoHTML():taskHTML();
  $('#app').innerHTML=`<header><h1>📐 ОГЭ · Геометрия №24</h1><div class="tabs">${[['tasks','📝 Задачи'],['facts','🎬 Сцены-факты'],['memo','🗒 Памятка']].map(t=>`<button class="tab ${V.v===t[0]||(V.v==='task'&&t[0]==='tasks')?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>
   <span>👤 <b>${DB.cur}</b></span><button class="btn g sm" id="th">${DB.dark?'☀️':'🌙'}</button><button class="btn g sm" id="rp">📋 Отчёт</button><button class="btn g sm" id="lo">Сменить</button></header>
   <div class="wrap"><div style="font-weight:800">Решено: ${done} из ${TS.length}</div><div class="prog"><i style="width:${done/TS.length*100}%"></i></div>${body}</div>`;
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{V.v=b.dataset.t;render()});
  $('#th').onclick=()=>{DB.dark=!DB.dark;sv();render()};
  $('#lo').onclick=()=>{DB.cur=null;sv();render()};
  $('#rp').onclick=report;
  bind();
}
function listHTML(){
  let L=TS.filter(t=>V.sec==='all'||t.sec===V.sec);
  const card=t=>`<div class="tc l${t.lv}" data-id="${t.id}"><span class="stt" title="${ST[stat(t.id)][1]}">${ST[stat(t.id)][0]}</span><b>№${t.no}</b> <span class="stars">${stars(t.lv)}</span><small>${t.title}</small><small>стр. ${t.pg} · ${SEC[t.sec]}</small></div>`;
  let h=`<div class="bar"><button class="chip ${V.sec==='all'?'on':''}" data-sec="all">Все разделы</button>${Object.entries(SEC).map(([k,v])=>`<button class="chip ${V.sec===k?'on':''}" data-sec="${k}">${v}</button>`).join('')}<span style="flex:1"></span>Сортировка: <button class="chip ${V.sort==='sec'?'on':''}" data-sort="sec">по разделам</button><button class="chip ${V.sort==='lv'?'on':''}" data-sort="lv">по сложности ↑</button><button class="chip ${V.sort==='lvd'?'on':''}" data-sort="lvd">по сложности ↓</button></div>`;
  if(V.sort==='sec'){for(const k in SEC){const g=L.filter(t=>t.sec===k).sort((a,b)=>a.lv-b.lv);if(g.length)h+=`<h2 class="sec">${SEC[k]}</h2><div class="grid">${g.map(card).join('')}</div>`}}
  else{L=L.slice().sort((a,b)=>V.sort==='lv'?a.lv-b.lv:b.lv-a.lv);h+=`<div class="grid">${L.map(card).join('')}</div>`}
  return h;
}
function stickerHTML(f,cls=''){return `<div class="stk ${cls}" style="--c:${f.col}" data-f="${f.id}"><h4>${f.t}</h4><div class="sf">${svg(f.fig(),f.ks!=null?f.ks:f.steps.length-1,true)}</div><p>${f.txt}</p><span class="go">▶ смотреть сцену</span></div>`}
function memoHTML(){return `<h2 class="sec">🗒 Памятка: факты, которыми мы пользуемся</h2><p>Нажми на стикер — запустится анимированная сцена.</p><div class="stks">${FS.map(f=>stickerHTML(f)).join('')}</div>`}
function factsHTML(){return `<h2 class="sec">🎬 Сцены с фактами</h2><p>Каждый факт показан пошагово — как на доске.</p><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">${FS.map(f=>`<div class="fc" style="--c:${f.col}"><h4>${f.t}</h4><div class="sf">${svg(f.fig(),0,true)}</div><button class="btn sm" data-f="${f.id}" style="background:${f.col}">▶ Запустить сцену</button></div>`).join('')}</div>`}
function taskHTML(){
  const t=TS.find(x=>x.id===V.id);const r=rec(t.id);
  const hs=[t.h,'Первый шаг: '+strip(t.steps[1][1]),'Второй шаг: '+(t.steps[2]?strip(t.steps[2][1]):'—')];
  return `<button class="btn g sm" id="bk">← К задачам</button>
  <div class="card" style="margin-top:12px"><div style="color:var(--mut);font-weight:700">Задача №${t.no} · стр. ${t.pg} · <span class="stars">${stars(t.lv)}</span> · ${SEC[t.sec]} · ${ST[stat(t.id)][0]} ${ST[stat(t.id)][1]}</div>
  <div class="q">${t.q}</div>${t.note?`<div class="note">⚠️ ${t.note}</div>`:''}
  <div class="two" style="margin-top:14px"><div class="fg">${svg(t.fig(),0,true)}</div>
  <div><div><b>Дано:</b> ${t.given}</div><div style="margin-top:6px"><b>Доказать:</b> ${t.prove}</div>
  <div class="acts"><button class="btn or" id="hb">💡 Подсказка (${V.hint}/3)</button><button class="btn ok" id="asm">✍️ Собери доказательство</button><button class="btn" id="scn">🎬 Показать на доске</button><button class="btn g" id="ful">📖 Решение целиком</button></div>
  <div id="hints">${hs.slice(0,V.hint).map((x,i)=>`<div class="hint"><b>${i+1}.</b> ${x}</div>`).join('')}</div></div></div></div>
  <h2 class="sec">Нужные факты</h2><div class="stks" id="tstk">${t.facts.map(id=>stickerHTML(FM[id])).join('')}</div>`;
}
function bind(){
  document.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{V.sec=b.dataset.sec;render()});
  document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{V.sort=b.dataset.sort;render()});
  document.querySelectorAll('.tc').forEach(c=>c.onclick=()=>{V.v='task';V.id=c.dataset.id;V.hint=0;render();scrollTo(0,0)});
  document.querySelectorAll('[data-f]').forEach(c=>c.onclick=()=>openBoard(FM[c.dataset.f],true));
  if(V.v==='task'){const t=TS.find(x=>x.id===V.id);
    $('#bk').onclick=()=>{V.v='tasks';render()};
    $('#hb').onclick=()=>{if(V.hint<3){V.hint++;rec(t.id).h=(rec(t.id).h||0)+1;sv();if(V.hint===1)document.querySelectorAll('#tstk .stk').forEach(s=>s.classList.add('pulse'));render()}};
    $('#scn').onclick=()=>{rec(t.id).seen=1;sv();openBoard(t,false)};
    $('#ful').onclick=()=>{rec(t.id).seen=1;sv();openFull(t)};
    $('#asm').onclick=()=>openAsm(t);
  }
}
function report(){
  const txt=`Отчёт: ${DB.cur}\n`+TS.map(t=>`№${t.no} (стр.${t.pg}) ${t.title}: ${ST[stat(t.id)][1]}`).join('\n');
  const ov=overlay(`<div class="full"><h3>Отчёт</h3><pre style="white-space:pre-wrap;font-size:16px">${txt}</pre><button class="btn" id="cp">📋 Копировать</button> <button class="btn g" id="cl">Закрыть</button></div>`);
  ov.querySelector('#cp').onclick=()=>copy(txt);ov.querySelector('#cl').onclick=()=>closeOv(ov);
}
function copy(t){try{navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}}

/* ============ ОВЕРЛЕИ ============ */
const OV=[];
function overlay(html){const d=document.createElement('div');d.className='ov';d.innerHTML=html;document.body.appendChild(d);OV.push(d);d.addEventListener('mousedown',e=>{if(e.target===d)closeOv(d)});return d}
function closeOv(d){if(d._tm)clearInterval(d._tm);d.remove();const i=OV.indexOf(d);if(i>=0)OV.splice(i,1);if(V.v)render()}
document.addEventListener('keydown',e=>{const d=OV[OV.length-1];if(!d)return;if(e.key==='Escape')closeOv(d);else if(d._k)d._k(e)});

function openBoard(o,isFact){
  const f=o.fig(),n=o.steps.length;let k=0;
  const chips=isFact?'':o.facts.map(id=>`<button class="chip" data-ff="${id}" style="border-color:${FM[id].col};color:${FM[id].col}">${FM[id].t}</button>`).join('');
  const d=overlay(`<div class="bd"><div class="bh"><b style="font-size:19px">${isFact?'🎬 '+o.t:'📐 Задача №'+o.no+' — '+o.title}</b><span class="sp"></span>${chips}<button class="btn g sm" data-a="x">✕ Закрыть</button></div>
  <div class="bb"><div class="bl"><div class="fig" id="bf"></div></div><div class="br" id="bn"></div></div>
  <div class="bc"><button class="btn g" data-a="p">◀ Назад</button><span class="cnt" id="cn"></span><button class="btn" data-a="n">Далее ▶</button><button class="btn or" data-a="a">▶ Авто</button><button class="btn g" data-a="r">↺ Заново</button>${isFact?'':'<button class="btn ok" data-a="f">📖 Решение целиком</button>'}</div></div>`);
  const draw=()=>{
    d.querySelector('#bf').innerHTML=svg(f,k);
    const gv=isFact?'':`<div class="gv"><r>Дано:</r> ${o.given}<br><r>Доказать:</r> ${o.prove}</div>`;
    d.querySelector('#bn').innerHTML=gv+o.steps.slice(0,k+1).map((s,i)=>`<div class="st ${i===k?'cur':''}"><span class="em">${s[0]}</span>${i>0&&!isFact?'<b>'+i+')</b> ':''}<span class="tx">${s[1]}</span></div>`).join('')+(k===n-1&&!isFact?'<div class="st"><gr>✔ Что и требовалось доказать.</gr></div>':'');
    const bn=d.querySelector('#bn');bn.scrollTop=bn.scrollHeight;
    d.querySelector('#cn').textContent=`Шаг ${k+1} / ${n}`;
    d.querySelector('[data-a=p]').disabled=k===0;d.querySelector('[data-a=n]').disabled=k===n-1;
  };
  const stop=()=>{if(d._tm){clearInterval(d._tm);d._tm=null;d.querySelector('[data-a=a]').textContent='▶ Авто'}};
  const act={x:()=>closeOv(d),p:()=>{stop();if(k>0){k--;draw()}},n:()=>{stop();if(k<n-1){k++;draw()}},r:()=>{stop();k=0;draw()},
   a:()=>{if(d._tm){stop();return}if(k>=n-1)k=0;draw();d.querySelector('[data-a=a]').textContent='⏸ Пауза';d._tm=setInterval(()=>{if(k<n-1){k++;draw()}else stop()},3200)},f:()=>{stop();openFull(o)}};
  d.querySelectorAll('[data-a]').forEach(b=>b.onclick=act[b.dataset.a]);
  d.querySelectorAll('[data-ff]').forEach(b=>b.onclick=()=>openBoard(FM[b.dataset.ff],true));
  d._k=e=>{if(e.key==='ArrowRight')act.n();if(e.key==='ArrowLeft')act.p()};
  V.v&&0;draw();
}
function fullHTML(o){
  return `<div class="full"><h3>Задача №${o.no}</h3><div class="fgb">${svg(o.fig(),o.steps.length-1,true)}</div>
  <div class="row"><span class="lbl">Дано:</span> ${o.given}</div><div class="row"><span class="lbl">Доказать:</span> ${o.prove}</div>
  <div class="row"><span class="lbl">Доказательство.</span></div><ol>${o.steps.slice(1).map(s=>`<li>${s[1]}</li>`).join('')}</ol>
  <div class="ans">Что и требовалось доказать.</div></div>`;
}
function openFull(o){
  const d=overlay(fullHTML(o).replace('</div></div>','</div></div>').replace(/<\/div>$/,'<div style="margin-top:14px;clear:both"><button class="btn" id="cp">📋 Копировать</button> <button class="btn g" id="cl">Закрыть</button></div></div>'));
  const txt=`Задача №${o.no}\nДано: ${o.given}\nДоказать: ${o.prove}\nДоказательство.\n`+o.steps.slice(1).map((s,i)=>`${i+1}. ${strip(s[1])}`).join('\n')+'\nЧто и требовалось доказать.';
  d.querySelector('#cp').onclick=()=>copy(txt);d.querySelector('#cl').onclick=()=>closeOv(d);
}
function openAsm(t){
  const f=t.fig(),n=t.steps.length;let p=0,hl=-1;
  const order=[...Array(n-1).keys()].map(i=>i+1).sort(()=>Math.random()-.5);
  const d=overlay(`<div class="bd"><div class="bh"><b style="font-size:19px">✍️ Собери доказательство — задача №${t.no}</b><span class="sp"></span><button class="btn or sm" data-a="h">💡 Подсказка</button><button class="btn g sm" data-a="x">✕ Закрыть</button></div>
  <div class="bb" style="grid-template-rows:1fr"><div class="bl"><div class="fig" id="bf"></div></div><div style="display:flex;flex-direction:column;min-height:0"><div class="br" id="bn" style="flex:1"></div><div class="pool" id="pl"></div></div></div></div>`);
  const draw=()=>{
    d.querySelector('#bf').innerHTML=svg(f,p);
    d.querySelector('#bn').innerHTML=`<div class="gv"><r>Дано:</r> ${t.given}<br><r>Доказать:</r> ${t.prove}</div>`+t.steps.slice(1,p+1).map((s,i)=>`<div class="st ${i===p-1?'cur':''}"><span class="em">${s[0]}</span><b>${i+1})</b> <span class="tx">${s[1]}</span></div>`).join('')+(p===n-1?'<div class="st"><gr>✔ Доказано!</gr></div>':'');
    const bn=d.querySelector('#bn');bn.scrollTop=bn.scrollHeight;
    const rest=order.filter(i=>i>p);
    d.querySelector('#pl').innerHTML=p===n-1?`<div style="font-weight:800;color:#2e7d32">🎉 Доказательство собрано!</div><div class="acts" style="margin:0"><button class="btn" data-a="s">🎬 Смотреть на доске</button><button class="btn g" data-a="f">📖 Решение целиком</button></div>`
      :`<div style="font-weight:800">Какой шаг следующий? (${p}/${n-1})</div>`+rest.map(i=>`<button class="pc ${i===hl?'hl':''}" data-i="${i}">${strip(t.steps[i][1])}</button>`).join('');
    d.querySelectorAll('.pc').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(i===p+1){p++;hl=-1;if(p===n-1){const r=rec(t.id);r.done=1;sv()}draw()}else{rec(t.id).e=(rec(t.id).e||0)+1;sv();b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),450)}});
    const q=s=>d.querySelector(`[data-a=${s}]`);if(q('s'))q('s').onclick=()=>openBoard(t,false);if(q('f'))q('f').onclick=()=>openFull(t);
  };
  d.querySelector('[data-a=x]').onclick=()=>closeOv(d);
  d.querySelector('[data-a=h]').onclick=()=>{if(p<n-1){hl=p+1;rec(t.id).h=(rec(t.id).h||0)+1;sv();draw()}};
  draw();
}
render();
</script></body></html>
