<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ЕГЭ · 1 часть — тренажёр</title>
<style>
:root{--bg:#f6f4ef;--panel:#fff;--panel2:#f8f7f3;--ink:#1d2433;--muted:#6d7385;--line:#e6e2d8;--blue:#4f6bff;--ok:#16a06a;--okbg:#e3f6ec;--bad:#e2475b;--badbg:#fdecee;--warn:#e89a12;--warnbg:#fff3d6;--fix:#0f9488;--c:#4f6bff;--sh:0 1px 2px #1d24330d,0 8px 26px #1d243314;--r:18px;--fs:16px;--hand:"Comic Sans MS","Segoe Print","Bradley Hand","Marker Felt","Chalkboard SE",cursive;--mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace}
body.theme-dark{--bg:#11151f;--panel:#1a202d;--panel2:#202737;--ink:#e8ebf3;--muted:#9aa3b8;--line:#2d3546;--okbg:#14382b;--badbg:#45202a;--warnbg:#3d3116;--sh:0 1px 2px #0006,0 10px 30px #0007}
body.font-small{--fs:14px}body.font-medium{--fs:16px}body.font-large{--fs:18px}body.font-xlarge{--fs:21px}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:var(--fs)/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(900px 520px at -5% -10%,#fde9c8 0,transparent 60%),radial-gradient(800px 600px at 110% 0%,#e3e9ff 0,transparent 55%),var(--bg);background-attachment:fixed;min-height:100vh}
body.theme-dark{background:radial-gradient(900px 500px at 0% -10%,#3a2c18 0,transparent 60%),radial-gradient(800px 600px at 110% 0%,#1d2a55 0,transparent 55%),var(--bg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:8px 16px;background:color-mix(in srgb,var(--panel) 85%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;user-select:none;cursor:pointer}
.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#ff8a3d,#ff4f8b 55%,#7a5cff);color:#fff;font-weight:900;font-size:14px;box-shadow:0 4px 14px #ff6a5a55;transform:rotate(-4deg)}
.brand b{display:block;font-size:16px;line-height:1.1}.brand small{color:var(--muted);font-size:12px;font-weight:600}
.hbtn{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:7px 12px;font-size:14px;font-weight:650;cursor:pointer;white-space:nowrap;transition:.15s}
.hbtn:hover{border-color:var(--blue);color:var(--blue)}.hbtn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.hbtn.active{background:var(--ink);color:var(--panel);border-color:var(--ink)}
#menuBtn{display:none}
.fonts{display:inline-flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--panel)}.fonts button{border:0;background:none;padding:7px 8px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}.fonts button.active{background:var(--blue);color:#fff}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 15px;font-weight:650;cursor:pointer;transition:.15s;font-size:calc(var(--fs) - 1px)}
.btn:hover{border-color:var(--c);color:var(--c)}.btn.primary{background:var(--c);border-color:var(--c);color:#fff}.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.small{padding:5px 10px;font-size:13px;border-radius:9px}.btn:disabled{opacity:.45;cursor:default}.btn.on{background:color-mix(in srgb,var(--c) 14%,var(--panel));border-color:var(--c);color:var(--c)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:750;background:var(--panel2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.c{background:color-mix(in srgb,var(--c) 14%,var(--panel));color:var(--c);border-color:transparent}.chip.ok{background:var(--okbg);color:var(--ok);border-color:transparent}.chip.bad{background:var(--badbg);color:var(--bad);border-color:transparent}.chip.warn{background:var(--warnbg);color:#a86a00;border-color:transparent}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
/* layout */
#app{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px;max-width:1500px;margin:0 auto;padding:16px 18px 50px}
#side{position:sticky;top:68px;align-self:start;max-height:calc(100vh - 84px);overflow:auto;padding:12px 10px 14px}
.me{padding:4px 6px 10px;border-bottom:1px dashed var(--line);margin-bottom:8px}
.me b{font-size:15px}.me .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:650;margin-top:4px}
.bar{height:7px;border-radius:9px;background:var(--line);overflow:hidden;display:flex}.bar i{display:block;height:100%;transition:width .4s}.bar i.g{background:var(--ok)}.bar i.y{background:var(--warn)}
.seg2{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px;margin:8px 0 4px}.seg2 button{border:0;background:none;border-radius:8px;padding:4px 2px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}.seg2 button.active{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px #0002}
.egeh{display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:12px;cursor:pointer;font-weight:800;margin-top:6px}
.egeh:hover{background:var(--panel2)}.egeh .n{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#ff8a3d,#ff4f8b);font-size:14px;flex:none}
.egeh.soon{opacity:.45;cursor:default;font-weight:650}.egeh.soon .n{background:var(--muted)}.egeh .pr{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700}
.toph{display:flex;align-items:center;gap:7px;padding:6px 8px 6px 12px;margin:6px 0 2px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:800;color:var(--ink)}
.toph:hover{background:var(--panel2)}.toph .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}.toph .pr{margin-left:auto;font-size:11px;color:var(--muted)}
.toph.all{background:var(--okbg)}.toph.all .pr{color:var(--ok)}
.ti{display:flex;align-items:center;gap:7px;padding:6px 8px;margin:2px 0 2px 14px;border-radius:11px;cursor:pointer;border:1px solid transparent;font-size:calc(var(--fs) - 2.5px);line-height:1.25}
.ti:hover{background:var(--panel2)}.ti.active{border-color:var(--c);background:color-mix(in srgb,var(--c) 9%,var(--panel))}
.ti .st{width:22px;height:22px;flex:none;border-radius:7px;display:grid;place-items:center;font-size:12px;background:var(--panel2);border:1px solid var(--line);font-weight:800;color:var(--muted)}
.ti.s-ok .st,.ti.s-ok2 .st{background:var(--ok);color:#fff;border-color:var(--ok)}.ti.s-fix .st{background:var(--fix);color:#fff;border-color:var(--fix)}
.ti.s-ok,.ti.s-ok2,.ti.s-fix{background:color-mix(in srgb,var(--ok) 7%,transparent)}
.ti.s-bad .st{background:var(--badbg);color:var(--bad);border-color:var(--bad)}.ti.s-pend .st{background:var(--warnbg);color:#a86a00;border-color:var(--warn)}.ti.s-seen .st{border-style:dashed}
.ti .tt{flex:1;min-width:0}.ti .tt small{color:var(--muted);font-weight:700;margin-right:4px}
.ti .lv{font-size:10px;color:#e8a400;letter-spacing:-1px;white-space:nowrap}.ti .pin{font-size:11px}
.lvh{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:10px 8px 4px 14px}
.workrow{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;cursor:pointer;margin:3px 0;border:1px solid var(--line);background:var(--panel2);font-size:14px;font-weight:700}
.workrow:hover{border-color:var(--c)}.workrow.active{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--panel))}.workrow.done{background:var(--okbg);border-color:transparent}
.workrow small{margin-left:auto;color:var(--muted);font-weight:700;white-space:nowrap}
.sideh{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:10px 6px 4px}
main{min-width:0}
/* task card */
.taskcard{padding:clamp(16px,2vw,26px)}
.thead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}.thead h2{margin:0 auto 0 0;font-size:calc(var(--fs) + 5px);line-height:1.2}
.banner{display:flex;gap:10px;align-items:center;border-radius:14px;padding:10px 14px;margin-bottom:12px;font-weight:650}.banner.an{background:var(--warnbg)}.banner.wk{background:color-mix(in srgb,var(--c) 12%,var(--panel))}
.itabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}.itab{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:4px 10px;font-size:13px;font-weight:700;cursor:pointer}.itab.active{border-color:var(--c);color:var(--c);background:var(--panel)}.itab.ok{color:var(--ok)}
.cond{background:var(--panel2);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;padding:14px 16px;margin:8px 0 12px;font-size:calc(var(--fs) + 2px)}
.solved .cond{border-left-color:var(--ok)}
.figbox{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;margin:6px 0 4px}
.drawwrap{position:relative;flex:0 1 460px;min-width:240px;background:#fff;border-radius:14px;border:1px solid var(--line);padding:8px}
.drawwrap canvas{position:absolute;left:8px;top:8px;touch-action:none;pointer-events:none}.drawwrap.drawing canvas{pointer-events:auto;cursor:crosshair}
.drawtools{display:flex;flex-direction:column;gap:6px}
.ansrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 4px}
.ansrow input{flex:1;min-width:200px;max-width:380px;padding:11px 14px;border:2px solid var(--line);border-radius:13px;background:var(--panel);font-size:calc(var(--fs) + 3px);font-weight:800;outline:none;transition:.15s}.ansrow input:focus{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 18%,transparent)}
.pv{font-size:13px;color:var(--muted);min-height:18px;font-weight:650}
.fb{min-height:26px;font-weight:750;margin:6px 0}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}.fb.warn{color:#a86a00}
.hintbox{margin-top:10px}.step{display:flex;gap:11px;padding:10px 12px;border-radius:13px;background:var(--warnbg);margin:6px 0;animation:pop .3s}.step b.n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--warn);color:#fff;display:grid;place-items:center;font-size:13px}
.step .h{font-weight:800;margin-bottom:2px}
@keyframes pop{from{transform:translateY(6px);opacity:0}}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.9em;margin:0 2px;line-height:1.15}.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}.fr>span:last-child{padding:0 3px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
.wchips{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto}.wchip{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:800;border:1px solid var(--line);background:var(--panel);cursor:pointer}.wchip.cur{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 30%,transparent)}.wchip.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.wchip.bad{background:var(--badbg);color:var(--bad)}.wchip.pend{background:var(--warnbg)}
/* figures */
.figsvg{width:100%;height:auto;max-height:340px;display:block;background:#fff}
.figsvg .fl{stroke:#1b2233;stroke-width:1.9;fill:none;stroke-linecap:round}
.figsvg .fd{stroke:#1b2233;stroke-width:1.5;fill:none;stroke-dasharray:6 4}
.figsvg .fh{stroke:#e2475b;stroke-width:2.6;fill:none;stroke-linecap:round}
.figsvg .fr2{stroke:#1b2233;stroke-width:1.4;fill:none}
.figsvg .ftk{stroke:#1b2233;stroke-width:1.7}
.figsvg .fdt{fill:#1b2233}
.figsvg .fpn{font:italic 600 17px "Times New Roman",Georgia,serif;fill:#1b2233;text-anchor:middle;dominant-baseline:central}
.figsvg .ftx{font:700 14px system-ui,Arial,sans-serif;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.gridsvg{max-height:380px}.gridsvg .gtl{font:italic 700 16px system-ui;fill:#16213a}.gridsvg .gtn{font:600 12px system-ui;fill:#64748b}.gridsvg .gvl{font:italic 800 19px Georgia,serif}.gridsvg .gva{font:700 13px system-ui}.gridsvg .glg{font:800 14px system-ui;fill:#d97706}

/* vectors & scenes */
.vc{position:relative;display:inline-block;font-style:italic;font-weight:700;padding-top:.18em}.vc::before{content:"";position:absolute;left:5%;right:-5%;top:.12em;border-top:1.6px solid currentColor}.vc::after{content:"";position:absolute;right:-8%;top:-.04em;border:.2em solid transparent;border-left:.36em solid currentColor;border-right:0}
svg.vg{width:100%;height:auto;background:#fff;border-radius:12px;border:1px solid var(--line)}.vg .gl{stroke:#e3e8f0;stroke-width:1}.vg .ax{stroke:#16213a;stroke-width:2}.vg .tl{font:italic 700 16px system-ui;fill:#16213a}.vg .tn{font:600 12px system-ui;fill:#64748b}.vg .vl{font:italic 800 19px Georgia,serif}.vg .va{font:700 13px system-ui}.vg .lg{font:800 14px system-ui;fill:#d97706}.vg .dl{stroke:#64748b;stroke-dasharray:4 4}.vg .pl{font:700 13px system-ui;fill:#16213a}
.scwrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(240px,1fr);gap:14px;align-items:start}@media(max-width:900px){.scwrap{grid-template-columns:1fr}}.scsvg svg{max-width:100%!important;touch-action:none}.hd{cursor:grab}.hdc{fill:#4f6bff33;stroke:#4f6bff;stroke-width:2}
.scinfo{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}.big2{font-size:calc(var(--fs) + 2px);line-height:1.9}.hint2{color:var(--muted);font-size:14px}.sctip{font-size:12px;color:var(--muted);margin-top:8px}.ok2{color:var(--ok);font-weight:800}.no2{color:var(--bad);font-weight:700}
.hd.dragging .hdc{fill:#4f6bff55;stroke-width:3}.hd.dragging{cursor:grabbing}
.scpanel{border:2px solid color-mix(in srgb,var(--c) 40%,var(--line));border-radius:16px;padding:12px;margin:12px 0;background:color-mix(in srgb,var(--c) 4%,var(--panel))}.scpanel h4{margin:0 0 6px}
.ti.scn .st{background:#fff3c4;border-color:#f0c94d}
.sticker .ex{font-size:12px;font-style:italic;color:#555;text-align:center;margin-top:4px}
.sticker .vec{position:relative;display:inline-block;font-style:italic;padding:0 .12em}.sticker .vec::after{content:"→";position:absolute;top:-.85em;left:50%;transform:translateX(-50%);font-size:.7em;font-style:normal}
.sticker svg .lbl-sm{font-size:6.5px;fill:#444}.sticker svg .ln3{stroke:#bbb;stroke-width:.5;fill:none;stroke-dasharray:1.5 1.5}.sticker svg .blue{stroke:#1f5fbf;stroke-width:1.2;fill:none}.sticker svg .green{stroke:#2e9e4f;stroke-width:1.2;fill:none}.sticker svg .orange{stroke:#e8862a;stroke-width:1.2;fill:none}
.sticker svg .ah-red{fill:#d43a3a}.sticker svg .ah-blue{fill:#1f5fbf}.sticker svg .ah-green{fill:#2e9e4f}.sticker svg .ah-orange{fill:#e8862a}.sticker svg .ah-black{fill:#222}
#dlg .modal{width:min(520px,100%)}
/* stickers */
.board{display:flex;flex-wrap:wrap;gap:20px;padding:18px 6px 8px}
.sticker{--rot:-1.5deg;--sc:#fff6a8;position:relative;flex:1 1 220px;max-width:300px;background:var(--sc);color:#2b2a26;padding:18px 14px 12px;border-radius:3px 3px 14px 3px;box-shadow:0 1px 1px #0001,0 10px 18px -6px #0003;transform:rotate(var(--rot));transition:.2s;font-size:calc(var(--fs) - 1px);line-height:1.4}
.sticker:hover{transform:rotate(0) scale(1.03);z-index:2}
.sticker::before{content:"";position:absolute;top:-10px;left:50%;width:84px;height:22px;transform:translateX(-50%) rotate(-3deg);background:#ffffff8c;border:1px solid #0000000d}
.sticker h4{font-family:var(--hand);font-size:calc(var(--fs) + 2px);margin:0 0 4px;line-height:1.2}.sticker h4 small{font-family:system-ui;font-size:11px;opacity:.6;margin-right:4px}
.sticker p{margin:4px 0}
.sticker:nth-child(5n+1){--sc:#fff3a0;--rot:-1.6deg}.sticker:nth-child(5n+2){--sc:#ffd7e4;--rot:1.3deg}.sticker:nth-child(5n+3){--sc:#cdeffd;--rot:-.6deg}.sticker:nth-child(5n+4){--sc:#d4f5d0;--rot:1.8deg}.sticker:nth-child(5n+5){--sc:#ffe1c2;--rot:-1.1deg}
.sticker .fact{background:#ffffffc0;border-radius:9px;padding:4px;margin:6px 0}.sticker .fact svg{width:100%;height:auto;max-height:150px;display:block}
.sticker .ff{font-weight:800;color:#1f5fbf;text-align:center;font-size:calc(var(--fs) + 1px);margin-top:4px}
.sticker svg text{font-family:"Segoe UI",Arial,sans-serif;font-size:6px;fill:#111}.sticker svg .lbl{font-size:6px;fill:#222;font-weight:600}
.sticker svg .ln{stroke:#222;stroke-width:.7;fill:none}.sticker svg .ln2{stroke:#444;stroke-width:.5;fill:none;stroke-dasharray:1.5 1.2}
.sticker svg .arc{stroke:#d43a3a;stroke-width:1;fill:none}.sticker svg .arcb{stroke:#1f5fbf;stroke-width:.9;fill:none}.sticker svg .hl{stroke:#d43a3a;stroke-width:1.1;fill:none}
.sticker svg .red{stroke:#d43a3a;stroke-width:1.2;fill:none}.sticker svg .red-dash{stroke:#d43a3a;stroke-width:1.2;fill:none;stroke-dasharray:2.5 2}
.sticker svg .dot{fill:#111}.sticker svg .sq{stroke:#d43a3a;stroke-width:.7;fill:none}.sticker svg .sq-black{stroke:#111;stroke-width:.7;fill:none}.sticker svg .tick{stroke:#d43a3a;stroke-width:.9}.sticker svg .shade{fill:#2e9e4f;opacity:.25}
.ic{display:inline-block;width:1.05em;height:1.05em;vertical-align:-.15em;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.thpanel{border:2px dashed #e8c54a;border-radius:16px;margin:12px 0;padding:4px 8px 10px;background:color-mix(in srgb,#fff6a8 18%,var(--panel))}
.thpanel .tl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#a88400;margin:6px 6px 0}
/* pages */
#page{max-width:1400px;margin:0 auto;padding:18px}
.ptitle{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}.ptitle h1{margin:0;font-size:clamp(22px,3vw,32px);margin-right:auto}
.ttabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.ttabs button{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 14px;font-weight:750;cursor:pointer}.ttabs button.active{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.mtable{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:14px}
.mtable th,.mtable td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.mtable th{background:var(--panel2);font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.mtable td.c{text-align:center;cursor:pointer;white-space:nowrap}.mtable td.c:hover{background:var(--panel2)}.mtable tr.grp td{background:var(--panel2);font-weight:800}
.tgrid{display:grid;grid-template-columns:260px minmax(0,1fr) 300px;gap:14px;align-items:start}@media(max-width:1100px){.tgrid{grid-template-columns:1fr}}
.pane{padding:14px}.pane h3{margin:0 0 8px;font-size:15px}
.lrow{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:9px;font-size:14px}.lrow:hover{background:var(--panel2)}.lrow label{flex:1;cursor:pointer;display:flex;gap:8px;align-items:center}
.lrow select{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:2px 4px;font-size:12px}
.fld{display:flex;flex-direction:column;gap:4px;margin:8px 0;font-size:13px;font-weight:700;color:var(--muted)}.fld input,.fld select,.fld textarea{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:600}

<script>
// ================= ЯДРО: выражения, шаблоны, генерация, чертежи =================
const ENG=(()=>{

function tokenize(s){const T=[];let i=0;

function prepStudent(s){return String(s??'').toLowerCase().replace(/\s+/g,'').replace(/,/g,'.').replace(/[×·∙•]/g,'*').replace(/[:÷]/g,'/').replace(/[−–—]/g,'-')

function envOf(task,vars){const env={...vars};for(const[k,e]of Object.entries(task.calc||{}))env[k]=calc(e,env);env.ans=calc(task.ans,env);return env}

function gen(task,avoid=[],rnd=Math.random){const keys=JSON.stringify;const av=new Set(avoid.map(keys));

// ---------- чертежи ----------
function figPoints(fig,env){const P={},meta={},src=fig.pts||{};const num=x=>typeof x==='number'?x:calc(x,env);
 const get=n=>{if(P[n])return P[n];const d=src[n];if(d===undefined)throw Error('нет точки '+n);P[n]=[0,0];let r;
  if(Array.isArray(d))r=[num(d[0]),num(d[1])];

function figSVG(fig,env,opt={}){if(!fig)return '';if(fig.grid)return gridFig(fig.grid,env,opt);const {P,meta}=figPoints(fig,env);const num=x=>typeof x==='number'?x:calc(x,env);

"on":["C","B",0.45]}},"seg":["AB","BC","CA","AD"],"ang":[{"v":"C","p":"AB","t":"{c}°"},{"v":"A","p":"BD","t":"{b}°","r":34},{"v":"D","p":"AB","t":"?","col":"b"}]}},{"id":"p44","topic":"angles","lvl":2,"src":"44","q":"угол между биссектрисами","v":{"b":{"min":30,"max":130,"step":2}},"proto":{"b":68},"calc":{},"ans":"90+b/2","text":"В треугольнике ABC угол B равен {b}°, биссектрисы углов BAC и ACB пересекаются в точке O. Найдите угол AOC.","steps":[["Биссектрисы","∠OAC + ∠OCA = ½(∠A + ∠C) = ½(180° − {b}°) = {(180-b)/2}°."],["Ответ","∠AOC = 180° − {(180-b)/2}° = <b>{ans}°<\/b>.<br><i>Формула на будущее: ∠AOC = 90° + ½∠B.<\/i>"]],"th":["21","52","13"],"fig":{"pts":{"A":[20,180],"C":[270,180],"B":[190,30],"O":{"inc":"ABC"},"p":{"x":["AO","BC"]},"q":{"x":["CO","AB"]}},"seg":["AB","BC","CA","Ap","Cq"],"ang":[{"v":"B","p":"AC","t":"{b}°"},{"v":"O","p":"AC","t":"?","col":"b","r":14}]}},{"id":"p43","topic":"angles","lvl":2,"src":"43","q":"угол AOC, центр вписанной","v":{"b":{"min":30,"max":130,"step":2}},"proto":{"b":74},"calc":{},"ans":"90+b/2","text":"В треугольнике ABC угол B равен {b}°. Найдите угол AOC, где O — центр вписанной окружности.","steps":[["Центр вписанной окружности","O — точка пересечения биссектрис: ∠OAC = ½∠A, ∠OCA = ½∠C."],["Сумма углов","∠A + ∠C = 180° − {b}° = {180-b}° ⇒ ∠OAC + ∠OCA = {(180-b)/2}°."],["Ответ","∠AOC = 180° − {(180-b)/2}° = <b>{ans}°<\/b>."]],"th":["21","52","13"],"fig":{"pts":{"A":[20,180],"C":[270,180],"B":[190,30],"O":{"inc":"ABC"},"p":{"x":["AO","BC"]},"q":{"x":["CO","AB"]}},"seg":["AB","BC","CA","Ap","Cq"],"ang":[{"v":"B","p":"AC","t":"{b}°"},{"v":"O","p":"AC","t":"?","col":"b","r":14}]}},{"id":"p27b","topic":"angles","lvl":2,"src":"27б","q":"биссектриса и медиана из C","v":{"b":[10,40]},"proto":{"b":21},"calc":{},"ans":"45-b","text":"Острый угол B прямоугольного треугольника ABC равен {b}°. Найдите величину угла между биссектрисой CD и медианой CM, проведёнными из вершины прямого угла C.","steps":[["Медиана из прямого угла","CM = MB (медиана равна половине гипотенузы) ⇒ △CMB равнобедренный: ∠MCB = ∠B = {b}°."],["Биссектриса прямого угла","∠DCB = 90° : 2 = 45°."],["Ответ","∠DCM = ∠DCB − ∠MCB = 45° − {b}° = <b>{ans}°<\/b>."]],"th":["29","52","51"],"fig":{"pts":{"o":[150,160],"A":[20,160],"B":[280,160],"C":{"c":"o","r":130,"a":"180-2*min(max(b,22),68)"},"D":{"bis":["C","A","B"]},"M":{"mid":"AB"}},"seg":["AB","BC","CA","CD","CM"],"right":["ACB"],"ang":[{"v":"B","p":"AC","t":"{b}°","r":46},{"v":"C","p":"DM","t":"?","col":"b","r":40}]}},{"id":"p28a","topic":"angles","lvl":2,"src":"28а","q":"высота и биссектриса из C","v":{"b":[10,40]},"proto":{"b":25},"calc":{},"ans":"45-b","text":"Острый угол B прямоугольного треугольника ABC равен {b}°. Найдите величину угла между высотой CH и биссектрисой CD, проведёнными из вершины прямого угла C.","steps":[["Высота","В прямоугольном △BCH: ∠BCH = 90° − ∠B = 90° − {b}° = {90-b}°."],["Биссектриса прямого угла","∠BCD = 90° : 2 = 45°."],["Ответ","∠HCD = {90-b}° − 45° = <b>{ans}°<\/b>."]],"th":["53","52"],"fig":{"pts":{"o":[150,160],"A":[20,160],"B":[280,160],"C":{"c":"o","r":130,"a":"180-2*min(max(b,22),68)"},"D":{"bis":["C","A","B"]},"H":{"foot":["C","AB"]}},"seg":["AB","BC","CA","CD","CH"],"right":["ACB","CHB"],"ang":[{"v":"B","p":"AC","t":"{b}°","r":46},{"v":"C","p":"HD","t":"?","col":"b","r":44}]}},{"id":"p28b","topic":"angles","lvl":3,"src":"28б","q":"высота и медиана из C","v":{"b":[50,80]},"proto":{"b":65},"calc":{},"ans":"2*b-90","text":"Острый угол B прямоугольного треугольника ABC равен {b}°. Найдите величину угла между высотой CH и медианой CM, проведёнными из вершины прямого угла C.","steps":[["Медиана из прямого угла","CM = AM ⇒ △ACM равнобедренный: ∠ACM = ∠A = 90° − {b}° = {90-b}°."],["Высота","В прямоугольном △ACH: ∠ACH = 90° − ∠A = {b}°."],["Ответ","∠HCM = ∠ACH − ∠ACM = {b}° − {90-b}° = <b>{ans}°<\/b>."]],"th":["29","53","51"],"fig":{"pts":{"o":[150,160],"A":[20,160],"B":[280,160],"C":{"c":"o","r":130,"a":"180-2*min(max(b,22),68)"},"M":{"mid":"AB"},"H":{"foot":["C","AB"]}},"seg":["AB","BC","CA","CM","CH"],"right":["ACB","CHB"],"ang":[{"v":"B","p":"AC","t":"{b}°","r":26},{"v":"C","p":"MH","t":"?","col":"b","r":34}]}},{"id":"p02","topic":"right","lvl":1,"src":"02","q":"cos A по гипотенузе","v":{"c":{"list":[4,5,8,10,20,25]},"k":[1,24]},"proto":{"c":10,"k":9},"calc":{"q":"c*c-k*k"},"ok":"k<c && !issq(q)","ans":"k/c","dec":3,"text":"В треугольнике ABC угол C равен 90°, AB = {c}, BC = {R(q)}. Найдите cos A.","steps":[["Косинус","cos A = [[AC|AB]] — прилежащий катет к гипотенузе. Нужно найти AC."],["Теорема Пифагора","AC² = AB² − BC² = {c*c} − {q} = {k*k} ⇒ AC = {k}."],["Ответ","cos A = [[{k}|{c}]] = <b>{ans}<\/b>."]],"th":["23","22"],"fig":{"pts":{"A":[40,20],"C":[40,170],"B":[235,170]},"seg":["AB","BC","CA"],"right":["ACB"],"slab":[["AB","{c}"],["CB","{R(q)}"]],"ang":[{"v":"A","p":"CB","t":"","col":"b"}]}},{"id":"p03","topic":"right","lvl":1,"src":"03","q":"sin A по гипотенузе","v":{"c":{"list":[4,5,8,10,20,25]},"k":[1,24]},"proto":{"c":10,"k":7},"calc":{"q":"c*c-k*k"},"ok":"k<c && !issq(q)","ans":"k/c","dec":3,"text":"В треугольнике ABC угол C равен 90°, AB = {c}, AC = {R(q)}. Найдите sin A.","steps":[["Синус","sin A = [[BC|AB]] — противолежащий катет к гипотенузе."],["Теорема Пифагора","BC² = AB² − AC² = {c*c} − {q} = {k*k} ⇒ BC = {k}."],["Ответ","sin A = [[{k}|{c}]] = <b>{ans}<\/b>."]],"th":["23","22"],"fig":{"pts":{"A":[40,20],"C":[40,170],"B":[235,170]},"seg":["AB","BC","CA"],"right":["ACB"],"slab":[["AB","{c}"],["AC","{R(q)}"]],"ang":[{"v":"A","p":"CB","t":"","col":"b"}]}},{"id":"p10","topic":"right","lvl":2,"src":"10","q":"катет AC по sin A","v":{"_t":{"set":[[3,4,5],[4,3,5],[7,24,25],[24,7,25]],"as":["p","q","r"]},"c":[1,30]},"proto":{"p":7,"q":24,"r":25,"c":5},"calc":{"s":"p/r","bc":"c*s"},"ans":"c*q/r","text":"В треугольнике ABC угол C равен 90°, AB = {c}, sin A = {s}. Найдите AC.","steps":[["Синус","sin A = [[BC|AB]] ⇒ BC = {c} · {s} = {bc}."],["Пифагор","AC² = AB² − BC² = {c*c} − {bc*bc} = {ans*ans}."],["Ответ","AC = √{ans*ans} = <b>{ans}<\/b>."]],"th":["23","22"],"fig":{"pts":{"A":[20,160],"C":[260,160],"B":[260,40]},"seg":["AB","BC","CA"],"right":["ACB"],"slab":[["AB","{c}"],["AC","?","b"]],"ang":[{"v":"A","p":"CB","t":"","r":34}],"txt":[[75,105,"sin A = {s}","r"]]}},{"id":"p35","topic":"right","lvl":2,"src":"35","q":"sin CAB, AB = BC","v":{"n":[10,50],"h":[3,40]},"proto":{"n":20,"h":13},"calc":{},"ok":"h<0.7*n && h>0.3*n","ans":"h/n","text":"В треугольнике ABC высота AH равна {h}, AB = BC, AC = {n}. Найдите синус угла CAB.","steps":[["Равные углы","AB = BC ⇒ ∠CAB = ∠ACB (углы при основании)."],["Прямоугольный △AHC","sin ∠ACB = [[AH|AC]] — противолежащий катет к гипотенузе."],["Ответ","sin ∠CAB = [[{h}|{n}]] = <b>{ans}<\/b>."]],"th":["51","23"],"fig":{"pts":{"A":[20,160],"C":[280,160],"B":[150,108],"H":{"foot":["A","CB"]}},"seg":["AB","BC","CA","AH"],"dash":["HB"],"right":["AHC"],"tick":["AB","BC"],"slab":[["AH","{h}"],["AC","{n}"]],"ang":[{"v":"A","p":"CB","t":"?","col":"b","r":30}]}},{"id":"p34","topic":"right","lvl":2,"src":"34","q":"cos CAB, высота с корнем","v":{"n":{"list":[5,8,10,20,25,40,50]},"m":[1,49]},"proto":{"n":25,"m":23},"calc":{"q":"n*n-m*m"},"ok":"m<n && m>0.72*n && !issq(q)","ans":"m/n","dec":3,"text":"В треугольнике ABC высота AH равна {R(q)}, AB = BC, AC = {n}. Найдите косинус угла CAB.","steps":[["Пифагор в △AHC","HC = √(AC² − AH²) = √({n*n} − {q}) = {m}."],["Равные углы","AB = BC ⇒ ∠CAB = ∠ACB."],["Ответ","cos ∠CAB = cos ∠ACB = [[HC|AC]] = [[{m}|{n}]] = <b>{ans}<\/b>."]],"th":["51","22","23"],"fig":{"pts":{"A":[20,160],"C":[280,160],"B":[150,108],"H":{"foot":["A","CB"]}},"seg":["AB","BC","CA","AH"],"dash":["HB"],"right":["AHC"],"tick":["AB","BC"],"slab":[["AH","{R(q)}"],["AC","{n}"]],"ang":[{"v":"A","p":"CB","t":"?","col":"b","r":30}]}},{"id":"p09","topic":"right","lvl":3,"src":"09","q":"AC по cos A с корнем","v":{"a":[2,9],"k":{"list":[2,3,4]}},"proto":{"a":3,"k":2},"calc":{"n":"k*k+1"},"ans":"k*a","text":"В треугольнике ABC угол C равен 90°, BC = {a}, cos A = [[{k}√{n}|{n}]]. Найдите AC.","steps":[["Упростим cos A","cos A = [[{k}√{n}|{n}]] = [[{k}|√{n}]]. Тогда sin A = √(1 − cos²A) = [[1|√{n}]]."],["Тангенс","tg A = [[sin A|cos A]] = [[1|{k}]]. В треугольнике tg A = [[BC|AC]] (противолежащий / прилежащий)."],["Ответ","AC = [[BC|tg A]] = {a} · {k} = <b>{ans}<\/b>."]],"th":["23","26","25"],"fig":{"pts":{"o":[140,150],"A":[20,150],"B":[260,150],"C":{"c":"o","r":120,"a":63}},"seg":["AB","BC","CA"],"right":["ACB"],"slab":[["CB","{a}"],["AC","?","b"]],"ang":[{"v":"A","p":"BC","t":"","r":30}]}},{"id":"p32","topic":"right","lvl":3,"src":"32","q":"sin тупого угла ACB","v":{"n":{"list":[4,5,8,10,20,25]},"h":[1,24]},"proto":{"n":4,"h":3},"calc":{"q":"n*n-h*h"},"ok":"h<n && !issq(q)","ans":"h/n","dec":3,"text":"В тупоугольном треугольнике ABC известно, что AC = BC, высота AH равна {h}, CH = {R(q)}. Найдите синус угла ACB.","steps":[["Где высота","Угол C тупой, поэтому H лежит на продолжении стороны BC, а ∠ACH смежный с ∠ACB. Синусы смежных углов равны."],["Пифагор в △AHC","AC = √(AH² + CH²) = √({h*h} + {q}) = {n}."],["Ответ","sin ∠ACB = sin ∠ACH = [[AH|AC]] = [[{h}|{n}]] = <b>{ans}<\/b>."]],"th":["27","22","23"],"fig":{"pts":{"A":[20,150],"B":[270,150],"C":[145,105],"H":{"foot":["A","BC"]}},"seg":["AB","BC","CA"],"dash":["AH","CH"],"right":["AHC"],"tick":["AC","BC"],"slab":[["AH","{h}"],["HC","{R(q)}"]],"ang":[{"v":"C","p":"AB","t":"?","col":"b","r":14}]}},{"id":"p33","topic":"right","lvl":3,"src":"33","q":"cos тупого угла ACB","v":{"n":{"list":[4,5,8,10,20,25]},"m":[1,24]},"proto":{"n":10,"m":7},"calc":{"q":"n*n-m*m"},"ok":"m<n && !issq(q)","ans":"-m/n","dec":3,"text":"В тупоугольном треугольнике ABC известно, что AC = BC = {n}, высота AH равна {R(q)}. Найдите косинус угла ACB.","steps":[["Смежные углы","H лежит на продолжении BC; ∠ACH смежный с ∠ACB, поэтому cos ∠ACB = −cos ∠ACH."],["Пифагор в △AHC","CH = √(AC² − AH²) = √({n*n} − {q}) = {m}."],["Ответ","cos ∠ACB = −[[CH|AC]] = −[[{m}|{n}]] = <b>{ans}<\/b>."]], function validateTask(t,ids){const E=[];if(!t||typeof t!=='object')return ['Задача должна быть объектом {…}'];
 for(const k of['id','topic','text','ans','proto'])if(t[k]===undefined)E.push('нет поля «'+k+'»');if(E.length)return E;
 if(!(BANK.topics||[]).some(x=>x.id===t.topic)&&!(ids&&ids.topics&&ids.topics.some(x=>x.id===t.topic)))E.push(`тема «${t.topic}» не найдена (есть: ${(BANK.topics||[]).map(x=>x.id).join(', ')})`);
 let env;try{env=ENG.envOf(t,t.proto);if(!Number.isFinite(env.ans))E.push('ответ прототипа не число: '+env.ans)}catch(e){E.push('вычисление прототипа: '+e.message);return E}
 try{ENG.tpl(t.text,env);(t.steps||[]).forEach(s=>ENG.tpl(s[1],env))}catch(e){E.push('шаблон: '+e.message)}
 if(t.fig)try{ENG.figSVG(t.fig,env)}catch(e){E.push('чертёж: '+e.message)}
 if(t.v&&Object.keys(t.v).length){const g=ENG.gen(t,[t.proto]);if(!g)E.push('не удалось подобрать ни одного аналога: проверьте диапазоны v и условие ok (ответ должен быть конечной дробью, не больше dec знаков)')}
 (t.th||[]).forEach(id=>{if(!(BANK.theory||{})[id]&&!(ids&&ids.theory&&ids.theory[id]))E.push('нет стикера теории «'+id+'»')});return E}
function previewHtml(t){let h='';try{const env=ENG.envOf(t,t.proto);h+=`<div class="card"><b>Прототип</b> · ответ <b>${ENG.fmt(env.ans)}</b><p>${ENG.mk(ENG.tpl(t.text,env))}</p>${t.fig?safeFig(t.fig,env):''}</div>`;
 for(let i=0;i<3;i++){const v=ENG.gen(t,[t.proto]);if(!v){h+='<div class="card err">Аналог не подобрался</div>';break}const e=ENG.envOf(t,v);h+=`<div class="card"><b>Аналог ${i+1}</b> · ответ <b>${ENG.fmt(e.ans)}</b><p>${ENG.mk(ENG.tpl(t.text,e))}</p>${t.fig?safeFig(t.fig,e):''}<details><summary class="note">решение</summary>${(t.steps||[]).map(s=>`<p><b>${ENG.tpl(s[0],e)}.</b> ${ENG.mk(ENG.tpl(s[1],e))}</p>`).join('')}</details></div>`}}catch(e){h+=`<div class="err">${esc(e.message)}</div>`}return `<div class="prevgrid">${h}</div>`}

 <p><b>v</b> — переменные для аналогов: <code>[10,80]</code> целые от 10 до 80; <code>{"min":1,"max":10,"step":0.5}</code>; <code>{"list":[120,135,150]}</code>; <code>{"set":[[3,4,5],[7,24,25]],"as":["p","q","r"]}</code> — наборы.</p>

function checkBank(j){if(!j||!Array.isArray(j.tasks)||!Array.isArray(j.topics))return ['Нужны массивы topics и tasks'];j.theory=j.theory||{};const E=[];const seen=new Set();

 const full=!Array.isArray(j)&&j.topics;const replace=full&&await dlgBox('<p>В файле целый банк задач.</p>',[{t:'Добавить/обновить по id',v:false},{t:'Заменить банк целиком',v:true,p:1}]);

 else{ensureBank();if(full){for(const tp of j.topics)if(!DB.bank.topics.some(x=>x.id===tp.id))DB.bank.topics.push(tp);Object.assign(DB.bank.theory,j.theory||{})}let n=0,bad=[];for(const t of tasks){const e=validateTask(t,{topics:DB.bank.topics,theory:DB.bank.theory});if(e.length){bad.push(t.id+': '+e[0]);continue}const i=DB.bank.tasks.findIndex(x=>x.id===t.id);if(i>=0)DB.bank.tasks[i]=t;else DB.bank.tasks.push(t);n++}uiAlert(`Добавлено/обновлено: ${n}`+(bad.length?`\nПропущено с ошибками:\n${bad.join('\n')}`:''))}

 <div class="lrow"><label><input type="checkbox" id="sTh" ${DB.set.thHint?'checked':''}> Считать открытие <b>теории</b> подсказкой (тоже нужен аналог)</label></div>
 <p class="note">Открытие стикеров теории всегда учитывается: значок 📌 в меню, в сводной и в отчёте.</p><button class="btn primary" id="sSave">Сохранить</button></div>`;
 $('sSave').onclick=()=>{DB.set.pin=$('sPin').value.trim()||'1234';DB.set.anErr=$('sAnErr').checked;DB.set.thHint=$('sTh').checked;save();toast('Настройки сохранены')}}
// ======================= СОБЫТИЯ =======================
document.addEventListener('click',e=>{const t=e.target;
 const ta=t.closest('[data-task]');if(ta&&$('side').contains(ta)){openTask(ta.dataset.task);return}
 const scn=t.closest('[data-scene]');if(scn){openScene(scn.dataset.scene);return}
 const wk=t.closest('[data-work]');if(wk){openWork(wk.dataset.work);return}
 const vw=t.closest('[data-view]');if(vw){DB.ui.view=vw.dataset.view;save();renderSide();return}
 const fl=t.closest('[data-filt]');if(fl){DB.ui.filter=fl.dataset.filt;save();renderSide();return}
 const eg=t.closest('[data-ege]');if(eg){const n=eg.dataset.ege;DB.ui.open[n]=DB.ui.open[n]===false;save();renderSide();return}
 const tp=t.closest('[data-top]');if(tp){const k=tp.dataset.top;if(k.startsWith('sc_'))DB.ui.open[k]=DB.ui.open[k]!==true;else DB.ui.open[k]=DB.ui.open[k]===false;save();renderSide();return}});
$('brand').onclick=()=>{view='app';showPage('app');renderSide();renderWork()};
$('menuBtn').onclick=()=>$('side').classList.toggle('open');
$('stuBtn').onclick=openStudents;$('stuClose').onclick=()=>$('stuModal').close();$('repBtn').onclick=()=>openReport();$('teachBtn').onclick=openTeacher;
$('stuExp').onclick=()=>{if(!DB.cur){toast('Сначала выберите ученика');return}exportProgress(DB.cur)};
$('stuAdd').onclick=()=>{const n=$('stuNew').value.trim();if(!n)return;const id=newId('s');DB.list.push({id,name:n});DB.data[id]={t:{},w:{}};switchStudent(id);renderStudents();$('stuNew').value=''};
$('stuNew').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('stuAdd').click()}};
$('stuList').onclick=e=>{const p=e.target.closest('[data-pick]');if(p){switchStudent(p.dataset.pick);$('stuModal').close();const W=Object.values(S().w).filter(w=>w.items.some(x=>!x.done));if(W.length)toast(`📌 Есть невыполненные работы: ${W.length}`)}};
function applyTheme(){document.body.classList.toggle('theme-dark',DB.theme==='dark');$('themeBtn').textContent=DB.theme==='dark'?'☀':'☾'}
function applyFont(){['small','medium','large','xlarge'].forEach(f=>document.body.classList.remove('font-'+f));document.body.classList.add('font-'+(DB.font||'medium'));document.querySelectorAll('[data-font]').forEach(b=>b.classList.toggle('active',b.dataset.font===DB.font))}
$('themeBtn').onclick=()=>{DB.theme=DB.theme==='dark'?'light':'dark';save();applyTheme()};
$('fonts').onclick=e=>{const b=e.target.closest('[data-font]');if(!b)return;DB.font=b.dataset.font;save();applyFont();if(view==='app')renderWork()};
$('saveBtn').onclick=()=>{if(IN_FRAME&&!DLNS){uiAlert('В окне Claude сохранить файл приложения нельзя: прогресс и так хранится в этом браузере.\n\nЧтобы перенести прогресс: 👤 → «📤 Мой прогресс в файл» (текст можно скопировать), а учитель загружает его в блоке учителя → «Ученики».');return}const snap=JSON.stringify(DB).replace(/</g,'\\u003c');const cl=document.documentElement.cloneNode(true);const o=cl.querySelector('#ovl');if(o)o.innerHTML='';const dg=cl.querySelector('dialog');if(dg)dg.removeAttribute('open');cl.querySelector('#side').innerHTML='';cl.querySelector('#work').innerHTML='';cl.querySelector('#page').innerHTML='';
 let html='<!doctype html>\n'+cl.outerHTML;html=html.replace(/const EMBED = \{[\s\S]*?\};\n/,()=>`const EMBED = ${snap};\n`);download('ЕГЭ_часть1_тренажёр.html',html,'text/html');toast('Файл сохранён вместе с прогрессом')};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('ovl').innerHTML)closeOverlay()});
function boot(){load();loadBank();updStu();applyTheme();applyFont();
 if(DB.last&&DB.last.mode==='scene'&&SC[DB.last.id])cur={mode:'scene',id:DB.last.id};
 else if(DB.last&&DB.last.mode==='work'&&S().w[DB.last.wid])cur={mode:'work',wid:DB.last.wid,i:Math.max(0,S().w[DB.last.wid].items.findIndex(x=>!x.done)),tid:null};
 else{const tid=(DB.last&&TBY[DB.last.tid])?DB.last.tid:(TASKS.find(t=>!closed(status(t.id)))||TASKS[0]||{}).id;cur={mode:'task',tid,k:tid?defaultK(tid):'p'}}
 renderSide();renderWork();if(!DB.cur&&!window.__noLogin)openStudents()}
boot();
try{if(window.claude&&window.claude.use)window.claude.use('downloads').then(n=>{DLNS=n}).catch(()=>{})}catch(e){}
</script></body></html>
