 }

 ['Медиана, высота, биссектриса','Медиана идёт к середине противоположной стороны. Высота перпендикулярна стороне или её продолжению. Биссектриса делит угол пополам.','Медиана к гипотенузе = ½ гипотенузы'],
 ['Квадрат и окружность','Если O — середина стороны квадрата, то отрезок OA образует прямоугольный треугольник с катетами a и a/2.','R² = a² + (a/2)² = 5a²/4<br>Sкв = a² = 4R²/5']
 ];
 $('work').innerHTML=`<section class="card taskcard"><div class="thead"><h2>Памятка · ОГЭ №18</h2><span class="chip">Формулы и приёмы</span></div><div class="memo">${cards.map(c=>`<article class="card memocard"><h3>${c[0]}</h3><p>${c[1]}</p><div class="formula">${c[2]}</div></article>`).join('')}</div></section>`;
}
function showOverlay(content){$('overlay').innerHTML=`<div class="overlay"><div class="modal"><button class="btn small x" id="closeModal">✕</button>${content}</div></div>`;$('closeModal').onclick=()=>$('overlay').innerHTML=''}
function studentModal(){
 showOverlay(`<h2>Кто занимается?</h2><p class="note">У каждого ученика свои ответы, попытки, подсказки и прогресс. Данные хранятся в этом браузере; кнопка 💾 сохраняет отдельный HTML-файл с прогрессом.</p><div id="stuRows">${DB.students.map(s=>`<div class="sturow ${s.id===DB.current?'cur':''}"><button class="pick" data-pick="${s.id}">${esc(s.name)}</button><span class="note">${Object.values(s.progress).filter(p=>p.done).length} решено</span></div>`).join('')}</div><div class="field">Имя нового ученика<input id="newStudent" placeholder="Например, Миша"></div><button class="btn primary" id="addStudent">Добавить ученика</button>`);
 $('overlay').querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{DB.current=b.dataset.pick;save();$('overlay').innerHTML='';renderSide();if(cur.mode==='task')renderTask()});
 $('addStudent').onclick=()=>{let name=$('newStudent').value.trim();if(!name)return;let id='s'+Date.now();DB.students.push({id,name,progress:{}});DB.current=id;save();studentModal();renderSide()};
}
function teacherModal(){
 showOverlay(`<h2>Режим учителя</h2><p>Отметь задания, которые нужно выдать ученикам. Ученик увидит их во вкладке «ДЗ».</p><div class="seg"><button id="allHw">Выбрать все</button><button id="clearHw">Снять все</button></div><div style="max-height:55vh;overflow:auto">${TOPICS.map(tp=>`<h3>${tp.title}</h3>${TASKS.filter(t=>t.topic===tp.id).map(t=>`<label style="display:flex;gap:8px;padding:5px;border-bottom:1px solid var(--line)"><input type="checkbox" data-hw="${t.id}" ${DB.homework.includes(t.id)?'checked':''}> №${t.id.slice(1)} · ${t.title}</label>`).join('')}`).join('')}</div><p class="note">Домашнее задание общее для всех учеников этого файла.</p><button class="btn primary" id="saveHw">Сохранить назначение</button>`);
 $('allHw').onclick=()=>{$('overlay').querySelectorAll('[data-hw]').forEach(x=>x.checked=true)};
 $('clearHw').onclick=()=>{$('overlay').querySelectorAll('[data-hw]').forEach(x=>x.checked=false)};
 $('saveHw').onclick=()=>{DB.homework=[...$('overlay').querySelectorAll('[data-hw]:checked')].map(x=>x.dataset.hw);save();$('overlay').innerHTML='';renderSide()};
}
function report(){
 const s=student(),done=TASKS.filter(t=>progress(t).done),bad=TASKS.filter(t=>progress(t).tries&&!progress(t).done);
 showOverlay(`<h2>Отчёт ученика: ${esc(s.name)}</h2><div class="memo"><div class="card memocard"><h3>Решено</h3><strong style="font-size:28px;color:var(--ok)">${done.length}</strong> из ${TASKS.length}</div><div class="card memocard"><h3>Есть ошибки</h3><strong style="font-size:28px;color:var(--bad)">${bad.length}</strong></div><div class="card memocard"><h3>Подсказки</h3><strong style="font-size:28px">${TASKS.reduce((n,t)=>n+progress(t).hints,0)}</strong></div></div><h3>Незавершённые задания с попытками</h3>${bad.length?bad.map(t=>`<p>№${t.id.slice(1)} · ${esc(t.title)} — попыток: ${progress(t).tries}</p>`).join(''):'<p>Ошибок нет.</p>'}<h3>Выполненные задания</h3>${done.length?done.map(t=>`<p>✓ №${t.id.slice(1)} · ${esc(t.title)} — ответ: ${fmt(t.answer)}</p>`).join(''):'<p>Пока нет.</p>'}<button class="btn primary" id="printReport">Печать / PDF</button>`);
 $('printReport').onclick=()=>window.print();
}
function saveApp(){
 const source='<!doctype html>\n'+document.documentElement.outerHTML;
 const embedded=source.replace('const EMBEDDED_STATE=null;','const EMBEDDED_STATE='+JSON.stringify(DB)+';');
 const blob=new Blob([embedded],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ОГЭ_18_клетчатая_бумага.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);
}
$('side').addEventListener('click',e=>{
 const t=e.target.closest('[data-task]'),sc=e.target.closest('[data-scene]'),tp=e.target.closest('[data-topic]'),pg=e.target.closest('[data-page]'),f=e.target.closest('[data-filter]');
 if(t){cur={mode:'task',id:t.dataset.task};renderSide();renderTask()}
 else if(sc){cur={mode:'scene',id:sc.dataset.scene};renderScene(sc.dataset.scene);renderSide()}
 else if(tp){topicFilter=tp.dataset.topic;filter='all';renderSide();if(tp.dataset.topic!=='all'){const first=TASKS.find(x=>x.topic===topicFilter);if(first){cur={mode:'task',id:first.id};renderTask()}}}
 else if(pg){renderMemo()}
 else if(f){filter=f.dataset.filter;topicFilter='all';renderSide()}
});
$('work').addEventListener('click',e=>{const sc=e.target.closest('[data-scene]');if(sc){cur={mode:'scene',id:sc.dataset.scene};renderScene(sc.dataset.scene);renderSide()}});
$('studentBtn').onclick=studentModal;$('teacherBtn').onclick=teacherModal;$('reportBtn').onclick=report;$('saveBtn').onclick=saveApp;
$('themeBtn').onclick=()=>{document.body.classList.toggle('theme-dark');DB.ui.dark=document.body.classList.contains('theme-dark');save()};
document.querySelectorAll('[data-font]').forEach(b=>b.onclick=()=>{document.body.classList.remove('font-small','font-medium','font-large','font-xlarge');document.body.classList.add('font-'+b.dataset.font);document.querySelectorAll('[data-font]').forEach(x=>x.classList.toggle('active',x===b));DB.ui.font=b.dataset.font;save()});
if(DB.ui.dark)document.body.classList.add('theme-dark');if(DB.ui.font){document.body.classList.remove('font-medium');document.body.classList.add('font-'+DB.ui.font);document.querySelectorAll('[data-font]').forEach(x=>x.classList.toggle('active',x.dataset.font===DB.ui.font))}
renderSide();renderTask();
</script></body></html>
