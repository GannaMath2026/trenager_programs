<div id="app"></div>
<script>
/* ===== утилиты ===== */
const S=40;
const RED='#e53935',BLU='#1e88e5',GRN='#2e9d4f',ORG='#fb8c00',PUR='#8e24aa',INK='#37474f',TEAL='#00897b';
const fm=v=>String(Math.round(v*1000)/1000).replace('.',',');
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
const sp=(c,t)=>'<span class="'+c+'">'+t+'</span>';
const cR=t=>sp('r',t),cB=t=>sp('b',t),cG=t=>sp('g',t),cO=t=>sp('o',t),cP=t=>sp('p',t),cU=t=>sp('r u',t);
const $=s=>document.querySelector(s);
const gridOf=(pts,pad,minW,minH)=>{const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);const x0=Math.floor(Math.min(...xs))-pad,x1=Math.ceil(Math.max(...xs))+pad,y0=Math.floor(Math.min(...ys))-pad,y1=Math.ceil(Math.max(...ys))+pad;return{x0:x0,y0:y0,w:Math.max(x1-x0,minW||0),h:Math.max(y1-y0,minH||0)}};
/* конструкторы операций чертежа */
const seg=(a,b,c,w,d)=>({t:'seg',a:a,b:b,c:c||INK,w:w,d:d});
const poly=(p,c,f,s)=>({t:'poly',p:p,c:c,f:f,s:s});
const pt=(p,n,c,dir)=>({t:'pt',p:p,n:n,c:c,dir:dir});
const len=(a,b,txt,c)=>({t:'len',a:a,b:b,txt:txt,c:c});
const ra=(v,a,b,c)=>({t:'ra',v:v,a:a,b:b,c:c});
const arc=(v,a,b,r,n,c)=>({t:'arc',v:v,a:a,b:b,r:r,n:n,c:c});
const dots=(p,c,r)=>({t:'dots',p:p,c:c,r:r});
const circ=(o,r,c)=>({t:'circ',o:o,r:r,c:c});
const carc=(o,r,t1,t2,c)=>({t:'carc',o:o,r:r,t1:t1,t2:t2,c:c});
const hl=o=>Object.assign({},o,{hl:1});
const stp=function(t){return{t:t,ops:Array.prototype.slice.call(arguments,1)}};
const ring=rs=>{const o=[];rs.forEach(r=>{for(let a=0;a<360;a+=45)o.push([r*Math.cos(a*Math.PI/180),r*Math.sin(a*Math.PI/180)])});return o};

/* ===== движок рисунка с защитой подписей от наложения ===== */
function place(c,px,py,txt,fs,cands){
  const w=String(txt).length*fs*0.62+8,h=fs+6;let best=null,bs=1e9;
  for(const d of cands){
    const cx=px+d[0],cy=py+d[1],x0=cx-w/2,y0=cy-h/2,x1=cx+w/2,y1=cy+h/2;
    let s=Math.hypot(d[0],d[1])*0.05;
    if(x0<0||y0<0||x1>c.W||y1>c.H)s+=500;
    for(const b of c.boxes)if(!(x1<b[0]||x0>b[2]||y1<b[1]||y0>b[3]))s+=300;
    for(const sg of c.segs){
      const L=Math.hypot(sg[1][0]-sg[0][0],sg[1][1]-sg[0][1]);const n=Math.max(2,Math.ceil(L/5));let hit=0;
      for(let i=0;i<=n;i++){const x=sg[0][0]+(sg[1][0]-sg[0][0])*i/n,y=sg[0][1]+(sg[1][1]-sg[0][1])*i/n;if(x>=x0&&x<=x1&&y>=y0&&y<=y1)hit++}
      s+=Math.min(hit,6)*12;
    }
    if(s<bs){bs=s;best=[cx,cy,x0,y0,x1,y1]}
  }
  c.boxes.push([best[2],best[3],best[4],best[5]]);
  return best;
}
const tx=(b,t,col,fs,k)=>'<text class="'+k+' tx" x="'+b[0]+'" y="'+b[1]+'" text-anchor="middle" dominant-baseline="central" font-size="'+fs+'" font-weight="800" fill="'+col+'">'+t+'</text>';
function dOp(o,cls,c,X,Y){
  const col=o.c||INK,P=p=>[X(p[0]),Y(p[1])],k=cls+(o.hl?' pl':'');
  switch(o.t){
    case 'seg':{const a=P(o.a),b=P(o.b);if(!o.hl)c.segs.push([a,b]);
      return '<line class="'+k+(o.d?'':' sl')+'" '+(o.d?'stroke-dasharray="7 5"':'pathLength="1"')+' x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="'+col+'" stroke-width="'+(o.w||3)+'" stroke-linecap="round"/>'}
    case 'poly':{const ps=o.p.map(P);if(o.s&&!o.hl)ps.forEach((a,i)=>c.segs.push([a,ps[(i+1)%ps.length]]));
      return '<polygon class="'+k+'" points="'+ps.map(a=>a.join(',')).join(' ')+'" fill="'+col+'" fill-opacity="'+(o.f==null?0.15:o.f)+'" stroke="'+((o.s||o.hl)?col:'none')+'" stroke-width="3" stroke-linejoin="round"/>'}
    case 'pt':{const a=P(o.p);let r='<circle class="'+k+'" cx="'+a[0]+'" cy="'+a[1]+'" r="4.5" fill="'+col+'"/>';
      if(o.n){const cd=ring([16,26,38]);if(o.dir){const d=[o.dir[0]*16,-o.dir[1]*16];cd.unshift(d,[d[0]*1.7,d[1]*1.7])}
        const b=place(c,a[0],a[1],o.n,17,cd);r+=tx(b,o.n,col,17,k)}
      return r}
    case 'len':{const a=P(o.a),b=P(o.b);const L=Math.hypot(b[0]-a[0],b[1]-a[1])||1;const n=[-(b[1]-a[1])/L,(b[0]-a[0])/L];const m=[(a[0]+b[0])/2,(a[1]+b[1])/2];
      const cd=[];[13,22,33,46].forEach(r=>{cd.push([n[0]*r,n[1]*r],[-n[0]*r,-n[1]*r])});ring([20,34]).forEach(d=>cd.push(d));
      const t=String(o.txt);const bx=place(c,m[0],m[1],t,15,cd);return tx(bx,t,col,15,k)}
    case 'ra':{const v=P(o.v),a=P(o.a),b=P(o.b);const u=q=>{const L=Math.hypot(q[0]-v[0],q[1]-v[1])||1;return[(q[0]-v[0])/L,(q[1]-v[1])/L]};
      const ua=u(a),ub=u(b),s=13;const p1=[v[0]+ua[0]*s,v[1]+ua[1]*s],p2=[p1[0]+ub[0]*s,p1[1]+ub[1]*s],p3=[v[0]+ub[0]*s,v[1]+ub[1]*s];
      return '<polyline class="'+k+'" points="'+p1+' '+p2+' '+p3+'" fill="none" stroke="'+(o.c||INK)+'" stroke-width="2.5"/>'}
    case 'arc':{const v=P(o.v),a=P(o.a),b=P(o.b),r=(o.r||0.7)*S;const u=q=>{const L=Math.hypot(q[0]-v[0],q[1]-v[1])||1;return[(q[0]-v[0])/L,(q[1]-v[1])/L]};
      const ua=u(a),ub=u(b);const p1=[v[0]+ua[0]*r,v[1]+ua[1]*r],p2=[v[0]+ub[0]*r,v[1]+ub[1]*r];const sw=(ua[0]*ub[1]-ua[1]*ub[0])>0?1:0;
      let res='<path class="'+k+'" d="M'+v+' L'+p1+' A'+r+' '+r+' 0 0 '+sw+' '+p2+' Z" fill="'+col+'" fill-opacity=".2" stroke="'+col+'" stroke-width="2.5"/>';
      if(o.n){let d=[ua[0]+ub[0],ua[1]+ub[1]];let L=Math.hypot(d[0],d[1]);if(L<0.2){d=[-ua[1],ua[0]];L=1}
        const lp=[v[0]+d[0]/L*(r+14),v[1]+d[1]/L*(r+14)];const bx=place(c,lp[0],lp[1],o.n,16,[[0,0]].concat(ring([10,22])));res+=tx(bx,o.n,col,16,k)}
      return res}
    case 'circ':{const a=P(o.o);return '<circle class="'+k+'" cx="'+a[0]+'" cy="'+a[1]+'" r="'+(o.r*S)+'" fill="none" stroke="'+col+'" stroke-width="2.5"/>'}
    case 'dots':return o.p.map(p=>{const a=P(p);return '<circle class="'+k+'" cx="'+a[0]+'" cy="'+a[1]+'" r="'+(o.r||4.5)+'" fill="'+col+'"/>'}).join('');
    case 'carc':{const pts=[];for(let i=0;i<=24;i++){const t=(o.t1+(o.t2-o.t1)*i/24)*Math.PI/180;pts.push(P([o.o[0]+o.r*Math.cos(t),o.o[1]+o.r*Math.sin(t)]))}
      return '<polyline class="'+k+'" points="'+pts.map(a=>a.join(',')).join(' ')+'" fill="none" stroke="'+col+'" stroke-width="7" stroke-linecap="round" opacity=".85"/>'}
  }
  return '';
}
function render(T,k,o){
  o=o||{};const g=T.g,W=g.w*S,H=g.h*S;
  const X=x=>(x-g.x0)*S,Y=y=>(g.y0+g.h-y)*S;
  const c={boxes:[],segs:[],W:W,H:H};
  let s='<svg viewBox="0 0 '+W+' '+H+'" class="svg" xmlns="http://www.w3.org/2000/svg"><rect width="'+W+'" height="'+H+'" fill="var(--paper)"/>';
  if(!T.noGrid){let gl='';for(let i=0;i<=g.w;i++)gl+='<line x1="'+i*S+'" y1="0" x2="'+i*S+'" y2="'+H+'"/>';for(let j=0;j<=g.h;j++)gl+='<line x1="0" y1="'+j*S+'" x2="'+W+'" y2="'+j*S+'"/>';s+='<g class="gl">'+gl+'</g>'}
  T.base.forEach(op=>{s+=dOp(op,'',c,X,Y)});
  const last=Math.min(k,T.steps.length-1);
  for(let i=0;i<=last;i++){T.steps[i].ops.forEach(op=>{if(op.hl&&i!==last)return;s+=dOp(op,i===last?'nw':'',c,X,Y)})}
  if(o.foc)(T.focus||[]).forEach(op=>{s+=dOp(hl(op),'',c,X,Y)});
  return s+'</svg>';
}

/* ===== темы ===== */
const TOPICS={
  trig:{n:'Тригонометрия на клетках',c:'#e53935'},
  area:{n:'Площади фигур',c:'#1e88e5'},
  mid:{n:'Средняя линия',c:'#00897b'},
  ab:{n:'Длина отрезка (подобие)',c:'#8e24aa'},
  ratio:{n:'Отношение отрезков (Фалес)',c:'#fb8c00'},
  circ:{n:'Круги и окружности',c:'#3949ab'},
  sq:{n:'Квадрат и окружность',c:'#43a047'},
  poly:{n:'Углы правильного многоугольника',c:'#d81b60'},
  elem:{n:'Элементы треугольника',c:'#6d4c41'}
};
let N=0;const TASKS=[];
const mk=o=>Object.assign({noGrid:false,hints:[],focus:[],facts:[],star:1,base:[],steps:[],given:'Клетчатая бумага, размер клетки 1×1.',unit:''},o);
const add=t=>{t.id=++N;TASKS.push(t)};

/* ===== 1. Тригонометрия: угол из горизонтального луча ===== */
function trig(fn,O,L,P,star){
  const obt=P[0]<O[0],dx=Math.abs(P[0]-O[0]),dy=P[1]-O[1],hyp=Math.hypot(dx,dy);
  const E=[O[0]+L,O[1]],F=[P[0],O[1]];
  const needH=(fn==='sin'||fn==='cos');
  const val={tg:dy/dx,ctg:dx/dy,sin:dy/hyp,cos:dx/hyp}[fn];
  const neg=obt&&fn!=='sin';const ans=Math.round((neg?-val:val)*1000)/1000;
  const g=gridOf([O,E,P,F],1,7,6);const tri=[O,F,P];const ext=[];
  if(obt)ext.push(seg(O,F,TEAL,2,1));else if(F[0]>E[0])ext.push(seg(E,F,TEAL,2,1));
  const f={tg:[dy,dx,'противолежащий ÷ прилежащий'],ctg:[dx,dy,'прилежащий ÷ противолежащий'],sin:[dy,fm(hyp),'противолежащий ÷ гипотенуза'],cos:[dx,fm(hyp),'прилежащий ÷ гипотенуза']}[fn];
  const steps=[
    stp('👀 Смотрим на угол '+cR('O')+': одна его сторона идёт по линии клеток, вторая — по узлам клеток.',arc(O,E,P,0.8,'O',ORG),dots([O,P],INK,5)),
    stp('✏️ Строим '+cG('прямоугольный треугольник')+': опускаем перпендикуляр на линию клеток.'+(obt?' Угол O '+cR('тупой')+' — в треугольнике получится '+cR('смежный')+' с ним угол.':''),ext.concat([seg(P,F,RED,3),ra(F,O,P),hl(poly(tri,GRN,0.16))])),
    stp('🔢 Считаем клетки: '+cR('противолежащий катет = '+dy)+', '+cB('прилежащий катет = '+dx)+'.',len(F,P,dy,RED),len(O,F,dx,BLU))
  ];

  const L='ABCDEFGHIJ',ix=L.indexOf(X),iy=L.indexOf(Y),iz=L.indexOf(Z),r=4;
  const th=i=>270-180/n-i*360/n;const Pp=i=>[r*Math.cos(th(i)*Math.PI/180),r*Math.sin(th(i)*Math.PI/180)];
  const d1=((iz-ix)%n+n)%n,inside=(((iy-ix)%n+n)%n)<d1&&iy!==ix,k=inside?n-d1:d1,s=k===d1?ix:iz;
  const arcDeg=k*360/n,ans=arcDeg/2,nm={8:'восьмиугольник',9:'девятиугольник',10:'десятиугольник'}[n];
  const vs=[],lbl=[];for(let i=0;i<n;i++){vs.push(Pp(i));lbl.push(pt(Pp(i),L[i],INK,[Math.cos(th(i)*Math.PI/180),Math.sin(th(i)*Math.PI/180)]))}
  const O=[0,0];
  return mk({topic:'poly',star:star||2,noGrid:true,g:{x0:-6,y0:-6,w:12,h:12},unit:'°',
    q:'Правильный '+nm+' '+L.slice(0,n)+'. Найдите угол '+X+Y+Z+' (в градусах).',
    base:[circ(O,r,BLU),poly(vs,RED,0.05,true)].concat(lbl),
    steps:[stp('👀 Угол '+cR(X+Y+Z)+' с вершиной '+cR(Y)+' на окружности — это '+cG('вписанный')+' угол.',seg(Pp(iy),Pp(ix),RED,3),seg(Pp(iy),Pp(iz),RED,3),arc(Pp(iy),Pp(ix),Pp(iz),0.6,'',ORG)),
      stp('✏️ Выделяем '+cB('дугу '+X+Z)+', на которую он опирается (она '+cR('не содержит')+' точку '+Y+').',carc(O,r,th(s)-k*360/n,th(s),ORG)),
      stp('🔢 Вершины делят окружность на '+n+' равных дуг по '+fm(360/n)+'°. В нашей дуге '+cB(k)+' таких частей: '+k+'·'+fm(360/n)+'° = '+cB(fm(arcDeg)+'°')+'.'),
      stp('🎯 Вписанный угол равен '+cG('половине дуги')+': '+fm(arcDeg)+'° ÷ 2 = '+cG(fm(ans)+'°')+'.')],
    ans:ans,hints:['🔍 Угол вписанный. На какую дугу он опирается?','Найди дугу, не содержащую вершину угла: сколько в ней частей по 360°/n?','Вписанный угол = половина дуги.'],focus:[carc(O,r,th(s)-k*360/n,th(s),ORG)],facts:['inscr']});
}

function medhyp(B,A,C,star){

  return mk({topic:'elem',star:star||2,q:'Найдите длину медианы BM, проведённой к гипотенузе (угол B прямой).',g:g,
    base:[poly([A,B,C],BLU,0.08,true),pt(A,'A'),pt(B,'B'),pt(C,'C'),ra(B,A,C)],

      stp('📐 Катеты: '+cB(a)+' и '+cB(c)+'. По Пифагору AC = √('+a+'²+'+c+'²) = '+cG(fm(h))+'.',len(B,A,a,BLU),len(B,C,c,BLU),len(A,C,fm(h),GRN)),
      stp('✏️ M — середина AC, проводим медиану BM.',seg(B,M,RED,3),pt(M,'M',RED)),

}
function dm(kind,V,P,Q,vn,pn,qn,star){

}
function dlineT(A,B,C,star){
  const hor=B[1]===C[1],F=hor?[A[0],B[1]]:[B[0],A[1]],d=hor?Math.abs(A[1]-B[1]):Math.abs(A[0]-B[0]);

  const outF=c<lo||c>hi;const nearP=(c<lo)?(hor?(B[0]<C[0]?B:C):(B[1]<C[1]?B:C)):(hor?(B[0]<C[0]?C:B):(B[1]<C[1]?C:B));

  const u=U();let ok=0,hint=0,err=0,sol=0;TASKS.forEach(t=>{const s=(u.st[t.id]||{}).s;if(s==='ok')ok++;else if(s==='hint')hint++;else if(s==='err')err++;else if(s==='sol')sol++});
  let h='<div class="top"><h1>📐 ОГЭ · №18 · Клетчатая бумага</h1><span class="sp"></span><span>👤 <b>'+DB.cur+'</b></span><button class="btn g sm" data-a="logout">Сменить</button><button class="btn g sm" data-a="teacher">'+(V1.teacher?'🚪 Выйти из режима учителя':'👩‍🏫 Учитель')+'</button><button class="btn g sm" data-a="theme">'+(DB.dark?'☀️':'🌙')+'</button></div><div class="wrap">';
  h+='<div class="tabs">'+[['tasks','📝 Задачи'],['facts','🎬 Сцены-факты'],['memo','🗒️ Памятка'],['rep','📊 Отчёт']].concat(V1.teacher?[['tch','👩‍🏫 Настройки']]:[]).map(x=>'<button class="tab'+(V1.tab===x[0]?' on':'')+'" data-a="tab" data-v="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>';
  if(V1.tab==='tasks'){
    h+='<div class="box" style="margin-top:0"><b>Прогресс: '+(ok+hint)+' из '+TASKS.length+' решено</b> &nbsp; ✅ '+ok+' · 🟡 '+hint+' · ❌ '+err+' · 👀 '+sol+'<div class="bar" style="margin-top:6px"><i style="width:'+Math.round((ok+hint)/TASKS.length*100)+'%"></i></div></div>';
    h+='<div class="filters"><button class="tab'+(V1.topic==='all'?' on':'')+'" data-a="topic" data-v="all">Все</button>'+Object.keys(TOPICS).map(k=>'<button class="tab'+(V1.topic===k?' on':'')+'" data-a="topic" data-v="'+k+'">'+TOPICS[k].n+'</button>').join('')+'<span class="sp"></span><select data-a="sort">'+[['topic','по темам'],['easy','сначала лёгкие'],['hard','сначала сложные'],['status','сначала новые']].map(x=>'<option value="'+x[0]+'"'+(V1.sort===x[0]?' selected':'')+'>'+x[1]+'</option>').join('')+'</select></div>';
    let list=TASKS.filter(t=>V1.topic==='all'||t.topic===V1.topic);
    if(V1.sort==='easy')list=list.slice().sort((a,b)=>a.star-b.star);
    if(V1.sort==='hard')list=list.slice().sort((a,b)=>b.star-a.star);
    if(V1.sort==='status')list=list.slice().sort((a,b)=>((u.st[a.id]||{s:'new'}).s==='new'?0:1)-((u.st[b.id]||{s:'new'}).s==='new'?0:1));
    h+='<div class="grid">'+list.map(t=>{const s=(u.st[t.id]||{s:'new'}).s,b=BADGE[s];
      return '<div class="card" style="--c:'+TOPICS[t.topic].c+'" data-a="open" data-id="'+t.id+'"><div class="in"><div class="ttl">№'+t.id+' · '+TOPICS[t.topic].n+'</div><div class="qq">'+t.q+'</div><div>'+'★'.repeat(t.star)+'☆'.repeat(3-t.star)+' <span class="badge" style="background:'+b[1]+';color:#fff">'+b[0]+'</span></div><div class="pv">'+render(t,-1)+'</div><div class="chips">'+t.facts.map(f=>'<span class="chip" style="--c:'+FACTS[f].col+'">'+FACTS[f].title+'</span>').join('')+'</div></div></div>'}).join('')+'</div>';
  }
  if(V1.tab==='facts')h+='<p>Сцены показывают факты отдельно от задач. Нажми на карточку и листай шаги.</p><div class="grid">'+Object.values(FACTS).map(f=>'<div class="card" style="--c:'+f.col+'" data-a="fact" data-id="'+f.id+'"><div class="in"><div class="ttl">🎬 '+f.title+'</div><div class="pv">'+render(f,f.steps.length-1)+'</div></div></div>').join('')+'</div>';
  if(V1.tab==='memo')h+='<p>Общая памятка. Нажми на стикер — запустится сцена.</p><div class="grid">'+Object.values(FACTS).map(f=>'<div class="stk" style="--c:'+f.col+'" data-a="fact" data-id="'+f.id+'"><h4>'+f.title+'</h4><div class="pv">'+render(f,f.steps.length-1)+'</div><div class="bd2">'+f.brief+'</div></div>').join('')+'</div>';
  if(V1.tab==='rep'){
    h+='<div class="box"><table><tr><th>Тема</th><th>✅</th><th>🟡</th><th>❌</th><th>👀</th><th>⚪</th></tr>';
    Object.keys(TOPICS).forEach(k=>{const c={ok:0,hint:0,err:0,sol:0,new:0};TASKS.filter(t=>t.topic===k).forEach(t=>c[(u.st[t.id]||{s:'new'}).s]++);h+='<tr><td>'+TOPICS[k].n+'</td><td>'+c.ok+'</td><td>'+c.hint+'</td><td>'+c.err+'</td><td>'+c.sol+'</td><td>'+c.new+'</td></tr>'});
    h+='</table><div class="row"><button class="btn" data-a="copy">📋 Скопировать отчёт</button></div></div>';
  }
  if(V1.tab==='tch'&&V1.teacher){
    const T=DB.teacher;const tg=(k,t)=>'<label style="display:block;margin:8px 0"><input type="checkbox" data-a="tset" data-k="'+k+'" '+(T[k]?'checked':'')+'> '+t+'</label>';
    h+='<div class="box"><h3>Настройки для ученика</h3>'+tg('calc','Разрешить калькулятор')+tg('solBefore','Разрешить смотреть разбор до ответа')+tg('hints','Разрешить подсказки')+tg('showAns','Показывать ответ в задаче (в режиме учителя)')+'<div class="row"><button class="btn g" data-a="pin">🔑 Сменить PIN</button><button class="btn wr" data-a="reset">Сбросить прогресс ученика «'+DB.cur+'»</button></div></div>';
    h+='<div class="box"><h3>Все ученики</h3><table><tr><th>Имя</th><th>Решено</th><th>Подсказок</th><th>Ошибок</th></tr>'+Object.keys(DB.users).map(n=>{const st=DB.users[n].st;let a=0,b=0,c=0;Object.keys(st).forEach(i=>{if(st[i].s==='ok'||st[i].s==='hint')a++;b+=st[i].h||0;c+=st[i].t||0});return '<tr><td>'+n+'</td><td>'+a+'/'+TASKS.length+'</td><td>'+b+'</td><td>'+c+'</td></tr>'}).join('')+'</table></div>';
  }
  app.innerHTML=h+'</div>';
}
function reportText(){
  const u=U();let t='Отчёт по №18 — '+DB.cur+'\n';
  Object.keys(TOPICS).forEach(k=>{const c={ok:0,hint:0,err:0,sol:0,new:0};TASKS.filter(x=>x.topic===k).forEach(x=>c[(u.st[x.id]||{s:'new'}).s]++);t+=TOPICS[k].n+': сам '+c.ok+', с помощью '+c.hint+', ошибки '+c.err+', смотрел '+c.sol+', не начато '+c.new+'\n'});
  return t;
}

/* ===== доска ===== */
function openBoard(kind,id){
  const T=kind==='task'?TASKS.find(x=>x.id==id):FACTS[id];
  const root=document.createElement('div');root.className='ov';
  const b={kind:kind,T:T,root:root,k:kind==='fact'?0:-1,h:0,timer:null,$:s=>root.querySelector(s)};
  root._b=b;document.body.appendChild(root);build(b);
}
function build(b){
  const T=b.T,isT=b.kind==='task';
  const tt=isT?'№'+T.id+' · '+TOPICS[T.topic].n:'🎬 '+T.title;
  b.root.innerHTML='<div class="bd"><div class="bt"><b>'+tt+'</b><span class="sp"></span>'+(isT&&calcOK()?'<button class="btn g sm" data-a="calc">🧮 Калькулятор</button>':'')+'<button class="btn g sm" data-a="close">✕ Закрыть</button></div><div class="bb"><div class="bl"><div class="fig" data-r="fig"></div><div class="chips" data-r="chips"></div></div><div class="br" data-r="pan"></div></div></div>';
  const ctl='<div class="ctl"><button class="btn g sm" data-a="prev">◀ Назад</button><button class="btn sm" data-a="next">Далее ▶</button><button class="btn or sm" data-a="auto">⏵ Авто</button><button class="btn g sm" data-a="redo">↺ Заново</button></div>';
  let p='';
  if(isT){
    p+='<div class="qh">'+T.q+'</div>';
    if(V1.teacher&&DB.teacher.showAns)p+='<div class="hint">Ответ (для учителя): <b>'+fm(T.ans)+T.unit+'</b></div>';
    p+='<div class="ans"><input data-r="ai" placeholder="Ответ'+(T.unit?' ('+T.unit+')':'')+'" inputmode="decimal"><button class="btn ok" data-a="check">Проверить</button></div><div class="msg" data-r="msg"></div>';
    p+='<div class="row">'+(DB.teacher.hints||V1.teacher?'<button class="btn or sm" data-a="hint" data-r="hb">💡 Подсказка (0/3)</button>':'<span class="badge">подсказки отключены учителем</span>')+'<button class="btn g sm" data-a="solve">▶ Показать разбор</button><button class="btn g sm" data-a="full">📄 Решение целиком</button></div><div data-r="hints"></div>';
    p+='<div data-r="nbw" style="display:none"><div class="nb" data-r="nb"></div>'+ctl+'</div>';
  }else{
    p+='<div class="qh">'+T.brief+'</div><div class="nb" data-r="nb"></div>'+ctl;
  }
  b.$('[data-r=pan]').innerHTML=p;
  upd(b);
}
function upd(b){
  const T=b.T,isT=b.kind==='task';
  b.$('[data-r=fig]').innerHTML=render(T,b.k,{foc:isT&&b.h>=1&&b.k<0});
  const fs=isT?T.facts:[];
  b.$('[data-r=chips]').innerHTML=fs.length?'<div class="lbl">🗒️ Нужные факты (нажми — запустится сцена):</div>'+fs.map(f=>'<button class="chip" style="--c:'+FACTS[f].col+'" data-a="fact" data-id="'+f+'">🎬 '+FACTS[f].title+'</button>').join(''):'';
  const nb=b.$('[data-r=nb]');
  if(nb){let s='';for(let i=0;i<=b.k&&i<T.steps.length;i++)s+='<div class="stp'+(i===b.k?' cur':'')+'"><span class="no">'+(i+1)+'</span>'+T.steps[i].t+'</div>';nb.innerHTML=s;nb.scrollTop=nb.scrollHeight}
  const w=b.$('[data-r=nbw]');if(w)w.style.display=b.k>=0?'block':'none';
}
function stopAuto(b){if(b.timer){clearInterval(b.timer);b.timer=null}}
function parseAns(s){s=String(s).trim().replace(/\s+/g,'').replace(/,/g,'.').replace(/−/g,'-');if(!s)return NaN;if(s.indexOf('/')>0){const a=s.split('/');return parseFloat(a[0])/parseFloat(a[1])}return Number(s)}
function act(a,d,e){
  const root=e.target.closest('.ov'),b=root&&root._b;
  switch(a){
    case 'login':{const n=$('#nm').value.trim();if(!n)return;DB.cur=n;if(!DB.users[n])DB.users[n]={st:{}};save();main();return}
    case 'pick':DB.cur=d.n;save();main();return;
    case 'logout':DB.cur='';save();main();return;
    case 'theme':DB.dark=!DB.dark;save();main();return;
    case 'teacher':if(V1.teacher){V1.teacher=false;if(V1.tab==='tch')V1.tab='tasks'}else{const p=prompt('PIN учителя (по умолчанию 1234):');if(p===DB.teacher.pin)V1.teacher=true;else if(p!==null)toast('Неверный PIN')}main();return;
    case 'tab':V1.tab=d.v;main();return;
    case 'topic':V1.topic=d.v;main();return;
    case 'tset':DB.teacher[d.k]=e.target.checked;save();return;
    case 'pin':{const p=prompt('Новый PIN:');if(p){DB.teacher.pin=p;save();toast('PIN изменён')}return}
    case 'reset':if(confirm('Сбросить прогресс «'+DB.cur+'»?')){U().st={};save();main()}return;
    case 'copy':{const t=reportText();if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('Скопировано'));else prompt('Скопируйте отчёт:',t);return}
    case 'open':openBoard('task',d.id);return;
    case 'fact':openBoard('fact',d.id);return;
    case 'calc':toggleCalc();return;
  }
  if(!b)return;
  if(a==='close'){stopAuto(b);root.remove();if(V1.tab)main();return}
  const T=b.T,n=T.steps.length;
  if(a==='next'){b.k=Math.min(n-1,b.k+1);upd(b);return}
  if(a==='prev'){b.k=Math.max(0,b.k-1);upd(b);return}
  if(a==='redo'){stopAuto(b);b.k=0;upd(b);return}
  if(a==='auto'){if(b.timer){stopAuto(b);return}if(b.k>=n-1)b.k=0;upd(b);b.timer=setInterval(()=>{if(b.k>=n-1){stopAuto(b);return}b.k++;upd(b)},2800);return}
  if(a==='hint'){const s=ST(T.id);if(b.h>=3)return;b.h++;s.h++;save();
    b.$('[data-r=hints]').innerHTML=T.hints.slice(0,b.h).map((x,i)=>'<div class="hint">Подсказка '+(i+1)+': '+x+'</div>').join('');
    b.$('[data-r=hb]').textContent='💡 Подсказка ('+b.h+'/3)';upd(b);return}
  if(a==='solve'){const s=ST(T.id);if(s.s!=='ok'&&s.s!=='hint'&&!DB.teacher.solBefore&&!V1.teacher){toast('🔒 Разбор откроется после ответа');return}
    if(s.s!=='ok'&&s.s!=='hint'){s.s='sol';s.v=1;save()}b.k=0;upd(b);return}
  if(a==='full'){const s=ST(T.id);if(s.s!=='ok'&&s.s!=='hint'&&!DB.teacher.solBefore&&!V1.teacher){toast('🔒 Решение откроется после ответа');return}
    if(s.s!=='ok'&&s.s!=='hint'){s.s='sol';s.v=1;save()}
    const o=document.createElement('div');o.className='ov';o._b={kind:'full',T:T,root:o,timer:null};
    const lines=T.steps.map(x=>x.t.replace(/\p{Extended_Pictographic}\uFE0F?/gu,'').trim());
    o.innerHTML='<div class="bd" style="max-width:800px;height:auto;max-height:100%"><div class="bt"><b>Решение целиком · №'+T.id+'</b><span class="sp"></span><button class="btn g sm" data-a="close">✕</button></div><div class="br fl" style="margin:10px;overflow:auto"><p><b class="r">Дано:</b> '+T.given+'</p><p><b class="r">Найти:</b> '+T.q+'</p><p><b class="r">Решение.</b></p><ol>'+lines.map(l=>'<li>'+l+'</li>').join('')+'</ol><p><b class="r">Ответ:</b> <span class="g u">'+fm(T.ans)+T.unit+'</span></p></div></div>';
    document.body.appendChild(o);return}
  if(a==='check'){const s=ST(T.id),inp=b.$('[data-r=ai]'),m=b.$('[data-r=msg]');const x=parseAns(inp.value);
    if(isNaN(x)){m.innerHTML='<span class="r">Введи число (можно дробь вида 3/4 или десятичную через запятую)</span>';return}
    if(Math.abs(x-T.ans)<0.0011){
      if(s.s!=='ok'&&s.s!=='hint')s.s=(s.t===0&&s.h===0&&!s.v)?'ok':'hint';
      save();m.innerHTML='<span class="g">✅ Верно! '+(s.s==='ok'?'Решено самостоятельно 🎉':'Решено — молодец!')+'</span>';
    }else{
      s.t++;if(s.s!=='ok'&&s.s!=='hint')s.s='err';save();
      m.innerHTML='<span class="r">❌ Не совпало. Попытка '+s.t+'.'+(s.t>=2?' Возьми подсказку 💡':'')+'</span>';
    }
    return}
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.tagName==='SELECT'||(t.tagName==='INPUT'&&t.type==='checkbox'))return;act(t.dataset.a,t.dataset,e)});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.a==='sort'){V1.sort=t.value;main()}else if(t.dataset&&t.dataset.a==='tset')act('tset',t.dataset,e)});
document.addEventListener('keydown',e=>{const ovs=document.querySelectorAll('.ov');const r=ovs[ovs.length-1];
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.r==='ai'){act('check',{},{target:e.target});return}
  if(!r||!r._b||r._b.kind==='full'||(e.target.tagName==='INPUT'))return;
  if(e.key==='ArrowRight')act('next',{},{target:r});if(e.key==='ArrowLeft')act('prev',{},{target:r});if(e.key==='Escape')act('close',{},{target:r})});
/* калькулятор */
function toggleCalc(){
  const ex=$('.calc');if(ex){ex.remove();return}
  const d=document.createElement('div');d.className='calc';
  const keys=['7','8','9','/','4','5','6','*','1','2','3','-','0','.','(',')','sqrt(','+','C','='];
  d.innerHTML='<input id="cd" readonly value=""><div class="k">'+keys.map(k=>'<button data-k="'+k+'">'+(k==='sqrt('?'√':k==='*'?'×':k==='/'?'÷':k)+'</button>').join('')+'</div>';
  document.body.appendChild(d);
  d.addEventListener('click',e=>{const k=e.target.dataset.k;if(k==null)return;const i=d.querySelector('#cd');
    if(k==='C')i.value='';else if(k==='='){const s=i.value;if(!/^[0-9+\-*\/().\s]*$/.test(s.replace(/sqrt/g,''))){i.value='ошибка';return}
      try{const v=Function('"use strict";return ('+s.replace(/sqrt\(/g,'Math.sqrt(')+')')();i.value=String(Math.round(v*1e6)/1e6)}catch(x){i.value='ошибка'}}
    else{if(i.value==='ошибка')i.value='';i.value+=k}});
}
main();
</script></body></html>
