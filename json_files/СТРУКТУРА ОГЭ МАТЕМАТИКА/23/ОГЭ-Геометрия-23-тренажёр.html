function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2200);}
function modal(h){$('#mr').innerHTML=`<div class="mod"><div class="mbox">${h}</div></div>`;}
const closeModal=()=>{$('#mr').innerHTML=''};
/* ===== вход ===== */
function viewLogin(){cur.name=null;cur.n=null;const pf=Object.values(DB.students);
 app().innerHTML=`<div class="login"><div class="lbox"><div class="logo">📐</div><h1>ОГЭ · Геометрия №23</h1><div class="sub">39 задач с анимированными чертежами, подсказками и оформлением как на экзамене</div>
 <form id="lf"><input id="nm" placeholder="Введи своё имя" maxlength="40" autocomplete="off" value="${esc(DB.last||'')}"><button class="btn pri" style="width:100%;justify-content:center;padding:13px;font-size:18px">Начать ➜</button></form>
 ${pf.length?`<div class="prof">${pf.map(s=>`<button class="btn sm" data-n="${esc(s.name)}">👤 ${esc(s.name)} <small>${ORDER.filter(i=>solved(s.tasks[i])).length}/${ORDER.length}</small></button>`).join('')}</div>`:''}
 <div class="lfoot"><button class="btn ghost sm" id="th">${DB.theme==='dark'?'☀️ Светлая':'🌙 Тёмная'} тема</button><button class="btn ghost sm" id="gal0">🎬 Сцены</button></div></div></div>`;
 $('#lf').onsubmit=e=>{e.preventDefault();const v=$('#nm').value.trim();if(v)enter(v);};
 $$('.prof button').forEach(b=>b.onclick=()=>enter(b.dataset.n));
 $('#th').onclick=()=>{DB.theme=DB.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=DB.theme;persist();viewLogin();};
 $('#gal0').onclick=()=>{cur.name='_гость';DB.students['_гость']=DB.students['_гость']||{name:'_гость',tasks:{}};viewScenes();};}
function enter(name){if(!DB.students[name])DB.students[name]={name,tasks:{},cur:null};DB.last=name;cur.name=name;persist();
 let n=stu().cur&&TASK[stu().cur]?stu().cur:ORDER[0];if(solved(X(n))){n=nextUn(n)||n;}openTask(n);}
function nextUn(from){const i=ORDER.indexOf(from);for(let k=1;k<=ORDER.length;k++){const n=ORDER[(i+k)%ORDER.length];if(!solved(X(n)))return n;}return null;}
function counts(){const c={done:0,total:ORDER.length};ORDER.forEach(n=>{if(solved(X(n)))c.done++;});return c;}
function topbar(){const c=counts();return`<div class="top"><div class="ttl">📐 ОГЭ №23</div><span class="ptxt">👤 ${esc(cur.name)}</span><div class="pbar"><i style="width:${c.done/c.total*100}%"></i></div><span class="ptxt">${c.done}/${c.total}</span>
 <div class="tbtns"><button class="btn sm" id="bTr">✏️ Тренажёр</button><button class="btn sm" id="bScn">🎬 Сцены</button><button class="btn sm" id="bMemo">📒 Памятка</button><button class="btn sm pri" id="bRep">📄 Отчёт</button><button class="btn sm ghost" id="bTh">🌓</button><button class="btn sm ghost" id="bOut">🚪</button></div></div>`;}
function bindTop(){$('#bTr').onclick=()=>{tick();openTask(cur.n||ORDER[0]);};$('#bScn').onclick=()=>{tick();viewScenes();};$('#bMemo').onclick=memo;$('#bRep').onclick=report;
 $('#bTh').onclick=()=>{DB.theme=DB.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=DB.theme;persist();};$('#bOut').onclick=()=>{tick();viewLogin();};}
function sidebar(){return`<aside class="side">${TOPICS.map(tp=>{const ns=ORDER.filter(n=>TASK[n].topic===tp.id),d=ns.filter(n=>solved(X(n))).length;
 return`<div class="tp"><div class="tph" data-tp="${tp.id}"><span>${tp.icon}</span>${tp.name}<span class="done">${d}/${ns.length}</span></div><div class="mini"><i style="width:${d/ns.length*100}%"></i></div>
 <div class="chips">${ns.map(n=>{const x=X(n);return`<button class="chip l${TASK[n].lv} ${solved(x)?x.st:''} ${n===cur.n?'cur':''}" data-id="${n}" title="${'★'.repeat(TASK[n].lv)}">${n}</button>`}).join('')}</div></div>`}).join('')}
 <div class="legend"><span><b style="background:var(--ok)"></b>сам</span><span><b style="background:#7bd3a7"></b>с ошибками</span><span><b style="background:#ffd666"></b>с подсказкой</span><span><b style="background:#ffb27a"></b>по решению</span></div><div class="legend">Полоска под номером: зелёная — лёгкая, жёлтая — средняя, красная — сложная</div></aside>`;}
function openTask(id){tick();cur.n=id;cur.since=Date.now();const s=stu();s.cur=id;persist();const t=TASK[id],x=X(id),tp=TOPICS.find(q=>q.id===t.topic),ix=ORDER.indexOf(id)+1,sv=solved(x);
 app().innerHTML=topbar()+`<div class="wrap">${sidebar()}<main><div class="card"><div class="chead"><span class="num">Задача ${ix} из ${ORDER.length} · №${id}</span><span class="lvl">${'★'.repeat(t.lv)}${'☆'.repeat(3-t.lv)}</span><span class="badge tpc">${tp.name}</span><span class="badge">${t.tyName}</span></div>
 <div class="qtext">${esc(t.q)}</div><div class="figbox">${figure(t,0,false)}</div>
 <form class="ans" id="af"><label>Ответ:</label><input id="ai" autocomplete="off" placeholder="число или 4√5" ${sv?'disabled value="'+esc(t.ansT)+'" class="good"':''}>${sv?`<span class="btn ok">✓ ${ST[x.st]}</span><button type="button" class="btn pri" id="bNext">Дальше ➜</button>`:'<button class="btn pri">Проверить</button>'}</form>
 <div class="fb" id="fb"></div>
 <div class="help"><button class="btn sm" id="hH">💡 Подсказка</button><button class="btn sm" id="hS">👣 Шаг решения</button><button class="btn sm" id="hSc">🎬 Сцена</button><button class="btn sm" id="hF">📖 Решение целиком</button>${sv?'<button class="btn sm" id="hSib">🔁 Аналог</button>':'<button class="btn sm ghost" id="hSk">⏭ Пропустить</button>'}<span class="note">${sv?'':'Подсказки можно брать — учитель увидит их в отчёте 🙂'}</span></div>
 <div class="hintzone" id="hz"></div></div></main></div>`;
 bindTop();$$('.chip').forEach(b=>b.onclick=()=>openTask(b.dataset.id));
 $$('.tph').forEach(h=>h.onclick=()=>{const ns=ORDER.filter(n=>TASK[n].topic===h.dataset.tp);openTask(ns.find(n=>!solved(X(n)))||ns[0]);});
 let hn=0,sn=0;const hz=$('#hz');
 const rend=()=>{hz.innerHTML=t.hints.slice(0,hn).map((h,i)=>`<div class="hz">💡 <b>Подсказка ${i+1}:</b> ${esc(h)}</div>`).join('')+t.steps.slice(0,sn).map((s,i)=>`<div class="hz st">👣 <b>Шаг ${i+1}.</b> ${esc(s.t)}${s.f?'<div class="fl">'+s.f.map(esc).join('<br>')+'</div>':''}</div>`).join('');};
 $('#hH').onclick=()=>{if(hn<t.hints.length)hn++;if(!sv&&!x.hints){x.hints=1;persist();}rend();if(hn>=t.hints.length)$('#hH').textContent='💡 Подсказки закончились';};
 $('#hS').onclick=()=>{if(sn<t.steps.length)sn++;if(!sv&&!x.steps){x.steps=1;persist();}rend();};
 $('#hSc').onclick=()=>{if(!sv&&!x.scene){x.scene=1;persist();}openBoard(id,{train:true});};
 $('#hF').onclick=()=>{if(!sv){x.full=1;persist();}openBoard(id,{train:true,full:true});};
 if(sv){$('#bNext').onclick=goNext;$('#hSib').onclick=()=>{const sb=ORDER.find(k=>k!==id&&TASK[k].ty===t.ty);if(sb)openTask(sb);};}
 else{$('#hSk').onclick=()=>{const nx=nextUn(id);if(nx)openTask(nx);};$('#af').onsubmit=e=>{e.preventDefault();check();};setTimeout(()=>{const i=$('#ai');if(i&&innerWidth>860)i.focus();},50);}}
function goNext(){const n=nextUn(cur.n);if(n)openTask(n);else viewDone();}
function check(){const t=TASK[cur.n],x=X(cur.n),raw=$('#ai').value;if(!raw.trim())return;let ok;
 if(Array.isArray(t.ans)){const nums=(raw.match(/\d+(?:[.,]\d+)?/g)||[]).map(s=>+s.replace(',','.')).sort((a,b)=>a-b),A=t.ans.slice().sort((a,b)=>a-b);ok=nums.length===A.length&&A.every((v,i)=>Math.abs(v-nums[i])<.011);}
 else{const v=parseNum(raw);ok=!isNaN(v)&&Math.abs(v-t.ans)<=.011;}
 const fb=$('#fb');
 if(ok){tick();x.st=x.full||x.steps?'sol':x.hints||x.scene?'hint':x.tries?'err':'ok';persist();openTask(cur.n);$('#fb').className='fb good';$('#fb').innerHTML='🎉 Верно! Можно посмотреть оформление на доске: кнопка «🎬 Сцена».';}
 else{x.tries++;persist();fb.className='fb bad';fb.textContent=x.tries>=2?'Пока неверно. Возьми подсказку 💡 или посмотри сцену 🎬':'Неверно, попробуй ещё раз.';}}
function viewDone(){const c={ok:0,err:0,hint:0,sol:0};ORDER.forEach(n=>c[X(n).st]++);
 app().innerHTML=topbar()+`<div class="wrap" style="display:block;max-width:700px"><div class="card" style="text-align:center"><div style="font-size:56px">🏆</div><h2>Все задачи пройдены!</h2><p>Сам: ${c.ok} · с ошибками: ${c.err} · с подсказкой: ${c.hint} · по решению: ${c.sol}</p><button class="btn pri" id="rp">📄 Отчёт учителю</button></div></div>`;bindTop();$('#rp').onclick=report;}
/* ===== доска (сцена) ===== */
let BS=null,bkey=null;
function fullText(T){return`Задача №${T.id}\n${T.q}\n\nДано:\n${T.given.map(g=>'  '+g).join('\n')}\nНайти: ${T.find}\n\nРешение:\n${T.steps.map((s,i)=>`${i+1}) ${s.t}${s.f?'\n     '+s.f.join('\n     '):''}`).join('\n')}\n\nОтвет: ${T.ansT}`;}
function openBoard(id,o){o=o||{};const T=TASK[id];BS={T,i:0,full:!!o.full,train:!!o.train,timer:null};
 $('#mr').innerHTML=`<div class="ov"><div class="board"><div class="bh"><b>🎬 Задача №${id}</b><span class="badge">${T.tyName}</span><button class="btn sm x" id="bx">✕ Закрыть</button></div>
 <div class="bb"><div class="bl" id="bfig"></div><div class="br" id="bright"></div></div>
 <div class="bf"><button class="btn" id="b0">⏮ Заново</button><button class="btn" id="b1">◀ Назад</button><button class="btn pri" id="b2">Далее ▶</button><button class="btn" id="b3">⏵ Авто</button><span class="sp"></span><button class="btn" id="b4">📋 Решение целиком</button></div></div></div>`;
 $('#bx').onclick=closeBoard;$('#b0').onclick=()=>{stopA();BS.full=false;BS.i=0;draw(true)};$('#b1').onclick=()=>{stopA();if(BS.full){BS.full=false;BS.i=T.steps.length-1;}else if(BS.i>0)BS.i--;draw(false)};
 $('#b2').onclick=()=>{if(BS.full)return;if(BS.i<T.steps.length-1){BS.i++;draw(true)}else stopA();};$('#b3').onclick=()=>{if(BS.timer){stopA();draw(false);return;}BS.full=false;BS.timer=setInterval(()=>{if(BS.i<T.steps.length-1){BS.i++;draw(true)}else stopA();},3200);draw(false);};
 $('#b4').onclick=()=>{stopA();BS.full=!BS.full;if(BS.full&&BS.train&&!solved(X(id))){const x=X(id);x.full=1;persist();}draw(false)};
 bkey=e=>{if(e.key==='Escape')closeBoard();else if(e.key==='ArrowRight')$('#b2').click();else if(e.key==='ArrowLeft')$('#b1').click();};document.addEventListener('keydown',bkey);draw(true);}
function stopA(){if(BS&&BS.timer){clearInterval(BS.timer);BS.timer=null;}}
function closeBoard(){stopA();document.removeEventListener('keydown',bkey);closeModal();BS=null;}
function draw(anim){const T=BS.T,n=T.steps.length,last=BS.i>=n-1;
 $('#bfig').innerHTML=BS.full?figure(T,n-1,false):figure(T,BS.i,anim);
 const dano=`<div class="dano"><b>Дано:</b> ${T.given.map(esc).join('; ')}<br><b>Найти:</b> ${esc(T.find)}</div>`;
 if(BS.full){$('#bright').innerHTML=`<div class="sheet"><h3>Задача №${esc(T.id)}</h3><p><b>Дано:</b></p>${T.given.map(g=>`<p class="ln">${esc(g)}</p>`).join('')}<p><b>Найти:</b> ${esc(T.find)}</p><p><b>Решение.</b></p>${T.steps.map((s,i)=>`<p class="ln">${i+1}) ${esc(s.t)}</p>${(s.f||[]).map(f=>`<p class="ln" style="margin-left:50px">${esc(f)}</p>`).join('')}`).join('')}<p><b>Ответ: ${esc(T.ansT)}</b></p></div>
 <div class="row"><button class="btn" id="cp">📋 Копировать</button><button class="btn" id="pr">🖨 Печать</button></div>`;
  $('#cp').onclick=()=>{try{navigator.clipboard.writeText(fullText(T));toast('Скопировано')}catch(e){toast('Не удалось скопировать')}};$('#pr').onclick=()=>window.print();}
 else{$('#bright').innerHTML=dano+T.steps.slice(0,BS.i+1).map((s,k)=>`<div class="bs ${k===BS.i?'cur':''}"><b>Шаг ${k+1}.</b> ${esc(s.t)}${s.f?`<div class="fl">${s.f.map(esc).join('<br>')}</div>`:''}</div>`).join('')+(last?`<div class="ansbox">Ответ: ${esc(T.ansT)}</div>`:'');$('#bright').scrollTop=1e5;}
 $('#b1').disabled=!BS.full&&BS.i===0;$('#b2').disabled=BS.full||last;$('#b3').textContent=BS.timer?'⏸ Пауза':'⏵ Авто';$('#b4').textContent=BS.full?'◀ К шагам':'📋 Решение целиком';$('#b4').classList.toggle('pulse',last&&!BS.full);
 if(BS.full)$('#b4').onclick=()=>{BS.full=false;BS.i=n-1;draw(false)};else $('#b4').onclick=()=>{stopA();BS.full=true;if(BS.train&&!solved(X(T.id))){X(T.id).full=1;persist();}draw(false)};}
/* ===== сцены ===== */
function viewScenes(){const guest=cur.name==='_гость';
 app().innerHTML=(guest?`<div class="top"><div class="ttl">🎬 Сцены</div><button class="btn sm" id="bk">← Назад</button></div>`:topbar())+`<div class="wrap" style="display:block;max-width:1300px"><div class="gal"><p class="note">Каждая сцена строит чертёж по шагам, справа записывается решение. В конце — кнопка «Решение целиком» с оформлением как на экзамене. Нажми номер задачи.</p>
 ${TOPICS.map(tp=>{const tys=[...new Set(ORDER.filter(n=>TASK[n].topic===tp.id).map(n=>TASK[n].ty))];return`<h2>${tp.icon} ${tp.name}</h2><div class="gg">${tys.map(ty=>{const ids=ORDER.filter(n=>TASK[n].ty===ty),T=TASK[ids[0]];return`<div class="gc"><div class="th">${figure(T,T.steps.length-1,false)}</div><b>${T.tyName}</b><div class="chips" style="margin-top:6px">${ids.map(i=>`<button class="chip l${TASK[i].lv}" data-b="${i}">№${i}</button>`).join('')}</div></div>`}).join('')}</div>`}).join('')}</div></div>`;
 if(guest)$('#bk').onclick=viewLogin;else bindTop();$$('[data-b]').forEach(b=>b.onclick=()=>openBoard(b.dataset.b,{}));}
/* ===== памятка и отчёт ===== */
function memo(){modal(`<h2>📒 Памятка</h2><ul><li><b>Прямоугольный треугольник:</b> c² = a² + b²; S = ½ab = ½·c·h; h = ab/c; катет² = гипотенуза · проекция; h² = произведение проекций.</li>
<li><b>Параллелограмм:</b> биссектриса угла отсекает равнобедренный треугольник; P = 2(a + b); накрест лежащие углы при параллельных равны.</li>
<li><b>Ромб:</b> стороны равны; диагонали ⊥, делят друг друга и углы пополам; высоту ищем из прямоугольного треугольника.</li>
<li><b>Подобие:</b> признак «по двум углам»; прямая ∥ стороне отсекает подобный треугольник; AM : MC = AB : CD при AB ∥ CD.</li>
<li><b>Трапеция:</b> средняя линия = (a + b)/2; отрезок между серединами диагоналей = (a − b)/2; углы при боковой стороне в сумме 180°; проводи высоты.</li>
<li><b>Окружность:</b> перпендикуляр из центра делит хорду пополам, R² = d² + (l/2)²; радиус ⊥ касательной; угол на диаметр — 90°; вписанный четырёхугольник: сумма противоположных углов 180°.</li>
<li><b>Вписанный угол</b> = ½ дуги; <b>теорема синусов:</b> a / sin A = 2R. sin30° = ½, sin45° = √2/2, sin60° = √3/2.</li></ul><div class="row"><button class="btn pri" id="mc">Закрыть</button></div>`);$('#mc').onclick=closeModal;}
function report(){tick();const s=stu();const rows=ORDER.map(n=>{const x=X(n);return`<tr><td>№${n}</td><td>${solved(x)?ST[x.st]:'—'}</td><td>${x.tries||0}</td><td>${x.hints?'да':''}</td><td>${x.steps||x.full?'да':''}</td><td>${x.scene?'да':''}</td><td>${Math.round(x.time||0)} c</td></tr>`}).join('');
 const c=counts();modal(`<h2>📄 Отчёт: ${esc(s.name)}</h2><p>Решено: <b>${c.done} из ${c.total}</b></p><table><tr><th>Задача</th><th>Итог</th><th>Ошибок</th><th>Подсказка</th><th>Решение</th><th>Сцена</th><th>Время</th></tr>${rows}</table>
 <div class="row"><button class="btn pri" id="rc">📋 Копировать</button><button class="btn" id="rr">🧹 Сбросить прогресс</button><button class="btn ghost" id="rx">Закрыть</button></div>`);
 $('#rx').onclick=closeModal;$('#rc').onclick=()=>{const t=`ОГЭ №23 · ${s.name} · решено ${c.done}/${c.total}\n`+ORDER.map(n=>{const x=X(n);return`№${n}: ${solved(x)?ST[x.st]:'—'}, ошибок ${x.tries||0}, подсказка ${x.hints?'да':'нет'}, решение ${x.steps||x.full?'да':'нет'}, ${Math.round(x.time||0)} c`}).join('\n');try{navigator.clipboard.writeText(t);toast('Скопировано')}catch(e){toast('Не удалось')}};
 $('#rr').onclick=()=>{if(confirm('Удалить весь прогресс «'+s.name+'»?')){s.tasks={};s.cur=null;persist();closeModal();openTask(ORDER[0]);}};}
viewLogin();
</script></body></html>
