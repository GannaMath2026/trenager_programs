<script>
/* ===== Формулы: поддержка {a/b}, √{}, ^{} ===== */
function tok(s){
  const out=[];let buf='';
  const flush=()=>{if(buf){out.push({k:'t',s:buf});buf='';}};
  const match=(i)=>{let d=0;for(let j=i;j<s.length;j++){if(s[j]==='{')d++;else if(s[j]==='}'){d--;if(d===0)return j;}}return s.length-1;};
  for(let i=0;i<s.length;i++){
    const ch=s[i];
    if(ch==='√'&&s[i+1]==='{'){flush();const e=match(i+1);out.push({k:'sq',s:s.slice(i+2,e)});i=e;continue;}
    if(ch==='^'&&s[i+1]==='{'){flush();const e=match(i+1);out.push({k:'sup',s:s.slice(i+2,e)});i=e;continue;}
    if(ch==='_'&&s[i+1]==='{'){flush();const e=match(i+1);out.push({k:'sub',s:s.slice(i+2,e)});i=e;continue;}
    if(ch==='{'){
      const e=match(i);const inner=s.slice(i+1,e);
      let d=0,cut=-1;for(let j=0;j<inner.length;j++){const c=inner[j];if(c==='{')d++;else if(c==='}')d--;else if(c==='/'&&d===0){cut=j;break;}}
      flush();
      if(cut>=0)out.push({k:'fr',n:inner.slice(0,cut),d:inner.slice(cut+1)});
      else out.push({k:'g',s:inner});
      i=e;continue;
    }
    buf+=ch;
  }
  flush();return out;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function M(s){
  if(s==null)return '';
  return tok(String(s)).map(t=>{
    if(t.k==='t')return t.s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    if(t.k==='sq')return '<span class="sq"><span class="rd">√</span><span class="ov">'+M(t.s)+'</span></span>';
    if(t.k==='sup')return '<sup>'+M(t.s)+'</sup>';
    if(t.k==='sub')return '<sub>'+M(t.s)+'</sub>';
    if(t.k==='fr')return '<span class="fr"><span class="nu">'+M(t.n)+'</span><span class="de">'+M(t.d)+'</span></span>';
    return M(t.s);
  }).join('');
}

  {id:'root',name:'С корнями',icon:'√'},
  {id:'sq0',name:'Сумма квадратов = 0',icon:'⬜'},
  {id:'pow',name:'Степени и одинаковые скобки',icon:'⚡'},
  {id:'ineq',name:'Неравенства с дробями',icon:'⚖️'},
  {id:'ineq2',name:'Неравенства с квадратами',icon:'📊'}
];

// helper: проверка корней для уравнений/неравенств (не для frac)
function chk(t,x){
  if(!t.roots||t.topic==='frac')return null;
  return t.roots.map(r=>{
    const ok=t.domainFn(r);
    return {r:r,ok:ok,txt:`x = ${String(r).replace('-','−')} → ${ok?'подходит ✓':'вне ОДЗ ✗'}`};
  });
}

/* ===== Луч ОДЗ: на бесконечностях — горизонтально, не опускается ===== */
function odzSVG(odzDesc, domainFn, roots, W){
  W=W||560; const H=140, pad=40, yl=58;
  const mn=-6, mx=6;
  const X=v=>pad+(v-mn)/(mx-mn)*(W-2*pad);
  let o=`<line x1="${pad-14}" y1="${yl}" x2="${W-pad+14}" y2="${yl}" stroke="#1d3fa6" stroke-width="2.2"/>`;
  o+=`<path d="M${W-pad+8},${yl} l-10,-5 v10z" fill="#1d3fa6"/>`;
  o+=`<text x="${W-pad+4}" y="${yl+30}" font-size="18" font-family="Caveat,cursive" fill="#1d3fa6">x</text>`;
  for(let v=mn;v<=mx;v++){
    const x=X(v);
    o+=`<line x1="${x}" y1="${yl-6}" x2="${x}" y2="${yl+6}" stroke="#1d3fa6" stroke-width="1.5"/>`;
    o+=`<text x="${x}" y="${yl+24}" font-size="14" font-family="Caveat,cursive" text-anchor="middle" fill="${v===0?'#1d3fa6':'#555'}">${v}</text>`;
  }
  const segs=[];let inDom=false,start=mn;
  for(let i=0;i<=400;i++){
    const v=mn+(mx-mn)*i/400;const ok=domainFn(v);
    if(ok&&!inDom){start=v;inDom=true;}
    if(!ok&&inDom){segs.push([start,v]);inDom=false;}
  }
  if(inDom)segs.push([start,mx]);
  segs.forEach(([a,b])=>{
    const x1=X(a),x2=X(b),mid=(x1+x2)/2;
    const isL=a<=mn+1e-9, isR=b>=mx-1e-9;
    const lift=26;
    let d;
    // Ключ: на бесконечностях кривая выходит горизонтально из края (не замыкается вниз)
    if(isL&&isR)   d=`M${pad-14},${yl-2} C${pad-14},${yl-lift} ${W-pad+14},${yl-lift} ${W-pad+14},${yl-2}`;
    else if(isL)   d=`M${pad-14},${yl-2} C${pad-14},${yl-lift} ${x2},${yl-lift} ${x2},${yl-2}`;
    else if(isR)   d=`M${x1},${yl-2} C${x1},${yl-lift} ${W-pad+14},${yl-lift} ${W-pad+14},${yl-2}`;
    else           d=`M${x1},${yl-2} Q${mid},${yl-lift} ${x2},${yl-2}`;
    o+=`<path d="${d}" fill="none" stroke="#e5484d" stroke-width="3" opacity=".85"/>`;
    o+=`<rect x="${x1}" y="${yl-3}" width="${Math.max(0,x2-x1)}" height="6" fill="#16a36a" opacity=".22"/>`;
  });
  if(roots&&roots.length){
    roots.forEach(r=>{
      if(r<mn-0.5||r>mx+0.5)return;
      const ok=domainFn(r);const x=X(r);
      if(ok){
        o+=`<circle cx="${x}" cy="${yl}" r="5.5" fill="#16a36a"/>`;
        o+=`<text x="${x}" y="${yl-12}" font-size="15" font-family="Caveat,cursive" text-anchor="middle" fill="#16a36a" font-weight="700">${String(r).replace('-','−')}</text>`;
      }else{
        o+=`<path d="M${x-6},${yl-6} L${x+6},${yl+6} M${x+6},${yl-6} L${x-6},${yl+6}" stroke="#c0262c" stroke-width="2.5" stroke-linecap="round"/>`;
        o+=`<text x="${x}" y="${yl-12}" font-size="15" font-family="Caveat,cursive" text-anchor="middle" fill="#c0262c" font-weight="700">${String(r).replace('-','−')}</text>`;
      }
    });
  }
  o+=`<text x="${W/2}" y="${H-6}" font-size="16" font-family="Caveat,cursive" text-anchor="middle" fill="#0f7a4d">ОДЗ: ${esc(odzDesc)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${o}</svg>`;
}

function sampleHTML(t){
  const lines=(t.solHW||[]).map(l=>{
    if(l.startsWith('Ответ:'))return `<p class="hans">${M(l)}</p>`;
    if(l.includes('нет решений')||l.includes('Нет →')||l.includes('отбрасываем')||l.includes('не подходит'))return `<p class="reject">${M(l)}</p>`;
    if(l.includes('подходит')||l.includes('Да →'))return `<p class="check">${M(l)}</p>`;
    if(l.startsWith('ОДЗ'))return `<p><b>${M(l)}</b></p>`;
    return `<p>${M(l)}</p>`;
  }).join('');
  // Проверка — только для уравнений/неравенств, не для дробей
  const check = chk(t);
  const checkBlock = check ? `
    <div style="margin-top:14px;border-top:1px dashed #1d3fa6;padding-top:8px">
      <p><b>Проверка корней подстановкой (черновик):</b></p>
      ${check.map(c=>`<p class="${c.ok?'check':'reject'}">${c.txt}</p>`).join('')}
      <p style="color:#b25e00;font-weight:700">На бланке проверку писать не обязательно, в черновике — нужно.</p>
    </div>` : '';
  const odzFig=`<div class="odzbox">${odzSVG(t.odz,t.domainFn,t.roots,480)}</div>`;
  return `<div class="hw"><div class="hw-h">Решение.</div>${lines}${odzFig}${checkBlock}</div>`;
}

/* ===== Памятка: общие правила ===== */
const MEMO_RULES={
  frac:['Знаменатель не равен нулю — выпиши ОДЗ до преобразований.','Сокращать можно только общий множитель, при этом выколотые точки указывай.','Разность квадратов: a² − b² = (a − b)(a + b).','Группировка: вынеси общий множитель из пар слагаемых.'],
  poly:['Переноси всё в одну сторону: f(x) = 0.','Ищи общий множитель, группируй, применяй формулы сокращённого умножения.','Куб + квадрат = линейное: группировка x(x² − a) + b(x² − a).','Если x = c — корень, дели многочлен на (x − c) «уголком».'],
  sub:['Замена t = (выражение)², тогда t ≥ 0.','Отрицательные t отбрасывай.','Обратная замена: реши (выражение)² = t.','Проверяй корни подстановкой в черновике.'],
  rat:['ОДЗ: все знаменатели ≠ 0.','Умножай обе части на общий знаменатель.','После решения — проверка корней в ОДЗ.','Если ответ — дробь, проверь, не сокращается ли она.'],
  root:['Подкоренное выражение ≥ 0 — это ОДЗ.','Если корни взаимно уничтожаются, решай алгебраическое уравнение.','Корни вне ОДЗ отбрасывай (крестик на луче).','Проверка подстановкой — обязательна в черновике.'],
  sq0:['A² + B² = 0 ⇔ A = 0 и B = 0 одновременно.','Решай систему из двух уравнений.','Бери только общие корни (пересечение).','Проверяй подстановкой в оба уравнения.'],
  pow:['A² = B² ⇔ A = B или A = −B.','A² ≥ B² ⇔ (A − B)(A + B) ≥ 0.','Выноси общий множитель, если скобки одинаковые.','Проверяй корни подстановкой в черновике.'],
  ineq:['Дробь ≥ 0 или ≤ 0 — метод интервалов.','Нули числителя — закрашены, нули знаменателя — выколоты.','Проверь знак на каждом интервале.','Если числитель — константа, смотри только на знак знаменателя.'],
  ineq2:['Переноси всё в одну сторону.','Раскладывай на множители, отмечай корни на оси.','Парабола вверх: «< 0» — между корнями, «> 0» — вне.','Концы включай/выключай по знаку неравенства.']
};

    <div class="smnav"><button class="btn" id="dx2">Закрыть</button></div>`);
  const cv=$('#dCanvas'),ctx=cv.getContext('2d');
  let col='#1d2640',erase=false,drawing=false;
  const resize=()=>{const r=cv.parentElement.getBoundingClientRect();cv.width=r.width;cv.height=r.height;ctx.lineCap='round';ctx.lineJoin='round';};
  setTimeout(resize,60);
  const pos=e=>{const r=cv.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return [p.clientX-r.left,p.clientY-r.top];};
  const down=e=>{drawing=true;ctx.beginPath();ctx.moveTo(...pos(e));e.preventDefault();};
  const move=e=>{if(!drawing)return;const [x,y]=pos(e);ctx.strokeStyle=erase?'#fff':col;ctx.lineWidth=erase?18:2.4;ctx.lineTo(x,y);ctx.stroke();e.preventDefault();};
  const up=()=>{drawing=false;};
  cv.addEventListener('mousedown',down);cv.addEventListener('mousemove',move);cv.addEventListener('mouseup',up);
  cv.addEventListener('touchstart',down);cv.addEventListener('touchmove',move);cv.addEventListener('touchend',up);
  document.querySelectorAll('.pcol').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.pcol').forEach(z=>z.classList.remove('on'));
    b.classList.add('on');col=b.dataset.c;erase=false;
  });
  $('#dErase').onclick=()=>{erase=true;};
  $('#dClear').onclick=()=>{ctx.clearRect(0,0,cv.width,cv.height);};
  $('#dHint').onclick=()=>{
    x.hintInDraw=(x.hintInDraw||0)+1;
    x.steps=(x.steps||0)+1;
    if(!solved(x))x.st=x.st==='new'?'hint':x.st;
    persist();
    alert('Подсказка (отразится в отчёте):\n\n'+t.steps.slice(0,x.steps).map((s,i)=>`${i+1}. ${s.replace(/[{}]/g,'')}`).join('\n\n'));
    renderSide();
  };
  $('#dSol').onclick=()=>{
    x.hintInDraw=(x.hintInDraw||0)+1;
    if(!solved(x))x.st='sol';
    persist();
    closeModal();
    openSteps(t,x);
  };
  $('#dx').onclick=$('#dx2').onclick=closeModal;
}

    <div class="sub">Тренажёр · ОДЗ на луче · рукописные решения</div>
    <div style="margin:-12px 0 16px">${modeBadge()}</div>
    <input id="nm" placeholder="Имя ученика" autocomplete="name">
    <button class="btn pri" id="go" style="width:100%;justify-content:center">Войти / Начать</button>
    ${profs.length?`<div class="prof">${profs.map(p=>{const L=vis(p);const k=L.filter(n=>solved(p.tasks[n])).length;return `<button data-n="${esc(p.name)}">👤 ${esc(p.name)} <small>${k}/${L.length}</small></button>`;}).join('')}</div>`:''}
    <div class="lfoot">
      <button class="btn sm ghost" id="th">${DB.theme==='dark'?'☀️ Светлая':'🌙 Тёмная'}</button>
      <button class="btn sm ghost" id="tch">👩‍🏫 Учитель</button>
    </div>
  </div></div>`;
  $('#nm').focus();
  const start=name=>{
    name=(name||'').trim();if(!name){toast('Введите имя');return;}
    if(!DB.students[name])DB.students[name]=newStudent(name);
    DB.curName=name;DB.students[name].updated=Date.now();
    const d=new Date().toISOString().slice(0,10);if(!(DB.students[name].days||[]).includes(d)){(DB.students[name].days=DB.students[name].days||[]).push(d);}
    persist();viewMain();
  };
  $('#go').onclick=()=>start($('#nm').value);
  $('#nm').onkeydown=e=>{if(e.key==='Enter')start($('#nm').value);};
  document.querySelectorAll('.prof [data-n]').forEach(b=>b.onclick=()=>start(b.dataset.n));
  $('#th').onclick=()=>{DB.theme=DB.theme==='dark'?'light':'dark';applyTheme();persist();viewLogin();};
  $('#tch').onclick=()=>viewTeacher('students');
}

/* ===== Основной экран ===== */
function viewMain(){
  const s=getS();if(!s){viewLogin();return;}
  const L=vis(s);const c=counts(s);
  const cur=s.cur&&L.includes(s.cur)?s.cur:L[0];
  s.cur=cur;
  app().innerHTML=`<div class="top">
    <div class="ttl">∫ <span>${APPNAME}</span></div>
    <div class="who">${esc(s.name)}</div>
    ${modeBadge()}
    <div class="pbar"><i style="width:${c.total?100*c.done/c.total:0}%"></i></div>
    <div class="ptxt">${c.done}/${c.total}</div>
    <div class="tbtns">
      <button class="btn sm" id="memo">📌 Памятка</button>
      <button class="btn sm" id="rep">📄 Отчёт</button>
      <button class="btn sm ghost" id="out">Выход</button>
    </div>
  </div>
  <div class="wrap"><div class="side" id="side"></div><div class="main" id="main"></div></div>`;
  renderSide();
  renderTask(cur);
  $('#memo').onclick=()=>{s.memo=(s.memo||0)+1;persist();openMemoCommon();};
  $('#rep').onclick=()=>reportDialog(s.name,false);
  $('#out').onclick=()=>{DB.curName=null;persist();viewLogin();};
}
function renderSide(){
  const s=getS();const L=vis(s);
  const byTp={};TOPICS.forEach(tp=>{const ns=L.filter(n=>TASK[n].topic===tp.id);if(ns.length)byTp[tp.id]=ns;});
  let h='';
  TOPICS.forEach(tp=>{
    const ns=byTp[tp.id];if(!ns)return;
    const done=ns.filter(n=>solved(s.tasks[n])).length;
    const isCur=ns.includes(s.cur);
    h+=`<div class="tp ${isCur?'cur':''} ${done===ns.length?'fin':''}">
      <div class="tph"><div class="ic">${tp.icon}</div>${tp.name}<span class="done">${done}/${ns.length}</span></div>
      <div class="mini"><i style="width:${100*done/ns.length}%"></i></div>
      <div class="chips">${ns.map(n=>{
        const x=s.tasks[n]||{st:'new'};
        const cl=['chip',x.st||'new',TASK[n].kind==='А'?'an':'',n===s.cur?'cur':''].filter(Boolean).join(' ');
        return `<button class="${cl}" data-n="${n}">${TASK[n].code}${TASK[n].kind==='А'?'а':''}</button>`;
      }).join('')}</div>
    </div>`;
  });
  h+=`<div class="legend"><span><b style="background:var(--ok)"></b> сам</span><span><b style="background:#7bd3a7"></b> с ошибками</span><span><b style="background:#ffd666"></b> с подсказкой</span><span><b style="background:#ffb27a"></b> после образца</span></div>`;
  $('#side').innerHTML=h;
  document.querySelectorAll('.chip[data-n]').forEach(b=>b.onclick=()=>{s.cur=+b.dataset.n;persist();renderSide();renderTask(s.cur);});
}
function renderTask(n){
  const s=getS();const t=TASK[n];const x=T(n,s);
  const start=Date.now();
  const optsHtml=(t.opts||[]).map((o,i)=>{
    return `<label class="opt"><input type="radio" name="opt_${t.n}" value="${esc(o)}"> ${M(o)}</label>`;
  }).join('');
  let h=`<div class="card pop">
    <div class="chead">
      <span class="num">№ ${t.label}</span>
      <span class="badge ${t.kind==='А'?'an':''}">${t.kind==='П'?'прототип':'аналог'}</span>
      ${t.nf?'<span class="badge nf">НЕ ФИПИ</span>':''}
      <span class="badge tpc">${TOPICS.find(tp=>tp.id===t.topic).name}</span>
    </div>
    <div class="qtext">${M(t.q)}</div>
    <div class="tools">
      <button class="tool" id="tHint"><b>💡</b><span>Подсказка</span><small>по шагам</small></button>
      <button class="tool warn" id="tSol"><b>✍️</b><span>Решение по шагам</span><small>с лучом</small></button>
      <button class="tool" id="tMemo"><b>📌</b><span>Памятка</span><small>общие правила</small></button>
      <button class="tool" id="tDraw"><b>✏️</b><span>Рисовать</span><small>черновик</small></button>
    </div>
    <div class="ansbox">
      <div class="abt">Выберите ответ <small>(сразу видно результат)</small></div>
      <div class="opts" id="optsBox">${optsHtml}</div>
      <div class="fb" id="fb"></div>
      ${x.comment?`<div class="tcom">Учитель: ${esc(x.comment)}</div>`:''}
    </div>
    <div style="margin-top:14px">
      <div class="abt">📷 Фото решения <small>(черновик с проверкой)</small></div>
      <input type="file" accept="image/*" id="photoIn" style="font:inherit">
      <div class="photo-prev" id="photoPrev">${(x.photos||[]).map(p=>`<img src="${p}">`).join('')}</div>
    </div>
    <div class="help"><span class="note">Время на задачу учитывается автоматически</span></div>
  </div>`;
  $('#main').innerHTML=h;
  const addTime=()=>{x.t=(x.t||0)+(Date.now()-start);s.totalMs=(s.totalMs||0)+(Date.now()-start);s.updated=Date.now();persist();};
  $('#tHint').onclick=()=>{
    x.steps=(x.steps||0)+1;if(!solved(x))x.st=x.st==='new'?'hint':x.st;addTime();
    persist();renderSide();
    const steps=t.steps.slice(0,x.steps);
    modal(`<h2>💡 Подсказка · ${t.label}</h2>
      <div class="steps-text">${steps.map((s,i)=>`${i+1}. ${M(s)}`).join('\n\n')}</div>
      <div class="smnav"><button class="btn" onclick="closeModal()">Закрыть</button></div>`);
  };
  $('#tSol').onclick=()=>{
    if(solved(x)){openSteps(t,x);return;}
    confirmBox('Открыть пошаговое решение?<br><small style="color:var(--mut)">Учитель увидит, что образец смотрели до сдачи.</small>',()=>{
      x.st='sol';x.views=x.views||{};x.views.own=1;addTime();persist();renderSide();openSteps(t,x);
    },'Открыть решение');
  };
  $('#tMemo').onclick=()=>{x.stick=1;s.memo=(s.memo||0)+1;persist();openMemoFor(t);};
  $('#tDraw').onclick=()=>openDraw(t,x);
  $('#photoIn').onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    if(f.size>2_000_000){toast('Файл больше 2 МБ');return;}
    const r=new FileReader();r.onload=()=>{
      x.photos=(x.photos||[]).concat([r.result]);
      $('#photoPrev').innerHTML=(x.photos||[]).map(p=>`<img src="${p}">`).join('');
      persist();toast('Фото прикреплено');
    };r.readAsDataURL(f);
  };
  // Мгновенная реакция при выборе варианта
  document.querySelectorAll(`input[name="opt_${t.n}"]`).forEach(inp=>{
    inp.onchange=()=>{
      const raw=inp.value;
      x.txt=raw;addTime();
      const ok=normAns(raw)===normAns(t.ans);
      const fb=$('#fb');
      document.querySelectorAll('.opt').forEach(o=>o.classList.remove('good','bad'));
      if(ok){
        inp.closest('.opt').classList.add('good');
        if(!x.st||x.st==='new'||x.st==='err')x.st='ok';
        fb.className='fb show good';fb.textContent='Верно! ✓';
      }else{
        inp.closest('.opt').classList.add('bad');
        x.wrong=x.wrong||[];x.wrong.push(raw);
        if(x.st==='new')x.st='err';
        fb.className='fb show bad';fb.textContent='Пока неверно. Проверьте ОДЗ и подсказки.';
      }
      persist();renderSide();
    };
  });
}
function normAns(s){
  return String(s).toLowerCase().replace(/\s+/g,'').replace(/−/g,'-').replace(/,/g,'.')
    .replace(/;/g,';').replace(/√/g,'sqrt');
}

/* ===== Отчёт ===== */
function reportDialog(name,teacher){
  const s=DB.students[name];const c=counts(s);
  const showAns=teacher||DB.teacher.showAnswers;
  const L=vis(s);
  modal(`<h2>📄 Отчёт: ${esc(name)}</h2>
    <div class="stats">
      <div class="stat"><b>${c.done}/${c.total}</b><span>решено</span></div>
      <div class="stat"><b>${c.ok}</b><span>сам с 1-й</span></div>
      <div class="stat"><b>${c.err}</b><span>после ошибок</span></div>
      <div class="stat"><b>${c.hint}</b><span>с подсказкой</span></div>
      <div class="stat"><b>${c.sol}</b><span>после образца</span></div>
      <div class="stat"><b>${fmtT(s.totalMs||0)}</b><span>время</span></div>
    </div>
    <p style="color:var(--mut)">Памятка открыта: ${s.memo||0} раз · дни: ${(s.days||[]).join(', ')||'—'}</p>
    <table class="st"><tr><th>Задача</th><th>Статус</th><th>Подсказки</th>${showAns?'<th>Эталон</th>':''}</tr>
    ${L.map(n=>{const x=s.tasks[n]||{st:'new'};const hh=(x.hintInDraw||0)+(x.steps||0);return `<tr><td>${TASK[n].label}</td><td>${ST_LABEL[x.st]||x.st}</td><td>${hh}</td>${showAns?`<td>${esc(TASK[n].ansT)}</td>`:''}</tr>`;}).join('')}
    </table>
    <div class="row" style="margin-top:12px">
      <button class="btn pri" id="repSend">📤 Отправить</button>
      <button class="btn ghost" id="rx">Закрыть</button>
    </div>`);
  $('#rx').onclick=closeModal;
  $('#repSend').onclick=()=>{
    const txt=`Отчёт: ${name}\nРешено: ${c.done}/${c.total}\nСам: ${c.ok+c.err}\nС подсказкой: ${c.hint}\nПосле образца: ${c.sol}\nВремя: ${fmtT(s.totalMs||0)}`;
    if(navigator.share){navigator.share({title:'Отчёт ОГЭ',text:txt}).catch(()=>{});}
    else{
      const pa=document.getElementById('printArea');
      pa.innerHTML=`<pre style="font-family:Segoe UI;padding:20px;font-size:14px">${esc(txt)}</pre>`;
      document.body.classList.add('printing');
      setTimeout(()=>{window.print();document.body.classList.remove('printing');},100);
    }
  };
}
const ST_LABEL={ok:'сам',err:'сам после ошибок',hint:'с подсказкой',sol:'после образца',new:'не сдана'};

/* ===== Учитель ===== */
function viewTeacher(tab){
  app().innerHTML=`<div class="top"><div class="ttl">🎓 Учитель · ${APPNAME}</div><div style="flex:1"></div>
    <button class="btn sm" id="tTh">${DB.theme==='dark'?'☀️':'🌙'}</button>
    <button class="btn sm ghost" id="tOut">← К входу</button></div>
    <div style="max-width:1100px;margin:18px auto;padding:0 16px">
      <div class="tabs">
        <button data-tab="students" class="${tab==='students'?'on':''}">Ученики</button>
        <button data-tab="mode" class="${tab==='mode'?'on':''}">Настройки</button>
        <button data-tab="print" class="${tab==='print'?'on':''}">Печать</button>
      </div>
      <div id="tbody"></div>
    </div>`;
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>viewTeacher(b.dataset.tab));
  $('#tTh').onclick=()=>{DB.theme=DB.theme==='dark'?'light':'dark';applyTheme();persist();viewTeacher(tab);};
  $('#tOut').onclick=viewLogin;
  const body=$('#tbody');
  if(tab==='students'){
    const ss=Object.values(DB.students).sort((a,b)=>(b.updated||0)-(a.updated||0));
    if(!ss.length){body.innerHTML='<p>Пока нет учеников.</p>';return;}
    body.innerHTML=`<table class="st"><tr><th>Ученик</th><th>Решено</th><th>Сам</th><th>С подсказкой</th><th>После образца</th><th>Время</th><th></th></tr>
      ${ss.map(s=>{const c=counts(s);return `<tr>
        <td><b>${esc(s.name)}</b></td>
        <td>${c.done}/${c.total}</td><td>${c.ok+c.err}</td><td>${c.hint}</td><td>${c.sol}</td>
        <td>${fmtT(s.totalMs||0)}</td>
        <td class="row">
          <button class="btn sm pri" data-r="${esc(s.name)}">📄 Отчёт</button>
          <button class="btn sm ghost" data-z="${esc(s.name)}">↺</button>
        </td></tr>`;}).join('')}</table>`;
    document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>reportDialog(b.dataset.r,true));
    document.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>confirmBox(`Сбросить «${b.dataset.z}»?`,()=>{DB.students[b.dataset.z]=newStudent(b.dataset.z);persist();viewTeacher('students');}));
  }else if(tab==='mode'){
    const a=DB.teacher.assign||{mode:'all',list:[]};
    body.innerHTML=`<div class="fld"><span>Режим работы</span>
      <select id="md"><option value="class" ${DB.teacher.mode!=='home'?'selected':''}>🏫 Классная</option>
      <option value="home" ${DB.teacher.mode==='home'?'selected':''}>🏠 Домашняя</option></select></div>
      <div class="fld"><span>Назначение заданий</span>
      <select id="asg">
        <option value="all" ${a.mode==='all'?'selected':''}>Все задания</option>
        <option value="custom" ${a.mode==='custom'?'selected':''}>Свой список</option>
      </select></div>
      <div class="fld"><span>Показывать правильные ответы в отчёте ученику</span>
        <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="shA" ${DB.teacher.showAnswers?'checked':''}> Да</label></div>
      <div class="fld"><span>Имя учителя</span><input id="tn" value="${esc(DB.teacher.name||'')}"></div>
      <div class="fld" id="asgBox" style="${a.mode==='all'?'display:none':''}">
        <span>Список задач</span>
        <div style="max-height:40vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px" id="asgList">
          ${ORDER.map(n=>`<label style="display:inline-flex;gap:6px;margin:3px 8px;padding:4px 8px;background:var(--bg);border-radius:8px">
            <input type="checkbox" data-an="${n}" ${(a.list||[]).includes(n)?'checked':''}> ${TASK[n].label}</label>`).join('')}
        </div>
      </div>
      <button class="btn pri" id="ts">Сохранить</button>`;
    $('#asg').onchange=e=>{$('#asgBox').style.display=e.target.value==='all'?'none':'';};
    $('#ts').onclick=()=>{
      DB.teacher.mode=$('#md').value;
      DB.teacher.name=$('#tn').value;
      DB.teacher.showAnswers=$('#shA').checked;
      const mode=$('#asg').value;
      const list=[...document.querySelectorAll('[data-an]')].filter(c=>c.checked).map(c=>+c.dataset.an);
      DB.teacher.assign={mode,list};
      persist();toast('Сохранено');viewTeacher('mode');
    };
  }else{
    body.innerHTML=`<p>Выберите задачи для печати. Количество строк под задачей пропорционально длине решения.</p>
      <div class="row" style="margin-bottom:10px">
        <button class="btn sm" id="pa">Все</button><button class="btn sm" id="pp">Прототипы</button>
        <button class="btn sm" id="pan">Аналоги</button>
      </div>
      <div id="plist" style="max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px"></div>
      <div class="row" style="margin-top:12px"><button class="btn pri" id="pgo">🖨 Печать</button></div>`;
    const sel=new Set(ORDER);
    const draw=()=>{
      $('#plist').innerHTML=TOPICS.map(tp=>{
        const ns=ORDER.filter(n=>TASK[n].topic===tp.id);
        return `<div style="font-weight:800;margin:8px 0 4px">${tp.name}</div>
          ${ns.map(n=>`<label style="display:inline-flex;gap:6px;margin:3px 8px;padding:4px 8px;background:var(--bg);border-radius:8px">
            <input type="checkbox" data-n="${n}" ${sel.has(n)?'checked':''}> ${TASK[n].label}</label>`).join('')}`;
      }).join('');
      document.querySelectorAll('#plist [data-n]').forEach(c=>c.onchange=()=>{c.checked?sel.add(+c.dataset.n):sel.delete(+c.dataset.n);});
    };
    draw();
    $('#pa').onclick=()=>{ORDER.forEach(n=>sel.add(n));draw();};
    $('#pp').onclick=()=>{sel.clear();ORDER.filter(n=>TASK[n].kind==='П').forEach(n=>sel.add(n));draw();};
    $('#pan').onclick=()=>{sel.clear();ORDER.filter(n=>TASK[n].kind==='А').forEach(n=>sel.add(n));draw();};
    $('#pgo').onclick=()=>{
      const list=[...sel];
      let h='<div style="font-family:Segoe UI,Arial;padding:12px"><h2>Уравнения · ОГЭ</h2>';
      list.forEach((n,i)=>{const t=TASK[n];
        // пропорционально числу строк решения: минимум 6 строк, +2 строки на каждый шаг
        const lines=Math.max(6, t.steps.length*2+2);
        h+=`<div style="border-bottom:1px dashed #ccc;padding:10px 0;break-inside:avoid">
          <b>${i+1}. ${t.label}</b><div style="margin:6px 0;font-size:15px">${M(t.q)}</div>
          <div style="height:${lines*18}px;border:1px solid #ddd;background:repeating-linear-gradient(0deg,#f7f9fc,#f7f9fc 16px,#e8ecf4 17px)"></div>
        </div>`;
      });
      h+='</div>';
      const pa=document.getElementById('printArea');pa.innerHTML=h;
      document.body.classList.add('printing');
      setTimeout(()=>{window.print();document.body.classList.remove('printing');},100);
    };
  }
}

/* ===== Старт ===== */
loadDB();applyTheme();
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
viewLogin();
</script>
</body>
</html>
