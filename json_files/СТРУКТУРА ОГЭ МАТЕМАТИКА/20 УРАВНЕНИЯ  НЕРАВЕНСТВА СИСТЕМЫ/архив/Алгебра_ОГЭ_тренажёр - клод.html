<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Алгебра · ОГЭ — тренажёр</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;family=Caveat:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1d2640;--mut:#6b7491;--line:#e3e7f1;--pri:#4f6bff;--pri2:#7b5cff;--ok:#16a36a;--okl:#dff6ea;--warn:#f0a400;--warnl:#fff2cc;--bad:#e5484d;--badl:#ffe3e3;--sol:#f07a2a;--soll:#ffe8d6;--sh:0 6px 24px rgba(30,40,80,.08);--r:16px}
[data-theme=dark]{--bg:#12151f;--card:#1b2030;--ink:#e8ecf7;--mut:#9aa3bd;--line:#2b3247;--okl:#173a2b;--warnl:#3d3214;--badl:#43191c;--soll:#45281a;--sh:0 6px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito','Segoe UI',Roboto,Arial,sans-serif;font-size:16px}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
.sq{white-space:nowrap}.sq .rd{font-size:1.05em}.sq .ov{border-top:1.5px solid currentColor;padding:0 1px;margin-left:1px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;line-height:1.15;font-size:.92em}
.fr .nu{border-bottom:1.5px solid currentColor;padding:0 3px}.fr .de{padding:0 3px}
sup,sub{font-size:.7em}
.btn{border:0;border-radius:12px;padding:10px 16px;background:var(--line);color:var(--ink);font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap}
.btn:hover{filter:brightness(.96);transform:translateY(-1px)}
.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 4px 14px rgba(79,107,255,.35)}
.btn.ok{background:var(--ok);color:#fff}.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.sm{padding:7px 11px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;pointer-events:none}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 20%,#dfe6ff 0,transparent 40%),radial-gradient(circle at 85% 80%,#ffe1ec 0,transparent 40%),var(--bg)}
[data-theme=dark] .login{background:var(--bg)}
.lcard{background:var(--card);border-radius:24px;box-shadow:var(--sh);padding:32px;max-width:460px;width:100%;text-align:center}
.lcard h1{margin:6px 0 2px;font-size:26px}.lcard .sub{color:var(--mut);margin-bottom:22px}
.logo{font-size:44px;line-height:1}
.lcard input{width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px;text-align:center;margin-bottom:12px}
.lcard input:focus{outline:none;border-color:var(--pri)}
.prof{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.prof button{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:700}
.prof button small{color:var(--mut);font-weight:600}
.lfoot{margin-top:18px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
/* layout */
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.top .ttl{font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px}
.top .who{background:var(--bg);border-radius:999px;padding:6px 12px;font-weight:700}
.pbar{flex:1;min-width:120px;height:10px;background:var(--line);border-radius:99px;overflow:hidden;position:relative}
.pbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--ok),#5ad19b);border-radius:99px}
.ptxt{font-weight:800;font-size:14px;color:var(--mut)}
.tbtns{display:flex;gap:6px;flex-wrap:wrap}
.wrap{display:grid;grid-template-columns:290px 1fr;gap:18px;padding:18px;max-width:1300px;margin:0 auto}
.side{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:12px;align-self:start;position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}
.tp{border-radius:12px;padding:8px 8px 10px;margin-bottom:6px}
.tp.cur{background:var(--bg)}
.tph{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;cursor:pointer}
.tph .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-size:12px;flex:none}
.tph .done{margin-left:auto;font-size:12px;color:var(--mut)}
.tp.fin .tph .ic{background:var(--ok)}
.mini{height:5px;background:var(--line);border-radius:9px;margin:7px 0 7px 38px;overflow:hidden}.mini i{display:block;height:100%;background:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-left:38px}
.chip{width:34px;height:30px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:13px;font-weight:800;display:grid;place-items:center;position:relative}
.chip.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.err{background:#7bd3a7;border-color:#7bd3a7;color:#08321f}
.chip.hint{background:#ffd666;border-color:#ffd666;color:#4a3500}
.chip.sol{background:#ffb27a;border-color:#ffb27a;color:#4a2000}
.chip.skip{border-style:dashed;border-color:var(--mut)}
.chip.cur{outline:3px solid var(--pri);outline-offset:1px}
.chip.an::after{content:'';position:absolute;top:2px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--pri2)}
.legend{font-size:12px;color:var(--mut);display:flex;flex-wrap:wrap;gap:8px;margin:8px 4px 2px}
.legend span{display:inline-flex;align-items:center;gap:4px}.legend b{width:12px;height:12px;border-radius:4px;display:inline-block}
.main{min-width:0}
.card{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:22px 24px;position:relative;overflow:hidden}
.card.pop{animation:pop .35s ease}
@keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.chead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.num{font-size:15px;font-weight:800;color:var(--mut)}
.badge{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:#e8ecff;color:#3b4fd8;letter-spacing:.3px}
.badge.an{background:#f1e8ff;color:#7343d6}.badge.nf{background:#fff0e0;color:#b25e00}
.badge.tpc{background:var(--bg);color:var(--mut)}
.qtext{font-size:20px;line-height:1.55;font-weight:600;margin:4px 0 12px}
.figbox{background:#fff;border-radius:16px;border:1px solid #edf0f7;display:flex;justify-content:center;padding:6px;margin-bottom:16px}
.figbox svg{width:100%;max-width:520px;max-height:330px;height:auto}
.ans{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ans label{font-weight:800}
.ans input{width:180px;padding:12px 14px;border-radius:14px;border:2.5px solid var(--line);font-size:22px;font-weight:800;text-align:center;background:var(--bg);color:var(--ink)}
.ans input:focus{outline:none;border-color:var(--pri)}
.ans input.bad{border-color:var(--bad);animation:shake .4s}
.ans input.good{border-color:var(--ok);background:var(--okl)}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.fb{margin-top:12px;padding:12px 14px;border-radius:14px;font-weight:700;display:none}
.fb.show{display:block}.fb.bad{background:var(--badl);color:var(--bad)}.fb.good{background:var(--okl);color:var(--ok)}
.fb .nx{height:5px;background:rgba(22,163,106,.25);border-radius:9px;margin-top:8px;overflow:hidden}.fb .nx i{display:block;height:100%;background:var(--ok);width:0;transition:width .9s linear}
.help{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);align-items:center}
.help .note{font-size:12.5px;color:var(--mut);margin-left:auto}
.hintzone{margin-top:14px}
.hz-t{font-weight:800;margin:10px 0 8px;display:flex;align-items:center;gap:8px}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:8px}
.step{background:var(--bg);border-left:4px solid var(--pri);border-radius:10px;padding:10px 12px;line-height:1.6;animation:pop .3s}
.step b.k{color:var(--pri);margin-right:6px}
.tnote{font-size:13px;color:var(--mut);background:var(--warnl);border-radius:10px;padding:8px 10px;margin-top:10px}
/* stickers */
.stks{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;padding:6px 2px 4px}
.stk{background:var(--sc);border-radius:6px 6px 18px 6px;padding:14px 14px 12px;color:#1d2640;box-shadow:0 8px 18px rgba(40,40,80,.13),inset 0 -3px 0 rgba(0,0,0,.04);transform:rotate(var(--rot));position:relative;border-top:6px solid var(--se);transition:.2s}
.stk:hover{transform:rotate(0) scale(1.02)}
.stk-pin{position:absolute;top:-11px;left:50%;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff 0,var(--se) 45%,#0003 100%);transform:translateX(-50%)}
.stk-t{font-weight:900;font-size:15px;margin-bottom:6px}
.stk-b{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.stk-x{flex:1;font-size:14px;line-height:1.55}
.stk-f{display:flex;justify-content:center;background:#ffffff8c;border-radius:10px;padding:4px}.stk-f svg{width:200px;max-height:150px;height:auto;display:block}
.tt{border-collapse:collapse;margin-top:6px;font-size:13px}.tt td,.tt th{border:1px solid #0002;padding:3px 6px;text-align:center}.tt th{background:#fff8}
.memo h2{margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.memo h2 i{width:18px;height:18px;border-radius:5px;display:inline-block}
/* modal */
.mbg{position:fixed;inset:0;background:rgba(15,20,40,.45);z-index:50;display:grid;place-items:center;padding:16px}
.mdl{background:var(--card);border-radius:20px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mdl.wide{max-width:1150px}
.mdl h2{margin-top:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--bg);border-radius:14px;padding:12px}.stat b{font-size:26px;display:block}.stat span{font-size:13px;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2640;color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:60;box-shadow:var(--sh);animation:pop .3s}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.fld span{font-size:13px;color:var(--mut);font-weight:700}
.fld input,.fld select{padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs button{border:0;padding:9px 14px;border-radius:10px;background:var(--bg);color:var(--ink);font-weight:800}.tabs button.on{background:var(--pri);color:#fff}
.pgrid{display:grid;grid-template-columns:1fr 300px;gap:16px}
.plist{max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px}
.plist .pt{font-weight:800;margin:8px 0 4px;display:flex;align-items:center;gap:6px}
.plist label{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;margin:3px 8px 3px 0;padding:3px 7px;border-radius:8px;background:var(--bg)}
.opts label{display:flex;gap:8px;align-items:center;padding:5px 0;font-weight:600}
table.st{width:100%;border-collapse:collapse;font-size:14px}table.st td,table.st th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.done-card{text-align:center;padding:40px 24px}.done-card .big{font-size:64px}
.conf{position:absolute;pointer-events:none;font-size:22px;animation:fly 1.2s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
#printArea{display:none}
@media (max-width:860px){
  .wrap{grid-template-columns:1fr;padding:10px}
  .side{position:static;max-height:none}
  .qtext{font-size:18px}.card{padding:16px}
  .pgrid{grid-template-columns:1fr}
  .top .ttl span{display:none}
  .help .note{margin-left:0}
}
/* печать */
@media print{
  body.printing>*:not(#printArea){display:none!important}
  body.printing #printArea{display:block!important}
  body{background:#fff!important;color:#000}
  @page{size:A4;margin:12mm}
}
#printArea{font-family:'Segoe UI',Arial,sans-serif;color:#111;background:#fff}
.pr-head{display:flex;justify-content:space-between;border-bottom:2px solid #333;padding-bottom:6px;margin-bottom:10px;font-size:13px}
.pr-title{font-size:18px;font-weight:800;margin:0 0 6px}
.pr-grid{columns:var(--cols,1);column-gap:10mm}
.pr-task{break-inside:avoid;border-bottom:1px dashed #bbb;padding:8px 0 10px;font-size:13.5px;line-height:1.45}
.pr-n{font-weight:800}.pr-k{font-size:11px;color:#555;border:1px solid #999;border-radius:6px;padding:0 5px;margin-left:6px}
.pr-fig{text-align:center;margin:4px 0}.pr-fig svg{width:auto;max-width:62%;max-height:150px}
.pr-cols2 .pr-fig svg{max-width:95%;max-height:140px}
.pr-line{margin-top:6px}
.pr-ans{margin-top:4px;font-weight:700;color:#0a6b3d}
.pr-sol{margin-top:4px;font-size:12.5px;color:#222}.pr-sol ol{margin:2px 0;padding-left:18px}
.pr-key{break-before:page}.pr-key table{border-collapse:collapse;width:100%}.pr-key td{border:1px solid #888;padding:4px;text-align:center;font-size:12.5px}.pr-key td b{display:block;font-size:11px;color:#555}
.pr-memo{break-before:page}.pr-memo .stks{grid-template-columns:repeat(3,1fr);gap:8px}.pr-memo .stk{transform:none;box-shadow:none;border:1px solid #0002;border-top:5px solid var(--se);-webkit-print-color-adjust:exact;print-color-adjust:exact;break-inside:avoid;padding:8px}
.pr-memo .stk-x{font-size:11.5px}.pr-memo .stk-f svg{width:150px;max-height:110px}.pr-memo .stk-pin{display:none}
.prev{background:#fff;color:#111;padding:14px;border-radius:12px;border:1px solid var(--line);max-height:65vh;overflow:auto}
@media (max-width:860px){.main{order:-1}}

.lvl{color:#f0a400;font-size:15px;letter-spacing:1px}
.calcout{font-size:22px;font-weight:800;color:var(--pri);min-width:90px}.calcout.bad{color:var(--mut)}
.ans input.calcin{width:260px;text-align:left}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}.key{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;min-width:42px;padding:7px 10px;font-weight:800;font-size:16px}
.khint{font-size:12.5px;color:var(--mut);margin-left:4px}
.redo{background:var(--warnl);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.flagg .pt{font-weight:800;margin:10px 0 4px;display:flex;align-items:center;gap:8px}
.flag{display:inline-flex;align-items:center;gap:4px;margin:3px 6px 3px 0;padding:5px 9px;border-radius:9px;background:var(--bg);font-size:14px;cursor:pointer;border:1.5px solid transparent;user-select:none}
.flag.on{border-color:#e5484d;background:#ffe9e9;color:#1d2640}.flag .fl{opacity:.25}.flag.on .fl{opacity:1}
.switch{display:flex;align-items:center;gap:10px;font-weight:700;padding:12px;border-radius:12px;background:var(--bg);margin:10px 0;cursor:pointer}
.switch input{width:22px;height:22px}
/* ===== ОГЭ22 ===== */
.cs{display:inline-flex;align-items:center;vertical-align:middle;margin:2px 4px}
.cs .cb{font-size:2.6em;line-height:1;font-weight:200;margin-right:2px;transform:scaleX(.7)}
.cs .cr{display:inline-flex;flex-direction:column;gap:2px}
.cs .crow{display:flex;gap:18px;white-space:nowrap}.cs .cc{opacity:.85;font-size:.92em}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.lnk{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--bg);color:var(--pri);font-weight:800;font-size:14px;text-decoration:none;border:1.5px solid var(--line)}
.lnk:hover{border-color:var(--pri)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.tool{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;transition:.15s}
.tool:hover{border-color:var(--pri);transform:translateY(-1px)}
.tool b{font-size:24px}.tool span{font-weight:800}.tool small{color:var(--mut);font-size:12.5px}
.tool.warn{border-color:#ffd2a8;background:#fff6ec}[data-theme=dark] .tool.warn{background:#2c2216;border-color:#5a3d1f}
.ansbox{border:2px dashed var(--line);border-radius:18px;padding:14px 16px}
.abt{font-weight:800;font-size:17px;margin-bottom:10px}.abt small{color:var(--mut);font-weight:600}
.photos{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.photos .ph{position:relative}.photos img{height:120px;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;display:block}
.photos.big img{height:auto;max-width:100%;max-height:520px}
.phx{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:26px;height:26px;background:#000a;color:#fff;font-weight:800}
.nophoto{color:var(--mut);font-size:14px}
.tans{flex:1;min-width:220px;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px}
.tcom{margin-top:10px;background:var(--warnl);border-radius:10px;padding:8px 12px;font-weight:700}
.chip{width:auto;min-width:36px;padding:0 6px}
.chip .sc{position:absolute;bottom:-6px;right:-5px;background:#6b3fd1;color:#fff;font-style:normal;font-size:10px;border-radius:9px;padding:0 5px;line-height:15px}
.mdl.gmdl{max-width:900px}.mdl.smdl{max-width:900px}.mdl.rvmdl{max-width:1300px}
.gq{background:var(--bg);border-radius:12px;padding:10px 14px;margin:8px 0 12px;font-weight:600;line-height:1.6}
.gwrap{position:relative;background:#fff;border-radius:14px;border:1px solid #e6e9f2;touch-action:none}
.gwrap svg{display:block;width:100%;height:auto}
.gov{position:absolute;inset:0;width:100%;height:100%;cursor:ns-resize}
.gctl{display:flex;justify-content:space-between;align-items:center;margin:10px 0;gap:10px;flex-wrap:wrap}
.gval{font-size:20px}.gval .snap{background:#ffe1c2;color:#a04a00;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800;margin-left:6px}
.gcnt span{font-size:20px;font-weight:900;padding:6px 14px;border-radius:12px;background:var(--bg)}
.gcnt .n0{color:#888}.gcnt .n1{color:#16a36a}.gcnt .n2{color:#2f6fe4}.gcnt .n3{color:#b04e10}.gcnt .n4{color:#7343d6}
.ghint{color:var(--mut);font-size:13.5px}
/* рукописный образец */
.hw{font-family:'Caveat','Segoe Print','Comic Sans MS',cursive;font-size:24px;line-height:30px;color:#1d3fa6;background-color:#fff;
 background-image:linear-gradient(#cfe0f7 1px,transparent 1px),linear-gradient(90deg,#cfe0f7 1px,transparent 1px);background-size:15px 15px;
 border-radius:10px;padding:18px 26px 22px 46px;box-shadow:inset 3px 0 0 #f2a0a0;position:relative}
.hw p{margin:4px 0}.hw u{text-decoration-color:#1d3fa6}
.hw-h{font-size:30px;font-weight:700;margin-bottom:4px}
.hw .hole{color:#c0262c;font-weight:700}
.hw .hn{color:#555;font-size:21px}
.hw .htab{border-collapse:collapse;margin:6px 0 8px}.hw .htab th,.hw .htab td{border:1.6px solid #1d3fa6;padding:0 12px;min-width:38px;text-align:center;font-weight:600}
.hw .hgraph{background:transparent;margin:10px 0;display:flex;justify-content:center}.hw .hgraph svg{width:100%;max-width:560px;height:auto}
.hw .hl{margin:4px 0 6px;padding-left:26px}.hw .hl li{margin:1px 0}
.hw .hans{display:inline-block;border:2.2px solid #1d3fa6;border-radius:8px;padding:2px 14px;margin-top:8px;font-weight:700;font-size:27px}
.hw .fr{font-size:.95em}.hw .sq .ov{border-top-color:#1d3fa6}
.rv{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}

function tok(s){

function cw(ch,sz){

function mw(s,sz){

      o+=`<line x1="${x.toFixed(1)}" y1="${cy.toFixed(1)}" x2="${(x+W).toFixed(1)}" y2="${cy.toFixed(1)}" stroke="${col}" stroke-width="${Math.max(1.1,sz/13).toFixed(2)}"/>`;

   a: дуги [от, до, слой] (±Infinity — дуга уходит в бесконечность и растворяется, не касаясь прямой)

let NLID=0;

  const H=c.cap?150:132,yl=c.cap?104:88,L=22,R=W-22;
  const vals=[];const addV=v=>{if(isFinite(v)&&!vals.some(u=>Math.abs(u-v)<1e-9))vals.push(v);};
  (c.p||[]).forEach(p=>addV(p[0]));(c.r||[]).forEach(r=>addV(r[0]));
  vals.sort((a,b)=>a-b);
  const X=v=>{if(v===-Infinity)return L;if(v===Infinity)return R;const i=vals.findIndex(u=>Math.abs(u-v)<1e-9);const n=vals.length;if(n===1)return W/2;return 95+i*(W-190)/(n-1);};

  const arcCol=lv=>k==='odz'?'#d42a2a':(lv?'#8a4fe0':ink);
  (c.a||[]).forEach((a,ai)=>{
    const lv=a[2]||0,col=arcCol(lv);const h=(hasS?44:30)+lv*20;const top=yl-h;
    const x1=X(a[0]),x2=X(a[1]);const gid=id+'g'+ai;
    const fin1=isFinite(a[0]),fin2=isFinite(a[1]);
    let d,stroke=col;
    if(fin1&&fin2){d=`M${x1},${yl-3} C${x1+6},${top} ${x2-6},${top} ${x2},${yl-3}`;}
    else if(!fin1&&fin2){d=`M${x2},${yl-3} C${x2-4},${top+6} ${x2-26},${top} ${x2-60},${top} L${L-4},${top}`;
      defs+=`<linearGradient id="${gid}" gradientUnits="userSpaceOnUse" x1="${L-4}" y1="0" x2="${Math.max(L+10,x2-40)}" y2="0"><stop offset="0" stop-color="${col}" stop-opacity="0"/><stop offset="1" stop-color="${col}" stop-opacity="1"/></linearGradient>`;stroke=`url(#${gid})`;}
    else if(fin1&&!fin2){d=`M${x1},${yl-3} C${x1+4},${top+6} ${x1+26},${top} ${x1+60},${top} L${R+4},${top}`;
      defs+=`<linearGradient id="${gid}" gradientUnits="userSpaceOnUse" x1="${Math.min(R-10,x1+40)}" y1="0" x2="${R+4}" y2="0"><stop offset="0" stop-color="${col}" stop-opacity="1"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient>`;stroke=`url(#${gid})`;}
    else{d=`M${L-4},${top} L${R+4},${top}`;
      defs+=`<linearGradient id="${gid}" gradientUnits="userSpaceOnUse" x1="${L-4}" y1="0" x2="${R+4}" y2="0"><stop offset="0" stop-color="${col}" stop-opacity="0"/><stop offset=".22" stop-color="${col}" stop-opacity="1"/><stop offset=".78" stop-color="${col}" stop-opacity="1"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient>`;stroke=`url(#${gid})`;}

  });

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="Caveat,'Segoe Print',cursive"><defs>${defs}</defs>${o}</svg>`;
}

const TP=Object.fromEntries(TOPICS.map(t=>[t.id,t]));
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function shuffleSeed(arr,seed){const a=arr.slice();let x=seed||1;for(let i=a.length-1;i>0;i--){x=(Math.imul(x,1103515245)+12345)>>>0;const j=x%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
const LVL=d=>d<=3?1:d<=6?2:3;
const TASKS=[];
TOPICS.forEach(tp=>{RAW.filter(r=>r.tp===tp.id).map((r,i)=>({r,i})).sort((a,b)=>(a.r.d-b.r.d)||((b.r.f?1:0)-(a.r.f?1:0))||(a.i-b.i)).forEach(({r})=>{
  const t=Object.assign({},r);t.n=TASKS.length+1;t.topic=r.tp;t.lvl=LVL(r.d);t.fipi=!!r.f;
  t.doT=r.do!=null?r.do:tp.do;
  t.opts=shuffleSeed([r.ans,...r.o],hashStr(r.id));
  t.label='№ '+t.n;TASKS.push(t);});});
const ORDER=TASKS.map(t=>t.n);
const TASK=Object.fromEntries(TASKS.map(t=>[t.n,t]));
/* полный список шагов разбора: шаги + проверка (черновик) + ответ */
function stepsOf(t){
  const st=t.S.map(s=>({c:s[0],w:s[1]||[],f:s[2]||[]}));
  if(t.chk&&t.chk.length)st.push({c:(t.chkT||'Проверка корней подстановкой')+' — делаем только в черновике, в бланк не переносим. Смотри справа.',w:[],f:[],chk:1});
  st.push({c:'Записываем ответ.',w:[{ans:t.ans}],f:[]});
  return st;
}
function blankLines(t){return stepsOf(t).filter(s=>!s.chk).flatMap(s=>s.w);}
function wItem(w,W){
  if(typeof w==='string')return `<p class="ln">${M(w)}</p>`;
  if(w.nl)return `<div class="nlw">${nlSVG(w.nl,W)}</div>`;
  if(w.ans)return `<div class="hans">Ответ: ${M(w.ans)}</div>`;
  return '';
}

function mergeInto(db,src){
  if(!src)return;
  if(src.teacher&&(src.teacherUpdated||0)>=(db.teacherUpdated||0)){db.teacher=Object.assign(db.teacher,src.teacher);db.teacher.rep=Object.assign(blankDB().teacher.rep,src.teacher.rep||{});db.teacherUpdated=src.teacherUpdated||0;}

  if(src.last)db.last=src.last;if(src.theme)db.theme=src.theme;
}

function toast(msg,ms){document.querySelectorAll('.toast').forEach(z=>z.remove());const d=document.createElement('div');d.className='toast';d.innerHTML=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),ms||2600);}
let MCLEAN=null;
function modal(html,cls){closeModal();const m=document.createElement('div');m.className='mbg';m.id='mbg';m.innerHTML=`<div class="mdl ${cls===true?'wide':cls||''}">${html}</div>`;m.addEventListener('mousedown',e=>{if(e.target===m)closeModal();});document.body.appendChild(m);return m;}
function closeModal(){const f=MCLEAN;MCLEAN=null;if(f)f();const m=document.getElementById('mbg');if(m)m.remove();}
function fmtT(ms){const m=Math.round(ms/60000);if(m<1)return '<1 мин';const h=Math.floor(m/60);return h?h+' ч '+(m%60)+' мин':m+' мин';}
function applyTheme(){document.documentElement.setAttribute('data-theme',DB.theme==='dark'?'dark':'light');}
function confirmBox(q,yes,yesTxt){modal(`<h2>${q}</h2><div class="row"><button class="btn pri" id="cy">${yesTxt||'Да'}</button><button class="btn ghost" id="cn">Отмена</button></div>`);$('#cy').onclick=()=>{closeModal();yes();};$('#cn').onclick=closeModal;}
const stars=n=>'★'.repeat(TASK[n].lvl)+'☆'.repeat(3-TASK[n].lvl);
const LVLN=['','базовый','средний','сложный'];
function modeBadge(){return isClass()?'<span class="modeb" title="Режим: в классе">🏫 В классе</span>':'<span class="modeb home" title="Режим: дома">🏠 Дома</span>';}

/* ===== Время ===== */
const cur={name:'',n:null,since:0,view:'train',boards:{}};
function tickTime(){if(cur.name&&cur.n&&cur.since&&stu()){const d=Math.min(Date.now()-cur.since,5*60000);T(cur.n).t+=d;stu().totalMs+=d;cur.since=Date.now();}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)tickTime();else cur.since=Date.now();});

/* ===== Вход ===== */
function viewLogin(){
  cur.name='';cur.n=null;
  const profs=Object.values(DB.students).sort((a,b)=>(b.updated||0)-(a.updated||0));
  app().innerHTML=`<div class="login"><div class="lcard">
   <div class="logo">∑</div><h1>${APPNAME}</h1><div class="sub">Уравнения, неравенства, системы, преобразования.<br>Выбери верный ответ и прикрепи фото решения.</div>
   <div style="margin:-10px 0 14px">${modeBadge()}</div>
   <form id="lf"><input id="nm" placeholder="Введи своё имя" autocomplete="off" maxlength="40" value="${esc(DB.last||'')}">
   <button class="btn pri" style="width:100%;justify-content:center;padding:14px;font-size:18px">Начать ➜</button></form>
   ${profs.length?`<div class="prof">${profs.map(p=>{const L=vis(p);const k=L.filter(n=>solved(p.tasks[n])).length;return `<button data-n="${esc(p.name)}">👤 ${esc(p.name)} <small>${redoOn(p)?'🔁 ':''}${k}/${L.length}</small></button>`;}).join('')}</div>`:''}
   <div class="lfoot"><button class="btn ghost sm" id="th">${DB.theme==='dark'?'☀️ Светлая':'🌙 Тёмная'} тема</button><button class="btn ghost sm" id="tch">🎓 Учителю</button></div>
  </div></div>`;
  $('#lf').onsubmit=e=>{e.preventDefault();const v=$('#nm').value.trim();if(!v){$('#nm').focus();return;}enter(v);};
  document.querySelectorAll('.prof button').forEach(b=>b.onclick=()=>enter(b.dataset.n));
  $('#th').onclick=()=>{DB.theme=DB.theme==='dark'?'light':'dark';applyTheme();persist();viewLogin();};
  $('#tch').onclick=askPin;
}
function enter(name){
  if(!DB.students[name])DB.students[name]=newStudent(name);
  DB.last=name;cur.name=name;cur.boards={};const s=stu();const d=dstamp();if(!s.days.includes(d))s.days.push(d);persist();
  const L=vis(s);let n=s.cur&&L.includes(s.cur)?s.cur:L[0];
  if(solved(s.tasks[n])){const nx=nextUnsolved(n);if(nx)n=nx;else{cur.n=n;viewDone();return;}}
  openTask(n);
}

/* ===== Набор задач ===== */
function activeList(){const a=DB.teacher.active;return ORDER.filter(n=>!a||a.includes(n));}
function redoOn(s){return !!(s&&s.redo&&s.redo.list&&s.redo.list.some(n=>!solved(s.tasks[n])));}
function vis(s){s=s||stu();if(redoOn(s))return ORDER.filter(n=>s.redo.list.includes(n));const a=activeList();return a.length?a:ORDER.slice();}
function nextUnsolved(from){const s=stu();const L=vis(s);const i=Math.max(0,L.indexOf(from));for(let k=1;k<=L.length;k++){const n=L[(i+k)%L.length];if(!solved(s.tasks[n]))return n;}return null;}
function counts(s){s=s||stu();const L=vis(s);const c={total:L.length,sub:0,right:0,new:0,self:0,hint:0,sol:0,scored:0,points:0,wrong:0};
  L.forEach(n=>{const x=s.tasks[n];if(x&&x.st==='sub'){c.sub++;if(x.solB)c.sol++;else if(x.hintB)c.hint++;else c.self++;}else if(x&&x.right)c.right++;else c.new++;if(x&&x.wrong&&x.wrong.length)c.wrong++;if(x&&x.score!=null){c.scored++;c.points+=x.score;}});
  c.done=c.sub;return c;}
function chipCls(x){if(!x)return '';const a=[];if(x.st==='sub')a.push(x.score===2?'ok':'sub');else if(x.right)a.push('right');else if(x.skip)a.push('skip');if(x.wrong&&x.wrong.length&&x.st!=='sub'&&!x.right)a.push('wr');return a.join(' ');}

/* ===== Шапка и боковая панель ===== */
function topbar(){
  const c=counts();
  return `<div class="top"><div class="ttl">∑ <span>${APPNAME}</span></div><div class="who">👤 ${esc(cur.name)}</div>${modeBadge()}
  <div class="pbar"><i style="width:${c.done/c.total*100}%"></i></div><div class="ptxt" title="Сдано (верный ответ + фото)">📷 ${c.done}/${c.total}</div>
  <div class="tbtns"><button class="btn sm" id="bSave" title="Сохранить приложение с прогрессом и фото в файл">💾 Сохранить</button><button class="btn sm pri" id="bRep">📄 Отчёт учителю</button><button class="btn sm ghost" id="bClr" title="Очистить мой прогресс">🧹</button><button class="btn sm ghost" id="bOut">🚪 Выйти</button><button class="btn sm yel" id="bGen" title="Общие подсказки по всем темам">💡 Общие подсказки</button></div></div>`;
}
function bindTop(){
  $('#bGen').onclick=()=>{const s=stu();s.gen=(s.gen||0)+1;if(cur.n&&!solved(T(cur.n)))T(cur.n).genB=1;bump();openGeneral();};
  $('#bSave').onclick=()=>saveApp();
  $('#bClr').onclick=()=>confirmBox('Очистить весь прогресс ученика «'+esc(cur.name)+'»?<br><small style="font-weight:600;color:var(--mut)">Будут удалены фото, ответы и подсказки. Отменить нельзя.</small>',()=>{DB.students[cur.name]=newStudent(cur.name);persist();toast('Прогресс очищен');enter(cur.name);},'🧹 Очистить');
  $('#bRep').onclick=()=>{tickTime();reportDialog(cur.name);};
  $('#bOut').onclick=()=>{tickTime();persist();
    modal(`<h2>Выйти?</h2><p>Чтобы прогресс и фото не потерялись — сохрани файл.</p><div class="row"><button class="btn pri" id="sx">💾 Сохранить и выйти</button><button class="btn" id="nx">Выйти</button><button class="btn ghost" id="cx">Отмена</button></div>`);
    $('#sx').onclick=()=>{saveApp();closeModal();viewLogin();};$('#nx').onclick=()=>{closeModal();viewLogin();};$('#cx').onclick=closeModal;};
}
function sidebar(){
  const s=stu();const L=vis(s);
  return `<aside class="side">${redoOn(s)?`<div class="redo">🔁 <b>Работа над ошибками</b><br>${s.redo.list.filter(n=>solved(s.tasks[n])).length} из ${s.redo.list.length} задач</div>`:''}${TOPICS.map(tp=>{
    const ns=L.filter(n=>TASK[n].topic===tp.id);if(!ns.length)return '';const d=ns.filter(n=>solved(s.tasks[n])).length;
    const isCur=cur.n&&TASK[cur.n].topic===tp.id;
    return `<div class="tp ${isCur?'cur':''} ${d===ns.length?'fin':''}"><div class="tph" data-tp="${tp.id}"><span class="ic">${tp.icon}</span>${tp.name}<span class="done">${d}/${ns.length}</span></div>
     <div class="mini"><i style="width:${d/ns.length*100}%"></i></div>
     <div class="chips">${ns.map(n=>{const x=s.tasks[n];return `<button class="chip ${chipCls(x)} ${n===cur.n?'cur':''} ${isFipi(n)?'fp':''}" data-n="${n}" title="${esc(plain(TASK[n].q))}${isFipi(n)?' · ФИПИ':''}">${n}${x&&x.score!=null?'<i class="sc">'+x.score+'</i>':''}</button>`;}).join('')}</div></div>`;}).join('')}
   <div class="legend"><span><b class="l-right"></b>верный ответ, нет фото</span><span><b class="l-sub"></b>сдано 📷, ждёт проверки</span><span><b style="background:var(--ok)"></b>учитель: верно</span><span><b style="background:none;box-shadow:inset 0 -3px 0 #e5484d;border:1px solid var(--line)"></b>ФИПИ</span><span><b style="background:var(--bad);border-radius:50%;width:7px;height:7px"></b>была ошибка</span></div></aside>`;
}
function bindSide(){
  document.querySelectorAll('.side .chip').forEach(b=>b.onclick=()=>{tickTime();openTask(+b.dataset.n);});
  document.querySelectorAll('.tph').forEach(h=>h.onclick=()=>{tickTime();const s=stu();const ns=vis(s).filter(n=>TASK[n].topic===h.dataset.tp);openTask(ns.find(n=>!solved(s.tasks[n]))||ns[0]);});
}
function refreshSide(){const side=document.querySelector('.side');if(side){const sc=side.scrollTop;side.outerHTML=sidebar();bindSide();const ns=document.querySelector('.side');if(ns)ns.scrollTop=sc;}
  const c=counts();const pb=document.querySelector('.pbar i');if(pb)pb.style.width=(c.done/c.total*100)+'%';const pt=document.querySelector('.ptxt');if(pt)pt.textContent='📷 '+c.done+'/'+c.total;}

/* ===== Карточка задачи ===== */
function optsHTML(t,x){
  const L='АБВГ';
  return `<div class="opts2">${t.opts.map((o,i)=>{const good=x.right&&o===t.ans,bad=x.wrong.includes(o);
    return `<button class="opt ${good?'good':''} ${bad?'bad':''}" data-o="${i}" ${x.right||bad?'disabled':''}><span class="ol">${good?'✓':bad?'✕':L[i]}</span><span>${M(o)}</span></button>`;}).join('')}</div>`;
}
function todoHTML(x){
  return `<div class="todo" id="todo"><b class="tt">Чтобы сдать задание:</b><ol>
   <li>Реши задачу в тетради (или в черновике 🖍).</li>
   <li class="${x.right?'done':''}">Выбери <b>верный ответ</b> из предложенных вариантов.</li>
   <li class="${x.photos.length?'done':''}">Прикрепи <b>фото своего решения</b>.</li></ol>
   <div class="tn">Задача считается сданной, только когда есть и верный ответ, и фото решения. Окончательную оценку ставит учитель.</div></div>`;
}
function openTask(n){
  cur.n=n;cur.since=Date.now();cur.view='train';
  const s=stu();s.cur=n;s.updated=Date.now();persist();
  const t=TASK[n],x=T(n),tp=TP[t.topic],L=vis(s),idx=L.indexOf(n)+1;
  const done=solved(x);
  app().innerHTML=topbar()+`<div class="wrap">${sidebar()}<main class="main"><div class="card pop" id="card">
   <div class="chead"><span class="num">Задача ${idx} из ${L.length}</span><span class="lvl" title="Уровень: ${LVLN[t.lvl]}">${stars(n)}</span>${isFipi(n)?'<span class="badge fipi">ФИПИ</span>':''}<span class="badge tpc">${tp.name}</span></div>
   ${t.doT?`<div class="qdo">${t.doT}:</div>`:''}<div class="qtext">${M(t.q)}</div>
   ${todoHTML(x)}
   <div class="tools">
     <button class="tool" id="tH"><b>💡</b><span>Подсказка к задаче</span><small id="tHs">${x.hint?`открыто ${x.hint} из ${t.h.length}`:`${t.h.length} шт., по одной — общие идеи`}</small></button>
     <button class="tool warn" id="tSol"><b>👣</b><span>Разбор решения по шагам</span><small>${x.solV?'открывался':(isClass()?'на доске, пробел — следующий шаг':'учитель увидит, если до сдачи')}</small></button>
     <button class="tool" id="tB"><b>🖍</b><span>Черновик</span><small>рисуй, отвечай, прикрепляй</small></button>
   </div>
   <div class="hintzone" id="hz"></div>
   <div class="ansbox">
     <div class="abt">✅ Выбери верный ответ <small>${x.right?'— верно!':x.wrong.length?'— попробуй ещё':''}</small></div>
     <div id="ops">${optsHTML(t,x)}</div>
     <div class="fb ${x.right?'show good':''}" id="fb">${x.right?'Верно! Теперь прикрепи фото решения, чтобы сдать задачу.':''}</div>
     <div class="abt" style="margin-top:16px">📷 Фото решения <small>(всё решение и ответ)</small></div>
     <div class="photos" id="ph">${photosHTML(x,!done)}</div>
     <label class="btn ${x.photos.length?'':'pri'}" for="fi">📷 ${x.photos.length?'Добавить фото':'Сфотографировать / выбрать'}</label>
     <input type="file" id="fi" accept="image/*" capture="environment" multiple hidden>
     ${x.comment?`<div class="tcom">💬 Учитель: ${esc(x.comment)}</div>`:''}
     <div class="subbar" id="sbar"></div>
   </div>
  </div></main></div>`;
  bindTop();bindSide();
  const cc=document.querySelector('.chip.cur');if(cc&&window.innerWidth>860)cc.scrollIntoView({block:'nearest'});
  renderHints();renderSubbar();bindOpts(n,'#ops');
  $('#tH').onclick=()=>{if(x.hint<t.h.length){x.hint++;if(!solved(x))x.hintB=Math.max(x.hintB||0,x.hint);bump();}renderHints(true);};
  $('#tSol').onclick=()=>{if(solved(x)||x.solV||isClass()){markSol(x);openSol(n);return;}
    confirmBox('Открыть разбор решения этой задачи?<br><small style="font-weight:600;color:var(--mut)">Учитель увидит в отчёте, что разбор смотрели до сдачи. Сначала попробуй подсказки 💡</small>',()=>{markSol(x);openSol(n);},'👣 Открыть разбор');};
  $('#tB').onclick=()=>openBoard(n);
  $('#fi').onchange=async e=>{const fs=[...e.target.files];for(const f of fs){const d=await compress(f);if(d)x.photos.push({d,at:Date.now()});}bump();e.target.value='';refreshPhotos();};
  bindPhotos(x,done);
  window.scrollTo({top:0,behavior:'smooth'});
}
function markSol(x){x.solV=(x.solV||0)+1;if(!solved(x))x.solB=1;bump();const b=$('#tSol small');if(b)b.textContent='открывался';}
function refreshPhotos(){const n=cur.n,x=T(n),done=solved(x);const ph=$('#ph');if(!ph)return;ph.innerHTML=photosHTML(x,!done);bindPhotos(x,done);
  const lb=document.querySelector('label[for="fi"]');if(lb){lb.className='btn '+(x.photos.length?'':'pri');lb.textContent='📷 '+(x.photos.length?'Добавить фото':'Сфотографировать / выбрать');}
  const td=$('#todo');if(td)td.outerHTML=todoHTML(x);renderSubbar();}
function renderHints(scroll){
  const t=TASK[cur.n],x=T(cur.n);const hz=$('#hz');if(!hz)return;
  if(!x.hint){hz.innerHTML='';}
  else hz.innerHTML=`<div class="secT">💡 Подсказки к задаче <small>общие идеи, не готовое решение</small></div>`+t.h.slice(0,x.hint).map((id,i)=>`<div class="hintcard"><span class="hn">${i+1}</span><b>${GH[id].t}.</b> ${M(GH[id].x)}</div>`).join('');
  const b=$('#tHs');if(b)b.textContent=x.hint?`открыто ${x.hint} из ${t.h.length}`+(x.hint>=t.h.length?' — все':''):`${t.h.length} шт., по одной — общие идеи`;
  if(scroll)hz.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function bindOpts(n,sel){
  const t=TASK[n],x=T(n);
  document.querySelectorAll(sel+' .opt').forEach(b=>b.onclick=()=>{
    if(x.right)return;const o=t.opts[+b.dataset.o];tickTime();
    if(o===t.ans){x.right=1;x.pick=o;x.rightAt=Date.now();}
    else{if(!x.wrong.includes(o))x.wrong.push(o);x.pick=o;}
    bump();
    document.querySelectorAll('#ops,#bOps').forEach(box=>{box.innerHTML=optsHTML(t,x);});
    bindOpts(n,'#ops');bindOpts(n,'#bOps');
    document.querySelectorAll('#fb,#bfb').forEach(fb=>{fb.className='fb show '+(x.right?'good':'bad');fb.innerHTML=x.right?(x.photos.length?'Верно! ✓ Фото есть — можно сдавать.':'Верно! ✓ Теперь прикрепи фото решения, чтобы сдать задачу.'):'Неверно. Проверь решение — может, ошибка в знаке или потерян корень? Подсказки 💡 помогут.';});
    const abt=document.querySelector('.ansbox .abt small');if(abt)abt.textContent=x.right?'— верно!':'— попробуй ещё';
    const td=$('#todo');if(td)td.outerHTML=todoHTML(x);
    renderSubbar();refreshSide();
  });
}
function renderSubbar(){
  const n=cur.n,x=T(n),sb=$('#sbar');if(!sb)return;
  if(solved(x)){sb.innerHTML=`<span class="st-ok">📷 Решение сдано · ждёт проверки учителя${x.score!=null?' · оценка: '+x.score+' из 2':''}</span><button class="btn pri" id="bNext">Дальше ➜</button>`;$('#bNext').onclick=goNext;return;}
  const ready=x.right&&x.photos.length;
  sb.innerHTML=`<button class="btn ${ready?'ok':'pri'}" id="bSub" style="${ready?'':'opacity:.75'}">✅ Сдать и дальше ➜</button><button class="btn ghost" id="bSkip">⏭ Пропустить</button><span style="color:var(--mut);font-size:13px">${ready?'Всё готово!':!x.right&&!x.photos.length?'Нужны верный ответ и фото решения':!x.right?'Осталось выбрать верный ответ':'Осталось прикрепить фото решения'}</span>`;
  $('#bSub').onclick=()=>{
    if(!ready){const miss=[];if(!x.right)miss.push('выбери верный ответ');if(!x.photos.length)miss.push('прикрепи фото решения');
      const b=$('#bSub');b.classList.remove('need');void b.offsetWidth;b.classList.add('need');
      toast('Задача ещё не сдана: '+miss.join(' и ')+'.<br>Не готов(а)? Нажми «⏭ Пропустить» или выбери другую задачу слева.',4200);return;}
    tickTime();x.st='sub';x.when=Date.now();bump();refreshSide();toast('📷 Решение сдано! Учитель проверит.');goNext();};
  $('#bSkip').onclick=()=>{x.skip=(x.skip||0)+1;bump();tickTime();goNext();};
}
function photosHTML(x,canDel){
  if(!x.photos.length)return '<div class="nophoto">Фото пока нет</div>';
  return x.photos.map((p,i)=>`<div class="ph"><img src="${p.d}" data-i="${i}">${canDel?`<button class="phx" data-x="${i}" title="Удалить">✕</button>`:''}</div>`).join('');
}
function bindPhotos(x,done){
  document.querySelectorAll('#ph .ph img').forEach(im=>im.onclick=()=>modal(`<img src="${im.src}" style="width:100%;border-radius:12px"><div class="row" style="margin-top:10px"><button class="btn" onclick="closeModal()">Закрыть</button></div>`,true));
  document.querySelectorAll('#ph .phx').forEach(b=>b.onclick=()=>{x.photos.splice(+b.dataset.x,1);bump();refreshPhotos();});
}
function compress(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const mx=1400;let w=im.width,h=im.height;const k=Math.min(1,mx/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(im,0,0,w,h);res(c.toDataURL('image/jpeg',0.72));};im.onerror=()=>res(null);im.src=r.result;};r.onerror=()=>res(null);r.readAsDataURL(file);});}
function bump(){const s=stu();if(s){s.updated=Date.now();}persist();}
function goNext(){const nx=nextUnsolved(cur.n);if(!nx){viewDone();return;}openTask(nx);}
function viewDone(){
  cur.view='done';tickTime();
  const s=stu();
  app().innerHTML=topbar()+`<div class="wrap">${sidebar()}<main class="main"><div class="card done-card pop"><div class="big">🏆</div><h1>${s.redo&&s.redo.list.length&&s.redo.list.every(n=>solved(s.tasks[n]))?'Работа над ошибками сдана!':'Все задачи сданы!'}</h1>
  <div class="stats" style="max-width:760px;margin:16px auto">${statTiles(cur.name)}</div>
  <p>Сформируй отчёт для учителя — в нём будут твои фото и ответы. И сохрани файл с прогрессом.</p>
  <div class="row" style="justify-content:center"><button class="btn pri" id="dR">📄 Отчёт учителю</button><button class="btn" id="dS">💾 Сохранить прогресс</button></div></div></main></div>`;
  bindTop();bindSide();$('#dR').onclick=()=>reportDialog(cur.name);$('#dS').onclick=()=>saveApp();
}
function statTiles(name){
  const r=calcReport(name);

/* ===== Разбор решения: модальное окно, шаги по «Далее» / пробелу ===== */
function openSol(n,startMode){
  const t=TASK[n],steps=stepsOf(t);let k=0,mode=startMode||'steps';
  modal(`<div class="soltop"><h2>👣 Разбор решения · задача ${n}</h2>
     <div class="seg"><button id="mS">👣 По шагам</button><button id="mA">📄 Решение целиком</button></div>
     <span id="sPr" style="font-weight:800;color:var(--mut)"></span>
     <button class="btn ghost" id="sX">✕</button></div>
   <div class="solq">${t.doT?`<div class="qdo">${t.doT}:</div>`:''}<div class="qt">${M(t.q)}</div></div>
   <div id="sBub"></div>
   <div class="solbody" id="sBody"><div class="solL" id="sL"></div><div class="solR" id="sR"></div></div>
   <div class="solnav" id="sNav"><button class="btn" id="sP">← Назад</button><button class="btn pri" id="sN">Далее → <small style="opacity:.8">(пробел)</small></button><button class="btn ghost" id="sE">⏭ В конец</button><button class="btn ghost" id="sW">📄 Показать решение целиком</button></div>`,'sol');
  const render=()=>{
    $('#mS').classList.toggle('on',mode==='steps');$('#mA').classList.toggle('on',mode==='all');
    if(mode==='all'){
      $('#sBub').innerHTML=`<div class="bubble"><span class="bn">Бланк ОГЭ</span>Только то, что нужно записать в бланк на полный балл. Проверку подстановкой в бланк не пишем.</div>`;
      $('#sBody').classList.add('blank');$('#sR').style.display='none';
      $('#sL').innerHTML=blankHTML(t);$('#sNav').style.display='none';$('#sPr').textContent='';$('#sL').scrollTop=0;return;}
    $('#sBody').classList.remove('blank');$('#sR').style.display='';$('#sNav').style.display='';
    const st=steps[k];
    $('#sPr').textContent=`Шаг ${k+1} из ${steps.length}`;
    $('#sBub').innerHTML=`<div class="bubble"><span class="bn">Шаг ${k+1}</span>${M(st.c)}</div>`;
    $('#sL').innerHTML=`<div class="hw"><div class="hw-h">Решение.</div>${steps.slice(0,k+1).map((s,i)=>s.w.length?`<div class="${i===k?'newstep':''}">${s.w.map(w=>wItem(w)).join('')}</div>`:'').join('')}</div>`;
    const fs=[];steps.slice(0,k+1).forEach((s,i)=>s.f.forEach(f=>{if(!fs.some(z=>z.f===f))fs.push({f,i});}));
    let r='';
    if(fs.length)r+=`<div class="card2"><h4>📐 Используем</h4>${fs.map(z=>`<div class="fml ${z.i===k?'new':''}">${M(z.f)}</div>`).join('')}</div>`;
    const ci=steps.findIndex(s=>s.chk);
    if(ci>=0&&k>=ci)r+=`<div class="chkcard ${k===ci?'new':''}"><span class="dn">✋ Только в черновик!</span><div style="font-weight:800;font-family:Nunito,sans-serif;font-size:14px;color:#8a6400;margin-bottom:4px">${t.chkT||'Проверка корней подстановкой'} — в бланк не пишем</div>${t.chk.map(l=>`<p>${M(l)}</p>`).join('')}</div>`;
    if(!r)r='<div class="card2" style="color:var(--mut);font-size:14px">Здесь появятся формулы, которыми пользуемся, и проверка в черновике.</div>';
    $('#sR').innerHTML=r;
    $('#sP').disabled=k===0;$('#sN').disabled=k===steps.length-1;$('#sE').disabled=k===steps.length-1;
    const L=$('#sL');L.scrollTop=L.scrollHeight;
  };
  const next=()=>{if(mode==='steps'&&k<steps.length-1){k++;render();}};
  const prev=()=>{if(mode==='steps'&&k>0){k--;render();}};
  const key=e=>{if(!document.getElementById('sBody'))return;if(e.code==='Space'||e.key==='ArrowRight'||e.key==='ArrowDown'||e.key==='PageDown'){e.preventDefault();next();}else if(e.key==='ArrowLeft'||e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();prev();}};
  document.addEventListener('keydown',key);MCLEAN=()=>document.removeEventListener('keydown',key);
  $('#sX').onclick=closeModal;$('#sN').onclick=next;$('#sP').onclick=prev;$('#sE').onclick=()=>{k=steps.length-1;render();};
  $('#sW').onclick=()=>{mode='all';render();};$('#mS').onclick=()=>{mode='steps';render();};$('#mA').onclick=()=>{mode='all';render();};
  document.querySelectorAll('#mbg button').forEach(b=>b.addEventListener('keydown',e=>{if(e.code==='Space')e.preventDefault();}));
  render();
}

function openBoard(n){
  const t=TASK[n],x=T(n);x.brd=(x.brd||0)+1;bump();
  modal(`<div class="bwrap"><div class="btool"><b style="margin-right:6px">🖍 Черновик · задача ${n}</b>
   ${['#22304d','#e5484d','#2f6fe4','#13a37a','#f08c00'].map((c,i)=>`<button class="pcol ${i===0?'on':''}" data-pc="${c}" style="background:${c}"></button>`).join('')}
   <button class="btn sm" data-pw="2.5">тонко</button><button class="btn sm" data-pw="5">толсто</button><button class="btn sm" id="bEr">🧽 Ластик</button><button class="btn sm" id="bUn">↶ Отменить</button><button class="btn sm" id="bCl">🗑 Стереть всё</button>
   <button class="btn sm" id="bPn">✅ Варианты ответа</button><button class="btn sm" id="bPh" title="Прикрепить рисунок черновика как фото решения">📷 Прикрепить как фото</button>
   <button class="btn sm ghost" id="bX" style="margin-left:auto">✕ Закрыть</button></div>
   <div class="bq">${t.doT?`<span class="qdo" style="display:inline;margin-right:8px">${t.doT}:</span>`:''}${M(t.q)}</div>
   <div class="bmain"><div class="bstage" id="bst"><canvas id="bcv"></canvas></div>
    <div class="bpanel" id="bpn" style="${cur.bpanel===false?'display:none':''}"><div class="abt">✅ Выбери верный ответ</div><div id="bOps">${optsHTML(t,x)}</div><div class="fb ${x.right?'show good':''}" id="bfb">${x.right?'Верно! ✓':''}</div>
     <p style="font-size:13px;color:var(--mut)">Черновик не пропадёт: он сохраняется, пока открыто приложение. Можно прикрепить его как фото решения.</p></div></div></div>`,'brd');
  const cv=$('#bcv'),st=$('#bst');const dpr=window.devicePixelRatio||1;let ctx=cv.getContext('2d');
  const hist=[];
  const fit=()=>{const r=st.getBoundingClientRect();const old=cv.width?cv.toDataURL():null;cv.width=Math.max(10,r.width*dpr);cv.height=Math.max(10,r.height*dpr);ctx=cv.getContext('2d');if(old){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0);im.src=old;}};
  const r0=st.getBoundingClientRect();cv.width=r0.width*dpr;cv.height=r0.height*dpr;
  if(cur.boards[n]){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0);im.src=cur.boards[n];}
  let col='#22304d',w=2.5,er=false,drawing=false,last=null;
  const pos=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*dpr,(e.clientY-r.top)*dpr];};
  cv.addEventListener('pointerdown',e=>{drawing=true;last=pos(e);cv.setPointerCapture(e.pointerId);try{hist.push(ctx.getImageData(0,0,cv.width,cv.height));if(hist.length>25)hist.shift();}catch(_){}
    ctx.globalCompositeOperation=er?'destination-out':'source-over';ctx.fillStyle=col;ctx.beginPath();ctx.arc(last[0],last[1],(er?w*6:w)*dpr/2,0,7);ctx.fill();});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);ctx.globalCompositeOperation=er?'destination-out':'source-over';ctx.strokeStyle=col;ctx.lineWidth=(er?w*6:w)*dpr;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p;});
  const stop=()=>{drawing=false;};cv.addEventListener('pointerup',stop);cv.addEventListener('pointercancel',stop);
  document.querySelectorAll('[data-pc]').forEach(b=>b.onclick=()=>{col=b.dataset.pc;er=false;document.querySelectorAll('[data-pc]').forEach(z=>z.classList.toggle('on',z===b));$('#bEr').classList.remove('pri');});
  document.querySelectorAll('[data-pw]').forEach(b=>b.onclick=()=>{w=+b.dataset.pw;});
  $('#bEr').onclick=()=>{er=!er;$('#bEr').classList.toggle('pri',er);};
  $('#bUn').onclick=()=>{const h=hist.pop();if(h)ctx.putImageData(h,0,0);};
  $('#bCl').onclick=()=>{try{hist.push(ctx.getImageData(0,0,cv.width,cv.height));}catch(_){}ctx.clearRect(0,0,cv.width,cv.height);};
  $('#bPn').onclick=()=>{const p=$('#bpn');const show=p.style.display==='none';p.style.display=show?'':'none';cur.bpanel=show;setTimeout(fit,30);};
  $('#bPh').onclick=()=>{const c=document.createElement('canvas');c.width=cv.width;c.height=cv.height;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(cv,0,0);
    const sc=Math.min(1,1400/Math.max(c.width,c.height));const c2=document.createElement('canvas');c2.width=c.width*sc;c2.height=c.height*sc;c2.getContext('2d').drawImage(c,0,0,c2.width,c2.height);
    x.photos.push({d:c2.toDataURL('image/jpeg',0.8),at:Date.now(),board:1});bump();toast('📷 Черновик прикреплён как фото решения');};
  bindOpts(n,'#bOps');
  const save=()=>{try{cur.boards[n]=cv.toDataURL('image/png');}catch(e){}window.removeEventListener('resize',fit);if(cur.n===n&&cur.view==='train'&&document.getElementById('card'))openTaskKeep(n);};
  window.addEventListener('resize',fit);MCLEAN=save;
  $('#bX').onclick=closeModal;
}

  const byTopic=TOPICS.filter(tp=>rows.some(r=>r.t.topic===tp.id)).map(tp=>{const rs=rows.filter(r=>r.t.topic===tp.id);return {tp,total:rs.length,done:rs.filter(r=>solved(r.x)).length,self:rs.filter(r=>solved(r.x)&&!r.x.hintB&&!r.x.solB).length,help:rs.filter(r=>solved(r.x)&&(r.x.hintB||r.x.solB)).length,pts:rs.reduce((a,r)=>a+(r.x.score||0),0),sc:rs.filter(r=>r.x.score!=null).length};});
  return {s,c,rows,byTopic};
}

function svgImg(svg){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);});}
function urlImg(u){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=u;});}
function splitWords(s){const out=[];let d=0,b=0,cur='';for(let i=0;i<s.length;i++){const ch=s[i];if(ch==='{')d++;if(ch==='}')d--;if(ch==='['&&s[i+1]==='[')b++;if(ch===']'&&s[i+1]===']')b--;if(ch==='⟦')b++;if(ch==='⟧')b--;if(ch===' '&&d===0&&b===0){if(cur)out.push(cur);cur='';}else cur+=ch;}if(cur)out.push(cur);return out;}
function wrapM(s,w,sz){const ws=splitWords(s);const lines=[];let line='';ws.forEach(x=>{const t=line?line+' '+x:x;if(mw(t,sz)>w&&line){lines.push(line);line=x;}else line=t;});if(line)lines.push(line);return lines;}
function fSVG(s,W,SZ,col){const ls=wrapM(s,W-8,SZ);let y=0,o='';ls.forEach(l=>{const h=Math.max(mh(l,SZ),SZ)+14;o+=sdraw(l,4,y+h/2,SZ,col||'#1d2640',500);y+=h;});return {o,h:y};}
async function drawF(ctx,s,x,y,W,SZ,col){const f=fSVG(s,W,SZ,col);try{const im=await svgImg(`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${f.h}" font-family="Segoe UI,Arial">${f.o}</svg>`);ctx.drawImage(im,x,y,W,f.h);}catch(e){}return f.h;}
async function makeReportPDF(name){
  const mm=document.getElementById('rMsg');if(mm)mm.innerHTML='<div class="fb show good">⏳ Формирую PDF…</div>';
  const r=calcReport(name),R=DB.teacher.rep;const W=1240,H=1754,MX=70;

  const newPage=()=>{cv=document.createElement('canvas');cv.width=W;cv.height=H;ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);pages.push(cv);y=70;};
  const F=(sz,b)=>`${b?'bold ':''}${sz}px "Segoe UI",Roboto,Arial,sans-serif`;
  const text=(s,x,yy,sz,col,b,al)=>{ctx.font=F(sz,b);ctx.fillStyle=col||'#1d2640';ctx.textAlign=al||'left';ctx.fillText(s,x,yy);};

  newPage();
  const gr=ctx.createLinearGradient(0,0,W,0);gr.addColorStop(0,'#4f6bff');gr.addColorStop(1,'#7b5cff');ctx.fillStyle=gr;ctx.fillRect(0,0,W,190);
  text('Отчёт ученика',MX,82,48,'#fff',1);text('Тренажёр «'+APPNAME+'» · '+(r.s.redo&&r.s.redo.list.length?'работа над ошибками':'задание: '+r.c.total+' задач'),MX,130,26,'#e8ebff');
  text(new Date().toLocaleString('ru-RU'),W-MX,82,24,'#e8ebff',0,'right');
  y=250;text('Ученик: '+name,MX,y,36,'#1d2640',1);y+=46;
  text('Дни занятий: '+((r.s.days||[]).map(d=>d.split('-').reverse().join('.')).join(', ')||'—'),MX,y,22,'#555');y+=32;
  text(`Время: ${fmtT(r.s.totalMs||0)} · Общие подсказки открывались: ${r.s.gen||0} раз${DB.teacher.name?' · Учитель: '+DB.teacher.name:''}`,MX,y,22,'#555');y+=40;
  const tiles=[['Сдано (ответ + фото)',r.c.done+' / '+r.c.total,'#e8ecff','#3b4fd8'],['Сам, без подсказок',r.c.self,'#dff6ea','#0f7a4d'],['С подсказками',r.c.hint,'#fff2cc','#8a6400'],['После разбора',r.c.sol,'#ffe8d6','#b04e10'],['Верно, нет фото',r.c.right,'#eef2f8','#555'],['Баллы учителя',r.c.scored?r.c.points+' / '+r.c.scored*2:'—','#ece3ff','#6b3fd1']];
  const tw=(W-2*MX-5*14)/6;

  y+=170;text('По темам',MX,y,30,'#1d2640',1);y+=20;

  y+=36;text('Все задачи',MX,y,30,'#1d2640',1);y+=18;
  const cx=[MX,MX+130,MX+420,MX+560,MX+930,MX+1010];rr(MX,y,W-2*MX,40,10,'#f1f3fa');['Задача','Итог','Ответ','Подсказки','Оценка','Время'].forEach((h,i)=>text(h,cx[i]+10,y+27,18,'#555',1));y+=40;
  const stCol=x=>x.st==='sub'?(x.solB?['#ffe8d6','#b04e10']:x.hintB?['#fff2cc','#8a6400']:['#dff6ea','#0f7a4d']):x.right?['#eef2f8','#3b4fd8']:['#f1f3fa','#888'];
  r.rows.forEach((w,i)=>{if(y>H-110){newPage();}const x=w.x;if(i%2)rr(MX,y,W-2*MX,36,6,'#fafbfe');
    text('№ '+w.n+(isFipi(w.n)?' · ФИПИ':''),cx[0]+10,y+25,16,'#1d2640',1);const sc=stCol(x);rr(cx[1]+4,y+5,276,26,13,sc[0]);text(stTxt(x),cx[1]+142,y+24,15,sc[1],1,'center');
    text(R.pick?(x.right?'верно':x.wrong.length?'ошибок: '+x.wrong.length:'—'):'',cx[2]+10,y+25,15,x.right?'#0f7a4d':'#c0262c');
    let hs=R.help?helpTxt(x,w.t):'';ctx.font=F(15);while(ctx.measureText(hs).width>360&&hs.length>3)hs=hs.slice(0,-2);text(hs,cx[3]+10,y+25,15,hs==='без подсказок'?'#999':'#8a6400');
    text(x.score!=null?x.score+' из 2':'—',cx[4]+10,y+25,16,'#333');text(x.t?fmtT(x.t):'—',cx[5]+10,y+25,16,'#555');y+=36;});
  // карточки задач
  for(const w of r.rows.filter(w=>solved(w.x)||(w.x.hist&&w.x.hist.length)||(R.unsub&&(w.x.right||w.x.wrong.length||w.x.photos.length)))){
    newPage();const t=w.t,x=w.x;
    text('Задача № '+t.n+(isFipi(t.n)?'  ·  ФИПИ':'')+'  ·  '+TP[t.topic].name,MX,y,30,'#1d2640',1);y+=24;
    if(t.doT){text(t.doT+':',MX,y+18,20,'#666');y+=30;}
    y+=await drawF(ctx,t.q,MX,y,W-2*MX,26)+14;
    const info=[['Итог',stTxt(x)]];
    if(R.pick){info.push(['Выбранный ответ',x.pick?plain(x.pick)+(x.right?'  ✓':''):'—']);if(x.wrong.length)info.push(['Ошибочные ответы',x.wrong.map(plain).join(';  ')]);}
    if(R.help)info.push(['Подсказки',helpTxt(x,t)]);
    if(R.ans)info.push(['Правильный ответ',plain(t.ans)]);
    info.push(['Оценка учителя',x.score!=null?x.score+' из 2'+(x.comment?' — '+x.comment:''):'не проверено']);
    if(x.hist&&x.hist.length){const hh=x.hist[x.hist.length-1];info.push(['До работы над ошибками',hh.st+(hh.score!=null?', оценка '+hh.score:'')+', '+hh.help]);}
    info.forEach(([a,b])=>{text(a+':',MX,y+20,19,'#777',1);const k=wrap(b,MX+270,y+20,W-2*MX-270,19,a==='Правильный ответ'?'#0f7a4d':'#1d2640',a==='Правильный ответ',26);y+=26*k+6;});
    y+=10;

      text('Фото решения ученика'+(x.photos.length?'':' (прежняя попытка)'),MX,y+18,19,'#555',1);y+=30;

      const colW=pics.length>1?(W-2*MX-20)/2:W-2*MX;let col=0,rowH=0;
      for(const p of pics){try{const im=await urlImg(p.d);let sc=Math.min(colW/im.width,(H-y-110)/im.height);if(sc*im.height<200&&y>H/2){newPage();sc=Math.min(colW/im.width,(H-y-110)/im.height);}
        const iw=im.width*sc,ih=im.height*sc,px=MX+col*(colW+20);ctx.drawImage(im,px,y,iw,ih);rr(px,y,iw,ih,6,null,'#ccd');rowH=Math.max(rowH,ih);col++;if(col>1||pics.length===1){col=0;y+=rowH+16;rowH=0;if(y>H-260)newPage();}}catch(e){}}

  const urls=pages.map(p=>p.toDataURL('image/jpeg',0.86));

  const imgs=urls.map(u0=>{const d=atob(u0.split(',')[1]);const u=new Uint8Array(d.length);for(let i=0;i<d.length;i++)u[i]=d.charCodeAt(i);return u;});
  const blob=pdfFromJpegs(imgs,W,H);const fn='Отчёт_алгебра_ОГЭ_'+name.replace(/[^\wА-Яа-яЁё-]+/g,'_')+'_'+dstamp()+'.pdf';
  try{return new File([blob],fn,{type:'application/pdf'});}catch(e){blob.name=fn;return blob;}
}
function pdfFromJpegs(imgs,w,h){
  const enc=new TextEncoder();const parts=[];let len=0;const offs=[];
  const add=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length;};
  const PW=595.28,PH=841.89;const n=imgs.length;
  add('%PDF-1.4\n');
  const obj=(id,body)=>{offs[id]=len;add(id+' 0 obj\n');body();add('\nendobj\n');};
  obj(1,()=>add('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>add(`<< /Type /Pages /Count ${n} /Kids [${imgs.map((_,i)=>(3+i*3)+' 0 R').join(' ')}] >>`));
  imgs.forEach((im,i)=>{const p=3+i*3,c=p+1,x=p+2;
    obj(p,()=>add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im${i} ${x} 0 R >> >> /Contents ${c} 0 R >>`));
    const cs=`q ${PW} 0 0 ${PH} 0 0 cm /Im${i} Do Q`;
    obj(c,()=>add(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(x,()=>{add(`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.length} >>\nstream\n`);add(im);add('\nendstream');});});
  const total=3+n*3;const xref=len;let x=`xref\n0 ${total}\n0000000000 65535 f \n`;for(let i=1;i<total;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  add(x);add(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'});
}
