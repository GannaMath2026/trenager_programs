<script>
/* ===== Формулы ===== */
function tok(s){
  const out=[];let buf='';
  const flush=()=>{if(buf){out.push({k:'t',s:buf});buf='';}};
  const match=(i)=>{let d=0;for(let j=i;j<s.length;j++){if(s[j]==='{')d++;else if(s[j]==='}'){d--;if(d===0)return j;}}return s.length-1;};
  for(let i=0;i<s.length;i++){
    const ch=s[i];
    if(ch==='√'&&s[i+1]==='{'){flush();const e=match(i+1);out.push({k:'sq',s:s.slice(i+2,e)});i=e;continue;}
    if(ch==='^'&&s[i+1]==='{'){flush();const e=match(i+1);out.push({k:'sup',s:s.slice(i+2,e)});i=e;continue;}
    if(ch==='_'&&s[i+1]==='{'){flush();const e=match(i+1);out.push({k:'sub',s:s.slice(i+2,e)});i=e;continue;}
    if(ch==='{'){
      const e=match(i);const inner=s.slice(i+1,e);
      let d=0,cut=-1;for(let j=0;j<inner.length;j++){const c=inner[j];if(c==='{')d++;else if(c==='}')d--;else if(c==='/'&&d===0){cut=j;break;}}
      flush();
      if(cut>=0)out.push({k:'fr',n:inner.slice(0,cut),d:inner.slice(cut+1)});
      else out.push({k:'g',s:inner});
      i=e;continue;
    }
    buf+=ch;
  }
  flush();return out;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function M(s){
  if(s==null)return '';
  return tok(String(s)).map(t=>{
    if(t.k==='t')return t.s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    if(t.k==='sq')return '<span class="sq"><span class="rd">√</span><span class="ov">'+M(t.s)+'</span></span>';
    if(t.k==='sup')return '<sup>'+M(t.s)+'</sup>';
    if(t.k==='sub')return '<sub>'+M(t.s)+'</sub>';
    if(t.k==='fr')return '<span class="fr"><span class="nu">'+M(t.n)+'</span><span class="de">'+M(t.d)+'</span></span>';
    return M(t.s);
  }).join('');
}

/* ===== Темы и задачи ===== */
const APPNAME='Уравнения · ОГЭ';
const TOPICS=[
  {id:'poly',name:'Многочлены и разложение',icon:'📐'},
  {id:'sub',name:'Замена (t = выражение)',icon:'🔄'},
  {id:'rat',name:'Дробно-рациональные',icon:'➗'},
  {id:'root',name:'С корнями',icon:'√'},
  {id:'sq0',name:'Сумма квадратов = 0',icon:'⬜'},
  {id:'ineq',name:'Неравенства с дробями',icon:'⚖️'},
  {id:'ineq2',name:'Неравенства с квадратами',icon:'📊'},
  {id:'pow',name:'Степени и одинаковые скобки',icon:'⚡'},
  {id:'frac',name:'Сокращение дробей',icon:'✂️'}
];

/* Каждый блок: code, kind П/А, topic, q (условие), ans (строка ответа), odz (описание ОДЗ),
   roots (массив чисел-корней до проверки ОДЗ), domainFn (x)=>bool, steps (шаги для подсказок),
   solHW (массив строк рукописного решения) */
const RAW=[
/* —— Многочлены —— */
{c:'01',k:'П',t:'poly',title:'Куб + квадрат = линейное',
 q:'x^{3} + 5x^{2} = 9x + 45.',
 ans:'−5; −3; 3', roots:[-5,-3,3], odz:'все действительные',
 domainFn:()=>true,
 steps:[
  'Перенесём всё влево: x^{3} + 5x^{2} − 9x − 45 = 0.',
  'Сгруппируем: (x^{3} − 9x) + (5x^{2} − 45) = 0 → x(x^{2} − 9) + 5(x^{2} − 9) = 0.',
  '(x^{2} − 9)(x + 5) = 0 → (x − 3)(x + 3)(x + 5) = 0.',
  'x = 3, x = −3, x = −5. ОДЗ — все R, все корни подходят.'
 ],
 solHW:[
  'x³ + 5x² = 9x + 45',
  'x³ + 5x² − 9x − 45 = 0',
  '(x³ − 9x) + (5x² − 45) = 0',
  'x(x² − 9) + 5(x² − 9) = 0',
  '(x² − 9)(x + 5) = 0',
  '(x − 3)(x + 3)(x + 5) = 0',
  'x = 3  или  x = −3  или  x = −5',
  'ОДЗ: x ∈ R — все корни подходят.',
  'Ответ: −5; −3; 3'
 ]},
{c:'01',k:'А',t:'poly',title:'Аналог куба',
 q:'x^{3} + 4x^{2} = 4x + 16.',
 ans:'−4; −2; 2', roots:[-4,-2,2], odz:'все действительные', domainFn:()=>true,
 steps:[
  'x^{3} + 4x^{2} − 4x − 16 = 0',
  '(x^{3} − 4x) + (4x^{2} − 16) = 0 → x(x^{2} − 4) + 4(x^{2} − 4) = 0',
  '(x^{2} − 4)(x + 4) = 0 → (x − 2)(x + 2)(x + 4) = 0',
  'x = 2, −2, −4. Все подходят.'
 ],
 solHW:['x³ + 4x² = 4x + 16','x³ + 4x² − 4x − 16 = 0','x(x² − 4) + 4(x² − 4) = 0','(x² − 4)(x + 4) = 0','(x − 2)(x + 2)(x + 4) = 0','x = 2, x = −2, x = −4','Ответ: −4; −2; 2']},
{c:'01',k:'А',t:'poly',title:'Аналог 2',
 q:'x^{3} + 6x^{2} = 9x + 54.',
 ans:'−6; −3; 3', roots:[-6,-3,3], odz:'все действительные', domainFn:()=>true,
 steps:['x^{3} + 6x^{2} − 9x − 54 = 0','(x^{3} − 9x) + (6x^{2} − 54) = 0','x(x^{2} − 9) + 6(x^{2} − 9) = 0','(x^{2} − 9)(x + 6) = 0','x = 3, −3, −6'],
 solHW:['x³ + 6x² − 9x − 54 = 0','(x² − 9)(x + 6) = 0','x = 3, x = −3, x = −6','Ответ: −6; −3; 3']},

/* —— Раскрытие скобок / разложение —— */
{c:'08',k:'П',t:'poly',title:'(x−1)(x²+6x+9) = x²+12x+27',
 q:'(x − 1)(x^{2} + 6x + 9) = x^{2} + 12x + 27.',
 ans:'−4; −3; 3', roots:[-4,-3,3], odz:'все действительные',

/* ===== Числовая прямая + подвижная дуга ОДЗ ===== */
function odzSVG(odzDesc, domainFn, roots, highlightRoots, W){
  W=W||560; const H=110, pad=40, yl=48;
  // точки на прямой: −6 … 6
  const mn=-6, mx=6;
  const X=v=>pad+(v-mn)/(mx-mn)*(W-2*pad);
  let o=`<line x1="${pad-12}" y1="${yl}" x2="${W-pad+12}" y2="${yl}" stroke="#1d3fa6" stroke-width="2.2"/>`;
  o+=`<path d="M${W-pad+6},${yl} l-10,-5 v10z" fill="#1d3fa6"/>`;
  o+=`<text x="${W-pad+4}" y="${yl+28}" font-size="18" font-family="Caveat,cursive" fill="#1d3fa6">x</text>`;
  // деления
  for(let v=mn;v<=mx;v++){
    const x=X(v);
    o+=`<line x1="${x}" y1="${yl-6}" x2="${x}" y2="${yl+6}" stroke="#1d3fa6" stroke-width="1.5"/>`;
    if(v!==0)o+=`<text x="${x}" y="${yl+26}" font-size="15" font-family="Caveat,cursive" text-anchor="middle" fill="#555">${v}</text>`;
    else o+=`<text x="${x}" y="${yl+26}" font-size="15" font-family="Caveat,cursive" text-anchor="middle" fill="#1d3fa6">0</text>`;
  }
  // дуга / штриховка ОДЗ: сканируем
  const segs=[];
  let inDom=false, start=mn;
  for(let i=0;i<=200;i++){
    const v=mn+(mx-mn)*i/200;
    const ok=domainFn(v);
    if(ok&&!inDom){start=v;inDom=true;}
    if(!ok&&inDom){segs.push([start,v]);inDom=false;}
  }
  if(inDom)segs.push([start,mx]);
  segs.forEach(([a,b])=>{
    const x1=X(a),x2=X(b);
    // дуга сверху
    const mid=(x1+x2)/2, lift=22;
    o+=`<path d="M${x1},${yl-2} Q${mid},${yl-2-lift} ${x2},${yl-2}" fill="none" stroke="#16a36a" stroke-width="3.5" opacity=".85"/>`;
    o+=`<rect x="${x1}" y="${yl-3}" width="${Math.max(0,x2-x1)}" height="6" fill="#16a36a" opacity=".25"/>`;
  });
  // корни
  if(roots&&roots.length){
    roots.forEach(r=>{
      if(r<mn-0.5||r>mx+0.5)return;
      const ok=domainFn(r);
      const col=ok?'#16a36a':'#c0262c';
      const x=X(r);
      o+=`<circle cx="${x}" cy="${yl}" r="7" fill="${ok?'#16a36a':'#fff'}" stroke="${col}" stroke-width="2.5"/>`;
      o+=`<text x="${x}" y="${yl-14}" font-size="16" font-family="Caveat,cursive" text-anchor="middle" fill="${col}" font-weight="700">${String(r).replace('-','−')}</text>`;
    });
  }
  // подпись ОДЗ
  o+=`<text x="${W/2}" y="${H-8}" font-size="16" font-family="Caveat,cursive" text-anchor="middle" fill="#0f7a4d">ОДЗ: ${esc(odzDesc)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${o}</svg>`;
}

/* Интерактивная ОДЗ с бегунком */
function interactiveOdz(t){
  const id='odz'+t.n;
  return `<div class="odz-wrap" id="${id}">
    <div class="bubble"><span class="bn">ОДЗ</span> Зелёная дуга — область определения. Красная точка — корень вне ОДЗ, зелёная — подходит.</div>
    <div class="odz-svg">${odzSVG(t.odz,t.domainFn,t.roots,true,560)}</div>
    <div class="odz-controls">
      <span style="font-weight:700">Проверить точку:</span>
      <input type="range" min="-6" max="6" step="0.05" value="0" class="odz-range">
      <span class="odz-val">x = 0</span>
      <span class="odz-ok" style="font-weight:800"></span>
    </div>
  </div>`;
}
function bindOdz(t){
  const wrap=document.getElementById('odz'+t.n);if(!wrap)return;
  const range=wrap.querySelector('.odz-range');
  const val=wrap.querySelector('.odz-val');
  const ok=wrap.querySelector('.odz-ok');
  const svgBox=wrap.querySelector('.odz-svg');
  const redraw=(v)=>{
    val.textContent='x = '+(+v).toFixed(2).replace(/\.?0+$/,'');
    const good=t.domainFn(+v);
    ok.textContent=good?'✓ в ОДЗ':'✗ вне ОДЗ';
    ok.style.color=good?'#16a36a':'#c0262c';
    // подвижная точка
    const roots=[...(t.roots||[]),+v];
    svgBox.innerHTML=odzSVG(t.odz,t.domainFn,roots,true,560);
  };
  range.oninput=()=>redraw(range.value);
  redraw(0);
}

/* ===== Рукописное решение ===== */
function sampleHTML(t,forPrint){
  const lines=(t.solHW||[]).map(l=>{
    if(l.startsWith('Ответ:'))return `<p class="hans">${M(l)}</p>`;
    if(l.includes('не подходит')||l.includes('отбрасываем')||l.includes('≰')||l.includes('Нет →'))return `<p class="reject">${M(l)}</p>`;
    if(l.includes('подходит')||l.includes('✓')||l.includes('Да →'))return `<p class="check">${M(l)}</p>`;
    if(l.startsWith('ОДЗ'))return `<p><b>${M(l)}</b></p>`;
    return `<p>${M(l)}</p>`;
  }).join('');
  const odzFig=`<div class="odzbox">${odzSVG(t.odz,t.domainFn,t.roots,true,480)}</div>`;
  return `<div class="hw ${forPrint?'hwp':''}"><div class="hw-h">Решение.</div>${lines}${odzFig}</div>`;
}

  renderTask(cur);
  $('#memo').onclick=()=>{s.memo=(s.memo||0)+1;persist();openMemo();};
  $('#rep').onclick=()=>reportDialog(s.name,false);
  $('#out').onclick=()=>{DB.curName=null;persist();viewLogin();};
}
function renderSide(){
  const s=getS();const L=vis(s);
  const byTp={};TOPICS.forEach(tp=>{const ns=L.filter(n=>TASK[n].topic===tp.id);if(ns.length)byTp[tp.id]=ns;});
  let h='';
  if(redoOn(s))h+=`<div class="redo">🔁 Работа над ошибками: ${s.redo.list.length} задач</div>`;
  TOPICS.forEach(tp=>{
    const ns=byTp[tp.id];if(!ns)return;
    const done=ns.filter(n=>solved(s.tasks[n])).length;
    const isCur=ns.includes(s.cur);
    h+=`<div class="tp ${isCur?'cur':''} ${done===ns.length?'fin':''}">
      <div class="tph" data-tp="${tp.id}"><div class="ic">${tp.icon}</div>${tp.name}<span class="done">${done}/${ns.length}</span></div>
      <div class="mini"><i style="width:${100*done/ns.length}%"></i></div>
      <div class="chips">${ns.map(n=>{
        const x=s.tasks[n]||{st:'new'};
        const cl=['chip',x.st||'new',TASK[n].kind==='А'?'an':'',n===s.cur?'cur':''].filter(Boolean).join(' ');
        return `<button class="${cl}" data-n="${n}">${TASK[n].code}${TASK[n].kind==='А'?'а':''}</button>`;
      }).join('')}</div>
    </div>`;
  });
  h+=`<div class="legend"><span><b style="background:var(--ok)"></b> сам</span><span><b style="background:#7bd3a7"></b> с ошибками</span><span><b style="background:#ffd666"></b> с подсказкой</span><span><b style="background:#ffb27a"></b> после образца</span></div>`;
  $('#side').innerHTML=h;
  document.querySelectorAll('.chip[data-n]').forEach(b=>b.onclick=()=>{s.cur=+b.dataset.n;persist();renderSide();renderTask(s.cur);});
}
function renderTask(n){
  const s=getS();const t=TASK[n];const x=T(n,s);
  const start=Date.now();
  let h=`<div class="card pop">
    <div class="chead">
      <span class="num">№ ${t.label}</span>
      <span class="badge ${t.kind==='А'?'an':''}">${t.kind==='П'?'прототип':'аналог'}</span>
      ${t.nf?'<span class="badge nf">НЕ ФИПИ</span>':''}
      <span class="badge tpc">${TOPICS.find(tp=>tp.id===t.topic).name}</span>
    </div>
    <div class="qtext">${M(t.q)}</div>
    ${interactiveOdz(t)}
    <div class="tools">
      <button class="tool" id="tHint"><b>💡</b><span>Подсказка</span><small>по шагам</small></button>
      <button class="tool warn" id="tSol"><b>✍️</b><span>Решение целиком</span><small>как ручкой на бумаге</small></button>
      <button class="tool" id="tMemo"><b>📌</b><span>Памятка</span><small>теория</small></button>
    </div>
    <div class="ansbox">
      <div class="abt">Ответ <small>(через «;» если несколько, интервалы как (a; b])</small></div>
      <div class="ans">
        <input class="tans" id="ansIn" placeholder="например: −2; 3  или  (1; 5]" value="${esc(x.txt||'')}">
        <button class="btn pri" id="check">Проверить</button>
      </div>
      <div class="fb" id="fb"></div>
      ${x.comment?`<div class="tcom">Учитель: ${esc(x.comment)}</div>`:''}
    </div>
    <div class="hintzone" id="hz"></div>
    <div class="help"><span class="note">Время на задачу учитывается автоматически</span></div>
  </div>`;
  $('#main').innerHTML=h;
  bindOdz(t);
  const addTime=()=>{x.t=(x.t||0)+(Date.now()-start);s.totalMs=(s.totalMs||0)+(Date.now()-start);s.updated=Date.now();persist();};
  $('#tHint').onclick=()=>{
    x.steps=(x.steps||0)+1;if(!solved(x))x.st=x.st==='new'?'hint':x.st;addTime();
    const steps=t.steps.slice(0,x.steps);
    $('#hz').innerHTML=`<div class="hz-t">💡 Подсказки (${steps.length}/${t.steps.length})</div><div class="steps">${steps.map((s,i)=>`<div class="step"><b class="k">${i+1}.</b>${M(s)}</div>`).join('')}</div>`;
    persist();renderSide();
  };
  $('#tSol').onclick=()=>{
    if(solved(x)||x.views&&x.views.own){openFullSol(t,x);return;}
    confirmBox('Открыть полное решение этой задачи?<br><small style="color:var(--mut)">Учитель увидит, что образец смотрели до сдачи. Лучше сначала попробовать самому или взять подсказки.</small>',()=>{
      x.st='sol';x.views=x.views||{};x.views.own=1;x.ownBefore=1;addTime();persist();renderSide();openFullSol(t,x);
    },'Открыть решение');
  };
  $('#tMemo').onclick=()=>{x.stick=1;s.memo=(s.memo||0)+1;persist();openMemo();};
  $('#check').onclick=()=>{
    const raw=$('#ansIn').value.trim();
    x.txt=raw;addTime();
    const ok=checkAnswer(raw,t);
    const fb=$('#fb');
    if(ok){
      if(x.st==='new'||!x.st)x.st='ok';
      else if(x.st==='hint')x.st='hint';
      else if(x.st==='sol')x.st='sol';
      else x.st=x.st||'ok';
      fb.className='fb show good';fb.textContent='Верно! ✓';
      $('#ansIn').classList.add('good');$('#ansIn').classList.remove('bad');
    }else{
      x.wrong=x.wrong||[];x.wrong.push(raw);
      if(x.st==='new')x.st='err';
      fb.className='fb show bad';fb.textContent='Пока неверно. Посмотри ОДЗ и подсказки.';
      $('#ansIn').classList.add('bad');$('#ansIn').classList.remove('good');
    }
    persist();renderSide();
  };
  $('#ansIn').onkeydown=e=>{if(e.key==='Enter')$('#check').click();};
}
function normAns(s){
  return String(s).toLowerCase().replace(/\s+/g,'').replace(/−/g,'-').replace(/,/g,'.')
    .replace(/;/g,';').replace(/√/g,'sqrt').replace(/∅|нетрешений|пусто/g,'empty');
}
function checkAnswer(raw,t){
  const a=normAns(raw), b=normAns(t.ans);
  if(a===b)return true;
  // допуск к перестановке корней
  const pa=a.split(';').map(x=>x.trim()).filter(Boolean).sort().join(';');
  const pb=b.split(';').map(x=>x.trim()).filter(Boolean).sort().join(';');
  if(pa===pb)return true;
  if((a.includes('empty')||a==='—')&&(b.includes('empty')||b.includes('нет')))return true;
  return false;
}
function openFullSol(t,x){
  modal(`<div class="row" style="justify-content:space-between;margin-bottom:8px">
    <h2 style="margin:0">✍️ Решение целиком · ${t.label}</h2>
    <button class="btn ghost" id="sx">✕</button></div>
    ${sampleHTML(t)}
    <div class="smnav"><button class="btn" id="sx2">Закрыть</button></div>`,true);
  $('#sx').onclick=$('#sx2').onclick=closeModal;
}

/* ===== Памятка ===== */
const STICKERS=[
  {t:'ОДЗ всегда первым',x:'Перед решением уравнения/неравенства выпиши ограничения: знаменатель ≠ 0, подкоренное ≥ 0, и т.д. В конце обязательно проверь корни.',sc:'#e8f0ff',se:'#4f6bff',rot:'-1deg'},
  {t:'Замена t = …',x:'Если видишь (выражение)ⁿ и (выражение)ᵐ — введи t. Не забудь t ≥ 0, если t = квадрат / чётная степень.',sc:'#fff0e0',se:'#f0a400',rot:'1deg'},
  {t:'Сумма квадратов = 0',x:'A² + B² = 0 ⇔ A = 0 и B = 0 одновременно. Решай систему.',sc:'#dff6ea',se:'#16a36a',rot:'-2deg'},
  {t:'Дробь ≥ 0',x:'Числитель и знаменатель — метод интервалов. Не забывай выколоть нули знаменателя.',sc:'#f1e8ff',se:'#7343d6',rot:'1.5deg'},
  {t:'A² ≥ B²',x:'⇔ |A| ≥ |B| ⇔ (A−B)(A+B) ≥ 0. Раскрывай осторожно.',sc:'#ffe3e3',se:'#e5484d',rot:'-1deg'},
  {t:'Проверка в ОДЗ',x:'После нахождения корней отметь их на луче. Зелёные (в ОДЗ) — в ответ, красные — вычёркивай.',sc:'#e8ecff',se:'#3b4fd8',rot:'0.5deg'}
];
function openMemo(){
  modal(`<h2>📌 Памятка: уравнения и ОДЗ</h2>
    <div class="stks">${STICKERS.map(s=>`<div class="stk" style="--sc:${s.sc};--se:${s.se};--rot:${s.rot}"><div class="stk-t">${s.t}</div><div class="stk-x">${s.x}</div></div>`).join('')}</div>
    <button class="btn" id="mx">Закрыть</button>`);
  $('#mx').onclick=closeModal;
}

/* ===== Учитель ===== */
function viewTeacher(tab){
  app().innerHTML=`<div class="top"><div class="ttl">🎓 Учитель · ${APPNAME}</div><div style="flex:1"></div>
    <button class="btn sm" id="tTh">${DB.theme==='dark'?'☀️':'🌙'}</button>
    <button class="btn sm ghost" id="tOut">← К входу</button></div>
    <div style="max-width:1100px;margin:18px auto;padding:0 16px">
      <div class="tabs">
        <button data-tab="students" class="${tab==='students'?'on':''}">Ученики</button>
        <button data-tab="mode" class="${tab==='mode'?'on':''}">Режим / настройки</button>
        <button data-tab="print" class="${tab==='print'?'on':''}">Печать</button>
      </div>
      <div id="tbody"></div>
    </div>`;
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>viewTeacher(b.dataset.tab));
  $('#tTh').onclick=()=>{DB.theme=DB.theme==='dark'?'light':'dark';applyTheme();persist();viewTeacher(tab);};
  $('#tOut').onclick=viewLogin;
  const body=$('#tbody');
  if(tab==='students'){
    const ss=Object.values(DB.students).sort((a,b)=>(b.updated||0)-(a.updated||0));
    if(!ss.length){body.innerHTML='<p>Пока нет учеников. Когда ученик войдёт — данные появятся здесь.</p>';return;}
    body.innerHTML=`<table class="st"><tr><th>Ученик</th><th>Решено</th><th>Сам</th><th>С подсказкой</th><th>После образца</th><th>Время</th><th></th></tr>
      ${ss.map(s=>{const c=counts(s);return `<tr>
        <td><b>${esc(s.name)}</b>${redoOn(s)?' 🔁':''}</td>
        <td>${c.done}/${c.total}</td><td>${c.ok+c.err}</td><td>${c.hint}</td><td>${c.sol}</td>
        <td>${fmtT(s.totalMs||0)}</td>
        <td class="row">
          <button class="btn sm pri" data-r="${esc(s.name)}">📄 Отчёт</button>
          <button class="btn sm" data-w="${esc(s.name)}">🔁 Ошибки</button>
          <button class="btn sm ghost" data-z="${esc(s.name)}">↺</button>
        </td></tr>`;}).join('')}</table>`;
    document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>reportDialog(b.dataset.r,true));
    document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>redoDialog(b.dataset.w));
    document.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>confirmBox(`Сбросить «${b.dataset.z}»?`,()=>{DB.students[b.dataset.z]=newStudent(b.dataset.z);persist();viewTeacher('students');}));
  }else if(tab==='mode'){
    body.innerHTML=`<div class="fld"><span>Режим работы учеников</span>
      <select id="md"><option value="class" ${DB.teacher.mode!=='home'?'selected':''}>🏫 Классная (все инструменты)</option>
      <option value="home" ${DB.teacher.mode==='home'?'selected':''}>🏠 Домашняя</option></select></div>
      <div class="fld"><span>Имя учителя</span><input id="tn" value="${esc(DB.teacher.name||'')}"></div>
      <div class="fld"><span>E-mail</span><input id="te" value="${esc(DB.teacher.email||'')}"></div>
      <div class="fld"><span>Telegram (без @)</span><input id="tg" value="${esc(DB.teacher.tg||'')}"></div>
      <button class="btn pri" id="ts">Сохранить</button>`;
    $('#ts').onclick=()=>{DB.teacher.mode=$('#md').value;DB.teacher.name=$('#tn').value;DB.teacher.email=$('#te').value;DB.teacher.tg=$('#tg').value;persist();toast('Сохранено');};
  }else{
    body.innerHTML=`<p>Выберите задачи для печати (условия + место для решения).</p>
      <div class="row" style="margin-bottom:10px">
        <button class="btn sm" id="pa">Все</button><button class="btn sm" id="pp">Только прототипы</button>
        <button class="btn sm" id="pan">Только аналоги</button>
      </div>
      <div id="plist" style="max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px"></div>
      <div class="row" style="margin-top:12px"><button class="btn pri" id="pgo">🖨 Печать</button></div>`;
    const sel=new Set(ORDER);
    const draw=()=>{
      $('#plist').innerHTML=TOPICS.map(tp=>{
        const ns=ORDER.filter(n=>TASK[n].topic===tp.id);
        return `<div style="font-weight:800;margin:8px 0 4px">${tp.name}</div>
          ${ns.map(n=>`<label style="display:inline-flex;gap:6px;margin:3px 8px;padding:4px 8px;background:var(--bg);border-radius:8px">
            <input type="checkbox" data-n="${n}" ${sel.has(n)?'checked':''}> ${TASK[n].label}</label>`).join('')}`;
      }).join('');
      document.querySelectorAll('#plist [data-n]').forEach(c=>c.onchange=()=>{+c.checked?sel.add(+c.dataset.n):sel.delete(+c.dataset.n);});
    };
    draw();
    $('#pa').onclick=()=>{ORDER.forEach(n=>sel.add(n));draw();};
    $('#pp').onclick=()=>{sel.clear();ORDER.filter(n=>TASK[n].kind==='П').forEach(n=>sel.add(n));draw();};
    $('#pan').onclick=()=>{sel.clear();ORDER.filter(n=>TASK[n].kind==='А').forEach(n=>sel.add(n));draw();};
    $('#pgo').onclick=()=>{
      const list=[...sel];
      let h='<div style="font-family:Segoe UI,Arial;padding:12px"><h2>Уравнения · ОГЭ</h2>';
      list.forEach((n,i)=>{const t=TASK[n];h+=`<div style="border-bottom:1px dashed #ccc;padding:10px 0;break-inside:avoid">
        <b>${i+1}. ${t.label}</b><div style="margin:6px 0;font-size:15px">${M(t.q)}</div>
        <div style="height:120px;border:1px solid #ddd;background:repeating-linear-gradient(0deg,#f7f9fc,#f7f9fc 14px,#e8ecf4 15px)"></div>
      </div>`;});
      h+='</div>';
      const pa=document.getElementById('printArea');pa.innerHTML=h;
      document.body.classList.add('printing');
      setTimeout(()=>{window.print();document.body.classList.remove('printing');},100);
    };
  }
}

function redoDialog(name){
  const s=DB.students[name];
  const cand=ORDER.filter(n=>{const x=s.tasks[n];return x&&(x.st==='hint'||x.st==='sol'||x.st==='err'||(x.wrong&&x.wrong.length));});
  modal(`<h2>🔁 Работа над ошибками: ${esc(name)}</h2>
    ${cand.length?`<p style="color:var(--mut)">Выберите задачи — они снова станут несданными, прежние попытки сохранятся в истории.</p>
    <div style="max-height:45vh;overflow:auto">${cand.map(n=>`<label style="display:flex;gap:8px;padding:6px;border-bottom:1px solid var(--line)">
      <input type="checkbox" data-rn="${n}" checked> <span><b>${TASK[n].label}</b> — ${ST_LABEL[s.tasks[n].st]||s.tasks[n].st}</span></label>`).join('')}</div>
    <div class="row" style="margin-top:12px"><button class="btn pri" id="rwGo">Назначить</button><button class="btn ghost" id="rwX">Отмена</button></div>`
    :'<p>Нет задач для работы над ошибками.</p><button class="btn" id="rwX">Закрыть</button>'}`);
  $('#rwX').onclick=closeModal;
  const go=$('#rwGo');if(go)go.onclick=()=>{
    const list=[...document.querySelectorAll('[data-rn]')].filter(c=>c.checked).map(c=>+c.dataset.rn);
    if(!list.length){toast('Выберите задачи');return;}
    list.forEach(n=>{const x=s.tasks[n];x.hist=(x.hist||[]).concat([{...x}]);
      Object.assign(x,{st:'new',wrong:[],txt:'',steps:0,stick:0,views:{},score:null,t:0});});
    s.redo={list,at:Date.now()};s.updated=Date.now();persist();toast('Назначено: '+list.length);closeModal();viewTeacher('students');
  };
}
const ST_LABEL={ok:'сам',err:'сам после ошибок',hint:'с подсказкой',sol:'после образца',new:'не сдана'};

function reportDialog(name,teacher){
  const s=DB.students[name];const c=counts(s);
  modal(`<h2>📄 Отчёт: ${esc(name)}</h2>
    <div class="stats">
      <div class="stat"><b>${c.done}/${c.total}</b><span>решено</span></div>
      <div class="stat"><b>${c.ok}</b><span>сам с 1-й</span></div>
      <div class="stat"><b>${c.err}</b><span>после ошибок</span></div>
      <div class="stat"><b>${c.hint}</b><span>с подсказкой</span></div>
      <div class="stat"><b>${c.sol}</b><span>после образца</span></div>
      <div class="stat"><b>${fmtT(s.totalMs||0)}</b><span>время</span></div>
    </div>
    <p style="color:var(--mut)">Памятка: ${s.memo||0} раз · дни: ${(s.days||[]).join(', ')||'—'}</p>
    <table class="st"><tr><th>Задача</th><th>Статус</th><th>Ответ ученика</th><th>Эталон</th></tr>
    ${vis(s).map(n=>{const x=s.tasks[n]||{st:'new'};return `<tr><td>${TASK[n].label}</td><td>${ST_LABEL[x.st]||x.st}</td><td>${esc(x.txt||'—')}</td><td>${esc(TASK[n].ansT)}</td></tr>`;}).join('')}
    </table>
    <button class="btn" id="rx">Закрыть</button>`);
  $('#rx').onclick=closeModal;
}

loadDB();applyTheme();
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
viewLogin();
