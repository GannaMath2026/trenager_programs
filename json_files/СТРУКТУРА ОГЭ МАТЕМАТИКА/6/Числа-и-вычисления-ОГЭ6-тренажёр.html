.prof{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}

.tbtns{display:flex;gap:6px;flex-wrap:wrap}
.wrap{display:grid;grid-template-columns:280px 1fr;gap:18px;padding:18px;max-width:1200px;margin:0 auto}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.pr-memo{break-before:page}.pr-memo .stks{grid-template-columns:repeat(3,1fr);gap:8px}.pr-memo .stk{transform:none;box-shadow:none;border:1px solid #0002;border-top:5px solid var(--se);-webkit-print-color-adjust:exact;print-color-adjust:exact;break-inside:avoid;padding:8px}

<script>
const SOURCE='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
/* ===== Мини-разметка формул: {a/b}, ^{n} ===== */
function tok(s){const out=[];let buf='';const flush=()=>{if(buf){out.push({k:'t',s:buf});buf='';}};
 const match=i=>{let d=0;for(let j=i;j<s.length;j++){if(s[j]==='{')d++;else if(s[j]==='}'){d--;if(d===0)return j;}}return s.length-1;};
 for(let i=0;i<s.length;i++){const ch=s[i];
  if(ch==='^'&&s[i+1]==='{'){flush();const e=match(i+1);out.push({k:'sup',s:s.slice(i+2,e)});i=e;continue;}
  if(ch==='{'){const e=match(i);const inner=s.slice(i+1,e);let d=0,cut=-1;
   for(let j=0;j<inner.length;j++){const c=inner[j];if(c==='{')d++;else if(c==='}')d--;else if(c==='/'&&d===0){cut=j;break;}}
   flush();if(cut>=0)out.push({k:'fr',n:inner.slice(0,cut),d:inner.slice(cut+1)});else out.push({k:'g',s:inner});i=e;continue;}
  buf+=ch;}
 flush();return out;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function M(s){if(s==null)return '';return tok(String(s)).map(t=>{
  if(t.k==='t')return t.s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  if(t.k==='sup')return '<sup>'+M(t.s)+'</sup>';
  if(t.k==='fr')return '<span class="fr"><span class="nu">'+M(t.n)+'</span><span class="de">'+M(t.d)+'</span></span>';
  return M(t.s);}).join('');}

function loadDB(){
  let saved=null,local=null;
  try{const el=document.getElementById('saved-state');const t=el&&el.textContent.trim();if(t&&t!=='{}')saved=JSON.parse(t);}catch(e){}
  try{const t=localStorage.getItem(LSKEY);if(t)local=JSON.parse(t);}catch(e){}
  const clr=+(localStorage.getItem(LSCLR)||0);
  const db={teacher:{name:'',pin:'31415'},students:{},last:'',theme:'light'};
  [saved,local].forEach(src=>{if(!src)return;
    if(src.teacher&&(src.teacherUpdated||0)>=(db._tu||0)){db.teacher=Object.assign(db.teacher,src.teacher);db._tu=src.teacherUpdated||0;}
    Object.values(src.students||{}).forEach(s=>{if(src===saved&&(s.updated||0)<=clr)return;const c=db.students[s.name];if(!c||(s.updated||0)>(c.updated||0))db.students[s.name]=s;});

  db.teacherUpdated=db._tu||0;delete db._tu;

  Object.values(db.students).forEach(s=>{s.tasks=s.tasks||{};Object.values(s.tasks).forEach(normTask);s.days=s.days||[];s.totalMs=s.totalMs||0;});

function bump(){stu().updated=Date.now();persist();}
function stickerHTML(s,opt){opt=opt||{};const g=STICK_GROUPS.find(x=>x.id===s.g);const rot=opt.flat?0:(((s.id.length*7)%5)-2)*0.5;
  return `<div class="stk" id="stk-${s.id}" style="--sc:${g.color};--se:${g.edge};--rot:${rot}deg"><div class="stk-pin"></div>
  <div class="stk-t"><span class="stk-no">Ф${s.no}</span>${M(s.title)}</div><div class="stk-x">${M(s.text)}</div>${opt.links?stickLinks(s):''}</div>`;}
function stickLinks(s){const L=(STICK_USE[s.id]||[]).filter(n=>vis().includes(n));if(!L.length)return '';
  return `<div class="stk-l">Где нужен: ${L.map(n=>`<button class="tl" data-go="${n}" title="${esc(TASK[n].q)}">№${n}</button>`).join('')}</div>`;}
function bindMemoLinks(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const n=+b.dataset.go;if(cur.name){openTask(n);}else toast('№'+n+': '+TASK[n].q.slice(0,130)+'…',4000);});}
function renderHints(scroll){
  const t=TASK[cur.n],x=T(cur.n);let h='';
  if(cur.hintOpen){h+=`<div class="hz-t">📌 Краткие подсказки (факты из теории) ${t.facts.map(id=>'Ф'+STICK[id].no).join(', ')} <button class="btn sm ghost" id="hAll" style="margin-left:auto">📒 Вся памятка</button></div><div class="stks">${t.facts.map(id=>stickerHTML(STICK[id])).join('')}</div>`;}
  if(x.steps){h+=`<div class="hz-t">👣 Решение ${x.steps<t.steps.length?`(шаг ${x.steps} из ${t.steps.length})`:''}</div><div class="steps">${t.steps.slice(0,x.steps).map((s,i)=>`<div class="step"><b class="k">${i+1}.</b>${M(s)}</div>`).join('')}</div>`;
    if(x.steps>=t.steps.length)h+=`<div class="step ans-step"><b>Ответ: ${t.ansT}</b>${solved(x)?'':' — впиши его в поле и нажми «Проверить».'}</div>`;}
  $('#hz').innerHTML=h;
  const hs=$('#hStep');if(hs)hs.disabled=x.steps>=t.steps.length;const hf=$('#hFull');if(hf)hf.disabled=x.steps>=t.steps.length;
  const sb=$('#hS');if(sb)sb.textContent=cur.hintOpen?'✕ Скрыть подсказку':'💡 Подсказка';
  const ha=$('#hAll');if(ha)ha.onclick=()=>{tickTime();viewMemo(t.facts[0]);};
  if(scroll)$('#hz').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function parseAns(v){
  v=String(v).trim().replace(/\s+/g,'').replace(/,/g,'.').replace(/[−–—]/g,'-');
  if(!v)return NaN;
  const m=v.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);if(m)return +m[1]/+m[2];
  if(!/^-?(\d+\.?\d*|\.\d+)$/.test(v))return NaN;
  return +v;
}
function check(){
  const t=TASK[cur.n],x=T(cur.n),inp=$('#ai'),fb=$('#fb');
  const v=parseAns(inp.value);
  if(isNaN(v)){fb.className='fb show bad';fb.innerHTML='Введи число (дробную часть пиши через запятую, например 0,25).';inp.focus();return;}
  x.tries++;
  if(Math.abs(v-t.a)<1e-9){
    tickTime();
    x.st=x.full?'sol':(x.stick||x.steps)?'hint':(x.wrong.length?'err':'ok');x.when=Date.now();
    bump();
    inp.className='good';inp.disabled=true;
    const msgs=['Отлично! 🎉','Верно! 💪','Супер! ⭐','Так держать! 🚀','Правильно! ✅'];
    const nx=nextUnsolved(cur.n);
    fb.className='fb show good';fb.innerHTML=`${msgs[(cur.n*7)%msgs.length]} ${x.st==='ok'?'С первой попытки!':''}<br><span style="font-weight:600">${nx?'Переходим к следующей задаче…':'Это была последняя нерешённая задача!'}</span><div class="nx"><i id="nxb"></i></div>`;
    confetti();
    setTimeout(()=>{const b=$('#nxb');if(b)b.style.width='100%';},30);
    document.querySelector('.side').outerHTML=sidebar();bindSide();
    const c=counts();document.querySelector('.pbar i').style.width=(c.done/c.total*100)+'%';document.querySelector('.ptxt').textContent=c.done+'/'+c.total;
    const tp=t.topic;const ns=ORDER_BY_TOPIC[tp];
    if(ns.every(n=>solved(stu().tasks[n])))setTimeout(()=>toast('🏆 Тема «'+topicOf(cur.n).name+'» пройдена!'),400);
    const myN=cur.n;
    cur.timer=setTimeout(()=>{if(cur.n===myN&&cur.view==='train')goNext();},950);
  }else{
    x.wrong.push(inp.value.trim());bump();
    inp.classList.remove('bad');void inp.offsetWidth;inp.classList.add('bad');
    const k=x.wrong.length;
    fb.className='fb show bad';fb.innerHTML=`Неверно${k>1?' (попытка '+k+')':''}. ${k>=2&&!x.stick?'Попробуй открыть 💡 подсказку.':k>=3&&x.steps<t.steps.length?'Возьми 👣 шаг решения.':'Проверь вычисления и попробуй ещё раз.'}`;
    inp.select();
  }
}
function goNext(){clearTimeout(cur.timer);const nx=nextUnsolved(cur.n);if(!nx){viewDone();return;}openTask(nx);}
function confetti(){const card=$('#card');if(!card)return;const em=['🎉','⭐','✨','💚','🧮','🔢'];
  for(let i=0;i<16;i++){const s=document.createElement('span');s.className='conf';s.textContent=em[i%em.length];s.style.left='50%';s.style.top='55%';s.style.setProperty('--dx',(Math.random()*500-250)+'px');s.style.setProperty('--dy',(-Math.random()*260-40)+'px');card.appendChild(s);setTimeout(()=>s.remove(),1300);}}
function viewDone(){
  cur.view='done';tickTime();const c=counts();const s=stu();
  let w=0;vis().forEach(n=>w+=(s.tasks[n].wrong||[]).length);
  const tiles=[['✅',c.done+' / '+c.total,'решено'],['🎯',c.ok,'сам с 1-й попытки'],['🔁',c.err,'сам, после ошибок'],['💡',c.hint,'с подсказкой'],['📖',c.sol,'после решения'],['❌',w,'неверных ответов'],['⏱',fmtT(s.totalMs||0),'время работы']]
   .map(a=>`<div class="stat"><b>${a[0]} ${a[1]}</b><span>${a[2]}</span></div>`).join('');
  app().innerHTML=topbar()+`<div class="wrap">${sidebar()}<main class="main"><div class="card done-card pop"><div class="big">🏆</div><h1>Все задачи решены!</h1>
  <div class="stats" style="max-width:700px;margin:16px auto">${tiles}</div>
  <p>Теперь сформируй отчёт и отправь его учителю. И не забудь сохранить файл с прогрессом.</p>
  <div class="row" style="justify-content:center"><button class="btn pri" id="dR">📄 Отчёт учителю</button><button class="btn" id="dS">💾 Сохранить прогресс</button></div></div></main></div>`;
  bindTop();bindSide();$('#dR').onclick=()=>reportDialog(cur.name);$('#dS').onclick=saveApp;
}
/* ===== Памятка ===== */
function memoBody(links){return `<div class="toc">${STICKERS.map(s=>`<button data-toc="${s.id}">Ф${s.no} ${s.title}</button>`).join('')}</div>`+
  STICK_GROUPS.map(g=>`<h2><i style="background:${g.edge}"></i>${g.name}</h2><div class="stks">${STICKERS.filter(s=>s.g===g.id).map(s=>stickerHTML(s,{links})).join('')}</div>`).join('');}
function viewMemo(focus){
  cur.view='memo';clearTimeout(cur.timer);
  if(cur.name){stu().memo=(stu().memo||0)+1;if(cur.n&&!solved(stu().tasks[cur.n])){T(cur.n).stick=1;}bump();}
  app().innerHTML=topbar()+`<div class="wrap" style="grid-template-columns:1fr"><main class="main"><div class="card memo pop"><div class="row" style="justify-content:space-between"><h1 style="margin:0">📒 Памятка: числа и вычисления</h1><button class="btn pri" id="mb">← Вернуться к задаче</button></div>
  <p style="color:var(--mut)">Краткие подсказки (факты из теории). Под каждым — задачи, где он нужен: нажми на номер, чтобы перейти. В подсказке к задаче показываются только нужные факты.</p>${memoBody(true)}</div></main></div>`;
  bindTop();
  document.querySelectorAll('[data-toc]').forEach(b=>b.onclick=()=>{const e=document.getElementById('stk-'+b.dataset.toc);if(e){e.scrollIntoView({behavior:'smooth',block:'center'});e.classList.add('flash');setTimeout(()=>e.classList.remove('flash'),1400);}});
  bindMemoLinks();
  $('#mb').onclick=()=>openTask(cur.n||ORDER[0]);
  if(focus)setTimeout(()=>{const e=document.getElementById('stk-'+focus);if(e){e.scrollIntoView({block:'center'});e.classList.add('flash');}},60);
}
/* ===== Отчёт ===== */
function reportDialog(name){
  const s=DB.students[name];
  const c={ok:0,err:0,hint:0,sol:0,new:0};let wrongTotal=0,stick=0,stepsN=0;
  vis().forEach(n=>{const x=s.tasks[n]||{st:'new',wrong:[],stick:0,steps:0};c[x.st||'new']++;wrongTotal+=(x.wrong||[]).length;if(x.stick)stick++;stepsN+=x.steps||0;});
  c.done=vis().length-c.new;
  modal(`<h2>📄 Отчёт: ${esc(name)}</h2><div class="stats">
   <div class="stat"><b>✅ ${c.done}/${c.total=vis().length}</b><span>решено</span></div>
   <div class="stat"><b>🎯 ${c.ok}</b><span>сам с 1-й попытки</span></div>
   <div class="stat"><b>🔁 ${c.err}</b><span>сам, после ошибок</span></div>
   <div class="stat"><b>💡 ${c.hint}</b><span>с подсказкой</span></div>
   <div class="stat"><b>📖 ${c.sol}</b><span>после решения</span></div>
   <div class="stat"><b>❌ ${wrongTotal}</b><span>неверных ответов</span></div>
   <div class="stat"><b>⏱ ${fmtT(s.totalMs||0)}</b><span>время работы</span></div></div>
   <p style="color:var(--mut);font-size:14px">Памятка открывалась: ${s.memo||0} раз · подсказок в задачах: ${stick} · открыто шагов решения: ${stepsN}${DB.teacher.name?' · Учитель: '+esc(DB.teacher.name):''}</p>
   <table style="width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0"><tr><th style="text-align:left;border-bottom:1px solid var(--line);padding:6px">Тема</th><th style="border-bottom:1px solid var(--line);padding:6px">Решено</th><th style="border-bottom:1px solid var(--line);padding:6px">Сам</th><th style="border-bottom:1px solid var(--line);padding:6px">С помощью</th><th style="border-bottom:1px solid var(--line);padding:6px">Ошибок</th></tr>
   ${TOPICS.map(tp=>{const ns=ORDER_BY_TOPIC[tp.id];const rs=ns.map(n=>s.tasks[n]||{st:'new',wrong:[]});
     const done=rs.filter(r=>r.st!=='new').length;const self=rs.filter(r=>r.st==='ok'||r.st==='err').length;const help=rs.filter(r=>r.st==='hint'||r.st==='sol').length;const wr=rs.reduce((a,r)=>a+(r.wrong||[]).length,0);
     return `<tr><td style="border-bottom:1px solid var(--line);padding:6px">${tp.name}</td><td style="text-align:center;border-bottom:1px solid var(--line);padding:6px">${done}/${ns.length}</td><td style="text-align:center;border-bottom:1px solid var(--line);padding:6px">${self}</td><td style="text-align:center;border-bottom:1px solid var(--line);padding:6px">${help}</td><td style="text-align:center;border-bottom:1px solid var(--line);padding:6px">${wr}</td></tr>`;}).join('')}</table>
   <div class="row"><button class="btn pri" id="rP">🖨 Печать отчёта</button><button class="btn" id="rT">📋 Скопировать текст</button><button class="btn ghost" id="rX">Закрыть</button></div>
   <div id="rMsg" style="margin-top:10px"></div>`);
  $('#rX').onclick=closeModal;
  const txt=`Отчёт тренажёра «${APPNAME}». Ученик: ${name}. Решено ${c.done} из ${vis().length}: сам с 1-й попытки — ${c.ok}, сам после ошибок — ${c.err}, с подсказкой — ${c.hint}, после просмотра решения — ${c.sol}. Неверных ответов: ${wrongTotal}. Время: ${fmtT(s.totalMs||0)}.${DB.teacher.name?' Учитель: '+DB.teacher.name:''}`;
  $('#rT').onclick=async()=>{try{await navigator.clipboard.writeText(txt);$('#rMsg').innerHTML='<div class="fb show good">Текст скопирован — вставь его в сообщение учителю (Telegram, e-mail, WhatsApp) ✅</div>';}catch(e){$('#rMsg').innerHTML='<div class="fb show bad">Не удалось скопировать автоматически — выдели и скопируй текст вручную:<br><br>'+esc(txt)+'</div>';}};
  $('#rP').onclick=()=>{document.getElementById('printArea').innerHTML=`<div class="pr-title">Отчёт: ${esc(name)} — ${esc(APPNAME)}</div><p>${esc(txt)}</p>`;document.body.classList.add('printing');const done=()=>{document.body.classList.remove('printing');window.removeEventListener('afterprint',done);};window.addEventListener('afterprint',done);setTimeout(()=>{window.print();setTimeout(done,1500);},80);};
}

/* ===== Старт ===== */
applyTheme();
if(DB.last&&DB.students[DB.last])enter(DB.last);else viewLogin();
</script></body></html>
