<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Математика растёт — лаборатория прогрессий</title>
<style>
:root{--bg:#0b0d10;--panel:#12161c;--panel2:#171d25;--line:#29313c;--text:#eef3f8;--muted:#9aa7b5;--red:#ff4b4b;--yellow:#ffd166;--cyan:#55d6d2;--blue:#6ba8ff;--green:#82e0aa;--purple:#c5a0ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% -10%,#1c2632 0,transparent 45%),var(--bg);color:var(--text);font:15px/1.5 Calibri,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#202833;color:var(--text);padding:9px 13px;border-radius:10px;transition:.15s}button:hover{border-color:var(--red)}button.primary{background:var(--red);color:#160b0b;border-color:var(--red);font-weight:700}button.active{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}header{padding:22px clamp(16px,4vw,44px) 15px;border-bottom:1px solid var(--line)}.brand{color:var(--red);font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}.headrow{display:flex;align-items:end;justify-content:space-between;gap:18px;flex-wrap:wrap}h1{font-size:clamp(26px,4vw,40px);line-height:1.1;margin:6px 0}header p{color:var(--muted);margin:8px 0 0}.shell{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;padding:20px clamp(12px,3vw,36px);max-width:1600px;margin:auto}.nav{display:flex;flex-direction:column;gap:8px}.nav button{text-align:left;display:flex;gap:11px;align-items:center;padding:13px;background:#12161c}.nav .num{color:var(--red);font-weight:700;font-size:12px}.nav small{display:block;color:var(--muted);font-size:12px;font-weight:400}.nav button.active{background:#23191b;border-color:#7d3035}.content{min-width:0}.intro{display:flex;align-items:start;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-bottom:14px}.intro h2{font-size:25px;margin:0 0 5px}.intro p{margin:0;color:var(--muted);max-width:760px}.pill{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:5px 10px;color:var(--cyan);font-size:12px;white-space:nowrap}.workarea{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(245px,.8fr);gap:14px}.stage,.sidecard{border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#151a21,#0f1318);overflow:hidden}.stage{min-height:450px;position:relative;padding:16px;display:flex;flex-direction:column}.stagehead{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:12px}.visual{flex:1;min-height:330px;display:flex;align-items:center;justify-content:center;padding:12px 0;overflow:auto}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:13px}.sidecard{padding:17px}.sidecard h3{margin:0 0 10px;font-size:17px}.formula{font-size:clamp(20px,2.5vw,27px);color:var(--yellow);margin:12px 0;overflow-wrap:anywhere}.explain{color:#c1cbd6;font-size:14px}.metric{padding:12px;border-radius:11px;background:#0b0f14;border:1px solid var(--line);margin:9px 0}.metric label{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;font-size:22px;font-weight:700;overflow-wrap:anywhere}.metric .sub{color:var(--cyan);font-size:13px}.range{display:flex;align-items:center;gap:10px;margin:10px 0}.range input{width:100%;accent-color:var(--red)}.hint{font-size:12px;color:var(--muted)}.gridtiles{display:grid;gap:3px;max-width:100%;}.tile{border:1px solid #ffffff36;border-radius:3px;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#0b0d10;font-weight:700;transition:all .3s}.oddwrap{display:flex;flex-direction:column;gap:4px;align-items:center;max-width:100%}.oddrow{display:flex;gap:3px;justify-content:center}.oddcell{width:clamp(19px,3vw,31px);height:clamp(19px,3vw,31px);border-radius:4px;background:var(--cyan);border:1px solid #ffffff6b;box-shadow:0 2px 8px #55d6d21a}.oddcell.new{background:var(--yellow)}.rectrow{display:flex;gap:3px;align-items:center;justify-content:center;flex-wrap:nowrap;margin:5px}.rect{height:29px;min-width:13px;border-radius:3px;background:var(--cyan);border:1px solid #ffffff42;display:flex;align-items:center;justify-content:center;color:#071115;font-weight:bold;font-size:11px;transition:all .35s}.rect.current{background:var(--red);color:#190707}.rect.sum{background:var(--yellow)}.chess{display:grid;grid-template-columns:repeat(8,minmax(20px,44px));gap:3px;max-width:100%}.square{aspect-ratio:1;border:1px solid #ffffff26;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:clamp(9px,1.4vw,13px);cursor:pointer;position:relative;min-width:0}.square.light{background:#c6d0d9;color:#17202a}.square.dark{background:#526171;color:white}.square.selected{outline:3px solid var(--red);outline-offset:1px;z-index:1}.square:after{content:attr(data-grain);font-size:9px;position:absolute;bottom:1px;right:2px;opacity:.8}.grainpop{animation:pop .35s ease-out}@keyframes pop{0%{transform:scale(.8);opacity:.2}100%{transform:scale(1);opacity:1}}.pascal{display:flex;flex-direction:column;align-items:center;gap:5px;max-width:100%;overflow:auto}.pascalrow{display:flex;gap:4px;justify-content:center}.pnum{width:clamp(24px,3.2vw,42px);height:clamp(25px,3.2vw,40px);display:flex;align-items:center;justify-content:center;border-radius:7px;background:#1c3940;border:1px solid #31656a;color:#a7ffef;font-size:clamp(11px,1.5vw,16px);font-weight:700}.pnum.hot{background:var(--red);color:#1a0909;border-color:#ff7d7d}.geo-board{width:min(100%,430px);aspect-ratio:1;position:relative;border:1px solid #42505e;background:#0b1016;border-radius:5px;overflow:hidden}.geo-piece{position:absolute;bottom:0;left:0;height:100%;transition:all .5s;border:1px solid #0b0d10b0;display:flex;align-items:center;justify-content:center;color:#071115;font-weight:700;font-size:12px}.geo-piece span{writing-mode:vertical-rl;transform:rotate(180deg)}.square-outline{position:absolute;left:0;bottom:0;width:100%;height:100%;border:2px dashed #ffffff5c;pointer-events:none}.two-squares{display:flex;gap:10px;align-items:end;justify-content:center;flex-wrap:wrap}.unit-square{width:min(36vw,220px);aspect-ratio:1;position:relative;background:#10161d;border:1px solid #465363;overflow:hidden}.fillpiece{position:absolute;border:1px solid #0b0d1088;transition:all .45s;display:flex;align-items:center;justify-content:center;color:#071115;font-size:11px;font-weight:bold}.stackarea{display:flex;align-items:end;justify-content:center;gap:12px;width:100%;flex-wrap:wrap}.stack{width:min(36%,170px);height:260px;border:1px dashed #465363;display:flex;flex-direction:column-reverse;justify-content:flex-start;position:relative;background:#0b1016}.stack .bar{width:100%;display:flex;align-items:center;justify-content:center;color:#071115;font-weight:700;border:1px solid #0b0d10a0;transition:height .4s}.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:10px}.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}.footer{color:#6e7b89;font-size:12px;text-align:center;padding:8px 15px 22px} @media(max-width:900px){.shell{grid-template-columns:1fr}.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.nav button{padding:10px}.workarea{grid-template-columns:1fr}.stage{min-height:390px}.visual{min-height:300px}}@media(max-width:480px){.nav{grid-template-columns:1fr 1fr}.nav button{font-size:13px;padding:9px}.nav small{font-size:11px}.stage{padding:11px}.chess{grid-template-columns:repeat(8,minmax(0,1fr));gap:2px}.square{font-size:9px}.square:after{display:none}.workarea{gap:10px}.sidecard{padding:13px}}

.formula-lab{width:100%;display:flex;flex-direction:column;align-items:center;gap:18px}.formula-visual{width:100%;max-width:760px}.visual-kicker{font-size:11px;letter-spacing:.16em;color:var(--red);font-weight:700;text-align:center;margin:0 0 6px}.term-strip{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:34px 0 12px}.term-token{position:relative;min-width:64px;padding:10px 8px 8px;text-align:center;background:#10161d;border:1px solid var(--term-color);border-top:4px solid var(--term-color);border-radius:8px;animation:termIn .45s both}.term-token small{display:block;color:var(--muted);font-size:11px}.term-token b{font-size:17px;color:var(--term-color);overflow-wrap:anywhere}.term-token em{position:absolute;top:-28px;left:0;right:0;color:var(--yellow);font-size:11px;font-style:normal;white-space:nowrap}.formula-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:10px;width:100%;max-width:900px;align-items:stretch}.formula-card{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0;transition:border-color .25s,transform .25s}.formula-card:has(.anim-step b){border-color:#425365}.formula-main{color:var(--yellow);font-size:clamp(16px,2vw,20px)!important;min-height:45px;display:flex;align-items:center}.anim-step{min-height:104px;padding:11px;border:1px solid #263341;border-radius:9px;background:#0c1117;color:#c4d0dc;font-size:13px;display:flex;align-items:center;line-height:1.55;animation:stepIn .35s ease}.anim-step b{color:var(--cyan)}.step-chip{display:inline-flex;align-items:center;justify-content:center;width:23px;height:23px;flex:0 0 23px;border-radius:50%;background:var(--red);color:#1b0808;font-weight:bold;margin-right:7px}.anim-button{align-self:flex-start;font-size:12px;padding:7px 10px}.anim-dots{display:flex;gap:5px;margin-top:auto}.anim-dots span{height:4px;flex:1;border-radius:5px;background:#28313b}.anim-dots span.on{background:var(--cyan);box-shadow:0 0 8px #55d6d244}@keyframes termIn{from{opacity:0;transform:translateY(12px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes stepIn{from{opacity:.15;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}@media(max-width:480px){.term-token{min-width:54px;padding:8px 5px}.term-token b{font-size:15px}.anim-step{min-height:120px}.formula-grid{grid-template-columns:1fr}}
</style></head><body>
<header><div class="headrow"><div><div class="brand">ИНТЕРАКТИВНАЯ ЛАБОРАТОРИЯ</div><h1>Математика растёт<span style="color:var(--red)">.</span></h1><p>Нажимай, складывай, перестраивай — и открывай закономерности сам.</p></div><span class="pill">ПРОГРЕССИИ · 8 ЭКСПЕРИМЕНТОВ</span></div></header>
<div class="shell"><nav class="nav" id="nav"></nav><main class="content"><div class="intro"><div><h2 id="title"></h2><p id="desc"></p></div><span class="pill" id="tag"></span></div><div class="workarea"><section class="stage"><div class="stagehead"><span id="stageLabel">ВИЗУАЛИЗАЦИЯ</span><span id="stepLabel"></span></div><div class="visual" id="visual"></div><div class="controls" id="controls"></div></section><aside class="sidecard"><h3 id="sideTitle">Что заметим?</h3><div id="metrics"></div><div class="formula" id="formula"></div><div class="explain" id="explain"></div></aside></div></main></div><div class="footer">Все эксперименты работают прямо в браузере · Можно исследовать на компьютере, планшете и телефоне</div>
<script>
const scenes=[
{id:'odd',name:'Нечётные числа',short:'Сумма становится квадратом',tag:'АРИФМЕТИКА',title:'Каждое нечётное число достраивает квадрат',desc:'Начинаем с одной клетки. Каждый новый нечётный слой достраивает квадрат следующего размера.',side:'Собираем квадрат',formula:'1 + 3 + 5 + … + (2n−1) = n²',explain:'Первый квадрат — 1 клетка. Чтобы увеличить квадрат со стороны n до n+1, нужно добавить новый Г-образный слой из 2n+1 клеток. Именно поэтому появляются нечётные числа.'},
{id:'powers',name:'Степени двойки',short:'Сумма на единицу меньше',tag:'ГЕОМЕТРИЧЕСКАЯ ПРОГРЕССИЯ',title:'Почему сумма степеней двойки на 1 меньше?',desc:'Кликай по следующей степени двойки. Все предыдущие прямоугольники соберутся в ряд под ней — сравни их длины.',side:'Сравниваем длины',formula:'1 + 2 + 4 + … + 2ⁿ⁻¹ = 2ⁿ − 1',explain:'Прямоугольники имеют длины 1, 2, 4, 8… При каждом шаге новая длина вдвое больше предыдущей. Все меньшие прямоугольники вместе занимают ровно на одну клетку меньше, чем следующий прямоугольник.'},
{id:'chess',name:'Шахматные зёрна',short:'Рост числа и массы',tag:'УДВОЕНИЕ',title:'Одно зерно — и дальше вдвое больше',desc:'Выбери клетку шахматной доски. Из неё появится карточка с количеством зёрен на этой клетке и их массой.',side:'Сколько это весит?',formula:'На клетке n: 2ⁿ⁻¹ зёрен',explain:'На первой клетке одно зерно, на второй два, на третьей четыре. В каждой следующей клетке вдвое больше, чем в предыдущей. Масса считается по введённой массе одного зерна.'},
{id:'pascal',name:'Треугольник Паскаля',short:'Каждая строка вдвое больше',tag:'КОМБИНАТОРИКА',title:'Треугольник, в котором сумма удваивается',desc:'Нажимай «Следующая строка». Каждое внутреннее число — сумма двух чисел над ним. Сравни суммы строк.',side:'Сумма строки',formula:'Сумма строки n = 2ⁿ',explain:'В каждой строке числа строятся сложением соседних чисел предыдущей строки. Поэтому сумма следующей строки вдвое больше суммы предыдущей: каждое число предыдущей строки учитывается дважды.'},
{id:'half',name:'Половинки квадрата',short:'1/2 + 1/4 + 1/8 + … = 1',tag:'БЕСКОНЕЧНО УБЫВАЮЩАЯ',title:'Можно ли заполнить квадрат бесконечно мелкими частями?',desc:'Каждый клик добавляет следующий прямоугольник: половина, четверть, восьмая часть… Они занимают всё больше площади квадрата.',side:'Площадь заполнения',formula:'½ + ¼ + ⅛ + … = 1',explain:'Каждый раз добавляется половина оставшегося места. Пустая часть уменьшается вдвое: 1/2, 1/4, 1/8… После любого конечного числа шагов к квадрату можно приблизиться сколь угодно близко; в пределе сумма равна 1.'},
{id:'bacteria',name:'Бактериальный апокалипсис',short:'Деление каждые 20 минут',tag:'ГЕОМЕТРИЧЕСКИЙ РОСТ',title:'От одной бактерии — к огромному числу',desc:'Одна бактерия делится на две каждые 20 минут. Перемещайся по поколениям и наблюдай, как число удваивается.',side:'Считаем поколения',formula:'N = 2ᵏ, где k = число делений',explain:'В идеализированной модели каждая бактерия делится ровно на две, и никто не погибает. За 3 суток прошло бы 216 поколений: 2²¹⁶ потомков. В реальности такой рост невозможен из-за ограничений среды. Указанная в некоторых популярных материалах масса 7 500 тонн зависит от допущений и не следует напрямую из модели 2²¹⁶.'},
{id:'paper',name:'Бумага до Луны',short:'Складывание удваивает толщину',tag:'ГЕОМЕТРИЧЕСКАЯ ПРОГРЕССИЯ',title:'Что произойдёт, если складывать бумагу?',desc:'Каждое складывание удваивает толщину листа. Добавляй сгибы и сравнивай полученную толщину с расстоянием до Луны.',side:'Толщина после сгибов',formula:'hₙ = h₀ · 2ⁿ',explain:'Для модели возьмём толщину листа 0,1 мм. После 42 сгибов получится около 439 805 км — больше среднего расстояния от Земли до Луны (около 384 400 км). Это математическая модель: в реальности лист невозможно сложить столько раз обычным способом.'},
{id:'achilles',name:'Ахиллес и черепаха',short:'Бесконечно много шагов — конечное время',tag:'ПАРАДОКС ЗЕНОНА',title:'Ахиллес приближается к черепахе',desc:'Черепаха стоит на месте. На каждом шаге Ахиллес проходит половину оставшегося расстояния. Приближай сцену, чтобы рассмотреть всё меньший промежуток: бегун никогда не исчезает за черепахой.',side:'Оставшееся расстояние',formula:'dₙ = 100 / 2ⁿ → 0',explain:'Это наглядная модель идеи Зенона: на каждом шаге Ахиллес проходит половину расстояния, которое ещё отделяет его от неподвижной черепахи. Остаток становится 100, 50, 25, 12,5… м. После любого конечного числа шагов расстояние положительно, хотя стремится к нулю. Это не модель реальной гонки, а иллюстрация бесконечного приближения.'}
];
let current='odd',oddN=1,powerN=1,chessN=1,grainMass=.02,pascalN=0,halfN=0,bacteriaGen=0,paperFolds=0,achillesStep=0,achillesZoom=1;
const formulaAnim={};const formulaTimers={};
const $=id=>document.getElementById(id);function fmt(n){if(!Number.isFinite(n))return 'очень много';if(n>=1e15)return n.toExponential(3).replace('.',',');return n.toLocaleString('ru-RU',{maximumFractionDigits:6})}function numHTML(label,value,sub=''){return `<div class="metric"><label>${label}</label><strong>${value}</strong>${sub?`<div class="sub">${sub}</div>`:''}</div>`}function btn(label,fn,primary=false){return `<button class="${primary?'primary':''}" data-action="${fn}">${label}</button>`}function slider(label,id,min,max,val,step=1){return `<label class="range"><span>${label}</span><input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${val}"><b id="${id}val">${val}</b></label>`}
function drawNav(){ $('nav').innerHTML=scenes.map((s,i)=>`<button data-scene="${s.id}" class="${s.id===current?'active':''}"><span class="num">0${i+1}</span><span>${s.name}<small>${s.short}</small></span></button>`).join('')}
function render(){drawNav();const s=scenes.find(x=>x.id===current);$('title').textContent=s.title;$('desc').textContent=s.desc;$('tag').textContent=s.tag;$('sideTitle').textContent=s.side;$('formula').textContent=s.formula;$('explain').textContent=s.explain;$('stageLabel').textContent='ИНТЕРАКТИВНАЯ МОДЕЛЬ';
if(current==='odd')renderOdd();if(current==='powers')renderPowers();if(current==='chess')renderChess();if(current==='pascal')renderPascal();if(current==='half')renderHalf();if(current==='bacteria')renderBacteria();if(current==='paper')renderPaper();if(current==='achilles')renderAchilles();}
function renderOdd(){let size=oddN,colors=['#55d6d2','#ffd166','#6ba8ff','#c5a0ff','#82e0aa','#ff8d72','#f48fb1','#80cbc4','#ffab91','#b39ddb','#aed581','#90caf9'];let html='<div class="oddwrap">';for(let r=1;r<=size;r++){html+='<div class="oddrow">';for(let c=1;c<=size;c++){let layer=Math.max(r,c),color=colors[(layer-1)%colors.length];html+=`<div class="oddcell" style="background:${color};${layer===size?'box-shadow:0 0 0 2px #ffffff75 inset;':''}" title="Слой ${layer}: ${2*layer-1} клеток"></div>`}html+='</div>'}html+=`</div><div class="hint" style="text-align:center;margin-top:8px;max-width:330px">Новый цветной уголок — это нижний ряд и правый столбец. Вместе они добавляют ${2*size-1} клеток.</div>`;$('visual').innerHTML=html;$('stepLabel').textContent=`Квадрат ${size} × ${size}`;$('controls').innerHTML=btn('− Уменьшить', 'oddminus')+btn('Добавить нечётный слой', 'oddplus',true)+btn('Сначала', 'oddreset');$('metrics').innerHTML=numHTML('Сторона квадрата',`${size}`)+numHTML('Клеток всего',fmt(size*size))+numHTML('Добавили на последнем шаге',size===1?'1 клетка':fmt(2*size-1),`1, 3, 5, 7, …`)}
function renderPowers(){let n=powerN,p=2**(n-1),sum=p-1;let w=Math.min(440,Math.max(220,p*24));let blocks='';for(let i=0;i<n;i++){let v=2**i;blocks+=`<div class="rect ${i===n-1?'current':''}" style="width:${Math.max(16,v*20)}px;max-width:100%;flex-shrink:0">${v}</div>`}let below='';for(let i=0;i<n-1;i++){let v=2**i;below+=`<div class="rect sum" style="width:${Math.max(16,v*20)}px;max-width:100%;flex-shrink:0">${v}</div>`}$('visual').innerHTML=`<div style="width:100%;max-width:560px"><div class="hint" style="text-align:center">Степени двойки, которые складываем</div><div style="display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;margin:14px 0">${blocks}</div><div style="border-top:1px dashed #4a5665;margin:18px 0 12px"></div><div class="hint" style="text-align:center">Предыдущие прямоугольники собираются в ряд под текущим</div><div style="display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;margin:12px 0;min-height:35px">${below||'<span class="hint">Пока нет предыдущих прямоугольников</span>'}</div><div style="text-align:center;color:var(--yellow);font-size:13px">${n>1?`${sum} = ${p} − 1`:'1 — следующий прямоугольник будет 2'}</div></div>`;$('stepLabel').textContent=`Шаг ${n} · текущая степень ${p}`;$('controls').innerHTML=btn('Следующая степень двойки', 'powplus',true)+btn('Назад', 'powminus')+btn('Сначала', 'powreset');$('metrics').innerHTML=numHTML('Текущий прямоугольник',fmt(p))+numHTML('Сумма предыдущих',fmt(sum),n>1?`На 1 меньше, чем ${p}`:'Добавь следующий прямоугольник')+numHTML('Проверка',n>1?`${sum} + 1 = ${p}`:'2⁰ = 1')}
function renderChess(){let total=2**(chessN-1),massG=total*grainMass,massKg=massG/1000;let cells='';for(let i=1;i<=64;i++){cells+=`<button class="square ${(Math.floor((i-1)/8)+(i-1)%8)%2?'dark':'light'} ${i===chessN?'selected':''}" data-cell="${i}" data-grain="${i===chessN?'●':''}" title="Клетка ${i}">${i}</button>`}$('visual').innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;gap:13px;width:100%"><div class="chess">${cells}</div><div class="metric grainpop" style="width:min(100%,430px);border-color:var(--red)"><label>Клетка ${chessN} · зёрна на ней</label><strong>${fmt(total)} зёрен</strong><div class="sub">Масса: ${fmt(massG)} г · ${fmt(massKg)} кг</div></div></div>`;$('stepLabel').textContent=`Клетка ${chessN} из 64`;$('controls').innerHTML=btn('Предыдущая клетка','chessminus')+btn('Следующая клетка','chessplus',true)+btn('На первую','chessreset')+`<label class="range" style="min-width:190px;flex:1"><span>Масса 1 зерна, г</span><input id="grainMass" type="number" min="0.0001" step="0.001" value="${grainMass}" style="width:90px;background:#0b0f14;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:5px"></label>`;$('metrics').innerHTML=numHTML('Зёрен на клетке',fmt(total))+numHTML('Масса на клетке',`${fmt(massG)} г`,`${fmt(massKg)} кг`)+numHTML('Всего зёрен до этой клетки',fmt(2**chessN-1))+numHTML('Всего на всей доске',fmt(2**64-1),'если удваивать до 64-й клетки')}
function pascalRow(n){let a=[1];for(let r=1;r<=n;r++){let b=[1];for(let i=1;i<a.length;i++)b.push(a[i-1]+a[i]);b.push(1);a=b}return a}function renderPascal(){let rows='';for(let r=0;r<=pascalN;r++){let a=pascalRow(r);rows+=`<div class="pascalrow">${a.map(v=>`<div class="pnum ${r===pascalN?'hot':''}">${v}</div>`).join('')}</div>`}$('visual').innerHTML=`<div style="width:100%;overflow:auto"><div class="pascal">${rows}</div></div>`;$('stepLabel').textContent=`Строка ${pascalN+1}`;$('controls').innerHTML=btn('Следующая строка','pascalplus',true)+btn('Назад','pascalminus')+btn('Сначала','pascalreset');$('metrics').innerHTML=numHTML('Номер строки',pascalN+1)+numHTML('Числа строки',pascalRow(pascalN).join(' + '))+numHTML('Сумма строки',fmt(2**pascalN),pascalN?'В 2 раза больше предыдущей':'Первая строка: 1')}
function renderHalf(){let n=halfN,parts=[],x=0,y=0,w=100,h=100,colors=['#55d6d2','#ffd166','#6ba8ff','#c5a0ff','#82e0aa','#ff8d72'];for(let i=0;i<n;i++){let label=i===0?'1/2':`1/${2**(i+1)}`;if(i%2===0){let pieceW=w/2;parts.push(`<div class="fillpiece" style="left:${x}%;top:${y}%;width:${pieceW}%;height:${h}%;background:${colors[i%colors.length]}"><span>${label}</span></div>`);x+=pieceW;w-=pieceW;}else{let pieceH=h/2;parts.push(`<div class="fillpiece" style="left:${x}%;top:${y}%;width:${w}%;height:${pieceH}%;background:${colors[i%colors.length]}"><span>${label}</span></div>`);y+=pieceH;h-=pieceH;}}let empty=100/2**n;$('visual').innerHTML=`<div class="two-squares"><div class="unit-square">${parts.join('')}<div class="square-outline"></div></div><div style="max-width:190px"><div class="hint">Заполнено</div><div style="font-size:30px;color:var(--cyan);font-weight:bold">${n?`${(1-1/2**n)*100}%`:'0%'}</div><div class="hint">Осталось пустым</div><div style="font-size:24px;color:var(--yellow)">${n?`1/${2**n}`:'1'}</div></div></div>`;$('stepLabel').textContent=`Добавлено дробей: ${n}`;$('controls').innerHTML=btn('Добавить следующую дробь','halfplus',true)+btn('Убрать последнюю','halfminus')+btn('Сначала','halfreset');$('metrics').innerHTML=numHTML('Сумма добавленных частей',n?Array.from({length:n},(_,i)=>`1/${2**(i+1)}`).join(' + '):'0')+numHTML('Площадь заполнена',n?`${(1-1/2**n).toLocaleString('ru-RU',{maximumFractionDigits:6})}`:'0')+numHTML('Остаток',n?`1/${2**n}`:'1',n?'Каждый шаг уменьшает остаток вдвое; направление чередуется':'Нажми, чтобы начать')}

function progressionBars(values,colors){let max=Math.max(1,...values.map(v=>Math.abs(v)));return `<div style="width:100%;max-width:720px"><div style="display:flex;align-items:flex-end;justify-content:center;gap:5px;min-height:220px;padding:12px 4px 0;border-bottom:1px solid #697887;overflow-x:auto">${values.map((v,i)=>{let h=Math.max(4,Math.abs(v)/max*170);return `<div title="${i+1}-й член: ${fmt(v)}" style="flex:1;min-width:34px;max-width:72px;height:${h}px;background:${colors[i%colors.length]};border:1px solid #ffffff50;border-radius:6px 6px 0 0;display:flex;align-items:center;justify-content:flex-start;flex-direction:column;color:#071115;font-weight:700;font-size:11px;padding-top:4px;position:relative"><span>${fmt(v)}</span><small style="position:absolute;bottom:-24px;color:var(--muted);font-weight:400">${i+1}</small></div>`}).join('')}</div><div class="hint" style="text-align:center;margin-top:27px">Номер члена показан под каждым столбиком; высота пропорциональна модулю значения.</div></div>`}
function formulaCard(key,title,formula,steps){let idx=formulaAnim[key]??-1,shown=idx<0?'Нажми «Показать вывод», чтобы увидеть, откуда берётся формула.':steps[Math.min(idx,steps.length-1)];return `<div class="metric formula-card"><label>${title}</label><strong class="formula-main">${formula}</strong><div class="anim-step" key="${key}">${shown}</div><button data-anim="${key}" class="anim-button">${idx>=steps.length-1?'↻ Повторить анимацию':'▶ Показать вывод'}</button><div class="anim-dots">${steps.map((_,i)=>`<span class="${i<=idx?'on':''}"></span>`).join('')}</div></div>`}

function renderArith(){let vals=Array.from({length:arithN},(_,i)=>arithA+i*arithD),last=vals[vals.length-1],sum=arithN*(arithA+last)/2,terms=vals.map(fmt).join('; '),a=fmt(arithA),d=fmt(arithD),l=fmt(last),n=arithN,sm=fmt(sum);let steps0=[`<span class="step-chip">1</span> Первый член: <b>a₁ = ${a}</b>`,`<span class="step-chip">2</span> Каждый шаг прибавляем d = ${d}: <b>${vals.slice(0,Math.min(n,5)).map(fmt).join(' → ')}${n>5?' → …':''}</b>`,`<span class="step-chip">3</span> До aₙ — всего n−1 шагов: <b>aₙ = a₁ + (n−1)d</b>`,`<span class="step-chip">4</span> Подставляем: <b>${a} + (${n}−1)·${d} = ${l}</b>`];let steps1=[`<span class="step-chip">1</span> Записываем сумму: <b>Sₙ = a₁ + a₂ + … + aₙ</b>`,`<span class="step-chip">2</span> Записываем её в обратном порядке: <b>Sₙ = aₙ + … + a₂ + a₁</b>`,`<span class="step-chip">3</span> Складываем почленно: каждая пара равна <b>a₁ + aₙ</b>, таких пар n. Поэтому <b>2Sₙ = n(a₁+aₙ)</b>.`,`<span class="step-chip">4</span> Делим обе части на 2: <b>Sₙ = n(a₁+aₙ)/2 = ${n}·(${a}+${l})/2 = ${sm}</b>`];let steps2=[`<span class="step-chip">1</span> Начинаем с формулы суммы: <b>Sₙ = n(a₁+aₙ)/2</b>`,`<span class="step-chip">2</span> Подставляем aₙ = a₁+(n−1)d: <b>Sₙ = n(a₁+a₁+(n−1)d)/2</b>`,`<span class="step-chip">3</span> Объединяем одинаковые слагаемые: <b>Sₙ = n(2a₁+(n−1)d)/2</b>`,`<span class="step-chip">4</span> Проверяем на выбранных числах: <b>S${n} = ${sm}</b>`];$('visual').innerHTML=`<div class="formula-lab"><div class="formula-visual"><div class="visual-kicker">ПОСЛЕДОВАТЕЛЬНОСТЬ В ДВИЖЕНИИ</div>${progressionBars(vals,['#55d6d2','#ffd166','#6ba8ff','#c5a0ff','#82e0aa','#ff8d72'])}<div class="term-strip">${vals.map((v,i)=>`<div class="term-token" style="--term-color:${['#55d6d2','#ffd166','#6ba8ff','#c5a0ff','#82e0aa','#ff8d72'][i%6]}"><small>a${i+1}</small><b>${fmt(v)}</b>${i>0?`<em>+ ${d}</em>`:''}</div>`).join('')}</div><div class="hint" style="text-align:center">При каждом переходе прибавляется одно и то же число d = ${d}.</div></div><div class="formula-grid">${formulaCard('a-n','1. Формула n-го члена','aₙ = a₁ + (n − 1)d',steps0)}${formulaCard('a-sum-last','2. Сумма через первый и последний','Sₙ = n(a₁ + aₙ)/2',steps1)}${formulaCard('a-sum-d','3. Сумма через разность','Sₙ = n(2a₁ + (n − 1)d)/2',steps2)}</div><div class="hint">Члены прогрессии: ${terms}</div></div>`;$('stepLabel').textContent=`${arithN} членов · d = ${d}`;$('controls').innerHTML=`<div style="display:flex;gap:8px;flex-wrap:wrap;width:100%">${numInput('Первый член a₁','arithA',arithA)}${numInput('Разность d','arithD',arithD)}${numInput('Число членов n','arithN',arithN,'1')}<button class="primary" data-action="arithapply">Применить</button>${btn('− 1 член','arithminus')}${btn('+ 1 член','arithplus')}</div>`;$('metrics').innerHTML=numHTML('Первый член a₁',fmt(arithA))+numHTML('Разность d',fmt(arithD),arithD>0?'Последовательность возрастает':arithD<0?'Последовательность убывает':'Все члены равны')+numHTML(`Последний член a${arithN}`,l)+numHTML(`Сумма S${arithN}`,sm)+numHTML('Разность соседних членов',d,'aₙ₊₁ − aₙ = d')}
function renderGeom(){let vals=Array.from({length:geomN},(_,i)=>geomB*Math.pow(geomQ,i)),last=vals[vals.length-1],sum=Math.abs(geomQ-1)<1e-10?geomB*geomN:geomB*(Math.pow(geomQ,geomN)-1)/(geomQ-1),inf=Math.abs(geomQ)<1?geomB/(1-geomQ):null,terms=vals.map(fmt).join('; '),b=fmt(geomB),q=fmt(geomQ),l=fmt(last),n=geomN,sm=fmt(sum),infText=inf===null?'не существует':fmt(inf);let steps0=[`<span class="step-chip">1</span> Первый член: <b>b₁ = ${b}</b>`,`<span class="step-chip">2</span> Каждый шаг умножаем на q = ${q}: <b>${vals.slice(0,Math.min(n,5)).map(fmt).join(' → ')}${n>5?' → …':''}</b>`,`<span class="step-chip">3</span> От b₁ до bₙ — n−1 умножений: <b>bₙ = b₁ · qⁿ⁻¹</b>`,`<span class="step-chip">4</span> Подставляем: <b>${b} · ${q}^(${n}−1) = ${l}</b>`];let steps1=[`<span class="step-chip">1</span> Записываем сумму: <b>Sₙ = b₁ + b₁q + … + b₁qⁿ⁻¹</b>`,`<span class="step-chip">2</span> Умножаем на q: <b>qSₙ = b₁q + b₁q² + … + b₁qⁿ</b>`,`<span class="step-chip">3</span> Вычитаем: почти все слагаемые сокращаются, остаётся <b>Sₙ(1−q) = b₁(1−qⁿ)</b>.`,`<span class="step-chip">4</span> Делим на 1−q: <b>Sₙ = b₁(1−qⁿ)/(1−q)</b>. При q ≠ 1 это равно <b>${sm}</b>.`];let steps2=[`<span class="step-chip">1</span> Формула суммы: <b>Sₙ = b₁(1−qⁿ)/(1−q)</b>.`,`<span class="step-chip">2</span> Меняем знаки в числителе и знаменателе: <b>(1−qⁿ)/(1−q) = (qⁿ−1)/(q−1)</b>.`,`<span class="step-chip">3</span> Получаем равносильную запись: <b>Sₙ = b₁(qⁿ−1)/(q−1)</b>.`,`<span class="step-chip">4</span> Для текущих значений сумма равна <b>${sm}</b>${Math.abs(geomQ-1)<1e-10?' (так как q = 1, используем Sₙ = nb₁).':'.'}`];let steps3=[`<span class="step-chip">1</span> Для |q| &lt; 1 конечная сумма: <b>Sₙ = b₁(1−qⁿ)/(1−q)</b>.`,`<span class="step-chip">2</span> При увеличении n остаток <b>b₁qⁿ/(1−q)</b> уменьшается к нулю, если |q| &lt; 1.`,`<span class="step-chip">3</span> Поэтому qⁿ → 0 и в пределе: <b>S∞ = b₁(1−0)/(1−q)</b>.`,`<span class="step-chip">4</span> Итог: <b>S∞ = b₁/(1−q) = ${infText}</b>${inf===null?' — условие |q| < 1 не выполнено.':'.'}`];$('visual').innerHTML=`<div class="formula-lab"><div class="formula-visual"><div class="visual-kicker">ПОСЛЕДОВАТЕЛЬНОСТЬ В ДВИЖЕНИИ</div>${progressionBars(vals,['#c5a0ff','#55d6d2','#ffd166','#6ba8ff','#82e0aa','#ff8d72'])}<div class="term-strip">${vals.map((v,i)=>`<div class="term-token" style="--term-color:${['#c5a0ff','#55d6d2','#ffd166','#6ba8ff','#82e0aa','#ff8d72'][i%6]}"><small>b${i+1}</small><b>${fmt(v)}</b>${i>0?`<em>× ${q}</em>`:''}</div>`).join('')}</div><div class="hint" style="text-align:center">При каждом переходе умножаем на один и тот же знаменатель q = ${q}.</div></div><div class="formula-grid">${formulaCard('g-n','1. Формула n-го члена','bₙ = b₁ · qⁿ⁻¹',steps0)}${formulaCard('g-sum-one','2. Сумма через 1 − qⁿ','Sₙ = b₁(1 − qⁿ)/(1 − q)',steps1)}${formulaCard('g-sum-two','3. Та же сумма через qⁿ − 1','Sₙ = b₁(qⁿ − 1)/(q − 1)',steps2)}${formulaCard('g-infinite','4. Сумма бесконечной прогрессии','S∞ = b₁/(1 − q)',steps3)}</div><div class="hint">Члены прогрессии: ${terms}. ${Math.abs(geomQ)<1?'Так как |q| < 1, члены стремятся к нулю.':'При |q| ≥ 1 бесконечная сумма в общем случае не сходится.'}</div></div>`;$('stepLabel').textContent=`${geomN} членов · q = ${q}`;$('controls').innerHTML=`<div style="display:flex;gap:8px;flex-wrap:wrap;width:100%">${numInput('Первый член b₁','geomB',geomB)}${numInput('Знаменатель q','geomQ',geomQ)}${numInput('Число членов n','geomN',geomN,'1')}<button class="primary" data-action="geomapply">Применить</button>${btn('− 1 член','geomminus')}${btn('+ 1 член','geomplus')}</div>`;$('metrics').innerHTML=numHTML('Первый член b₁',b)+numHTML('Знаменатель q',q,Math.abs(geomQ)<1?'|q| < 1: бесконечная сумма существует':Math.abs(geomQ)===1?'|q| = 1: бесконечная сумма обычно не сходится':'|q| > 1: члены растут по модулю')+numHTML(`Последний член b${geomN}`,l)+numHTML(`Сумма S${geomN}`,sm)+numHTML('Бесконечная сумма',infText,inf===null?'Условие |q| < 1 не выполнено':'при |q| < 1')}



function fmtBigPow2(n){if(n<53)return (2n**BigInt(n)).toLocaleString('ru-RU');return `2^${n} ≈ 10^${(n*Math.LOG10E*Math.LN2).toFixed(1).replace('.',',')}`}
function bacteriaSVG(i=0){const colors=['#55d6d2','#ffd166','#ff8d72','#c5a0ff','#82e0aa','#f48fb1'];const c=colors[i%colors.length];return `<svg viewBox="0 0 52 32" width="27" height="20" aria-label="бактерия" role="img" style="overflow:visible;flex:none"><g fill="none" stroke="${c}" stroke-width="1.6" stroke-linecap="round"><path d="M7 12 C1 8 4 4 1 2 M10 22 C3 25 5 29 1 30 M39 10 C46 4 43 2 49 1 M40 23 C47 24 45 29 51 30"/><path d="M13 6 C8 1 15 0 18 4 M32 5 C35 0 40 2 40 6"/></g><rect x="8" y="7" width="34" height="18" rx="9" fill="${c}" stroke="#f4fbff" stroke-opacity=".75" stroke-width="1.2"/><path d="M14 11 Q25 16 36 11 M14 20 Q25 15 36 20" fill="none" stroke="#10202a" stroke-opacity=".45" stroke-width="1.2"/><circle cx="19" cy="13" r="1.5" fill="#10202a"/><circle cx="30" cy="19" r="1.5" fill="#10202a"/></svg>`}
function renderBacteria(){let k=bacteriaGen,mins=k*20,hours=mins/60,days=hours/24;let rows='';for(let g=0;g<=Math.min(k,6);g++){let count=2**g;rows+=`<div style="display:flex;align-items:center;gap:8px;margin:9px 0"><span style="width:84px;flex:0 0 84px;color:var(--muted);font-size:12px">Поколение ${g}</span><div style="display:flex;gap:3px;flex-wrap:wrap;align-items:center;min-width:0">${Array.from({length:Math.min(count,16)},(_,i)=>bacteriaSVG(i+g)).join('')}${count>16?'<span class="hint">… ещё</span>':''}</div><b style="color:var(--cyan);font-size:12px;margin-left:auto">${fmtBigPow2(g)}</b></div>`}let countText=fmtBigPow2(k);$('visual').innerHTML=`<div style="width:100%;max-width:700px"><div class="visual-kicker">КАЖДАЯ БАКТЕРИЯ ДЕЛИТСЯ НА ДВЕ</div><div style="display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0"><div style="text-align:center;padding:15px;border:1px solid var(--green);border-radius:14px;background:#13231c"><div style="display:flex;justify-content:center">${bacteriaSVG(k)}</div><b>1 бактерия</b></div><div style="font-size:25px;color:var(--yellow)">→</div><div style="text-align:center;padding:15px;border:1px solid var(--cyan);border-radius:14px;background:#102126"><div style="font-size:30px;color:var(--cyan);font-weight:bold">${countText}</div><b>после ${k} делений</b></div></div><div class="metric"><label>Визуальная схема первых поколений</label>${rows}<div class="hint">Для больших k показаны первые поколения; число потомков вычисляется как степень двойки.</div></div><div class="formula" style="text-align:center">N = 2<sup>${k}</sup></div></div>`;$('stepLabel').textContent=`${k} делений · ${mins} минут`;$('controls').innerHTML=btn('− поколение','bactminus')+btn('Следующее деление (+20 мин)','bactplus',true)+btn('К началу','bactreset')+btn('Показать 3 суток','bact3days');$('metrics').innerHTML=numHTML('Число бактерий',countText)+numHTML('Прошло времени',`${mins.toLocaleString('ru-RU')} мин`,`${hours.toLocaleString('ru-RU',{maximumFractionDigits:2})} ч · ${days.toLocaleString('ru-RU',{maximumFractionDigits:3})} суток`)+numHTML('За 3 суток', '2²¹⁶', '216 делений по 20 минут')+numHTML('Важно','Идеальная модель','В реальности ресурсы и внешние факторы ограничивают рост')}
function sciHTML(value,sig=4){
 if(value===0)return '0';
 const exponent=Math.floor(Math.log10(Math.abs(value)));
 const mantissa=value/Math.pow(10,exponent);
 const m=mantissa.toLocaleString('ru-RU',{maximumFractionDigits:sig-1,minimumFractionDigits:0});
 return exponent===0?m:`${m} × 10<sup>${String(exponent).replace(/-?\d+/g,x=>x.replace(/\d/g,d=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[+d])) .replace('⁻','⁻')}</sup>`;
}
function renderPaper(){
 const n=paperFolds,mm=.1*Math.pow(2,n),km=mm/1e6,moon=384400;
 const thicknessHTML=n<4?`${mm.toLocaleString('ru-RU',{maximumFractionDigits:4})} мм`: `${sciHTML(mm)} мм`;
 const kmHTML=km<1000?`${km.toLocaleString('ru-RU',{maximumFractionDigits:6})} км`: `${sciHTML(km)} км`;
 const compare=n>=42?'В этой идеальной модели толщина уже больше среднего расстояния до Луны.':`До средней дистанции до Луны (384 400 км) ещё ${Math.max(0,moon-km).toLocaleString('ru-RU',{maximumFractionDigits:2})} км.`;
 const folds=Array.from({length:Math.min(n,12)},(_,i)=>`<div style="height:${Math.max(4,28-i*1.7)}px;width:${Math.min(95,24+i*5)}px;background:${['#55d6d2','#ffd166','#6ba8ff','#c5a0ff'][i%4]};border:1px solid #ffffff55;border-radius:2px;transform:skewY(-${Math.min(i*1.2,10)}deg);margin:1px auto;transition:all .3s"></div>`).join('');
 $('visual').innerHTML=`<div style="width:100%;max-width:680px;text-align:center"><div class="visual-kicker">КАЖДЫЙ СГИБ УДВАИВАЕТ ТОЛЩИНУ</div><div style="display:flex;align-items:center;justify-content:center;gap:25px;flex-wrap:wrap;margin:18px 0"><div style="width:190px;min-height:145px;display:flex;flex-direction:column;justify-content:center"><div style="font-size:14px;color:var(--muted)">Слоёв бумаги</div><div style="font-size:32px;color:var(--cyan);font-weight:bold">2<sup>${n}</sup></div><div style="font-size:13px">${fmtBigPow2(n)} слоёв</div></div><div style="width:170px;padding:8px;border:1px solid var(--line);border-radius:12px;background:#0b1016">${folds}<div class="hint">условный рисунок слоёв</div></div></div><div class="metric"><label>Толщина при начальной толщине 0,1 мм</label><strong style="font-size:clamp(18px,3vw,25px)">${thicknessHTML}</strong><div class="sub">h = 0,1 мм × 2<sup>${n}</sup> = ${kmHTML}</div></div><div class="hint">${compare}</div><div class="hint">42 сгиба дают около 439 805 км. 103 сгиба — приблизительно ${sciHTML(km)} км.</div><div class="hint">Расчёт точный для идеальной модели; обычный лист физически невозможно складывать столько раз.</div></div>`;
 $('stepLabel').textContent=`Сгибов: ${n}`;
 $('controls').innerHTML=btn('− сгиб','paperminus')+btn('Сложить ещё раз','paperplus',true)+btn('Сначала','paperreset')+btn('42 сгиба','paper42')+btn('103 сгиба','paper103');
 $('metrics').innerHTML=numHTML('Число сгибов',n)+numHTML('Слоёв',fmtBigPow2(n))+numHTML('Толщина',thicknessHTML)+numHTML('Толщина в километрах',kmHTML)+numHTML('Сравнение с Луной',n>=42?'Больше расстояния':'Меньше расстояния',`Расстояние ≈ ${moon.toLocaleString('ru-RU')} км`);
}
function renderAchilles(){
 const k=achillesStep,gap=100/Math.pow(2,k),covered=100-gap,zoom=achillesZoom;
 const fmtFixed=(v,d=6)=>v.toLocaleString('ru-RU',{maximumFractionDigits:d});
 let stages='';for(let i=0;i<=k;i++){let dist=100/Math.pow(2,i);stages+=`<div class="metric" style="border-color:${i===k?'var(--cyan)':'var(--line)'}"><label>Шаг ${i}</label><strong>${fmtFixed(dist)} м осталось</strong><div class="sub">Ахиллес прошёл ${fmtFixed(100-dist)} м от начальной точки</div></div>`}
 const turtlePos=82,gapWidth=Math.min(68,68/Math.pow(2,k)*zoom),achPos=Math.max(5,turtlePos-gapWidth);
 const gapLabel=gap<0.000001?gap.toExponential(3).replace('.',','):fmtFixed(gap);
 $('visual').innerHTML=`<div style="width:100%;max-width:700px"><div class="visual-kicker">ЧЕРЕПАХА НЕ ДВИГАЕТСЯ · АХИЛЛЕС ПРОХОДИТ ПОЛОВИНУ ОСТАТКА</div><div style="margin:22px 0 14px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#0b1016"><div style="height:104px;position:relative;border-bottom:2px solid #526171;margin:0 0 10px;overflow:hidden"><div style="position:absolute;left:${achPos}%;bottom:0;transform:translateX(-50%);font-size:30px;transition:left .35s;z-index:2" aria-label="Ахиллес">🏃</div><div style="position:absolute;left:${turtlePos}%;bottom:0;transform:translateX(-50%);font-size:28px;z-index:2" aria-label="Неподвижная черепаха">🐢</div><div style="position:absolute;left:${achPos}%;width:${Math.max(0,turtlePos-achPos)}%;bottom:20px;border-top:2px dashed var(--cyan);transition:all .35s"></div><div style="position:absolute;left:${Math.min(achPos,turtlePos)}%;right:${100-Math.max(achPos,turtlePos)}%;top:4px;text-align:center;color:var(--yellow);font-size:12px">${gapLabel} м</div></div><div style="display:flex;justify-content:space-between;gap:10px;font-size:12px;flex-wrap:wrap"><span style="color:var(--cyan)">Ахиллес прошёл: ${fmtFixed(covered)} м</span><span style="color:var(--yellow)">Черепаха стоит на отметке 100 м</span></div><div class="hint" style="margin-top:8px">Приближение увеличивает видимый промежуток. Персонажи остаются на сцене; расстояние в числах показано без округления до нуля.</div></div><div class="metric"><label>Приближение сцены</label><div style="font-size:18px;color:var(--cyan);font-weight:700">Текущий масштаб: ×${zoom}</div><div class="hint">Управляй приближением кнопками под сценой, чтобы разглядеть всё меньший промежуток между Ахиллесом и черепахой.</div></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px">${stages}</div><div class="metric"><label>Оставшееся расстояние</label><strong>${gapLabel} м</strong><div class="sub">После каждого шага расстояние делится на 2: dₙ = 100 / 2<sup>${k}</sup></div></div></div>`;
 $('stepLabel').textContent=`Шаг ${k} · осталось ${gapLabel} м`;
 $('controls').innerHTML=btn('Следующий шаг: пройти половину остатка','achillesplus',true)+btn('Назад','achillesminus')+btn('Приблизить ×2','achilleszoomin')+btn('Отдалить ×2','achilleszoomout')+btn('Сбросить масштаб','achilleszoomreset')+btn('К очень малому расстоянию','achillesmeet')+btn('Начать сначала','achillesreset');
 $('metrics').innerHTML=numHTML('Начальное расстояние','100 м')+numHTML('Сейчас осталось',`${gapLabel} м`,`100 / 2<sup>${k}</sup>`)+numHTML('Пройдено Ахиллесом',`${fmtFixed(covered)} м`)+numHTML('Идея модели','Остаток стремится к нулю','После любого конечного шага он всё ещё больше нуля');
}
$('nav').addEventListener('click',e=>{let b=e.target.closest('[data-scene]');if(b){current=b.dataset.scene;render()}});$('controls').addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;switch(b.dataset.action){case'oddplus':oddN=Math.min(12,oddN+1);break;case'oddminus':oddN=Math.max(1,oddN-1);break;case'oddreset':oddN=1;break;case'powplus':powerN=Math.min(8,powerN+1);break;case'powminus':powerN=Math.max(1,powerN-1);break;case'powreset':powerN=1;break;case'chessplus':chessN=Math.min(64,chessN+1);break;case'chessminus':chessN=Math.max(1,chessN-1);break;case'chessreset':chessN=1;break;case'pascalplus':pascalN=Math.min(10,pascalN+1);break;case'pascalminus':pascalN=Math.max(0,pascalN-1);break;case'pascalreset':pascalN=0;break;case'halfplus':halfN=Math.min(12,halfN+1);break;case'halfminus':halfN=Math.max(0,halfN-1);break;case'halfreset':halfN=0;break;case'arithplus':arithN=Math.min(18,arithN+1);break;case'arithminus':arithN=Math.max(1,arithN-1);break;case'arithapply':{let a=Number($('arithA').value),d=Number($('arithD').value),n=Math.floor(Number($('arithN').value));if(Number.isFinite(a)&&Number.isFinite(d)&&Number.isFinite(n)){arithA=a;arithD=d;arithN=Math.max(1,Math.min(18,n));}break;}case'geomplus':geomN=Math.min(18,geomN+1);break;case'geomminus':geomN=Math.max(1,geomN-1);break;case'bactplus':bacteriaGen=Math.min(216,bacteriaGen+1);break;case'bactminus':bacteriaGen=Math.max(0,bacteriaGen-1);break;case'bactreset':bacteriaGen=0;break;case'bact3days':bacteriaGen=216;break;case'paperplus':paperFolds=Math.min(103,paperFolds+1);break;case'paperminus':paperFolds=Math.max(0,paperFolds-1);break;case'paperreset':paperFolds=0;break;case'paper42':paperFolds=42;break;case'paper103':paperFolds=103;break;case'achillesplus':achillesStep=Math.min(8,achillesStep+1);break;case'achillesminus':achillesStep=Math.max(0,achillesStep-1);break;case'achillesmeet':achillesStep=Math.min(achillesStep+5,40);achillesZoom=Math.min(1099511627776,Math.max(achillesZoom,8));break;case'achillesreset':achillesStep=0;achillesZoom=1;break;case'achilleszoomin':achillesZoom=Math.min(1099511627776,achillesZoom*2);break;case'achilleszoomout':achillesZoom=Math.max(1,achillesZoom/2);break;case'achilleszoomreset':achillesZoom=1;break;}render()});$('visual').addEventListener('click',e=>{let c=e.target.closest('[data-cell]');if(c){chessN=Number(c.dataset.cell);render();return}let anim=e.target.closest('[data-anim]');if(anim){let key=anim.dataset.anim,total=({ 'a-n':4,'a-sum-last':4,'a-sum-d':4,'g-n':4,'g-sum-one':4,'g-sum-two':4,'g-infinite':4})[key]||4;startFormulaAnimation(key,total)}});$('controls').addEventListener('change',e=>{if(e.target.id==='grainMass'){let v=Number(e.target.value);if(v>0)grainMass=v;render()}});render();
</script></body></html>
