  const m=(t.solution||'').match(/(?:Адрес|Новый адрес|Склейка):\s*<b>(.*?)<\/b>/i);
  if(!m)continue;
  const addr=m[1].replace(/<[^>]*>/g,'');
  const authority=addr.split('://')[1]||'';
  const path=(authority.match(/\/.*$/)||[''])[0];
  const needed=(path.match(/\//g)||[]).length;
  const existing=t.frags.filter(f=>f==='/').length;
  for(let k=existing;k<needed;k++){t.frags.push('/');t.labels.push(t.labels[t.frags.indexOf('/')]);}
}

['Проверка адреса','четыре числа от 0 до 255','После сборки посчитайте октеты и проверьте диапазон каждого числа.'],
['Стратегия','сопоставляйте края фрагментов','Ищите стыки цифр и точек. Итог должен содержать четыре октета и три точки.']]}];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function sec(t){return SECTIONS.find(s=>s.id===t._section)||SECTIONS[0]}function rec(t){return state.records[t.id]||(state.records[t.id]={order:[],tries:0,wrong:0,hint:false,done:false,repairDone:false,lastOrder:[],lastAnswer:'',usedHint:false})}function mainTasks(s){return TASKS.filter(t=>t._section===s.id&&/ПРОТОТИП/i.test(t.title))}function protos(s){return TASKS.filter(t=>t._section===s.id&&/АНАЛОГ/i.test(t.title))}function save(){try{localStorage.setItem('addrTrainerV2',JSON.stringify(state))}catch(e){}renderNav()}
function init(){if(!state.name){let n=prompt('Введите имя ученика:');state.name=(n||'Ученик 1').trim()||'Ученик 1'}$('badge').textContent='Ученик: '+state.name;renderNav();showSectionTheory(SECTIONS[0].id)}
function parentMain(proto){let ps=protos(sec(proto)),ms=mainTasks(sec(proto));return ms[ps.indexOf(proto)]||null}
function repairFor(main){let ms=mainTasks(sec(main)),ps=protos(sec(main));return ps[ms.indexOf(main)]||null}
function renderNav(){let all=TASKS.filter(t=>/ПРОТОТИП/i.test(t.title)),done=all.filter(t=>rec(t).done).length;$('counts').textContent=`Разобрано ${done} из ${all.length}`;$('bar').style.width=(100*done/Math.max(1,all.length))+'%';$('nav').innerHTML=SECTIONS.map(s=>`<div><button class="navbtn sectionbtn ${state.sectionsSeen[s.id]?'done':''}" onclick="showSectionTheory('${s.id}')">${s.name} · ${mainTasks(s).filter(t=>rec(t).done).length}/${mainTasks(s).length}</button>${mainTasks(s).map((t,j)=>{let pr=repairFor(t),r=rec(t),prr=pr?rec(pr):null;return `<button class="navbtn taskbtn ${state.idx===TASKS.indexOf(t)?'active':''} ${r.done?'done':''}" onclick="openTask(${TASKS.indexOf(t)})">${String(j+1).padStart(2,'0')} ${esc(t.title.replace(/Прототип/i,'Задание'))} ${r.done?'✓':''}</button>${r.hint&&r.done&&pr?`<button class="navbtn taskbtn repairnav ${prr.repairDone?'done':''} ${state.idx===TASKS.indexOf(pr)?'active':''}" style="margin-left:25px;width:calc(100% - 25px);background:#fff1d6;border-left:4px solid #e5a323;color:#805300" onclick="openTask(${TASKS.indexOf(pr)})">↳ 🛠 Работа над ошибками ${prr.repairDone?'✓':''}</button>`:''}`}).join('')}</div>`).join('')}
function showSectionTheory(id){let s=SECTIONS.find(x=>x.id===id);state.currentSection=id;save();$('view').innerHTML=`<div class="muted">Теория раздела</div><h2 class="tasktitle">${s.name}</h2><div class="theorygrid">${s.theory.map(c=>`<article class="theorycard"><h3>${c[0]}</h3><p><b>${c[1]}</b></p><p>${c[2]}</p></article>`).join('')}</div><h3>Проверка теории</h3><div id="quiz">${quizFor(id)}</div><div class="actions"><button class="btn primary" onclick="startSection('${id}')">Начать задания</button><button class="btn" onclick="startSection('${id}')">Пропустить теорию</button></div>`}
function quizFor(id){let qs=id==='web'?[['Какие символы ставят сразу после названия протокола (http или https)?',['://','//:',':/'],0],['Какой символ начинает путь к файлу после домена?',['.','/','@'],1]]:id==='email'?[['Что разделяет имя ящика и домен?',['/','@',':'],1],['Где находится домен?',['слева от @','справа от @'],1]]:[['Сколько чисел в IPv4?',['3','4','5'],1],['Чем разделены октеты?',['точками','дефисами','слешами'],0]];return qs.map((q,i)=>`<div class="quiz"><b>${i+1}. ${q[0]}</b><div>${q[1].map((v,j)=>`<label><input type="radio" name="q${id}${i}" value="${j}" onchange="this.parentElement.parentElement.querySelectorAll('label').forEach((l,k)=>{l.style.color=k===${q[2]}?'#187447':'';l.style.fontWeight=k===${q[2]}?'800':''})">${v}</label>`).join('')}</div></div>`).join('')}
function startSection(id){state.sectionsSeen[id]=true;let t=mainTasks(SECTIONS.find(s=>s.id===id)).find(t=>!rec(t).done);if(!t)t=mainTasks(SECTIONS.find(s=>s.id===id))[0];if(t)openTask(TASKS.indexOf(t));else showSectionTheory(id);save()}
function openTask(i){state.idx=i;renderTask();renderNav();save()}
function renderTask(){let t=TASKS[state.idx],r=rec(t);if(!t){showReport();return}let pool=t.frags.map((f,i)=>({id:i,text:f})).filter(x=>!r.order.includes(x.id));$('view').innerHTML=`<div class="muted">${sec(t).name} · ${parentMain(t)?'🛠 Работа над ошибками · аналог задания '+(mainTasks(sec(t)).indexOf(parentMain(t))+1):'задание '+(mainTasks(sec(t)).indexOf(t)+1)+' из '+mainTasks(sec(t)).length}</div><h2 class="tasktitle">${esc(t.title.replace(/Прототип/i,'Задание').replace(/Аналог/i,'Аналог'))}</h2><div class="condition">${highlightCondition(t.text)}</div><div class="label">Перетащите фрагменты в строку адреса</div><div class="bank" id="bank" ondragover="event.preventDefault()" ondrop="dropToBank(event)">${pool.map(p=>piece(p)).join('')||'<span class="placeholder">Все фрагменты размещены</span>'}</div><div class="label">Адрес</div><div class="build" id="build" ondragover="event.preventDefault()" ondrop="dropBuild(event)">${r.order.map((id,i)=>piece({id,text:t.frags[id]},true,i)).join('')||'<span class="placeholder">Перетащите сюда первый фрагмент</span>'}</div><div class="actions"><button class="btn primary" onclick="checkTask()">Проверить</button><button class="btn" onclick="undo()" ${r.order.length?'':'disabled'}>Отменить шаг</button><button class="btn" onclick="hint()">Подсказка</button></div><div id="feedback" class="feedback"></div><div id="hintbox"></div><div class="actions"><button class="btn" onclick="prevTask()">← Предыдущее</button><button class="btn" onclick="nextTask()">Следующее →</button></div>`}
function piece(p,placed=false,pos=-1){let t=TASKS[state.idx],label=t.labels[p.id]??'';return `<span class="piececard" draggable="true" data-id="${p.id}" ${placed?`data-pos="${pos}"`:''} ondragstart="dragStart(event)" ondblclick="doublePiece(event,${p.id},${placed?pos:-1})" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="dropOnPiece(event,${placed?pos:-1})"><span class="piece">${esc(p.text)}</span><small>${esc(label)}</small></span>`}
function highlightCondition(s){let x=s; // retain source HTML; emphasize explicitly named key values
 return x.replace(/(<b>.*?<\/b>)/g,'<strong class="key">$1</strong>').replace(/(протокол|сервер|сайте|файл|каталог|IP-адрес|почтов|домен)/gi,'<strong class="key">$1</strong>')}
let drag={id:null,from:'bank',pos:-1};function dragStart(e){let el=e.currentTarget;drag={id:+el.dataset.id,from:el.dataset.pos!=null?'build':'bank',pos:+(el.dataset.pos??-1)};e.dataTransfer.setData('text/plain',String(drag.id));e.dataTransfer.effectAllowed='move'}function dropBuild(e){e.preventDefault();let id=+(e.dataTransfer.getData('text/plain')||drag.id),r=rec(TASKS[state.idx]);if(drag.from==='build'){r.order.splice(drag.pos,1);r.order.push(id);save();renderTask();let t=TASKS[state.idx];if(r.order.map(i=>pieceAddress(t,i)).join('')===expectedAddress(t))checkTask()}else put(id)}function dropToBank(e){e.preventDefault();if(drag.from==='build'){let r=rec(TASKS[state.idx]);r.order.splice(drag.pos,1);save();renderTask()}}function dropOnPiece(e,pos){e.preventDefault();e.stopPropagation();let id=+(e.dataTransfer.getData('text/plain')||drag.id),r=rec(TASKS[state.idx]);if(drag.from==='build'){r.order.splice(drag.pos,1);if(pos>=0)r.order.splice(Math.min(pos,r.order.length),0,id);else r.order.push(id)}else{if(pos>=0)r.order.splice(Math.min(pos,r.order.length),0,id);else r.order.push(id)}save();renderTask();let t=TASKS[state.idx];if(r.order.map(i=>pieceAddress(t,i)).join('')===expectedAddress(t))checkTask()}
function put(id){let t=TASKS[state.idx],r=rec(t);if(r.order.includes(id))return;r.order.push(id);save();renderTask();if(r.order.map(i=>pieceAddress(t,i)).join('')===expectedAddress(t))checkTask()}function doublePiece(e,id,pos){e.preventDefault();let r=rec(TASKS[state.idx]);if(pos>=0){r.order.splice(pos,1)}else if(!r.order.includes(id)){r.order.push(id)}save();renderTask();let t=TASKS[state.idx];if(r.order.map(i=>pieceAddress(t,i)).join('')===expectedAddress(t))checkTask()}function undo(){let r=rec(TASKS[state.idx]);r.order.pop();save();renderTask()}
function pieceAddress(t,i){return t._section==='ip'?String(t.labels[i]??''):String(t.frags[i]??'')}
function expectedAddress(t){
 let sol=String(t.solution||'');
 let m=sol.match(/(?:Адрес|Новый адрес):\s*<b>(.*?)<\/b>/i);
 if(m)return m[1].replace(/<[^>]*>/g,'');
 m=sol.match(/Склейка:[\s\S]*?=\s*<b>(.*?)<\/b>/i);
 if(m)return m[1].replace(/<[^>]*>/g,'');
 let seq=String(t.answer||'').replace(/^Ответ:\s*/i,'').trim();
 return seq.split('').map(ch=>{let k=t.labels.indexOf(ch);if(k<0)k=t.frags.indexOf(ch);return k>=0?pieceAddress(t,k):''}).join('')
}
function checkTask(){let t=TASKS[state.idx],r=rec(t);r.tries++;let assembled=r.order.map(i=>pieceAddress(t,i)).join(''),expected=expectedAddress(t);r.lastOrder=r.order.slice();r.lastAnswer=assembled;if(expected&&assembled===expected){r.done=true;if(parentMain(t)){r.repairDone=true;feedback('Верно! Работа над ошибками завершена.',true)}else feedback('Верно! Адрес собран правильно.',true);save();setTimeout(()=>{if(parentMain(t)){let p=parentMain(t),n=mainTasks(sec(t)).find(x=>TASKS.indexOf(x)>TASKS.indexOf(p)&&!rec(x).done);if(n)openTask(TASKS.indexOf(n));else{let sid=nextSection(sec(t).id);if(sid)showSectionTheory(sid);else showReport()}}else if(r.hint){let repair=repairFor(t);if(repair){openTask(TASKS.indexOf(repair));return}advanceMain(t)}else advanceMain(t)},550)}else{r.wrong++;feedback('Пока неверно. Проверьте порядок карточек и символы на стыках.',false);save()}}
function advanceMain(t){let next=mainTasks(sec(t)).find(x=>!rec(x).done);if(next)openTask(TASKS.indexOf(next));else{let sid=nextSection(sec(t).id);if(sid)showSectionTheory(sid);else showReport()}}
function nextSection(id){let i=SECTIONS.findIndex(s=>s.id===id);return SECTIONS[i+1]?.id||null}function hint(){let t=TASKS[state.idx],r=rec(t);r.hint=true;r.usedHint=true;r.wrong++;r.order=[];save();renderTask();let ans=expectedAddress(t);$('hintbox').innerHTML=`<div class="hintbox"><b>Правильный ответ:</b> <code>${esc(ans)}</code><p>Теперь выполните дополнительное задание «Работа над ошибками» после завершения основного. В отчёте будет отмечено, что использована подсказка.</p></div>`}
function feedback(s,ok){let f=$('feedback');f.className='feedback '+(ok?'good':'bad');f.textContent=s}function resetTask(){rec(TASKS[state.idx]).order=[];save();renderTask()}function nextTask(){let t=TASKS[state.idx],n=mainTasks(sec(t)).find(x=>!rec(x).done);if(n)openTask(TASKS.indexOf(n));else showReport()}function prevTask(){openTask(Math.max(0,state.idx-1))}
function showReport(){let main=TASKS.filter(t=>/АНАЛОГ/i.test(t.title)),done=main.filter(t=>rec(t).done).length;let rows=main.map((t,j)=>{let r=rec(t),pr=repairFor(t),prr=pr?rec(pr):null;let status=r.done?'<span class="status ok">✅ Разобрано</span>':'<span class="status warn">⏳ Не завершено</span>';let pstatus=pr?(prr.repairDone?'<span class="status ok">✅ Аналог выполнен</span>':r.hint&&r.done?'<span class="status warn">🛠 Требуется работа над ошибками</span>':'<span class="status">— Не назначен</span>'):'';let ord=(r.lastOrder||r.order||[]).map(id=>`<span>${esc(t.labels[id]||'')} · ${esc(t.frags[id]||'')}</span>`).join('');let answer=esc(r.lastAnswer||((r.order||[]).map(id=>t.frags[id]).join(''))||'Ответ не зафиксирован');return `<tr><td>${j+1}. ${esc(t.title)}</td><td>${status}</td><td>${r.tries}</td><td>${r.wrong}</td><td>${r.usedHint?'💡 Да':'— Нет'}</td></tr><tr class="detailrow"><td colspan="5"><div class="reportdetails"><b>📋 Условие и решение ученика</b><b>Условие:</b><div class="condition">${t.text}</div><b>Карточки ученика (порядок сборки):</b><div class="answerchips">${ord||'—'}</div><b>Ответ ученика:</b> <code>${answer}</code><p><b>Подсказка:</b> ${r.usedHint?'💡 использовал':'не использовал'}</p>${pr?`<p><b>Работа над ошибками:</b> ${pstatus}</p>${r.hint?`<div class="reportdetails"><b>Условие аналога:</b><div class="condition">${pr.text}</div><b>Карточки ученика:</b><div class="answerchips">${(prr.lastOrder||prr.order||[]).map(id=>`<span>${esc(pr.labels[id]||'')} · ${esc(pr.frags[id]||'')}</span>`).join('')||'—'}</div><b>Ответ в аналоге:</b> <code>${esc(prr.lastAnswer||'не выполнен')}</code></div>`:''}`:''}</div></td></tr>`}).join('');$('view').innerHTML=`<div class="report"><h2>📊 Отчёт ученика: ${esc(state.name)}</h2><p><span class="status ok">✅ Разобрано: ${done}/${main.length}</span> <span class="status warn">⏳ Осталось: ${main.length-done}</span> <span class="status bad">❌ Ошибки: ${main.reduce((a,t)=>a+rec(t).wrong,0)}</span> <span class="status warn">💡 Подсказки: ${main.filter(t=>rec(t).usedHint).length}</span></p><table><thead><tr><th>Задание</th><th>Статус</th><th>Проверки</th><th>Ошибки</th><th>Подсказка</th></tr></thead><tbody>${rows}</tbody></table><div class="actions"><button class="btn" onclick="renderTask()">К заданиям</button><button class="btn" onclick="print()">Печать / PDF</button></div></div>`}
function saveApp(){save();const encoded=btoa(unescape(encodeURIComponent(JSON.stringify(state))));let html='<!doctype html>'+document.documentElement.outerHTML;html=html.replace('</head>','<meta name="saved-progress" content="'+encoded+'"></head>');let blob=new Blob([html],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='address_'+(state.name||'student')+'_progress.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
init();
</script></body></html>
