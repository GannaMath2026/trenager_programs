c-row button{border:0;background:#ffe6e6;color:#b42318;border-radius:8px;height:34px;font-weight:900}.calc-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.calc-tools button{font-size:11px}.answer-note{font-size:11px;color:var(--mut)}

<script id="course-data" type="application/json">{"tasks":[{"id":1,"title":"01 Прототип: вычёркивание (КОИ-8)","type":"task","answer":"Москва","text":"В кодировке КОИ-8 каждый символ кодируется 8 битами. Андрей написал текст (в нем нет лишних пробелов):\n«Обы, Лена, Волга, Москва, Макензи, Амазонка — реки».\nУченик вычеркнул из списка название одной из рек. Заодно он вычеркнул ставшие лишними запятые и пробелы — два пробела не должны идти подряд.\nПри этом размер нового предложения в данной кодировке оказался на 8 байтов меньше, чем размер исходного предложения.\nНапишите в ответе вычеркнутое название реки.","hint":"1) 8 бит = 1 байт. Уменьшилось на 8 байт = 8 символов.\n2) Вычеркнуто: слово + запятая (1) + пробел (1).\n3) Длина слова + 2 = 8. Длина слова = 6.\n4) Ищем реку из 6 букв."},{"id":2,"title":"02 Прототип: добавление (Windows-1251)","type":"task","answer":"скользя","text":"В кодировке Windows-1251 каждый символ кодируется 8 битами. Вова хотел написать текст:\n«Скользя по утреннему снегу, Друг милый, предадимся бегу Нетерпеливого коня И навестим поля пустые…»\nОдно из слов ученик написал два раза подряд, поставив между одинаковыми словами один пробел.\nПри этом размер написанного предложения в данной кодировке оказался на 8 байт больше, чем размер нужного предложения.\nНапишите в ответе лишнее слово.","hint":"1) 8 бит = 1 байт. Увеличилось на 8 байт = 8 символов.\n2) Добавлено: слово + 1 пробел.\n3) Длина слова + 1 = 8. Длина слова = 7."},{"id":3,"title":"03 Прототип: вычёркивание (Unicode 16 бит)","type":"task","answer":"тюлень","text":"В одной из кодировок Unicode каждый символ кодируется 16 битами. Вова написал текст:\n«еж, лев, слон, олень, тюлень, носорог, крокодил, аллигатор — дикие животные».\nУченик вычеркнул из списка название одного из животных. Заодно он вычеркнул ставшие лишними запятые и пробелы.\nПри этом размер нового предложения оказался на 16 байт меньше, чем размер исходного.\nНапишите в ответе вычеркнутое название животного.","hint":"1) 16 бит = 2 байта. Уменьшилось на 16 байт = 8 символов.\n2) Вычеркнуто: слово + запятая + пробел.\n3) Длина слова + 2 = 8. Длина слова = 6."},{"id":4,"title":"04 Прототип: добавление с запятой (Unicode 16 бит)","type":"task","answer":"Ом","text":"В одной из кодировок Unicode каждый символ кодируется 16 битами. Вова написал текст:\n«Ом, Бор, Кюри, Попов, Джоуль, Рентген, Курчатов, Резерфорд — великие физики».\nФамилию одного ученого ученик написал два раза подряд, добавив необходимые запятую и пробел.\nПри этом размер написанного предложения оказался на 8 байт больше, чем размер нужного.\nНапишите в ответе слово, использованное дважды.","hint":"1) 16 бит = 2 байта. Увеличилось на 8 байт = 4 символа.\n2) Добавлено: слово + запятая + пробел.\n3) Длина слова + 2 = 4. Длина слова = 2."},{"id":5,"title":"05 Прототип: вычёркивание (UTF-32)","type":"task","answer":"Гуарана","text":"В кодировке UTF-32 каждый символ кодируется 32 битами. Миша написал текст:\n«Айва, Алыча, Генипа, Гуарана, Курбарил, Мангостан — фрукты».\nУченик вычеркнул название одного фрукта. Заодно вычеркнул лишние запятые и пробелы.\nРазмер нового предложения оказался на 36 байтов меньше исходного.\nНапишите в ответе вычеркнутое название фрукта.","hint":"1) 32 бита = 4 байта. Уменьшилось на 36 байт = 9 символов.\n2) Вычеркнуто: слово + запятая + пробел.\n3) Длина слова + 2 = 9. Длина слова = 7."},{"id":6,"title":"06 Прототип: объём рассказа (Windows, 8 бит)","type":"task","answer":"15","text":"Рассказ, набранный на компьютере, содержит 8 страниц, на каждой странице 40 строк, в каждой строке 48 символов.\nОпределите информационный объем рассказа в Кбайтах в кодировке Windows, в которой каждый символ кодируется 8 бит.","hint":"1) 8 бит = 1 байт.\n2) Символов: 8 * 40 * 48 = 15360.\n3) Объем в байтах: 15360 * 1 = 15360.\n4) В Кбайтах: 15360 / 1024 = 15."},{"id":7,"title":"07 Прототип: объём статьи (Unicode, 2 байта)","type":"task","answer":"75","text":"Статья, набранная на компьютере, содержит 20 страниц, на каждой странице 40 строк, в каждой строке 48 символов.\nВ одном из представлений Unicode каждый символ кодируется двумя байтами.\nОпределите информационный объем статьи в Кбайтах, округлив результат до целого числа.","hint":"1) 1 символ = 2 байта.\n2) Символов: 20 * 40 * 48 = 38400.\n3) Объем в байтах: 38400 * 2 = 76800.\n4) В Кбайтах: 76800 / 1024 = 75."},{"id":8,"title":"08 Прототип: объём предложения (Unicode, 16 бит)","type":"task","answer":"84","text":"В одной из кодировок Unicode каждый символ кодируется 16 битами.\nОпределите размер в байтах следующего предложения:\nСлух обо мне пройдет по всей Руси великой.","hint":"1) 16 бит = 2 байта.\n2) Считаем символы (включая пробелы и точку):\nСлух(4) пробел(1) обо(3) пробел(1) мне(3) пробел(1) пройдет(7) пробел(1) по(2) пробел(1) всей(4) пробел(1) Руси(4) пробел(1) великой(7) точка(1) = 42 символа.\n3) Объем: 42 * 2 = 84 байта."},{"id":9,"title":"01 Аналог: вычёркивание (КОИ-8)","type":"task","answer":"Haskell","text":"В кодировке КОИ-8 каждый символ кодируется 8 битами. Андрей написал текст:\n«C, Cg, Cat, Ruby, Swift, Delphi, Haskell — языки программирования».\nУченик вычеркнул из списка название одного из языков. Заодно он вычеркнул ставшие лишними запятые и пробелы.\nПри этом размер нового предложения в данной кодировке оказался на 9 байт меньше, чем размер исходного.\nНапишите в ответе вычеркнутое название языка программирования.","hint":"1) 8 бит = 1 байт. Уменьшилось на 9 байт = 9 символов.\n2) Вычеркнуто: слово + запятая + пробел.\n3) Длина слова + 2 = 9. Длина слова = 7.\n4) Ищем язык из 7 букв."},{"id":10,"title":"02 Аналог: добавление (Unicode 16 бит)","type":"task","answer":"пустые","text":"В одной из кодировок Unicode каждый символ кодируется 16 битами. Вова хотел написать текст:\n«Скользя по утреннему снегу, Друг милый, предадимся бегу Нетерпеливого коня И навестим поля пустые…»\nОдно из слов ученик написал два раза подряд, поставив между одинаковыми словами один пробел.\nПри этом размер написанного предложения в данной кодировке оказался на 14 байт больше, чем размер нужного.\nНапишите в ответе лишнее слово.","hint":"1) 16 бит = 2 байта. Увеличилось на 14 байт = 7 символов.\n2) Добавлено: слово + 1 пробел.\n3) Длина слова + 1 = 7. Длина слова = 6."},{"id":11,"title":"03 Аналог: вычёркивание (Unicode 16 бит)","type":"task","answer":"лиственница","text":"В одной из кодировок Unicode каждый символ кодируется 16 битами. Петя написал текст:\n«Ель, кедр, сосна, кипарис, лиственница, можжевельник — хвойные растения».\nУченик вычеркнул из списка название одного из растений. Заодно он вычеркнул ставшие лишними запятые и пробелы.\nПри этом размер нового предложения оказался на 26 байт меньше, чем размер исходного.\nНапишите в ответе вычеркнутое название хвойного растения.","hint":"1) 16 бит = 2 байта. Уменьшилось на 26 байт = 13 символов.\n2) Вычеркнуто: слово + запятая + пробел.\n3) Длина слова + 2 = 13. Длина слова = 11."},{"id":12,"title":"04 Аналог: добавление с запятой (Unicode 16 бит)","type":"task","answer":"Ом","text":"В одной из кодировок Unicode каждый символ кодируется 16 битами. Вова написал текст:\n«Пушкин, Гоголь, Толстой, Чехов, Достоевский, Есенин, Ом — великие люди».\nФамилию одного человека ученик написал два раза подряд, добавив необходимые запятую и пробел.\nПри этом размер написанного предложения оказался на 8 байт больше, чем размер нужного.\nНапишите в ответе слово, использованное дважды.","hint":"1) 16 бит = 2 байта. Увеличилось на 8 байт = 4 символа.\n2) Добавлено: слово + запятая + пробел.\n3) Длина слова + 2 = 4. Длина слова = 2."},{"id":13,"title":"05 Аналог: вычёркивание (UTF-32)","type":"task","answer":"койот","text":"В кодировке UTF-32 каждый символ кодируется 32 битами. Миша написал текст:\n«Волк, лиса, заяц, барсук, енот, койот, рысь, медведь — дикие животные».\nУченик вычеркнул название одного животного. Заодно вычеркнул лишние запятые и пробелы.\nРазмер нового предложения оказался на 28 байтов меньше исходного.\nНапишите в ответе вычеркнутое название животного.","hint":"1) 32 бита = 4 байта. Уменьшилось на 28 байт. При весе 4 байта на символ исчезло 7 символов.\n2) Вычеркнуто: слово + запятая + пробел.\n3) Длина слова + 2 = 7. Длина слова = 5."},{"id":14,"title":"06 Аналог: объём рассказа (Unicode, 16 бит)","type":"task","answer":"8","text":"Рассказ, набранный на компьютере, содержит 2 страницы, на каждой странице 32 строки, в каждой строке 64 символа.\nОпределите информационный объем рассказа в Кбайтах в одной из кодировок Unicode, в которой каждый символ кодируется 16 бит.","hint":"1) 16 бит = 2 байта.\n2) Символов: 2 * 32 * 64 = 4096.\n3) Объем в байтах: 4096 * 2 = 8192.\n4) В Кбайтах: 8192 / 1024 = 8."},{"id":15,"title":"07 Аналог: объём статьи (Unicode, 2 байта)","type":"task","answer":"44","text":"Статья, набранная на компьютере, содержит 15 страниц, на каждой странице 30 строк, в каждой строке 50 символов.\nВ одном из представлений Unicode каждый символ кодируется двумя байтами.\nОпределите информационный объем статьи в Кбайтах, округлив результат до целого числа.","hint":"1) 1 символ = 2 байта.\n2) Символов: 15 * 30 * 50 = 22500.\n3) Объем в байтах: 22500 * 2 = 45000.\n4) В Кбайтах: 45000 / 1024 = 43.94... (округляем до 44)."},{"id":16,"title":"08 Аналог: объём предложения (Unicode 16 бит)","type":"task","answer":"104","text":"В одной из кодировок Unicode каждый символ кодируется 16 битами.\nОпределите размер в байтах следующего предложения:\nЯ к вам пишу — чего же боле? Что я могу еще сказать?","hint":"1) 16 бит = 2 байта.\n2) Считаем все 52 символа, включая пробелы, знаки препинания и тире.\n3) Объем: 52 * 2 = 104 байта."},{"id":17,"title":"01 Закрепление 2: вычёркивание (КОИ-8)","type":"task","answer":"Delphi","text":"В кодировке КОИ-8 каждый символ кодируется 8 битами. В списке языков программирования записаны: «C, Go, Perl, Java, Delphi, Swift, Rust».\nУченик вычеркнул один язык и ставшие лишними запятую и пробел. Размер текста уменьшился на 8 байт.\nНапишите название вычеркнутого языка.","hint":"1) 8 бит = 1 байт, значит исчезло 8 символов. 2) Удаляется слово, запятая и пробел. 3) Длина слова = 8 − 2 = 6."},{"id":18,"title":"02 Закрепление 2: добавление (Unicode 16 бит)","type":"task","answer":"утреннему","text":"В Unicode каждый символ кодируется 16 битами. В предложении «Скользя по утреннему снегу, друг милый, предадимся бегу» одно слово повторили подряд, разделив пробелом. Размер увеличился на 20 байт.\nКакое слово повторили?","hint":"1) 16 бит = 2 байта. 20 байт = 10 символов. 2) Добавлено слово и пробел. 3) Длина слова = 10 − 1 = 9."},{"id":19,"title":"03 Закрепление 2: вычёркивание (Unicode 16 бит)","type":"task","answer":"можжевельник","text":"В Unicode каждый символ кодируется 16 битами. В списке растений: «ель, кедр, сосна, кипарис, можжевельник, лиственница».\nОдно название вычеркнули вместе с лишними запятой и пробелом. Размер уменьшился на 28 байт.\nНапишите вычеркнутое растение.","hint":"1) 28 байт при 2 байтах на символ — 14 символов. 2) На запятую и пробел приходится 2 символа. 3) Длина слова = 12."},{"id":20,"title":"04 Закрепление 2: добавление с запятой (Unicode 16 бит)","type":"task","answer":"Ия","text":"В Unicode каждый символ кодируется 16 битами. В списке имён «Аня, Ия, Лев, Оля, Ева» одно имя повторили как новый элемент списка, добавив запятую и пробел. Размер увеличился на 8 байт.\nКакое имя повторили?","hint":"1) 8 байт = 4 символа. 2) Добавлены слово, запятая и пробел: длина + 2. 3) Длина слова = 2."},{"id":21,"title":"05 Закрепление 2: вычёркивание (UTF-32)","type":"task","answer":"барсук","text":"В UTF-32 каждый символ кодируется 32 битами. В списке животных «волк, лиса, заяц, барсук, енот, койот» вычеркнули одно название и лишние запятую с пробелом. Размер уменьшился на 32 байта.\nКакое животное вычеркнули?","hint":"1) 32 бита = 4 байта. 2) 32 байта = 8 символов. 3) Длина слова = 8 − 2 = 6."},{"id":22,"title":"06 Закрепление 2: объём страниц","type":"task","answer":"10","text":"Документ содержит 2 страницы, на каждой 40 строк, в каждой строке 64 символа. Каждый символ кодируется 16 битами.\nОпределите объём документа в Кбайтах.","hint":"1) Символов: 2 × 40 × 64 = 5120. 2) По 2 байта: 10240 байт. 3) 10240 ÷ 1024 = 10 Кбайт."},{"id":23,"title":"07 Закрепление 2: объём статьи","type":"task","answer":"30","text":"Статья содержит 10 страниц, на каждой странице 24 строки, в каждой строке 64 символа. Каждый символ занимает 2 байта.\nОпределите информационный объём статьи в Кбайтах.","hint":"1) Символов: 10 × 24 × 64 = 15360. 2) Объём: 15360 × 2 = 30720 байт. 3) 30720 ÷ 1024 = 30 Кбайт."},{"id":24,"title":"08 Закрепление 2: объём сообщения","type":"task","answer":"70","text":"В Unicode каждый символ кодируется 16 битами. Определите объём сообщения в байтах:\n«Ученье — свет, а неученье — тьма!»","hint":"1) Посчитайте все 35 символов, включая кавычки, пробелы, тире и знаки препинания. 2) 35 × 2 = 70 байт."}],"sections":[{"id":"words","title":"Добавление и удаление слов","ids":[1,2,3,4,5,9,10,11,12,13,17,18,19,20,21],"theory":"<h3>Добавление и удаление слов</h3><p>Размер текста зависит от числа символов и веса одного символа: <b>I = k × i</b>, где I — объём в байтах, k — число символов, i — байт на символ.</p><p><b>Удаление из списка:</b> обычно исчезает слово, одна запятая и один пробел. Поэтому число удалённых символов = длина слова + 2.</p><p><b>Повтор слова:</b> при повторе через пробел добавляется слово и пробел: длина слова + 1. Если повтор добавляется как элемент списка, могут добавиться запятая и пробел: длина слова + 2.</p><p><b>Перевод единиц:</b> 8 бит = 1 байт; 16 бит = 2 байта; 32 бита = 4 байта.</p>","lesson":{"emoji":"🧩","kicker":"Разберёмся со словами и пробелами","hook":"Текст — это не только буквы. Запятые и пробелы тоже занимают память!","points":[["Символы считаются все","Буква, цифра, пробел, запятая и точка — каждый занимает место в коде."],["Вес символа зависит от кодировки","КОИ-8: 1 байт; Unicode 16 бит: 2 байта; UTF-32: 4 байта на символ."],["При удалении исчезает не только слово","Из элемента списка обычно уходят само слово, запятая и пробел."],["При повторе добавляется разделитель","Повтор через пробел: слово + пробел. Новый элемент списка: слово + запятая + пробел."]],"formula":"Изменение объёма = число исчезнувших / добавленных символов × байт на символ","example":"Если символ занимает 2 байта, а текст уменьшился на 16 байт, исчезло 8 символов. При удалении слова вместе с запятой и пробелом длина слова — 8 − 2 = 6 букв.","pre":["Сначала переведи байты в символы: раздели на байт/символ.","Затем учти запятую и пробел — их тоже надо прибавить или вычесть.","Не путай повтор через пробел с добавлением нового элемента списка."],"trap":"Ловушка: «лишнее слово» не равно всему уменьшению в символах — рядом с ним могли исчезнуть знаки препинания.","review":{"emoji":"🧩","kicker":"Соберём задачу по шагам","hook":"Теперь соберём задачу в понятный алгоритм: от байтов — к символам, а от символов — к длине слова.","points":[["Шаг 1. Переведи объём в символы","Раздели изменение размера текста на количество байтов, которое занимает один символ. Так узнаешь, сколько символов исчезло или добавилось."],["Шаг 2. Верни разделители","При удалении элемента списка вместе со словом обычно исчезают запятая и пробел. При повторе через пробел добавляется только пробел."],["Шаг 3. Найди длину слова","Из общего числа исчезнувших символов вычти разделители. Не торопись: сначала выясни, как именно слово было вставлено или удалено."]],"formula":"Число символов = изменение объёма ÷ байт на символ","exampleTitle":"Разберём на другом примере","example":"Текст уменьшился на 20 байт. Один символ занимает 4 байта. Исчезло 20 ÷ 4 = 5 символов. Если удалили название из списка вместе с запятой и пробелом, на само слово приходится 5 − 2 = 3 символа.","checkTitle":"Перед ответом проверь себя","check":["Я перевёл(а) биты в байты, если это нужно.","Я учёл(а) запятую и пробел — либо только пробел, если слово просто повторили через пробел.","Я вычел(а) разделители и получил(а) длину самого слова."],"trap":"Главная ловушка — перепутать два случая: повтор слова через пробел (+1 символ-разделитель) и добавление нового элемента списка (+2: запятая и пробел)."}}},{"id":"pages","title":"Объём страниц, строк и символов","ids":[6,7,14,15,22,23],"theory":"<h3>Объём страниц, строк и символов</h3><p>Сначала найдите общее число символов: <b>страницы × строки на странице × символы в строке</b>.</p><p>Затем умножьте число символов на вес символа в байтах.</p><p>Чтобы перевести байты в Кбайты, разделите на 1024. Если задача требует округления, округлите результат так, как указано в условии.</p><p><b>Пример:</b> 8 × 40 × 48 = 15 360 символов. При 8 битах на символ это 15 360 байт, то есть 15 Кбайт.</p>","lesson":{"emoji":"📚","kicker":"Собираем объём документа по частям","hook":"Представь документ как стопку одинаковых страниц. Сначала считаем символы, потом — байты.","points":[["Считаем все символы","Страницы × строки на странице × символы в строке."],["Переводим символы в байты","Умножаем число символов на вес одного символа в байтах."],["Переходим к Кбайтам","Если объём нужен в Кбайтах, делим байты на 1024."],["Округляем по условию","Если прямо сказано округлить до целого, делаем это только в самом конце."]],"formula":"Nсимв = страницы × строки × символы в строке;  Vбайт = Nсимв × i","example":"8 страниц × 40 строк × 48 символов = 15 360 символов. При 1 байте на символ это 15 360 байт, или 15 Кбайт.","pre":["Не теряй ни один множитель: страницы, строки, символы в строке.","Проверь, сколько байт занимает один символ.","Деление на 1024 выполняй только после вычисления байтов."],"trap":"Ловушка: 16 бит — это 2 байта, а не 16 байт. Сначала переведи биты в байты.","review":{"emoji":"📚","kicker":"Считаем размер документа без путаницы","hook":"Задача про страницы решается как конструктор: сначала считаем символы, затем байты и только потом переводим единицы.","points":[["Шаг 1. Посчитай символы","Умножь число страниц на число строк на странице и на число символов в строке. Это общий объём текста в символах."],["Шаг 2. Узнай вес символа","Переведи указанную глубину кодирования: 8 бит = 1 байт; 16 бит = 2 байта. Используй именно значение из условия."],["Шаг 3. Переведи в нужные единицы","Сначала найди объём в байтах. Если спрашивают Кбайты — раздели на 1024. Округляй только в конце и только если это требуется."]],"formula":"Nсимв = страницы × строки × символы в строке   |   Vбайт = Nсимв × байт на символ","exampleTitle":"Небольшой расчёт","example":"В документе 6 страниц, на каждой по 25 строк, в строке по 40 символов. Получаем 6 × 25 × 40 = 6000 символов. При 2 байтах на символ это 12 000 байт. В Кбайтах: 12 000 ÷ 1024 ≈ 11,72 Кбайт.","checkTitle":"Проверь порядок действий","check":["Сначала перемножены страницы, строки и символы в строке.","Вес символа записан в байтах, а не в битах.","Деление на 1024 выполнено после расчёта объёма в байтах.","Округление сделано только в конце, если оно указано в условии."],"trap":"Не дели на 1024 слишком рано и не считай 16 бит как 16 байт: 16 бит — это 2 байта."}}},{"id":"message","title":"Объём сообщения","ids":[8,16,24],"theory":"<h3>Объём сообщения</h3><p>Посчитайте все символы сообщения: буквы, пробелы, знаки препинания и тире.</p><p>Затем умножьте число символов на вес одного символа: <b>I = k × i</b>.</p><p>Например, 42 символа × 2 байта = 84 байта.</p>","lesson":{"emoji":"✉️","kicker":"Считаем сообщение целиком","hook":"В коротком сообщении каждый знак имеет значение — даже тире и пробел!","points":[["Считаем каждый знак","Буквы, пробелы, запятые, тире, кавычки и знаки в конце предложения."],["Определяем вес символа","Смотри на кодировку: 8 бит — 1 байт; 16 бит — 2 байта."],["Перемножаем","Число символов × байт на символ = объём в байтах."],["Проверяем, что именно спросили","В этой группе ответ нужен в байтах, а не в Кбайтах."]],"formula":"V = k × i, где k — число всех символов, i — байт на один символ","example":"Если в сообщении 42 символа и каждый кодируется 2 байтами, объём равен 42 × 2 = 84 байта.","pre":["Символы считай вместе с пробелами и пунктуацией.","Вес одного символа возьми из условия, не угадывай.","Не дели на 1024, если спрашивают байты."],"trap":"Ловушка: тире, кавычки и восклицательный знак тоже символы. Не считай только буквы.","review":{"emoji":"✉️","kicker":"Каждый знак на своём месте","hook":"В сообщении нет «мелочей»: пробел и знак препинания тоже занимают место. Считаем ровно ту строку, которая дана в задаче.","points":[["Шаг 1. Считай все символы","Учитывай буквы, пробелы, запятые, точки, тире и другие знаки, которые входят в заданный текст. Не считай только слова или буквы."],["Шаг 2. Определи вес символа","Смотри на кодировку в условии. Например, 8 бит — 1 байт, а 16 бит — 2 байта на символ."],["Шаг 3. Умножь и проверь единицы","Количество символов умножь на число байтов на один символ. Если спрашивают байты, на этом расчёт заканчивается — перевод в Кбайты не нужен."]],"formula":"V = k × i, где k — число символов, i — байт на один символ","exampleTitle":"Проверочный пример","example":"В строке 31 символ, каждый кодируется двумя байтами. Объём равен 31 × 2 = 62 байта. Обрати внимание: ответ оставляем в байтах, потому что именно их просили.","checkTitle":"Перед отправкой ответа","check":["Считал(а) все символы в заданной строке, а не только буквы.","Не добавлял(а) кавычки, если они лишь обозначают границы цитаты и не входят в сам текст.","Умножил(а) число символов на вес одного символа.","Оставил(а) ответ в тех единицах, которые спрашивает задача."],"trap":"Не пересчитывай байты в Кбайты автоматически. Сначала посмотри на вопрос: если нужен размер в байтах, деление на 1024 будет лишним."}}}],"theory":{"words":[{"q":"Что означает формула I = k × i?","o":["I — объём, k — число символов, i — байт на символ","I — число страниц, k — вес символа, i — число строк","I — число символов, k — объём, i — страницы"],"a":0},{"q":"16 бит — это сколько байт?","o":["1 байт","2 байта","4 байта"],"a":1},{"q":"Исчезло 16 байт. Один символ занимает 2 байта. Сколько символов исчезло?","o":["8 символов","16 символов","32 символа"],"a":0},{"q":"При удалении одного элемента из списка вместе со словом обычно исчезают:","o":["запятая и пробел","только пробел","две запятые"],"a":0},{"q":"Слово повторили сразу после исходного, поставив между ними один пробел. Что добавилось?","o":["слово и пробел","слово, запятая и пробел","только слово"],"a":0}],"pages":[{"q":"Как найти общее число символов на нескольких страницах?","o":["страницы × строки на странице × символы в строке","страницы + строки + символы в строке","страницы × байты на символ"],"a":0},{"q":"Что означает формула I = k × i?","o":["объём равен числу символов, умноженному на вес символа","объём равен числу символов, делённому на вес символа","объём равен сумме числа символов и веса символа"],"a":0},{"q":"В документе 4096 символов, каждый занимает 2 байта. Каков объём в байтах?","o":["2048","4096","8192"],"a":2},{"q":"В файле 10 240 байт. Сколько это Кбайт?","o":["10 Кбайт","100 Кбайт","1024 Кбайта"],"a":0},{"q":"Объём текста 8192 байта, вес символа — 2 байта. Сколько в нём символов?","o":["4096","8192","16 384"],"a":0}],"message":[{"q":"Что означает формула I = k × i?","o":["I — объём сообщения, k — число символов, i — байт на символ","I — число слов, k — число страниц, i — число строк","I — вес символа, k — объём, i — число символов"],"a":0},{"q":"При подсчёте символов сообщения учитываются:","o":["только буквы","буквы, пробелы и знаки препинания","только буквы и пробелы"],"a":1},{"q":"Исчезло 16 байт, вес символа — 2 байта. Сколько символов исчезло?","o":["8 символов","16 символов","32 символа"],"a":0},{"q":"В сообщении 35 символов, каждый занимает 2 байта. Каков объём?","o":["37 байт","70 байт","17,5 байта"],"a":1},{"q":"Объём сообщения — 84 байта, один символ занимает 2 байта. Сколько символов в сообщении?","o":["42","82","168"],"a":0}]}}</script>
<script id="embedded-db" type="application/json">{"v":1,"teacher":{"pin":"31415","active":null},"students":{},"last":"","theme":"light"}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('course-data').textContent);
const TASKS=DATA.tasks,SECTIONS=DATA.sections,THEORY_Q=DATA.theory;
const MAIN_IDS={words:[1,2,3,4,5],pages:[6,7],message:[8]};
const ANALOG_ORIGIN={9:1,17:1,10:2,18:2,11:3,19:3,12:4,20:4,13:5,21:5,14:6,22:6,15:7,23:7,16:8,24:8};
const ANALOGS={1:[9,17],2:[10,18],3:[11,19],4:[12,20],5:[13,21],6:[14,22],7:[15,23],8:[16,24]};
const TASK=Object.fromEntries(TASKS.map(t=>[t.id,t]));
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').trim().toLocaleLowerCase('ru').replace(/ё/g,'е').replace(/\s+/g,' ');
const fmt=n=>Number.isFinite(n)?String(Number(n.toPrecision(11))).replace('.',','):'—';
const STORE='oge1_code_text_13dz_v2';
function blankDB(){return {v:2,teacher:{pin:'31415',active:null},students:{},last:'',theme:'light'};}
function safeJSON(s){try{return JSON.parse(s)}catch(e){return null}}
function loadDB(){let db=blankDB(),embed=safeJSON($('embedded-db').textContent),local=null;try{local=safeJSON(window.localStorage.getItem(STORE)||'null');}catch(e){local=null;}[embed,local].forEach(src=>{if(!src)return;if(src.teacher)db.teacher={...db.teacher,...src.teacher};Object.values(src.students||{}).forEach(p=>{let old=db.students[p.name];if(!old||(p.updated||0)>(old.updated||0))db.students[p.name]=p;});if(src.last)db.last=src.last;if(src.theme)db.theme=src.theme;});return db;}
let DB=loadDB(),studentName='',S=null,dirty=false,taskStarted=0,advanceTimer=null,advancePending=false;
function freshState(name){return {name,created:Date.now(),updated:Date.now(),section:'words',current:1,done:{},skipped:{},attempts:{},answers:{},visited:{},support:{},supportType:{},scratch:{},theoryAnswers:{},theoryPassed:{},theorySkipped:{},sectionIntroSeen:{},testIntroSeen:{},testStarted:{},repairOrigin:null,repairQueue:[],repairDone:{},timeByTask:{},totalMs:0,days:[],cur:1,redoList:[]};}
function persist(){if(S){S.updated=Date.now();DB.students[studentName]=S;DB.last=studentName;}persistDB();}
function persistDB(){dirty=true;try{localStorage.setItem(STORE,JSON.stringify(DB));}catch(e){/* в приватном/изолированном режиме прогресс сохранится внутри скачанного HTML */}}
function saveEmbeddedHTML(){persist();let db=JSON.stringify(DB).replace(/</g,'\\u003c');let html='<!doctype html>\n'+document.documentElement.outerHTML;html=html.replace(/(<script id="embedded-db" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+db+b);const blob=new Blob([html],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ОГЭ_Информатика_Задание_1_тренажёр_'+new Date().toISOString().slice(0,10)+'.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);dirty=false;toast('Файл приложения сохранён вместе с базой учеников и прогрессом.');}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
function toast(msg){$('toast').textContent=msg;$('toast').style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>$('toast').style.display='none',2500);}
function showModal(html){$('modalContent').innerHTML=html;$('overlay').classList.add('show');}
function closeModal(){$('overlay').classList.remove('show');}
$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeModal()});
function applyTheme(){document.documentElement.setAttribute('data-theme',DB.theme==='dark'?'dark':'light');}
function taskTime(){if(taskStarted&&S){const dt=Math.min(Date.now()-taskStarted,300000);S.timeByTask[S.current]=(S.timeByTask[S.current]||0)+dt;S.totalMs+=dt;taskStarted=Date.now();}}
function isAnalog(id){return Object.hasOwn(ANALOG_ORIGIN,id)}
function active(id){return !Array.isArray(DB.teacher.active)||DB.teacher.active.includes(id)}
function mains(secId=S.section){return (MAIN_IDS[secId]||[]).filter(active)}
function analogs(id){return (ANALOGS[id]||[]).filter(a=>active(a))}
function solved(id){return !!S?.done[id]||!!S?.skipped[id]}
function sectionComplete(secId){return mains(secId).every(id=>solved(id))&&mains(secId).every(id=>!S.done[id]||!S.support[id]||analogs(id).every(a=>solved(a)));}
function allComplete(){return SECTIONS.every(s=>sectionComplete(s.id))}
function isAssisted(id){return !!S.support[id]}
function firstMain(secId){return mains(secId).find(id=>!solved(id))||mains(secId)[0]||null}
function sectionStage(secId=S.section){if(S.theoryPassed[secId]||S.theorySkipped[secId])return 'practice';if(!S.sectionIntroSeen[secId])return 'lecture';if(!S.testIntroSeen[secId])return 'pretest';return 'test';}
function progressCount(){let ids=TASKS.filter(t=>active(t.id)).map(t=>t.id),done=ids.filter(solved).length;return {done,total:ids.length};}
function login(){studentName='';S=null;applyTheme();const profiles=Object.values(DB.students).sort((a,b)=>(b.updated||0)-(a.updated||0));$('app').innerHTML=`<div class="login"><div class="lcard"><div class="logo">💻</div><h1>ОГЭ · Информатика · Задание 1</h1><div class="sub">Кодирование текста · объём информации · вычисления по шагам</div><form id="loginForm"><input id="loginName" maxlength="40" autocomplete="off" placeholder="Введи имя ученика" value="${esc(DB.last||'')}"><button class="btn pri" style="width:100%;justify-content:center;padding:13px;font-size:16px">Начать ➜</button></form>${profiles.length?`<div class="prof">${profiles.map(p=>{const d=Object.keys(p.done||{}).filter(k=>p.done[k]).length;return `<button data-profile="${esc(p.name)}">👤 ${esc(p.name)} <small>${d}/${TASKS.length}</small></button>`}).join('')}</div>`:''}<div class="lfoot"><button class="btn ghost sm" id="themeLogin">${DB.theme==='dark'?'☀️ Светлая тема':'🌙 Тёмная тема'}</button><button class="btn ghost sm" id="teacherLogin">🎓 Учителю</button></div></div></div>`;
 $('loginForm').onsubmit=e=>{e.preventDefault();enter($('loginName').value)};$('themeLogin').onclick=()=>{DB.theme=DB.theme==='dark'?'light':'dark';applyTheme();login()};$('teacherLogin').onclick=teacherLogin;document.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>enter(b.dataset.profile));}
function enter(name){name=String(name||'').trim()||'Ученик 1';studentName=name;if(!DB.students[name])DB.students[name]=freshState(name);S=DB.students[name];S.name=name;S.section=S.section||'words';S.current=S.current||firstMain(S.section)||1;S.sectionIntroSeen||={};S.testIntroSeen||={};S.testStarted||={};S.support||={};S.supportType||={};S.scratch||={};S.theoryAnswers||={};S.theoryPassed||={};S.theorySkipped||={};S.repairQueue||=[];S.done||={};S.skipped||={};S.attempts||={};S.answers||={};S.visited||={};S.timeByTask||={};S.repairDone||={};DB.last=name;const day=new Date().toISOString().slice(0,10);if(!S.days)S.days=[];if(!S.days.includes(day))S.days.push(day);persist();render();}
function header(){let p=progressCount();return `<div class="top"><div class="ttl">💻 <span>ОГЭ · Информатика · Задание 1</span></div><div class="who">👤 ${esc(studentName)}</div><div class="pbar"><i style="width:${p.total?p.done/p.total*100:0}%"></i></div><div class="ptxt">${p.done}/${p.total}</div><div class="tbtns"><button class="btn sm" id="memoBtn">📌 Памятка</button><button class="btn sm" id="saveBtn">💾 Сохранить</button><button class="btn sm pri" id="reportBtn">📄 Отчёт</button><button class="btn sm ghost" id="themeBtn">${DB.theme==='dark'?'☀️':'🌙'}</button><button class="btn sm ghost" id="outBtn">🚪</button></div></div>`;}
function sidebar(){let body=SECTIONS.map((sec,i)=>{let ids=mains(sec.id),d=ids.filter(solved).length,done=sectionComplete(sec.id),analogCount=ids.reduce((n,id)=>n+analogs(id).length,0);return `<div class="tp ${S.section===sec.id?'cur':''} ${done?'fin':''}"><div class="tph" data-section="${sec.id}"><span class="ic">${['✍','▦','✉'][i]}</span>${esc(sec.title)}<span class="done">${d}/${ids.length}</span></div><div class="mini"><i style="width:${ids.length?d/ids.length*100:0}%"></i></div><div class="chips">${ids.map(id=>chip(id)+(S.done[id]&&S.support[id]?analogs(id).map(a=>chip(a)).join(''):'')).join('')}${S.theoryPassed[sec.id]?'<span class="badge" title="Тест пройден">ТЕСТ ✓</span>':S.theorySkipped[sec.id]?'<span class="badge nf">ТЕСТ пропущен</span>':`<span class="badge tpc">${sectionStage(sec.id)==='lecture'?'МИНИ-ЛЕКЦИЯ':sectionStage(sec.id)==='pretest'?'ПЕРЕД ТЕСТОМ':'ТЕСТ'}</span>`}</div></div>`}).join('');return `<aside class="side"><h2>Разделы и задания</h2>${body}<div class="legend"><span><b style="background:var(--ok)"></b>самостоятельно</span><span><b style="background:#7bd3a7"></b>после ошибок</span><span><b style="background:#ffd666"></b>с помощью</span><span><b style="background:#ffb27a"></b>после решения</span><span>↳ аналог</span></div></aside>`;}
function chip(id){let st=S.done[id]?(S.supportType[id]==='sol'?'sol':S.support[id]?'hint':(S.attempts[id]?'err':'ok')):S.skipped[id]?'skip':S.attempts[id]?'err':'';return `<button class="chip ${st} ${S.current===id?'cur':''} ${isAnalog(id)?'an':''}" data-task-chip="${id}" title="${esc(TASK[id].title)}">${id}</button>`;}
function shell(content){$('app').innerHTML=header()+`<div class="wrap">${sidebar()}<main class="main"><div class="card pop">${content}</div></main></div>`;bindHeader();document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>switchSection(b.dataset.section));document.querySelectorAll('[data-task-chip]').forEach(b=>b.onclick=()=>{let id=+b.dataset.taskChip;if(canOpenTask(id))openTask(id);});}
function bindHeader(){$('memoBtn').onclick=()=>{if(sectionStage()==='practice'&&S.current&&TASK[S.current]&&!isAnalog(S.current))getSupport(S.current,'memo');showMemo();};$('saveBtn').onclick=saveEmbeddedHTML;$('reportBtn').onclick=openReport;$('themeBtn').onclick=()=>{DB.theme=DB.theme==='dark'?'light':'dark';applyTheme();render();};$('outBtn').onclick=()=>{taskTime();persist();login();};}
function switchSection(id){taskTime();if(S.repairOrigin!==null){toast('Сначала заверши или пропусти аналоги текущего задания.');return;}S.section=id;S.current=firstMain(id)||1;taskStarted=0;persist();render();window.scrollTo(0,0);}
function canOpenTask(id){if(!active(id))return false;if(isAnalog(id)){let org=ANALOG_ORIGIN[id];return !!S.done[org]&&!!S.support[org]&&(S.repairOrigin===null||S.repairOrigin===org||S.done[id]||S.skipped[id]);}if(S.repairOrigin!==null)return id===S.current;let sec=SECTIONS.find(s=>(MAIN_IDS[s.id]||[]).includes(id));if(!sec)return false;return id===S.current||solved(id)||mains(sec.id).filter(x=>x!==id).every(x=>solved(x))&&mains(sec.id).indexOf(id)<=mains(sec.id).indexOf(S.current);}
function printWorksheet(ids){

function showRedoReport(name){

 showModal(`<div class="report"><h2>🔁 Работа над ошибками · ${esc(name)}</h2><p>В подборку включены задания с неверными попытками, пропусками или использованием подсказок. Если таких заданий нет, показаны незавершённые карточки.</p>${html||'<p>Нет заданий для повторения.</p>'}<div class="row report-actions"><button class="btn pri" id="redoPrint">🖨 Печать</button><button class="btn" id="redoDownload">⬇ HTML</button><button class="btn ghost" id="redoClose">Закрыть</button></div></div>`);
 $('redoPrint').onclick=()=>{let content=$('modalContent').querySelector('.report').outerHTML;$('printArea').innerHTML=content;document.body.classList.add('printing');window.print();setTimeout(()=>document.body.classList.remove('printing'),1000);};
 $('redoDownload').onclick=()=>downloadText('Работа_над_ошибками_'+name+'.html','<!doctype html><html lang="ru"><meta charset="utf-8"><title>Работа над ошибками</title><style>body{font:14px Arial;padding:22px}.report-task{border:1px solid #ccc;padding:12px;margin:10px 0}.report-condition{white-space:pre-line;background:#f3f5f8;padding:9px}</style>'+$('modalContent').querySelector('.report').outerHTML);
 $('redoClose').onclick=closeModal;

function render(){if(!S){login();return;}applyTheme();let stage=sectionStage();if(stage==='lecture'){renderSectionLecture();return;}if(stage==='pretest'){renderTestPrep();return;}if(stage==='test'){renderTheoryTest();return;}if(S.repairOrigin!==null){renderTask();return;}if(sectionComplete(S.section)){renderSectionEnd();return;}if(!S.current||!TASK[S.current]||!active(S.current))S.current=firstMain(S.section);renderTask();}
function renderSectionLecture(){let sec=SECTIONS.find(x=>x.id===S.section),l=sec.lesson;let pts=l.points.map((p,i)=>`<article class="point"><div class="pnum">ИДЕЯ ${String(i+1).padStart(2,'0')}</div><h3>${esc(p[0])}</h3><p>${esc(p[1])}</p></article>`).join('');shell(`<div class="chead"><span class="badge">${l.emoji} РАЗДЕЛ ${SECTIONS.indexOf(sec)+1} ИЗ ${SECTIONS.length}</span><span class="badge tpc">МИНИ-ЛЕКЦИЯ 1 · ПЕРЕД РАЗДЕЛОМ</span></div><div class="lecture-hero"><div class="emoji">${l.emoji}</div><div class="kicker">${esc(l.kicker)}</div><h1>${esc(sec.title)}</h1><p>${esc(l.hook)}</p></div><div class="point-grid">${pts}</div><div class="formula-band"><b>Главная формула / правило</b><div class="f">${esc(l.formula)}</div></div><div class="example-band"><b>На маленьком примере 👇</b><br>${esc(l.example)}</div><details class="source-theory"><summary>📖 Развернуть полный текст теории из исходного материала</summary><div>${sec.theory}</div></details><div class="lesson-foot"><span class="answer-note">Сначала разберём идею, а прямо перед тестом будет ещё одна короткая мини-лекция с алгоритмом и примером. Не нужно заучивать всё дословно — пойми ход рассуждения.</span><div class="row"><button class="btn ghost" id="skipTheory">Пропустить теорию</button><button class="btn pri" id="toTestPrep">Дальше: подготовка к тесту →</button></div></div>`);$('toTestPrep').onclick=()=>{S.sectionIntroSeen[S.section]=true;persist();renderTestPrep();};$('skipTheory').onclick=()=>skipSectionTheory();}
function renderTestPrep(){
 let sec=SECTIONS.find(x=>x.id===S.section),l=sec.lesson,r=l.review||{};
 let points=(r.points||[]).map((p,i)=>`<article class="point review-point"><div class="pnum">ШАГ ${String(i+1).padStart(2,'0')}</div><h3>${esc(p[0])}</h3><p>${esc(p[1])}</p></article>`).join('');
 let checklist=(r.check||l.pre||[]).map((x,i)=>`<div class="review-check"><span>${i+1}</span><p>${esc(x)}</p></div>`).join('');
 shell(`<div class="chead"><span class="badge">${esc(sec.title)}</span><span class="badge nf">МИНИ-ЛЕКЦИЯ 2 · ПЕРЕД ТЕСТОМ</span></div>
  <div class="lecture-hero review-hero"><div class="emoji">${r.emoji||'🧠'}</div><div class="kicker">${esc(r.kicker||'Перед тестом · соберём главное')}</div><h1>${esc(r.hook||'Соберём алгоритм перед проверкой')}</h1><p>Это не новый большой раздел — просто ещё один понятный проход по шагам, чтобы тест не застал врасплох.</p></div>
  <div class="review-section-title"><span>🧭</span><div><b>Как решать такие задания</b><small>Двигайся по шагам — не пытайся угадать ответ сразу.</small></div></div>
  <div class="point-grid review-grid">${points}</div>
  <div class="formula-band review-formula"><b>Формула / короткое правило</b><div class="f">${esc(r.formula||l.formula)}</div></div>
  <div class="example-band review-example"><b>✨ ${esc(r.exampleTitle||'Мини-пример')}</b><br>${esc(r.example||l.example)}</div>
  <div class="review-check-card"><div class="review-section-title"><span>✅</span><div><b>${esc(r.checkTitle||'Проверь перед ответом')}</b><small>Быстрый чек-лист — мысленно отметь каждый пункт.</small></div></div>${checklist}</div>
  <div class="trap"><b>⚠️ Типичная ловушка</b><br>${esc(r.trap||l.trap)}</div>
  <div class="theorybox"><b>Дальше — короткий тест из 5 вопросов.</b><p>Выбирай вариант, и сразу увидишь обратную связь: верный ответ подсветится зелёным, ошибка — красным. Чтобы перейти к практике, ответь правильно на все вопросы или пропусти теорию.</p></div>
  <div class="lesson-foot"><button class="btn ghost" id="backLecture">← К первой мини-лекции</button><div class="row"><button class="btn ghost" id="skipTheory">Пропустить теорию</button><button class="btn pri" id="startTest">Начать тест →</button></div></div>`);
 $('backLecture').onclick=()=>renderSectionLecture();$('skipTheory').onclick=()=>skipSectionTheory();$('startTest').onclick=()=>{S.testIntroSeen[S.section]=true;S.testStarted[S.section]=true;persist();renderTheoryTest();};

function skipSectionTheory(){S.theorySkipped[S.section]=true;S.sectionIntroSeen[S.section]=true;S.testIntroSeen[S.section]=true;S.current=firstMain(S.section)||1;persist();render();}
function renderTheoryTest(){let sec=SECTIONS.find(x=>x.id===S.section),qs=THEORY_Q[S.section],ans=S.theoryAnswers[S.section]||{};let html=qs.map((q,i)=>{let chosen=ans[i],items=q.o.map((o,j)=>`<label class="test-opt ${chosen!==undefined&&j===q.a?'correct':''} ${chosen===j&&chosen!==q.a?'incorrect':''} ${chosen!==undefined&&j===q.a&&chosen!==q.a?'right':''}"><input type="radio" name="tq${i}" value="${j}" ${chosen===j?'checked':''} ${chosen===q.a?'disabled':''}><span>${String.fromCharCode(65+j)}. ${esc(o)}</span></label>`).join('');let fb=chosen===undefined?'':chosen===q.a?'<b style="color:var(--ok)">✓ Верно!</b>':`<b style="color:var(--bad)">✕ Не совсем.</b> Верный вариант выделен зелёным.`;return `<article class="test-question"><h3>${i+1}. ${esc(q.q)}</h3>${items}<div class="test-fb">${fb}</div></article>`}).join('');let all=qs.every((q,i)=>ans[i]===q.a);let count=qs.filter((q,i)=>ans[i]===q.a).length;shell(`<div class="chead"><span class="badge">${esc(sec.title)}</span><span class="badge nf">ТЕСТ ПО ТЕОРИИ</span><span class="badge tpc">${count}/${qs.length} верно</span></div><h1 class="task-title">Проверь, что главное уложилось в голове</h1><p style="color:var(--mut)">Выбери ответ. Подсветка появится сразу. Ошибочный выбор можно исправить.</p>${html}<div class="actions"><div class="left"><button class="btn ghost" id="backPrep">← К памятке перед тестом</button><button class="btn ghost" id="skipTheory">Пропустить тест</button></div><button class="btn pri" id="enterPractice" ${all?'':'disabled'}>Перейти к заданиям →</button></div>`);qs.forEach((q,i)=>document.querySelectorAll(`input[name="tq${i}"]`).forEach(inp=>inp.onchange=()=>{S.theoryAnswers[S.section]||={};S.theoryAnswers[S.section][i]=+inp.value;persist();renderTheoryTest();}));$('backPrep').onclick=()=>renderTestPrep();$('skipTheory').onclick=()=>skipSectionTheory();$('enterPractice').onclick=()=>{if(!all)return;S.theoryPassed[S.section]=true;S.current=firstMain(S.section)||1;persist();render();};}
function formatCondition(raw){let safe=esc(raw);safe=safe.replace(/\b(\d[\d\s]*(?:[.,]\d+)?)\b/g,'<strong class="num">$1</strong>').replace(/(больше|меньше|не менее|не более|увеличилось|уменьшилось|на сколько|во сколько)/gi,'<strong class="compare">$1</strong>').replace(/\b(запятая|запятые|запятую|пробел|пробела|пробелы|пробелом|символ|символов|байт|байта|бит)\b/gi,'<strong class="wordmark">$1</strong>');safe=safe.replace(/(Напишите в ответе[^.]*\.|Определите[^.]*\.|Напишите название[^?.]*[?.]|Какое [^?.]*[?.])/gi,'<span class="question">$1</span>');return safe;}
function getSupport(id,type){S.support[id]=true;S.supportType[id]=type||'hint';persist();}
function hintHTML(t){let lines=(t.hint||'Подумай, какие символы добавились или исчезли.').split(/\n/);return `<div class="hintzone"><div class="hz-t">💡 Наводящие шаги</div><div class="steps">${lines.map((x,i)=>`<div class="step"><b class="k">Шаг ${i+1}.</b>${esc(x.replace(/^\d+[.)]\s*/,''))}</div>`).join('')}</div><div class="tnote">Подсказка открыта: после решения основного задания появятся связанные аналоги для закрепления.</div></div>`;}
function solutionHTML(t){let lines=(t.hint||'').split(/\n/);return `<div class="hintzone"><div class="hz-t">✍️ Разбор решения</div><div class="steps">${lines.map((x,i)=>`<div class="step"><b class="k">${i+1}.</b>${esc(x.replace(/^\d+[.)]\s*/,''))}</div>`).join('')}<div class="step"><b class="k">Итог.</b>Ответ: <b>${esc(t.answer)}</b>.</div></div></div>`;}
function showTaskHint(){let t=TASK[S.current];if(isAnalog(t.id))return;getSupport(t.id,'hint');showModal(`<h2>💡 Подсказка к заданию №${t.id}</h2><p>Идём по маленьким шагам. Не торопись: сначала единицы, потом количество символов, затем само слово или объём.</p>${hintHTML(t)}<button class="btn pri" id="closeHelp">Вернуться к заданию</button>`);$('closeHelp').onclick=()=>{closeModal();renderTask();};}

// Safe recursive-descent arithmetic parser: no eval/Function.
function tokenizeExpr(src){let s=String(src).replace(/(\d),(\d)/g,'$1.$2').replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-'),out=[],i=0;while(i<s.length){if(/\s/.test(s[i])){i++;continue;}let m=s.slice(i).match(/^(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?/i);if(m){out.push({t:'n',v:+m[0]});i+=m[0].length;continue;}m=s.slice(i).match(/^[A-Za-zА-Яа-я_][\wА-Яа-я]*/);if(m){out.push({t:'id',v:m[0]});i+=m[0].length;continue;}if('+-*/%^(),'.includes(s[i])){out.push({t:s[i],v:s[i]});i++;continue;}throw Error('Недопустимый символ: '+s[i]);}out.push({t:'eof'});return out;}
function evalExpr(src,vars){let tok=tokenizeExpr(src),i=0,peek=()=>tok[i],take=t=>{if(peek().t!==t)throw Error('Ожидалось '+t);return tok[i++];};
 function primary(){let t=peek();if(t.t==='n'){i++;return t.v;}if(t.t==='+'){i++;return +primary();}if(t.t==='-'){i++;return -primary();}if(t.t==='('){i++;let v=expr(0);take(')');return v;}if(t.t==='id'){i++;let name=t.v;if(peek().t==='('){i++;let args=[];if(peek().t!==')'){args.push(expr(0));while(peek().t===','){i++;args.push(expr(0));}}take(')');let f={ceil:Math.ceil,floor:Math.floor,round:Math.round,abs:Math.abs,sqrt:Math.sqrt,log2:x=>Math.log2(x),min:Math.min,max:Math.max,pow:Math.pow}[name.toLowerCase()];if(!f)throw Error('Неизвестная функция '+name);return f(...args);}if(Object.prototype.hasOwnProperty.call(vars,name))return vars[name];throw Error('Переменная '+name+' ещё не задана');}throw Error('Проверь выражение');}
 function expr(min){let left=primary();while(true){let t=peek().t,prec=t==='+'||t==='-'?1:t==='*'||t==='/'||t==='%'?2:t==='^'?3:-1;if(prec<min)break;i++;let right=expr(prec+(t==='^'?0:1));if(t==='+')left+=right;else if(t==='-')left-=right;else if(t==='*')left*=right;else if(t==='/'){if(right===0)throw Error('Делить на ноль нельзя');left/=right;}else if(t==='%')left%=right;else left=Math.pow(left,right);}return left;}
 let val=expr(0);if(peek().t!=='eof')throw Error('Лишняя часть выражения');if(!Number.isFinite(val))throw Error('Результат не является конечным числом');return val;}
function parseScratchLine(line,vars){let s=line.trim();if(!s)return null;let m=s.match(/^([A-Za-zА-Яа-я_][\wА-Яа-я]*)\s*=\s*(.+)$/);if(m){let val=evalExpr(m[2],vars);vars[m[1]]=val;return {name:m[1],value:val};}return {name:'',value:evalExpr(s,vars)};}
function scratchDefaults(id){
 let t=TASK[id];
 const wordIds=[1,2,3,4,5,9,10,11,12,13,17,18,19,20,21];
 const pageIds=[6,7,14,15,22,23];
 const messageIds=[8,16,24];
 if(wordIds.includes(id)){
  let bits=t.text.match(/(8|16|32)\s*бит/)?.[1]||'8';
  let change=t.text.match(/на\s+(\d+)\s+байт(?:ов|а)?/i)?.[1]||'';
  let deleted=/вычеркнул|вычеркнула/i.test(t.text);
  let hasPunctuation=/запят/i.test(t.text);
  let extra=deleted||hasPunctuation?2:1;
  return [`bits_per_symbol = ${bits}`,`bytes_per_symbol = bits_per_symbol / 8`,`change_bytes = ${change||'...'}`,`change_symbols = change_bytes / bytes_per_symbol`,`word_length = change_symbols - ${extra}`];
 }
 if(pageIds.includes(id)){
  let pages=t.text.match(/(\d+)\s+страниц(?:ы|а)?/i)?.[1]||'...';
  let lines=t.text.match(/(\d+)\s+строк(?:и|а)?/i)?.[1]||'...';
  let chars=t.text.match(/(\d+)\s+символ(?:ов|а)?/i)?.[1]||'...';
  let weight=/16\s*бит|двумя\s+байтами|2\s+байта/i.test(t.text)?2:/8\s*бит|одним\s+байтом|1\s+байт/i.test(t.text)?1:'...';
  return [`pages = ${pages}`,`lines = ${lines}`,`symbols_per_line = ${chars}`,`characters = pages * lines * symbols_per_line`,`bytes_per_symbol = ${weight}`,`volume_bytes = characters * bytes_per_symbol`,`volume_kbytes = volume_bytes / 1024`];
 }
 if(messageIds.includes(id)){
  let last=t.text.split(/\n/).pop().trim(),quoted=last.match(/[«“](.*?)[»”]/),message=quoted?quoted[1]:last;
  let count=Array.from(message).length+(quoted?2:0);
  let weight=/16\s*бит/.test(t.text)?2:/8\s*бит/.test(t.text)?1:2;
  return [`characters = ${count}`,`bytes_per_symbol = ${weight}`,`volume_bytes = characters * bytes_per_symbol`];
 }
 return ['value = ...'];
}

function openReport(){let completed=TASKS.filter(t=>S.done[t.id]).length,skipped=TASKS.filter(t=>S.skipped[t.id]).length,wrong=Object.values(S.attempts).reduce((a,b)=>a+b,0);let rows=TASKS.filter(t=>active(t.id)).map(t=>{let st=S.done[t.id]?'Решено':S.skipped[t.id]?'Пропущено':S.attempts[t.id]?'Есть ошибки':'Не начато';let sc=S.scratch[t.id]?.rows||[];let computed=sc.map(r=>`${esc(r.expr)} → ${esc((S.scratch[t.id].values||[])[sc.indexOf(r)]?.text||'—')}`).join('<br>');return `<article class="report-task ${S.done[t.id]?'done':S.skipped[t.id]?'skip':S.attempts[t.id]?'error':''}"><b>№${t.id} · ${esc(t.title)}</b> — ${st}<div class="report-condition">${esc(t.text)}</div><div class="report-grid"><div><b>Ответ ученика</b><br>${esc(S.answers[t.id]||'—')}</div><div><b>Верный ответ</b><br>${esc(t.answer)}</div><div><b>Ошибок</b><br>${S.attempts[t.id]||0}</div><div><b>Помощь</b><br>${S.supportType[t.id]||'не использовалась'}</div></div>${computed?`<p><b>Черновик:</b><br>${computed}</p>`:''}</article>`}).join('');let th=SECTIONS.map(sec=>{let qs=THEORY_Q[sec.id],a=S.theoryAnswers[sec.id]||{};let rows=qs.map((q,i)=>`<div style="padding:6px 0;border-top:1px solid var(--line);font-size:12px"><b>${i+1}. ${esc(q.q)}</b><br>Ответ ученика: ${a[i]===undefined?'не отвечал':esc(q.o[a[i]])}<br>Верный ответ: ${esc(q.o[q.a])} · ${a[i]===q.a?'верно':a[i]===undefined?'нет ответа':'ошибка'}</div>`).join('');return `<details style="margin:9px 0;padding:9px;border:1px solid var(--line);border-radius:9px"><summary><b>${esc(sec.title)}</b>: тест ${S.theoryPassed[sec.id]?'пройден':S.theorySkipped[sec.id]?'пропущен':'не пройден'}; верно ${qs.filter((q,i)=>a[i]===q.a).length}/${qs.length}</summary>${rows}</details>`}).join('');showModal(`<div class="report"><h2>Отчёт для учителя</h2><p><b>Ученик:</b> ${esc(studentName)} · ${new Date().toLocaleDateString('ru-RU')}</p><div class="theorybox">Всего карточек: ${TASKS.length}; решено: ${completed}; пропущено: ${skipped}; неверных попыток: ${wrong}; помощь открывалась: ${Object.values(S.support).filter(Boolean).length} раз.</div><h3>Мини-лекции и тесты по разделам</h3>${th}<h3>Все задания и ответы</h3>${rows}<div class="report-actions row" style="margin-top:17px"><button class="btn pri" id="printReport">🖨 Печать / PDF</button><button class="btn" id="downloadReport">⬇ HTML-отчёт</button><button class="btn ghost" id="closeReport">Закрыть</button></div></div>`);$('printReport').onclick=()=>{let html=$('modalContent').querySelector('.report').outerHTML;$('printArea').innerHTML=html;document.body.classList.add('printing');window.print();setTimeout(()=>document.body.classList.remove('printing'),1000);};$('downloadReport').onclick=()=>downloadText('Отчёт_'+studentName+'.html','<!doctype html><html lang="ru"><meta charset="utf-8"><title>Отчёт</title><style>body{font:14px Arial;padding:24px}.report-task{border:1px solid #ccc;padding:12px;margin:10px 0}.report-condition{white-space:pre-line;background:#eee;padding:8px}.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}</style>'+ $('modalContent').querySelector('.report').outerHTML);$('closeReport').onclick=closeModal;}
function downloadText(name,txt){let u=URL.createObjectURL(new Blob([txt],{type:'text/html;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);}
function teacherLogin(){showModal(`<h2>🎓 Вход учителя</h2><p>Введите PIN учителя.</p><input id="teacherPin" type="password" style="padding:11px;border:1px solid var(--line);border-radius:9px;width:100%" placeholder="PIN"><div class="row" style="margin-top:12px"><button class="btn pri" id="teacherEnter">Войти</button><button class="btn ghost" id="teacherCancel">Отмена</button></div>`);$('teacherCancel').onclick=closeModal;$('teacherEnter').onclick=()=>{if($('teacherPin').value!==DB.teacher.pin){toast('Неверный PIN');return;}teacherPanel();};}
function teacherPanel(){let options=TASKS.map(t=>`<label style="display:inline-flex;gap:5px;margin:4px 9px 4px 0;background:var(--bg);padding:5px 7px;border-radius:7px"><input type="checkbox" data-active-task="${t.id}" ${(DB.teacher.active===null||DB.teacher.active.includes(t.id))?'checked':''}>${t.id} ${esc(t.title.replace(/^\d+\s*/,''))}</label>`).join('');let students=Object.values(DB.students).sort((a,b)=>(b.updated||0)-(a.updated||0)).map(s=>`<tr><td>${esc(s.name)}</td><td>${TASKS.filter(t=>s.done[t.id]).length}/${TASKS.length}</td><td>${new Date(s.updated||Date.now()).toLocaleString('ru-RU')}</td><td><button class="btn sm" data-student-report="${esc(s.name)}">Отчёт</button> <button class="btn sm" data-student-redo="${esc(s.name)}">Работа над ошибками</button></td></tr>`).join('');showModal(`<div class="row" style="justify-content:space-between"><h2>🎓 Кабинет учителя</h2><button class="btn ghost" id="teacherClose">✕</button></div><h3>Назначение заданий</h3><p class="answer-note">Снимите флаги с заданий, которые пока не нужно показывать ученикам. Аналоги откроются только после основного задания и использования помощи.</p><div style="max-height:35vh;overflow:auto;border:1px solid var(--line);padding:8px;border-radius:10px">${options}</div><div class="row" style="margin:10px 0"><button class="btn" id="allTasks">Выбрать все</button><button class="btn pri" id="saveAssignment">Сохранить назначение</button><button class="btn" id="resetAssignment">Сбросить назначение</button><button class="btn ghost" id="printSelected">🖨 Печать выбранных заданий</button></div><h3>Ученики</h3><table style="width:100%;border-collapse:collapse"><thead><tr><th>Имя</th><th>Прогресс</th><th>Обновлён</th><th></th></tr></thead><tbody>${students||'<tr><td colspan="4">Пока нет учеников</td></tr>'}</tbody></table><h3>Сменить PIN</h3><div class="row"><input id="newPin" maxlength="12" placeholder="Новый PIN" style="padding:9px;border:1px solid var(--line);border-radius:8px"><button class="btn" id="changePin">Сохранить PIN</button></div>`);$('teacherClose').onclick=closeModal;$('allTasks').onclick=()=>document.querySelectorAll('[data-active-task]').forEach(x=>x.checked=true);$('saveAssignment').onclick=()=>{DB.teacher.active=[...document.querySelectorAll('[data-active-task]:checked')].map(x=>+x.dataset.activeTask);persistDB();closeModal();if(S)render();else login();toast('Назначение обновлено');};$('resetAssignment').onclick=()=>{DB.teacher.active=null;persistDB();closeModal();if(S)render();else login();};$('changePin').onclick=()=>{let v=$('newPin').value.trim();if(v.length<4){toast('PIN должен быть не короче 4 символов');return;}DB.teacher.pin=v;persistDB();toast('PIN изменён');};document.querySelectorAll('[data-student-report]').forEach(b=>b.onclick=()=>{let prev=S,prevName=studentName;studentName=b.dataset.studentReport;S=DB.students[studentName];openReport();studentName=prevName;S=prev;});document.querySelectorAll('[data-student-redo]').forEach(b=>b.onclick=()=>showRedoReport(b.dataset.studentRedo));$('printSelected').onclick=()=>{let ids=[...document.querySelectorAll('[data-active-task]:checked')].map(x=>+x.dataset.activeTask);printWorksheet(ids);};}
function printWorksheet(ids){
 const chosen=TASKS.filter(t=>ids.includes(t.id));
 if(!chosen.length){toast('Не выбраны задания для печати.');return;}
 const html=`<div style="font-family:Arial,sans-serif;color:#111"><h1>ОГЭ · Информатика · Задание 1</h1><p>Кодирование текста · Имя ученика: __________________ · Дата: __________</p>${chosen.map(t=>`<article style="padding:10px 0 15px;border-bottom:1px dashed #aaa;break-inside:avoid"><b>№${t.id}. ${esc(t.title)}</b><p style="white-space:pre-line;line-height:1.5">${esc(t.text)}</p><p>Ответ: __________________________________________________</p></article>`).join('')}</div>`;
 $('printArea').innerHTML=html;document.body.classList.add('printing');window.print();setTimeout(()=>document.body.classList.remove('printing'),1000);
}
function showRedoReport(name){
 const p=DB.students[name];if(!p)return;
 const candidates=TASKS.filter(t=>active(t.id)&&((p.attempts&&p.attempts[t.id]>0)||(p.support&&p.support[t.id])||(p.skipped&&p.skipped[t.id])));
 const list=candidates.length?candidates:TASKS.filter(t=>active(t.id)&&!p.done?.[t.id]);
 const html=list.map(t=>{let st=p.done?.[t.id]?'решено':p.skipped?.[t.id]?'пропущено':p.attempts?.[t.id]?'были ошибки':'не начато';return `<article class="report-task"><b>№${t.id} · ${esc(t.title)}</b><span> — ${st}</span><div class="report-condition">${esc(t.text)}</div><div class="report-grid"><div><b>Ответ ученика</b><br>${esc(p.answers?.[t.id]||'—')}</div><div><b>Правильный ответ</b><br>${esc(t.answer)}</div><div><b>Ошибок</b><br>${p.attempts?.[t.id]||0}</div><div><b>Помощь</b><br>${esc(p.supportType?.[t.id]||'нет')}</div></div></article>`}).join('');
 showModal(`<div class="report"><h2>🔁 Работа над ошибками · ${esc(name)}</h2><p>В подборку включены задания с неверными попытками, пропусками или использованием подсказок. Если таких заданий нет, показаны незавершённые карточки.</p>${html||'<p>Нет заданий для повторения.</p>'}<div class="row report-actions"><button class="btn pri" id="redoPrint">🖨 Печать</button><button class="btn" id="redoDownload">⬇ HTML</button><button class="btn ghost" id="redoClose">Закрыть</button></div></div>`);
 $('redoPrint').onclick=()=>{let content=$('modalContent').querySelector('.report').outerHTML;$('printArea').innerHTML=content;document.body.classList.add('printing');window.print();setTimeout(()=>document.body.classList.remove('printing'),1000);};
 $('redoDownload').onclick=()=>downloadText('Работа_над_ошибками_'+name+'.html','<!doctype html><html lang="ru"><meta charset="utf-8"><title>Работа над ошибками</title><style>body{font:14px Arial;padding:22px}.report-task{border:1px solid #ccc;padding:12px;margin:10px 0}.report-condition{white-space:pre-line;background:#f3f5f8;padding:9px}</style>'+$('modalContent').querySelector('.report').outerHTML);
 $('redoClose').onclick=closeModal;
}
function render(){if(!S){login();return;}applyTheme();if(sectionStage()==='lecture'){renderSectionLecture();return;}if(sectionStage()==='pretest'){renderTestPrep();return;}if(sectionStage()==='test'){renderTheoryTest();return;}if(S.repairOrigin!==null){renderTask();return;}if(sectionComplete(S.section)){renderSectionEnd();return;}if(!S.current||!TASK[S.current]||!active(S.current))S.current=firstMain(S.section);renderTask();}
function openTask(id){taskTime();if(!canOpenTask(id)){toast('Сначала выполни основное задание или заверши текущее закрепление.');return;}if(isAnalog(id)){let org=ANALOG_ORIGIN[id];S.repairOrigin=org;S.repairQueue=analogs(org).filter(a=>a!==id&&!solved(a));S.current=id;S.section=SECTIONS.find(sec=>sec.ids.includes(id)).id;}else{S.section=SECTIONS.find(sec=>(MAIN_IDS[sec.id]||[]).includes(id))?.id||S.section;S.current=id;}persist();render();}
function loginButtonsFix(){ }
function init(){render();}
$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeModal()});
login();
</script></body></html>
