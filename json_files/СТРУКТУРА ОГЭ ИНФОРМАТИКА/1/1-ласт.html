const SECTIONS=[{id:'words',title:'Добавление и удаление слов',ids:[1,2,3,4,5,9,10,11,12,13],theory:`<h3>Добавление и удаление слов</h3><p>Размер текста зависит от числа символов и веса одного символа: <b>I = k × i</b>, где I — объём в байтах, k — число символов, i — байт на символ.</p><p><b>Удаление из списка:</b> обычно исчезает слово, одна запятая и один пробел. Поэтому число удалённых символов = длина слова + 2.</p><p><b>Повтор слова:</b> при повторе через пробел добавляется слово и пробел: длина слова + 1. Если повтор добавляется как элемент списка, могут добавиться запятая и пробел: длина слова + 2.</p><p><b>Перевод единиц:</b> 8 бит = 1 байт; 16 бит = 2 байта; 32 бита = 4 байта.</p>`},{id:'pages',title:'Объём страниц, строк и символов',ids:[6,7,14,15],theory:`<h3>Объём страниц, строк и символов</h3><p>Сначала найдите общее число символов: <b>страницы × строки на странице × символы в строке</b>.</p><p>Затем умножьте число символов на вес символа в байтах.</p><p>Чтобы перевести байты в Кбайты, разделите на 1024. Если задача требует округления, округлите результат так, как указано в условии.</p><p><b>Пример:</b> 8 × 40 × 48 = 15 360 символов. При 8 битах на символ это 15 360 байт, то есть 15 Кбайт.</p>`},{id:'message',title:'Объём сообщения',ids:[8,16],theory:`<h3>Объём сообщения</h3><p>Посчитайте все символы сообщения: буквы, пробелы, знаки препинания и тире.</p><p>Затем умножьте число символов на вес одного символа: <b>I = k × i</b>.</p><p>Например, 42 символа × 2 байта = 84 байта.</p>`}];

const THEORY_Q={
words:[{q:'16 бит — это сколько байт?',o:['1','2','4'],a:1},{q:'При удалении элемента списка обычно удаляются:',o:['слово и 2 символа: запятая и пробел','только слово','слово и 1 символ'],a:0},{q:'При повторе слова через один пробел добавляется:',o:['слово + пробел','слово + запятая + пробел','только слово'],a:0}],
pages:[{q:'Как найти число символов на страницах?',o:['страницы × строки × символы в строке','страницы + строки + символы','страницы × байты'],a:0},{q:'Если символ занимает 2 байта, объём в байтах равен:',o:['число символов × 2','число символов ÷ 2','число символов + 2'],a:0},{q:'Сколько байтов в 1 Кбайте в этих задачах?',o:['1000','1024','8'],a:1}],
message:[{q:'При подсчёте символов сообщения учитываем:',o:['только буквы','буквы, пробелы и знаки препинания','только буквы и пробелы'],a:1},{q:'Формула объёма текста:',o:['I = k × i','I = k + i','I = k ÷ i'],a:0},{q:'42 символа по 2 байта — это:',o:['21 байт','44 байта','84 байта'],a:2}]};
function renderTheoryStage(){let s=sec(),qs=THEORY_Q[s.id];$('view').innerHTML=`<span class="badge">Теория · ${s.title}</span><h1 class="task-title">Сначала разберём правило</h1><div class="theorybox">${s.theory}</div><h2>Проверь себя</h2><p>Ответь на все вопросы. Практические задания раздела откроются после правильных ответов.</p>${qs.map((q,i)=>`<div class="practice"><h4>${i+1}. ${q.q}</h4>${q.o.map((o,j)=>`<label><input type="radio" name="tq${i}" value="${j}"> ${o}</label>`).join('')}</div>`).join('')}<button class="btn primary" onclick="checkTheory()">Проверить теорию</button><div id="theoryFeedback" class="feedback"></div>`;}
function checkTheory(){let qs=THEORY_Q[state.section],ok=true;for(let i=0;i<qs.length;i++){let x=document.querySelector(`input[name="tq${i}"]:checked`);if(!x||Number(x.value)!==qs[i].a)ok=false;}if(ok){state.theoryPassed[state.section]=true;state.current=sec().ids.find(id=>!state.done[id])||sec().ids[0];save();render();}else{$('theoryFeedback').innerHTML='<span style="color:var(--bad)">Есть ошибки. Вернись к теории и попробуй ещё раз.</span>';}}

let state={name:'Ученик 1',section:'words',current:1,done:{},skipped:{},attempts:{},hintUsed:{},answers:{},scratch:{},repairPassed:{},theoryPassed:{},repairFor:null};
try{let old=JSON.parse(localStorage.getItem('oge_task1_v4')||'null');if(old)state={...state,...old};}catch(e){}
const $=id=>document.getElementById(id);const task=id=>TASKS.find(t=>t.id===id);const sec=()=>SECTIONS.find(s=>s.id===state.section);const isRepair=id=>id>8;const paired=id=>id<=8?id+8:null;
function save(){localStorage.setItem('oge_task1_v4',JSON.stringify(state));}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderSections(){$('sections').innerHTML=SECTIONS.map(s=>`<button class="navbtn ${state.section===s.id?'active':''}" onclick="switchSection('${s.id}')">${s.title} <span style="float:right">${s.ids.filter(i=>state.done[i]).length}/${s.ids.length}</span></button>`).join('');}
function unlockedBefore(ids,i){return ids.slice(0,i).every(x=>state.done[x]||state.skipped[x]);}
function renderNav(){let s=sec();$('tasknav').innerHTML=s.ids.map((id,i)=>{let t=task(id),locked=!state.theoryPassed[state.section]||(i>0&&!unlockedBefore(s.ids,i)),status=state.done[id]?'done':state.skipped[id]?'skipped':state.attempts[id]?'error':'',mark=state.done[id]?'✅':state.skipped[id]?'⏭️':state.attempts[id]?'🟠':'⚪';return `<button class="${state.current===id?'active':''} ${status?'status-'+status:''} ${locked?'locked':''}" ${locked?'disabled':''} onclick="openTask(${id})"><span class="statusmark">${mark}</span><span>${escapeHtml(t.title.replace(/^\d+ /,''))}</span></button>`}).join('');$('progressbar').style.width=(100*s.ids.filter(i=>state.done[i]||state.skipped[i]).length/s.ids.length)+'%';}
function switchSection(id){state.section=id;let s=sec();state.current=s.ids.find(x=>!state.done[x])||s.ids[0];save();render();}
function openTask(id){if(!sec().ids.includes(id))state.section=SECTIONS.find(s=>s.ids.includes(id)).id;let ids=sec().ids,idx=ids.indexOf(id);if(idx>0&&!unlockedBefore(ids,idx))return;state.current=id;state.repairFor=null;save();render();}
function render(){renderSections();renderNav();if(!state.theoryPassed[state.section]){renderTheoryStage();return;}let t=task(state.current);if(!t){$('view').innerHTML='<h2>Выберите раздел</h2>';return;}let repair=state.repairFor===t.id;let related=paired(t.id);let theory=sec().theory;
$('view').innerHTML=`<div class="badge">${sec().title}</div><h1 class="task-title">${escapeHtml(t.title)}</h1><div class="condition"><div class="label">Условие</div><div>${formatCondition(t.text)}</div></div>
<div class="buttons"><button class="btn" onclick="showTheory()">Теория по этому заданию</button><button class="btn" onclick="showHint()">Подсказка к заданию</button><button class="btn" onclick="showScratchHint()">Как вести черновик</button></div>
<div class="scratch"><div class="label">Черновик решения</div><p>Заполни промежуточные данные, если это помогает.</p><div class="scratchgrid">${[['weight','Вес символа (байты)'],['chars','Число символов'],...(sec().id==='words'?[['wordLength','Ищем слово длины']]:[]),...(sec().id==='message'?[['bytes','Объём сообщения (байты)']]:[])].map(([k,l])=>`<div><label>${l}</label><input value="${escapeHtml(state.scratch[t.id]?.[k]||'')}" oninput="saveScratch('${k}',this.value)"></div>`).join('')}</div><div class="scratchcalc"><div><label>Выражение</label><input id="scratchExpr" value="${escapeHtml(state.scratch[t.id]?.expr||'')}" placeholder="Например: 8*40*48/1024" oninput="calcScratch(this.value)"></div><div><label>Результат</label><div class="scratchresult" id="scratchResult">${escapeHtml(state.scratch[t.id]?.result||'—')}</div></div></div></div>
<div class="answerrow"><input id="answer" value="${escapeHtml(state.answers[t.id]||'')}" placeholder="Введите ответ" oninput="state.answers[state.current]=this.value;save()"><button class="btn primary" onclick="check()">Проверить</button></div><div class="feedback" id="feedback"></div>
${state.hintUsed[t.id]?`<div class="hint"><b>Подсказка:</b><p>${escapeHtml(t.hint)}</p></div>`:''}
${state.repairFor===t.id&&related?`<div class="repair"><h3>Нужно закрепить ошибку</h3><p>Перед повторной попыткой решите аналогичную задачу с другими данными.</p><button class="btn primary" onclick="launchRepair(${related},${t.id})">Перейти к аналогичной задаче №${related}</button></div>`:''}
${state.done[t.id]?`<div class="theorybox"><b>Задание выполнено ✓</b>${state.hintUsed[t.id]?' Подсказка использована.':''}</div>`:''}
<div class="actions"><div class="buttons"><button class="btn" onclick="previousTask()">← Предыдущее</button><button class="btn primary" onclick="nextTask()">Следующее →</button><button class="btn" onclick="skipTask()">Пропустить ⏭️</button></div><span>${state.done[t.id]?'✅ Решено':state.skipped[t.id]?'⏭️ Пропущено':state.attempts[t.id]?'🟠 Есть ошибки':'⚪ В работе'}</span></div>`;}
function saveScratch(k,v){state.scratch[state.current]??={};state.scratch[state.current][k]=v;save();}
function formatCondition(raw){let safe=escapeHtml(raw);safe=safe.replace(/\b(\d[\d\s]*(?:[.,]\d+)?)\b/g,'<strong class=\"num\">$1</strong>').replace(/(больше|меньше|не менее|не более|увеличилось|уменьшилось)/gi,'<strong class=\"compare\">$1</strong>').replace(/(,)/g,'<strong class=\"punct\">,</strong>').replace(/(\s)/g,'$1');safe=safe.replace(/(Напишите в ответе[^.]*\.|Определите[^.]*\.|Укажите[^.]*\.)/gi,'<span class=\"question\">$1</span>');return safe;}
function calcScratch(expr){state.scratch[state.current]??={};state.scratch[state.current].expr=expr;let out='—';try{if(expr.trim()&&/^[0-9+*/().\s-]+$/.test(expr)){let v=Function('return ('+expr+')')();if(Number.isFinite(v))out=String(Number(v.toFixed(10)));}}catch(e){}state.scratch[state.current].result=out;let el=$('scratchResult');if(el)el.textContent=out;save();}
function skipTask(){let id=state.current;state.skipped[id]=true;state.done[id]=false;state.repairFor=null;save();renderNav();nextTask(true);}

function showTheory(){openModal(`<h2>Теория к заданию</h2><div class="theorybox">${sec().theory}</div><button class="btn" onclick="closeModal()">Вернуться к заданию</button>`);}
function showHint(){state.hintUsed[state.current]=true;save();openModal(`<h2>Подсказка к заданию №${state.current}</h2><div class="hint"><p>${escapeHtml(task(state.current).hint)}</p></div><button class="btn primary" onclick="closeModal();render()">Понятно</button>`);}
function showScratchHint(){openModal(`<h2>Как считать в черновике</h2><div class="theorybox"><p>1. Переведи биты в байты: раздели на 8.</p><p>2. Найди число изменившихся символов: объём в байтах ÷ байт на символ.</p><p>3. Для страниц перемножь страницы × строки × символы в строке.</p><p>4. Запиши итоговое умножение и, если нужно, раздели байты на 1024 для Кбайтов.</p></div><button class="btn" onclick="closeModal()">Закрыть</button>`);}
function normalize(s){return String(s).trim().toLocaleLowerCase('ru').replace(/ё/g,'е');}
function check(){let t=task(state.current),input=$('answer');if(!input)return;let v=input.value.trim();if(!v)return;state.answers[t.id]=v;let numeric=Number(t.answer),n=Number(v.replace(',','.'));let correct=Number.isFinite(numeric)&&v!==''&&!Number.isNaN(n)&&Math.abs(n-numeric)<.01||normalize(v)===normalize(t.answer);if(correct){state.done[t.id]=true;state.skipped[t.id]=false;save();$('view').classList.add('solved');$('feedback').innerHTML='<span style="color:var(--good);font-size:1.15em">✅ Верно! Задание выполнено.</span>';renderNav();if(state.repairFor){state.repairPassed[state.repairFor]=true;let orig=state.repairFor;state.repairFor=null;save();setTimeout(()=>{state.current=orig;save();render();$('feedback')?.insertAdjacentHTML('beforeend','<span style="color:var(--good)"> Аналог решён. Вернитесь к исходной задаче.</span>');},850);}else if(!isRepair(t.id)&&paired(t.id)&&(state.attempts[t.id]||0)>0){state.repairFor=t.id;save();setTimeout(()=>render(),850);}else{setTimeout(()=>nextTask(),1000);}}else{state.attempts[t.id]=(state.attempts[t.id]||0)+1;$('feedback').innerHTML='<span style="color:var(--bad)">❌ Пока неверно. Разберите ход решения, затем попробуйте ещё раз.</span>';if(!isRepair(t.id)&&paired(t.id))state.repairFor=t.id;save();renderNav();}}
function launchRepair(id,orig){state.current=id;state.section=SECTIONS.find(s=>s.ids.includes(id)).id;state.repairFor=orig;save();render();}
function nextTask(fromSkip=false){let ids=sec().ids,idx=ids.indexOf(state.current);if(idx<ids.length-1&&(state.done[state.current]||state.skipped[state.current]||fromSkip)){state.current=ids[idx+1];save();render();window.scrollTo(0,0);}else if(idx===ids.length-1&&(state.done[state.current]||state.skipped[state.current]||fromSkip)){$('view').innerHTML=`<h2>Раздел завершён!</h2><p>Вы выполнили все задания раздела «${sec().title}».</p><button class="btn primary" onclick="switchSection('${SECTIONS[(SECTIONS.findIndex(s=>s.id===state.section)+1)%SECTIONS.length].id}')">Перейти к следующему разделу</button>`;}}
function previousTask(){let ids=sec().ids,idx=ids.indexOf(state.current);if(idx>0){state.current=ids[idx-1];save();render();}}
function openModal(content){$('modalcontent').innerHTML=content;$('modal').classList.add('show');}function closeModal(){$('modal').classList.remove('show');}
$('guideBtn').onclick=()=>openModal(`<h2>Методичка: кодирование текста</h2><div class="cards">${SECTIONS.map(s=>`<div class="theorycard">${s.theory}</div>`).join('')}<div class="theorycard"><h3>Главные единицы</h3><p>8 бит = 1 байт; 1024 байта = 1 Кбайт.</p><p>Объём текста: количество символов × вес символа.</p></div></div><button class="btn" onclick="closeModal()">Закрыть</button>`);
$('saveBtn').onclick=()=>{let blob=new Blob(['<!doctype html>\n'+document.documentElement.outerHTML],{type:'text/html'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='oge_trainer_updated.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('reportBtn').onclick=()=>{let rows=TASKS.map(t=>{let status=state.done[t.id]?'✅ РЕШЕНО':state.skipped[t.id]?'⏭️ ПРОПУЩЕНО':'❌ НЕ РЕШЕНО',hint=state.hintUsed[t.id]?'🟢 Подсказка использована':'⚪ Без подсказки',repair=state.repairPassed[t.id]?'🟢 Аналог решён':(state.attempts[t.id]?'🟠 Требует закрепления':'—');return `<tr class="${state.done[t.id]?'r-done':state.skipped[t.id]?'r-skip':'r-open'}"><td>${t.id}</td><td>${escapeHtml(t.title)}</td><td><b>${status}</b></td><td>${state.attempts[t.id]||0}</td><td>${hint}</td><td>${repair}</td></tr>`}).join('');openModal(`<div class="report"><h2>Отчёт для учителя</h2><p>Ученик: ${escapeHtml(state.name||'Ученик 1')} · ${new Date().toLocaleDateString('ru-RU')}</p><table><thead><tr><th>№</th><th>Задание</th><th>Статус</th><th>Ошибок</th><th>Подсказка</th><th>Закрепление</th></tr></thead><tbody>${rows}</tbody></table><p class="report-actions"><button class="btn primary" onclick="window.print()">🖨️ Печать / сохранить PDF</button> <button class="btn" onclick="downloadReport()">⬇️ Сохранить HTML</button> <button class="btn" onclick="closeModal()">Закрыть</button></p></div>`);};
function downloadReport(){let report=$('modalcontent').querySelector('.report').cloneNode(true);report.querySelector('.report-actions')?.remove();let html='<!doctype html><html lang="ru"><meta charset="utf-8"><title>Отчёт учителю</title><style>body{font:14px Arial;padding:24px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #bbb;padding:8px;text-align:left}.r-done{background:#e4f6e9}.r-skip{background:#fff3cd}.r-open{background:#fde8e7}</style>'+report.outerHTML+'</html>';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='Отчет_учителю.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('modal').classList.contains('show')){closeModal();return;}if(e.key==='Enter'&&$('modal').classList.contains('show'))return;if(e.key==='Enter'&&document.activeElement?.id==='answer'){e.preventDefault();check();}});
function init(){if(!state.name){openModal(`<h2>Начало работы</h2><p>Введите имя ученика (можно оставить значение по умолчанию).</p><input id="studentName" value="Ученик 1" style="padding:10px;width:100%;margin-bottom:12px"><button class="btn primary" onclick="state.name=document.getElementById('studentName').value.trim()||'Ученик 1';save();closeModal();render()">Начать</button>`);}render();}
init();
</script></body></html>
