 <div class="scratch"><div class="label">Черновик решения</div><p>Заполни промежуточные данные, если это помогает.</p><div class="scratchgrid">${[['weight','Вес символа (байты)'],['chars','Число символов'],...(sec().id==='words'?[['wordLength','Ищем слово длины']]:[]),...(sec().id==='message'?[['bytes','Объём сообщения (байты)']]:[])].map(([k,l])=>`<div><label>${l}</label><input value="${escapeHtml(state.scratch[t.id]?.[k]||'')}" oninput="saveScratch('${k}',this.value)"></div>`).join('')}</div><div class="scratchcalc"><div><label>Выражение</label><input id="scratchExpr" value="${escapeHtml(state.scratch[t.id]?.expr||'')}" placeholder="Например: 8*40*48/1024" oninput="calcScratch(this.value)"></div><div><label>Результат</label><div class="scratchresult" id="scratchResult">${escapeHtml(state.scratch[t.id]?.result||'—')}</div></div></div></div>

 ${state.hintUsed[t.id]&&!repair?`<div class="hint"><b>Подсказка:</b><p>${escapeHtml(t.hint)}</p></div>`:''}
 ${state.done[t.id]?`<div class="theorybox"><b>Задание выполнено ✓</b>${state.hintUsed[t.id]?' Подсказка использована.':''}</div>`:''}
 <div class="actions"><div class="buttons"><button class="btn" onclick="previousTask()" ${repair||mainIds().indexOf(t.id)<=0?'disabled':''}>← Предыдущее</button><button class="btn primary" onclick="nextTask()" ${repair?'':(!state.done[t.id]&&!state.skipped[t.id]?'disabled':'')}>${repair?'Пропустить аналог →':'Следующее →'}</button>${!repair?`<button class="btn" onclick="skipTask()" ${state.done[t.id]||state.skipped[t.id]?'disabled':''}>Пропустить ⏭️</button>`:''}</div><span>${state.done[t.id]?'✅ Решено':state.skipped[t.id]?'⏭️ Пропущено':state.attempts[t.id]?'🟠 Есть ошибки':'⚪ В работе'}</span></div>`;
}
function saveScratch(k,v){state.scratch[state.current]??={};state.scratch[state.current][k]=v;save();}
function formatCondition(raw){let safe=escapeHtml(raw);safe=safe.replace(/\b(\d[\d\s]*(?:[.,]\d+)?)\b/g,'<strong class="num">$1</strong>').replace(/(больше|меньше|не менее|не более|увеличилось|уменьшилось)/gi,'<strong class="compare">$1</strong>').replace(/\b(запятая|запятую|запятые|запятой|пробел|пробела|пробелы|пробелом)\b/gi,'<strong class="wordmark">$1</strong>');safe=safe.replace(/(Напишите в ответе[^.]*\.|Определите[^.]*\.|Укажите[^.]*\.|Какое слово[^?]*\?|Какое имя[^?]*\?|Какое животное[^?]*\?)/gi,'<span class="question">$1</span>');return safe;}
function calcScratch(expr){state.scratch[state.current]??={};state.scratch[state.current].expr=expr;let out='—';try{if(expr.trim()&&/^[0-9+*/().\s-]+$/.test(expr)){let v=Function('return ('+expr+')')();if(Number.isFinite(v))out=String(Number(v.toFixed(10)));}}catch(e){}state.scratch[state.current].result=out;let el=$('scratchResult');if(el)el.textContent=out;save();}
function skipTask(){
 const id=state.current;state.skipped[id]=true;state.done[id]=false;save();
 if(isRepair(id)&&state.repairOrigin!==null){state.repairQueue=(state.repairQueue||[]).filter(x=>x!==id);continueRepairFlow();}
 else{state.forceTaskView=false;advanceMain(id);}
}

function showHint(){let origin=state.current;if(origin>=9)return;state.hintUsed[origin]=true;save();openModal(`<h2>Подсказка к заданию №${origin}</h2><div class="hint"><p>${escapeHtml(task(origin).hint)}</p></div><p>Сначала реши основное задание. После правильного ответа откроются два аналога для закрепления.</p><button class="btn primary" onclick="closeModal()">Вернуться к заданию</button>`);}

function normalize(s){return String(s).trim().toLocaleLowerCase('ru').replace(/ё/g,'е');}
function nextMainInSection(current){const mains=mainIds();const idx=mains.indexOf(current);return idx>=0&&idx<mains.length-1?mains[idx+1]:null;}
function continueRepairFlow(){
 const origin=state.repairOrigin;const queue=(state.repairQueue||[]).filter(id=>!state.done[id]&&!state.skipped[id]);
 if(queue.length){state.repairQueue=queue.slice(1);state.current=queue[0];state.repairFor=origin;state.forceTaskView=false;save();render();window.scrollTo(0,0);return;}
 state.repairOrigin=null;state.repairFor=null;state.repairQueue=[];state.repairPassed[origin]=analogs(origin).every(id=>state.done[id]||state.skipped[id]);state.forceTaskView=false;advanceMain(origin);
}
function check(){
 const t=task(state.current),input=$('answer');if(!input)return;const v=input.value.trim();if(!v)return;state.answers[t.id]=v;
 const numeric=Number(t.answer),n=Number(v.replace(',','.'));
 const correct=(Number.isFinite(numeric)&&v!==''&&!Number.isNaN(n)&&Math.abs(n-numeric)<0.01)||normalize(v)===normalize(t.answer)||(t.acceptedAnswers||[]).some(a=>normalize(v)===normalize(a));
 if(correct){
  state.done[t.id]=true;state.skipped[t.id]=false;state.forceTaskView=false;save();$('view').classList.add('solved');$('feedback').innerHTML='<span style="color:var(--good);font-size:1.15em">✅ Верно! Задание выполнено.</span>';renderNav();
  if(isRepair(t.id)&&state.repairOrigin!==null){state.repairQueue=(state.repairQueue||[]).filter(id=>id!==t.id);setTimeout(continueRepairFlow,750);}
  else if(!isRepair(t.id)&&state.hintUsed[t.id]){setTimeout(()=>beginRepairs(t.id),750);}
  else{setTimeout(()=>advanceMain(t.id),850);}
 }else{state.attempts[t.id]=(state.attempts[t.id]||0)+1;$('feedback').innerHTML='<span style="color:var(--bad)">❌ Пока неверно. Проверь расчёт и попробуй ещё раз.</span>';save();renderNav();}
}
function beginRepairs(origin){
 const list=analogs(origin).filter(id=>!state.done[id]&&!state.skipped[id]);
 if(!list.length){advanceMain(origin);return;}
 state.repairOrigin=origin;state.repairFor=origin;state.repairQueue=list.slice(1);state.current=list[0];state.forceTaskView=false;save();render();window.scrollTo(0,0);
}
function advanceMain(current){
 state.repairOrigin=null;state.repairFor=null;state.repairQueue=[];state.forceTaskView=false;
 const next=nextMainInSection(current);if(next!==null){state.current=next;save();render();window.scrollTo(0,0);}
 else{state.current=current;save();render();window.scrollTo(0,0);}
}
function nextTask(){
 const id=state.current;
 if(isRepair(id)&&state.repairOrigin!==null){state.skipped[id]=true;state.done[id]=false;state.repairQueue=(state.repairQueue||[]).filter(x=>x!==id);save();continueRepairFlow();return;}
 if(state.done[id]||state.skipped[id]){if(state.done[id]&&state.hintUsed[id]&&analogs(id).some(a=>!state.done[a]&&!state.skipped[a]))beginRepairs(id);else advanceMain(id);}
}
function previousTask(){
 if(state.repairOrigin!==null)return;
 const mains=mainIds(),idx=mains.indexOf(state.current);if(idx>0){state.current=mains[idx-1];state.forceTaskView=true;save();render();window.scrollTo(0,0);}
}

}

function openReport(){
 const labelForScratch={weight:'Вес символа (байты)',chars:'Число символов',wordLength:'Искомая длина слова',bytes:'Объём сообщения (байты)',expr:'Выражение',result:'Результат выражения'};
 const sections=SECTIONS.map(secItem=>{
  const main=mainIds(secItem.id),related=main.flatMap(id=>analogs(id));
  const doneMain=main.filter(id=>state.done[id]).length,skipMain=main.filter(id=>state.skipped[id]).length;
  const doneAnalog=related.filter(id=>state.done[id]).length,skipAnalog=related.filter(id=>state.skipped[id]).length;
  const hintCount=main.filter(id=>state.hintUsed[id]).length;
  const theoryState=state.theoryPassed[secItem.id]?'Пройдена':'Не пройдена';
  const tq=THEORY_Q[secItem.id]||[];
  const theoryRows=tq.map((q,i)=>{
   const chosen=state.theoryAnswers?.[secItem.id]?.[i];
   const has=Number.isInteger(chosen)&&q.o[chosen]!==undefined;
   const right=has&&chosen===q.a;
   return `<div class="report-theory-row"><b>${i+1}. ${escapeHtml(q.q)}</b><div>Ответ ученика: ${has?escapeHtml(q.o[chosen]):'Не отвечал'}</div><div>Правильный ответ: ${escapeHtml(q.o[q.a])}</div><div class="${!has?'r-open':right?'r-done':'r-skip'}">${!has?'Не отвечал':right?'Верно':'Неверно'}</div></div>`;
  }).join('');
  return `<section class="report-section"><h3>${escapeHtml(secItem.title)}</h3><p class="report-summary">Теория: <b>${theoryState}</b> · Основные: решено ${doneMain}/${main.length}, пропущено ${skipMain} · Аналоги: решено ${doneAnalog}/${related.length}, пропущено ${skipAnalog} · Подсказок использовано: ${hintCount}</p>${tq.length?`<details class="report-theory" open><summary>Ответы по теории (${theoryState.toLowerCase()})</summary>${theoryRows}</details>`:''}</section>`;
 }).join('');
 const rows=TASKS.map(t=>{
  const analog=!!ANALOG_ORIGIN[t.id];

  const opened=!!state.visited?.[t.id]||!!state.answers[t.id]||!!state.attempts[t.id]||!!state.scratch[t.id];

  const scratchRows=Object.entries(labelForScratch).filter(([k])=>scratch[k]!==undefined&&scratch[k]!=='').map(([k,label])=>`<div><b>${label}:</b> ${escapeHtml(String(scratch[k]))}</div>`).join('');
  const hintText=state.hintUsed[t.id]&&!analog?`<div class="report-hint"><b>Подсказка, которую видел ученик:</b><div>${escapeHtml(t.hint||'')}</div></div>`:'';

 }).join('');
 const completed=TASKS.filter(t=>state.done[t.id]).length,skipped=TASKS.filter(t=>state.skipped[t.id]).length,wrong=Object.values(state.attempts).reduce((a,b)=>a+(Number(b)||0),0),usedHints=Object.values(state.hintUsed).filter(Boolean).length;
 openModal(`<div class="report"><h2>Отчёт для учителя</h2><p class="report-meta"><b>Ученик:</b> ${escapeHtml(state.name||'Ученик 1')} · <b>Дата:</b> ${new Date().toLocaleDateString('ru-RU')}</p><div class="report-overview"><h3>Общие результаты</h3><p>Всего заданий в курсе: ${TASKS.length}. Решено: ${completed}. Пропущено: ${skipped}. Нерешённых неверных попыток: ${wrong}. Подсказок использовано: ${usedHints}.</p><p>В отчёт включены полные условия всех основных заданий и аналогов, ответы ученика, правильные ответы, черновики, количество ошибок, статусы и сведения о подсказках.</p></div><h3>Сводка по разделам и теории</h3>${sections}<h3>Подробный разбор заданий</h3>${rows}<p class="report-actions"><button class="btn primary" onclick="printReport()">🖨️ Печать / сохранить PDF</button> <button class="btn" onclick="downloadReport()">⬇️ Сохранить HTML</button> <button class="btn" onclick="closeModal()">Закрыть</button></p></div>`);
}
