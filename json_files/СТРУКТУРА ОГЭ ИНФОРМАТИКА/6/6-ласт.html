<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ОГЭ Информатика — Задание 6 (Пары чисел)</title>
    <style>
        :root { --bg: #f1f4f9; --panel: #fff; --ink: #1c2c45; --muted: #60738e; --line: #d7e1ec; --blue: #3267e8; --good: #187447; --bad: #b42318; --shadow: 0 8px 26px #18304b0b; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Arial; }
        header { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid var(--line); padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
        .brand strong { display: block; font-size: 19px; }
        .brand small { color: var(--blue); font-weight: 800; letter-spacing: .1em; }
        .buttons { display: flex; gap: 7px; flex-wrap: wrap; }
        .btn { border: 1px solid var(--line); border-radius: 9px; padding: 9px 12px; background: #fff; color: #2c405e; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; transition: .2s; }
        .btn:hover { background: #f8fafc; }
        .btn.primary { background: var(--blue); color: white; border-color: var(--blue); }
        .btn.primary:hover { background: #2554c7; }
        .btn.danger { background: #fff0f0; color: var(--bad); border-color: #fecaca; }
        .btn.danger:hover { background: #fee2e2; }
        .layout { max-width: 1500px; margin: auto; padding: 14px; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 14px; }
        .side, .main { background: #fff; border: 1px solid var(--line); border-radius: 15px; box-shadow: var(--shadow); }
        .side { position: sticky; top: 90px; max-height: calc(100vh - 105px); overflow: auto; padding: 14px; }
        .main { padding: clamp(16px, 2vw, 28px); min-height: 75vh; position: relative; }
        .side h2 { font-size: 15px; margin: 4px 0 10px; display: flex; justify-content: space-between; align-items: center; }
        .tasknav { display: grid; gap: 4px; }
        .tasknav button { display: flex; gap: 8px; text-align: left; width: 100%; border: 1px solid transparent; border-radius: 8px; background: transparent; padding: 8px; font: inherit; font-size: 13px; cursor: pointer; transition: .2s; }
        .tasknav button:hover { background: #f8fafc; }
        .tasknav button.active { background: #eef3ff; border-color: #c3d3fa; font-weight: bold; }
        .tasknav button.status-done { background: #e8f8ee; border-color: #b7e4c7; }
        .tasknav button.status-skipped { background: #fff5db; border-color: #f0d17a; }
        .statusmark { font-size: 16px; min-width: 20px; }
        .progress { height: 8px; background: #e8edf4; border-radius: 99px; overflow: hidden; margin: 8px 0 14px; }
        .progress div { height: 100%; background: var(--blue); width: 0; transition: width .3s; }
        .badge { display: inline-block; background: #eaf0ff; color: #2d55b8; border-radius: 7px; padding: 4px 8px; font-size: 12px; font-weight: 800; }
        .task-title { font-size: clamp(20px, 2.5vw, 28px); line-height: 1.25; margin: 12px 0; }
        
        /* Условие */
        .condition-wrapper { background: #f7f9fc; border: 1px solid var(--line); border-left: 4px solid var(--blue); border-radius: 12px; margin: 15px 0; padding: 16px; }
        
        .pairs-box { font-size: 1.2em; font-weight: bold; background: #fff; border: 1px solid #e2e8f0; padding: 10px; border-radius: 8px; margin: 10px 0; line-height: 1.8; letter-spacing: 0.5px; color: #1e293b; }
        .code-block { background: #f8fafc; border: 1px solid #cbd5e1; color: #1e293b; padding: 12px; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 15px; overflow-x: auto; margin: 10px 0; white-space: pre; }
        
        .label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 900; color: #647690; margin-bottom: 8px;}
        .answerrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 16px 0; }
        .answerrow input { flex: 1; min-width: 180px; padding: 12px; border: 2px solid #cbd5e1; border-radius: 9px; font: inherit; font-size: 18px; font-weight: bold; }
        .feedback { margin: 12px 0; font-weight: 700; font-size: 18px; }
        
        /* Рисовалка */
        .canvas-container { border: 2px solid #cbd5e1; border-radius: 12px; background: #fff; margin: 15px 0; position: relative; overflow: hidden; }
        .draw-canvas { display: block; width: 100%; height: 350px; cursor: crosshair; touch-action: none; }
        
        .draw-tools { display: flex; gap: 8px; margin-bottom: 10px; justify-content: flex-end; flex-wrap: wrap; }
        .tool-btn { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; font-weight: bold; color: #333; display: flex; align-items: center; gap: 5px; transition: 0.2s; }
        .tool-btn:hover { background: #f1f5f9; }
        .tool-btn.danger { color: var(--bad); }
        .tool-btn.danger:hover { background: #fee2e2; border-color: #fecaca; }
        
        /* Подсказка */
        .steps-box { border: 2px solid #e2e8f0; border-radius: 12px; padding: 16px; margin: 15px 0; background: #f8fafc; display: none; }
        .steps-box.show { display: block; }
        .step-item { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px dashed #cbd5e1; }
        .step-item:last-child { border: none; margin: 0; padding: 0; }
        .step-title { font-weight: bold; color: var(--blue); margin-bottom: 4px; }
        
        /* Комментарий */
        .comment-box { margin-top: 15px; }
        .comment-box textarea { width: 100%; height: 70px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 9px; font: inherit; resize: vertical; }

        .actions { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 16px; margin-top: 20px; }
        
        /* Модалка и теория */
        .overlay { display: none; position: fixed; inset: 0; background: #17263dd0; z-index: 20; align-items: center; justify-content: center; padding: 18px; }
        .overlay.show { display: flex; }
        .modal { background: white; border-radius: 15px; padding: 22px; max-width: 950px; width: 100%; max-height: 90vh; overflow: auto; }
        
        .sticker-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 15px 0; }
        .sticker { padding: 15px; border-radius: 12px; box-shadow: 2px 4px 10px rgba(0,0,0,0.1); position: relative; font-size: 14px; }
        .sticker:nth-child(1) { background: #fff9c4; border: 2px solid #fbc02d; transform: rotate(-1deg); }
        .sticker:nth-child(2) { background: #e1f5fe; border: 2px solid #4fc3f7; transform: rotate(1deg); }
        .sticker:nth-child(3) { background: #e8f5e9; border: 2px solid #81c784; transform: rotate(-1deg); grid-column: span 2; }
        .sticker h4 { margin: 0 0 8px 0; font-size: 16px; }
        .sticker .math { font-size: 18px; font-weight: bold; text-align: center; margin: 10px 0; font-family: monospace; }

        /* Отчёт */
        .report { font-size: 13px; }
        .report table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .report th, .report td { border: 1px solid #cbd5e1; padding: 6px; text-align: left; vertical-align: top; }
        .report th { background: #f4f7fb; }
        .report .status-cell { font-weight: bold; text-align: center; }
        .report .status-ok { color: var(--good); background: #e8f8ee; }
        .report .status-bad { color: var(--bad); background: #fee2e2; }
        .report .status-skip { color: #b45309; background: #fef3c7; }
        .report .status-hint { color: #7c3aed; font-size: 11px; display: block; }
        
        .report-axis-snap { width: 100%; max-width: 400px; border: 1px solid #cbd5e1; border-radius: 6px; display: block; margin-bottom: 5px; }
        .report textarea { width: 100%; height: 60px; border: 1px solid #cbd5e1; border-radius: 6px; padding: 4px; font: inherit; resize: vertical; }
        
        @media(max-width: 850px) { 
            .layout { grid-template-columns: 1fr; } 
            .side { position: static; max-height: none; } 
            .sticker-grid { grid-template-columns: 1fr; }
            .sticker:nth-child(3) { grid-column: span 1; }
        }
        @media print {
            body { background: #fff !important; }
            header, .side, .actions, .buttons, .draw-tools { display: none !important; }
            .layout { display: block; padding: 0; margin: 0; }
            .main { border: none; box-shadow: none; padding: 0; }
            .overlay.show { display: block !important; position: static !important; background: transparent !important; padding: 0 !important; }
            .overlay.show .modal { display: block !important; position: static !important; max-width: none !important; max-height: none !important; overflow: visible !important; box-shadow: none !important; padding: 0 !important; }
            .report th, .report td { padding: 4px; font-size: 11px; }
            .report .report-actions { display: none !important; }
        }
    </style>
</head>
<body>

<header>
    <div class="brand">
        <small>ОГЭ • ИНФОРМАТИКА</small>
        <strong>Задание 6: Пары чисел</strong>
        <span id="studentNameDisplay" style="font-size: 13px; color: var(--blue);">Ученик</span>
    </div>
    <div class="buttons">
        <button class="btn" id="guideBtn">📚 Методичка</button>
        <button class="btn" id="saveBtn">💾 Сохранить</button>
        <button class="btn" id="resetBtn" style="color: var(--bad);">🔄 Сброс</button>
        <button class="btn primary" id="reportBtn">📋 Отчёт</button>
    </div>
</header>

<div class="layout">
    <aside class="side">
        <h2>Все задания</h2>
        <div class="progress"><div id="progressbar"></div></div>
        <div id="tasknav" class="tasknav"></div>
    </aside>
    <main class="main" id="view"></main>
</div>

<div class="overlay" id="modal">
    <div class="modal" id="modalcontent"></div>
</div>

TASKS.sort((a,b) => a.id - b.id);

let state = {
    name: 'Ученик',
    current: 1,
    done: {}, 
    drawings: {}, // { id: base64 }
    comments: {}, 
    answers: {}
};

let embeddedData = null;
try {
    let scriptTag = document.getElementById('embedded-state');
    if (scriptTag) embeddedData = JSON.parse(scriptTag.textContent);
} catch(e) {}

if (embeddedData) {
    state = { ...state, ...embeddedData };
} else {
    try {
        let old = JSON.parse(localStorage.getItem('oge_task6_v7') || 'null');
        if(old) state = { ...state, ...old };
    } catch(e) {}
}

state.current = Number(state.current) || 1;
if (!state.done) state.done = {};

const $ = id => document.getElementById(id);
const getTask = (id) => TASKS.find(t => t.id == id);
const isAnalog = (id) => Number(id) >= 100;
const getProtoId = (id) => isAnalog(id) ? (Number(id) % 100) : Number(id);

const PROTO_IDS = TASKS.filter(t => !isAnalog(t.id)).map(t => t.id);

function save() { localStorage.setItem('oge_task6_v7', JSON.stringify(state)); }

function renderNav() {
    try {
        $('tasknav').innerHTML = PROTO_IDS.map(pid => {
            let pStat = state.done[pid] || {};
            let aStat = state.done[pid + 100] || {};
            
            let statusClass = '';
            let mark = '⚪';
            
            if (pStat.correct) { 
                if (aStat.correct) { statusClass = 'status-done'; mark = '✅'; }
                else if (pStat.hintUsed) { statusClass = 'status-skipped'; mark = '⚠️'; }
                else { statusClass = 'status-done'; mark = '✅'; }
            }
            else if (pStat.skipped) { statusClass = 'status-skipped'; mark = '⏭️'; }

            let isActive = (state.current === pid) || (state.current === pid + 100);

            return `<button class="${isActive ? 'active' : ''} ${statusClass}" onclick="openTask(${pid})">
                <span class="statusmark">${mark}</span>
                <span>Задание ${pid}</span>
            </button>`;
        }).join('');
        
        let doneCount = PROTO_IDS.filter(pid => state.done[pid] && state.done[pid].correct).length;
        $('progressbar').style.width = (100 * doneCount / PROTO_IDS.length) + '%';
    } catch(e) {
        console.error("Ошибка в renderNav", e);
    }
}

function openTask(id) {
    state.current = Number(id);
    save();
    render();
    window.scrollTo(0, 0);
}

function goNext() {
    let currentProto = getProtoId(state.current);
    let nextProto = currentProto + 1;
    if (nextProto > 11) nextProto = 1; 
    
    if (isAnalog(state.current)) {
        openTask(nextProto);
    } else {
        let pStat = state.done[currentProto] || {};
        let aStat = state.done[currentProto + 100] || {};
        
        if (pStat.hintUsed && !aStat.correct) {
            openTask(currentProto + 100);
        } else {
            openTask(nextProto);
        }
    }
}

function render() {
    renderNav();
    $('studentNameDisplay').textContent = state.name;
    
    let t = getTask(state.current);
    if (!t) {
        state.current = 1;
        t = getTask(1);
    }

    let stat = state.done[t.id] || {};
    let isDone = stat.correct;
    let isRep = isAnalog(t.id);
    let protoId = getProtoId(t.id);
    
    let mainBg = '#fff';
    let borderStyle = '1px solid var(--line)';
    if (isDone) { mainBg = '#e8f8ee'; borderStyle = '2px solid #2c9b5d'; }
    else if (stat.skipped) { mainBg = '#fff5db'; borderStyle = '2px solid #f0d17a'; }
    else if (stat.attempts > 0) { mainBg = '#fef2f2'; borderStyle = '2px solid #fecaca'; }

    $('view').style.background = mainBg;
    $('view').style.border = borderStyle;
    $('view').style.borderRadius = '15px';

    let navHtml = '';
    if (isRep) {
        navHtml = `<div style="background: #fef08a; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-weight: bold; color: #854d0e;">
            📝 Работа над ошибками. Аналог к заданию ${protoId}
            <button class="btn" style="float: right; padding: 2px 8px;" onclick="openTask(${protoId})">Вернуться</button>
        </div>`;
    }

    let hintBtn = '';
    if (!isRep) {
        if (!stat.hintUsed) {
            hintBtn = `<button class="btn" onclick="useHint()">💡 Показать подсказку</button>`;
        } else {
            hintBtn = `<button class="btn" onclick="toggleHint()">🔽 ${stat.hintVisible !== false ? 'Скрыть' : 'Показать'} подсказку</button>`;
        }
    }

    $('view').innerHTML = `
        ${navHtml}
        <div class="badge">${isRep ? 'Аналог (без подсказок)' : 'Прототип'}</div>
        <h1 class="task-title">Задание ${t.id}</h1>
        
        <div class="condition-wrapper">
            <div class="condition-content">
                <div class="label">Условие</div>
                ${t.text}
                <div class="code-block">${t.code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>
                <b>🧐 ${t.question}</b>
            </div>
        </div>

        <div class="buttons" style="margin-bottom: 15px;">
            ${hintBtn}
        </div>

        <div class="steps-box ${stat.hintVisible !== false && stat.hintUsed ? 'show' : ''}" id="stepsBox">
            ${t.steps ? t.steps.map(s => `
                <div class="step-item">
                    <div class="step-title">${s.t}</div>
                    <div>${s.c}</div>
                </div>
            `).join('') : '<p>Нет подсказки.</p>'}
        </div>

        <div class="label">Черновик: Пары чисел и числовой луч</div>
        <div class="draw-tools">
            <button class="tool-btn" onclick="undoDraw()" id="undoBtn" style="display:none;">↩️ Отменить</button>
            <button class="tool-btn danger" onclick="clearCanvas()">🗑️ Очистить всё</button>
        </div>
        
        <div class="canvas-container">
            <canvas id="drawBoard" class="draw-canvas" width="800" height="350"></canvas>
        </div>

        <div class="comment-box">
            <div class="label">Комментарий к решению (необязательно)</div>
            <textarea placeholder="Напишите, что было сложно или как вы рассуждали..." oninput="state.comments[state.current]=this.value; save();">${state.comments[state.current] || ''}</textarea>
        </div>

        <div class="answerrow">
            <input id="answer" value="${state.answers[t.id] || ''}" placeholder="Введите ответ" oninput="state.answers[state.current]=this.value;save()" onkeydown="if(event.key==='Enter') check()">
            <button class="btn primary" onclick="check()">Проверить</button>
        </div>
        <div class="feedback" id="feedback">
            ${isDone ? '<span style="color:var(--good)">✅ Верно! Задание выполнено.</span>' : 
              stat.skipped ? '<span style="color:#b45309">⏭️ Пропущено. Попробуйте решить аналог.</span>' : 
              stat.attempts > 0 ? '<span style="color:var(--bad)">❌ Есть ошибки. Попробуйте ещё раз.</span>' : ''}
        </div>

        <div class="actions">
            ${!isDone ? `<div class="buttons"><button class="btn" onclick="skipTask()">Пропустить задание ⏭️</button></div>` : ''}
        </div>
    `;

    setTimeout(() => {
        initDrawingCanvas(t.id, t.pairs, t.axisValues);
    }, 50);
}

function useHint() {
    let t = getTask(state.current);
    if (!t || isAnalog(t.id)) return;
    if (!state.done[t.id]) state.done[t.id] = { attempts: 0, hintUsed: false, correct: false };
    if (!state.done[t.id].hintUsed) {
        state.done[t.id].hintUsed = true;
        state.done[t.id].hintVisible = true;
        save();
        render();
    }
}

function toggleHint() {
    let t = getTask(state.current);
    if (!t) return;
    if (!state.done[t.id]) return;
    state.done[t.id].hintVisible = !state.done[t.id].hintVisible;
    save();
    render();
}

function skipTask() {
    let id = state.current;
    if (!state.done[id]) state.done[id] = { attempts: 0, hintUsed: false, correct: false };
    state.done[id].skipped = true;
    save();
    goNext();
}

function check() {
    let t = getTask(state.current);
    if (!t) return;
    let v = $('answer').value.trim();
    if (!v) return;

    if (!state.done[t.id]) state.done[t.id] = { attempts: 0, hintUsed: false, correct: false };
    state.done[t.id].attempts += 1;

    let isCorrect = (v.toLowerCase() === t.answer.toLowerCase());

    if (isCorrect) {
        state.done[t.id].correct = true;
        state.done[t.id].skipped = false;
        state.done[t.id].firstTry = (state.done[t.id].attempts === 1);
        
        saveDrawing(t.id);
        save();
        
        $('feedback').innerHTML = '<span style="color:var(--good); font-size: 20px;">✅ Верно! 🎉</span>';
        $('view').style.background = '#e8f8ee';
        $('view').style.border = '2px solid #2c9b5d';
        renderNav();

        setTimeout(() => {
            if (!isAnalog(t.id) && state.done[t.id].hintUsed) {
                openTask(t.id + 100); 
            } else {
                goNext();
            }
        }, 1500);

    } else {
        $('feedback').innerHTML = '<span style="color:var(--bad); font-size: 18px;">❌ Неверно. Попробуйте ещё раз.</span>';
        $('view').style.background = '#fef2f2';
        $('view').style.border = '2px solid #fecaca';
        save();
        renderNav();
    }
}

/* --- Рисовалка --- */
let drawCanvas, drawCtx, drawing = false;
let drawHistory = [];

function initDrawingCanvas(taskId, pairsText, axisValues) {
    drawCanvas = $('drawBoard');
    if (!drawCanvas) return;
    
    drawCtx = drawCanvas.getContext('2d');
    drawHistory = [];
    updateUndoBtn();

    renderBackground(pairsText, axisValues);

    if (state.drawings[taskId]) {
        let img = new Image();
        img.onload = () => {
            drawCtx.drawImage(img, 0, 0);
            drawHistory.push(drawCanvas.toDataURL());
            updateUndoBtn();
            resetBrush(); 
        };
        img.src = state.drawings[taskId];
    }

    resetBrush();

    drawCanvas.onmousedown = (e) => { drawing = true; startDraw(e); };
    drawCanvas.onmousemove = (e) => { if(drawing) draw(e); };
    drawCanvas.onmouseup = () => { drawing = false; saveDrawHistory(); };
    drawCanvas.onmouseout = () => { drawing = false; saveDrawHistory(); };

    drawCanvas.ontouchstart = (e) => { e.preventDefault(); drawing = true; startDraw(e.touches[0]); };
    drawCanvas.ontouchmove = (e) => { e.preventDefault(); if(drawing) draw(e.touches[0]); };
    drawCanvas.ontouchend = () => { drawing = false; saveDrawHistory(); };
}

function resetBrush() {
    if (!drawCtx) return;
    drawCtx.lineWidth = 3;
    drawCtx.lineCap = 'round';
    drawCtx.strokeStyle = '#e11d48'; // Явно красный
}

function renderBackground(pairsText, axisValues) {
    if (!drawCtx) return;
    
    // --- Рисуем пары (верхняя часть) ---
    drawCtx.font = 'bold 15px Arial'; // Уменьшен шрифт, чтобы влезло в одну строку
    drawCtx.textAlign = 'left';
    drawCtx.fillStyle = '#1e293b';
    
    // Выводим все пары одной строкой
    drawCtx.fillText(pairsText, 40, 45);

    // --- Рисуем луч (нижняя часть) ---
    let axisY = 220;
    drawCtx.strokeStyle = '#647690';
    drawCtx.lineWidth = 2;
    drawCtx.beginPath(); 
    drawCtx.moveTo(40, axisY); 
    drawCtx.lineTo(760, axisY); 
    drawCtx.stroke();
    
    drawCtx.beginPath(); 
    drawCtx.moveTo(750, axisY - 5); 
    drawCtx.lineTo(760, axisY); 
    drawCtx.lineTo(750, axisY + 5); 
    drawCtx.stroke();

    // --- Рисуем точки ---
    if (axisValues && axisValues.length > 0) {
        let counts = {};
        axisValues.forEach(v => counts[v] = (counts[v] || 0) + 1);
        let uniqueVals = [...new Set(axisValues)].sort((a, b) => a - b);
        
        let startX = 80;
        let endX = 720;
        let step = (endX - startX) / (uniqueVals.length - 1 || 1);
        if (uniqueVals.length === 1) { step = 0; startX = 400; }

        drawCtx.font = '14px Arial';
        drawCtx.textAlign = 'center';
        drawCtx.fillStyle = '#1e293b';

        uniqueVals.forEach((val, index) => {
            let baseX = startX + index * step;
            let count = counts[val];
            
            for (let i = 0; i < count; i++) {
                let x = baseX;
                if (count > 1) {
                    x = baseX + (i - (count - 1) / 2) * 14; 
                }
                drawCtx.beginPath();
                drawCtx.arc(x, axisY, 5, 0, Math.PI * 2);
                drawCtx.fillStyle = '#e11d48';
                drawCtx.fill();
            }
            drawCtx.fillStyle = '#1e293b';
            drawCtx.fillText(val, baseX, axisY + 25);
        });
    }
}

function updateUndoBtn() {
    let btn = $('undoBtn');
    if (btn) btn.style.display = (drawHistory.length > 1) ? 'inline-block' : 'none';
}

function saveDrawHistory() {
    if (!state.drawings[state.current]) state.drawings[state.current] = {};
    if (drawCanvas) {
        let data = drawCanvas.toDataURL();
        if (drawHistory[drawHistory.length - 1] !== data) {
            drawHistory.push(data);
            state.drawings[state.current] = data;
            save();
        }
        updateUndoBtn();
    }
}

function saveDrawing(taskId) {
    if (!state.drawings[taskId] && drawCanvas) {
        state.drawings[taskId] = drawCanvas.toDataURL();
    }
}

function undoDraw() {
    if (drawHistory.length <= 1) return;
    
    drawHistory.pop();
    let prevData = drawHistory[drawHistory.length - 1];
    let t = getTask(state.current);
    
    drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    
    renderBackground(t.pairs, t.axisValues);
    
    if (prevData !== 'data:,') {
        let img = new Image();
        img.onload = () => {
            drawCtx.drawImage(img, 0, 0);
            resetBrush();
        };
        img.src = prevData;
    } else {
        resetBrush();
    }
    
    state.drawings[state.current] = prevData;
    save();
    updateUndoBtn();
}

function clearCanvas() {
    if (!confirm('Очистить все рисунки?')) return;
    
    let id = state.current;
    let t = getTask(id);
    
    if (state.drawings[id]) {
        delete state.drawings[id];
        save();
    }
    
    if (drawCtx) {
        drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        renderBackground(t.pairs, t.axisValues);
        drawHistory = [];
        resetBrush(); 
    }
    
    updateUndoBtn();
}

function getPos(e) {
    let rect = drawCanvas.getBoundingClientRect();
    return {
        x: (e.clientX - rect.left) * (drawCanvas.width / rect.width),
        y: (e.clientY - rect.top) * (drawCanvas.height / rect.height)
    };
}

function startDraw(e) {
    resetBrush(); 
    let pos = getPos(e);
    drawCtx.beginPath();
    drawCtx.moveTo(pos.x, pos.y);
}

function draw(e) {
    let pos = getPos(e);
    drawCtx.lineTo(pos.x, pos.y);
    drawCtx.stroke();
}

/* --- Модалки и Отчёт --- */
function openModal(content) { $('modalcontent').innerHTML = content; $('modal').classList.add('show'); }
function closeModal() { $('modal').classList.remove('show'); }

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        closeModal();
    }
});

$('guideBtn').onclick = () => {
    openModal(`
        <h2 style="text-align:center;">📚 Методичка: Задание 6</h2>
        <div class="sticker-grid">
            <div class="sticker">
                <h4>🎯 Как решать задачи с параметром A?</h4>
                <p>1. Посмотрите на условие. Разделите его на две части: одна связана с A, другая — нет.</p>
                <p>2. Выясните, сколько раз срабатывает часть <b>без A</b>.</p>
                <p>3. Выпишите значения из пар, которые проверяются в части <b>с A</b>.</p>
                <p>4. Нарисуйте числовой луч и отметьте на нём эти значения. Определите, где должна проходить граница A, чтобы получить нужное количество «YES».</p>
            </div>
            <div class="sticker">
                <h4>🤔 Операторы not, and, or</h4>
                <p><b>and</b> — истинно, если <u>оба</u> условия верны.</p>
                <p><b>or</b> — истинно, если <u>хотя бы одно</u> верно.</p>
                <p><b>not</b> — меняет истину на ложь и наоборот. По закону де Моргана: <code>not (A and B) = (not A) or (not B)</code>.</p>
            </div>
            <div class="sticker">
                <h4>📐 Деление и остаток</h4>
                <p><b>s // 2</b> — целочисленное деление (отбрасываем дробную часть). 7 // 2 = 3.</p>
                <p><b>s % 5</b> — остаток от деления. 7 % 5 = 2.</p>
                <p>Будьте внимательны: если в условии <b>s // 2 > A</b>, то на луч наносим не s, а результат s // 2!</p>

        </div>
        <div style="text-align:center;">
            <button class="btn primary" onclick="closeModal()">Закрыть</button>

};

$('resetBtn').onclick = () => {
    if(confirm('Вы уверены, что хотите сбросить весь прогресс? Все рисунки, ответы и комментарии будут удалены.')) {
        localStorage.removeItem('oge_task6_v7');
        location.reload();
    }
};

$('saveBtn').onclick = () => {
    let clone = document.documentElement.cloneNode(true);
    
    let script = document.createElement('script');
    script.id = 'embedded-state';
    script.type = 'application/json';
    script.textContent = JSON.stringify(state);
    clone.querySelector('body').appendChild(script);
    
    let overlay = clone.querySelector('#modal');
    if (overlay) overlay.classList.remove('show');
    
    let htmlStr = '<!doctype html>\n' + clone.outerHTML;
    let blob = new Blob([htmlStr], {type: 'text/html'});
    let url = URL.createObjectURL(blob);
    let a = document.createElement('a');
    a.href = url;
    a.download = 'oge_task6_saved.html';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
};

$('reportBtn').onclick = () => {
    let rows = PROTO_IDS.map(pid => {
        let t = getTask(pid);
        let stat = state.done[pid] || {};
        let analogStat = state.done[pid + 100] || {};
        
        let statusText = 'Не решено';
        let statusClass = 'status-bad';
        
        if (stat.correct) {
            statusText = '✅ Решено';
            statusClass = 'status-ok';
            if (stat.hintUsed) statusText += '<br><span class="status-hint">(была подсказка)</span>';
            if (stat.firstTry) statusText += '<br><span style="font-size:11px; color:green;">(с 1-й попытки)</span>';
            else statusText += `<br><span style="font-size:11px; color:orange;">(попыток: ${stat.attempts})</span>`;
        } else if (stat.skipped) {
            statusText = '⏭️ Пропущено';
            statusClass = 'status-skip';
        } else if (stat.attempts > 0) {
            statusText = `❌ Ошибки (${stat.attempts})`;
        }

        let imgHtml = '';
        if (state.drawings[pid]) {
            imgHtml = `<img src="${state.drawings[pid]}" style="width:100%; max-width: 400px; border: 1px solid #cbd5e1; border-radius: 6px; display:block; margin-bottom: 5px;">`;
        } else {
            imgHtml = '<span style="color:#94a3b8;">Нет рисунка</span>';
        }
        
        let commentVal = state.comments[pid] || '';
        let analogStatus = analogStat.correct ? '<span style="color:green; font-size:11px; display:block; margin-top:4px;">✅ Аналог решён</span>' : '';

        return `<tr>
            <td style="text-align:center;"><b>${pid}</b></td>
            <td style="font-size:12px;">${t.text.replace(/\n/g, '<br>')}<br><b>${t.pairs}</b></td>
            <td style="text-align:center; font-weight:bold;">${state.answers[pid] || '—'}</td>
            <td class="status-cell ${statusClass}">${statusText} ${analogStatus}</td>
            <td>
                ${imgHtml}
                <textarea placeholder="Комментарий..." onchange="state.comments['${pid}']=this.value; save();">${commentVal}</textarea>
            </td>
        </tr>`;
    }).join('');

    openModal(`
        <div class="report">
            <h2 style="text-align:center; margin-top:0;">Отчёт для учителя</h2>
            <p style="text-align:center; margin-bottom: 10px;">Ученик: <b>${state.name}</b> · ${new Date().toLocaleDateString('ru-RU')}</p>
            <table>
                <thead>
                    <tr>
                        <th style="width: 30px;">№</th>
                        <th>Условие</th>
                        <th style="width: 60px;">Ответ</th>
                        <th style="width: 110px;">Статус</th>
                        <th style="width: 420px;">Черновик и Комментарий</th>
                    </tr>
                </thead>
                <tbody>${rows}</tbody>
            </table>
            <div class="report-actions" style="margin-top:20px; text-align:center;">
                <button class="btn primary" onclick="window.print()">🖨️ Печать / PDF</button>
                <button class="btn" onclick="closeModal()">Закрыть</button>
            </div>
        </div>
    `);
};

function init() {
    if(!localStorage.getItem('oge_task6_v7') && !embeddedData) {
        openModal(`
            <h2>Начало работы</h2>
            <p>Введите имя ученика:</p>
            <input id="studentName" value="Ученик" style="padding:10px; width:100%; margin-bottom:15px; font-size:16px; border: 1px solid #ccc; border-radius: 6px;">
            <button class="btn primary" onclick="state.name=document.getElementById('studentName').value.trim()||'Ученик'; save(); closeModal(); render();">Начать</button>
        `);
    }
    render();
}

init();
