<body>

<h1>Сердца и души</h1>
<p>Души в нас — залы для редких гостей,</p>
<p>Знающих прелесть тепличных растений.</p>
<p>В них отдыхают от скорбных путей</p>
<p>Разные милые тени.</p>
<p></p>
<p>Тесные келейки — наши сердца.</p>
<p>В них заключенный один до могилы.</p>
<p>В келью мою заточен до конца</p>
<p>Ты без товарища, милый!</p>
