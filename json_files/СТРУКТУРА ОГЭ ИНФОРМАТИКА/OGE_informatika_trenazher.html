rint(ЕСЛИ_НЕТ)\", \"mode\": \"simple\", \"note\": \"\", \"solution\": \"s = 0\\na = int(input())\\nwhile a != 0:\\n    if a % 6 == 0 and a % 10 == 4:\\n        s += a\\n    a = int(input())\\nprint(s)\", \"hint\": \"1) Создай s = 0.\\n2) Число должно одновременно делиться на 6 и оканчиваться на 4. Объедини проверки через and: a % 6 == 0 and a % 10 == 4.\\n3) Если оба условия верны, прибавь a к s.\\n4) Выведи s после завершения ввода.\", \"tests\": [{\"name\": \"Граничный случай\", \"input\": \"24\\n60\\n144\\n22\\n12\\n0\", \"expected\": \"168\"}, {\"name\": \"Дополнительный случай\", \"input\": \"14\\n0\", \"expected\": \"0\"}, {\"name\": \"Проверка отбора\", \"input\": \"6\\n24\\n0\", \"expected\": \"24\"}]}, {\"id\": 28, \"group\": \"while\", \"rank\": 6, \"title\": \"Сумма чисел, кратных 7 и оканчивающихся на 2\", \"condition\": \"В последовательности натуральных чисел определить сумму всех чисел, кратных 7 и оканчивающихся на 2.\\nКоличество заранее неизвестно. Ввод заканчивается числом 0; стоп-сигнал не входит в последовательность.\", \"input\": \"Натуральные числа по одному. Последнее введённое число — 0.\", \"sampleInput\": \"112\\n24\\n42\\n49\\n22\\n0\", \"sampleOutput\": \"154\", \"body\": \"kol = 0\\ns = 0\\npr = 1\\nmaxi = -10**10\\nmini = 10**10\\na = int(input())\\nwhile a != 0:\\n    if УСЛОВИЕ:\\n        kol += 1\\n        s += a\\n        pr *= a\\n        maxi = max(maxi, a)\\n        mini = min(mini, a)\\n    a = int(input())\", \"simple\": \"print(s)\", \"conditional\": \"if УСЛОВИЕ_ВЫВОДА:\\n    print(ЕСЛИ_ДА)\\nelse:\\n    print(ЕСЛИ_НЕТ)\", \"mode\": \"simple\", \"note\": \"\", \"solution\": \"s = 0\\na = int(input())\\nwhile a != 0:\\n    if a % 7 == 0 and a % 10 == 2:\\n        s += a\\n    a = int(input())\\nprint(s)\", \"hint\": \"1) Создай s = 0.\\n2) Для каждого числа до стоп-сигнала проверь сразу два условия: a % 7 == 0 и a % 10 == 2. Между ними поставь and.\\n3) Подходящее число прибавляй к s.\\n4) Ноль не включай в сумму и после цикла выведи s.\", \"tests\": [{\"name\": \"Граничный случай\", \"input\": \"112\\n24\\n42\\n49\\n22\\n0\", \"expected\": \"154\"}, {\"name\": \"Дополнительный случай\", \"input\": \"7\\n12\\n0\", \"expected\": \"0\"}, {\"name\": \"Проверка отбора\", \"input\": \"14\\n22\\n42\\n49\\n0\", \"expected\": \"42\"}]}, {\"id\": 24, \"group\": \"while\", \"rank\": 7, \"title\": \"Длина последовательности и количество нечётных чисел, кратных 3\", \"condition\": \"Определить длину последовательности и количество нечётных чисел, кратных 3.\\nКоличество заранее неизвестно. Ввод заканчивается числом 0; завершающий 0 не учитывается.\", \"input\": \"Целые числа по одному. Последнее введённое число — 0.\", \"sampleInput\": \"4\\n6\\n15\\n180\\n0\", \"sampleOutput\": \"4, 1\", \"body\": \"dlina = 0\\nkol = 0\\na = int(input())\\nwhile a != 0:\\n    dlina += 1\\n    if УСЛОВИЕ:\\n        dlina += 1\\n        kol += 1\\n    a = int(input())\", \"simple\": \"print(dlina)\\nprint(kol)\", \"conditional\": \"if УСЛОВИЕ_ВЫВОДА:\\n    print(ЕСЛИ_ДА)\\nelse:\\n    print(ЕСЛИ_НЕТ)\", \"mode\": \"simple\", \"note\": \"\", \"solution\": \"dlina = 0\\nkol = 0\\na = int(input())\\nwhile a != 0:\\n    dlina += 1\\n    if a % 3 == 0 and a % 2 != 0:\\n        kol += 1\\n    a = int(input())\\nprint(dlina, kol, sep=', ')\", \"hint\": \"1) dlina = 0 — первый счётчик длины. Увеличивай его на каждом проходе while, потому что любое ненулевое число входит в последовательность.\\n2) kol = 0 — второй счётчик. Увеличивай его только для нечётных чисел, кратных 3: a % 2 != 0 and a % 3 == 0.\\n3) Сначала прочитай a до начала цикла; в конце каждой итерации обязательно прочитай следующее число. Сам 0 не учитывай.\\n4) Выведи dlina и kol ОДНОЙ строкой через запятую: используй один print с двумя аргументами и sep=', '.\", \"tests\": [{\"name\": \"Граничный случай\", \"input\": \"0\", \"expected\": \"0, 0\"}, {\"name\": \"Дополнительный случай\", \"input\": \"1\\n3\\n0\", \"expected\": \"2, 1\"}, {\"name\": \"Проверка отбора\", \"input\": \"4\\n6\\n15\\n180\\n0\", \"expected\": \"4, 1\"}], \"outputLine\": \"comma\", \"printInstruction\": \"Два результата выведи одной строкой через запятую: один print с двумя аргументами и sep=', '.\"}, {\"id\": 25, \"group\": \"while\", \"rank\": 8, \"title\": \"Сумма последовательности и количество чётных чисел, кратных 5\", \"condition\": \"Определить сумму всех чисел последовательности и количество чётных чисел, кратных 5.\\nКоличество заранее неизвестно. Ввод заканчивается числом 0; завершающий 0 не учитывается.\", \"input\": \"Целые числа по одному. Последнее введённое число — 0.\", \"sampleInput\": \"4\\n60\\n15\\n0\", \"sampleOutput\": \"79\\n1\", \"body\": \"kol = 0\\ns = 0\\npr = 1\\nmaxi = -10**10\\nmini = 10**10\\na = int(input())\\nwhile a != 0:\\n    s += a\\n    if УСЛОВИЕ:\\n        s += a\\n        kol += 1\\n        pr *= a\\n        maxi = max(maxi, a)\\n        mini = min(mini, a)\\n    a = int(input())\", \"simple\": \"print(s)\\nprint(kol)\", \"conditional\": \"if УСЛОВИЕ_ВЫВОДА:\\n    print(ЕСЛИ_ДА)\\nelse:\\n    print(ЕСЛИ_НЕТ)\", \"mode\": \"simple\", \"note\": \"\", \"solution\": \"s = 0\\nkol = 0\\na = int(input())\\nwhile a != 0:\\n    s += a\\n    if a % 2 == 0 and a % 5 == 0:\\n        kol += 1\\n    a = int(input())\\nprint(s)\\nprint(kol)\", \"hint\": \"1) s = 0 — сумма всех ненулевых чисел. Добавляй к ней a на каждом проходе цикла.\\n2) kol = 0 — второй счётчик чётных чисел, кратных 5. Внутри отдельного if проверь a % 2 == 0 and a % 5 == 0 и увеличь kol.\\n3) Перед while прочитай первое число, в конце цикла — следующее. 0 не суммируй и не считай.\\n4) Выведи сумму и количество; в исходной задаче это два результата.\", \"tests\": [{\"name\": \"Граничный случай\", \"input\": \"4\\n60\\n15\\n0\", \"expected\": \"79\\n1\"}, {\"name\": \"Дополнительный случай\", \"input\": \"0\", \"expected\": \"0\\n0\"}, {\"name\": \"Проверка отбора\", \"input\": \"10\\n20\\n30\\n0\", \"expected\": \"60\\n3\"}]}, {\"id\": 26, \"group\": \"while\", \"rank\": 9, \"title\": \"Длина последовательности и сумма чётных чисел\", \"condition\": \"Определить количество чисел в последовательности и сумму чётных чисел.\\nКоличество заранее неизвестно. Ввод заканчивается числом 0; завершающий 0 не учитывается. Не более 1000 чисел, модуль каждого не больше 30 000.\", \"input\": \"Целые числа по одному. Последнее введённое число — 0.\", \"sampleInput\": \"4\\n60\\n15\\n0\", \"sampleOutput\": \"3, 64\", \"body\": \"dlina = 0\\nkol = 0\\ns = 0\\npr = 1\\na = int(input())\\nwhile a != 0:\\n    dlina += 1\\n    if УСЛОВИЕ:\\n        dlina += 1\\n        s += a\\n        kol += 1\\n        pr *= a\\n    a = int(input())\", \"simple\": \"print(dlina)\\nprint(s)\", \"conditional\": \"if УСЛОВИЕ_ВЫВОДА:\\n    print(ЕСЛИ_ДА)\\nelse:\\n    print(ЕСЛИ_НЕТ)\", \"mode\": \"simple\", \"note\": \"\", \"solution\": \"dlina = 0\\ns = 0\\na = int(input())\\nwhile a != 0:\\n    dlina += 1\\n    if a % 2 == 0:\\n        s += a\\n    a = int(input())\\nprint(dlina, s, sep=', ')\", \"hint\": \"1) dlina = 0 — счётчик всех ненулевых чисел. Увеличивай его на каждом проходе while.\\n2) s = 0 — сумма только чётных чисел. Внутри if проверь a % 2 == 0 и прибавь к s само число a.\\n3) Сначала прочитай первое a, а в конце каждой итерации — следующее. Ноль не входит в длину и сумму.\\n4) По формату тренажёра выведи dlina и s одной строкой через запятую: один print с двумя аргументами и sep=', '.\", \"tests\": [{\"name\": \"Граничный случай\", \"input\": \"4\\n60\\n15\\n0\", \"expected\": \"3, 64\"}, {\"name\": \"Дополнительный случай\", \"input\": \"0\", \"expected\": \"0, 0\"}, {\"name\": \"Проверка отбора\", \"input\": \"-2\\n-4\\n3\\n0\", \"expected\": \"3, -6\"}], \"outputLine\": \"comma\", \"printInstruction\": \"Два результата выведи одной строкой через запятую: один print с двумя аргументами и sep=', '.\"}, {\"id\": 27, \"group\": \"while\", \"rank\": 10, \"title\": \"Сумма и разность количества положительных и отрицательных чисел\", \"condition\": \"В последовательности целых чисел определить сумму чисел и разность количества положительных и отрицательных чисел (положительные минус отрицательные).\\nКоличество заранее неизвестно. Ввод заканчивается числом 0; завершающий 0 не учитывается.\", \"input\": \"Целые числа по одному. Последнее введённое число — 0.\", \"sampleInput\": \"150\\n-200\\n-1\\n0\", \"sampleOutput\": \"-51\\n-1\", \"body\": \"kol = 0\\ns = 0\\npr = 1\\nplus = 0\\nminus = 0\\na = int(input())\\nwhile a != 0:\\n    s += a\\n    plus += 1\\n    minus += 1\\n    if УСЛОВИЕ:\\n        s += a\\n        plus += 1\\n        minus += 1\\n    if УСЛОВИЕ:\\n        s += a\\n        plus += 1\\n        minus += 1\\n    a = int(input())\", \"simple\": \"print(s)\\nprint(plus - minus)\", \"conditional\": \"if УСЛОВИЕ_ВЫВОДА:\\n    print(ЕСЛИ_ДА)\\nelse:\\n    print(ЕСЛИ_НЕТ)\", \"mode\": \"simple\", \"note\": \"\", \"solution\": \"s = 0\\nplus = 0\\nminus = 0\\na = int(input())\\nwhile a != 0:\\n    s += a\\n    if a > 0:\\n        plus += 1\\n    if a < 0:\\n        minus += 1\\n    a = int(input())\\nprint(s)\\nprint(plus - minus)\", \"hint\": \"1) s = 0 — сумма всех ненулевых чисел: прибавляй каждое a.\\n2) plus = 0 — счётчик положительных; увеличивай при a > 0. minus = 0 — счётчик отрицательных; увеличивай при a < 0.\\n3) Ноль завершает ввод и не входит ни в сумму, ни в счётчики.\\n4) Выведи s и разность plus - minus. Это два результата; в этой задаче оставь вывод отдельными строками.\", \"tests\": [{\"name\": \"Граничный случай\", \"input\": \"150\\n-200\\n-1\\n0\", \"expected\": \"-51\\n-1\"}, {\"name\": \"Дополнительный случай\", \"input\": \"5\\n1\\n0\", \"expected\": \"6\\n2\"}, {\"name\": \"Проверка отбора\", \"input\": \"-5\\n-1\\n0\", \"expected\": \"-6\\n-2\"}]}, {\"id\": 31, \"group\": \"while\", \"rank\": 11, \"title\": \"Сумма трёхзначных чисел, кратных 4\", \"condition\": \"В последовательности натуральных чисел вычислить сумму трёхзначных чисел, кратных 4.\\nКоличество заранее неизвестно. Ввод заканчивается числом 0; завершающий 0 не входит в последовательность. Не более 20 чисел, каждое не больше 1500.\", \"input\": \"Натуральные числа по одному. Последнее введённое число — 0.\", \"sampleInput\": \"18\\n192\\n104\\n117\\n0\", \"sampleOutput\": \"296\", \"body\": \"kol = 0\\ns = 0\\npr = 1\\nmaxi = -10**10\\nmini = 10**10\\na = int(input())\\nwhile a != 0:\\n    if УСЛОВИЕ:\\n        kol += 1\\n        s += a\\n        pr *= a\\n        maxi = max(maxi, a)\\n        mini = min(mini, a)\\n    a = int(input())\", \"simple\": \"print(s)\", \"conditional\": \"if УСЛОВИЕ_ВЫВОДА:\\n    print(ЕСЛИ_ДА)\\nelse:\\n    print(ЕСЛИ_НЕТ)\", \"mode\": \"simple\", \"note\": \"\", \"solution\": \"s = 0\\na = int(input())\\nwhile a != 0:\\n    if 100 <= a <= 999 and a % 4 == 0:\\n        s += a\\n    a = int(input())\\nprint(s)\", \"hint\": \"1) s = 0 — накопитель суммы.\\n2) Для каждого ненулевого числа проверь две части: трёхзначное (100 <= a <= 999) и кратное 4 (a % 4 == 0). Соедини через and.\\n3) Только если обе части верны, прибавь a к s.\\n4) После цикла выведи s.\", \"tests\": [{\"name\": \"Граничный случай\", \"input\": \"18\\n192\\n104\\n117\\n0\", \"expected\": \"296\"}, {\"name\": \"Дополнительный случай\", \"input\": \"100\\n101\\n0\", \"expected\": \"100\"}, {\"name\": \"Проверка отбора\", \"input\": \"996\\n1200\\n0\", \"expected\": \"996\"}]}, {\"id\": 15, \"group\": \"while\", \"rank\": 12, \"title\": \"Среднее чисел, кратных 8 (или NO)\", \"condition\": \"Найти среднее арифметическое чисел, кратных 8. Если таких чисел нет, вывести NO.\\nКоличество заранее неизвестно. Ввод заканчивается числом 0; завершающий 0 не входит в последовательность. Не более 100 чисел, каждое не больше 300.\", \"input\": \"Натуральные числа по одному. Последнее введённое число — 0.\", \"sampleInput\": \"8\\n122\\n64\\n16\\n0\", \"sampleOutput\": \"29.3\", \"body\": \"kol = 0\\ns = 0\\npr = 1\\nmaxi = -10**10\\nmini = 10**10\\na = int(input())\\nwhile a != 0:\\n    if УСЛОВИЕ:\\n        kol += 1\\n        s += a\\n        pr *= a\\n        maxi = max(maxi, a)\\n        mini = min(mini, a)\\n    a = int(input())\", \"simple\": \"print(round(s / kol, 1))\", \"conditional\": \"if kol > 0:\\n    print(round(s / kol, 1))\\nelse:\\n    print('NO')\", \"mode\": \"conditional\", \"note\": \"\", \"solution\": \"s = 0\\nkol = 0\\na = int(input())\\nwhile a != 0:\\n    if a % 8 == 0:\\n        s += a\\n        kol += 1\\n    a = int(input())\\nif kol > 0:\\n    print(round(s / kol, 1))\\nelse:\\n    print('NO')\", \"hint\": \"1) s = 0 и kol = 0 создай до цикла. s хранит сумму подходящих чисел, kol — их количество.\\n2) Внутри while a != 0 проверь кратность 8. Для подходящего числа увеличь оба накопителя.\\n3) После цикла обязательно проверь kol > 0. Если kol равен нулю, делить нельзя — выведи NO.\\n4) Иначе выведи среднее s / kol с одним знаком после точки.\", \"tests\": [{\"name\": \"Граничный случай\", \"input\": \"8\\n122\\n64\\n16\\n0\", \"expected\": \"29.3\"}, {\"name\": \"Дополнительный случай\", \"input\": \"3\\n5\\n0\", \"expected\": \"NO\"}, {\"name\": \"Проверка отбора\", \"input\": \"16\\n0\", \"expected\": \"16.0\"}]}, {\"id\": 17, \"group\": \"while\", \"rank\": 13, \"title\": \"Среднее двузначных чисел (или NO)\", \"condition\": \"Найти среднее арифметическое двузначных чисел. Если таких чисел нет, вывести NO.\\nКоличество заранее неизвестно. Ввод заканчивается числом 0; завершающий 0 не учитывается. Не более 100 чисел, каждое не больше 300.\", \"input\": \"Натуральные числа по одному. Последнее введённое число — 0.\", \"sampleInput\": \"10\\n120\\n49\\n0\", \"sampleOutput\": \"29.5\", \"body\": \"kol = 0\\ns = 0\\npr = 1\\nmaxi = -10**10\\nmini = 10**10\\na = int(input())\\nwhile a != 0:\\n    if УСЛОВИЕ:\\n        kol += 1\\n        s += a\\n        pr *= a\\n        maxi = max(maxi, a)\\n        mini = min(mini, a)\\n    a = int(input())\", \"simple\": \"print(round(s / kol, 1))\", \"conditional\": \"if kol > 0:\\n    print(round(s / kol, 1))\\nelse:\\n    print('NO')\", \"mode\": \"conditional\", \"note\": \"\", \"solution\": \"s = 0\\nkol = 0\\na = int(input())\\nwhile a != 0:\\n    if 10 <= a <= 99:\\n        s += a\\n        kol += 1\\n    a = int(input())\\nif kol > 0:\\n    print(round(s / kol, 1))\\nelse:\\n    print('NO')\", \"hint\": \"1) s = 0 и kol = 0 создай до цикла.\\n2) Двузначные натуральные числа — от 10 до 99 включительно. Для них прибавляй a к s и увеличивай kol.\\n3) Ноль только останавливает ввод и не учитывается.\\n4) После цикла: если kol > 0, выведи среднее s / kol с одним знаком; иначе выведи NO.\", \"tests\": [{\"name\": \"Граничный случай\", \"input\": \"10\\n120\\n49\\n0\", \"expected\": \"29.5\"}, {\"name\": \"Дополнительный случай\", \"input\": \"99\\n120\\n0\", \"expected\": \"99.0\"}, {\"name\": \"Проверка отбора\", \"input\": \"10\\n99\\n120\\n0\", \"expected\": \"54.5\"}]}, {\"id\": 19, \"group\": \"while\", \"rank\": 14, \"title\": \"Среднее чисел, у которых запись в системе 7 оканчивается на 5 (или NO)\", \"condition\": \"Найти среднее арифметическое натуральных десятичных чисел, запись которых в системе счисления по основанию 7 оканчивается цифрой 5. Если таких чисел нет, вывести NO.\\nКоличество заранее неизвестно. Ввод заканчивается числом 0; завершающий 0 не учитывается. Числа не больше 30 000.\", \"input\": \"Натуральные числа по одному. Последнее введённое число — 0.\", \"sampleInput\": \"12\\n14\\n20\\n68\\n25\\n0\", \"sampleOutput\": \"40\", \"body\": \"kol = 0\\ns = 0\\npr = 1\\nmaxi = -10**10\\nmini = 10**10\\na = int(input())\\nwhile a != 0:\\n    if УСЛОВИЕ:\\n        kol += 1\\n        s += a\\n        pr *= a\\n        maxi = max(maxi, a)\\n        mini = min(mini, a)\\n    a = int(input())\", \"simple\": \"print(f'{s / kol:g}')\", \"conditional\": \"if kol > 0:\\n    print(f'{s / kol:g}')\\nelse:\\n    print('NO')\", \"mode\": \"conditional\", \"note\": \"\", \"solution\": \"s = 0\\nkol = 0\\na = int(input())\\nwhile a != 0:\\n    if a % 7 == 5:\\n        s += a\\n        kol += 1\\n    a = int(input())\\nif kol > 0:\\n    print(f'{s / kol:g}')\\nelse:\\n    print('NO')\", \"hint\": \"1) s = 0 и kol = 0 создай перед while.\\n2) В семеричной системе последняя цифра 5 тогда и только тогда, когда a % 7 == 5.\\n3) Для каждого подходящего числа увеличь сумму s на a и счётчик kol на 1.\\n4) После цикла проверь kol > 0: при нуле выведи NO, иначе — среднее s / kol. Ноль-стоп не обрабатывается внутри цикла.\", \"tests\": [{\"name\": \"Граничный случай\", \"input\": \"12\\n14\\n20\\n68\\n25\\n0\", \"expected\": \"40\"}, {\"name\": \"Дополнительный случай\", \"input\": \"1\\n2\\n0\", \"expected\": \"NO\"}, {\"name\": \"Проверка отбора\", \"input\": \"5\\n12\\n19\\n26\\n0\", \"expected\": \"15.5\"}]}, {\"id\": 32, \"group\": \"ranges\", \"rank\": 2, \"title\": \"Количество нечётных чисел на отрезке [a; b]\", \"condition\": \"По двум натуральным числам a и b подсчитать количество нечётных натуральных чисел на отрезке [a; b], включая оба конца.\\nГарантируется: 1 ≤ a ≤ b ≤ 30 000.\", \"input\": \"Два числа: сначала левая граница a, затем правая граница b.\", \"sampleInput\": \"1\\n10\", \"sampleOutput\": \"5\", \"body\": \"a = int(input())\\nb = int(input())\\n# kol = 0\\n\\nfor a in range(a, b + 1):\\n    if УСЛОВИЕ:\\n        # kol += 1\", \"simple\": \"print(kol)\", \"conditional\": \"if УСЛОВИЕ_ВЫВОДА:\\n    print()\\nelse:\\n    print()\", \"mode\": \"simple\", \"note\": \"Перебирай от a до b включительно. Счётчик меняется только для нечётных чисел.\", \"solution\": \"a = int(input())\\nb = int(input())\\nkol = 0\\nfor a in range(a, b + 1):\\n    if a % 2 != 0:\\n        kol += 1\\nprint(kol)\", \"hint\": \"1) Прочитай две границы a и b.\\n2) Создай kol = 0 до цикла. Перебирай значения a от a до b включительно.\\n3) Для нечётного числа используй a % 2 != 0. Только в этом случае увеличивай kol на 1.\\n4) В конце выведи kol. Если границы совпадают, результат будет либо 1, либо 0.\", \"tests\": [{\"name\": \"Один нечётный элемент\", \"input\": \"7\\n7\", \"expected\": \"1\"}, {\"name\": \"Один чётный элемент\", \"input\": \"8\\n8\", \"expected\": \"0\"}, {\"name\": \"Границы разной чётности\", \"input\": \"1\\n10\", \"expected\": \"5\"}, {\"name\": \"Все числа отрезка\", \"input\": \"10\\n20\", \"expected\": \"5\"}]}, {\"id\": 33, \"group\": \"ranges\", \"rank\": 3, \"title\": \"Сумма чисел, кратных 3, на отрезке [a; b]\", \"condition\": \"По двум натуральным числам a и b найти сумму чисел, кратных 3, на отрезке [a; b], включая оба конца.\\nГарантируется: 1 ≤ a ≤ b ≤ 30 000. Если подходящих чисел нет, сумма равна 0.\", \"input\": \"Два числа: сначала левая граница a, затем правая граница b.\", \"sampleInput\": \"1\\n10\", \"sampleOutput\": \"18\", \"body\": \"a = int(input())\\nb = int(input())\\n# s = 0\\n\\nfor a in range(a, b + 1):\\n    if УСЛОВИЕ:\\n        # s += a\", \"simple\": \"print(s)\", \"conditional\": \"if УСЛОВИЕ_ВЫВОДА:\\n    print()\\nelse:\\n    print()\", \"mode\": \"simple\", \"note\": \"Здесь нужен накопитель суммы, а не счётчик. Подходящее число прибавляется к s.\", \"solution\": \"a = int(input())\\nb = int(input())\\ns = 0\\nfor a in range(a, b + 1):\\n    if a % 3 == 0:\\n        s += a\\nprint(s)\", \"hint\": \"1) Прочитай a и b.\\n2) До цикла создай s = 0 — накопитель суммы. Перебирай все a от a до b включительно.\\n3) Проверь кратность 3: a % 3 == 0. Если условие выполнено, прибавь само a к s.\\n4) Если на отрезке нет кратных 3, s останется равным 0. В конце выведи s.\", \"tests\": [{\"name\": \"Один подходящий элемент\", \"input\": \"3\\n3\", \"expected\": \"3\"}, {\"name\": \"Нет подходящих чисел\", \"input\": \"4\\n5\", \"expected\": \"0\"}, {\"name\": \"Кратные трём на отрезке\", \"input\": \"1\\n10\", \"expected\": \"18\"}, {\"name\": \"Граничные значения\", \"input\": \"6\\n12\", \"expected\": \"27\"}]}, {\"id\": 101, \"title\": \"Среднее чётных и количество нечётных, кратных 3\", \"condition\": \"В последовательности натуральных чисел найти:\\n1) среднее арифметическое чётных чисел (с точностью до одного знака после запятой);\\n2) количество нечётных чисел, кратных 3.\\nСначала вводится N (1 ≤ N ≤ 100), затем N чисел. Гарантируется, что хотя бы одно число чётное.\", \"input\": \"Первая строка — N. Далее N натуральных чисел.\", \"solution\": \"n = int(input())\\ns = 0\\nkol = 0\\nkol2 = 0\\nfor i in range(n):\\n    a = int(input())\\n    if a % 2 == 0:\\n        s += a\\n        kol += 1\\n    if a % 2 != 0 and a % 3 == 0:\\n        kol2 += 1\\nprint(round(s / kol, 1))\\nprint(kol2)\", \"hint\": \"Здесь два независимых условия, поэтому два отдельных if (не elif!).\\n1) Для чётных копи сумму s и их количество kol — они нужны для среднего.\\n2) Для нечётных, кратных 3, — второй счётчик kol2. Условие составное: a % 2 != 0 and a % 3 == 0.\\n3) Выведи round(s / kol, 1) и kol2 — двумя print.\", \"tests\": [{\"name\": \"Пример\", \"input\": \"4\\n2\\n9\\n4\\n15\", \"expected\": \"3.0\\n2\"}, {\"name\": \"Граничный случай\", \"input\": \"1\\n8\", \"expected\": \"8.0\\n0\"}, {\"name\": \"Проверка отбора\", \"input\": \"5\\n3\\n6\\n21\\n10\\n27\", \"expected\": \"8.0\\n3\"}, {\"name\": \"Ещё один случай\", \"input\": \"3\\n2\\n4\\n5\", \"expected\": \"3.0\\n0\"}], \"simple\": \"print()\\nprint()\", \"body\": \"n = int(input())\\n# kol = 0\\n# kol2 = 0\\n# s = 0\\n\\nfor i in range(n):\\n    a = int(input())\\n    if УСЛОВИЕ:\\n        # s += a\\n        # kol += 1\\n    if УСЛОВИЕ:\\n        # kol2 += 1\", \"mode\": \"simple\", \"conditional\": \"if УСЛОВИЕ_ВЫВОДА:\\n    print()\\nelse:\\n    print()\", \"note\": \"\", \"group\": \"hard\", \"rank\": 1, \"sampleInput\": \"4\\n2\\n9\\n4\\n15\", \"sampleOutput\": \"3.0\\n2\"}, {\"id\": 102, \"title\": \"Максимум оканчивающихся на 7 и минимум кратных 5\", \"condition\": \"В последовательности натуральных чисел найти максимальное число, оканчивающееся на 7, и минимальное число, кратное 5.\\nСначала вводится N (2 ≤ N ≤ 100), затем N чисел, каждое не больше 30 000. Гарантируется, что есть и число, оканчивающееся на 7, и число, кратное 5. Вывести два числа, каждое на своей строке.\", \"input\": \"Первая строка — N. Далее N натуральных чисел.\", \"solution\": \"n = int(input())\\nmaxi = -10**10\\nmini = 10**10\\nfor i in range(n):\\n    a = int(input())\\n    if a % 10 == 7:\\n        maxi = max(maxi, a)\\n    if a % 5 == 0:\\n        mini = min(mini, a)\\nprint(maxi)\\nprint(mini)\", \"hint\": \"Два разных отбора — два if.\\n1) maxi обновляется только для чисел с последней цифрой 7 (a % 10 == 7).\\n2) mini обновляется только для кратных 5.\\n3) Начальные значения: maxi = -10**10, mini = 10**10.\", \"tests\": [{\"name\": \"Пример\", \"input\": \"4\\n17\\n25\\n7\\n100\", \"expected\": \"17\\n25\"}, {\"name\": \"Граничный случай\", \"input\": \"2\\n57\\n5\", \"expected\": \"57\\n5\"}, {\"name\": \"Проверка отбора\", \"input\": \"5\\n27\\n35\\n77\\n10\\n20\", \"expected\": \"77\\n10\"}, {\"name\": \"Ещё один случай\", \"input\": \"3\\n15\\n7\\n25\", \"expected\": \"7\\n15\"}], \"simple\": \"print()\\nprint()\", \"body\": \"n = int(input())\\n# maxi = -10**10\\n# mini = 10**10\\n\\nfor i in range(n):\\n    a = int(input())\\n    if УСЛОВИЕ:\\n        # maxi = max(maxi, a)\\n    if УСЛОВИЕ:\\n        # mini = min(mini, a)\", \"mode\": \"simple\", \"conditional\": \"if УСЛОВИЕ_ВЫВОДА:\\n    print()\\nelse:\\n    print()\", \"note\": \"\", \"group\": \"hard\", \"rank\": 2, \"sampleInput\": \"4\\n17\\n25\\n7\\n100\", \"sampleOutput\": \"17\\n25\"}, {\"id\": 103, \"title\": \"Разность максимального чётного и минимального нечётного\", \"condition\": \"В последовательности натуральных чисел найти разность между максимальным чётным числом и минимальным нечётным числом.\\nСначала вводится N (2 ≤ N ≤ 100), затем N чисел. Гарантируется, что есть и чётные, и нечётные числа.\", \"input\": \"Первая строка — N. Далее N натуральных чисел.\", \"solution\": \"n = int(input())\\nmaxi = -10**10\\nmini = 10**10\\nfor i in range(n):\\n    a = int(input())\\n    if a % 2 == 0:\\n        maxi = max(maxi, a)\\n    else:\\n        mini = min(mini, a)\\nprint(maxi - mini)\", \"hint\": \"Чётное и нечётное — два взаимоисключающих случая, удобно if … else.\\n1) Чётное число — обновляй максимум maxi.\\n2) Иначе (нечётное) — обновляй минимум mini.\\n3) Выведи одну разность maxi - mini (может получиться отрицательной).\", \"tests\": [{\"name\": \"Пример\", \"input\": \"4\\n10\\n3\\n8\\n7\", \"expected\": \"7\"}, {\"name\": \"Граничный случай\", \"input\": \"2\\n2\\n9\", \"expected\": \"-7\"}, {\"name\": \"Проверка отбора\", \"input\": \"5\\n100\\n1\\n50\\n99\\n3\", \"expected\": \"99\"}, {\"name\": \"Ещё один случай\", \"input\": \"3\\n13\\n12\\n11\", \"expected\": \"1\"}], \"simple\": \"print()\", \"body\": \"n = int(input())\\n# maxi = -10**10\\n# mini = 10**10\\n\\nfor i in range(n):\\n    a = int(input())\\n    if УСЛОВИЕ:\\n        # maxi = max(maxi, a)\\n    else:\\n        # mini = min(mini, a)\", \"mode\": \"simple\", \"conditional\": \"if УСЛОВИЕ_ВЫВОДА:\\n    print()\\nelse:\\n    print()\", \"note\": \"\", \"group\": \"hard\", \"rank\": 3, \"sampleInput\": \"4\\n10\\n3\\n8\\n7\", \"sampleOutput\": \"7\"}, {\"id\": 104, \"title\": \"Максимум, кратный 4, и сколько раз он встречается\", \"condition\": \"В последовательности натуральных чисел найти максимальное число, кратное 4, и количество таких максимальных чисел.\\nСначала вводится N (1 ≤ N ≤ 100), затем N чисел. Гарантируется, что хотя бы одно число кратно 4. Вывести два числа через пробел.\", \"input\": \"Первая строка — N. Далее N натуральных чисел.\", \"solution\": \"n = int(input())\\nmaxi = -10**10\\nkol = 0\\nfor i in range(n):\\n    a = int(input())\\n    if a % 4 == 0:\\n        if a > maxi:\\n            maxi = a\\n            kol = 1\\n        elif a == maxi:\\n            kol += 1\\nprint(maxi, kol)\", \"hint\": \"Новый приём: счётчик максимума.\\n1) Если подходящее число больше maxi — это новый максимум: maxi = a и kol = 1 (счёт начинается \n9\\n8\\n7\\n6\", \"expected\": \"0\"}, {\"name\": \"Ещё один случай\", \"input\": \"3\\n5\\n5\\n6\", \"expected\": \"1\"}], \"simple\": \"print()\", \"body\": \"n = int(input())\\n# kol = 0\\nprev = int(input())\\n\\nfor i in range(n - 1):\\n    a = int(input())\\n    if УСЛОВИЕ:\\n        # kol += 1\\n    # prev = a\", \"mode\": \"simple\", \"conditional\": \"if УСЛОВИЕ_ВЫВОДА:\\n    print()\\nelse:\\n    print()\", \"note\": \"\", \"group\": \"hard\", \"rank\": 5, \"sampleInput\": \"5\\n1\\n3\\n2\\n5\\n6\", \"sampleOutput\": \"3\"}, {\"id\": 106, \"title\": \"Произведение чисел, оканчивающихся на 2 в семеричной записи\", \"condition\": \"В последовательности натуральных чисел найти произведение чисел, запись которых в системе счисления с основанием 7 оканчивается цифрой 2. Если таких чисел нет, вывести NO.\\nСначала вводится N (1 ≤ N ≤ 20), затем N чисел, каждое не больше 100.\", \"input\": \"Первая строка — N. Далее N натуральных чисел.\", \"solution\": \"n = int(input())\\npr = 1\\nkol = 0\\nfor i in range(n):\\n    a = int(input())\\n    if a % 7 == 2:\\n        pr *= a\\n        kol += 1\\nif kol > 0:\\n    print(pr)\\nelse:\\n    print('NO')\", \"hint\": \"Последняя цифра в 7-ричной записи — это остаток a % 7.\\n1) Произведение начинается с pr = 1.\\n2) Чтобы понять, были ли подходящие числа, заведи счётчик kol.\\n3) Вывод с условием: если kol > 0 — печатай pr, иначе NO.\", \"tests\": [{\"name\": \"Пример\", \"input\": \"3\\n2\\n9\\n10\", \"expected\": \"18\"}, {\"name\": \"Граничный случай\", \"input\": \"2\\n1\\n3\", \"expected\": \"NO\"}, {\"name\": \"Проверка отбора\", \"input\": \"4\\n16\\n23\\n2\\n7\", \"expected\": \"736\"}, {\"name\": \"Ещё один случай\", \"input\": \"1\\n2\", \"expected\": \"2\"}], \"simple\": \"print()\", \"conditional\": \"if УСЛОВИЕ_ВЫВОДА:\\n    print()\\nelse:\\n    print()\", \"mode\": \"conditional\", \"body\": \"n = int(input())\\n# pr = 1\\n# kol = 0\\n\\nfor i in range(n):\\n    a = int(input())\\n    if УСЛОВИЕ:\\n        # pr *= a\\n        # kol += 1\", \"note\": \"\", \"group\": \"hard\", \"rank\": 6, \"sampleInput\": \"3\\n2\\n9\\n10\", \"sampleOutput\": \"18\"}, {\"id\": 107, \"title\": \"Двузначные числа с убывающими цифрами: количество и сумма\", \"condition\": \"Найти количество и сумму двузначных чисел, у которых цифра десятков больше цифры единиц.\\nКоличество чисел заранее неизвестно. Ввод заканчивается числом 0; завершающий 0 не входит в последовательность. Вывести два числа, каждое на своей строке.\", \"input\": \"Целые неотрицательные числа по одному. Последнее введённое число — 0.\", \"solution\": \"kol = 0\\ns = 0\\na = int(input())\\nwhile a != 0:\\n    if 10 <= a <= 99 and a // 10 > a % 10:\\n        kol += 1\\n        s += a\\n    a = int(input())\\nprint(kol)\\nprint(s)\", \"hint\": \"Цифры двузначного числа: десятки a // 10, единицы a % 10.\\n1) Условие составное: 10 <= a <= 99 and a // 10 > a % 10.\\n2) Для подходящих — kol += 1 и s += a.\\n3) Не забудь в конце цикла прочитать следующее число.\", \"tests\": [{\"name\": \"Пример\", \"input\": \"21\\n12\\n90\\n5\\n0\", \"expected\": \"2\\n111\"}, {\"name\": \"Граничный случай\", \"input\": \"0\", \"expected\": \"0\\n0\"}, {\"name\": \"Проверка отбора\", \"input\": \"11\\n33\\n98\\n320\\n0\", \"expected\": \"1\\n98\"}, {\"name\": \"Ещё один случай\", \"input\": \"54\\n10\\n0\", \"expected\": \"2\\n64\"}], \"simple\": \"print()\\nprint()\", \"body\": \"# kol = 0\\n# s = 0\\na = int(input())\\nwhile a != 0:\\n    if УСЛОВИЕ:\\n        # kol += 1\\n        # s += a\\n    a = int(input())\", \"mode\": \"simple\", \"conditional\": \"if УСЛОВИЕ_ВЫВОДА:\\n    print()\\nelse:\\n    print()\", \"note\": \"\", \"group\": \"hard\", \"rank\": 7, \"sampleInput\": \"21\\n12\\n90\\n5\\n0\", \"sampleOutput\": \"2\\n111\"}, {\"id\": 108, \"title\": \"Среднее чисел, кратных 3, но не кратных 9 (или NO)\", \"condition\": \"Найти среднее арифметическое чисел, которые делятся на 3, но не делятся на 9. Если таких чисел нет, вывести NO.\\nКоличество чисел заранее неизвестно. Ввод заканчивается числом 0. Среднее вывести с точностью до одного знака после запятой.\", \"input\": \"Натуральные числа по одному. Последнее введённое число — 0.\", \"solution\": \"s = 0\\nkol = 0\\na = int(input())\\nwhile a != 0:\\n    if a % 3 == 0 and a % 9 != 0:\\n        s += a\\n        kol += 1\\n    a = int(input())\\nif kol > 0:\\n    print(round(s / kol, 1))\\nelse:\\n    print('NO')\", \"hint\": \"1) Условие «делится на 3, но не на 9»: a % 3 == 0 and a % 9 != 0.\\n2) Для среднего нужны и сумма s, и количество kol.\\n3) Деление на ноль опасно — сначала проверь kol > 0.\", \"tests\": [{\"name\": \"Пример\", \"input\": \"3\\n9\\n6\\n0\", \"expected\": \"4.5\"}, {\"name\": \"Граничный случай\", \"input\": \"9\\n18\\n0\", \"expected\": \"NO\"}, {\"name\": \"Проверка отбора\", \"input\": \"12\\n15\\n21\\n27\\n0\", \"expected\": \"16.0\"}, {\"name\": \"Ещё один случай\", \"input\": \"0\", \"expected\": \"NO\"}], \"simple\": \"print()\", \"conditional\": \"if УСЛОВИЕ_ВЫВОДА:\\n    print()\\nelse:\\n    print()\", \"mode\": \"conditional\", \"body\": \"# s = 0\\n# kol = 0\\na = int(input())\\nwhile a != 0:\\n    if УСЛОВИЕ:\\n        # s += a\\n        # kol += 1\\n    a = int(input())\", \"note\": \"\", \"group\": \"hard\", \"rank\": 8, \"sampleInput\": \"3\\n9\\n6\\n0\", \"sampleOutput\": \"4.5\"}, {\"id\": 109, \"title\": \"Длина последовательности и количество «рекордов»\", \"condition\": \"Ученик вводит результаты прыжков (натуральные числа) до числа 0. «Рекорд» — результат, который больше всех предыдущих (первый результат тоже считается рекордом). Найти количество результатов и количество рекордов.\\nВывести два числа через запятую и пробел, например: 5, 3\", \"input\": \"Натуральные числа по одному. Последнее введённое число — 0.\", \"solution\": \"dlina = 0\\nkol = 0\\nmaxi = -10**10\\na = int(input())\\nwhile a != 0:\\n    dlina += 1\\n    if a > maxi:\\n        kol += 1\\n        maxi = a\\n    a = int(input())\\nprint(dlina, kol, sep=', ')\", \"hint\": \"Рекорд — это момент, когда обновляется максимум.\\n1) dlina += 1 для каждого числа (вне if).\\n2) Если a > maxi — это рекорд: kol += 1 и maxi = a.\\n3) Вывод одной строкой: print(dlina, kol, sep=', ').\", \"tests\": [{\"name\": \"Пример\", \"input\": \"3\\n5\\n4\\n8\\n0\", \"expected\": \"4, 3\"}, {\"name\": \"Граничный случай\", \"input\": \"7\\n0\", \"expected\": \"1, 1\"}, {\"name\": \"Проверка отбора\", \"input\": \"9\\n1\\n2\\n3\\n0\", \"expected\": \"4, 1\"}, {\"name\": \"Ещё один случай\", \"input\": \"1\\n2\\n3\\n0\", \"expected\": \"3, 3\"}], \"simple\": \"print()\", \"printInstruction\": \"Два результата выведи одной строкой через запятую: один print с двумя аргументами и sep=', '.\", \"outputLine\": \"comma\", \"body\": \"# dlina = 0\\n# kol = 0\\n# maxi = -10**10\\na = int(input())\\nwhile a != 0:\\n    # dlina += 1\\n    if УСЛОВИЕ:\\n        # kol += 1\\n        # maxi = a\\n    a = int(input())\", \"mode\": \"simple\", \"conditional\": \"if УСЛОВИЕ_ВЫВОДА:\\n    print()\\nelse:\\n    print()\", \"note\": \"\", \"group\": \"hard\", \"rank\": 9, \"sampleInput\": \"3\\n5\\n4\\n8\\n0\", \"sampleOutput\": \"4, 3\"}, {\"id\": 110, \"title\": \"Сумма положительных и произведение отрицательных\", \"condition\": \"Дана последовательность целых чисел, заканчивающаяся числом 0. Найти сумму положительных чисел и произведение отрицательных.\\nГарантируется, что есть хотя бы одно положительное и хотя бы одно отрицательное число, все числа по модулю не больше 10. Вывести два числа, каждое на своей строке.\", \"input\": \"Целые числа по одному. Последнее введённое число — 0.\", \"solution\": \"s = 0\\npr = 1\\na = int(input())\\nwhile a != 0:\\n    if a > 0:\\n        s += a\\n    if a < 0:\\n        pr *= a\\n    a = int(input())\\nprint(s)\\nprint(pr)\", \"hint\": \"1) Два условия: a > 0 — к сумме, a < 0 — к произведению.\\n2) Произведение начинается с 1, а не с 0.\\n3) Знак произведения сам получится правильным: минус на минус даёт плюс.\", \"tests\": [{\"name\": \"Пример\", \"input\": \"5\\n-2\\n3\\n-4\\n0\", \"expected\": \"8\\n8\"}, {\"name\": \"Граничный случай\", \"input\": \"1\\n-3\\n0\", \"expected\": \"1\\n-3\"}, {\"name\": \"Проверка отбора\", \"input\": \"-1\\n-1\\n-1\\n10\\n0\", \"expected\": \"10\\n-1\"}, {\"name\": \"Ещё один случай\", \"input\": \"2\\n2\\n-5\\n0\", \"expected\": \"4\\n-5\"}], \"simple\": \"print()\\nprint()\", \"body\": \"# s = 0\\n# pr = 1\\na = int(input())\\nwhile a != 0:\\n    if УСЛОВИЕ:\\n        # s += a\\n    if УСЛОВИЕ:\\n        # pr *= a\\n    a = int(input())\", \"mode\": \"simple\", \"conditional\": \"if УСЛОВИЕ_ВЫВОДА:\\n    print()\\nelse:\\n    print()\", \"note\": \"\", \"group\": \"hard\", \"rank\": 10, \"sampleInput\": \"5\\n-2\\n3\\n-4\\n0\", \"sampleOutput\": \"8\\n8\"}, {\"id\": 111, \"title\": \"Отрезок: кратные 3, но не кратные 5 — количество и сумма\", \"condition\": \"По двум натуральным числам a и b (a ≤ b) найти количество и сумму чисел отрезка [a; b], которые делятся на 3, но не делятся на 5. Если таких чисел нет, вывести NO.\\nВывести количество и сумму через пробел.\", \"input\": \"Два числа: сначала a, затем b.\", \"solution\": \"a = int(input())\\nb = int(input())\\nkol = 0\\ns = 0\\nfor a in range(a, b + 1):\\n    if a % 3 == 0 and a % 5 != 0:\\n        kol += 1\\n        s += a\\nif kol > 0:\\n    print(kol, s)\\nelse:\\n    print('NO')\", \"hint\": \"1) Перебор: for a in range(a, b + 1) — правая граница включена.\\n2) Составное условие: a % 3 == 0 and a % 5 != 0.\\n3) Если ничего не нашлось — NO; иначе print(kol, s).\", \"tests\": [{\"name\": \"Пример\", \"input\": \"1\\n15\", \"expected\": \"4 30\"}, {\"name\": \"Граничный случай\", \"input\": \"15\\n15\", \"expected\": \"NO\"}, {\"name\": \"Проверка отбора\", \"input\": \"10\\n20\", \"expected\": \"2 30\"}, {\"name\": \"Ещё один случай\", \"input\": \"3\\n3\", \"expected\": \"1 3\"}], \"simple\": \"print()\", \"conditional\": \"if УСЛОВИЕ_ВЫВОДА:\\n    print()\\nelse:\\n    print()\", \"mode\": \"conditional\", \"body\": \"a = int(input())\\nb = int(input())\\n# kol = 0\\n# s = 0\\n\\nfor a in range(a, b + 1):\\n    if УСЛОВИЕ:\\n        # kol += 1\\n        # s += a\", \"note\": \"\", \"group\": \"hard\", \"rank\": 11, \"sampleInput\": \"1\\n15\", \"sampleOutput\": \"4 30\"}, {\"id\": 112, \"title\": \"Наименьшее трёхзначное число с одинаковыми первой и последней цифрами\", \"condition\": \"В последовательности натуральных чисел найти наименьшее трёхзначное число, у которого первая цифра равна последней. Если таких чисел нет, вывести NO.\\nСначала вводится N (1 ≤ N ≤ 100), затем N чисел, каждое не больше 30 000.\", \"input\": \"Первая строка — N. Далее N натуральных чисел.\", \"solution\": \"n = int(input())\\nmini = 10**10\\nfor i in range(n):\\n    a = int(input())\\n    if 100 <= a <= 999 and a // 100 == a % 10:\\n        mini = min(mini, a)\\nif mini < 10**10:\\n    print(mini)\\nelse:\\n    print('NO')\", \"hint\": \"Первая цифра трёхзначного числа — a // 100, последняя — a % 10.\\n1) Условие: 100 <= a <= 999 and a // 100 == a % 10.\\n2) Обновляй mini = min(mini, a).\\n3) Если mini так и осталось 10**10 — подходящих не было, выводи NO.\", \"tests\": [{\"name\": \"Пример\", \"input\": \"4\\n121\\n303\\n44\\n2002\", \"expected\": \"121\"}, {\"name\": \"Граничный случай\", \"input\": \"2\\n123\\n55\", \"expected\": \"NO\"}, {\"name\": \"Проверка отбора\", \"input\": \"3\\n989\\n505\\n1001\", \"expected\": \"505\"}, {\"name\": \"Ещё один случай\", \"input\": \"1\\n111\", \"expected\": \"111\"}], \"simple\": \"print()\", \"conditional\": \"if УСЛОВИЕ_ВЫВОДА:\\n    print()\\nelse:\\n    print()\", \"mode\": \"conditional\", \"body\": \"n = int(input())\\n# mini = 10**10\\n\\nfor i in range(n):\\n    a = int(input())\\n    if УСЛОВИЕ:\\n        # mini = min(mini, a)\", \"note\": \"\", \"group\": \"hard\", \"rank\": 12, \"sampleInput\": \"4\\n121\\n303\\n44\\n2002\", \"sampleOutput\": \"121\"}, {\"id\": 113, \"title\": \"Среднее максимального и минимального среди чётных\", \"condition\": \"В последовательности натуральных чисел найти среднее арифметическое максимального и минимального из чётных чисел. Гарантируется, что хотя бы одно число чётное.\\nСначала вводится N (1 ≤ N ≤ 100), затем N чисел. Ответ вывести с одним знаком после запятой.\", \"input\": \"Первая строка — N. Далее N натуральных чисел.\", \"solution\": \"n = int(input())\\nmaxi = -10**10\\nmini = 10**10\\nfor i in range(n):\\n    a = int(input())\\n    if a % 2 == 0:\\n        maxi = max(maxi, a)\\n        mini = min(mini, a)\\nprint(round((maxi + mini) / 2, 1))\", \"hint\": \"1) Под одним условием a % 2 == 0 обновляй и maxi, и mini.\\n2) Среднее двух чисел: (maxi + mini) / 2 — скобки обязательны!\\n3) round(..., 1).\", \"tests\": [{\"name\": \"Пример\", \"input\": \"4\\n4\\n7\\n10\\n3\", \"expected\": \"7.0\"}, {\"name\": \"Граничный случай\", \"input\": \"1\\n6\", \"expected\": \"6.0\"}, {\"name\": \"Проверка отбора\", \"input\": \"5\\n2\\n3\\n8\\n9\\n5\", \"expected\": \"5.0\"}, {\"name\": \"Ещё один случай\", \"input\": \"3\\n12\\n15\\n13\", \"expected\": \"12.0\"}], \"simple\": \"print()\", \"body\": \"n = int(input())\\n# maxi = -10**10\\n# mini = 10**10\\n\\nfor i in range(n):\\n    a = int(input())\\n    if УСЛОВИЕ:\\n        # maxi = max(maxi, a)\\n        # mini = min(mini, a)\", \"mode\": \"simple\", \"conditional\": \"if УСЛОВИЕ_ВЫВОДА:\\n    print()\\nelse:\\n    print()\", \"note\": \"\", \"group\": \"hard\", \"rank\": 13, \"sampleInput\": \"4\\n4\\n7\\n10\\n3\", \"sampleOutput\": \"7.0\"}];\n\nconst EMBEDDED_MEMO_HTML = new TextDecoder().decode(Uint8Array.from(atob('PCFkb2N0eXBlIGh0bWw+CjxodG1sIGxhbmc9InJ1Ij4KPGhlYWQ+CjxtZXRhIGNoYXJzZXQ9InV0Zi04Ij4KPG1ldGEgbmFtZT0idmlld3BvcnQiIGNvbnRlbnQ9IndpZHRoPWRldmljZS13aWR0aCwgaW5pdGlhbC1zY2FsZT0xIj4KPHRpdGxlPtCf0LDQvNGP0YLQutCwIOKAlCDQvtCx0YDQsNCx0L7RgtC60LAg0YfQuNGB0LXQuzwvdGl0bGU+CjxzdHlsZT4KOnJvb3R7LS1pbms6IzFkMmMzYjstLW11dGVkOiM2MDczODY7LS1ibHVlOiMzODY4ZTg7LS10ZWF  function matrix(g){const N=g.nodes;return `<table><tr><th></th>${N.map(n=>`<th>${n}</th>`).join('')}</tr>${N.map(a=>`<tr><th>${a}</th>${N.map(b=>`<td>${a===b?'':(W(g,a,b)??'')}</td>`).join('')}</tr>`).join('')}</table>`}

(()=>{const ap=(o,x,b)=>{switch(o.t){case'add':return x+o.v;case'sub':return x-o.v;case'mul':return x*o.v;case'div':return x%o.v===0?x/o.v:NaN;case'sq':return x*x;case'delR':return x>=10?Math.floor(x/10):NaN;case'delL':{const s=String(x);return s.length>1?+s.slice(1):NaN}case'app':return x*10+o.v;case'addB':return x+b;case'subB':return x-b;case'mulB':return x*b;case'divB':return b&&x%b===0?x/b:NaN}};

 // символьное выполнение: многочлен от b, если нет деления на b

 const tasks=[];for(const d of D5){const mk=(x,k,i)=>{const id='5-'+d.sec+d.n+k+(i||'');let ans,alts;
