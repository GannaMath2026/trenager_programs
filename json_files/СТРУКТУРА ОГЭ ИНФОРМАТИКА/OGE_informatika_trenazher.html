<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ОГЭ · Информатика — тренажёр</title>
<style>
:root{--bg:#f4f6fb;--bg2:#eef1f8;--panel:#fff;--panel2:#f7f9fd;--ink:#16213a;--muted:#66748f;--line:#e2e7f1;--blue:#4f6bff;--blue2:#eef1ff;--ok:#16a06a;--okbg:#e6f7ef;--bad:#e2475b;--badbg:#fdecee;--warn:#f0a020;--warnbg:#fff4dc;--c:#4f6bff;--sh:0 1px 2px #16213a0d,0 8px 28px #16213a12;--r:18px;--fs:16px;--hand:"Comic Sans MS","Segoe Print","Bradley Hand","Marker Felt","Chalkboard SE",cursive;--mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace}
body.theme-dark{--bg:#0e1424;--bg2:#121a2e;--panel:#172036;--panel2:#1c2742;--ink:#e7ecf7;--muted:#97a5c2;--line:#2a3654;--blue2:#23305a;--okbg:#123a2c;--badbg:#45202a;--warnbg:#3f3216;--sh:0 1px 2px #0006,0 10px 30px #0007}
body.font-small{--fs:14px}body.font-medium{--fs:16px}body.font-large{--fs:18px}body.font-xlarge{--fs:21px}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font:var(--fs)/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(900px 500px at 0% -10%,#e5eaff 0,transparent 60%),radial-gradient(800px 600px at 110% 0%,#ffe9f3 0,transparent 55%),var(--bg);background-attachment:fixed;min-height:100vh}
body.theme-dark{background:radial-gradient(900px 500px at 0% -10%,#1d2a55 0,transparent 60%),radial-gradient(800px 600px at 110% 0%,#3a1d3a 0,transparent 55%),var(--bg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
/* header */
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:9px 18px;background:color-mix(in srgb,var(--panel) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;margin-right:auto;user-select:none}
.logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#4f6bff,#b84fff);color:#fff;font-weight:900;font-size:15px;box-shadow:0 4px 14px #4f6bff55}
.brand b{display:block;font-size:16px;line-height:1.1}.brand small{color:var(--muted);font-size:12px;font-weight:600}
.hbtn{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:7px 12px;font-size:14px;font-weight:650;cursor:pointer;white-space:nowrap;transition:.15s}
.hbtn:hover{border-color:var(--blue);color:var(--blue)}.hbtn.active{background:var(--ink);color:var(--panel);border-color:var(--ink)}.hbtn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.fonts{display:inline-flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--panel)}.fonts button{border:0;background:none;padding:7px 9px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}.fonts button.active{background:var(--blue);color:#fff}
/* generic */
.btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 15px;font-weight:650;cursor:pointer;transition:.15s;font-size:calc(var(--fs) - 1px)}
.btn:hover{border-color:var(--c);color:var(--c)}.btn.primary{background:var(--c);border-color:var(--c);color:#fff}.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.small{padding:5px 10px;font-size:13px;border-radius:9px}.btn:disabled{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:750;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.chip.c{background:color-mix(in srgb,var(--c) 14%,var(--panel));color:var(--c);border-color:transparent}.chip.ok{background:var(--okbg);color:var(--ok);border-color:transparent}.chip.bad{background:var(--badbg);color:var(--bad);border-color:transparent}.chip.warn{background:var(--warnbg);color:#b07000;border-color:transparent}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.mono{font-family:var(--mono)}
kbd{font-family:var(--mono);background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 5px;font-size:.9em}
/* home */
#home{max-width:1240px;margin:0 auto;padding:26px 20px 60px}
.hero{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between;margin-bottom:22px}
.hero h1{font-size:clamp(26px,3.4vw,40px);line-height:1.1;margin:0 0 6px;letter-spacing:-.02em}.hero h1 span{background:linear-gradient(90deg,#4f6bff,#c04fff 60%,#ff5f8f);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:var(--muted);max-width:620px}
.ring{--p:0;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--blue) calc(var(--p)*1%),var(--line) 0);position:relative}.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--panel)}.ring b{position:relative;font-size:20px}.ring small{position:relative;display:block;font-size:11px;color:var(--muted);text-align:center;margin-top:-6px}
.herostat{display:flex;gap:16px;align-items:center;padding:14px 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tile{position:relative;padding:16px 16px 14px;cursor:pointer;transition:.18s;overflow:hidden;min-height:150px;display:flex;flex-direction:column}
.tile::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--c);opacity:.09;transition:.25s}
.tile:hover{transform:translateY(-3px);box-shadow:0 2px 4px #16213a10,0 16px 36px #16213a1c}.tile:hover::after{opacity:.16;transform:scale(1.15)}
.tile .num{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:900;font-size:19px;color:#fff;background:var(--c);box-shadow:0 6px 16px color-mix(in srgb,var(--c) 45%,transparent)}
.tile h3{margin:10px 0 2px;font-size:calc(var(--fs) + 1px);line-height:1.25}.tile p{margin:0 0 10px;color:var(--muted);font-size:13px;flex:1}
.bar{height:7px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--c);border-radius:9px;transition:width .4s}
.tile .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;font-weight:650}
.tile.pc{opacity:.92}.tile.pc .num{background:repeating-linear-gradient(135deg,var(--c),var(--c) 6px,color-mix(in srgb,var(--c) 75%,#fff) 6px,color-mix(in srgb,var(--c) 75%,#fff) 12px)}
.sect-h{display:flex;align-items:baseline;gap:10px;margin:28px 0 12px}.sect-h h2{margin:0;font-size:20px}.sect-h span{color:var(--muted);font-size:13px}
/* module layout */
#mod{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;max-width:1500px;margin:0 auto;padding:16px 18px 50px}
#mod aside{position:sticky;top:70px;align-self:start;max-height:calc(100vh - 86px);overflow:auto;padding:14px}
.modhead{display:flex;gap:11px;align-items:center;margin-bottom:10px}.modhead .num{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:900;font-size:20px;color:#fff;background:var(--c);flex:none}
.modhead b{display:block;line-height:1.2}.modhead small{color:var(--muted);font-size:12px}
.back{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;margin-bottom:10px;border:0;background:none;padding:0}.back:hover{color:var(--c)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px;margin:10px 0}.tabs button{border:0;background:none;border-radius:8px;padding:5px 2px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}.tabs button.active{background:var(--panel);color:var(--c);box-shadow:0 1px 3px #0002}
.secttl{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:12px 4px 5px}
.ti{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:11px;cursor:pointer;border:1px solid transparent;font-size:calc(var(--fs) - 2px);line-height:1.3;margin:2px 0}
.ti:hover{background:var(--panel2)}.ti.active{background:color-mix(in srgb,var(--c) 11%,var(--panel));border-color:color-mix(in srgb,var(--c) 40%,transparent)}
.ti .st{width:22px;height:22px;flex:none;border-radius:7px;display:grid;place-items:center;font-size:12px;background:var(--panel2);border:1px solid var(--line);font-weight:800;color:var(--muted)}
.ti.ok .st{background:var(--ok);color:#fff;border-color:var(--ok)}.ti.bad .st{background:var(--badbg);color:var(--bad);border-color:transparent}.ti.hint .st{background:var(--warnbg);border-color:transparent}
.ti .tt{flex:1;min-width:0}.ti .tt small{display:block;color:var(--muted);font-size:11px}.ti.an{margin-left:16px}.ti.an::before{content:"↳";color:var(--muted);margin-right:-3px}
.ti .flags{display:flex;gap:2px}.ti .flags button{border:0;background:none;cursor:pointer;font-size:14px;padding:0 2px;opacity:.35;filter:grayscale(1)}.ti .flags button.on{opacity:1;filter:none}
main.work{min-width:0}
/* stickers */
.stickbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.board{display:flex;flex-wrap:wrap;gap:20px;padding:18px 8px 8px;margin-bottom:6px}.board.strip{flex-wrap:nowrap;overflow-x:auto;gap:16px;padding:16px 6px 12px;scroll-snap-type:x mandatory}.board.strip .sticker{flex:0 0 255px;font-size:calc(var(--fs) - 2px);padding:16px 13px 11px;scroll-snap-align:start}.board.strip .sticker h4{font-size:calc(var(--fs) + 1px)}
.sticker{--rot:-1.5deg;--sc:#fff6a8;position:relative;flex:1 1 230px;max-width:360px;background:var(--sc);color:#2b2a26;padding:20px 16px 14px;border-radius:3px 3px 14px 3px;box-shadow:0 1px 1px #0001,0 10px 18px -6px #0003;transform:rotate(var(--rot));transition:.2s;font-size:calc(var(--fs) - 1px);line-height:1.45}
.sticker:hover{transform:rotate(0) scale(1.02);z-index:2}
.sticker::before{content:"";position:absolute;top:-10px;left:50%;width:84px;height:22px;transform:translateX(-50%) rotate(-3deg);background:#ffffff8c;border:1px solid #0000000d;box-shadow:0 1px 2px #0001}
.sticker h4{font-family:var(--hand);font-size:calc(var(--fs) + 3px);margin:0 0 6px;line-height:1.2}
.sticker p{margin:5px 0}.sticker .big{font-family:var(--mono);font-weight:800;font-size:calc(var(--fs) + 2px);background:#ffffff7a;border-radius:8px;padding:3px 8px;display:inline-block;margin:2px 0}
.sticker code{font-family:var(--mono);background:#ffffff80;border-radius:5px;padding:0 4px}
.sticker .scrawl{font-family:var(--hand);color:#b4235a}
.sticker:nth-child(5n+1){--sc:#fff3a0;--rot:-1.6deg}.sticker:nth-child(5n+2){--sc:#ffd7e4;--rot:1.3deg}.sticker:nth-child(5n+3){--sc:#cdeffd;--rot:-.6deg}.sticker:nth-child(5n+4){--sc:#d4f5d0;--rot:1.8deg}.sticker:nth-child(5n+5){--sc:#ffe1c2;--rot:-1.1deg}
/* task */
.taskcard{padding:clamp(16px,2vw,26px)}
.thead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}.thead h2{margin:0 auto 0 0;font-size:calc(var(--fs) + 6px);letter-spacing:-.01em;line-height:1.2}
.repair{display:flex;gap:10px;align-items:center;background:var(--warnbg);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-weight:650}
.cond{background:var(--panel2);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;padding:14px 16px;margin:10px 0 14px;font-size:calc(var(--fs) + 1px)}
.cond .f{display:block;font-family:var(--mono);font-weight:800;font-size:calc(var(--fs) + 4px);margin:8px 0 2px;color:var(--c)}
.cond table{border-collapse:collapse;margin:8px 0;background:var(--panel)}.cond td,.cond th{border:1px solid var(--line);padding:5px 10px;text-align:center}.cond th{background:var(--panel2)}
.tool{border:1px dashed color-mix(in srgb,var(--c) 45%,var(--line));border-radius:16px;padding:12px 14px;margin:12px 0;background:color-mix(in srgb,var(--c) 3%,var(--panel))}
.tool>.tl{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--c);margin-bottom:8px}
.ansrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0 6px}
.ansrow input{flex:1;min-width:180px;max-width:360px;padding:11px 14px;border:2px solid var(--line);border-radius:13px;background:var(--panel);font-size:calc(var(--fs) + 3px);font-weight:800;outline:none;transition:.15s}.ansrow input:focus{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 18%,transparent)}
.fb{min-height:26px;font-weight:750;margin:6px 0}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.solved .cond{border-left-color:var(--ok)}
.hintbox{margin-top:10px}.step{display:flex;gap:11px;padding:10px 12px;border-radius:13px;background:var(--warnbg);margin:6px 0;animation:pop .3s}.step b.n{flex:none;width:24px;height:24px;border-radius:50%;background:#f0a020;color:#fff;display:grid;place-items:center;font-size:13px}
.step .h{font-weight:800;margin-bottom:2px}
@keyframes pop{from{transform:translateY(6px);opacity:0}}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
/* matrix/report */
#page{max-width:1300px;margin:0 auto;padding:20px}
.mtable{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:14px}
.mtable th,.mtable td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left}.mtable th{background:var(--panel2);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);position:sticky;top:57px}
.mtable td.c{text-align:center;cursor:pointer}.mtable tr.grp td{background:var(--panel2);font-weight:800}.mtable tr.sub td{font-size:13px}
/* modal */
.overlay{position:fixed;inset:0;z-index:60;background:#0e1424a8;display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto;backdrop-filter:blur(3px)}
.modal{background:var(--panel);border-radius:20px;box-shadow:0 30px 80px #0006;width:min(1000px,100%);padding:20px 22px;position:relative}
.modal .x{position:absolute;right:14px;top:12px}
dialog{border:0;border-radius:20px;padding:20px;width:min(560px,94vw);background:var(--panel);color:var(--ink);box-shadow:0 30px 80px #0006}dialog::backdrop{background:#0e1424a8;backdrop-filter:blur(3px)}
.sturow{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:6px;margin:5px 0}.sturow.cur{border-color:var(--blue);background:var(--blue2)}.sturow .pick{flex:1;text-align:left;font-weight:700;border:0;background:none;cursor:pointer;padding:6px}.sturow small{color:var(--muted);white-space:nowrap}
.stuadd{display:flex;gap:6px;margin-top:10px}.stuadd input{flex:1;padding:9px 12px;border-radius:11px;border:1px solid var(--line);background:var(--bg)}
iframe.t16{width:100%;height:calc(100vh - 84px);border:0;border-radius:18px;background:var(--panel);box-shadow:var(--sh)}
@media(max-width:900px){#mod{grid-template-columns:1fr}#mod aside{position:static;max-height:300px}header{flex-wrap:wrap}.brand small{display:none}}
@media print{header,#mod aside,.navrow,.noprint{display:none!important}body{background:#fff}.overlay{position:static;background:none;padding:0}.modal{box-shadow:none;width:100%}body.printing>*:not(.overlay){display:none!important}}
/* module-specific */
.tiles{display:flex;flex-wrap:wrap;gap:3px;align-items:flex-end;user-select:none}
.ch{font-family:var(--mono);font-weight:800;font-size:calc(var(--fs) + 6px);min-width:1.05em;text-align:center;padding:4px 0;border-radius:6px}
.cut{width:12px;align-self:stretch;cursor:pointer;position:relative;border-radius:4px}.cut:hover{background:color-mix(in srgb,var(--c) 18%,transparent)}.cut.on::after{content:"";position:absolute;left:5px;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--c)}
.seg{display:inline-flex;flex-direction:column;align-items:center;border-radius:10px;padding:2px 3px;transition:.15s}.seg .lt{font-weight:900;font-size:calc(var(--fs) + 2px);height:1.5em}.seg.good{background:var(--okbg)}.seg.good .lt{color:var(--ok)}.seg.badseg{background:var(--badbg)}.seg.badseg .lt{color:var(--bad)}
.codetab{border-collapse:collapse;background:var(--panel)}.codetab td,.codetab th{border:1px solid var(--line);padding:4px 10px;text-align:center;font-family:var(--mono);font-weight:700}.codetab th{background:var(--panel2);font-family:inherit}
.cards{display:flex;flex-wrap:wrap;gap:7px}.fcard{border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:6px 11px;cursor:pointer;font-family:var(--mono);font-weight:800;transition:.12s;display:inline-flex;gap:7px;align-items:baseline}.fcard small{font-family:system-ui;color:var(--c);font-weight:900}.fcard:hover{border-color:var(--c);transform:translateY(-2px)}.fcard.used{opacity:.4}
.assembled{min-height:52px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:8px 0;background:var(--panel)}
.piece{background:color-mix(in srgb,var(--c) 14%,var(--panel));border-radius:9px;padding:4px 8px;font-family:var(--mono);font-weight:800;cursor:pointer;display:inline-flex;gap:5px;align-items:baseline}.piece small{color:var(--c);font-family:system-ui;font-weight:900}.piece:hover{background:var(--badbg)}
.addrline{font-family:var(--mono);font-size:calc(var(--fs) + 4px);font-weight:800;word-break:break-all}
.codebox{font-family:var(--mono);background:#0f1730;color:#e5ecff;border-radius:14px;padding:12px 16px;white-space:pre;overflow:auto;font-size:calc(var(--fs));line-height:1.6}
.codebox .k{color:#8fb0ff;font-weight:700}.codebox .s{color:#9be59b}.codebox .n{color:#ffc76b}
.pairs{display:flex;flex-wrap:wrap;gap:6px}.pair{border:2px solid var(--line);border-radius:11px;padding:4px 10px;font-family:var(--mono);font-weight:800;cursor:pointer;background:var(--panel);user-select:none}.pair.y{border-color:var(--ok);background:var(--okbg)}.pair.n{border-color:var(--bad);background:var(--badbg);text-decoration:line-through}
.ttab{border-collapse:collapse;font-size:14px}.ttab td,.ttab th{border:1px solid var(--line);padding:4px 9px;text-align:center}.ttab th{background:var(--panel2)}.T{color:var(--ok);font-weight:900}.F{color:var(--bad);font-weight:900}
.xchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.xchip{border-radius:8px;padding:2px 8px;font-family:var(--mono);font-weight:800;font-size:13px}.xchip.t{background:var(--okbg);color:var(--ok)}.xchip.f{background:var(--badbg);color:var(--bad)}
.screen{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.lcd{font-family:var(--mono);font-size:calc(var(--fs) + 22px);font-weight:900;color:var(--c);background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:4px 18px;min-width:120px;text-align:center}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin:8px 0}.cv{background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:3px 10px;font-family:var(--mono);font-weight:800}.cv.fin{background:var(--okbg);border-color:var(--ok)}.cv.goal{background:var(--warnbg);border-color:var(--warn)}.arw{display:inline-flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);line-height:1.1;margin:0 2px}.arw b{color:var(--c);font-size:11px}
.cmdbtn{border:2px solid var(--c);background:var(--panel);color:var(--c);border-radius:13px;padding:9px 14px;font-weight:800;cursor:pointer}.cmdbtn:hover{background:color-mix(in srgb,var(--c) 10%,var(--panel))}.cmdbtn .k{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--c);color:#fff;margin-right:6px;font-size:13px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:800px){.split{grid-template-columns:1fr}}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}.pane h5{margin:0 0 6px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.slide{display:flex;align-items:center;gap:10px}.slide input[type=range]{flex:1;accent-color:var(--c)}
svg text{font-family:system-ui,Arial,sans-serif}
.gnode{cursor:pointer}.gnode circle{fill:var(--panel);stroke:var(--ink);stroke-width:2.5}.gnode text{fill:var(--ink);font-weight:800;font-size:17px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.gnode.on circle{fill:var(--c);stroke:var(--c)}.gnode.on text{fill:#fff}.gnode.av circle{stroke-dasharray:4 3;opacity:.5}
.gedge{stroke:var(--muted);stroke-width:2.6}.gedge.on{stroke:var(--c);stroke-width:5}
.gw rect{fill:var(--panel);stroke:var(--line)}.gw text{font-size:14px;font-weight:800;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.vin{width:44px;padding:3px;border-radius:8px;border:2px solid var(--line);text-align:center;font-weight:800;background:var(--panel)}.vin.ok{border-color:var(--ok);background:var(--okbg)}.vin.badv{border-color:var(--bad);background:var(--badbg)}
.ladder{font-family:var(--mono);font-size:calc(var(--fs) + 2px)}
.lad td{padding:2px 10px;font-family:var(--mono);font-weight:700}.lad .q{border-left:2px solid var(--ink);border-bottom:2px solid var(--ink)}.lad .r{color:var(--ok);font-weight:900}
.bitcell{display:inline-flex;flex-direction:column;align-items:center;border:2px solid var(--line);border-radius:12px;padding:6px 10px;margin:3px;min-width:58px;background:var(--panel)}.bitcell b{font-family:var(--mono);font-size:calc(var(--fs) + 8px);color:var(--c)}.bitcell small{font-family:var(--mono);color:var(--muted)}.bitcell.on{border-color:var(--ok);background:var(--okbg)}
.euler{position:relative;display:inline-block}.euler canvas{width:340px;height:300px;border-radius:14px;border:1px solid var(--line);background:var(--panel)}.euler input{position:absolute;width:54px;transform:translate(-50%,-50%);text-align:center;border:1.5px solid #0003;border-radius:8px;background:#ffffffd9;font-weight:800;font-size:13px;padding:2px;color:#16213a}

<dialog id="stuModal"><h2 style="margin-top:0">Кто занимается?</h2><div style="font-size:13px;color:var(--muted);margin-bottom:8px">У каждого ученика свои ответы, отметки, ДЗ и избранное. Всё хранится в браузере; 💾 сохраняет файл вместе с прогрессом всех учеников.</div><div id="stuList"></div><div class="stuadd"><input id="stuNew" placeholder="Имя нового ученика" maxlength="40"><button class="btn primary" id="stuAdd">Добавить</button></div><div style="text-align:right;margin-top:12px"><button class="btn" id="stuClose">Готово</button></div></dialog>
<script>
const T1=[{"id": 1, "title": "01 Прототип: вычёркивание (КОИ-8)", "type": "task", "answer": "Москва", "text": "В кодировке КОИ-8 каждый символ кодируется 8 битами. Андрей написал текст (в нем нет лишних пробелов):\n«Обы, Лена, Волга, Москва, Макензи, Амазонка — реки».\nУченик вычеркнул из списка название одной из рек. Заодно он вычеркнул ставшие лишними запятые и пробелы — два пробела не должны идти подряд.\nПри этом размер нового предложения в данной кодировке оказался на 8 байтов меньше, чем размер исходного предложения.\nНапишите в ответе вычеркнутое название реки.", "hint": "1) 8 бит = 1 байт. Уменьшилось на 8 байт = 8 символов.\n2) Вычеркнуто: слово + запятая (1) + пробел (1).\n3) Длина слова + 2 = 8. Длина слова = 6.\n4) Ищем реку из 6 букв."}, {"id": 2, "title": "02 Прототип: добавление (Windows-1251)", "type": "task", "answer": "скользя", "text": "В кодировке Windows-1251 каждый символ кодируется 8 битами. Вова хотел написать текст:\n«Скользя по утреннему снегу, Друг милый, предадимся бегу Нетерпеливого коня И навестим поля пустые…»\nОдно из слов ученик написал два раза подряд, поставив между одинаковыми словами один пробел.\nПри этом размер написанного предложения в данной кодировке оказался на 8 байт больше, чем размер нужного предложения.\nНапишите в ответе лишнее слово.", "hint": "1) 8 бит = 1 байт. Увеличилось на 8 байт = 8 символов.\n2) Добавлено: слово + 1 пробел.\n3) Длина слова + 1 = 8. Длина слова = 7."}, {"id": 3, "title": "03 Прототип: вычёркивание (Unicode 16 бит)", "type": "task", "answer": "тюлень", "text": "В одной из кодировок Unicode каждый символ кодируется 16 битами. Вова написал текст:\n«еж, лев, слон, олень, тюлень, носорог, крокодил, аллигатор — дикие животные».\nУченик вычеркнул из списка название одного из животных. Заодно он вычеркнул ставшие лишними запятые и пробелы.\nПри этом размер нового предложения оказался на 16 байт меньше, чем размер исходного.\nНапишите в ответе вычеркнутое название животного.", "hint": "1) 16 бит = 2 байта. Уменьшилось на 16 байт = 8 символов.\n2) Вычеркнуто: слово + запятая + пробел.\n3) Длина слова + 2 = 8. Длина слова = 6."}, {"id": 4, "title": "04 Прототип: добавление с запятой (Unicode 16 бит)", "type": "task", "answer": "Ом", "text": "В одной из кодировок Unicode каждый символ кодируется 16 битами. Вова написал текст:\n«Ом, Бор, Кюри, Попов, Джоуль, Рентген, Курчатов, Резерфорд — великие физики».\nФамилию одного ученого ученик написал два раза подряд, добавив необходимые запятую и пробел.\nПри этом размер написанного предложения оказался на 8 байт больше, чем размер нужного.\nНапишите в ответе слово, использованное дважды.", "hint": "1) 16 бит = 2 байта. Увеличилось на 8 байт = 4 символа.\n2) Добавлено: слово + запятая + пробел.\n3) Длина слова + 2 = 4. Длина слова = 2."}, {"id": 5, "title": "05 Прототип: вычёркивание (UTF-32)", "type": "task", "answer": "Гуарана", "text": "В кодировке UTF-32 каждый символ кодируется 32 битами. Миша написал текст:\n«Айва, Алыча, Генипа, Гуарана, Курбарил, Мангостан — фрукты».\nУченик вычеркнул название одного фрукта. Заодно вычеркнул лишние запятые и пробелы.\nРазмер нового предложения оказался на 36 байтов меньше исходного.\nНапишите в ответе вычеркнутое название фрукта.", "hint": "1) 32 бита = 4 байта. Уменьшилось на 36 байт = 9 символов.\n2) Вычеркнуто: слово + запятая + пробел.\n3) Длина слова + 2 = 9. Длина слова = 7."}, {"id": 6, "title": "06 Прототип: объём рассказа (Windows, 8 бит)", "type": "task", "answer": "15", "text": "Рассказ, набранный на компьютере, содержит 8 страниц, на каждой странице 40 строк, в каждой строке 48 символов.\nОпределите информационный объем рассказа в Кбайтах в кодировке Windows, в которой каждый символ кодируется 8 бит.", "hint": "1) 8 бит = 1 байт.\n2) Символов: 8 * 40 * 48 = 15360.\n3) Объем в байтах: 15360 * 1 = 15360.\n4) В Кбайтах: 15360 / 1024 = 15."}, {"id": 7, "title": "07 Прототип: объём статьи (Unicode, 2 байта)", "type": "task", "answer": "75", "text": "Статья, набранная на компьютере, содержит 20 страниц, на каждой странице 40 строк, в каждой строке 48 символов.\nВ одном из представлений Unicode каждый символ кодируется двумя байтами.\nОпределите информационный объем статьи в Кбайтах, округлив результат до целого числа.", "hint": "1) 1 символ = 2 байта.\n2) Символов: 20 * 40 * 48 = 38400.\n3) Объем в байтах: 38400 * 2 = 76800.\n4) В Кбайтах: 76800 / 1024 = 75."}, {"id": 8, "title": "08 Прототип: объём предложения (Unicode, 16 бит)", "type": "task", "answer": "84", "text": "В одной из кодировок Unicode каждый символ кодируется 16 битами.\nОпределите размер в байтах следующего предложения:\nСлух обо мне пройдет по всей Руси великой.", "hint": "1) 16 бит = 2 байта.\n2) Считаем символы (включая пробелы и точку):\nСлух(4) пробел(1) обо(3) пробел(1) мне(3) пробел(1) пройдет(7) пробел(1) по(2) пробел(1) всей(4) пробел(1) Руси(4) пробел(1) великой(7) точка(1) = 42 символа.\n3) Объем: 42 * 2 = 84 байта."}, {"id": 9, "title": "01 Аналог: вычёркивание (КОИ-8)", "type": "task", "answer": "Haskell", "text": "В кодировке КОИ-8 каждый символ кодируется 8 битами. Андрей написал текст:\n«C, Cg, Cat, Ruby, Swift, Delphi, Haskell — языки программирования».\nУченик вычеркнул из списка название одного из языков. Заодно он вычеркнул ставшие лишними запятые и пробелы.\nПри этом размер нового предложения в данной кодировке оказался на 9 байт меньше, чем размер исходного.\nНапишите в ответе вычеркнутое название языка программирования.", "hint": "1) 8 бит = 1 байт. Уменьшилось на 9 байт = 9 символов.\n2) Вычеркнуто: слово + запятая + пробел.\n3) Длина слова + 2 = 9. Длина слова = 7.\n4) Ищем язык из 7 букв."}, {"id": 10, "title": "02 Аналог: добавление (Unicode 16 бит)", "type": "task", "answer": "пустые", "text": "В одной из кодировок Unicode каждый символ кодируется 16 битами. Вова хотел написать текст:\n«Скользя по утреннему снегу, Друг милый, предадимся бегу Нетерпеливого коня И навестим поля пустые…»\nОдно из слов ученик написал два раза подряд, поставив между одинаковыми словами один пробел.\nПри этом размер написанного предложения в данной кодировке оказался на 14 байт больше, чем размер нужного.\nНапишите в ответе лишнее слово.", "hint": "1) 16 бит = 2 байта. Увеличилось на 14 байт = 7 символов.\n2) Добавлено: слово + 1 пробел.\n3) Длина слова + 1 = 7. Длина слова = 6."}, {"id": 11, "title": "03 Аналог: вычёркивание (Unicode 16 бит)", "type": "task", "answer": "лиственница", "text": "В одной из кодировок Unicode каждый символ кодируется 16 битами. Петя написал текст:\n«Ель, кедр, сосна, кипарис, лиственница, можжевельник — хвойные растения».\nУченик вычеркнул из списка название одного из растений. Заодно он вычеркнул ставшие лишними запятые и пробелы.\nПри этом размер нового предложения оказался на 26 байт меньше, чем размер исходного.\nНапишите в ответе вычеркнутое название хвойного растения.", "hint": "1) 16 бит = 2 байта. Уменьшилось на 26 байт = 13 символов.\n2) Вычеркнуто: слово + запятая + пробел.\n3) Длина слова + 2 = 13. Длина слова = 11."}, {"id": 12, "title": "04 Аналог: добавление с запятой (Unicode 16 бит)", "type": "task", "answer": "Ом", "text": "В одной из кодировок Unicode каждый символ кодируется 16 битами. Вова написал текст:\n«Пушкин, Гоголь, Толстой, Чехов, Достоевский, Есенин, Ом — великие люди».\nФамилию одного человека ученик написал два раза подряд, добавив необходимые запятую и пробел.\nПри этом размер написанного предложения оказался на 8 байт больше, чем размер нужного.\nНапишите в ответе слово, использованное дважды.", "hint": "1) 16 бит = 2 байта. Увеличилось на 8 байт = 4 символа.\n2) Добавлено: слово + запятая + пробел.\n3) Длина слова + 2 = 4. Длина слова = 2."}, {"id": 13, "title": "05 Аналог: вычёркивание (UTF-32)", "type": "task", "answer": "койот", "text": "В кодировке UTF-32 каждый символ кодируется 32 битами. Миша написал текст:\n«Волк, лиса, заяц, барсук, енот, койот, рысь, медведь — дикие животные».\nУченик вычеркнул название одного животного. Заодно вычеркнул лишние запятые и пробелы.\nРазмер нового предложения оказался на 28 байтов меньше исходного.\nНапишите в ответе вычеркнутое название животного.", "hint": "1) 32 бита = 4 байта. Уменьшилось на 28 байт. При весе 4 байта на символ исчезло 7 символов.\n2) Вычеркнуто: слово + запятая + пробел.\n3) Длина слова + 2 = 7. Длина слова = 5."}, {"id": 14, "title": "06 Аналог: объём рассказа (Unicode, 16 бит)", "type": "task", "answer": "8", "text": "Рассказ, набранный на компьютере, содержит 2 страницы, на каждой странице 32 строки, в каждой строке 64 символа.\nОпределите информационный объем рассказа в Кбайтах в одной из кодировок Unicode, в которой каждый символ кодируется 16 бит.", "hint": "1) 16 бит = 2 байта.\n2) Символов: 2 * 32 * 64 = 4096.\n3) Объем в байтах: 4096 * 2 = 8192.\n4) В Кбайтах: 8192 / 1024 = 8."}, {"id": 15, "title": "07 Аналог: объём статьи (Unicode, 2 байта)", "type": "task", "answer": "44", "text": "Статья, набранная на компьютере, содержит 15 страниц, на каждой странице 30 строк, в каждой строке 50 символов.\nВ одном из представлений Unicode каждый символ кодируется двумя байтами.\nОпределите информационный объем статьи в Кбайтах, округлив результат до целого числа.", "hint": "1) 1 символ = 2 байта.\n2) Символов: 15 * 30 * 50 = 22500.\n3) Объем в байтах: 22500 * 2 = 45000.\n4) В Кбайтах: 45000 / 1024 = 43.94... (округляем до 44)."}, {"id": 16, "title": "08 Аналог: объём предложения (Unicode 16 бит)", "type": "task", "answer": "104", "text": "В одной из кодировок Unicode каждый символ кодируется 16 битами.\nОпределите размер в байтах следующего предложения:\nЯ к вам пишу — чего же боле? Что я могу еще сказать?", "hint": "1) 16 бит = 2 байта.\n2) Считаем все 52 символа, включая пробелы, знаки препинания и тире.\n3) Объем: 52 * 2 = 104 байта."}, {"id": 17, "title": "01 Закрепление 2: вычёркивание (КОИ-8)", "type": "task", "answer": "Delphi", "text": "В кодировке КОИ-8 каждый символ кодируется 8 битами. В списке языков программирования записаны: «C, Go, Perl, Java, Delphi, Swift, Rust».\nУченик вычеркнул один язык и ставшие лишними запятую и пробел. Размер текста уменьшился на 8 байт.\nНапишите название вычеркнутого языка.", "hint": "1) 8 бит = 1 байт, значит исчезло 8 символов. 2) Удаляется слово, запятая и пробел. 3) Длина слова = 8 − 2 = 6."}, {"id": 18, "title": "02 Закрепление 2: добавление (Unicode 16 бит)", "type": "task", "answer": "утреннему", "text": "В Unicode каждый символ кодируется 16 битами. В предложении «Скользя по утреннему снегу, друг милый, предадимся бегу» одно слово повторили подряд, разделив пробелом. Размер увеличился на 20 байт.\nКакое слово повторили?", "hint": "1) 16 бит = 2 байта. 20 байт = 10 символов. 2) Добавлено слово и пробел. 3) Длина слова = 10 − 1 = 9."}, {"id": 19, "title": "03 Закрепление 2: вычёркивание (Unicode 16 бит)", "type": "task", "answer": "можжевельник", "text": "В Unicode каждый символ кодируется 16 битами. В списке растений: «ель, кедр, сосна, кипарис, можжевельник, лиственница».\nОдно название вычеркнули вместе с лишними запятой и пробелом. Размер уменьшился на 28 байт.\nНапишите вычеркнутое растение.", "hint": "1) 28 байт при 2 байтах на символ — 14 символов. 2) На запятую и пробел приходится 2 символа. 3) Длина слова = 12."}, {"id": 20, "title": "04 Закрепление 2: добавление с запятой (Unicode 16 бит)", "type": "task", "answer": "Ия", "text": "В Unicode каждый символ кодируется 16 битами. В списке имён «Аня, Ия, Лев, Оля, Ева» одно имя повторили как новый элемент списка, добавив запятую и пробел. Размер увеличился на 8 байт.\nКакое имя повторили?", "hint": "1) 8 байт = 4 символа. 2) Добавлены слово, запятая и пробел: длина + 2. 3) Длина слова = 2."}, {"id": 21, "title": "05 Закрепление 2: вычёркивание (UTF-32)", "type": "task", "answer": "барсук", "text": "В UTF-32 каждый символ кодируется 32 битами. В списке животных «волк, лиса, заяц, барсук, енот, койот» вычеркнули одно название и лишние запятую с пробелом. Размер уменьшился на 32 байта.\nКакое животное вычеркнули?", "hint": "1) 32 бита = 4 байта. 2) 32 байта = 8 символов. 3) Длина слова = 8 − 2 = 6."}, {"id": 22, "title": "06 Закрепление 2: объём страниц", "type": "task", "answer": "10", "text": "Документ содержит 2 страницы, на каждой 40 строк, в каждой строке 64 символа. Каждый символ кодируется 16 битами.\nОпределите объём документа в Кбайтах.", "hint": "1) Символов: 2 × 40 × 64 = 5120. 2) По 2 байта: 10240 байт. 3) 10240 ÷ 1024 = 10 Кбайт."}, {"id": 23, "title": "07 Закрепление 2: объём статьи", "type": "task", "answer": "30", "text": "Статья содержит 10 страниц, на каждой странице 24 строки, в каждой строке 64 символа. Каждый символ занимает 2 байта.\nОпределите информационный объём статьи в Кбайтах.", "hint": "1) Символов: 10 × 24 × 64 = 15360. 2) Объём: 15360 × 2 = 30720 байт. 3) 30720 ÷ 1024 = 30 Кбайт."}, {"id": 24, "title": "08 Закрепление 2: объём сообщения", "type": "task", "answer": "70", "text": "В Unicode каждый символ кодируется 16 битами. Определите объём сообщения в байтах:\n«Ученье — свет, а неученье — тьма!»", "hint": "1) Посчитайте все 35 символов, включая кавычки, пробелы, тире и знаки препинания. 2) 35 × 2 = 70 байт."}];

const T4=[{"id": 25, "title": "01 Прототип — кратчайший путь A–E", "type": "graph", "answer": "6", "text": "Между населёнными пунктами A, B, C, D, E построены дороги. Их протяжённость (в километрах) указана в таблице. Определите длину кратчайшего пути между пунктами A и E. Передвигаться можно только по дорогам, указанным в таблице.", "graph": {"nodes": ["A", "B", "C", "D", "E"], "edges": [["A", "B", 1], ["B", "C", 2], ["B", "D", 2], ["B", "E", 7], ["C", "E", 3], ["D", "E", 4]], "start": "A", "end": "E", "via": null, "avoid": null, "simpleVertices": false, "eachRoadOnce": false}}, {"id": 26, "title": "02 Прототип — кратчайший путь A–F", "type": "graph", "answer": "6", "text": "Между населёнными пунктами A, B, C, D, E, F построены дороги. Их протяжённость указана в таблице. Определите длину кратчайшего пути между пунктами A и F. Передвигаться можно только по дорогам, указанным в таблице.", "graph": {"nodes": ["A", "B", "C", "D", "E", "F"], "edges": [["A", "B", 2], ["A", "C", 5], ["A", "F", 9], ["B", "C", 2], ["B", "D", 1], ["B", "F", 5], ["C", "E", 1], ["E", "F", 1]], "start": "A", "end": "F", "via": null, "avoid": null, "simpleVertices": false, "eachRoadOnce": false}}, {"id": 27, "title": "03 Прототип — путь через C", "type": "graph", "answer": "15", "text": "Между населёнными пунктами A, B, C, D, E построены дороги. Их протяжённость (в километрах) указана в таблице. Определите длину кратчайшего пути между пунктами A и E, проходящего через пункт C. Передвигаться можно только по дорогам, указанным в таблице. Дважды передвигаться по любой из дорог нельзя.", "graph": {"nodes": ["A", "B", "C", "D", "E"], "edges": [["A", "B", 2], ["A", "C", 9], ["A", "D", 4], ["B", "C", 3], ["B", "E", 5], ["C", "D", 6], ["C", "E", 10], ["D", "E", 8]], "start": "A", "end": "E", "via": "C", "avoid": null, "simpleVertices": false, "eachRoadOnce": true}}, {"id": 28, "title": "04 Прототип — путь A–B через D", "type": "graph", "answer": "3", "text": "Между населёнными пунктами A, B, C, D, E пос n<script>\nconst TASKS = [{\"id\": 3, \"group\": \"for\", \"rank\": 1, \"title\": \"Количество чисел, кратных 4\", \"condition\": \"В последовательности натуральных чисел определить количество чисел, кратных 4.\\nСначала вводится N, затем N чисел. Гарантируется, что хотя бы одно число кратно 4.\", \"input\": \"Первая строка — N. Далее N натуральных чисел.\", \"sampleInput\": \"3\\n16\\n26\\n24\", \"sampleOutput\": \"2\", \"body\": \"n = int(input())\\nkol = 0\\ns = 0\\npr = 1\\nmaxi = -10**10\\nmini = 10**10\\n\\nfor i in range(n):\\n    a = int(input())\\n    if УСЛОВИЕ:\\n        kol += 1\\n        s += a\\n        pr *= a\\n        maxi = max(maxi, a)\\n        mini = min(mini, a)\", \"simple\": \"print(kol)\", \"conditional\": \"if УСЛОВИЕ_ВЫВОДА:\\n    print(ЕСЛИ_ДА)\\nelse:\\n    print(ЕСЛИ_НЕТ)\", \"mode\": \"simple\", \"note\": \"Нужен только счётчик kol. Остальные заготовленные переменные и обновления можно отключить крестиком.\", \"solution\": \"n = int(input())\\nkol = 0\\nfor i in range(n):\\n    a = int(input())\\n    if a % 4 == 0:\\n        kol += 1\\nprint(kol)\", \"hint\": \"1) Перед циклом создай kol = 0 — счётчик подходящих чисел.\\n2) Внутри цикла проверяй кратность 4: остаток от деления на 4 равен нулю.\\n3) Только внутри if увеличивай kol на 1. Сумма, произведение, максимум и минимум здесь не нужны.\\n4) В конце выведи kol одной командой print().\", \"tests\": [{\"name\": \"Граничный случай\", \"input\": \"1\\n4\", \"expected\": \"1\"}, {\"name\": \"Дополнительный случай\", \"input\": \"4\\n4\\n8\\n12\\n16\", \"expected\": \"4\"}, {\"name\": \"Проверка отбора\", \"input\": \"5\\n1\\n2\\n4\\n7\\n9\", \"expected\": \"1\"}]}, {\"id\": 5, \"group\": \"for\", \"rank\": 2, \"title\": \"Количество чисел, оканчивающихся на 3\", \"condition\": \"В последовательности натуральных чисел определить количество чисел, оканчивающихся на 3.\\nСначала вводится N, затем N чисел. Гарантируется, что хотя бы одно число оканчивается на 3.\", \"input\": \"Первая строка — N. Далее N натуральных чисел.\", \"sampleInput\": \"3\\n13\\n23\\n24\", \"sampleOutput\": \"2\", \"body\": \"n = int(input())\\nkol = 0\\ns = 0\\npr = 1\\nmaxi = -10**10\\nmini = 10**10\\n\\nfor i in range(n):\\n    a = int(input())\\n    if УСЛОВИЕ:\\n        kol += 1\\n        s += a\\n        pr *= a\\n        maxi = max(maxi, a)\\n        mini = min(mini, a)\", \"simple\": \"print(kol)\", \"conditional\": \"if УСЛОВИЕ_ВЫВОДА:\\n    print(ЕСЛИ_ДА)\\nelse:\\n    print(ЕСЛИ_НЕТ)\", \"mode\": \"simple\", \"note\": \"\", \"solution\": \"n = int(input())\\nkol = 0\\nfor i in range(n):\\n    a = int(input())\\n    if a % 10 == 3:\\n        kol += 1\\nprint(kol)\", \"hint\": \"1) Перед циклом создай kol = 0.\\n2) Для каждого числа a проверь последнюю десятичную цифру: остаток от деления на 10 равен 3.\\n3) Если условие верно, увеличь kol на 1. Не прибавляй к счётчику само число.\\n4) В конце выведи kol.\", \"tests\": [{\"name\": \"Граничный случай\", \"input\": \"1\\n13\", \"expected\": \"1\"}, {\"name\": \"Дополнительный случай\", \"input\": \"4\\n13\\n23\\n30\\n3\", \"expected\": \"3\"}, {\"name\": \"Проверка отбора\", \"input\": \"3\\n10\\n20\\n33\", \"expected\": \"1\"}]}, {\"id\": 2, \"group\": \"for\", \"rank\": 3, \"title\": \"Сумма чисел, кратных 6\", \"condition\": \"В последовательности натуральных чисел определить сумму чисел, кратных 6.\\nСначала вводится N, затем N чисел. Гарантируется, что хотя бы одно число кратно 6.\", \"input\": \"Первая строка — N. Далее N натуральных чисел.\", \"sampleInput\": \"3\\n12\\n25\\n6\", \"sampleOutput\": \"18\", \"body\": \"n = int(input())\\nkol = 0\\ns = 0\\npr = 1\\nmaxi = -10**10\\nmini = 10**10\\n\\nfor i in range(n):\\n    a = int(input())\\n    if УСЛОВИЕ:\\n        kol += 1\\n        s += a\\n        pr *= a\\n        maxi = max(maxi, a)\\n        mini = min(mini, a)\", \"simple\": \"print(s)\", \"conditional\": \"if УСЛОВИЕ_ВЫВОДА:\\n    print(ЕСЛИ_ДА)\\nelse:\\n    print(ЕСЛИ_НЕТ)\", \"mode\": \"simple\", \"note\": \"\", \"solution\": \"n = int(input())\\ns = 0\\nfor i in range(n):\\n    a = int(input())\\n    if a % 6 == 0:\\n        s += a\\nprint(s)\", \"hint\": \"1) Перед циклом создай s = 0 — накопитель суммы.\\n2) Внутри цикла проверь, делится ли a на 6 без остатка.\\n3) Только для подходящего числа прибавляй a к s. Счётчик kol не нужен.\\n4) В конце выведи s.\", \"tests\": [{\"name\": \"Граничный случай\", \"input\": \"1\\n6\", \"expected\": \"6\"}, {\"name\": \"Дополнительный случай\", \"input\": \"5\\n1\\n6\\n12\\n7\\n18\", \"expected\": \"36\"}, {\"name\": \"Проверка отбора\", \"input\": \"3\\n6\\n12\\n18\", \"expected\": \"36\"}]}, {\"id\": 4, \"group\": \"for\", \"rank\": 4, \"title\": \"Сумма чисел, оканчивающихся на 4\", \"condition\": \"В последовательности натуральных чисел определить сумму чисел, оканчивающихся на 4.\\nСначала вводится N, затем N чисел. Гарантируется, что хотя бы одно число оканчивается на 4.\", \"input\": \"Первая строка — N. Далее N натуральных чисел.\", \"sampleInput\": \"3\\n14\\n25\\n24\", \"sampleOutput\": \"38\", \"body\": \"n = int(input())\\nkol = 0\\ns = 0\\npr = 1\\nmaxi = -10**10\\nmini = 10**10\\n\\nfor i in range(n):\\n    a = int(input())\\n    if УСЛОВИЕ:\\n        kol += 1\\n        s += a\\n        pr *= a\\n        maxi = max(maxi, a)\\n        mini = min(mini, a)\", \"simple\": \"print(s)\", \"conditional\": \"if УСЛОВИЕ_ВЫВОДА:\\n    print(ЕСЛИ_ДА)\\nelse:\\n    print(ЕСЛИ_НЕТ)\", \"mode\": \"simple\", \"note\": \"\", \"solution\": \"n = int(input())\\ns = 0\\nfor i in range(n):\\n    a = int(input())\\n    if a % 10 == 4:\\n        s += a\\nprint(s)\", \"hint\": \"1) Перед циклом создай s = 0.\\n2) Последняя цифра равна 4, если a % 10 == 4.\\n3) Внутри if прибавляй само число a к сумме s.\\n4) В конце выведи s.\", \"tests\": [{\"name\": \"Граничный случай\", \"input\": \"1\\n14\", \"expected\": \"14\"}, {\"name\": \"Дополнительный случай\", \"input\": \"4\\n14\\n24\\n25\\n4\", \"expected\": \"42\"}, {\"name\": \"Проверка отбора\", \"input\": \"3\\n1\\n24\\n3\", \"expected\": \"24\"}]}, {\"id\": 1, \"group\": \"for\", \"rank\": 5, \"title\": \"Максимальное число, кратное 5\", \"condition\": \"В последовательности натуральных чисел определить максимальное число, кратное 5.\\nСначала вводится N, затем N чисел. Гарантируется, что хотя бы одно число кратно 5. N ≤ 1000, числа ≤ 30 000.\", \"input\": \"Первая строка — N. Далее N натуральных чисел.\", \"sampleInput\": \"3\\n10\\n25\\n12\", \"sampleOutput\": \"25\", \"body\": \"n = int(input())\\nkol = 0\\ns = 0\\npr = 1\\nmaxi = -10**10\\nmini = 10**10\\n\\nfor i in range(n):\\n    a = int(input())\\n    if УСЛОВИЕ:\\n        kol += 1\\n        s += a\\n        pr *= a\\n        maxi = max(maxi, a)\\n        mini = min(mini, a)\", \"simple\": \"print(maxi)\", \"conditional\": \"if УСЛОВИЕ_ВЫВОДА:\\n    print(ЕСЛИ_ДА)\\nelse:\\n    print(ЕСЛИ_НЕТ)\", \"mode\": \"simple\", \"note\": \"\", \"solution\": \"n = int(input())\\nmaxi = -10**10\\nfor i in range(n):\\n    a = int(input())\\n    if a % 5 == 0:\\n        maxi = max(maxi, a)\\nprint(maxi)\", \"hint\": \"1) До цикла задай maxi заведомо маленьким числом, например -10**10.\\n2) Для каждого a проверь делимость на 5.\\n3) Внутри if обновляй максимум: maxi = max(maxi, a). Счётчик и сумму не меняй.\\n4) В конце выведи maxi.\", \"tests\": [{\"name\": \"Граничный случай\", \"input\": \"1\\n25\", \"expected\": \"25\"}, {\"name\": \"Дополнительный случай\", \"input\": \"5\\n10\\n15\\n12\\n5\\n30\", \"expected\": \"30\"}, {\"name\": \"Проверка отбора\", \"input\": \"4\\n3\\n8\\n11\\n20\", \"expected\": \"20\"}]}, {\"id\": 6, \"group\": \"for\", \"rank\": 6, \"title\": \"Максимальное число, оканчивающееся на 3\", \"condition\": \"В последовательности натуральных чисел определить максимальное число, оканчивающееся на 3.\\nСначала вводится N, затем N чисел. Гарантируется, что хотя бы одно число оканчивается на 3. N ≤ 1000, числа ≤ 30 000.\", \"input\": \"Первая строка — N. Далее N натуральных чисел.\", \"sampleInput\": \"3\\n13\\n23\\n3\", \"sampleOutput\": \"23\", \"body\": \"n = int(input())\\nkol = 0\\ns = 0\\npr = 1\\nmaxi = -10**10\\nmini = 10**10\\n\\nfor i in range(n):\\n    a = int(input())\\n    if УСЛОВИЕ:\\n        kol += 1\\n        s += a\\n        pr *= a\\n        maxi = max(maxi, a)\\n        mini = min(mini, a)\", \"simple\": \"print(maxi)\", \"conditional\": \"if УСЛОВИЕ_ВЫВОДА:\\n    print(ЕСЛИ_ДА)\\nelse:\\n    print(ЕСЛИ_НЕТ)\", \"mode\": \"simple\", \"note\": \"\", \"solution\": \"n = int(input())\\nmaxi = -10**10\\nfor i in range(n):\\n    a = int(input())\\n    if a % 10 == 3:\\n        maxi = max(maxi, a)\\nprint(maxi)\", \"hint\": \"1) До цикла задай maxi = -10**10.\\n2) Проверяй последнюю цифру: a % 10 == 3.\\n3) Только для чисел с последней цифрой 3 обновляй maxi.\\n4) В конце выведи maxi.\", \"tests\": [{\"name\": \"Граничный случай\", \"input\": \"1\\n3\", \"expected\": \"3\"}, {\"name\": \"Дополнительный случай\", \"input\": \"5\\n13\\n23\\n30\\n33\\n2\", \"expected\": \"33\"}, {\"name\": \"Проверка отбора\", \"input\": \"4\\n3\\n23\\n13\\n43\", \"expected\": \"43\"}]}, {\"id\": 8, \"group\": \"for\", \"rank\": 7, \"title\": \"Минимальное чётное число\", \"condition\": \"В последовательности натуральных чисел определить минимальное чётное число.\\nСначала вводится количество чисел, затем сами числа. Гарантируется, что чётное число есть. N ≤ 1000, числа ≤ 30 000.\", \"input\": \"Первая строка — N. Далее N натуральных чисел.\", \"sampleInput\": \"4\\n3\\n20\\n6\\n8\", \"sampleOutput\": \"6\", \"body\": \"n = int(input())\\nkol = 0\\ns = 0\\npr = 1\\nmaxi = -10**10\\nmini = 10**10\\n\\nfor i in range(n):\\n    a = int(input())\\n    if УСЛОВИЕ:\\n        kol += 1\\n        s += a\\n        pr *= a\\n        maxi = max(maxi, a)\\n        mini = min(mini, a)\", \"simple\": \"print(mini)\", \"conditional\": \"if УСЛОВИЕ_ВЫВОДА:\\n    print(ЕСЛИ_ДА)\\nelse:\\n    print(ЕСЛИ_НЕТ)\", \"mode\": \"simple\", \"note\": \"\", \"solution\": \"n = int(input())\\nmini = 10**10\\nfor i in range(n):\\n    a = int(input())\\n    if a % 2 == 0:\\n        mini = min(mini, a)\\nprint(mini)\", \"hint\": \"1) До цикла задай mini = 10**10 — число больше любого допустимого входного.\\n2) Проверь чётность: a % 2 == 0.\\n3) Только для чётных чисел обновляй mini = min(mini, a).\\n4) В конце выведи mini.\", \"tests\": [{\"name\": \"Граничный случай\", \"input\": \"1\\n2\", \"expected\": \"2\"}, {\"name\": \"Дополнительный случай\", \"input\": \"4\\n3\\n20\\n6\\n8\", \"expected\": \"6\"}, {\"name\": \"Проверка отбора\", \"input\": \"5\\n12\\n10\\n8\\n14\\n16\", \"expected\": \"8\"}]}, {\"id\": 10, \"group\": \"for\", \"rank\": 8, \"title\": \"Скорости: разность максимума и минимума, количество до 30 км/ч\", \"condition\": \"Камера фиксирует скорости N автомобилей. Найти:\\n1) разность максимальной и минимальной скоростей;\\n2) количество автомобилей со скоростью не выше 30 км/ч.\\nN от 1 до 30, скорость каждого автомобиля от 1 до 300.\", \"input\": \"Первая строка — N. Далее N скоростей.\", \"sampleInput\": \"4\\n74\\n69\\n63\\n96\", \"sampleOutput\": \"33\\n0\", \"body\": \"n = int(input())\\nkol = 0\\ns = 0\\npr = 1\\nmaxi = -10**10\\nmini = 10**10\\n\\nfor i in range(n):\\n    a = int(input())\\n    maxi = max(maxi, a)\\n    mini = min(mini, a)\\n    if УСЛОВИЕ:\\n        maxi = max(maxi, a)\\n        mini = min(mini, a)\\n        kol += 1\\n        s += a\\n        pr *= a\", \"simple\": \"print(maxi - mini)\\nprint(kol)\", \"conditional\": \"print(maxi - mini)\\nif УСЛОВИЕ_ВЫВОДА:\\n    print(kol)\\nelse:\\n    print(0)\", \"mode\": \"simple\", \"note\": \"Максимум и минимум обновляются для каждого автомобиля, а kol — только для скоростей, удовлетворяющих условию.\", \"solution\": \"n = int(input())\\nkol = 0\\nmaxi = -10**10\\nmini = 10**10\\nfor i in range(n):\\n    a = int(input())\\n    maxi = max(maxi, a)\\n    mini = min(mini, a)\\n    if a <= 30:\\n        kol += 1\\nprint(maxi - mini)\\nprint(kol)\", \"hint\": \"Здесь нужны три независимых действия.\\n1) maxi и mini обновляй для КАЖДОЙ скорости — вне условия отбора.\\n2) kol = 0 создай до цикла; увеличивай kol только если скорость не выше 30.\\n3) В конце выведи два результата: сначала maxi - mini, затем kol. Для этого задания они печатаются отдельными строками.\", \"tests\": [{\"name\": \"Граничный случай\", \"input\": \"1\\n30\", \"expected\": \"0\\n1\"}, {\"name\": \"Дополнительный случай\", \"input\": \"3\\n1\\n300\\n30\", \"expected\": \"299\\n2\"}, {\"name\": \"Проверка отбора\", \"input\": \"2\\n31\\n40\", \"expected\": \"9\\n0\"}]}, {\"id\": 11, \"group\": \"for\", \"rank\": 9, \"title\": \"Температура: среднее положительных значений и их количество\", \"condition\": \"По дневным температурам найти среднюю температуру тех дней, когда она была выше 0 °C, и количество таких дней.\\nГарантируется, что хотя бы один положительный день был. N от 1 до 31.\", \"input\": \"Первая строка — N. Далее N целых температур.\", \"sampleInput\": \"4\\n-5\\n12\\n-2\\n8\", \"sampleOutput\": \"10.0\\n2\", \"body\": \"n = int(input())\\nkol = 0\\ns = 0\\npr = 1\\nmaxi = -10**10\\nmini = 10**10\\n\\nfor i in range(n):\\n    a = int(input())\\n    if УСЛОВИЕ:\\n        kol += 1\\n        s += a\\n        pr *= a\\n        maxi = max(maxi, a)\\n        mini = min(mini, a)\", \"simple\": \"print(s / kol)\\nprint(kol)\", \"conditional\": \"if УСЛОВИЕ_ВЫВОДА:\\n    print(ЕСЛИ_ДА)\\nelse:\\n    print(ЕСЛИ_НЕТ)\", \"mode\": \"simple\", \"note\": \"\", \"solution\": \"n = int(input())\\nkol = 0\\ns = 0\\nfor i in range(n):\\n    a = int(input())\\n    if a > 0:\\n        kol += 1\\n        s += a\\nprint(s / kol)\\nprint(kol)\", \"hint\": \"1) s = 0 и kol = 0 создай перед циклом.\\n2) Положительные температуры отбирай условием a > 0. Только для них увеличивай s на a и kol на 1.\\n3) Среднее вычисляется как s / kol. В этом задании гарантирован хотя бы один положительный день.\\n4) Выведи среднее, затем количество положительных дней — двумя командами print().\", \"tests\": [{\"name\": \"Граничный случай\", \"input\": \"1\\n1\", \"expected\": \"1.0\\n1\"}, {\"name\": \"Дополнительный случай\", \"input\": \"4\\n-5\\n12\\n-2\\n8\", \"expected\": \"10.0\\n2\"}, {\"name\": \"Проверка отбора\", \"input\": \"3\\n1\\n2\\n3\", \"expected\": \"2.0\\n3\"}]}, {\"id\": 12, \"group\": \"for\", \"rank\": 10, \"title\": \"Викторина: максимум правильных ответов и нулевой результат\", \"condition\": \"Участники ответили на 20 вопросов. Найти наибольшее количество правильных ответов.\\nЕсли есть участник, не ответивший правильно ни на один вопрос, вывести YES, иначе NO. Гарантируется, что хотя бы один участник дал правильный ответ. N от 1 до 50.\", \"input\": \"Первая строка — N. Далее N чисел — количество правильных ответов каждого участника.\", \"sampleInput\": \"4\\n15\\n12\\n0\\n17\", \"sampleOutput\": \"17\\nYES\", \"body\": \"n = int(input())\\n# kol2 = 0\\nmaxi = -10**10\\n\\nfor i in range(n):\\n    a = int(input())\\n    maxi = max(maxi, a)\\n    # kol2 += 1\\n    if УСЛОВИЕ:\\n        maxi = max(maxi, a)\\n        # kol2 += 1\", \"simple\": \"print(maxi)\", \"conditional\": \"print(maxi)\\nif УСЛОВИЕ_ВЫВОДА:\\n    print('YES')\\nelse:\\n    print('NO')\", \"mode\": \"conditional\", \"note\": \"Внутри цикла проверяется, встретился ли участник с нулём правильных ответов. Максимум ищется среди всех участников.\", \"solution\": \"n = int(input())\\nmaxi = -10**10\\nkol2 = 0\\nfor i in range(n):\\n    a = int(input())\\n    maxi = max(maxi, a)\\n    if a == 0:\\n        kol2 += 1\\nprint(maxi)\\nif kol2 > 0:\\n    print('YES')\\nelse:\\n    print('NO')\", \"hint\": \"1) maxi = -10**10 обновляй для каждого участника, без условия.\\n2) Отдельный второй счётчик kol2 = 0 нужен для участников с нулём правильных ответов. Если a == 0, увеличь kol2 на 1.\\n3) В конце сначала выведи maxi. Затем проверь kol2 > 0: если да — напечатай YES, иначе NO.\\n4) Здесь нужен счётчик случаев, а не второй счётчик.\", \"tests\": [{\"name\": \"Граничный случай\", \"input\": \"1\\n1\", \"expected\": \"1\\nNO\"}, {\"name\": \"Дополнительный случай\", \"input\": \"3\\n0\\n2\\n1\", \"expected\": \"2\\nYES\"}, {\"name\": \"Проверка отбора\", \"input\": \"4\\n3\\n17\\n0\\n17\", \"expected\": \"17\\nYES\"}]}, {\"id\": 13, \"group\": \"for\", \"rank\": 11, \"title\": \"Скорости: максимум и проверка скорости ниже 30\", \"condition\": \"Найти максимальную скорость автомобиля. Если хотя бы один автомобиль ехал со скоростью меньше 30 км/ч, вывести YES, иначе NO.\\nN от 1 до 30, скорости от 1 до 300.\", \"input\": \"Первая строка — N. Далее N скоростей.\", \"sampleInput\": \"4\\n74\\n69\\n63\\n66\", \"sampleOutput\": \"74\\nNO\", \"body\": \"n = int(input())\\n# kol2 = 0\\nmaxi = -10**10\\n\\nfor i in range(n):\\n    a = int(input())\\n    maxi = max(maxi, a)\\n    # kol2 += 1\\n    if УСЛОВИЕ:\\n        maxi = max(maxi, a)\\n        # kol2 += 1\", \"simple\": \"print(maxi)\", \"conditional\": \"print(maxi)\\nif УСЛОВИЕ_ВЫВОДА:\\n    print('YES')\\nelse:\\n    print('NO')\", \"mode\": \"conditional\", \"note\": \"\", \"solution\": \"n = int(input())\\nmaxi = -10**10\\nkol2 = 0\\nfor i in range(n):\\n    a = int(input())\\n    maxi = max(maxi, a)\\n    if a < 30:\\n        kol2 += 1\\nprint(maxi)\\nif kol2 > 0:\\n    print('YES')\\nelse:\\n    print('NO')\", \"hint\": \"1) maxi = -10**10 обновляй для каждой скорости автомобиля.\\n2) Создай kol2 = 0. Если скорость строго меньше 30, увеличь kol2 на 1. Скорость 30 не подходит.\\n3) Сначала выведи maxi. Затем проверь kol2 > 0: это означает, что хотя бы одна медленная машина была.\\n4) Для YES/NO используй второй счётчик и проверь, что он больше нуля.\", \"tests\": [{\"name\": \"Граничный случай\", \"input\": \"1\\n29\", \"expected\": \"29\\nYES\"}, {\"name\": \"Дополнительный случай\", \"input\": \"1\\n30\", \"expected\": \"30\\nNO\"}, {\"name\": \"Проверка отбора\", \"input\": \"4\\n10\\n30\\n300\\n29\", \"expected\": \"300\\nYES\"}]}, {\"id\": 14, \"group\": \"for\", \"rank\": 12, \"title\": \"Скорости: среднее и не менее двух медленных автомобилей\", \"condition\": \"Найти среднюю скорость всех автомобилей. Если не менее двух автомобилей двигались со скоростью не больше 40 км/ч, вывести YES, иначе NO.\\nN от 1 до 30, скорости от 1 до 300. Среднюю вывести с точностью до одного знака после запятой.\", \"input\": \"Первая строка — N. Далее N скоростей.\", \"sampleInput\": \"4\\n74\\n69\\n63\\n96\", \"sampleOutput\": \"75.5\\nNO\", \"body\": \"n = int(input())\\nkol = 0\\ns = 0\\npr = 1\\nmaxi = -10**10\\nmini = 10**10\\n\\nfor i in range(n):\\n    a = int(input())\\n    s += a\\n    if УСЛОВИЕ:\\n        s += a\\n        kol += 1\\n        pr *= a\\n        maxi = max(maxi, a)\\n        mini = min(mini, a)\", \"simple\": \"print(round(s / n, 1))\", \"conditional\": \"print(round(s / n, 1))\\nif УСЛОВИЕ_ВЫВОДА:\\n    print('YES')\\nelse:\\n    print('NO')\", \"mode\": \"conditional\", \"note\": \"Сумма s обновляется для каждого автомобиля. Счётчик kol — только для скоростей не больше 40.\", \"solution\": \"n = int(input())\\ns = 0\\nkol = 0\\nfor i in range(n):\\n    a = int(input())\\n    s += a\\n    if a <= 40:\\n        kol += 1\\nprint(round(s / n, 1))\\nif kol >= 2:\\n    print('YES')\\nelse:\\n    print('NO')\", \"hint\": \"1) Для среднего нужны два накопителя: s = 0 (сумма) и kol = 0 (количество).\\n2) Последняя цифра семеричной записи — это a % 7. Для нечётной цифры проверь (a % 7) % 2 != 0.\\n3) Когда условие верно, увеличь s на a и kol на 1.\\n4) Если kol > 0, выведи s / kol; иначе выведи NO. Здесь N заранее известно, поэтому используется for.\", \"tests\": [{\"name\": \"Граничный случай\", \"input\": \"1\\n40\", \"expected\": \"40.0\\nNO\"}, {\"name\": \"Дополнительный случай\", \"input\": \"2\\n40\\n40\", \"expected\": \"40.0\\nYES\"}, {\"name\": \"Проверка отбора\", \"input\": \"3\\n1\\n200\\n300\", \"expected\": \"167.0\\nNO\"}]}, {\"id\": 16, \"group\": \"for\", \"rank\": 13, \"title\": \"Контрольная: число неудовлетворительных оценок и отличник\", \"condition\": \"Каждый ученик решал 10 примеров. Неудовлетворительная оценка — если решено меньше половины примеров. Найти количество таких оценок.\\nЕсли хотя бы один ученик решил все 10 примеров, вывести YES, иначе NO. N от 1 до 30.\", \"input\": \"Первая строка — N. Далее N чисел — количество правильно решённых примеров.\", \"sampleInput\": \"4\\n3\\n9\\n2\\n8\", \"sampleOutput\": \"2\\nNO\", \"body\": \"n = int(input())\\n# kol = 0\\n# kol2 = 0\\n\\nfor i in range(n):\\n    a = int(input())\\n    if УСЛОВИЕ:\\n        # kol += 1\\n    # kol2 += 1\\n    if УСЛОВИЕ:\\n        # kol2 += 1\", \"simple\": \"print(kol)\", \"conditional\": \"print(kol)\\nif УСЛОВИЕ_ВЫВОДА:\\n    print('YES')\\nelse:\\n    print('NO')\", \"mode\": \"conditional\", \"note\": \"Для неудовлетворительной оценки требуется меньше 5 правильных ответов. Флаг проверяет, встретилось ли значение 10.\", \"solution\": \"n = int(input())\\nkol = 0\\nkol2 = 0\\nfor i in range(n):\\n    a = int(input())\\n    if a < 5:\\n        kol += 1\\n    if a == 10:\\n        kol2 += 1\\nprint(kol)\\nif kol2 > 0:\\n    print('YES')\\nelse:\\n    print('NO')\", \"hint\": \"1) kol = 0 считай неудовлетворительные оценки: если a < 5, увеличь kol на 1.\\n2) Второй счётчик kol2 = 0 считай отдельно: если a == 10, увеличь kol2 на 1.\\n3) После цикла выведи kol. Затем проверь kol2 > 0: при положительном значении выведи YES, иначе NO.\\n4) Оба счётчика инициализируются до цикла; каждый меняется только в своём условии.\", \"tests\": [{\"name\": \"Граничный случай\", \"input\": \"1\\n4\", \"expected\": \"1\\nNO\"}, {\"name\": \"Дополнительный случай\", \"input\": \"2\\n5\\n10\", \"expected\": \"0\\nYES\"}, {\"name\": \"Проверка отбора\", \"input\": \"3\\n0\\n4\\n5\", \"expected\": \"2\\nNO\"}]}, {\"id\": 18, \"group\": \"for\", \"rank\": 14, \"title\": \"Среднее чисел с нечётной последней цифрой в записи по основанию 7\", \"condition\": \"Найти среднее арифметическое десятичных чисел, запись которых в системе счисления с основанием 7 оканчивается нечётной цифрой. Если таких элементов нет, вывести NO.\\nСначала вводится N (3 ≤ N ≤ 10 000), затем N натуральных чисел не больше 30 000.\", \"input\": \"Первая строка — N. Далее N натуральных чисел.\", \"sampleInput\": \"6\\n12\\n15\\n10\\n71\\n50\\n11\", \"sampleOutput\": \"31.6\", \"body\": \"n = int(input())\\nkol = 0\\ns = 0\\npr = 1\\nmaxi = -10**10\\nmini = 10**10\\n\\nfor i in range(n):\\n    a = int(input())\\n    if УСЛОВИЕ:\\n        kol += 1\\n        s += a\\n        pr *= a\\n        maxi = max(maxi, a)\\n        mini = min(mini, a)\", \"simple\": \"print(round(s / kol, 1))\", \"conditional\": \"if kol > 0:\\n    print(round(s / kol, 1))\\nelse:\\n    print('NO')\", \"mode\": \"conditional\", \"note\": \"Последняя цифра записи в системе с основанием 7 равна остатку от деления на 7. Нечётные остатки: 1, 3 или 5.\", \"solution\": \"n = int(input())\\ns = 0\\nkol = 0\\nfor i in range(n):\\n    a = int(input())\\n    if a % 7 % 2 != 0:\\n        s += a\\n        kol += 1\\nif kol > 0:\\n    print(round(s / kol, 1))\\nelse:\\n    print('NO')\", \"hint\": \"1) Для среднего заведи s = 0 и kol = 0 до цикла.\\n2) Последняя цифра записи по основанию 7 равна a % 7. Чтобы она была нечётной, проверь (a % 7) % 2 != 0.\\n3) При выполнении условия прибавь a к s и увеличь kol на 1.\\n4) Выведи среднее s / kol; в условии гарантируется, что подходящие элементы есть.\", \"tests\": [{\"name\": \"Граничный случай\", \"input\": \"3\\n1\\n2\\n3\", \"expected\": \"2.0\"}, {\"name\": \"Дополнительный случай\", \"input\": \"3\\n7\\n14\\n21\", \"expected\": \"NO\"}, {\"name\": \"Проверка отбора\", \"input\": \"4\\n5\\n10\\n15\\n20\", \"expected\": \"10.0\"}]}, {\"id\": 20, \"group\": \"for\", \"rank\": 15, \"title\": \"Среднее чисел, оканчивающихся на 5 в системе счисления по основанию 7\", \"condition\": \"Найти среднее арифметическое десятичных чисел, запись которых в системе счисления с основанием 7 оканчивается цифрой 5. Если таких элементов нет, вывести NO.\\nСначала вводится N (3 ≤ N ≤ 10 000), затем N натуральных чисел не больше 30 000.\", \"input\": \"Первая строка — N. Далее N натуральных чисел.\", \"sampleInput\": \"5\\n12\\n14\\n20\\n68\\n25\", \"sampleOutput\": \"40\", \"body\": \"n = int(input())\\nkol = 0\\ns = 0\\npr = 1\\nmaxi = -10**10\\nmini = 10**10\\n\\nfor i in range(n):\\n    a = int(input())\\n    if УСЛОВИЕ:\\n        kol += 1\\n        s += a\\n        pr *= a\\n        maxi = max(maxi, a)\\n        mini = min(mini, a)\", \"simple\": \"print(f'{s / kol:g}')\", \"conditional\": \"if kol > 0:\\n    print(f'{s / kol:g}')\\nelse:\\n    print('NO')\", \"mode\": \"conditional\", \"note\": \"\", \"solution\": \"n = int(input())\\ns = 0\\nkol = 0\\nfor i in range(n):\\n    a = int(input())\\n    if a % 7 == 5:\\n        s += a\\n        kol += 1\\nif kol > 0:\\n    print(f'{s / kol:g}')\\nelse:\\n    print('NO')\", \"hint\": \"1) Создай s = 0 и kol = 0.\\n2) Последняя цифра в системе с основанием 7 равна 5, если a % 7 == 5.\\n3) Для подходящих чисел увеличивай сумму s и количество kol.\\n4) Если kol > 0, выведи s / kol, округлив/оформив как требует условие; иначе выведи NO.\", \"tests\": [{\"name\": \"Граничный случай\", \"input\": \"5\\n12\\n14\\n20\\n68\\n25\", \"expected\": \"40\"}, {\"name\": \"Дополнительный случай\", \"input\": \"3\\n1\\n2\\n3\", \"expected\": \"NO\"}, {\"name\": \"Проверка отбора\", \"input\": \"3\\n5\\n6\\n7\", \"expected\": \"5\"}]}, {\"id\": 21, \"group\": \"for\", \"rank\": 16, \"title\": \"Сумма чисел, оканчивающихся на 1 в системе счисления по основанию 7\", \"condition\": \"Подсчитать сумму элементов последовательности натуральных чисел, запись которых в системе счисления с основанием 7 оканчивается цифрой 1.\\nСначала вводится N (1 ≤ N ≤ 1000), затем N чисел. Вывести только сумму в десятичной системе счисления.\", \"input\": \"Первая строка — N. Далее N натуральных чисел.\", \"sampleInput\": \"5\\n15\\n13\\n11\\n8\\n23\", \"sampleOutput\": \"23\", \"body\": \"n = int(input())\\nkol = 0\\ns = 0\\npr = 1\\nmaxi = -10**10\\nmini = 10**10\\n\\nfor i in range(n):\\n    a = int(input())\\n    if УСЛОВИЕ:\\n        kol += 1\\n        s += a\\n        pr *= a\\n        maxi = max(maxi, a)\\n        mini = min(mini, a)\", \"simple\": \"print(s)\", \"conditional\": \"if УСЛОВИЕ_ВЫВОДА:\\n    print(ЕСЛИ_ДА)\\nelse:\\n    print(ЕСЛИ_НЕТ)\", \"mode\": \"simple\", \"note\": \"\", \"solution\": \"n = int(input())\\ns = 0\\nfor i in range(n):\\n    a = int(input())\\n    if a % 7 == 1:\\n        s += a\\nprint(s)\", \"hint\": \"1) Создай s = 0. Это задача на сумму, дополнительный счётчик не обязателен.\\n2) Последняя цифра семеричной записи равна 1, если a % 7 == 1.\\n3) В цикле по N числам, если условие выполнено, прибавляй a к s.\\n4) В конце выведи только s.\", \"tests\": [{\"name\": \"Граничный случай\", \"input\": \"1\\n1\", \"expected\": \"1\"}, {\"name\": \"Дополнительный случай\", \"input\": \"5\\n15\\n13\\n11\\n8\\n23\", \"expected\": \"23\"}, {\"name\": \"Проверка отбора\", \"input\": \"4\\n8\\n9\\n10\\n11\", \"expected\": \"8\"}]}, {\"id\": 22, \"group\": \"ranges\", \"rank\": 1, \"title\": \"Количество чётных чисел на отрезке [a; b]\", \"condition\": \"По двум натуральным числам a и b подсчитать количество чётных натуральных чисел на отрезке [a; b], включая оба конца.\\nГарантируется: 1 ≤ a ≤ b ≤ 30 000. Проверять входные данные не нужно.\", \"input\": \"Два числа: сначала a, затем b.\", \"sampleInput\": \"10\\n20\", \"sampleOutput\": \"6\", \"body\": \"a = int(input())\\nb = int(input())\\nkol = 0\\ns = 0\\npr = 1\\nmaxi = -10**10\\nmini = 10**10\\n\\nfor a in range(a, b + 1):\\n    if УСЛОВИЕ:\\n        kol += 1\\n        s += a\\n        pr *= a\\n        maxi = max(maxi, a)\\n        mini = min(mini, a)\", \"simple\": \"print(kol)\", \"conditional\": \"if УСЛОВИЕ_ВЫВОДА:\\n    print(ЕСЛИ_ДА)\\nelse:\\n    print(ЕСЛИ_НЕТ)\", \"mode\": \"simple\", \"note\": \"\", \"solution\": \"a = int(input())\\nb = int(input())\\nkol = 0\\nfor a in range(a, b + 1):\\n    if a % 2 == 0:\\n        kol += 1\\nprint(kol)\", \"hint\": \"1) Введи границы отрезка: start и finish.\\n2) kol = 0 создай перед циклом.\\n3) Перебирай все числа от start до finish включительно: range(start, finish + 1).\\n4) Если a % 2 == 0, увеличь kol на 1. В конце выведи kol.\", \"tests\": [{\"name\": \"Граничный случай\", \"input\": \"10\\n20\", \"expected\": \"6\"}, {\"name\": \"Дополнительный случай\", \"input\": \"8\\n8\", \"expected\": \"1\"}, {\"name\": \"Проверка отбора\", \"input\": \"9\\n9\", \"expected\": \"0\"}, {\"name\": \"Ещё один случай\", \"input\": \"1\\n5\", \"expected\": \"2\"}]}, {\"id\": 9, \"group\": \"while\", \"rank\": 1, \"title\": \"Количество трёхзначных чисел, кратных 4\", \"condition\": \"В последовательности натуральных чисел определить количество трёхзначных чисел, кратных 4.\\nКоличество заранее неизвестно. Ввод заканчивается числом 0; ноль не входит в последовательность.\", \"input\": \"Натуральные числа по одному. Последнее введённое число — 0 (стоп-сигнал).\", \"sampleInput\": \"120\\n9\\n365\\n4\\n0\", \"sampleOutput\": \"1\", \"body\": \"kol = 0\\ns = 0\\npr = 1\\nmaxi = -10**10\\nmini = 10**10\\na = int(input())\\nwhile a != 0:\\n    if УСЛОВИЕ:\\n        kol += 1\\n        s += a\\n        pr *= a\\n        maxi = max(maxi, a)\\n        mini = min(mini, a)\\n    a = int(input())\", \"simple\": \"print(kol)\", \"conditional\": \"if УСЛОВИЕ_ВЫВОДА:\\n    print(ЕСЛИ_ДА)\\nelse:\\n    print(ЕСЛИ_НЕТ)\", \"mode\": \"simple\", \"note\": \"\", \"solution\": \"kol = 0\\na = int(input())\\nwhile a != 0:\\n    if 100 <= a <= 999 and a % 4 == 0:\\n        kol += 1\\n    a = int(input())\\nprint(kol)\", \"hint\": \"1) До цикла создай kol = 0.\\n2) Вводи a до тех пор, пока a != 0. Ноль — только стоп-сигнал: тело цикла для него не выполняется.\\n3) Трёхзначность проверяй через 100 <= a <= 999; кратность 4 — через a % 4 == 0. Объедини оба условия через and.\\n4) Для подходящи
