<dialog id="stuModal"><h2>Кто занимается?</h2><div style="font-size:13px;color:var(--muted);margin-bottom:10px">У каждого ученика свой код, отметки «Решено», «ДЗ», «Избранное», попытки и подсказки. Всё хранится в этом браузере; 💾 сохраняет файл с прогрессом всех учеников.</div><div id="stuList"></div><div class="stuAdd"><input id="stuNew" placeholder="Имя нового ученика" maxlength="40"><button class="btn primary" id="stuAddBtn">Добавить</button></div><div class="modalActions"><button class="btn" id="stuClose">Готово</button></div></dialog>
<script>
const TASKS = [{"id":3,"group":"for","rank":1,"title":"Количество чисел, кратных 4","condition":"В последовательности натуральных чисел определить количество чисел, кратных 4.\nСначала вводится N, затем N чисел. Гарантируется, что хотя бы одно число кратно 4.","input":"Первая строка — N. Далее N натуральных чисел.","sampleInput":"3\n16\n26\n24","sampleOutput":"2","body":"n = int(input())\nkol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\n\nfor i in range(n):\n    a = int(input())\n    if УСЛОВИЕ:\n        kol += 1\n        s += a\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)","simple":"print(kol)","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print(ЕСЛИ_ДА)\nelse:\n    print(ЕСЛИ_НЕТ)","mode":"simple","note":"Нужен только счётчик kol. Остальные заготовленные переменные и обновления можно отключить крестиком.","solution":"n = int(input())\nkol = 0\nfor i in range(n):\n    a = int(input())\n    if a % 4 == 0:\n        kol += 1\nprint(kol)","hint":"1) Перед циклом создай kol = 0 — счётчик подходящих чисел.\n2) Внутри цикла проверяй кратность 4: остаток от деления на 4 равен нулю.\n3) Только внутри if увеличивай kol на 1. Сумма, произведение, максимум и минимум здесь не нужны.\n4) В конце выведи kol одной командой print().","tests":[{"name":"Граничный случай","input":"1\n4","expected":"1"},{"name":"Дополнительный случай","input":"4\n4\n8\n12\n16","expected":"4"},{"name":"Проверка отбора","input":"5\n1\n2\n4\n7\n9","expected":"1"}]},{"id":5,"group":"for","rank":2,"title":"Количество чисел, оканчивающихся на 3","condition":"В последовательности натуральных чисел определить количество чисел, оканчивающихся на 3.\nСначала вводится N, затем N чисел. Гарантируется, что хотя бы одно число оканчивается на 3.","input":"Первая строка — N. Далее N натуральных чисел.","sampleInput":"3\n13\n23\n24","sampleOutput":"2","body":"n = int(input())\nkol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\n\nfor i in range(n):\n    a = int(input())\n    if УСЛОВИЕ:\n        kol += 1\n        s += a\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)","simple":"print(kol)","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print(ЕСЛИ_ДА)\nelse:\n    print(ЕСЛИ_НЕТ)","mode":"simple","note":"","solution":"n = int(input())\nkol = 0\nfor i in range(n):\n    a = int(input())\n    if a % 10 == 3:\n        kol += 1\nprint(kol)","hint":"1) Перед циклом создай kol = 0.\n2) Для каждого числа a проверь последнюю десятичную цифру: остаток от деления на 10 равен 3.\n3) Если условие верно, увеличь kol на 1. Не прибавляй к счётчику само число.\n4) В конце выведи kol.","tests":[{"name":"Граничный случай","input":"1\n13","expected":"1"},{"name":"Дополнительный случай","input":"4\n13\n23\n30\n3","expected":"3"},{"name":"Проверка отбора","input":"3\n10\n20\n33","expected":"1"}]},{"id":2,"group":"for","rank":3,"title":"Сумма чисел, кратных 6","condition":"В последовательности натуральных чисел определить сумму чисел, кратных 6.\nСначала вводится N, затем N чисел. Гарантируется, что хотя бы одно число кратно 6.","input":"Первая строка — N. Далее N натуральных чисел.","sampleInput":"3\n12\n25\n6","sampleOutput":"18","body":"n = int(input())\nkol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\n\nfor i in range(n):\n    a = int(input())\n    if УСЛОВИЕ:\n        kol += 1\n        s += a\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)","simple":"print(s)","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print(ЕСЛИ_ДА)\nelse:\n    print(ЕСЛИ_НЕТ)","mode":"simple","note":"","solution":"n = int(input())\ns = 0\nfor i in range(n):\n    a = int(input())\n    if a % 6 == 0:\n        s += a\nprint(s)","hint":"1) Перед циклом создай s = 0 — накопитель суммы.\n2) Внутри цикла проверь, делится ли a на 6 без остатка.\n3) Только для подходящего числа прибавляй a к s. Счётчик kol не нужен.\n4) В конце выведи s.","tests":[{"name":"Граничный случай","input":"1\n6","expected":"6"},{"name":"Дополнительный случай","input":"5\n1\n6\n12\n7\n al":"if УСЛОВИЕ_ВЫВОДА:\n    print(ЕСЛИ_ДА)\nelse:\n    print(ЕСЛИ_НЕТ)","mode":"simple","note":"","solution":"n = int(input())\nmaxi = -10**10\nfor i in range(n):\n    a = int(input())\n    if a % 5 == 0:\n        maxi = max(maxi, a)\nprint(maxi)","hint":"1) До цикла задай maxi заведомо маленьким числом, например -10**10.\n2) Для каждого a проверь делимость на 5.\n3) Внутри if обновляй максимум: maxi = max(maxi, a). Счётчик и сумму не меняй.\n4) В конце выведи maxi.","tests":[{"name":"Граничный случай","input":"1\n25","expected":"25"},{"name":"Дополнительный случай","input":"5\n10\n15\n12\n5\n30","expected":"30"},{"name":"Проверка отбора","input":"4\n3\n8\n11\n20","expected":"20"}]},{"id":6,"group":"for","rank":6,"title":"Максимальное число, оканчивающееся на 3","condition":"В последовательности натуральных чисел определить максимальное число, оканчивающееся на 3.\nСначала вводится N, затем N чисел. Гарантируется, что хотя бы одно число оканчивается на 3. N ≤ 1000, числа ≤ 30 000.","input":"Первая строка — N. Далее N натуральных чисел.","sampleInput":"3\n13\n23\n3","sampleOutput":"23","body":"n = int(input())\nkol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\n\nfor i in range(n):\n    a = int(input())\n    if УСЛОВИЕ:\n        kol += 1\n        s += a\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)","simple":"print(maxi)","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print(ЕСЛИ_ДА)\nelse:\n    print(ЕСЛИ_НЕТ)","mode":"simple","note":"","solution":"n = int(input())\nmaxi = -10**10\nfor i in range(n):\n    a = int(input())\n    if a % 10 == 3:\n        maxi = max(maxi, a)\nprint(maxi)","hint":"1) До цикла задай maxi = -10**10.\n2) Проверяй последнюю цифру: a % 10 == 3.\n3) Только для чисел с последней цифрой 3 обновляй maxi.\n4) В конце выведи maxi.","tests":[{"name":"Граничный случай","input":"1\n3","expected":"3"},{"name":"Дополнительный случай","input":"5\n13\n23\n30\n33\n2","expected":"33"},{"name":"Проверка отбора","input":"4\n3\n23\n13\n43","expected":"43"}]},{"id":8,"group":"for","rank":7,"title":"Минимальное чётное число","condition":"В последовательности натуральных чисел определить минимальное чётное число.\nСначала вводится количество чисел, затем сами числа. Гарантируется, что чётное число есть. N ≤ 1000, числа ≤ 30 000.","input":"Первая строка — N. Далее N натуральных чисел.","sampleInput":"4\n3\n20\n6\n8","sampleOutput":"6","body":"n = int(input())\nkol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\n\nfor i in range(n):\n    a = int(input())\n    if УСЛОВИЕ:\n        kol += 1\n        s += a\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)","simple":"print(mini)","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print(ЕСЛИ_ДА)\nelse:\n    print(ЕСЛИ_НЕТ)","mode":"simple","note":"","solution":"n = int(input())\nmini = 10**10\nfor i in range(n):\n    a = int(input())\n    if a % 2 == 0:\n        mini = min(mini, a)\nprint(mini)","hint":"1) До цикла задай mini = 10**10 — число больше любого допустимого входного.\n2) Проверь чётность: a % 2 == 0.\n3) Только для чётных чисел обновляй mini = min(mini, a).\n4) В конце выведи mini.","tests":[{"name":"Граничный случай","input":"1\n2","expected":"2"},{"name":"Дополнительный случай","input":"4\n3\n20\n6\n8","expected":"6"},{"name":"Проверка отбора","input":"5\n12\n10\n8\n14\n16","expected":"8"}]},{"id":10,"group":"for","rank":8,"title":"Скорости: разность максимума и минимума, количество до 30 км/ч","condition":"Камера фиксирует скорости N автомобилей. Найти:\n1) разность максимальной и минимальной скоростей;\n2) количество автомобилей со скоростью не выше 30 км/ч.\nN от 1 до 30, скорость каждого автомобиля от 1 до 300.","input":"Первая строка — N. Далее N скоростей.","sampleInput":"4\n74\n69\n63\n96","sampleOutput":"33\n0","body":"n = int(input())\nkol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\n\nfor i in range(n):\n    a = int(input())\n    maxi = max(maxi, a)\n    mini = min(mini, a)\n    if УСЛОВИЕ:\n        maxi = max(maxi, a)\n        mini = min(mini, a)\n        kol += 1\n        s += a\n        pr *= a","simple":"print(maxi - mini)\nprint(kol)","conditional":"print(maxi - mini)\nif УСЛОВИЕ_ВЫВОДА:\n    print(kol)\nelse:\n    print(0)","mode":"simple","note":"Максимум и минимум обновляются для каждого автомобиля, а kol — только для скоростей, удовлетворяющих условию.","solution":"n = int(input())\nkol = 0\nmaxi = -10**10\nmini = 10**10\nfor i in range(n):\n    a = int(input())\n    maxi = max(maxi, a)\n    mini = min(mini, a)\n    if a <= 30:\n        kol += 1\nprint(maxi - mini)\nprint(kol)","hint":"Здесь нужны три независимых действия.\n1) maxi и mini обновляй для КАЖДОЙ скорости — вне условия отбора.\n2) kol = 0 создай до цикла; увеличивай kol только если скорость не выше 30.\n3) В конце выведи два результата: сначала maxi - mini, затем kol. Для этого задания они печатаются отдельными строками.","tests":[{"name":"Граничный случай","input":"1\n30","expected":"0\n1"},{"name":"Дополнительный случай","input":"3\n1\n300\n30","expected":"299\n2"},{"name":"Проверка отбора","input":"2\n31\n40","expected":"9\n0"}]},{"id":11,"group":"for","rank":9,"title":"Температура: среднее положительных значений и их количество","condition":"По дневным температурам найти среднюю температуру тех дней, когда она была выше 0 °C, и количество таких дней.\nГарантируется, что хотя бы один положительный день был. N от 1 до 31.","input":"Первая строка — N. Далее N целых температур.","sampleInput":"4\n-5\n12\n-2\n8","sampleOutput":"10.0\n2","body":"n = int(input())\nkol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\n\nfor i in range(n):\n    a = int(input())\n    if УСЛОВИЕ:\n        kol += 1\n        s += a\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)","simple":"print(s / kol)\nprint(kol)","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print(ЕСЛИ_ДА)\nelse:\n    print(ЕСЛИ_НЕТ)","mode":"simple","note":"","solution":"n = int(input())\nkol = 0\ns = 0\nfor i in range(n):\n    a = int(input())\n    if a > 0:\n        kol += 1\n        s += a\nprint(s / kol)\nprint(kol)","hint":"1) s = 0 и kol = 0 создай перед циклом.\n2) Положительные температуры отбирай условием a > 0. Только для них увеличивай s на a и kol на 1.\n3) Среднее вычисляется как s / kol. В этом задании гарантирован хотя бы один положительный день.\n4) Выведи среднее, затем количество положительных дней — двумя командами print().","tests":[{"name":"Граничный случай","input":"1\n1","expected":"1.0\n1"},{"name":"Дополнительный случай","input":"4\n-5\n12\n-2\n8","expected":"10.0\n2"},{"name":"Проверка отбора","input":"3\n1\n2\n3","expected":"2.0\n3"}]},{"id":12,"group":"for","rank":10,"title":"Викторина: максимум правильных ответов и нулевой результат","condition":"Участники ответили на 20 вопросов. Найти наибольшее количество правильных ответов.\nЕсли есть участник, не ответивший правильно ни на один вопрос, вывести YES, иначе NO. Гарантируется, что хотя бы один участник дал правильный ответ. N от 1 до 50.","input":"Первая строка — N. Далее N чисел — количество правильных ответов каждого участника.","sampleInput":"4\n15\n12\n0\n17","sampleOutput":"17\nYES","body":"n = int(input())\n# kol2 = 0\nmaxi = -10**10\n\nfor i in range(n):\n    a = int(input())\n    maxi = max(maxi, a)\n    if УСЛОВИЕ:\n        # kol2 += 1","simple":"print(maxi)","conditional":"print(maxi)\nif УСЛОВИЕ_ВЫВОДА:\n    print('YES')\nelse:\n    print('NO')","mode":"conditional","note":"Внутри цикла проверяется, встретился ли участник с нулём правильных ответов. Максимум ищется среди всех участников.","solution":"n = int(input())\nmaxi = -10**10\nkol2 = 0\nfor i in range(n):\n    a = int(input())\n    maxi = max(maxi, a)\n    if a == 0:\n        kol2 += 1\nprint(maxi)\nif kol2 > 0:\n    print('YES')\nelse:\n    print('NO')","hint":"1) maxi = -10**10 обновляй для каждого участника — без условия.\n2) Создай второй счётчик kol2 = 0. Если a == 0, увеличь kol2 на 1.\n3) После цикла выведи maxi. Затем проверь kol2 > 0: если да, выведи YES, иначе NO.\n4) Здесь два независимых действия: поиск максимума и подсчёт нулевых результатов.","tests":[{"name":"Граничный случай","input":"1\n1","expected":"1\nNO"},{"name":"Дополнительный случай","input":"3\n0\n2\n1","expected":"2\nYES"},{"name":"Проверка отбора","input":"4\n3\n17\n0\n17","expected":"17\nYES"}]},{"id":13,"group":"for","rank":11,"title":"Скорости: максимум и проверка скорости ниже 30","condition":"Найти максимальную скорость автомобиля. Если хотя бы один автомобиль ехал со скоростью меньше 30 км/ч, вывести YES, иначе NO.\nN от 1 до 30, скорости от 1 до 300.","input":"Первая строка — N. Далее N скоростей.","sampleInput":"4\n74\n69\n63\n66","sampleOutput":"74\nNO","body":"n = int(input())\n# kol2 = 0\nmaxi = -10**10\n\nfor i in range(n):\n    a = int(input())\n    maxi = max(maxi, a)\n    if УСЛОВИЕ:\n        # kol2 += 1","simple":"print(maxi)","conditional":"print(maxi)\nif УСЛОВИЕ_ВЫВОДА:\n    print('YES')\nelse:\n    print('NO')","mode":"conditional","note":"","solution":"n = int(input())\nmaxi = -10**10\nkol2 = 0\nfor i in range(n):\n    a = int(input())\n    maxi = max(maxi, a)\n    if a < 30:\n        kol2 += 1\nprint(maxi)\nif kol2 > 0:\n    print('YES')\nelse:\n    print('NO')","hint":"1) maxi = -10**10 обновляй для каждой скорости автомобиля — до условия.\n2) Создай kol2 = 0. Если скорость строго меньше 30, увеличь kol2 на 1. Скорость 30 не подходит.\n3) Сначала выведи maxi. Затем проверь kol2 > 0: это означает, что хотя бы одна медленная машина была.\n4) Максимум и второй счётчик обновляются независимо друг от друга.","tests":[{"name":"Граничный случай","input":"1\n29","expected":"29\nYES"},{"name":"Дополнительный случай","input":"1\n30","expected":"30\nNO"},{"name":"Проверка отбора","input":"4\n10\n30\n300\n29","expected":"300\nYES"}]},{"id":14,"group":"for","rank":12,"title":"Скорости: среднее и не менее двух медленных автомобилей","condition":"Найти среднюю скорость всех автомобилей. Если не менее двух автомобилей двигались со скоростью не больше 40 км/ч, вывести YES, иначе NO.\nN от 1 до 30, скорости от 1 до 300. Среднюю вывести с точностью до одного знака после запятой.","input":"Первая строка — N. Далее N скоростей.","sampleInput":"4\n74\n69\n63\n96","sampleOutput":"75.5\nNO","body":"n = int(input())\n# s = 0\n# kol = 0\n# kol2 = 0\n\nfor i in range(n):\n    a = int(input())\n    # s += a\n    # kol += 1\n    if УСЛОВИЕ:\n        # kol2 += 1","simple":"print(round(s / n, 1))","conditional":"print(round(s / n, 1))\nif УСЛОВИЕ_ВЫВОДА:\n    print('YES')\nelse:\n    print('NO')","mode":"conditional","note":"Среднее считается по всем автомобилям: s и kol обновляются на каждом шаге. Второй счётчик kol2 считает только скорости не выше 40 км/ч.","solution":"n = int(input())\ns = 0\nkol = 0\nkol2 = 0\nfor i in range(n):\n    a = int(input())\n    s += a\n    kol += 1\n    if a <= 40:\n        kol2 += 1\nprint(round(s / kol, 1))\nif kol2 >= 2:\n    print('YES')\nelse:\n    print('NO')","hint":"1) Для среднего всех скоростей используй s = 0 (сумма) и kol = 0 (количество всех автомобилей).\n2) В каждом проходе цикла, независимо от условия, выполняй s += a и kol += 1.\n3) Второй счётчик kol2 = 0 увеличивай только при a <= 40. Скорость 40 подходит.\n4) После цикла выведи round(s / kol, 1). Затем проверь kol2 >= 2: выведи YES или NO.\n5) N нужен для организации цикла for, но для среднего делить на N не требуется: количество всех чисел уже хранится в kol.","tests":[{"name":"Граничный случай","input":"1\n40","expected":"40.0\nNO"},{"name":"Дополнительный случай","input":"2\n40\n40","expected":"40.0\nYES"},{"name":"Проверка отбора","input":"3\n1\n200\n300","expected":"167.0\nNO"}]},{"id":16,"group":"for","rank":13,"title":"Контрольная: число неудовлетворительных оценок и отличник","condition":"Каждый ученик решал 10 примеров. Неудовлетворительная оценка — если решено меньше половины примеров. Найти количество таких оценок.\nЕсли хотя бы один ученик решил все 10 примеров, вывести YES, иначе NO. N от 1 до 30.","input":"Первая строка — N. Далее N чисел — количество правильно решённых примеров.","sampleInput":"4\n3\n9\n2\n8","sampleOutput":"2\nNO","body":"n = int(input())\n# kol = 0\n# kol2 = 0\n\nfor i in range(n):\n    a = int(input())\n    if УСЛОВИЕ:\n        # kol += 1\n    if УСЛОВИЕ:\n        # kol2 += 1","simple":"print(kol)","conditional":"print(kol)\nif УСЛОВИЕ_ВЫВОДА:\n    print('YES')\nelse:\n    print('NO')","mode":"conditional","note":"Первый счётчик считает неудовлетворительные результаты (меньше 5 правильных ответов), второй — учеников, решивших все 10 примеров.","solution":"n = int(input())\nkol = 0\nkol2 = 0\nfor i in range(n):\n    a = int(input())\n    if a < 5:\n        kol += 1\n    if a == 10:\n        kol2 += 1\nprint(kol)\nif kol2 > 0:\n    print('YES')\nelse:\n    print('NO')","hint":"1) kol = 0 — счётчик неудовлетворительных оценок. Если a < 5, увеличь kol на 1.\n2) kol2 = 0 — отдельный счётчик отличников. Если a == 10, увеличь kol2 на 1.\n3) После цикла выведи kol. Затем проверь kol2 > 0: при положительном значении выведи YES, иначе NO.\n4) Это два независимых счётчика: каждый увеличивается только в своём условии.","tests":[{"name":"Граничный случай","input":"1\n4","expected":"1\nNO"},{"name":"Дополнительный случай","input":"2\n5\n10","expected":"0\nYES"},{"name":"Проверка отбора","input":"3\n0\n4\n5","expected":"2\nNO"}]},{"id":18,"group":"for","rank":14,"title":"Среднее чисел с нечётной последней цифрой в записи по основанию 7","condition":"Найти среднее арифметическое десятичных чисел, запись которых в системе счисления с основанием 7 оканчивается нечётной цифрой. Если таких элементов нет, вывести NO.\nСначала вводится N (3 ≤ N ≤ 10 000), затем N натуральных чисел не больше 30 000.","input":"Первая строка — N. Далее N натуральных чисел.","sampleInput":"6\n12\n15\n10\n71\n50\n11","sampleOutput":"31.6","body":"n = int(input())\nkol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\n\nfor i in range(n):\n    a = int(input())\n    if УСЛОВИЕ:\n        kol += 1\n        s += a\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)","simple":"print(round(s / kol, 1))","conditional":"if kol > 0:\n    print(round(s / kol, 1))\nelse:\n    print('NO')","mode":"conditional","note":"Последняя цифра записи в системе с основанием 7 равна остатку от деления на 7. Нечётные остатки: 1, 3 или 5.","solution":"n = int(input())\ns = 0\nkol = 0\nfor i in range(n):\n    a = int(input())\n    if a % 7 % 2 != 0:\n        s += a\n        kol += 1\nif kol > 0:\n    print(round(s / kol, 1))\nelse:\n    print('NO')","hint":"1) Для среднего заведи s = 0 и kol = 0 до цикла.\n2) Последняя цифра записи по основанию 7 равна a % 7. Чтобы она была нечётной, проверь (a % 7) % 2 != 0.\n3) При выполнении условия прибавь a к s и увеличь kol на 1.\n4) Выведи среднее s / kol; в условии гарантируется, что подходящие элементы есть.","tests":[{"name":"Граничный случай","input":"3\n1\n2\n3","expected":"2.0"},{"name":"Дополнительный случай","input":"3\n7\n14\n21","expected":"NO"},{"name":"Проверка отбора","input":"4\n5\n10\n15\n20","expected":"10.0"}]},{"id":20,"group":"for","rank":15,"title":"Среднее чисел, оканчивающихся на 5 в системе счисления по основанию 7","condition":"Найти среднее арифметическое десятичных чисел, запись которых в системе счисления с основанием 7 оканчивается цифрой 5. Если таких элементов нет, вывести NO.\nСначала вводится N (3 ≤ N ≤ 10 000), затем N натуральных чисел не больше 30 000.","input":"Первая строка — N. Далее N натуральных чисел.","sampleInput":"5\n12\n14\n20\n68\n25","sampleOutput":"40","body":"n = int(input())\nkol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\n\nfor i in range(n):\n    a = int(input())\n    if УСЛОВИЕ:\n        kol += 1\n        s += a\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)","simple":"print(s / kol)","conditional":"if kol > 0:\n    print(s / kol)\nelse:\n    print('NO')","mode":"conditional","note":"","solution":"n = int(input())\ns = 0\nkol = 0\nfor i in range(n):\n    a = int(input())\n    if a % 7 == 5:\n        s += a\n        kol += 1\nif kol > 0:\n    print(s / kol)\nelse:\n    print('NO')","hint":"1) Создай s = 0 и kol = 0.\n2) Последняя цифра в системе с основанием 7 равна 5, если a % 7 == 5.\n3) Для подходящих чисел увеличивай сумму s и количество kol.\n4) Если kol > 0, выведи s / kol, округлив/оформив как требует условие; иначе выведи NO.","tests":[{"name":"Граничный случай","input":"5\n12\n14\n20\n68\n25","expected":"40"},{"name":"Дополнительный случай","input":"3\n1\n2\n3","expected":"NO"},{"name":"Проверка отбора","input":"3\n5\n6\n7","expected":"5"}]},{"id":21,"group":"for","rank":16,"title":"Сумма чисел, оканчивающихся на 1 в системе счисления по основанию 7","condition":"Подсчитать сумму элементов последовательности натуральных чисел, запись которых в системе счисления с основанием 7 оканчивается цифрой 1.\nСначала вводится N (1 ≤ N ≤ 1000), затем N чисел. Вывести только сумму в десятичной системе счисления.","input":"Первая строка — N. Далее N натуральных чисел.","sampleInput":"5\n15\n13\n11\n8\n23","sampleOutput":"23","body":"n = int(input())\nkol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\n\nfor i in range(n):\n    a = int(input())\n    if УСЛОВИЕ:\n        kol += 1\n        s += a\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)","simple":"print(s)","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print(ЕСЛИ_ДА)\nelse:\n    print(ЕСЛИ_НЕТ)","mode":"simple","note":"","solution":"n = int(input())\ns = 0\nfor i in range(n):\n    a = int(input())\n    if a % 7 == 1:\n        s += a\nprint(s)","hint":"1) Создай s = 0. Это задача на сумму, дополнительный счётчик не обязателен.\n2) Последняя цифра семеричной записи равна 1, если a % 7 == 1.\n3) В цикле по N числам, если условие выполнено, прибавляй a к s.\n4) В конце выведи только s.","tests":[{"name":"Граничный случай","input":"1\n1","expected":"1"},{"name":"Дополнительный случай","input":"5\n15\n13\n11\n8\n23","expected":"23"},{"name":"Проверка отбора","input":"4\n8\n9\n10\n11","expected":"8"}]},{"id":22,"group":"ranges","rank":1,"title":"Количество чётных чисел на отрезке [a; b]","condition":"По двум натуральным числам a и b подсчитать количество чётных натуральных чисел на отрезке [a; b], включая оба конца.\nГарантируется: 1 ≤ a ≤ b ≤ 30 000. Проверять входные данные не нужно.","input":"Два числа: сначала a, затем b.","sampleInput":"10\n20","sampleOutput":"6","body":"a = int(input())\nb = int(input())\nkol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\n\nfor a in range(a, b + 1):\n    if УСЛОВИЕ:\n        kol += 1\n        s += a\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)","simple":"print(kol)","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print(ЕСЛИ_ДА)\nelse:\n    print(ЕСЛИ_НЕТ)","mode":"simple","note":"","solution":"a = int(input())\nb = int(input())\nkol = 0\nfor a in range(a, b + 1):\n    if a % 2 == 0:\n        kol += 1\nprint(kol)","hint":"1) Введи границы отрезка: start и finish.\n2) kol = 0 создай перед циклом.\n3) Перебирай все числа от start до finish включительно: range(start, finish + 1).\n4) Если a % 2 == 0, увеличь kol на 1. В конце выведи kol.","tests":[{"name":"Граничный случай","input":"10\n20","expected":"6"},{"name":"Дополнительный случай","input":"8\n8","expected":"1"},{"name":"Проверка отбора","input":"9\n9","expected":"0"},{"name":"Ещё один случай","input":"1\n5","expected":"2"}]},{"id":9,"group":"while","rank":1,"title":"Количество трёхзначных чисел, кратных 4","condition":"В последовательности натуральных чисел определить количество трёхзначных чисел, кратных 4.\nКоличество заранее неизвестно. Ввод заканчивается числом 0; ноль не входит в последовательность.","input":"Натуральные числа по одному. Последнее введённое число — 0 (стоп-сигнал).","sampleInput":"120\n9\n365\n4\n0","sampleOutput":"1","body":"kol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\na = int(input())\nwhile a != 0:\n    if УСЛОВИЕ:\n        kol += 1\n        s += a\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)\n    a = int(input())","simple":"print(kol)","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print(ЕСЛИ_ДА)\nelse:\n    print(ЕСЛИ_НЕТ)","mode":"simple","note":"","solution":"kol = 0\na = int(input())\nwhile a != 0:\n    if 100 <= a <= 999 and a % 4 == 0:\n        kol += 1\n    a = int(input())\nprint(kol)","hint":"1) До цикла создай kol = 0.\n2) Вводи a до тех пор, пока a != 0. Ноль — только стоп-сигнал: тело цикла для него не выполняется.\n3) Трёхзначность проверяй через 100 <= a <= 999; кратность 4 — через a % 4 == 0. Объедини оба условия через and.\n4) Для подходящих чисел увеличивай kol. После цикла выведи kol.","tests":[{"name":"Граничный случай","input":"100\n0","expected":"1"},{"name":"Дополнительный случай","input":"99\n1000\n0","expected":"0"},{"name":"Проверка отбора","input":"120\n9\n365\n4\n0","expected":"1"}]},{"id":29,"group":"while","rank":2,"title":"Количество однозначных чисел, кратных 3","condition":"В последовательности натуральных чисел определить количество однозначных чисел, кратных 3.\nКоличество заранее неизвестно. Ввод заканчивается числом 0; ноль не входит в последовательность. Чисел не больше 1000, каждое не больше 30 000.","input":"Натуральные числа по одному. Последнее введённое число — 0 (стоп-сигнал).","sampleInput":"121\n9\n4\n0","sampleOutput":"1","body":"kol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\na = int(input())\nwhile a != 0:\n    if УСЛОВИЕ:\n        kol += 1\n        s += a\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)\n    a = int(input())","simple":"print(kol)","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print(ЕСЛИ_ДА)\nelse:\n    print(ЕСЛИ_НЕТ)","mode":"simple","note":"","solution":"kol = 0\na = int(input())\nwhile a != 0:\n    if 1 <= a <= 9 and a % 3 == 0:\n        kol += 1\n    a = int(input())\nprint(kol)","hint":"1) Создай kol = 0 до цикла.\n2) В цикле while a != 0 проверяй две вещи: _НЕТ)","mode":"simple","note":"","solution":"s = 0\na = int(input())\nwhile a != 0:\n    if a % 6 == 0 and a % 10 == 4:\n        s += a\n    a = int(input())\nprint(s)","hint":"1) Создай s = 0.\n2) Число должно одновременно делиться на 6 и оканчиваться на 4. Объедини проверки через and: a % 6 == 0 and a % 10 == 4.\n3) Если оба условия верны, прибавь a к s.\n4) Выведи s после завершения ввода.","tests":[{"name":"Граничный случай","input":"24\n60\n144\n22\n12\n0","expected":"168"},{"name":"Дополнительный случай","input":"14\n0","expected":"0"},{"name":"Проверка отбора","input":"6\n24\n0","expected":"24"}]},{"id":28,"group":"while","rank":6,"title":"Сумма чисел, кратных 7 и оканчивающихся на 2","condition":"В последовательности натуральных чисел определить сумму всех чисел, кратных 7 и оканчивающихся на 2.\nКоличество заранее неизвестно. Ввод заканчивается числом 0; стоп-сигнал не входит в последовательность.","input":"Натуральные числа по одному. Последнее введённое число — 0.","sampleInput":"112\n24\n42\n49\n22\n0","sampleOutput":"154","body":"kol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\na = int(input())\nwhile a != 0:\n    if УСЛОВИЕ:\n        kol += 1\n        s += a\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)\n    a = int(input())","simple":"print(s)","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print(ЕСЛИ_ДА)\nelse:\n    print(ЕСЛИ_НЕТ)","mode":"simple","note":"","solution":"s = 0\na = int(input())\nwhile a != 0:\n    if a % 7 == 0 and a % 10 == 2:\n        s += a\n    a = int(input())\nprint(s)","hint":"1) Создай s = 0.\n2) Для каждого числа до стоп-сигнала проверь сразу два условия: a % 7 == 0 и a % 10 == 2. Между ними поставь and.\n3) Подходящее число прибавляй к s.\n4) Ноль не включай в сумму и после цикла выведи s.","tests":[{"name":"Граничный случай","input":"112\n24\n42\n49\n22\n0","expected":"154"},{"name":"Дополнительный случай","input":"7\n12\n0","expected":"0"},{"name":"Проверка отбора","input":"14\n22\n42\n49\n0","expected":"42"}]},{"id":24,"group":"while","rank":7,"title":"Длина последовательности и количество нечётных чисел, кратных 3","condition":"Определить длину последовательности и количество нечётных чисел, кратных 3.\nКоличество заранее неизвестно. Ввод заканчивается числом 0; завершающий 0 не учитывается.","input":"Целые числа по одному. Последнее введённое число — 0.","sampleInput":"4\n6\n15\n180\n0","sampleOutput":"4 1","body":"# dlina = 0\n# kol = 0\na = int(input())\nwhile a != 0:\n    # dlina += 1\n    if УСЛОВИЕ:\n        # kol += 1\n    a = int(input())","simple":"print(dlina)\nprint(kol)","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print(ЕСЛИ_ДА)\nelse:\n    print(ЕСЛИ_НЕТ)","mode":"simple","note":"","solution":"dlina = 0\nkol = 0\na = int(input())\nwhile a != 0:\n    dlina += 1\n    if a % 3 == 0 and a % 2 != 0:\n        kol += 1\n    a = int(input())\nprint(dlina, kol)","hint":"1) dlina = 0 — счётчик длины. Увеличивай его на каждом проходе while, потому что любое ненулевое число входит в последовательность.\n2) kol = 0 — второй счётчик. Увеличивай его только для нечётных чисел, кратных 3: a % 2 != 0 and a % 3 == 0.\n3) Сначала прочитай a до начала цикла; в конце каждой итерации обязательно прочитай следующее число. Сам 0 не учитывай.\n4) Выведи оба результата одной строкой в формате «число, число», например: print(dlina, kol).","tests":[{"name":"Граничный случай","input":"0","expected":"0 0"},{"name":"Дополнительный случай","input":"1\n3\n0","expected":"2 1"},{"name":"Проверка отбора","input":"4\n6\n15\n180\n0","expected":"4 1"}],"outputLine":"comma","printInstruction":"Выведи два результата одной командой через запятую между аргументами print: print(x, y). Python разделит значения пробелом."},{"id":25,"group":"while","rank":8,"title":"Сумма последовательности и количество чётных чисел, кратных 5","condition":"Определить сумму всех чисел последовательности и количество чётных чисел, кратных 5.\nКоличество заранее неизвестно. Ввод заканчивается числом 0; завершающий 0 не учитывается.","input":"Целые числа по одному. Последнее введённое число — 0.","sampleInput":"4\n60\n15\n0","sampleOutput":"79\n1","body":"kol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\na = int(input())\nwhile a != 0:\n    s += a\n    if УСЛОВИЕ:\n        s += a\n        kol += 1\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)\n    a = int(input())","simple":"print(s)\nprint(kol)","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print(ЕСЛИ_ДА)\nelse:\n    print(ЕСЛИ_НЕТ)","mode":"simple","note":"","solution":"s = 0\nkol = 0\na = int(input())\nwhile a != 0:\n    s += a\n    if a % 2 == 0 and a % 5 == 0:\n        kol += 1\n    a = int(input())\nprint(s)\nprint(kol)","hint":"1) s = 0 — сумма всех ненулевых чисел. Добавляй к ней a на каждом проходе цикла.\n2) kol = 0 — второй счётчик чётных чисел, кратных 5. Внутри отдельного if проверь a % 2 == 0 and a % 5 == 0 и увеличь kol.\n3) Перед while прочитай первое число, в конце цикла — следующее. 0 не суммируй и не считай.\n4) Выведи сумму и количество; в исходной задаче это два результата.","tests":[{"name":"Граничный случай","input":"4\n60\n15\n0","expected":"79\n1"},{"name":"Дополнительный случай","input":"0","expected":"0\n0"},{"name":"Проверка отбора","input":"10\n20\n30\n0","expected":"60\n3"}]},{"id":26,"group":"while","rank":9,"title":"Длина последовательности и сумма чётных чисел","condition":"Определить количество чисел в последовательности и сумму чётных чисел.\nКоличество заранее неизвестно. Ввод заканчивается числом 0; завершающий 0 не учитывается. Не более 1000 чисел, модуль каждого не больше 30 000.","input":"Целые числа по одному. Последнее введённое число — 0.","sampleInput":"4\n60\n15\n0","sampleOutput":"3 64","body":"# dlina = 0\n# s = 0\na = int(input())\nwhile a != 0:\n    # dlina += 1\n    if УСЛОВИЕ:\n        # s += a\n    a = int(input())","simple":"print(dlina)\nprint(s)","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print(ЕСЛИ_ДА)\nelse:\n    print(ЕСЛИ_НЕТ)","mode":"simple","note":"","solution":"dlina = 0\ns = 0\na = int(input())\nwhile a != 0:\n    dlina += 1\n    if a % 2 == 0:\n        s += a\n    a = int(input())\nprint(dlina, s)","hint":"1) dlina = 0 — счётчик всех ненулевых чисел. Увеличивай его на каждом проходе while.\n2) s = 0 — сумма только чётных чисел. Внутри if проверь a % 2 == 0 и прибавь к s само число a.\n3) Сначала прочитай первое a, а в конце каждой итерации — следующее. Ноль не входит в длину и сумму.\n4) Выведи длину и сумму одной строкой через запятую и пробел: print(dlina, s).","tests":[{"name":"Граничный случай","input":"4\n60\n15\n0","expected":"3 64"},{"name":"Дополнительный случай","input":"0","expected":"0 0"},{"name":"Проверка отбора","input":"-2\n-4\n3\n0","expected":"3 -6"}],"outputLine":"comma","printInstruction":"Выведи два результата одной командой через запятую между аргументами print: print(x, y). Python разделит значения пробелом."},{"id":27,"group":"while","rank":10,"title":"Сумма и разность количества положительных и отрицательных чисел","condition":"В последовательности целых чисел определить сумму чисел и разность количества положительных и отрицательных чисел (положительные минус отрицательные).\nКоличество заранее неизвестно. Ввод заканчивается числом 0; завершающий 0 не учитывается.","input":"Целые числа по одному. Последнее введённое число — 0.","sampleInput":"150\n-200\n-1\n0","sampleOutput":"-51\n-1","body":"kol = 0\ns = 0\npr = 1\nplus = 0\nminus = 0\na = int(input())\nwhile a != 0:\n    s += a\n    plus += 1\n    minus += 1\n    if УСЛОВИЕ:\n        s += a\n        plus += 1\n        minus += 1\n    if УСЛОВИЕ:\n        s += a\n        plus += 1\n        minus += 1\n    a = int(input())","simple":"print(s)\nprint(plus - minus)","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print(ЕСЛИ_ДА)\nelse:\n    print(ЕСЛИ_НЕТ)","mode":"simple","note":"","solution":"s = 0\nplus = 0\nminus = 0\na = int(input())\nwhile a != 0:\n    s += a\n    if a > 0:\n        plus += 1\n    if a < 0:\n        minus += 1\n    a = int(input())\nprint(s)\nprint(plus - minus)","hint":"1) s = 0 — сумма всех ненулевых чисел: прибавляй каждое a.\n2) plus = 0 — счётчик положительных; увеличивай при a > 0. minus = 0 — счётчик отрицательных; увеличивай при a < 0.\n3) Ноль завершает ввод и не входит ни в сумму, ни в счётчики.\n4) Выведи s и разность plus - minus. Это два результата; в этой задаче оставь вывод отдельными строками.","tests":[{"name":"Граничный случай","input":"150\n-200\n-1\n0","expected":"-51\n-1"},{"name":"Дополнительный случай","input":"5\n1\n0","expected":"6\n2"},{"name":"Проверка отбора","input":"-5\n-1\n0","expected":"-6\n-2"}]},{"id":31,"group":"while","rank":11,"title":"Сумма трёхзначных чисел, кратных 4","condition":"В последовательности натуральных чисел вычислить сумму трёхзначных чисел, кратных 4.\nКоличество заранее неизвестно. Ввод заканчивается числом 0; завершающий 0 не входит в последовательность. Не более 20 чисел, каждое не больше 1500.","input":"Натуральные числа по одному. Последнее введённое число — 0.","sampleInput":"18\n192\n104\n117\n0","sampleOutput":"296","body":"kol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\na = int(input())\nwhile a != 0:\n    if УСЛОВИЕ:\n        kol += 1\n        s += a\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)\n    a = int(input())","simple":"print(s)","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print(ЕСЛИ_ДА)\nelse:\n    print(ЕСЛИ_НЕТ)","mode":"simple","note":"","solution":"s = 0\na = int(input())\nwhile a != 0:\n    if 100 <= a <= 999 and a % 4 == 0:\n        s += a\n    a = int(input())\nprint(s)","hint":"1) s = 0 — накопитель суммы.\n2) Для каждого ненулевого числа проверь две части: трёхзначное (100 <= a <= 999) и кратное 4 (a % 4 == 0). Соедини через and.\n3) Только если обе части верны, прибавь a к s.\n4) После цикла выведи s.","tests":[{"name":"Граничный случай","input":"18\n192\n104\n117\n0","expected":"296"},{"name":"Дополнительный случай","input":"100\n101\n0","expected":"100"},{"name":"Проверка отбора","input":"996\n1200\n0","expected":"996"}]},{"id":15,"group":"while","rank":12,"title":"Среднее чисел, кратных 8 (или NO)","condition":"Найти среднее арифметическое чисел, кратных 8. Если таких чисел нет, вывести NO.\nКоличество заранее неизвестно. Ввод заканчивается числом 0; завершающий 0 не входит в последовательность. Не более 100 чисел, каждое не больше 300.","input":"Натуральные числа по одному. Последнее введённое число — 0.","sampleInput":"8\n122\n64\n16\n0","sampleOutput":"29.3","body":"kol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\na = int(input())\nwhile a != 0:\n    if УСЛОВИЕ:\n        kol += 1\n        s += a\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)\n    a = int(input())","simple":"print(round(s / kol, 1))","conditional":"if kol > 0:\n    print(round(s / kol, 1))\nelse:\n    print('NO')","mode":"conditional","note":"","solution":"s = 0\nkol = 0\na = int(input())\nwhile a != 0:\n    if a % 8 == 0:\n        s += a\n        kol += 1\n    a = int(input())\nif kol > 0:\n    print(round(s / kol, 1))\nelse:\n    print('NO')","hint":"1) s = 0 и kol = 0 создай до цикла. s хранит сумму подходящих чисел, kol — их количество.\n2) Внутри while a != 0 проверь кратность 8. Для подходящего числа увеличь оба накопителя.\n3) После цикла обязательно проверь kol > 0. Если kol равен нулю, делить нельзя — выведи NO.\n4) Иначе выведи среднее s / kol с одним знаком после точки.","tests":[{"name":"Граничный случай","input":"8\n122\n64\n16\n0","expected":"29.3"},{"name":"Дополнительный случай","input":"3\n5\n0","expected":"NO"},{"name":"Проверка отбора","input":"16\n0","expected":"16.0"}]},{"id":17,"group":"while","rank":13,"title":"Среднее двузначных чисел (или NO)","condition":"Найти среднее арифметическое двузначных чисел. Если таких чисел нет, вывести NO.\nКоличество заранее неизвестно. Ввод заканчивается числом 0; завершающий 0 не учитывается. Не более 100 чисел, каждое не больше 300.","input":"Натуральные числа по одному. Последнее введённое число — 0.","sampleInput":"10\n120\n49\n0","sampleOutput":"29.5","body":"kol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\na = int(input())\nwhile a != 0:\n    if УСЛОВИЕ:\n        kol += 1\n        s += a\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)\n    a = int(input())","simple":"print(round(s / kol, 1))","conditional":"if kol > 0:\n    print(round(s / kol, 1))\nelse:\n    print('NO')","mode":"conditional","note":"","solution":"s = 0\nkol = 0\na = int(input())\nwhile a != 0:\n    if 10 <= a <= 99:\n        s += a\n        kol += 1\n    a = int(input())\nif kol > 0:\n    print(round(s / kol, 1))\nelse:\n    print('NO')","hint":"1) s = 0 и kol = 0 создай до цикла.\n2) Двузначные натуральные числа — от 10 до 99 включительно. Для них прибавляй a к s и увеличивай kol.\n3) Ноль только останавливает ввод и не учитывается.\n4) После цикла: если kol > 0, выведи среднее s / kol с одним знаком; иначе выведи NO.","tests":[{"name":"Граничный случай","input":"10\n120\n49\n0","expected":"29.5"},{"name":"Дополнительный случай","input":"99\n120\n0","expected":"99.0"},{"name":"Проверка отбора","input":"10\n99\n120\n0","expected":"54.5"}]},{"id":19,"group":"while","rank":14,"title":"Среднее чисел, у которых запись в системе 7 оканчивается на 5 (или NO)","condition":"Найти среднее арифметическое натуральных десятичных чисел, запись которых в системе счисления по основанию 7 оканчивается цифрой 5. Если таких чисел нет, вывести NO.\nКоличество заранее неизвестно. Ввод заканчивается числом 0; завершающий 0 не учитывается. Числа не больше 30 000.","input":"Натуральные числа по одному. Последнее введённое число — 0.","sampleInput":"12\n14\n20\n68\n25\n0","sampleOutput":"40","body":"kol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\na = int(input())\nwhile a != 0:\n    if УСЛОВИЕ:\n        kol += 1\n        s += a\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)\n    a = int(input())","simple":"print(s / kol)","conditional":"if kol > 0:\n    print(s / kol)\nelse:\n    print('NO')","mode":"conditional","note":"","solution":"s = 0\nkol = 0\na = int(input())\nwhile a != 0:\n    if a % 7 == 5:\n        s += a\n        kol += 1\n    a = int(input())\nif kol > 0:\n    print(s / kol)\nelse:\n    print('NO')","hint":"1) s = 0 и kol = 0 создай перед while.\n2) В семеричной системе последняя цифра 5 тогда и только тогда, когда a % 7 == 5.\n3) Для каждого подходящего числа увеличь сумму s на a и счётчик kol на 1.\n4) После цикла проверь kol > 0: при нуле выведи NO, иначе — среднее s / kol. Ноль-стоп не обрабатывается внутри цикла.","tests":[{"name":"Граничный случай","input":"12\n14\n20\n68\n25\n0","expected":"40"},{"name":"Дополнительный случай","input":"1\n2\n0","expected":"NO"},{"name":"Проверка отбора","input":"5\n12\n19\n26\n0","expected":"15.5"}]},{"id":32,"group":"ranges","rank":2,"title":"Количество нечётных чисел на отрезке [a; b]","condition":"По двум натуральным числам a и b подсчитать количество нечётных натуральных чисел на отрезке [a; b], включая оба конца.\nГарантируется: 1 ≤ a ≤ b ≤ 30 000.","input":"Два числа: сначала левая граница a, затем правая граница b.","sampleInput":"1\n10","sampleOutput":"5","body":"a = int(input())\nb = int(input())\n# kol = 0\n\nfor a in range(a, b + 1):\n    if УСЛОВИЕ:\n        # kol += 1","simple":"print(kol)","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print()\nelse:\n    print()","mode":"simple","note":"Перебирай от a до b включительно. Счётчик меняется только для нечётных чисел.","solution":"a = int(input())\nb = int(input())\nkol = 0\nfor a in range(a, b + 1):\n    if a % 2 != 0:\n        kol += 1\nprint(kol)","hint":"1) Прочитай две границы a и b.\n2) Создай kol = 0 до цикла. Перебирай значения a от a до b включительно.\n3) Для нечётного числа используй a % 2 != 0. Только в этом случае увеличивай kol на 1.\n4) В конце выведи kol. Если границы совпадают, результат будет либо 1, либо 0.","tests":[{"name":"Один нечётный элемент","input":"7\n7","expected":"1"},{"name":"Один чётный элемент","input":"8\n8","expected":"0"},{"name":"Границы разной чётности","input":"1\n10","expected":"5"},{"name":"Все числа отрезка","input":"10\n20","expected":"5"}]},{"id":33,"group":"ranges","rank":3,"title":"Сумма чисел, кратных 3, на отрезке [a; b]","condition":"По двум натуральным числам a и b найти сумму чисел, кратных 3, на отрезке [a; b], включая оба конца.\nГарантируется: 1 ≤ a ≤ b ≤ 30 000. Если подходящих чисел нет, сумма равна 0.","input":"Два числа: сначала левая граница a, затем правая граница b.","sampleInput":"1\n10","sampleOutput":"18","body":"a = int(input())\nb = int(input())\n# s = 0\n\nfor a in range(a, b + 1):\n    if УСЛОВИЕ:\n        # s += a","simple":"print(s)","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print()\nelse:\n    print()","mode":"simple","note":"Здесь нужен накопитель суммы, а не счётчик. Подходящее число прибавляется к s.","solution":"a = int(input())\nb = int(input())\ns = 0\nfor a in range(a, b + 1):\n    if a % 3 == 0:\n        s += a\nprint(s)","hint":"1) Прочитай a и b.\n2) До цикла создай s = 0 — накопитель суммы. Перебирай все a от a до b включительно.\n3) Проверь кратность 3: a % 3 == 0. Если условие выполнено, прибавь само a к s.\n4) Если на отрезке нет кратных 3, s останется равным 0. В конце выведи s.","tests":[{"name":"Один подходящий элемент","input":"3\n3","expected":"3"},{"name":"Нет подходящих чисел","input":"4\n5","expected":"0"},{"name":"Кратные трём на отрезке","input":"1\n10","expected":"18"},{"name":"Граничные значения","input":"6\n12","expected":"27"}]},{"id":101,"title":"Среднее чётных и количество нечётных, кратных 3","condition":"В последовательности натуральных чисел найти:\n1) среднее арифметическое чётных чисел (с точностью до одного знака после запятой);\n2) количество нечётных чисел, кратных 3.\nСначала вводится N (1 ≤ N ≤ 100), затем N чисел. Гарантируется, что хотя бы одно число чётное.","input":"Первая строка — N. Далее N натуральных чисел.","solution":"n = int(input())\ns = 0\nkol = 0\nkol2 = 0\nfor i in range(n):\n    a = int(input())\n    if a % 2 == 0:\n        s += a\n        kol += 1\n    if a % 2 != 0 and a % 3 == 0:\n        kol2 += 1\nprint(round(s / kol, 1))\nprint(kol2)","hint":"Здесь два независимых условия, поэтому два отдельных if (не elif!).\n1) Для чётных копи сумму s и их количество kol — они нужны для среднего.\n2) Для нечётных, кратных 3, — второй счётчик kol2. Условие составное: a % 2 != 0 and a % 3 == 0.\n3) Выведи round(s / kol, 1) и kol2 — двумя print.","tests":[{"name":"Пример","input":"4\n2\n9\n4\n15","expected":"3.0\n2"},{"name":"Граничный случай","input":"1\n8","expected":"8.0\n0"},{"name":"Проверка отбора","input":"5\n3\n6\n21\n10\n27","expected":"8.0\n3"},{"name":"Ещё один случай","input":"3\n2\n4\n5","expected":"3.0\n0"}],"simple":"print()\nprint()","body":"n = int(input())\n# kol = 0\n# kol2 = 0\n# s = 0\n\nfor i in range(n):\n    a = int(input())\n    if УСЛОВИЕ:\n        # s += a\n        # kol += 1\n    if УСЛОВИЕ:\n        # kol2 += 1","mode":"simple","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print()\nelse:\n    print()","note":"","group":"hard","rank":1,"sampleInput":"4\n2\n9\n4\n15","sampleOutput":"3.0\n2"},{"id":102,"title":"Максимум оканчивающихся на 7 и минимум кратных 5","condition":"В последовательности натуральных чисел найти максимальное число, оканчивающееся на 7, и минимальное число, кратное 5.\nСначала вводится N (2 ≤ N ≤ 100), затем N чисел, каждое не больше 30 000. Гарантируется, что есть и число, оканчивающееся на 7, и число, кратное 5. Вывести два числа, каждое на своей строке.","input":"Первая строка — N. Далее N натуральных чисел.","solution":"n = int(input())\nmaxi = -10**10\nmini = 10**10\nfor i in range(n):\n    a = int(input())\n    if a % 10 == 7:\n        maxi = max(maxi, a)\n    if a % 5 == 0:\n        mini = min(mini, a)\nprint(maxi)\nprint(mini)","hint":"Два разных отбора — два if.\n1) maxi обновляется только для чисел с последней цифрой 7 (a % 10 == 7).\n2) mini обновляется только для кратных 5.\n3) Начальные значения: maxi = -10**10, mini = 10**10.","tests":[{"name":"Пример","input":"4\n17\n25\n7\n100","expected":"17\n25"},{"name":"Граничный случай","input":"2\n57\n5","expected":"57\n5"},{"name":"Проверка отбора","input":"5\n27\n35\n77\n10\n20","expected":"77\n10"},{"name":"Ещё один случай","input":"3\n15\n7\n25","expected":"7\n15"}],"simple":"print()\nprint()","body":"n = int(input())\n# maxi = -10**10\n# mini = 10**10\n\nfor i in range(n):\n    a = int(input())\n    if УСЛОВИЕ:\n        # maxi = max(maxi, a)\n    if УСЛОВИЕ:\n        # mini = min(mini, a)","mode":"simple","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print()\nelse:\n    print()","note":"","group":"hard","rank":2,"sampleInput":"4\n17\n25\n7\n100","sampleOutput":"17\n25"},{"id":103,"title":"Разность максимального чётного и минимального нечётного","condition":"В последовательности натуральных чисел найти разность между максимальным чётным числом и минимальным нечётным числом.\nСначала вводится N (2 ≤ N ≤ 100), затем N чисел. Гарантируется, что есть и чётные, и нечётные числа.","input":"Первая строка — N. Далее N натуральных чисел.","solution":"n = int(input())\nmaxi = -10**10\nmini = 10**10\nfor i in range(n):\n    a = int(input())\n    if a % 2 == 0:\n        maxi = max(maxi, a)\n    else:\n        mini = min(mini, a)\nprint(maxi - mini)","hint":"Чётное и нечётное — два взаимоисключающих случая, удобно if … else.\n1) Чётное число — обновляй максимум maxi.\n2) Иначе (нечётное) — обновляй минимум mini.\n3) Выведи одну разность maxi - mini (может получиться отрицательной).","tests":[{"name":"Пример","input":"4\n10\n3\n8\n7","expected":"7"},{"name":"Граничный случай","input":"2\n2\n9","expected":"-7"},{"name":"Проверка отбора","input":"5\n100\n1\n50\n99\n3","expected":"99"},{"name":"Ещё один случай","input":"3\n13\n12\n11","expected":"1"}],"simple":"print()","body":"n = int(input())\n# maxi = -10**10\n# mini = 10**10\n\nfor i in range(n):\n    a = int(input())\n    if УСЛОВИЕ:\n        # maxi = max(maxi, a)\n    else:\n        # mini = min(mini, a)","mode":"simple","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print()\nelse:\n    print()","note":"","group":"hard","rank":3,"sampleInput":"4\n10\n3\n8\n7","sampleOutput":"7"},{"id":104,"title":"Максимум, кратный 4, и сколько раз он встречается","condition":"В последовательности натуральных чисел найти максимальное число, кратное 4, и количество таких максимальных чисел.\nСначала вводится N (1 ≤ N ≤ 100), затем N чисел. Гарантируется, что хотя бы одно число кратно 4. Вывести два числа через пробел.","input":"Первая строка — N. Далее N натуральных чисел.","solution":"n = int(input())\nmaxi = -10**10\nkol = 0\nfor i in range(n):\n    a = int(input())\n    if a % 4 == 0:\n        if a > maxi:\n            maxi = a\n            kol = 1\n        elif a == maxi:\n            kol += 1\nprint(maxi, kol)","hint":"Новый приём: счётчик максимума.\n1) Если подходящее число больше maxi — это новый максимум: maxi = a и kol = 1 (счёт начинается заново!).\n2) Если подходящее число равно maxi — kol += 1.\n3) Вывод: print(maxi, kol).","tests":[{"name":"Пример","input":"5\n8\n12\n3\n12\n4","expected":"12 2"},{"name":"Граничный случай","input":"1\n4","expected":"4 1"},{"name":"Проверка отбора","input":"6\n16\n16\n16\n20\n7\n8","expected":"20 1"},{"name":"Ещё один случай","input":"4\n40\n12\n40\n40","expected":"40 3"}],"simple":"print()","body":"n = int(input())\n# maxi = -10**10\n# kol = 0\n\nfor i in range(n):\n    a = int(input())\n    if УСЛОВИЕ:\n        if УСЛОВИЕ:\n            # maxi = a\n            # kol = 1\n        elif УСЛОВИЕ:\n            # kol += 1","mode":"simple","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print()\nelse:\n    print()","note":"","group":"hard","rank":4,"sampleInput":"5\n8\n12\n3\n12\n4","sampleOutput":"12 2"},{"id":105,"title":"Пары соседних чисел, где второе больше первого","condition":"Дана последовательность натуральных чисел. Определить, сколько раз число оказывается больше предыдущего (количество пар соседних элементов, в которых второй больше первого).\nСначала вводится N (1 ≤ N ≤ 100), затем N чисел.","input":"Первая строка — N. Далее N натуральных чисел.","solution":"n = int(input())\nkol = 0\nprev = int(input())\nfor i in range(n - 1):\n    a = int(input())\n    if a > prev:\n        kol += 1\n    prev = a\nprint(kol)","hint":"Нужно помнить предыдущее число.\n1) Первое число прочитай до цикла в переменную prev.\n2) В цикле range(n - 1) читай следующее a, сравнивай с prev.\n3) В конце каждого шага обязательно prev = a — теперь оно станет «предыдущим».","tests":[{"name":"Пример","input":"5\n1\n3\n2\n5\n6","expected":"3"},{"name":"Граничный случай","input":"1\n7","expected":"0"},{"name":"Проверка отбора","input":"4\n9\n8\n7\n6","expected":"0"},{"name":"Ещё один случай","input":"3\n5\n5\n6","expected":"1"}],"simple":"print()","body":"n = int(input())\n# kol = 0\nprev = int(input())\n\nfor i in range(n - 1):\n    a = int(input())\n    if УСЛОВИЕ:\n        # kol += 1\n    # prev = a","mode":"simple","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print()\nelse:\n    print()","note":"","group":"hard","rank":5,"sampleInput":"5\n1\n3\n2\n5\n6","sampleOutput":"3"},{"id":106,"title":"Произведение чисел, оканчивающихся на 2 в семеричной записи","condition":"В последовательности натуральных чисел найти произведение чисел, запись которых в системе счисления с основанием 7 оканчивается цифрой 2. Если таких чисел нет, вывести NO.\nСначала вводится N (1 ≤ N ≤ 20), затем N чисел, каждое не больше 100.","input":"Первая строка — N. Далее N натуральных чисел.","solution":"n = int(input())\npr = 1\nkol = 0\nfor i in range(n):\n    a = int(input())\n    if a % 7 == 2:\n        pr *= a\n        kol += 1\nif kol > 0:\n    print(pr)\nelse:\n    print('NO')","hint":"Последняя цифра в 7-ричной записи — это остаток a % 7.\n1) Произведение начинается с pr = 1.\n2) Чтобы понять, были ли подходящие числа, заведи счётчик kol.\n3) Вывод с условием: если kol > 0 — печатай pr, иначе NO.","tests":[{"name":"Пример","input":"3\n2\n9\n10","expected":"18"},{"name":"Граничный случай","input":"2\n1\n3","expected":"NO"},{"name":"Проверка отбора","input":"4\n16\n23\n2\n7","expected":"736"},{"name":"Ещё один случай","input":"1\n2","expected":"2"}],"simple":"print()","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print()\nelse:\n    print()","mode":"conditional","body":"n = int(input())\n# pr = 1\n# kol = 0\n\nfor i in range(n):\n    a = int(input())\n    if УСЛОВИЕ:\n        # pr *= a\n        # kol += 1","note":"","group":"hard","rank":6,"sampleInput":"3\n2\n9\n10","sampleOutput":"18"},{"id":107,"title":"Двузначные числа с убывающими цифрами: количество и сумма","condition":"Найти количество и сумму двузначных чисел, у которых цифра десятков больше цифры единиц.\nКоличество чисел заранее неизвестно. Ввод заканчивается числом 0; завершающий 0 не входит в последовательность. Вывести два числа, каждое на своей строке.","input":"Целые неотрицательные числа по одному. Последнее введённое число — 0.","solution":"kol = 0\ns = 0\na = int(input())\nwhile a != 0:\n    if 10 <= a <= 99 and a // 10 > a % 10:\n        kol += 1\n        s += a\n    a = int(input())\nprint(kol)\nprint(s)","hint":"Цифры двузначного числа: десятки a // 10, единицы a % 10.\n1) Условие составное: 10 <= a <= 99 and a // 10 > a % 10.\n2) Для подходящих — kol += 1 и s += a.\n3) Не забудь в конце цикла прочитать следующее число.","tests":[{"name":"Пример","input":"21\n12\n90\n5\n0","expected":"2\n111"},{"name":"Граничный случай","input":"0","expected":"0\n0"},{"name":"Проверка отбора","input":"11\n33\n98\n320\n0","expected":"1\n98"},{"name":"Ещё один случай","input":"54\n10\n0","expected":"2\n64"}],"simple":"print()\nprint()","body":"# kol = 0\n# s = 0\na = int(input())\nwhile a != 0:\n    if УСЛОВИЕ:\n        # kol += 1\n        # s += a\n    a = int(input())","mode":"simple","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print()\nelse:\n    print()","note":"","group":"hard","rank":7,"sampleInput":"21\n12\n90\n5\n0","sampleOutput":"2\n111"},{"id":108,"title":"Среднее чисел, кратных 3, но не кратных 9 (или NO)","condition":"Найти среднее арифметическое чисел, которые делятся на 3, но не делятся на 9. Если таких чисел нет, вывести NO.\nКоличество чисел заранее неизвестно. Ввод заканчивается числом 0. Среднее вывести с точностью до одного знака после запятой.","input":"Натуральные числа по одному. Последнее введённое число — 0.","solution":"s = 0\nkol = 0\na = int(input())\nwhile a != 0:\n    if a % 3 == 0 and a % 9 != 0:\n        s += a\n        kol += 1\n    a = int(input())\nif kol > 0:\n    print(round(s / kol, 1))\nelse:\n    print('NO')","hint":"1) Условие «делится на 3, но не на 9»: a % 3 == 0 and a % 9 != 0.\n2) Для среднего нужны и сумма s, и количество kol.\n3) Деление на ноль опасно — сначала проверь kol > 0.","tests":[{"name":"Пример","input":"3\n9\n6\n0","expected":"4.5"},{"name":"Граничный случай","input":"9\n18\n0","expected":"NO"},{"name":"Проверка отбора","input":"12\n15\n21\n27\n0","expected":"16.0"},{"name":"Ещё один случай","input":"0","expected":"NO"}],"simple":"print()","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print()\nelse:\n    print()","mode":"conditional","body":"# s = 0\n# kol = 0\na = int(input())\nwhile a != 0:\n    if УСЛОВИЕ:\n        # s += a\n        # kol += 1\n    a = int(input())","note":"","group":"hard","rank":8,"sampleInput":"3\n9\n6\n0","sampleOutput":"4.5"},{"id":109,"title":"Длина последовательности и количество «рекордов»","condition":"Ученик вводит результаты прыжков (натуральные числа) до числа 0. «Рекорд» — результат, который больше всех предыдущих (первый результат тоже считается рекордом). Найти количество результатов и количество рекордов.\nВывести два числа через запятую и пробел, например: 5, 3","input":"Натуральные числа по одному. Последнее введённое число — 0.","solution":"dlina = 0\nkol = 0\nmaxi = -10**10\na = int(input())\nwhile a != 0:\n    dlina += 1\n    if a > maxi:\n        kol += 1\n        maxi = a\n    a = int(input())\nprint(dlina, kol)","hint":"Рекорд — это момент, когда обновляется максимум.\n1) dlina += 1 для каждого числа (вне if).\n2) Если a > maxi — это рекорд: kol += 1 и maxi = a.\n3) Вывод одной строкой: print(dlina, kol).","tests":[{"name":"Пример","input":"3\n5\n4\n8\n0","expected":"4 3"},{"name":"Граничный случай","input":"7\n0","expected":"1 1"},{"name":"Проверка отбора","input":"9\n1\n2\n3\n0","expected":"4 1"},{"name":"Ещё один случай","input":"1\n2\n3\n0","expected":"3 3"}],"simple":"print()","printInstruction":"Выведи два результата одной командой через запятую между аргументами print: print(x, y). Python разделит значения пробелом.","outputLine":"comma","body":"# dlina = 0\n# kol = 0\n# maxi = -10**10\na = int(input())\nwhile a != 0:\n    # dlina += 1\n    if УСЛОВИЕ:\n        # kol += 1\n        # maxi = a\n    a = int(input())","mode":"simple","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print()\nelse:\n    print()","note":"","group":"hard","rank":9,"sampleInput":"3\n5\n4\n8\n0","sampleOutput":"4 3"},{"id":110,"title":"Сумма положительных и произведение отрицательных","condition":"Дана последовательность целых чисел, заканчивающаяся числом 0. Найти сумму положительных чисел и произведение отрицательных.\nГарантируется, что есть хотя бы одно положительное и хотя бы одно отрицательное число, все числа по модулю не больше 10. Вывести два числа, каждое на своей строке.","input":"Целые числа по одному. Последнее введённое число — 0.","solution":"s = 0\npr = 1\na = int(input())\nwhile a != 0:\n    if a > 0:\n        s += a\n    if a < 0:\n        pr *= a\n    a = int(input())\nprint(s)\nprint(pr)","hint":"1) Два условия: a > 0 — к сумме, a < 0 — к произведению.\n2) Произведение начинается с 1, а не с 0.\n3) Знак произведения сам получится правильным: минус на минус даёт плюс.","tests":[{"name":"Пример","input":"5\n-2\n3\n-4\n0","expected":"8\n8"},{"name":"Граничный случай","input":"1\n-3\n0","expected":"1\n-3"},{"name":"Проверка отбора","input":"-1\n-1\n-1\n10\n0","expected":"10\n-1"},{"name":"Ещё один случай","input":"2\n2\n-5\n0","expected":"4\n-5"}],"simple":"print()\nprint()","body":"# s = 0\n# pr = 1\na = int(input())\nwhile a != 0:\n    if УСЛОВИЕ:\n        # s += a\n    if УСЛОВИЕ:\n        # pr *= a\n    a = int(input())","mode":"simple","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print()\nelse:\n    print()","note":"","group":"hard","rank":10,"sampleInput":"5\n-2\n3\n-4\n0","sampleOutput":"8\n8"},{"id":111,"title":"Отрезок: кратные 3, но не кратные 5 — количество и сумма","condition":"По двум натуральным числам a и b (a ≤ b) найти количество и сумму чисел отрезка [a; b], которые делятся на 3, но не делятся на 5. Если таких чисел нет, вывести NO.\nВывести количество и сумму через пробел.","input":"Два числа: сначала a, затем b.","solution":"a = int(input())\nb = int(input())\nkol = 0\ns = 0\nfor a in range(a, b + 1):\n    if a % 3 == 0 and a % 5 != 0:\n        kol += 1\n        s += a\nif kol > 0:\n    print(kol, s)\nelse:\n    print('NO')","hint":"1) Перебор: for a in range(a, b + 1) — правая граница включена.\n2) Составное условие: a % 3 == 0 and a % 5 != 0.\n3) Если ничего не нашлось — NO; иначе print(kol, s).","tests":[{"name":"Пример","input":"1\n15","expected":"4 30"},{"name":"Граничный случай","input":"15\n15","expected":"NO"},{"name":"Проверка отбора","input":"10\n20","expected":"2 30"},{"name":"Ещё один случай","input":"3\n3","expected":"1 3"}],"simple":"print()","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print()\nelse:\n    print()","mode":"conditional","body":"a = int(input())\nb = int(input())\n# kol = 0\n# s = 0\n\nfor a in range(a, b + 1):\n    if УСЛОВИЕ:\n        # kol += 1\n        # s += a","note":"","group":"hard","rank":11,"sampleInput":"1\n15","sampleOutput":"4 30"},{"id":112,"title":"Наименьшее трёхзначное число с одинаковыми первой и последней цифрами","condition":"В последовательности натуральных чисел найти наименьшее трёхзначное число, у которого первая цифра равна последней. Если таких чисел нет, вывести NO.\nСначала вводится N (1 ≤ N ≤ 100), затем N чисел, каждое не больше 30 000.","input":"Первая строка — N. Далее N натуральных чисел.","solution":"n = int(input())\nmini = 10**10\nfor i in range(n):\n    a = int(input())\n    if 100 <= a <= 999 and a // 100 == a % 10:\n        mini = min(mini, a)\nif mini < 10**10:\n    print(mini)\nelse:\n    print('NO')","hint":"Первая цифра трёхзначного числа — a // 100, последняя — a % 10.\n1) Условие: 100 <= a <= 999 and a // 100 == a % 10.\n2) Обновляй mini = min(mini, a).\n3) Если mini так и осталось 10**10 — подходящих не было, выводи NO.","tests":[{"name":"Пример","input":"4\n121\n303\n44\n2002","expected":"121"},{"name":"Граничный случай","input":"2\n123\n55","expected":"NO"},{"name":"Проверка отбора","input":"3\n989\n505\n1001","expected":"505"},{"name":"Ещё один случай","input":"1\n111","expected":"111"}],"simple":"print()","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print()\nelse:\n    print()","mode":"conditional","body":"n = int(input())\n# mini = 10**10\n\nfor i in range(n):\n    a = int(input())\n    if УСЛОВИЕ:\n        # mini = min(mini, a)","note":"","group":"hard","rank":12,"sampleInput":"4\n121\n303\n44\n2002","sampleOutput":"121"},{"id":113,"title":"Среднее максимального и минимального среди чётных","condition":"В последовательности натуральных чисел найти среднее арифметическое максимального и минимального из чётных чисел. Гарантируется, что хотя бы одно число чётное.\nСначала вводится N (1 ≤ N ≤ 100), затем N чисел. Ответ вывести с одним знаком после запятой.","input":"Первая строка — N. Далее N натуральных чисел.","solution":"n = int(input())\nmaxi = -10**10\nmini = 10**10\nfor i in range(n):\n    a = int(input())\n    if a % 2 == 0:\n        maxi = max(maxi, a)\n        mini = min(mini, a)\nprint(round((maxi + mini) / 2, 1))","hint":"1) Под одним условием a % 2 == 0 обновляй и maxi, и mini.\n2) Среднее двух чисел: (maxi + mini) / 2 — скобки обязательны!\n3) round(..., 1).","test // ===== ОГЭ №16: ОБРАБОТКА ЧИСЕЛ — тренажёр =====
const GROUPS=[
 {id:'for',title:'FOR',name:'FOR — количество чисел известно',desc:'Сначала вводится N, затем N чисел.'},
 {id:'while',title:'WHILE',name:'WHILE — ввод до нуля',desc:'Числа вводятся до стоп-сигнала 0; сам 0 не обрабатывается.'},
 {id:'ranges',title:'ОТРЕЗКИ',name:'ОТРЕЗКИ — перебор [a; b]',desc:'Перебираем все числа отрезка от a до b включительно.'},
 {id:'hard',title:'ХАРД',name:'ХАРД — комбинированные задачи',desc:'Несколько условий, счётчик максимума, предыдущее число, цифры числа, семеричная запись.'}];
const ORDERED=GROUPS.flatMap(g=>TASKS.filter(t=>t.group===g.id).sort((a,b)=>a.rank-b.rank));
const NUM=new Map(ORDERED.map((t,i)=>[t.id,i+1]));
const gnum=id=>NUM.get(Number(id))||id;
const EMBEDDED_STATE = {};
const DBKEY='oge16_trainer_students_v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const OPTIONAL=['kol','kol2','s','s2','pr','maxi','mini','bad','plus','minus','dlina','kol40','pos','neg','count','nechet','prev'];
const INIT_SNIPPETS=['kol = 0','kol2 = 0','s = 0','pr = 1','maxi = -10**10','mini = 10**10','dlina = 0','plus = 0','minus = 0'];
const UPDATE_SNIPPETS=['kol += 1','kol2 += 1','s += a','pr *= a','maxi = max(maxi, a)','mini = min(mini, a)','dlina += 1','plus += 1','minus += 1'];
const FREE_MENU=[
 ['Ввод',['n = int(input())','a = int(input())','b = int(input())','prev = int(input())']],
 ['Цикл',['for i in range(n):','while a != 0:','for a in range(a, b + 1):','for i in range(n - 1):']],
 ['Условие',['if УСЛОВИЕ:','elif УСЛОВИЕ:','else:']],
 ['Переменные — перед циклом',INIT_SNIPPETS],
 ['Изменение — внутри цикла / условия',[...UPDATE_SNIPPETS,'a = int(input())  # следующее число','prev = a','maxi = a','kol = 1']],
 ['Вывод',['print(kol)','print(s)','print(maxi)','print(mini)','print(pr)','print(maxi - mini)','print(round(s / kol, 1))','print(s / kol)','print(kol, s)','print(dlina, kol, sep=\', \')',"if kol > 0:\n    print(round(s / kol, 1))\nelse:\n    print('NO')","if УСЛОВИЕ_ВЫВОДА:\n    print('YES')\nelse:\n    print('NO')"]]];
// ---------- хранилище: несколько учеников ----------
let DB={list:[],cur:null,data:{},font:'medium',theme:'light'};
const newSid=()=>'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function blankStu(){return{done:[],codes:{},modes:{},hints:{},attempts:{},undo:{},hw:{},fav:{},level:'scaffold'}}
function stu(){if(!DB.cur)return null;return DB.data[DB.cur]||(DB.data[DB.cur]=blankStu())}
let S=blankStu();
function bind(){if(DB.cur&&!DB.list.some(x=>x.id===DB.cur))DB.cur=null;S=DB.cur?stu():blankStu();['done'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});['codes','modes','hints','attempts','undo','hw','fav'].forEach(k=>S[k]=S[k]||{});S.level=S.level||'scaffold';updStuBtn()}
function load(){let loc=null;try{loc=JSON.parse(localStorage.getItem(DBKEY))}catch{}
 if(loc&&loc.list)DB={...DB,...loc};else if(EMBEDDED_STATE&&EMBEDDED_STATE.list)DB={...DB,...EMBEDDED_STATE};
 else{let leg=null;try{leg=JSON.parse(localStorage.getItem('oge16_scaffold_trainer_v3')||'null')}catch{}
  if(leg&&((leg.done||[]).length||Object.keys(leg.codes||{}).length)){const id=newSid();DB.list=[{id,name:leg.student||'Ученик 1'}];DB.cur=id;DB.data[id]={...blankStu(),done:leg.done||[],codes:leg.codes||{},modes:leg.modes||{},hints:leg.hints||{},attempts:leg.attempts||{}};DB.font=leg.font||'medium';DB.theme=leg.theme||'light'}}
 if(EMBEDDED_STATE&&EMBEDDED_STATE.list&&loc&&loc.list){for(const x of EMBEDDED_STATE.list)if(!DB.list.some(y=>y.id===x.id)){DB.list.push(x);DB.data[x.id]=EMBEDDED_STATE.data[x.id]}}
 DB.data=DB.data||{};bind()}
function save(){try{localStorage.setItem(DBKEY,JSON.stringify(DB))}catch{}}
function updStuBtn(){const b=$('studentBtn');if(!b)return;const s=DB.list.find(x=>x.id===DB.cur);b.textContent='👤 '+(s?s.name:'Выбрать ученика');b.classList.toggle('primary',!s)}
function needStu(){if(DB.cur)return true;openStudents();return false}
function progOf(id){const d=DB.data[id]||blankStu();return{done:(d.done||[]).length,hints:Object.entries(d.hints||{}).filter(([k])=>/^\d+$/.test(k)).reduce((n,[,v])=>n+(+v||0),0),hw:Object.values(d.hw||{}).filter(Boolean).length}}
function renderStudents(){const L=DB.list;$('stuList').innerHTML=L.length?L.map(x=>{const p=progOf(x.id);return `<div class="sturow${x.id===DB.cur?' cur':''}"><button class="btn stuPick" data-pick="${x.id}">${x.id===DB.cur?'✓ ':''}${esc(x.name)}</button><span class="small">решено ${p.done}/${TASKS.length}${p.hw?` · ДЗ ${p.hw}`:''}${p.hints?` · 💡 ${p.hints}`:''}</span><button class="btn tool" data-ren="${x.id}" title="Переименовать">✎</button><button class="btn tool" data-del="${x.id}" title="Удалить">🗑</button></div>`}).join(''):'<div class="small">Список пуст — добавьте первого ученика.</div>'}
function openStudents(){renderStudents();$('stuNew').value='';if(!$('stuModal').open)$('stuModal').showModal()}
function switchStudent(id){saveEditor();DB.cur=id;save();bind();renderNav();if(view==='tasks')renderTask();else renderMatrix()}
// ---------- состояние ----------
let view='tasks',group='for',filter='all',currentId=ORDERED[0].id,pyRuntime=null,pyodidePromise=null,teacherUnlocked=false,errorLine=0;
const taskById=id=>TASKS.find(t=>t.id===Number(id));
const level=()=>S.level||'scaffold';
const codeKey=t=>t.id+(level()==='free'?'_f':'');
function statusOf(t,d=S){const arr=(d.attempts||{})[t.id]||[],last=arr[arr.length-1];if((d.done||[]).includes(t.id))return['✅','Решено','pass'];if(last)return['❌','Есть ошибки','fail'];if((d.hints||{})[t.id])return['💡','Была подсказка','hinted'];return['·','Не начато','']}
// ---------- шаблоны ----------
function outputBlock(t,mode){if(mode==='simple'&&t.outputLine==='comma')return 'print()';
 if(mode==='conditional'){const src=String(t.conditional||'if УСЛОВИЕ_ВЫВОДА:\n    print()\nelse:\n    print()');return src.split('\n').map(line=>{const ind=(line.match(/^\s*/)||[''])[0],tr=line.trim();if(/^print\s*\(/.test(tr))return ind+'print()';if(/^if\s+/.test(tr))return ind+'if УСЛОВИЕ_ВЫВОДА:';return line}).join('\n')}
 const c=Math.max(1,(String(t.simple||'').match(/\bprint\s*\(/g)||[]).length);return Array.from({length:c},()=>'print()').join('\n')}
function isOptionalLine(line){const q=line.trim().replace(/^#\s?/,'');const m=q.match(/^([A-Za-z_]\w*)\s*(?:=|\+=|-=|\*=)/);return !!(m&&OPTIONAL.includes(m[1])&&!q.includes('input('))}
function commentCandidates(text){return text.split('\n').map(line=>{if(isOptionalLine(line)&&!/^\s*#/.test(line)){const ind=(line.match(/^\s*/)||[''])[0];return ind+'# '+line.slice(ind.length)}return line}).join('\n')}
function defaultCode(t,mode){if(level()==='free')return '';return commentCandidates(t.body)+'\n\n# ===== ВЫВОД =====\n'+outputBlock(t,mode)}
const getMode=t=>S.modes[t.id]||t.mode;
const getCode=t=>S.codes[codeKey(t)]??defaultCode(t,getMode(t));
// ---------- навигация ----------
function visible(){return TASKS.filter(t=>t.group===group).sort((a,b)=>a.rank-b.rank).filter(t=>filter==='all'||(filter==='done'?S.done.includes(t.id):!!S[filter][t.id]))}
function renderGroups(){$('groupSel').innerHTML=GROUPS.map(g=>{const all=TASKS.filter(t=>t.group===g.id);return `<option value="${g.id}" ${g.id===group?'selected':''}>${esc(g.name)} (${all.filter(t=>S.done.includes(t.id)).length}/${all.length})</option>`}).join('');$('grpDesc').textContent=GROUPS.find(g=>g.id===group).desc}
function renderNav(){renderGroups();const L=visible();$('taskList').innerHTML=L.length?L.map(t=>{const s=statusOf(t);return `<div class="task${t.id===currentId?' active':''}${s[2]==='pass'?' ok':s[2]==='fail'?' bad':''}"><div class="taskname" data-open="${t.id}"><span class="n">№ ${gnum(t.id)}</span>${esc(t.title)}</div><div class="taskmeta"><label><input type="checkbox" data-flag="hw" data-id="${t.id}" ${S.hw[t.id]?'checked':''}>ДЗ</label><button class="star" data-flag="fav" data-id="${t.id}" title="Избранное">${S.fav[t.id]?'★':'☆'}</button><span class="st" title="${s[1]}">${s[0]}${S.hints[t.id]?' 💡':''}</span></div></div>`}).join(''):'<div style="padding:8px;font-size:13px;color:var(--muted)">В этом разделе пока ничего нет.</div>'}

// Переносим каждое смысловое предложение условия на отдельную строку.
function formatCondition(value){
 return String(value||'').replace(/([^\n.!?]+[.!?])(?=\s+[^\n])/g,'$1\n').replace(/\n{3,}/g,'\n\n');
}
function renderTask(){const t=taskById(currentId);if(!t)return;const mode=getMode(t),st=statusOf(t),lv=level(),hard=t.group==='hard';
 $('taskView').innerHTML=`<div class="top"><h2>№ ${gnum(t.id)}. ${esc(t.title)}</h2><span class="badge${hard?' hard':''}">${esc(GROUPS.find(g=>g.id===t.group).title)}</span><span class="badge gray">${hard?'дополнительная':'PDF № '+t.id}</span><span class="badge ${st[2]==='pass'?'ok':'gray'}">${st[0]} ${st[1]}</span></div>
