   if(firstError.line)focusErrorLine(firstError.line);
  }else showInterpreterErrors('Ошибок интерпретатора нет. Программа выполнилась во всех тестах.','good',0);
  const lines=res.map((r,i)=>`${r.passed?'✅':'❌'} Тест ${i+1}: ${r.name}\nВвод: ${r.input.replace(/\n/g,' | ')}\nПолучено: ${r.error?'Ошибка интерпретатора':(r.actual||'(пусто)')}\nОжидалось: ${r.expected}`).join('\n\n');
  showResult(`${passed?'✅ ВСЕ ТЕСТЫ ПРОЙДЕНЫ':'⚠️ НЕ ВСЕ ТЕСТЫ ПРОЙДЕНЫ'} (${res.filter(x=>x.passed).length}/${res.length})${passed&&level()==='free'?' · сложный режим 🏆':''}\n\n${lines}`,passed?'good':'bad');
 }catch(e){
  showInterpreterErrors(`${e?.name||'Ошибка запуска'}: ${e?.message||String(e)}`,'error',0);
  showResult('Тесты не запущены. Проверь подключение к интернету и доступность Python-интерпретатора.','bad');
 }finally{btn.disabled=false;btn.textContent=`▶ Проверить на ${t.tests.length} тестах`}
}
// ---------- сводная таблица ----------
function renderMatrix(){const L=DB.list;let h=`<div class="mhead"><b>Сводная таблица</b><span style="font-size:13px;color:var(--muted)">✅ решено · ❌ есть ошибки · 💡 подсказка · 🏆 решено в сложном режиме · Д — задано на дом. Щелчок по ячейке — открыть задачу у этого ученика.</span></div>`;
 if(!L.length){$('mainMatrix').innerHTML=h+'<p>Добавьте учеников (кнопка 👤).</p>';return}
 h+=`<table class="mtable"><tr><th style="width:60px">№</th><th>Задача</th>${L.map(x=>`<th style="text-align:center">${esc(x.name)}</th>`).join('')}</tr>`;
 h+=`<tr><td></td><td><b>Итого решено</b></td>${L.map(x=>`<td class="c"><b>${progOf(x.id).done}</b>/${TASKS.length}</td>`).join('')}</tr>`;
 for(const g of GROUPS){h+=`<tr class="grp"><td colspan="${2+L.length}">${esc(g.name)}</td></tr>`;for(const t of ORDERED.filter(x=>x.group===g.id)){h+=`<tr><td>${gnum(t.id)}</td><td>${esc(t.title)}</td>${L.map(x=>{const d=DB.data[x.id]||blankStu(),s=statusOf(t,d),fr=(d.attempts?.[t.id]||[]).some(a=>a.passed&&a.level==='free');return `<td class="c" data-cell="${x.id}|${t.id}" title="${esc(x.name)}: ${s[1]}">${s[0]}${fr?'🏆':''}${d.hints?.[t.id]&&s[0]!=='💡'?'💡':''}${d.hw?.[t.id]?' Д':''}</td>`}).join('')}</tr>`}}
 $('mainMatrix').innerHTML=h+'</table>'}
// ---------- отчёт ----------
function openReport(){if(!needStu())return;const name=DB.list.find(x=>x.id===DB.cur)?.name||'Ученик';const att=TASKS.filter(t=>(S.attempts[t.id]||[]).length),hinted=TASKS.filter(t=>(S.hints[t.id]||0)>0).length;
 const rows=ORDERED.map(t=>{const st=statusOf(t),rec=S.attempts[t.id]||[],last=rec[rec.length-1],code=last?.code||S.codes[t.id]||S.codes[t.id+'_f']||'';return `<details class="report-item ${st[2]}"><summary>${st[0]} №${gnum(t.id)} — ${esc(t.title)} <span style="font-weight:400;color:var(--muted)">(${st[1]}; подсказок: ${S.hints[t.id]||0}; попыток: ${rec.length}${rec.some(a=>a.passed&&a.level==='free')?'; 🏆 без заготовки':''})</span></summary><div style="font-size:13px;margin:6px 0"><b>Условие:</b><br>${esc(t.condition).replace(/\n/g,'<br>')}</div><pre>${esc(code)||'(код не написан)'}</pre>${rec.map((r,i)=>`<div class="report-test"><b>Попытка ${i+1} ${r.passed?'✅':'❌'} · ${r.level==='free'?'без заготовки':'с заготовкой'} · ${new Date(r.time).toLocaleString('ru-RU')}</b>${r.results.map((x,k)=>`\n${x.passed?'✅':'❌'} ${esc(x.name||'Тест '+(k+1))}: ввод ${esc(x.input.replace(/\n/g,' | '))} → ${esc(x.error||x.actual||'(пусто)')} (ожидалось ${esc(x.expected)})`).join('')}</div>`).join('')}</details>`}).join('');
 $('overlayHost').innerHTML=`<div class="overlay" id="ov"><section class="overpanel"><div class="overhead"><h2>📋 Отчёт учителю — ${esc(name)}</h2><div><button class="btn" id="repPrint">Печать</button> <button class="btn" id="repDl">Скачать HTML</button> <button class="btn" id="repClose">Закрыть ✕</button></div></div><div class="report-summary"><span class="report-stat">Задач: ${TASKS.length}</span><span class="report-stat">Проверено: ${att.length}</span><span class="report-stat">Решено: ${S.done.length}</span><span class="report-stat">С подсказкой: ${hinted}</span><span class="report-stat">Попыток: ${Object.values(S.attempts).reduce((a,x)=>a+x.length,0)}</span></div>${rows}</section></div>`;
 $('repClose').onclick=()=>$('overlayHost').innerHTML='';$('ov').onclick=e=>{if(e.target.id==='ov')$('overlayHost').innerHTML=''};
 $('repPrint').onclick=()=>{document.body.classList.add('printing-report');window.onafterprint=()=>document.body.classList.remove('printing-report');window.print()};
 $('repDl').onclick=()=>{const p=document.querySelector('.overpanel');const doc=`<!doctype html><html lang="ru"><meta charset="utf-8"><title>Отчёт</title><style>body{font:14px Arial;margin:24px}.report-item{border:1px solid #ccd;border-radius:8px;padding:8px;margin:6px 0}pre{white-space:pre-wrap;background:#101b2d;color:#fff;padding:8px;border-radius:6px}.report-test{white-space:pre-wrap;background:#f3f6f9;padding:6px;margin:5px 0}button{display:none}</style><body>${p.innerHTML}</body></html>`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([doc],{type:'text/html'}));a.download=`Отчёт_${name.replace(/[^а-яёa-z0-9_-]/gi,'_')}.html`;a.click()}}
function openMemo(){$('overlayHost').innerHTML=`<div class="overlay" id="ov" style="padding:8px"><section class="overpanel memo-panel"><div class="overhead"><h2>📘 Памятка по обработке чисел</h2><button class="btn" id="memoClose">Закрыть ✕</button></div><iframe title="Памятка"></iframe></section></div>`;document.querySelector('#ov iframe').srcdoc=EMBEDDED_MEMO_HTML;$('memoClose').onclick=()=>$('overlayHost').innerHTML='';$('ov').onclick=e=>{if(e.target.id==='ov')$('overlayHost').innerHTML=''}}
function saveApplication(){saveEditor();const snap=JSON.stringify(DB).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');const html='<!doctype html>\n'+document.documentElement.outerHTML;const out=html.replace(/const EMBEDDED_STATE = \{[\s\S]*?\};/,()=>`const EMBEDDED_STATE = ${snap};`);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'text/html;charset=utf-8'}));a.download='ОГЭ16_обработка_чисел.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
// ---------- события ----------
function setView(v){view=v;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));$('mainTasks').hidden=v!=='tasks';$('mainMatrix').hidden=v!=='matrix';if(v==='tasks')renderTask();else{saveEditor();renderMatrix()}}
function syncTabs(){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.filter===filter))}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
$('groupSel').onchange=e=>{group=e.target.value;filter='all';syncTabs();const v=visible();if(v[0])selectTask(v[0].id);else renderNav()};
$('tabs').onclick=e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;syncTabs();renderNav()};
$('taskList').addEventListener('click',e=>{const o=e.target.closest('[data-open]');if(o){selectTask(o.dataset.open);if(view!=='tasks')setView('tasks');return}const f=e.target.closest('button[data-flag]');if(f){if(!needStu())return;S[f.dataset.flag][f.dataset.id]=!S[f.dataset.flag][f.dataset.id];save();renderNav()}});
$('taskList').addEventListener('change',e=>{const c=e.target.closest('input[data-flag]');if(!c)return;if(!needStu()){renderNav();return}S[c.dataset.flag][c.dataset.id]=c.checked;save();renderNav()});
$('mainMatrix').addEventListener('click',e=>{const c=e.target.closest('[data-cell]');if(!c)return;const[sid,tid]=c.dataset.cell.split('|');if(sid!==DB.cur)switchStudent(sid);currentId=Number(tid);group=taskById(tid).group;filter='all';syncTabs();setView('tasks');renderNav()});
$('studentBtn').onclick=openStudents;$('stuClose').onclick=()=>$('stuModal').close();
$('stuAddBtn').onclick=()=>{const n=$('stuNew').value.trim();if(!n)return;const id=newSid();DB.list.push({id,name:n});DB.data[id]=blankStu();switchStudent(id);renderStudents();$('stuNew').value=''};
$('stuNew').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('stuAddBtn').click()}});
$('stuList').addEventListener('click',e=>{const p=e.target.closest('[data-pick]');if(p){switchStudent(p.dataset.pick);$('stuModal').close();return}
 const r=e.target.closest('[data-ren]');if(r){const x=DB.list.find(q=>q.id===r.dataset.ren);const n=prompt('Новое имя',x.name);if(n&&n.trim()){x.name=n.trim();save();updStuBtn();renderStudents();if(view==='matrix')renderMatrix()}return}
 const d=e.target.closest('[data-del]');if(d){const x=DB.list.find(q=>q.id===d.dataset.del);if(!confirm(`Удалить ученика «${x.name}» вместе с его кодом и отметками?`))return;DB.list=DB.list.filter(q=>q!==x);delete DB.data[x.id];if(DB.cur===x.id)DB.cur=DB.list[0]?.id||null;save();bind();renderNav();if(view==='tasks')renderTask();else renderMatrix();renderStudents()}});
$('reportBtn').onclick=openReport;$('memoBtn').onclick=openMemo;$('saveAppBtn').onclick=saveApplication;
function applyTheme(){document.body.classList.toggle('theme-dark',DB.theme==='dark');$('themeBtn').textContent=DB.theme==='dark'?'☀':'☾'}
function applyFont(){document.body.classList.remove('font-small','font-medium','font-large','font-xlarge');document.body.classList.add('font-'+(DB.font||'medium'));document.querySelectorAll('[data-font]').forEach(b=>b.classList.toggle('active',b.dataset.font===DB.font));if($('codeEditor'))renderGutter()}
$('themeBtn').onclick=()=>{DB.theme=DB.theme==='dark'?'light':'dark';applyTheme();save()};document.querySelectorAll('[data-font]').forEach(b=>b.onclick=()=>{DB.font=b.dataset.font;applyFont();save()});
document.addEventListener('click',e=>{if(!$('snippetMenu').contains(e.target)&&!e.target.classList.contains('gutter-plus'))$('snippetMenu').classList.add('hidden')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('snippetMenu').classList.add('hidden');if($('overlayHost').innerHTML)$('overlayHost').innerHTML=''}});
load();applyTheme();applyFont();setView('tasks');renderNav();if(!DB.cur&&!window.__noLogin)openStudents();

</script></body></html>
