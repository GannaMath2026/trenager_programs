n        kol += 1\n        s += a\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)","simple":"print(kol)","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print(ЕСЛИ_ДА)\nelse:\n    print(ЕСЛИ_НЕТ)","mode":"simple","note":"","solution":"n = int(input())\nkol = 0\nfor i in range(n):\n    a = int(input())\n    if a % 10 == 3:\n        kol += 1\nprint(kol)","hint":"1) Перед циклом создай kol = 0.\n2) Для каждого числа a проверь последнюю десятичную цифру: остаток от деления на 10 равен 3.\n3) Если условие верно, увеличь kol на 1. Не прибавляй к счётчику само число.\n4) В конце выведи kol.","tests":[{"name":"Граничный случай","input":"1\n13","expected":"1"},{"name":"Дополнительный случай","input":"4\n13\n23\n30\n3","expected":"3"},{"name":"Проверка отбора","input":"3\n10\n20\n33","expected":"1"}]},{"id":2,"group":"for","rank":3,"title":"Сумма чисел, кратных 6","condition":"В последовательности натуральных чисел определить сумму чисел, кратных 6.\nСначала вводится N, затем N чисел. Гарантируется, что хотя бы одно число кратно 6.","input":"Первая строка — N. Далее N натуральных чисел.","sampleInput":"3\n12\n25\n6","sampleOutput":"18","body":"n = int(input())\nkol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\n\nfor i in range(n):\n    a = int(input())\n    if УСЛОВИЕ:\n        kol += 1\n        s += a\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)","simple":"print(s)","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print(ЕСЛИ_ДА)\nelse:\n    print(ЕСЛИ_НЕТ)","mode":"simple","note":"","solution":"n = int(input())\ns = 0\nfor i in range(n):\n    a = int(input())\n    if a % 6 == 0:\n        s += a\nprint(s)","hint":"1) Перед циклом создай s = 0 — накопитель суммы.\n2) Внутри цикла проверь, делится ли a на 6 без остатка.\n3) Только для подходящего числа прибавляй a к s. Счётчик kol не нужен.\n4) В конце выведи s.","tests":[{"name":"Граничный случай","input":"1\n6","expected":"6"},{"name":"Дополнительный случай","input":"5\n1\n6\n12\n7\n al":"if УСЛОВИЕ_ВЫВОДА:\n    print(ЕСЛИ_ДА)\nelse:\n    print(ЕСЛИ_НЕТ)","mode":"simple","note":"","solution":"n = int(input())\nmaxi = -10**10\nfor i in range(n):\n    a = int(input())\n    if a % 5 == 0:\n        maxi = max(maxi, a)\nprint(maxi)","hint":"1) До цикла задай maxi заведомо маленьким числом, например -10**10.\n2) Для каждого a проверь делимость на 5.\n3) Внутри if обновляй максимум: maxi = max(maxi, a). Счётчик и сумму не меняй.\n4) В конце выведи maxi.","tests":[{"name":"Граничный случай","input":"1\n25","expected":"25"},{"name":"Дополнительный случай","input":"5\n10\n15\n12\n5\n30","expected":"30"},{"name":"Проверка отбора","input":"4\n3\n8\n11\n20","expected":"20"}]},{"id":6,"group":"for","rank":6,"title":"Максимальное число, оканчивающееся на 3","condition":"В последовательности натуральных чисел определить максимальное число, оканчивающееся на 3.\nСначала вводится N, затем N чисел. Гарантируется, что хотя бы одно число оканчивается на 3. N ≤ 1000, числа ≤ 30 000.","input":"Первая строка — N. Далее N натуральных чисел.","sampleInput":"3\n13\n23\n3","sampleOutput":"23","body":"n = int(input())\nkol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\n\nfor i in range(n):\n    a = int(input())\n    if УСЛОВИЕ:\n        kol += 1\n        s += a\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)","simple":"print(maxi)","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print(ЕСЛИ_ДА)\nelse:\n    print(ЕСЛИ_НЕТ)","mode":"simple","note":"","solution":"n = int(input())\nmaxi = -10**10\nfor i in range(n):\n    a = int(input())\n    if a % 10 == 3:\n        maxi = max(maxi, a)\nprint(maxi)","hint":"1) До цикла задай maxi = -10**10.\n2) Проверяй последнюю цифру: a % 10 == 3.\n3) Только для чисел с последней цифрой 3 обновляй maxi.\n4) В конце выведи maxi.","tests":[{"name":"Граничный случай","input":"1\n3","expected":"3"},{"name":"Дополнительный случай","input":"5\n13\n23\n30\n33\n2","expected":"33"},{"name":"Проверка отбора","input":"4\n3\n23\n13\n43","expected":"43"}]},{"id":8,"group":"for","rank":7,"title":"Минимальное чётное число","condition":"В последовательности натуральных чисел определить минимальное чётное число.\nСначала вводится количество чисел, затем сами числа. Гарантируется, что чётное число есть. N ≤ 1000, числа ≤ 30 000.","input":"Первая строка — N. Далее N натуральных чисел.","sampleInput":"4\n3\n20\n6\n8","sampleOutput":"6","body":"n = int(input())\nkol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\n\nfor i in range(n):\n    a = int(input())\n    if УСЛОВИЕ:\n        kol += 1\n        s += a\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)","simple":"print(mini)","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print(ЕСЛИ_ДА)\nelse:\n    print(ЕСЛИ_НЕТ)","mode":"simple","note":"","solution":"n = int(input())\nmini = 10**10\nfor i in range(n):\n    a = int(input())\n    if a % 2 == 0:\n        mini = min(mini, a)\nprint(mini)","hint":"1) До цикла задай mini = 10**10 — число больше любого допустимого входного.\n2) Проверь чётность: a % 2 == 0.\n3) Только для чётных чисел обновляй mini = min(mini, a).\n4) В конце выведи mini.","tests":[{"name":"Граничный случай","input":"1\n2","expected":"2"},{"name":"Дополнительный случай","input":"4\n3\n20\n6\n8","expected":"6"},{"name":"Проверка отбора","input":"5\n12\n10\n8\n14\n16","expected":"8"}]},{"id":10,"group":"for","rank":8,"title":"Скорости: разность максимума и минимума, количество до 30 км/ч","condition":"Камера фиксирует скорости N автомобилей. Найти:\n1) разность максимальной и минимальной скоростей;\n2) количество автомобилей со скоростью не выше 30 км/ч.\nN от 1 до 30, скорость каждого автомобиля от 1 до 300.","input":"Первая строка — N. Далее N скоростей.","sampleInput":"4\n74\n69\n63\n96","sampleOutput":"33\n0","body":"n = int(input())\nkol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\n\nfor i in range(n):\n    a = int(input())\n    maxi = max(maxi, a)\n    mini = min(mini, a)\n    if УСЛОВИЕ:\n        maxi = max(maxi, a)\n        mini = min(mini, a)\n        kol += 1\n        s += a\n        pr *= a","simple":"print(maxi - mini)\nprint(kol)","conditional":"print(maxi - mini)\nif УСЛОВИЕ_ВЫВОДА:\n    print(kol)\nelse:\n    print(0)","mode":"simple","note":"Максимум и минимум обновляются для каждого автомобиля, а kol — только для скоростей, удовлетворяющих условию.","solution":"n = int(input())\nkol = 0\nmaxi = -10**10\nmini = 10**10\nfor i in range(n):\n    a = int(input())\n    maxi = max(maxi, a)\n    mini = min(mini, a)\n    if a <= 30:\n        kol += 1\nprint(maxi - mini)\nprint(kol)","hint":"Здесь нужны три независимых действия.\n1) maxi и mini обновляй для КАЖДОЙ скорости — вне условия отбора.\n2) kol = 0 создай до цикла; увеличивай kol только если скорость не выше 30.\n3) В конце выведи два результата: сначала maxi - mini, затем kol. Для этого задания они печатаются отдельными строками.","tests":[{"name":"Граничный случай","input":"1\n30","expected":"0\n1"},{"name":"Дополнительный случай","input":"3\n1\n300\n30","expected":"299\n2"},{"name":"Проверка отбора","input":"2\n31\n40","expected":"9\n0"}]},{"id":11,"group":"for","rank":9,"title":"Температура: среднее положительных значений и их количество","condition":"По дневным температурам найти среднюю температуру тех дней, когда она была выше 0 °C, и количество таких дней.\nГарантируется, что хотя бы один положительный день был. N от 1 до 31.","input":"Первая строка — N. Далее N целых температур.","sampleInput":"4\n-5\n12\n-2\n8","sampleOutput":"10.0\n2","body":"n = int(input())\nkol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\n\nfor i in range(n):\n    a = int(input())\n    if УСЛОВИЕ:\n        kol += 1\n        s += a\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)","simple":"print(s / kol)\nprint(kol)","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print(ЕСЛИ_ДА)\nelse:\n    print(ЕСЛИ_НЕТ)","mode":"simple","note":"","solution":"n = int(input())\nkol = 0\ns = 0\nfor i in range(n):\n    a = int(input())\n    if a > 0:\n        kol += 1\n        s += a\nprint(s / kol)\nprint(kol)","hint":"1) s = 0 и kol = 0 создай перед циклом.\n2) Положительные температуры отбирай условием a > 0. Только для них увеличивай s на a и kol на 1.\n3) Среднее вычисляется как s / kol. В этом задании гарантирован хотя бы один положительный день.\n4) Выведи среднее, затем количество положительных дней — двумя командами print().","tests":[{"name":"Граничный случай","input":"1\n1","expected":"1.0\n1"},{"name":"Дополнительный случай","input":"4\n-5\n12\n-2\n8","expected":"10.0\n2"},{"name":"Проверка отбора","input":"3\n1\n2\n3","expected":"2.0\n3"}]},{"id":12,"group":"for","rank":10,"title":"Викторина: максимум правильных ответов и нулевой результат","condition":"Участники ответили на 20 вопросов. Найти наибольшее количество правильных ответов.\nЕсли есть участник, не ответивший правильно ни на один вопрос, вывести YES, иначе NO. Гарантируется, что хотя бы один участник дал правильный ответ. N от 1 до 50.","input":"Первая строка — N. Далее N чисел — количество правильных ответов каждого участника.","sampleInput":"4\n15\n12\n0\n17","sampleOutput":"17\nYES","body":"n = int(input())\n# kol2 = 0\nmaxi = -10**10\n\nfor i in range(n):\n    a = int(input())\n    maxi = max(maxi, a)\n    # kol2 += 1\n    if УСЛОВИЕ:\n        maxi = max(maxi, a)\n        # kol2 += 1","simple":"print(maxi)","conditional":"print(maxi)\nif УСЛОВИЕ_ВЫВОДА:\n    print('YES')\nelse:\n    print('NO')","mode":"conditional","note":"Внутри цикла проверяется, встретился ли участник с нулём правильных ответов. Максимум ищется среди всех участников.","solution":"n = int(input())\nmaxi = -10**10\nkol2 = 0\nfor i in range(n):\n    a = int(input())\n    maxi = max(maxi, a)\n    if a == 0:\n        kol2 += 1\nprint(maxi)\nif kol2 > 0:\n    print('YES')\nelse:\n    print('NO')","hint":"1) maxi = -10**10 обновляй для каждого участника, без условия.\n2) Отдельный второй счётчик kol2 = 0 нужен для участников с нулём правильных ответов. Если a == 0, увеличь kol2 на 1.\n3) В конце сначала выведи maxi. Затем проверь kol2 > 0: если да — напечатай YES, иначе NO.\n4) Здесь нужен счётчик случаев, а не второй счётчик.","tests":[{"name":"Граничный случай","input":"1\n1","expected":"1\nNO"},{"name":"Дополнительный случай","input":"3\n0\n2\n1","expected":"2\nYES"},{"name":"Проверка отбора","input":"4\n3\n17\n0\n17","expected":"17\nYES"}]},{"id":13,"group":"for","rank":11,"title":"Скорости: максимум и проверка скорости ниже 30","condition":"Найти максимальную скорость автомобиля. Если хотя бы один автомобиль ехал со скоростью меньше 30 км/ч, вывести YES, иначе NO.\nN от 1 до 30, скорости от 1 до 300.","input":"Первая строка — N. Далее N скоростей.","sampleInput":"4\n74\n69\n63\n66","sampleOutput":"74\nNO","body":"n = int(input())\n# kol2 = 0\nmaxi = -10**10\n\nfor i in range(n):\n    a = int(input())\n    maxi = max(maxi, a)\n    # kol2 += 1\n    if УСЛОВИЕ:\n        maxi = max(maxi, a)\n        # kol2 += 1","simple":"print(maxi)","conditional":"print(maxi)\nif УСЛОВИЕ_ВЫВОДА:\n    print('YES')\nelse:\n    print('NO')","mode":"conditional","note":"","solution":"n = int(input())\nmaxi = -10**10\nkol2 = 0\nfor i in range(n):\n    a = int(input())\n    maxi = max(maxi, a)\n    if a < 30:\n        kol2 += 1\nprint(maxi)\nif kol2 > 0:\n    print('YES')\nelse:\n    print('NO')","hint":"1) maxi = -10**10 обновляй для каждой скорости автомобиля.\n2) Создай kol2 = 0. Если скорость строго меньше 30, увеличь kol2 на 1. Скорость 30 не подходит.\n3) Сначала выведи maxi. Затем проверь kol2 > 0: это означает, что хотя бы одна медленная машина была.\n4) Для YES/NO используй второй счётчик и проверь, что он больше нуля.","tests":[{"name":"Граничный случай","input":"1\n29","expected":"29\nYES"},{"name":"Дополнительный случай","input":"1\n30","expected":"30\nNO"},{"name":"Проверка отбора","input":"4\n10\n30\n300\n29","expected":"300\nYES"}]},{"id":14,"group":"for","rank":12,"title":"Скорости: среднее и не менее двух медленных автомобилей","condition":"Найти среднюю скорость всех автомобилей. Если не менее двух автомобилей двигались со скоростью не больше 40 км/ч, вывести YES, иначе NO.\nN от 1 до 30, скорости от 1 до 300. Среднюю вывести с точностью до одного знака после запятой.","input":"Первая строка — N. Далее N скоростей.","sampleInput":"4\n74\n69\n63\n96","sampleOutput":"75.5\nNO","body":"n = int(input())\nkol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\n\nfor i in range(n):\n    a = int(input())\n    s += a\n    if УСЛОВИЕ:\n        s += a\n        kol += 1\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)","simple":"print(round(s / n, 1))","conditional":"print(round(s / n, 1))\nif УСЛОВИЕ_ВЫВОДА:\n    print('YES')\nelse:\n    print('NO')","mode":"conditional","note":"Сумма s обновляется для каждого автомобиля. Счётчик kol — только для скоростей не больше 40.","solution":"n = int(input())\ns = 0\nkol = 0\nfor i in range(n):\n    a = int(input())\n    s += a\n    if a <= 40:\n        kol += 1\nprint(round(s / n, 1))\nif kol >= 2:\n    print('YES')\nelse:\n    print('NO')","hint":"1) Для среднего нужны два накопителя: s = 0 (сумма) и kol = 0 (количество).\n2) Последняя цифра семеричной записи — это a % 7. Для нечётной цифры проверь (a % 7) % 2 != 0.\n3) Когда условие верно, увеличь s на a и kol на 1.\n4) Если kol > 0, выведи s / kol; иначе выведи NO. Здесь N заранее известно, поэтому используется for.","tests":[{"name":"Граничный случай","input":"1\n40","expected":"40.0\nNO"},{"name":"Дополнительный случай","input":"2\n40\n40","expected":"40.0\nYES"},{"name":"Проверка отбора","input":"3\n1\n200\n300","expected":"167.0\nNO"}]},{"id":16,"group":"for","rank":13,"title":"Контрольная: число неудовлетворительных оценок и отличник","condition":"Каждый ученик решал 10 примеров. Неудовлетворительная оценка — если решено меньше половины примеров. Найти количество таких оценок.\nЕсли хотя бы один ученик решил все 10 примеров, вывести YES, иначе NO. N от 1 до 30.","input":"Первая строка — N. Далее N чисел — количество правильно решённых примеров.","sampleInput":"4\n3\n9\n2\n8","sampleOutput":"2\nNO","body":"n = int(input())\n# kol = 0\n# kol2 = 0\n\nfor i in range(n):\n    a = int(input())\n    if УСЛОВИЕ:\n        # kol += 1\n    # kol2 += 1\n    if УСЛОВИЕ:\n        # kol2 += 1","simple":"print(kol)","conditional":"print(kol)\nif УСЛОВИЕ_ВЫВОДА:\n    print('YES')\nelse:\n    print('NO')","mode":"conditional","note":"Для неудовлетворительной оценки требуется меньше 5 правильных ответов. Флаг проверяет, встретилось ли значение 10.","solution":"n = int(input())\nkol = 0\nkol2 = 0\nfor i in range(n):\n    a = int(input())\n    if a < 5:\n        kol += 1\n    if a == 10:\n        kol2 += 1\nprint(kol)\nif kol2 > 0:\n    print('YES')\nelse:\n    print('NO')","hint":"1) kol = 0 считай неудовлетворительные оценки: если a < 5, увеличь kol на 1.\n2) Второй счётчик kol2 = 0 считай отдельно: если a == 10, увеличь kol2 на 1.\n3) После цикла выведи kol. Затем проверь kol2 > 0: при положительном значении выведи YES, иначе NO.\n4) Оба счётчика инициализируются до цикла; каждый меняется только в своём условии.","tests":[{"name":"Граничный случай","input":"1\n4","expected":"1\nNO"},{"name":"Дополнительный случай","input":"2\n5\n10","expected":"0\nYES"},{"name":"Проверка отбора","input":"3\n0\n4\n5","expected":"2\nNO"}]},{"id":18,"group":"for","rank":14,"title":"Среднее чисел с нечётной последней цифрой в записи по основанию 7","condition":"Найти среднее арифметическое десятичных чисел, запись которых в системе счисления с основанием 7 оканчивается нечётной цифрой. Если таких элементов нет, вывести NO.\nСначала вводится N (3 ≤ N ≤ 10 000), затем N натуральных чисел не больше 30 000.","input":"Первая строка — N. Далее N натуральных чисел.","sampleInput":"6\n12\n15\n10\n71\n50\n11","sampleOutput":"31.6","body":"n = int(input())\nkol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\n\nfor i in range(n):\n    a = int(input())\n    if УСЛОВИЕ:\n        kol += 1\n        s += a\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)","simple":"print(round(s / kol, 1))","conditional":"if kol > 0:\n    print(round(s / kol, 1))\nelse:\n    print('NO')","mode":"conditional","note":"Последняя цифра записи в системе с основанием 7 равна остатку от деления на 7. Нечётные остатки: 1, 3 или 5.","solution":"n = int(input())\ns = 0\nkol = 0\nfor i in range(n):\n    a = int(input())\n    if a % 7 % 2 != 0:\n        s += a\n        kol += 1\nif kol > 0:\n    print(round(s / kol, 1))\nelse:\n    print('NO')","hint":"1) Для среднего заведи s = 0 и kol = 0 до цикла.\n2) Последняя цифра записи по основанию 7 равна a % 7. Чтобы она была нечётной, проверь (a % 7) % 2 != 0.\n3) При выполнении условия прибавь a к s и увеличь kol на 1.\n4) Выведи среднее s / kol; в условии гарантируется, что подходящие элементы есть.","tests":[{"name":"Граничный случай","input":"3\n1\n2\n3","expected":"2.0"},{"name":"Дополнительный случай","input":"3\n7\n14\n21","expected":"NO"},{"name":"Проверка отбора","input":"4\n5\n10\n15\n20","expected":"10.0"}]},{"id":20,"group":"for","rank":15,"title":"Среднее чисел, оканчивающихся на 5 в системе счисления по основанию 7","condition":"Найти среднее арифметическое десятичных чисел, запись которых в системе счисления с основанием 7 оканчивается цифрой 5. Если таких элементов нет, вывести NO.\nСначала вводится N (3 ≤ N ≤ 10 000), затем N натуральных чисел не больше 30 000.","input":"Первая строка — N. Далее N натуральных чисел.","sampleInput":"5\n12\n14\n20\n68\n25","sampleOutput":"40","body":"n = int(input())\nkol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\n\nfor i in range(n):\n    a = int(input())\n    if УСЛОВИЕ:\n        kol += 1\n        s += a\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)","simple":"print(f'{s / kol:g}')","conditional":"if kol > 0:\n    print(f'{s / kol:g}')\nelse:\n    print('NO')","mode":"conditional","note":"","solution":"n = int(input())\ns = 0\nkol = 0\nfor i in range(n):\n    a = int(input())\n    if a % 7 == 5:\n        s += a\n        kol += 1\nif kol > 0:\n    print(f'{s / kol:g}')\nelse:\n    print('NO')","hint":"1) Создай s = 0 и kol = 0.\n2) Последняя цифра в системе с основанием 7 равна 5, если a % 7 == 5.\n3) Для подходящих чисел увеличивай сумму s и количество kol.\n4) Если kol > 0, выведи s / kol, округлив/оформив как требует условие; иначе выведи NO.","tests":[{"name":"Граничный случай","input":"5\n12\n14\n20\n68\n25","expected":"40"},{"name":"Дополнительный случай","input":"3\n1\n2\n3","expected":"NO"},{"name":"Проверка отбора","input":"3\n5\n6\n7","expected":"5"}]},{"id":21,"group":"for","rank":16,"title":"Сумма чисел, оканчивающихся на 1 в системе счисления по основанию 7","condition":"Подсчитать сумму элементов последовательности натуральных чисел, запись которых в системе счисления с основанием 7 оканчивается цифрой 1.\nСначала вводится N (1 ≤ N ≤ 1000), затем N чисел. Вывести только сумму в десятичной системе счисления.","input":"Первая строка — N. Далее N натуральных чисел.","sampleInput":"5\n15\n13\n11\n8\n23","sampleOutput":"23","body":"n = int(input())\nkol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\n\nfor i in range(n):\n    a = int(input())\n    if УСЛОВИЕ:\n        kol += 1\n        s += a\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)","simple":"print(s)","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print(ЕСЛИ_ДА)\nelse:\n    print(ЕСЛИ_НЕТ)","mode":"simple","note":"","solution":"n = int(input())\ns = 0\nfor i in range(n):\n    a = int(input())\n    if a % 7 == 1:\n        s += a\nprint(s)","hint":"1) Создай s = 0. Это задача на сумму, дополнительный счётчик не обязателен.\n2) Последняя цифра семеричной записи равна 1, если a % 7 == 1.\n3) В цикле по N числам, если условие выполнено, прибавляй a к s.\n4) В конце выведи только s.","tests":[{"name":"Граничный случай","input":"1\n1","expected":"1"},{"name":"Дополнительный случай","input":"5\n15\n13\n11\n8\n23","expected":"23"},{"name":"Проверка отбора","input":"4\n8\n9\n10\n11","expected":"8"}]},{"id":22,"group":"ranges","rank":1,"title":"Количество чётных чисел на отрезке [a; b]","condition":"По двум натуральным числам a и b подсчитать количество чётных натуральных чисел на отрезке [a; b], включая оба конца.\nГарантируется: 1 ≤ a ≤ b ≤ 30 000. Проверять входные данные не нужно.","input":"Два числа: сначала a, затем b.","sampleInput":"10\n20","sampleOutput":"6","body":"a = int(input())\nb = int(input())\nkol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\n\nfor a in range(a, b + 1):\n    if УСЛОВИЕ:\n        kol += 1\n        s += a\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)","simple":"print(kol)","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print(ЕСЛИ_ДА)\nelse:\n    print(ЕСЛИ_НЕТ)","mode":"simple","note":"","solution":"a = int(input())\nb = int(input())\nkol = 0\nfor a in range(a, b + 1):\n    if a % 2 == 0:\n        kol += 1\nprint(kol)","hint":"1) Введи границы отрезка: start и finish.\n2) kol = 0 создай перед циклом.\n3) Перебирай все числа от start до finish включительно: range(start, finish + 1).\n4) Если a % 2 == 0, увеличь kol на 1. В конце выведи kol.","tests":[{"name":"Граничный случай","input":"10\n20","expected":"6"},{"name":"Дополнительный случай","input":"8\n8","expected":"1"},{"name":"Проверка отбора","input":"9\n9","expected":"0"},{"name":"Ещё один случай","input":"1\n5","expected":"2"}]},{"id":9,"group":"while","rank":1,"title":"Количество трёхзначных чисел, кратных 4","condition":"В последовательности натуральных чисел определить количество трёхзначных чисел, кратных 4.\nКоличество заранее неизвестно. Ввод заканчивается числом 0; ноль не входит в последовательность.","input":"Натуральные числа по одному. Последнее введённое число — 0 (стоп-сигнал).","sampleInput":"120\n9\n365\n4\n0","sampleOutput":"1","body":"kol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\na = int(input())\nwhile a != 0:\n    if УСЛОВИЕ:\n        kol += 1\n        s += a\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)\n    a = int(input())","simple":"print(kol)","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print(ЕСЛИ_ДА)\nelse:\n    print(ЕСЛИ_НЕТ)","mode":"simple","note":"","solution":"kol = 0\na = int(input())\nwhile a != 0:\n    if 100 <= a <= 999 and a % 4 == 0:\n        kol += 1\n    a = int(input())\nprint(kol)","hint":"1) До цикла создай kol = 0.\n2) Вводи a до тех пор, пока a != 0. Ноль — только стоп-сигнал: тело цикла для него не выполняется.\n3) Трёхзначность проверяй через 100 <= a <= 999; кратность 4 — через a % 4 == 0. Объедини оба условия через and.\n4) Для подходящих чисел увеличивай kol. После цикла выведи kol.","tests":[{"name":"Граничный случай","input":"100\n0","expected":"1"},{"name":"Дополнительный случай","input":"99\n1000\n0","expected":"0"},{"name":"Проверка отбора","input":"120\n9\n365\n4\n0","expected":"1"}]},{"id":29,"group":"while","rank":2,"title":"Количество однозначных чисел, кратных 3","condition":"В последовательности натуральных чисел определить количество однозначных чисел, кратных 3.\nКоличество заранее неизвестно. Ввод заканчивается числом 0; ноль не входит в последовательность. Чисел не больше 1000, каждое не больше 30 000.","input":"Натуральные числа по одному. Последнее введённое число — 0 (стоп-сигнал).","sampleInput":"121\n9\n4\n0","sampleOutput":"1","body":"kol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\na = int(input())\nwhile a != 0:\n    if УСЛОВИЕ:\n        kol += 1\n        s += a\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)\n    a = int(input())","simple":"print(kol)","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print(ЕСЛИ_ДА)\nelse:\n    print(ЕСЛИ_НЕТ)","mode":"simple","note":"","solution":"kol = 0\na = int(input())\nwhile a != 0:\n    if 1 <= a <= 9 and a % 3 == 0:\n        kol += 1\n    a = int(input())\nprint(kol)","hint":"1) Создай kol = 0 до цикла.\n2) В цикле while a != 0 проверяй две вещи: число однозначное (a < 10) и кратно 3 (a % 3 == 0).\n3) Если оба условия истинны, увеличь kol. Стоп-сигнал 0 не попадает в подсчёт.\n4) Выведи kol.","tests":[{"name":"Граничный случай","input":"3\n9\n10\n0","expected":"2"},{"name":"Дополнительный случай","input":"1\n3\n0","expected":"1"},{"name":"Проверка отбора","input":"10\n11\n0","expected":"0"}]},{"id":30,"group":"while","rank":3,"title":"Наименьшее число, кратное 3","condition":"В последовательности натуральных чисел определить наименьшее число, кратное 3.\nКоличество заранее неизвестно. Ввод заканчивается числом 0; ноль не входит в последовательность. Гарантируется, что число, кратное 3, есть.","input":"Целые числа по одному. Последнее введённое число — 0 (стоп-сигнал).","sampleInput":"45\n10\n9\n0","sampleOutput":"9","body":"kol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\na = int(input())\nwhile a != 0:\n    if УСЛОВИЕ:\n        kol += 1\n        s += a\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)\n    a = int(input())","simple":"print(mini)","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print(ЕСЛИ_ДА)\nelse:\n    print(ЕСЛИ_НЕТ)","mode":"simple","note":"","solution":"mini = 10**10\na = int(input())\nwhile a != 0:\n    if a % 3 == 0:\n        mini = min(mini, a)\n    a = int(input())\nprint(mini)","hint":"1) До цикла задай mini = 10**10.\n2) Пока a != 0, проверяй a % 3 == 0. Если делится на 3, обновляй mini = min(mini, a).\n3) После обработки числа обязательно считай следующее a = int(input()).\n4) В конце выведи mini. По условию подходящее число обязательно есть.","tests":[{"name":"Граничный случай","input":"3\n0","expected":"3"},{"name":"Дополнительный случай","input":"8\n6\n4\n0","expected":"6"},{"name":"Проверка отбора","input":"12\n9\n3\n0","expected":"3"}]},{"id":23,"group":"while","rank":4,"title":"Сумма чисел, кратных 4 или 9","condition":"В последовательности целых чисел вычислить сумму всех чисел, которые кратны 4 или 9.\nКоличество заранее неизвестно. Ввод заканчивается числом 0; стоп-сигнал в последовательность не входит. Не более 20 чисел, модуль каждого не больше 1500.","input":"Целые числа по одному. Последнее введённое число — 0.","sampleInput":"-16\n93\n90\n0","sampleOutput":"74","body":"kol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\na = int(input())\nwhile a != 0:\n    if УСЛОВИЕ:\n        kol += 1\n        s += a\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)\n    a = int(input())","simple":"print(s)","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print(ЕСЛИ_ДА)\nelse:\n    print(ЕСЛИ_НЕТ)","mode":"simple","note":"","solution":"s = 0\na = int(input())\nwhile a != 0:\n    if a % 4 == 0 or a % 9 == 0:\n        s += a\n    a = int(input())\nprint(s)","hint":"1) До цикла создай s = 0.\n2) Вводи числа, пока не встретится 0.\n3) Для каждого числа проверяй кратность 4 ИЛИ кратность 9: используй or. Если подходит хотя бы одно условие, добавь число к s один раз.\n4) После цикла выведи s.","tests":[{"name":"Граничный случай","input":"4\n9\n8\n11\n0","expected":"21"},{"name":"Дополнительный случай","input":"-16\n93\n90\n0","expected":"74"},{"name":"Проверка отбора","input":"1\n2\n0","expected":"0"}]},{"id":7,"group":"while","rank":5,"title":"Сумма чисел, кратных 6 и оканчивающихся на 4","condition":"В последовательности натуральных чисел определить сумму чисел, кратных 6 и оканчивающихся на 4.\nКоличество заранее неизвестно. Ввод заканчивается числом 0; стоп-сигнал не входит в последовательность. Не более 1000 чисел, каждое не больше 30 000.","input":"Натуральные числа по одному. Последнее введённое число — 0.","sampleInput":"14\n24\n144\n22\n12\n0","sampleOutput":"168","body":"kol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\na = int(input())\nwhile a != 0:\n    if УСЛОВИЕ:\n        kol += 1\n        s += a\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)\n    a = int(input())","simple":"print(s)","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print(ЕСЛИ_ДА)\nelse:\n    print(ЕСЛИ_НЕТ)","mode":"simple","note":"","solution":"s = 0\na = int(input())\nwhile a != 0:\n    if a % 6 == 0 and a % 10 == 4:\n        s += a\n    a = int(input())\nprint(s)","hint":"1) Создай s = 0.\n2) Число должно одновременно делиться на 6 и оканчиваться на 4. Объедини проверки через and: a % 6 == 0 and a % 10 == 4.\n3) Если оба условия верны, прибавь a к s.\n4) Выведи s после завершения ввода.","tests":[{"name":"Граничный случай","input":"24\n60\n144\n22\n12\n0","expected":"168"},{"name":"Дополнительный случай","input":"14\n0","expected":"0"},{"name":"Проверка отбора","input":"6\n24\n0","expected":"24"}]},{"id":28,"group":"while","rank":6,"title":"Сумма чисел, кратных 7 и оканчивающихся на 2","condition":"В последовательности натуральных чисел определить сумму всех чисел, кратных 7 и оканчивающихся на 2.\nКоличество заранее неизвестно. Ввод заканчивается числом 0; стоп-сигнал не входит в последовательность.","input":"Натуральные числа по одному. Последнее введённое число — 0.","sampleInput":"112\n24\n42\n49\n22\n0","sampleOutput":"154","body":"kol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\na = int(input())\nwhile a != 0:\n    if УСЛОВИЕ:\n        kol += 1\n        s += a\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)\n    a = int(input())","simple":"print(s)","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print(ЕСЛИ_ДА)\nelse:\n    print(ЕСЛИ_НЕТ)","mode":"simple","note":"","solution":"s = 0\na = int(input())\nwhile a != 0:\n    if a % 7 == 0 and a % 10 == 2:\n        s += a\n    a = int(input())\nprint(s)","hint":"1) Создай s = 0.\n2) Для каждого числа до стоп-сигнала проверь сразу два условия: a % 7 == 0 и a % 10 == 2. Между ними поставь and.\n3) Подходящее число прибавляй к s.\n4) Ноль не включай в сумму и после цикла выведи s.","tests":[{"name":"Граничный случай","input":"112\n24\n42\n49\n22\n0","expected":"154"},{"name":"Дополнительный случай","input":"7\n12\n0","expected":"0"},{"name":"Проверка отбора","input":"14\n22\n42\n49\n0","expected":"42"}]},{"id":24,"group":"while","rank":7,"title":"Длина последовательности и количество нечётных чисел, кратных 3","condition":"Определить длину последовательности и количество нечётных чисел, кратных 3.\nКоличество заранее неизвестно. Ввод заканчивается числом 0; завершающий 0 не учитывается.","input":"Целые числа по одному. Последнее введённое число — 0.","sampleInput":"4\n6\n15\n180\n0","sampleOutput":"4, 1","body":"dlina = 0\nkol = 0\na = int(input())\nwhile a != 0:\n    dlina += 1\n    if УСЛОВИЕ:\n        dlina += 1\n        kol += 1\n    a = int(input())","simple":"print(dlina)\nprint(kol)","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print(ЕСЛИ_ДА)\nelse:\n    print(ЕСЛИ_НЕТ)","mode":"simple","note":"","solution":"dlina = 0\nkol = 0\na = int(input())\nwhile a != 0:\n    dlina += 1\n    if a % 3 == 0 and a % 2 != 0:\n        kol += 1\n    a = int(input())\nprint(dlina, kol, sep=', ')","hint":"1) dlina = 0 — первый счётчик длины. Увеличивай его на каждом проходе while, потому что любое ненулевое число входит в последовательность.\n2) kol = 0 — второй счётчик. Увеличивай его только для нечётных чисел, кратных 3: a % 2 != 0 and a % 3 == 0.\n3) Сначала прочитай a до начала цикла; в конце каждой итерации обязательно прочитай следующее число. Сам 0 не учитывай.\n4) Выведи dlina и kol ОДНОЙ строкой через запятую: используй один print с двумя аргументами и sep=', '.","tests":[{"name":"Граничный случай","input":"0","expected":"0, 0"},{"name":"Дополнительный случай","input":"1\n3\n0","expected":"2, 1"},{"name":"Проверка отбора","input":"4\n6\n15\n180\n0","expected":"4, 1"}],"outputLine":"comma","printInstruction":"Два результата выведи одной строкой через запятую: один print с двумя аргументами и sep=', '."},{"id":25,"group":"while","rank":8,"title":"Сумма последовательности и количество чётных чисел, кратных 5","condition":"Определить сумму всех чисел последовательности и количество чётных чисел, кратных 5.\nКоличество заранее неизвестно. Ввод за onditional":"if УСЛОВИЕ_ВЫВОДА:\n    print(ЕСЛИ_ДА)\nelse:\n    print(ЕСЛИ_НЕТ)","mode":"simple","note":"","solution":"dlina = 0\ns = 0\na = int(input())\nwhile a != 0:\n    dlina += 1\n    if a % 2 == 0:\n        s += a\n    a = int(input())\nprint(dlina, s, sep=', ')","hint":"1) dlina = 0 — счётчик всех ненулевых чисел. Увеличивай его на каждом проходе while.\n2) s = 0 — сумма только чётных чисел. Внутри if проверь a % 2 == 0 и прибавь к s само число a.\n3) Сначала прочитай первое a, а в конце каждой итерации — следующее. Ноль не входит в длину и сумму.\n4) По формату тренажёра выведи dlina и s одной строкой через запятую: один print с двумя аргументами и sep=', '.","tests":[{"name":"Граничный случай","input":"4\n60\n15\n0","expected":"3, 64"},{"name":"Дополнительный случай","input":"0","expected":"0, 0"},{"name":"Проверка отбора","input":"-2\n-4\n3\n0","expected":"3, -6"}],"outputLine":"comma","printInstruction":"Два результата выведи одной строкой через запятую: один print с двумя аргументами и sep=', '."},{"id":27,"group":"while","rank":10,"title":"Сумма и разность количества положительных и отрицательных чисел","condition":"В последовательности целых чисел определить сумму чисел и разность количества положительных и отрицательных чисел (положительные минус отрицательные).\nКоличество заранее неизвестно. Ввод заканчивается числом 0; завершающий 0 не учитывается.","input":"Целые числа по одному. Последнее введённое число — 0.","sampleInput":"150\n-200\n-1\n0","sampleOutput":"-51\n-1","body":"kol = 0\ns = 0\npr = 1\nplus = 0\nminus = 0\na = int(input())\nwhile a != 0:\n    s += a\n    plus += 1\n    minus += 1\n    if УСЛОВИЕ:\n        s += a\n        plus += 1\n        minus += 1\n    if УСЛОВИЕ:\n        s += a\n        plus += 1\n        minus += 1\n    a = int(input())","simple":"print(s)\nprint(plus - minus)","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print(ЕСЛИ_ДА)\nelse:\n    print(ЕСЛИ_НЕТ)","mode":"simple","note":"","solution":"s = 0\nplus = 0\nminus = 0\na = int(input())\nwhile a != 0:\n    s += a\n    if a > 0:\n        plus += 1\n    if a < 0:\n        minus += 1\n    a = int(input())\nprint(s)\nprint(plus - minus)","hint":"1) s = 0 — сумма всех ненулевых чисел: прибавляй каждое a.\n2) plus = 0 — счётчик положительных; увеличивай при a > 0. minus = 0 — счётчик отрицательных; увеличивай при a < 0.\n3) Ноль завершает ввод и не входит ни в сумму, ни в счётчики.\n4) Выведи s и разность plus - minus. Это два результата; в этой задаче оставь вывод отдельными строками.","tests":[{"name":"Граничный случай","input":"150\n-200\n-1\n0","expected":"-51\n-1"},{"name":"Дополнительный случай","input":"5\n1\n0","expected":"6\n2"},{"name":"Проверка отбора","input":"-5\n-1\n0","expected":"-6\n-2"}]},{"id":31,"group":"while","rank":11,"title":"Сумма трёхзначных чисел, кратных 4","condition":"В последовательности натуральных чисел вычислить сумму трёхзначных чисел, кратных 4.\nКоличество заранее неизвестно. Ввод заканчивается числом 0; завершающий 0 не входит в последовательность. Не более 20 чисел, каждое не больше 1500.","input":"Натуральные числа по одному. Последнее введённое число — 0.","sampleInput":"18\n192\n104\n117\n0","sampleOutput":"296","body":"kol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\na = int(input())\nwhile a != 0:\n    if УСЛОВИЕ:\n        kol += 1\n        s += a\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)\n    a = int(input())","simple":"print(s)","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print(ЕСЛИ_ДА)\nelse:\n    print(ЕСЛИ_НЕТ)","mode":"simple","note":"","solution":"s = 0\na = int(input())\nwhile a != 0:\n    if 100 <= a <= 999 and a % 4 == 0:\n        s += a\n    a = int(input())\nprint(s)","hint":"1) s = 0 — накопитель суммы.\n2) Для каждого ненулевого числа проверь две части: трёхзначное (100 <= a <= 999) и кратное 4 (a % 4 == 0). Соедини через and.\n3) Только если обе части верны, прибавь a к s.\n4) После цикла выведи s.","tests":[{"name":"Граничный случай","input":"18\n192\n104\n117\n0","expected":"296"},{"name":"Дополнительный случай","input":"100\n101\n0","expected":"100"},{"name":"Проверка отбора","input":"996\n1200\n0","expected":"996"}]},{"id":15,"group":"while","rank":12,"title":"Среднее чисел, кратных 8 (или NO)","condition":"Найти среднее арифметическое чисел, кратных 8. Если таких чисел нет, вывести NO.\nКоличество заранее неизвестно. Ввод заканчивается числом 0; завершающий 0 не входит в последовательность. Не более 100 чисел, каждое не больше 300.","input":"Натуральные числа по одному. Последнее введённое число — 0.","sampleInput":"8\n122\n64\n16\n0","sampleOutput":"29.3","body":"kol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\na = int(input())\nwhile a != 0:\n    if УСЛОВИЕ:\n        kol += 1\n        s += a\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)\n    a = int(input())","simple":"print(round(s / kol, 1))","conditional":"if kol > 0:\n    print(round(s / kol, 1))\nelse:\n    print('NO')","mode":"conditional","note":"","solution":"s = 0\nkol = 0\na = int(input())\nwhile a != 0:\n    if a % 8 == 0:\n        s += a\n        kol += 1\n    a = int(input())\nif kol > 0:\n    print(round(s / kol, 1))\nelse:\n    print('NO')","hint":"1) s = 0 и kol = 0 создай до цикла. s хранит сумму подходящих чисел, kol — их количество.\n2) Внутри while a != 0 проверь кратность 8. Для подходящего числа увеличь оба накопителя.\n3) После цикла обязательно проверь kol > 0. Если kol равен нулю, делить нельзя — выведи NO.\n4) Иначе выведи среднее s / kol с одним знаком после точки.","tests":[{"name":"Граничный случай","input":"8\n122\n64\n16\n0","expected":"29.3"},{"name":"Дополнительный случай","input":"3\n5\n0","expected":"NO"},{"name":"Проверка отбора","input":"16\n0","expected":"16.0"}]},{"id":17,"group":"while","rank":13,"title":"Среднее двузначных чисел (или NO)","condition":"Найти среднее арифметическое двузначных чисел. Если таких чисел нет, вывести NO.\nКоличество заранее неизвестно. Ввод заканчивается числом 0; завершающий 0 не учитывается. Не более 100 чисел, каждое не больше 300.","input":"Натуральные числа по одному. Последнее введённое число — 0.","sampleInput":"10\n120\n49\n0","sampleOutput":"29.5","body":"kol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\na = int(input())\nwhile a != 0:\n    if УСЛОВИЕ:\n        kol += 1\n        s += a\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)\n    a = int(input())","simple":"print(round(s / kol, 1))","conditional":"if kol > 0:\n    print(round(s / kol, 1))\nelse:\n    print('NO')","mode":"conditional","note":"","solution":"s = 0\nkol = 0\na = int(input())\nwhile a != 0:\n    if 10 <= a <= 99:\n        s += a\n        kol += 1\n    a = int(input())\nif kol > 0:\n    print(round(s / kol, 1))\nelse:\n    print('NO')","hint":"1) s = 0 и kol = 0 создай до цикла.\n2) Двузначные натуральные числа — от 10 до 99 включительно. Для них прибавляй a к s и увеличивай kol.\n3) Ноль только останавливает ввод и не учитывается.\n4) После цикла: если kol > 0, выведи среднее s / kol с одним знаком; иначе выведи NO.","tests":[{"name":"Граничный случай","input":"10\n120\n49\n0","expected":"29.5"},{"name":"Дополнительный случай","input":"99\n120\n0","expected":"99.0"},{"name":"Проверка отбора","input":"10\n99\n120\n0","expected":"54.5"}]},{"id":19,"group":"while","rank":14,"title":"Среднее чисел, у которых запись в системе 7 оканчивается на 5 (или NO)","condition":"Найти среднее арифметическое натуральных десятичных чисел, запись которых в системе счисления по основанию 7 оканчивается цифрой 5. Если таких чисел нет, вывести NO.\nКоличество заранее неизвестно. Ввод заканчивается числом 0; завершающий 0 не учитывается. Числа не больше 30 000.","input":"Натуральные числа по одному. Последнее введённое число — 0.","sampleInput":"12\n14\n20\n68\n25\n0","sampleOutput":"40","body":"kol = 0\ns = 0\npr = 1\nmaxi = -10**10\nmini = 10**10\na = int(input())\nwhile a != 0:\n    if УСЛОВИЕ:\n        kol += 1\n        s += a\n        pr *= a\n        maxi = max(maxi, a)\n        mini = min(mini, a)\n    a = int(input())","simple":"print(f'{s / kol:g}')","conditional":"if kol > 0:\n    print(f'{s / kol:g}')\nelse:\n    print('NO')","mode":"conditional","note":"","solution":"s = 0\nkol = 0\na = int(input())\nwhile a != 0:\n    if a % 7 == 5:\n        s += a\n        kol += 1\n    a = int(input())\nif kol > 0:\n    print(f'{s / kol:g}')\nelse:\n    print('NO')","hint":"1) s = 0 и kol = 0 создай перед while.\n2) В семеричной системе последняя цифра 5 тогда и только тогда, когда a % 7 == 5.\n3) Для каждого подходящего числа увеличь сумму s на a и счётчик kol на 1.\n4) После цикла проверь kol > 0: при нуле выведи NO, иначе — среднее s / kol. Ноль-стоп не обрабатывается внутри цикла.","tests":[{"name":"Граничный случай","input":"12\n14\n20\n68\n25\n0","expected":"40"},{"name":"Дополнительный случай","input":"1\n2\n0","expected":"NO"},{"name":"Проверка отбора","input":"5\n12\n19\n26\n0","expected":"15.5"}]},{"id":32,"group":"ranges","rank":2,"title":"Количество нечётных чисел на отрезке [a; b]","condition":"По двум натуральным числам a и b подсчитать количество нечётных натуральных чисел на отрезке [a; b], включая оба конца.\nГарантируется: 1 ≤ a ≤ b ≤ 30 000.","input":"Два числа: сначала левая граница a, затем правая граница b.","sampleInput":"1\n10","sampleOutput":"5","body":"a = int(input())\nb = int(input())\n# kol = 0\n\nfor a in range(a, b + 1):\n    if УСЛОВИЕ:\n        # kol += 1","simple":"print(kol)","conditional":"if УСЛОВИЕ_ВЫВОДА:\n    print()\nelse:\n    print()","mode":"simple","note":"Перебирай от a до b включительно. Счётчик меняется только для нечётных чисел.","solution":"a = int(input())\nb = int(input())\nkol = 0\nfor a in range(a, b + 1):\n    if a % 2 != 0:\n        kol += 1\nprint(kol)","hint":"1) Прочитай две границы a и b.\n2) Создай kol = 0 до цикла. Перебирай значения a от a до b включительно.\n3) Для нечётного числа используй a % 2 != 0. Только в этом случае ув async function runOne(code,input){pyRuntime.globals.set('student_code',code);pyRuntime.globals.set('test_input',input);const result=await pyRuntime.runPythonAsync(`import sys, io, contextlib\n_old_stdin = sys.stdin\n_buf = io.StringIO()\nsys.stdin = io.StringIO(test_input)\ntry:\n    with contextlib.redirect_stdout(_buf):\n        exec(compile(student_code, '<student>', 'exec'), {})\n    _result = _buf.getvalue()\nfinally:\n    sys.stdin = _old_stdin\n_result`);return String(result).trim().replace(/\r/g,'');}
function normOut(s){return String(s).trim().replace(/\r/g,'').split(/\s+/).filter(Boolean).map(x=>{const n=Number(x);return x!==''&&Number.isFinite(n)?'N:'+n.toPrecision(12):'S:'+x;}).join('|');}
async function runAllTests(){const t=taskById(currentId),btn=$('runBtn');let code;try{code=getRunnableCode(t);}catch(e){showResult('⚠️ '+e.message,'bad');return;}btn.disabled=true;btn.textContent='Загружаю Python…';try{if(!pyRuntime)pyRuntime=await getPython();btn.textContent='Проверяю тесты…';const results=[];for(const test of t.tests){try{const actual=await runOne(code,test.input);results.push({...test,actual,passed:normOut(actual)===normOut(test.expected),error:''});}catch(e){results.push({...test,actual:'',passed:false,error:String(e?.message||e)});}}const passed=results.every(x=>x.passed),failed=results.filter(x=>!x.passed);const record={time:new Date().toISOString(),code,hintCount:store.hints[t.id]||0,passed,results};(store.attempts[t.id] ||= []).push(record);if(store.attempts[t.id].length>30)store.attempts[t.id].shift();if(passed){if(!store.done.includes(t.id))store.done.push(t.id);}else{store.done=store.done.filter(x=>x!==t.id);}save();renderNavigation();const lines=results.map((r,i)=>`${r.passed?'✅':'❌'} Тест ${i+1}: ${r.name}\nВвод: ${r.input.replace(/\n/g,' | ')}\nПолучено: ${r.error?'ОШИБКА: '+r.error:(r.actual||'(пусто)')}\nОжидалось: ${r.expected}`).join('\n\n');showResult(`${passed?'✅ ВСЕ ТЕСТЫ ПРОЙДЕНЫ':'⚠️ НЕ ВСЕ ТЕСТЫ ПРОЙДЕНЫ'} (${results.filter(x=>x.passed).length}/${results.length})\n${failed.length?`Провалено тестов: ${failed.length}. Проверь граничные случаи.`:'Задание автоматически отмечено выполненным. Переход к следующему заданию…'}\n\n${lines}` ,passed?'good':'bad');if(passed){const status=$('taskView').querySelector('.task-top .task-badge:last-child');if(status){status.textContent='✅ Выполнено';status.classList.remove('source-badge');}const auto=$('taskView').querySelector('.task-auto-status');if(auto)auto.textContent='✅ Выполнено — переходим к следующему заданию';setTimeout(()=>{if(currentId===t.id)moveTask(1);},1600);}}catch(e){showResult('Ошибка запуска Python:\n'+(e?.message||String(e)),'error');}finally{btn.disabled=false;btn.textContent=`▶ Проверить на ${t.tests.length} тестах`;}}
function statusFor(t){const arr=store.attempts[t.id]||[];const last=arr[arr.length-1];if(store.done.includes(t.id)||last?.passed)return ['✅','Выполнено','pass'];if(last)return ['❌','Есть ошибки','fail'];if(store.hints[t.id])return ['💡','Использована подсказка','hinted'];return ['⚪','Не начато',''];}
function openReport(){const attempted=TASKS.filter(t=>(store.attempts[t.id]||[]).length),passed=TASKS.filter(t=>store.done.includes(t.id)).length,hinted=TASKS.filter(t=>(store.hints[t.id]||0)>0).length,hintUses=TASKS.reduce((n,t)=>n+(store.hints[t.id]||0),0);const rows=[...TASKS].sort((a,b)=>globalTaskNum(a.id)-globalTaskNum(b.id)).map(t=>{const st=statusFor(t),records=store.attempts[t.id]||[],last=records[records.length-1],code=last?.code||store.codes[t.id]||defaultCode(t,getMode(t));return `<details class="report-item ${st[2]}"><summary>${st[0]} №${globalTaskNum(t.id)} (PDF №${t.id}) — ${escapeHtml(t.title)} <span style="font-weight:500;color:var(--muted)">(${st[1]}; подсказок: ${store.hints[t.id]||0}; попыток: ${records.length})</span></summary><div style="font-size:12px;margin:7px 0"><b>Условие задачи:</b><br>${escapeHtml(t.condition).replace(/\n/g,'<br>')}<br><br><b>Пример ввода:</b><pre>${escapeHtml(t.sampleInput)}</pre><b>Ожидаемый ответ:</b> ${escapeHtml(t.sampleOutput)}<br><b>Код ученика:</b></div><pre>${escapeHtml(code)}</pre>${records.map((rec,ri)=>`<div class="report-test"><b>Попытка ${ri+1} ${rec.passed?'✅':'❌'} • ${new Date(rec.time).toLocaleString('ru-RU')}</b>${rec.results.map((r,i)=>`\n\n${r.passed?'✅':'❌'} ${escapeHtml(r.name||'Тест '+(i+1))}\nВходные данные: ${r.input.replace(/\n/g,' | ')}\nОжидалось: ${r.expected}\nРеакция программы: ${r.error||r.actual||'(пустой вывод)'}`).join('')}\nПодсказок использовано к моменту попытки: ${rec.hintCount}</div>`).join('')||'<p class="level">Задача ещё не проверялась.</p>'}</details>`;}).join('');$('reportHost').innerHTML=`<div class="report-backdrop" id="reportBackdrop"><section class="report-panel"><div class="report-head"><h2>📋 Полный отчёт учителю — ${escapeHtml(store.student||'Ученик')}</h2><div class="report-actions"><button class="btn" id="reportPrint">Печать</button><button class="btn" id="reportDownload">Скачать HTML</button><button class="btn" id="reportClose">Закрыть ✕</button></div></div><div class="report-summary"><span class="report-stat">Заданий в отчёте: ${TASKS.length}/${TASKS.length}</span><span class="report-stat">Проверено: ${attempted.length}</span><span class="report-stat">Выполнено: ${passed}</span><span class="report-stat">С подсказкой: ${hinted} · использований: ${hintUses}</span><span class="report-stat">Всего попыток: ${Object.values(store.attempts).reduce((a,x)=>a+x.length,0)}</span></div><div class="report-list">${rows}</div></section></div>`;const backdrop=$('reportBackdrop');$('reportClose').onclick=()=>{$('reportHost').innerHTML='';};backdrop.addEventListener('click',e=>{if(e.target===backdrop)$('reportHost').innerHTML='';});$('reportPrint').onclick=()=>{document.body.classList.add('printing-report');window.onafterprint=()=>document.body.classList.remove('printing-report');window.print();};$('reportDownload').onclick=downloadReport;}

function openMemo(){
 const host=$('memoHost');
 host.innerHTML=`<div class="memo-backdrop" id="memoBackdrop"><section class="memo-modal"><div class="memo-modal-head"><h2>Памятка по обработке чисел</h2><button class="btn" id="memoClose">Закрыть ✕</button></div><div class="memo-modal-body">${$('memoTemplate').innerHTML}</div></section></div>`;
 host.querySelector('.memo-embedded-frame').srcdoc=EMBEDDED_MEMO_HTML;
 const close=()=>{host.innerHTML='';};$('memoClose').onclick=close;$('memoBackdrop').addEventListener('click',e=>{if(e.target.id==='memoBackdrop')close();});
}
function saveApplication(){
 const html='<!doctype html>\n'+document.documentElement.outerHTML;
 const snapshot=JSON.stringify(store).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
 const out=html.replace(/const EMBEDDED_STATE = \{[\s\S]*?\};/,`const EMBEDDED_STATE = ${snapshot};`);
 const blob=new Blob([out],{type:'text/html;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`ОГЭ_обработка_чисел_${(store.student||'ученик').replace(/[^а-яёa-z0-9_-]/gi,'_')}.html`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
 showResult('Сохранена копия приложения со всеми кодами, прогрессом, попытками и подсказками. Её можно перенести на другой компьютер.','good');
}

function applyTheme(){document.body.classList.toggle('theme-dark',store.theme==='dark');$('themeBtn').textContent=store.theme==='dark'?'◑ Светлая тема':'◐ Тёмная тема';}
function applyFont(){document.body.classList.remove('font-small','font-medium','font-large','font-xlarge','font-xxlarge');document.body.classList.add('font-'+(store.font||'medium'));document.querySelectorAll('[data-font]').forEach(b=>b.classList.toggle('active',b.dataset.font===store.font));}
$('studentName').value=store.student||'';$('studentName').addEventListener('input',e=>{store.student=e.target.value;save();});
$('reportBtn').onclick=openReport;$('memoBtn').onclick=openMemo;$('saveAppBtn').onclick=saveApplication;$('themeBtn').onclick=()=>{store.theme=store.theme==='dark'?'light':'dark';applyTheme();save();};document.querySelectorAll('[data-font]').forEach(b=>b.onclick=()=>{store.font=b.dataset.font;applyFont();save();});
$('resetProgressBtn').onclick=()=>{if(confirm('Сбросить результаты проверок и прогресс? Код ученика останется сохранённым.')){store.done=[];store.attempts={};store.hints={};save();renderNavigation();renderTask();}};$('resetProgressBtn').title='Удалит отметки выполнения, результаты тестов и учёт подсказок';
document.addEventListener('click',e=>{if(!$('snippetMenu').contains(e.target)&&!e.target.classList.contains('gutter-plus'))$('snippetMenu').classList.add('hidden');});
applyTheme();applyFont();$('studentName').value=store.student||'';renderNavigation();renderTask();
</script>
