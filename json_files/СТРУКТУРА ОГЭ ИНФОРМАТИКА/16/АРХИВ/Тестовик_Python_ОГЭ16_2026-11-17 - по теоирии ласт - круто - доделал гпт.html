*10:\n    print(mini)\nelse:\n    print('NO')","mono":1,"task":112,"id":"prep45"},{"sec":"prep","prompt":"Задача (ХАРД): **Среднее максимального и минимального среди чётных**.\nВ последовательности натуральных чисел найти среднее арифметическое максимального и минимального из чётных чисел. Гарантируется, что хотя бы одно число чётное.\n\nКакие строки нужно написать **перед циклом**? Отметь все нужные — без лишних и без неверных.","options":["maxi = 10**10","mini = -10**10","mini = 10**10","pr = 1","s = 0","maxi = -10**10"],"correct":[2,5],"explain":"Нужно: `maxi = -10**10`, `mini = 10**10`. Максимум — с очень маленького числа. Минимум — с очень большого. Лишние переменные не нужны.","hint":"Подумай, какие величины просит найти задача: количество, сумму, произведение, максимум, минимум, длину…","after":"n = int(input())\nmaxi = -10**10\nmini = 10**10\nfor i in range(n):\n    a = int(input())\n    if a % 2 == 0:\n        maxi = max(maxi, a)\n        mini = min(mini, a)\nprint(round((maxi + mini) / 2, 1))","mono":1,"task":113,"id":"prep46"},{"sec":"bug","prompt":"Задача: **среднее чисел, запись которых в семеричной системе оканчивается нечётной цифрой**.\nНа вводе `6, 12, 15, 10, 71, 50, 11` программа вывела `32.3`, а правильный ответ `31.6`. В чём ошибка?","options":["проверяется последняя десятичная цифра (a % 10), а нужна семеричная (a % 7)","kol должен начинаться с 1","нужно округлять до целого","неверно стоит else"],"correct":[0],"explain":"Последняя цифра записи по основанию 7 — это `a % 7`.","code":"n = int(input())\ns = 0\nkol = 0\nfor i in range(n):\n    a = int(input())\n    if a % 10 % 2 != 0:\n        s += a\n        kol += 1\nif kol > 0:\n    print(round(s / kol, 1))\nelse:\n    print('NO')","inp":"6\n12\n15\n10\n71\n50\n11","memo":"wrong_mod","after":"n = int(input())\ns = 0\nkol = 0\nfor i in range(n):\n    a = int(input())\n    if a % 7 % 2 != 0:\n        s += a\n        kol += 1\nif kol > 0:\n    print(round(s / kol, 1))\nelse:\n    print('NO')","id":"bug01"},{"sec":"bug","prompt":"Задача: **длина последовательности и количество нечётных чисел, кратных 3 (ввод до 0)**.\nНа вводе `4, 6, 15, 180, 0` программа вывела `1 1`, а правильный ответ `4 1`. В чём ошибка?","options":["не хватает dlina = 1","нужно or вместо and","dlina += 1 попал под if, а длину нужно считать для всех чисел","print должен выводить на двух строках"],"correct":[2],"explain":"Длина последовательности — количество ВСЕХ чисел, без проверки.","code":"dlina = 0\nkol = 0\na = int(input())\nwhile a != 0:\n    if a % 3 == 0 and a % 2 != 0:\n        dlina += 1\n        kol += 1\n    a = int(input())\nprint(dlina, kol)","inp":"4\n6\n15\n180\n0","memo":"outside_if","after":"dlina = 0\nkol = 0\na = int(input())\nwhile a != 0:\n    dlina += 1\n    if a % 3 == 0 and a % 2 != 0:\n        kol += 1\n    a = int(input())\nprint(dlina, kol)","id":"bug02"},{"sec":"bug","prompt":"Задача: **количество нечётных чисел на отрезке [a; b]**.\nНа вводе `1, 10` программа вывела `10`, а правильный ответ `5`. В чём ошибка?","options":["нужно range(a, b)","в условии проверяется a (левый конец), а не текущее число x","нечётность проверяется как a % 2 == 0","kol нужно увеличивать на x"],"correct":[1],"explain":"Переменная цикла — x. Проверять нужно её; a не меняется, поэтому посчитались все числа.","code":"a = int(input())\nb = int(input())\nkol = 0\nfor x in range(a, b + 1):\n    if a % 2 != 0:\n        kol += 1\nprint(kol)","inp":"1\n10","after":"a = int(input())\nb = int(input())\nkol = 0\nfor x in range(a, b + 1):\n    if x % 2 != 0:\n        kol += 1\nprint(kol)","id":"bug03"},{"sec":"bug","prompt":"Задача: **максимальное число, кратное 4, и сколько раз оно встречается**.\nНа вводе `5, 8, 12, 3, 12, 4` программа вывела `12 1`, а правильный ответ `12 2`. В чём ошибка?","options":["maxi должен начинаться с 0","надо искать минимум","при повторе максимума счётчик снова сбрасывается в 1, а нужно kol += 1 (ветка elif a == maxi)","нужно проверять a % 4 != 0"],"correct":[2],"explain":"Новый максимум → kol = 1; такой же максимум → kol += 1. Это две разные ветки.","code":"n = int(input())\nmaxi = -10**10\nkol = 0\nfor i in range(n):\n    a = int(input())\n    if a % 4 == 0:\n        if a >= maxi:\n            maxi = a\n            kol = 1\nprint(maxi, kol)","inp":"5\n8\n12\n3\n12\n4","after":"n = int(input())\nmaxi = -10**10\nkol = 0\nfor i in range(n):\n    a = int(input())\n    if a % 4 == 0:\n        if a > maxi:\n            maxi = a\n            kol = 1\n        elif a == maxi:\n            kol += 1\nprint(maxi, kol)","id":"bug04"},{"sec":"bug","prompt":"Задача: **количество «рекордов» (результат больше всех предыдущих)**.\nНа вводе `3, 5, 5, 8, 0` программа вывела `4 4`, а правильный ответ `4 3`. В чём ошибка?","options":["maxi нужно начинать с 0","dlina считается неверно","надо выводить на двух строках","повтор рекорда (5 и 5) считается новым рекордом: нужно строгое a > maxi"],"correct":[3],"explain":"Рекорд — СТРОГО больше всех предыдущих. Равный результат рекордом не является.","code":"dlina = 0\nkol = 0\nmaxi = -10**10\na = int(input())\nwhile a != 0:\n    dlina += 1\n    if a >= maxi:\n        kol += 1\n        maxi = a\n    a = int(input())\nprint(dlina, kol)","inp":"3\n5\n5\n8\n0","after":"dlina = 0\nkol = 0\nmaxi = -10**10\na = int(input())\nwhile a != 0:\n    dlina += 1\n    if a > maxi:\n        kol += 1\n        maxi = a\n    a = int(input())\nprint(dlina, kol)","id":"bug06"},{"sec":"bug","prompt":"Задача: **количество и сумма двузначных чисел, у которых цифра десятков больше цифры единиц**.\nНа вводе `21, 12, 90, 5, 0` программа вывела `1 / 12`, а правильный ответ `2 / 111`. В чём ошибка?","options":["нужно 10 < a < 99","сумма должна быть s += 1","нужно or вместо and","цифры перепутаны: a % 10 — единицы, a // 10 — десятки; нужно a // 10 > a % 10"],"correct":[3],"explain":"Десятки: `a // 10`, единицы: `a % 10`.","code":"kol = 0\ns = 0\na = int(input())\nwhile a != 0:\n    if 10 <= a <= 99 and a % 10 > a // 10:\n        kol += 1\n        s += a\n    a = int(input())\nprint(kol)\nprint(s)","inp":"21\n12\n90\n5\n0","memo":"wrong_mod","after":"kol = 0\ns = 0\na = int(input())\nwhile a != 0:\n    if 10 <= a <= 99 and a // 10 > a % 10:\n        kol += 1\n        s += a\n    a = int(input())\nprint(kol)\nprint(s)","id":"bug07"},{"sec":"bug","prompt":"Задача: **наименьшее трёхзначное число, у которого первая цифра равна последней (или NO)**.\nНа вводе `4, 121, 303, 20, 2002` программа вывела `20`, а правильный ответ `121`. В чём ошибка?","options":["нужно max вместо min","нет проверки «трёхзначное»: у числа 20 тоже 20 // 100 == 20 % 10 (оба 0)","первая цифра — a // 10","mini нужно начинать с 0"],"correct":[1],"explain":"Если по условию число трёхзначное, это обязательно проверять: `100 <= a <= 999`.","code":"n = int(input())\nmini = 10**10\nfor i in range(n):\n    a = int(input())\n    if a // 100 == a % 10:\n        mini = min(mini, a)\nif mini < 10**10:\n    print(mini)\nelse:\n    print('NO')","inp":"4\n121\n303\n20\n2002","after":"n = int(input())\nmini = 10**10\nfor i in range(n):\n    a = int(input())\n    if 100 <= a <= 999 and a // 100 == a % 10:\n        mini = min(mini, a)\nif mini < 10**10:\n    print(mini)\nelse:\n    print('NO')","id":"bug08"},{"sec":"bug","prompt":"Задача: **скорости: если хотя бы два автомобиля ехали не быстрее 40 — YES**.\nНа вводе `3, 40, 35, 90` программа вывела `NO`, а правильный ответ `YES`. В чём ошибка?","options":["нужно kol2 = 1 в начале","«не быстрее 40» — это a <= 40, а написано строгое a < 40","нужно kol2 > 2","YES и NO перепутаны"],"correct":[1],"explain":"Граница включается: 40 км/ч — тоже «не быстрее 40».","code":"n = int(input())\nkol2 = 0\nfor i in range(n):\n    a = int(input())\n    if a < 40:\n        kol2 += 1\nif kol2 >= 2:\n    print('YES')\nelse:\n    print('NO')","inp":"3\n40\n35\n90","after":"n = int(input())\nkol2 = 0\nfor i in range(n):\n    a = int(input())\n    if a <= 40:\n        kol2 += 1\nif kol2 >= 2:\n    print('YES')\nelse:\n    print('NO')","id":"bug09"},{"sec":"bug","prompt":"Задача: **если хотя бы один участник набрал 0 — YES**.\nНа вводе `3, 0, 5, 0` программа вывела `NO`, а правильный ответ `YES`. В чём ошибка?","options":["kol2 нужно начинать с 1","нужно a != 0","«хотя бы один» — это kol2 > 0; условие kol2 == 1 ломается, когда нулей два","надо выводить kol2"],"correct":[2],"explain":"Хотя бы один = один ИЛИ больше.","code":"n = int(input())\nkol2 = 0\nfor i in range(n):\n    a = int(input())\n    if a == 0:\n        kol2 += 1\nif kol2 == 1:\n    print('YES')\nelse:\n    print('NO')","inp":"3\n0\n5\n0","after":"n = int(input())\nkol2 = 0\nfor i in range(n):\n    a = int(input())\n    if a == 0:\n        kol2 += 1\nif kol2 > 0:\n    print('YES')\nelse:\n    print('NO')","id":"bug10"},{"sec":"bug","prompt":"Задача: **среднее арифметическое максимального и минимального из чётных чисел**.\nНа вводе `3, 4, 10, 2` программа вывела `6`, а правильный ответ `6.0`. В чём ошибка?","options":["`//` отбрасывает дробную часть; для среднего нужно обычное деление `/`","нужно складывать все числа","mini нужно начинать с 0","чётность проверяется как a % 2 != 0"],"correct":[0],"explain":"(10 + 2) / 2 = 6.0, а `//` дал 6 — формат вывода другой; при нечётной сумме и значение будет неверным.","code":"n = int(input())\nmaxi = -10**10\nmini = 10**10\nfor i in range(n):\n    a = int(input())\n    if a % 2 == 0:\n        maxi = max(maxi, a)\n        mini = min(mini, a)\nprint((maxi + mini) // 2)","inp":"3\n4\n10\n2","after":"n = int(input())\nmaxi = -10**10\nmini = 10**10\nfor i in range(n):\n    a = int(input())\n    if a % 2 == 0:\n        maxi = max(maxi, a)\n        mini = min(mini, a)\nprint(round((maxi + mini) / 2, 1))","id":"bug11"},{"sec":"bug","prompt":"Задача: **средняя температура дней, когда она выше 0, и количество таких дней**.\nНа вводе `4, -5, 12, -2, 8` программа вывела `5.0 / 4`, а правильный ответ `10.0 / 2`. В чём ошибка?","options":["нужно //","нужно s += 1","kol += 1 стоит вне if — считаются все дни, а не только тёплые","нужно a >= 0"],"correct":[2],"explain":"И сумма, и количество должны считаться только для подходящих чисел.","code":"n = int(input())\nkol = 0\ns = 0\nfor i in range(n):\n    a = int(input())\n    kol += 1\n    if a > 0:\n        s += a\nprint(s / kol)\nprint(kol)","inp":"4\n-5\n12\n-2\n8","memo":"outside_if","after":"n = int(input())\nkol = 0\ns = 0\nfor i in range(n):\n    a = int(input())\n    if a > 0:\n        kol += 1\n        s += a\nprint(s / kol)\nprint(kol)","id":"bug12"},{"sec":"bug","prompt":"Задача: **сумма чисел, кратных 4 или 9 (ввод до 0, числа могут быть отрицательными)**.\nНа вводе `-16, 93, 90, 36, 0` программа вывела `36`, а правильный ответ `110`. В чём ошибка?","options":["нужно a % 4 != 0","while a > 0","«или» — это or; с and подходят только числа, кратные сразу 4 и 9 (то есть 36)","s = 1 в начале"],"correct":[2],"explain":"Слово «или» в условии задачи — `or`.","code":"s = 0\na = int(input())\nwhile a != 0:\n    if a % 4 == 0 and a % 9 == 0:\n        s += a\n    a = int(input())\nprint(s)","inp":"-16\n93\n90\n36\n0","after":"s = 0\na = int(input())\nwhile a != 0:\n    if a % 4 == 0 or a % 9 == 0:\n        s += a\n    a = int(input())\nprint(s)","id":"bug13"},{"sec":"trace","prompt":"Задача (FOR): **Количество чисел, кратных 4**.\nЧто выведет программа при вводе `3, 16, 26, 24`?","options":["3","1","2","40"],"correct":[2],"explain":"Правильный вывод: `2`. Перед циклом создай kol = 0 — счётчик подходящих чисел.","hint":"1) Перед циклом создай kol = 0 — счётчик подходящих чисел.\n2) Внутри цикла проверяй кратность 4: остаток от деления на 4 равен нулю.\n3) Только внутри if увеличивай kol на 1. Сумма, произведение, максимум и минимум здесь не нужны.\n4) В конце выведи kol одной командой print().","code":"n = int(input())\nkol = 0\nfor i in range(n):\n    a = int(input())\n    if a % 4 == 0:\n        kol += 1\nprint(kol)","inp":"3\n16\n26\n24","mono":1,"task":3,"id":"trace01"},{"sec":"trace","prompt":"Задача (FOR): **Количество чисел, оканчивающихся на 3**.\nЧто выведет программа при вводе `3, 13, 23, 24`?","options":["1","2","3","36"],"correct":[1],"explain":"Правильный вывод: `2`. Перед циклом создай kol = 0.","hint":"1) Перед циклом создай kol = 0.\n2) Для каждого числа a проверь последнюю десятичную цифру: остаток от деления на 10 равен 3.\n3) Если условие верно, увеличь kol на 1. Не прибавляй к счётчику само число.\n4) В конце выведи kol.","code":"n = int(input())\nkol = 0\nfor i in range(n):\n    a = int(input())\n    if a % 10 == 3:\n        kol += 1\nprint(kol)","inp":"3\n13\n23\n24","mono":1,"task":5,"id":"trace02"},{"sec":"trace","prompt":"Задача (FOR): **Сумма чисел, кратных 6**.\nЧто выведет программа при вводе `3, 12, 25, 6`?","options":["19","18","2","25"],"correct":[1],"explain":"Правильный вывод: `18`. Перед циклом создай s = 0 — накопитель суммы.","hint":"1) Перед циклом создай s = 0 — накопитель суммы.\n2) Внутри цикла проверь, делится ли a на 6 без остатка.\n3) Только для подходящего числа прибавляй a к s. Счётчик kol не нужен.\n4) В конце выведи s.","code":"n = int(input())\ns = 0\nfor i in range(n):\n    a = int(input())\n    if a % 6 == 0:\n        s += a\nprint(s)","inp":"3\n12\n25\n6","mono":1,"task":2,"id":"trace03"},{"sec":"trace","prompt":"Задача (FOR): **Сумма чисел, оканчивающихся на 4**.\nЧто выведет программа при вводе `3, 14, 25, 24`?","options":["38","39","25","2"],"correct":[0],"explain":"Правильный вывод: `38`. Перед циклом создай s = 0.","hint":"1) Перед циклом создай s = 0.\n2) Последняя цифра равна 4, если a % 10 == 4.\n3) Внутри if прибавляй само число a к сумме s.\n4) В конце выведи s.","code":"n = int(input())\ns = 0\nfor i in range(n):\n    a = int(input())\n    if a % 10 == 4:\n        s += a\nprint(s)","inp":"3\n14\n25\n24","mono":1,"task":4,"id":"trace04"},{"sec":"trace","prompt":"Задача (FOR): **Максимальное число, кратное 5**.\nЧто выведет программа при вводе `3, 10, 25, 12`?","options":["24","26","25","12"],"correct":[2],"explain":"Правильный вывод: `25`. До цикла задай maxi заведомо маленьким числом, например -10**10.","hint":"1) До цикла задай maxi заведомо маленьким числом, например -10**10.\n2) Для каждого a проверь делимость на 5.\n3) Внутри if обновляй максимум: maxi = max(maxi, a). Счётчик и сумму не меняй.\n4) В конце выведи maxi.","code":"n = int(input())\nmaxi = -10**10\nfor i in range(n):\n    a = int(input())\n    if a % 5 == 0:\n        maxi = max(maxi, a)\nprint(maxi)","inp":"3\n10\n25\n12","mono":1,"task":1,"id":"trace05"},{"sec":"trace","prompt":"Задача (FOR): **Максимальное число, оканчивающееся на 3**.\nЧто выведет программа при вводе `3, 13, 23, 3`?","options":["24","-10000000000","23","3"],"correct":[2],"explain":"Правильный вывод: `23`. До цикла задай maxi = -10**10.","hint":"1) До цикла задай maxi = -10**10.\n2) Проверяй последнюю цифру: a % 10 == 3.\n3) Только для чисел с последней цифрой 3 обновляй maxi.\n4) В конце выведи maxi.","code":"n = int(input())\nmaxi = -10**10\nfor i in range(n):\n    a = int(input())\n    if a % 10 == 3:\n        maxi = max(maxi, a)\nprint(maxi)","inp":"3\n13\n23\n3","mono":1,"task":6,"id":"trace06"},{"sec":"trace","prompt":"Задача (FOR): **Минимальное чётное число**.\nЧто выведет программа при вводе `4, 3, 20, 6, 8`?","options":["6","7","0","3"],"correct":[0],"explain":"Правильный вывод: `6`. До цикла задай mini = 10**10 — число больше любого допустимого входного.","hint":"1) До цикла задай mini = 10**10 — число больше любого допустимого входного.\n2) Проверь чётность: a % 2 == 0.\n3) Только для чётных чисел обновляй mini = min(mini, a).\n4) В конце выведи mini.","code":"n = int(input())\nmini = 10**10\nfor i in range(n):\n    a = int(input())\n    if a % 2 == 0:\n        mini = min(mini, a)\nprint(mini)","inp":"4\n3\n20\n6\n8","mono":1,"task":8,"id":"trace07"},{"sec":"trace","prompt":"Задача (FOR): **Скорости: разность максимума и минимума, количество до 30 км/ч**.\nЧто выведет программа при вводе `4, 74, 69, 63, 96`?","options":["96\n0","33\n0","32\n0","34\n0"],"correct":[1],"explain":"Правильный вывод: `33 / 0`. Здесь нужны три независимых действия.","hint":"Здесь нужны три независимых действия.\n1) maxi и mini обновляй для КАЖДОЙ скорости — вне условия отбора.\n2) kol = 0 создай до цикла; увеличивай kol только если скорость не выше 30.\n3) В конце выведи два результата: сначала maxi - mini, затем kol. Для этого задания они печатаются отдельными строками.","code":"n = int(input())\nkol = 0\nmaxi = -10**10\nmini = 10**10\nfor i in range(n):\n    a = int(input())\n    maxi = max(maxi, a)\n    mini = min(mini, a)\n    if a <= 30:\n        kol += 1\nprint(maxi - mini)\nprint(kol)","inp":"4\n74\n69\n63\n96","mono":1,"task":10,"id":"trace08"},{"sec":"trace","prompt":"Задача (FOR): **Температура: среднее положительных значений и их количество**.\nЧто выведет программа при вводе `4, -5, 12, -2, 8`?","options":["1.0\n2","10.0\n2","1.0\n20","10.5\n2"],"correct":[1],"explain":"Правильный вывод: `10.0 / 2`. s = 0 и kol = 0 создай перед циклом.","hint":"1) s = 0 и kol = 0 создай перед циклом.\n2) Положительные температуры отбирай условием a > 0. Только для них увеличивай s на a и kol на 1.\n3) Среднее вычисляется как s / kol. В этом задании гарантирован хотя бы один положительный день.\n4) Выведи среднее, затем количество положительных дней — двумя командами print().","code":"n = int(input())\nkol = 0\ns = 0\nfor i in range(n):\n    a = int(input())\n    if a > 0:\n        kol += 1\n        s += a\nprint(s / kol)\nprint(kol)","inp":"4\n-5\n12\n-2\n8","mono":1,"task":11,"id":"trace09"},{"sec":"trace","prompt":"Задача (FOR): **Викторина: максимум правильных ответов и нулевой результат**.\nЧто выведет программа при вводе `1, 1`?","options":["0\nNO","2\nNO","1\nYES","1\nNO"],"correct":[3],"explain":"Правильный вывод: `1 / NO`. maxi = -10**10 обновляй для каждого участника — без условия.","hint":"1) maxi = -10**10 обновляй для каждого участника — без условия.\n2) Создай второй счётчик kol2 = 0. Если a == 0, увеличь kol2 на 1.\n3) После цикла выведи maxi. Затем проверь kol2 > 0: если да, выведи YES, иначе NO.\n4) Здесь два независимых действия: поиск максимума и подсчёт нулевых результатов.","code":"n = int(input())\nmaxi = -10**10\nkol2 = 0\nfor i in range(n):\n    a = int(input())\n    maxi = max(maxi, a)\n    if a == 0:\n        kol2 += 1\nprint(maxi)\nif kol2 > 0:\n    print('YES')\nelse:\n    print('NO')","inp":"1\n1","mono":1,"task":12,"id":"trace11"},{"sec":"trace","prompt":"Задача (FOR): **Скорости: максимум и проверка скорости ниже 30**.\nЧто выведет программа при вводе `4, 74, 69, 63, 66`?","options":["74\nYES","74\nNO","73\nNO","75\nNO"],"correct":[1],"explain":"Правильный вывод: `74 / NO`. maxi = -10**10 обновляй для каждой скорости автомобиля — до условия.","hint":"1) maxi = -10**10 обновляй для каждой скорости автомобиля — до условия.\n2) Создай kol2 = 0. Если скорость строго меньше 30, увеличь kol2 на 1. Скорость 30 не подходит.\n3) Сначала выведи maxi. Затем проверь kol2 > 0: это означает, что хотя бы одна медленная машина была.\n4) Максимум и второй счётчик обновляются независимо друг от друга.","code":"n = int(input())\nmaxi = -10**10\nkol2 = 0\nfor i in range(n):\n    a = int(input())\n    maxi = max(maxi, a)\n    if a < 30:\n        kol2 += 1\nprint(maxi)\nif kol2 > 0:\n    print('YES')\nelse:\n    print('NO')","inp":"4\n74\n69\n63\n66","mono":1,"task":13,"id":"trace12"},{"sec":"trace","prompt":"Задача (FOR): **Скорости: среднее и не менее двух медленных автомобилей**.\nЧто выведет программа при вводе `4, 74, 69, 63, 96`?","options":["75.5\nYES","75\nNO","1.0\nNO","75.5\nNO"],"correct":[3],"explain":"Правильный вывод: `75.5 / NO`. Для среднего всех скоростей используй s = 0 (сумма) и kol = 0 (количество всех автомобилей).","hint":"1) Для среднего всех скоростей используй s = 0 (сумма) и kol = 0 (количество всех автомобилей).\n2) В каждом проходе цикла, независимо от условия, выполняй s += a и kol += 1.\n3) Второй счётчик kol2 = 0 увеличивай только при a <= 40. Скорость 40 подходит.\n4) После цикла выведи round(s / kol, 1). Затем проверь kol2 >= 2: выведи YES или NO.\n5) N нужен для организации цикла for, но для среднего делить на N не требуется: количество всех чисел уже хранится в kol.","code":"n = int(input())\ns = 0\nkol = 0\nkol2 = 0\nfor i in range(n):\n    a = int(input())\n    s += a\n    kol += 1\n    if a <= 40:\n        kol2 += 1\nprint(round(s / kol, 1))\nif kol2 >= 2:\n    print('YES')\nelse:\n    print('NO')","inp":"4\n74\n69\n63\n96","mono":1,"task":14,"id":"trace13"},{"sec":"trace","prompt":"Задача (FOR): **Контрольная: число неудовлетворительных оценок и отличник**.\nЧто выведет программа при вводе `4, 3, 9, 2, 8`?","options":["5\nNO","2\nNO","2\nYES","3\nNO"],"correct":[1],"explain":"Правильный вывод: `2 / NO`. kol = 0 — счётчик неудовлетворительных оценок. Если a < 5, увеличь kol на 1.","hint":"1) kol = 0 — счётчик неудовлетворительных оценок. Если a < 5, увеличь kol на 1.\n2) kol2 = 0 — отдельный счётчик отличников. Если a == 10, увеличь kol2 на 1.\n3) После цикла выведи kol. Затем проверь kol2 > 0: при положительном значении выведи YES, иначе NO.\n4) Это два независимых счётчика: каждый увеличивается только в своём условии.","code":"n = int(input())\nkol = 0\nkol2 = 0\nfor i in range(n):\n    a = int(input())\n    if a < 5:\n        kol += 1\n    if a == 10:\n        kol2 += 1\nprint(kol)\nif kol2 > 0:\n    print('YES')\nelse:\n    print('NO')","inp":"4\n3\n9\n2\n8","mono":1,"task":16,"id":"trace14"},{"sec":"trace","prompt":"Задача (FOR): **Среднее чисел с нечётной последней цифрой в записи по основанию 7**.\nЧто выведет программа при вводе `6, 12, 15, 10, 71, 50, 11`?","options":["31","32.3","1.0","31.6"],"correct":[3],"explain":"Правильный вывод: `31.6`. Для среднего заведи s = 0 и kol = 0 до цикла.","hint":"1) Для среднего заведи s = 0 и kol = 0 до цикла.\n2) Последняя цифра записи по основанию 7 равна a % 7. Чтобы она была нечётной, проверь (a % 7) % 2 != 0.\n3) При выполнении условия прибавь a к s и увеличь kol на 1.\n4) Выведи среднее s / kol; в условии гарантируется, что подходящие элементы есть.","code":"n = int(input())\ns = 0\nkol = 0\nfor i in range(n):\n    a = int(input())\n    if a % 7 % 2 != 0:\n        s += a\n        kol += 1\nif kol > 0:\n    print(round(s / kol, 1))\nelse:\n    print('NO')","inp":"6\n12\n15\n10\n71\n50\n11","mono":1,"task":18,"id":"trace15"},{"sec":"trace","prompt":"Задача (FOR): **Среднее чисел с нечётной последней цифрой в записи по основанию 7**.\nЧто выведет программа при вводе `3, 7, 14, 21`?","options":["0","YES","14.0","NO"],"correct":[3],"explain":"Правильный вывод: `NO`. Для среднего заведи s = 0 и kol = 0 до цикла.","hint":"1) Для среднего заведи s = 0 и kol = 0 до цикла.\n2) Последняя цифра записи по основанию 7 равна a % 7. Чтобы она была нечётной, проверь (a % 7) % 2 != 0.\n3) При выполнении условия прибавь a к s и увеличь kol на 1.\n4) Выведи среднее s / kol; в условии гарантируется, что подходящие элементы есть.","code":"n = int(input())\ns = 0\nkol = 0\nfor i in range(n):\n    a = int(input())\n    if a % 7 % 2 != 0:\n        s += a\n        kol += 1\nif kol > 0:\n    print(round(s / kol, 1))\nelse:\n    print('NO')","inp":"3\n7\n14\n21","mono":1,"task":18,"id":"trace16"},{"sec":"trace","prompt":"Задача (FOR): **Среднее чисел, оканчивающихся на 5 в системе счисления по основанию 7**.\nЧто выведет программа при вводе `5, 12, 14, 20, 68, 25`?","options":["25.0","19.666666666666668","1.0","40.0"],"correct":[3],"explain":"Правильный вывод: `40.0`. Создай s = 0 и kol = 0.","hint":"1) Создай s = 0 и kol = 0.\n2) Последняя цифра в системе с основанием 7 равна 5, если a % 7 == 5.\n3) Для подходящих чисел увеличивай сумму s и количество kol.\n4) Если kol > 0, выведи s / kol, округлив/оформив как требует условие; иначе выведи NO.","code":"n = int(input())\ns = 0\nkol = 0\nfor i in range(n):\n    a = int(input())\n    if a % 7 == 5:\n        s += a\n        kol += 1\nif kol > 0:\n    print(s / kol)\nelse:\n    print('NO')","inp":"5\n12\n14\n20\n68\n25","mono":1,"task":20,"id":"trace17"},{"sec":"trace","prompt":"Задача (FOR): **Среднее чисел, оканчивающихся на 5 в системе счисления по основанию 7**.\nЧто выведет программа при вводе `3, 1, 2, 3`?","options":["YES","NO","0","2.0"],"correct":[1],"explain":"Правильный вывод: `NO`. Создай s = 0 и kol = 0.","hint":"1) Создай s = 0 и kol = 0.\n2) Последняя цифра в системе с основанием 7 равна 5, если a % 7 == 5.\n3) Для подходящих чисел увеличивай сумму s и количество kol.\n4) Если kol > 0, выведи s / kol, округлив/оформив как требует условие; иначе выведи NO.","code":"n = int(input())\ns = 0\nkol = 0\nfor i in range(n):\n    a = int(input())\n    if a % 7 == 5:\n        s += a\n        kol += 1\nif kol > 0:\n    print(s / kol)\nelse:\n    print('NO')","inp":"3\n1\n2\n3","mono":1,"task":20,"id":"trace18"},{"sec":"trace","prompt":"Задача (FOR): **Сумма чисел, оканчивающихся на 1 в системе счисления по основанию 7**.\nЧто выведет программа при вводе `5, 15, 13, 11, 8, 23`?","options":["23","11","2","47"],"correct":[0],"explain":"Правильный вывод: `23`. Создай s = 0. Это задача на сумму, дополнительный счётчик не обязателен.","hint":"1) Создай s = 0. Это задача на сумму, дополнительный счётчик не обязателен.\n2) Последняя цифра семеричной записи равна 1, если a % 7 == 1.\n3) В цикле по N числам, если условие выполнено, прибавляй a к s.\n4) В конце выведи только s.","code":"n = int(input())\ns = 0\nfor i in range(n):\n    a = int(input())\n    if a % 7 == 1:\n        s += a\nprint(s)","inp":"5\n15\n13\n11\n8\n23","mono":1,"task":21,"id":"trace19"},{"sec":"trace","prompt":"Задача (ОТРЕЗКИ): **Количество чётных чисел на отрезке [a; b]**.\nЧто выведет программа при вводе `10, 20`?","options":["6","90","5","7"],"correct":[0],"explain":"Правильный вывод: `6`. Введи границы отрезка: start и finish.","hint":"1) Введи границы отрезка: start и finish.\n2) kol = 0 создай перед циклом.\n3) Перебирай все числа от start до finish включительно: range(start, finish + 1).\n4) Если a % 2 == 0, увеличь kol на 1. В конце выведи kol.","code":"a = int(input())\nb = int(input())\nkol = 0\nfor a in range(a, b + 1):\n    if a % 2 == 0:\n        kol += 1\nprint(kol)","inp":"10\n20","mono":1,"task":22,"id":"trace20"},{"sec":"trace","prompt":"Задача (ОТРЕЗКИ): **Количество нечётных чисел на отрезке [a; b]**.\nЧто выведет программа при вводе `1, 10`?","options":["25","4","6","5"],"correct":[3],"explain":"Правильный вывод: `5`. Прочитай две границы a и b.","hint":"1) Прочитай две границы a и b.\n2) Создай kol = 0 до цикла. Перебирай значения a от a до b включительно.\n3) Для нечётного числа используй a % 2 != 0. Только в этом случае увеличивай kol на 1.\n4) В конце выведи kol. Если границы совпадают, результат будет либо 1, либо 0.","code":"a = int(input())\nb = int(input())\nkol = 0\nfor a in range(a, b + 1):\n    if a % 2 != 0:\n        kol += 1\nprint(kol)","inp":"1\n10","mono":1,"task":32,"id":"trace21"},{"sec":"trace","prompt":"Задача (WHILE): **Количество трёхзначных чисел, кратных 4**.\nЧто выведет программа при вводе `120, 9, 365, 4, 0`?","options":["1","120","2","3"],"correct":[0],"explain":"Правильный вывод: `1`. До цикла создай kol = 0.","hint":"1) До цикла создай kol = 0.\n2) Вводи a до тех пор, пока a != 0. Ноль — только стоп-сигнал: тело цикла для него не выполняется.\n3) Трёхзначность проверяй через 100 <= a <= 999; кратность 4 — через a % 4 == 0. Объедини оба условия через and.\n4) Для подходящих чисел увеличивай kol. После цикла выведи kol.","code":"kol = 0\na = int(input())\nwhile a != 0:\n    if 100 <= a <= 999 and a % 4 == 0:\n        kol += 1\n    a = int(input())\nprint(kol)","inp":"120\n9\n365\n4\n0","mono":1,"task":9,"id":"trace23"},{"sec":"trace","prompt":"Задача (WHILE): **Количество однозначных чисел, кратных 3**.\nЧто выведет программа при вводе `121, 9, 4, 0`?","options":["0","2","9","1"],"correct":[3],"explain":"Правильный вывод: `1`. Создай kol = 0 до цикла.","hint":"1) Создай kol = 0 до цикла.\n2 ) Создай s = 0.\n2) Число должно одновременно делиться на 6 и оканчиваться на 4. Объедини проверки через and: a % 6 == 0 and a % 10 == 4.\n3) Если оба условия верны, прибавь a к s.\n4) Выведи s после завершения ввода.","code":"s = 0\na = int(input())\nwhile a != 0:\n    if a % 6 == 0 and a % 10 == 4:\n        s += a\n    a = int(input())\nprint(s)","inp":"14\n24\n144\n22\n12\n0","mono":1,"task":7,"id":"trace27"},{"sec":"trace","prompt":"Задача (WHILE): **Сумма чисел, кратных 7 и оканчивающихся на 2**.\nЧто выведет программа при вводе `112, 24, 42, 49, 22, 0`?","options":["154","22","225","2"],"correct":[0],"explain":"Правильный вывод: `154`. Создай s = 0.","hint":"1) Создай s = 0.\n2) Для каждого числа до стоп-сигнала проверь сразу два условия: a % 7 == 0 и a % 10 == 2. Между ними поставь and.\n3) Подходящее число прибавляй к s.\n4) Ноль не включай в сумму и после цикла выведи s.","code":"s = 0\na = int(input())\nwhile a != 0:\n    if a % 7 == 0 and a % 10 == 2:\n        s += a\n    a = int(input())\nprint(s)","inp":"112\n24\n42\n49\n22\n0","mono":1,"task":28,"id":"trace28"},{"sec":"trace","prompt":"Задача (WHILE): **Длина последовательности и количество нечётных чисел, кратных 3**.\nЧто выведет программа при вводе `4, 6, 15, 180, 0`?","options":["4 1","205 1","4 3","4 15"],"correct":[0],"explain":"Правильный вывод: `4 1`. dlina = 0 — счётчик длины. Увеличивай его на каждом проходе while, потому что любое ненулевое число входит в последовательность.","hint":"1) dlina = 0 — счётчик длины. Увеличивай его на каждом проходе while, потому что любое ненулевое число входит в последовательность.\n2) kol = 0 — второй счётчик. Увеличивай его только для нечётных чисел, кратных 3: a % 2 != 0 and a % 3 == 0.\n3) Сначала прочитай a до начала цикла; в конце каждой итерации обязательно прочитай следующее число. Сам 0 не учитывай.\n4) Выведи оба результата одной строкой в формате «число, число», например: print(dlina, kol).","code":"dlina = 0\nkol = 0\na = int(input())\nwhile a != 0:\n    dlina += 1\n    if a % 3 == 0 and a % 2 != 0:\n        kol += 1\n    a = int(input())\nprint(dlina, kol)","inp":"4\n6\n15\n180\n0","mono":1,"task":24,"id":"trace29"},{"sec":"trace","prompt":"Задача (WHILE): **Сумма последовательности и количество чётных чисел, кратных 5**.\nЧто выведет программа при вводе `4, 60, 15, 0`?","options":["79\n3","79\n60","79\n1","3\n1"],"correct":[2],"explain":"Правильный вывод: `79 / 1`. s = 0 — сумма всех ненулевых чисел. Добавляй к ней a на каждом проходе цикла.","hint":"1) s = 0 — сумма всех ненулевых чисел. Добавляй к ней a на каждом проходе цикла.\n2) kol = 0 — второй счётчик чётных чисел, кратных 5. Внутри отдельного if проверь a % 2 == 0 and a % 5 == 0 и увеличь kol.\n3) Перед while прочитай первое число, в конце цикла — следующее. 0 не суммируй и не считай.\n4) Выведи сумму и количество; в исходной задаче это два результата.","code":"s = 0\nkol = 0\na = int(input())\nwhile a != 0:\n    s += a\n    if a % 2 == 0 and a % 5 == 0:\n        kol += 1\n    a = int(input())\nprint(s)\nprint(kol)","inp":"4\n60\n15\n0","mono":1,"task":25,"id":"trace30"},{"sec":"trace","prompt":"Задача (WHILE): **Длина последовательности и сумма чётных чисел**.\nЧто выведет программа при вводе `4, 60, 15, 0`?","options":["79 64","3 15","3 64","3 2"],"correct":[2],"explain":"Правильный вывод: `3 64`. dlina = 0 — счётчик всех ненулевых чисел. Увеличивай его на каждом проходе while.","hint":"1) dlina = 0 — счётчик всех ненулевых чисел. Увеличивай его на каждом проходе while.\n2) s = 0 — сумма только чётных чисел. Внутри if проверь a % 2 == 0 и прибавь к s само число a.\n3) Сначала прочитай первое a, а в конце каждой итерации — следующее. Ноль не входит в длину и сумму.\n4) Выведи длину и сумму одной строкой через запятую и пробел: print(dlina, s).","code":"dlina = 0\ns = 0\na = int(input())\nwhile a != 0:\n    dlina += 1\n    if a % 2 == 0:\n        s += a\n    a = int(input())\nprint(dlina, s)","inp":"4\n60\n15\n0","mono":1,"task":26,"id":"trace31"},{ авливает ввод и не учитывается.\n4) После цикла: если kol > 0, выведи среднее s / kol с одним знаком; иначе выведи NO.","code":"s = 0\nkol = 0\na = int(input())\nwhile a != 0:\n    if 10 <= a <= 99:\n        s += a\n        kol += 1\n    a = int(input())\nif kol > 0:\n    print(round(s / kol, 1))\nelse:\n    print('NO')","inp":"10\n120\n49\n0","mono":1,"task":17,"id":"trace36"},{"sec":"trace","prompt":"Задача (WHILE): **Среднее чисел, у которых запись в системе 7 оканчивается на 5 (или NO)**.\nЧто выведет программа при вводе `12, 14, 20, 68, 25, 0`?","options":["19.666666666666668","1.0","40.0","25.0"],"correct":[2],"explain":"Правильный вывод: `40.0`. s = 0 и kol = 0 создай перед while.","hint":"1) s = 0 и kol = 0 создай перед while.\n2) В семеричной системе последняя цифра 5 тогда и только тогда, когда a % 7 == 5.\n3) Для каждого подходящего числа увеличь сумму s на a и счётчик kol на 1.\n4) После цикла проверь kol > 0: при нуле выведи NO, иначе — среднее s / kol. Ноль-стоп не обрабатывается внутри цикла.","code":"s = 0\nkol = 0\na = int(input())\nwhile a != 0:\n    if a % 7 == 5:\n        s += a\n        kol += 1\n    a = int(input())\nif kol > 0:\n    print(s / kol)\nelse:\n    print('NO')","inp":"12\n14\n20\n68\n25\n0","mono":1,"task":19,"id":"trace37"},{"sec":"trace","prompt":"Задача (WHILE): **Среднее чисел, у которых запись в системе 7 оканчивается на 5 (или NO)**.\nЧто выведет программа при вводе `1, 2, 0`?","options":["1.5","0","YES","NO"],"correct":[3],"explain":"Правильный вывод: `NO`. s = 0 и kol = 0 создай перед while.","hint":"1) s = 0 и kol = 0 создай перед while.\n2) В семеричной системе последняя цифра 5 тогда и только тогда, когда a % 7 == 5.\n3) Для каждого подходящего числа увеличь сумму s на a и счётчик kol на 1.\n4) После цикла проверь kol > 0: при нуле выведи NO, иначе — среднее s / kol. Ноль-стоп не обрабатывается внутри цикла.","code":"s = 0\nkol = 0\na = int(input())\nwhile a != 0:\n    if a % 7 == 5:\n        s += a\n        kol += 1\n    a = int(input())\nif kol > 0:\n    print(s / kol)\nelse:\n    print('NO')","inp":"1\n2\n0","mono":1,"task":19,"id":"trace38"},{"sec":"trace","prompt":"Задача (ХАРД): **Среднее чётных и количество нечётных, кратных 3**.\nЧто выведет программа при вводе `4, 2, 9, 4, 15`?","options":["3.0\n2","1.0\n2","3\n2","12.0\n2"],"correct":[0],"explain":"Правильный вывод: `3.0 / 2`. Здесь два независимых условия, поэтому два отдельных if (не elif!).","hint":"Здесь два независимых условия, поэтому два отдельных if (не elif!).\n1) Для чётных копи сумму s и их количество kol — они нужны для среднего.\n2) Для нечётных, кратных 3, — второй счётчик kol2. Условие составное: a % 2 != 0 and a % 3 == 0.\n3) Выведи round(s / kol, 1) и kol2 — двумя print.","code":"n = int(input())\ns = 0\nkol = 0\nkol2 = 0\nfor i in range(n):\n    a = int(input())\n    if a % 2 == 0:\n        s += a\n        kol += 1\n    if a % 2 != 0 and a % 3 == 0:\n        kol2 += 1\nprint(round(s / kol, 1))\nprint(kol2)","inp":"4\n2\n9\n4\n15","mono":1,"task":101,"id":"trace39"},{"sec":"trace","prompt":"Задача (ХАРД): **Максимум оканчивающихся на 7 и минимум кратных 5**.\nЧто выведет программа при вводе `4, 17, 25, 7, 100`?","options":["17\n0","-10000000000\n25","17\n25","17\n17"],"correct":[2],"explain":"Правильный вывод: `17 / 25`. Два разных отбора — два if.","hint":"Два разных отбора — два if.\n1) maxi обновляется только для чисел с последней цифрой 7 (a % 10 == 7).\n2) mini обновляется только для кратных 5.\n3) Начальные значения: maxi = -10**10, mini = 10**10.","code":"n = int(input())\nmaxi = -10**10\nmini = 10**10\nfor i in range(n):\n    a = int(input())\n    if a % 10 == 7:\n        maxi = max(maxi, a)\n    if a % 5 == 0:\n        mini = min(mini, a)\nprint(maxi)\nprint(mini)","inp":"4\n17\n25\n7\n100","mono":1,"task":102,"id":"trace40"},{"sec":"trace","prompt":"Задача (ХАРД): **Произведение чисел, оканчивающихся на 2 в семеричной записи**.\nЧто выведет программа при вводе `3, 2, 9, 10`?","options":["2","0","10","18"],"correct":[3],"explain":"Правильный вывод: `18`. Последняя цифра в 7-ричной записи — это остаток a % 7.","hint":"Последняя цифра в 7-ричной записи — это остаток a % 7.\n1) Произведение начинается с pr = 1.\n2) Чтобы понять, были ли подходящие числа, заведи счётчик kol.\n3) Вывод с условием: если kol > 0 — печатай pr, иначе NO.","code":"n = int(input())\npr = 1\nkol = 0\nfor i in range(n):\n    a = int(input())\n    if a % 7 == 2:\n        pr *= a\n        kol += 1\nif kol > 0:\n    print(pr)\nelse:\n    print('NO')","inp":"3\n2\n9\n10","mono":1,"task":106,"id":"trace44"},{"sec":"trace","prompt":"Задача (ХАРД): **Произведение чисел, оканчивающихся на 2 в семеричной записи**.\nЧто выведет программа при вводе `2, 1, 3`?","options":["3","NO","YES","0"],"correct":[1],"explain":"Правильный вывод: `NO`. Последняя цифра в 7-ричной записи — это остаток a % 7.","hint":"Последняя цифра в 7-ричной записи — это остаток a % 7.\n1) Произведение начинается с pr = 1.\n2) Чтобы понять, были ли подходящие числа, заведи счётчик kol.\n3) Вывод с условием: если kol > 0 — печатай pr, иначе NO.","code":"n = int(input())\npr = 1\nkol = 0\nfor i in range(n):\n    a = int(input())\n    if a % 7 == 2:\n        pr *= a\n        kol += 1\nif kol > 0:\n    print(pr)\nelse:\n    print('NO')","inp":"2\n1\n3","mono":1,"task":106,"id":"trace45"},{"sec":"trace","prompt":"Задача (ХАРД): **Среднее чисел, кратных 3, но не кратных 9 (или NO)**.\nЧто выведет программа при вводе `3, 9, 6, 0`?","options":["1.0","6.0","NO","4.5"],"correct":[3],"explain":"Правильный вывод: `4.5`. Условие «делится на 3, но не на 9»: a % 3 == 0 and a % 9 != 0.","hint":"1) Условие «делится на 3, но не на 9»: a % 3 == 0 and a % 9 != 0.\n2) Для среднего нужны и сумма s, и количество kol.\n3) Деление на ноль опасно — сначала проверь kol > 0.","code":"s = 0\nkol = 0\na = int(input())\nwhile a != 0:\n    if a % 3 == 0 and a % 9 != 0:\n        s += a\n        kol += 1\n    a = int(input())\nif kol > 0:\n    print(round(s / kol, 1))\nelse:\n    print('NO')","inp":"3\n9\n6\n0","mono":1,"task":108,"id":"trace47"},{"sec":"trace","prompt":"Задача (ХАРД): **Среднее чисел, кратных 3, но не кратных 9 (или NO)**.\nЧто выведет программа при вводе `9, 18, 0`?","options":["NO","YES","13.5","0"],"correct":[0],"explain":"Правильный вывод: `NO`. Условие «делится на 3, но не на 9»: a % 3 == 0 and a % 9 != 0.","hint":"1) Условие «делится на 3, но не на 9»: a % 3 == 0 and a % 9 != 0.\n2) Для среднего нужны и сумма s, и количество kol.\n3) Деление на ноль опасно — сначала проверь kol > 0.","code":"s = 0\nkol = 0\na = int(input())\nwhile a != 0:\n    if a % 3 == 0 and a % 9 != 0:\n        s += a\n        kol += 1\n    a = int(input())\nif kol > 0:\n    print(round(s / kol, 1))\nelse:\n    print('NO')","inp":"9\n18\n0","mono":1,"task":108,"id":"trace48"},{"sec":"trace","prompt":"Задача (ХАРД): **Отрезок: кратные 3, но не кратные 5 — количество и сумма**.\nЧто выведет программа при вводе `15, 15`?","options":["0","1 15","NO","YES"],"correct":[2],"explain":"Правильный вывод: `NO`. Перебор: for a in range(a, b + 1) — правая граница включена.","hint":"1) Перебор: for a in range(a, b + 1) — правая граница включена.\n2) Составное условие: a % 3 == 0 and a % 5 != 0.\n3) Если ничего не нашлось — NO; иначе print(kol, s).","code":"a = int(input())\nb = int(input())\nkol = 0\ns = 0\nfor a in range(a, b + 1):\n    if a % 3 == 0 and a % 5 != 0:\n        kol += 1\n        s += a\nif kol > 0:\n    print(kol, s)\nelse:\n    print('NO')","inp":"15\n15","mono":1,"task":111,"id":"trace52"},{"sec":"trace","prompt":"Задача (ХАРД): **Наименьшее трёхзначное число с одинаковыми первой и последней цифрами**.\nЧто выведет программа при вводе `4, 121, 303, 44, 2002`?","options":["122","0","121","NO"],"correct":[2],"explain":"Правильный вывод: `121`. Первая цифра трёхзначного числа — a // 100, последняя — a % 10.","hint":"Первая цифра трёхзначного числа — a // 100, последняя — a % 10.\n1) Условие: 100 <= a <= 999 and a // 100 == a % 10.\n2) Обновляй mini = min(mini, a).\n3) Если mini так и осталось 10**10 — подходящих не было, выводи NO.","code":"n = int(input())\nmini = 10**10\nfor i in range(n):\n    a = int(input())\n    if 100 <= a <= 999 and a // 100 == a % 10:\n        mini = min(mini, a)\nif mini < 10**10:\n    print(mini)\nelse:\n    print('NO')","inp":"4\n121\n303\n44\n2002","mono":1,"task":112,"id":"trace53"},{"sec":"trace","prompt":"Задача (ХАРД): **Наименьшее трёхзначное число с одинаковыми первой и последней цифрами**.\nЧто выведет программа при вводе `2, 123, 55`?","options":["NO","0","YES","123"],"correct":[0],"explain":"Правильный вывод: `NO`. Первая цифра трёхзначного числа — a // 100, последняя — a % 10.","hint":"Первая цифра трёхзначного числа — a // 100, последняя — a % 10.\n1) Условие: 100 <= a <= 999 and a // 100 == a % 10.\n2) Обновляй mini = min(mini, a).\n3) Если mini так и осталось 10**10 — подходящих не было, выводи NO.","code":"n = int(input())\nmini = 10**10\nfor i in range(n):\n    a = int(input())\n    if 100 <= a <= 999 and a // 100 == a % 10:\n        mini = min(mini, a)\nif mini < 10**10:\n    print(mini)\nelse:\n    print('NO')","inp":"2\n123\n55","mono":1,"task":112,"id":"trace54"},{"sec":"hard","prompt":"Почему при новом максимуме пишут `kol = 1`, а не `kol += 1`?","options":["kol += 1 вызывает ошибку","чтобы kol не стал отрицательным","старые повторения относились к прежнему, меньшему максимуму — их надо забыть","так короче"],"correct":[2],"explain":"Новый максимум встретился пока один раз — счёт начинается заново.","id":"hard02"},{"sec":"hard","prompt":"В программе выше вместо `else:` можно написать…","options":["ничего не писать — mini обновлять всегда","if a % 2 != 0:","if a % 2 == 0:","elif a % 2 == 0:"],"correct":[1],"explain":"else — «во всех остальных случаях», то есть для нечётных. Можно заменить отдельной проверкой нечётности.","id":"hard06"},{"sec":"hard","prompt":"Зачем в задаче на произведение заводят счётчик `kol`, если выводят только `pr`?","options":["чтобы понять, были ли подходящие числа: иначе pr = 1 выдал бы ложный ответ","без него будет ошибка деления","для красоты","чтобы посчитать среднее"],"correct":[0],"explain":"Если подходящих нет, произведение так и останется 1 — а нужно вывести NO. Счётчик показывает, нашлось ли хоть одно число.","code":"n = int(input())\npr = 1\nkol = 0\nfor i in range(n):\n    a = int(input())\n    if a % 7 == 2:\n        pr *= a\n        kol += 1\nif kol > 0:\n    print(pr)\nelse:\n    print('NO')","id":"hard08"},{"sec":"hard","prompt":"Как выразить: «первая цифра трёхзначного числа равна последней»?","options":["a // 100 == a % 10","a % 100 == a // 10","a // 10 == a % 10","a % 10 == a // 1000"],"correct":[0],"explain":"Первая цифра трёхзначного: `a // 100`; последняя: `a % 10`.","mono":1,"id":"hard09"},{"sec":"hard","prompt":"Как получить **сумму цифр** двузначного числа a?","options":["a / 10 + a % 10","a // 10 + a % 10","a // 10 * a % 10","a % 10 + a % 10"],"correct":[1],"explain":"Десятки + единицы.","mono":1,"id":"hard10"}],"memo":{"colon":{"t":"Нет двоеточия","msg":"SyntaxError: expected ':'","why":"После if, elif, else, for и while обязательно ставится двоеточие. Python ждал «:» в конце строки.","fix":"Допиши двоеточие в конце строки-заголовка.","bad":"if a % 2 == 0\n    kol += 1","good":"if a % 2 == 0:\n    kol += 1","c":"#fff1a8","e":"#e0b400","g":"run"},"eq":{"t":"«=» вместо «==»","msg":"SyntaxError: cannot assign to expression here. Maybe you meant '==' instead of '='?","why":"Один знак = — это присваивание («положи в переменную»). Для сравнения нужно два знака: ==.","fix":"В условиях сравнивай через ==, != , <, >, <=, >=.","bad":"if a % 2 = 0:","good":"if a % 2 == 0:","c":"#fff1a8","e":"#e0b400","g":"run"},"paren":{"t":"Не закрыта скобка","msg":"SyntaxError: '(' was never closed","why":"Каждой открывающей скобке нужна закрывающая. В int(input()) их две пары.","fix":"Посчитай скобки: сколько «(», столько и «)». Ошибка часто показывается на строке ниже.","bad":"a = int(input()","good":"a = int(input())","c":"#fff1a8","e":"#e0b400","g":"run"},"quote":{"t":"Не закрыта кавычка","msg":"SyntaxError: unterminated string literal","why":"Текст (строка) должен начинаться и заканчиваться одинаковыми кавычками.","fix":"Закрой кавычку: print('NO'). Не смешивай ' и \".","bad":"print('NO)","good":"print('NO')","c":"#fff1a8","e":"#e0b400","g":"run"},"print_paren":{"t":"print без скобок","msg":"SyntaxError: Missing parentheses in call to 'print'","why":"В Python 3 print — функция, значение передаётся в круглых скобках.","fix":"Пиши print(kol), а не print kol.","bad":"print kol","good":"print(kol)","c":"#fff1a8","e":"#e0b400","g":"run"},"else":{"t":"else не на своём месте","msg":"SyntaxError: invalid syntax","why":"else должен стоять ровно под своим if (с тем же отступом) и сразу после блока if. «else if» в Python не бывает — пишут elif.","fix":"Выровняй else по if; вместо «else if» пиши «elif».","bad":"if a > 0:\n    print(1)\n    else:\n    print(2)","good":"if a > 0:\n    print(1)\nelse:\n    print(2)","c":"#fff1a8","e":"#e0b400","g":"run"},"indent_block":{"t":"Нет отступа внутри блока","msg":"IndentationError: expected an indented block after 'if' statement","why":"После строки с двоеточием Python ждёт тело блока — строки, сдвинутые вправо (обычно на 4 пробела).","fix":"Сдвинь строки тела цикла / условия на 4 пробела (клавиша Tab в редакторе).","bad":"for i in range(n):\na = int(input())","good":"for i in range(n):\n    a = int(input())","c":"#cfe6ff","e":"#3b82f6","g":"run"},"unexpected":{"t":"Лишний отступ","msg":"IndentationError: unexpected indent","why":"Строка сдвинута вправо, хотя перед ней нет заголовка с двоеточием. Отступы в Python — часть программы.","fix":"Убери лишние пробелы в начале строки.","bad":"n = int(input())\n  kol = 0","good":"n = int(input())\nkol = 0","c":"#cfe6ff","e":"#3b82f6","g":"run"},"unindent":{"t":"Отступы «не совпадают»","msg":"IndentationError: unindent does not match any outer indentation level","why":"Строка сдвинута на число пробелов, которого нет ни у одного внешнего блока (например, 2 вместо 0 или 4).","fix":"Используй ровно 4 пробела на уровень. Выровняй строку по нужному блоку.","bad":"if a > 0:\n    print(1)\n  print(2)","good":"if a > 0:\n    print(1)\nprint(2)","c":"#cfe6ff","e":"#3b82f6","g":"run"},"tab":{"t":"Табы и пробелы вперемешку","msg":"TabError: inconsistent use of tabs and spaces in indentation","why":"Часть строк сдвинута табуляцией, часть — пробелами. Часто бывает после копирования кода из интернета или другого файла.","fix":"Перенабери отступы одинаково (в IDLE: Format → Untabify Region).","bad":null,"good":null,"c":"#cfe6ff","e":"#3b82f6","g":"run"},"name_init":{"t":"Переменная не создана","msg":"NameError: name 'kol' is not defined","why":"Нельзя увеличивать переменную, которой ещё нет: kol += 1 значит kol = kol + 1, а старого kol нет.","fix":"Перед циклом создай переменную: kol = 0, s = 0, pr = 1, maxi = -10**10 …","bad":"for i in range(n):\n    kol += 1","good":"kol = 0\nfor i in range(n):\n    kol += 1","c":"#ffd6e4","e":"#e5487a","g":"run"},"name_typo":{"t":"Опечатка в имени","msg":"NameError: name 'Print' is not defined. Did you mean: 'print'?","why":"Python различает большие и маленькие буквы: Print, Kol и kol — разные имена. Ещё коварнее русская «о» или «а» в имени — на вид буквы одинаковые!","fix":"Сверь имя с тем, как переменная создана. Пиши имена латиницей в одной раскладке.","bad":"Print(kol)","good":"print(kol)","c":"#ffd6e4","e":"#e5487a","g":"run"},"name_str":{"t":"Текст без кавычек","msg":"NameError: name 'NO' is not defined","why":"Слово без кавычек Python считает именем переменной. Чтобы вывести слово, его берут в кавычки.","fix":"print('NO'), print('YES').","bad":"print(NO)","good":"print('NO')","c":"#ffd6e4","e":"#e5487a","g":"run"},"type_str":{"t":"Забыли int() при вводе","msg":"TypeError: not all arguments converted during string formatting","why":"input() возвращает текст (строку). Со строкой нельзя считать остаток, складывать с числом и сравнивать с числом. Сообщения бывают разные: «not all arguments converted…», «unsupported operand type(s) for +=: 'int' and 'str'», «'>' not supported between instances of 'str' and 'int'».","fix":"Читай число так: a = int(input()).","bad":"a = input()\nif a % 4 == 0:","good":"a = int(input())\nif a % 4 == 0:","c":"#e6dcff","e":"#7b5cff","g":"run"},"call":{"t":"Имя функции занято числом","msg":"TypeError: 'int' object is not callable","why":"Переменную назвали max (или min, sum, print…) — и встроенная функция «пропала»: теперь max — число, его нельзя вызвать.","fix":"Называй переменные maxi, mini, s — не max, min, sum.","bad":"max = -10**10\nmax = max(max, a)","good":"maxi = -10**10\nmaxi = max(maxi, a)","c":"#e6dcff","e":"#7b5cff","g":"run"},"value":{"t":"Неверный ввод для int()","msg":"ValueError: invalid literal for int() with base 10: '3 5'","why":"int() умеет превращать в число только строку с одним целым числом. Два числа в одной строке, дробь «2.5», пустая строка — ошибка.","fix":"Вводи каждое число на отдельной строке. Проверь, что в данных нет лишних пробелов и дробей.","bad":null,"good":null,"c":"#e6dcff","e":"#7b5cff","g":"run"},"zero":{"t":"Деление на ноль","msg":"ZeroDivisionError: division by zero","why":"Среднее считают как s / kol. Если подходящих чисел не было, kol = 0 — делить нельзя.","fix":"Перед делением проверь: if kol > 0: … else: print('NO').","bad":"print(s / kol)","good":"if kol > 0:\n    print(s / kol)\nelse:\n    print('NO')","c":"#ffe0c7","e":"#f07a2a","g":"run"},"eof":{"t":"Данные закончились","msg":"EOFError: EOF when reading a line","why":"Программа вызывает input() больше раз, чем строк во входных данных: лишнее чтение, забыли завершающий 0, неверное N.","fix":"Сверь число вызовов input() с вводом: 1 (для N) + N чисел; в while — до нуля включительно.","bad":null,"good":null,"c":"#ffe0c7","e":"#f07a2a","g":"run"},"loop":{"t":"Программа «зависла»","msg":"Сообщения нет — программа не заканчивается","why":"Бесконечный цикл: в while забыли прочитать следующее число в конце тела цикла, поэтому a никогда не становится 0.","fix":"Последней строкой тела while должно быть a = int(input()) — с тем же отступом, что и if.","bad":"a = int(input())\nwhile a != 0:\n    if a % 2 == 0:\n        kol += 1","good":"a = int(input())\nwhile a != 0:\n    if a % 2 == 0:\n        kol += 1\n    a = int(input())","c":"#ffe0c7","e":"#f07a2a","g":"run"},"print_in_loop":{"t":"print внутри цикла","msg":"Ошибки нет, но ответов много","why":"print с отступом попал в тело цикла и печатает промежуточные значения на каждом шаге.","fix":"Итоговый print пиши без отступа — после цикла.","bad":"for i in range(n):\n    ...\n    print(kol)","good":"for i in range(n):\n    ...\nprint(kol)","c":"#d7f5e3","e":"#16a36a","g":"logic"},"init_in_loop":{"t":"Обнуление внутри цикла","msg":"Ошибки нет, но счётчик «забывает»","why":"kol = 0 внутри цикла выполняется на каждом шаге и стирает всё, что насчитали раньше.","fix":"Начальные значения задаются ДО цикла.","bad":"for i in range(n):\n    kol = 0\n    ...","good":"kol = 0\nfor i in range(n):\n    ...","c":"#d7f5e3","e":"#16a36a","g":"logic"},"outside_if":{"t":"Действие не под if","msg":"Ошибки нет, но считаются все числа","why":"kol += 1 стоит с тем же отступом, что и if, — значит, выполняется всегда, а не только для подходящих чисел.","fix":"Действие для подходящих чисел сдвигается на 4 пробела глубже, чем if.","bad":"if a % 4 == 0:\n    pass\nkol += 1","good":"if a % 4 == 0:\n    kol += 1","c":"#d7f5e3","e":"#16a36a","g":"logic"},"start_val":{"t":"Неверное начальное значение","msg":"Ошибки нет, но ответ 0 или странный","why":"pr = 0 → произведение всегда 0. maxi = 0 → не найдём максимум среди отрицательных. mini = 0 → минимум всегда 0. maxi = -10^10 → ^ в Python не степень, получится -4!","fix":"pr = 1, maxi = -10**10, mini = 10**10 (степень — две звёздочки **).","bad":"pr = 0\nmini = 0\nmaxi = -10^10","good":"pr = 1\nmini = 10**10\nmaxi = -10**10","c":"#d7f5e3","e":"#16a36a","g":"logic"},"plus_eq":{"t":"=+ вместо +=","msg":"Ошибки нет, но счётчик всегда 1","why":"kol =+ 1 читается как kol = +1, то есть «положи в kol единицу». Это не увеличение!","fix":"Увеличение: kol += 1 (сначала +, потом =).","bad":"kol =+ 1","good":"kol += 1","c":"#d7f5e3","e":"#16a36a","g":"logic"},"range_b":{"t":"Отрезок без правого конца","msg":"Ошибки нет, но не хватает числа b","why":"range(a, b) перебирает числа от a до b−1. Правый конец не включается.","fix":"Для отрезка [a; b] пиши range(a, b + 1).","bad":"for x in range(a, b):","good":"for x in range(a, b + 1):","c":"#d7f5e3","e":"#16a36a","g":"logic"},"wrong_mod":{"t":"Перепутали % и //, 10 и 7","msg":"Ошибки нет, но отбор не те числа","why":"a % 10 — последняя десятичная цифра; a % 7 — последняя цифра в семеричной записи; a // 10 — число без последней цифры; a / 2 — обычное деление с дробью.","fix":"Кратность k: a % k == 0. Последняя цифра: a % 10. Семеричная цифра: a % 7.","bad":null,"good":null,"c":"#d7f5e3","e":"#16a36a","g":"logic"},"format":{"t":"Лишний текст в выводе","msg":"Ошибки нет, но проверка «не засчитывает»","why":"Автопроверка сравнивает вывод символ в символ. «Ответ: 5», «Yes» вместо «YES», лишняя запятая — неверно.","fix":"Выводи ровно то, что требует условие: print(kol), print('YES').","bad":"print('Ответ:', kol)","good":"print(kol)","c":"#d7f5e3","e":"#16a36a","g":"logic"}}}</script>
<script>
'use strict';
const APPNAME='Python · ОГЭ №16 — тестовик';
const LSKEY='oge16_python_testovik_v2';
const DEFAULT_PIN='31415';
const SOURCE='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
const DATA=JSON.parse(document.getElementById('bank').textContent);
const SECS=DATA.secs, BANK=DATA.bank, MEMO=DATA.memo;
const Q=Object.fromEntries(BANK.map(q=>[q.id,q]));
const SEC=Object.fromEntries(SECS.map(s=>[s.id,s]));
const ORDER=BANK.map(q=>q.id);
const SEC_HINT={
 inp:'input() всегда возвращает текст. Чтобы получить число, его оборачивают в int(). Каждое число — отдельная строка ввода.',
 mod:'a % k — остаток от деления на k (0 означает «делится нацело»). a % 10 — последняя цифра, a // 10 — число без последней цифры, a % 7 — последняя цифра в семеричной записи.',
 cmp:'== сравнивает, = присваивает. «Не больше» — <=, «меньше» — <, «не менее» — >=. Двойное неравенство: 10 <= a <= 99.',
 log:'and — должны выполняться ОБА требования; or — достаточно ОДНОГО; not — «не». Каждую часть пиши полностью: a % 4 == 0 or a % 9 == 0.',
 acc:'Счётчик: kol = 0 и kol += 1. Сумма: s = 0 и s += a. Произведение: pr = 1 и pr *= a. Начальные значения — до цикла.',
 mm:'maxi = -10**10, mini = 10**10 (очень маленькое и очень большое). Обновление: maxi = max(maxi, a), mini = min(mini, a).',
 for:'range(n) — n повторений (0…n−1). range(a, b + 1) — все числа от a до b включительно. Тело цикла — строки с отступом.',
 whl:'Первое число читаем до цикла, следующее — последней строкой тела цикла. Стоп-сигнал 0 не обрабатывается.',
 out:'print(x, y) — через пробел в одну строку; два print — две строки. Текст — в кавычках, переменные — без. / всегда даёт дробь.',
 ans:'Перед делением на kol проверь kol > 0. Слова YES/NO — в кавычках и строго как в условии. else стоит под своим if.',
 run:'Читай ПОСЛЕДНЮЮ строку сообщения: тип ошибки и пояснение. Номер строки — в «line N». Иногда ошибка на строку выше.',
 cond:'Разбери условие задачи на части: кратность (% k == 0), последняя цифра (% 10), семеричная цифра (% 7), диапазон (10 <= a <= 99). Соедини and / or.',
 prep:'Какие величины просит задача? Количество → kol = 0, сумма → s = 0, произведение → pr = 1, максимум → maxi = -10**10, минимум → mini = 10**10.',
 bug:'Сравни программу с условием задачи построчно: начальные значения, условие отбора, отступы, что именно выводится.',
 trace:'Выполни программу на бумаге: выпиши переменные и меняй их на каждом шаге цикла.',
 hard:'Нарисуй таблицу: шаг, a, значения переменных после шага.'};
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const app=()=>document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function md(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/\n/g,'<br>');}
function plain(s){return String(s||'').replace(/`/g,'').replace(/\*\*/g,'').replace(/\*/g,'');}
const KW=new Set(['if','elif','else','for','while','in','and','or','not','break','pass','True','False']);
const FN=new Set(['print','int','input','range','max','min','round','Print','Int','str']);
function hl(line){
 return line.replace(/('[^']*'?|"[^"]*"?|#.*$|[A-Za-zА-Яа-яЁё_][\wА-Яа-яЁё]*|\d+)|([^'"#A-Za-zА-Яа-яЁё_\d]+)/g,(m,t,o)=>{
  if(o!==undefined)return esc(o);
  if(t[0]==="'"||t[0]==='"')return `<span class="s">${esc(t)}</span>`;
  if(t[0]==='#')return `<span class="c">${esc(t)}</span>`;
  if(/^\d/.test(t))return `<span class="n">${t}</span>`;
  if(t==='УСЛОВИЕ')return `<span class="u">${t}</span>`;
  if(KW.has(t))return `<span class="k">${t}</span>`;
  if(FN.has(t))return `<span class="f">${t}</span>`;
  return esc(t);});}
function codeHTML(code,hlLine){return `<pre class="pcode">${code.split('\n').map((l,i)=>`<span class="l${hlLine===i+1?' hl':''}">${hl(l)||' '}</span>`).join('')}</pre>`;}
function consHTML(t){const L=t.split('\n');return `<pre class="cons">${L.map((l,i)=>i===L.length-1?`<span class="er">${esc(l)}</span>`:esc(l)).join('\n')}</pre>`;}
function letter(i){return String.fromCharCode(65+i);}

/* ===== данные ===== */
function blankDB(){return {v:2,teacher:{name:'',email:'',tg:'',pin:DEFAULT_PIN},hw:[],hwTitle:'',students:{},last:'',theme:'light',updated:0};}
function parseEmbedded(){try{const t=document.getElementById('saved-state').textContent.trim();return t&&t!=='{}'?JSON.parse(t):null;}catch(e){return null;}}
function mergeInto(base,d){if(!d)return;if(d.teacher)base.teacher=Object.assign(base.teacher,d.teacher);
 if((d.hwAt||0)>=(base.hwAt||0)&&Array.isArray(d.hw)){base.hw=d.hw.filter(id=>Q[id]);base.hwTitle=d.hwTitle||'';base.hwAt=d.hwAt||0;}
 for(const [n,s] of Object.entries(d.students||{})){const o=base.students[n];if(!o||(s.updated||0)>=(o.updated||0))base.students[n]=s;}
 if(d.last)base.last=d.last;if(d.theme)base.theme=d.theme;base.updated=Math.max(base.updated||0,d.updated||0);}
function loadDB(){const b=blankDB();mergeInto(b,parseEmbedded());try{const l=localStorage.getItem(LSKEY);if(l)mergeInto(b,JSON.parse(l));}catch(e){}
 for(const s of Object.values(b.students)){s.q=s.q||{};s.tests=s.tests||[];}return b;}
let DB=loadDB();
function persist(){DB.updated=Date.now();try{localStorage.setItem(LSKEY,JSON.stringify(DB));}catch(e){toast('⚠ Память браузера переполнена — сохрани файл');}}
const cur={name:'',id:null,list:'all',open:null,view:'q',test:null,sel:new Set(),done:false,t0:0};
function stu(){return DB.students[cur.name];}
function rec(id){const s=stu();return s.q[id]||(s.q[id]={st:'',tries:0});}
const solved=r=>r&&['ok','err','hint','sol'].includes(r.st);
const problem=r=>r&&['err','hint','sol','bad'].includes(r.st)&&!r.fx;
function listIds(){const s=stu();if(cur.list==='hw')return DB.hw.filter(id=>Q[id]);if(cur.list==='redo')return ORDER.filter(id=>problem(s.q[id])||(s.q[id]&&s.q[id].inRedo));return ORDER;}
function counts(ids){const s=stu();ids=ids||listIds();let c={total:ids.length,done:0,ok:0,err:0,hint:0,sol:0,bad:0,wrong:0,ms:0};
 for(const id of ids){const r=s.q[id];if(!r)continue;if(solved(r))c.done++;if(r.st)c[r.st]++;c.wrong+=r.wrong||0;c.ms+=r.ms||0;}return c;}
function stamp(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDate(v){return v?new Date(v).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';}
function fmtT(ms){const m=Math.round((ms||0)/60000);return m<60?m+' мин':Math.floor(m/60)+' ч '+(m%60)+' мин';}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600);}
function modal(html,cls=''){closeModal();const m=document.createElement('div');m.className='mbg';m.id='mbg';m.innerHTML=`<div class="mdl ${cls}">${html}</div>`;m.onclick=e=>{if(e.target===m)closeModal();};document.body.appendChild(m);return m;}
function closeModal(){const m=document.getElementById('mbg');if(m)m.remove();}
function confirmBox(text,ok){modal(`<h2>Подтверждение</h2><p>${text}</p><div class="row"><button class="btn pri" id="cYes">Да</button><button class="btn" id="cNo">Отмена</button></div>`);$('#cYes').onclick=()=>{closeModal();ok();};$('#cNo').onclick=closeModal;}
function applyTheme(){document.documentElement.dataset.theme=DB.theme==='dark'?'dark':'light';}
function tick(){if(cur.t0&&cur.id&&cur.name){const r=rec(cur.id);r.ms=(r.ms||0)+Math.min(Date.now()-cur.t0,10*60000);}cur.t0=Date.now();}
function saveApp(){tick();persist();const json=JSON.stringify(DB).replace(/</g,'\\u003c');const open='<script id="saved-state" type="application/json">';const i=SOURCE.indexOf(open);
 const st=i+open.length,j=SOURCE.indexOf('</'+'script>',st);const out=SOURCE.slice(0,st)+json+SOURCE.slice(j);
 download(new Blob([out],{type:'text/html'}),'Тестовик_Python_ОГЭ16'+(cur.name?'_'+cur.name.replace(/[^\wА-Яа-яЁё-]+/g,'_'):'')+'_'+stamp()+'.html');toast('💾 Файл с прогрессом сохранён');}

/* ===== вход ===== */
function viewLogin(){tick();cur.name='';cur.id=null;cur.test=null;
 const profs=Object.values(DB.students).sort((a,b)=>(b.updated||0)-(a.updated||0));
 app().innerHTML=`<div class="login"><div class="lcard"><div class="logo">🐍</div><h1>Python · ОГЭ №16</h1><div class="sub">Тестовик: ввод, условия, циклы, вывод — и ошибки, которые чаще всего мешают программе</div>
 <form id="lf"><input id="nm" placeholder="Введи своё имя" autocomplete="off" maxlength="40" value="${esc(DB.last||'')}"><button class="btn pri" style="width:100%;justify-content:center;padding:14px;font-size:18px">Начать ➜</button></form>
 ${profs.length?`<div class="prof">${profs.map(p=>{const k=ORDER.filter(id=>solved(p.q[id])).length;return `<button data-n="${esc(p.name)}">👤 ${esc(p.name)} <small>${k}/${ORDER.length}</small></button>`;}).join('')}</div>`:''}
 ${DB.hw.length?`<div class="tnote">📌 Задано домашнее задание: ${esc(DB.hwTitle||'')} — ${DB.hw.length} вопр.</div>`:''}
 <div class="lfoot"><button class="btn ghost sm" id="th">${DB.theme==='dark'?'☀️ Светлая':'🌙 Тёмная'} тема</button><button class="btn ghost sm" id="mm">📌 Памятка ошибок</button><button class="btn ghost sm" id="tch">🎓 Учителю</button></div></div></div>`;
 $('#lf').onsubmit=e=>{e.preventDefault();const v=$('#nm').value.trim().replace(/\s+/g,' ');if(!v){$('#nm').focus();return;}enter(v);};
 $$('.prof button').forEach(b=>b.onclick=()=>enter(b.dataset.n));
 $('#th').onclick=()=>{DB.theme=DB.theme==='dark'?'light':'dark';applyTheme();persist();viewLogin();};
 $('#tch').onclick=askPin;$('#mm').onclick=()=>viewMemo();}
function enter(name){if(!DB.students[name])DB.students[name]={name,created:Date.now(),updated:Date.now(),q:{},tests:[]};
 cur.name=name;DB.last=name;persist();cur.list=DB.hw.length&&DB.hw.some(id=>!solved(stu().q[id]))?'hw':'all';
 const L=listIds();cur.id=stu().cur&&L.includes(stu().cur)?stu().cur:(L.find(id=>!solved(stu().q[id]))||L[0]);openQ(cur.id);}

/* ===== каркас ===== */
function topbar(){const c=counts(ORDER);
 return `<div class="top"><div class="ttl">🐍 <span>${APPNAME}</span></div>${cur.test?'<span class="tbadge">🎯 Контрольная</span>':''}<div class="who">👤 ${esc(cur.name)}</div>

async function makePDF(name,mode){const s=DB.students[name];const W=1240,H=1754,MX=72,pages=[];let cv,ctx,y;

 const tx=(t,x,yy,sz=22,col='#1d2640',b=false,al='left',m=false)=>{ctx.font=F(sz,b,m);ctx.fillStyle=col;ctx.textAlign=al;ctx.fillText(String(t),x,yy);};
 const wrap=(v,x,yy,mw,sz=20,col='#25334a',b=false,m=false,maxL=99)=>{const lh=Math.round(sz*1.4);ctx.font=F(sz,b,m);let n=0;for(const p of String(v??'').split('\n')){let line='';for(const w of p.split(/\s+/)){const t=line?line+' '+w:w;if(ctx.measureText(t).width>mw&&line){if(n<maxL)tx(line,x,yy,sz,col,b,'left',m);n++;yy+=lh;line=w;}else line=t;}if(n<maxL)tx(line,x,yy,sz,col,b,'left',m);n++;yy+=lh;}return yy;};
 const rr=(x,yy,w,h,r,f)=>{ctx.beginPath();ctx.moveTo(x+r,yy);ctx.arcTo(x+w,yy,x+w,yy+h,r);ctx.arcTo(x+w,yy+h,x,yy+h,r);ctx.arcTo(x,yy+h,x,yy,r);ctx.arcTo(x,yy,x+w,yy,r);ctx.closePath();ctx.fillStyle=f;ctx.fill();};
 np();const g=ctx.createLinearGradient(0,0,W,0);g.addColorStop(0,'#4f6bff');g.addColorStop(1,'#7b5cff');ctx.fillStyle=g;ctx.fillRect(0,0,W,200);

function pdfFromJpegs(imgs,w,h){const enc=new TextEncoder(),parts=[];let len=0;const offs=[];const add=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length;};const PW=595.28,PH=841.89,n=imgs.length;add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');const obj=(id,body)=>{offs[id]=len;add(id+' 0 obj\n');body();add('\nendobj\n');};obj(1,()=>add('<< /Type /Catalog /Pages 2 0 R >>'));obj(2,()=>add(`<< /Type /Pages /Count ${n} /Kids [${imgs.map((_,i)=>(3+i*3)+' 0 R').join(' ')}] >>`));imgs.forEach((im,i)=>{const p=3+i*3,c=p+1,x=p+2;obj(p,()=>add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im${i} ${x} 0 R >> >> /Contents ${c} 0 R >>`));const cs=`q ${PW} 0 0 ${PH} 0 0 cm /Im${i} Do Q`;obj(c,()=>add(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));obj(x,()=>{add(`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.length} >>\nstream\n`);add(im);add('\nendstream');});});const total=3+n*3,xref=len;let x=`xref\n0 ${total}\n0000000000 65535 f \n`;for(let i=1;i<total;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';add(x);add(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);return new Blob(parts,{type:'application/pdf'});}
