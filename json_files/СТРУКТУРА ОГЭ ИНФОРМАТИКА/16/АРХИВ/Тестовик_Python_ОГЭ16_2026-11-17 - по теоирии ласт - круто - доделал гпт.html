<script id="bank" type="application/json">{"secs":[{"id":"inp","title":"Ввод чисел: input() и int()","stars":1,"desc":"Как программа получает числа и почему нужен int().","n":12},{"id":"mod","title":"Остаток % и деление //","stars":1,"desc":"Кратность, последняя цифра, цифры числа, семеричная запись.","n":19},{"id":"cmp","title":"Сравнения в условии","stars":1,"desc":"==, !=, <, <=, двойные неравенства, «не выше», «не менее».","n":20},{"id":"log","title":"Составные условия: and, or, not","stars":2,"desc":"Несколько требований к числу одновременно или «хотя бы одно».","n":21},{"id":"acc","title":"Счётчик, сумма, произведение","stars":2,"desc":"Начальные значения и обновления: kol += 1, s += a, pr *= a.","n":12},{"id":"mm","title":"Максимум и минимум","stars":2,"desc":"Начальные значения ±10**10, max()/min(), что будет, если подходящих чисел нет.","n":11},{"id":"for","title":"Цикл for и range","stars":2,"desc":"Сколько раз повторится цикл, отрезок [a; b], отступы тела цикла.","n":12},{"id":"whl","title":"Цикл while: ввод до нуля","stars":2,"desc":"Первое чтение до цикла, следующее — в конце тела; 0 не обрабатывается.","n":10},{"id":"out","title":"Вывод print","stars":2,"desc":"Одна строка или несколько, пробелы, дроби, кавычки.","n":19},{"id":"ans","title":"Ответ с проверкой: NO, YES, среднее","stars":3,"desc":"if/else при выводе, деление на ноль, округление.","n":11},{"id":"run","title":"Ошибки при запуске: что скажет Python","stars":3,"desc":"Читаем сообщение об ошибке и находим, что исправить.","n":27},{"id":"cond","title":"Условие отбора в задачах","stars":3,"desc":"Для каждой задачи тренажёра: что поставить вместо УСЛОВИЕ.","n":32},{"id":"prep","title":"Заготовка: начальные значения","stars":3,"desc":"Какие переменные и с какими значениями создать до цикла — для каждой задачи.","n":45},{"id":"bug","title":"Логические ошибки: работает, но неверно","stars":4,"desc":"Программа запускается без сообщений, но ответ не тот. Найди причину.","n":12},{"id":"trace","title":"Что выведет программа?","stars":4,"desc":"Готовые решения всех задач тренажёра: выполни программу «в уме».","n":43},{"id":"hard","title":"Хард-приёмы","stars":4,"desc":"Счётчик максимума, предыдущее число, рекорды, цифры числа, ветка else.","n":5}],"bank":[{"sec":"inp","prompt":"Что делает строка `a = int(input())`?","options":["читает строку с клавиатуры и превращает её в целое число","читает строку и оставляет её текстом","читает число и сразу печатает его","создаёт случайное целое число"],"correct":[0],"explain":"`input()` читает одну строку ввода как текст, `int(...)` превращает этот текст в целое число, `a = ...` сохраняет результат в переменной `a`.","hint":"Разбери строку изнутри наружу: сначала input(), потом int(), потом присваивание.","id":"inp01"},{"sec":"inp","prompt":"Пользователь ввёл `25`. Что окажется в переменной после `a = input()` (без int)?","options":["ничего — будет ошибка","строка '25' — это текст, а не число","целое число 25","дробное число 25.0"],"correct":[1],"explain":"`input()` всегда возвращает строку. Чтобы получить число, её нужно обернуть в `int()`.","memo":"type_str","id":"inp02"},{"sec":"inp","prompt":"Ученик забыл `int`. Что произойдёт при вводе `16`?","options":["Программа ничего не напечатает","Программа напечатает 16","Ошибка TypeError: со строкой нельзя считать остаток","Ошибка NameError: нет переменной a"],"correct":[2],"explain":"Python сообщит: `TypeError: not all arguments converted during string formatting`. В `a` лежит текст `'16'`, а знак `%` для текста означает совсем другое действие. Нужно `a = int(input())`.","hint":"Какого типа значение возвращает input()?","code":"a = input()\nif a % 4 == 0:\n    print(a)","memo":"type_str","id":"inp03"},{"sec":"inp","prompt":"Программа начинается так. Сколько чисел она прочитает **внутри цикла**, если первым введено число 5?","options":["5","4","6","1"],"correct":[0],"explain":"`range(n)` повторяет тело цикла n раз, на каждом шаге одно `input()`. При n = 5 — пять чисел.","code":"n = int(input())\nfor i in range(n):\n    a = int(input())","mono":1,"id":"inp04"},{"sec":"inp","prompt":"Сколько раз всего вызовется `input()` в программе с циклом for, если N = 4?","options":["4 раза","8 раз","5 раз: один раз для N и 4 раза в цикле","1 раз"],"correct":[2],"explain":"Сначала читается само N, затем в цикле N чисел: 1 + 4 = 5.","id":"inp05"},{"sec":"inp","prompt":"Где должна стоять строка `a = int(input())` в задаче «сначала N, потом N чисел»?","options":["в самом начале, вместо n = int(input())","после цикла","перед циклом, один раз","внутри цикла for, с отступом"],"correct":[3],"explain":"Каждое из N чисел нужно прочитать и проверить, поэтому чтение стоит в теле цикла.","hint":"Сколько раз нужно прочитать очередное число?","id":"inp06"},{"sec":"inp","prompt":"Ученик прочитал число **до** цикла. Что выведет программа при вводе `4, 6, 1, 3, 5` (каждое на новой строке)?","options":["1","4","5","0"],"correct":[1],"explain":"Прочитано только одно число 6, и цикл 4 раза проверил одно и то же: результат 4. Чтение нужно перенести внутрь цикла.","code":"n = int(input())\na = int(input())\nkol = 0\nfor i in range(n):\n    if a % 2 == 0:\n        kol += 1\nprint(kol)","inp":"4\n6\n1\n3\n5","mono":1,"id":"inp07"},{"sec":"inp","prompt":"Ученик ввёл два числа в одной строке: `3 5`. Что сообщит Python на строке `a = int(input())`?","options":["Будет a = 3","Будет a = 8","ValueError: int() не может превратить «3 5» в число","Будет a = 35"],"correct":[2],"explain":"Сообщение: `ValueError: invalid literal for int() with base 10: '3 5'`. В ОГЭ каждое число вводится с новой строки.","memo":"value","id":"inp08"},{"sec":"inp","prompt":"Что будет, если ввести дробное число `2.5` в `a = int(input())`?","options":["a станет 2","a станет 2.5","ValueError — int() не понимает дробную запись","a станет 3"],"correct":[2],"explain":"Сообщение: `ValueError: invalid literal for int() with base 10: '2.5'`. В задачах №16 числа целые.","memo":"value","id":"inp09"},{"sec":"inp","prompt":"В строке забыли скобки у input. Что произойдёт?","options":["NameError: нет переменной input","SyntaxError: нет двоеточия","Программа прочитает число как обычно","TypeError: в int() передали саму функцию input, а не введённый текст"],"correct":[3],"explain":"Сообщение: `TypeError: int() argument must be a string, a bytes-like object or a real number, not 'builtin_function_or_method'`. Функцию нужно вызвать — с круглыми скобками: `input()`.","code":"a = int(input)","id":"inp10"},{"sec":"inp","prompt":"Найди ошибку. Что сообщит Python?","options":["Ошибки не будет","SyntaxError: expected ':'","NameError: name 'N' is not defined","IndentationError: unexpected indent"],"correct":[2],"explain":"Переменная создана как `n` (маленькая), а в range написано `N` (большая). Python различает регистр: `NameError: name 'N' is not defined. Did you mean: 'n'?`.","code":"n = int(input())\nfor i in range(N):\n    a = int(input())","memo":"name_typo","id":"inp11"},{"sec":"inp","prompt":"Сколько раз вызовется `input()` при вводе `4, 6, 0`?","options":["3","2","4","1"],"correct":[0],"explain":"Одно чтение до цикла (4) и по одному в конце каждого шага цикла (6, затем 0). Ноль останавливает цикл: всего 3 чтения.","code":"kol = 0\na = int(input())\nwhile a != 0:\n    kol += 1\n    a = int(input())\nprint(kol)","mono":1,"id":"inp12"},{"sec":"mod","prompt":"Чему равно значение выражения `157 % 10`?","options":["7","57","15","1"],"correct":[0],"explain":"`%` — остаток от деления. 157 = 15·10 + **7**, значит остаток 7. Остаток от деления на 10 — последняя цифра числа.","mono":1,"id":"mod01"},{"sec":"mod","prompt":"Чему равно значение выражения `157 // 10`?","options":["1","15.7","7","15"],"correct":[3],"explain":"`//` — целочисленное деление: дробная часть отбрасывается. 157 // 10 = 15 (число без последней цифры).","mono":1,"id":"mod02"},{"sec":"mod","prompt":"Чему равно значение выражения `157 // 100`?","options":["57","1","1.57","7"],"correct":[1],"explain":"157 // 100 = 1 — первая цифра трёхзначного числа.","mono":1,"id":"mod03"},{"sec":"mod","prompt":"Чему равно значение выражения `157 // 10 % 10`?","options":["7","5","15","1"],"correct":[1],"explain":"Сначала 157 // 10 = 15, затем 15 % 10 = 5 — средняя цифра (десятки).","mono":1,"id":"mod04"},{"sec":"mod","prompt":"Чему равно значение выражения `24 % 6`?","options":["4","1","0","6"],"correct":[2],"explain":"24 делится на 6 нацело, остаток 0. Поэтому проверка кратности: `a % 6 == 0`.","mono":1,"id":"mod05"},{"sec":"mod","prompt":"Чему равно значение выражения `23 % 2`?","options":["2","0","1","11"],"correct":[2],"explain":"Остаток от деления на 2 у нечётного числа равен 1, у чётного — 0.","mono":1,"id":"mod06"},{"sec":"mod","prompt":"Чему равно значение выражения `40 % 7`?","options":["5","0","7","4"],"correct":[0],"explain":"40 = 5·7 + 5. Остаток 5 — это и есть последняя цифра числа 40 в семеричной записи (40 = 55₇).","mono":1,"id":"mod07"},{"sec":"mod","prompt":"Чему равно значение выражения `7 / 2`?","options":["3.5","3.0","3","4"],"correct":[0],"explain":"Знак `/` — обычное деление, результат дробный: 3.5. Целую часть даёт `//`.","mono":1,"id":"mod08"},{"sec":"mod","prompt":"Чему равно значение выражения `7 // 2`?","options":["4","3.5","1","3"],"correct":[3],"explain":"`//` отбрасывает дробную часть: 7 // 2 = 3.","mono":1,"id":"mod09"},{"sec":"mod","prompt":"Чему равно значение выражения `10 / 2`?","options":["5.5","0","5","5.0"],"correct":[3],"explain":"Деление `/` в Python всегда даёт дробное число: 10 / 2 = **5.0**. Поэтому среднее печатается как 5.0, а не 5.","mono":1,"id":"mod10"},{"sec":"mod","prompt":"Чему равно значение выражения `-7 % 2`?","options":["0","3","-1","1"],"correct":[3],"explain":"В Python остаток от деления на положительное число всегда неотрицательный: −7 = (−4)·2 + 1, остаток 1. Поэтому проверка нечётности `a % 2 != 0` работает и для отрицательных.","mono":1,"id":"mod11"},{"sec":"mod","prompt":"Чему равно значение выражения `-16 % 4`?","options":["-4","0","4","1"],"correct":[1],"explain":"−16 делится на 4 нацело, остаток 0. Проверка `a % 4 == 0` подходит и для отрицательных чисел.","mono":1,"id":"mod12"},{"sec":"mod","prompt":"Какое выражение даёт **последнюю цифру** числа `a`?","options":["a // 10","a % 10","a / 10","a % 7"],"correct":[1],"explain":"Последняя (десятичная) цифра — остаток от деления на 10.","mono":1,"id":"mod13"},{"sec":"mod","prompt":"Какое выражение даёт **последнюю цифру записи числа a в системе счисления с основанием 7**?","options":["a % 10 % 7","a % 7","a // 7","a % 10"],"correct":[1],"explain":"В любой системе счисления последняя цифра — это остаток от деления на основание. Для основания 7: `a % 7`.","memo":"wrong_mod","mono":1,"id":"mod14"},{"sec":"mod","prompt":"Какое выражение даёт **первую цифру трёхзначного** числа `a`?","options":["a // 10","a // 100","a % 100","a % 10"],"correct":[1],"explain":"Деление на 100 нацело «отрезает» две последние цифры: 365 // 100 = 3.","mono":1,"id":"mod15"},{"sec":"mod","prompt":"Какое выражение даёт **цифру десятков двузначного** числа `a`?","options":["a // 100","a % 10","a / 10","a // 10"],"correct":[3],"explain":"У двузначного числа цифра десятков — результат целочисленного деления на 10: 72 // 10 = 7.","mono":1,"id":"mod16"},{"sec":"mod","prompt":"Как записывается в системе счисления с основанием 7 число 71? Определи последнюю цифру через остаток.","options":["2, потому что 71 // 7 = 10","1, потому что 71 % 7 = 1","7, потому что 71 оканчивается на 1","0, потому что 71 = 70 + 1"],"correct":[1],"explain":"71 = 10·7 + 1, остаток 1. Значит, семеричная запись 71 (это 131₇) оканчивается цифрой 1.","id":"mod17"},{"sec":"mod","prompt":"Что проверяет условие `a % 10 == 0`?","options":["число меньше 10","число оканчивается на 0 (кратно 10)","число однозначное","число равно 10"],"correct":[1],"explain":"Остаток от деления на 10 равен нулю, когда последняя цифра — 0.","id":"mod18"},{"sec":"mod","prompt":"Чем отличается проверка «**кратно 7**» от «**оканчивается на 7**»?","options":["это одно и то же: a % 7 == 0","кратно 7: a // 7 == 0","кратно 7: a % 10 == 7; оканчивается на 7: a % 7 == 0","кратно 7: a % 7 == 0; оканчивается на 7: a % 10 == 7"],"correct":[3],"explain":"Кратность — остаток от деления на 7 равен нулю (14, 21, 28…). Окончание на 7 — последняя цифра 7 (17, 27, 107…). Например, 14 кратно 7, но оканчивается на 4.","memo":"wrong_mod","id":"mod19"},{"sec":"cmp","prompt":"Как в Python проверить, что `a` **равно** 10?","options":["a := 10","a === 10","a == 10","a = 10"],"correct":[2],"explain":"Два знака `==` — сравнение. Один знак `=` — присваивание, внутри if он вызывает SyntaxError.","memo":"eq","mono":1,"id":"cmp01"},{"sec":"cmp","prompt":"Как записать условие «`a` **не равно** нулю»?","options":["a <> 0","a =! 0","not a = 0","a != 0"],"correct":[3],"explain":"Неравенство в Python: `!=`. Запись `=!` — синтаксическая ошибка, `<>` в Python 3 не работает.","mono":1,"id":"cmp02"},{"sec":"cmp","prompt":"Скорость **не выше 30** км/ч. Какое условие?","options":["a > 30","a < 30","a <= 30","a >= 30"],"correct":[2],"explain":"«Не выше 30» — значит 30 и меньше: `a <= 30`. Скорость ровно 30 подходит.","mono":1,"id":"cmp03"},{"sec":"cmp","prompt":"Скорость **меньше 30** км/ч. Какое условие?","options":["a < 29","a > 30","a < 30","a <= 30"],"correct":[2],"explain":"«Меньше» — строгое неравенство, 30 не подходит. Вариант `a < 29` отсечёт число 29.","mono":1,"id":"cmp04"},{"sec":"cmp","prompt":"Число **трёхзначное** (натуральное). Выбери условия.\n\n*Верных вариантов несколько — отметь все.*","options":["a > 99 and a < 1000","100 < a < 999","100 <= a <= 999","a >= 100 or a <= 999","a >= 100 and a <= 999"],"correct":[0,2,4],"explain":"Трёхзначные — от 100 до 999 включительно. Python разрешает двойное сравнение `100 <= a <= 999`; его можно записать и через `and`. С `or` подойдёт любое число, а строгие знаки потеряют 100 и 999.","mono":1,"id":"cmp05"},{"sec":"cmp","prompt":"Число **двузначное** (натуральное).\n\n*Верных вариантов несколько — отметь все.*","options":["10 <= a <= 99","a // 10 > 0","a < 100","a >= 10 and a < 100","10 < a < 99"],"correct":[0,3],"explain":"Двузначные — от 10 до 99. `a // 10 > 0` пропускает и трёхзначные, `a < 100` — однозначные.","mono":1,"id":"cmp06"},{"sec":"cmp","prompt":"Число **однозначное** (натуральное).\n\n*Верных вариантов несколько — отметь все.*","options":["0 < a < 9","a // 10 == 0","a < 10","1 <= a <= 9"],"correct":[1,2,3],"explain":"Для натуральных чисел все три первых записи равносильны: числа 1…9. В `0 < a < 9` пропадает 9.","mono":1,"id":"cmp07"},{"sec":"cmp","prompt":"Число **положительное**.","options":["a > 0","a != 0","a >= 0","a < 0"],"correct":[0],"explain":"Положительные — строго больше нуля. Ноль не положительный.","mono":1,"id":"cmp08"},{"sec":"cmp","prompt":"Число **отрицательное**.","options":["a <= 0","a > 0","a != 0","a < 0"],"correct":[3],"explain":"Отрицательные — строго меньше нуля.","mono":1,"id":"cmp09"},{"sec":"cmp","prompt":"В задаче: «если **не менее двух** автомобилей…». Какое условие для счётчика `kol2`?","options":["kol2 >= 2","kol2 == 2","kol2 < 2","kol2 > 2"],"correct":[0],"explain":"«Не менее двух» = «два или больше»: `kol2 >= 2`.","mono":1,"id":"cmp10"},{"sec":"cmp","prompt":"В задаче: «если **хотя бы один** участник…». Какое условие для счётчика `kol2`?","options":["kol2 == 1","kol2 >= 2","kol2 > 0","kol2 < 1"],"correct":[2],"explain":"«Хотя бы один» = «один или больше»: `kol2 > 0` (или `kol2 >= 1`).","mono":1,"id":"cmp11"},{"sec":"cmp","prompt":"Что выведет программа?","options":["True","False","5","Ошибка"],"correct":[0],"explain":"Сравнение даёт логическое значение. 3 < 5 < 9 истинно, печатается True.","code":"a = 5\nprint(3 < a < 9)","id":"cmp12"},{"sec":"cmp","prompt":"Ученик написал `if 10 <= a >= 99:` для двузначных. Что не так?","options":["нужно 10 < a < 99","нельзя писать два сравнения подряд","всё верно","второй знак должен быть <=: 10 <= a <= 99"],"correct":[3],"explain":"`10 <= a >= 99` означает «a ≥ 10 и a ≥ 99», то есть a ≥ 99. Нужно `10 <= a <= 99`.","id":"cmp13"},{"sec":"cmp","prompt":"Число оканчивается цифрой **5 в обычной десятичной записи**.","options":["a % 7 == 5","a % 5 == 5","a % 10 == 5","a // 10 == 5"],"correct":[2],"explain":"Последняя десятичная цифра — остаток от деления на 10. Проверка `a % 5 == 0` проверяет кратность 5, но не отличает числа, оканчивающиеся на 0 и на 5.","mono":1,"old":"if03","id":"cmp14"},{"sec":"cmp","prompt":"Число двузначное, причём цифра десятков больше цифры единиц.","options":["10 <= a <= 99 and a // 10 > a % 10","a % 10 > a // 10","10 <= a <= 99 and a % 10 > a // 10","a // 10 > a % 10"],"correct":[0],"explain":"У двузначного числа цифра десятков получается `a // 10`, а цифра единиц — `a % 10`. Нужны и ограничение двузначности, и сравнение цифр.","mono":1,"old":"if09","id":"cmp15"},{"sec":"cmp","prompt":"Число трёхзначное, первая цифра равна последней.","options":["100 <= a <= 999 and a // 100 == a % 10","a % 100 == a // 10","100 <= a <= 999 and a // 10 == a % 100","a // 100 == a % 10"],"correct":[0],"explain":"Первая цифра трёхзначного числа — `a // 100`, последняя — `a % 10`. Ограничение `100 <= a <= 999` обязательно.","mono":1,"old":"if10","id":"cmp16"},{"sec":"cmp","prompt":"Последняя цифра числа в системе счисления с основанием 7 равна 5.","options":["a % 10 == 5","a // 7 == 5","a % 5 == 0","a % 7 == 5"],"correct":[3],"explain":"В системе счисления с основанием 7 последняя цифра равна остатку при делении на 7. Здесь не нужно переводить число в строку.","mono":1,"old":"if16","id":"cmp17"},{"sec":"cmp","prompt":"Последняя цифра семеричной записи равна 1.","options":["a % 10 == 1","a // 7 == 1","a % 1 == 7","a % 7 == 1"],"correct":[3],"explain":"Последняя цифра записи по основанию 7 определяется остатком `a % 7`.","mono":1,"old":"if17","id":"cmp18"},{"sec":"cmp","prompt":"Число чётное.","options":["a % 2 != 0","a % 2 == 0","a % 2 == 1","a // 2 == 0"],"correct":[1],"explain":"Чётное число делится на 2 без остатка. Поэтому остаток должен быть равен нулю.","mono":1,"old":"if18","id":"cmp19"},{"sec":"cmp","prompt":"Число **не кратно 5**.","options":["a // 5 == 0","a % 10 == 5","a % 5 == 0","a % 5 != 0"],"correct":[3],"explain":"«Не кратно 5» означает, что остаток от деления на 5 не равен нулю: `!= 0`.","mono":1,"old":"if19","id":"cmp20"},{"sec":"log","prompt":"Какое слово соединяет два требования, которые должны выполняться **оба сразу**?","options":["else","or","and","not"],"correct":[2],"explain":"`and` — «и»: условие истинно, только если истинны обе части. `or` — «или»: достаточно одной.","mono":1,"id":"log01"},{"sec":"log","prompt":"Число должно делиться на 4 **или** на 9. Подходит ли число 36?","options":["нет — 36 не делится на 9","нет — оно делится сразу на оба","да — для or достаточно одного признака, а здесь выполнены оба","да, но только если написать and"],"correct":[2],"explain":"`or` истинно, когда выполнена хотя бы одна часть (или обе).","id":"log02"},{"sec":"log","prompt":"Число **чётное и кратно 5**.\n\n*Верных вариантов несколько — отметь все.*","options":["a % 10 == 5","a % 2 == 0 or a % 5 == 0","a % 2 == 0 and a % 5 == 0","a % 10 == 0"],"correct":[2,3],"explain":"Чётное и кратное 5 — значит кратное 10: оба первых варианта равносильны. С `or` подойдут, например, 4 и 15.","mono":1,"id":"log03"},{"sec":"log","prompt":"Число **нечётное и кратно 3**.\n\n*Верных вариантов несколько — отметь все.*","options":["a % 3 == 0 and a % 2 == 1","a % 3 == 0 and a % 2 != 0","a % 6 == 3","a % 6 == 0","a % 3 == 0 or a % 2 != 0"],"correct":[0,1,2],"explain":"Нечётное: `a % 2 != 0` (то же, что `a % 2 == 1`). Нечётные кратные 3 — это 3, 9, 15… — они дают остаток 3 при делении на 6.","mono":1,"id":"log04"},{"sec":"log","prompt":"Число делится на 3, **но не делится** на 9.\n\n*Верных вариантов несколько — отметь все.*","options":["a % 3 == 0 or a % 9 != 0","a % 3 == 0 and not a % 9 == 0","a % 3 == 0 and a % 9 != 0","a % 3 == 0 and a % 9 == 0"],"correct":[1,2],"explain":"«Но» в условии задачи — это тоже «и» (`and`). «Не делится на 9»: `a % 9 != 0` или `not a % 9 == 0`.","mono":1,"id":"log05"},{"sec":"log","prompt":"Число **не** кратно 5.\n\n*Верных вариантов несколько — отметь все.*","options":["a % 5 == 1","not a % 5 == 0","a % 5 != 0","a % 10 != 5"],"correct":[1,2],"explain":"`not` переворачивает условие. `a % 5 == 1` проверяет только остаток 1 — пропустит 7, 8, 9.","mono":1,"id":"log06"},{"sec":"log","prompt":"Ученик хотел: «чётное и больше 10». Что не так?","options":["после and нужно снова написать a: a % 2 == 0 and a > 10","всё правильно","нужно > 10 записать первым","нужно or вместо and"],"correct":[0],"explain":"Каждая часть условия — полное сравнение. `and > 10` Python не понимает: `SyntaxError: invalid syntax`.","code":"if a % 2 == 0 and > 10:","memo":"else","id":"log07"},{"sec":"log","prompt":"Ученик написал `if a % 4 or a % 9 == 0:` для «кратно 4 или 9». Что проверяет первая часть `a % 4`?","options":["это синтаксическая ошибка","что a больше 4","кратность 4 — всё верно","«остаток не равен нулю» — то есть НЕ кратно 4, ошибка"],"correct":[3],"explain":"Число без сравнения в условии считается истинным, если оно не 0. `a % 4` истинно для чисел, НЕ кратных 4. Каждую часть пиши полностью: `a % 4 == 0 or a % 9 == 0`.","id":"log08"},{"sec":"log","prompt":"Число **двузначное и оканчивается на 5**.","options":["a % 10 == 5","10 <= a <= 99 and a % 5 == 0","10 <= a <= 99 and a % 10 == 5","10 <= a <= 99 or a % 10 == 5"],"correct":[2],"explain":"Нужны оба требования одновременно. Кратность 5 пропустит и 20, 30… — у них последняя цифра 0.","mono":1,"id":"log09"},{"sec":"log","prompt":"Сколько чисел из `12, 15, 30, 9` удовлетворяют условию `a % 3 == 0 and a % 5 != 0`?","options":["2","3","4","1"],"correct":[0],"explain":"12 (кратно 3, не кратно 5) — да; 15 — кратно 5, нет; 30 — кратно 5, нет; 9 — да. Итого 2.","mono":1,"id":"log10"},{"sec":"log","prompt":"Число должно быть **кратно 5** и в записи по основанию 7 **оканчиваться цифрой 5**. Что поставить вместо `УСЛОВИЕ`?","options":["a % 5 == 5 and a % 7 == 0","a % 5 == 0 and a % 7 == 5","a % 5 == 0 or a % 7 == 5","a % 10 == 5 and a % 7 == 5"],"correct":[1],"explain":"Кратность 5 проверяется остатком `a % 5 == 0`. Последняя цифра записи по основанию 7 равна остатку `a % 7`, поэтому нужно `a % 7 == 5`. Оба требования соединяются через `and`.","mono":1,"old":"if01","id":"log11"},{"sec":"log","prompt":"Число должно оканчиваться **нечётной цифрой в системе счисления с основанием 7**. Выберите все подходящие условия.","options":["a % 7 in (1, 3, 5)","a % 7 in (0, 2, 4, 6)","a % 10 % 2 != 0","a % 7 % 2 != 0"],"correct":[0,3],"explain":"Остаток от деления на 7 — последняя цифра семеричной записи. Нечётные цифры в системе с основанием 7: 1, 3 и 5. Поэтому подходят оба первых варианта.","mono":1,"old":"if02","id":"log12"},{"sec":"log","prompt":"Число кратно 6 и оканчивается цифрой 4 в десятичной записи.","options":["a % 10 == 4","a % 6 == 0 or a % 10 == 4","a % 6 == 0 and a % 10 == 4","a % 6 == 4 and a % 10 == 0"],"correct":[2],"explain":"В задаче должны одновременно выполняться два требования: делимость на 6 и последняя десятичная цифра 4. Нужен `and`.","mono":1,"old":"if04","id":"log13"},{"sec":"log","prompt":"Число кратно 7 и оканчивается цифрой 2 в десятичной записи.","options":["a % 7 == 2 and a % 10 == 0","a // 10 == 2","a % 7 == 0 or a % 10 == 2","a % 7 == 0 and a % 10 == 2"],"correct":[3],"explain":"Кратность 7: `a % 7 == 0`. Последняя десятичная цифра 2: `a % 10 == 2`. Оба условия обязательны.","mono":1,"old":"if05","id":"log14"},{"sec":"log","prompt":"Число делится на 3, **но не делится на 9**.","options":["a % 3 == 0 or a % 9 != 0","a % 3 == 0 and a % 9 != 0","a % 9 == 0","a % 3 != 0 and a % 9 == 0"],"correct":[1],"explain":"«Делится на 3» — остаток 0 при делении на 3. «Не делится на 9» — остаток не равен 0 при делении на 9. Слово «но» означает одновременное выполнение требований: `and`.","mono":1,"old":"if06","id":"log15"},{"sec":"log","prompt":"Число должно быть **трёхзначным и кратным 4**.","options":["100 <= a <= 999 and a % 4 == 0","a < 1000 and a % 4 == 0","100 <= a <= 999 or a % 4 == 0","100 < a < 999 and a % 4 == 0"],"correct":[0],"explain":"Трёхзначные натуральные числа включают 100 и 999, поэтому границы записываются как `100 <= a <= 999`. Дополнительно требуется делимость на 4.","mono":1,"old":"if07","id":"log16"},{"sec":"log","prompt":"Число должно быть **однозначным натуральным и кратным 3**.","options":["a < 10 or a % 3 == 0","1 <= a <= 9 and a % 3 == 0","a % 3 == 0","0 <= a <= 9 and a % 3 == 0"],"correct":[1],"explain":"Однозначное натуральное число находится от 1 до 9 включительно. Условие делимости на 3 добавляется через `and`.","mono":1,"old":"if08","id":"log17"},{"sec":"log","prompt":"Число должно делиться на 4 **или** на 9 (достаточно хотя бы одного признака).","options":["a % 4 != 0 or a % 9 != 0","a % 4 == 9","a % 4 == 0 or a % 9 == 0","a % 4 == 0 and a % 9 == 0"],"correct":[2],"explain":"Слово «или» соответствует `or`: достаточно, чтобы хотя бы одно из двух условий было истинным.","mono":1,"old":"if13","id":"log18"},{"sec":"log","prompt":"Число кратно 3 и его последняя десятичная цифра — 0.","options":["a % 3 == 0 and a % 10 == 0","a % 3 == 0 or a % 10 == 0","a % 10 == 3 and a % 3 == 0","a % 3 == 3 and a % 10 == 0"],"correct":[0],"explain":"Кратность 3 и последняя цифра 0 — два независимых обязательных условия. Их соединяют через `and`.","mono":1,"old":"if20","id":"log19"},{"sec":"log","prompt":"Выберите все корректные варианты проверки: число `a` делится на 7 без остатка.","options":["a % 7 == 0","a % 7 in (0,)","a // 7 == 0","a % 7 != 0"],"correct":[0,1],"explain":"Остаток равен нулю — самый привычный вариант. Проверка `a % 7 in (0,)` логически равносильна ему: остаток принадлежит набору, в котором только 0.","mono":1,"old":"if21","id":"log20"},{"sec":"log","prompt":"В записи числа по основанию 7 последняя цифра **нечётная**. Выберите все корректные варианты.","options":["a % 10 in (1, 3, 5)","a % 7 in (1, 3, 5)","a % 7 % 2 == 0","a % 7 % 2 == 1"],"correct":[1,3],"explain":"Остаток `a % 7` может быть от 0 до 6. Нечётные остатки — 1, 3 и 5; можно проверить их перечислением или чётностью остатка.","mono":1,"old":"if22","id":"log21"},{"sec":"acc","prompt":"Какое начальное значение у **счётчика** `kol`?","options":["kol = 0","kol = 1","kol = a","kol = -10**10"],"correct":[0],"explain":"Пока ни одного подходящего числа не найдено, количество равно нулю.","mono":1,"id":"acc01"},{"sec":"acc","prompt":"Какое начальное значение у **произведения** `pr`?","options":["pr = 1","pr = -1","pr = 10**10","pr = 0"],"correct":[0],"explain":"Единица не меняет произведение: 1·a = a. Если начать с нуля, всё произведение будет 0.","memo":"start_val","mono":1,"id":"acc02"},{"sec":"acc","prompt":"Что означает запись `s += a`?","options":["s = s + a — прибавить a к сумме","сравнить s и a","s = s + 1","s = a — запомнить число"],"correct":[0],"explain":"`+=` — сокращённая запись: к старому значению прибавляется новое.","id":"acc03"},{"sec":"acc","prompt":"Чем отличается `kol += 1` от `s += a`?","options":["kol складывает числа, s считает их","kol считает, СКОЛЬКО чисел подошло; s складывает САМИ числа","kol += 1 работает только в while","ничем"],"correct":[1],"explain":"Счётчик каждый раз увеличивается на 1, сумматор — на величину числа.","id":"acc04"},{"sec":"acc","prompt":"Что выведет программа при вводе `3, 2, 9, 10`?","options":["1","18","180","0"],"correct":[3],"explain":"Подходят 2 и 9 (остаток 2 при делении на 7), но начальное `pr = 0`, а 0·2·9 = 0. Нужно `pr = 1`, тогда ответ 18.","code":"n = int(input())\npr = 0\nfor i in range(n):\n    a = int(input())\n    if a % 7 == 2:\n        pr *= a\nprint(pr)","inp":"3\n2\n9\n10","memo":"start_val","mono":1,"id":"acc05"},{"sec":"acc","prompt":"Опечатка: `=+` вместо `+=`. Что выведет программа при вводе `4, 8, 12, 5, 16`?","options":["0","4","3","1"],"correct":[3],"explain":"`kol =+ 1` — это `kol = +1`: в kol просто кладётся 1. Подошло три числа, но ответ всегда 1.","code":"n = int(input())\nkol = 0\nfor i in range(n):\n    a = int(input())\n    if a % 4 == 0:\n        kol =+ 1\nprint(kol)","inp":"4\n8\n12\n5\n16","memo":"plus_eq","mono":1,"id":"acc06"},{"sec":"acc","prompt":"`kol = 0` попал внутрь цикла. Что выведет программа при вводе `3, 2, 4, 7`?","options":["2","0","1","3"],"correct":[1],"explain":"На каждом шаге счётчик обнуляется. Последнее число 7 нечётное, поэтому kol = 0. Начальное значение задают до цикла.","code":"n = int(input())\nfor i in range(n):\n    kol = 0\n    a = int(input())\n    if a % 2 == 0:\n        kol += 1\nprint(kol)","inp":"3\n2\n4\n7","memo":"init_in_loop","mono":1,"id":"acc07"},{"sec":"acc","prompt":"Где должна стоять строка `kol += 1`, чтобы считались только числа, кратные 4?","options":["на одном уровне с if (4 пробела)","с отступом под if (8 пробелов)","перед if","без отступа после цикла"],"correct":[1],"explain":"Действие выполняется только для подходящих чисел, когда оно вложено в if — сдвинуто глубже, чем сам if. На уровне if оно выполнится для всех чисел.","code":"for i in range(n):\n    a = int(input())\n    if a % 4 == 0:\n        kol += 1","memo":"outside_if","id":"acc08"},{"sec":"acc","prompt":"`kol += 1` стоит на уровне if. Что выведет программа при вводе `4, 8, 3, 5, 16`?","options":["0","2","1","4"],"correct":[3],"explain":"Строка не вложена в if, поэтому счётчик увеличивается для каждого числа: 4. Правильный ответ (кратных 4) был бы 2.","code":"n = int(input())\nkol = 0\ns = 0\nfor i in range(n):\n    a = int(input())\n    if a % 4 == 0:\n        s += a\n    kol += 1\nprint(kol)","inp":"4\n8\n3\n5\n16","memo":"outside_if","mono":1,"id":"acc09"},{"sec":"acc","prompt":"Вместо `s += a` написали `s = a`. Что выведет программа при вводе `3, 12, 25, 6`?","options":["6","43","18","0"],"correct":[0],"explain":"`s = a` не складывает, а заменяет: в s остаётся последнее подходящее число (6). Нужно `s += a` → 18.","code":"n = int(input())\ns = 0\nfor i in range(n):\n    a = int(input())\n    if a % 6 == 0:\n        s = a\nprint(s)","inp":"3\n12\n25\n6","mono":1,"id":"acc10"},{"sec":"acc","prompt":"Для **среднего арифметического** подходящих чисел нужны переменные…","options":["только сумма s","только kol","maxi и mini","сумма s и количество kol"],"correct":[3],"explain":"Среднее = сумма / количество. Обе величины накапливаем в цикле.","id":"acc11"},{"sec":"acc","prompt":"В задаче «найти **длину последовательности**» (ввод до 0). Где стоит `dlina += 1`?","options":["под if","после цикла","в цикле, но НЕ под if — считаются все числа","перед циклом"],"correct":[2],"explain":"Длина — количество всех введённых чисел (кроме завершающего 0), проверка не нужна.","id":"acc12"},{"sec":"mm","prompt":"Какое начальное значение берут для **максимума** `maxi`?","options":["maxi = 10**10","maxi = 1","maxi = 0","maxi = -10**10 (очень маленькое число)"],"correct":[3],"explain":"Первое же подходящее число должно оказаться больше начального значения. Очень маленькое число гарантирует это даже для отрицательных данных.","memo":"start_val","id":"mm01"},{"sec":"mm","prompt":"Какое начальное значение берут для **минимума** `mini`?","options":["mini = 0","mini = 10**10 (очень большое число)","mini = -10**10","mini = 1"],"correct":[1],"explain":"Любое число из данных меньше 10**10, поэтому первое подходящее сразу станет минимумом. С mini = 0 минимум натуральных чисел так и останется 0.","memo":"start_val","id":"mm02"},{"sec":"mm","prompt":"Какие строки правильно обновляют максимум? Отметь все.","options":["maxi = min(maxi, a)","if a < maxi:\n    maxi = a","maxi = max(maxi, a)","maxi += a","if a > maxi:\n    maxi = a"],"correct":[2,4],"explain":"Функция `max` возвращает большее из двух чисел. То же делает проверка «если новое больше — запомни его».","mono":1,"id":"mm03"},{"sec":"mm","prompt":"Какие строки правильно обновляют минимум? Отметь все.","options":["if a < mini:\n    mini = a","if a > mini:\n    mini = a","mini = max(mini, a)","mini = min(mini, a)"],"correct":[0,3],"explain":"`min` возвращает меньшее; «если новое меньше — запомни».","mono":1,"id":"mm04"},{"sec":"mm","prompt":"Начальное значение `maxi = 0`. Что выведет программа при вводе `3, -5, -2, -8`?","options":["0","-2","-8","-5"],"correct":[0],"explain":"Все числа отрицательные и меньше 0, поэтому maxi так и остаётся 0 — такого числа даже нет во вводе! Нужно `maxi = -10**10`, тогда ответ −2.","code":"n = int(input())\nmaxi = 0\nfor i in range(n):\n    a = int(input())\n    maxi = max(maxi, a)\nprint(maxi)","inp":"3\n-5\n-2\n-8","memo":"start_val","mono":1,"id":"mm05"},{"sec":"mm","prompt":"Начальное значение `mini = 0`. Что выведет программа при вводе `4, 3, 20, 6, 8` (ищем минимальное чётное)?","options":["20","6","0","3"],"correct":[2],"explain":"Натуральные числа больше 0, поэтому минимум «застрял» на нуле. Нужно `mini = 10**10`, тогда ответ 6.","code":"n = int(input())\nmini = 0\nfor i in range(n):\n    a = int(input())\n    if a % 2 == 0:\n        mini = min(mini, a)\nprint(mini)","inp":"4\n3\n20\n6\n8","memo":"start_val","mono":1,"id":"mm06"},{"sec":"mm","prompt":"Ученик записал степень через `^`. Будет ли ошибка и что выведет программа?","options":["Ошибка","-100","-4","-10000000000"],"correct":[2],"explain":"Ошибки не будет: в Python `^` — побитовое исключающее ИЛИ (XOR), а не возведение в степень. Поэтому `-10 ^ 10` даст `-4`. Для степени используют две звёздочки: `-10**10`.","code":"maxi = -10^10\nprint(maxi)","memo":"start_val","id":"mm07","hint":"Символ `^` в Python — XOR, программа выполнится без ошибки. Возведение в степень записывают как `**`."},{"sec":"mm","prompt":"Что выведет программа, если среди чисел `12, 7, 4` нет кратных 5 (N = 3)?","options":["NO","0","12","-10000000000"],"correct":[3],"explain":"maxi ни разу не обновился и остался равен начальному −10**10. Поэтому в задачах, где подходящих чисел может не быть, перед выводом проверяют это отдельно.","code":"n = int(input())\nmaxi = -10**10\nfor i in range(n):\n    a = int(input())\n    if a % 5 == 0:\n        maxi = max(maxi, a)\nprint(maxi)","inp":"3\n12\n7\n4","mono":1,"id":"mm08"},{"sec":"mm","prompt":"Как в конце узнать, что **не нашлось ни одного** подходящего числа для минимума?","options":["if mini == 0:","if mini == 10**10: — значение не изменилось","if kol == 10**10:","if mini < 0:"],"correct":[1],"explain":"Если минимум остался равен начальному 10**10, ни одно число его не обновило: выводим NO. Удобно писать и наоборот: `if mini < 10**10: print(mini) else: print('NO')`.","id":"mm09"},{"sec":"mm","prompt":"Переменную назвали `max`. Что произойдёт?","options":["SyntaxError","NameError: name 'max' is not defined","TypeError: 'int' object is not callable","всё сработает"],"correct":[2],"explain":"После `max = -10**10` имя max обозначает число, а не функцию. Вызвать число нельзя: `TypeError: 'int' object is not callable`. Называй переменные maxi и mini.","code":"max = -10**10\na = int(input())\nmax = max(max, a)","memo":"call","id":"mm10"},{"sec":"mm","prompt":"Что выведет программа при вводе `4, 74, 69, 63, 96`?","options":["96","159","63","33"],"correct":[3],"explain":"Максимум 96, минимум 63, разность 33.","code":"n = int(input())\nmaxi = -10**10\nmini = 10**10\nfor i in range(n):\n    a = int(input())\n    maxi = max(maxi, a)\n    mini = min(mini, a)\nprint(maxi - mini)","inp":"4\n74\n69\n63\n96","mono":1,"id":"mm11"},{"sec":"for","prompt":"Сколько раз выполнится тело цикла `for i in range(5):`?","options":["4","6","0","5"],"correct":[3],"explain":"`range(5)` даёт числа 0, 1, 2, 3, 4 — пять повторений.","mono":1,"id":"for01"},{"sec":"for","prompt":"Сколько раз выполнится тело цикла `for i in range(10, 20):`?","options":["11","20","10","9"],"correct":[2],"explain":"От 10 до 19 включительно — правая граница НЕ входит: 20 − 10 = 10 повторений.","mono":1,"id":"for02"},{"sec":"for","prompt":"Сколько раз выполнится тело цикла `for i in range(10, 21):`?","options":["12","20","11","10"],"correct":[2],"explain":"От 10 до 20 включительно: 21 − 10 = 11 повторений.","mono":1,"id":"for03"},{"sec":"for","prompt":"Сколько раз выполнится тело цикла `for i in range(1, 5):`?","options":["3","4","1","5"],"correct":[1],"explain":"Числа 1, 2, 3, 4 — четыре повторения.","mono":1,"id":"for04"},{"sec":"for","prompt":"Как перебрать **все числа отрезка [a; b]**, включая оба конца?","options":["for x in range(a + 1, b):","for x in range(a, b):","for x in range(a, b + 1):","for x in range(b):"],"correct":[2],"explain":"Правая граница range не включается, поэтому пишут b + 1.","memo":"range_b","mono":1,"id":"for05"},{"sec":"for","prompt":"Ученик забыл `+ 1`. Что выведет программа при вводе `10, 20` (нужно количество чётных на [10; 20])?","options":["11","5","6","10"],"correct":[1],"explain":"Число 20 не проверилось, и ответ получился 5 вместо 6.","code":"a = int(input())\nb = int(input())\nkol = 0\nfor x in range(a, b):\n    if x % 2 == 0:\n        kol += 1\nprint(kol)","inp":"10\n20","memo":"range_b","mono":1,"id":"for06"},{"sec":"for","prompt":"Сколько чисел на отрезке [a; b]?","options":["b - a","b - a + 1","b + a","b - a - 1"],"correct":[1],"explain":"Например, на [3; 5] три числа: 5 − 3 + 1 = 3.","mono":1,"id":"for07"},{"sec":"for","prompt":"`print` оказался внутри цикла. Что выведет программа при вводе `3, 13, 23, 24`?","options":["1\n2\n2","2","0\n1\n2","1\n2"],"correct":[0],"explain":"print с отступом выполняется на каждом шаге цикла — печатаются промежуточные значения 1, 2, 2. Итоговый print пишут без отступа.","code":"n = int(input())\nkol = 0\nfor i in range(n):\n    a = int(input())\n    if a % 10 == 3:\n        kol += 1\n    print(kol)","inp":"3\n13\n23\n24","memo":"print_in_loop","mono":1,"id":"for08"},{"sec":"for","prompt":"Что сообщит Python?","options":["Ошибки нет","SyntaxError: expected ':'","IndentationError: unexpected indent","NameError: name 'i' is not defined"],"correct":[1],"explain":"Строка с for заканчивается двоеточием. Сообщение: `SyntaxError: expected ':'` (строка 3).","code":"n = int(input())\nkol = 0\nfor i in range(n)\n    a = int(input())\nprint(kol)","memo":"colon","id":"for09"},{"sec":"for","prompt":"Что сообщит Python?","options":["SyntaxError: expected ':'","Ошибки нет","IndentationError: expected an indented block after 'for' statement on line 3","IndentationError: unexpected indent"],"correct":[2],"explain":"После двоеточия строки тела цикла должны быть сдвинуты вправо. Здесь чтение числа стоит без отступа.","code":"n = int(input())\nkol = 0\nfor i in range(n):\na = int(input())\nprint(kol)","memo":"indent_block","id":"for10"},{"sec":"for","prompt":"Что сообщит Python?","options":["TypeError: 'str' object cannot be interpreted as an integer","ValueError: invalid literal for int()","Ошибки нет","NameError: name 'n' is not defined"],"correct":[0],"explain":"n прочитано без int(), это строка '3'. range() требует целое число.","code":"n = input()\nfor i in range(n):\n    a = int(input())","memo":"type_str","id":"for11"},{"sec":"for","prompt":"Что выведет программа при вводе `1, 10`?","options":["18","3","15","27"],"correct":[0],"explain":"Кратные 3 на [1; 10]: 3 + 6 + 9 = 18.","code":"a = int(input())\nb = int(input())\ns = 0\nfor a in range(a, b + 1):\n    if a % 3 == 0:\n        s += a\nprint(s)","inp":"1\n10","mono":1,"id":"for13"},{"sec":"whl","prompt":"Почему перед `while a != 0:` уже стоит `a = int(input())`?","options":["это необязательно","так быстрее","чтобы пропустить первое число","условие цикла проверяет a, значит a должна быть известна заранее"],"correct":[3],"explain":"В момент первой проверки `a != 0` переменная должна существовать — иначе NameError.","id":"whl01"},{"sec":"whl","prompt":"Ученик убрал чтение перед циклом. Что сообщит Python?","options":["SyntaxError: expected ':'","IndentationError","NameError: name 'a' is not defined","Программа выведет 1"],"correct":[2],"explain":"В первой строке while проверяется a, которой ещё нет.","code":"kol = 0\nwhile a != 0:\n    a = int(input())\n    kol += 1\nprint(kol)","memo":"name_init","id":"whl02"},{"sec":"whl","prompt":"Где в теле while стоит строка, читающая **следующее** число?","options":["после цикла","первой строкой тела цикла","последней строкой тела цикла, с отступом как у if","внутри if"],"correct":[2],"explain":"Сначала обрабатываем текущее число, потом читаем следующее и возвращаемся к проверке `a != 0`.","id":"whl03"},{"sec":"whl","prompt":"В цикле забыли читать следующее число. Что произойдёт при вводе `4, 6, 0`?","options":["выведет 1","программа «зависнет»: a всегда 4, цикл бесконечный","EOFError","выведет 2"],"correct":[1],"explain":"a не меняется, условие `a != 0` всегда истинно — бесконечный цикл. Сообщения об ошибке не будет, программа просто не закончится.","code":"kol = 0\na = int(input())\nwhile a != 0:\n    if a % 2 == 0:\n        kol += 1\nprint(kol)","memo":"loop","id":"whl04"},{"sec":"whl","prompt":"Чтение следующего числа написали **без отступа**. Что произойдёт?","options":["IndentationError","всё работает правильно","бесконечный цикл: строка оказалась после цикла","выведется 0"],"correct":[2],"explain":"Без отступа строка не входит в тело while и выполнится только после цикла, которого не будет конца.","code":"kol = 0\na = int(input())\nwhile a != 0:\n    if a % 2 == 0:\n        kol += 1\na = int(input())\nprint(kol)","memo":"loop","id":"whl05"},{"sec":"whl","prompt":"Что выведет программа при вводе `4, 60, 15, 0`?","options":["4","3","79","2"],"correct":[1],"explain":"Ноль — стоп-сигнал, он не входит в последовательность: длина 3.","code":"dlina = 0\na = int(input())\nwhile a != 0:\n    dlina += 1\n    a = int(input())\nprint(dlina)","inp":"4\n60\n15\n0","mono":1,"id":"whl06"},{"sec":"whl","prompt":"Ученик написал `while a > 0`, а числа бывают отрицательными. Что выведет программа при вводе `36, -16, 93, 90, 0`?","options":["146","-16","36","110"],"correct":[2],"explain":"Цикл остановился на −16, будто это конец ввода. Правильно `while a != 0` — тогда сумма 36 − 16 + 90 = 110.","code":"s = 0\na = int(input())\nwhile a > 0:\n    if a % 4 == 0 or a % 9 == 0:\n        s += a\n    a = int(input())\nprint(s)","inp":"36\n-16\n93\n90\n0","mono":1,"id":"whl07"},{"sec":"whl","prompt":"Во входных данных забыли завершающий 0: `5, 7`. Что сообщит Python?","options":["EOFError: EOF when reading a line","NameError: name 'a' is not defined","бесконечный цикл","выведет 2"],"correct":[0],"explain":"Программа хочет прочитать следующее число, а данные кончились.","code":"kol = 0\na = int(input())\nwhile a != 0:\n    kol += 1\n    a = int(input())\nprint(kol)","memo":"eof","id":"whl08"},{"sec":"whl","prompt":"Чтение следующего числа поставили **в начало** тела цикла. Что выведет программа при вводе `4, 6, 5, 0` (кратные 3)?","options":["1","0","2","3"],"correct":[2],"explain":"Первое число 4 «перезаписалось» до проверки, зато завершающий 0 проверился (0 % 3 == 0) и посчитался: вышло 2 вместо 1. Чтение следующего числа — в КОНЦЕ тела.","code":"kol = 0\na = int(input())\nwhile a != 0:\n    a = int(input())\n    if a % 3 == 0:\n        kol += 1\nprint(kol)","inp":"4\n6\n5\n0","mono":1,"id":"whl09"},{"sec":"whl","prompt":"Какие варианты правильно читают числа до нуля? Отметь все.","options":["while True:\n    a = int(input())\n    if a == 0:\n        break\n    ...","a = int(input())\nwhile a == 0:\n    ...\n    a = int(input())","while a != 0:\n    a = int(input())\n    ...","a = int(input())\nwhile a != 0:\n    ...\n    a = int(input())"],"correct":[0,3],"explain":"Второй вариант — «бесконечный» цикл с выходом по break, когда пришёл 0. Третий вызывает NameError, четвёртый вообще не войдёт в цикл.","mono":1,"id":"whl10"},{"sec":"out","prompt":"Что выведет `print('kol')`, если kol = 5?","options":["'kol'","kol","Ошибка","5"],"correct":[1],"explain":"В кавычках — текст, он печатается как есть. Чтобы вывести значение, пиши без кавычек: `print(kol)`.","id":"out01"},{"sec":"out","prompt":"Что выведет `print(dlina, kol)`, если dlina = 3, kol = 1?","options":["3\n1","3 1","31","3,1"],"correct":[1],"explain":"Несколько значений через запятую печатаются в одну строку через пробел.","mono":1,"id":"out02"},{"sec":"out","prompt":"Что выведет `print(s / kol)`, если s = 16, kol = 2?","options":["8.0","8.00","8","16/2"],"correct":[0],"explain":"Деление `/` всегда даёт дробное число, поэтому 8.0.","mono":1,"id":"out03"},{"sec":"out","prompt":"Что выведет `print(round(4.56, 1))`?","options":["4.5","4.56","5","4.6"],"correct":[3],"explain":"`round(x, 1)` округляет до одного знака после точки: 4.56 → 4.6.","mono":1,"id":"out04"},{"sec":"out","prompt":"Что выведет `print(round(16.0, 1))`?","options":["16.1","16.00","16","16.0"],"correct":[3],"explain":"Округление дробного числа до 1 знака оставляет дробную запись: 16.0.","mono":1,"id":"out05"},{"sec":"out","prompt":"Что сообщит Python на строке `print kol`?","options":["SyntaxError: Missing parentheses in call to 'print'…","выведет 5","выведет kol","NameError: name 'print' is not defined"],"correct":[0],"explain":"В Python 3 print — функция: `print(kol)`. Сообщение: `SyntaxError: Missing parentheses in call to 'print'. Did you mean print(...)?`.","memo":"print_paren","id":"out06"},{"sec":"out","prompt":"По условию нужно вывести число без пояснений. Ученик написал `print('Ответ:', kol)`. Засчитает ли автопроверка?","options":["только в while-задачах","да, число же есть","нет — вывод должен совпадать посимвольно: только число","да, если kol верный"],"correct":[2],"explain":"Проверяющая программа сравнивает вывод целиком. Лишний текст = неверный ответ.","memo":"format","id":"out07"},{"sec":"out","prompt":"Нужно вывести **количество** подходящих чисел. Счётчик хранится в переменной `kol`. Какой вывод подходит?","options":["print(kol + 1)","print(\"kol\")","print(kol)","print(s)"],"correct":[2],"explain":"В `print()` передают имя переменной без кавычек. `print(kol)` выводит её текущее значение. Вариант с кавычками выведет сам текст `kol`.","mono":1,"old":"pr01","id":"out08"},{"sec":"out","prompt":"Нужно вывести **сумму** отобранных чисел. Сумма хранится в `s`.","options":["print(\"s\")","print(s)","print(kol)","print(s / kol)"],"correct":[1],"explain":"Если требуется именно сумма, выводим накопитель `s`. `s / kol` — это уже среднее значение, а не сумма.","mono":1,"old":"pr02","id":"out09"},{"sec":"out","prompt":"Нужно вывести найденный **максимум**. Он хранится в переменной `maxi`.","options":["print(mini)","print(maxi)","print(maxi - mini)","print(\"maxi\")"],"correct":[1],"explain":"Максимум хранится в `maxi`, поэтому выводится `print(maxi)`. `print(\"maxi\")` печатает текст, а не значение переменной.","mono":1,"old":"pr03","id":"out10"},{"sec":"out","prompt":"Нужно вывести `kol` и `s` **в одной строке через один пробел**. Выберите все правильные варианты.","options":["print(str(kol) + \" \" + str(s))","print(kol, s)","print(kol)\nprint(s)","print(kol, s, sep=\" \")"],"correct":[0,1,3],"explain":"В `print(kol, s)` пробел между аргументами ставится автоматически. Его можно явно задать через `sep=\" \"`, либо склеить строковые представления.","mono":1,"old":"pr05","id":"out12"},{"sec":"out","prompt":"Если подходящих чисел нет (`kol == 0`), нужно вывести `NO`; иначе — среднее `s / kol`. Какой фрагмент вывода верен?","options":["if kol > 0:\n    print('NO')\nelse:\n    print(s / kol)","if kol == 0:\n    print(s / kol)\nelse:\n    print('NO')","print(s / kol)\nif kol == 0:\n    print('NO')","if kol > 0:\n    print(s / kol)\nelse:\n    print('NO')"],"correct":[3],"explain":"Сначала проверяем, что количество положительное, и только тогда делим. Иначе выводим строку `NO`. Так не возникает деления на ноль.","mono":1,"old":"pr08","id":"out15"},{"sec":"out","prompt":"Нужно вывести слово YES, если `kol2` больше нуля, иначе NO. Какой вариант правильный?","options":["print(kol2 > 0)","if kol2 > 0:\n    print(YES)\nelse:\n    print(NO)","if kol2 == 0:\n    print('YES')\nelse:\n    print('NO')","if kol2 > 0:\n    print('YES')\nelse:\n    print('NO')"],"correct":[3],"explain":"По условию надо вывести именно слова YES и NO, поэтому они берутся в кавычки. Проверка `kol2 > 0` означает, что найден хотя бы один подходящий элемент.","mono":1,"old":"pr09","id":"out16"},{"sec":"out","prompt":"Требуется вывести сначала `maxi`, затем `mini`, каждое значение на новой строке.","options":["print(maxi, mini)","print(maxi - mini)","print(mini)\nprint(maxi)","print(maxi)\nprint(mini)"],"correct":[3],"explain":"Две отдельные команды `print()` дают два результата на отдельных строках и сохраняют нужный порядок: сначала максимум, затем минимум.","mono":1,"old":"pr10","id":"out17"},{"sec":"out","prompt":"По условию нужно вывести **только сумму** `s`, без поясняющего текста.","options":["print(\"s\")","print(s)","print(s, \"руб.\")","print(\"Сумма:\", s)"],"correct":[1],"explain":"Если проверяющая система ждёт только число, нельзя добавлять подписи и лишние слова. Подходит только `print(s)`.","mono":1,"old":"pr11","id":"out18"},{"sec":"out","prompt":"Нужно вывести число `a`, затем пробел, затем текст `YES`.","options":["print(a, \"YES\")","print(a)\nprint(\"YES\")","print(a, YES)","print(\"a YES\")"],"correct":[0],"explain":"`print(a, \"YES\")` выводит значение `a`, затем пробел (разделитель по умолчанию) и текст YES. Строку нужно заключать в кавычки.","mono":1,"old":"pr12","id":"out19"},{"sec":"out","prompt":"Нужно вывести значения `x` и `y` **без пробела между ними**, например `23` для `x = 2`, `y = 3`.","options":["print(x)\nprint(y)","print(x + y)","print(x, y)","print(x, y, sep=\"\")"],"correct":[3],"explain":"Параметр `sep=\"\"` задаёт пустой разделитель между аргументами. Обычный `print(x, y)` автоматически вставляет пробел.","mono":1,"old":"pr13","id":"out20"},{"sec":"out","prompt":"Нужно вывести все значения `a`, `b`, `c` в одной строке, разделив их точкой с запятой и пробелом.","options":["print(a, b, c, sep=\"; \")","print(a, b, c)","print(a + b + c)","print(a); print(b); print(c)"],"correct":[0],"explain":"Параметр `sep` задаёт разделитель между всеми аргументами одной команды `print()`. Для `; ` используйте `sep=\"; \"`.","mono":1,"old":"pr14","id":"out21"},{"sec":"out","prompt":"Требуется вывести два результата: сначала количество `kol`, потом сумму `s`, **через пробел**, но одной командой `print`.","options":["print(kol, s)","print(kol)\nprint(s)","print(kol + s)","print(s, kol)"],"correct":[0],"explain":"Одна команда `print(kol, s)` выводит оба значения в заданном порядке через пробел.","mono":1,"old":"pr16","id":"out23"},{"sec":"ans","prompt":"Зачем перед `print(s / kol)` проверяют `if kol > 0:`?","options":["если подходящих чисел нет, kol = 0, и деление вызовет ZeroDivisionError","чтобы не печатать отрицательные числа","чтобы ответ был целым","это требование синтаксиса"],"correct":[0],"explain":"На ноль делить нельзя. Если подходящих чисел нет, по условию выводят NO.","memo":"zero","id":"ans01"},{"sec":"ans","prompt":"Что выведет программа при вводе `5, 7, 0`?","options":["NO","29.33","29.3","0"],"correct":[0],"explain":"Кратных 8 нет, kol = 0, срабатывает ветка else: NO.","code":"s = 0\nkol = 0\na = int(input())\nwhile a != 0:\n    if a % 8 == 0:\n        s += a\n        kol += 1\n    a = int(input())\nif kol > 0:\n    print(round(s / kol, 1))\nelse:\n    print('NO')","inp":"5\n7\n0","mono":1,"id":"ans03"},{"sec":"ans","prompt":"Что выведет программа при вводе `4, 35, 69, 40, 96`?","options":["240\nYES","60.0\nNO","60.0\nYES","60\nYES"],"correct":[2],"explain":"Среднее (35+69+40+96)/4 = 60.0; не больше 40 — две скорости (35 и 40) → YES.","code":"n = int(input())\ns = 0\nkol = 0\nkol2 = 0\nfor i in range(n):\n    a = int(input())\n    s += a\n    kol += 1\n    if a <= 40:\n        kol2 += 1\nprint(round(s / kol, 1))\nif kol2 >= 2:\n    print('YES')\nelse:\n    print('NO')","inp":"4\n35\n69\n40\n96","mono":1,"id":"ans05"},{"sec":"ans","prompt":"По условию нужно вывести **YES**. Какие варианты засчитает автопроверка?","options":["print('Yes')","print('YES.')","print(YES)","print(\"YES\")","print('YES')"],"correct":[3,4],"explain":"Кавычки могут быть одинарными или двойными, но текст должен совпасть буква в букву. `print(YES)` без кавычек — NameError.","memo":"format","mono":1,"id":"ans06"},{"sec":"ans","prompt":"Что сообщит Python, если подходящих чисел нет?","options":["выведет 0","NameError: name 'NO' is not defined","SyntaxError: expected ':'","выведет NO"],"correct":[1],"explain":"Без кавычек NO — имя переменной, а такой переменной нет. Нужно `print('NO')`.","code":"kol = 0\nif kol > 0:\n    print(kol)\nelse:\n    print(NO)","memo":"name_str","id":"ans07"},{"sec":"ans","prompt":"Скобка закрыта не там. Что выведет программа?","options":["4","4 1","4.5","5"],"correct":[1],"explain":"`round(s / kol)` без второго аргумента округляет до целого (4.5 → 4 — в Python «к чётному»), а `, 1` стало вторым значением для print. Правильно: `print(round(s / kol, 1))`.","code":"s = 9\nkol = 2\nprint(round(s / kol), 1)","mono":1,"id":"ans08"},{"sec":"ans","prompt":"Для среднего ученик использовал `//`. Что выведет программа?","options":["6.0","6.5","6","7"],"correct":[2],"explain":"`//` — целочисленное деление, дробная часть теряется. Для среднего нужно `/`.","code":"s = 13\nkol = 2\nprint(s // kol)","mono":1,"id":"ans09"},{"sec":"ans","prompt":"Где должен стоять `else`?","options":["ровно под своим if, без отступа относительно if","в той же строке, что и if","после всех print","с отступом под print"],"correct":[0],"explain":"if и else — пара, они начинаются с одной позиции. Тело каждого сдвинуто на 4 пробела.","code":"if kol > 0:\n    print(kol)\nelse:\n    print('NO')","memo":"else","id":"ans10"},{"sec":"ans","prompt":"Что выведет программа при вводе `1, 15`?","options":["0 0","4 30","NO","5 45"],"correct":[1],"explain":"Кратные 3, но не 5, на [1; 15]: 3, 6, 9, 12 → 4 числа, сумма 30, одна строка через пробел.","code":"a = int(input())\nb = int(input())\nkol = 0\ns = 0\nfor a in range(a, b + 1):\n    if a % 3 == 0 and a % 5 != 0:\n        kol += 1\n        s += a\nif kol > 0:\n    print(kol, s)\nelse:\n    print('NO')","inp":"1\n15","mono":1,"id":"ans11"},{"sec":"ans","prompt":"Что выведет программа при вводе `10, 11`?","options":["0 0","NO","5 45","4 30"],"correct":[1],"explain":"На [10; 11] нет чисел, кратных 3 → NO.","code":"a = int(input())\nb = int(input())\nkol = 0\ns = 0\nfor a in range(a, b + 1):\n    if a % 3 == 0 and a % 5 != 0:\n        kol += 1\n        s += a\nif kol > 0:\n    print(kol, s)\nelse:\n    print('NO')","inp":"10\n11","mono":1,"id":"ans12"},{"sec":"ans","prompt":"Что выведет программа при вводе `3, 44, 2002, 120`?","options":["120","44","10000000000","NO"],"correct":[3],"explain":"Трёхзначное только 120, но 1 ≠ 0. Минимум не изменился (остался 10**10), значит NO.","code":"n = int(input())\nmini = 10**10\nfor i in range(n):\n    a = int(input())\n    if 100 <= a <= 999 and a // 100 == a % 10:\n        mini = min(mini, a)\nif mini < 10**10:\n    print(mini)\nelse:\n    print('NO')","inp":"3\n44\n2002\n120","mono":1,"id":"ans13"},{"sec":"run","prompt":"Python выдал сообщение об ошибке. Где искать **номер строки** и **тип ошибки**?","options":["тип ошибки — в первой строке, номер строки — в последней","сообщение нужно просто закрыть и запустить снова","номер строки — в «line N», тип и описание — в самой последней строке сообщения","номер строки всегда 1"],"correct":[2],"explain":"Последняя строка сообщения — главное: тип ошибки (SyntaxError, NameError…) и пояснение. Выше показана строка программы, где Python заметил проблему, и её номер (line N). Иногда настоящая ошибка — на строку выше (например, незакрытая скобка).","id":"run01"},{"sec":"run","prompt":"Какие ошибки Python находит **ещё до запуска** — программа даже не спросит ввод? Отметь все.","options":["SyntaxError","IndentationError","NameError","ZeroDivisionError","EOFError"],"correct":[0,1],"explain":"Синтаксис и отступы проверяются целиком перед выполнением. Остальные ошибки возникают во время работы, когда Python доходит до «плохой» строки.","mono":1,"id":"run02"},{"sec":"run","prompt":"Что сообщит Python?","options":["SyntaxError: invalid syntax","IndentationError: unexpected indent","NameError: name 'a' is not defined","SyntaxError: expected ':'"],"correct":[3],"explain":"После условия if нет двоеточия (строка 5).","code":"n = int(input())\nkol = 0\nfor i in range(n):\n    a = int(input())\n    if a % 4 == 0\n        kol += 1\nprint(kol)","memo":"colon","mono":1,"id":"run03"},{"sec":"run","prompt":"Что сообщит Python?","options":["TypeError: unsupported operand","NameError: name 'a' is not defined","SyntaxError: cannot assign to expression here. Maybe you meant '==' instead of '='?","SyntaxError: expected ':'"],"correct":[2],"explain":"Один знак `=` внутри if. Python даже подсказывает: нужно `==`.","code":"a = int(input())\nif a % 2 = 0:\n    print('YES')","memo":"eq","mono":1,"id":"run04"},{"sec":"run","prompt":"Программа не запустилась. Что исправить?","options":["сдвинуть print(a) на 4 пробела вправо","добавить скобки вокруг a > 0","убрать двоеточие после if","написать Print вместо print"],"correct":[0],"explain":"После `if …:` нужен блок с отступом. print без отступа — блок пустой.","code":"a = int(input())\nif a > 0:\nprint(a)","memo":"indent_block","console":"  File \"main.py\", line 3\n    print(a)\n    ^^^^^\nIndentationError: expected an indented block after 'if' statement on line 2","id":"run05"},{"sec":"run","prompt":"В какой строке проблема и какая?","options":["строка 3: нет двоеточия","строка 4: kol не создан","строка 5: print внутри цикла","строка 2: лишний отступ перед kol = 0"],"correct":[3],"explain":"Перед строкой 2 нет заголовка с двоеточием, значит отступ там лишний.","code":"n = int(input())\n  kol = 0\nfor i in range(n):\n    kol += 1\nprint(kol)","memo":"unexpected","console":"  File \"main.py\", line 2\n    kol = 0\nIndentationError: unexpected indent","id":"run06"},{"sec":"run","prompt":"Что сообщит Python?","options":["IndentationError: unindent does not match any outer indentation level","IndentationError: unexpected indent","Ошибки нет: выведет 1 и 2","SyntaxError: expected ':'"],"correct":[0],"explain":"Отступ в 2 пробела не совпадает ни с уровнем if (0), ни с телом (4).","code":"a = int(input())\nif a > 0:\n    print(1)\n  print(2)","memo":"unindent","id":"run07"},{"sec":"run","prompt":"Сообщение `TabError: inconsistent use of tabs and spaces in indentation` означает…","options":["слишком длинная строка","забыли двоеточие","в программе нет ни одного отступа","часть отступов сделана табуляцией, часть — пробелами"],"correct":[3],"explain":"Чаще всего бывает после копирования кода. Перенабери отступы одинаково (4 пробела).","memo":"tab","id":"run08"},{"sec":"run","prompt":"Программа запустилась, прочитала числа и упала. Как исправить?","options":["поставить print(kol) внутрь цикла","перед циклом добавить kol = 0","заменить kol += 1 на kol = 1","добавить двоеточие после print"],"correct":[1],"explain":"kol += 1 значит «возьми старое kol и прибавь 1», а старого kol нет. Начальное значение задают до цикла.","code":"n = int(input())\nfor i in range(n):\n    a = int(input())\n    if a % 4 == 0:\n        kol += 1\nprint(kol)","memo":"name_init","console":"Traceback (most recent call last):\n  File \"main.py\", line 5, in <module>\n    kol += 1\n    ^^^\nNameError: name 'kol' is not defined","inp":"2\n4\n8","id":"run09"},{"sec":"run","prompt":"Что не так?","options":["не хватает двоеточия","print пишется с маленькой буквы","нельзя печатать a","нужно print(a) взять в кавычки"],"correct":[1],"explain":"Python различает регистр букв. Он даже подсказывает: Did you mean: 'print'?","code":"a = int(input())\nPrint(a)","memo":"name_typo","console":"Traceback (most recent call last):\n  File \"main.py\", line 2, in <module>\n    Print(a)\n    ^^^^^\nNameError: name 'Print' is not defined. Did you mean: 'print'?","inp":"5","id":"run10"},{"sec":"run","prompt":"Имена на экране выглядят одинаково, но Python пишет, что переменной нет. Почему?","options":["нужно писать KOL","во второй строке буква «о» русская — для Python это другое имя","kol — зарезервированное слово","нельзя писать kol += 1 после kol = 0"],"correct":[1],"explain":"Кириллическая «о» и латинская «o» выглядят одинаково, но это разные символы. Набирай код в английской раскладке.","code":"kol = 0\nkоl += 1\nprint(kol)","memo":"name_typo","console":"Traceback (most recent call last):\n  File \"main.py\", line 2, in <module>\n    kоl += 1\n    ^^^\nNameError: name 'kоl' is not defined","id":"run11"},{"sec":"run","prompt":"Как исправить вывод?","options":["print('NO') — слово в кавычках","print(no)","print(NO:)","NO = 0 перед if"],"correct":[0],"explain":"Без кавычек слово считается именем переменной.","code":"kol = 0\nif kol > 0:\n    print(kol)\nelse:\n    print(NO)","memo":"name_str","console":"Traceback (most recent call last):\n  File \"main.py\", line 5, in <module>\n    print(NO)\n          ^^\nNameError: name 'NO' is not defined","id":"run12"},{"sec":"run","prompt":"Как исправить?","options":["if int(a % 4) == 0:","if a % 4 == \"0\":","a = input(int())","a = int(input())"],"correct":[3],"explain":"input() вернул строку '16'. Для текста `%` означает форматирование строки, отсюда странное сообщение. Нужно сразу превратить ввод в число.","code":"a = input()\nif a % 4 == 0:\n    print(a)","memo":"type_str","mono":1,"console":"Traceback (most recent call last):\n  File \"main.py\", line 2, in <module>\n    if a % 4 == 0:\n       ~~^~~\nTypeError: not all arguments converted during string formatting","inp":"16","id":"run13"},{"sec":"run","prompt":"Как исправить?","options":["maxi = max(a)","print(int(maxi))","a = int(input())","maxi = \"-10**10\""],"correct":[2],"explain":"Сравнить строку и число нельзя: «>» not supported between 'str' and 'int'. Числа читаем через int().","code":"n = int(input())\nmaxi = -10**10\nfor i in range(n):\n    a = input()\n    maxi = max(maxi, a)\nprint(maxi)","memo":"type_str","mono":1,"console":"Traceback (most recent call last):\n  File \"main.py\", line 5, in <module>\n    maxi = max(maxi, a)\nTypeError: '>' not supported between instances of 'str' and 'int'","inp":"2\n5\n7","id":"run14"},{"sec":"run","prompt":"Как исправить?","options":["a = input()","s += int(a)","s = str(s)","s += a — прибавлять уже прочитанное число"],"correct":[3],"explain":"Вместо прочитанного числа к сумме прибавляется НОВЫЙ ввод, да ещё строкой: unsupported operand type(s) for +=: 'int' and 'str'. Нужно `s += a`.","code":"s = 0\na = int(input())\nwhile a != 0:\n    s += input()\n    a = int(input())\nprint(s)","memo":"type_str","console":"Traceback (most recent call last):\n  File \"main.py\", line 4, in <module>\n    s += input()\nTypeError: unsupported operand type(s) for +=: 'int' and 'str'","inp":"5\n7\n0","id":"run15"},{"sec":"run","prompt":"Программа упала на первой же строке. Почему?","options":["числа ввели через запятую в одной строке, а нужно каждое — с новой строки","нельзя читать числа в цикле","нужно n = input()","нет двоеточия после for"],"correct":[0],"explain":"int() получил строку «3, 5, 7» и не смог её превратить в одно число.","code":"n = int(input())\nfor i in range(n):\n    a = int(input())","memo":"value","console":"Traceback (most recent call last):\n  File \"main.py\", line 1, in <module>\n    n = int(input())\nValueError: invalid literal for int() with base 10: '3, 5, 7'","inp":"3, 5, 7","id":"run16"},{"sec":"run","prompt":"Как исправить?","options":["поменять условие на a % 8 != 0","добавить проверку: if kol > 0: print(s / kol) else: print('NO')","заменить / на //","начать с kol = 1"],"correct":[1],"explain":"Кратных 8 не оказалось, kol = 0 → деление на ноль. Начать с kol = 1 нельзя — среднее станет неверным.","code":"s = 0\nkol = 0\na = int(input())\nwhile a != 0:\n    if a % 8 == 0:\n        s += a\n        kol += 1\n    a = int(input())\nprint(s / kol)","memo":"zero","console":"Traceback (most recent call last):\n  File \"main.py\", line 9, in <module>\n    print(s / kol)\n          ~~^~~~~\nZeroDivisionError: division by zero","inp":"5\n7\n0","id":"run17"},{"sec":"run","prompt":"Почему программа упала?","options":["n прочитано без int","нет kol = 0","лишнее чтение перед циклом: программа «съела» одно число и потом ей не хватило данных","в for нет двоеточия"],"correct":[2],"explain":"Всего 1 + 3 чисел, а input() вызывается 1 + 1 + 3 = 5 раз. EOF — «конец файла»: данные закончились.","code":"n = int(input())\na = int(input())\nkol = 0\nfor i in range(n):\n    a = int(input())\n    if a % 2 == 0:\n        kol += 1\nprint(kol)","memo":"eof","console":"Traceback (most recent call last):\n  File \"main.py\", line 5, in <module>\n    a = int(input())\n            ~~~~~^^\nEOFError: EOF when reading a line","inp":"3\n2\n4\n6","id":"run18"},{"sec":"run","prompt":"Что сообщит Python?","options":["SyntaxError: invalid syntax","IndentationError: unexpected indent","NameError: name 'a' is not defined","SyntaxError: '(' was never closed"],"correct":[3],"explain":"Открыто две скобки, закрыта одна. Иногда Python показывает ошибку на следующей строке — проверяй и строку выше.","code":"a = int(input()\nprint(a)","memo":"paren","mono":1,"id":"run19"},{"sec":"run","prompt":"Что сообщит Python?","options":["выведет NO","SyntaxError: '(' was never closed","SyntaxError: unterminated string literal (detected at line 1)","NameError: name 'NO' is not defined"],"correct":[2],"explain":"Кавычка открылась, но не закрылась.","code":"print('NO)","memo":"quote","id":"run20"},{"sec":"run","prompt":"Что сообщит Python?","options":["SyntaxError: invalid syntax","IndentationError: unexpected indent","SyntaxError: expected ':'","Ошибки нет"],"correct":[0],"explain":"else стоит внутри блока if (с отступом) — так нельзя. else пишется под if.","code":"a = int(input())\nif a > 0:\n    print(1)\n    else:\n    print(2)","memo":"else","id":"run21"},{"sec":"run","prompt":"Как исправить?","options":["else: if a < 0","if else a < 0:","else (a < 0):","elif a < 0:"],"correct":[3],"explain":"В Python «иначе если» пишется одним словом: `elif`.","code":" верным? Отметь все.","options":["range(a, b) вместо range(a, b + 1)","переменная не создана до цикла","print стоит внутри цикла","kol = 0 стоит внутри цикла","нет двоеточия после if"],"correct":[0,2,3],"explain":"Это логические ошибки: программа синтаксически правильная, но делает не то. Нет двоеточия — SyntaxError, переменная не создана — NameError.","memo":"print_in_loop","id":"run27"},{"sec":"cond","prompt":"Задача (FOR): **Количество чисел, кратных 4**.\nВ последовательности натуральных чисел определить количество чисел, кратных 4.\n\nЧто поставить вместо `УСЛОВИЕ`?","options":["a % 4 != 0","a % 4 == 0","a // 4 == 0","a % 4 == 1","a % 10 == 4"],"correct":[1],"explain":"Нужное условие: `a % 4 == 0`.","code":"n = int(input())\nkol = 0\nfor i in range(n):\n    a = int(input())\n    if УСЛОВИЕ:\n        kol += 1\nprint(kol)","mono":1,"task":3,"id":"cond01"},{"sec":"cond","prompt":"Задача (FOR): **Количество чисел, оканчивающихся на 3**.\nВ последовательности натуральных чисел определить количество чисел, оканчивающихся на 3.\n\nЧто поставить вместо `УСЛОВИЕ`?","options":["a % 7 == 3","a % 10 == 3","a % 10 != 3","a % 3 == 0","a // 10 == 3"],"correct":[1],"explain":"Нужное условие: `a % 10 == 3`.","code":"n = int(input())\nkol = 0\nfor i in range(n):\n    a = int(input())\n    if УСЛОВИЕ:\n        kol += 1\nprint(kol)","mono":1,"task":5,"id":"cond02"},{"sec":"cond","prompt":"Задача (FOR): **Сумма чисел, кратных 6**.\nВ последовательности натуральных чисел определить сумму чисел, кратных 6.\n\nЧто поставить вместо `УСЛОВИЕ`?","options":["a % 10 == 6","a % 6 != 0","a // 6 == 0","a % 6 == 1","a % 6 == 0"],"correct":[4],"explain":"Нужное условие: `a % 6 == 0`.","code":"n = int(input())\ns = 0\nfor i in range(n):\n    a = int(input())\n    if УСЛОВИЕ:\n        s += a\nprint(s)","mono":1,"task":2,"id":"cond03"},{"sec":"cond","prompt":"Задача (FOR): **Сумма чисел, оканчивающихся на 4**.\nВ последовательности натуральных чисел определить сумму чисел, оканчивающихся на 4.\n\nЧто поставить вместо `УСЛОВИЕ`?","options":["a % 7 == 4","a // 10 == 4","a % 10 != 4","a % 10 == 4","a % 4 == 0"],"correct":[3],"explain":"Нужное условие: `a % 10 == 4`.","code":"n = int(input())\ns = 0\nfor i in range(n):\n    a = int(input())\n    if УСЛОВИЕ:\n        s += a\nprint(s)","mono":1,"task":4,"id":"cond04"},{"sec":"cond","prompt":"Задача (FOR): **Максимальное число, кратное 5**.\nВ последовательности натуральных чисел определить максимальное число, кратное 5.\n\nЧто поставить вместо `УСЛОВИЕ`?","options":["a % 5 != 0","a // 5 == 0","a % 10 == 5","a % 5 == 1","a % 5 == 0"],"correct":[4],"explain":"Нужное условие: `a % 5 == 0`.","code":"n = int(input())\nmaxi = -10**10\nfor i in range(n):\n    a = int(input())\n    if УСЛОВИЕ:\n        maxi = max(maxi, a)\nprint(maxi)","mono":1,"task":1,"id":"cond05"},{"sec":"cond","prompt":"Задача (FOR): **Минимальное чётное число**.\nВ последовательности натуральных чисел определить минимальное чётное число.\n\nЧто поставить вместо `УСЛОВИЕ`?","options":["a % 2 != 0","a % 10 == 2","a % 2 == 0","a // 2 == 0"],"correct":[2],"explain":"Нужное условие: `a % 2 == 0`.","code":"n = int(input())\nmini = 10**10\nfor i in range(n):\n    a = int(input())\n    if УСЛОВИЕ:\n        mini = min(mini, a)\nprint(mini)","mono":1,"task":8,"id":"cond06"},{"sec":"cond","prompt":"Задача (FOR): **Скорости: разность максимума и минимума, количество до 30 км/ч**.\nКамера фиксирует скорости N автомобилей. Найти:\n\nЧто поставить вместо `УСЛОВИЕ`?","options":["a <= 30","a != 30","a >= 30","a < 30","a == 30"],"correct":[0],"explain":"Нужное условие: `a <= 30`.","code":"n = int(input())\nkol = 0\nmaxi = -10**10\nmini = 10**10\nfor i in range(n):\n    a = int(input())\n    maxi = max(maxi, a)\n    mini = min(mini, a)\n    if УСЛОВИЕ:\n        kol += 1\nprint(maxi - mini)\nprint(kol)","mono":1,"task":10,"id":"cond07"},{"sec":"cond","prompt":"Задача (FOR): **Температура: среднее положительных значений и их количество**.\nПо дневным температурам найти среднюю температуру тех дней, когда она была выше 0 °C, и количество таких дней.\n\nЧто поставить вместо `УСЛОВИЕ`?","options":["a > 0","a >= 0","a < 0","a <= 0","a != 0"],"correct":[0],"explain":"Нужное условие: `a > 0`.","code":"n = int(input())\nkol = 0\ns = 0\nfor i in range(n):\n    a = int(input())\n    if УСЛОВИЕ:\n        kol += 1\n        s += a\nprint(s / kol)\nprint(kol)","mono":1,"task":11,"id":"cond08"},{"sec":"cond","prompt":"Задача (FOR): **Викторина: максимум правильных ответов и нулевой результат**.\nУчастники ответили на 20 вопросов. Найти наибольшее количество правильных ответов.\n\nЧто поставить вместо `УСЛОВИЕ`?","options":["a != 0","a == 0","a = 0"],"correct":[1],"explain":"Нужное условие: `a == 0`.","code":"n = int(input())\nmaxi = -10**10\nkol2 = 0\nfor i in range(n):\n    a = int(input())\n    maxi = max(maxi, a)\n    if УСЛОВИЕ:\n        kol2 += 1\nprint(maxi)\nif kol2 > 0:\n    print('YES')\nelse:\n    print('NO')","mono":1,"task":12,"id":"cond09"},{"sec":"cond","prompt":"Задача (FOR): **Скорости: максимум и проверка скорости ниже 30**.\nНайти максимальную скорость автомобиля. Если хотя бы один автомобиль ехал со скоростью меньше 30 км/ч, вывести YES, иначе NO.\n\nЧто поставить вместо `УСЛОВИЕ`?","options":["a < 29","a < 30","a <= 30","a > 30","a >= 30"],"correct":[1],"explain":"Нужное условие: `a < 30`.","code":"n = int(input())\nmaxi = -10**10\nkol2 = 0\nfor i in range(n):\n    a = int(input())\n    maxi = max(maxi, a)\n    if УСЛОВИЕ:\n        kol2 += 1\nprint(maxi)\nif kol2 > 0:\n    print('YES')\nelse:\n    print('NO')","mono":1,"task":13,"id":"cond10"},{"sec":"cond","prompt":"Задача (FOR): **Скорости: среднее и не менее двух медленных автомобилей**.\nНайти среднюю скорость всех автомобилей. Если не менее двух автомобилей двигались со скоростью не больше 40 км/ч, вывести YES, иначе NO.\n\nЧто поставить вместо `УСЛОВИЕ`?","options":["a < 40","a > 40","a >= 40","a == 40","a <= 40"],"correct":[4],"explain":"Нужное условие: `a <= 40`.","code":"n = int(input())\ns = 0\nkol = 0\nkol2 = 0\nfor i in range(n):\n    a = int(input())\n    s += a\n    kol += 1\n    if УСЛОВИЕ:\n        kol2 += 1\nprint(round(s / kol, 1))\nif kol2 >= 2:\n    print('YES')\nelse:\n    print('NO')","mono":1,"task":14,"id":"cond11"},{"sec":"cond","prompt":"Задача (FOR): **Контрольная: число неудовлетворительных оценок и отличник**.\nКаждый ученик решал 10 примеров. Неудовлетворительная оценка — если решено меньше половины примеров. Найти количество таких оценок.\n\nЧто поставить вместо `УСЛОВИЕ`?","options":["a <= 5","a < 5","a >= 5","a < 4","a != 5"],"correct":[1],"explain":"Нужное условие: `a < 5`.","code":"n = int(input())\nkol = 0\nkol2 = 0\nfor i in range(n):\n    a = int(input())\n    if УСЛОВИЕ:\n        kol += 1\n    if a == 10:\n        kol2 += 1\nprint(kol)\nif kol2 > 0:\n    print('YES')\nelse:\n    print('NO')","mono":1,"task":16,"id":"cond12"},{"sec":"cond","prompt":"Задача (FOR): **Среднее чисел с нечётной последней цифрой в записи по основанию 7**.\nНайти среднее арифметическое десятичных чисел, запись которых в системе счисления с основанием 7 оканчивается нечётной цифрой. Если таких элементов нет, вывести NO.\n\nЧто поставить вместо `УСЛОВИЕ`?\n\n*Верных вариантов несколько — отметь все.*","options":["a % 7 % 2 != 0","a % 7 % 2 == 0","a % 7 % 2 == 1","a % 10 % 2 != 0"],"correct":[0,2],"explain":"Нужное условие: `a % 7 % 2 != 0`. Равносильная запись: `a % 7 % 2 == 1`.","code":"n = int(input())\ns = 0\nkol = 0\nfor i in range(n):\n    a = int(input())\n    if УСЛОВИЕ:\n        s += a\n        kol += 1\nif kol > 0:\n    print(round(s / kol, 1))\nelse:\n    print('NO')","mono":1,"task":18,"id":"cond13"},{"sec":"cond","prompt":"Задача (FOR): **Среднее чисел, оканчивающихся на 5 в системе счисления по основанию 7**.\nНайти среднее арифметическое десятичных чисел, запись которых в системе счисления с основанием 7 оканчивается цифрой 5. Если таких элементов нет, вывести NO.\n\nЧто поставить вместо `УСЛОВИЕ`?","options":[ (s)","mono":1,"task":33,"id":"cond17"},{"sec":"cond","prompt":"Задача (WHILE): **Количество трёхзначных чисел, кратных 4**.\nВ последовательности натуральных чисел определить количество трёхзначных чисел, кратных 4.\n\nЧто поставить вместо `УСЛОВИЕ`?","options":["100 <= a <= 999 and a % 10 == 0","100 <= a <= 999 and a % 4 == 0","a % 4 == 0","100 < a <= 999 and a % 4 == 0","100 <= a <= 999"],"correct":[1],"explain":"Нужное условие: `100 <= a <= 999 and a % 4 == 0`.","code":"kol = 0\na = int(input())\nwhile a != 0:\n    if УСЛОВИЕ:\n        kol += 1\n    a = int(input())\nprint(kol)","mono":1,"task":9,"id":"cond18"},{"sec":"cond","prompt":"Задача (WHILE): **Количество однозначных чисел, кратных 3**.\nВ последовательности натуральных чисел определить количество однозначных чисел, кратных 3.\n\nЧто поставить вместо `УСЛОВИЕ`?","options":["a % 3 == 0","1 <= a <= 9 and a % 3 == 0","1 <= a <= 9 or a % 3 == 0","1 <= a < 9 and a % 3 == 0","1 <= a <= 9 and a % 3 != 0"],"correct":[1],"explain":"Нужное условие: `1 <= a <= 9 and a % 3 == 0`.","code":"kol = 0\na = int(input())\nwhile a != 0:\n    if УСЛОВИЕ:\n        kol += 1\n    a = int(input())\nprint(kol)","mono":1,"task":29,"id":"cond19"},{"sec":"cond","prompt":"Задача (WHILE): **Сумма чисел, кратных 4 или 9**.\nВ последовательности целых чисел вычислить сумму всех чисел, которые кратны 4 или 9.\n\nЧто поставить вместо `УСЛОВИЕ`?","options":["a % 10 == 0 or a % 9 == 0","a % 4 == 0 or a % 9 != 0","a % 9 == 0","a % 4 != 0 or a % 9 == 0","a % 4 == 0 or a % 9 == 0"],"correct":[4],"explain":"Нужное условие: `a % 4 == 0 or a % 9 == 0`.","code":"s = 0\na = int(input())\nwhile a != 0:\n    if УСЛОВИЕ:\n        s += a\n    a = int(input())\nprint(s)","mono":1,"task":23,"id":"cond20"},{"sec":"cond","prompt":"Задача (WHILE): **Сумма чисел, кратных 6 и оканчивающихся на 4**.\nВ последовательности натуральных чисел определить сумму чисел, кратных 6 и оканчивающихся на 4.\n\nЧто поставить вместо `УСЛОВИЕ`?","options":["a % 6 == 0 and a % k":104,"id":"prep37"},{"sec":"prep","prompt":"Задача (ХАРД): **Произведение чисел, оканчивающихся на 2 в семеричной записи**.\nВ последовательности натуральных чисел найти произведение чисел, запись которых в системе счисления с основанием 7 оканчивается цифрой 2. Если таких чисел нет, вывести NO.\n\nКакие строки нужно написать **перед циклом**? Отметь все нужные — без лишних и без неверных.","options":["kol = 0","maxi = -10**10","pr = 0","s = 0","kol = 1","pr = 1"],"correct":[0,5],"explain":"Нужно: `pr = 1`, `kol = 0`. Произведение начинают с 1. Лишние переменные не нужны.","hint":"Подумай, какие величины просит найти задача: количество, сумму, произведение, максимум, минимум, длину…","after":"n = int(input())\npr = 1\nkol = 0\nfor i in range(n):\n    a = int(input())\n    if a % 7 == 2:\n        pr *= a\n        kol += 1\nif kol > 0:\n    print(pr)\nelse:\n    print('NO')","mono":1,"task":106,"id":"prep39"},{"sec":"prep","prompt":"Задача (ХАРД): **Двузначные числа с убывающими цифрами: количество и сумма**.\nНайти количество и сумму двузначных чисел, у которых цифра десятков больше цифры единиц.\n\nКакие строки нужно написать **перед циклом**? Отметь все нужные — без лишних и без неверных.","options":["s = 0","kol = 1","s = 1","kol = 0","mini = 10**10","kol2 = 0"],"correct":[0,3],"explain":"Нужно: `kol = 0`, `s = 0`. Лишние переменные не нужны.","hint":"Подумай, какие величины просит найти задача: количество, сумму, произведение, максимум, минимум, длину…","after":"kol = 0\ns = 0\na = int(input())\nwhile a != 0:\n    if 10 <= a <= 99 and a // 10 > a % 10:\n        kol += 1\n        s += a\n    a = int(input())\nprint(kol)\nprint(s)","mono":1,"task":107,"id":"prep40"},{"sec":"prep","prompt":"Задача (ХАРД): **Среднее чисел, кратных 3, но не кратных 9 (или NO)**.\nНайти среднее арифметическое чисел, которые делятся на 3, но не делятся на 9. Если таких чисел нет, вывести NO.\n\nКакие строки нужно написать **перед циклом**? Отметь все нужные — без лишних и без неверных
