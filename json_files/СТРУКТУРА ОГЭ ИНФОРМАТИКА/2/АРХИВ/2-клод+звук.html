/* ===== разбор цепочек ===== */
function parsesAll(table,code){const tb=table.map(p=>[p[0],strip(p[1])]),res=[];
 (function rec(i,acc){if(i===code.length){res.push(acc.slice());return}tb.forEach(p=>{if(p[1]&&code.startsWith(p[1],i)){acc.push(p[0]);rec(i+p[1].length,acc);acc.pop()}})})(0,[]);return res}
function codeMap(table){const m={};table.forEach(p=>{const k=strip(p[1]);(m[k]=m[k]||[]).push(p[0])});return m}

/* ===== иллюстрации ===== */
function ilMap(pairs){return '<div class="ill">'+pairs.map(p=>`<div class="map"><b>${esc(p[0])}</b><i>→</i><code>${esc(p[1])}</code></div>`).join('')+'</div>'}
function ilCut(code,cuts,letters){const c=Array.from(code),b=[0].concat(cuts,[c.length]);let h='<div class="cutrow">';
 for(let k=0;k<b.length-1;k++){const l=letters[k];h+=`<div class="seg"><div class="lt ${l&&l!=='?'?'ok':'bad'}">${esc(l||'?')}</div><div class="sy">${c.slice(b[k],b[k+1]).map(x=>`<span class="s">${esc(x)}</span>`).join('')}</div></div>`;if(k<b.length-2)h+='<div class="cutbar"></div>'}
 return h+'</div>'}
function tblHTML(table,num){const chunk=num?11:table.length;let h='';
 for(let i=0;i<table.length;i+=chunk){const part=table.slice(i,i+chunk);h+=`<table class="ct"><tr><th>Буква</th>${part.map(p=>`<td class="L">${esc(p[0])}</td>`).join('')}</tr><tr><th>${num?'Номер':'Код'}</th>${part.map(p=>`<td class="C">${esc(p[1])}</td>`).join('')}</tr></table>`}
 return `<div class="ctw">${h}</div>`}
function hl(s){const re=/(\d+|наименьш\p{L}*|скольк\p{L}*|не повторя\p{L}*|повторя\p{L}*|единственн\p{L}*|только одн\p{L}*|без запятых|без пробелов)/giu;let out='',last=0,m;
 while((m=re.exec(s))){out+=esc(s.slice(last,m.index));out+=`<span class="${/^\d/.test(m[0])?'hn':'hk'}">${esc(m[0])}</span>`;last=m.index+m[0].length}
 return (out+esc(s.slice(last))).replace(/\n/g,'<br>')}

/* ===== состояние и навигация ===== */
let autoT=null;
const inA=id=>!S.assign||S.assign.indexOf(id)>=0;
const vis=()=>TASKS.filter(t=>inA(t.id));
const cur=()=>TASKS.find(t=>t.id===S.cur&&inA(t.id))||vis()[0];
function st(id){if(S.done[id])return S.hint[id]?'doneh':'done';if(S.skip[id])return 'skip';if(S.err[id])return 'err';if(S.tried[id]||S.hint[id])return 'prog';return 'new'}

function toggleTheme(){S.theme=S.theme==='dark'?'light':'dark';save();render()}
function setName(){const n=prompt('Как тебя зовут?',S.name||'');if(n!==null){S.name=n.trim();save();render()}}
function renderTop(){const V=vis(),d=V.filter(t=>S.done[t.id]).length;$('pb').style.width=(V.length?d/V.length*100:0)+'%';$('whoBtn').textContent='👤 '+(S.name||'Имя')+(S.hw?' · '+S.hw:'')+' · '+d+'/'+V.length}
function renderNav(){const V=vis();
 let h=`<button class="chip big ${S.view==='theory'?'on':''} ${S.thDone?'ok':S.thSkip?'sk':''}" onclick="go('theory')">📖 Теория</button><button class="chip big ${S.view==='test'?'on':''} ${teDone()?'ok':S.teSkip?'sk':''}" onclick="go('test')">🧠 Тест</button><span class="sep"></span>`;
 V.forEach((t,i)=>{h+=`<button class="chip s-${st(t.id)} ${S.view==='task'&&cur()&&cur().id===t.id?'on':''}" title="${esc(tLabel(t))} — ${STL[st(t.id)]}" onclick="go('task','${t.id}')">${i+1}${t.proto?'★':''}</button>`});
 $('nav').innerHTML=h+'<span class="leg">★ — прототип</span>'}
function render(){document.documentElement.dataset.theme=S.theme;renderTop();renderNav();const v=$('view');
 if(S.view==='test')v.innerHTML=testView();else if(S.view==='task'){const t=cur();v.innerHTML=t?taskView(t):'<div class="card">Учитель пока не назначил задания.</div>'}else v.innerHTML=theoryView()}

/* ===== озвучка ===== */
let speaking=null;
function stopSay(){try{speechSynthesis.cancel()}catch(e){}speaking=null;document.querySelectorAll('.say.on').forEach(b=>b.classList.remove('on'))}
function say(key,text,btn){if(!('speechSynthesis' in window)){toast('Озвучка не поддерживается в этом браузере');return}
 if(speaking===key){stopSay();return}stopSay();speaking=key;if(btn)btn.classList.add('on');
 const parts=text.match(/[^.!?…]+[.!?…]*/g)||[text];let v=null;try{v=speechSynthesis.getVoices().find(x=>/^ru/i.test(x.lang))}catch(e){}
 parts.forEach((p,i)=>{const u=new SpeechSynthesisUtterance(p.trim());u.lang='ru-RU';if(v)u.voice=v;u.rate=Number(S.rate)||1.5;if(i===parts.length-1)u.onend=()=>{if(speaking===key)stopSay()};speechSynthesis.speak(u)})}
function sayLec(i,b){S.thSteps[i]=1;save();say('lec'+i,LEC[i].say,b)}
function sayMemo(i,b){S.memo[i]=1;save();say('memo'+i,MEMO[i].say,b)}
function setRate(v){S.rate=Number(v);save();document.querySelectorAll('.rv').forEach(e=>e.textContent='×'+S.rate)}
const speedUI=()=>`<label class="spd">🔊 скорость <input type="range" min="1" max="3" step="0.25" value="${S.rate}" oninput="setRate(this.value)"><b class="rv">×${S.rate}</b></label>`;

/* ===== помощники: резак и дерево ===== */
function U(key){return UI.w[key]||(UI.w[key]={tab:REG[key].tabs==='tree'?'tree':'cut',ci:0,mode:'free',cuts:[],dir:'start',exp:{},total:false})}
function wRedraw(key){const el=$('w_'+key);if(el)el.outerHTML=wHTML(key)}
function markTool(key){if(/^[tb]_/.test(key)){S.tool[key.slice(2)]=1;save()}}
function wSet(key,p,v){const w=U(key);w[p]=v;if(p==='ci'){w.cuts=[];w.exp={};w.total=false}if(p==='mode')w.cuts=[];if(p==='dir'){w.exp={};w.total=false}markTool(key);wRedraw(key)}
function wCut(key,g){const w=U(key),i=w.cuts.indexOf(g);if(i>=0)w.cuts.splice(i,1);else w.cuts.push(g);w.cuts.sort((a,b)=>a-b);markTool(key);wRedraw(key)}
function wExp(key,p){const w=U(key);w.exp[p]=!w.exp[p];w.total=false;markTool(key);wRedraw(key)}
function wCollapse(key){const w=U(key);w.exp={};w.total=false;wRedraw(key)}
function treeKids(key,n){const w=U(key),R=REG[key],code=sym(R.codes[w.ci]).join(''),rev=w.dir==='end',rem=rev?code.slice(0,code.length-n.pos):code.slice(n.pos),o=[];
 R.table.forEach(p=>{const c=strip(p[1]);if(c&&(rev?rem.endsWith(c):rem.startsWith(c)))o.push({l:p[0],c:c,pos:n.pos+c.length,word:rev?p[0]+n.word:n.word+p[0]})});return o}
function wAll(key){const w=U(key);w.exp={};w.total=true;(function r(n,p){const ks=treeKids(key,n);if(ks.length){w.exp[p]=true;ks.forEach((k,i)=>r(k,p+'.'+i))}})({pos:0,word:''},'r');markTool(key);wRedraw(key)}
function cutHTML(key){const w=U(key),R=REG[key],code=sym(R.codes[w.ci]),n=code.length,cuts=w.cuts.slice().sort((a,b)=>a-b),cm=codeMap(R.table),b=[0].concat(cuts,[n]);
 const last=cuts.length?cuts[cuts.length-1]:0,first=cuts.length?cuts[0]:n;
 const gapOk=g=>w.mode==='free'||(w.mode==='start'&&g>last)||(w.mode==='end'&&g<first);
 const barOk=g=>w.mode==='free'||(w.mode==='start'&&g===last)||(w.mode==='end'&&g===first);
 let h='<div class="cutrow">',word='',all=true;
 for(let k=0;k<b.length-1;k++){const seg=code.slice(b[k],b[k+1]).join(''),L=cm[seg],open=(w.mode==='start'&&k===b.length-2)||(w.mode==='end'&&k===0);
  if(L)word+=L[0];else all=false;
  h+=`<div class="seg"><div class="lt ${L?'ok':open?'open':'bad'}">${L?esc(L.join('/')):open?'…':'?'}</div><div class="sy">`;
  for(let i=b[k];i<b[k+1];i++){h+=`<span class="s">${esc(code[i])}</span>`;if(i<b[k+1]-1)h+=gapOk(i+1)?`<button class="gap" title="Разрезать здесь" onclick="wCut('${key}',${i+1})"></button>`:'<span class="gap off"></span>'}
  h+='</div></div>';
  if(k<b.length-2)h+=barOk(b[k+1])?`<button class="cutbar" title="Убрать разрез" onclick="wCut('${key}',${b[k+1]})"></button>`:'<span class="cutbar"></span>'}
 h+='</div>';
 const sum=all?`✅ Все куски — коды! Слово: <b>${esc(word)}</b> · букв: <b>${b.length-1}</b>`:`Кусков: ${b.length-1}. Над каждым должна появиться зелёная буква.`;
 return h+`<div class="wsum ${all?'okx':''}">${sum}</div>`}
function treeHTML(key){const w=U(key),R=REG[key],code=sym(R.codes[w.ci]).join(''),rev=w.dir==='end';
 function rec(n,p){const ks=treeKids(key,n),fin=n.pos===code.length,root=p==='r',open=root||w.exp[p],rem=rev?code.slice(0,code.length-n.pos):code.slice(n.pos);let label;
  if(root)label=`<div class="nd root">🔐 <span class="mono">${esc(code)}</span><small>${rev?'← идём с конца':'идём с начала →'}</small></div>`;
  else{const tag=fin?`<em>✅ ${esc(n.word)}</em>`:!ks.length?'<em>✖ тупик</em>':open?'':'<em>➕</em>';
   label=`<button class="nd ${fin?'fin':ks.length?'':'dead'}" onclick="wExp('${key}','${p}')"><b>${esc(n.l)}</b><code>${esc(n.c)}</code><small>осталось: ${esc(rem)||'—'}</small>${tag}</button>`}
  let sub='';if(open&&ks.length)sub='<ul>'+ks.map((k,i)=>rec(k,p+'.'+i)).join('')+'</ul>';return `<li>${label}${sub}</li>`}
 let h=`<div class="wmode"><button class="chip2 ${!rev?'on':''}" onclick="wSet('${key}','dir','start')">→ С начала</button><button class="chip2 ${rev?'on':''}" onclick="wSet('${key}','dir','end')">← С конца</button><button class="chip2" onclick="wAll('${key}')">🌲 Раскрыть всё</button><button class="chip2" onclick="wCollapse('${key}')">↩︎ Свернуть</button></div><div class="tree"><ul>${rec({pos:0,word:''},'r')}</ul></div>`;
 if(w.total){const P=parsesAll(R.table,code);h+=`<div class="wsum">Полных расшифровок: <b>${P.length}</b>${P.length?' → '+P.map(x=>esc(x.join(''))+' ('+x.length+' букв)').join(', '):''}</div>`}
 else h+='<div class="wsum" style="color:var(--mut);font-weight:600">Нажми на ветку, чтобы раскрыть её варианты.</div>';return h}
function wHTML(key){const w=U(key),R=REG[key];let h=`<div class="wg" id="w_${key}">`;
 if(R.codes.length>1)h+='<div class="csel">'+R.codes.map((c,i)=>`<button class="chip2 ${i===w.ci?'on':''}" onclick="wSet('${key}','ci',${i})">${i+1}) ${esc(c)}</button>`).join('')+'</div>';
 if(R.tabs==='both')h+=`<div class="wtabs"><button class="chip2 ${w.tab==='cut'?'on':''}" onclick="wSet('${key}','tab','cut')">✂️ Резак</button><button class="chip2 ${w.tab==='tree'?'on':''}" onclick="wSet('${key}','tab','tree')">🌳 Дерево вариантов</button></div>`;
 if(w.tab==='cut')h+=`<div class="wmode"><button class="chip2 ${w.mode==='start'?'on':''}" onclick="wSet('${key}','mode','start')">→ С начала</button><button class="chip2 ${w.mode==='end'?'on':''}" onclick="wSet('${key}','mode','end')">← С конца</button><button class="chip2 ${w.mode==='free'?'on':''}" onclick="wSet('${key}','mode','free')">✋ Свободно</button><button class="chip2" onclick="wSet('${key}','mode','${w.mode}')">↺ Сброс</button></div>`+cutHTML(key);
 else h+=treeHTML(key);
 return h+'</div>'}

/* ===== теория ===== */
function theoryView(){const i=Math.min(S.step,LEC.length-1),s=LEC[i];S.thSteps[i]=1;if(Object.keys(S.thSteps).length>=LEC.length){S.thDone=true;S.thSkip=false}save();
 return `<div class="card"><span class="pill">📖 Мини-лекция · шаг ${i+1} из ${LEC.length}</span><div class="dots">${LEC.map((x,k)=>`<i class="${S.thSteps[k]?'d':''} ${k===i?'c':''}"></i>`).join('')}</div>
 <h2><span class="e">${s.e}</span>${s.h}</h2>${s.draw?`<div class="illbox">${s.draw()}</div>`:''}<div class="tx">${s.t}</div>
 ${s.demo?`<div><b>🎮 Попробуй сам</b>${wHTML(s.demo)}</div>`:''}
 <div class="vbar"><button class="btn sm pri say" onclick="sayLec(${i},this)">🔊 Послушать</button>${speedUI()}</div>
 <div class="row"><button class="btn" ${i?'':'disabled'} onclick="lstep(-1)">← Назад</button><button class="btn pri" onclick="lstep(1)">${i<LEC.length-1?'Дальше →':'К тесту →'}</button></div>
 <div class="skipbar"><button onclick="skipTheory()">⏭ Пропустить теорию (это отразится в отчёте)</button><button onclick="memoOpen()">📚 Памятки</button><button onclick="go('task','${(vis()[0]||{}).id}')">✏️ Сразу к задачам</button></div></div>`}
function lstep(d){stopSay();if(S.step+d>=LEC.length){go('test');return}S.step=Math.max(0,S.step+d);save();render();window.scrollTo(0,0)}
function skipTheory(){if(!S.thDone)S.thSkip=true;save();go('test')}
function memoOpen(){stopSay();S.memoOpen=true;save();$('mbody').innerHTML=`<h2>📚 Памятки</h2><div class="vbar">${speedUI()}</div>`+MEMO.map((m,i)=>`<div class="stk c-${m.c}"><div class="sh"><span class="ic">${m.e}</span>${m.h}<button class="btn sm say" onclick="sayMemo(${i},this)">🔊</button></div><div class="sb">${m.t}</div></div>`).join('');$('modal').classList.add('show')}
function closeModal(){stopSay();$('modal').classList.remove('show')}

/* ===== тест ===== */
function testView(){let a=0,ok=0;TEST.forEach((q,i)=>{if(S.te[i]!==undefined){a++;if(S.te[i]===q.a)ok++}});if(a===TEST.length){S.teSkip=false;save()}
 let h=`<div class="card"><span class="pill">🧠 Тест</span><h2>Проверь себя${a?` · отвечено ${a}/${TEST.length}, верно ${ok}`:''}</h2><div>Можно отвечать в любом порядке или <b>пропустить</b> — это отразится в отчёте.</div><div class="row"><button class="btn pri" onclick="go('task','${(vis()[0]||{}).id}')">${a===TEST.length?'К задачам →':'⏭ Пропустить тест, к задачам →'}</button>${a?'<button class="btn" onclick="teReset()">↺ Заново</button>':''}</div></div>`;
 TEST.forEach((q,i)=>{const an=S.te[i]!==undefined;h+=`<div class="card"><div class="qh"><span class="qn">${i+1}</span><b>${esc(q.q)}</b></div><div class="illbox">${q.ill}</div><div class="opts">${q.o.map((o,j)=>`<button class="opt ${an?(j===q.a?'ok':j===S.te[i]?'bad':'dim'):''}" ${an?'disabled':''} onclick="pick(${i},${j})">${an&&j===q.a?'✅ ':an&&j===S.te[i]?'❌ ':''}${esc(o)}</button>`).join('')}</div>${an?`<div class="why ${S.te[i]===q.a?'ok':'bad'}">${S.te[i]===q.a?'🎉 Верно! ':'🙈 Не совсем. '}${esc(q.why)}</div>`:''}</div>`});
 return h}

/* ===== задачи ===== */
function condHTML(t,sid){return `<div class="cond selzone"><div class="rib"><span>📝 Условие · ${esc(tLabel(t))}</span><span class="tip">🖱️ Выдели слово — покажу, сколько в нём символов</span></div><div class="cb"><div>${hl(t.intro)}</div>${t.extra?`<div style="margin-top:6px">${hl(t.extra)}</div>`:''}${tblHTML(t.table,t.num)}${t.codes.map((c,i)=>`<div class="codeln">🔐 ${t.codes.length>1?`<small>${i+1})</small> `:''}${esc(c)}</div>`).join('')}<div class="qbox">❓ ${hl(t.q)}</div></div></div>`}
function hintSteps(t){const L=t.table.map(p=>strip(p[1]).length),mx=Math.max.apply(null,L),mn=Math.min.apply(null,L),f=t.ans.split('|')[0],H=[];
 const code0=strip(t.codes[0]);
 if(t.kind==='decode'){H.push('📋 Посмотри на таблицу: какие коды короткие, какие длинные? Есть ли коды с одинаковым началом?');if(mx===mn)H.push(`📏 Все коды одной длины (${mx}) — режь цепочку на равные куски.`);H.push('✂️ Открой Резак и режь с начала (или с конца!) так, чтобы каждый кусок был кодом из таблицы.');if(t.nodup)H.push('🙅 Если способов несколько — оставь тот, где буквы не повторяются.');H.push('🌳 Застрял? Раскрой ветки в Дереве вариантов: ✖ — тупик, возвращайся и выбирай другой код.',`🔑 Слово начинается с буквы «${esc(f[0])}».`,`🔑 Начало слова: «${esc(f.slice(0,2))}».`)}
 else if(t.kind==='count'){H.push('📋 Нужно только число букв: разрежь всю цепочку на коды и посчитай куски.','✂️ Режь Резаком, пока цепочка не закончится: один кусок — одна буква.');if(t.nodup)H.push('🙅 Если способов несколько — оставь тот, где буквы не повторяются.');H.push('🌳 Несколько способов? Дерево покажет все разрезания — сравни, сколько в каждом букв.',`🔑 Самый длинный код — ${mx} симв., в цепочке ${code0.length} симв. Значит, букв не меньше ${Math.ceil(code0.length/mx)}.`,`🔑 Ответ лежит между ${Number(f)-1} и ${Number(f)+1}.`)}
 else if(t.kind==='repeat'){H.push('📋 Сначала расшифруй всё сообщение, потом ищи буквы, которые встретились больше одного раза.',`📏 Все коды длиной ${mx} — режь цепочку на равные куски!`,'✂️ Резак поможет: над каждым куском появится буква.');const P=parsesAll(t.table,code0);if(P.length===1)H.push(`🔑 В сообщении ${P[0].length} букв.`);H.push(`🔑 Одна из повторяющихся букв — «${esc(f[0])}».`)}
 else{const idx=t.codes.findIndex(c=>parsesAll(t.table,c).length===1);H.push('📋 Для каждой цепочки узнай, сколько у неё расшифровок. Нужна та, где путь всегда один.');if(t.num)H.push('🔢 Помни: 10–33 может быть одной буквой, а 0 и числа больше 33 — нет. Нуль «прикреплён» к цифре перед ним.');H.push('✂️ Режь Резаком с начала (или с конца). Увидел два варианта — эта цепочка не подходит.','🌳 Дерево вариантов покажет число путей: нужна цепочка, где до конца доходит ровно одна ветка.',`🔑 Нужная цепочка — №${idx+1}.`,`🔑 Слово начинается с буквы «${esc(f[0])}».`)}
 return H}
function hintHTML(t){const n=S.hint[t.id]||0,H=hintSteps(t);if(!n)return '';
 return `<div class="hint"><h4>💡 Подсказки ${n}/${H.length} <small>— чем меньше подсказок, тем лучше!</small></h4>${H.slice(0,n).map((x,i)=>`<div class="hs"><span class="hn2">${i+1}</span><div>${x}</div></div>`).join('')}${n<H.length?`<button class="btn sm" onclick="showHint('${t===cur()?'':'b'}')">Ещё одна подсказка →</button>`:''}</div>`}
function showHint(src){const t=cur(),H=hintSteps(t);if((S.hint[t.id]||0)<H.length){S.hint[t.id]=(S.hint[t.id]||0)+1;save()}
 const hb=$(src==='b'?'bhint':'hintbox');if(hb)hb.innerHTML=hintHTML(t);renderNav();renderTop();const hbt=$('hbtn');if(hbt)hbt.textContent=`💡 Подсказка (${S.hint[t.id]}/${H.length})`}
function taskView(t){const V=vis(),i=V.indexOf(t),done=!!S.done[t.id],hs=S.hint[t.id],H=hintSteps(t);
 return `<div class="card ${done?(hs?'sdh':'sd'):''}"><span class="pill">${t.proto?'★ Прототип':'🔁 Аналог'} · ${i+1} из ${V.length}</span><h2>${SECS[t.sec-1].e} ${esc(SECS[t.sec-1].t)}</h2>${condHTML(t)}
 <div class="ans"><input id="ans" autocomplete="off" placeholder="Твой ответ…" ${done?`value="${esc(t.ans.split('|')[0])}" disabled class="okk"`:''} onkeydown="if(event.key==='Enter')check()"><button class="btn good" ${done?'disabled':''} onclick="check()">✅ Проверить</button><button class="btn" onclick="openBoard()">🖍️ Доска</button></div>
 <div id="fb"></div>${done?`<div class="solvd ${hs?'h':''}">${hs?'💡 Решено с подсказкой':'🎉 Верно! Решено самостоятельно'} · ответ: ${esc(t.ans.split('|')[0])}</div>`:''}
 <div id="hintbox">${hintHTML(t)}</div>
 <div class="row">${done?'':`<button class="btn" id="hbtn" onclick="showHint()">💡 Подсказка (${hs||0}/${H.length})</button>`}<button class="btn" onclick="memoOpen()">📚 Памятки</button><button class="btn" onclick="go('theory')">📖 Лекция</button></div>
 <h3 style="margin:16px 0 0">🧰 Помощники</h3>${wHTML('t_'+t.id)}
 <div class="row"><button class="btn" ${i?'':'disabled'} onclick="nav(-1)">← Назад</button>${done?'':'<button class="btn" onclick="skipTask()">⏭ Пропустить</button>'}<button class="btn pri" onclick="nav(1)">${i<V.length-1?'Дальше →':'К отчёту →'}</button></div></div>`}
function nav(d){const V=vis(),i=V.indexOf(cur()),n=V[i+d];if(n)go('task',n.id);else if(d>0)openReport()}
function skipTask(){const t=cur();if(!S.done[t.id])S.skip[t.id]=1;save();nav(1)}
const norm=s=>String(s).toUpperCase().replace(/Ё/g,'Е').replace(/[^0-9A-ZА-Я]/g,'');
function fb(m,c,id){const e=$(id||'fb');if(e)e.innerHTML=`<div class="fb ${c}">${m}</div>`}
function check(src){const t=cur(),inp=$(src==='b'?'bans':'ans'),fid=src==='b'?'bfb':'fb';const v=norm(inp.value);if(!v){fb('Впиши ответ 🙂','warn',fid);return}
 S.tried[t.id]=(S.tried[t.id]||0)+1;
 if(t.ans.split('|').some(a=>norm(a)===v)){S.done[t.id]=1;delete S.skip[t.id];save();if(!S.hint[t.id])confetti();fb(S.hint[t.id]?'💡 Верно, но с подсказкой. Следующее задание…':'🎉 Верно! Переходим дальше…','ok',fid);renderNav();renderTop();clearTimeout(autoT);autoT=setTimeout(()=>autoNext(src),1800)}
 else{S.err[t.id]=(S.err[t.id]||0)+1;save();fb('❌ Пока не то. Проверь разрезание: каждый кусок — код из таблицы? Можно открыть Резак или Дерево.','bad',fid);renderNav()}}
function autoNext(src){const V=vis(),i=V.indexOf(cur());const nx=V.slice(i+1).concat(V.slice(0,i)).find(t=>!S.done[t.id]);
 if(src==='b'){if(nx){S.cur=nx.id;save();renderBoard();render()}else{closeBoard();openReport()}}else{if(nx)go('task',nx.id);else{render();openReport()}}}
function confetti(){const em=['🎉','✨','⭐'];for(let i=0;i<9;i++){const s=document.createElement('span');s.className='cf';s.textContent=em[i%3];s.style.left=(42+Math.random()*16)+'%';s.style.setProperty('--dx',(Math.random()*160-80)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1100)}}

/* ===== доска ===== */
const BD={color:'#5b6cff',size:3,erase:false,draw:false,lx:0,ly:0,tools:false};
function openBoard(){BD.tools=false;$('board').classList.add('on');renderBoard()}
function closeBoard(){if($('cv'))saveImg();$('board').classList.remove('on')}
function saveImg(){const c=$('cv'),t=cur();if(c&&t)try{UI.img[t.id]=c.toDataURL()}catch(e){}}
function renderBoard(){const t=cur(),V=vis(),i=V.indexOf(t),done=!!S.done[t.id],cols=['#5b6cff','#e5484d','#12a36b','#e89a0c','#1c2540'];
 $('board').innerHTML=`<div class="bw"><div class="btop"><b>🖍️ Доска · задание ${i+1} из ${V.length}</b><button class="btn sm" onclick="closeBoard();render()">✕ Закрыть</button></div>${condHTML(t)}
 <div class="bdraw"><div class="btools">${cols.map(c=>`<button class="sw ${BD.color===c&&!BD.erase?'on':''}" style="background:${c}" onclick="BD.color='${c}';BD.erase=false;renderBoardKeep()"></button>`).join('')}<button class="chip2 ${BD.erase?'on':''}" onclick="BD.erase=!BD.erase;renderBoardKeep()">🧽 Ластик</button><button class="chip2" onclick="BD.size=BD.size>=8?2:BD.size+2">✏️ толщина</button><button class="chip2" onclick="clearCv()">🗑️ Очистить</button></div><div class="bcv"><canvas id="cv"></canvas></div></div>
 <div class="ans" style="margin-top:10px"><input id="bans" autocomplete="off" placeholder="Ответ…" ${done?`value="${esc(t.ans.split('|')[0])}" disabled class="okk"`:''} onkeydown="if(event.key==='Enter')check('b')"><button class="btn good" ${done?'disabled':''} onclick="check('b')">✅ Ответ</button><button class="btn pri" onclick="bnav(1)">Далее →</button></div>
 <div id="bfb"></div><div class="row"><button class="btn" onclick="showHint('b')">💡 Подсказка</button><button class="btn" onclick="memoOpen()">📚 Памятки</button><button class="btn" onclick="closeBoard();go('theory')">📖 Лекция</button><button class="btn" onclick="BD.tools=!BD.tools;renderBoardKeep()">🧰 Помощники</button><button class="btn" onclick="bnav(-1)">← Назад</button></div><div id="bhint">${hintHTML(t)}</div>${BD.tools?wHTML('b_'+t.id):''}</div>`;
 initCv()}
function renderBoardKeep(){saveImg();renderBoard()}
function bnav(d){saveImg();const V=vis(),i=V.indexOf(cur()),n=V[i+d];if(n){S.cur=n.id;save();renderBoard();render()}else if(d>0){closeBoard();openReport()}}
function clearCv(){const c=$('cv');c.getContext('2d').clearRect(0,0,c.width,c.height);delete UI.img[cur().id]}
function initCv(){const c=$('cv');if(!c)return;const r=c.parentElement.getBoundingClientRect();c.width=Math.max(300,r.width);c.height=320;const x=c.getContext('2d');x.lineCap='round';x.lineJoin='round';
 const im=UI.img[cur().id];if(im){const g=new Image();g.onload=()=>x.drawImage(g,0,0);g.src=im}
 const pos=e=>{const b=c.getBoundingClientRect();return[(e.clientX-b.left)*c.width/b.width,(e.clientY-b.top)*c.height/b.height]};
 c.onpointerdown=e=>{BD.draw=true;[BD.lx,BD.ly]=pos(e);c.setPointerCapture(e.pointerId)};
 c.onpointermove=e=>{if(!BD.draw)return;const p=pos(e);x.globalCompositeOperation=BD.erase?'destination-out':'source-over';x.strokeStyle=BD.color;x.lineWidth=BD.erase?BD.size*5:BD.size;x.beginPath();x.moveTo(BD.lx,BD.ly);x.lineTo(p[0],p[1]);x.stroke();BD.lx=p[0];BD.ly=p[1]};
 c.onpointerup=c.onpointercancel=()=>{BD.draw=false;saveImg()}}

/* ===== счётчик символов при выделении ===== */
document.addEventListener('selectionchange',()=>{const sel=window.getSelection(),txt=sel?sel.toString():'',box=$('insp');
 if(!txt||!txt.trim()){box.classList.remove('on');return}
 const a=sel.anchorNode,el=a&&(a.nodeType===3?a.parentElement:a);if(!el||!el.closest||!el.closest('.selzone')){box.classList.remove('on');return}
 let n=(txt.match(/[\p{L}\p{N}]/gu)||[]).length;if(!n)n=txt.replace(/\s/g,'').length;
 box.innerHTML=`🔤 Символов: ${n}<small>без пробелов и знаков препинания</small>`;box.classList.add('on')});

/* ===== учитель ===== */
function openTeacher(){const p=prompt('Код учителя');if(p===null)return;if(p!==S.pin){toast('Неверный код');return}tModal()}
function tModal(){const all=!S.assign;let h=`<h2>👩‍🏫 Режим учителя</h2><div class="card"><label><b>Название домашнего задания:</b></label><div class="ans"><input id="hwn" value="${esc(S.hw)}" placeholder="например: ДЗ на 25.11" style="text-transform:none" oninput="S.hw=this.value;save();renderTop()"></div>
 <div class="row"><button class="btn sm" onclick="tSet('all')">✅ Все</button><button class="btn sm" onclick="tSet('proto')">★ Только прототипы</button><button class="btn sm" onclick="tSet('analog')">🔁 Только аналоги</button><button class="btn sm" onclick="tSet('none')">⬜ Снять всё</button><button class="btn sm" onclick="tPin()">🔑 Сменить код</button></div></div>`;
 SECS.forEach((s,k)=>{const ts=TASKS.filter(t=>t.sec===k+1);h+=`<div class="card"><b>${s.e} ${esc(s.t)}</b>`+ts.map(t=>`<label style="display:block;margin:6px 0"><input type="checkbox" ${inA(t.id)?'checked':''} onchange="tToggle('${t.id}',this.checked)"> ${t.proto?'★ прототип':'🔁 аналог'} — ${esc(strip(t.codes[0]).slice(0,22))}… <small>(ответ: ${esc(t.ans.split('|')[0])})</small></label>`).join('')+'</div>'});
 h+=`<div class="row"><button class="btn pri" onclick="exportFile()">💾 Сохранить файл ученику с этим заданием</button></div><div style="color:var(--mut);font-size:13px;margin-top:6px">Выбрано заданий: ${vis().length} из ${TASKS.length}. Неназначенные скрываются у ученика и в отчёте.</div>`;
 $('mbody').innerHTML=h;$('modal').classList.add('show')}
function tSet(m){S.assign=m==='all'?null:TASKS.filter(t=>m==='proto'?t.proto:m==='analog'?!t.proto:false).map(t=>t.id);save();render();tModal()}
function tToggle(id,on){if(!S.assign)S.assign=TASKS.map(t=>t.id);const i=S.assign.indexOf(id);if(on&&i<0)S.assign.push(id);if(!on&&i>=0)S.assign.splice(i,1);save();render()}
function tPin(){const p=prompt('Новый код учителя',S.pin);if(p){S.pin=p;save();toast('Код изменён')}}
function exportFile(){const d=document.documentElement.cloneNode(true);d.querySelector('#preset').textContent='window.PRESET='+JSON.stringify({assign:S.assign,hw:S.hw,pin:S.pin,sig:String(Date.now())})+';';
 ['view','nav','mbody','board','printArea','insp'].forEach(i=>{const e=d.querySelector('#'+i);if(e)e.innerHTML=''});const m=d.querySelector('#modal');if(m)m.className='';
 const blob=new Blob(['<!DOCTYPE html>\n'+d.outerHTML],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ОГЭ-Информатика-2-'+(S.hw||'задание').replace(/[^\wА-Яа-я-]+/g,'_')+'.html';document.body.appendChild(a);a.click();a.remove();toast('Файл сохранён ✔')}

/* ===== отчёт ===== */
const isMobile=()=>/Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent)||(window.matchMedia&&matchMedia('(pointer:coarse)').matches&&innerWidth<900);
function theoryTxt(){const n=Object.keys(S.thSteps).length,m=Object.keys(S.memo).length;return (S.thDone?`✅ Пройдена (шагов ${n}/${LEC.length})`:S.thSkip?`⏭ Пропущена${n?` (просмотрено шагов: ${n}/${LEC.length})`:''}`:n?`🔵 Просмотрено шагов: ${n}/${LEC.length}`:'⚪ Не открывалась')+' · памятки: '+(S.memoOpen?`открывал(а)${m?`, озвучено ${m}`:''}`:'не открывались')}
function testTxt(){let a=0,ok=0;TEST.forEach((q,i)=>{if(S.te[i]!==undefined){a++;if(S.te[i]===q.a)ok++}});return a===TEST.length?`✅ Пройден: верно ${ok} из ${TEST.length}`:S.teSkip?`⏭ Пропущен${a?` (отвечено ${a}, верно ${ok})`:''}`:a?`🔵 Отвечено ${a}/${TEST.length}, верно ${ok}`:'⚪ Не открывался'}
function counts(){const c={done:0,doneh:0,err:0,skip:0,rest:0,tries:0,hints:0};vis().forEach(t=>{const s=st(t.id);if(s==='done')c.done++;else if(s==='doneh')c.doneh++;else if(s==='err')c.err++;else if(s==='skip')c.skip++;else c.rest++;c.tries+=S.err[t.id]||0;c.hints+=S.hint[t.id]||0});return c}
function repHTML(){const c=counts(),V=vis();
 return `<div class="report lt"><div class="rhead"><div class="rtitle">📊 ${REP_TITLE}</div><div class="rmeta">👤 ${esc(S.name||'Ученик')} · 📅 ${new Date().toLocaleDateString('ru-RU')}${S.hw?' · 📚 '+esc(S.hw):''}</div></div>
 <div class="tiles"><div class="t-g"><b>${c.done}</b>решено сам(а)</div><div class="t-y"><b>${c.doneh}</b>с подсказкой</div><div class="t-r"><b>${c.err}</b>с ошибками</div><div class="t-n"><b>${c.skip}</b>пропущено</div><div class="t-b"><b>${c.rest}</b>не решено</div><div class="t-r"><b>${c.tries}</b>неверных ответов</div><div class="t-y"><b>${c.hints}</b>открыто подсказок</div></div>
 <h3>📚 Теория и тест</h3><div class="rc ${S.thDone?'done':S.thSkip?'skip':'new'}"><b>Теория:</b> ${theoryTxt()}</div><div class="rc ${teDone()?'done':S.teSkip?'skip':'new'}"><b>Тест:</b> ${testTxt()}</div>
 <h3>📝 Задания (${V.length})</h3>${V.map((t,i)=>{const s=st(t.id),H=hintSteps(t).length;return `<div class="rc ${s}"><b>${i+1}. ${esc(tLabel(t))}</b> — ${STL[s]}<br><small>Ошибок: ${S.err[t.id]||0} · 💡 подсказки: ${S.hint[t.id]?`открывал(а) ${S.hint[t.id]} из ${H}`:'не открывал(а)'} · 🧰 помощники: ${S.tool[t.id]?'использовал(а)':'нет'}${S.done[t.id]?' · ответ: '+esc(t.ans.split('|')[0]):''}</small></div>`}).join('')}</div>`}
function repText(){const c=counts(),V=vis();let t=`📊 ${REP_TITLE}\n👤 ${S.name||'Ученик'} · ${new Date().toLocaleDateString('ru-RU')}${S.hw?' · '+S.hw:''}\n\n📚 Теория: ${theoryTxt()}\n🧠 Тест: ${testTxt()}\n\n✅ Сам(а): ${c.done} · 💡 С подсказкой: ${c.doneh} · ❌ С ошибками: ${c.err} · ⏭ Пропущено: ${c.skip} · ⚪ Не решено: ${c.rest}\n\nПо заданиям:\n`;
 V.forEach((x,i)=>{const s=st(x.id);t+=`${i+1}. ${tLabel(x)}: ${STL[s]}; ошибок ${S.err[x.id]||0}; подсказок ${S.hint[x.id]||0}\n`});return t}
function repButtons(){return isMobile()?`<div class="row"><button class="btn pri" onclick="shareRep()">📤 Отправить…</button><button class="btn" onclick="openMsg('tg')">✈️ Telegram</button><button class="btn" onclick="openMsg('wa')">💬 WhatsApp</button><button class="btn" onclick="openMsg('vb')">📞 Viber</button><button class="btn" onclick="copyRep()">📋 Копировать</button></div>`:`<div class="row"><button class="btn pri" onclick="printRep()">📄 Сохранить в PDF (цветной)</button><button class="btn" onclick="copyRep()">📋 Копировать текст</button></div><div style="color:var(--mut);font-size:13px;margin-top:6px">В окне печати выберите «Сохранить как PDF» и включите «Фоновая графика», чтобы сохранились цвета.</div>`}
function openReport(){closeBoard();stopSay();$('mbody').innerHTML=repHTML()+repButtons();$('modal').classList.add('show')}
function printRep(){$('printArea').innerHTML=repHTML();const o=document.title;document.title=`Задание 2 ОГЭ Информатика — отчёт — ${S.name||'ученик'} — ${new Date().toLocaleDateString('ru-RU')}`;window.print();setTimeout(()=>{document.title=o},800)}
function shareRep(){if(navigator.share)navigator.share({title:REP_TITLE,text:repText()}).catch(()=>{});else copyRep()}
function openMsg(k){const t=encodeURIComponent(repText()),u={tg:'https://t.me/share/url?url=%20&text='+t,wa:'https://wa.me/?text='+t,vb:'viber://forward?text='+t}[k];window.open(u,'_blank')}
function copyRep(){const t=repText();const fallback=()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();toast('Отчёт скопирован ✔')};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('Отчёт скопирован ✔'),fallback);else fallback()}

render();
</script>
</body>
