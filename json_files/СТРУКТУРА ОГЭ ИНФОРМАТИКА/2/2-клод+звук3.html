function parsesAll(table,code){const tb=table.map(p=>[p[0],strip(p[1])]),res=[];
 (function rec(i,acc){if(i===code.length){res.push(acc.slice());return}tb.forEach(p=>{if(p[1]&&code.startsWith(p[1],i)){acc.push(p[0]);rec(i+p[1].length,acc);acc.pop()}})})(0,[]);return res}
function codeMap(table){const m={};table.forEach(p=>{const k=strip(p[1]);(m[k]=m[k]||[]).push(p[0])});return m}

/* ===== иллюстрации ===== */
function ilMap(pairs){return '<div class="ill">'+pairs.map(p=>`<div class="map"><b>${esc(p[0])}</b><i>→</i><code>${esc(p[1])}</code></div>`).join('')+'</div>'}
function ilCut(code,cuts,letters){const c=Array.from(code),b=[0].concat(cuts,[c.length]);let h='<div class="cutrow">';
 for(let k=0;k<b.length-1;k++){const l=letters[k];h+=`<div class="seg"><div class="lt ${l&&l!=='?'?'ok':'bad'}">${esc(l||'?')}</div><div class="sy">${c.slice(b[k],b[k+1]).map(x=>`<span class="s">${esc(x)}</span>`).join('')}</div></div>`;if(k<b.length-2)h+='<div class="cutbar"></div>'}
 return h+'</div>'}
function tblHTML(table,num){const chunk=num?11:table.length;let h='';
 for(let i=0;i<table.length;i+=chunk){const part=table.slice(i,i+chunk);h+=`<table class="ct"><tr><th>Буква</th>${part.map(p=>`<td class="L">${esc(p[0])}</td>`).join('')}</tr><tr><th>${num?'Номер':'Код'}</th>${part.map(p=>`<td class="C">${esc(p[1])}</td>`).join('')}</tr></table>`}
 return `<div class="ctw">${h}</div>`}
function hl(s){const re=/(\d+|наименьш\p{L}*|скольк\p{L}*|не повторя\p{L}*|повторя\p{L}*|единственн\p{L}*|только одн\p{L}*|без запятых|без пробелов)/giu;let out='',last=0,m;
 while((m=re.exec(s))){out+=esc(s.slice(last,m.index));out+=`<span class="${/^\d/.test(m[0])?'hn':'hk'}">${esc(m[0])}</span>`;last=m.index+m[0].length}
 return (out+esc(s.slice(last))).replace(/\n/g,'<br>')}

function U(key){return UI.w[key]||(UI.w[key]={tab:REG[key].tabs==='tree'?'tree':'cut',ci:0,mode:'free',cuts:[],dir:'start',exp:{},total:false})}
function wRedraw(key){const el=$('w_'+key);if(el)el.outerHTML=wHTML(key)}
function markTool(key){if(/^[tb]_/.test(key)){S.tool[key.slice(2)]=1;save()}}
function wSet(key,p,v){if(p==='tab'&&v==='tree'){openTree(key);return}const w=U(key);w[p]=v;if(p==='ci'){w.cuts=[];w.exp={};w.total=false}if(p==='mode')w.cuts=[];if(p==='dir'){w.exp={};w.total=false}markTool(key);wRedraw(key)}
function wCut(key,g){const w=U(key),i=w.cuts.indexOf(g);if(i>=0)w.cuts.splice(i,1);else w.cuts.push(g);w.cuts.sort((a,b)=>a-b);markTool(key);wRedraw(key)}
function wExp(key,p){const w=U(key);w.exp[p]=!w.exp[p];w.total=false;markTool(key);wRedraw(key);if(w.exp[p])treeSay(key,p)}
function wCollapse(key){const w=U(key);w.exp={};w.total=false;wRedraw(key)}
function treeKids(key,n){const w=U(key),R=REG[key],code=sym(R.codes[w.ci]).join(''),rev=w.dir==='end',rem=rev?code.slice(0,code.length-n.pos):code.slice(n.pos),o=[];
 R.table.forEach(p=>{const c=strip(p[1]);if(c&&(rev?rem.endsWith(c):rem.startsWith(c)))o.push({l:p[0],c:c,pos:n.pos+c.length,word:rev?p[0]+n.word:n.word+p[0]})});return o}
function wAll(key){const w=U(key);w.exp={};w.total=true;(function r(n,p){const ks=treeKids(key,n);if(ks.length){w.exp[p]=true;ks.forEach((k,i)=>r(k,p+'.'+i))}})({pos:0,word:''},'r');markTool(key);wRedraw(key)}
function cutHTML(key){const w=U(key),R=REG[key],code=sym(R.codes[w.ci]),n=code.length,cuts=w.cuts.slice().sort((a,b)=>a-b),cm=codeMap(R.table),b=[0].concat(cuts,[n]);
 const last=cuts.length?cuts[cuts.length-1]:0,first=cuts.length?cuts[0]:n;
 const gapOk=g=>w.mode==='free'||(w.mode==='start'&&g>last)||(w.mode==='end'&&g<first);
 const barOk=g=>w.mode==='free'||(w.mode==='start'&&g===last)||(w.mode==='end'&&g===first);
 let h='<div class="cutrow">',word='',all=true;
 for(let k=0;k<b.length-1;k++){const seg=code.slice(b[k],b[k+1]).join(''),L=cm[seg],open=(w.mode==='start'&&k===b.length-2)||(w.mode==='end'&&k===0);

function hintSteps(t){const L=t.table.map(p=>strip(p[1]).length),mx=Math.max.apply(null,L),mn=Math.min.apply(null,L),f=t.ans.split('|')[0],H=[];
 const code0=strip(t.codes[0]);
 if(t.kind==='decode'){H.push('📋 Посмотри на таблицу: какие коды короткие, какие длинные? Есть ли коды с одинаковым началом?');if(mx===mn)H.push(`📏 Все коды одной длины (${mx}) — режь цепочку на равные куски.`);H.push('✂️ Открой Резак и режь с начала (или с конца!) так, чтобы каждый кусок был кодом из таблицы.');if(t.nodup)H.push('🙅 Если способов несколько — оставь тот, где буквы не повторяются.');H.push('🌳 Застрял? Раскрой ветки в Дереве вариантов: ✖ — тупик, возвращайся и выбирай другой код.',`🔑 Слово начинается с буквы «${esc(f[0])}».`,`🔑 Начало слова: «${esc(f.slice(0,2))}».`)}
 else if(t.kind==='count'){H.push('📋 Нужно только число букв: разрежь всю цепочку на коды и посчитай куски.','✂️ Режь Резаком, пока цепочка не закончится: один кусок — одна буква.');if(t.nodup)H.push('🙅 Если способов несколько — оставь тот, где буквы не повторяются.');H.push('🌳 Несколько способов? Дерево покажет все разрезания — сравни, сколько в каждом букв.',`🔑 Самый длинный код — ${mx} симв., в цепочке ${code0.length} симв. Значит, букв не меньше ${Math.ceil(code0.length/mx)}.`,`🔑 Ответ лежит между ${Number(f)-1} и ${Number(f)+1}.`)}
 else if(t.kind==='repeat'){H.push('📋 Сначала расшифруй всё сообщение, потом ищи буквы, которые встретились больше одного раза.',`📏 Все коды длиной ${mx} — режь цепочку на равные куски!`,'✂️ Резак поможет: над каждым куском появится буква.');const P=parsesAll(t.table,code0);if(P.length===1)H.push(`🔑 В сообщении ${P[0].length} букв.`);H.push(`🔑 Одна из повторяющихся букв — «${esc(f[0])}».`)}
 else{const idx=t.codes.findIndex(c=>parsesAll(t.table,c).length===1);H.push('📋 Для каждой цепочки узнай, сколько у неё расшифровок. Нужна та, где путь всегда один.');if(t.num)H.push('🔢 Помни: 10–33 может быть одной буквой, а 0 и числа больше 33 — нет. Нуль «прикреплён» к цифре перед ним.');H.push('✂️ Режь Резаком с начала (или с конца). Увидел два варианта — эта цепочка не подходит.','🌳 Дерево вариантов покажет число путей: нужна цепочка, где до конца доходит ровно одна ветка.',`🔑 Нужная цепочка — №${idx+1}.`,`🔑 Слово начинается с буквы «${esc(f[0])}».`)}
 return H}

function wRedraw(key){const el=$('w_'+key);if(!el)return;const tr=el.querySelector('.tree'),sl=tr?tr.scrollLeft:0,sy=tr?tr.scrollTop:0;el.outerHTML=wHTML(key);const n=$('w_'+key).querySelector('.tree');if(n){if(sl>0){n.scrollLeft=sl;n.scrollTop=sy;n.dataset.done=1}else centerTrees()}}
function treeAttempts(key,n){const w=U(key),R=REG[key],code=sym(R.codes[w.ci]).join(''),rev=w.dir==='end',rem=rev?code.slice(0,code.length-n.pos):code.slice(n.pos);
 const ks=treeKids(key,n);ks.forEach(k=>{k.len=k.c.length});const out=ks.slice();
 if(R.num)[1,2].forEach(len=>{if(rem.length>=len&&!ks.some(k=>k.len===len)){const piece=rev?rem.slice(rem.length-len):rem.slice(0,len);if(len===2&&piece[0]==='0')return;out.push({bad:1,c:piece,len:len,why:piece[0]==='0'?'нет буквы с номером 0':(Number(piece)>33?piece+'>33':'нет такого кода')})}});
 out.sort((a,b)=>a.len-b.len);return{rem:rem,list:out}}
function treeHTML(key){const w=U(key),R=REG[key],code=sym(R.codes[w.ci]).join(''),rev=w.dir==='end';
 const NW=210,NH=50,GX=10,GY=30;let leaf=0,maxd=0;const nodes=[],edges=[];
 function build(n,p,d){n.p=p;n.d=d;const a=treeAttempts(key,n);n.rem=a.rem;n.fin=n.pos===code.length;n.kids=a.list.filter(x=>!x.bad).length;n.open=p==='r'||!!w.exp[p];n.ch=[];
  if(n.open)a.list.forEach((k,i)=>{const c={l:k.l,c:k.c,pos:k.pos,word:k.word};if(k.bad){c.p=p+'.'+i;c.d=d+1;c.isbad=1;c.why=k.why;c.ch=[];c.open=false}else build(c,p+'.'+i,d+1);n.ch.push(c)});return n}
 const root=build({pos:0,word:''},'r',0);
 (function place(n){maxd=Math.max(maxd,n.d);if(n.ch.length){n.ch.forEach(place);n.x=(n.ch[0].x+n.ch[n.ch.length-1].x)/2}else{n.x=leaf*(NW+GX);leaf++}})(root);
 (function walk(n){nodes.push(n);n.ch.forEach(c=>{edges.push([n,c]);walk(c)})})(root);
 const W=Math.max(NW,leaf*(NW+GX)-GX),H=(maxd+1)*(NH+GY)-GY,top=n=>n.d*(NH+GY);
 const nh=n=>{const sty=`left:${n.x}px;top:${top(n)}px;width:${NW}px;height:${NH}px`;
  if(n.p==='r')return `<div class="bn root" style="${sty}"><b>🔐 ${esc(code)}</b><small>${rev?'← идём с конца':'идём с начала →'}</small></div>`;
  if(n.isbad)return `<div class="bn bad" style="${sty}"><b>${esc(n.c)} → ? нет</b><small>(${esc(n.why)})</small></div>`;
  const cls=n.fin?'fin':(!n.kids?'dead':''),tail=n.fin?'✅ слово готово':!n.kids?'✖ тупик':n.open?'':'➕ раскрыть';
  return `<button class="bn ${cls}" style="${sty}" onclick="wExp('${key}','${n.p}')"><b>${esc(n.c)} → ${esc(n.l)} · ГОТОВО: ${esc(n.word)}</b><small>${n.fin?'':'осталось: '+esc(n.rem)+' · '}${tail}</small></button>`};
 const paths=edges.map(e=>{const a=e[0],b=e[1],x1=a.x+NW/2,y1=top(a)+NH,x2=b.x+NW/2,y2=top(b)-3;return `<path d="M${x1} ${y1} C${x1} ${y1+GY/2} ${x2} ${y2-GY/2} ${x2} ${y2}" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#ar_${key})"/>`}).join('');
 let h=`<div class="wmode"><button class="chip2 ${!rev?'on':''}" onclick="wSet('${key}','dir','start')">→ С начала</button><button class="chip2 ${rev?'on':''}" onclick="wSet('${key}','dir','end')">← С конца</button><button class="chip2" onclick="wAll('${key}')">🌲 Раскрыть всё</button><button class="chip2" onclick="wCollapse('${key}')">↩︎ Свернуть</button></div><div class="tree"><div class="tcv" style="width:${W}px;height:${H}px;margin:0 auto"><svg width="${W}" height="${H}"><defs><marker id="ar_${key}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>${paths}</svg>${nodes.map(nh).join('')}</div></div><div class="tleg">🟩 готово · 🟥 нет кода / тупик · ➕ нажми на ветку, чтобы раскрыть варианты</div>`;
 if(w.total){const P=parsesAll(R.table,code);h+=`<div class="wsum">Полных расшифровок: <b>${P.length}</b>${P.length?' → '+P.map(x=>esc(x.join(''))+' ('+x.length+' букв)').join(', '):''}</div>`}
 return h}

/* доска-модалка */
function openBoard(){BD.tools=false;BD.pane='draw';BD.tid=null;$('board').classList.add('on');renderBoard()}
function bPane(p){saveImg();BD.pane=p;renderBoard()}
function lecBoardHTML(){const i=Math.min(S.step,LEC.length-1),s=LEC[i];S.thSteps[i]=1;save();
 return `<span class="pill">📖 Шаг ${i+1} из ${LEC.length}</span><h2><span class="e">${s.e}</span>${s.h}</h2>${s.draw?`<div class="illbox">${s.draw()}</div>`:''}<div class="tx">${s.t}</div>${s.demo?`<div>${wHTML(s.demo)}</div>`:''}<div class="vbar"><button class="btn sm pri say" onclick="sayLec(${i},this)">🔊 Послушать</button>${speedUI()}</div><div class="row"><button class="btn" ${i?'':'disabled'} onclick="bLec(-1)">← Назад</button><button class="btn pri" ${i<LEC.length-1?'':'disabled'} onclick="bLec(1)">Дальше →</button></div>`}
function bLec(d){stopSay();S.step=Math.max(0,Math.min(LEC.length-1,S.step+d));save();renderBoard()}
function renderBoard(){const t=cur(),V=vis(),i=V.indexOf(t);if(BD.tid!==t.id){BD.pane='draw';BD.tid=t.id}
 const done=!!S.done[t.id],cols=['#5b6cff','#e5484d','#12a36b','#e89a0c','#1c2540'],prev=$('bans')?$('bans').value:'',n=S.hint[t.id]||0,H=hintSteps(t),hid=!!UI.hh[t.id];let body;
 if(BD.pane==='draw')body=`<div class="bleft">${n&&hid?hintHTML(t,'b'):''}<div class="btools2">${cols.map(c=>`<button class="sw ${BD.color===c&&!BD.erase?'on':''}" style="background:${c}" onclick="BD.color='${c}';BD.erase=false;renderBoardKeep()"></button>`).join('')}<button class="chip2 ${BD.erase?'on':''}" onclick="BD.erase=!BD.erase;renderBoardKeep()">🧽 Ластик</button><button class="chip2" onclick="BD.size=BD.size>=8?2:BD.size+2;toast('Толщина: '+BD.size)">✏️ толщина</button><button class="chip2" onclick="clearCv()">🗑️ Очистить</button></div><div class="bcvw"><canvas id="cv"></canvas></div></div>${n&&!hid?`<div class="bright">${hintHTML(t,'b')}</div>`:''}`;
 else if(BD.pane==='tools')body=`<div class="bpane"><h3 style="margin-top:0">🧰 Помощники</h3>${wHTML('b_'+t.id)}</div>`;
 else if(BD.pane==='memo')body=`<div class="bpane"><h3 style="margin-top:0">📚 Памятки</h3>${memoHTML()}</div>`;
 else body=`<div class="bpane">${lecBoardHTML()}</div>`;
 const pb=(p,e,l)=>`<button class="btn sm ${BD.pane===p?'pri':''}" onclick="bPane('${p}')">${e} ${l}</button>`;
 $('board').innerHTML=`<div class="bmod"><div class="btop2"><b>🖍️ Доска · задание ${i+1} из ${V.length}</b>${BD.pane!=='draw'?`<button class="btn sm pri" onclick="bPane('draw')">🖍️ Вернуться на доску</button>`:''}<button class="btn sm" onclick="closeBoard();render()">✕ Закрыть</button></div><div class="bcondw">${condHTML(t)}</div><div class="bbody">${body}</div>
 <div class="bbar"><input id="bans" class="ba" autocomplete="off" placeholder="Ответ…" ${done?`value="${esc(t.ans.split('|')[0])}" disabled`:''} onkeydown="if(event.key==='Enter')check('b')"><button class="btn good" ${done?'disabled':''} onclick="check('b')">✅ Ответ</button><span class="bfb" id="bfb"></span><span class="bsp"></span>${pb('draw','🖍️','Доска')}<button class="btn sm" onclick="showHint('b')">💡 Подсказка (${n}/${H.length})</button>${n?`<button class="btn sm" onclick="hintToggle('${t.id}','b')">${hid?'👁 Показать':'🙈 Скрыть'}</button>`:''}${pb('tools','🧰','Помощники')}${pb('memo','📚','Памятки')}${pb('lec','📖','Лекция')}<button class="btn" ${i?'':'disabled'} onclick="bnav(-1)">← Назад</button><button class="btn pri" onclick="bnav(1)">Далее →</button></div></div>`;
 if(!done&&prev&&$('bans'))$('bans').value=prev;
 if(BD.pane==='draw')initCv();centerTrees()}
function initCv(){const c=$('cv');if(!c)return;const p=c.parentElement;c.width=Math.max(300,p.clientWidth);c.height=Math.max(200,p.clientHeight);const x=c.getContext('2d');x.lineCap='round';x.lineJoin='round';
 const im=UI.img[cur().id];if(im){const g=new Image();g.onload=()=>x.drawImage(g,0,0);g.src=im}
 const pos=e=>{const b=c.getBoundingClientRect();return[(e.clientX-b.left)*c.width/b.width,(e.clientY-b.top)*c.height/b.height]};
 c.onpointerdown=e=>{BD.draw=true;[BD.lx,BD.ly]=pos(e);c.setPointerCapture(e.pointerId)};
 c.onpointermove=e=>{if(!BD.draw)return;const q=pos(e);x.globalCompositeOperation=BD.erase?'destination-out':'source-over';x.strokeStyle=BD.color;x.lineWidth=BD.erase?BD.size*5:BD.size;x.beginPath();x.moveTo(BD.lx,BD.ly);x.lineTo(q[0],q[1]);x.stroke();BD.lx=q[0];BD.ly=q[1]};
 c.onpointerup=c.onpointercancel=()=>{BD.draw=false;saveImg()}}

/* отчёт: условие целиком, по левому краю */
function repCond(t){return `<div class="rcond"><div>${hl(t.intro)}</div>${t.extra?`<div>${hl(t.extra)}</div>`:''}${tblHTML(t.table,t.num)}${t.codes.map((c,i)=>`<div class="codeln" style="font-size:18px">🔐 ${t.codes.length>1?(i+1)+') ':''}${esc(c)}</div>`).join('')}<div class="qbox">❓ ${hl(t.q)}</div></div>`}
function repHTML(){const c=counts(),V=vis();
 return `<div class="report lt"><div class="rhead"><div class="rtitle">📊 ${REP_TITLE}</div><div class="rmeta">👤 ${esc(S.name||'Ученик')} · 📅 ${new Date().toLocaleDateString('ru-RU')}${S.hw?' · 📚 '+esc(S.hw):''}</div></div>
 <div class="tiles"><div class="t-g"><b>${c.done}</b>решено сам(а)</div><div class="t-y"><b>${c.doneh}</b>с подсказкой</div><div class="t-r"><b>${c.err}</b>с ошибками</div><div class="t-n"><b>${c.skip}</b>пропущено</div><div class="t-b"><b>${c.rest}</b>не решено</div><div class="t-r"><b>${c.tries}</b>неверных ответов</div><div class="t-y"><b>${c.hints}</b>открыто подсказок</div></div>
 <h3>📚 Теория и тест</h3><div class="rc ${S.thDone?'done':S.thSkip?'skip':'new'}"><b>Теория:</b> ${theoryTxt()}</div><div class="rc ${teDone()?'done':S.teSkip?'skip':'new'}"><b>Тест:</b> ${testTxt()}</div>
 <h3>📝 Задания (${V.length})</h3>${V.map((t,i)=>{const s=st(t.id),H=hintSteps(t).length;return `<div class="rc ${s}"><div class="rch"><b>${i+1}. ${esc(tLabel(t))}${S.assign&&inA(t.id)?' 📌':''}</b><span class="rst">${STL[s]}</span></div>${repCond(t)}<div class="rmeta2">❌ Ошибок: ${S.err[t.id]||0} · 💡 подсказки: ${S.hint[t.id]?`открывал(а) ${S.hint[t.id]} из ${H}`:'не открывал(а)'} · 🧰 помощники: ${S.tool[t.id]?'использовал(а)':'нет'} · ✅ верный ответ: ${esc(t.ans.split('|')[0])}</div></div>`}).join('')}</div>`}

/* ===== v3 ===== */
const today=()=>new Date().toLocaleDateString('ru-RU');
let TM=null;
if(window.SAVED&&window.SAVED.img)Object.assign(UI.img,window.SAVED.img);
(function(){const d=document.createElement('div');d.id='tmodal';document.body.appendChild(d)})();

/* тест: автопереход к задачам */
function pick(i,j){if(S.te[i]!==undefined)return;S.te[i]=j;if(j===TEST[i].a)confetti();save();const y=window.scrollY;render();window.scrollTo(0,y);
 if(TEST.every((q,k)=>S.te[k]!==undefined)){S.teSkip=false;save();toast('Тест пройден! Переходим к задачам…');setTimeout(()=>{if(S.view!=='test')return;const V=vis(),t=V.find(x=>!S.done[x.id])||V[0];if(t)go('task',t.id)},2500)}}

/* плашки ДЗ слева сверху */
function hwSet(v){S.hwOn=v;save();render()}
function renderTop(){const V=vis(),d=V.filter(t=>S.done[t.id]).length;$('pb').style.width=(V.length?d/V.length*100:0)+'%';$('whoBtn').textContent='👤 '+(S.name||'Имя');$('ptxt').textContent=d+'/'+V.length;
 const hb=$('hwbar');if(hb){if(S.assign){hb.innerHTML=`<div class="hwchips"><button class="hwchip ${S.hwOn?'on':''}" title="${esc(S.hw||'')}" onclick="hwSet(true)">📌 ДЗ от ${esc(S.hwDate||today())}</button><button class="hwchip ${S.hwOn?'':'on'}" onclick="hwSet(false)">📚 Все задачи</button></div>`}else hb.innerHTML=''}}

/* сохранённые ДЗ */
function hwListHTML(){const L=S.hwList||[];return `<div class="card"><b>🗂 Сохранённые ДЗ</b><div class="row"><button class="btn sm pri" onclick="hwSave()">💾 Сохранить текущее ДЗ в список</button></div>${L.length?L.map((x,i)=>`<div class="hwrow"><span>📌 ${esc(x.name)} <small>· ${esc(x.date)} · задач: ${x.assign.length}</small></span><button class="btn sm" onclick="hwLoad(${i})">▶ Загрузить</button><button class="btn sm" onclick="hwDel(${i})">🗑 Удалить</button></div>`).join(''):'<div style="color:var(--mut);font-size:13px">Пока пусто. Выберите задачи выше и нажмите «Сохранить».</div>'}</div>`}
function hwSave(){if(!S.assign||!S.assign.length){toast('Сначала выберите задачи');return}if(!S.hwList)S.hwList=[];const date=S.hwDate||today(),name=(S.hw||'').trim()||'ДЗ от '+date,x={name:name,date:date,assign:S.assign.slice()},k=S.hwList.findIndex(y=>y.name===name);if(k>=0)S.hwList[k]=x;else S.hwList.push(x);save();tModal();toast('ДЗ сохранено в список ✔')}
function hwLoad(i){const x=(S.hwList||[])[i];if(!x)return;S.assign=x.assign.slice();S.hw=x.name;S.hwDate=x.date;S.hwOn=true;save();render();tModal();toast('ДЗ загружено ✔')}
function hwDel(i){if(!S.hwList)return;S.hwList.splice(i,1);save();tModal()}

/* дерево — отдельная модалка */
function openTree(key){TM=key;markTool(key);$('tmodal').innerHTML=`<div class="tmbox"><div class="tmhead"><button class="btn pri" onclick="closeTree()">← Назад к заданию</button><b style="flex:1">🌳 Дерево вариантов</b><button class="btn sm" id="tvb" onclick="treeVoiceToggle()"></button><button class="btn sm" onclick="closeTree()">✕</button></div><div class="tmbody" id="tmbody"></div></div>`;$('tmodal').classList.add('on');tvLabel();tmDraw(false);treeSpeak('Строим дерево вариантов. Нажимай на ветки, и я буду рассказывать каждый шаг.')}
function closeTree(){try{speechSynthesis.cancel()}catch(e){}const k=TM;TM=null;$('tmodal').classList.remove('on');$('tmodal').innerHTML='';if(k)wRedraw(k)}
function treeVoiceToggle(){S.treeVoice=S.treeVoice===false;save();tvLabel();if(S.treeVoice===false){try{speechSynthesis.cancel()}catch(e){}}}
function tvLabel(){const b=$('tvb');if(b)b.textContent=S.treeVoice===false?'🔇 Звук выкл':'🔊 Звук вкл'}
function tmDraw(sc){if(!TM)return;const key=TM,R=REG[key],w=U(key),b=$('tmbody');if(!b)return;const old=b.querySelector('.tree'),sl=old?old.scrollLeft:0,st=b.scrollTop;
 const m=/^[tb]_(.+)$/.exec(key),t=m?TASKS.find(x=>x.id===m[1]):null;
 let h=t?condHTML(t):`<div class="cond"><div class="rib"><span>📋 Таблица кодов</span></div><div class="cb">${tblHTML(R.table,R.num)}${R.codes.map(c=>`<div class="codeln">🔐 ${esc(c)}</div>`).join('')}</div></div>`;
 if(R.codes.length>1)h+='<div class="csel" style="margin-top:8px">'+R.codes.map((c,i)=>`<button class="chip2 ${i===w.ci?'on':''}" onclick="wSet('${key}','ci',${i})">${i+1}) ${esc(c)}</button>`).join('')+'</div>';
 h+='<div class="wg" style="margin-top:10px">'+treeHTML(key)+'</div>';b.innerHTML=h;
 const nt=b.querySelector('.tree');if(nt){if(sl>0){nt.scrollLeft=sl;nt.dataset.done=1}else centerTrees()}
 if(sc){const l=b.querySelector('.tleg')||nt;setTimeout(()=>{if(l)l.scrollIntoView({behavior:'smooth',block:'end'})},40)}else b.scrollTop=st}
function wRedraw(key){if(TM===key){tmDraw(true);return}const el=$('w_'+key);if(!el)return;const tr=el.querySelector('.tree'),sl=tr?tr.scrollLeft:0,sy=tr?tr.scrollTop:0;el.outerHTML=wHTML(key);const n=$('w_'+key).querySelector('.tree');if(n){if(sl>0){n.scrollLeft=sl;n.scrollTop=sy;n.dataset.done=1}else centerTrees()}}

/* озвучка шагов дерева */
function cs(c){c=String(c);if(/^[.o]+$/.test(c))return c.split('').map(x=>x==='.'?'точка':'кружок').join(' ');return c}
function treeSpeak(text){if(S.treeVoice===false||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ru-RU';const v=speechSynthesis.getVoices().find(x=>/^ru/i.test(x.lang));if(v)u.voice=v;u.rate=Number(S.rate)||1.5;speechSynthesis.speak(u)}catch(e){}}
function treeSay(key,p){try{const R=REG[key],w=U(key),code=sym(R.codes[w.ci]).join('');let n={pos:0,word:''};const idx=p.split('.').slice(1).map(Number);
 for(let q=0;q<idx.length;q++){const a=treeAttempts(key,n).list[idx[q]];if(!a||a.bad)return;n={l:a.l,c:a.c,pos:a.pos,word:a.word}}
 const A=treeAttempts(key,n),kids=A.list.filter(x=>!x.bad).length;
 if(n.pos===code.length)treeSpeak('Берём код '+cs(n.c)+' — это буква '+n.l+'. Слово готово: '+n.word+'. Это полная расшифровка!');
 else if(!kids)treeSpeak('Берём код '+cs(n.c)+' — буква '+n.l+'. Получилось '+n.word+'. Осталось '+cs(A.rem)+', но для этого остатка нет подходящего кода. Это тупик, вернёмся назад.');
 else treeSpeak('Берём код '+cs(n.c)+' — это буква '+n.l+'. Получилось '+n.word+'. Осталось разобрать '+cs(A.rem)+'. Дальше вариантов: '+kids+'.')}catch(e){}}
function treeSayAll(key){try{const R=REG[key],w=U(key),code=sym(R.codes[w.ci]).join(''),P=parsesAll(R.table,code);treeSpeak('Дерево раскрыто целиком. Полных расшифровок: '+P.length+(P.length===1?'. Это слово '+P[0].join('')+'.':'.'))}catch(e){}}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button');if(!b)return;const o=b.getAttribute('onclick')||'';if(o.indexOf("wAll('")===0){const k=o.split("'")[1];setTimeout(()=>treeSayAll(k),50)}});

/* сохранить приложение со всем прогрессом */
function saveApp(){const d=document.documentElement.cloneNode(true);const sv=d.querySelector('#saved');if(sv)sv.textContent='window.SAVED='+JSON.stringify({stamp:Date.now(),data:S,img:UI.img}).split('<').join('\\u003c')+';';
 ['view','nav','mbody','board','printArea','insp','hwbar','side','tmodal'].forEach(i=>{const e=d.querySelector('#'+i);if(e)e.innerHTML=''});['modal','tmodal'].forEach(i=>{const m=d.querySelector('#'+i);if(m)m.className=''});
 const blob=new Blob(['<!DOCTYPE html>\n'+d.outerHTML],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ОГЭ-Информатика-2-прогресс-'+(S.name||'ученик').replace(/[^0-9A-Za-zА-Яа-я-]+/g,'_')+'-'+today()+'.html';document.body.appendChild(a);a.click();a.remove();toast('Приложение с прогрессом сохранено ✔')}

/* имя при первом запуске */
function askName(){$('mbody').innerHTML=`<h2>👋 Привет!</h2><div style="margin:6px 0">Как тебя зовут? Имя попадёт в отчёт для учителя.</div><div class="ans"><input id="nm" autocomplete="off" placeholder="Имя и фамилия" style="text-transform:none" onkeydown="if(event.key==='Enter')saveName()"><button class="btn pri" onclick="saveName()">Поехали →</button></div>`;$('modal').classList.add('show');setTimeout(()=>{const i=$('nm');if(i)i.focus()},100)}
function saveName(){const v=($('nm').value||'').trim();if(!v){toast('Впиши имя 🙂');return}S.name=v;save();closeModal();render()}

render();
if(!S.name)askName();
