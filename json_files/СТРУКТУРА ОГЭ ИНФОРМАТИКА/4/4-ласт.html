const GRAPH_THEORY=`<h3>Графы и кратчайшие пути</h3>
<p><b>Граф</b> — это модель, состоящая из вершин и рёбер. В этой задаче вершины — населённые пункты, рёбра — дороги.</p>
<p><b>Вес ребра</b> — число, обозначающее длину дороги. Длина маршрута равна сумме весов всех пройденных дорог.</p>
<p><b>Матрица смежности:</b> строки и столбцы соответствуют вершинам. Число в ячейке показывает длину дороги, пустая ячейка означает отсутствие прямой дороги.</p>
<p><b>Кратчайший путь</b> — маршрут с наименьшей суммой весов. Во взвешенных графах с неотрицательными весами можно применять алгоритм Дейкстры.</p>
<p>Внимательно читай ограничения: пройти через нужную вершину; не заходить в запрещённую; не посещать вершину повторно; не проходить по одному ребру дважды. Это разные условия.</p>`;
const SECTIONS=[{id:'graphs',title:'Задание 4. Графы и кратчайшие пути',ids:[25,33,26,34,41,27,35,28,36,40,29,37,30,38,31,39,32,42],theory:GRAPH_THEORY}];

}
function theoryPick(qi,choice){
 const q=THEORY_Q[state.section][qi];
 state.theoryAnswers[state.section]??={};state.theoryAnswers[state.section][qi]=choice;save();
 q.o.forEach((_,j)=>{const el=$(`theoryOption${qi}_${j}`);if(el)el.classList.remove('correct','incorrect','right-answer');});
 const selected=$(`theoryOption${qi}_${choice}`);
 if(choice===q.a){selected?.classList.add('correct');$(`theoryFeedback${qi}`).innerHTML='<span class="theory-ok">✓ Верно!</span>';}
 else{selected?.classList.add('incorrect');$(`theoryOption${qi}_${q.a}`)?.classList.add('right-answer');$(`theoryFeedback${qi}`).innerHTML=`<span class="theory-no">✕ Пока неверно.</span> Правильный ответ: <b>${escapeHtml(q.o[q.a])}</b>`;}
}
function checkTheory(){
 const qs=THEORY_Q[state.section];let missing=[];let wrong=[];
 for(let i=0;i<qs.length;i++){let x=document.querySelector(`input[name="tq${i}"]:checked`);if(!x)missing.push(i+1);else if(Number(x.value)!==qs[i].a)wrong.push(i+1);}
 if(!missing.length&&!wrong.length){state.theoryPassed[state.section]=true;state.current=firstPendingMain(state.section);state.forceTaskView=false;save();render();window.scrollTo(0,0);}
 else{$('theoryFeedback').innerHTML=`<span style="color:var(--bad)">Пока не все ответы верны.</span> ${missing.length?'Ответь на вопросы: '+missing.join(', ')+'. ':''}${wrong.length?'Исправь вопросы: '+wrong.join(', ')+'.':''}`;}
}
const freshState=(name='Ученик 1')=>({name,section:'graphs',current:25,done:{},skipped:{},attempts:{},hintUsed:{},answers:{},scratch:{},visited:{},theoryAnswers:{},repairPassed:{},theoryPassed:{},repairFor:null,repairQueue:[],repairOrigin:null,forceTaskView:false,graphOpen:{},graphPositions:{},graphDrawings:{},graphZoom:{}});

try{let stored=localStorage.getItem('oge_task1_v5')||localStorage.getItem('oge_task1_v4');let old=stored?JSON.parse(stored):(window.__OGE_EMBEDDED_STATE__||null);if(old)state={...freshState(old.name||'Ученик 1'),...old,section:'graphs',repairQueue:Array.isArray(old.repairQueue)?old.repairQueue:[],graphOpen:old.graphOpen||{},graphPositions:old.graphPositions||{},graphDrawings:old.graphDrawings||{},graphZoom:old.graphZoom||{}};}catch(e){}

const ANALOG_ORIGIN={33:25,34:26,41:26,35:27,36:28,40:28,37:29,38:30,39:31,42:32};

function repairTrigger(id){return !!task(id)?.graph?Number(state.attempts[id]||0)>0:!!state.hintUsed[id];}
function repairUnlocked(id){return !!state.done[id]&&repairTrigger(id);}
function save(){try{localStorage.setItem('oge_task1_v5',JSON.stringify(state));}catch(e){console.warn('Не удалось сохранить прогресс',e);}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function mainIds(sectionId=state.section){return MAIN_IDS[sectionId]||[];}
function firstPendingMain(sectionId=state.section){const ids=mainIds(sectionId);return ids.find(id=>!state.done[id]&&!state.skipped[id])??ids[ids.length-1]??null;}
function allMainFinished(sectionId=state.section){return mainIds(sectionId).every(id=>state.done[id]||state.skipped[id]);}
function isSectionComplete(sectionId=state.section){
 const ids=mainIds(sectionId);if(!ids.length||!allMainFinished(sectionId))return false;
 return ids.every(id=>!repairUnlocked(id)||analogs(id).every(a=>state.done[a]||state.skipped[a]));
}
function allSectionsComplete(){return SECTIONS.every(s=>isSectionComplete(s.id));}

 $('sections').innerHTML=SECTIONS.map(s=>{

function formatCondition(raw){let safe=escapeHtml(raw);safe=safe.replace(/\b(\d[\d\s]*(?:[.,]\d+)?)\b/g,'<strong class="num">$1</strong>').replace(/(больше|меньше|не менее|не более|увеличилось|уменьшилось)/gi,'<strong class="compare">$1</strong>').replace(/\b(запятая|запятую|запятые|запятой|пробел|пробела|пробелы|пробелом)\b/gi,'<strong class="wordmark">$1</strong>');safe=safe.replace(/(Напишите в ответе[^.]*\.|Определите[^.]*\.|Укажите[^.]*\.|Какое слово[^?]*\?|Какое имя[^?]*\?|Какое животное[^?]*\?)/gi,'<span class="question">$1</span>');return safe;}

  if(isRepair(t.id)&&state.repairOrigin!==null){state.repairQueue=(state.repairQueue||[]).filter(id=>id!==t.id);setTimeout(continueRepairFlow,750);}

 state.repairOrigin=null;state.repairFor=null;state.repairQueue=[];state.forceTaskView=false;
 const next=nextMainInSection(current);if(next!==null){state.current=next;save();render();window.scrollTo(0,0);}
 else{state.current=current;save();render();window.scrollTo(0,0);}
}
function nextTask(){
 const id=state.current;
 if(isRepair(id)&&state.repairOrigin!==null){state.skipped[id]=true;state.done[id]=false;state.repairQueue=(state.repairQueue||[]).filter(x=>x!==id);save();continueRepairFlow();return;}
 if(state.done[id]||state.skipped[id]){if(repairUnlocked(id)&&analogs(id).some(a=>!state.done[a]&&!state.skipped[a]))beginRepairs(id);else advanceMain(id);}
}
function previousTask(){
 if(state.repairOrigin!==null)return;
 const mains=mainIds(),idx=mains.indexOf(state.current);if(idx>0){state.current=mains[idx-1];state.forceTaskView=true;save();render();window.scrollTo(0,0);}
}
function renderSectionEnd(){
 const idx=SECTIONS.findIndex(s=>s.id===state.section),all=allSectionsComplete();const nextSection=SECTIONS.slice(idx+1).find(s=>!isSectionComplete(s.id))||SECTIONS.find(s=>!isSectionComplete(s.id));
 $('view').classList.remove('repair-mode','solved');
 $('view').innerHTML=`<div class="badge">${all?'КУРС ЗАВЕРШЁН':'РАЗДЕЛ ЗАВЕРШЁН'}</div><h1 class="task-title">${all?'Отличная работа! Все разделы пройдены.':'Раздел «'+escapeHtml(sec().title)+'» завершён!'}</h1><div class="theorybox"><p>${all?'Ты закончил все основные задания. Результаты закрепления, ошибки и пропуски сохранены.':'Все основные задания этого раздела выполнены или пропущены. Все открывшиеся аналоги и их результаты также учтены.'}</p><p><b>Чтобы подготовить отчёт для учителя, нажми кнопку «Отчёт учителю» в правом верхнем углу.</b> В отчёте будут условия заданий, твои ответы и результаты работы.</p></div>${!all&&nextSection?`<div class="buttons"><button class="btn primary" onclick="switchSection('${nextSection.id}')">Перейти к следующему незавершённому разделу →</button></div>`:''}`;
}
function openModal(content){const box=$('modalcontent');box.innerHTML=content;box.classList.toggle('wide-modal',content.includes('graph-modal-content'));$('modal').classList.add('show');}function closeModal(){$('modal').classList.remove('show');$('modalcontent').classList.remove('wide-modal');}
$('guideBtn').onclick=()=>openModal(`<h2>Методичка · задание 4</h2><div class="theorycard">${GRAPH_THEORY}</div><button class="btn" onclick="closeModal()">Закрыть</button>`);

function resetProgress(){
 if(!window.confirm('Сбросить весь прогресс по заданию 4? Ответы, ошибки, статусы, рисунки, расположение вершин и масштаб графов будут очищены из памяти браузера.'))return;
 const student=state.name||'Ученик 1';
 try{
  const appKeys=[];
  for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(['oge_task1_v5','oge_task1_v4','oge_task1_v3','oge_task1_v2'].includes(key))appKeys.push(key);}
  appKeys.forEach(key=>localStorage.removeItem(key));
 }catch(e){console.warn('Не удалось очистить localStorage',e);}
 state=freshState(student);
 save();
 closeModal();render();window.scrollTo(0,0);
 openModal('<h2>Прогресс очищен</h2><p>Ответы, ошибки, подсказки, черновики и результаты теории удалены. Тренажёр готов к новому прохождению.</p><button class="btn primary" onclick="closeModal()">Начать заново</button>');
}
$('resetBtn').onclick=resetProgress;

function downloadApplication(){
 save();
 const snapshot=JSON.stringify(state).replace(/</g,'\\u003c');
 const source=document.documentElement.outerHTML;
 const embedded='<script>window.__OGE_EMBEDDED_STATE__='+snapshot+';<\/script>';
 const html='<!doctype html>\n'+source.replace('</head>',embedded+'</head>');
 const blob=new Blob([html],{type:'text/html;charset=utf-8'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='Тренажёр_ОГЭ_информатика_задание_4_графы.html';
 a.style.display='none';document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1500);
}
$('saveBtn').onclick=downloadApplication;
function openReport(){
 const labelForScratch={};
 const sections=SECTIONS.map(secItem=>{
  const main=mainIds(secItem.id),related=main.flatMap(id=>analogs(id));
  const doneMain=main.filter(id=>state.done[id]).length,skipMain=main.filter(id=>state.skipped[id]).length;
  const doneAnalog=related.filter(id=>state.done[id]).length,skipAnalog=related.filter(id=>state.skipped[id]).length;
  const hintCount=main.filter(id=>state.hintUsed[id]).length;
  const theoryState=state.theoryPassed[secItem.id]?'Пройдена добровольно':'Необязательная, не проходилась';
  const tq=THEORY_Q[secItem.id]||[];
  const theoryRows=tq.map((q,i)=>{
   const chosen=state.theoryAnswers?.[secItem.id]?.[i];
   const has=Number.isInteger(chosen)&&q.o[chosen]!==undefined;
   const right=has&&chosen===q.a;
   return `<div class="report-theory-row"><b>${i+1}. ${escapeHtml(q.q)}</b><div>Ответ ученика: ${has?escapeHtml(q.o[chosen]):'Не отвечал'}</div><div>Правильный ответ: ${escapeHtml(q.o[q.a])}</div><div class="${!has?'r-open':right?'r-done':'r-skip'}">${!has?'Не отвечал':right?'Верно':'Неверно'}</div></div>`;
  }).join('');
  return `<section class="report-section"><h3>${escapeHtml(secItem.title)}</h3><p class="report-summary">Теория (по желанию): <b>${theoryState}</b> · Основные: решено ${doneMain}/${main.length}, пропущено ${skipMain} · Аналоги: решено ${doneAnalog}/${related.length}, пропущено ${skipAnalog} · Подсказок использовано: ${hintCount}</p>${tq.length?`<details class="report-theory" open><summary>Ответы по теории (${theoryState.toLowerCase()})</summary>${theoryRows}</details>`:''}</section>`;
 }).join('');
 const rows=TASKS.map(t=>{
  const analog=!!ANALOG_ORIGIN[t.id];
  let status='Не начато',emoji='⚪',cls='r-open';
  if(state.done[t.id]){status='Верно';emoji='✅';cls='r-done';}
  else if(state.skipped[t.id]){status='Пропущено';emoji='⏭️';cls='r-skip';}
  else if(state.attempts[t.id]){status='Неверно';emoji='❌';cls='r-error';}
  else if(state.visited?.[t.id]||state.answers[t.id]!==undefined){status='В работе';emoji='🟠';cls='r-open';}
  const answer=state.answers[t.id];
  const hasAnswer=answer!==undefined&&answer!==null&&String(answer).trim()!=='';
  const conditionRows=`<table class="report-condition-table"><tbody><tr><th>Условие</th><td>${escapeHtml(t.text)}</td></tr>${t.graph?`<tr><th>Рёбра и веса</th><td>${escapeHtml(t.graph.edges.map(e=>`${e[0]}–${e[1]}: ${e[2]}`).join('; '))}</td></tr>`:''}</tbody></table>`;
  return `<article class="report-task-card ${cls}"><header class="report-task-card-head"><div class="report-task-card-title"><span class="report-task-emoji">${analog?'🧩':'📘'}</span><div><h3>Задание ${String(t.id).padStart(2,'0')} · ${escapeHtml(t.title)}</h3><div class="report-task-kind">${analog?'Аналог для закрепления':'Основное задание'}</div></div></div><span class="report-status ${cls}">${emoji} ${status}</span></header><div class="report-task-card-body">${conditionRows}${t.graph?graphReportHTML(t):''}${hasAnswer?`<div class="report-answer"><b>✍️ Ответ ученика</b><span>${escapeHtml(String(answer))}</span></div>`:''}</div></article>`;
 }).join('');
 const completed=TASKS.filter(t=>state.done[t.id]).length,skipped=TASKS.filter(t=>state.skipped[t.id]).length,wrong=Object.values(state.attempts).reduce((a,b)=>a+(Number(b)||0),0),usedHints=Object.values(state.hintUsed).filter(Boolean).length;
 openModal(`<div class="report"><h2>📋 Отчёт учителю</h2><p class="report-meta"><b>Ученик:</b> ${escapeHtml(state.name||'Ученик 1')} · <b>Дата:</b> ${new Date().toLocaleDateString('ru-RU')}</p><div class="report-overview"><span>📚 Всего: <b>${TASKS.length}</b></span><span>✅ Верно: <b>${completed}</b></span><span>❌ Неверно: <b>${wrong}</b></span><span>⏭️ Пропущено: <b>${skipped}</b></span></div><div class="report-task-list">${rows}</div><p class="report-actions"><button class="btn primary" onclick="printReport()">🖨️ Печать / сохранить PDF</button> <button class="btn" onclick="downloadReport()">⬇️ Сохранить HTML</button> <button class="btn" onclick="closeModal()">Закрыть</button></p></div>`);
}
$('reportBtn').onclick=openReport;
function reportFilename(ext){let clean=x=>String(x||'').replace(/[\\/:*?"<>|]+/g,'_').replace(/\s+/g,' ').trim();return clean('Отчёт — ОГЭ информатика задание 4 графы — '+(state.name||'Ученик 1'))+'.'+ext;}function printReport(){let old=document.title;document.title=reportFilename('pdf').replace(/\.pdf$/,'');window.print();setTimeout(()=>document.title=old,1200);}
function downloadReport(){let report=$('modalcontent').querySelector('.report').cloneNode(true);report.querySelector('.report-actions')?.remove();let html='<!doctype html><html lang="ru"><meta charset="utf-8"><title>Отчёт учителю</title><style>body{font:14px Arial;padding:24px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #bbb;padding:8px;text-align:left}.r-done{background:#e4f6e9}.r-skip{background:#fff3cd}.r-open{background:#fde8e7}.graph-report-svg{display:block;width:min(100%,560px);height:auto;min-height:180px;border:1px solid #d5deea;border-radius:8px;background:#fff;margin-top:8px}.graph-report-svg .roads line{stroke:#52647d;stroke-width:4;stroke-linecap:round}.graph-report-svg .roads rect{fill:#fff;stroke:#8da3c1;stroke-width:1.5}.graph-report-svg .roads text{font:900 17px system-ui,Arial;fill:#1649a2;text-anchor:middle}.graph-report-svg .vertices circle{fill:#edf4ff;stroke:#2864d9;stroke-width:3}.graph-report-svg .vertices text{font:900 20px system-ui,Arial;fill:#173b78;text-anchor:middle}.graph-report-svg .student-ink polyline{fill:none;stroke:#e43b3b;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.85}</style>'+report.outerHTML+'</html>';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=reportFilename('html');a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('modal').classList.contains('show')){closeModal();return;}if(e.key==='Enter'&&document.activeElement?.id==='answer'){e.preventDefault();check();return;}if(e.key==='Enter'&&$('modal').classList.contains('show'))return;});
function init(){if(!state.name){openModal(`<h2>Начало работы</h2><p>Введите имя ученика (можно оставить значение по умолчанию).</p><input id="studentName" value="Ученик 1" style="padding:10px;width:100%;margin-bottom:12px"><button class="btn primary" onclick="state.name=document.getElementById('studentName').value.trim()||'Ученик 1';save();closeModal();render()">Начать</button>`);}render();}
init();
</script>
