var container = document.getElementById('tasks');

tasks.forEach(function(task, i) {

  d.innerHTML = task.desc;

  card.appendChild(q);

  var hintBtn = document.createElement('button');
  hintBtn.className = 'hint-toggle-btn';
  hintBtn.innerHTML = '💡 Подсказка';
  card.appendChild(hintBtn);

  var hintBox = document.createElement('div');
  hintBox.className = 'hint-box';
  hintBox.innerHTML = task.hint;
  card.appendChild(hintBox);

  hintBtn.addEventListener('click', function() {
    hintBox.classList.toggle('show');
    hintBtn.classList.toggle('active', hintBox.classList.contains('show'));
    hintBtn.textContent = hintBox.classList.contains('show') ? '💡 Скрыть подсказку' : '💡 Подсказка';
  });

  // Ответ
  var row = document.createElement('div');
  row.className = 'answer-row';
  row.innerHTML =
    '<label>Ответ:</label>' +
    '<input type="text" placeholder="число или выражение">' +
    '<button class="check-btn">Проверить</button>' +
    '<button class="reveal-btn">Показать ответ</button>' +
    '<span class="calc-hint"></span>';
  card.appendChild(row);

  var input = row.querySelector('input');
  var checkBtn = row.querySelector('.check-btn');
  var revealBtn = row.querySelector('.reveal-btn');
  var hintEl = row.querySelector('.calc-hint');

  // Показываем ТОЛЬКО число
  var revealBox = document.createElement('div');
  revealBox.className = 'reveal-answer';
  revealBox.innerHTML = '<span class="label">Верный ответ:</span>' +
    '<span class="value">' + task.answerValue + '</span>';
  card.appendChild(revealBox);

  // Парсер выражения
  function safeCalc(expr) {
    var s = expr.replace(/\s+/g, '').replace(/×/g, '*').replace(/·/g, '*');
    if (!/^[0-9+\-*\/()]+$/.test(s)) return null;
    try {
      var tokens = s.replace(/\(/g, ' ( ').replace(/\)/g, ' ) ').split(/\s+/).filter(Boolean);
      var pos = 0;
      function parseExpr() {
        var v = parseTerm();
        while (tokens[pos] === '+' || tokens[pos] === '-') {
          var op = tokens[pos++];
          var r = parseTerm();
          v = op === '+' ? v + r : v - r;
        }
        return v;
      }
      function parseTerm() {
        var v = parseFactor();
        while (tokens[pos] === '*' || tokens[pos] === '/') {
          var op = tokens[pos++];
          var r = parseFactor();
          if (op === '/' && r === 0) throw new Error('деление на 0');
          v = op === '*' ? v * r : v / r;
        }
        return v;
      }
      function parseFactor() {
        if (tokens[pos] === '(') {
          pos++;
          var v = parseExpr();
          if (tokens[pos] !== ')') throw new Error('скобка');
          pos++;
          return v;
        }
        if (tokens[pos] === '-') { pos++; return -parseFactor(); }
        var n = Number(tokens[pos++]);
        if (isNaN(n)) throw new Error('не число');
        return n;
      }
      var result = parseExpr();
      if (pos !== tokens.length) return null;
      return result;
    } catch (e) {
      return null;
    }
  }

  function getValue() {
    var raw = input.value.trim();
    if (!raw) { hintEl.textContent = ''; hintEl.className = 'calc-hint'; return null; }
    var val = safeCalc(raw);
    if (val === null) {
      hintEl.textContent = 'не число';
      hintEl.className = 'calc-hint bad';
      return null;
    }
    hintEl.textContent = '= ' + val;
    hintEl.className = 'calc-hint';
    return val;
  }
  input.addEventListener('input', getValue);

  checkBtn.addEventListener('click', function() {
    var val = getValue();
    var expected = Number(task.answerValue);
    var ok = val !== null && Math.abs(val - expected) < 1e-9;
    input.classList.toggle('correct', ok);
    input.classList.toggle('wrong', !ok);
    hintEl.className = 'calc-hint ' + (ok ? 'ok' : (val === null ? 'bad' : ''));
    revealBtn.classList.toggle('show', !ok);
    if (ok) revealBox.classList.remove('show');
  });
  revealBtn.addEventListener('click', function() {
    revealBox.classList.toggle('show');
    revealBtn.textContent = revealBox.classList.contains('show') ? 'Скрыть ответ' : 'Показать ответ';
  });
  input.addEventListener('keydown', function(e) { if (e.key === 'Enter') checkBtn.click(); });

  container.appendChild(card);
});
</script>
</body>
</html>
