function esc(s) {
  return String(s).replace(/[&<>]/g, function(c) {
    return ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c];
  });
}
function slot(answer) {
  return '<input class="py-slot" type="text" contenteditable="false" ' +
         'placeholder="?" data-answer="' + (answer != null ? String(answer) : '') + '">';
}
function decorPrefix(lruOn) {
  var cls = lruOn ? 'decor-on' : 'decor-off';
  var prefix = lruOn ? '' : '# ';
  return '<span class="decor-line ' + cls + '" data-decor="prefix">' +
         prefix + '@lru_cache(' + '</span>';
}
function decorSuffix(lruOn) {
  var cls = lruOn ? 'decor-on' : 'decor-off';
  return '<span class="decor-line ' + cls + '" data-decor="suffix">' + ')' + '</span><br>';
}

                 esc("    else:\n") +
                 esc("        G[n] = G[n + 3] + 2\n");
        }
      },
      { label: 'Построение F', movable: true,
        code: function() {
          return esc("F = [0] * ") + slot(3000) + esc("\n") +
                 esc("for n in range(") + slot(0) + esc(", ") + slot(3000) + esc(", ") + slot(1) + esc("):\n") +
                 esc("    if n < 43:\n") +
                 esc("        F[n] = G[n + 4]\n") +
                 esc("    else:\n") +
                 esc("        F[n] = 2 * F[n - 2] - F[n - 4] + 2\n");
        }
      },
      { label: 'Вывод ответа', movable: false, isPrint: true,
        code: function() { return esc("print(F[2026])\n"); }
      }
    ]
  }
];

/* ============ PYODIDE (с корректным сбросом состояния) ============ */
var pyodideReady = false, pyodideLoading = false, pyodideInstance = null, pyQueue = [];
function loadPyodideOnce(cb) {
  if (pyodideReady) { cb(); return; }
  pyQueue.push(cb);
  if (pyodideLoading) return;
  pyodideLoading = true;
  var script = document.createElement('script');
  script.src = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js';
  script.onload = function() {
    window.loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/' })
      .then(function(py) {
        pyodideInstance = py; pyodideReady = true;
        var q = pyQueue.slice(); pyQueue = [];
        q.forEach(function(f){ f(); });
      })
      .catch(function(err) {
        var q = pyQueue.slice(); pyQueue = [];
        q.forEach(function(f){ f(err); });
      });
  };
  script.onerror = function() {
    var err = new Error('Не удалось загрузить Pyodide');
    var q = pyQueue.slice(); pyQueue = [];
    q.forEach(function(f){ f(err); });
  };
  document.head.appendChild(script);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}
function runPython(code, outEl, btn, onDone) {
  outEl.innerHTML = 'Загрузка Python…';
  if (btn) btn.disabled = true;

  // ВСЕГДА начинаем с чистого состояния:
  // 1) Пробуем восстановить stdout (если предыдущий запуск упал)
  // 2) Создаём новый буфер
  // 3) Выполняем код в ОТДЕЛЬНОМ namespace, чтобы старые переменные не мешали
  var wrapped =
    "import sys, io\n" +
    "try:\n" +
    "    sys.stdout = sys.__stdout__\n" +
    "except Exception:\n" +
    "    pass\n" +
    "_py_out = io.StringIO()\n" +
    "sys.stdout = _py_out\n" +
    "_user_ns = {}\n" +
    "try:\n" +
    "    exec(" + JSON.stringify(code) + ", _user_ns)\n" +
    "    _result = _py_out.getvalue()\n" +
    "finally:\n" +
    "    sys.stdout = sys.__stdout__\n";

  loadPyodideOnce(function(err) {
    if (err) {
      outEl.innerHTML = '<span class="err">Ошибка загрузки: ' + escapeHtml(err.message) + '</span>';
      if (btn) btn.disabled = false;
      return;
    }
    var result = '';
    var errText = null;
    try {
      pyodideInstance.runPython(wrapped);
      // Забираем результат и возможную ошибку
      result = pyodideInstance.runPython('_result');
    } catch (e) {
      errText = e.message || String(e);
      try {
        // попробуем вытащить то, что успело напечататься
        result = pyodideInstance.runPython('_py_out.getvalue()');
      } catch (_) {
        result = '';
      }
    }
    if (errText !== null) {
      outEl.innerHTML = '<span class="err">Ошибка: ' + escapeHtml(errText) + '</span>' +
        (result ? '\n<span class="ok">Успело напечататься:</span>\n' + escapeHtml(result) : '');
      if (btn) btn.disabled = false;
      return;
    }
    outEl.innerHTML = '<span class="ok">Вывод:</span>\n' + escapeHtml(result || '(пусто)');
    if (onDone) onDone(result);
    if (btn) btn.disabled = false;
  });
}

/* Собираем ВЕСЬ код задачи: шапка (видимая) + все блоки */
function collectCodeFromEditor(editorEl, lruOn) {
  var clone = editorEl.cloneNode(true);
  clone.querySelectorAll('input.py-slot').forEach(function(inp) {
    var val = inp.value.trim();
    var txt = document.createTextNode(val === '' ? ' ' : val);
    inp.parentNode.replaceChild(txt, inp);
  });
  var raw = clone.innerHTML;
  raw = raw.replace(/<br\s*\/?>/gi, '\n');
  raw = raw.replace(/<div[^>]*>/gi, '\n').replace(/<\/div>/gi, '');
  var tmp = document.createElement('div');
  tmp.innerHTML = raw;
  var text = tmp.textContent || tmp.innerText || '';
  text = text.replace(/^\n+/, '');
  if (!lruOn) {
    var lines = text.split('\n');
    if (lines.length && lines[0].indexOf('@lru_cache') !== -1) {
      lines[0] = '# ' + lines[0];
    }
    text = lines.join('\n');
  }
  return text;
}

  // Функция перерисовки видимой шапки

  function applyLruState(on) {

  function safeCalc(expr) {
    var s = expr.replace(/\s+/g, '').replace(/×/g, '*').replace(/·/g, '*');
    if (!/^[0-9+\-*\/()]+$/.test(s)) return null;
    try {
      var tokens = s.replace(/\(/g, ' ( ').replace(/\)/g, ' ) ').split(/\s+/).filter(Boolean);
      var pos = 0;
      function parseExpr() {
        var v = parseTerm();
        while (tokens[pos] === '+' || tokens[pos] === '-') {
          var op = tokens[pos++];
          var r = parseTerm();
          v = op === '+' ? v + r : v - r;
        }
        return v;
      }
      function parseTerm() {
        var v = parseFactor();
        while (tokens[pos] === '*' || tokens[pos] === '/') {
          var op = tokens[pos++];
          var r = parseFactor();
          if (op === '/' && r === 0) throw new Error('деление на 0');
          v = op === '*' ? v * r : v / r;
        }
        return v;
      }
      function parseFactor() {
        if (tokens[pos] === '(') {
          pos++;
          var v = parseExpr();
          if (tokens[pos] !== ')') throw new Error('скобка');
          pos++;
          return v;
        }
        if (tokens[pos] === '-') { pos++; return -parseFactor(); }
        var n = Number(tokens[pos++]);
        if (isNaN(n)) throw new Error('не число');
        return n;
      }
      var result = parseExpr();
      if (pos !== tokens.length) return null;
      return result;
    } catch (e) { return null; }
  }
  function getValue() {
    var raw = input.value.trim();
    if (!raw) { hintEl.textContent = ''; hintEl.className = 'calc-hint'; return null; }
    var val = safeCalc(raw);
    if (val === null) { hintEl.textContent = 'не число'; hintEl.className = 'calc-hint bad'; return null; }
    hintEl.textContent = '= ' + val;
    hintEl.className = 'calc-hint';
    return val;
  }
  input.addEventListener('input', getValue);
  checkBtn.addEventListener('click', function() {
    var val = getValue();
    var expected = Number(task.answerValue);
    var ok = val !== null && Math.abs(val - expected) < 1e-9;
    input.classList.toggle('correct', ok);
    input.classList.toggle('wrong', !ok);
    hintEl.className = 'calc-hint ' + (ok ? 'ok' : (val === null ? 'bad' : ''));
    revealBtn.classList.toggle('show', !ok);
    if (ok) revealBox.classList.remove('show');
  });
  revealBtn.addEventListener('click', function() {
    revealBox.classList.toggle('show');
    revealBtn.textContent = revealBox.classList.contains('show') ? 'Скрыть ответ' : 'Показать ответ';
  });
  input.addEventListener('keydown', function(e) { if (e.key === 'Enter') checkBtn.click(); });

  container.appendChild(card);
});
