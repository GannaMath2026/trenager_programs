<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ЕГЭ · Информатика · Задание 5</title>
<style>
:root{color-scheme:light;--bg:#f3f6fb;--panel:#fff;--panel2:#f7f9fc;--ink:#1e2d46;--muted:#60728d;--line:#d5dfed;--blue:#3564ed;--blue2:#e8efff;--green:#e5f6ed;--gold:#fff4d9;--code:#0f1b30;--fs:16px;--fsc:14px}
body.dark{color-scheme:dark;--bg:#0b0d10;--panel:#151a21;--panel2:#1b222b;--ink:#edf2f7;--muted:#a8b3c2;--line:#303a46;--blue:#4774ff;--blue2:#202c43;--green:#173629;--gold:#3a3020;--code:#0a1220}
body.font-small{--fs:13px;--fsc:12px}body.font-medium{--fs:16px;--fsc:14px}body.font-large{--fs:19px;--fsc:17px}body.font-giant{--fs:22px;--fsc:20px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs)/1.42 system-ui,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:7px 12px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}header strong{margin-right:auto;font-size:17px}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 10px}button:hover{border-color:#8aa7ff}button.primary{background:var(--blue);color:white;border-color:var(--blue)}button:disabled{opacity:.4;cursor:default}
.fonts{display:flex;gap:2px;border:1px solid var(--line);border-radius:8px;padding:2px}.fonts button{padding:3px 7px;border:0;font-size:13px;font-weight:800}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 52px)}
aside{background:var(--panel);border-right:1px solid var(--line);padding:9px;position:sticky;top:52px;height:calc(100vh - 52px);overflow:auto}
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}.filters button{font-size:12px;padding:4px 7px}.filters button.active{background:var(--blue2);border-color:var(--blue);font-weight:800}
.task{border:1px solid var(--line);border-left:4px solid #b9ccff;border-radius:9px;padding:6px 8px;margin:5px 0;background:var(--panel);cursor:pointer}.task.active{background:var(--blue2);border-color:var(--blue)}.task.completed{background:var(--green);border-color:#1b9a5a}.task-head{display:flex;gap:6px;align-items:center}.task-title{font-size:calc(var(--fs) - 2px);font-weight:750;line-height:1.25;flex:1}.task-meta{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:4px}.flag{border:0;background:transparent;padding:0 2px;font-size:18px}.flag.on{filter:none}.flag.off{opacity:.28}.level{display:inline-flex;gap:2px;margin-left:auto}.level i{display:block;width:8px;height:8px;border-radius:2px;background:#d6dfeb}.level i.on{background:var(--lv,#e2a52b)}
main{padding:10px 12px;min-width:0}.top{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.pill{border-radius:20px;background:var(--blue2);padding:3px 9px;font-size:12px;font-weight:800}.pill.green{background:var(--green);color:#167446}.muted{color:var(--muted)}h2{font-size:calc(var(--fs) + 2px);margin:0}
.condition-wrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 11px;margin:6px 0}.condbar{display:flex;gap:6px;align-items:center;margin-bottom:4px}.condbar strong{margin-right:auto}.condition{white-space:pre-wrap;line-height:1.38;font-size:var(--fs);overflow-wrap:anywhere}.condition[contenteditable=true]{outline:2px solid var(--blue);border-radius:6px;padding:5px;background:var(--panel2)}.condsample{font-size:calc(var(--fs) - 2px);color:var(--muted);margin-top:5px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.step{padding:6px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-size:13px;font-weight:700}.step.active{background:var(--blue2);border-color:var(--blue)}.step.done{border-color:#1b9a5a}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:11px;margin:8px 0;overflow:hidden}.panelhead{padding:7px 10px;background:var(--panel2);border-bottom:1px solid var(--line);display:flex;gap:7px;align-items:center;flex-wrap:wrap}.panelhead strong{margin-right:auto}.panelbody{padding:8px 10px}
.modebar{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}.modebar button{font-size:13px}.modebar button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.editor{display:grid;grid-template-columns:66px minmax(0,1fr);background:var(--code);border:1px solid #30445d;border-radius:9px;overflow:hidden}.gutter{background:#122139;padding:5px 3px;color:#9fc3e9;user-select:none}.gutterrow{height:22px;display:flex;align-items:center;justify-content:center;gap:3px}.indentbtn{width:28px;height:21px;padding:0;border:1px solid #536982;border-radius:5px;background:#20334d;color:#f0d08d;font-weight:900;font-size:18px;line-height:1}.indentbtn:disabled{opacity:.15}.codearea{min-width:0;position:relative}.codeview{position:absolute;inset:0;margin:0;padding:5px 9px;white-space:pre;overflow:hidden;color:#e6edf7;font:var(--fsc)/22px Consolas,monospace;pointer-events:none;tab-size:4}.codeview .comment{color:#91a0b3;opacity:.55}.codearea textarea{position:relative;z-index:1;display:block;width:100%;min-height:230px;resize:vertical;background:transparent;color:transparent;caret-color:#fff;border:0;outline:0;padding:5px 9px;font:var(--fsc)/22px Consolas,monospace;white-space:pre;tab-size:4;overflow:auto}.codearea textarea::selection{background:#526f99;color:transparent}
.controls{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}.controls button{font-size:13px}.note{background:var(--gold);border-radius:8px;padding:7px 9px;font-size:13px;margin:6px 0}.result{white-space:pre-wrap;overflow-wrap:anywhere;padding:8px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);margin-top:7px;font:13px/1.45 Consolas,monospace}.result.good{background:var(--green);border-color:#1b9a5a}.result.bad{background:var(--gold);border-color:#d6b86a}
.menu{position:fixed;z-index:50;top:0;bottom:0;height:100vh;height:100dvh;max-height:100vh;max-height:100dvh;width:min(600px,calc(100vw - 16px));overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-gutter:stable;background:var(--panel);border:1px solid var(--line);border-radius:0 12px 12px 0;box-shadow:0 12px 36px #0005;padding:10px}.menu::-webkit-scrollbar{width:13px}.menu::-webkit-scrollbar-thumb{background:#8b9bb3;border:3px solid var(--panel);border-radius:10px}.menu h4{position:sticky;top:-10px;z-index:2;background:var(--panel);margin:-10px -10px 8px;padding:13px;border-bottom:1px solid var(--line);color:var(--muted)}.menu button.lineopt{display:block;width:100%;text-align:left;font:var(--fsc)/1.4 Consolas,monospace;white-space:pre-wrap;margin:3px 0;padding:8px}
dialog{border:1px solid var(--line);border-radius:13px;padding:14px;background:var(--panel);color:var(--ink);width:min(850px,96vw);max-height:92vh;overflow:auto;box-shadow:0 20px 80px #0005}dialog::backdrop{background:#0009}dialog h2{margin:0 0 10px}.dialog-actions{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}
textarea.editbox{width:100%;min-height:170px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px;line-height:1.4}
.refgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}.refcard{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px}.refcard h3{margin:0 0 5px;font-size:14px}.refcard code{font-family:Consolas,monospace;color:var(--blue)}.reportitem{border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0}.reportitem.pass{border-left:4px solid #1b9a5a}.reportitem.fail{border-left:4px solid #d18a31}
@media(max-width:850px){.layout{grid-template-columns:1fr}aside{position:static;height:auto;max-height:38vh}.editor{grid-template-columns:58px minmax(0,1fr)}}
@media print{header,aside,.steps,.controls,.modebar,.gutter{display:none!important}.layout{display:block}main{padding:0}.panel,.condition-wrap{break-inside:avoid}}
</style></head><body>

<button id="refBtn">📚 Справочник</button><button id="reportBtn">📋 Отчёт учителю</button><button id="themeBtn">☾</button><button id="saveBtn">💾 Сохранить прогресс</button></header>
<div class="layout"><aside><div class="filters"><button data-filter="all" class="active">Все</button><button data-filter="hw">🏠 ДЗ</button><button data-filter="fav">⭐ Избранное</button><button data-filter="done">Решено</button></div><div id="tasklist"></div></aside><main id="main"></main></div>

<script>
const TASKS=[{"id":"4868","title":"Сумма чётных цифр и цифр на чётных местах","level":1,"tag":"Позиции цифр · строки","condition":"Вычисляется сумма чётных цифр в десятичной записи числа N > 1. Если чётных цифр нет, сумма равна нулю. Вычисляется сумма цифр, стоящих на чётных местах в десятичной записи N без ведущих нулей. Места отсчитываются слева направо, начиная с единицы. Результат — модуль разности этих сумм. При каком наименьшем N получится R = 13?","answer":"618","solution":"for n in range(2, 1000000):\n    s1 = sum(int(c) for c in str(n) if int(c) % 2 == 0)\n    s2 = sum(int(str(n)[i]) for i in range(1, len(str(n)), 2))\n    r = abs(s1 - s2)\n    if r == 13:\n        print(n)\n        break\n# print(r)","hint":"Первая сумма — все чётные цифры числа. Вторая — цифры с индексами 1, 3, 5… (это 2-е, 4-е, 6-е места). Перебирай N по возрастанию и остановись при R = 13.","base":"10","source":"Статград 27.10.2021 · № 2537 · базовый уровень","skills":["str","slice","count","replace","join","sum","mod","abs"]},{"id":"3755","title":"Составление двузначных из соседних цифр","level":1,"tag":"Строки · соседние пары","condition":"На вход поступает натуральное N ≥ 10. Все пары соседних цифр десятичной записи N рассматриваются как двузначные числа (возможно, с ведущим нулём). Из них выбираются наибольшее и наименьшее. R — их разность. Найдите наименьшее N, для которого R = 44.","answer":"159","solution":"for n in range(10, 1000000):\n    s = str(n)\n    pairs = [int(s[i:i+2]) for i in range(len(s)-1)]\n    r = max(pairs) - min(pairs)\n    if r == 44:\n        print(n)\n        break\n# print(r)","hint":"Преобразуй число в строку. Перебери индексы от 0 до len(s)-2, собери пары соседних символов срезом s[i:i+2], переведи их в int. Затем найди max и min.","base":"10","source":"Практика из предоставленного списка","skills":["str","slice","count","replace","join"]},{"id":"23551","title":"Приставка и суффикс по чётности N","level":1,"tag":"Двоичная запись · if/else · конкатенация","source":"Пересдача ЕГЭ 03.07.2025 · № 23551 · базовый уровень","condition":"На вход алгоритма подаётся натуральное число N.\n1. Строится двоичная запись числа N.\n2. Если N чётное, слева к записи дописывается 10.\n3. Если N нечётное, слева дописывается 1, а справа — 01.\nПолученная строка является двоичной записью R.\nНайдите максимальное N, при котором R < 30.","answer":"6","base":"2","solution":"ans = 0\nfor n in range(1, 1000):\n    a = f(n, 2)\n    if n % 2 == 0:\n        a = '10' + a\n    else:\n        a = '1' + a + '01'\n    r = int(a, 2)\n    if r < 30:\n        ans = max(ans, n)\nprint(ans)\n# print(r)","hint":"Сначала получи двоичную строку a. Ветвление зависит от чётности самого N. Важно различать добавление слева и справа. Затем переведи строку обратно в десятичное число через int(a, 2).","skills":["bin","oct","hex","base","intbase","sum","count","mod","abs"]},{"id":"31502","title":"Двоичная запись: две приставки и два суффикса","level":1,"tag":"Двоичная запись · if/else · срезы строк","source":"Демоверсия ЕГЭ 2027 · № 31502 · базовый уровень","condition":"На вход алгоритма подаётся натуральное число N.\n1. Строится двоичная запись N.\n2. Если N чётное, слева и справа дописываются две единицы.\n3. Если N нечётное, слева дописывается одна единица, а справа — два нуля.\nПолученная строка является двоичной записью R.\nНайдите наименьшее значение R, которое больше 95.","answer":"100","base":"2","solution":"mini = 10**100\nfor n in range(1, 1000):\n    a = f(n, 2)\n    if n % 2 == 0:\n        a = '11' + a + '11'\n    else:\n        a = '1' + a + '00'\n    r = int(a, 2)\n    if r > 95:\n        mini = min(mini, r)\nprint(mini)\n# print(n)","hint":"Используй ветвление по n % 2. В каждой ветке сформируй новую строку, добавляя символы слева и справа. Для поиска минимального R задай большое начальное значение mini.","skills":["bin","oct","hex","base","intbase","str","slice","count","replace","join"]},{"id":"8160","title":"Троичная запись и дописывание двух цифр","level":2,"tag":"Основание 3 · дописывание","condition":"Строится троичная запись N. Если N делится на 3, к записи дописываются две последние троичные цифры. Иначе остаток от деления N на 3 умножается на 3, переводится в троичную систему и дописывается в конец. Полученная запись — троичная запись R. Найдите максимальное N, для которого R не превышает 150.","answer":"16","solution":"ans = 0\nfor n in range(1, 10000):\n    a = f(n, 3)\n    if n % 3 == 0:\n        a += a[-2:]\n    else:\n        a += f((n % 3) * 3, 3)\n    r = int(a, 3)\n    if r <= 150:\n        ans = max(ans, n)\nprint(ans)\n# print(r)","hint":"Перебирай N. Получи строку a = f(n, 3). В ветке делимости добавь последние два символа a[-2:], иначе добавь f((n % 3) * 3, 3). Переведи строку обратно через int(a, 3).","base":"3","source":"Практика из предоставленного списка","skills":["bin","oct","hex","base","intbase","str","slice","count","replace","join"]},{"id":"6885","title":"Пятнадцатеричная запись и добавление суффикса","level":2,"tag":"Основание 15 · строки","condition":"Для N > 14 строится запись в системе с основанием 15. Если N делится на 15, в конец дописываются первые две цифры записи. Иначе остаток N % 15 умножается на 13, переводится в систему с основанием 15 и дописывается. Найдите минимальное R, большее 700.","answer":"703","solution":"mini = 10**100\nfor n in range(15, 100000):\n    a = f(n, 15)\n    if n % 15 == 0:\n        a += a[:2]\n    else:\n        a += f((n % 15) * 13, 15)\n    r = int(a, 15)\n    if r > 700:\n        mini = min(mini, r)\nprint(mini)\n# print(r)","hint":"Для каждой записи a проверь n % 15. При делимости добавь a[:2], иначе — перевод числа (n % 15) * 13 в основание 15. Минимум R обновляй только при R > 700.","base":"15","source":"Практика из предоставленного списка","skills":["bin","oct","hex","base","intbase"]},{"id":"7639","title":"Двоичная запись: приставка по чётности","level":2,"tag":"Основание 2 · условия","condition":"Строится двоичная запись N. Если N чётное, слева дописывается 10. Если нечётное — слева дописывается 1, справа 01. Полученная запись является двоичной записью R. Найдите максимальное R при N ≤ 12.","answer":"109","solution":"maxi = 0\nfor n in range(1, 13):\n    a = f(n, 2)\n    if n % 2 == 0:\n        a = '10' + a\n    else:\n        a = '1' + a + '01'\n    r = int(a, 2)\n    maxi = max(maxi, r)\nprint(maxi)\n# print(r)","hint":"Проверь чётность N. Не путай дописывание к строке слева и справа. После преобразования строки переведи её в десятичное число через int(a, 2).","base":"2","source":"Практика из предоставленного списка","skills":["bin","oct","hex","base","intbase","sum","count","mod","abs"]},{"id":"23742","title":"Двоичная запись: последние три разряда или остаток","level":2,"tag":"Основание 2 · остаток · срезы","source":"Демоверсия ЕГЭ 2026 · № 23742 · базовый уровень","condition":"На вход алгоритма подаётся натуральное число N.\n1. Строится двоичная запись N.\n2. Если N делится на 3, к записи дописываются три последние двоичные цифры.\n3. Если N не делится на 3, остаток от деления на 3 умножается на 3, переводится в двоичную систему и дописывается справа.\nПолученная строка — двоичная запись R.\nНайдите минимальное N, для которого R не меньше 200.","answer":"26","base":"2","solution":"for n in range(1, 10000):\n    a = f(n, 2)\n    if n % 3 == 0:\n        a += a[-3:]\n    else:\n        a += f((n % 3) * 3, 2)\n    r = int(a, 2)\n    if r >= 200:\n        print(n)\n        break\n# print(r)","hint":"Для делящихся на 3 чисел используй срез a[-3:]. В другой ветке сначала вычисли (n % 3) * 3, переведи результат функцией f и добавь к строке. Перебор по возрастанию позволяет остановиться на первом подходящем N.","skills":["bin","oct","hex","base","intbase","str","slice","count","replace","join"]},{"id":"23264","title":"Троичная запись: две последние цифры или остаток × 5","level":2,"tag":"Основание 3 · остаток · срезы","source":"Основная волна ЕГЭ 11.06.2025 · № 23264 · базовый уровень","condition":"На вход алгоритма подаётся натуральное число N.\n1. Строится троичная запись N.\n2. Если N делится на 3, к записи дописываются две последние троичные цифры.\n3. Если N не делится на 3, остаток от деления на 3 умножается на 5, переводится в троичную систему и дописывается справа.\nПолученная строка — троичная запись R.\nНайдите минимальное значение R, которое больше 150.","answer":"162","base":"3","solution":"mini = 10**100\nfor n in range(1, 10000):\n    a = f(n, 3)\n    if n % 3 == 0:\n        a += a[-2:]\n    else:\n        a += f((n % 3) * 5, 3)\n    r = int(a, 3)\n    if r > 150:\n        mini = min(mini, r)\nprint(mini)\n# print(n)","hint":"Это продолжение предыдущего приёма, но основание теперь 3. При делимости добавь последние два символа. Иначе переведи в троичную систему число (n % 3) * 5. Сравнивай уже десятичное значение R.","skills":["bin","oct","hex","base","intbase","str","slice","count","replace","join"]},{"id":"29956","title":"Троичная запись: приставка и суффикс по условию","level":2,"tag":"Основание 3 · if/else · конкатенация","source":"Апробация ЕГЭ 14.05.2026 · № 29956 · базовый уровень","condition":"На вход алгоритма подаётся натуральное число N.\n1. Строится троичная запись N.\n2. Если N делится на 3, слева к записи приписывается 1, а справа — 02.\n3. Если N не делится на 3, остаток от деления на 3 умножается на 5, переводится в троичную систему и дописывается в конец.\nПолученная строка — троичная запись R.\nНайдите минимальное N, для которого R не меньше 177.","answer":"8","base":"3","solution":"for n in range(1, 10000):\n    a = f(n, 3)\n    if n % 3 == 0:\n        a = '1' + a + '02'\n    else:\n        a += f((n % 3) * 5, 3)\n    r = int(a, 3)\n    if r >= 177:\n        print(n)\n        break\n# print(r)","hint":"В первой ветке добавляются сразу две части строки: одна слева и одна справа. Во второй ветке используется перевод остатка, умноженного на 5. Так как ищется минимальное N, перебирай N по возрастанию.","skills":["bin","oct","hex","base","intbase"]},{"id":"21891","title":"Два последовательных бита чётности","level":2,"tag":"Основание 2 · count · бит чётности","source":"Открытый вариант ЕГЭ 2025 · № 21891 · базовый уровень","condition":"На вход алгоритма подаётся натуральное число N.\n1. Строится двоичная запись N.\n2. Справа дописывается остаток от деления количества единиц на 2.\n3. Для уже изменённой записи то же действие выполняется ещё раз.\nПолученная строка — двоичная запись R.\nНайдите наименьшее N, для которого R больше 253.","answer":"64","base":"2","solution":"for n in range(1, 10000):\n    a = f(n, 2)\n    a += str(a.count('1') % 2)\n    a += str(a.count('1') % 2)\n    r = int(a, 2)\n    if r > 253:\n        print(n)\n        break\n# print(r)","hint":"Количество единиц находи методом count('1'). После первого дописывания пересчитай количество единиц уже в новой строке — второй бит зависит от изменённой записи.","skills":["bin","oct","hex","base","intbase","sum","count","mod","abs"]},{"id":"7887","title":"Двоичная запись и прибавление единицы","level":3,"tag":"Основание 2 · арифметика","condition":"Выполни тот же алгоритм: для чётного N слева допиши 10, для нечётного — слева 1 и справа 01. Затем к полученному двоичному числу прибавь единицу. Найдите максимальное R при N ≤ 1 234 567.","answer":"13326878","solution":"maxi = 0\nfor n in range(1, 1234567 + 1):\n    a = f(n, 2)\n    if n % 2 == 0:\n        a = '10' + a\n    else:\n        a = '1' + a + '01'\n    r = int(a, 2) + 1\n    maxi = max(maxi, r)\nprint(maxi)\n# print(r)","hint":"Сначала сформируй двоичную строку по чётности, затем переведи её в число и прибавь 1. Перебор включает 1 234 567.","base":"2","sourceAnswer":"13326877","source":"Практика из предоставленного списка","skills":["bin","oct","hex","base","intbase"]},{"id":"5447","title":"Повторяющиеся преобразования двоичной записи","level":3,"tag":"Основание 2 · цикл while","condition":"Строится двоичная запись N. Если число единиц чётное, стирается ведущая единица (и ставшие ведущими нули). Иначе удаляются все нули и в конец приписывается 1. Над новой записью действия повторяются. Результат переводится в десятичную систему. Сколько N ≤ 1000 дают R = 7?","answer":"120","solution":"kol = 0\nfor n in range(1, 1001):\n    a = f(n, 2)\n    for _ in range(2):\n        if a.count('1') % 2 == 0:\n            a = a[1:].lstrip('0')\n            if not a:\n                a = '0'\n        else:\n            a = a.replace('0', '') + '1'\n    r = int(a, 2)\n    if r == 7:\n        kol += 1\nprint(kol)\n# print(r)","hint":"Здесь нужен внутренний while: пока запись не стала однозначной, выполняй одно из двух преобразований. Количество подходящих N увеличивай счётчиком kol.","base":"2","source":"Практика из предоставленного списка","skills":["bin","oct","hex","base","intbase"]},{"id":"1727","title":"Два бита по сумме цифр и число результатов","level":3,"tag":"Основание 2 · сумма цифр · множество","condition":"Строится двоичная запись N. Дважды подряд к записи справа дописывается остаток от деления суммы её цифр на 2. Сколько различных чисел R попадает в отрезок [210; 260]?","answer":"14","solution":"res = set()\nfor n in range(1, 10000):\n    a = f(n, 2)\n    for i in range(2):\n        a += str(a.count('1') % 2)\n    r = int(a, 2)\n    if 210 <= r <= 260:\n        res.add(r)\nprint(len(res))\n# print(r)","hint":"Используй множество set(), чтобы одинаковые R учитывались один раз. Два раза повтори: посчитай единицы в текущей строке и добавь остаток от деления на 2.","base":"2","source":"Практика из предоставленного списка","skills":["bin","oct","hex","base","intbase","str","slice","count","replace","join","sum","mod","abs","set","len"]},{"id":"8094П","title":"Изменение двух левых разрядов по чётности суммы","level":3,"tag":"Основание 2 · срезы строк","condition":"Строится двоичная запись N. Если сумма цифр записи чётная, справа дописывается 0, затем два левых разряда заменяются на 10. Если сумма нечётная — справа дописывается 1, а два левых разряда заменяются на 11. Найдите минимальное N, при котором R > 480.","answer":"176","solution":"for n in range(1, 100000):\n    a = f(n, 2)\n    if a.count('1') % 2 == 0:\n        a = a + '0'\n        a = '10' + a[2:]\n    else:\n        a = a + '1'\n        a = '11' + a[2:]\n    r = int(a, 2)\n    if r > 480:\n        print(n)\n        break\n# print(r)","hint":"Сумма двоичных цифр равна количеству единиц. После добавления справа символа замени первые два символа через срез a = '10' + a[2:] или a = '11' + a[2:].","source":"Практика из предоставленного списка","skills":["bin","oct","hex","base","intbase","str","slice","count","replace","join","sum","mod","abs"]},{"id":"8217","title":"Восьмеричная запись и замена цифр","level":3,"tag":"Основание 8 · replace · срезы","condition":"Строится восьмеричная запись N. Если запись начинается на 5, все двойки заменяются единицами, все единицы — двойками, затем слева приписывается 11. Иначе справа приписывается 10, после чего первый и последний разряды полученной записи заменяются на 2 и 0 соответственно. Найдите максимальное N, для которого R < 1354 и R максимально.","answer":"61","solution":"maxi = -1\nans = 0\nfor n in range(1, 100000):\n    a = f(n, 8)\n    if a[0] == '5':\n        a = a.replace('1', 'x').replace('2', '1').replace('x', '2')\n        a = '11' + a\n    else:\n        a += '10'\n        a = '2' + a[1:-1] + '0'\n    r = int(a, 8)\n    if r < 1354:\n        if r > maxi:\n            maxi = r\n            ans = n\n        elif r == maxi:\n            ans = max(ans, n)\nprint(ans)\n# print(r)","hint":"Для одновременной замены 1 и 2 используй временный символ, чтобы замены не влияли друг на друга. В другой ветке применяй срез a[1:-1]. Сохраняй N, соответствующее наибольшему R.","base":"8","source":"Практика из предоставленного списка","skills":["bin","oct","hex","base","intbase","str","slice","count","replace","join"]},{"id":"6988","title":"Инверсия двоичной записи и бит чётности","level":3,"tag":"Основание 2 · zfill · replace","condition":"Строится двоичная запись N, дополненная слева нулями до 8 разрядов. Все разряды инвертируются. Справа дописывается бит чётности исходной записи N: 0, если число единиц чётно, и 1, если нечётно. Найдите максимальное R < 170.","answer":"169","solution":"maxi = 0\nfor n in range(10000):\n    a = f(n, 2).zfill(8)\n    b = a.replace('1', 'x').replace('0', '1').replace('x', '0')\n    b += str(a.count('1') % 2)\n    r = int(b, 2)\n    if r < 170:\n        maxi = max(maxi, r)\nprint(maxi)\n# print(r)","hint":"zfill(8) дополняет строку слева нулями. Инвертируй цифры через временный символ. Бит чётности вычисляй по исходной записи, до инверсии.","base":"2","source":"Практика из предоставленного списка","skills":["bin","oct","hex","base","intbase","str","slice","count","replace","join","sum","mod","abs"]},{"id":"4869","title":"Единицы и нули на позициях двоичной записи","level":3,"tag":"Основание 2 · индексы","condition":"Строится двоичная запись N. Вычисляется количество единиц на чётных местах и количество нулей на нечётных местах (места считаются слева направо с единицы). R — модуль разности. Найдите наименьшее N, для которого R = 5.","answer":"1023","solution":"for n in range(2, 100000):\n    a = f(n, 2)\n    c1 = a[1::2].count('1')\n    c0 = a[0::2].count('0')\n    r = abs(c1 - c0)\n    if r == 5:\n        print(n)\n        break\n# print(r)","hint":"Чётные места — индексы 1, 3, 5…; нечётные места — индексы 0, 2, 4…. Можно использовать срезы a[1::2] и a[0::2], затем count().","base":"2","source":"Практика из предоставленного списка","skills":["bin","oct","hex","base","intbase","str","slice","count","replace","join"]},{"id":"25344","title":"Троичная сумма цифр и минимальное нечётное R","level":3,"tag":"Основание 3 · сумма цифр · min · чётность","source":"ЕГКР 13.12.2025 · № 25344 · базовый уровень","condition":"На вход алгоритма подаётся натуральное число N.\n1. Строится троичная запись N.\n2. Если N делится на 3, к записи дописываются две последние троичные цифры.\n3. Если N не делится на 3, вычисляется сумма цифр троичной записи; эта сумма умножается на 3, переводится в троичную систему и дописывается справа.\nПолученная строка — троичная запись R.\nНайдите минимальное нечётное R, которое больше 208.","answer":"243","base":"3","solution":"mini = 10**100\nfor n in range(1, 10000):\n    a = f(n, 3)\n    if n % 3 == 0:\n        a += a[-2:]\n    else:\n        sm = sum(int(c) for c in a)\n        a += f(sm * 3, 3)\n    r = int(a, 3)\n    if r > 208 and r % 2 == 1:\n        mini = min(mini, r)\nprint(mini)\n# print(n)","hint":"В этой задаче появляется сумма цифр строки: sum(int(c) for c in a). После перевода результата в десятичную систему проверь сразу два условия: R > 208 и нечётность R. Ищи минимум среди подходящих R.","skills":["bin","oct","hex","base","intbase","str","slice","count","replace","join","sum","mod","abs","minmax","sort"]},{"id":"22456","title":"Преобразование по сумме единиц и нулей","level":3,"tag":"Основание 2 · count · replace · срезы","source":"Банк заданий · автор Л. Шастин · базовый уровень (в источнике не указано мероприятие)","condition":"На вход алгоритма подаётся натуральное число N.\n1. Строится двоичная запись N.\n2. Если сумма цифр записи чётная, справа дописывается 1, затем два левых разряда заменяются на 11.\n3. Если сумма цифр нечётная, справа дописывается 0, если нулей меньше, чем единиц; иначе справа дописывается 1.\nПолученная строка — двоичная запись R.\nНайдите минимальное N, для которого R больше 271.","answer":"129","base":"2","solution":"for n in range(1, 10000):\n    a = f(n, 2)\n    if a.count('1') % 2 == 0:\n        a += '1'\n        a = '11' + a[2:]\n    else:\n        if a.count('0') < a.count('1'):\n            a += '0'\n        else:\n            a += '1'\n    r = int(a, 2)\n    if r > 271:\n        print(n)\n        break\n# print(r)","hint":"Сумма цифр двоичной записи — это количество единиц. Количество нулей находи через count('0'). Для замены двух левых разрядов используй '11' + a[2:].","skills":["bin","oct","hex","base","intbase","str","slice","count","replace","join","sum","mod","abs"]},{"id":"25138","title":"Сумма, минимум и максимум цифр пятизначного числа","level":3,"tag":"Цифры числа · min/max · конкатенация","source":"Банк заданий · автор К. Иглин · базовый уровень (в источнике не указано мероприятие)","condition":"Автомат получает пятизначное число N.\n1. Вычисляется S — сумма всех цифр числа.\n2. Вычисляется M — сумма максимальной и минимальной цифры.\n3. L — первая цифра, R — последняя цифра числа.\n4. P1 = S − L, P2 = M − R.\n5. Числа P1 и P2 записываются рядом в неубывающем порядке.\nНайдите наибольшее N, для которого автомат выдаёт Z = 222.","answer":"99607","base":"10","solution":"ans = 0\nfor n in range(10000, 100000):\n    a = str(n)\n    s = sum(int(c) for c in a)\n    m = max(int(c) for c in a) + min(int(c) for c in a)\n    l = int(a[0])\n    r = int(a[-1])\n    p1 = s - l\n    p2 = m - r\n    z = int(str(min(p1, p2)) + str(max(p1, p2)))\n    if z == 222:\n        ans = max(ans, n)\nprint(ans)\n# print(z)","hint":"Преобразуй N в строку. Сумму цифр считай через sum(), минимум и максимум — через min() и max(). Первую и последнюю цифры возьми по индексам 0 и -1. Для записи двух результатов рядом используй конкатенацию строк.","skills":["str","slice","count","replace","join","sum","mod","abs","minmax","sort"]},{"id":"4870","title":"Составление двузначных чисел из цифр","level":4,"tag":"Перестановки · combinations","condition":"Автомат получает трёхзначное число N. Из его цифр составляются все возможные двузначные числа без ведущего нуля. На экран выводится разность наибольшего и наименьшего. Сколько чисел N на отрезке [300; 400] дают результат 20?","answer":"12","solution":"from itertools import combinations\nkol = 0\nfor n in range(300, 401):\n    a = str(n)\n    pairs = [int(x + y) for x, y in combinations(a, 2) if x != '0']\n    pairs += [int(y + x) for x, y in combinations(a, 2) if y != '0']\n    r = max(pairs) - min(pairs)\n    if r == 20:\n        kol += 1\nprint(kol)\n# print(r)","hint":"Перебери пары индексов/цифр через combinations(a, 2). Для каждого набора добавь обе перестановки, но не допускай ноль в первой позиции. Считай подходящие N.","base":"10","source":"Практика из предоставленного списка","skills":["str","slice","count","replace","join"]}];

menu.innerHTML=`<h4>Строки для сборки — порядок перемешан <button style="float:right" id="closeMenu">Закрыть ✕</button></h4>`+lines.map((l,i)=>`<button class="lineopt" data-line="${i}">${esc(l)}</button>`).join("");
menu.style.left=Math.min(innerWidth-620,Math.max(8,rect.right+5))+"px";menu.hidden=false;menu.scrollTop=0;$("closeMenu").onclick=()=>menu.hidden=true;
menu.querySelectorAll("[data-line]").forEach(b=>b.onclick=()=>{let a=ed.value.split("\n");if(a.length===1&&!a[0])a=[];let at=Math.min(index,a.length);a.splice(at,0,lines[+b.dataset.line]);a.splice(at+1,0,"");ed.value=a.join("\n");saveEditor();wireEditor(ed.id,kind==="func"?"funcGutter":"taskGutter",kind);menu.hidden=true})}
document.addEventListener("click",e=>{if(!$("menu").contains(e.target)&&!e.target.closest("[data-plus]"))$("menu").hidden=true});
function copyText(s){navigator.clipboard?.writeText(s).then(()=>toast("Код скопирован")).catch(()=>toast("Не удалось скопировать — выдели код вручную"))}
function toast(s){let x=document.createElement("div");x.className="toast";x.textContent=s;document.body.append(x);setTimeout(()=>x.remove(),1800)}
async function runCode(kind){saveEditor();let ed=$(kind==="func"?"funcEditor":"taskEditor");let code=ed?.value|| (kind==="func"?store.sharedFunc||"":state().func||"");if(!code.trim()){toast("Сначала собери или напиши код");return}
let full=kind==="func"?code+"\nprint(f(10, 2))":((store.sharedFunc||"")+"\n\n"+code);
if(kind==="func"&&!store.sharedFunc&&!code.includes("def f")){toast("В функции не найдено def f");return}
let out=$(kind==="func"?"funcResult":"taskResult");out.textContent="Запускаю Python…";
try{let py=await getPy();py.globals.set("student_code",full);py.globals.set("stdin_text",task().sampleInput||"");let result=await py.runPythonAsync(`import sys,io,contextlib,json\nbuf=io.StringIO(); old=sys.stdin; sys.stdin=io.StringIO(stdin_text)\ntry:\n with contextlib.redirect_stdout(buf): exec(compile(student_code,'<student>','exec'),{})\n obj={'out':buf.getvalue(),'err':None}\nexcept Exception as e: obj={'out':buf.getvalue(),'err':type(e).__name__+': '+str(e)}\nfinally: sys.stdin=old\njson.dumps(obj)`);let r=JSON.parse(String(result));if(r.err)throw Error(r.err);let got=r.out.trim();let expected=kind==="func"?"1010":String(task().answer).trim();out.textContent="Вывод программы:\n"+(got||"(пусто)")+"\n\nОжидаемый ответ: "+expected;let ok=kind==="func"?got==="1010":(got===expected||got.split(/\s+/).includes(expected));out.className="result "+(ok?"good":"bad");if(ok&&kind==="task"){state().done=true;state().lastRun={code,output:got,correct:true,mode};reportLog.push({id:current,mode,help:mode==="manual"?"самостоятельно":mode==="indent"?"расстановка отступов по готовому коду":"сборка строками по плюсикам",hintUsed:!!state().hintViewed,code,output:got,correct:true,time:new Date().toLocaleString()});store.reportLog=reportLog;persist();renderList();toast("Верно! Задание отмечено зелёным.");setTimeout(()=>{let pending=sortedTasks().filter(x=>!state(x.id).done);if(pending.length){current=pending[0].id;currentStage="task";mode="indent";render()}},1600)}else if(!ok){state().lastRun={code,output:got,correct:false,mode};reportLog.push({id:current,mode,help:mode==="manual"?"самостоятельно":mode==="indent"?"расстановка отступов по готовому коду":"сборка строками по плюсикам",hintUsed:!!state().hintViewed,code,output:got,correct:false,time:new Date().toLocaleString()});store.reportLog=reportLog;persist()}}
catch(e){out.textContent="Ошибка выполнения: "+e.message;out.className="result bad";reportLog.push({id:current,mode,help:"запуск с ошибкой",code,error:e.message,correct:false,time:new Date().toLocaleString()});persist()}}
let pyPromise;async function getPy(){if(!pyPromise)pyPromise=(async()=>{if(!window.loadPyodide){await new Promise((res,rej)=>{let s=document.createElement("script");s.src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js";s.onload=res;s.onerror=()=>rej(Error("Не удалось загрузить Python — проверь интернет"));document.head.append(s)})}return loadPyodide({indexURL:"https://cdn.jsdelivr.net/pyodide/v0.26.4/full/"})})();return pyPromise}
function showRefs(id){let allow=TASK_REFS[id]||["range","if","str","int","print"];let cards=REFS.filter(r=>allow.includes(r[3])||["Перевод в системы счисления"].includes(r[0])&&allow.includes("f"));$("refContent").innerHTML=`<div class="refgrid">${cards.map(r=>`<div class="refcard"><h3>${esc(r[0]||"Команда")}</h3><code>${esc(r[1])}</code><div>${esc(r[2])}</div></div>`).join("")}</div>`;$("refDialog").showModal()}
function showReport(){let logs=reportLog,done=sortedTasks().filter(t=>state(t.id).done).length;$("reportContent").innerHTML=`<p><b>ЕГЭ · Задание 5</b> · ${new Date().toLocaleString()}</p><div class="report-summary">Всего заданий: ${sortedTasks().length} · Решено: ${done} · Попыток: ${logs.length}</div>`+logs.map(x=>`<div class="reportitem ${x.correct?'pass':'fail'}"><b>№ ${esc(x.id)} — ${x.correct?'верно':'пока неверно'}</b><div class="muted">Режим: ${esc(x.help)} · ${esc(x.time)}</div><pre>${esc(x.code||x.error||"")}</pre><div>Вывод: ${esc(x.output||x.error||"")}</div></div>`).join("")||"<p>Попыток пока нет.</p>";$("reportDialog").showModal()}
function editTask(){let t=task();$("editId").value=t.id;$("editCondition").value=store.conditions?.[current]??t.condition;$("editAnswer").value=t.answer||"";$("editSolution").value=t.solution||"";$("editHint").value=t.hint||"";$("editSource").value=t.source||"";$("taskDialogTitle").textContent="Редактирование задания № "+t.id;$("taskDialog").showModal()}
function saveTask(){let t=task();let newId=$("editId").value.trim();if(!newId){toast("Укажи номер");return}t.id=newId;t.condition=$("editCondition").value;t.answer=$("editAnswer").value.trim();t.solution=$("editSolution").value;t.hint=$("editHint").value;t.source=$("editSource").value;persist();$("taskDialog").close();current=newId;render()}
function addTask(){let id=prompt("Номер нового задания:");if(!id)return;let t={id,title:"Новое задание",level:1,condition:"",answer:"",solution:"",hint:"",source:"Добавлено преподавателем",sampleInput:"",sampleOutput:""};TASKS.push(t);current=id;editTask()}
function editConditionFull(){let el=$("condition");el.contentEditable="true";el.focus();$("editCond").textContent="Сохранить условие";$("editCond").onclick=()=>{store.conditions??={};store.conditions[current]=el.innerText;persist();render()}}
$("refBtn").onclick=()=>showRefs(current);$("reportBtn").onclick=showReport;$("themeBtn").onclick=()=>{document.body.classList.toggle("dark");localStorage.setItem("ege5_dark",document.body.classList.contains("dark")?"1":"0")};
$("saveBtn").onclick=()=>{saveEditor();let blob=new Blob([document.documentElement.outerHTML],{type:"text/html"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="EGE_5_тренажер_с_прогрессом.html";a.click();URL.revokeObjectURL(a.href);toast("Файл приложения сохранён")};
document.querySelectorAll("[data-font]").forEach(b=>b.onclick=()=>{document.body.className=document.body.className.replace(/font-\w+/g,"").trim()+" font-"+b.dataset.font;localStorage.setItem("ege5_font",b.dataset.font)});
document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));renderList()});
$("printReport").onclick=()=>window.print();$("saveTaskEdit").onclick=saveTask;
$("main").addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;
if(b.dataset.mode){setMode(b.dataset.mode);return}
switch(b.id){
case"runTask":runCode("task");break;case"runFunc":runCode("func");break;
case"copyTask":copyText($("taskEditor")?.value||"");break;case"copyAll":copyText((store.sharedFunc||"")+(store.sharedFunc?"\\n\\n":"")+($("taskEditor")?.value||""));break;case"copyFunc":case"copyFunc2":copyText($("funcEditor")?.value||store.sharedFunc||"");break;
case"copyAll":copyText((store.sharedFunc||"")+"\n\n"+($("taskEditor")?.value||""));break;
case"clearTask":if($("taskEditor"))$("taskEditor").value="";saveEditor();wireEditor("taskEditor","taskGutter","task");break;
case"showHint":$("hintBox").hidden=!$("hintBox").hidden;state().hintViewed=!$("hintBox").hidden;persist();break;
case"saveCode":saveEditor();toast("Код сохранён");break;
case"saveFunc":store.sharedFunc=$("funcEditor")?.value||state().func||"";state().func=store.sharedFunc;persist();toast("Функция сохранена для следующих заданий");render();break;
case"reuseFunc":state().func=store.sharedFunc;persist();toast("Функция подключена");render();break;
case"editFunc":$("funcEditorArea").hidden=false;break;
case"editTask":editTask();break;case"deleteTask":if(confirm("Удалить задание №"+current+"?")){store.deleted??=[];store.deleted.push(current);persist();current=sortedTasks()[0]?.id;render()}break;
}
});
function init(){if(localStorage.getItem("ege5_dark")==="1")document.body.classList.add("dark");let f=localStorage.getItem("ege5_font")||"medium";document.body.classList.add("font-"+f);render()}
init();
</script></body></html>
