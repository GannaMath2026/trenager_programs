<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Информатика · ЕГЭ 5 · Системы счисления</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>:root{--bg:#f3f5fb;--card:#fff;--ink:#1d2640;--mut:#6b7491;--line:#e1e5f0;--pri:#4f6bff;--pri2:#7b5cff;--ok:#16a36a;--okl:#dff6ea;--err:#e5484d;--errl:#ffe3e3;--warn:#f0a400;--code:#0f1424;--code2:#161d33;--cink:#e7ecff;--sh:0 6px 22px rgba(30,40,80,.08)}
[data-theme=dark]{--bg:#0f1322;--card:#181e33;--ink:#e6e9f5;--mut:#98a0bf;--line:#2a3150;--okl:#143826;--errl:#3b1518;--code:#0b0f1d;--code2:#131a30;--sh:0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Nunito','Segoe UI',Roboto,Arial,sans-serif}
button{font:inherit;cursor:pointer}input,select,textarea{font:inherit;color:inherit}
.mono,code,pre{font-family:"JetBrains Mono","Cascadia Code",Consolas,"Courier New",monospace}
.btn{border:0;border-radius:11px;padding:8px 14px;font-weight:700;background:var(--card);color:var(--ink);box-shadow:0 0 0 1.5px var(--line) inset;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn:hover{box-shadow:0 0 0 1.5px var(--pri) inset}
.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 6px 16px rgba(79,107,255,.3)}
.btn.ok{background:var(--ok);color:#fff;box-shadow:none}
.btn.yel{background:linear-gradient(135deg,#ffcf4a,#ffb02e);color:#4a3000;box-shadow:none}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.btn.on{background:#e6eaff;box-shadow:0 0 0 1.5px var(--pri) inset;color:#2f45c9}[data-theme=dark] .btn.on{background:#262f55;color:#b9c4ff}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:16px 20px;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1d2640;color:#fff;padding:11px 18px;border-radius:12px;z-index:300;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90vw;font-weight:600}
.mbg{position:fixed;inset:0;background:rgba(15,20,40,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:12px}
.mdl{background:var(--card);border-radius:20px;padding:20px;max-width:640px;width:100%;max-height:94vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.mdl.wide{max-width:1050px}.mdl.full{max-width:none;width:96vw;height:94vh;max-height:94vh;padding:16px;display:flex;flex-direction:column}
.mdl h2{margin:0 0 10px}
.mhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}.mhead h2{margin:0;flex:1}
.inp{border:1.5px solid var(--line);background:var(--bg);border-radius:11px;padding:8px 12px;outline:none}
.inp:focus{border-color:var(--pri)}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:9px 16px;background:var(--card);box-shadow:0 2px 12px rgba(30,40,80,.07);flex-wrap:wrap}
.logo{font-weight:900;font-size:17px;display:flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer}
.logo i{font-style:normal;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-size:14px}
.top .sp{flex:1}
.ib{border:0;background:var(--bg);color:var(--ink);border-radius:10px;padding:7px 10px;font-weight:700;white-space:nowrap}
.ib:hover{background:#e6eaff}[data-theme=dark] .ib:hover{background:#262f55}
.ib.yel{background:linear-gradient(135deg,#ffcf4a,#ffb02e);color:#4a3000}
.who{font-weight:800;background:var(--bg);border-radius:999px;padding:6px 12px}
.modeb{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:#e3f6ec;color:#0f7a4d}.modeb.home{background:#fff0e0;color:#b25e00}
.login{max-width:560px;margin:7vh auto;padding:0 14px}
.hero{background:linear-gradient(135deg,#4f6bff,#7b5cff 60%,#b44cff);color:#fff;border-radius:24px;padding:26px;box-shadow:0 20px 50px rgba(79,107,255,.35);position:relative;overflow:hidden;margin-bottom:14px}
.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0;opacity:.92}
.hero .code-deco{position:absolute;right:8px;bottom:-6px;font:700 12px/1.35 Consolas,monospace;opacity:.22;white-space:pre;text-align:left}
.slist{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.slist button{border:0;background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:700}
.lay{display:grid;grid-template-columns:290px 1fr;gap:16px;padding:16px;max-width:1700px;margin:0 auto}
.side{position:sticky;top:66px;align-self:start;max-height:calc(100vh - 82px);overflow:auto;background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:12px}
.prog{display:flex;height:10px;border-radius:9px;overflow:hidden;background:var(--bg);margin:4px 0 8px}.prog i{display:block;height:100%}
.sbig{width:100%;border:0;border-radius:14px;padding:10px 12px;text-align:left;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:6px;background:var(--bg);color:var(--ink)}
.sbig.cons{background:linear-gradient(135deg,#eef1ff,#f6efff)}[data-theme=dark] .sbig.cons{background:#232a4a}
.sbig.cur{outline:2.5px solid var(--pri)}
.sbig small{margin-left:auto;font-weight:700;color:var(--mut)}
.sec{margin-top:10px}.sech{font-weight:900;font-size:13.5px;padding:4px 2px;display:flex;align-items:center;gap:6px}.sech small{margin-left:auto;color:var(--mut)}
.its{display:flex;flex-wrap:wrap;gap:5px;padding:2px 2px 6px}
.it{border:0;border-radius:9px;padding:4px 7px;font:700 12.5px Consolas,monospace;background:var(--bg);color:var(--ink);position:relative;min-width:46px}
.it.z{background:#fff6dc;color:#8a6400}[data-theme=dark] .it.z{background:#3a3010;color:#ffd666}
.it.ok{background:#16a36a;color:#fff}.it.err{background:#7bd3a7;color:#08321f}.it.hint{background:#ffd666;color:#4a3500}.it.fill{background:#ffb27a;color:#4a2000}
.it.cur{outline:2.5px solid var(--pri);outline-offset:1px}
.it.tried::after{content:'';position:absolute;right:2px;top:2px;width:6px;height:6px;border-radius:50%;background:var(--err)}
.legend{font-size:11.5px;color:var(--mut);display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.main{min-width:0}
.th{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.th h2{margin:0;font-size:21px}
.tag{font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;background:var(--bg);color:var(--mut);white-space:nowrap}
.tag.z{background:#fff1c7;color:#8a6400}.tag.st{background:#dff6ea;color:#0f7a4d}
.dots{color:#f0a400;letter-spacing:1px}
.cond{white-space:pre-wrap;font-size:16px;line-height:1.55;margin-top:10px}
.cond .q{font-weight:800;background:#fff6dc;border-radius:6px;padding:1px 4px}.cond .cnum{font-weight:850}.cond .example{color:#13734f;background:#eaf8ef;border-radius:5px;padding:1px 3px}[data-theme=dark] .cond .q{background:#3a3010}[data-theme=dark] .cond .example{color:#91e1b6;background:#153a28}
.fold{background:var(--code2);color:#aab4da;border-radius:12px;font:13.5px/20px Consolas,monospace;margin-bottom:8px;overflow:hidden}
.fold>button{border:0;background:transparent;color:inherit;font:inherit;width:100%;text-align:left;padding:7px 12px;display:flex;gap:8px;align-items:center}
.fold>button b{color:#c792ea}.fold>button span.c{color:#69739a;margin-left:auto;font-family:Nunito,sans-serif;font-size:12px}
.fold pre{margin:0;padding:6px 14px 10px;color:var(--cink);border-top:1px solid #253055}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}.bar .sp{flex:1}.ed-tools{display:flex;gap:5px;flex-wrap:wrap;align-items:center}.bar button{max-width:100%}.base-vis-frame{width:100%;height:calc(94vh - 64px);min-height:420px;flex:1;border:0;border-radius:12px;background:#0b1018}
.exb{border:0;border-radius:9px;padding:5px 10px;font:700 12.5px Consolas,monospace;background:#e8f7ef;color:#0f7a4d}
[data-theme=dark] .exb{background:#143826;color:#7fe0b0}
.exin{width:84px;padding:5px 8px;font:700 13px Consolas,monospace}
.menu{position:absolute;background:var(--card);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:6px;z-index:150;display:flex;flex-direction:column;min-width:220px;border:1px solid var(--line)}
.menu button{white-space:pre;border:0;background:transparent;color:var(--ink);text-align:left;padding:6px 10px;border-radius:8px;font:13px Consolas,monospace}
.menu button:hover{background:var(--bg)}
.menu small{font-family:Nunito,sans-serif;color:var(--mut);padding:4px 10px}
/* редактор */
.ed{display:flex;background:var(--code);border-radius:14px;overflow:hidden;font:14px/21px "JetBrains Mono","Cascadia Code",Consolas,monospace}
.ed-gut{padding:8px 0;background:var(--code2);color:#5d6890;text-align:right;user-select:none;min-width:38px}
.ed-gut div{padding:0 8px;height:21px}.ed-gut div.on{background:#4f6bff;color:#fff}.ed-gut div.er{background:#e5484d;color:#fff}
.ed-box{position:relative;flex:1;min-width:0;overflow-x:auto}
.ed-hl,.ed-ta,.ed-mark{margin:0;padding:8px 12px;font:inherit;white-space:pre;tab-size:4;border:0}
.ed-hl{position:absolute;inset:0;overflow:hidden;color:var(--cink);pointer-events:none;z-index:1}
.ed-mark{position:absolute;inset:0;overflow:hidden;padding-left:0;padding-right:0;pointer-events:none;z-index:0}
.ed-mark div{height:21px}.ed-mark div.on{background:rgba(79,107,255,.3)}.ed-mark div.er{background:rgba(229,72,77,.32)}
.ed-ta{position:relative;z-index:2;display:block;width:100%;background:transparent;color:transparent;caret-color:#fff;outline:none;resize:none;overflow-x:auto;overflow-y:hidden;min-height:120px}
.ed-ta::selection{background:rgba(123,92,255,.45)}
.hk{color:#c792ea;font-weight:700}.hs{color:#c3e88d}.hn{color:#f78c6c}.hc{color:#69739a;font-style:italic}.hb{display:inline-block;white-space:pre;background:#ffd666;color:#1d2640;border-radius:4px;font-weight:800;min-width:1ch;padding:0 .22em;margin-left:.16em}.hb.touched{opacity:1;background:rgba(255,214,102,.13);color:#e7ecff;box-shadow:0 0 0 1px rgba(255,214,102,.38)}.hb.active{opacity:1;background:rgba(255,214,102,.22)}
.out{background:var(--code);color:#cfe3cf;border-radius:12px;padding:10px 12px;font:13.5px/1.5 Consolas,monospace;white-space:pre-wrap;word-break:break-all;max-height:240px;overflow:auto;min-height:42px;margin-top:8px}
.out .last{background:#2b3a1e;color:#d9ff9e;border-radius:4px;padding:0 3px;font-weight:700}
.out .e{color:#ff9a9a}.out .m{color:#7f8bb8}.out .g{color:#7fe0b0;font-weight:700}
.out.solved{box-shadow:0 0 0 3px var(--ok)}
.status{font-size:12.5px;color:var(--mut);margin-top:4px}
.exp{background:#fff0f0;color:#9b1c21;border-radius:12px;padding:9px 12px;font-size:14px;margin-top:6px}[data-theme=dark] .exp{background:#3b1518;color:#ffb0b3}
.ans{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bg);border-radius:14px;padding:10px 12px;margin-top:10px}
.ans .inp{width:170px;font:700 17px Consolas,monospace;background:var(--card)}
.fb{border-radius:12px;padding:10px 14px;font-weight:700;display:none;margin-top:8px}
.fb.show{display:block}.fb.good{background:var(--okl);color:var(--ok)}.fb.bad{background:var(--errl);color:var(--err)}
.nx{height:5px;background:rgba(22,163,106,.25);border-radius:9px;margin-top:8px;overflow:hidden}.nx i{display:block;height:100%;background:var(--ok);width:0;transition:width 2.2s linear}
.card.solved{box-shadow:0 0 0 3px var(--ok),var(--sh)}
.hcard{background:#fff8dc;border:1.5px solid #ffd98a;border-radius:14px;padding:10px 14px;margin-top:8px;color:#4a3500;animation:pop .3s}
[data-theme=dark] .hcard{background:#3a2e12;border-color:#6b5420;color:#ffe6a8}
.hcard .hn2{display:inline-block;background:#f0a400;color:#fff;border-radius:999px;padding:0 9px;margin-right:6px;font-size:12.5px;font-weight:800}
.hcard pre{background:var(--code);color:var(--cink);border-radius:10px;padding:8px 10px;margin:8px 0 4px;font-size:13px;overflow:auto}
code.i{background:var(--bg);border-radius:5px;padding:0 4px;font-size:.92em}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
/* общие подсказки */
.ghg{margin:14px 0 6px;display:flex;align-items:center;gap:8px;font-size:18px;font-weight:900}.ghg i{width:16px;height:16px;border-radius:5px;display:inline-block}
.ghs{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.ghc{background:var(--sc);border-radius:8px 8px 18px 8px;border-top:6px solid var(--se);padding:12px 14px;color:#1d2640;box-shadow:0 8px 18px rgba(40,40,80,.1)}
.ghc b.t{display:block;margin-bottom:4px}
.ghc pre{background:#0f1424;color:#e7ecff;border-radius:10px;padding:8px 10px;margin:8px 0 6px;font-size:12.8px;overflow:auto;white-space:pre}
.ghc .btn{background:#fff}
/* консоль */
.con{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:12px}
.conlog{background:var(--code);color:#e7ecff;border-radius:14px;padding:12px;font:14px/1.5 Consolas,monospace;overflow:auto;white-space:pre-wrap;word-break:break-all;display:flex;flex-direction:column}
.conlog .cmd{color:#82aaff}.conlog .res{color:#c3e88d}.conlog .err{color:#ff9a9a}.conlog .pr{color:#e7ecff}.conside{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}.conside textarea{display:block;width:100%;min-height:112px;resize:vertical;background:var(--code);color:#e7ecff;border:1px solid var(--line);border-radius:8px;padding:8px;font:13px/1.45 Consolas,monospace;margin:8px 0}.conside .help{font-size:12px;color:var(--mut);margin:7px 0 12px}.ru-error{display:block;color:#ffd98a;font:13px/1.45 system-ui,sans-serif;padding-top:3px}
.conin{display:flex;gap:6px;align-items:flex-start;margin-top:auto;padding-top:8px}
.conin span{color:#82aaff;font-weight:800;padding-top:6px}
.conin textarea{flex:1;background:#151c33;border:1px solid #2a3150;border-radius:8px;color:#fff;font:14px/1.5 Consolas,monospace;padding:6px 8px;resize:none;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{border:0;background:var(--bg);color:var(--ink);border-radius:8px;padding:4px 8px;font:12.5px Consolas,monospace}
.chips button:hover{background:#e6eaff}
/* пошаговый мини-питон */
.stp{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.stpv{overflow:auto;display:flex;flex-direction:column;gap:8px}
.vtab{width:100%;border-collapse:collapse;font:14px Consolas,monospace}
.vtab td{border-bottom:1px solid var(--line);padding:5px 6px;vertical-align:top}.vtab td:first-child{color:var(--pri);font-weight:800;width:70px}
.vtab tr.ch td{background:#fff3c4}[data-theme=dark] .vtab tr.ch td{background:#3a3010}
.cells{display:flex;flex-wrap:wrap;gap:2px}
.cells span{display:inline-flex;flex-direction:column;align-items:center;min-width:22px;background:#eef1ff;border-radius:5px;padding:1px 3px;font-weight:800}
.cells span small{font-size:9px;color:var(--mut);font-weight:600}
[data-theme=dark] .cells span{background:#232a4a}
/* конструктор */
.cgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;flex:1;min-height:0}
.cl{display:flex;align-items:center;gap:6px;margin:4px 0;font:15px/1 Consolas,monospace}
.cl .code{flex:1;background:var(--code);color:var(--cink);border-radius:8px;padding:8px 10px;white-space:pre;min-height:36px;display:flex;align-items:center}
.cl.bad .code{box-shadow:0 0 0 2.5px var(--err)}.cl.good .code{box-shadow:0 0 0 2.5px var(--ok)}
.cl .ind{color:#3c4670}
.cl button{border:0;border-radius:8px;padding:6px 9px;background:var(--bg);color:var(--ink);font-weight:800}
.cl .slot{flex:1;border:2px dashed var(--line);border-radius:8px;padding:8px 10px;color:var(--mut);background:transparent;text-align:left;font:15px Consolas,monospace;white-space:pre}
.cl .num{width:24px;color:var(--mut);text-align:right;font-size:12px}
.lvl3{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.cdone{color:var(--ok);font-weight:800}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl td,.tbl th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs button{border:0;padding:9px 14px;border-radius:10px;background:var(--bg);color:var(--ink);font-weight:800}.tabs button.on{background:var(--pri);color:#fff}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;max-width:460px}.fld span{font-size:13px;color:var(--mut);font-weight:700}
.flag{display:inline-flex;align-items:center;gap:4px;margin:3px 5px 3px 0;padding:5px 9px;border-radius:9px;background:var(--bg);font:700 13px Consolas,monospace;cursor:pointer;border:1.5px solid transparent;user-select:none}
.flag.on{border-color:var(--pri);background:#e6eaff;color:#1d2640}
.home{max-width:1100px;margin:16px auto;padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hmc{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:22px;cursor:pointer;border:0;text-align:left;color:var(--ink)}
.hmc:hover{box-shadow:0 0 0 2px var(--pri),var(--sh)}
.hmc h2{margin:6px 0}.hmc .big{font-size:40px}
.pb{height:9px;background:var(--bg);border-radius:9px;overflow:hidden;margin-top:10px}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#5ad19b)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--bg);border-radius:14px;padding:12px}.stat b{font-size:24px;display:block}.stat span{font-size:13px;color:var(--mut)}
@media (max-width:980px){.lay{grid-template-columns:1fr;padding:8px}.side{position:static;max-height:none}.home{grid-template-columns:1fr}.con,.stp,.cgrid{grid-template-columns:1fr}}
</style></head>

<script id="tasks5" type="application/json">[{"id":"31502","src":"Демоверсия 2027","d":1,"sec":"A","text":"На вход алгоритма подаётся натуральное число N. Алгоритм строит по нему новое число R следующим образом.\n1. Строится двоичная запись числа N.\n2. Далее эта запись обрабатывается по следующему правилу:\nа) если число N чётное, то к этой записи справа и слева дописываются по две единицы;\nб) если число N нечётное, то в конец двоичной записи (справа) дописываются два нуля, а в начало (слева) дописывается единица.\nПолученная таким образом запись является двоичной записью искомого числа R.\n3. Результат переводится в десятичную систему и выводится на экран.\nНапример, для исходного числа 13₁₀ = 1101₂ результатом является число 1110100₂ = 116₁₀, а для исходного числа 6₁₀ = 110₂ это число 1111011₂ = 123₁₀.\nУкажите наименьшее число R, превышающее 95, которое может быть результатом работы данного алгоритма.","ex":[[13,116],[6,123]],"code":"l = []\nfor n in range(1, 1000):\n    s = f(n, 2)\n    if ⟦n % 2 == 0⟧:\n        ⟦s = '11' + s + '11'⟧\n    else:\n        ⟦s = '1' + s + '00'⟧\n    r = int(s, 2)\n    # print(n, s, r)   # ← пример\n    if ⟦r > 95⟧:\n        l.append(r)\nprint(⟦min(l)¦l⟧)","hints":[{"t":"Чётность N проверяем остатком: n % 2 == 0. Дописать слева и справа — это сложение строк: '11' + s + '11'.","code":"n = 13\ns = f(n, 2)\nprint(s, n % 2)\ns = '1' + s + '00'\nprint(s, int(s, 2))"},{"t":"Нужно наименьшее R среди подходящих: собираем все R > 95 в список и берём min(l)."}],"ans":"100"},{"id":"7639","src":"Демоверсия 2025 · практика","d":1,"sec":"A","text":"На вход алгоритма подаётся натуральное число N. Алгоритм строит по нему новое число R следующим образом.\n1. Строится двоичная запись числа N.\n2. Далее эта запись обрабатывается по следующему правилу:\nа) если число чётное, то к двоичной записи числа слева дописывается 10;\nб) если число нечётное, то к двоичной записи числа слева дописывается 1 и справа дописывается 01.\nПолученная таким образом запись является двоичной записью искомого числа R.\nНапример, для исходного числа 4 = 100₂ результатом является число 20 = 10100₂, а для исходного числа 5 = 101₂ это число 53 = 110101₂.\nУкажите максимальное число R, которое может быть результатом работы данного алгоритма, при условии, что N не больше 12.","ex":[[4,20],[5,53]],"code":"l = []\nfor n in range(1, 1000):\n    s = f(n, 2)\n    if ⟦n % 2 == 0⟧:\n        ⟦s = '10' + s⟧\n    else:\n        ⟦s = '1' + s + '01'⟧\n    r = int(s, 2)\n    # print(n, s, r)   # ← пример\n    if ⟦n <= 12⟧:\n        l.append(r)\nprint(⟦max(l)¦l⟧)","hints":[{"t":"Ограничение «N не больше 12» — это условие на n, а не на r: if n <= 12. (Можно и сразу range(1, 13).)"},{"t":"Нужно максимальное R — значит, max(l)."}],"ans":"109"},{"id":"4186","src":"Открытый вариант 2022","d":1,"sec":"A","text":"На вход алгоритма подаётся натуральное число N. Алгоритм строит по нему новое число R следующим образом.\n1. Строится двоичная запись числа N.\n2. Далее эта запись обрабатывается по следующему правилу:\nа) если число чётное, то к двоичной записи числа слева дописывается 10;\nб) если число нечётное, то к двоичной записи числа слева дописывается 1 и справа дописывается 01.\nПолученная таким образом запись является двоичной записью искомого числа R.\nНапример, для исходного числа 4₁₀ = 100₂ результатом будет являться число 20₁₀ = 10100₂, а для исходного числа 5₁₀ = 101₂ результатом будет являться число 53₁₀ = 110101₂.\nУкажите минимальное число N, после обработки которого с помощью этого алгоритма получается число R, большее, чем 441.","ex":[[4,20],[5,53]],"code":"for n in range(1, 1000):\n    s = f(n, 2)\n    if ⟦n % 2 == 0⟧:\n        ⟦s = '10' + s⟧\n    else:\n        ⟦s = '1' + s + '01'⟧\n    r = int(s, 2)\n    # print(n, s, r)   # ← пример\n    if ⟦r > 441⟧:\n        print(n)\n        break","hints":[{"t":"n в цикле идёт по возрастанию, поэтому первое подходящее n и есть минимальное: печатаем и сразу break."}],"ans":"47"},{"id":"8094","src":"Досрочный ЕГЭ 2025 · практика","d":2,"sec":"B","text":"На вход алгоритма подаётся натуральное число N. Алгоритм строит по нему новое число R следующим образом.\n1. Строится двоичная запись числа N.\n2. Далее эта запись обрабатывается по следующему правилу:\nа) если сумма цифр в двоичной записи числа чётная, то к этой записи справа дописывается 0, а затем два левых разряда заменяются на 10;\nб) если сумма цифр в двоичной записи числа нечётная, то к этой записи справа дописывается 1, а затем два левых разряда заменяются на 11.\nПолученная таким образом запись является двоичной записью искомого числа R.\nНапример, для исходного числа 6 = 110₂ результатом является число 1000₂ = 8, а для исходного числа 4 = 100₂ результатом является число 1101₂ = 13.\nУкажите минимальное число N, после обработки которого с помощью этого алгоритма получается число R, большее 480.","ex":[[6,8],[4,13]],"code":"for n in range(1, 1000):\n    s = f(n, 2)\n    if ⟦s.count('1') % 2 == 0⟧:\n        ⟦s = s + '0'⟧\n        ⟦s = '10' + s[2:]⟧\n    else:\n        ⟦s = s + '1'⟧\n        ⟦s = '11' + s[2:]⟧\n    r = int(s, 2)\n    # print(n, s, r)   # ← пример\n    if ⟦r > 480⟧:\n        print(n)\n        break","hints":[{"t":"Сумма цифр двоичной записи = количество единиц: s.count('1')."},{"t":"«Два левых разряда заменяются на 10» — отрезаем два первых символа срезом s[2:] и приклеиваем новые слева.","code":"s = '110'\ns = s + '0'\nprint(s)\ns = '10' + s[2:]\nprint(s, int(s, 2))"}],"ans":"176"},{"id":"6988","src":"практика","d":2,"sec":"B","text":"На вход алгоритма подаётся натуральное число N. Алгоритм строит по нему новое число R следующим образом.\n1. Строится двоичная запись числа N.\n2. Все разряды полученного числа инвертируются.\n3. К полученному результату справа дописывается бит чётности (0, если в двоичном коде числа N было чётное число единиц, и 1, если нечётное).\nПолученная таким образом запись является двоичной записью искомого числа R.\nНапример, для числа 60 алгоритм будет выполняться следующим образом: 1. N = 60 = 111100₂. 2. 000011₂. 3. 0000110₂ = 6₁₀.\nУкажите максимальное число R, меньшее 170, которое может быть получено в результате работы этого алгоритма.","ex":[[60,6]],"code":"l = []\nfor n in range(1, 10000):\n    s = f(n, 2)\n    ⟦k = s.count('1')⟧\n    ⟦s = s.replace('0', '*').replace('1', '0').replace('*', '1')⟧\n    ⟦s = s + str(k % 2)⟧\n    r = int(s, 2)\n    # print(n, s, r)   # ← пример\n    if ⟦r < 170⟧:\n        l.append(r)\nprint(⟦max(l)¦l⟧)","hints":[{"t":"Инверсия: сразу заменить 0 на 1, а потом 1 на 0 нельзя — всё станет нулями. Используй временный символ.","code":"s = '111100'\nprint(s.replace('0','1').replace('1','0'))   # ошибка!\ns = s.replace('0','*').replace('1','0').replace('*','1')\nprint(s)"},{"t":"Бит чётности считается по числу N — запомни количество единиц ДО инверсии."}],"ans":"169"},{"id":"556","src":"базовый","d":2,"sec":"B","text":"На вход алгоритма подаётся натуральное число N. Алгоритм строит по нему новое число R следующим образом.\n1) Строится двоичная запись числа N.\n2) К этой записи дописывается справа бит чётности: 0, если в двоичном коде числа N было чётное число единиц, и 1, если нечётное.\n3) К полученному результату дописывается ещё один бит чётности.\nПолученная таким образом запись (в ней на два разряда больше, чем в записи исходного числа N) является двоичной записью искомого числа R.\nУкажите минимальное число R, большее 96, которое может быть получено в результате работы этого алгоритма.","ex":[],"code":"l = []\nfor n in range(1, 1000):\n    s = f(n, 2)\n    ⟦s = s + str(s.count('1') % 2)⟧\n    ⟦s = s + str(s.count('1') % 2)⟧\n    r = int(s, 2)\n    # print(n, s, r)   # ← пример\n    if ⟦r > 96⟧:\n        l.append(r)\nprint(⟦min(l)¦l⟧)","hints":[{"t":"Бит чётности = остаток от деления количества единиц на 2, его надо превратить в строку: str(s.count('1') % 2).","code":"s = '1101'\nbit = s.count('1') % 2\nprint(bit)\ns = s + str(bit)\nprint(s)"},{"t":"Второй бит считается уже для новой записи — та же строка кода, выполненная второй раз."}],"ans":"102"},{"id":"1727","src":"практика","d":2,"sec":"B","text":"На вход алгоритма подаётся натуральное число N. Алгоритм строит по нему новое число R следующим образом.\n1. Строится двоичная запись числа N.\n2. К этой записи дописываются справа ещё два разряда по следующему правилу:\nа) складываются все цифры двоичной записи, и остаток от деления суммы на 2 дописывается в конец числа (справа);\nб) над этой записью производятся те же действия — справа дописывается остаток от деления суммы цифр на 2.\n3. Полученная таким образом запись является двоичной записью искомого числа R.\nСколько различных чисел, принадлежащих отрезку [210; 260], могут появиться на экране в результате работы автомата?","ex":[],"code":"l = []\nfor n in range(1, 1000):\n    s = f(n, 2)\n    ⟦s = s + str(s.count('1') % 2)⟧\n    ⟦s = s + str(s.count('1') % 2)⟧\n    r = int(s, 2)\n    # print(n, s, r)   # ← пример\n    if ⟦210 <= r <= 260⟧:\n        l.append(r)\nprint(⟦len(set(l))¦l⟧)","hints":[{"t":"«Различных» — значит, повторы убираем: set(l). Количество — len(set(l)).","code":"l = [5, 7, 5, 9, 7]\nprint(set(l), len(set(l)))"},{"t":"Принадлежит отрезку: 210 <= r <= 260 — в Python так можно писать двойное неравенство."}],"ans":"14"},{"id":"5447","src":"практика","d":3,"sec":"B","text":"На вход алгоритма подаётся натуральное число N.\n1) Строится двоичная запись числа N.\n2) Если количество единиц в этой записи чётно, стирается ведущая единица (и ставшие ведущими нули). В противном случае из записи числа убираются все нули, а в конец приписывается 1.\n3) Над новой записью снова производятся действия, описанные в пункте 2.\n4) Результат переводится в десятичную систему и выводится на экран.\nНапример, N = 5₁₀ = 101₂ ⇒ 1 ⇒ 11₂ = 3₁₀ = R.\nСколько существует чисел N, не превосходящих 1000, таких что R = 7?","ex":[[5,3]],"code":"l = []\nfor n in range(1, 1001):\n    s = f(n, 2)\n    if ⟦s.count('1') % 2 == 0⟧:\n        ⟦s = s[1:].lstrip('0')⟧\n    else:\n        ⟦s = s.replace('0', '') + '1'⟧\n    if ⟦s.count('1') % 2 == 0⟧:\n        ⟦s = s[1:].lstrip('0')⟧\n    else:\n        ⟦s = s.replace('0', '') + '1'⟧\n    r = int(s, 2)\n    # print(n, s, r)   # ← пример\n    if ⟦r == 7⟧:\n        l.append(n)\nprint(⟦len(l)¦l⟧)","hints":[{"t":"Пункт 2 выполняется дважды — значит, блок if/else пишем два раза подряд (кнопка «＋ if/else»)."},{"t":"Стереть ведущую единицу и ставшие ведущими нули: s[1:] отрезает первый символ, .lstrip('0') убирает нули слева.","code":"s = '100101'\ns = s[1:]\nprint(s)\ns = s.lstrip('0')\nprint(s)"},{"t":"Убрать все нули: s.replace('0', '')."}],"ans":"120"},{"id":"8160","src":"ЕГКР-2025 · практика","d":2,"sec":"C","text":"На вход алгоритма подаётся натуральное число N. Алгоритм строит по нему новое число R следующим образом.\n1. Строится троичная запись числа N.\n2. Далее эта запись обрабатывается по следующему правилу:\nа) если число N делится на 3, то к этой записи дописываются две последние троичные цифры;\nб) если число N на 3 не делится, то остаток от деления умножается на 3, переводится в троичную систему и дописывается в конец числа.\nПолученная таким образом запись является троичной записью искомого числа R.\nНапример, для исходного числа 6 = 20₃ результатом является число 2020₃ = 60, а для числа 4 = 11₃ — число 1110₃ = 39.\nУкажите максимальное число N, после обработки которого с помощью этого алгоритма получается число, не превышающее 150.","ex":[[6,60],[4,39]],"code":"l = []\nfor n in range(1, 1000):\n    s = f(n, 3)\n    if ⟦n % 3 == 0⟧:\n        ⟦s = s + s[-2:]⟧\n    else:\n        ⟦s = s + f(n % 3 * 3, 3)⟧\n    r = int(s, 3)\n    # print(n, s, r)   # ← пример\n    if ⟦r <= 150⟧:\n        l.append(n)\nprint(⟦max(l)¦l⟧)","hints":[{"t":"Две последние цифры — срез s[-2:]."},{"t":"Число перевести в троичную и дописать — снова вызываем нашу функцию: f(n % 3 * 3, 3).","code":"n = 4\nprint(n % 3, n % 3 * 3, f(n % 3 * 3, 3))"},{"t":"Обрати внимание: вопрос про N, поэтому в список кладём n, а не r."}],"ans":"16"},{"id":"6885","src":"основание 15 · практика","d":3,"sec":"C","text":"Алгоритм получает на вход натуральное число N > 14 и строит по нему новое число R следующим образом:\n1. Строится запись числа N в системе счисления с основанием 15.\n2. Далее эта запись обрабатывается по следующему правилу:\nа) если число N делится на 15, то в конец дописываются первые две цифры пятнадцатеричной записи числа;\nб) если число N на 15 не делится, то остаток от его деления на 15 умножается на 13, переводится в систему счисления с основанием 15 и дописывается в конец числа.\nПолученная таким образом запись является пятнадцатеричной записью искомого числа R.\nУкажите минимальное число R, большее 700, которое может быть получено с помощью описанного алгоритма.","ex":[],"code":"l = []\nfor n in range(15, 1000):\n    s = f(n, 15)\n    if ⟦n % 15 == 0⟧:\n        ⟦s = s + s[:2]⟧\n    else:\n        ⟦s = s + f(n % 15 * 13, 15)⟧\n    r = int(s, 15)\n    # print(n, s, r)   # ← пример\n    if ⟦r > 700⟧:\n        l.append(r)\nprint(⟦min(l)¦l⟧)","hints":[{"t":"N > 14 — начинаем range с 15: тогда в записи всегда минимум две цифры и s[:2] существует."},{"t":"int(s, 15) переводит обратно в десятичную, буквы (a, b, c, d, e) понимает сам.","code":"s = f(199, 15)\nprint(s, int(s, 15))"}],"ans":"703"},{"id":"14328","src":"Л. Шастин","d":3,"sec":"C","text":"На вход алгоритма подаётся натуральное число N. Алгоритм строит по нему новое число R следующим образом.\n1. Строится запись числа N в системе счисления с основанием 12.\n2. Далее эта запись обрабатывается по следующему правилу:\nа) если число N делится на 3, то слева к нему приписывается «1», а справа «B»;\nб) если число N на 3 не делится, то слева к нему приписывается «2», а справа «0».\nПолученная таким образом запись является двенадцатеричной записью искомого числа R.\n3. Результат переводится в десятичную систему и выводится на экран.\nНапример, для исходного числа 11 = B₁₂ результатом является число 2B0₁₂ = 420, а для исходного числа 12 = 10₁₂ это число 110B₁₂ = 1883.\nУкажите максимальное число R, меньшее 1996, которое может быть получено с помощью описанного алгоритма.","ex":[[11,420],[12,1883]],"code":"l = []\nfor n in range(1, 1000):\n    s = f(n, 12)\n    if ⟦n % 3 == 0⟧:\n        ⟦s = '1' + s + 'b'⟧\n    else:\n        ⟦s = '2' + s + '0'⟧\n    r = int(s, 12)\n    # print(n, s, r)   # ← пример\n    if ⟦r < 1996⟧:\n        l.append(r)\nprint(⟦max(l)¦l⟧)","hints":[{"t":"Цифра «B» в системе 12 — это 11. int понимает и 'b', и 'B'. Но наша функция выдаёт маленькие буквы — если сравниваешь цифры записи, пиши 'b'.","code":"print(f(11, 12), int('2b0', 12), int('2B0', 12))"}],"ans":"1991"},{"id":"8217","src":"практика","d":3,"sec":"C","text":"На вход алгоритма подаётся натуральное число N.\n1. Строится восьмеричная запись числа N.\n2. Далее эта запись обрабатывается по следующему правилу:\nа) если восьмеричная запись начинается на 5, то все двойки в записи меняются на единицы, а все единицы меняются на двойки, а затем к числу слева приписывается 11;\nб) если восьмеричная запись начинается не на 5, то к записи справа приписывается 10, а затем первый и последний разряды полученной записи меняются на 2 и 0 соответственно.\nПолученная таким образом запись является восьмеричной записью искомого числа R.\nУкажите максимальное число N, для которого результатом работы алгоритма является наибольшее число R, меньшее 1354.","ex":[],"code":"l = []\nfor n in range(1, 1000):\n    s = f(n, 8)\n    if ⟦s[0] == '5'⟧:\n        ⟦s = s.replace('2', '*').replace('1', '2').replace('*', '1')⟧\n        ⟦s = '11' + s⟧\n    else:\n        ⟦s = s + '10'⟧\n        ⟦s = '2' + s[1:-1] + '0'⟧\n    r = int(s, 8)\n    # print(n, s, r)   # ← пример\n    if ⟦r < 1354⟧:\n        l.append((r, n))\nprint(⟦max(l)[1]¦l⟧)","hints":[{"t":"«Начинается на 5»: s[0] == '5' (сравниваем со строкой '5', не с числом!)."},{"t":"Обмен двоек и единиц — через временный символ, как при инверсии."},{"t":"Ищем наибольшее R, а ответ — N. Удобно класть в список пары (r, n): max сравнивает сначала r, при равных r — n.","code":"l = [(20, 3), (25, 1), (25, 7)]\nprint(max(l), max(l)[1])"}],"ans":"61"},{"id":"19872","src":"О. Лысенков","d":3,"sec":"C","text":"На вход программы подаётся натуральное число N. Программа преобразует это число в новое число R следующим образом:\n1. Строится семеричная запись числа N.\n2. Далее эта запись обрабатывается согласно следующему алгоритму:\nа. Если N чётное, то справа дописывается 1, а слева 52.\nб. Если N нечётное, то первая и последняя цифра в числе меняются местами, после справа дописывается 15.\n3. Из числа удаляются незначащие нули.\nУкажите наибольшее число N, не превышающее 1000, после обработки которого с помощью этого алгоритма получается число R, содержащее ровно 4 значащих разряда в семеричной записи.","ex":[],"code":"l = []\nfor n in range(1, 1001):\n    s = f(n, 7)\n    if ⟦n % 2 == 0⟧:\n        ⟦s = '52' + s + '1'⟧\n    else:\n        ⟦s = s[-1] + s[1:-1] + s[0] + '15'⟧\n    ⟦s = s.lstrip('0')⟧\n    r = int(s, 7)\n    # print(n, s, r)   # ← пример\n    if ⟦len(s) == 4⟧:\n        l.append(n)\nprint(⟦max(l)¦l⟧)","hints":[{"t":"Поменять первую и последнюю цифры: s[-1] + s[1:-1] + s[0]. Осторожно с однозначной записью: там s[0] и s[-1] — один и тот же символ!","code":"s = '1234'\nprint(s[-1] + s[1:-1] + s[0])\ns = '5'\nprint(s[-1] + s[1:-1] + s[0])"},{"t":"Незначащие нули слева убирает s.lstrip('0'). Количество разрядов — len(s)."}],"ans":"721"},{"id":"5427","src":"Е. Джобс","d":2,"sec":"D","text":"Автомат обрабатывает натуральное число N по следующему алгоритму:\n1. Из числа N вычитается количество нулей в двоичной записи числа N.\n2. Строится двоичная запись полученного числа.\n3. К полученной записи слева дописывается три младших разряда.\n4. Результат переводится в десятичную систему и выводится на экран.\nПример. Дано число N = 13. 1) Двоичная запись числа N: 1101. 13 – 1 = 12. 2) 12₁₀ = 1100₂. 3) 1100₂ → 1001100. 4) 1001100₂ = 76.\nКакое наименьшее число, большее 224, может появиться на экране в результате работы автомата?","ex":[[13,76]],"code":"l = []\nfor n in range(1, 1000):\n    ⟦m = n - f(n, 2).count('0')⟧\n    ⟦s = f(m, 2)⟧\n    ⟦s = s[-3:] + s⟧\n    r = int(s, 2)\n    # print(n, s, r)   # ← пример\n    if ⟦r > 224⟧:\n        l.append(r)\nprint(⟦min(l)¦l⟧)","hints":[{"t":"Здесь сначала меняется само число, и только потом строится запись. Заведи новую переменную: m = n − количество нулей."},{"t":"Три младших разряда — это три правых символа: s[-3:].","code":"s = '1100'\nprint(s[-3:], s[-3:] + s)"}],"ans":"227"},{"id":"12459","src":"PRO100 ЕГЭ","d":3,"sec":"D","text":"На вход алгоритма подаётся натуральное число N. Алгоритм строит по нему новое число R следующим образом.\n1. Строится четверичная запись числа N.\n2. Далее эта запись обрабатывается по следующему правилу:\nа) если количество значащих цифр в четверичной записи числа чётное, то к этой записи в середину дописывается 0;\nб) если количество значащих цифр в четверичной записи числа нечётное, то запись не изменяется.\nПолученная таким образом запись является десятичной записью искомого числа R.\nНапример, для исходного числа 6₁₀ = 12₄ результатом является число 102₁₀, а для исходного числа 21₁₀ = 111₄ результатом является число 111₁₀.\nУкажите максимальное число N, после обработки которого с помощью этого алгоритма получается число R, не большее, чем 180.","ex":[[6,102],[21,111]],"code":"l = []\nfor n in range(1, 1000):\n    s = f(n, 4)\n    if ⟦len(s) % 2 == 0⟧:\n        ⟦p = len(s) // 2⟧\n        ⟦s = s[:p] + '0' + s[p:]⟧\n    ⟦r = int(s)¦r = int(s, 4)⟧\n    # print(n, s, r)   # ← пример\n    if ⟦r <= 180⟧:\n        l.append(n)\nprint(⟦max(l)¦l⟧)","hints":[{"t":"Середина строки: p = len(s) // 2. Вставка: s[:p] + '0' + s[p:].","code":"s = '1230'\np = len(s) // 2\nprint(p, s[:p] + '0' + s[p:])"},{"t":"Ловушка: запись считается ДЕСЯТИЧНОЙ записью R. Значит, r = int(s), а не int(s, 4)!"}],"ans":"31"},{"id":"5058","src":"базовый","d":2,"sec":"D","text":"Алгоритм получает на вход натуральное число N и строит по нему новое число R следующим образом:\n1. Строится двоичная запись числа N.\n2. В полученной записи все нули заменяются на единицы, все единицы — на нули. Из полученного числа удаляются ведущие нули.\n3. Результат переводится в десятичную систему счисления.\n4. Результатом работы алгоритма становится разность исходного числа N и числа, полученного на предыдущем шаге.\nПример. N = 22: 10110 → 01001 → 1001 → 9 → 22 − 9 = 13. R = 13.\nПри каком наименьшем N в результате работы алгоритма получится R = 979?","ex":[[22,13]],"code":"for n in range(1, 10000):\n    s = f(n, 2)\n    ⟦s = s.replace('0', '*').replace('1', '0').replace('*', '1')⟧\n    ⟦r = n - int(s, 2)¦r = int(s, 2)⟧\n    # print(n, s, r)   # ← пример\n    if ⟦r == 979⟧:\n        print(n)\n        break","hints":[{"t":"Ведущие нули удалять не обязательно: int('01001', 2) и так даёт 9.","code":"print(int('01001', 2), int('1001', 2))"},{"t":"R — это разность: r = n − int(s, 2)."}],"ans":"1001"},{"id":"19551","src":"М. Попков","d":2,"sec":"D","text":"Алгоритм получает на вход натуральное число N и строит по нему новое число R следующим образом:\n1. Строится троичная запись числа N.\n2. В полученной записи все двойки заменяются на нули, а все нули — на двойки. Из полученного числа удаляются незначащие нули.\n3. Результат переводится в десятичную систему счисления.\n4. Результатом работы алгоритма становится модуль разности исходного числа N и числа, полученного на предыдущем шаге.\nУкажите минимальное число N, после обработки которого с помощью этого алгоритма получается число, равное 378.","ex":[],"code":"for n in range(1, 10000):\n    s = f(n, 3)\n    ⟦s = s.replace('2', '*').replace('0', '2').replace('*', '0')⟧\n    ⟦r = abs(n - int(s, 3))¦r = int(s, 3)⟧\n    # print(n, s, r)   # ← пример\n    if ⟦r == 378⟧:\n        print(n)\n        break","hints":[{"t":"Обмен 2 ↔ 0 — через временный символ."},{"t":"Модуль разности: abs(n - int(s, 3))."}],"ans":"553"},{"id":"1516","src":"средний","d":2,"sec":"D","text":"Автомат обрабатывает натуральное число N по следующему алгоритму:\n1) Строится двоичная запись числа N.\n2) Из записи удаляются все нули.\n3) Полученное число переводится в десятичную запись и выводится на экран.\nСколько разных значений будет показано на экране автомата при последовательном вводе всех натуральных чисел от 100 до 1000?","ex":[],"code":"l = []\nfor n in range(⟦100, 1001¦1, 1000⟧):\n    s = f(n, 2)\n    ⟦s = s.replace('0', '')⟧\n    r = int(s, 2)\n    # print(n, s, r)   # ← пример\n    l.append(r)\nprint(⟦len(set(l))¦l⟧)","hints":[{"t":"«От 100 до 1000» включительно — range(100, 1001)."},{"t":"«Сколько разных значений» — len(set(l))."}],"ans":"9"},{"id":"1515","src":"средний","d":2,"sec":"D","text":"Автомат обрабатывает натуральное число N по следующему алгоритму:\n1) Строится двоичная запись числа N.\n2) Запись «переворачивается», то есть читается справа налево. Если при этом появляются ведущие нули, они отбрасываются.\n3) Полученное число переводится в десятичную запись и выводится на экран.\nКакое наименьшее число, превышающее 1000, после обработки автоматом даёт результат 29?","ex":[],"code":"for n in range(⟦1001¦1⟧, 100000):\n    s = f(n, 2)\n    ⟦s = s[::-1]⟧\n    r = int(s, 2)\n    # print(n, s, r)   # ← пример\n    if ⟦r == 29⟧:\n        print(n)\n        break","hints":[{"t":"Перевернуть строку: s[::-1].","code":"s = '11000'\nprint(s[::-1], int(s[::-1], 2))"},{"t":"«Превышающее 1000» — это условие на N: начинаем range с 1001."}],"ans":"1472"},{"id":"4868","src":"практика","d":3,"sec":"E","text":"Алгоритм получает на вход натуральное число N > 1 и строит по нему новое число R следующим образом:\n1. Вычисляется сумма чётных цифр в десятичной записи числа N. Если чётных цифр в записи нет, сумма считается равной нулю.\n2. Вычисляется сумма цифр, стоящих на чётных местах в десятичной записи числа N без ведущих нулей. Места отсчитываются слева направо (от старших разрядов к младшим, начиная с единицы). Если число однозначное (цифр на чётных местах нет), сумма считается равной нулю.\n3. Результатом работы алгоритма становится модуль разности полученных двух сумм.\nПример. N = 2021: чётные цифры 2, 0, 2 — сумма 4; цифры на чётных местах 0, 1 — сумма 1; R = 3.\nПри каком наименьшем N в результате работы алгоритма получится R = 13?","ex":[[2021,3]],"code":"for n in range(2, 100000):\n    s = str(n)\n    ⟦a = sum(int(c) for c in s if int(c) % 2 == 0)⟧\n    ⟦b = sum(int(c) for c in s[1::2])⟧\n    ⟦r = abs(a - b)¦r = 0⟧\n    # print(n, s, r)   # ← пример\n    if ⟦r == 13⟧:\n        print(n)\n        break","hints":[{"t":"Чётные МЕСТА при счёте с единицы — это индексы 1, 3, 5… (нумерация в Python с нуля): срез s[1::2].","code":"s = '2021'\nprint(s[1::2], s[0::2])"},{"t":"Сумма цифр с условием: sum(int(c) for c in s if int(c) % 2 == 0).","code":"s = '2021'\nprint(sum(int(c) for c in s if int(c) % 2 == 0))"}],"ans":"618"},{"id":"4869","src":"практика","d":3,"sec":"E","text":"Алгоритм получает на вход натуральное число N > 1 и строит по нему новое число R следующим образом:\n1. Строится двоичная запись числа N.\n2. Вычисляется количество единиц, стоящих на чётных местах в двоичной записи числа N без ведущих нулей, и количество нулей, стоящих на нечётных местах. Места отсчитываются слева направо (от старших разрядов к младшим, начиная с единицы).\n3. Результатом работы алгоритма становится модуль разности полученных двух чисел.\nПример. N = 39 = 100111₂: на чётных местах две единицы, на нечётных — один ноль. R = 1.\nПри каком наименьшем N в результате работы алгоритма получится R = 5?","ex":[[39,1]],"code":"for n in range(2, 100000):\n    s = f(n, 2)\n    ⟦a = s[1::2].count('1')⟧\n    ⟦b = s[0::2].count('0')⟧\n    ⟦r = abs(a - b)¦r = 0⟧\n    # print(n, s, r)   # ← пример\n    if ⟦r == 5⟧:\n        print(n)\n        break","hints":[{"t":"Чётные места → индексы 1, 3, 5… → s[1::2]; нечётные места → s[0::2]. Внутри среза считаем count.","code":"s = f(39, 2)\nprint(s, s[1::2], s[0::2])\nprint(s[1::2].count('1'), s[0::2].count('0'))"}],"ans":"1023"},{"id":"3755","src":"практика","d":3,"sec":"E","text":"Алгоритм получает на вход натуральное число N ≥ 10 и строит по нему новое число R следующим образом:\n1) Все пары соседних цифр в десятичной записи N рассматриваются как двузначные числа (возможно, с ведущим нулём).\n2) Из списка полученных на предыдущем шаге двузначных чисел выделяются наибольшее и наименьшее.\n3) Результатом работы алгоритма становится разность найденных на предыдущем шаге двух чисел.\nПример. N = 2022: числа 20, 02, 22; наибольшее 22, наименьшее 2; R = 22 − 2 = 20.\nПри каком наименьшем N в результате работы алгоритма получится R = 44?","ex":[[2022,20]],"code":"for n in range(10, 100000):\n    s = str(n)\n    ⟦p = [int(s[i:i + 2]) for i in range(len(s) - 1)]⟧\n    ⟦r = max(p) - min(p)¦r = 0⟧\n    # print(n, s, r)   # ← пример\n    if ⟦r == 44⟧:\n        print(n)\n        break","hints":[{"t":"Пары соседних цифр — срезы длины 2: s[i:i+2] для i от 0 до len(s) − 2. Список удобно собрать генератором.","code":"s = '2022'\np = [int(s[i:i + 2]) for i in range(len(s) - 1)]\nprint(p, max(p) - min(p))"}],"ans":"159"},{"id":"4870","src":"практика","d":4,"sec":"E","text":"Автомат получает на вход трёхзначное число. По этому числу строится новое число по следующим правилам.\n1. Из цифр, образующих десятичную запись N, строятся наибольшее и наименьшее возможные двузначные числа (числа не могут начинаться с нуля).\n2. На экран выводится разность полученных двузначных чисел.\nПример. N = 351: наибольшее 53, наименьшее 13, на экран выводится 40.\nЧему равно количество чисел N на отрезке [300; 400], в результате обработки которых на экране автомата появится число 20?","ex":[[351,40]],"code":"l = []\nfor n in range(⟦300, 401¦100, 1000⟧):\n    s = str(n)\n    ⟦p = [int(a + b) for a, b in permutations(s, 2) if a != '0']⟧\n    ⟦r = max(p) - min(p)¦r = 0⟧\n    # print(n, s, r)   # ← пример\n    if ⟦r == 20⟧:\n        l.append(n)\nprint(⟦len(l)¦l⟧)","hints":[{"t":"Все упорядоченные пары цифр (каждую цифру — один раз) даёт permutations(s, 2) из itertools. Число не может начинаться с нуля — условие a != '0'.","code":"s = '351'\nprint(list(permutations(s, 2)))\np = [int(a + b) for a, b in permutations(s, 2) if a != '0']\nprint(p)"}],"ans":"12"},{"id":"972","src":"Е. Джобс","d":3,"sec":"E","text":"Автомат получает на вход трёхзначное число. По этому числу строится новое число по следующим правилам.\n1. Умножаются первая и вторая, а также вторая и третья цифры исходного числа.\n2. Полученные два числа записываются друг за другом в порядке убывания (без разделителей).\nПример. Исходное число: 543. Произведения: 5·4 = 20; 4·3 = 12. Результат: 2012.\nУкажите максимальное число, в результате обработки которого автомат выдаст число 240.","ex":[[543,2012]],"code":"l = []\nfor n in range(100, 1000):\n    s = str(n)\n    ⟦a = int(s[0]) * int(s[1])⟧\n    ⟦b = int(s[1]) * int(s[2])⟧\n    ⟦r = int(str(max(a, b)) + str(min(a, b)))¦r = 0⟧\n    # print(n, s, r)   # ← пример\n    if ⟦r == 240⟧:\n        l.append(n)\nprint(⟦max(l)¦l⟧)","hints":[{"t":"«Записываются друг за другом» — это склейка строк, а не сложение чисел: str(max(a, b)) + str(min(a, b)).","code":"a, b = 12, 20\nprint(a + b, str(max(a, b)) + str(min(a, b)))"}],"ans":"830"},{"id":"488","src":"Е. Джобс","d":4,"sec":"E","text":"Автомат обрабатывает четырёхзначное десятичное число N. Из цифр числа строятся все возможные двузначные числа путём перестановки цифр числа.\nПример. Дано число 1223. Из него можно построить следующие числа: 12, 13, 21, 22, 23, 31, 32.\nНайдите разницу между минимальным и максимальным числами N, из цифр которых можно составить максимально возможное количество двузначных чисел.","ex":[[1223,7]],"code":"l = []\nfor n in range(1000, 10000):\n    s = str(n)\n    ⟦p = set(a + b for a, b in permutations(s, 2) if a != '0')⟧\n    ⟦r = len(p)¦r = 0⟧\n    # print(n, s, r)   # ← пример\n    l.append((r, n))\n⟦m = max(l)[0]⟧\n⟦M = [n for r, n in l if r == m]⟧\nprint(⟦max(M) - min(M)¦l⟧)","hints":[{"t":"Одинаковые числа считаем один раз (22 из двух двоек — одно число): собираем во множество set."},{"t":"Сначала находим максимальное количество m, потом выбираем все N с этим количеством.","code":"l = [(7, 1223), (12, 1234), (12, 9876), (3, 1110)]\nm = max(l)[0]\nM = [n for r, n in l if r == m]\nprint(m, M, max(M) - min(M))"}],"ans":"8642"},{"id":"5899","src":"Д. Тараскин","d":4,"sec":"E","text":"Автомат получает на вход трёхзначное число. По этому числу строится новое число по следующим правилам:\n1) Из цифр, образующих десятичную запись N, строятся все возможные двузначные числа (числа не могут начинаться с нуля).\n2) Из получившихся двузначных чисел выбираются только те, которые являются простыми.\nКаждую цифру трёхзначного числа можно использовать ровно столько раз, сколько она встречается в этом числе. К примеру, из числа 123 можно составить числа: 12, 13, 21, 31, 23, 32.\nДля какого наибольшего N количество выбранных простых чисел будет максимальным?","ex":[],"code":"⟦pr = [k for k in range(10, 100) if all(k % d for d in range(2, k))]¦pr = []⟧\nl = []\nfor n in range(100, 1000):\n    s = str(n)\n    ⟦p = [int(a + b) for a, b in permutations(s, 2) if a != '0']⟧\n    ⟦r = len([x for x in p if x in pr])¦r = 0⟧\n    # print(n, s, r)   # ← пример\n    l.append((r, n))\nprint(⟦max(l)[1]¦l⟧)","hints":[{"t":"Простые двузначные числа: число k простое, если не делится ни на одно d от 2 до k−1: all(k % d for d in range(2, k)).","code":"pr = [k for k in range(10, 100) if all(k % d for d in range(2, k))]\nprint(pr)"},{"t":"«Для наибольшего N с максимальным количеством» — пары (количество, n) и max(l)[1]."}],"ans":"731"},{"id":"457","src":"Е. Джобс","d":3,"sec":"E","text":"Автомат обрабатывает двузначное десятичное натуральное число N по следующему алгоритму.\n1. Строится двоично-десятичное представление — каждый разряд десятичного числа кодируется с помощью 4 бит, затем полученные коды записываются друг за другом с сохранением незначащих нулей.\n2. Полученная двоичная последовательность инвертируется — все нули меняются на единицы, все единицы на нули.\n3. Полученное в результате этих операций двоичное число переводится в десятичную систему счисления.\nПример. 13₁₀ → 00010011₂ → 11101100₂ → 236₁₀.\nУкажите N, после обработки которого результатом выполнения алгоритма будет число 151.","ex":[[13,236]],"code":"for n in range(10, 100):\n    ⟦s = ''.join(f(int(c), 2).zfill(4) for c in str(n))⟧\n    ⟦s = s.replace('0', '*').replace('1', '0').replace('*', '1')⟧\n    r = int(s, 2)\n    # print(n, s, r)   # ← пример\n    if ⟦r == 151⟧:\n        print(n)\n        break","hints":[{"t":"Каждую цифру переводим в двоичную и дополняем нулями слева до 4 знаков: .zfill(4). Склеиваем через ''.join(...).","code":"n = 13\nfor c in str(n):\n    print(c, f(int(c), 2).zfill(4))\nprint(''.join(f(int(c), 2).zfill(4) for c in str(n)))"}],"ans":"68"},{"id":"13091","src":"средний","d":4,"sec":"F","text":"Алгоритм получает на вход натуральное число N и строит по нему новое число R следующим образом.\n1) Строится двоичная запись числа N.\n2) В конец двоичной записи добавляется двоичный код остатка от деления числа N на 4.\n3) Результатом работы алгоритма становится десятичная запись полученного числа R.\nПример 1. N = 13 = 1101₂, остаток 1 → 11011₂ = 27. Пример 2. N = 14 = 1110₂, остаток 2 → 111010₂ = 58.\nНазовём доступными числа, которые могут получиться в результате работы этого алгоритма. Например, числа 27 и 58 — доступные.\nКакое наибольшее количество доступных чисел может быть на отрезке, содержащем 65 натуральных чисел?","ex":[[13,27],[14,58]],"code":"l = []\nfor n in range(1, 2000):\n    s = f(n, 2)\n    ⟦s = s + f(n % 4, 2)⟧\n    r = int(s, 2)\n    # print(n, s, r)   # ← пример\n    l.append(r)\n⟦S = set(l)⟧\n⟦m = 0⟧\n⟦for a in range(1, 5000):⟧\n⟦    m = max(m, len([x for x in range(a, a + 65) if x in S]))⟧\nprint(⟦m¦l⟧)","hints":[{"t":"Остаток 0 переводится в '0' — наша функция возвращает '0' для нуля, а не пустую строку (поэтому в ней max(rez, '0')).","code":"print(f(0, 2), f(2, 2), f(3, 2))"},{"t":"Отрезок из 65 чисел, начинающийся с a: от a до a + 64. Перебираем все a и считаем, сколько доступных чисел попало внутрь."}],"ans":"25"},{"id":"2348","src":"базовый","d":3,"sec":"F","text":"На вход алгоритма подаётся натуральное число N > 8. Алгоритм строит по нему новое число R следующим образом.\n1. Из числа N вычитается остаток от деления N на 8.\n2. Строится двоичная запись этого результата.\n3. К этой записи дописываются справа ещё два разряда по следующему правилу: складываются все цифры построенной двоичной записи; если сумма чётная, то в конец числа (справа) дописывается 00, если сумма нечётная, то в конец числа (справа) дописывается 01.\nПолученная таким образом запись является двоичной записью искомого числа R.\nУкажите максимальное число N, для которого результат работы алгоритма меньше 353.","ex":[],"code":"l = []\nfor n in range(9, 1000):\n    ⟦s = f(n - n % 8, 2)¦s = f(n, 2)⟧\n    if ⟦s.count('1') % 2 == 0⟧:\n        ⟦s = s + '00'⟧\n    else:\n        ⟦s = s + '01'⟧\n    r = int(s, 2)\n    # print(n, s, r)   # ← пример\n    if ⟦r < 353⟧:\n        l.append(n)\nprint(⟦max(l)¦l⟧)","hints":[{"t":"Перед переводом число меняется: в функцию передаём n - n % 8."},{"t":"Ответ — N, поэтому в список кладём n. Несколько N дают одинаковое R — берём наибольший."}],"ans":"87"},{"id":"564","src":"★ zfill(8)","d":2,"sec":"Z","text":"Автомат обрабатывает натуральное число N < 128 по следующему алгоритму:\n1. Строится восьмибитная двоичная запись числа N.\n2. Инвертируются разряды исходного числа (0 заменяется на 1, 1 на 0).\n3. К полученному двоичному числу прибавляют единицу.\n4. Полученное число переводится в десятичную систему счисления.\nДля какого числа N результат работы алгоритма равен 153?","ex":[],"code":"for n in range(1, 128):\n    ⟦s = f(n, 2).zfill(8)¦s = f(n, 2)⟧\n    ⟦s = s.replace('0', '*').replace('1', '0').replace('*', '1')⟧\n    ⟦r = int(s, 2) + 1¦r = int(s, 2)⟧\n    # print(n, s, r)   # ← пример\n    if ⟦r == 153⟧:\n        print(n)\n        break","hints":[{"t":"Восьмибитная запись — дополняем нулями слева до 8 знаков: .zfill(8). Без этого инверсия потеряет ведущие единицы!","code":"s = f(5, 2)\nprint(s, s.zfill(8))"},{"t":"«Прибавляют единицу» к числу — проще после перевода: int(s, 2) + 1."}],"ans":"103"},{"id":"1505","src":"★ одновременная замена","d":3,"sec":"Z","text":"На вход алгоритма подаётся натуральное число N. Алгоритм строит по нему новое число R следующим образом.\n1. Строится двоичная запись числа N.\n2. Каждый разряд этой записи заменяется двумя разрядами по следующему правилу: если в разряде стоит 0, то вместо него пишется 01; если в разряде стоит 1, то 1 заменяется на 10.\nНапример, двоичная запись 1001 числа 9 будет преобразована в 10010110.\nПолученная таким образом запись является двоичной записью искомого числа R.\nУкажите максимальное число R, меньшее 256, которое может являться результатом работы данного алгоритма.","ex":[[9,150]],"code":"l = []\nfor n in range(1, 1000):\n    s = f(n, 2)\n    ⟦s = s.replace('0', 'a').replace('1', 'b')⟧\n    ⟦s = s.replace('a', '01').replace('b', '10')⟧\n    r = int(s, 2)\n    # print(n, s, r)   # ← пример\n    if ⟦r < 256⟧:\n        l.append(r)\nprint(⟦max(l)¦l⟧)","hints":[{"t":"Если сразу заменить 0 на 01, то во второй замене (1 → 10) испортятся и только что вписанные единицы. Сначала переименуй цифры в буквы, потом раскрой буквы.","code":"s = '1001'\nprint(s.replace('0','01').replace('1','10'))   # неверно\nt = s.replace('0','a').replace('1','b')\nprint(t, t.replace('a','01').replace('b','10'))"},{"t":"Другой способ — собрать новую строку по символам: ''.join('01' if c == '0' else '10' for c in s)."}],"ans":"170"},{"id":"28926","src":"★ сумма троичных цифр","d":3,"sec":"Z","text":"На вход алгоритма подаётся натуральное число N. Алгоритм строит по нему новое число R следующим образом.\n1. Строится троичная запись числа N.\n2. Далее эта запись обрабатывается по следующему правилу:\nа) если число N делится на 3, то к этой записи справа дописываются две последние троичные цифры;\nб) если число N на 3 не делится, то вычисляется сумма цифр полученной троичной записи, эта сумма умножается на 2, переводится в троичную систему счисления и дописывается в конец числа.\nПолученная таким образом запись является троичной записью искомого числа R.\n3. Результат переводится в десятичную систему и выводится на экран.\nНапример, для исходного числа 8₁₀ = 22₃ результатом является число 2222₃ = 80₁₀, а для исходного числа 9₁₀ = 100₃ это число 10000₃ = 81₁₀.\nУкажите минимальное нечётное число R, большее 520, которое может быть получено с помощью описанного алгоритма.","ex":[[8,80],[9,81]],"code":"l = []\nfor n in range(1, 1000):\n    s = f(n, 3)\n    if ⟦n % 3 == 0⟧:\n        ⟦s = s + s[-2:]⟧\n    else:\n        ⟦s = s + f(sum(int(c) for c in s) * 2, 3)⟧\n    r = int(s, 3)\n    # print(n, s, r)   # ← пример\n    if ⟦r > 520 and r % 2 == 1⟧:\n        l.append(r)\nprint(⟦min(l)¦l⟧)","hints":[{"t":"Сумма цифр записи: sum(int(c) for c in s). Для систем до 10 int(c) работает; для букв нужно int(c, основание).","code":"s = f(8, 3)\nprint(s, sum(int(c) for c in s))"},{"t":"«Нечётное R, большее 520» — два условия через and."}],"ans":"567"},{"id":"12721","src":"★ чётные цифры в записи","d":4,"sec":"Z","text":"На вход алгоритма подаётся натуральное число N. Алгоритм строит по нему новое число R следующим образом.\n1. Строится восьмеричная запись числа N.\n2. Далее эта запись обрабатывается по следующему правилу:\nа) если количество чётных цифр в записи числа нечётно, то к трём последним разрядам восьмеричной записи справа дописывается 46;\nб) если количество чётных цифр в записи числа чётно, то остаток от деления числа на 8 умножается на 5, переводится в восьмеричную запись и дописывается слева.\nПолученная таким образом запись является восьмеричной записью искомого числа R.\n3. Результат переводится в десятичную систему и выводится на экран.\nНапример, для исходного числа 12 = 14₈ результатом является число 1446₈ = 806, а для исходного числа 777 = 1411₈ это число 41146₈ = 16998.\nУкажите минимальное число R, которое может быть получено с помощью описанного алгоритма при N не меньшем 80.","ex":[[12,806],[777,16998]],"code":"l = []\nfor n in range(⟦80¦1⟧, 10000):\n    s = f(n, 8)\n    ⟦k = len([c for c in s if int(c, 36) % 2 == 0])⟧\n    if ⟦k % 2 == 1⟧:\n        ⟦s = s[-3:] + '46'⟧\n    else:\n        ⟦s = f(n % 8 * 5, 8) + s⟧\n    r = int(s, 8)\n    # print(n, s, r)   # ← пример\n    l.append(r)\nprint(⟦min(l)¦l⟧)","hints":[{"t":"Чётность цифры записи: int(c, 36) % 2 == 0 — так работает для любых систем, даже с буквами.","code":"s = f(777, 8)\nprint(s, [c for c in s if int(c, 36) % 2 == 0])"},{"t":"«К трём последним разрядам дописывается 46» — от записи остаются только s[-3:], а к ним приписывается '46'. Посмотри на пример с 777."}],"ans":"38"},{"id":"14327","src":"★ max/min цифра записи","d":3,"sec":"Z","text":"На вход алгоритма подаётся натуральное число N. Алгоритм строит по нему новое число R следующим образом.\n1. Строится восьмеричная запись числа N.\n2. Далее эта запись обрабатывается по следующему правилу:\nа) если число N чётное, то к этой записи в восьмеричном виде дописывается её максимальная цифра;\nб) если число N нечётное, то минимальная цифра записи умножается на два и в восьмеричном виде дописывается в конец числа.\nПолученная таким образом запись является восьмеричной записью искомого числа R.\n3. Результат переводится в десятичную систему и выводится на экран.\nНапример, для исходного числа 9 = 11₈ результатом является число 112₈ = 74, а для исходного числа 12 = 14₈ это число 144₈ = 100.\nУкажите максимальное число N, после обработки которого с помощью этого алгоритма получается число R, меньшее 313.","ex":[[9,74],[12,100]],"code":"l = []\nfor n in range(1, 1000):\n    s = f(n, 8)\n    if ⟦n % 2 == 0⟧:\n        ⟦s = s + max(s)⟧\n    else:\n        ⟦s = s + f(int(min(s), 8) * 2, 8)⟧\n    r = int(s, 8)\n    # print(n, s, r)   # ← пример\n    if ⟦r < 313⟧:\n        l.append(n)\nprint(⟦max(l)¦l⟧)","hints":[{"t":"max(s) и min(s) дают цифру-символ. Порядок символов в нашем алфавите: сначала цифры, потом буквы, поэтому max работает и для систем больше 10.","code":"s = f(12, 8)\nprint(s, max(s), min(s))"},{"t":"Чтобы умножить цифру на 2, её надо превратить в число: int(min(s), 8) * 2, а результат — снова в запись: f(…, 8)."}],"ans":"38"},{"id":"4871","src":"★ цепочка без перевода","d":2,"sec":"Z","text":"Алгоритм получает на вход натуральное число N > 1 и строит по нему новое число R следующим образом:\n1) Если исходное число кратно 3, оно делится на 3, иначе из него вычитается 1.\n2) Если полученное на предыдущем шаге число кратно 5, оно делится на 5, иначе из него вычитается 1.\n3) Если полученное на предыдущем шаге число кратно 11, оно делится на 11, иначе из него вычитается 1.\n4) Число, полученное на шаге 3, считается результатом работы алгоритма.\nСколько существует различных натуральных чисел N, при обработке которых получится R = 8?","ex":[],"code":"l = []\nfor n in range(2, 10000):\n    r = n\n    if ⟦r % 3 == 0⟧:\n        ⟦r = r // 3⟧\n    else:\n        ⟦r = r - 1⟧\n    if ⟦r % 5 == 0⟧:\n        ⟦r = r // 5⟧\n    else:\n        ⟦r = r - 1⟧\n    if ⟦r % 11 == 0⟧:\n        ⟦r = r // 11⟧\n    else:\n        ⟦r = r - 1⟧\n    # print(n, r)   # ← пример\n    if ⟦r == 8⟧:\n        l.append(n)\nprint(⟦len(l)¦l⟧)","hints":[{"t":"Здесь нет перевода в систему счисления — меняется само число. Нельзя менять n (это переменная цикла), заведи r = n."},{"t":"Делим нацело: //. Обычное деление / даст дробь 3.0."}],"ans":"4"},{"id":"7693","src":"★ запись → число → другая система","d":3,"sec":"Z","text":"Автомат обрабатывает натуральное число N по следующему алгоритму.\n1. В шестеричной записи числа N дублируется последняя цифра.\n2. Полученное число переводится в двоичную систему счисления.\n3. Искомое R — сумма цифр в конечной версии числа.\nПример. N = 35. 1) 35₁₀ = 55₆; 55 + 5 = 555. 2) 555₆ = 11010111₂. 3) R = 1 + 1 + 0 + 1 + 0 + 1 + 1 + 1 = 6.\nНапишите максимальное число N, не превышающее 10⁵, для которого R = 18.","ex":[[35,6]],"code":"l = []\nfor n in range(1, 100001):\n    s = f(n, 6)\n    ⟦s = s + s[-1]⟧\n    ⟦s = f(int(s, 6), 2)⟧\n    ⟦r = s.count('1')¦r = int(s, 2)⟧\n    # print(n, s, r)   # ← пример\n    if ⟦r == 18⟧:\n        l.append(n)\nprint(⟦max(l)¦l⟧)","hints":[{"t":"Перейти из шестеричной записи в двоичную напрямую нельзя: сначала в число int(s, 6), потом в запись f(…, 2).","code":"s = f(35, 6) + '5'\nprint(s, int(s, 6), f(int(s, 6), 2))"},{"t":"Сумма двоичных цифр = количество единиц."}],"ans":"87359"},{"id":"5486","src":"★ повтор с пересчётом числа","d":4,"sec":"Z","text":"Алгоритм получает на вход натуральное число N и строит по нему новое число R следующим образом:\n1. Строится двоичная запись числа N.\n2. Если сумма цифр десятичной записи заданного числа нечётна, то в конец двоичной записи дописывается 1, если чётна — 0.\n3–4. Пункт 2 повторяется для вновь полученных чисел ещё два раза.\n5. Результатом работы алгоритма становится десятичная запись полученного числа R.\nПример. N = 17 = 10001₂. Сумма цифр 17 чётная → 100010₂ = 34. Сумма цифр 34 нечётная → 1000101₂ = 69. Сумма цифр 69 нечётная → 10001011₂ = 139. R = 139.\nОпределите наименьшее возможное значение R > 2054, которое может получиться в результате работы алгоритма.","ex":[[17,139]],"code":"l = []\nfor n in range(1, 10000):\n    s = f(n, 2)\n    ⟦for k in range(3):⟧\n    ⟦    m = int(s, 2)⟧\n    ⟦    s = s + str(sum(int(c) for c in str(m)) % 2)⟧\n    r = int(s, 2)\n    # print(n, s, r)   # ← пример\n    if ⟦r > 2054⟧:\n        l.append(r)\nprint(⟦min(l)¦l⟧)","hints":[{"t":"Сумма цифр каждый раз считается по ДЕСЯТИЧНОЙ записи НОВОГО числа: m = int(s, 2), потом str(m).","code":"s = f(17, 2)\nfor k in range(3):\n    m = int(s, 2)\n    s = s + str(sum(int(c) for c in str(m)) % 2)\n    print(m, s, int(s, 2))"},{"t":"Три одинаковых шага удобно сделать маленьким циклом for k in range(3)."}],"ans":"2057"},{"id":"1518","src":"★ вторая слева и справа","d":2,"sec":"Z","text":"Автомат обрабатывает натуральное число N > 1 по следующему алгоритму:\n1. Строится двоичная запись числа N.\n2. В конец записи (справа) дописывается вторая справа цифра двоичной записи.\n3. В конец записи (справа) дописывается вторая слева цифра двоичной записи.\n4. Результат переводится в десятичную систему.\nПример. N = 11: 1011 → 10111 → 101110. R = 46.\nПри каком наименьшем числе N в результате работы алгоритма получится R > 100?","ex":[[11,46]],"code":"for n in range(2, 1000):\n    s = f(n, 2)\n    ⟦s = s + s[-2]⟧\n    ⟦s = s + s[1]⟧\n    r = int(s, 2)\n    # print(n, s, r)   # ← пример\n    if ⟦r > 100⟧:\n        print(n)\n        break","hints":[{"t":"Вторая справа — s[-2], вторая слева — s[1] (нумерация с нуля).","code":"s = '1011'\nprint(s[-2], s[1])"}],"ans":"25"},{"id":"917","src":"★ последнее вхождение","d":4,"sec":"Z","text":"Автомат обрабатывает натуральное число N > 1 по следующему алгоритму:\n1. Строится двоичная запись числа N.\n2. В записи последний ноль заменяется на первые две цифры в полученной записи.\n3. Запись записывается справа налево (в обратную сторону).\n4. Полученное двоичное число переводится в десятичную систему счисления.\nПример. N = 11: 1011 → последний ноль заменяется на 10 → 11011 → наоборот 11011. R = 27.\nДля какого максимального значения N в результате работы алгоритма получится число 119?","ex":[[11,27]],"code":"l = []\nfor n in range(2, 10000):\n    s = f(n, 2)\n    ⟦i = s.rfind('0')⟧\n    if ⟦i != -1⟧:\n        ⟦s = s[:i] + s[:2] + s[i + 1:]⟧\n    ⟦s = s[::-1]⟧\n    r = int(s, 2)\n    # print(n, s, r)   # ← пример\n    if ⟦r == 119⟧:\n        l.append(n)\nprint(⟦max(l)¦l⟧)","hints":[{"t":"replace меняет первое вхождение слева. Последнее вхождение находит s.rfind('0') — индекс, или −1, если нуля нет.","code":"s = '1011'\ni = s.rfind('0')\nprint(i, s[:i] + s[:2] + s[i + 1:])\nprint('111'.rfind('0'))"}],"ans":"58"},{"id":"1507","src":"★ строка × число","d":2,"sec":"Z","text":"На вход алгоритма подаётся натуральное число N. Алгоритм строит по нему новое число R следующим образом.\n1. Строится двоичная запись числа N.\n2. К этой записи дописываются справа ещё разряды по следующему правилу: если N — чётное число, в конец числа добавляются нули, количество которых совпадает с количеством значащих разрядов исходного числа; если N — нечётное число, то в конец числа (справа) дописываются единицы, количество которых также совпадает с количеством значащих разрядов исходного числа.\nНапример, двоичная запись 1001 числа 9 будет преобразована в 10011111, а двоичная запись 1100 числа 12 будет преобразована в 11000000.\nУкажите максимальное R, которое меньше 182 и может являться результатом данного алгоритма.","ex":[[9,159],[12,192]],"code":"l = []\nfor n in range(1, 1000):\n    s = f(n, 2)\n    if ⟦n % 2 == 0⟧:\n        ⟦s = s + '0' * len(s)⟧\n    else:\n        ⟦s = s + '1' * len(s)⟧\n    r = int(s, 2)\n    # print(n, s, r)   # ← пример\n    if ⟦r < 182⟧:\n        l.append(r)\nprint(⟦max(l)¦l⟧)","hints":[{"t":"Строку можно умножить на число — она повторится: '0' * 4 == '0000'.","code":"s = '1001'\nprint('1' * len(s), s + '1' * len(s))"}],"ans":"160"},{"id":"1830","src":"★ запись 4N","d":3,"sec":"Z","text":"На вход алгоритма подаётся натуральное число N. Алгоритм строит по нему новое число R следующим образом.\n1) Строится двоичная запись числа 4N.\n2) К этой записи дописываются справа ещё два разряда по следующему правилу:\nа) складываются все цифры двоичной записи числа N, и остаток от деления суммы на 2 дописывается в конец числа (справа);\nб) над этой записью производятся те же действия — справа дописывается остаток от деления суммы её цифр на 2.\nПолученная таким образом запись является двоичной записью искомого числа R.\nУкажите такое наименьшее число N, для которого результат работы данного алгоритма больше числа 129.","ex":[],"code":"for n in range(1, 1000):\n    ⟦s = f(4 * n, 2)¦s = f(n, 2)⟧\n    ⟦s = s + str(f(n, 2).count('1') % 2)⟧\n    ⟦s = s + str(s.count('1') % 2)⟧\n    r = int(s, 2)\n    # print(n, s, r)   # ← пример\n    if ⟦r > 129⟧:\n        print(n)\n        break","hints":[{"t":"Запись строится для 4N, а первая сумма цифр — для N. У 4N и N единиц одинаково (4N = N с двумя нулями справа), но пиши честно, что сказано в условии.","code":"n = 5\nprint(f(n, 2), f(4 * n, 2))"}],"ans":"8"},{"id":"612","src":"★ пустая строка","d":3,"sec":"Z","text":"Автомат обрабатывает натуральное число N по следующему алгоритму.\n1. Строится двоичная запись числа N.\n2. Удаляется первая слева единица и все следующие непосредственно за ней нули. Если после этого в числе не остаётся цифр, результат этого действия считается равным нулю.\n3. Полученное число переводится в десятичную запись.\n4. Новое число вычитается из исходного, полученная разность выводится на экран.\nПример. N = 11: 1011 → 11 → 3 → 11 − 3 = 8.\nСколько разных значений будет показано на экране автомата при последовательном вводе всех натуральных чисел от 10 до 1000?","ex":[[11,8]],"code":"l = []\nfor n in range(⟦10, 1001¦1, 1000⟧):\n    s = f(n, 2)\n    ⟦s = s[1:].lstrip('0')⟧\n    ⟦r = n - int(max(s, '0'), 2)¦r = int(s, 2)⟧\n    # print(n, s, r)   # ← пример\n    l.append(r)\nprint(⟦len(set(l))¦l⟧)","hints":[{"t":"Если строка стала пустой, int('', 2) выдаст ошибку. Тот же приём, что в нашей функции: max(s, '0') — пустая строка превращается в '0'.","code":"s = '1000'\ns = s[1:].lstrip('0')\nprint(repr(s), max(s, '0'))"}],"ans":"7"},{"id":"1271","src":"★ цифры самого R","d":4,"sec":"Z","text":"На вход алгоритма подаётся натуральное число N. Алгоритм строит по нему новое число R следующим образом.\n1. Строится двоичная запись числа N.\n2. Далее эта запись обрабатывается по следующему правилу:\nа) если число чётное, то к двоичной записи числа слева дописывается 1, а справа 0;\nб) если число нечётное, то к двоичной записи числа слева дописывается 11 и справа дописывается 10.\nПолученная таким образом запись является двоичной записью искомого числа R.\nНапример, при обработке числа 14: 1110₂ → 111100₂ = 60.\nУкажите минимальное число R, которое может являться результатом работы алгоритма, и сумма всех цифр которого в десятичной системе счисления больше 17. В ответе запишите сумму всех цифр этого числа в двоичной системе счисления.","ex":[[14,60]],"code":"l = []\nfor n in range(1, 10000):\n    s = f(n, 2)\n    if ⟦n % 2 == 0⟧:\n        ⟦s = '1' + s + '0'⟧\n    else:\n        ⟦s = '11' + s + '10'⟧\n    r = int(s, 2)\n    # print(n, s, r)   # ← пример\n    if ⟦sum(int(c) for c in str(r)) > 17⟧:\n        l.append(r)\n⟦m = min(l)⟧\nprint(⟦f(m, 2).count('1')¦l⟧)","hints":[{"t":"Условие на десятичные цифры самого R: превращаем r в строку str(r) и суммируем цифры."},{"t":"Ответ — не R, а сумма его двоичных цифр: сначала найди min(l), потом посчитай единицы в f(m, 2)."}],"ans":"3"}]</script>

function openBaseVisualizer(){
  const bytes=Uint8Array.from(atob(BASE_VISUALIZER_B64),c=>c.charCodeAt(0));
  const source=new TextDecoder('utf-8').decode(bytes);
  const m=modal('<div class="mhead"><h2>🔢 Переводчик систем счисления</h2><button class="btn ghost" id="bvClose">✕</button></div><iframe class="base-vis-frame" id="baseVisualizer" title="Пошаговый перевод между системами счисления" sandbox="allow-scripts"></iframe>','full');
  m.querySelector('#baseVisualizer').srcdoc=source;
  m.querySelector('#bvClose').onclick=closeModal;
}
function vis(s){s=s||stu();if(s&&s.redo&&s.redo.list&&s.redo.list.some(id=>!solved(s.tasks[id])))return s.redo.list;const a=DB.teacher.active;return a&&a.length?ORDER.filter(id=>a.includes(id)):ORDER.slice();}
function counts(s){s=s||stu();const L=vis(s);const c={ok:0,err:0,hint:0,fill:0,new:0,total:L.length};L.forEach(id=>{const x=s.tasks[id];c[x&&x.st?x.st:'new']++;});c.done=c.total-c.new;return c;}
function nextUnsolved(from){const s=stu(),L=vis(s),i=Math.max(0,L.indexOf(from));for(let k=1;k<=L.length;k++){const id=L[(i+k)%L.length];if(!solved(s.tasks[id]))return id;}return null;}
const consDone=s=>{const c=(s||stu()).cons||{};return ['easy','mid','hard'].filter(k=>c[k]).length;};

/* ===== Вход и главная ===== */
function viewLogin(){
  cur.name='';cur.id=null;
  const names=Object.keys(DB.students).sort((a,b)=>(DB.students[b].updated||0)-(DB.students[a].updated||0));
  app().innerHTML=`<div class="login"><div class="hero"><h1>ЕГЭ · Задание 5</h1><p>Алгоритмы с системами счисления: переводим, меняем запись, ищем ответ кодом на Python прямо в браузере.</p>
  <div class="code-deco">def f(n,a):\n    rez=''\n    while n>0:\n        rez=al[n%a]+rez\n        n//=a</div></div>
  <div class="card"><h3 style="margin:0 0 8px">Как тебя зовут?</h3>
  <div class="row"><input class="inp" id="nm" placeholder="Фамилия и имя" style="flex:1;min-width:200px" value="${esc(DB.last)}"><button class="btn pri" id="go">Начать →</button></div>
  ${names.length?`<div style="margin-top:12px;color:var(--mut);font-size:13px">Уже занимались на этом устройстве:</div><div class="slist">${names.map(n=>`<button data-n="${esc(n)}">${esc(n)}</button>`).join('')}</div>`:''}
  <div class="row" style="margin-top:16px;justify-content:space-between">${modeBadge()}<span class="row"><button class="ib" id="th">🌓</button><button class="ib" id="tch">👩‍🏫 Учитель</button></span></div></div></div>`;
  const go=n=>{n=(n||'').trim().replace(/\s+/g,' ');if(!n){$('#nm').focus();return;}enter(n);};
  $('#go').onclick=()=>go($('#nm').value);$('#nm').onkeydown=e=>{if(e.key==='Enter')go($('#nm').value);};
  document.querySelectorAll('.slist button').forEach(b=>b.onclick=()=>go(b.dataset.n));
  $('#th').onclick=()=>{DB.theme=DB.theme==='dark'?'light':'dark';applyTheme();persist();};
  $('#tch').onclick=askPin;
}
function enter(name){cur.name=name;DB.last=name;if(!DB.students[name])DB.students[name]=newStudent(name);

  else if(/:\s*$/.test(line.trim()))ind+='    ';
  const block=[ind+'if '+BLANK+':',ind+'    '+BLANK,ind+'else:',ind+'    '+BLANK],base=lines.slice(0,at).join('\n').length+(at?1:0),slots=[];let offset=base;
  block.forEach(line=>{const start=offset+line.indexOf(BLANK);slots.push({start,end:start+BLANK.length,touched:false});offset+=line.length+1;});
  lines.splice(at,0,...block);const next=lines.join('\n');ED.set(next,slots);ED.focusAt(slots[0].start);toast('Вставлен блок if/else. Заполни бледные поля кодом.');
}

let CONLOG=[],CONHIST=[],CON_READY=false;
const CON_DEFAULT_VARS='n = 13\na = 2\ns = f(n, a)\nr = int(s, a)\nl = []';
function openConsole(preset){
  const s=stu();if(s){s.con=(s.con||0)+1;bump();}
  modal(`<div class="mhead"><h2>🧪 Консоль Python</h2><button class="btn sm" id="cRst" title="Забыть все переменные">♻ Сбросить переменные</button><button class="btn sm" id="cClr">🧹 Очистить экран</button><button class="btn ghost" id="cX">✕</button></div>
   <div class="con"><div class="conlog" id="clog"></div>
    <div class="conside"><b>Переменные на всю сессию</b><textarea id="cvars" spellcheck="false"></textarea><button class="btn sm pri" id="cApply">▶ Применить переменные</button><p class="help">Меняй значения выше и применяй. Переменные останутся доступны в консоли до сброса или закрытия приложения.</p><div style="font-weight:800;margin:10px 0 6px">Попробуй:</div><div class="chips">${CON_CHIPS.map((c,i)=>`<button data-ch="${i}">${esc(c)}</button>`).join('')}</div>
    <p style="color:var(--mut);font-size:13px">Enter — выполнить. Shift+Enter — новая строка (для for и if). ↑ ↓ — история команд.<br>Уже подключены: <code class="i">from math import *</code>, <code class="i">from itertools import *</code>, алфавит <code class="i">al</code> и функция <code class="i">f(n, a)</code>.<br>print писать не нужно — значение выражения покажется само.</p></div></div></div>`,'full');
  const log=$('#clog');
  const varsEditor=$('#cvars');varsEditor.value=(s&&s.consoleVars)||CON_DEFAULT_VARS;
  const execute=async(v,quiet=false)=>{if(!v.trim())return;if(!quiet){CONHIST.push(v);CONLOG.push({k:'cmd',v});}const r=await PY.repl(v,{onStatus:m=>{CONLOG.push({k:'pr',v:m});}});CONLOG=CONLOG.filter(z=>!(z.k==='pr'&&/Загружаю/.test(z.v)));if(r.out)CONLOG.push({k:'pr',v:r.out.replace(/\n$/,'')});if(r.ok&&r.val!=null)CONLOG.push({k:'res',v:r.val});if(r.ok&&!r.out&&r.val==null)CONLOG.push({k:'pr',v:'✓ Выполнено. Переменные сохранены в этой сессии.'});if(!r.ok){CONLOG.push({k:'err',v:r.err});CONLOG.push({k:'pr',v:'↳ '+translatePythonError(r.err)});}CON_READY=true;draw();};
  const draw=()=>{log.innerHTML=CONLOG.map(e=>e.k==='cmd'?`<div class="cmd">${esc(e.v.split('\n').map((l,i)=>(i?'... ':'>>> ')+l).join('\n'))}</div>`:`<div class="${e.k}">${esc(e.v)}</div>`).join('')+`<div class="conin"><span>&gt;&gt;&gt;</span><textarea id="cin" rows="1" spellcheck="false"></textarea></div>`;
    const ta=$('#cin');ta.focus();log.scrollTop=log.scrollHeight;let hp=CONHIST.length;
    const fit=()=>{ta.rows=Math.max(1,ta.value.split('\n').length);};
    ta.addEventListener('input',fit);
    ta.addEventListener('keydown',async e=>{
      if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const v=ta.value;if(!v.trim())return;
        if(/:\s*$/.test(v.split('\n').slice(-1)[0])){ta.value=v+'\n    ';fit();return;}
        ta.disabled=true;await execute(v);}
      else if(e.key==='Tab'){e.preventDefault();document.execCommand('insertText',false,'    ');}
      else if(e.key==='ArrowUp'&&!ta.value.includes('\n')){e.preventDefault();if(hp>0){hp--;ta.value=CONHIST[hp];fit();}}
      else if(e.key==='ArrowDown'&&!ta.value.includes('\n')){e.preventDefault();if(hp<CONHIST.length-1){hp++;ta.value=CONHIST[hp];}else{hp=CONHIST.length;ta.value='';}fit();}
    });
    return ta;};
  let ta=draw();
  if(preset){ta.value=preset;ta.rows=preset.split('\n').length;}
  $('#cApply').onclick=()=>{if(s)s.consoleVars=varsEditor.value;bump();execute(varsEditor.value);};
  document.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{const t=$('#cin');t.value=CON_CHIPS[+b.dataset.ch];t.focus();const k=t.value.indexOf(BLANK);if(k>=0)t.setSelectionRange(k,k+BLANK.length);});
  $('#cX').onclick=closeModal;$('#cClr').onclick=()=>{CONLOG=[];ta=draw();};
  $('#cRst').onclick=async()=>{CON_READY=false;await PY.repl('None',{reset:true});CONLOG.push({k:'pr',v:'♻ Переменные сброшены; применяю стартовые значения'});if(s)s.consoleVars=varsEditor.value;await execute(varsEditor.value,true);};
  if(!CON_READY){if(s)s.consoleVars=varsEditor.value;execute(varsEditor.value,true);}
}

async function checkCons(){
  const s=stu(),L=consLines(),code=consCode(),T=TESTS[CONS.kind];
  if(CONS.lvl==='mid'&&CONS.mid.slots.some(v=>v==null)){toast('Заполни все строки ＋');return;}
  const test='import json\n'+code+'\n_r = []\nfor _e, _w in '+JSON.stringify(T)+':\n    try:\n        _g = repr(eval(_e))\n    except Exception as _x:\n        _g = type(_x).__name__\n    _r.append([_e, _w, _g])\nprint(json.dumps(_r))';
  $('#cres').innerHTML='<div class="status">Проверяю…</div>';
  const r=await PY.run(test,{pre:'',onStatus:m=>{$('#cres').innerHTML='<div class="status">'+m+'</div>';}});
  let ok=false,html='';
  if(!r.ok){html=`<div class="exp">💬 Код не выполнился: ${esc(r.err)}${r.line?' (строка '+r.line+')':''}. ${explainErr(r,code)}</div>`;}
  else{let res=null;try{res=JSON.parse(lastLine(r.out));}catch(e){res=null;}
    if(!res){const raw=lastLine(r.out);ok=false;html=`<div class="exp">${esc(raw)}</div>`;}
    else{ok=res.every(z=>z[1]===z[2]);html=`<table class="tbl">${res.map(z=>`<tr><td><code>${esc(z[0])}</code></td><td>ждём <code>${esc(z[1])}</code></td><td>${z[1]===z[2]?'✅':'❌ получили <code>'+esc(z[2])+'</code>'}</td></tr>`).join('')}</table>`;}}
  if(CONS.lvl!=='hard'){const want=L;const have=code.split('\n');document.querySelectorAll('#cz .cl').forEach((row,i)=>{row.classList.remove('good','bad');row.classList.add(ok||have[i]===want[i]?'good':'bad');});}
  if(ok){s.cons=s.cons||{};if(CONS.kind==='str')s.cons[CONS.lvl]=1;else s.cons.list=1;bump();refreshSide();
    html=`<div class="fb show good">🎉 Функция работает на всех тестах!${CONS.kind==='str'?'':' Это версия со списком — для систем больше 36.'}</div>`+html+(CONS.kind==='str'?`<div class="row" style="margin-top:8px"><button class="btn ok" id="cSave">💾 Сохранить мою функцию — использовать во всех задачах</button>${s.func?'<button class="btn ghost sm" id="cDef">↺ Вернуть эталон</button>':''}</div>`:'');}
  else html=`<div class="fb show bad">Пока не всё верно — красным отмечены строки, которые стоят не так${CONS.lvl==='hard'?' (на тестах)':''}.</div>`+html;
  $('#cres').innerHTML=html;
  if($('#cSave'))$('#cSave').onclick=()=>{s.func=code;bump();toast('💾 Твоя функция сохранена и подставится во все задачи');viewCons();};
  if($('#cDef'))$('#cDef').onclick=()=>{s.func=null;bump();viewCons();};
}
