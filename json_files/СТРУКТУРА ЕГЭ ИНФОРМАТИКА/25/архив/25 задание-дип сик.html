function resetCurrentFilters(){const id=state.current;state.filtersByStudent[id]=normalizeFilters();state.sectionByStudent[id]='';ensureDifficultyState();state.difficultyByStudent[id]='';refreshStudents();commit()}
document.getElementById('showAll').onclick=e=>{e.preventDefault();resetCurrentFilters()};
document.getElementById('search').oninput=e=>{uiForStudent().filters.q=e.target.value;commit()};
function setTri(key,val){const f=uiForStudent().filters;f[key]=f[key]===val?null:val;commit()}
document.getElementById('fDone').onclick=()=>setTri('done',true);
document.getElementById('fUndone').onclick=()=>setTri('done',false);
document.getElementById('fFav').onclick=()=>setTri('fav',true);
document.getElementById('fUnfav').onclick=()=>setTri('fav',false);
document.getElementById('fDz').onclick=()=>setTri('dz',true);
document.getElementById('fNotDz').onclick=()=>setTri('dz',false);
document.getElementById('resetFilters').onclick=e=>{e.preventDefault();resetCurrentFilters()};
document.getElementById('restore').onclick=()=>{runtimeDeleted.splice(0).reverse().forEach(x=>TASKS.splice(Math.min(x.index,TASKS.length),0,x.task));render()};
function taskNumberKey(id){return String(id??'').replace(/[^0-9.]/g,'').split('.').filter(x=>x!=='').map(x=>Number(x)||0)}
function compareTaskNumbers(a,b){const aa=taskNumberKey(a.id),bb=taskNumberKey(b.id);const n=Math.max(aa.length,bb.length);for(let i=0;i<n;i++){const d=(aa[i]??0)-(bb[i]??0);if(d)return d}return String(a.id).localeCompare(String(b.id),'ru',{numeric:true})}
document.getElementById('sortTasks').onclick=()=>{TASKS.sort(compareTaskNumbers);render()};
document.querySelectorAll("#sectionFilter [data-section]").forEach(b=>{b.onclick=()=>{state.sectionByStudent[state.current]=b.dataset.section;commit()}});
document.querySelectorAll("#difficultyFilter [data-difficulty]").forEach(b=>{b.onclick=()=>{ensureDifficultyState();state.difficultyByStudent[state.current]=b.dataset.difficulty;commit()}});
document.querySelectorAll('[data-global-size]').forEach(b=>b.addEventListener('click',()=>{conditionFont=b.dataset.globalSize;applyGlobalConditionFont()}));

// ============ ДОБАВЛЕНИЕ / ПЕЧАТЬ / ЭКСПОРТ ============
function addDialog(){
  const h=document.getElementById('modalHost');
  const anchorOptions=TASKS.map(t=>`<option value="${esc(t.id)}" ${selectedTaskId===t.id?'selected':''}>${esc(t.id)} — ${esc(t.title)}</option>`).join('');
  h.innerHTML=`<div class="modal"><div class="modalbox"><h2>Добавить задачу</h2><label>Номер</label><input id="a_id"><label>Название</label><input id="a_title"><label>Условие</label><textarea id="a_desc"></textarea><label>Вопрос</label><textarea id="a_q">Решите задачу.</textarea><label>Ответ</label><input id="a_ans"><label>Поставить относительно задачи</label><select id="a_anchor">${anchorOptions}</select><label>Куда добавить</label><select id="a_pos"><option value="before">Перед выбранной</option><option value="after" selected>После выбранной</option><option value="end">В конец списка</option></select><label>Без комментариев</label><textarea id="a_code1"></textarea><label>С комментариями</label><textarea id="a_code2"></textarea><div class="modal-actions"><button class="btn" id="a_cancel">Отмена</button><button class="btn green" id="a_ok">Добавить</button></div></div></div>`;
  h.querySelector('#a_cancel').onclick=()=>h.innerHTML='';
  h.querySelector('#a_ok').onclick=()=>{const id=h.querySelector('#a_id').value.trim();if(!id){alert('Укажите номер');return}if(taskById(id)){alert('Такой номер уже существует');return}const codes={'Без комментариев':h.querySelector('#a_code1').value,'С комментариями':h.querySelector('#a_code2').value};const t={id,title:h.querySelector('#a_title').value,desc:h.querySelector('#a_desc').value,question:h.querySelector('#a_q').value,answer:h.querySelector('#a_ans').value,kind:'general',methods:CODE_METHODS.slice(),codes};const anchor=h.querySelector('#a_anchor').value,pos=h.querySelector('#a_pos').value;let idx=TASKS.findIndex(x=>String(x.id)===anchor);if(idx<0)idx=TASKS.length-1;if(pos==='after')idx++;if(pos==='end')idx=TASKS.length;TASKS.splice(Math.max(0,Math.min(idx,TASKS.length)),0,t);ensure(t.id);h.innerHTML='';selectedTaskId=t.id;render()};
}
document.getElementById('addTask').onclick=addDialog;
function printDialog(){
  const h=document.getElementById('modalHost');
  h.innerHTML=`<div class="modal"><div class="modalbox"><h2>Что выводить на печать?</h2><div class="print-options"><label class="print-option"><input type="checkbox" id="p_num">Номер</label><label class="print-option"><input type="checkbox" id="p_cond">Условие</label><label class="print-option"><input type="checkbox" id="p_ans">Ответ</label><label class="print-option"><input type="checkbox" id="p_c1">Без комментариев</label><label class="print-option"><input type="checkbox" id="p_c2">С комментариями</label><label class="print-option"><input type="checkbox" id="p_comment">Мой комментарий</label></div><div class="modal-actions"><button class="btn" id="p_cancel">Отмена</button><button class="btn green" id="p_go">Печать</button></div></div></div>`;
  h.querySelector('#p_cancel').onclick=()=>h.innerHTML='';
  h.querySelector('#p_go').onclick=()=>{const opt={num:h.querySelector('#p_num').checked,cond:h.querySelector('#p_cond').checked,ans:h.querySelector('#p_ans').checked,c1:h.querySelector('#p_c1').checked,c2:h.querySelector('#p_c2').checked,comment:h.querySelector('#p_comment').checked};if(!Object.values(opt).some(Boolean)){alert('Выберите хотя бы один пункт для печати.');return;}const arr=currentTasks();if(!arr.length){alert('Нет задач для печати по текущим фильтрам.');return;}const parts=arr.map(t=>{const st=ensure(t.id);let html='<article class="print-task">';if(opt.num)html+=`<div class="print-number">№ ${esc(t.id)}</div>`;if(opt.cond)html+=`<div class="print-condition">${esc(t.desc)}<br><br><b>${esc(t.question)}</b></div>`;if(opt.c1&&t.codes['Без комментариев'])html+=`<div><b>Без комментариев</b><pre class="print-code">${esc(t.codes['Без комментариев'])}</pre></div>`;if(opt.c2&&t.codes['С комментариями'])html+=`<div><b>С комментариями</b><pre class="print-code">${esc(t.codes['С комментариями'])}</pre></div>`;if(opt.ans)html+=`<div class="print-answer"><b>Ответ:</b> ${esc(t.answer)}</div>`;if(opt.comment)html+=`<div><b>Мой комментарий:</b><div class="print-comment">${esc(st.comment||'')}</div></div>`;return html+'</article>'}).join('');const w=window.open('','_blank','width=1000,height=800');if(!w){alert('Браузер заблокировал окно печати.');return;}w.document.open();w.document.write(`<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Печать</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;color:#111;margin:28px;font-size:14px}.print-task{margin:0 0 26px;padding:0 0 18px;border-bottom:1px solid #ccc;break-inside:avoid}.print-number{font-size:18px;font-weight:800;margin-bottom:10px}.print-code{white-space:pre-wrap;font:11px/1.4 Consolas,monospace;border:1px solid #bbb;padding:9px;margin:5px 0 10px}@media print{body{margin:15mm}.print-task{break-inside:avoid}}</style></head><body>${parts}</body></html>`);w.document.close();h.innerHTML='';setTimeout(()=>{w.focus();w.print()},250)};
}
document.getElementById('print').onclick=printDialog;
document.getElementById('export').onclick=()=>{const payload={students:state.students,current:state.current,filtersByStudent:state.filtersByStudent,sectionByStudent:state.sectionByStudent,difficultyByStudent:state.difficultyByStudent,progressByStudent:state.progressByStudent};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='zadanie25_progress.json';a.click()};
document.getElementById('import').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result)||{};state={students:Array.isArray(x.students)&&x.students.length?x.students:[{id:'s1',name:'Ученик 1'}],current:x.current||'s1',filtersByStudent:x.filtersByStudent||{},sectionByStudent:x.sectionByStudent||{},difficultyByStudent:x.difficultyByStudent||{},progressByStudent:x.progressByStudent||{}};normalizeState();save();refreshStudents();render()}catch(err){alert('Ошибка импорта')}};r.readAsText(f)};

// ============ СОХРАНЕНИЕ HTML ============
document.getElementById('saveApp').onclick=()=>{
  try{
    save();
    const clone=document.documentElement.outerHTML;
    const taskPayload=JSON.stringify(TASKS).replace(/</g,'\\u003c');
    const a0=clone.indexOf('const TASKS=');
    const conditionPos=clone.indexOf('let conditionFont=',a0);
    if(!(a0>=0&&conditionPos>a0)){alert('Не удалось встроить данные задач.');return}
    let outHtml=clone.slice(0,a0)+'const TASKS='+taskPayload+';\n'+clone.slice(conditionPos);
    const userPayload=JSON.stringify({students:state.students,current:state.current,filtersByStudent:state.filtersByStudent,sectionByStudent:state.sectionByStudent,difficultyByStudent:state.difficultyByStudent,progressByStudent:state.progressByStudent}).replace(/</g,'\\u003c');
    const stateStart=outHtml.indexOf('const INITIAL_USER_STATE=');
    const stateEnd=outHtml.indexOf('const DEFAULT_USER_STATE=',stateStart);
    if(!(stateStart>=0&&stateEnd>stateStart)){alert('Не удалось встроить прогресс.');return}
    outHtml=outHtml.slice(0,stateStart)+'const INITIAL_USER_STATE='+userPayload+';\n'+outHtml.slice(stateEnd);
    outHtml=outHtml.replace(/let conditionFont='(?:small|medium|large)';/,'let conditionFont='+JSON.stringify(conditionFont)+';');
    const doc='<!doctype html>\n'+outHtml;
    const blob=new Blob([doc],{type:'text/html'}),a=document.createElement('a');
    const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z');
    const url=URL.createObjectURL(blob);a.href=url;a.download='zadanie25_информатика_'+stamp+'.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
  }catch(err){console.error(err);alert('Не удалось сохранить: '+(err&&err.message?err.message:String(err)))}
};

// ============ СТАРТ ============
function showStartupStudentPicker(){
  const cover=document.createElement('div');cover.className='startup-cover';cover.id='startup-picker';
  const options=state.students.map(st=>`<option value="${esc(st.id)}" ${st.id===state.current?'selected':''}>${esc(st.name)}</option>`).join('');
  cover.innerHTML=`<div class="startup-card"><h2>Кто сегодня решает задачи?</h2><p>Выберите ученика, чтобы открыть именно его прогресс.</p><label for="startup-student">Ученик</label><select id="startup-student">${options}</select><div style="display:flex;gap:8px"><button class="btn" id="startup-add" style="flex:1">＋ Добавить ученика</button><button class="btn green" id="startup-go" style="flex:1">Начать работу</button></div></div>`;
  document.body.appendChild(cover);
  cover.querySelector('#startup-add').onclick=()=>{const name=prompt('Имя ученика:');if(!name||!name.trim())return;const id='s'+Date.now();state.students.push({id,name:name.trim()});state.current=id;state.filtersByStudent[id]=normalizeFilters();state.sectionByStudent[id]='';ensureDifficultyState();state.difficultyByStudent[id]='';state.progressByStudent[id]={};save();cover.querySelector('#startup-student').innerHTML=state.students.map(st=>`<option value="${esc(st.id)}" ${st.id===id?'selected':''}>${esc(st.name)}</option>`).join('');refreshStudents()};
  cover.querySelector('#startup-go').onclick=()=>{state.current=cover.querySelector('#startup-student').value;refreshStudents();save();cover.remove();setMode('student');render()};
}
