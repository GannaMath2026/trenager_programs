3', '24', '34', '234']  # возможные комбинации для первой вставки\nm2 = ['', '6', '7', '8', '67', '68', '78', '678']  # возможные комбинации для второй вставки\nfor a, b in product(m1, m2):  # перебор всех комбинаций из m1 и m2\n    n = int(f'1{a}5{b}9')  # формирование числа по маске\n    if n <= 10**9 and n % 21 == 0:  # проверка: число ≤ 1 млрд и делится на 21\n        l.add((n, n // 21))  \n        # добавление кортежа (число, частное от деления на 21) в множество\nfor c in sorted(l):  # перебор всех элементов в отсортированном порядке\n    print(*c)  # вывод числа и частного через пробел"},"defaultDz":false,"image":"","video":"https://rutube.ru/video/f1b637a3e614dbaf8e3d9b0573f0ef1c/","fileUrl":"","solved":false,"favorite":false,"sourceFields":{},"sectionName":"Маски"},{"id":"22432  к","title":"22432  к","desc":"— символ «?» означает ровно одну произвольную цифру;\r\n— символ «*» означает любую последовательность цифр произвольной длины; в том числе «*» может задавать и пустую последовательность.\r\nСреди натуральных чисел, не превышающих 10^12, найдите все числа, \r\nкоторые соответствуют маске 5*7?, делятся на 84318 без остатка и не содержат одинаковых цифр\r\n","question":"","answer":"52361478 621     532468170 6315     581203974 6893     5184039276 61482     5642138970 66915     5892310476 69882","kind":"informatika25","methods":["Без комментариев","С комментариями"],"codes":{"Без комментариев":"from fnmatch import *\nfor n in range(84318, 10**12, 84318):\n    sn=str(n)\n    unik=set(sn)\n    if fnmatch(sn,'5*7?') and len(unik)==len(sn) :\n        print( n, n//84318)","С комментариями":"from fnmatch import *  # импорт всех функций из модуля fnmatch\nfor n in range(84318, 10**12, 84318):  # перебор чисел, кратных 84318, до 10^12\n    sn = str(n)  # преобразование числа в строку\n    unik = set(sn)  # множество уникальных цифр числа\n    if fnmatch(sn, '5*7?') and len(unik) == len(sn):  \n    # проверка шаблона и уникальности цифр\n        print(n, n // 84318)  # вывод числа и частного"},"defaultDz":false,"image":"","video":"","fileUrl":"","solved":false,"favorite":false,"sourceFields":{},"sectionName":"Маски"},{"id":"20541 к","title":"20541 к","desc":"Среди натуральных чисел, не превышающих 10^9, найдите все числа, \r\nсоответствующие маске 34*56?7, делящиеся на 4321 без остатка, \r\nпроизведение цифр которых оканчивается на 0.\r\n","question":"","answer":"341475667 423360     344975677 4445280     348475687 4515840","kind":"informatika25","methods":["Без комментариев","С комментариями"],"codes":{"Без комментариев":"from fnmatch import *\nfrom  math import *\nfor n in range(4321 , 10**9, 4321 ):\n    pr=prod(int(c) for c in str(n))\n    if fnmatch(str(n),'34*56?7') and str(pr)[-1]=='0' :\n        print( n, pr)","С комментариями":"from fnmatch import *  # импорт функции fnmatch для проверки шаблонов\nfrom math import *     # импорт математических функций \nfor n in range(4321, 10**9, 4321):  # перебор чисел, кратных 4321, до 10^9\n    pr = prod(int(c) for c in str(n))  # вычисление произведения цифр числа\n    if fnmatch(str(n), '34*56?7') and str(pr)[-1] == '0':  \n    # проверка шаблона числа и что произведение цифр оканчивается на 0\n        print(n, pr)  \n        # вывод числа и произведения его цифр"},"defaultDz":false,"image":"","video":"","fileUrl":"","solved":false,"favorite":false,"sourceFields":{},"sectionName":"Маски"},{"id":"20502=20288  к","title":"20502=20288  к","desc":"1) символ «@» означает ровно одну произвольную нечётную цифру;\r\n2) символ «#» означает любую последовательность чётных цифр произвольной длины; в том числе «#» может задавать и пустую последовательность.\r\nСреди натуральных чисел, не превышающих 10^10, найдите все числа, соответствующие маске 20@@22#, делящиеся на 10980 без остатка.\r\nВ ответе запишите в первом столбце таблицы первые 5 найденных чисел в порядке возрастания, а во втором столбце – соответствующие им результаты деления этих чисел на 10980.\r\n","question":"","answer":"341475667 423360     344975677 4445280     348475687 4515840","kind":"informatika25","methods":["Без комментариев","С комментариями"],"codes":{"Без комментариев":"from itertools import *\nch=list('02468')+['']\nl=set()\nfor a,b,c,d,e,f in product('13579','13579',ch,ch,ch,ch):\n    sn=f'20{a}{b}22{c}{d}{e}{f}'\n    n=int(sn)\n    if n<10**10 and n%10980 ==0 :\n        l.add((n, n//10980) )\nfor c in sorted(l)[:5]:\n    print(*c)","С комментариями":"from itertools import *  # импорт функций для комбинаторики (product)\nch = list('02468') + ['']  # список чётных цифр и пустая строка (для необязательных позиций)\nl = set()  # множество для хранения уникальных результатов\nfor a, b, c, d, e, f in product('13579', '13579', ch, ch, ch, ch):\n# перебор: a,b — нечётные цифры; c,d,e,f — чётные или пусто (0-4 разрядов)\n    sn = f'20{a}{b}22{c}{d}{e}{f}'    \n    # формирование строки числа по шаблону\n    n = int(sn)  # преобразование в целое число\n    if n < 10**10 and n % 10980 == 0:  \n    # проверка: число меньше 10^10 и кратно 10980\n        l.add((n, n // 10980))  \n        # добавление пары (число, частное)\nfor c in sorted(l)[:5]:  \n# сортировка и вывод первых 5 результатов\n    print(*c)  # вывод пары через пробел"},"defaultDz":false,"image":"","video":"","fileUrl":"","solved":false,"favorite":false,"sourceFields":{},"sectionName":"Маски"},{"id":"20501  к","title":"20501  к","desc":"1) символ «?» означает ровно одну произвольную цифру;\r\n2) символ «&» означает последовательность цифр, образующих степень двойки (1, 2, 4, 8, 16, ...).\r\nСреди натуральных чисел, не превышающих 10^10, найдите числа, \r\nсоответствующие маске 8902??&, делящиеся на 1432 без остатка.\r\nВ ответе запишите в первом столбце таблицы первые 5 найденных чисел в порядке возрастания, \r\nа во втором столбце – соответствующие им результаты деления этих чисел на 1432.\r\n","question":"","answer":"8902744 6217    890214256 621658    890261512 621691    890280128 621704    8902108192 6216556","kind":"informatika25","methods":["Без комментариев","С комментариями"],"codes":{"Без комментариев":"from itertools import *\nn2=['1','2','4','8','16','32','64','128','256','512','1024','2048','4096','8192']\nl=set()\nfor a,b,c in product('0123456789','0123456789',n2):\n    sn=f'8902{a}{b}{c}'\n    n=int(sn)\n    if n<10**10 and n%1432  ==0 :\n        l.add((n, n//1432 ) )\nfor c in sorted(l)[:5]:\n    print(*c)","С комментариями":"from itertools import *  # импорт функций для комбинаторики (product)\nn2 = ['1','2','4','8','16','32','64','128','256','512','1024','2048','4096','8192']\n# список допустимых вариантов для третьей части числа (степени двойки в виде строк)\nl = set()  # множество для хранения уникальных результатов\nfor a, b, c in product('0123456789', '0123456789', n2):\n# перебор: a, b — любые цифры, c — степень двойки из списка\n    sn = f'8902{a}{b}{c}'  \n    # формирование строки числа по шаблону 8902ab + степень двойки\n    n = int(sn)  # преобразование в целое число\n    if n < 10**10 and n % 1432 == 0:  \n    # проверка: число меньше 10^10 и кратно 1432\n        l.add((n, n // 1432))  \n        # добавление пары (число, частное)\nfor c in sorted(l)[:5]:  \n# сортировка и вывод первых 5 результатов\n    print(*c)  # вывод пары через пробел"},"defaultDz":false,"image":"","video":"","fileUrl":"","solved":false,"favorite":false,"sourceFields":{},"sectionName":"Маски"},{"id":"5445  п  -  сумма цифр","title":"5445  п  -  сумма цифр","desc":"Известно, что в числе, соответствующему маске 32*54?123, четное количество цифр, \r\nпри этом в числе нет нулей    и    сумма левой половины цифр равна сумме правой половине цифр. \r\nНайдите все такие числа, кратные 519 и меньшие 10^13. \r\nВыведите найденные числа в порядке возрастания, справа от них укажите значение, получаемое при делении числа на 519.\r\n","question":"","answer":" 321525543123 619509717     322167546123 620746717     323724546123 623746717     324366549123 624983717     325281546123 626746717     325923549123 627983717","kind":"informatika25","methods":["Без комментариев","С комментариями"],"codes":{"Без комментариев":"from  itertools import *\nm1=list('123456789')+['']\nm2=list('123456789')\nl=set()\nm3=['']+[a+b for a,b in product(m2,m2)]+[a+b+c+d for a,b,c,d in product(m2,m2,m2,m2)]\nfor a,b in product(m3,m2):\n    sn=(f'32{a}54{b}123' )\n    pov=[c for c in sn if sn.count(c)>1]\n    n=int(sn)\n    s1=sum(int(c) for c in sn[:len(sn)//2])\n    s2=sum(int(c) for c in sn[len(sn)//2:])\n    if   len(sn)%2==0 and n<=10**13 and s1==s2 and n%519==0:\n        l.add((n,  n//519))\nfor c in sorted(l): print(*c)","С комментариями":"from itertools import *  # Импортируем все функции из модуля itertools (product)\nm1 = list('123456789') + ['']  # Создаём список цифр от 1 до 9 и добавляем пустую строку\nm2 = list('123456789')  # Список цифр от 1 до 9 \nl = set()  # Создаём пустое множество для хранения уникальных результатов\nm3 = [''] + [a+b for a, b in product(m2, m2)] + [a+b+c+d for a, b, c, d in product(m2, m2, m2, m2)]\n# Формируем список m3, который содержит различные варианты вставок:\n# 1. Пустая строка (вариант без вставки)\n# 2. Все комбинации из 2 цифр (от 11 до 99)\n# 3. Все комбинации из 4 цифр (от 1111 до 9999)\n\nfor a, b in product(m3, m2):\n# Перебираем все пары: a - вставка из m3, b - одна цифра из m2\n    sn = f'32{a}54{b}123'   # Формируем строку-кандидат по маске\n    n = int(sn)    # Преобразуем строку в целое число\n    s1 = sum(int(c) for c in sn[:len(sn)//2])  # сумма цифр в первой половине строки\n    s2 = sum(int(c) for c in sn[len(sn)//2:])  # сумма цифр во второй половине строки\n     if len(sn) % 2 == 0 and n <= 10**13 and s1 == s2 and n % 519 == 0:\n    # Проверяем все условия:\n    # Длина строки чётная, Число n не превышает 10^13\n    # Суммы половин равны, Число делится на 519\n         l.add((n, n // 519)) # Добавляем в множество пару (число, частное от деления на 519)\nfor c in sorted(l):\n# Сортируем результаты и выводим каждый\n    print(*c)  # *c распаковывает кортеж для вывода через пробел"},"defaultDz":false,"image":"","video":"https://rutube.ru/video/cf2aac8a46139de2a5f72ad38210828c/","fileUrl":"","solved":false,"favorite":false,"sourceFields":{},"sectionName":"Маски"},{"id":"6061 к","title":"6061 к","desc":"Среди натуральных чисел, не превышающих 10^7, найдите все числа, удовлетворяющие маске 34?8*9 и\r\nимеющие более 4 простых делителей (не равных самому числу и 1). \r\nВ ответ в порядке возрастания выпишите подходящие числа и их наибольшие простые делители. \r\n","question":"","answer":"3408699 107    3418989 157    3428139 131    3428679 79    3438799 53    3468969 79    3488199 173    3488709 233","kind":"informatika25","methods":["Без комментариев","С комментариями"],"codes":{"Без комментариев":"from itertools import *\nfrom math import *\n\ndelit = lambda n: sorted(set((chain(*[(c, n // c) for c in range(1, ceil(n ** 0.5 + 1) ) if n % c == 0]))))\n\nm=[c for c in  '0123456789']\nm1=[c for c in  '0123456789']+['']\nl=set()\nfor a,b,c in product(m,m1,m1):\n    n=int('34'+a+'8'+b+c+'9' )\n    d=delit(n)\n    d1=[c for c in d if len(delit(c))==2 and c!=1 and c!=n]\n    if   len(d1)>4:\n        print( n, max(d1))\n","С комментариями":"from fnmatch import *  # Импортируем функцию fnmatch для проверки соответствия строки шаблону\nfrom itertools import *  # Импортируем itertools для работы с комбинаторикой (product)\nfrom math import *  # Импортируем математические функции (ceil, sqrt)\n\ndelit = lambda n: sorted(set((chain(*[(c, n // c) for c in range(1, ceil(n ** 0.5 + 1) ) if n % c == 0]))))  # Лямбда-функция возвращает отсортированный список всех делителей числа n (включая 1 и n, так как range начинается с 1)\n\nm=[c for c in  '0123456789']  # Создаем список всех цифр от 0 до 9\nm1=[c for c in  '0123456789']+['']  # Создаем список всех цифр от 0 до 9 плюс пустая строка (для переменного количества символов)\nl=set()  # Создаем пустое множество l для хранения уникальных кортежей (число, максимальный простой делитель)\nfor a,b,c in product(m,m1,m1):  # Перебираем все комбинации a (цифра), b (цифра или пусто), c (цифра или пусто)\n    n=int('34'+a+'8'+b+c+'9' )  # Формируем строку числа по шаблону \"34{a}8{b}{c}9\" и преобразуем в целое число\n    d=delit(n)  # Получаем все делители числа n (включая 1 и n)\n    d1=[c for c in d if len(delit(c))==2 and c!=1 and c!=n]  # Из делителей оставляем только простые числа: у простого числа ровно 2 делителя (1 и само число), исключаем 1 и само n\n    if  fnmatch(str(n),'34?8*9') and len(d1)>4:  # Проверяем: соответствует ли число шаблону \"34?8*9\" И количество простых делителей больше 4\n        l.add(( n, max(d1)))  # Добавляем во множество кортеж (число, максимальный простой делитель)\nfor c in sorted(l): print(*c)  # Сортируем множество по первому элементу (числу) и выводим каждый кортеж, распаковывая его элементы через пробел"},"defaultDz":false,"image":"","video":"","fileUrl":"","solved":false,"favorite":false,"sourceFields":{},"sectionName":"Разложение на простые множители"},{"id":"4335 к","title":"4335 к","desc":"Напишите программу, которая перебирает целые числа, большие 960 000, в порядке возрастания и ищет среди них такие, \r\nу которых есть хотя бы три простых делителя, соответствующих маске *3? и не равных самому числу. \r\nВывести первые 5 найденных чисел и для каждого сумму всех простых делителей, соответствующих маске *3? и не равных самому числу. \r\n","question":"","answer":"962333 907    970579 401    988714 499    989551 401    993302 501","kind":"informatika25","methods":["Без комментариев","С комментариями"],"codes":{"Без комментариев":"from  fnmatch import *\nfrom itertools import *\nfrom math import *\n\ndelit = lambda n: sorted(set((chain(*[(c, n // c) for c in range(1, ceil(n ** 0.5 + 1) ) if n % c == 0]))))\n\nkol=0\nfor n in range(960001, 1500000):\n    d=delit(n)\n    d1=[c for c in d if fnmatch(str(c) , '*3?') and len(delit(c))==2 and c!=n ]\n    if   len(d1)>=3:\n        print( n, sum(d1))\n        kol+=1\n        if kol==5: break","С комментариями":"from fnmatch import *  # Импортируем функцию fnmatch для проверки соответствия строки шаблону\nfrom itertools import *  # Импортируем itertools (chain используется в лямбде)\nfrom math import *  # Импортируем математические функции (ceil, sqrt)\n\ndelit = lambda n: sorted(set((chain(*[(c, n // c) for c in range(1, ceil(n ** 0.5 + 1) ) if n % c == 0]))))  \n# Лямбда-функция возвращает отсортированный список всех делителей числа n (включая 1 и n)\n\nkol=0  # Счетчик найденных чисел (для ограничения вывода первыми 5)\nfor n in range(960001, 1500000):  # Перебираем числа в диапазоне от 960001 до 1499999 включительно\n    d=delit(n)  # Получаем все делители числа n\n    d1=[c for c in d if fnmatch(str(c) , '*3?') and len(delit(c))==2 and c!=n ]  \n    # Из делителей оставляем те, которые: заканчиваются на '3?' (предпоследняя цифра 3, последняя любая) И являются простыми (ровно 2 делителя) И не равны самому n\n    if   len(d1)>=3:  # Если таких делителей (простых, оканчивающихся на \"3?\") хотя бы 3\n        print( n, sum(d1))  # Выводим само число и сумму этих простых делителей\n        kol+=1  # Увеличиваем счетчик найденных чисел\n        if kol==5: break  # Если нашли 5 чисел, выходим из цикла"},"defaultDz":false,"image":"","video":"","fileUrl":"","solved":false,"favorite":false,"sourceFields":{},"sectionName":"Разложение на простые множители"},{"id":"787 к =1391 к (проще)  = 1389 к (проще) = 1394 к (проще)","title":"787 к =1391 к (проще)  = 1389 к (проще) = 1394 к (проще)","desc":"Для интервала [33333;55555] найдите числа, которые кратны сумме своих простых делителей (не считая единицы и самого числа). \r\nВ качестве ответа приведите числа, для которых сумма простых делителей больше 250, – сначала найденное число, затем сумма его простых делителей.\r\n","question":"","answer":"38086 278    44998 302    53332 268","kind":"informatika25","methods":["Без комментариев","С комментариями"],"codes":{"Без комментариев":"from itertools import *\nfrom math import *\n\ndelit = lambda n: sorted(set((chain(*[(c, n // c) for c in range(1, ceil(n ** 0.5 + 1) ) if n % c == 0]))))\nfor n in range(33333, 55555):\n    d=delit(n)\n    d=[c for c in d if c!=1 and c!=n and len(delit(c))==2]\n    su=sum(d)\n    if  su>250 and n%su==0 :\n        print( n, su)\n","С комментариями":"from itertools import *  # Импортируем itertools для использования chain (объединение последовательностей)\nfrom math import *  # Импортируем математические функции (ceil, sqrt)\n\ndelit = lambda n: sorted(set((chain(*[(c, n // c) for c in range(1, ceil(n ** 0.5 + 1) ) if n % c == 0]))))  \n# Лямбда-функция возвращает отсортированный список всех делителей числа n (включая 1 и n)\n\nfor n in range(33333, 55555):  # Перебираем числа в диапазоне от 38086 до 55554 включительно\n    d=delit(n)  # Получаем все делители числа n\n    d=[c for c in d if c!=1 and c!=n and len(delit(c))==2]  \n    # Из делителей оставляем только простые числа (исключаем 1 и само n, у простого числа ровно 2 делителя)\n    su=sum(d)  # Вычисляем сумму всех простых делителей числа n\n    if  su>250 and n%su==0 :  # Если сумма простых делителей больше 250 И n делится на эту сумму без остатка\n        print( n, su)  # Выводим само число и сумму его простых делителей\n"},"defaultDz":false,"image":"","video":"","fileUrl":"","solved":false,"favorite":false,"sourceFields":{},"sectionName":"Разложение на простые множители"},{"id":"18192 к","title":"18192 к","desc":"Напишите программу, которая перебирает целые числа, бо́льшие 1 000 000, в порядке возрастания и ищет среди них те, которые имеют ровно 3 простых делителя. \r\nВ ответе запишите 5 наименьших таких чисел в порядке возрастания. Справа от каждого такого числа укажите его наибольший простой делитель\r\n","question":"","answer":"1000002 166667    1000004 89    1000006 71429    1000012 19231    1000013 383","kind":"informatika25","methods":["Без комментариев","С комментариями"],"codes":{"Без комментариев":"from itertools import *\nfrom math import *\ndelit = lambda n: sorted(set((chain(*[(c, n // c) for c in range(1, ceil(n ** 0.5 + 1) ) if n % c == 0]))))\n\nkol=0\nfor n in range(1000001, 2000000):\n    d=sorted(delit(n))\n    d=[c for c in d if len(delit(c))==2]\n    if len(d)==3:\n        print(n, max(d))\n        kol+=1\n        if kol==5: break","С комментариями":"from itertools import *  # Импортируем itertools для использования chain (объединение последовательностей)\nfrom math import *  # Импортируем математические функции (ceil, sqrt)\n\ndelit = lambda n: sorted(set((chain(*[(c, n // c) for c in range(1, ceil(n ** 0.5 + 1) ) if n % c == 0]))))  \n# Лямбда-функция возвращает отсортированный список всех делителей числа n (включая 1 и n)\n\nkol=0  # Счетчик найденных чисел (для ограничения вывода первыми 5)\nfor n in range(1000001, 2000000):  # Перебираем числа в диапазоне от 1000001 до 1999999 включительно\n    d=sorted(delit(n))  # Получаем отсортированный список всех делителей числа n\n    d=[c for c in d if len(delit(c))==2]  \n    # Из делителей оставляем только простые числа (у простого числа ровно 2 делителя - 1 и само число)\n    if len(d)==3:  # Если количество простых делителей равно 3\n        print(n, max(d))  # Выводим само число и максимальный простой делитель\n        kol+=1  # Увеличиваем счетчик найденных чисел\n        if kol==5: break  # Если нашли 5 чисел, выходим из цикла"},"defaultDz":false,"image":"","video":"","fileUrl":"","solved":false,"favorite":false,"sourceFields":{},"sectionName":"Разложение на простые множители"},{"id":"3090 r","title":"3090 r","desc":"Пусть M(N) = | P(N) - E(N) | (модуль разности) для натурального числа N.\r\nP(N) - сумма абсолютно всех простых делителей числа N.  E(N) - сумма абсолютно всех чётных делителей числа N.\r\nСреди чисел N > 100 000 000 найдите 5 наименьших таких, у которых количество простых делителей совпадает с количеством чётных делителей.\r\nВ ответе запишите в первом столбце таблицы все найденные числа в порядке возрастания, а во втором столбце — соответствующие им значения M(N). \r\n","question":"","answer":"100000034 50000017    100000042 50000021    100000094 50000047    100000118 50000059    100000126 50000063","kind":"informatika25","methods":["Без комментариев","С комментариями"],"codes":{"Без комментариев":"from itertools import *\nfrom math import *\ndelit = lambda n: sorted(set((chain(*[(c, n // c) for c in range(1, ceil(n ** 0.5 + 1) ) if n % c == 0]))))\n\nkol=0\nfor n in range(100000001, 101000000):\n    d=delit(n)\n    dpr=[c for c in d if len(delit(c))==2]\n    dch=[c for c in d if c%2==0]\n    if len(dch)==len(dpr):\n        print(n, abs(sum(dpr)-sum(dch)))\n        kol+=1\n        if kol==5: break","С комментариями":"from itertools import *  # Импортируем itertools для использования chain (объединение последовательностей)\nfrom math import *  # Импортируем математические функции (ceil, sqrt)\n\ndelit = lambda n: sorted(set((chain(*[(c, n // c) for c in range(1, ceil(n ** 0.5 + 1) ) if n % c == 0]))))  \n# Лямбда-функция возвращает отсортированный список всех делителей числа n (включая 1 и n)\n\nkol=0  # Счетчик найденных чисел (для ограничения вывода первыми 5)\nfor n in range(100000001, 101000000):  # Перебираем числа в диапазоне от 100000001 до 100999999 включительно\n    d=delit(n)  # Получаем список всех делителей числа n\n    dpr=[c for c in d if len(delit(c))==2]  \n    # Из делителей оставляем только простые числа (у простого числа ровно 2 делителя - 1 и само число)\n    dch=[c for c in d if c%2==0]  \n    # Из делителей оставляем только четные числа\n    if len(dch)==len(dpr):  \n        # Если количество четных делителей равно количеству простых делителей\n        print(n, abs(sum(dpr)-sum(dch)))  \n        # Выводим само число и модуль разности между суммой простых делителей и суммой четных делителей\n        kol+=1  # Увеличиваем счетчик найденных чисел\n        if kol==5: break  # Если нашли 5 чисел, выходим из цикла"},"defaultDz":false,"image":"","video":"","fileUrl":"","solved":false,"favorite":false,"sourceFields":{},"sectionName":"Разложение на простые множители"},{"id":"2591 к =27338 к = 27336 к  РАЗЛОЖЕНИЕ","title":"2591 к =27338 к = 27336 к  РАЗЛОЖЕНИЕ","desc":"Среди целых чисел, принадлежащих числовому отрезку [125697; 125721], найдите числа, \r\nкоторые представляют собой произведение двух различных простых делителей. \r\nДля каждого найденного числа запишите эти два делителя в таблицу на экране с новой строки в порядке возрастания произведения этих двух делителей. \r\nДелители в строке таблицы также должны следовать в порядке возрастания.\r\n","question":"","answer":"7 17957    337 373    2 62851    3 41903    7 17959","kind":"informatika25","methods":["Без комментариев","С комментариями"],"codes":{"Без комментариев":"from math import *\ndef raz(n):\n    l=[]\n    for i in range(2, ceil(n**0.5)+1):\n        while n%i==0:\n            l.append(i)\n            n=n//i\n    if n!=1: l.append(n)\n    return l\n\nfor n in range(125697, 125721+1):\n    d=raz(n)\n    if len(d)==2:\n        print( *d)","С комментариями":"from math import *  # Импортируем математические функции (ceil)\n\ndef raz(n):  # Определяем функцию разложения числа на простые множители\n    l=[]  # Создаем пустой список для хранения простых множителей\n    for i in range(2, ceil(n**0.5)+1):  \n        # Перебираем возможные делители от 2 до квадратного корня из n (округленного вверх)\n        while n%i==0:  # Пока n делится на i без остатка\n            l.append(i)  # Добавляем i в список множителей\n            n=n//i  # Делим n на i\n    if n!=1: l.append(n)  \n    # Если после цикла осталось число больше 1, оно тоже является простым множителем\n    return l  # Возвращаем список простых множителей\n\nfor n in range(125697, 125721+1):  # Перебираем числа в диапазоне от 125697 до 125721 включительно\n    d=raz(n)  # Получаем список простых множителей числа n\n    if len(d)==2:  \n    # Если в списке ровно 2 множителя (значит число является произведением двух простых чисел)\n        print( *d)  # Выводим эти два простых множителя через пробел"},"defaultDz":false,"image":"","video":"","fileUrl":"","solved":false,"favorite":false,"sourceFields":{},"sectionName":"Разложение на простые множители"},{"id":"680 к = 27338 к =27336 к - РАЗЛОЖЕНИЕ","title":"680 к = 27338 к =27336 к - РАЗЛОЖЕНИЕ","desc":"Рассматриваются целые числа, принадлежащих числовому отрезку [485617; 529678], \r\nкоторые представляют собой произведение трёх различных простых делителей, оканчивающихся на одну и ту же цифру. \r\nВ качестве ответа приведите все числа, разность максимального и минимального простых делителей которого меньше 100.\r\nДля каждого такого числа сначала запишите само число, а затем разность максимального и минимального простых делителей\r\n","question":"","answer":"487813 60    497087 60    500477 70    502793 90    508049 50","kind":"informatika25","methods":["Без комментариев","С комментариями"],"codes":{"Без комментариев":"from math import *\ndef raz(n):\n    l=[]\n    for i in range(2, ceil(n**0.5)+1):\n        while n%i==0:\n            l.append(i)\n            n=n//i\n    if n!=1: l.append(n)\n    return l\n\nfor n in range(485617, 529678+1):\n    d=raz(n)\n    if len(d)==len(set(d))==3 and d[0]%10==d[1]%10==d[2]%10 and d[2]-d[0]<100:\n    # if len(d)==len(set(d))==3 and str(d[0])[-1]==str(d[1])[-1]==str(d[2])[-1] and d[2]-d[0]<100:\n        print( n, d[2]-d[0])","С комментариями":"from math import *  # Импортируем математические функции (ceil)\n\ndef raz(n):  # Определяем функцию разложения числа на простые множители\n    l=[]  # Создаем пустой список для хранения простых множителей\n    for i in range(2, ceil(n**0.5)+1):  \n    # Перебираем возможные делители от 2 до квадратного корня из n (округленного вверх)\n        while n%i==0:  # Пока n делится на i без остатка\n            l.append(i)  # Добавляем i в список множителей\n            n=n//i  # Делим n на i\n    if n!=1: l.append(n)  \n    # Если после цикла осталось число больше 1, оно тоже является простым множителем\n    return l  # Возвращаем список простых множителей\n\nfor n in range(485617, 529678+1):  # Перебираем числа в диапазоне от 485617 до 529678 включительно\n    d=raz(n)  # Получаем список простых множителей числа n\n    if len(d)==len(set(d))==3 and d[0]%10==d[1]%10==d[2]%10 and d[2]-d[0]<100:  \n    # Проверяем: ровно 3 различных простых множителя (len(d)==3 и все разные) \n    # И последние цифры всех трех множителей одинаковы (остаток от деления на 10) И разница между максимальным и минимальным множителем меньше 100\n    \n    # if len(d)==len(set(d))==3 and str(d[0])[-1]==str(d[1])[-1]==str(d[2])[-1] and d[2]-d[0]<100:  \n    # Альтернативная проверка через строки: последние символы всех трех множителей одинаковы\n        print( n, d[2]-d[0])  # Выводим само число и разницу между максимальным и минимальным простым множителем"},"defaultDz":false,"image":"","video":"","fileUrl":"","solved":false,"favorite":false,"sourceFields":{},"sectionName":"Разложение на простые множители"},{"id":"26687 к  =26685 к (проще) - РАЗЛОЖЕНИЕ","title":"26687 к  =26685 к (проще) - РАЗЛОЖЕНИЕ","desc":"Напишите программу, которая перебирает целые числа, большие 89427150, в порядке возрастания и ищет среди них те, \r\nкоторые можно представить в виде произведения 8 простых множителей (не обязательно различных), при этом выполняются оба условия:\r\n    - среди простых множителей есть ровно две пары повторяющихся множителей, остальные множители различны.\r\n    - минимальный простой множитель не повторяется.\r\nВ ответе запишите первые 7 найденных чисел в порядке возрастания, а через пробел  для каждого из них соответствующий наибольший из найденных множителей\r\n","question":"","answer":"89439210 1193    89439570 191    89442150 283    89446266 269    89448390 181    89450550 389    89451450 1063","kind":"informatika25","methods":["Без комментариев","С комментариями"],"codes":{"Без комментариев":"from math import *\ndef raz(n):\n    l=[]\n    for i in range(2, ceil(n**0.5)+1):\n        while n%i==0:\n            l.append(i)\n            n=n//i\n    if n!=1: l.append(n)\n    return l\n\nk=0\nfor n in range(89427151  , 89427150*10):\n    d=raz(n)\n    pov=[c for c in d if d.count(c)==2]\n    npov=[c for c in d if d.count(c)==1]\n    if len(d)==8 and len(pov)==4 and len(npov)==4 and min(d) not in pov:\n        print( n, max(d))\n        k+=1\n        if k==7: break","С комментариями":"from math import *  # Импортируем математические функции (ceil)\n\ndef raz(n):  # Определяем функцию разложения числа на простые множители\n    l=[]  # Создаем пустой список для хранения простых множителей\n    for i in range(2, ceil(n**0.5)+1):  \n    # Перебираем возможные делители от 2 до квадратного корня из n (округленного вверх)\n        while n%i==0:  # Пока n делится на i без остатка\n            l.append(i)  # Добавляем i в список множителей\n            n=n//i  # Делим n на i\n    if n!=1: l.append(n)  \n    # Если после цикла осталось число больше 1, оно тоже является простым множителем\n    return l  # Возвращаем список простых множителей\n\nk=0  # Счетчик найденных чисел (для ограничения вывода первыми 7)\nfor n in range(89427151, 89427150*10):  # Перебираем числа от 89427151 до 894271499 (так как 89427150*10 = 894271500)\n    d=raz(n)  # Получаем список простых множителей числа n\n    pov=[c for c in d if d.count(c)==2]  \n    # Из множителей оставляем только те, которые встречаются ровно 2 раза (повторяющиеся)\n    npov=[c for c in d if d.count(c)==1]  \n    # Из множителей оставляем только те, которые встречаются ровно 1 раз (неповторяющиеся)\n    if len(d)==8 and len(pov)==4 and len(npov)==4 and min(d) not in pov:  \n    # Проверяем: всего 8 множителей И 4 из них повторяются дважды (значит 2 уникальных числа, каждое встречается 2 раза? ИЛИ 4 числа по 2 раза?) И 4 неповторяющихся И минимальный множитель не входит в повторяющиеся\n        print( n, max(d))  # Выводим само число и максимальный простой множитель\n        k+=1  # Увеличиваем счетчик найденных чисел\n        if k==7: break  # Если нашли 7 чисел, выходим из цикла"},"defaultDz":false,"image":"","video":"","fileUrl":"","solved":false,"favorite":false,"sourceFields":{},"sectionName":"Разложение на простые множители"},{"id":"26081  к -  В ВИДЕ СУММЫ","title":"26081  к -  В ВИДЕ СУММЫ","desc":"Напишите программу, которая перебирает все целые шестизначные числа в порядке возрастания и ищет среди них те, \r\nкоторые не содержат в своей записи цифру 0 и которые можно представить \r\nв виде суммы нечётного натурального числа, делящегося без остатка на 113, и натуральной степени числа 3. \r\nВ ответе в первом столбце таблицы запишите первые 5 найденных чисел в порядке возрастания, \r\nа во втором столбце - для каждого числа соответствующий показатель степени числа \r\n","question":"","answer":"111142 10    111232 7      111312 8      111314 2    111322 5","kind":"informatika25","methods":["Без комментариев","С комментариями"],"codes":{"Без комментариев":"from itertools import *\nm1=[c for c in range(113,1000000 ,113) if c%113==0 and c%2!=0]\nm2=[3**c for c in range(1,20) ]\nl=set()\nfor a,b in product(m1,m2):\n    n=a+b\n    if len(str(n))==6 and '0' not in str(n):\n        l.add((n,b,*[k for k in range(20) if 3**k==b]))\nfor c in sorted(l)[:5]:\n    print(*c)","С комментариями":"from itertools import *  # Импортируем itertools для использования product (декартово произведение)\n\nm1=[c for c in range(113, 1000000, 113) if c%113==0 and c%2!=0]  \n# Создаем список нечетных чисел, кратных 113, в диапазоне от 113 до 999999 (шаг 113, условие c%113==0 избыточно, так как range уже дает кратные 113)\n\nm2=[3**c for c in range(1, 20)]  \n# Создаем список степеней тройки: 3^1, 3^2, ..., 3^19\n\nl=set()  \n# Создаем пустое МНОЖЕСТВО для хранения уникальных результатов\n\nfor a,b in product(m1,m2):  # Перебираем все пары (a, b) из m1 и m2\n    n=a+b  # Суммируем a и b\n    if len(str(n))==6 and '0' not in str(n):  \n    # Если длина числа n равна 6 цифрам И в его десятичной записи нет нулей\n        l.add((n, b, *[k for k in range(20) if 3**k==b]))  \n        # Добавляем в МНОЖЕСТВО кортеж: (n, b)\n\nfor c in sorted(l)[:5]:  \n# Сортируем множество l по первому элементу кортежа (n) и берем первые 5 элементов\n    print(*c)  # Выводим каждый кортеж, распаковывая его элементы через пробел"},"defaultDz":false,"image":"","video":"","fileUrl":"","solved":false,"favorite":false,"sourceFields":{},"sectionName":"Разложение на простые множители"},{"id":"225129  к -  В ВИДЕ СУММЫ","title":"225129  к -  В ВИДЕ СУММЫ","desc":"Напишите программу, которая перебирает целые числа, большие 1 000 000, в порядке возрастания и ищет среди них те, \r\nкоторые можно представить в виде суммы четного натурального числа, кратного 111 и не содержащего нечётных цифр, и натуральной степени числа 5. \r\nВ ответе в первом столбце таблицы запишите первые 5 найденных чисел в порядке возрастания, \r\nа во втором столбце - для каждого числа соответствующий показатель степени числа 5.\r\n","question":"","answer":"1010671 8    1010893 8    1012669 8    1012891 8    1013113 8","kind":"informatika25","methods":["Без комментариев","С комментариями"],"codes":{"Без комментариев":"from  itertools import *\nm111=[c for c in range(222,3000000,111) if '1' not in str(c) and '3' not in str(c) \\\n      and '5' not in str(c) and '7' not in str(c) and '9' not in str(c)]\nm5=[5**c for c in range(10) ]\nl=set()\nfor a,b in product(m111,m5):\n    n=a+b\n    if n>1000000: l.add((n,[k for k in range(20) if 5**k==b][0]))\nfor c in sorted(l)[:5]:print(*c)","С комментариями":"from itertools import *  # Импортируем itertools для использования product (декартово произведение)\n\nm111=[c for c in range(111, 3_000_000, 111) if c%2==0 and \\\n      '1' not in str(c) and '3' not in str(c) and \\\n      '5' not in str(c) and '7' not in str(c) and '9' not in str(c)]\n# Создаем список ЧЕТНЫХ чисел, кратных 111\n# В десятичной записи нет нечетных цифр\n\nm5=[5**c for c in range(20)]  # Создаем список степеней пятерки: 5^0, 5^1, ..., 5^19\n\nl=set()  # Создаем пустое МНОЖЕСТВО для хранения уникальных результатов\n\nfor a,b in product(m111, m5):  # Перебираем все пары (a, b) из m111 и m5\n    n=a+b  # Суммируем a и b\n    if n>1_000_000:  # Если сумма больше 1 000 000\n        l.add((n, [k for k in range(20) if 5**k==b][0]))\n        # Добавляем в множество кортеж: (n, показатель степени k такой, что 5^k = b)\n\nfor c in sorted(l)[:5]:\n# Сортируем множество l по первому элементу кортежа (n) и берем первые 5 элементов\n    print(*c)  # Выводим каждый кортеж, распаковывая его элементы через пробел"},"defaultDz":false,"image":"","video":"","fileUrl":"","solved":false,"favorite":false,"sourceFields":{},"sectionName":"Разложение на простые множители"},{"id":"2593 к  - ОСНОВНАЯ ТЕОРЕМА АРИФМЕТИКИ - ГРОБ","title":"2593 к  - ОСНОВНАЯ ТЕОРЕМА АРИФМЕТИКИ - ГРОБ","desc":"Найдите наименьшее натуральное число, которое имеет ровно 1000 делителей. В ответе запишите сначала само число и затем его наибольший простой делитель.","question":"","answer":"810810000 13","kind":"informatika25","methods":["Без комментариев","С комментариями"],"codes":{"Без комментариев":"","С комментариями":"print(2**4*3**4*5**4*7*11*13, 13)"},"defaultDz":false,"image":"","video":"","fileUrl":"","solved":false,"favorite":false,"sourceFields":{},"sectionName":"Разложение на простые множители"},{"id":"2592 к  - ОСНОВНАЯ ТЕОРЕМА АРИФМЕТИКИ - ГРОБ","title":"2592 к  - ОСНОВНАЯ ТЕОРЕМА АРИФМЕТИКИ - ГРОБ","desc":"Найдите все натуральные числа, принадлежащие отрезку [55 000 000; 60 000 000], \r\nу которых ровно пять различных нечётных делителей (количество чётных делителей может быть любым). \r\nВ ответе перечислите найденные числа, справа от каждого числа запишите его наибольший нечётный делитель.\r\n","question":"","answer":"55383364 13845841    56796482 28398241    58492928 28561    59105344 923521    59969536 14641    59973152 1874161","kind":"informatika25","methods":["Без комментариев","С комментариями"],"codes":{"Без комментариев":"from  math import *\nfrom  itertools import *\ndelit=lambda n: set(chain(*[(c,n//c) for c in range(1,ceil(n**0.5)+1) if n%c==0]))\npr=[c**4 for c in range(3,10**2,2) if len(delit(c))==2]\nst=[2**k for k in range(30)]\nl=[]\nfor a,b in product(pr,st):\n    if 55000000<=a*b<=60000000:\n        l.append((a*b, a))\nfor c in sorted(l): print(*c)","С комментариями":"from math import *  # Импортируем математические функции (ceil)\nfrom itertools import *  # Импортируем itertools для использования product и chain\n\ndelit = lambda n: set(chain(*[(c, n // c) for c in range(1, ceil(n ** 0.5) + 1) if n % c == 0]))  \n# Лямбда-функция возвращает МНОЖЕСТВО всех делителей числа n (включая 1 и n)\n\npr = [c ** 4 for c in range(3, 10 ** 2, 2) if len(delit(c)) == 2]  \n# Создаем список четвертых степеней нечетных простых чисел: \n# c от 3 до 99 с шагом 2 (только нечетные), условие len(delit(c))==2 проверяет, что c простое \n# (у простого числа ровно 2 делителя). Получаем p^4 для нечетных простых p\n\nst = [2 ** k for k in range(30)]  \n# Создаем список степеней двойки: 2^0, 2^1, ..., 2^29\n\nl = []  # Создаем пустой список для хранения результатов\n\nfor a, b in product(pr, st):  # Перебираем все пары (a = p^4, b = 2^k) \n    if 55000000 <= a * b <= 60000000:  \n    # Если произведение a*b (само число n) попадает в диапазон от 55 до 60 миллионов\n        l.append((a * b, a))  # Добавляем кортеж (число n, наибольший нечетный делитель = p^4)\n\nfor c in sorted(l):  # Сортируем список по первому элементу (по числу n)\n    print(*c)  # Выводим каждый кортеж, распаковывая элементы через пробел"},"defaultDz":false,"image":"","video":"","fileUrl":"","solved":false,"favorite":false,"sourceFields":{},"sectionName":"Разложение на простые множители"},{"id":"2407 к  - огромный диапазон","title":"2407 к  - огромный диапазон","desc":"Найдите все натуральные числа, принадлежащие отрезку [1 000 000 000 ; 2 000 000 000], \r\nу которых больше 100 различных нечётных делителей, \r\nколичество чётных делителей может быть любым. \r\nИ при этом число должно делиться на каждое из чисел: 7, 13, 17, 23, 29, но не делиться ни на 3, ни на 5. \r\nВ ответе запишите количество подходящих чисел.\r\n","question":"","answer":"73","kind":"informatika25","methods":["Без комментариев","С комментариями"],"codes":{"Без комментариев":"from  math import *\nfrom  itertools import *\ndelit=lambda n: set(chain(*[(c,n//c) for c in range(1,ceil(n**0.5)+1) if n%c==0]))\n\nl=set()\npr=7*13*17*23*29\nm=1_000_000_000  \nstart=m-m%pr+pr\nfor n in range(start, 2_000_000_000, pr):\n    d=delit(n)\n    d=[c for c in d if c%2==1]\n    if len(d)>100 and n%3!=0 and n%5!=0:\n        l.add(n)\nprint(len(l))","С комментариями":"from math import *  # Импортируем математические функции (ceil)\nfrom itertools import *  # Импортируем itertools для использования chain (объединение последовательностей)\n\ndelit=lambda n: set(chain(*[(c, n//c) for c in range(1, ceil(n**0.5)+1) if n%c==0]))\n# Лямбда-функция возвращает МНОЖЕСТВО всех делителей числа n (включая 1 и n)\n\nl=set()  # Создаем пустое множество для хранения чисел, удовлетворяющих условиям\n\npr=7*13*17*23*29\n# Чтобы перебирать числа, которые делятся на 7,13,17,23,29, будем идти с шагом pr\nm=1_000_000_000  # Нижняя граница диапазона поиска\nstart=m-m%pr+pr\nfor n in range(start, 2_000_000_000, pr):\n# Перебираем числа от ближайшего сверху кратного st к 1 миллиарду, до 2 миллиардов,\n# с шагом st (то есть числа, кратные произведению 7*13*17*23*29)\n    d=delit(n)  # Получаем множество всех делителей числа n\n    d=[c for c in d if c%2==1]  # Из делителей оставляем только НЕЧЕТНЫЕ (c%2==1)\n    if len(d)>100 and n%3!=0 and n%5!=0:\n    # Если количество нечетных делителей больше 100 И число n НЕ делится на 3 И НЕ делится на 5\n        l.add(n)  # Добавляем число n в множество\n\nprint(len(l))  # Выводим количество найденных чисел"},"defaultDz":false,"image":"","video":"","fileUrl":"","solved":false,"favorite":false,"sourceFields":{},"sectionName":"Разложение на простые множители"},{"id":"1256 к - в виде произведения","title":"1256 к - в виде произведения","desc":"Найдите все натуральные числа, N, принадлежащие отрезку [200 000 000; 400 000 000], \r\nкоторые можно представить в виде N = 2^m · 3^n, где m – чётное число, n – нечётное число. \r\nВ ответе запишите все найденные числа в порядке возрастания.\r\n","question":"","answer":"201326592    229582512    254803968    322486272","kind":"informatika25","methods":["Без комментариев","С комментариями"],"codes":{"Без комментариев":"from  itertools import *\na=[2**k for k in range(2,30,2)]\nb=[3**k for k in range(1,30,2)]\nl=set()\nfor c,d in product(a,b):\n    if 200000000<=c*d<=400000000: l.add(c*d)\nfor c in sorted(l): print(c)","С комментариями":"from itertools import *  # Импортируем itertools для использования product (декартово произведение)\n\na=[2**k for k in range(2,30,2)]  # Создаем список четных степеней двойки: k=2,4,6,...,28 → 2^2, 2^4, 2^6, ..., 2^28\n\nb=[3**k for k in range(1,30,2)]  # Создаем список нечетных степеней тройки: k=1,3,5,...,29 → 3^1, 3^3, 3^5, ..., 3^29\n\nl=set()  # Создаем пустое множество для хранения произведений\n\nfor c,d in product(a,b):  # Перебираем все пары (c, d) из a и b\n    if 200000000 <= c*d <= 400000000:\n    # Если произведение c*d находится в диапазоне от 200 миллионов до 400 миллионов включительно\n        l.add(c*d)  # Добавляем произведение в список\n\nfor c in sorted(l):  # Сортируем список по возрастанию\n    print(c)  # Выводим каждое число на отдельной строке"},"defaultDz":false,"image":"","video":"","fileUrl":"","solved":false,"favorite":false,"sourceFields":{},"sectionName":"Разложение на простые множители"},{"id":"26681 к - степень простого числа","title":"26681 к - степень простого числа","desc":"Напишите программу, которая перебирает целые числа, большие 700 000, в порядке возрастания и ищет среди них числа, \r\nкоторые являются степенью простого числа с натуральным показателем степени, большим 1. \r\nВ ответе в первом столбце таблицы запишите первые 5 найденных чисел в порядке возрастания, \r\nа во втором столбце – соответствующие им простые числа (основания степеней).\r\n","question":"","answer":"703921 839    704969 89    707281 29    727609 853    734449 857","kind":"informatika25","methods":["Без комментариев","С комментариями"],"codes":{"Без комментариев":"from  math import *\ndef raz(n):\n    l=[]\n    for i in range(2, ceil(n**0.5)+1):\n        while n%i==0:\n            l.append(i)\n            n=n//i\n    if n!=1: l.append(n)\n    return l\nk=0\nfor n in range(700001, 1000000):\n    d=raz(n)\n    if len(set(d))==1 and len(d)>1:\n        print(n,d[0])\n        k+=1\n        if k==5: break","С комментариями":"from math import *  # Импортируем математические функции (ceil)\n\ndef raz(n):  # Определяем функцию разложения числа на простые множители\n    l=[]  # Создаем пустой список для хранения простых множителей\n    for i in range(2, ceil(n**0.5)+1):  # Перебираем возможные делители от 2 до квадратного корня из n (округленного вверх)\n        while n%i==0:  # Пока n делится на i без остатка\n            l.append(i)  # Добавляем i в список множителей\n            n=n//i  # Делим n на i\n    if n!=1: l.append(n)  # Если после цикла осталось число больше 1, оно тоже является простым множителем\n    return l  # Возвращаем список простых множителей\n\nk=0  # Счетчик найденных чисел (для ограничения вывода первыми 5)\n\nfor n in range(700001, 1000000):  \n# Перебираем числа в диапазоне от 700001 до 999999 включительно\n    d=raz(n)  # Получаем список простых множителей числа n\n    if len(set(d))==1 and len(d)>1:  \n    # Проверяем: все простые множители одинаковы (множество из 1 элемента) \n    # И множителей больше одного (значит число является степенью простого числа: p^k, где k>=2)\n        print(n, d[0])  \n        # Выводим само число и основание степени (первый (минимальный) простой множитель)\n        k+=1  # Увеличиваем счетчик найденных чисел\n        if k==5: break  # Если нашли 5 чисел, выходим из цикла"},"defaultDz":false,"image":"","video":"","fileUrl":"","solved":false,"favorite":false,"sourceFields":{},"sectionName":"Разложение на простые множители"},{"id":"26536 к - палиндромы","title":"26536 к - палиндромы","desc":"Напишите программу, которая перебирает целые числа, большие 3 502 100, в порядке возрастания и ищет среди них числа, \r\nпредставленные в виде произведения 4 простых множителей, не обязательно различных, и при этом хотя бы один из множителей является двузначным палиндромом, \r\nт.е. одинаково читается слева направо и справа налево, и состоит из двух цифр. \r\nВ ответе в первом столбце таблицы запишите первые 5 найденных чисел в порядке возрастания, \r\nа во втором столбце - для каждого из них соответствующий наибольший из множителей этого числа.\r\n","question":"","answer":"3502103 281    3502114 22741    3502191 15161    3502213 1289    3502235 1721","kind":"informatika25","methods":["Без комментариев","С комментариями"],"codes":{"Без комментариев":"from  math import *\ndef raz(n):\n    l=[]\n    for i in range(2, ceil(n**0.5)+1):\n        while n%i==0:\n            l.append(i)\n            n=n//i\n    if n!=1: l.append(n)\n    return l\nk=0\nfor n in range(3502101, 10000000):\n    d=raz(n)\n    d1=[c for c in d if 10<=c<=99 and str(c)==str(c)[::-1]]\n    if len(d)==4 and d1:\n        print(n,max(d))\n        k+=1\n        if k==5: break","С комментариями":"from math import *  # Импортируем математические функции (ceil)\n\ndef raz(n):  # Определяем функцию разложения числа на простые множители\n    l=[]  # Создаем пустой список для хранения простых множителей\n    for i in range(2, ceil(n**0.5)+1):  # Перебираем возможные делители от 2 до квадратного корня из n (округленного вверх)\n        while n%i==0:  # Пока n делится на i без остатка\n            l.append(i)  # Добавляем i в список множителей\n            n=n//i  # Делим n на i\n    if n!=1: l.append(n)  # Если после цикла осталось число больше 1, оно тоже является простым множителем\n    return l  # Возвращаем список простых множителей\n\nk=0  # Счетчик найденных чисел \n\nfor n in range(3502101, 10000000):  # Перебираем числа в диапазоне от 3502101 до 9999999 включительно\n    d=raz(n)  # Получаем список простых множителей числа n\n    d1=[c for c in d if 10<=c<=99 and str(c)==str(c)[::-1]]  \n    # Из простых множителей оставляем только ДВУЗНАЧНЫЕ (от 10 до 99) \n    # ПАЛИНДРОМЫ (число читается одинаково слева направо и справа налево)\n    if len(d)==4 and d1:  \n    # Если всего простых множителей ровно 4 (с учетом кратности) \n    # И есть хотя бы один двузначный палиндром среди них\n        print(n, max(d))  # Выводим само число и максимальный простой множитель\n        k+=1  # Увеличиваем счетчик найденных чисел\n        if k==5: break  # Если нашли 5 чисел, выходим из цикла"},"defaultDz":false,"image":"","video":"","fileUrl":"","solved":false,"favorite":false,"sourceFields":{},"sectionName":"Разложение на простые множители"},{"id":"5477 к - соседи простые","title":"5477 к - соседи простые","desc":"Напишите программу, которая перебирает целые числа, большие 600 000, в порядке возрастания и ищет среди них такие, \r\nчто они делятся на 6 без остатка и их соседи - простые числа. \r\nДля первых шести найденных чисел выведите соседей каждого найденного числа в порядке возрастания. \r\nСоседями числа называются числа, отличные от него на 1.\r\n","question":"","answer":"600071 600073    600167 600169    600239 600241    600317 600319    600359 600361    600401 600403","kind":"informatika25","methods":["Без комментариев","С комментариями"],"codes":{"Без комментариев":"from  math import *\ndef raz(n):\n    l=[]\n    for i in range(2, ceil(n**0.5)+1):\n        while n%i==0:\n            l.append(i)\n            n=n//i\n    if n!=1: l.append(n)\n    return l\nk=0\nfor n in rang // Исполнитель Python. Состояние Worker должно быть объявлено явно до первого запуска.
let activePythonWorker=null;
let pythonWorkerReady=false;
let pythonWorkerPending=[];
let pythonRunTimer=null;
let pythonInitTimer=null;
// Визуализатор удалён; ниже оставлен только исполнитель Python.
function terminatePythonWorker(){if(pythonRunTimer){clearTimeout(pythonRunTimer);pythonRunTimer=null}if(pythonInitTimer){clearTimeout(pythonInitTimer);pythonInitTimer=null}if(activePythonWorker){activePythonWorker.terminate();activePythonWorker=null}pythonWorkerReady=false;pythonWorkerPending=[]}
function createPythonWorker(){
  const source=`let pyodide=null;self.onmessage=async(e)=>{const d=e.data||{};if(d.type==='init'){try{importScripts('https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js');pyodide=await loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/'});self.postMessage({type:'ready'})}catch(err){self.postMessage({type:'init-error',error:String(err)})}}else if(d.type==='run'&&pyodide){try{const code=d.code;const wrapped='import io,sys,contextlib\\n_buf=io.StringIO()\\ntry:\\n    with contextlib.redirect_stdout(_buf):\\n        exec('+JSON.stringify(code)+', {})\\n    _out=_buf.getvalue()\\nexcept Exception as _e:\\n    _out=\\'Ошибка: \\'+str(_e)\\n_out';const result=await pyodide.runPythonAsync(wrapped);self.postMessage({type:'result',result:String(result||'')})}catch(err){self.postMessage({type:'result',result:'Ошибка: '+String(err)})}}};`;
  const blob=new Blob([source],{type:'text/javascript'});
  const url=URL.createObjectURL(blob);
  let w;
  try{w=new Worker(url)}catch(err){URL.revokeObjectURL(url);throw err}
  activePythonWorker=w;
  // Не отзывать Blob URL сразу после new Worker: некоторые браузеры, особенно
  // при открытии автономного HTML локально, ещё не успевают загрузить скрипт Worker.
  const releaseWorkerUrl=()=>{try{URL.revokeObjectURL(url)}catch(_){}};
  w.onmessage=e=>{const d=e.data||{};if(d.type==='ready'){releaseWorkerUrl();if(pythonInitTimer){clearTimeout(pythonInitTimer);pythonInitTimer=null}pythonWorkerReady=true;pythonWorkerPending.splice(0).forEach(fn=>fn())}else if(d.type==='init-error'){releaseWorkerUrl();if(pythonInitTimer){clearTimeout(pythonInitTimer);pythonInitTimer=null}const pending=pythonWorkerPending.splice(0);pending.forEach(fn=>fn(new Error(d.error||'Не удалось загрузить Python')))}else if(d.type==='result'){if(pythonRunTimer){clearTimeout(pythonRunTimer);pythonRunTimer=null}const r=d.result||'';if(window.__pythonRunFinish)window.__pythonRunFinish(r,!!(r&&String(r).startsWith('Ошибка:')))}};
  w.onerror=e=>{releaseWorkerUrl();if(pythonInitTimer){clearTimeout(pythonInitTimer);pythonInitTimer=null}if(window.__pythonRunFinish)window.__pythonRunFinish('Ошибка запуска Python: '+(e.message||'ошибка Worker'),true);const pending=pythonWorkerPending.splice(0);pending.forEach(fn=>fn(new Error(e.message||'Ошибка запуска Worker')));terminatePythonWorker()};
  w.postMessage({type:'init'});
  pythonInitTimer=setTimeout(()=>{if(!pythonWorkerReady&&activePythonWorker===w){releaseWorkerUrl();const pending=pythonWorkerPending.splice(0);pending.forEach(fn=>fn(new Error('Не удалось загрузить Python за 20 секунд. Проверьте подключение к интернету и разрешение загрузки CDN.')));terminatePythonWorker()}},20000);
  return w;
}
function runPy(code,out,status,btn,onResult){
  out.textContent='⏳ Подготовка Python…';status.textContent='СТАТУС: ⏳ Подготовка Python…';btn.disabled=true;
  const finish=(result,isError)=>{if(pythonRunTimer){clearTimeout(pythonRunTimer);pythonRunTimer=null}window.__pythonRunFinish=null;out.textContent=result||'(код выполнен, вывода нет)';status.textContent=isError?'СТАТУС: ✕ Ошибка выполнения':'СТАТУС: ✓ Код выполнен';btn.disabled=false;if(onResult)onResult(result||'',isError)};
  const run=()=>{if(!activePythonWorker||!pythonWorkerReady){finish('Ошибка: не удалось запустить Python',true);return}status.textContent='СТАТУС: ▶ Выполняю код…';out.textContent='▶ Выполняю…';window.__pythonRunFinish=finish;pythonRunTimer=setTimeout(()=>{terminatePythonWorker();window.__pythonRunFinish=null;out.textContent='Код выполнялся более 5 секунд и был прерван. Решите в другой среде.';status.textContent='СТАТУС: ⏱ Выполнение прервано (лимит 5 секунд)';btn.disabled=false;if(onResult)onResult('Код выполнялся более 5 секунд и был прерван. Решите в другой среде.',true)},5000);activePythonWorker.postMessage({type:'run',code})};
  if(activePythonWorker&&pythonWorkerReady){run();return}
  pythonWorkerPending.push(err=>{if(err){finish('Ошибка загрузки Python: '+err.message,true);return}run()});
  if(!activePythonWorker)createPythonWorker();
}

      let html='<article class="print-task">';

      if(opt.cond)html+=`<div class="print-condition">${esc(t.desc)}<br><br><b>${esc(t.question)}</b></div>`;
      for(const [label,key,enabled] of variants){
        if(!enabled)continue;
        const raw=(t.codes&&typeof t.codes[key]==='string')?t.codes[key]:'';
        html+=`<div><b>${esc(label)}</b><pre class="print-code">${esc(raw)}</pre></div>`;
      }
      if(opt.ans)html+=`<div class="print-answer"><b>Ответ:</b> ${esc(t.answer)}</div>`;
      if(opt.comment)html+=`<div><b>Мой комментарий:</b><div class="print-comment">${esc(st.comment||'')}</div></div>`;
      return html+'</article>';
    }).join('');
    const w=window.open('','_blank','width=1000,height=800');
    if(!w){alert('Браузер заблокировал окно печати. Разрешите всплывающие окна для этого файла.');return;}
    w.document.open();
    w.document.write(`<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Печать — Задание 25 ЕГЭ по информатике</title><style>
      *{box-sizing:border-box}body{font-family:Arial,sans-serif;color:#111;margin:28px;font-size:14px}.print-task{margin:0 0 26px;padding:0 0 18px;border-bottom:1px solid #ccc;break-inside:avoid}.print-number{font-size:18px;font-weight:800;margin-bottom:10px}.print-condition{margin-bottom:12px;line-height:1.45}.print-code{white-space:pre-wrap;font:11px/1.4 Consolas,monospace;background:#fff;color:#111;border:1px solid #bbb;padding:9px;margin:5px 0 10px}.print-answer,.print-comment{margin-top:8px;white-space:pre-wrap}@media print{body{margin:15mm}.print-task{break-inside:avoid}}


</style></head><body>${parts}</body></html>`);
    w.document.close();
    h.innerHTML='';
    setTimeout(()=>{w.focus();w.print();},250);
  };
}

// Любое изменение текстового поля кода сразу переносится в объект задачи.
function writeCodeEditorToTask(ta){
  if(!(ta instanceof HTMLTextAreaElement)||!ta.matches('#main .task textarea[data-code-method]'))return;
  const method=ta.dataset.codeMethod;
  const id=ta.dataset.taskId||ta.closest('.task[data-id]')?.dataset.id;
  const task=TASKS.find(x=>String(x.id)===String(id));
  if(!task||!CODE_METHODS.includes(method))return;
  if(!task.codes||typeof task.codes!=='object')task.codes={};
  task.codes[method]=String(ta.value??'');
}
document.getElementById('main').addEventListener('input',e=>writeCodeEditorToTask(e.target));
document.getElementById('main').addEventListener('change',e=>writeCodeEditorToTask(e.target));
function collectEditsForExport(){
  // Сначала считываем актуальный код в открытом редакторе.
  // В интерфейсе один редактор, переключаемый между двумя вариантами; оба значения
  // хранятся в TASKS[].codes и не генерируются заново.
  document.querySelectorAll('#main .task[data-id] textarea[data-code-method]').forEach(editor=>{
    const card=editor.closest('.task[data-id]');
    const id=editor.dataset.taskId||card?.dataset.id;
    const task=TASKS.find(x=>String(x.id)===String(id))||TASKS.find(x=>String(x.id)===String(card?.dataset.id));
    const method=editor.dataset.codeMethod;
    if(!task||!CODE_METHODS.includes(method))return;
    if(!task.codes||typeof task.codes!=='object')task.codes={};
    task.codes[method]=String(editor.value??'');
  });

  // Считываем формы редактирования, даже если на кнопке «Сохранить изменения» ещё не нажали.
  document.querySelectorAll('#main .task[data-id]').forEach(card=>{
    const oldId=String(card.dataset.id);
    const task=TASKS.find(x=>String(x.id)===oldId);
    if(!task)return;
    const editForm=card.querySelector('.teacher-edit');
    if(editForm){
      const values={};
      editForm.querySelectorAll('[data-k]').forEach(el=>{values[el.dataset.k]=el.value});
      if(typeof values.title==='string')task.title=values.title;
      if(typeof values.desc==='string')task.desc=values.desc;
      if(typeof values.question==='string')task.question=values.question;
      if(typeof values.answer==='string')task.answer=values.answer;
      const newId=typeof values.id==='string'?values.id.trim():String(task.id);
      if(newId&&newId!==String(task.id)&&!TASKS.some(x=>x!==task&&String(x.id)===newId)){
        for(const sid of Object.keys(state.progressByStudent||{})){
          const progress=state.progressByStudent[sid];
          if(progress&&progress[String(task.id)]){progress[newId]=progress[String(task.id)];delete progress[String(task.id)];}
        }
        task.id=newId;
      }
      const after=typeof values.after==='string'?values.after:'';
      if(after){
        const targetIndex=TASKS.findIndex(x=>String(x.id)===after),currentIndex=TASKS.indexOf(task);
        if(targetIndex>=0&&currentIndex>=0&&targetIndex!==currentIndex){
          TASKS.splice(currentIndex,1);const adjustedTarget=TASKS.findIndex(x=>String(x.id)===after);
          if(adjustedTarget>=0)TASKS.splice(adjustedTarget+1,0,task);else TASKS.push(task);
        }
      }
    }
    const progress=ensure(task.id);
    const flags=[...card.querySelectorAll('.flags .flag')];
    if(flags.length>=3){progress.done=flags[0].classList.contains('on');progress.fav=flags[1].classList.contains('on');progress.dz=flags[2].classList.contains('on');}
    const comment=card.querySelector('.commentbox textarea');
    if(comment)progress.comment=String(comment.value??'');
  });

  // Сохраняем ровно два варианта, не генерируя код поверх пользовательских правок.
  for(const task of TASKS){
    const codes=(task.codes&&typeof task.codes==='object')?task.codes:{};
    task.codes={
      'Без комментариев':String(codes['Без комментариев']??''),
      'С комментариями':String(codes['С комментариями']??'')
    };
    task.methods=CODE_METHODS.slice();
  }
}

document.getElementById('saveApp').onclick=()=>{
  try{
    // Принудительно перенести код из живых редакторов и поля задач в снимок перед сериализацией.
    collectEditsForExport();
    save();

    const clone=document.documentElement.outerHTML;
    const taskPayload=JSON.stringify(TASKS).replace(/</g,'\\u003c');
    const a0=clone.indexOf('const TASKS=');
    const conditionPos=clone.indexOf('let conditionFont=',a0);
    if(!(a0>=0&&conditionPos>a0)){
      alert('Не удалось встроить данные задач в HTML. Файл не скачан — исходные данные сохранены в текущем сеансе.');
      return;
    }
    let outHtml=clone.slice(0,a0)+'const TASKS='+taskPayload+';\n'+clone.slice(conditionPos);

    // Встраиваем список учеников, прогресс, флажки, фильтры, выбор раздела и комментарии.
    const userPayload=JSON.stringify({students:state.students,current:state.current,filtersByStudent:state.filtersByStudent,sectionByStudent:state.sectionByStudent,progressByStudent:state.progressByStudent}).replace(/</g,'\\u003c');
    const stateStart=outHtml.indexOf('const INITIAL_USER_STATE=');
    const stateEnd=outHtml.indexOf('const DEFAULT_USER_STATE=',stateStart);
    if(!(stateStart>=0&&stateEnd>stateStart)){
      alert('Не удалось встроить список учеников и прогресс. Файл не скачан.');
      return;
    }
    outHtml=outHtml.slice(0,stateStart)+'const INITIAL_USER_STATE='+userPayload+';\n'+outHtml.slice(stateEnd);
    // Сохраняем текущий размер условия в самом HTML, а не во внешних настройках.
    outHtml=outHtml.replace(/let conditionFont='(?:small|medium|large)';/,'let conditionFont='+JSON.stringify(conditionFont)+';');

    const doc='<!doctype html>\n'+outHtml;
    const blob=new Blob([doc],{type:'text/html'}),a=document.createElement('a');
    const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z');
    const url=URL.createObjectURL(blob);
    a.href=url;
    a.download='zadanie25_информатика_'+stamp+'.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
  }catch(err){
    console.error('Ошибка сохранения приложения:',err);
    alert('Не удалось сохранить приложение: '+(err&&err.message?err.message:String(err)));
  }
};

  const options=state.students.map(st=>`<option value="${esc(st.id)}" ${st.id===state.current?'selected':''}>${esc(st.name)}</option>`).join('');
  cover.innerHTML=`<div class="startup-card"><h2>Кто сегодня решает задачи?</h2><p>Выберите ученика, чтобы открыть именно его прогресс. Если нужно, сначала добавьте ученика кнопкой «+» в боковом меню.</p><label for="startup-student">Ученик</label><select id="startup-student">${options}</select><div style="display:flex;gap:8px"><button class="btn" id="startup-add" style="flex:1">＋ Добавить ученика</button><button class="btn green" id="startup-go" style="flex:1">Начать работу</button></div></div>`;
  document.body.appendChild(cover);
  cover.querySelector('#startup-add').onclick=()=>{const name=prompt('Имя ученика:');if(!name||!name.trim())return;const id='s'+Date.now();state.students.push({id,name:name.trim()});state.current=id;state.filtersByStudent[id]=normalizeFilters();state.sectionByStudent[id]=null;state.progressByStudent[id]={};save();cover.querySelector('#startup-student').innerHTML=state.students.map(st=>`<option value="${esc(st.id)}" ${st.id===id?'selected':''}>${esc(st.name)}</option>`).join('');refreshStudents()};
  cover.querySelector('#startup-go').onclick=()=>{state.current=cover.querySelector('#startup-student').value;refreshStudents();save();cover.remove();setMode('student');render()};
}
