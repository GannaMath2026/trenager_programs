<h1>Задание 11: счёт количества информации</h1>

<div class="top-bar">

<script>
/* ============================================================
   ВЫЧИСЛИТЕЛЬ (для ручного режима)
   ============================================================ */
function translateToJS(f) {
  return f.replace(/\^/g, '**')
    .replace(/\bceil\b/g, 'Math.ceil')
    .replace(/\bfloor\b/g, 'Math.floor')
    .replace(/\blog2\b/g, 'Math.log2')
    .replace(/\blog10\b/g, 'Math.log10')
    .replace(/\blog\b/g, 'Math.log')
    .replace(/\babs\b/g, 'Math.abs');
}
function evaluateAnswer(raw) {
  let s = String(raw).trim();
  if (!s) return null;
  s = s.replace(/\s*(бит|байт|байтов|символ(ов|а)?|вариант(ов|а)?|штук|пользовател(ей|я)|Кбайт|Мбайт|Гбайт|кб|мб|гб)\s*$/i, '').trim();
  if (/^-?\d+(\.\d+)?$/.test(s)) return parseFloat(s);
  let e = translateToJS(s);
  const cl = e.replace(/Math\.(ceil|floor|log2|log10|log|abs)/g, '');
  if (!/^[0-9+\-*/().\s]+$/.test(cl)) return null;
  try { const r = Function('"use strict"; return (' + e + ')')(); return (typeof r === 'number' && isFinite(r)) ? r : null; }
  catch (err) { return null; }
}
function isExpression(str) {
  str = String(str).trim();
  if (!str) return false;
  if (/^-?\d+(\.\d+)?$/.test(str)) return false;
  return /[+\-*/^()]|ceil|floor|log/i.test(str);
}

/* ============================================================
   ТРАНСЛЯТОР И ЗАПУСК PYTHON-ПОДОБНОГО КОДА
   ============================================================ */
function translatePythonToJS(f) {
  return f.replace(/\^/g, '**')
    .replace(/\bceil\b/g, 'Math.ceil')
    .replace(/\bfloor\b/g, 'Math.floor')
    .replace(/\blog2\b/g, 'Math.log2')
    .replace(/\blog10\b/g, 'Math.log10')
    .replace(/\blog\b/g, 'Math.log')
    .replace(/\babs\b/g, 'Math.abs');
}
function translatePythonOps(s) {
  return s.replace(/\band\b/g, '&&')
    .replace(/\bor\b/g, '||')
    .replace(/\bnot\b/g, '!')
    .replace(/\bTrue\b/g, 'true')
    .replace(/\bFalse\b/g, 'false');
}
function isSafeFormula(s) {
  const cleaned = s.replace(/Math\.(ceil|floor|log2|log10|log|abs)/g, '')
    .replace(/\b(and|or|not|True|False)\b/g, '');
  return /^[0-9+\-*/().\s<>=!x]*$/.test(cleaned);
}
function runFormula(formula, startX, endX) {
  const jsF = translatePythonOps(translatePythonToJS(formula));
  if (!isSafeFormula(jsF)) return { error: 'В формуле есть недопустимые символы' };
  const results = [];
  try {
    const fn = new Function('x', '"use strict"; return (' + jsF + ');');
    for (let x = startX; x <= endX; x++) {
      if (fn(x) === true) results.push(x);
    }
  } catch (e) {
    return { error: e.message };
  }
  return { results };
}

/* ============================================================
   ЗАДАЧИ
   Каждая задача: id, short, context, steps[], code{}
   code: {
     description,
     referenceFormula — эталон для проверки,
     finalAnswer      — что введёт ученик после верного кода,
     finalExplain     — объяснение после верного ответа
   }
   ============================================================ */
const TASKS = [
/* 1. 2047 */
{ id:'2047', short:'2047',
  context:`В базе данных хранятся записи о датах. Каждая запись содержит 3 поля:
• год (1 до 2100),
• номер месяца (1 до 12),
• номер дня в месяце (1 до 31).

Каждое поле записывается отдельно с минимально возможным числом бит.

Определите минимальное количество бит для кодирования одной записи.`,
  steps:[
    { label:'Год (бит)', question:'Сколько бит нужно, чтобы закодировать все возможные годы?', answer:12,
      explanation:'2¹¹=2048 — мало. 2¹²=4096 — хватит. Ответ: 12 бит.', hint:'Год от 1 до 2100 — это 2100 вариантов.' },
    { label:'Месяц (бит)', question:'Сколько бит нужно для кодирования месяца?', answer:4,
      explanation:'2³=8 — мало, 2⁴=16 — хватит. Ответ: 4 бита.', hint:'Месяц от 1 до 12 — 12 вариантов.' },
    { label:'День (бит)', question:'Сколько бит нужно для кодирования дня?', answer:5,
      explanation:'2⁴=16 — мало, 2⁵=32 — хватит. Ответ: 5 бит.', hint:'День от 1 до 31 — 31 вариант.' },
    { label:'Всего (бит)', question:'Сколько ВСЕГО бит нужно для одной записи?', answer:21,
      explanation:'12+4+5 = 21 бит.', hint:'Поля кодируются отдельно. Сложи три значения.' }
  ],
  code: { description:'', referenceFormula:'x<=0', finalAnswer: 0, finalExplain:'' }},

/* 2. 5703 */
{ id:'5703', short:'5703',
  context:`Раз в год наблюдения за солнечной активностью пишутся в базу данных минимальным целым числом байт.

Каждая запись:
• результат измерений из 5 заглавных латинских букв,
• год измерения (2000 до 2099).

Каждый символ кодируется минимально возможным числом бит. Символы, не изменяющиеся в записи года, сохранять не нужно.

Сколько байтов требуется для хранения всех измерений?`,
  steps:[
    { label:'Буква (бит)', question:'Сколько бит нужно для одной заглавной латинской буквы?', answer:5,
      explanation:'2⁴=16 — мало, 2⁵=32 — хватит. Ответ: 5 бит.', hint:'26 заглавных букв.' },
    { label:'Цифра года (бит)', question:'Сколько бит нужно для одной десятичной цифры?', answer:4,
      explanation:'2³=8 — мало, 2⁴=16 — хватит. Ответ: 4 бита.', hint:'10 цифр.' },
    { label:'Символов года', question:'Сколько символов года нужно сохранять?', answer:2,
      explanation:'Первые "20" не меняются. Меняются только 2 последние цифры.', hint:'2000...2099 — что всегда одинаковое?' },
    { label:'Запись (бит)', question:'Сколько всего бит занимает одна запись?', answer:33,
      explanation:'5·5 + 2·4 = 25+8 = 33 бита.', hint:'5 букв по 5 бит + 2 цифры по 4 бита.' },
    { label:'Запись (байт)', question:'Сколько байт занимает одна запись (округление вверх)?', answer:5,
      explanation:'33/8 = 4.125 → 5 байт.', hint:'Деление на 8 с округлением вверх.' },
    { label:'Записей', question:'Сколько всего записей в базе?', answer:100,
      explanation:'С 2000 по 2099 включительно — 100 лет.', hint:'2099−2000+1 = ?' },
    { label:'Всего (байт)', question:'Сколько всего байт для хранения всех измерений?', answer:500,
      explanation:'100 · 5 = 500 байт.', hint:'Умножь число записей на объём одной.' }
  ],
  code: { description:'', referenceFormula:'x<=0', finalAnswer: 0, finalExplain:'' }},

/* 3. 2046 */

/* ============================================================
   СОСТОЯНИЕ
   ============================================================ */
let currentTaskIndex = 0;
let currentStepIndex = 0;
let solvedSteps = [];
let taskSolved = new Array(TASKS.length).fill(false);
let mode = 'manual';   // 'manual' | 'code'
let advanceTimer = null;
let nextTaskTimer = null;

const taskStrip = document.getElementById('taskStrip');
const stepContainer = document.getElementById('stepContainer');
const progressBar = document.getElementById('progress');
const counter = document.getElementById('counter');
const thermoFill = document.getElementById('thermoFill');
const thermoPercent = document.getElementById('thermoPercent');
const summary = document.getElementById('summary');
const summaryText = document.getElementById('summaryText');
const nextHint = document.getElementById('nextHint');

/* ============================================================
   ВЕРХНЯЯ ПОЛОСА + СКРОЛЛ
   ============================================================ */
function renderStrip() {
  taskStrip.innerHTML = '';
  TASKS.forEach((t, i) => {
    const tile = document.createElement('div');
    tile.className = 'task-tile';
    if (i === currentTaskIndex) tile.classList.add('current');
    if (taskSolved[i]) tile.classList.add('done');
    tile.textContent = t.short;
    tile.addEventListener('click', () => {
      currentTaskIndex = i;
      currentStepIndex = 0;
      solvedSteps = [];
      loadTask();
    });
    taskStrip.appendChild(tile);
  });
  const cur = taskStrip.querySelector('.current');
  if (cur) cur.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
}
let isDragging = false, dragStartX = 0, scrollStartLeft = 0;
taskStrip.addEventListener('mousedown', e => {
  isDragging = true; taskStrip.classList.add('grabbing');
  dragStartX = e.pageX; scrollStartLeft = taskStrip.scrollLeft;
});
document.addEventListener('mousemove', e => {
  if (!isDragging) return;
  taskStrip.scrollLeft = scrollStartLeft - (e.pageX - dragStartX);
});
document.addEventListener('mouseup', () => {
  isDragging = false; taskStrip.classList.remove('grabbing');
});
taskStrip.addEventListener('wheel', e => {
  if (e.deltaY !== 0) { e.preventDefault(); taskStrip.scrollLeft += e.deltaY; }
}, { passive: false });

function updateStats() {
  const solvedCount = taskSolved.filter(Boolean).length;
  const total = TASKS.length;
  const pct = Math.round((solvedCount / total) * 100);
  counter.innerHTML = `Решено <b>${solvedCount}</b> из ${total} · <b>${pct}%</b>`;
  progressBar.style.width = pct + '%';
  thermoFill.style.height = pct + '%';
  thermoPercent.textContent = pct + '%';
}

/* ============================================================
   ЗАГРУЗКА
   ============================================================ */
function loadTask() {
  if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
  if (nextTaskTimer) { clearTimeout(nextTaskTimer); nextTaskTimer = null; }
  summary.classList.remove('show');
  renderStrip();
  renderModeBar();
  renderBody();
  updateStats();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderModeBar() {
  const task = TASKS[currentTaskIndex];
  const bar = document.createElement('div');
  bar.className = 'mode-bar';
  bar.innerHTML = `
    <button class="btn btn-mode ${mode==='manual'?'active':''}" id="mbManual">📝 Вручную</button>
    <button class="btn btn-mode ${mode==='code'?'active':''}" id="mbCode" ${task.code.referenceFormula==='x<=0' ? 'disabled style="opacity:.4;cursor:not-allowed" title="Для этой задачи код не подготовлен"' : ''}>💻 Кодом</button>
  `;
  // Вставляем полосу над step-container
  const old = document.querySelector('.mode-bar');
  if (old) old.remove();
  stepContainer.parentNode.insertBefore(bar, stepContainer);
  document.getElementById('mbManual').addEventListener('click', () => {
    mode='manual'; renderModeBar(); renderBody();
  });
  document.getElementById('mbCode') && document.getElementById('mbCode').addEventListener('click', () => {
    if (task.code.referenceFormula==='x<=0') return;
    mode='code'; renderModeBar(); renderBody();
  });
}

function renderBody() {
  if (mode === 'code' && TASKS[currentTaskIndex].code.referenceFormula !== 'x<=0') {
    renderCodeMode();
  } else {
    renderCurrentStep();
  }
}

/* ============================================================
   КОД-РЕЖИМ
   ============================================================ */
function renderCodeMode() {
  if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
  const task = TASKS[currentTaskIndex];
  const tpl = task.code;

  stepContainer.innerHTML = `
    <div class="step-card" id="card">
      <div class="step-header">
        <span class="step-num">💻</span>
        <span class="step-title">Решение через код · № ${task.id}</span>
      </div>

      <div class="step-context"><span class="label">Условие задачи</span>${task.context}</div>

      <div class="code-block">
<span class="kw">from</span> math <span class="kw">import</span> *
<span class="kw">for</span> x <span class="kw">in</span> <span class="fn">range</span>(<input class="code-box" id="bStart" placeholder="?">, <input class="code-box" id="bEnd" placeholder="?">):
    <span class="kw">if</span> <input class="code-box-wide" id="bIf" placeholder="вставь условие">:
        <span class="fn">print</span>(x)
      </div>

      <div class="input-row">
        <button class="btn btn-check" id="btnCheckCode">Запустить код</button>
        <span class="status-msg" id="statusCode"></span>
      </div>

      <div class="code-result" id="codeResult">
        <span class="lbl">✅ Код верен. Вывод:</span>
        <div class="out" id="codeOutput"></div>
      </div>

      <div id="finalBlock" style="display:none">
        <div class="explain-box show" style="margin-top:14px">
          <span class="lbl">Введи итоговый ответ.</span>
        </div>
        <div class="input-row" style="margin-top:10px">
          <input type="text" id="inputFinal" placeholder="Ответ">
          <button class="btn btn-check" id="btnCheckFinal">Проверить</button>
          <span class="status-msg" id="statusFinal"></span>
        </div>
      </div>

      <div class="final-confirm" id="finalConfirm">🎉 Верно! Переходим к следующей…</div>
    </div>
  `;

  const bStart = document.getElementById('bStart');
  const bEnd = document.getElementById('bEnd');
  const bIf = document.getElementById('bIf');
  const btnCheckCode = document.getElementById('btnCheckCode');
  const statusCode = document.getElementById('statusCode');
  const codeResult = document.getElementById('codeResult');
  const codeOutput = document.getElementById('codeOutput');
  const finalBlock = document.getElementById('finalBlock');
  const inputFinal = document.getElementById('inputFinal');
  const btnCheckFinal = document.getElementById('btnCheckFinal');
  const statusFinal = document.getElementById('statusFinal');
  const finalConfirm = document.getElementById('finalConfirm');

  const ref = runFormula(tpl.referenceFormula, 0, 10000).results || [];
  const refMin = ref.length ? ref[0] : 0;
  const refMax = ref.length ? ref[ref.length - 1] : 0;

  btnCheckCode.addEventListener('click', () => {
    const s = parseInt(bStart.value, 10);
    const e = parseInt(bEnd.value, 10);

    const sOK = !isNaN(s) && s <= refMin;
    const eOK = !isNaN(e) && e >= refMax;
    bStart.classList.toggle('correct', sOK); bStart.classList.toggle('wrong', !sOK);
    bEnd.classList.toggle('correct', eOK);   bEnd.classList.toggle('wrong', !eOK);

    if (!sOK || !eOK) {
      statusCode.textContent = '✗ Проверь границы range';
      statusCode.className = 'status-msg err';
      codeResult.classList.remove('show');
      return;
    }
    const f = bIf.value.trim();
    if (!f) {
      bIf.classList.add('wrong'); bIf.classList.remove('correct');
      statusCode.textContent = '✗ Формула пустая';
      statusCode.className = 'status-msg err';
      codeResult.classList.remove('show');
      return;
    }
    const user = runFormula(f, s, e);
    if (user.error) {
      bIf.classList.add('wrong'); bIf.classList.remove('correct');
      statusCode.textContent = '✗ Синтаксическая ошибка: ' + user.error;
      statusCode.className = 'status-msg err';
      codeResult.classList.remove('show');
      return;
    }
    const match = user.results.length === ref.length
              && user.results.every((v, i) => v === ref[i]);
    if (match) {
      bIf.classList.add('correct'); bIf.classList.remove('wrong');
      statusCode.textContent = '';
      statusCode.className = 'status-msg';
      const out = user.results.length <= 60
        ? user.results.join(', ')
        : user.results.slice(0, 40).join(', ') + ', … , ' + user.results[user.results.length - 1] + ' (всего ' + user.results.length + ')';
      codeOutput.textContent = out;
      codeResult.classList.add('show');
      finalBlock.style.display = 'block';
      inputFinal.focus();
    } else {
      bIf.classList.add('wrong'); bIf.classList.remove('correct');
      statusCode.textContent = '✗ Код неверный';
      statusCode.className = 'status-msg err';
      codeResult.classList.remove('show');
    }
  });

  btnCheckFinal.addEventListener('click', () => {
    const val = evaluateAnswer(inputFinal.value);
    if (val === null) {
      statusFinal.textContent = 'Не могу распознать';
      statusFinal.className = 'status-msg err';
      return;
    }
    if (Math.abs(val - tpl.finalAnswer) < 1e-9) {
      inputFinal.classList.add('correct'); inputFinal.classList.remove('wrong');
      statusFinal.textContent = '✔ Верно';
      statusFinal.className = 'status-msg ok';
      btnCheckFinal.disabled = true;
      inputFinal.disabled = true;
      finalConfirm.classList.add('show');

      taskSolved[currentTaskIndex] = true;
      updateStats();
      renderStrip();

      setTimeout(() => {
        if (currentTaskIndex < TASKS.length - 1) {
          currentTaskIndex++;
          currentStepIndex = 0;
          solvedSteps = [];
          mode = 'manual';
          loadTask();
        }
      }, 1500);
    } else {
      inputFinal.classList.add('wrong'); inputFinal.classList.remove('correct');
      statusFinal.textContent = '✗ Неверно';
      statusFinal.className = 'status-msg err';
    }
  });

  inputFinal.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !btnCheckFinal.disabled) btnCheckFinal.click();
  });
}

/* ============================================================
   РУЧНОЙ РЕЖИМ
   ============================================================ */
function renderCurrentStep() {
  if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
  const task = TASKS[currentTaskIndex];
  const total = task.steps.length;

  if (currentStepIndex >= total) {
    taskSolved[currentTaskIndex] = true;
    renderStrip();
    updateStats();
    showSummary();
    return;
  }

  const step = task.steps[currentStepIndex];

  let accumHTML = '';
  if (solvedSteps.length > 0) {
    const chips = solvedSteps.map(s =>
      `<span class="chip">${s.label}: <b>${s.answer}</b></span>`
    ).join('');
    accumHTML = `<div class="step-accum"><span class="label">Получено ранее</span>${chips}</div>`;
  }

  stepContainer.innerHTML = `
    <div class="step-card" id="currentCard">
      <div class="step-header">
        <span class="step-num">${currentStepIndex + 1}</span>
        <span class="step-title">Шаг ${currentStepIndex + 1} из ${total} · № ${task.id}</span>
      </div>
      <div class="step-context"><span class="label">Условие задачи</span>${task.context}</div>
      ${accumHTML}
      <div class="step-question"><span class="label">Вопрос</span>${step.question}</div>
      <div class="input-row">
        <input type="text" id="inputStep" placeholder="Введите число или формулу">
      </div>
      <div class="formula-help">
        Можно ввести: число (<b>12</b>), формулу (<b>ceil(log2(2100))</b>), арифметику (<b>5*3+3*4</b>) или степень (<b>2^10</b>).
      </div>
      <div class="input-row">
        <button class="btn btn-check" id="checkStep">Проверить</button>
        <button class="btn btn-hint" id="hintStep">Подсказка</button>
        <span class="status-msg" id="statusStep"></span>
      </div>
      <div class="hint-box" id="hintBox"><span class="lbl">💡 Подсказка</span>${step.hint}</div>
      <div class="explain-box" id="explainBox"><span class="lbl">✅ Верно!</span>${step.explanation}</div>
    </div>
  `;

  const input = document.getElementById('inputStep');
  const checkBtn = document.getElementById('checkStep');
  const hintBtn = document.getElementById('hintStep');
  const statusEl = document.getElementById('statusStep');
  const hintBox = document.getElementById('hintBox');
  const explainBox = document.getElementById('explainBox');

  checkBtn.addEventListener('click', () => {
    const val = evaluateAnswer(input.value);
    if (val === null) {
      statusEl.textContent = 'Не могу распознать';
      statusEl.className = 'status-msg err';
      return;
    }
    if (Math.abs(val - step.answer) < 1e-9) {
      input.classList.add('correct'); input.classList.remove('wrong');
      statusEl.textContent = '✔ Верно';
      statusEl.className = 'status-msg ok';
      explainBox.classList.add('show');
      hintBox.classList.remove('show');
      checkBtn.disabled = true;
      input.disabled = true;
      solvedSteps.push({ label: step.label, answer: step.answer });

      advanceTimer = setTimeout(() => {
        const card = document.getElementById('currentCard');
        if (card) card.classList.add('fade');
        setTimeout(() => {
          currentStepIndex++;
          renderCurrentStep();
        }, 150);
      }, 400);
    } else {
      input.classList.add('wrong'); input.classList.remove('correct');
      statusEl.textContent = '✗ Неверно';
      statusEl.className = 'status-msg err';
    }
  });

  hintBtn.addEventListener('click', () => hintBox.classList.toggle('show'));
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !checkBtn.disabled) checkBtn.click();
  });
  input.focus();
}

/* ============================================================
   ИТОГ ЗАДАЧИ
   ============================================================ */
function showSummary() {
  const task = TASKS[currentTaskIndex];
  const last = task.steps[task.steps.length - 1].answer;
  let html = `<b>Итог: ${last}</b><br><br>Как получили — по шагам:<br>`;
  task.steps.forEach((s, i) => { html += `${i + 1}. ${s.label} → <b>${s.answer}</b><br>`; });
  summaryText.innerHTML = html;

  const isLast = currentTaskIndex === TASKS.length - 1;
  nextHint.innerHTML = isLast ? '🎉 Последняя задача.' : '➡️ Открывается следующая задача…';
  summary.classList.add('show');
  stepContainer.innerHTML = '';
  summary.scrollIntoView({ behavior: 'smooth', block: 'center' });

  if (!isLast) {
    nextTaskTimer = setTimeout(() => {
      currentTaskIndex++;
      currentStepIndex = 0;
      solvedSteps = [];
      mode = 'manual';
      loadTask();
    }, 1500);
  }
}

/* ============================================================
   НИЖНИЕ КНОПКИ
   ============================================================ */
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const btnTop = document.getElementById('btnTop');
const btnReset = document.getElementById('btnReset');

btnPrev.addEventListener('click', () => {
  if (currentTaskIndex > 0) {
    currentTaskIndex--; currentStepIndex = 0; solvedSteps = []; mode = 'manual'; loadTask();
  }
});
btnNext.addEventListener('click', () => {
  if (currentTaskIndex < TASKS.length - 1) {
    currentTaskIndex++; currentStepIndex = 0; solvedSteps = []; mode = 'manual'; loadTask();
  }
});
btnTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
btnReset.addEventListener('click', () => {
  taskSolved = new Array(TASKS.length).fill(false);
  currentTaskIndex = 0; currentStepIndex = 0; solvedSteps = []; mode = 'manual';
  loadTask();
});

/* ============ СТАРТ ============ */
loadTask();
</script>
</body>
</html>
