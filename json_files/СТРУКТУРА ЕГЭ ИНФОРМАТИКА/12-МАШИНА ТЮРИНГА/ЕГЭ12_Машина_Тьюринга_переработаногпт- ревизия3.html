function programOf(t){let p=t,guard=0;while(p&&!p.prog&&p.proto&&guard++<20)p=BY[p.proto];return p&&p.prog||'';}
function hintOf(t){let p=t,guard=0;while(p&&!(p.hint)&&p.proto&&guard++<20)p=BY[p.proto];return p&&p.hint||'';}

for(const st of Object.values(DB.students||{})){for(const key of ['p','tasks','tests'])if(st[key])for(const rid of REMOVED_TASK_IDS)delete st[key][rid];if(Array.isArray(st.hw)){st.hw.forEach(h=>{if(Array.isArray(h.ids))h.ids=h.ids.filter(i=>!REMOVED_TASK_IDS.has(+i));});st.hw=st.hw.filter(h=>!Array.isArray(h.ids)||h.ids.length);}}

const SOURCE_TASKS = {"31509":{"fullCondition":"Исполнитель МТ представляет собой читающую и записывающую головку, которая может передвигаться вдоль бесконечной горизонтальной ленты, разделённой на равные ячейки. В каждой ячейке находится ровно один символ из алфавита исполнителя (множество символов A={a0,a1,…,an–1}A={a0​,a1​,…,an–1​}), включая специальный пустой символ a0a0​.\nВремя работы исполнителя делится на дискретные такты (шаги). На каждом такте головка МТ находится в одном из множества допустимых состояний Q={q0,q1,…,qn–1}Q={q0​,q1​,…,qn–1​}. В начальный момент времени головка находится в начальном состоянии q0q0​.\nНа каждом такте головка обозревает одну ячейку ленты, называемую текущей ячейкой. За один такт головка исполнителя может переместиться в ячейку справа или слева от текущей, не меняя находящийся в ней символ, или заменить символ в текущей ячейке без сдвига в соседнюю ячейку. После каждого такта головка переходит в новое состояние или остаётся в прежнем состоянии.\nПрограмма работы исполнителя МТ задаётся в табличном виде.\nВ первой строке перечислены все возможные символы в текущей ячейке ленты, в первом столбце – возможные состояния головки. На пересечении i-й строки и j-го столбца находится команда, которую выполняет МТ, когда головка обозревает j-й символ, находясь в i-м состоянии. Если пара «символ – состояние» невозможна, то клетка для команды остаётся пустой.\nКаждая команда состоит из трёх элементов, разделённых запятыми: первый элемент – записываемый в текущую ячейку символ алфавита (может совпадать с тем, который там уже записан). Второй элемент – один из четырёх символов «L», «R», «N», «S». Символы «L» и «R» означают сдвиг в левую или правую ячейки соответственно, «N» – отсутствие сдвига, «S» – завершение работы исполнителя МТ после выполнения текущей команды. Сдвиг происходит после записи символа в текущую ячейку. Третий элемент – новое состояние головки после выполнения команды.\nНапример, команда 0, L, q3 выполняется следующим образом: в текущую ячейку записывается символ «0», затем головка сдвигается в соседнюю слева ячейку и переходит в состояние q3.\nВыполните задание.\nНа ленте в соседних ячейках записано двоичное представление числа 2025 без ведущих нулей. Ячейки справа и слева от последовательности заполнены пустыми символами «λ». В начальный момент времени головка расположена в ближайшей справа к последовательности ячейке.\nПрограмма работы исполнителя:\nОпределите результат выполнения программы. В ответе запишите получившееся число в десятичной системе счисления.","sourceData":"На ленте в соседних ячейках записано двоичное представление числа 2025 без ведущих нулей. Ячейки справа и слева от последовательности заполнены пустыми символами «λ». В начальный момент времени головка расположена в ближайшей справа к последовательности ячейке.","sourceQuestion":"Определите результат выполнения программы. В ответе запишите получившееся число в десятичной системе счисления."},"31424":{"fullCondition":"(А. Шуруха) Исполнитель МТ представляет собой читающую и записывающую головку, которая может передвигаться вдоль бесконечной горизонтальной ленты, разделённой на равные ячейки. В каждой ячейке находится ровно один символ из алфавита исполнителя (множество символов A={a0,a1,…,an–1}A={a0​,a1​,…,an–1​}), включая специальный пустой символ a0a0​.\nВремя работы исполнителя делится на дискретные такты (шаги). На каждом такте головка МТ находится в одном из множества допустимых состояний Q={q0,q1,…,qn–1}Q={q0​,q1​,…,qn–1​}. В начальный момент времени головка находится в начальном состоянии q0q0​.\nНа каждом такте головка обозревает одну ячейку ленты, называемую текущей ячейкой. За один такт головка исполнителя может переместиться в ячейку справа или слева от текущей, не меняя находящийся в ней символ, или заменить символ в текущей ячейке без сдвига в соседнюю ячейку. После каждого такта головка переходит в новое состояние или остаётся в прежнем состоянии.\nПрограмма работы исполнителя МТ задаётся в табличном стояние головки после выполнения команды.\nНапример, команда 0, L, q3 выполняется следующим образом: в текущую ячейку записывается символ «0», затем головка сдвигается в соседнюю слева ячейку и переходит в состояние q3.\nВыполните задание.\nНа ленте исполнителя МТ в соседних ячейках записано двоичное представление целого положительного числа без ведущих нулей. Ячейки справа и слева от последовательности заполнены пустыми символами «λ». В начальный момент времени головка расположена в ближайшей слева от последовательности ячейке.\nПрограмма работы исполнителя:\nПосле выполнения программы на ленте оказалось двоичная запись числа 794. Определите минимальное десятичное значение числа, которое могло быть записано на ленте до начала работы программы.","sourceData":"На ленте исполнителя МТ в соседних ячейках записано двоичное представление целого положительного числа без ведущих нулей. Ячейки справа и слева от последовательности заполнены пустыми символами «λ». В начальный момент времени головка расположена в ближайшей слева от последовательности ячейке.","sourceQuestion":"После выполнения программы на ленте оказалось двоичная запись числа 794. Определите минимальное десятичное значение числа, которое могло быть записано на ленте до начала работы программы."},"25606":{"fullCondition":"Исполнитель МТ представляет собой читающую и записывающую головку, которая может передвигаться вдоль бесконечной горизонтальной ленты, разделённой на равные ячейки. В каждой ячейке находится ровно один символ из алфавита исполнителя (множество символов A={a0,a1,…,an–1}A={a0​,a1​,…,an–1​}), включая специальный пустой символ a0a0​.\nВремя работы исполнителя делится на дискретные такты (шаги). На каждом такте головка МТ находится в одном из множества допустимых состояний Q={q0,q1,…,qn–1}Q={q0​,q1​,…,qn–1​}. В начальный момент времени головка находится в начальном состоянии q0q0​.\nНа каждом такте головка обозревает одну ячейку ленты, называемую текущей ячейкой. За один такт головка исполнителя м ьности заполнены пустыми символами «λ». В начальный момент времени головка расположена в самой левой ячейке последовательности (в ячейке с самым левым символом 0). Программа для исполнителя:\nОпределите сумму чисел во всех заполненных ячейках после выполнения программы.","sourceData":"На ленте исполнителя МТ в соседних ячейках записана последовательность из 500 пар символов 0 и 1: 0101…01. Ячейки справа и слева от последовательности заполнены пустыми символами «λ». В начальный момент времени головка расположена в самой левой ячейке последовательности (в ячейке с самым левым символом 0).","sourceQuestion":"Определите сумму чисел во всех заполненных ячейках после выполнения программы."},"24553":{"fullCondition":"(Иглин К.) Исполнитель МТ представляет собой читающую и записывающую головку, которая может передвигаться вдоль бесконечной горизонтальной ленты, разделённой на равные ячейки. В каждой ячейке находится ровно один символ из алфавита исполнителя (множество символов A={a0,a1,…,an–1}), включая специальный пустой символ a0​.\nВремя работы исполнителя делится на дискретные такты (шаги). На каждом такте головка МТ находится в одном из множества допустимых состояний Q={q0,q1,…,qn–1}). В начальный момент времени головка находится в начальном состоянии q0​.\nНа каждом такте головка обозревает одну ячейку ленты, называемую текущей ячейкой. За один такт головка исполнителя может переместиться в ячейку справа или слева от текущей, не меняя находящийся в ней символ, или заменить символ в текущей ячейке без сдвига в соседнюю ячейку. После каждого такта головка переходит в новое состояние или остаётся в прежнем состоянии.\nПрограмма работы исполнителя МТ задаётся в табличном виде.\nВ первой строке перечислены все возможные символы в текущей ячейке ленты, в первом столбце – возможные состояния головки. На пересечении i-й строки и j-го столбца находится команда, которую выполняет МТ, когда головка обозревает j-й символ, находясь в i-м состоянии. Если пара «символ – состояние» н ах записана последовательность из 1000 символов, включающая только нули, единицы и двойки. Ячейки справа и слева от последовательности заполнены пустыми символами «λ». В начальный момент времени головка расположена в ближайшей ячейке слева от последовательности. Программа для исполнителя:\nИзвестно, что количество символов 0 и 1 в исходной строке было одинаково, а сумма значений в исходной строке больше суммы значений в конечной строке на 200. Какое количество цифр 2 было в исходной строке?","sourceData":"На ленте исполнителя МТ в соседних ячейках записана последовательность из 1000 символов, включающая только нули, единицы и двойки. Ячейки справа и слева от последовательности заполнены пустыми символами «λ». В начальный момент времени головка расположена в ближайшей ячейке слева от последовательности.","sourceQuestion":"Известно, что количество символов 0 и 1 в исходной строке было одинаково, а сумма значений в исходной строке больше суммы значений в конечной строке на 200. Какое количество цифр 2 было в исходной строке?"},"23858":{"fullCondition":"(Е. Джобс) Исполнитель МТ представляет собой читающую и записывающую головку, которая может передвигаться вдоль бесконечной горизонтальной ленты, разделённой на равные ячейки. В каждой ячейке находится ровно один символ из алфавита исполнителя (множество символов A={a0,a1,…,an–1}A={a0​,a1​,…,an–1​}), включая специальный пустой символ a0a0​.\nВремя работы исполнителя делится на дискретные такты (шаги). На каждом такте головка МТ находится в одном из множества допустимых состояний Q={q0,q1,…,qn–1}Q={q0​,q1​,…,qn–1​}. В начальный момент времени головка находится в начальном состоянии q0q0​.\nНа каждом такте головка обозревает одну ячейку ленты, называемую текущей ячейкой. За один такт головка исполнителя может переместиться в ячейку справа или слева от текущей, не меняя находящийся в ней символ, или заменить символ в текущей ячейке без сдвига в соседнюю ячейку. После каждого такта головка переходит в новое состояние или ост const NORM=c=>/^(λ|Λ|ʎ|_|пусто)$/i.test(c)?'λ':c;
function parseProg(txt){try{const lines=String(txt||'').split('\n').map(l=>l.trim()).filter(Boolean);if(!lines.length)return{ok:false,err:'Программа пуста'};
 const cells=l=>{let s=l;if(s[0]==='|')s=s.slice(1);if(s.endsWith('|'))s=s.slice(0,-1);return s.split(/\||\t/).map(x=>x.trim());};
 const alpha=cells(lines[0]).filter(x=>x!=='').map(NORM);if(!alpha.length)return{ok:false,err:'Нет первой строки с алфавитом (| | λ | 0 | 1)'};
 const Pg={},states=[];
 for(const l of lines.slice(1)){const c=cells(l),q=c[0];if(!q)continue;states.push(q);Pg[q]={};
  alpha.forEach((a,j)=>{const raw=(c[j+1]||'').trim();if(!raw)return;const m=raw.split(/[\s,]+/).filter(Boolean);
   if(m.length!==3||!/^[LRNS]$/i.test(m[1]))throw new Error(`Не разобрана команда «${raw}» (состояние ${q}, символ ${a}). Нужно: символ, L/R/N/S, состояние`);
   Pg[q][a]={w:NORM(m[0]),m:m[1].toUpperCase(),q:m[2]};});}
 if(!states.length)return{ok:false,err:'Нет строк состояний'};
 return{ok:true,alpha,states,P:Pg,q0:Pg.q0?'q0':states[0]};}catch(e){return{ok:false,err:e.message};}}
function simulate(PP,str,start,max=200000){const ch=[...str],n=ch.length,init=new Map();ch.forEach((c,i)=>{if(c!=='λ')init.set(i,c);});
 const tape=new Map(init);let pos=start==='L'?-1:start==='F'?0:n,q=PP.q0;const tr=[];let status='limit',err='';
 for(let k=0;k<max;k++){const r=tape.get(pos)??'λ',cmd=(PP.P[q]||{})[r];
  if(!cmd){status='nocmd';err=`нет команды для (${q}, ${r})`;break;}
  const npos=pos+(cmd.m==='L'?-1:cmd.m==='R'?1:0);tr.push({q,pos,r,w:cmd.w,m:cmd.m,nq:cmd.q,npos});
  if(cmd.w==='λ')tape.delete(pos);else tape.set(pos,cmd.w);pos=npos;q=cmd.q;if(cmd.m==='S'){status='halt';break;}}
 return{tr,status,err,n,init,p0:start==='L'?-1:start==='F'?0:n,final:tape};}
function tapeStr(m){const ks=[...m.keys()].sort((a,b)=>a-b);if(!ks.length)return'';let s='';for(let i=ks[0];i<=ks[ks.length-1];i++)s+=m.get(i)??'λ';return s;}
function fromBase(s,b){if(!s||/λ/.test(s))return null;let v=0n;const B=BigInt(b);for(const c of s){const d=parseInt(c,36);if(isNaN(d)||d>=b)return null;v=v*B+BigInt(d);}return v;}
function taskTape(t){if(t.id===25015){if(!RANDOM_TAPES[t.id]){const n=8+Math.floor(Math.random()*5);RANDOM_TAPES[t.id]='1'+Array.from({length:n-1},()=>Math.random()<.5?'0':'1').join('');}return{s:RANDOM_TAPES[t.id],test:true};}if(t.N!=null)return{s:BigInt(t.N).toString(t.b||2),test:false};if(t.gen)return{s:t.gen(),test:false};
 if(t.comp)return{s:t.comp.map(([c,k])=>c.repeat(k)).join(''),test:false};
 if(t.sec==='B')return{s:'1011010',test:true};
 if(t.tst)return{s:t.tst,test:true};
 const pp=parseProg(programOf(t)),al=(pp.ok?pp.alpha:['0','1']).filter(a=>a!=='λ');return{s:Array.from({length:8},(_,i)=>al[(i*3+1)%al.length]).join(''),test:true};}
function autoAns(t){const pr=programOf(t);if(!t.auto||!pr)return null;const pp=parseProg(pr);if(!pp.ok)return null;const tp=taskTape(t);if(tp.test)return null;
 const r=simulate(pp,tp.s,t.st);if(r.status!=='halt')return null;const s=tapeStr(r.final);
 if(t.auto==='dec'){const v=fromBase(s,t.b||2);return v==null?null:String(v);}
 if(t.auto==='sum')return String([...s].reduce((a,c)=>a+(/\d/.test(c)?+c:0),0));return null;}

function codeParts(t,progText,tape,start,test,base){
 const pp=parseProg(progText),L=[];let rules='rules = {\n';
 if(pp.ok){pp.states.forEach(q=>pp.alpha.forEach(a=>{const c=pp.P[q][a];if(c)rules+=`    ('${q}', '${a}'): ('${c.w}', '${c.m}', '${c.q}'),\n`;}));rules+='}';}
 else rules+="    # ('q0', 'λ'): ('λ', 'L', 'q1'),  # добавьте команды из таблицы\n}";
 let input;
 if(t.N!=null){const b=t.b||2;input=`'${BigInt(t.N).toString(b)}'`;}
 else if(t.comp&&!test){input=t.comp.map(([c,k])=>`'${c}' * ${k}`).join(' + ');}
 else if(t.gen){input=`'01' * 500`;}
 else{input=`'${String(tape||'1011010').replace(/'/g,"\\'")}'`;}
 const head=start==='L'?'10 - 1':start==='F'?'10':'10 + len(s)';
 const code=`# Исходная строка из условия / пример для анализа
s = ${input}
ss = list('λ' * 10 + s + 'λ' * 10)
print('Лента ДО:', ss)

# Положение головки: L — слева, R — справа, F — на первом символе
 i = ${head}
state = 'q0'
${rules}
kol = 0
while kol < 1000000:
    sym = ss[i]
    if (state, sym) not in rules:
        break
    new_sym, move, new_state = rules[(state, sym)]
    ss[i] = new_sym
    if move == 'S':

        kol += 1

    if move == 'L':

    elif move == 'R':

    state = new_state
    kol += 1
rez = ''.join(ss).strip('λ')
print('Лента ПОСЛЕ:', rez)
print('Сумма цифр:', sum(int(c) for c in rez if c.isdigit()))
print('Шагов:', kol)`;
 const fixed=code.replace(/^ i =/m,'i =');

/* Наблюдения строятся по фактическим командам программы, а не как общие советы. */
function insightObservation(t){
 const raw=hintOf(t);let summary='';
 if(raw){summary=raw.replace(/<sup>(.*?)<\/sup>/gi,'^{ $1 }').replace(/<sub>(.*?)<\/sub>/gi,'_{ $1 }').replace(/<\/?(?:b|strong|i|em)[^>]*>/gi,'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
   summary=summary.replace(/(?:Идите|Составьте|Разберите|Обратите|Отметьте|Найдите|Проследите|Проверьте|Посчитайте|Сверьте|Определите)\b[^.!?]*[.!?]?/gi,'').trim();summary=summary.replace(/\b([a-zA-Z]\s*[+−-]\s*[a-zA-Z]\s*=\s*\d+)\b/g,'\\($1\\)').replace(/2\^\{\s*([^}]+?)\s*\}\s*\+\s*N/g,'\\(2^{$1}+N\\)');}
 const pp=parseProg(programOf(t));const observations=[];
 if(pp.ok){const changes={};for(const q of pp.states)for(const a of pp.alpha){const c=pp.P[q][a];if(c&&a!=='λ'&&c.w!==a)(changes[a]??=new Set()).add(c.w);}
  const mapText=Object.entries(changes).map(([a,vals])=>a+'→'+[...vals].join('/'));if(mapText.length)observations.push('Замены символов: '+mapText.join(', ')+'.');
  const q0=pp.P[pp.q0]||{},first=q0['λ'];if(first&&first.w!=='λ'&&['L','R'].includes(first.m))observations.push(first.m==='L'?'На пустой клетке слева записывается новый символ — появляется префикс.':'На пустой клетке справа записывается новый символ — появляется суффикс.');
 }
 let html='<div class="insight-observation">';
 if(summary)html+='<p><b>Что происходит:</b> '+summary+'</p>';
 if(observations.length)html+='<p><b>Наблюдение по таблице:</b> '+observations.join(' ')+'</p>';
 if(!summary&&!observations.length)html+='<p>Сравни исходную и конечную ленту: какие символы заменились, добавились ли клетки слева или справа.</p>';
 const q=cleanSourceText(t.sourceQuestion||t.q||'');
 if(/единиц.*больше|нулей.*больше|одинаков|сумм|разниц|на .* больше|в .* раза/i.test(q))html+='<p><b>Как подойти:</b> обозначь количества символов буквами. Если всего N символов, x единиц и y нулей, запиши первое равенство: \\(x+y=N\\). Второе равенство составь по связи между количествами символов после выполнения программы.</p>';
 html+='</div>';return html;
}

 else if(V.tab==='whole'){const res=tapeStr(sim.final),ok=sim.status==='halt',dec=fromBase(res,V.base),startDec=fromBase(V.tape,V.base),zeros=[...res].filter(c=>c==='0').length,ones=[...res].filter(c=>c==='1').length;const changed=[];const keys=new Set([...sim.init.keys(),...sim.final.keys()]);for(const k of keys)if((sim.init.get(k)??'λ')!==(sim.final.get(k)??'λ'))changed.push({k,a:sim.init.get(k)??'λ',b:sim.final.get(k)??'λ'});const pre=changed.filter(x=>x.k<0&&x.a==='λ'&&x.b!=='λ').sort((a,b)=>a.k-b.k).map(x=>x.b).join(''),suf=changed.filter(x=>x.k>=V.tape.length&&x.a==='λ'&&x.b!=='λ').sort((a,b)=>a.k-b.k).map(x=>x.b).join('');let desc=changed.length?'Изменено '+changed.length+' '+(changed.length===1?'клетка':'клеток')+'.':'Символы не изменились.';if(changed.length===1&&changed[0].k<0&&changed[0].b==='1')desc='Изменена ровно одна клетка — слева записана новая единица.';else if(changed.length===1&&changed[0].k>=V.tape.length&&changed[0].b==='1')desc='Изменена ровно одна клетка — справа записана новая единица.';if(pre||suf)desc+=' Добавлен '+(pre?'префикс слева «'+pre+'»':'')+(pre&&suf?' и ':'')+(suf?'суффикс справа «'+suf+'»':'')+'.';const char=ok?'Машина остановилась командой S.':'Финиш не достигнут: '+(sim.err||'лимит шагов');e.innerHTML=`<div class="expl result-panel"><div class="result-line"><b>Было:</b> <span class="mono tape-before">${esc(shortS(V.tape))}</span><small>${startDec!=null?'Стартовое число в 10 СС: '+startDec:'Старт не является числом в системе '+V.base}</small></div><div class="result-line"><b>Стало:</b> <span class="mono tape-after">${esc(shortS(res))}</span><small>${dec!=null?'Финальное число в 10 СС: '+dec:'Финиш не является числом в системе '+V.base}</small></div><p class="result-summary">В результате ${[...res].length} символов: ${ones} единиц и ${zeros} нуля.</p><p>${esc(desc)}</p><p class="mut">${char} Характеристика финиша: ${ok?'команда S выполнена; '+sim.tr.length+' тактов.':'остановка без команды S.'}</p></div>`;}
  else if(V.tab==='lab'){e.innerHTML=`<div class="expl"><h4>Перебор всех лент заданной длины</h4><div class="row"><span>длина</span><input class="inp" id="ln" type="number" min="1" max="12" value="${V.ln||6}" style="width:70px"><label><input type="checkbox" id="lnz" ${V.lnz===false?'':'checked'}> без ведущего 0</label><span>цель (число)</span><input class="inp" id="lg2" style="width:100px" value="${esc(V.lg||'')}"><button class="btn pri sm" id="lgo">Перебрать</button></div><div class="mut">Показывает, во что программа превращает каждую строку. Цель сравнивается со значением результата в системе ${V.base}. Для раздела D смотрите столбцы «нулей/единиц».</div><div id="lres"></div></div>`;
  $('#lgo',e).onclick=()=>{V.ln=Math.max(1,Math.min(12,+$('#ln',e).value||6));V.lnz=$('#lnz',e).checked;V.lg=$('#lg2',e).value.trim();const al=V.pp.alpha.filter(a=>a!=='λ'),tot=Math.pow(al.length,V.ln);if(tot>6000)return toast('Слишком много вариантов ('+tot+'), уменьшите длину');
   let rows=[];for(let i=0;i<tot;i++){let s='',x=i;for(let j=0;j<V.ln;j++){s=al[x%al.length]+s;x=Math.floor(x/al.length);}if(V.lnz&&s[0]==='0')continue;const r=simulate(V.pp,s,V.start,5000),res=tapeStr(r.final),d=r.status==='halt'?fromBase(res,V.base):null;rows.push({s,res,d,inputDec:fromBase(s,V.base),st:r.status,steps:r.tr.length,z:[...res].filter(c=>c==='0').length,o:[...res].filter(c=>c==='1').length});}
   const g=V.lg,hit=r=>g&&r.d!=null&&String(r.d)===g;const mc=rows.filter(hit).length;
   $('#lres',e).innerHTML=(g?`<p>Совпало с целью: <b class="${mc?'good':'bad'}">${mc}</b>${mc?' · наименьший вход: <b>'+rows.find(hit).s+'</b>, наибольший: <b>'+rows.filter(hit).pop().s+'</b>':''}</p>`:'')+'<div style="max-height:300px;overflow:auto"><table class="tbl"><tr><th>вход</th><th>старт 10 СС</th><th>результат</th><th>финиш 10 СС</th><th>нулей</th><th>единиц</th><th>шагов</th></tr>'+rows.map(r=>`<tr style="${hit(r)?'background:#dff6ea;color:#0a5a3a':''}"><td class="mono">${esc(r.s)}</td><td>${fromBase(r.s,V.base)??'—'}</td><td class="mono">${r.st==='halt'?esc(r.res):'<span class="bad">'+r.st+'</span>'}</td><td>${r.d==null?'—':r.d}</td><td>${r.z}</td><td>${r.o}</td><td>${r.steps}</td></tr>`).join('')+'</table></div>';};}
 else{const parts=codeParts(t,V.progTxt,[...V.tape].length>200?V.tape.slice(0,40):V.tape,V.start,V.test,V.base),full=parts.map(p=>'# '+p.h+'\n'+p.c).join('\n\n');
  e.innerHTML=`<div class="row"><button class="btn sm" id="ccp">Копировать код</button><span class="mut">код строится из текущей программы и выбранной ленты</span></div>`+parts.map(p=>`<h4 style="margin:10px 0 2px">${esc(p.h)}</h4><pre class="c">${esc(p.c)}</pre><div class="expl">${esc(p.e)}</div>`).join('');
  $('#ccp',e).onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(full).then(()=>toast('Код скопирован'),()=>toast('Скопируйте вручную'));};}}
const shortS=s=>s.length<=70?s:s.slice(0,32)+'…('+s.length+' симв.)…'+s.slice(-32);

/* ================= отчёты, ДЗ, учитель ================= */
const fmtT=s=>s>=3600?Math.floor(s/3600)+' ч '+Math.round(s%3600/60)+' мин':Math.round(s/60)+' мин';
function statOf(n){const s=DB.students[n],p=s.p||{};let ok=0,tr=0,hn=0,tm=0,mk=0;Object.values(p).forEach(x=>{if(x.st==='ok')ok++;if(x.st==='mark')mk++;tr+=x.tries||0;hn+=x.hint||0;tm+=x.t||0;});const hw=s.hw||[],hi=hw.reduce((a,h)=>a+h.ids.length,0),hd=hw.reduce((a,h)=>a+h.ids.filter(i=>{const x=p[i];return x&&(x.st==='ok'||x.st==='mark');}).length,0);return{ok,mk,tr,hn,tm,hi,hd};}
function reportText(n){const s=DB.students[n],st=statOf(n);let o=`Отчёт: ${n}\nРешено верно: ${st.ok}${st.mk?' (+'+st.mk+' без эталона)':''} из ${TASKS.length}; попыток: ${st.tr}; подсказок: ${st.hn}; время: ${fmtT(st.tm)}\nДомашка: ${st.hd}/${st.hi}\n`;
 Object.keys(SEC).forEach(k=>{const a=TASKS.filter(t=>t.sec===k);o+=`\n${k} · ${SEC[k]}: ${a.filter(t=>{const x=(s.p||{})[t.id];return x&&(x.st==='ok'||x.st==='mark');}).length}/${a.length}\n`;a.forEach(t=>{const x=(s.p||{})[t.id];if(x&&(x.tries||x.hint))o+=`  № ${t.id}: ${x.st==='ok'?'✔':x.st==='mark'?'✔(ответ '+x.ans+')':'✖'} попыток ${x.tries}, подсказок ${x.hint}${x.wrong&&x.wrong.length?', неверные: '+x.wrong.join(', '):''}\n`;});});return o;}
function reportDialog(n){const m=modal(`<div class="mhead"><h2>📊 Отчёт · ${esc(n)}</h2><button class="btn sm" id="cp">Копировать</button><button class="btn sm" id="x">✕</button></div><pre class="c" style="white-space:pre-wrap">${esc(reportText(n))}</pre>`,'wide');$('#x',m).onclick=()=>m.remove();$('#cp',m).onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(reportText(n)).then(()=>toast('Скопировано'));};}
function hwDialog(pre){const names=Object.keys(DB.students).filter(n=>!DB.students[n].isT);if(!names.length)return toast('Пока нет учеников');
 const m=modal(`<div class="mhead"><h2>📚 Задать домашнее задание</h2><button class="btn sm" id="x">✕</button></div>
 <b>Кому:</b><div class="row" style="margin:4px 0">${names.map(n=>`<label class="tag"><input type="checkbox" class="hn" value="${esc(n)}"> ${esc(n)}</label>`).join('')}<button class="btn sm" id="all">все</button></div>
 <b>Задачи:</b> <span class="mut">отметьте или введите номера через пробел</span><input class="inp" id="hid" style="width:100%;margin:4px 0" value="${(pre||[]).join(' ')}">
 <div style="max-height:200px;overflow:auto">${Object.keys(SEC).map(k=>`<div><b>${k}</b> ${TASKS.filter(t=>t.sec===k).sort((a,b)=>a.d-b.d||a.id-b.id).map(t=>`<label class="tag" title="сложность ${t.d}"><input type="checkbox" class="ht" value="${t.id}" ${(pre||[]).includes(t.id)?'checked':''}> ${t.id}</label>`).join('')}</div>`).join('')}</div>
 <div class="row" style="margin-top:8px"><span>Срок</span><input class="inp" id="hd" type="date"><input class="inp" id="hnt" placeholder="комментарий" style="flex:1"><button class="btn pri" id="hok">Назначить</button></div>`,'wide');
 $('#x',m).onclick=()=>m.remove();$('#all',m).onclick=()=>$$('.hn',m).forEach(c=>c.checked=true);
 $('#hok',m).onclick=()=>{const ns=$$('.hn',m).filter(c=>c.checked).map(c=>c.value);const ids=new Set($$('.ht',m).filter(c=>c.checked).map(c=>+c.value));($('#hid',m).value.match(/\d+/g)||[]).forEach(i=>{if(BY[+i])ids.add(+i);});
  if(!ns.length||!ids.size)return toast('Выберите учеников и задачи');ns.forEach(n=>{const s=DB.students[n];s.hw=s.hw||[];s.hw.push({ids:[...ids],due:$('#hd',m).value,note:$('#hnt',m).value.trim(),ts:Date.now()});});persist();m.remove();toast('Домашка назначена: '+ns.length+' уч., '+ids.size+' задач');if(cur.name&&!cur.tid)viewHome();};}
function teacherPanel(){const m=modal('','wide');const draw=(tab)=>{const box=m.firstChild;
 const tabs=[['st','👥 Ученики'],['hw','📚 Домашка'],['an','✅ Ответы и метки'],['se','⚙ Настройки']].map(a=>`<button class="btn sm ${tab===a[0]?'on':''}" data-tb="${a[0]}">${a[1]}</button>`).join('');let body='';
 if(tab==='st'){const names=Object.keys(DB.students).filter(n=>!DB.students[n].isT);body=names.length?`<table class="tbl"><tr><th>Ученик</th><th>Решено</th><th>Попыток</th><th>Подсказок</th><th>Время</th><th>ДЗ</th><th></th></tr>${names.map(n=>{const s=statOf(n);return`<tr><td><b>${esc(n)}</b></td><td>${s.ok}${s.mk?'+'+s.mk:''}/${TASKS.length}</td><td>${s.tr}</td><td>${s.hn}</td><td>${fmtT(s.tm)}</td><td>${s.hd}/${s.hi}</td><td><button class="btn sm" data-rep="${esc(n)}">отчёт</button> <button class="btn sm" data-rst="${esc(n)}">сброс</button> <button class="btn sm" data-del="${esc(n)}">✕</button></td></tr>`;}).join('')}</table>`:'<p class="mut">Учеников пока нет.</p>';}
 if(tab==='hw'){const names=Object.keys(DB.students).filter(n=>!DB.students[n].isT);body=`<button class="btn pri" id="nhw">＋ Задать домашнее задание</button>`+names.map(n=>{const hw=DB.students[n].hw||[];return hw.length?`<div class="card" style="margin-top:10px"><b>${esc(n)}</b>${hw.map((h,i)=>`<div class="row" style="margin-top:4px"><span class="mut">${h.due||'без срока'}${h.note?' · '+esc(h.note):''}</span>${h.ids.map(id=>BY[id]?`<span class="chip ${(DB.students[n].p||{})[id]&&['ok','mark'].includes(DB.students[n].p[id].st)?'ok':''}">${id}</span>`:'').join('')}<button class="btn sm" data-dh="${esc(n)}|${i}">убрать</button></div>`).join('')}</div>`:'';}).join('');}

 if(tab==='se'){const tc=DB.teacher;body=`<div class="row"><label>Имя учителя<br><input class="inp" id="sN" value="${esc(tc.name)}"></label><label>PIN<br><input class="inp" id="sP" value="${esc(tc.pin)}"></label></div><div class="row" style="margin-top:12px"><button class="btn pri" id="sS">Сохранить</button><button class="btn" id="sF">💾 Сохранить приложение (HTML с прогрессом)</button><button class="btn" id="sE">⬇ Экспорт JSON</button><label class="btn">⬆ Импорт JSON<input type="file" id="sI" accept=".json" style="display:none"></label></div><p class="mut">Файл «приложение с прогрессом» открывается у ученика как есть: все ученики, домашние задания, ответы и метки внутри.</p>`;}
 box.innerHTML=`<div class="mhead"><h2>👩‍🏫 Кабинет учителя</h2><button class="btn sm" id="x">✕</button></div><div class="tabs">${tabs}</div>${body}`;
 $('#x',box).onclick=()=>{m.remove();if(cur.name&&!cur.tid)viewHome();};$$('[data-tb]',box).forEach(b=>b.onclick=()=>draw(b.dataset.tb));
 $$('[data-rep]',box).forEach(b=>b.onclick=()=>reportDialog(b.dataset.rep));$$('[data-rst]',box).forEach(b=>b.onclick=()=>{if(confirm('Сбросить прогресс ученика '+b.dataset.rst+'?')){DB.students[b.dataset.rst].p={};persist();draw('st');}});
 $$('[data-del]',box).forEach(b=>b.onclick=()=>{if(confirm('Удалить ученика '+b.dataset.del+'?')){delete DB.students[b.dataset.del];persist();draw('st');}});

 if($('#sS',box)){$('#sS',box).onclick=()=>{DB.teacher.name=$('#sN',box).value.trim();DB.teacher.pin=$('#sP',box).value.trim()||'31415';persist();toast('Сохранено');};$('#sF',box).onclick=saveApp;$('#sE',box).onclick=()=>{persist();download('mt12_data.json',JSON.stringify(DB,null,1),'application/json');};
