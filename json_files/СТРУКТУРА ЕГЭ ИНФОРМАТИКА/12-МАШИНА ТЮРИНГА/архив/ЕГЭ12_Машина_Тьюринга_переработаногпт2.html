const SOURCE_TASKS = {"31509":{"fullCondition":"Исполнитель МТ представляет собой читающую и записывающую головку, которая может передвигаться вдоль бесконечной горизонтальной ленты, разделённой на равные ячейки. В каждой ячейке находится ровно один символ из алфавита исполнителя (множество символов A={a0,a1,…,an–1}A={a0​,a1​,…,an–1​}), включая специальный пустой символ a0a0​.\nВремя работы исполнителя делится на дискретные такты (шаги). На каждом такте головка МТ находится в одном из множества допустимых состояний Q={q0,q1,…,qn–1}Q={q0​,q1​,…,qn–1​}. В начальный момент времени головка находится в начальном состоянии q0q0​.\nНа каждом такте головка обозревает одну ячейку ленты, называемую текущей ячейкой. За один такт головка исполнителя может переместиться в ячейку справа или слева от текущей, не меняя находящийся в ней символ, или заменить символ в текущей ячейке без сдвига в соседнюю ячейку. После каждого такта головка переходит в новое состояние или остаётся в прежнем состоянии.\nПрограмма работы исполнителя МТ задаётся в табличном виде.\nВ первой строке перечислены все возможные символы в текущей ячейке ленты, в первом столбце – возможные состояния головки. На пересечении i-й строки и j-го столбца находится команда, которую выполняет МТ, когда головка обозревает j-й символ, находясь в i-м состоянии. Если пара «символ – состояние» невозможна, то клетка для команды остаётся пустой.\nКаждая команда состоит из трёх элементов, разделённых запятыми: первый элемент – записываемый в текущую ячейку символ алфавита (может совпадать с тем, который там уже записан). Второй элемент – один из четырёх символов «L», «R», «N», «S». Символы «L» и «R» означают сдвиг в левую или правую ячейки соответственно, «N» – отсутствие сдвига, «S» – завершение работы исполнителя МТ после выполнения текущей команды. Сдвиг происходит после записи символа в текущую ячейку. Третий элемент – новое состояние головки после выполнения команды.\nНапример, команда 0, L, q3 выполняется следующим образом: в текущую ячейку записывается символ «0», затем головка сдвигается в соседнюю слева ячейку и переходит в состояние q3.\nВыполните задание.\nНа ленте в соседних ячейках записано двоичное представление числа 2025 без ведущих нулей. Ячейки справа и слева от последовательности заполнены пустыми символами «λ». В начальный момент времени головка расположена в ближайшей справа к последовательности ячейке.\nПрограмма работы исполнителя:\nОпределите результат выполнения программы. В ответе запишите получившееся число в десятичной системе счисления.","sourceData":"На ленте в соседних ячейках записано двоичное представление числа 2025 без ведущих нулей. Ячейки справа и слева от последовательности заполнены пустыми символами «λ». В начальный момент времени головка расположена в ближайшей справа к последовательности ячейке.","sourceQuestion":"Определите результат выполнения программы. В ответе запишите получившееся число в десятичной системе счисления."},"31424":{"fullCondition":"(А. Шуруха) Исполнитель МТ представляет собой читающую и записывающую головку, которая может передвигаться вдоль бесконечной горизонтальной ленты, разделённой на равные ячейки. В каждой ячейке находится ровно один символ из алфавита исполнителя (множество символов A={a0,a1,…,an–1}A={a0​,a1​,…,an–1​}), включая специальный пустой символ a0a0​.\nВремя работы исполнителя делится на дискретные такты (шаги). На каждом такте головка МТ находится в одном из множества допустимых состояний Q={q0,q1,…,qn–1}Q={q0​,q1​,…,qn–1​}. В начальный момент времени головка находится в начальном состоянии q0q0​.\nНа каждом такте головка обозревает одну ячейку ленты, называемую текущей ячейкой. За один такт головка исполнителя может переместиться в ячейку справа или слева от текущей, не меняя находящийся в ней символ, или заменить символ в текущей ячейке без сдвига в соседнюю ячейку. После каждого такта головка переходит в новое состояние или остаётся в прежнем состоянии.\nПрограмма работы исполнителя МТ задаётся в табличном циальный пустой символ a0a0​.\nВремя работы исполнителя делится на дискретные такты (шаги). На каждом такте головка МТ находится в одном из множества допустимых состояний Q={q0,q1,…,qn–1}Q={q0​,q1​,…,qn–1​}. В начальный момент времени головка находится в начальном состоянии q0q0​.\nНа каждом такте головка обозревает одну ячейку ленты, называемую текущей ячейкой. За один такт головка исполнителя может переместиться в ячейку справа или слева от текущей, не меняя находящийся в ней символ, или заменить символ в текущей ячейке без сдвига в соседнюю ячейку. После каждого такта головка переходит в новое состояние или остаётся в прежнем состоянии.\nПрограмма работы исполнителя МТ задаётся в табличном виде.\nВ первой строке перечислены все возможные символы в текущей ячейке ленты, в первом столбце – возможные состояния головки. На пересечении i-й строки и j-го столбца находится команда, которую выполняет МТ, когда головка обозревает j-й символ, находясь в i-м состоянии. Если пара «символ – состояние» невозможна, то клетка для команды остаётся пустой.\nКаждая команда состоит из трёх элементов, разделённых запятыми: первый элемент – записываемый в текущую ячейку символ алфавита (может совпадать с тем, который там уже записан). Второй элемент – один из четырёх символов «L», «R», «N», «S». Символы «L» и «R» означают сдвиг в левую или правую ячейки соответственно, «N» – отсутствие сдвига, «S» – завершение работы исполнителя МТ после выполнения текущей команды. Сдвиг происходит после записи символа в текущую ячейку. Третий элемент – новое состояние головки после выполнения команды.\nНапример, команда 0, L, q3 выполняется следующим образом: в текущую ячейку записывается символ «0», затем головка сдвигается в соседнюю слева ячейку и переходит в состояние q3.\nВыполните задание\nНа ленте исполнителя МТ в соседних ячейках записана последовательность из 800 символов, включающая только нули и единицы. Ячейки справа и слева от последовательности заполнены пустыми символами «λ». В начальн исано двоичное представление числа 135 без ведущих нулей. Ячейки справа и слева от последовательности заполнены пустыми символами «λ». В начальный момент времени головка расположена в ближайшей справа от последовательности ячейке.","sourceQuestion":"Определите десятичное значение числа на ленте после выполнения программы."},"24987":{"fullCondition":"(В. Лашин) Исполнитель МТ представляет собой читающую и записывающую головку, которая может передвигаться вдоль бесконечной горизонтальной ленты, разделённой на равные ячейки. В каждой ячейке находится ровно один символ из алфавита исполнителя (множество символов A={a0,a1,a0​,a1​,...,an−1,an−1​}), включая специальный пустой символ a0​.\nВремя работы исполнителя делится на дискретные такты (шаги). На каждом такте головка МТ находится в одном из множества допустимых состояний Q={q0,q1,q0​,q1​,...,qn−1,qn−1​}). В начальный момент времени головка находится в начальном состоянии q0​.\nНа каждом такте головка обозревает одну ячейку ленты, называемую текущей ячейкой. За один такт головка исполнителя может переместиться в ячейку справа или слева от текущей, не меняя находящийся в ней символ, или заменить символ в текущей ячейке без сдвига в соседнюю ячейку. После каждого такта головка переходит в новое состояние или остаётся в прежнем состоянии.\nПрограмма работы исполнителя МТ задаётся в табличном виде.\nВ первой строке перечислены все возможные символы в текущей ячейке ленты, в первом столбце – возможные состояния головки. На пересечении i-й строки и j-го столбца находится команда, которую выполняет МТ, когда головка обозревает j-й символ, находясь в i-м состоянии. Если пара «символ – состояние» невозможна, то клетка для команды остаётся пустой.\nКаждая команда состоит из трёх элементов, разделённых запятыми: первый элемент – записываемый в текущую ячейку символ алфавита (может совпадать с тем, который там уже записан). Второй элемент – один из четырёх символов «L», «R», «N», «S». Символы «L» и «R» означают сдвиг в левую или правую ячейки соответственно, «N» – отсутствие сдвига, «S» – завершение работы исполнителя МТ после выполнения текущей команды. Сдвиг происходит после записи символа в текущую ячейку. Третий элемент – новое состояние головки после выполнения команды.\nНапример, команда 0, L, q3 выполняется следующим образом: в текущую ячейку записывается символ «0», затем головка сдвигается в соседнюю слева ячейку и переходит в состояние q3.\nВыполните задание.\nНа ленте исполнителя МТ в соседних ячейках записана последовательность из 1000 нулей и 500 единиц в указанном порядке. Ячейки справа и слева от последовательности заполнены пустыми символами «λ». В начальный момент времени головка расположена в ближайшей ячейке справа от последовательности.\nПрограмма для исполнителя:\nОпределите, какая сумма числовых элементов на ленте получилась после выполнения алгоритма.","sourceData":"На ленте исполнителя МТ в соседних ячейках записана последовательность из 1000 нулей и 500 единиц в указанном порядке. Ячейки справа и слева от последовательности заполнены пустыми символами «λ». В начальный момент времени головка расположена в ближайшей ячейке справа от последовательности.","sourceQuestion":"Определите, какая сумма числовых элементов на ленте получилась после выполнения алгоритма."},"24764":{"fullCondition":"(В. Шубинкин) Исполнитель МТ представляет собой читающую и записывающую головку, которая может передвигаться вдоль бесконечной горизонтальной ленты, разделённой на равные ячейки. В каждой ячейке находится ровно один символ из алфавита исполнителя (множество символов A={a0,a1,…,an–1}A={a0​,a1​,…,an–1​}), включая специальный пустой символ a0a0​.\nВремя работы исполнителя делится на дискретные такты (шаги). На каждом такте головка МТ находится в одном из множества допустимых состояний Q={q0,q1,…,qn–1}Q={q0​,q1​,…,qn–1​}. В начальный момент времени головка находится в начальном состоянии q0q0​.\nНа каждом такте головка обозревает одну ячейку ленты, называемую текущей ячейкой. За один такт оты исполнителя МТ после выполнения текущей команды. Сдвиг происходит после записи символа в текущую ячейку. Третий элемент – новое состояние головки после выполнения команды.\nНапример, команда 0, L, q3 выполняется следующим образом: в текущую ячейку записывается символ «0», затем головка сдвигается в соседнюю слева ячейку и переходит в состояние q3.\nВыполните задание.\nНа ленте исполнителя МТ в соседних ячейках записана последовательность из 1200 символов, включающая только буквы 'T', 'R', 'A', 'I', 'E', 'C', 'O', 'K' . Ячейки справа и слева от последовательности заполнены пустыми символами «λ». В начальный момент времени головка расположена в ближайшей ячейке справа от последовательности.\nПрограмма для исполнителя:\nПосле выполнения программы оказалось, что последовательность полностью состоит из повторяющихся подпоследовательностей 'TRICKORTREAT'. Определите, сколько было согласных в исходной последовательности.","sourceData":"На ленте исполнителя МТ в соседних ячейках записана последовательность из 1200 символов, включающая только буквы 'T', 'R', 'A', 'I', 'E', 'C', 'O', 'K' . Ячейки справа и слева от последовательности заполнены пустыми символами «λ». В начальный момент времени головка расположена в ближайшей ячейке справа от последовательности.","sourceQuestion":"После выполнения программы оказалось, что последовательность полностью состоит из повторяющихся подпоследовательностей 'TRICKORTREAT'. Определите, сколько было согласных в исходной последовательности."},"24553":{"fullCondition":"(Иглин К.) Исполнитель МТ представляет собой читающую и записывающую головку, которая может передвигаться вдоль бесконечной горизонтальной ленты, разделённой на равные ячейки. В каждой ячейке находится ровно один символ из алфавита исполнителя (множество символов A={a0,a1,…,an–1}), включая специальный пустой символ a0​.\nВремя работы исполнителя делится на дискретные такты (шаги). На каждом такте головка МТ находится в одном из множества допустимых состояний Q={q0,q1,…,qn–1}). В начальный момент времени головка находится в начальном состоянии q0​.\nНа каждом такте головка обозревает одну ячейку ленты, называемую текущей ячейкой. За один такт головка исполнителя может переместиться в ячейку справа или слева от текущей, не меняя находящийся в ней символ, или заменить символ в текущей ячейке без сдвига в соседнюю ячейку. После каждого такта головка переходит в новое состояние или остаётся в прежнем состоянии.\nПрограмма работы исполнителя МТ задаётся в табличном виде.\nВ первой строке перечислены все возможные символы в текущей ячейке ленты, в первом столбце – возможные состояния головки. На пересечении i-й строки и j-го столбца находится команда, которую выполняет МТ, когда головка обозревает j-й символ, находясь в i-м состоянии. Если пара «символ – состояние» невозможна, то клетка для команды остаётся пустой.\nКаждая команда состоит из трёх элементов, разделённых запятыми: первый элемент – записываемый в текущую ячейку символ алфавита (может совпадать с тем, который там уже записан). Второй элемент – один из четырёх символов «L», «R», «N», «S». Символы «L» и «R» означают сдвиг в левую или правую ячейки соответственно, «N» – отсутствие сдвига, «S» – завершение работы исполнителя МТ после выполнения текущей команды. Сдвиг происходит после записи символа в текущую ячейку. Третий элемент – новое состояние головки после выполнения команды.\nНапример, команда 0, L, q3 выполняется следующим образом: в текущую ячейку записывается символ «0», затем головка сдвигается в соседнюю слева ячейку и переходит в состояние q3.\nВыполните задание.\nНа ленте в соседних ячейках записана последовательность из 1000 символов, включающая только нули и единицы. Ячейки справа и слева от последовательности заполнены пустыми символами «λ». В начальный момент времени головка расположена в ближайшей ячейке справа от последовательности.\nПрограмма работы исполнителя:\nПосле выполнения программы на ленте осталось ровно 101 единица. Определите максимально возможное число единиц в исходной последовательности.","sourceData":"На ленте в соседних ячейках записана последовательность из 1000 символов, включающая только нули и единицы. Ячейки справа и слева от последовательности заполнены пустыми символами «λ». В начальный момент времени головка расположена в ближайшей ячейке справа от последовательности.","sourceQuestion":"После выполнения программы на ленте осталось ровно 101 единица. Определите максимально возможное число единиц в исходной последовательности."},"24305":{"fullCondition":"(В. Лашин) Исполнитель МТ представляет собой читающую и записывающую головку, которая может передвигаться вдоль бесконечной горизонтальной ленты, разделённой на равные ячейки. В каждой ячейке находится ровно один символ из алфавита исполнителя (множество символов A={a0,a1,a0​,a1​,...,an−1,an−1​}), включая специальный пустой символ a0​.\nВремя работы исполнителя делится на дискретные такты (шаги). На каждом такте головка МТ находится в одном из множества допустимых состояний Q={q0,q1,q0​,q1​,...,qn−1,qn−1​}). В начальный момент времени головка находится в начальном состоянии q0​.\nНа каждом такте головка обозревает одну ячейку ленты, называемую текущей ячейкой. За один такт головка исполнителя может переместиться в ячейку справа или слева от текущей, не меняя находящийся в ней символ, или заменить символ в текущей ячейке без сдвига в соседнюю ячейку. После каждого такта головка переходит в новое состояние или остаётся в прежнем состоянии.\nПрограмма работы исполнителя МТ задаётся в табличном виде.\nВ первой строке перечислены все возможные символы в текущей ячейке ленты, в первом столбце – возможные состояния головки. На пересечении i-й строки и j-го столбца находится команда, которую выполняет МТ, когда головка обозревает j-й символ, находясь в i-м состоянии. Если пара «символ – состояние» невозможна, то клетка для команды остаётся пустой.\nКаждая команда состоит из трёх элементов, разделённых запятыми: первый элемент – записываемый в текущую ячейку символ алфавита (может совпадать с тем, который там уже записан). Второй элемент – один из четырёх символов «L», «R», «N», «S». Символы «L» и «R» означают сдвиг в левую или правую ячейки соответственно, «N» – отсутствие сдвига, «S» – завершение работы исполнителя МТ после выполнения текущей команды. Сдвиг происходит после записи символа в текущую ячейку. Третий элемент – новое состояние головки после выполнения команды.\nНапример, команда 0, L, q3 выполняется следующим образом: в текущую ячейку записывается символ «0», затем головка сдвигается в соседнюю слева ячейку и переходит в состояние q3.\nВыполните задание.\nНа ленте в соседних ячейках записана последовательность из 1000 символов, которые могут включать только нули, единицы и тройки. Ячейки справа и слева от последовательности заполнены пустыми символами «λ». В начальный момент времени головка расположена в ближайшей ячейке справа от последовательности.\nПрограмма работы исполнителя:\nПосле выполнения программы сумма цифр на ленте оказалась ровно 100. Определите, сколько было троек, при максимально возможном числе единиц в исходной последовательности.","sourceData":"На ленте в соседних ячейках записана последовательность из 1000 символов, которые могут включать только нули, единицы и тройки. Ячейки справа и слева от последовательности заполнены пустыми символами «λ». В начальный момент времени головка расположена в ближайшей ячейке справа от последовательности.","sourceQuestion":"После выполнения программы сумма цифр на ленте оказалась ровно 100. Определите, сколько было троек, при максимально возможном числе единиц в исходной последовательности."},"24176":{"fullCondition":"(С. Анисимов) Исполнитель МТ представляет собой читающую и записывающую головку, которая может передвигаться вдоль бесконечной горизонтальной ленты, разделённой на равные ячейки. В каждой ячейке находится ровно один символ из алфавита исполнителя (множество символов A={a0,a1,…,an–1}A={a0​,a1​,…,an–1​}), включая специальный пустой символ a0a const NORM=c=>/^(λ|Λ|ʎ|_|пусто)$/i.test(c)?'λ':c;
function parseProg(txt){try{const lines=String(txt||'').split('\n').map(l=>l.trim()).filter(Boolean);if(!lines.length)return{ok:false,err:'Программа пуста'};
 const cells=l=>{let s=l;if(s[0]==='|')s=s.slice(1);if(s.endsWith('|'))s=s.slice(0,-1);return s.split(/\||\t/).map(x=>x.trim());};
 const alpha=cells(lines[0]).filter(x=>x!=='').map(NORM);if(!alpha.length)return{ok:false,err:'Нет первой строки с алфавитом (| | λ | 0 | 1)'};
 const Pg={},states=[];
 for(const l of lines.slice(1)){const c=cells(l),q=c[0];if(!q)continue;states.push(q);Pg[q]={};
  alpha.forEach((a,j)=>{const raw=(c[j+1]||'').trim();if(!raw)return;const m=raw.split(/[\s,]+/).filter(Boolean);
   if(m.length!==3||!/^[LRNS]$/i.test(m[1]))throw new Error(`Не разобрана команда «${raw}» (состояние ${q}, символ ${a}). Нужно: символ, L/R/N/S, состояние`);
   Pg[q][a]={w:NORM(m[0]),m:m[1].toUpperCase(),q:m[2]};});}
 if(!states.length)return{ok:false,err:'Нет строк состояний'};
 return{ok:true,alpha,states,P:Pg,q0:Pg.q0?'q0':states[0]};}catch(e){return{ok:false,err:e.message};}}
function simulate(PP,str,start,max=200000){const ch=[...str],n=ch.length,init=new Map();ch.forEach((c,i)=>{if(c!=='λ')init.set(i,c);});
 const tape=new Map(init);let pos=start==='L'?-1:start==='F'?0:n,q=PP.q0;const tr=[];let status='limit',err='';
 for(let k=0;k<max;k++){const r=tape.get(pos)??'λ',cmd=(PP.P[q]||{})[r];
  if(!cmd){status='nocmd';err=`нет команды для (${q}, ${r})`;break;}
  const npos=pos+(cmd.m==='L'?-1:cmd.m==='R'?1:0);tr.push({q,pos,r,w:cmd.w,m:cmd.m,nq:cmd.q,npos});
  if(cmd.w==='λ')tape.delete(pos);else tape.set(pos,cmd.w);pos=npos;q=cmd.q;if(cmd.m==='S'){status='halt';break;}}
 return{tr,status,err,n,init,p0:start==='L'?-1:start==='F'?0:n,final:tape};}
function tapeStr(m){const ks=[...m.keys()].sort((a,b)=>a-b);if(!ks.length)return'';let s='';for(let i=ks[0];i<=ks[ks.length-1];i++)s+=m.get(i)??'λ';return s;}
function fromBase(s,b){if(!s||/λ/.test(s))return null;let v=0n;const B=BigInt(b);for(const c of s){const d=parseInt(c,36);if(isNaN(d)||d>=b)return null;v=v*B+BigInt(d);}return v;}
function taskTape(t){if(t.N!=null)return{s:BigInt(t.N).toString(t.b||2),test:false};if(t.gen)return{s:t.gen(),test:false};
 if(t.comp)return{s:t.comp.map(([c,k])=>c.repeat(k)).join(''),test:false};
 if(t.sec==='B')return{s:'1011010',test:true};
 if(t.tst)return{s:t.tst,test:true};
 const pp=parseProg(t.prog),al=(pp.ok?pp.alpha:['0','1']).filter(a=>a!=='λ');return{s:Array.from({length:8},(_,i)=>al[(i*3+1)%al.length]).join(''),test:true};}
function autoAns(t){if(!t.auto||!t.prog)return null;const pp=parseProg(t.prog);if(!pp.ok)return null;const tp=taskTape(t);if(tp.test)return null;
 const r=simulate(pp,tp.s,t.st);if(r.status!=='halt')return null;const s=tapeStr(r.final);
 if(t.auto==='dec'){const v=fromBase(s,t.b||2);return v==null?null:String(v);}
 if(t.auto==='sum')return String([...s].reduce((a,c)=>a+(/\d/.test(c)?+c:0),0));return null;}

function codeParts(t,progText,tape,start,test,base){
 const pp=parseProg(progText),L=[];let rules='rules = {\n';
 if(pp.ok){pp.states.forEach(q=>pp.alpha.forEach(a=>{const c=pp.P[q][a];if(c)rules+=`    ('${q}', '${a}'): ('${c.w}', '${c.m}', '${c.q}'),\n`;}));rules+='}';}
 else rules+="    # ('q0', 'λ'): ('λ', 'L', 'q1'),  # добавьте команды из таблицы\n}";
 let input;
 if(t.N!=null){const b=t.b||2;input=`'${BigInt(t.N).toString(b)}'`;}
 else if(t.comp&&!test){input=t.comp.map(([c,k])=>`'${c}' * ${k}`).join(' + ');}
 else if(t.gen){input=`'01' * 500`;}
 else{input=`'${String(tape||'1011010').replace(/'/g,"\\'")}'`;}
 const head=start==='L'?'10 - 1':start==='F'?'10':'10 + len(s)';
 const code=`# Исходная строка из условия / пример для анализа
s = ${input}

print('Лента ДО:', ss)

# Положение головки: L — слева, R — справа, F — на первом символе
 i = ${head}
state = 'q0'
${rules}
kol = 0
while kol < 1000000:
    sym = ss[i]
    if (state, sym) not in rules:
        break
    new_sym, move, new_state = rules[(state, sym)]

rez = ''.join(ss).strip('λ')
print('Лента ПОСЛЕ:', rez)
print('Сумма цифр:', sum(int(c) for c in rez if c.isdigit()))
print('Шагов:', kol)`;

/* Наблюдения строятся по фактическим командам программы, а не как общие советы. */
function insightObservation(t){
 const pp=parseProg(t.prog||'');if(!pp.ok)return '<p>В программе пока нет таблицы команд, поэтому закономерность нельзя надёжно вывести.</p>';
 const facts=[];const start=pp.P[pp.q0]||{};const first=start['λ'];
 if(first)facts.push(`Первый такт на стартовой пустой клетке: записывается «${esc(first.w)}», команда ${first.m==='L'?'сдвигает головку влево':first.m==='R'?'сдвигает головку вправо':first.m==='S'?'останавливает машину':'не сдвигает головку'}; затем состояние ${esc(first.q)}.`);
 const map={};pp.states.forEach(q=>pp.alpha.forEach(a=>{const c=pp.P[q][a];if(c&&['0','1','2','3'].includes(a)&&['0','1','2','3'].includes(c.w)){(map[a]=map[a]||new Set()).add(c.w);}}));
 Object.keys(map).sort().forEach(a=>{const vals=[...map[a]];if(vals.length===1&&vals[0]===a)facts.push(`Во всех командах для цифры «${a}» она записывается без изменения.`);else facts.push(`В таблице для цифры «${a}» предусмотрена замена на ${vals.map(v=>'«'+v+'»').join(' или ')}.`);});
 const lambda=[];pp.states.forEach(q=>{const c=pp.P[q]['λ'];if(c){let side='';if(c.w!=='λ'&&c.m==='S'){const dir=first&&first.m==='L'?'влево':first&&first.m==='R'?'вправо':t.st==='L'?'вправо':'влево';side=dir==='влево'?' — при достижении левой пустой клетки добавляет символ к началу (префикс)':' — при достижении правой пустой клетки добавляет символ к концу (суффикс)';}lambda.push(`в ${q} на λ записывает «${c.w}» и ${c.m==='S'?'останавливается':c.m==='L'?'двигается влево':c.m==='R'?'двигается вправо':'остаётся на месте'}${side}`);}});if(lambda.length)facts.push('Команды на пустых клетках: '+lambda.join('; ')+'.');
 if(!facts.length)facts.push('В таблице не обнаружено прямого приписывания символа к пустой клетке; результат определяется последовательностью замен и движением головки.');
 return '<ul>'+facts.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
}

 if(si>0)return siblings[si-1];if(t.proto)return base;
 const pi=protos.findIndex(x=>x.id===base.id);if(pi<=0)return null;

function hintsHTML(t,x){let h='';for(let i=0;i<x.hint;i++)h+=`<div class="hcard"><b class="n">${i+1}</b>${HINTS[t.sec][i]}</div>`;if(x.hint>=2&&(t.hint||(BY[t.proto]||{}).hint)){h+=`<div class="hcard"><b class="n">про программу</b>${t.hint||'Программа задачи-прототипа № '+t.proto+': '+BY[t.proto].hint}</div>`;}return h;}
function answerValue(value){
 let src=String(value==null?'':value).trim().replace(/\s+/g,'').replace(/×/g,'*').replace(/÷/g,'/');if(!/\b(?:int|f)\(/i.test(src))src=src.replace(/,/g,'.');
 if(!src)return null;
 // int('1011',2) -> decimal; f(13,2) -> representation in base 2
 src=src.replace(/int\((['"])([0-9A-Z]+)\1,\s*([2-9]|1[0-6])\s*\)/gi,(_,q,n,b)=>{try{let v=0n,B=BigInt(Number(b));for(const ch of n.toUpperCase()){const d=BigInt(parseInt(ch,36));if(d>=B)return 'NaN';v=v*B+d;}return v.toString();}catch(e){return 'NaN';}});
 src=src.replace(/f\((\d+),\s*([2-9]|1[0-6])\s*\)/gi,(_,n,b)=>BigInt(n).toString(Number(b)));
 if(/^[+-]?\d+$/.test(src)){try{return BigInt(src).toString();}catch(e){}}
 // Safe arithmetic parser: only numbers, parentheses and + - * / ^
 if(!/^[0-9.+*/^()\-]+$/.test(src))return src;
 try{let i=0;const parseExpr=()=>{let v=parseTerm();while(src[i]==='+'||src[i]==='-'){const op=src[i++],r=parseTerm();v=op==='+'?v+r:v-r;}return v;};
 const parseTerm=()=>{let v=parsePow();while(src[i]==='*'||src[i]==='/'){const op=src[i++],r=parsePow();if(op==='/'){if(r===0)throw 0;v/=r;}else v*=r;}return v;};
 const parsePow=()=>{let v=parseAtom();if(src[i]==='^'){i++;v=Math.pow(v,parsePow());}return v;};
 const parseAtom=()=>{if(src[i]==='+'||src[i]==='-'){const op=src[i++],v=parseAtom();return op==='-'?-v:v;}if(src[i]==='('){i++;const v=parseExpr();if(src[i++]!==')')throw 0;return v;}const m=src.slice(i).match(/^(?:\d+(?:\.\d*)?|\.\d+)/);if(!m)throw 0;i+=m[0].length;return Number(m[0]);};
 const v=parseExpr();if(i!==src.length||!Number.isFinite(v))throw 0;return Number.isInteger(v)?String(v):String(Number(v.toPrecision(12)));
 }catch(e){return src;}
}

 const si=siblings.findIndex(x=>x.id===t.id);
 if(si>=0&&si+1<siblings.length)return siblings[si+1];

 for(let j=pi+1;j<protos.length;j++){if(!passF(protos[j]))continue;return protos[j];}
 return null;
}

function reportText(n){const s=DB.students[n],st=statOf(n);let o=`Отчёт: ${n}\nРешено верно: ${st.ok}${st.mk?' (+'+st.mk+' без эталона)':''} из ${TASKS.length}; попыток: ${st.tr}; подсказок: ${st.hn}; время: ${fmtT(st.tm)}\nДомашка: ${st.hd}/${st.hi}\n`;
 Object.keys(SEC).forEach(k=>{const a=TASKS.filter(t=>t.sec===k);o+=`\n${k} · ${SEC[k]}: ${a.filter(t=>{const x=(s.p||{})[t.id];return x&&(x.st==='ok'||x.st==='mark');}).length}/${a.length}\n`;a.forEach(t=>{const x=(s.p||{})[t.id];if(x&&(x.tries||x.hint))o+=`  № ${t.id}: ${x.st==='ok'?'✔':x.st==='mark'?'✔(ответ '+x.ans+')':'✖'} попыток ${x.tries}, подсказок ${x.hint}${x.wrong&&x.wrong.length?', неверные: '+x.wrong.join(', '):''}\n`;});});return o;}
function reportDialog(n){const m=modal(`<div class="mhead"><h2>📊 Отчёт · ${esc(n)}</h2><button class="btn sm" id="cp">Копировать</button><button class="btn sm" id="x">✕</button></div><pre class="c" style="white-space:pre-wrap">${esc(reportText(n))}</pre>`,'wide');$('#x',m).onclick=()=>m.remove();$('#cp',m).onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(reportText(n)).then(()=>toast('Скопировано'));};}
function hwDialog(pre){const names=Object.keys(DB.students).filter(n=>!DB.students[n].isT);if(!names.length)return toast('Пока нет учеников');
 const m=modal(`<div class="mhead"><h2>📚 Задать домашнее задание</h2><button class="btn sm" id="x">✕</button></div>
 <b>Кому:</b><div class="row" style="margin:4px 0">${names.map(n=>`<label class="tag"><input type="checkbox" class="hn" value="${esc(n)}"> ${esc(n)}</label>`).join('')}<button class="btn sm" id="all">все</button></div>
 <b>Задачи:</b> <span class="mut">отметьте или введите номера через пробел</span><input class="inp" id="hid" style="width:100%;margin:4px 0" value="${(pre||[]).join(' ')}">
 <div style="max-height:200px;overflow:auto">${Object.keys(SEC).map(k=>`<div><b>${k}</b> ${TASKS.filter(t=>t.sec===k).sort((a,b)=>a.d-b.d||a.id-b.id).map(t=>`<label class="tag" title="сложность ${t.d}"><input type="checkbox" class="ht" value="${t.id}" ${(pre||[]).includes(t.id)?'checked':''}> ${t.id}</label>`).join('')}</div>`).join('')}</div>
 <div class="row" style="margin-top:8px"><span>Срок</span><input class="inp" id="hd" type="date"><input class="inp" id="hnt" placeholder="комментарий" style="flex:1"><button class="btn pri" id="hok">Назначить</button></div>`,'wide');
 $('#x',m).onclick=()=>m.remove();$('#all',m).onclick=()=>$$('.hn',m).forEach(c=>c.checked=true);
 $('#hok',m).onclick=()=>{const ns=$$('.hn',m).filter(c=>c.checked).map(c=>c.value);const ids=new Set($$('.ht',m).filter(c=>c.checked).map(c=>+c.value));($('#hid',m).value.match(/\d+/g)||[]).forEach(i=>{if(BY[+i])ids.add(+i);});
  if(!ns.length||!ids.size)return toast('Выберите учеников и задачи');ns.forEach(n=>{const s=DB.students[n];s.hw=s.hw||[];s.hw.push({ids:[...ids],due:$('#hd',m).value,note:$('#hnt',m).value.trim(),ts:Date.now()});});persist();m.remove();toast('Домашка назначена: '+ns.length+' уч., '+ids.size+' задач');if(cur.name&&!cur.tid)viewHome();};}
function teacherPanel(){const m=modal('','wide');const draw=(tab)=>{const box=m.firstChild;
 const tabs=[['st','👥 Ученики'],['hw','📚 Домашка'],['an','✅ Ответы и метки'],['se','⚙ Настройки']].map(a=>`<button class="btn sm ${tab===a[0]?'on':''}" data-tb="${a[0]}">${a[1]}</button>`).join('');let body='';
 if(tab==='st'){const names=Object.keys(DB.students).filter(n=>!DB.students[n].isT);body=names.length?`<table class="tbl"><tr><th>Ученик</th><th>Решено</th><th>Попыток</th><th>Подсказок</th><th>Время</th><th>ДЗ</th><th></th></tr>${names.map(n=>{const s=statOf(n);return`<tr><td><b>${esc(n)}</b></td><td>${s.ok}${s.mk?'+'+s.mk:''}/${TASKS.length}</td><td>${s.tr}</td><td>${s.hn}</td><td>${fmtT(s.tm)}</td><td>${s.hd}/${s.hi}</td><td><button class="btn sm" data-rep="${esc(n)}">отчёт</button> <button class="btn sm" data-rst="${esc(n)}">сброс</button> <button class="btn sm" data-del="${esc(n)}">✕</button></td></tr>`;}).join('')}</table>`:'<p class="mut">Учеников пока нет.</p>';}
 if(tab==='hw'){const names=Object.keys(DB.students).filter(n=>!DB.students[n].isT);body=`<button class="btn pri" id="nhw">＋ Задать домашнее задание</button>`+names.map(n=>{const hw=DB.students[n].hw||[];return hw.length?`<div class="card" style="margin-top:10px"><b>${esc(n)}</b>${hw.map((h,i)=>`<div class="row" style="margin-top:4px"><span class="mut">${h.due||'без срока'}${h.note?' · '+esc(h.note):''}</span>${h.ids.map(id=>BY[id]?`<span class="chip ${(DB.students[n].p||{})[id]&&['ok','mark'].includes(DB.students[n].p[id].st)?'ok':''}">${id}</span>`:'').join('')}<button class="btn sm" data-dh="${esc(n)}|${i}">убрать</button></div>`).join('')}</div>`:'';}).join('');}
 if(tab==='an'){body=`<div class="mut">Эталонный ответ (если пусто и задача считается симулятором — берётся вычисленный) и доп. метки (например «Статград 12.12.25»).</div><div style="max-height:60vh;overflow:auto"><table class="tbl"><tr><th>№</th><th>раздел</th><th>вычислено</th><th>эталон</th><th>метки (через ;)</th></tr>${TASKS.slice().sort((a,b)=>a.sec.localeCompare(b.sec)||a.d-b.d||a.id-b.id).map(t=>`<tr><td><b>${t.id}</b></td><td>${t.sec}</td><td>${esc(autoAns(t)||'—')}</td><td><input class="inp" style="width:110px" data-ra="${t.id}" value="${esc(DB.teacher.realAns[t.id]||'')}"></td><td><input class="inp" style="width:100%" data-tg="${t.id}" value="${esc((DB.teacher.tags[t.id]||[]).join('; '))}"></td></tr>`).join('')}</table></div>`;}
 if(tab==='se'){const tc=DB.teacher;body=`<div class="row"><label>Имя учителя<br><input class="inp" id="sN" value="${esc(tc.name)}"></label><label>PIN<br><input class="inp" id="sP" value="${esc(tc.pin)}"></label></div><div class="row" style="margin-top:12px"><button class="btn pri" id="sS">Сохранить</button><button class="btn" id="sF">💾 Сохранить приложение (HTML с прогрессом)</button><button class="btn" id="sE">⬇ Экспорт JSON</button><label class="btn">⬆ Импорт JSON<input type="file" id="sI" accept=".json" style="display:none"></label></div><p class="mut">Файл «приложение с прогрессом» открывается у ученика как есть: все ученики, домашние задания, ответы и метки внутри.</p>`;}
 box.innerHTML=`<div class="mhead"><h2>👩‍🏫 Кабинет учителя</h2><button class="btn sm" id="x">✕</button></div><div class="tabs">${tabs}</div>${body}`;
 $('#x',box).onclick=()=>{m.remove();if(cur.name&&!cur.tid)viewHome();};$$('[data-tb]',box).forEach(b=>b.onclick=()=>draw(b.dataset.tb));
 $$('[data-rep]',box).forEach(b=>b.onclick=()=>reportDialog(b.dataset.rep));$$('[data-rst]',box).forEach(b=>b.onclick=()=>{if(confirm('Сбросить прогресс ученика '+b.dataset.rst+'?')){DB.students[b.dataset.rst].p={};persist();draw('st');}});
 $$('[data-del]',box).forEach(b=>b.onclick=()=>{if(confirm('Удалить ученика '+b.dataset.del+'?')){delete DB.students[b.dataset.del];persist();draw('st');}});
 if($('#nhw',box))$('#nhw',box).onclick=()=>hwDialog();$$('[data-dh]',box).forEach(b=>b.onclick=()=>{const[n,i]=b.dataset.dh.split('|');DB.students[n].hw.splice(+i,1);persist();draw('hw');});
 $$('[data-ra]',box).forEach(i=>i.onchange=()=>{const v=i.value.trim();if(v)DB.teacher.realAns[i.dataset.ra]=v;else delete DB.teacher.realAns[i.dataset.ra];persist();});
 $$('[data-tg]',box).forEach(i=>i.onchange=()=>{const a=i.value.split(';').map(s=>s.trim()).filter(Boolean);if(a.length)DB.teacher.tags[i.dataset.tg]=a;else delete DB.teacher.tags[i.dataset.tg];persist();});
 if($('#sS',box)){$('#sS',box).onclick=()=>{DB.teacher.name=$('#sN',box).value.trim();DB.teacher.pin=$('#sP',box).value.trim()||'31415';persist();toast('Сохранено');};$('#sF',box).onclick=saveApp;$('#sE',box).onclick=()=>{persist();download('mt12_data.json',JSON.stringify(DB,null,1),'application/json');};
  $('#sI',box).onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.v!==1)throw 0;DB=Object.assign(blank(),d);persist();toast('Импортировано');draw('se');}catch(e){toast('Не удалось прочитать файл');}};r.readAsText(f);};}};
 draw('st');}

viewLogin();
</script></body></html>
