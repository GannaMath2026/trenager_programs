<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Информатика · ЕГЭ 7 · Количество информации</title>
<style>:root{--bg:#f3f5fb;--card:#fff;--ink:#1d2640;--mut:#6b7392;--line:#e1e5f0;--pri:#4f6bff;--pri2:#7b5cff;--ok:#16a36a;--err:#e5484d;--warn:#f0a400;--code:#141a2e;--code2:#1c2340;--cink:#dfe5ff;--sh:0 8px 24px rgba(40,50,90,.08);
 --xl-grid:#d4d4d4;--xl-head:#f3f3f3;--xl-headsel:#d3f0e0;--xl-headfull:#217346;--xl-sel:rgba(33,115,70,.13);--xl-act:#217346;--xl-cell:#fff;--xl-ink:#1b1b1b;--fs:15px}
[data-theme=dark]{--bg:#0f1322;--card:#181e33;--ink:#e6e9f5;--mut:#98a0bf;--line:#2a3150;--code:#0b0f1d;--code2:#131a30;--sh:0 8px 24px rgba(0,0,0,.35);
 --xl-grid:#3a4262;--xl-head:#20283f;--xl-headsel:#24513d;--xl-headfull:#2fa36a;--xl-sel:rgba(80,200,140,.18);--xl-act:#3ccf85;--xl-cell:#141a2c;--xl-ink:#e8ecf8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs)/1.5 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:var(--pri)}
.mono,code,pre{font-family:"JetBrains Mono","Cascadia Code",Consolas,"Courier New",monospace}
.btn{border:0;border-radius:11px;padding:8px 14px;font-weight:700;background:var(--card);color:var(--ink);box-shadow:0 0 0 1.5px var(--line) inset;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn:hover{box-shadow:0 0 0 1.5px var(--pri) inset}
.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 6px 16px rgba(79,107,255,.3)}
.btn.ok{background:var(--ok);color:#fff;box-shadow:none}
.btn.red{background:var(--err);color:#fff;box-shadow:none}
.btn.gold{background:linear-gradient(135deg,#ffb100,#ff7a00);color:#fff;box-shadow:0 6px 16px rgba(255,140,0,.3)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:16px 18px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1d2640;color:#fff;padding:11px 18px;border-radius:12px;z-index:400;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90vw;font-weight:600}
.mbg{position:fixed;inset:0;background:rgba(15,20,40,.55);display:flex;align-items:center;justify-content:center;z-index:300;padding:12px}
.mdl{background:var(--card);border-radius:20px;padding:22px;max-width:640px;width:100%;max-height:94vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.mdl.wide{max-width:1040px}.mdl.full{max-width:min(1400px,98vw);width:98vw;max-height:97vh;padding:16px}
.mdl h2{margin:0 0 12px}
.inp{border:1.5px solid var(--line);background:var(--bg);border-radius:11px;padding:8px 12px;outline:none}
.inp:focus{border-color:var(--pri)}
textarea.inp{width:100%;font:13px/1.4 Consolas,monospace}
.vhint{font-size:13px;color:var(--mut)}
/* топбар */
.top{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--card);box-shadow:0 2px 12px rgba(30,40,80,.07);flex-wrap:wrap}
.logo{font-weight:900;font-size:17px;display:flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer}
.logo i{font-style:normal;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-size:14px}
.top .sp{flex:1}
.who{font-weight:800;background:var(--bg);border-radius:999px;padding:5px 12px;white-space:nowrap}
.modeb{font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;background:#e3f6ec;color:#0f7a4d;white-space:nowrap}
.modeb.home{background:#fff0e0;color:#b25e00}
.ib{border:0;background:var(--bg);color:var(--ink);border-radius:10px;padding:7px 10px;font-weight:700;white-space:nowrap}
.ib:hover{background:#e6eaff}[data-theme=dark] .ib:hover{background:#262f55}
.ib.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.seg{display:inline-flex;background:var(--bg);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 9px;font-weight:700;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.seg .xl.on{color:#217346}.seg .lo.on{color:#1e6fd9}
/* вход */
.login{max-width:600px;margin:6vh auto;padding:0 14px}
.hero{background:linear-gradient(135deg,#4f6bff,#7b5cff 60%,#b44cff);color:#fff;border-radius:24px;padding:26px;box-shadow:0 20px 50px rgba(79,107,255,.35);position:relative;overflow:hidden}
.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0;opacity:.92}
.hero .deco{position:absolute;right:14px;bottom:12px;display:grid;grid-template-columns:repeat(12,14px);gap:3px;opacity:.35}
.hero .deco i{height:12px;border-radius:3px;background:#fff}
.slist{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.slist button{border:0;background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:700}
/* раскладка */
.lay{display:grid;grid-template-columns:290px minmax(0,1fr);gap:14px;padding:14px;max-width:1900px;margin:0 auto}
.side{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 78px);overflow:auto;background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:12px}
.prog{display:flex;height:10px;border-radius:9px;overflow:hidden;background:var(--bg);margin:4px 0 8px}
.prog i{display:block;height:100%}
.sec{margin-top:10px}
.sec .sh{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:6px;font-weight:800;font-size:13.5px;padding:5px 4px;text-align:left}
.sec .sh small{margin-left:auto;color:var(--mut);font-weight:700}
.lv{font:800 11px/1 Consolas,monospace;border-radius:6px;padding:4px 6px;color:#fff}
.lv1{background:#16a36a}.lv2{background:#2f80ed}.lv3{background:#f08c00}.lv4{background:#e5484d}.lv5{background:#7b5cff}.lv0{background:#6b7392}
.sec .sd{font-size:11.5px;color:var(--mut);padding:0 4px 4px}
.its{display:flex;flex-wrap:wrap;gap:5px;padding:2px 2px 6px}
.it{border:0;border-radius:9px;padding:4px 7px;font:700 12.5px Consolas,monospace;background:var(--bg);color:var(--ink);position:relative;min-width:46px}
.it.ok{background:#d7f5e6;color:#0f7a4d}.it.err{background:#e2f4ea;color:#2e8a5f}.it.hint{background:#fff1c7;color:#8a6400}.it.sol{background:#ffe2cc;color:#b04e10}
[data-theme=dark] .it.ok{background:#12452f;color:#7fe0b0}[data-theme=dark] .it.hint{background:#4a3a0c;color:#ffd666}[data-theme=dark] .it.sol{background:#4a2a12;color:#ffb27a}[data-theme=dark] .it.err{background:#173d2c;color:#8fd8b3}
.it.cur{outline:2.5px solid var(--pri);outline-offset:1px}
.it.tried::after{content:'';position:absolute;right:2px;top:2px;width:6px;height:6px;border-radius:50%;background:var(--err)}
.it.nn::before{content:'';position:absolute;left:2px;top:2px;width:5px;height:5px;border-radius:50%;background:var(--warn)}
.it.opt{opacity:.75;border:1.5px dashed var(--line)}
.legend{font-size:11.5px;color:var(--mut);display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.addbtn{width:100%;margin-top:10px;justify-content:center}
/* задача */
.main{min-width:0;display:flex;flex-direction:column;gap:12px}
.th{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.th h2{margin:0;font-size:22px}
.tag{font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;background:var(--bg);color:var(--mut);white-space:nowrap}
.tag.k{background:#e6efff;color:#2759d6}.tag.star{background:#fff1c7;color:#8a6400}.tag.rom{background:#ffe3e3;color:#c0262c}.tag.tch{background:#e3f6ec;color:#0f7a4d}
.tag.nn{background:#fff3d6;color:#9a5b00;box-shadow:0 0 0 1.5px #ffcf70 inset}
.cond{font-size:17px;line-height:1.55;margin:10px 0 4px;background:#f7f8fd;color:#1d2640;border-radius:14px;padding:12px 16px;border-left:5px solid var(--pri)}
.cond b{color:#3b4fd8}
.intro{font-size:13.5px;color:var(--mut);margin-top:6px}
.intro summary{cursor:pointer;font-weight:700}
.ans{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bg);border-radius:14px;padding:10px 12px}
.ans .inp{width:150px;font:700 17px Consolas,monospace;background:var(--card)}
.fb{border-radius:12px;padding:10px 14px;font-weight:700;display:none}
.fb.show{display:block}.fb.good{background:#dff6ea;color:#0f7a4d}.fb.bad{background:#ffe3e3;color:#c0262c}.fb.inf{background:#eef1ff;color:#3b4fd8}
[data-theme=dark] .fb.good{background:#12452f;color:#9ff0c6}[data-theme=dark] .fb.bad{background:#4a1518;color:#ffb0b3}[data-theme=dark] .fb.inf{background:#232a4a;color:#c3ccff}
.hcard{border-radius:14px;padding:10px 14px;background:#fff8e1;border-left:5px solid var(--warn);font-size:14.5px;margin-top:8px}
[data-theme=dark] .hcard{background:#2e2710}
.hcard.trap{background:#ffeef0;border-left-color:var(--err)}[data-theme=dark] .hcard.trap{background:#3b1518}
.solcard{border-radius:16px;padding:12px 16px;background:linear-gradient(135deg,#eef1ff,#f6efff);border:1.5px solid #c9d1ff;margin-top:10px}
[data-theme=dark] .solcard{background:linear-gradient(135deg,#1f2546,#29204a);border-color:#3a447a}
.solcard ol{margin:6px 0 4px 20px;padding:0}.solcard li{margin:3px 0}
.solcard .fx{display:inline-block;background:var(--code);color:#c3e88d;border-radius:8px;padding:3px 10px;font:700 14px Consolas,monospace;margin:4px 0}
.solcard .big{font-size:22px;font-weight:900;color:var(--pri)}
/* шаги */
.steps{display:flex;gap:4px;overflow-x:auto;padding:2px 2px 6px;align-items:stretch}
.step{display:flex;align-items:stretch;border-radius:12px;background:var(--bg);min-width:0;flex:0 0 auto;box-shadow:0 0 0 1.5px var(--line) inset}
.step .go{border:0;background:transparent;display:flex;align-items:center;gap:6px;padding:6px 8px 6px 7px;font-weight:700;font-size:12.5px;text-align:left;max-width:150px;line-height:1.15}
.step .n{flex:0 0 22px;height:22px;border-radius:50%;display:grid;place-items:center;font:800 12px Consolas,monospace;background:var(--card);color:var(--mut);box-shadow:0 0 0 1.5px var(--line) inset}
.step .eye{border:0;background:transparent;border-left:1.5px solid var(--line);padding:0 8px;font-size:16px;opacity:.85}
.step .eye:hover{background:rgba(79,107,255,.12)}
.step.done{background:#e3f6ec;box-shadow:0 0 0 1.5px #9fdcbc inset}.step.done .n{background:var(--ok);color:#fff;box-shadow:none}
.step.cur{box-shadow:0 0 0 2.5px var(--pri) inset}.step.cur .n{background:var(--pri);color:#fff}
.step.opt{opacity:.62}
[data-theme=dark] .step{background:#1f2640}[data-theme=dark] .step.done{background:#16382a}
.stepinfo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px;margin:2px 2px 4px}
.stepinfo b{font-size:14.5px}
.fchip{display:inline-flex;align-items:center;gap:6px;background:var(--code);color:#c3e88d;border-radius:8px;padding:3px 10px;font:700 13px Consolas,monospace}
.fchip button{border:0;background:#2a3358;color:#cfd7ff;border-radius:6px;font-size:11px;padding:2px 6px}
/* рабочая книга */
.wb{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.wbbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs3{display:flex;gap:4px}
.tabs3 button{border:0;border-radius:10px 10px 0 0;padding:7px 12px;font-weight:800;background:var(--bg);color:var(--mut);border-bottom:3px solid transparent}
.tabs3 button.on{background:var(--card);color:var(--ink);border-bottom-color:#217346;box-shadow:0 -1px 0 1.5px var(--line) inset}
.zoom{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut);font-weight:700}
.zoom input{accent-color:#217346;width:130px}
.fxbar{display:flex;gap:0;align-items:stretch;border:1px solid var(--xl-grid);border-radius:6px;overflow:hidden;background:var(--xl-cell);font:13px Consolas,monospace;color:var(--xl-ink)}
.fxbar .nb{width:110px;border:0;border-right:1px solid var(--xl-grid);padding:4px 8px;background:var(--xl-cell);color:var(--xl-ink);font:700 13px Consolas,monospace;outline:none}
.fxbar .fx{padding:4px 10px;border-right:1px solid var(--xl-grid);color:#7a7a7a;font-style:italic;font-weight:700}
.fxbar .fv{flex:1;padding:4px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ref0{color:#1f6fd9}.ref1{color:#c0262c}.ref2{color:#7b3fd1}.ref3{color:#0f8a55}
.sheetwrap{position:relative;overflow:auto;max-height:calc(100vh - 330px);min-height:240px;border:1px solid var(--xl-grid);border-radius:6px;background:var(--xl-cell);outline:none}
.sheetwrap:focus{box-shadow:0 0 0 2px rgba(33,115,70,.35)}
.xl{border-collapse:separate;border-spacing:0;font:13.5px/1.2 Calibri,"Segoe UI",Arial,sans-serif;color:var(--xl-ink);table-layout:fixed;user-select:none}
.xl th,.xl td{border-right:1px solid var(--xl-grid);border-bottom:1px solid var(--xl-grid);height:24px;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:clip;background:var(--xl-cell)}
.xl thead th{position:sticky;top:0;z-index:3;background:var(--xl-head);color:#555;font:12px Calibri,"Segoe UI",Arial;text-align:center;cursor:s-resize}
[data-theme=dark] .xl thead th{color:#aab3d0}
.xl tbody th{position:sticky;left:0;z-index:2;background:var(--xl-head);color:#555;font:12px Calibri,Arial;text-align:center;cursor:e-resize;width:38px;min-width:38px}
[data-theme=dark] .xl tbody th{color:#aab3d0}
.xl thead th.corner{left:0;z-index:4;cursor:se-resize}
.xl th.hs{background:var(--xl-headsel);color:#0b5a32;font-weight:700;border-bottom-color:#217346}
.xl tbody th.hs{border-right:2px solid #217346}
.xl th.hf{background:var(--xl-headfull)!important;color:#fff!important}
.xl th.hov{box-shadow:inset 0 0 0 9px rgba(79,107,255,.12)}
.xl td{cursor:cell;text-align:right}
.xl td.t{text-align:left}.xl td.c{text-align:center}
.xl td.hd{font-weight:700;text-align:center;background:#f2f5fb;color:#30385a}
[data-theme=dark] .xl td.hd{background:#1d2440;color:#cfd6f3}
.xl td.sel{background-image:linear-gradient(var(--xl-sel),var(--xl-sel))}
.xl td.act{box-shadow:inset 0 0 0 2px var(--xl-act);background-image:none!important}
.xl.bord td{border-right:1px solid #222;border-bottom:1px solid #222}
[data-theme=dark] .xl.bord td{border-color:#b7c0e0}
.xl td.dep{background:#ffe6c7}.xl td.help{background:#eef3ff}.xl td.st{background:#e4f7ec}.xl td.en{background:#fde9ef}.xl td.shc{background:#fff6c9;font-weight:800;color:#8a6400}
[data-theme=dark] .xl td.dep{background:#4a3417}[data-theme=dark] .xl td.help{background:#1f2a4a}[data-theme=dark] .xl td.st{background:#173d2c}[data-theme=dark] .xl td.en{background:#46202c}[data-theme=dark] .xl td.shc{background:#433a10;color:#ffe08a}
.xl td.edit{cursor:text}
.xl td.edit:hover{outline:1px dashed #b58900;outline-offset:-3px}
.xl td.svc{background:#ffe066!important;font-weight:800}
.xl td.unk{background:#ffef9e!important;color:#9a3d00;font-weight:900}
.xl td.zero{color:#9aa2b8}
.xl td.mk{background:#c9f2db!important;font-weight:800}
[data-theme=dark] .xl td.mk{background:#1d5a3c!important}
.xl td.mk2{background:#ffd9a8!important;font-weight:800}
.xl td.g{padding:0;text-align:center;font:700 12px Consolas,monospace;color:#fff}
.xl td.g.on{text-shadow:0 1px 1px rgba(0,0,0,.35)}
.xl td.g.off{color:transparent}
.xl td.sum{background:#eef1ff;font-weight:800;text-align:center;color:#3b4fd8}
[data-theme=dark] .xl td.sum{background:#232a4a;color:#c3ccff}
.xl td.sum.top{background:#ffd666;color:#1d2640}
.xl td.colhl{box-shadow:inset 2px 0 0 #ff7a00,inset -2px 0 0 #ff7a00}
.xl td.band{background-image:linear-gradient(rgba(255,170,0,.22),rgba(255,170,0,.22))}
.xl td.refc0{box-shadow:inset 0 0 0 2px #1f6fd9}.xl td.refc1{box-shadow:inset 0 0 0 2px #c0262c}.xl td.refc2{box-shadow:inset 0 0 0 2px #7b3fd1}.xl td.refc3{box-shadow:inset 0 0 0 2px #0f8a55}
.selbox{position:absolute;border:2px solid var(--xl-act);pointer-events:none;z-index:5;display:none}
.selbox i{position:absolute;right:-5px;bottom:-5px;width:7px;height:7px;background:var(--xl-act);border:1px solid #fff}
.cedit{position:absolute;z-index:8;border:2px solid var(--xl-act);font:700 13.5px Calibri,Arial;padding:0 4px;outline:none;background:var(--xl-cell);color:var(--xl-ink)}
.status{display:flex;justify-content:flex-end;gap:18px;font-size:12.5px;color:var(--mut);padding:2px 6px;min-height:20px}
.status b{color:var(--ink)}
/* диаграмма */
.chartwrap{position:relative;overflow:auto;max-height:calc(100vh - 330px);min-height:260px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.chart{position:relative}
.ch-ruler{position:sticky;top:0;z-index:6;height:26px;background:var(--card);border-bottom:1px solid var(--line)}
.ch-ruler span{position:absolute;top:5px;text-align:center;font:11px Consolas,monospace;color:var(--mut)}
.ch-ruler span.f5{color:var(--ink);font-weight:700}
.ch-lab{position:sticky;left:0;z-index:5;background:var(--card);border-right:1px solid var(--line);font:700 12.5px Consolas,monospace;display:flex;align-items:center;padding:0 8px;white-space:nowrap;cursor:pointer}
.ch-lab.sel{background:#eef1ff}[data-theme=dark] .ch-lab.sel{background:#232a4a}
.ch-lab small{color:var(--mut);font-weight:400;margin-left:6px}
.ch-grid{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);opacity:.55}
.ch-grid.f5{opacity:1}
.bar{position:absolute;z-index:3;border-radius:7px;color:#fff;font:800 12px/1 "Segoe UI",Arial;display:flex;align-items:center;padding:0 6px;white-space:nowrap;overflow:hidden;cursor:grab;box-shadow:0 2px 6px rgba(0,0,0,.18);touch-action:none;transition:left .45s ease}
.bar.drag{cursor:grabbing;transition:none;box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:4}
.bar.sel{outline:3px solid #1d2640;outline-offset:1px}[data-theme=dark] .bar.sel{outline-color:#fff}
.bar.crit{box-shadow:0 0 0 2px #e5484d,0 2px 6px rgba(0,0,0,.18)}
.bar.dim{opacity:.35}
.bar small{font-weight:600;opacity:.9;margin-left:5px}
.res{position:absolute;border-radius:7px;border:1.5px dashed rgba(100,110,150,.6);background:repeating-linear-gradient(45deg,rgba(120,130,170,.10) 0 6px,transparent 6px 12px)}
.win{position:absolute;top:0;bottom:0;background:rgba(255,190,0,.18);border-left:2px solid #ff9800;border-right:2px solid #ff9800;pointer-events:none;z-index:1}
.win b{position:absolute;top:28px;left:4px;background:#ff9800;color:#fff;font:800 11px Consolas,monospace;border-radius:5px;padding:1px 5px;white-space:nowrap}
.tline{position:absolute;top:0;bottom:0;border-left:2px dashed #e5484d;z-index:2;pointer-events:none}
.tline b{position:absolute;top:2px;left:3px;background:#e5484d;color:#fff;font:800 11px Consolas,monospace;border-radius:5px;padding:1px 5px;white-space:nowrap}
.mark{position:absolute;top:0;bottom:0;width:0;border-left:2px solid #2f80ed;z-index:7;cursor:ew-resize}
.mark::before{content:attr(data-l);position:absolute;top:2px;left:-11px;background:#2f80ed;color:#fff;font:800 11px Consolas,monospace;border-radius:5px;padding:1px 5px}
.mark.b{border-color:#9b51e0}.mark.b::before{background:#9b51e0}

<script id="lib7" type="application/json">{"rev": 1794827377549, "tasks": [{"uid": "image_base_0", "id": "1854", "key": "image_base", "star": true, "hw": false, "cond": "Автоматическая камера производит растровые изображения размером 800×600 пикселей. Для кодирования цвета каждого пикселя используется одинаковое количество байт. Объём файла с изображением не может превышать 700 Кбайт без учёта размера заголовка файла. Какое максимальное количество цветов можно использовать в палитре?", "answer": "256", "fill": {"v": [], "loop": ["1", "1000000"], "cond": "800*600*ceil(log2(x)/8)\u003c=700*2**10", "pr": "x", "brk": false, "out": ""}}, {"uid": "image_base_1", "id": "8139", "key": "image_base", "star": false, "hw": false, "cond": "Виталий делает снимки камерой смартфона. Каждая фотография представляет собой растровое изображение размером 1024×768 пикселей и с палитрой из 2²³ цветов. В конце дня Виталий отправляет снимки друзьям. Для экономии трафика приложение сжимает снимки, используя размер 800×600 пикселей и глубину цвета 22 бита. Сколько Кбайт трафика экономится таким образом при передаче 100 фотографий?", "answer": "91893", "fill": {"v": [["v1", "1024*768*23*100"], ["v2", "800*600*22*100"]], "loop": null, "cond": "", "pr": "", "brk": false, "out": "(v1-v2)//2**13"}}, {"uid": "image_base_2", "id": "191", "key": "image_base", "star": false, "hw": false, "cond": "После преобразования графического файла его объем уменьшился в 1,5 раза. Определите наибольшее количество цветов, которое могло быть в палитре первоначально, если после преобразования было получено растровое изображение того же разрешения в 16-цветной палитре?", "answer": "64", "fill": {"v": [], "loop": ["1", "100000"], "cond": "ceil(log2(x))==4*1.5", "pr": "x", "brk": false, "out": ""}}, {"uid": "image_base_3", "id": "4004", "key": "image_base", "star": true, "hw": false, "cond": "На сайте хранятся изображения размером 1024×768 пикселей. При кодировании используется алгоритм сжатия изображений, позволяющий уменьшить размер памяти для хранения одного изображения в среднем в 6 раз по сравнению с независимым кодированием каждого пикселя. После сжатия каждое изображение дополняется служебной информацией, которая занимает 54 Кбайт. Для хранения 32 изображений выделено 6 Мбайт памяти. Какое максимальное количество цветов можно использовать в палитре каждого изображения?", "answer": "256", "fill": {"v": [], "loop": ["1", "100000"], "cond": "(1024*768*ceil(log2(x))/6+54*2**13)*32\u003c=6*2**23", "pr": "x", "brk": false, "out": ""}}, {"uid": "image_base_4", "id": "7686", "key": "image_base", "star": true, "hw": false, "cond": "Для хранения произвольного растрового изображения размером 1280*720 пикселей отведено 1575 Кбайт. При кодировании цвета каждого пикселя используется одинаковое количество бит, кратное 7: для каждых пяти бит цвета дописываются два дополнительных бита контроля чётности для повышения надёжности передачи данных. Какое максимальное количество цветов можно использовать в изображении?", "answer": "1024", "fill": {"v": [], "loop": ["1", "100000"], "cond": "1280*720*(ceil(ceil(log2(x))/5)*7)\u003c=1575*2**13", "pr": "x", "brk": false, "out": ""}}, {"uid": "image_base_5", "id": "7952", "key": "image_base", "star": true, "hw": false, "cond": "Фотограф делает цветные фотографии размером 3840×2160 пикселей, используя палитру из 2**24 цветов. Для сохранения снимков фотограф использует сменные карты памяти, каждая из которых вмещает не более 32Гбайт данных. Когда на карте остаётся недостаточно места для записи новой фотографии, фотограф заменяет карту на следующую свободную. Известно, что фотограф сделал 13269234531 снимок. Какое минимальное количество карт понадобится фотографу?", "answer": "9615388", "fill": {"v": [["v", "3840*2160*24"], ["k", "32*2**33"], ["k1", "int(k/v)"]], "loop": null, "cond": "", "pr": "", "brk": false, "out": "ceil(13269234531/k1)"}}, {"uid": "image_base_6", "id": "8138", "key": "image_base", "star": true, "hw": false, "cond": "Фотограф делает фотографии 7680×4320 пикселей, используя 2**16 цветов. Для сохранения снимков фотограф использует карты памяти, каждая из которых вмещает не более 9Гбайт. Когда на карте памяти остаётся недостаточно места для записи новой фотографии, фотограф берёт следующую, свободную карту. Известно, что фотограф сделал 4010 снимков. Сколько снимков оказалось на последней карте?", "answer": "95", "fill": {"v": [["v", "7680*4320*16"], ["k", "9*2**33"], ["k1", "int(k/v)"]], "loop": null, "cond": "", "pr": "", "brk": false, "out": "4010%k1"}}, {"uid": "image_base_7", "id": "4386", "key": "image_base", "star": false, "hw": true, "cond": "Найдите битовую глубину кодирования растрового изображения размером 512x300 пикселей, которое занимает 600 Кбайт.", "answer": "32", "fill": {"v": [["i", "600*2**13/(512*300)"]], "loop": null, "cond": "", "pr": "", "brk": false, "out": "i"}}, {"uid": "image_base_8", "id": "4714", "key": "image_base", "star": false, "hw": true, "cond": "Для хранения рисунка размером 4096×3072 пикселя выделено 9 Мбайт памяти. Определите максимально возможное количество цветов в палитре изображения.", "answer": "64", "fill": {"v": [], "loop": ["1", "100000"], "cond": "4096*3072*ceil(log2(x))\u003c=9*2**23", "pr": "x", "brk": false, "out": ""}}, {"uid": "image_base_9", "id": "5824", "key": "image_base", "star": false, "hw": true, "cond": "Для хранения растровых изображений с палитрой в 2²³ цветов и размером 2560×1440 пикселей отведено 50 Мбайт памяти. Какое максимальное количество изображений удастся сохранить?", "answer": "4", "fill": {"v": [["v", "2560*1440*23"]], "loop": null, "cond": "", "pr": "", "brk": false, "out": "int(50*2**23/v)"}}, {"uid": "image_base_10", "id": "5790", "key": "image_base", "star": false, "hw": true, "cond": "Растровое изображение размером 1024×1024 пикселя занимает более 1152 Кбайт памяти. Глубина кодирования цвета не имеет избыточности. Коды пикселей записываются в файл один за другим без промежутков. Какое минимальное количество цветов должно быть использовано в палитре изображения?", "answer": "513", "fill": {"v": [], "loop": ["1", "100000"], "cond": "1024*1024*ceil(log2(x))>1152*2**13", "pr": "x", "brk": true, "out": ""}}, {"uid": "image_base_11", "id": "8139", "key": "image_base", "star": false, "hw": true, "cond": "Фотограф делает цветные фотографии размером 3840*2160 пикселей, используя палитру из 65536 цветов. Для сохранения снимков фотограф использует сменные карты памяти, каждая из которых вмещает не более 16 Гбайт данных. Когда на карте остаётся недостаточно места для записи новой фотографии, фотограф заменяет карту на следующую свободную. Известно, что фотограф использовал 15 карт, причём на последней было 722 снимка. Какое максимальное количество снимков мог сделать фотограф?", "answer": "15212", "fill": {"v": [["v", "3840*2160*16"], ["k", "16*2**33"], ["k1", "int(k/v)"]], "loop": null, "cond": "", "pr": "", "brk": false, "out": "14*k1+722"}}, {"uid": "image_base_12", "id": "7920", "key": "image_base", "star": false, "hw": true, "cond": "Фотограф делает цветные фотографии размером 3614×4972 пикселей, используя палитруиз 2**16 цветов. Для сохранения снимков фотограф использует сменные карты памяти, каждая из которых вмещает не более 8 Гбайт данных. Когда на карте остаётся недостаточно места для записи новой фотографии, фотограф заменяет карту на следующую свободную. Известно, что фотограф сделал 4096 снимков. Сколько снимков оказалось на последней карте памяти из использованных?", "answer": "33", "fill": {"v": [["v", "3614*4972*16"], ["k", "8*2**33"], ["k1", "int(k/v)"]], "loop": null, "cond": "", "pr": "", "brk": false, "out": "4096%k1"}}, {"uid": "image_base_13", "id": "5444", "key": "image_base", "star": true, "hw": true, "cond": "Для хранения произвольного растрового изображения размером 480*768 пикселей отведено 405 Кбайт памяти без учёта размера заголовка файла. При кодировании цвета каждого пикселя используется одинаковое количество бит, кратное трём: для каждых двух бит цвета дописывается дополнительный бит контроля чётности. Какое максимальное количество цветов можно использовать в изображении?", "answer": "64", "fill": {"v": [], "loop": ["1", "100000"], "cond": "480*768*ceil(ceil(log2(x))/2)*3\u003c=405*2**13", "pr": "x", "brk": false, "out": ""}}, {"uid": "image_change_14", "id": "1832", "key": "image_change", "star": false, "hw": false, "cond": "Автоматическая фотокамера делает фотографии высокого разрешения с палитрой, содержащей 2²⁴ = 16 777 216 цветов. Средний размер фотографии составляет 6 Мбайт. Для хранения в базе данных фотографии преобразуют в формат с палитрой, содержащей 16 цветов. Сколько Мбайт составляет средний размер преобразованной фотографии?", "answer": "1", "fill": {"v": [["ab", "6*2**23/24"], ["v2", "ab*4/2**23"]], "loop": null, "cond": "", "pr": "", "brk": false, "out": "v2"}}, {"uid": "image_change_15", "id": "195", "key": "image_change", "star": false, "hw": false, "cond": "После преобразования растрового 256-цветного графического файла в черно-белый формат его размер уменьшился на 7 Кбайт. Каков был размер исходного файла в Кбайтах?", "answer": "8", "fill": {"v": [["ab", "7*2**13/(8-1)"], ["v1", "ab*8"]], "loop": null, "cond": "", "pr": "", "brk": false, "out": "v1/2**13"}}, {"uid": "image_change_16", "id": "1815", "key": "ppi", "star": false, "hw": false, "cond": "Цветное изображение было оцифровано в виде файла. Размер полученного файла – 42 Мбайт. Затем то же изображение было оцифровано повторно с разрешением в 2 раза меньше,  глубину кодирования цвета увеличили в 4 раза по сравнению с первоначальными параметрами. Укажите размер файла в Мбайт, полученного при повторной оцифровке.", "answer": "42", "fill": {"v": [["v", "42"]], "loop": null, "cond": "", "pr": "", "brk": false, "out": "v*4/2**2"}}, {"uid": "image_change_17", "id": "194", "key": "image_change", "star": false, "hw": true, "cond": "После преобразования растрового 16-цветного графического файла в черно-белый формат его размер уменьшился на 21 Кбайт. Каков был размер исходного файла в Кбайтах?", "answer": "28", "fill": {"v": [["ab", "21*2**13/(4-1)"], ["v1", "ab*4"]], "loop": null, "cond": "", "pr": "", "brk": false, "out": "v1/2**13"}}, {"uid": "image_change_18", "id": "1831", "key": "image_change", "star": false, "hw": true, "cond": "Автоматическая фотокамера делает фотографии высокого разрешения с палитрой, содержащей 2²⁴ = 16 777 216 цветов. Средний размер фотографии составляет 12 Мбайт. Для хранения в базе данных фотографии преобразуют в формат с палитрой, содержащей 2¹⁶ = 65536 цветов. эСколько Мбайт составляет средний размер преобразованной фотографии?", "answer": "8", "fill": {"v": [["v", "12"]], "loop": null, "cond": "", "pr": "", "brk": false, "out": "v*16/24"}}, {"uid": "image_change_19", "id": "3496", "key": "ppi", "star": false, "hw": true, "cond": "Изображение размером 12 Мбайт сжимают для экономии памяти. Известно, что разрешение уменьшили вдвое, а цветовую палитру с 2¹⁵ = 32768 цветов сократили до 1024 цветов. Сколько Мбайт займет сжатый файл?", "answer": "2", "fill": {"v": [["v", "12"]], "loop": null, "cond": "", "pr": "", "brk": false, "out": "v*10/15/2**2"}}, {"uid": "ppi_20", "id": "3218", "key": "ppi", "star": false, "hw": false, "cond": "Для хранения в информационной системе документы сканируются с разрешением 150 dpi и цветовой системой, содержащей 16 цветов. Средний размер отсканированного документа составляет 0,5 Мбайт. Для повышения качества было решено перейти на разрешение 300 dpi и цветовую систему, содержащую 2¹⁶ = 65536 цветов. Сколько Мбайт будет составлять средний размер документа, отсканированного с изменёнными параметрами?", "answer": "8", "fill": {"v": [["ab", "0.5/(4*150**2)"], ["v1", "ab*16*300**2"]], "loop": null, "cond": "", "pr": "", "brk": false, "out": "v1"}}, {"uid": "ppi_21", "id": "1846", "key": "ppi", "star": false, "hw": false, "cond": "Для хранения в информационной системе документы сканируются с разрешением 400 ppi. Средний размер отсканированного документа составляет 2 Мбайт. В целях экономии было решено перейти на разрешение 100 ppi и цветовую систему, содержащую 64 цвета. Средний размер документа, отсканированного с изменёнными параметрами, составляет 96 Кбайт. Определите количество цветов в палитре до оптимизации.", "answer": "256", "fill": {"v": [["ab", "96*2**13/(6*100**2)"], ["i", "2*2**23/(ab*400**2)"]], "loop": null, "cond": "", "pr": "", "brk": false, "out": "2**i"}}, {"uid": "ppi_22", "id": "4789", "key": "ppi", "star": false, "hw": true, "cond": "Изображения размером 4х7 дюйма сканируются с разрешением 300 ppi и использованием 2²⁴ цветов. Заголовок файла занимает 6 Кбайт. Для хранения таких изображений выделено 640 Мбайт памяти. Сколько изображений удастся сохранить?.", "answer": "88", "fill": {"v": [["v", "4*300*7*300*24+6*2**13"]], "loop": null, "cond": "", "pr": "", "brk": false, "out": "int(640*2**23/v)"}}, {"uid": "ppi_23", "id": "3217", "key": "ppi", "star": false, "hw": true, "cond": "Документы сканируются с разрешением 200 dpi и цветовой системой, содержащей 256 цветов. Методы сжатия изображений не используются. Средний размер отсканированного документа составляет 6 Мбайт. Для повышения качества было решено перейти на разрешение 300 dpi и цветовую систему, содержащую 2¹⁶ = 65536 цветов. Сколько Мбайт будет составлять средний размер документа, отсканированного с изменёнными параметрами?", "answer": "27", "fill": {"v": [["v", "6"]], "loop": null, "cond": "", "pr": "", "brk": false, "out": "v*16/8*(300/200)**2"}}, {"uid": "ppi_24", "id": "1845", "key": "ppi", "star": false, "hw": true, "cond": "Документы сканируются с разрешением 300 ppi. Средний размер отсканированного документа составляет 5 Мбайт. В целях экономии было решено перейти на разрешение 150 ppi и цветовую систему, содержащую 16 цветов. Средний размер документа, отсканированного с изменёнными параметрами, составляет 512 Кбайт. Определите количество цветов в палитре до оптимизации.", "answer": "1024", "fill": {"v": [["ab", "512*2**13/(4*150**2)"], ["i", base", "star": false, "hw": false, "cond": "Музыкальный фрагмент был записан в формате моно, оцифрован и сохранён в виде файла с использованием сжатия данных. При этом производилось сжатие данных, объем сжатого фрагмента стал равен 40% от первоначальной записи. Затем тот же музыкальный фрагмент был записан повторно в формате стерео (двухканальная запись) и оцифрован с разрешением в 8 раз выше и частотой дискретизации в 2 раз выше, чем в первый раз. При этом производилось сжатие данных, объем сжатого фрагмента стал равен 60% от повторной записи. Во сколько раз размер повторной записи будет больше первой?", "answer": "48", "fill": {"v": [], "loop": null, "cond": "", "pr": "", "brk": false, "out": "(2*8*2*0.6)/(1*0.4)"}}, {"uid": "audio_base_62", "id": "5297", "key": "audio_base", "star": false, "hw": true, "cond": "Для хранения сжатого аудио файла с заголовком отведено 25 Мбайт памяти. Фрагмент кодируется в формате стерео, частотой дискретизации 50 кГц и глубиной кодирования 16 бит. После кодирования фрагмент сжимается. Сжатый размер закодированного фрагмента меньше исходного на 25%. К сжатому фрагменту дописывается информация о заголовке и дополнительная информация, суммарно занимающая 40 Кбайт. Запишите в ответе целое число - максимальную длительность в минутах фрагмента, который сохраняется по приведенному алгоритму?", "answer": "2", "fill": {"v": [], "loop": ["1", "100000"], "cond": "2*50000*16*60*x*0.75+40*2**13\u003c=25*2**23", "pr": "x", "brk": false, "out": ""}}, {"uid": "audio_record_63", "id": "7648", "key": "audio_record", "star": false, "hw": false, "cond": "Звуковой файл записан в формате стерео с частотой дискретизации 44,1 кГц и разрешением 16 бит без использования сжатия. Длительность записи 53 минуты 30 секунд. Файл состоит из 10 частей, каждая из которых содержит заголовок размером 512 Кбайт. Сколько секунд потребуется для скачивания файла по каналу со скоростью передачи данных 100 Мбит/с? (1 Мбит/с = 10⁶ бит/с., т.к. это скорость)", "answer": "45", "fill": {"v": [["v", "2*44100*16*(53*60+30)+10*512*2**13"]], "loop": null, "cond": "", "pr": "", "brk": false, "out": "int(v/(100*10**6))"}}, {"uid": "audio_record_64", "id": "6377", "key": "audio_record", "star": false, "hw": false, "cond": "В студии записали вокал длительностью 8 минут 32 секунды в режиме квадро, используя оцифровку с частотой дискретизации 192 кГц. Несжатые данные ровно за три четверти минуты записали на флешку. Известно, что флешка записывает данные на скорости 25 Мбайт/с. Определите исходную глубину кодирования одной дорожки (в битах).", "answer": "24", "fill": {"v": [["i", "25*2**23*45/(4*192000*(8*60+32))"]], "loop": null, "cond": "", "pr": "", "brk": false, "out": "i"}}, {"uid": "audio_record_65", "id": "6717", "key": "audio_record", "star": false, "hw": true, "cond": "Голосовое сообщение было записано в формате моно и оцифровано с глубиной кодирования 16 бит и частотой дискретизации 32 кГц. Файл с оцифрованным голосовым сообщением был передан по каналу связи, пропускная способность которого 1 024 000 бит/с в течение 5 секунд. Какова продолжительность голосового сообщения в секундах?", "answer": "10", "fill": {"v": [], "loop": null, "cond": "", "pr": "", "brk": false, "out": "1024000*5/(16*32000)"}}, {"uid": "audio_change_66", "id": "1884", "key": "audio_change", "star": false, "hw": false, "cond": "Музыкальный фрагмент был записан в формате стерео (двухканальная запись), оцифрован и сохранён в виде файла без использования сжатия данных. Размер полученного файла – 28 Мбайт. Затем тот же музыкальный фрагмент был записан повторно в формате моно и оцифрован с разрешением в 2 раза выше и частотой дискретизации в 3,5 раз меньше, чем в первый раз. Укажите размер файла в Мбайт, полученного при повторной записи.", "answer": "8", "fill": {"v": [], "loop": null, "cond": "", "pr": "", "brk": false, "out": "28/2*2/3.5"}}, {"uid": "audio_change_67", "id": "4155", "key": "audio_change", "star": false, "hw": false, "cond": "Музыкальный фрагмент длительностью 2 минуты записали в формате стерео. Размер полученного файла составил 20 Мбайт. После чего музыкальный фрагмент перевели в формат моно, при этом уменьшив частоту дискретизации вдвое и удалив из фрагмента 24 секунды записи. Полученный фрагмент также сохранили в виде файла. Методы сжатия в обоих случаях не применялись. Найдите размер полученного после преобразования файла в МБайт.", "answer": "4", "fill": {"v": [], "loop": null, "cond": "", "pr": "", "brk": false, "out": "20/2/2*(120-24)/120"}}, {"uid": "audio_change_68", "id": "6574", "key": "audio_change", "star": false, "hw": true, "cond": "Звук продолжительностью 5 минут был записан в формате стерео и оцифрован с глубиной кодирования 24 бит и частотой дискретизации 48 кГц. Файл с оцифрованным голосовым сообщением был передан по каналу связи, пропускная способность которого 56000 бит/с. Сколько минут потребуется для передачи файла? В ответе запишите целое число, единицу измерения указывать не нужно.", "answer": "206", "fill": {"v": [["v", "2*48000*24*5*60"]], "loop": null, "cond": "", "pr": "", "brk": false, "out": "ceil(v/56000/60)"}}, {"uid": "audio_change_69", "id": "6257", "key": "audio_change", "star": false, "hw": true, "cond": "Музыкальный фрагмент был записан в формате моно, оцифрован и сохранён в виде файла без использования сжатия данных. Размер полученного файла – 28 Мбайт. Затем тот же музыкальный фрагмент был записан повторно в формате квадро и оцифрован с разрешением в 3,5 раза выше и частотой дискретизации в 2 раза меньше, чем в первый раз. Укажите размер полученного при повторной записи файла в байтах.", "answer": "205520896", "fill": {"v": [], "loop": null, "cond": "", "pr": "", "brk": false, "out": "28*2**20*4*3.5/2"}}, {"uid": "text_audio_70", "id": "6361", "key": "text_audio", "star": false, "hw": false, "cond": "Текст, имеющий информационный объём 2 Мбайт, сохранили в виде стереофонической (двухканальной) аудиозаписи, при этом использовали частоту дискретизации 24 кГц и глубину кодирования 24 бит. За одну минуту диктор успевал в среднем прочитать 1,5 Кбайт текста. При последующем сжатии размер полученного звукового файла сократился на 60% от исходного. Затем звукозапись разделили на фрагменты размером 30 Мбайт. Определите количество полученных фрагментов.", "answer": "150", "fill": {"v": [["t", "2*1024/1.5*60"], ["v", "2*24000*24*t"]], "loop": null, "cond": "", "pr": "", "brk": false, "out": "v*0.4/(30*2**23)"}}, {"uid": "text_audio_71", "id": "6360", "key": "text_audio", "star": false, "hw": true, "cond": "Текст, имеющий информационный объём 1 Мбайт, сохранили в виде стереофонической (двухканальной) аудиозаписи, при этом использовали частоту дискретизации 24 кГц и глубину кодирования 16 бит. За одну минуту диктор успевал в среднем прочитать 2 Кбайт текста. При последующем сжатии размер полученного звукового файла сократился на 80% от исходного. Затем звукозапись разделили на фрагменты размером 12,5 Мбайт. Определите количество полученных фрагментов.", "answer": "45", "fill": {"v": [["t", "1*1024/2*60"], ["v", "2*24000*16*t"]], "loop": null, "cond": "", "pr": "", "brk": false, "out": "v*0.2/(12.5*2**23)"}}, {"uid": "audio_transfer_72", "id": "1870", "key": "audio_transfer", "star": false, "hw": false, "cond": "Музыкальный фрагмент был оцифрован и записан в виде файла без использования сжатия данных. Получившийся файл был передан в город А по каналу связи за 28 секунд. Затем тот же музыкальный фрагмент был оцифрован повторно с разрешением в 3 раза выше и частотой дискретизации в 7 раз меньше, чем в первый раз. Сжатие данных не производилось. Полученный файл был передан в город Б; пропускная способность канала связи с городом Б в 4 раза ниже, чем канала связи с городом А. Сколько секунд длилась передача файла в город Б?", "answer": "48", "fill": {"v": [], "loop": null, "cond": "", "pr": "", "brk": false, "out": "28*3/7*4"}}, {"uid": "audio_transfer_73", "id": "7452", "key": "audio_transfer", "star": false, "hw": false, "cond": "Музыкальный альбом записан   }
  function program(P) {

function conditionNumbers(cond){
  const sup={'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9'};
  const src=String(cond||'').replace(/(\d+)([⁰¹²³⁴⁵⁶⁷⁸⁹]+)/g,(_,a,b)=>a+'**'+[...b].map(c=>sup[c]).join(''));

  const re=/(?:\d{1,3}(?:[ \u00a0]\d{3})+|\d+)(?:[,.]\d+)?(?:\s*\*\*\s*\d+)?/g;
  for(const m of src.matchAll(re))add(m[0],m[0]);
  const pair=/(\d+(?:[ \u00a0]\d{3})*(?:[,.]\d+)?)(?:\s*)(?:×|x|х|на)(?:\s*)(\d+(?:[ \u00a0]\d{3})*(?:[,.]\d+)?)/gi;
  for(const m of String(cond||'').matchAll(pair)){const a=m[1].replace(/[\u00a0\s]/g,'').replace(/,/g,'.'),b=m[2].replace(/[\u00a0\s]/g,'').replace(/,/g,'.');add(m[1]+' × '+m[2],a+'*'+b);}
  return [...found.values()];
}

  const st = [['1. Единицы', '1 байт = 8 бит · 1 Кбайт = 1024 байт · 1 Мбайт = 1024 Кбайт', 'Кбайт→бит ·2**13 · Мбайт ·2**23 · Гбайт ·2**33'], ['2. Палитра', 'N = 2ⁱ,  i = ⌈log₂N⌉', 'i = ceil(log2(N)) — минимум бит на пиксель'], ['3. Изображение', 'V = a · b · i', 'a, b — пиксели; i — бит на пиксель'], ['4. С разрешением', 'V = a · b · i · R²', 'R — dpi/ppi; смена R даёт (R₂/R₁)²'], ['5. Звук', 'V = k · d · t · i', 'k каналы, d Гц (кило = 1000!), t секунды'], ['6. Передача', 'V = v · t', 't = V / v; единицы должны совпадать'], ['7. Видео', 'V = a·b·i·f·t + звук', 'f — кадров в секунду'], ['8. Сжали на x%', 'V · (100 − x) / 100', 'осталось (100 − x)%'], ['9. Исходный больше на x%', 'V_сж · (100 + x) / 100', 'сжатый принят за 100%'], ['10. Доп. биты', 'i = i_цвет + i_прозр', 'чётность: ceil(i/5)*7'], ['11. Фотокамера', 'n = T / Δt', 'сначала число снимков'], ['12. Скорость', '1 Мбит/с = 10⁶ бит/с', 'для памяти — степени 1024']];
  const cols = ['#fff3b0', '#d7f0ff', '#ffe0ec', '#dcf8e8', '#ece3ff'];
  modal(`<div class="row" style="justify-content:space-between"><h2 style="margin:0">📌 Формулы-стикеры</h2><button class="btn ghost" onclick="closeModal()">✕</button></div><div class="stk">${st.map((s, i) => `<div class="sk" style="background:${cols[i % 5]}"><b>${esc(s[0])}</b><div class="fx-big">${mathMarkup(s[1])}</div><span>${mathMarkup(s[2])}</span></div>`).join('')}</div>`, 'full');
}

function repRows(s) { const L = vis(s).slice(); TASKS.forEach(t => { if (!L.includes(t.uid) && solved(s.tasks[t.uid])) L.push(t.uid); }); return L.map(id => { const it = taskByUid(id); const x = normRec(Object.assign({}, s.tasks[id] || {})); return {id, it, x, st: x.st, extra: !vis(s).includes(id)}; }).filter(r => r.it); }
function hintStr(r, includeFill=DB.teacher.repFill!==false) { const x = r.x, h = []; if (x.hint) h.push('подсказки ' + Math.min(3, x.hint)); if (x.solOpened || (x.solSeen&&!x.fillUsed)) h.push('решение'); if(includeFill&&x.fillUsed)h.push('заполнение полей ×'+x.fillUsed); return h.join(', '); }
function reportActivity(r,includeFill=DB.teacher.repFill!==false){const names={hint:'Подсказка',solution:'Разбор решения',fill:'Заполнить поля',run:'Запуск кода',answer:'Ответ'};return (r.x.activity||[]).filter(e=>includeFill||e.kind!=='fill').map(e=>`${new Date(e.at).toLocaleString('ru-RU')} · ${names[e.kind]||e.kind}${e.detail?': '+e.detail:''}`).join('\n')||'История действий не записана.';}
function studentCode(x){if(!x||!x.code)return 'Код не вводил.';try{return PYM.program(x.code);}catch(e){return 'Не удалось восстановить код: '+e.message;}}
function reportTaskHtml(rr,showAns){const fill=DB.teacher.repFill!==false,code=studentCode(rr.x);return `<section class="reportTask"><h3>№ ${esc(rr.it.id)} · ${ST_LABEL[rr.st]} · попыток: ${rr.x.tries||0} · запусков кода: ${rr.x.runs||0}</h3><p><b>Условие:</b> ${fmtCond(rr.it.cond)}</p><p><b>Неверные ответы:</b> ${esc(rr.x.wrong.join('; '))||'—'} · <b>Помощь:</b> ${esc(hintStr(rr,fill))||'—'}</p>${showAns?`<p><b>Верный ответ:</b> ${esc(rr.it.answer)}</p>`:''}<details open><summary>Код ученика</summary><pre>${esc(code)}</pre></details><details><summary>Действия ученика</summary><pre class="reportActions">${esc(reportActivity(rr,fill))}</pre></details></section>`;}
