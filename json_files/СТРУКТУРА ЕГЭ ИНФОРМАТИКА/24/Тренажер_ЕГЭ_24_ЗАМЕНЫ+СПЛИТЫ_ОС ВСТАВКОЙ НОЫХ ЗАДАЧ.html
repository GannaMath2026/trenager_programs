function taskVisualizerConfig(task){

function makeVizMoveResult(x,m){
  let y;
  if(m.op==='+')y=x+Number(m.val);
  else if(m.op==='-'){if(x<Number(m.min??m.val))return null;y=x-Number(m.val)}

  else if(m.op==='floorDiv')y=Math.floor(x/Number(m.val));
  else if(m.op==='halfEven'){if(x%2!==0)return null;y=x/2}

  if(!Number.isFinite(y))return null;

  if((m.op==='halfEvenElseMinus'||m.op==='thirdDivisibleElseMinus')&&y<1)return null;
  return y;
}
function vizGoalReached(x,cfg){
  if(cfg.goal==='gte')return x>=cfg.target;
  if(cfg.goal==='lte')return x<=cfg.target;
  if(cfg.goal==='lt')return x<cfg.target;
  return x===cfg.target;
}
function vizTerminalState(x,cfg){
  if(cfg.maxWin!=null&&x>=cfg.target)return x<=cfg.maxWin?'win':'lose';
  if(vizGoalReached(x,cfg))return 'win';

}

  if(cfg.goal==='lte')return `победа при ≤ ${cfg.target}`;
  if(cfg.goal==='lt')return `победа при < ${cfg.target}`;

function collectEditsForExport(){
  // Сначала считываем актуальный код в открытом редакторе.
  // В интерфейсе один редактор, переключаемый между четырьмя вкладками; остальные три
  // варианта уже находятся в TASKS[].codes и не генерируются заново.
  document.querySelectorAll('#main .task[data-id] textarea[data-code-method]').forEach(editor=>{
    const card=editor.closest('.task[data-id]');
    const id=editor.dataset.taskId||card?.dataset.id;
    const task=TASKS.find(x=>String(x.id)===String(id))||TASKS.find(x=>String(x.id)===String(card?.dataset.id));
    const method=editor.dataset.codeMethod;
    if(!task||!CODE_METHODS.includes(method))return;
    if(!task.codes||typeof task.codes!=='object')task.codes={};
    task.codes[method]=String(editor.value??'');
  });

  // Считываем формы редактирования, даже если на кнопке «Сохранить изменения» ещё не нажали.
  document.querySelectorAll('#main .task[data-id]').forEach(card=>{
    const oldId=String(card.dataset.id);
    const task=TASKS.find(x=>String(x.id)===oldId);
    if(!task)return;
    const editForm=card.querySelector('.teacher-edit');
    if(editForm){
      const values={};
      editForm.querySelectorAll('[data-k]').forEach(el=>{values[el.dataset.k]=el.value});
      if(typeof values.title==='string')task.title=values.title;
      if(typeof values.desc==='string')task.desc=values.desc;
      if(typeof values.question==='string')task.question=values.question;
      if(typeof values.answer==='string')task.answer=values.answer;
      const newId=typeof values.id==='string'?values.id.trim():String(task.id);
      if(newId&&newId!==String(task.id)&&!TASKS.some(x=>x!==task&&String(x.id)===newId)){
        for(const sid of Object.keys(state.progressByStudent||{})){
          const progress=state.progressByStudent[sid];
          if(progress&&progress[String(task.id)]){progress[newId]=progress[String(task.id)];delete progress[String(task.id)];}
        }
        task.id=newId;
      }
      const after=typeof values.after==='string'?values.after:'';
      if(after){
        const targetIndex=TASKS.findIndex(x=>String(x.id)===after),currentIndex=TASKS.indexOf(task);
        if(targetIndex>=0&&currentIndex>=0&&targetIndex!==currentIndex){
          TASKS.splice(currentIndex,1);const adjustedTarget=TASKS.findIndex(x=>String(x.id)===after);
          if(adjustedTarget>=0)TASKS.splice(adjustedTarget+1,0,task);else TASKS.push(task);
        }
      }
    }
    const progress=ensure(task.id);
    const flags=[...card.querySelectorAll('.flags .flag')];
    if(flags.length>=3){progress.done=flags[0].classList.contains('on');progress.fav=flags[1].classList.contains('on');progress.dz=flags[2].classList.contains('on');}
    const comment=card.querySelector('.commentbox textarea');
    if(comment)progress.comment=String(comment.value??'');
  });

  // Сохраняем ровно два варианта, не генерируя код поверх пользовательских правок.
  for(const task of TASKS){
    const codes=(task.codes&&typeof task.codes==='object')?task.codes:{};
    task.codes={
      'Без комментариев':String(codes['Без комментариев']??''),
      'С комментариями':String(codes['С комментариями']??'')
    };
    task.methods=CODE_METHODS.slice();
  }
}

document.getElementById('saveApp').onclick=()=>{
  try{
    // Принудительно перенести код из живых редакторов и поля задач в снимок перед сериализацией.
    collectEditsForExport();
    save();

    const clone=document.documentElement.outerHTML;
    const taskPayload=JSON.stringify(TASKS).replace(/</g,'\\u003c');
    const a0=clone.indexOf('const TASKS=');
    const conditionPos=clone.indexOf('let conditionFont=',a0);
    if(!(a0>=0&&conditionPos>a0)){
      alert('Не удалось встроить данные задач в HTML. Файл не скачан — исходные данные сохранены в текущем сеансе.');
      return;
    }
    const metaStart=clone.indexOf('const TASK_META =',a0),metaEnd=clone.indexOf(';\nlet conditionFont=',metaStart);
    if(!(metaStart>a0&&metaEnd>metaStart)){alert('Не найдены метаданные задач. Файл не скачан.');return}
    const metaPayload=clone.slice(metaStart,metaEnd+1);
    let outHtml=clone.slice(0,a0)+'const TASKS='+taskPayload+';\n'+metaPayload+'\n'+clone.slice(conditionPos);

    // Встраиваем список учеников, прогресс, флажки, фильтры, выбор раздела и комментарии.
    const userPayload=JSON.stringify({students:state.students,current:state.current,filtersByStudent:state.filtersByStudent,sectionByStudent:state.sectionByStudent,difficultyByStudent:state.difficultyByStudent,progressByStudent:state.progressByStudent}).replace(/</g,'\\u003c');
    const stateStart=outHtml.indexOf('const INITIAL_USER_STATE=');

    if(!(stateStart>=0&&stateEnd>stateStart)){
      alert('Не удалось встроить список учеников и прогресс. Файл не скачан.');
      return;
    }
    outHtml=outHtml.slice(0,stateStart)+'const INITIAL_USER_STATE='+userPayload+';\n'+outHtml.slice(stateEnd);
    // Сохраняем текущий размер условия в самом HTML, а не во внешних настройках.
    outHtml=outHtml.replace(/let conditionFont='(?:small|medium|large)';/,'let conditionFont='+JSON.stringify(conditionFont)+';');

    const doc='<!doctype html>\n'+outHtml;
    const blob=new Blob([doc],{type:'text/html'}),a=document.createElement('a');
    const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z');
    const url=URL.createObjectURL(blob);
    a.href=url;
    a.download='zadanie25_информатика_'+stamp+'.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
  }catch(err){
    console.error('Ошибка сохранения приложения:',err);
    alert('Не удалось сохранить приложение: '+(err&&err.message?err.message:String(err)));
  }
};

   ИМПОРТ ЗАДАЧИ ИЗ JSON В ОКНО РЕДАКТИРОВАНИЯ

(function(){
  function normalizeImportedTask(raw){
    if(!raw || typeof raw !== 'object') return null;
    let src = raw.task || raw.data || raw;
    if(Array.isArray(src)) src = src[0];
    if(!src || typeof src !== 'object') return null;

    const pick = (...keys) => {
      for(const k of keys){
        if(src[k] !== undefined && src[k] !== null) return src[k];
      }
      return undefined;
    };

    const codesRaw = pick('codes','code','codesMap') || {};
    let codeNoComments = '';
    let codeWithComments = '';

    if(codesRaw && typeof codesRaw === 'object'){
      codeNoComments = String(
        codesRaw['Без комментариев'] ?? codesRaw['no_comments'] ??
        codesRaw['code_no_comments'] ?? codesRaw['plain'] ?? ''
      );
      codeWithComments = String(
        codesRaw['С комментариями'] ?? codesRaw['with_comments'] ??
        codesRaw['code_with_comments'] ?? codesRaw['commented'] ?? ''
      );
    }

    codeNoComments = String(pick('code1','codeNoComments','code_no_comments','codeWithoutComments') ?? codeNoComments);
    codeWithComments = String(pick('code2','codeWithComments','code_with_comments','codeCommented') ?? codeWithComments);

    const id = String(pick('id','number','num','taskId') ?? '').trim();
    const title = String(pick('title','name','heading') ?? '');
    const desc = String(pick('desc','condition','description','text','body') ?? '');
    const question = String(pick('question','q','prompt') ?? 'Решите задачу.');
    const answer = String(pick('answer','ans','result') ?? '');
    const section = String(pick('section','category','topic') ?? '');
    const difficulty = String(pick('difficulty','level','hardness') ?? 'yellow');

    return {
      id, title, desc, question, answer,
      section: ['','mask','divisors','factor','sum'].includes(section) ? section : '',
      difficulty: ['green','yellow','orange','red','black'].includes(difficulty) ? difficulty : 'yellow',
      code1: codeNoComments,
      code2: codeWithComments
    };
  }

  function applyImportedTaskToForm(pe, task){
    if(!pe || !task) return false;
    const setVal = (key, value) => {
      const el = pe.querySelector(`[data-k="${key}"]`);
      if(el) el.value = value ?? '';
    };
    setVal('id', task.id);
    setVal('title', task.title);
    setVal('desc', task.desc);
    setVal('question', task.question);
    setVal('answer', task.answer);
    setVal('section', task.section);
    setVal('difficulty', task.difficulty);

    const editors = pe.parentElement?.querySelectorAll('.codebox textarea[data-code-method]');
    if(editors && editors.length){
      editors.forEach(ta => {
        const m = ta.dataset.codeMethod;
        if(m === 'Без комментариев') ta.value = task.code1;
        if(m === 'С комментариями') ta.value = task.code2;
        ta.dispatchEvent(new Event('input', {bubbles:true}));
        ta.style.height='auto'; ta.style.height=Math.max(230, ta.scrollHeight+6)+'px';
      });
    }
    return true;
  }

  function openJsonImport(pe){
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;inset:0;z-index:400;background:#0009;display:flex;align-items:center;justify-content:center;padding:18px';
    wrap.innerHTML = `
      <div style="width:min(720px,96vw);background:#fff;border-radius:14px;padding:18px;box-shadow:0 12px 40px #0004;max-height:92vh;overflow:auto">
        <h3 style="margin:0 0 8px">📥 Вставить задачу из JSON</h3>
        <p style="margin:0 0 10px;color:#64748b;font-size:13px">Поддерживаются поля: id, title, desc, question, answer, section, difficulty, codes (или code1/code2). Можно вставить как «чистый» объект задачи, так и обёртку вида {"task": {...}}.</p>
        <textarea id="jsonImportInput" placeholder='{"id":"123","title":"...","desc":"...","question":"...","answer":"...","section":"mask","difficulty":"green","codes":{"Без комментариев":"...","С комментариями":"..."}}' style="width:100%;min-height:240px;border:1px solid #cbd7e6;border-radius:9px;padding:10px;font:13px/1.5 Consolas,monospace;resize:vertical"></textarea>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
          <button class="btn" id="jsonImportCancel">Отмена</button>
          <button class="btn purple" id="jsonImportFile">📂 Загрузить из файла</button>
          <button class="btn green" id="jsonImportApply">Применить</button>
        </div>
        <div id="jsonImportError" style="margin-top:10px;color:#b91c1c;font-weight:700;font-size:13px"></div>
        <input type="file" id="jsonImportFileInput" accept="application/json,.json,text/plain" hidden>
      </div>`;
    document.body.appendChild(wrap);

    const ta = wrap.querySelector('#jsonImportInput');
    const err = wrap.querySelector('#jsonImportError');
    const fileInput = wrap.querySelector('#jsonImportFileInput');
    wrap.querySelector('#jsonImportCancel').onclick = () => wrap.remove();
    wrap.addEventListener('click', e => { if(e.target === wrap) wrap.remove(); });

    wrap.querySelector('#jsonImportFile').onclick = () => fileInput.click();
    fileInput.onchange = () => {
      const f = fileInput.files[0];
      if(!f) return;
      const r = new FileReader();
      r.onload = () => { ta.value = String(r.result||''); };
      r.readAsText(f);
    };

    wrap.querySelector('#jsonImportApply').onclick = () => {
      err.textContent = '';
      let parsed;
      try{ parsed = JSON.parse(ta.value); }
      catch(e){ err.textContent = 'Ошибка разбора JSON: ' + e.message; return; }

      const task = normalizeImportedTask(parsed);
      if(!task){ err.textContent = 'Не удалось распознать объект задачи в JSON.'; return; }
      if(!task.id){ err.textContent = 'В JSON отсутствует поле id (номер задачи).'; return; }

      const idEl = pe.querySelector('[data-k="id"]');
      const currentId = idEl ? idEl.value : null;
      if(task.id !== currentId && TASKS.some(x => x.id === task.id)){
        err.textContent = 'Задача с номером «' + task.id + '» уже существует.';
        return;
      }

      applyImportedTaskToForm(pe, task);
      wrap.remove();
    };

    ta.focus();
  }

  const decorate = (pe) => {
    if(!pe || pe.dataset.jsonImportDecorated === '1') return;
    const card = pe.querySelector('.edit-modal-card');
    if(!card) return;

    const importBtn = document.createElement('button');
    importBtn.className = 'btn purple';
    importBtn.type = 'button';
    importBtn.textContent = '📥 Вставить JSON';
    importBtn.onclick = (ev) => { ev.stopPropagation(); openJsonImport(pe); };

    const existingSave = card.querySelector('.btn.green');
    if(existingSave){
      card.insertBefore(importBtn, existingSave);
    } else {
      card.appendChild(importBtn);
    }
    pe.dataset.jsonImportDecorated = '1';
  };

  const mo = new MutationObserver(muts => {
    for(const m of muts){
      for(const n of m.addedNodes){
        if(n.nodeType === 1){
          if(n.matches && n.matches('.teacher-edit')) decorate(n);
          if(n.querySelectorAll) n.querySelectorAll('.teacher-edit').forEach(decorate);
        }
      }
    }
  });
  mo.observe(document.body, {childList:true, subtree:true});
  document.querySelectorAll('.teacher-edit').forEach(decorate);
})();

</script>
</body></html>
