": "", "ask": "", "s": "CCA3EEGH12F2E1A1CF12CCHAGHD2GDGFA1CFHDB1BC", "ans": "14", "tpl": "from re import *\ns = 'CCA3EEGH12F2E1A1CF12CCHAGHD2GDGFA1CFHDB1BC'\nprint(len(s), set(s), s[:200])\npattern = r'⟦[0-9A-F]+⟧'\nl = findall(pattern, s)\nmaxs = max(l, key=len)\nprint(maxs, l)\nprint(len(maxs))", "methods": {"rx": "from re import *\ns = 'CCA3EEGH12F2E1A1CF12CCHAGHD2GDGFA1CFHDB1BC'\nprint(len(s), set(s), s[:200])\npattern = r'[0-9A-F]+'\nl = findall(pattern, s)\nmaxs = max(l, key=len)\nprint(maxs, l)\nprint(len(maxs))", "loops": "s = 'CCA3EEGH12F2E1A1CF12CCHAGHD2GDGFA1CFHDB1BC'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    return all(c in '0123456789ABCDEF' for c in ss)\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) > dl:\n            dl = len(ss)\nprint(dl)"}, "final": "[0-9A-F]+", "flags": "", "tree": [{"t": "[0-9A-F]+", "d": "повторить один или больше раз — жадно (как можно больше):", "c": [{"t": "[0-9A-F]", "d": "один символ из набора: от «0» до «9», от «A» до «F»"}]}], "groups": 0, "main": "rx", "norx": false, "d": 1, "alias": "", "realAns": "", "src2": "", "real": "Текстовый файл состоит из символов, обозначающих заглавные буквы латинского алфавита и цифры от 1 до 9 включительно. Определите в прилагаемом файле максимальное количество идущих подряд символов, которые могут представлять запись числа в шестнадцатеричной системе счисления.\nПримечание. Цифры, числовое значение которых превышает 9, обозначены латинскими буквами, начиная с буквы А.", "src": "Основная волна 20.06.23", "lvl": "Средний", "file": "https://kompege.ru/files/o7GIvUMYm.txt", "alts": []}, {"id": "13939", "blk": "R6", "role": "main", "like": "", "star": true, "title": "", "idea": "Количество подстрок: число может начинаться с ЛЮБОЙ ненулевой троичной цифры. С каждой такой позиции самое длинное троичное число даёт столько чисел, какова его длина (все его начала).", "note": "Регулярка с просмотром вперёд на файле .", "tr": "", "ask": "", "s": "4*303057297219032160+0*30212*0+7*0*8+019733", "ans": "19", "tpl": "from re import *\ns = '4*303057297219032160+0*30212*0+7*0*8+019733'\nprint(len(s), set(s), s[:200])\nnum = r'(?:0|[1-9]\\d*)'\npattern = rf'{num}(?:[+*]{num})*'\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + dl + 1, len(s) + 1):\n        ss = s[i:j]\n        if fullmatch(pattern, ss) and eval(ss) == 0:\n            dl = len(ss)\nprint(dl)", "methods": {"rx": "from re import *\ns = '4*303057297219032160+0*30212*0+7*0*8+019733'\nprint(len(s), set(s), s[:200])\nnum = r'(?:0|[1-9]\\d*)'\npattern = rf'{num}(?:[+*]{num})*'\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + dl + 1, len(s) + 1):\n        ss = s[i:j]\n        if fullmatch(pattern, ss) and eval(ss) == 0:\n            dl = len(ss)\nprint(dl)", "loops": "s = '4*303057297219032160+0*30212*0+7*0*8+019733'\nprint(len(s), set(s), s[:200])\nOPS, DIG = '+*', '0123456789'\ndef ok(ss):\n    if ss[0] in OPS or ss[-1] in OPS:\n        return False\n    for z in OPS:\n        ss = ss.replace(z, ' ')\n    parts = ss.split(' ')\n    return all(p != '' and (p == '0' or p[0] != '0') and all(c in DIG for c in p) for p in parts)\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and sum(c in OPS for c in ss) >= 0 and all(p[0] != '0' for p in ss.replace('*', '+').split('+') if p != '0')  and eval(ss) == 0:\n            dl = max(dl, len(ss))\nprint(dl)", "noeval": "from re import *\ns = '4*303057297219032160+0*30212*0+7*0*8+019733'\nprint(len(s), set(s), s[:200])\ndef calc(e):                    # без eval: + и * с приоритетом\n    r = 0\n    for part in e.split('+'):\n        p = 1\n        for x in part.split('*'):\n            p *= int(x)\n        r += p\n    return r\nnum = r'(?:0|[1-9]\\d*)'\npattern = rf'{num}(?:[+*]{num})*'\npattern = f'(?=({pattern}))'\ndl = 0\nfor m in findall(pattern, s):\n    for k in range(1, len(m) + 1):\n        ss = m[:k]\n        if ss[-1].isdigit() and calc(ss) == 0:\n            dl = max(dl, len(ss))\nprint(dl)"}, "final": "", "flags": "", "tree": [], "groups": 0, "main": "rx", "norx": false, "d": 3, "alias": "17641 = 17685", "realAns": "", "src2": "", "real": "Текстовый файл состоит из десятичных цифр, знаков \"+\" и \"*\" (сложения и умножения). Определите максимальное количество символов в непрерывной последовательности, являющейся корректным арифметическим выражением с целыми неотрицательными числами (без знака), значение которого равно нулю. В этом выражении никакие два знака арифметических операций не стоят рядом, порядок действий определяется по правилам математики. В записи чисел отсутствуют незначащие (ведущие) нули.\nВ ответе укажите количество символов.", "src": "Пересдача 08.07.26", "lvl": "Гроб", "file": "https://kompege.ru/files/UOR5WNvHt.txt", "alts": [], "rightTag": true}, {"id": "18147", "blk": "R6", "role": "main", "like": "", "star": false, "title": "", "idea": "", "note": "Числа положительные, поэтому самое длинное выражение с каждой позиции даёт самую большую сумму. eval не нужен: sum(int(x) for x in e.split('+')).", "tr": "", "ask": "", "s": "9+8**98*+99+7*8*+78+99+8*7789897+88*+8+9+***++778", "ans": "7789985", "tpl": "from re import *\ns = '9+8**98*+99+7*8*+78+99+8*7789897+88*+8+9+***++778'\nprint(len(s), set(s), s[:200])\npattern = r'⟦\\d+(?:\\+\\d+)+⟧'\npattern = f'(?=({pattern}))'\nl = findall(pattern, s)\nl = [⟦sum(int(x) for x in e.split('+'))⟧ for e in l]\nprint(l)\nprint(max(l))", "methods": {"rx": "from re import *\ns = '9+8**98*+99+7*8*+78+99+8*7789897+88*+8+9+***++778'\nprint(len(s), set(s), s[:200])\npattern = r'\\d+(?:\\+\\d+)+'\npattern = f'(?=({pattern}))'\nl = findall(pattern, s)\nl = [sum(int(x) for x in e.split('+')) for e in l]\nprint(l)\nprint(max(l))", "loops": "s = '9+8**98*+99+7*8*+78+99+8*7789897+88*+8+9+***++778'\nprint(len(s), set(s), s[:200])\nbest = 0\nfor i in range(len(s)):\n    for j in range(i + 3, len(s) + 1):\n        ss = s[i:j]\n        if ss[0].isdigit() and ss[-1].isdigit() and '++' not in ss and '*' not in ss and '+' in ss:\n            best = max(best, sum(int(x) for x in ss.split('+')))\nprint(best)", "ev": "from re import *\ns = '9+8**98*+99+7*8*+78+99+8*7789897+88*+8+9+***++778'\nprint(len(s), set(s), s[:200])\npattern = r'\\d+(?:\\+\\d+)+'\npattern = f'(?=({pattern}))'\nl = findall(pattern, s)\nl = [eval(e) for e in l]                  # eval посчитает сумму сам\nprint(l)\nprint(max(l))"}, "final": "(?=(\\d+(?:\\+\\d+)+))", "flags": "", "tree": [{"t": "(?=(\\d+(?:\\+\\d+)+))", "d": "просмотр вперёд: дальше ДОЛЖНО идти следующее (символы не забираются, позиция не сдвигается):", "c": [{"t": "(\\d+(?:\\+\\d+)+)", "g": 1, "d": "ГРУППА №1 — запоминает совпавший кусок: его вернёт findall, m.group(1), на него ссылается \\1", "c": [{"t": "\\d+", "d": "повторить один или больше раз — жадно (как можно больше):", "c": [{"t": "\\d", "d": "любая цифра 0–9"}]}, {"t": "(?:\\+\\d+)+", "d": "повторить один или больше раз — жадно (как можно больше):", "c": [{"t": "\\+", "d": "символ «+»"}, {"t": "\\d+", "d": "повторить один или больше раз — жадно (как можно больше):", "c": [{"t": "\\d", "d": "любая цифра 0–9"}]}]}]}]}], "groups": 1, "main": "rx", "norx": false, "d": 2, "alias": "", "realAns": "", "src2": "", "real": "(В. Колчев) Текстовый файл состоит из символов, обозначающих знаки « + », « * » и цифры 7, 8, 9.\nОпределите максимальное значение, которое является результатом вычисления непрерывной последовательности, являющейся корректным арифметическим выражением из нескольких целых неотрицательных чисел, между которыми отсутствует операция умножения.\nВ этом выражении никакие два знака арифметических операций не стоят рядом.", "src": "", "lvl": "Средний", "file": "https://kompege.ru/files/nOE71D3tL.txt", "alts": []}, {"id": "19884", "blk": "R6", "role": "main", "like": "", "star": true, "title": "", "idea": "Считаем КОЛИЧЕСТВО выражений, поэтому начинать можно с любой цифры строки — не только там, где начинается самое длинное. С каждой позиции регулярка даёт самое длинное выражение, а все его начала, где есть знак и в конце цифра, — тоже выражения.", "note": "На большом файле перебор всех начал медленный. Способ «📈 ДП с конца»: E[i] — сколько выражений (и чисел) начинается в позиции i; число в начале — любое начало серии цифр (или одиночный 0), а продолжение после знака берём готовым из E.", "tr": "", "ask": "", "s": "*770089908876*567-8**09-30-7-68*8*98986809707*9960", "ans": "199", "tpl": "from re import *\ns = '*770089908876*567-8**09-30-7-68*8*98986809707*9960'\nprint(len(s), set(s), s[:200])\nnum = r'⟦(?:0|[1-9]\\d*)⟧'\npattern = rf'⟦{num}(?:[\\-*]{num})+⟧'\npattern = f'(?=({pattern}))'\nk = 0\nfor m in findall(pattern, s):\n    for j in range(1, len(m) + 1):\n        ss = m[:j]\n        if ss[-1].isdigit() and ⟦search(r'[-*]', ss)⟧:\n            k += 1\nprint(k)", "methods": {"rx": "from re import *\ns = '*770089908876*567-8**09-30-7-68*8*98986809707*9960'\nprint(len(s), set(s), s[:200])\nnum = r'(?:0|[1-9]\\d*)'\npattern = rf'{num}(?:[\\-*]{num})+'\npattern = f'(?=({pattern}))'\nk = 0\nfor m in findall(pattern, s):\n    for j in range(1, len(m) + 1):\n        ss = m[:j]\n        if ss[-1].isdigit() and search(r'[-*]', ss):\n            k += 1\nprint(k)", "loops": "s = '*770089908876*567-8**09-30-7-68*8*98986809707*9960'\nprint(len(s), set(s), s[:200])\nOPS, DIG = '-*', '0123456789'\ndef ok(ss):\n    if ss[0] in OPS or ss[-1] in OPS:\n        return False\n    for z in OPS:\n        ss = ss.replace(z, ' ')\n    parts = ss.split(' ')\n    return all(p != '' and (p == '0' or p[0] != '0') and all(c in DIG for c in p) for p in parts)\nk = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and any(c in OPS for c in ss):\n            k += 1\nprint(k)", "dp": "s = '*770089908876*567-8**09-30-7-68*8*98986809707*9960'\nprint(len(s), set(s), s[:200])\nOPS = '-*'\nn = len(s)\ndig = [0] * (n + 1)                 # dig[i] — сколько цифр подряд, начиная с i\nfor i in range(n - 1, -1, -1):\n    dig[i] = dig[i + 1] + 1 if s[i].isdigit() else 0\nE = [0] * (n + 2)                   # E[i] — сколько выражений (и одиночных чисел) начинается в i\nk = 0\nfor i in range(n - 1, -1, -1):\n    if not s[i].isdigit():\n        continue\n    if s[i] == '0':\n        tok, end = 1, i + 1         # число 0 — только из одной цифры\n    else:\n        tok, end = dig[i], i + dig[i]   # первое число — любое начало серии цифр\n    nxt = 0\n    if end + 1 < n and s[end] in OPS and s[end + 1].isdigit():\n        nxt = E[end + 1]            # после знака — любое выражение, начатое за ним\n    E[i] = tok + nxt\n    k += nxt                        # выражения хотя бы с одним знаком\nprint(k)"}, "final": "(?=((?:0|[1-9]\\d*)(?:[\\-*](?:0|[1-9]\\d*))+))", "flags": "", "tree": [{"t": "(?=((?:0|[1-9]\\d*)(?:[\\-*](?:0|[1-9]\\d*))+))", "d": "просмотр вперёд: дальше ДОЛЖНО идти следующее (символы не забираются, позиция не сдвигается):", "c": [{"t": "((?:0|[1-9]\\d*)(?:[\\-*](?:0|[1-9]\\d*))+)", "g": 1, "d": "ГРУППА №1 — запоминает совпавший кусок: его вернёт findall, m.group(1), на него ссылается \\1", "c": [{"t": "(?:0|[1-9]\\d*)", "d": "ИЛИ — подходит один из 2 вариантов (проверяются слева направо, берётся первый подошедший):", "c": [{"t": "0", "d": "вариант 1", "c": [{"t": "0", "d": "символ «0»"}]}, {"t": "[1-9]\\d*", "d": "вариант 2", "c": [{"t": "[1-9]", "d": "один символ: от «1» до «9»"}, {"t": "\\d*", "d": "повторить ноль или больше раз — жадно (как можно больше):", "c": [{"t": "\\d", "d": "любая цифра 0–9"}]}]}]}, {"t": "(?:[\\-*](?:0|[1-9]\\d*))+", "d": "повторить один или больше раз — жадно (как можно больше):", "c": [{"t": "[\\-*]", "d": "один символ из набора: «-», «*»"}, {"t": "(?:0|[1-9]\\d*)", "d": "ИЛИ — подходит один из 2 вариантов (проверяются слева направо, берётся первый подошедший):", "c": [{"t": "0", "d": "вариант 1", "c": [{"t": "0", "d": "символ «0»"}]}, {"t": "[1-9]\\d*", "d": "вариант 2", "c": [{"t": "[1-9]", "d": "один символ: от «1» до «9»"}, {"t": "\\d*", "d": "повторить ноль или больше раз — жадно (как можно больше):", "c": [{"t": "\\d", "d": "любая цифра 0–9"}]}]}]}]}]}]}], "groups": 1, "main": "rx", "norx": false, "d": 4, "alias": "", "realAns": "", "src2": "", "real": "(Л. Шастин) Текстовый файл состоит из цифр 0, 6, 7, 8, 9 и знаков арифметических операций «–» и «*» (вычитание и умножение). Определите количество непрерывных подпоследовательностей в этом файле, которые являются корректными арифметическими выражениями с целыми неотрицательными числами.\nВ таких выражениях никакие два знака арифметических операций не должны стоять рядом, а в записи чисел должны отсутствовать незначащие (ведущие) нули. В ответе укажите количество подходящих подпоследовательностей.\nНапример, в строке *567-8**09-30- есть следующие корректные арифметические выражения: 567-8, 67-8, 7-8, 9-3 и 9-30. Ответ: 5.\nПримечание. Отдельно стоящие числа арифметическими выражениями не считать. Число 0 не имеет знака.", "src": "", "lvl": "Средний", "file": "https://kompege.ru/files/AvgZjiADD.txt", "alts": [], "rightTag": true}, {"id": "18239", "blk": "R6", "role": "main", "like": "", "star": true, "title": "", "idea": "Числа отрывать нельзя — берём их целиком через finditer. Начинать можно с ЛЮБОГО числа: самое длинное выражение может иметь слишком маленькое значение, а короче и правее — подойти. Поэтому перебираем начало i и конец j.", "note": "Здесь нельзя «взять самое длинное и проверить». Значение выражения 100-1-1-…-999 падает с каждым вычитанием; самое длинное выражение может не пройти, а его кусок, начатый с другого числа, — пройти. Поэтому два цикла по номерам чисел, значение считаем по ходу.", "tr": "в учебной строке граница −20000 та же, числа короче", "ask": "", "s": "38934477-42371-6223-451-2-399-9999-9999-9999-791", "ans": "48", "tpl": "from re import *\ns = '38934477-42371-6223-451-2-399-9999-9999-9999-791'\nprint(len(s), set(s), s[:200])\nl = list(finditer(r'\\d+', s))\ndl = 0\nfor i in range(len(l)):\n    for j in range(i, len(l)):\n        ss = s[l[i].start():l[j].end()]\n        if not fullmatch(r'\\d+(?:-\\d+)*', ss):\n            break\n        if len(ss) > dl and eval(ss) > -20000:\n            dl = len(ss)\nprint(dl)", "methods": {"rx": "from re import *\ns = '38934477-42371-6223-451-2-399-9999-9999-9999-791'\nprint(len(s), set(s), s[:200])\nl = list(finditer(r'\\d+', s))\ndl = 0\nfor i in range(len(l)):\n    for j in range(i, len(l)):\n        ss = s[l[i].start():l[j].end()]\n        if not fullmatch(r'\\d+(?:-\\d+)*', ss):\n            break\n        if len(ss) > dl and eval(ss) > -20000:\n            dl = len(ss)\nprint(dl)", "loops": "s = '38934477-42371-6223-451-2-399-9999-9999-9999-791'\nprint(len(s), set(s), s[:200])\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ss[0].isdigit() and ss[-1].isdigit() and (i == 0 or not s[i-1].isdigit()) and (j == len(s) or not s[j].isdigit()) and '--' not in ss:\n            p = ss.split('-')\n            v = int(p[0]) - sum(int(x) for x in p[1:])\n            if v > -20000:\n                dl = max(dl, len(ss))\nprint(dl)"}, "final": "", "flags": "", "tree": [], "groups": 0, "main": "rx", "norx": false, "d": 4, "alias": "", "realAns": "", "src2": "", "real": "(Д. Бахтиев) Текстовый файл содержит цифры от 1 до 9 и знак арифметической операции «-» (вычитание). Определите максимальное количество символов в непрерывной последовательности, которая является корректным арифметическим выражением с целыми числами, чьё значение превышает -2000020000 (минус двадцать тысяч). Запрещается отрывать цифры от чисел, но разрешается брать их без знака. Например, в строке -23-456-789 нельзя взять выражение -456-78, но можно взять 23-456.\nВ ответе укажите количество символов.", "src": "", "lvl": "Сложный", "file": "https://kompege.ru/files/ZT1fEfX5Pi.txt", "alts": [], "rightTag": true}, {"id": "19149", "blk": "RS", "role": "hw", "like": "27069", "star": true, "title": "", "idea": "", "note": "Скобки регулярка не проверит (вложенность). Два цикла, а проверку корректности оставляем Python: fullmatch пропускает только цифры, скобки и +, потом eval без встроенных функций.", "tr": "", "ask": "", "s": "3(2)(1+2)+(3+(2+(4+3))434+)334)34+)233212)(4))()", "ans": "3", "tpl": "from re import *\ns = '3(2)(1+2)+(3+(2+(4+3))434+)334)34+)233212)(4))()'\nprint(len(s), set(s), s[:200])\ndef ok(e):\n    if '++' in e or '(+' in e or '+)' in e or '()' in e or ')(' in e:\n        return False\n    if not fullmatch(r'[0-9+()]+', e):\n        return False\n    try:\n        return eval(e, {\"__builtins__\": {}}) % 2 == 0\n    except Exception:\n        return False\ndl = 0\nfor i in range(len(s)):\n    if s[i] != '(':\n        continue\n    for j in range(i + 2, len(s) + 1):\n        if s[j-1] == ')' and ⟦ok(s[i:j])⟧:\n            dl = max(dl, j - i)\nprint(dl)", "methods": {"loops": "s = '3(2)(1+2)+(3+(2+(4+3))434+)334)34+)233212)(4))()'\nprint(len(s), set(s), s[:200])\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 2, len(s) + 1):\n        e = s[i:j]\n        if e[0] == '(' and e[-1] == ')' and '++' not in e and '(+' not in e and '+)' not in e and '()' not in e and ')(' not in e:\n            try:\n                if eval(e) % 2 == 0:\n                    dl = max(dl, j - i)\n            except Exception:\n                pass\nprint(dl)"}, "final": "", "flags": "", "tree": [], "groups": 0, "main": "loops", "norx": true, "d": 5, "alias": "", "realAns": "", "src2": "", "real": "(В. Лашин) Текстовый файл состоит из символов ')', '(', знака '+' и цифр 1, 2, 3, 4. Определите максимальное количество символов в непрерывной последовательности, начинающихся с символа '(' и кончающихся символом ')', при этом последовательность является математически корректной и её значение кратно 2.\nВ этом выражении никакие два знака арифметических операций не стоят рядом, в начале и в конце математической последовательности не может стоять знак '+'.\nВ ответе укажите количество символов.", "src": "", "lvl": "Гроб", "file": "https://kompege.ru/files/2mhhaHRMtr.txt", "alts": []}, {"id": "7999п", "blk": "R6", "role": "main", "like": "", "star": true, "title": "", "idea": "Цепочка — это число, а дальше сколько угодно раз «= число»: \\d+(?:=\\d+)*. Нужное число ищем внутри цепочки: e.split('='). Хорошее число можно и «вырезать» из более длинного — но тогда цепочка по эту сторону обрывается.", "note": "Если хорошее число — целое число цепочки, подходит вся цепочка. Если оно вырезано из числа, то влево цепочка продолжается, только когда вырез начинается с начала числа, а вправо — когда он доходит до конца числа. Проверено двумя циклами по всем подстрокам.", "tr": "", "ask": "", "s": "60=5269950=1000==1009=3305094=7919=6==4737600=887", "ans": "19", "tpl": "from re import *\ns = '60=5269950=1000==1009=3305094=7919=6==4737600=887'\nprint(len(s), set(s), s[:200])\npattern = r'⟦\\d+(?:=\\d+)*⟧'\ndef good(x):\n    return ⟦len(x) == 4 and all(int(x) % k for k in range(2, int(int(x) ** 0.5) + 1)) and int(x) > 1⟧\nN = 4                                  # сколько цифр в нужном числе\nl = findall(pattern, s)\ndl = 0\nfor e in l:\n    p = e.split('=')\n    for k in range(len(p)):\n        x = p[k]\n        for a in range(len(x) - N + 1):        # число можно вырезать из края\n            if good(x[a:a+N]):\n                L = '='.join(p[:k]) + '=' if a == 0 and k > 0 else ''\n                R = '=' + '='.join(p[k+1:]) if a + N == len(x) and k < len(p) - 1 else ''\n                dl = max(dl, len(L) + N + len(R))\nprint(dl)", "methods": {"rx": "from re import *\ns = '60=5269950=1000==1009=3305094=7919=6==4737600=887'\nprint(len(s), set(s), s[:200])\npattern = r'\\d+(?:=\\d+)*'\ndef good(x):\n    return len(x) == 4 and all(int(x) % k for k in range(2, int(int(x) ** 0.5) + 1)) and int(x) > 1\nN = 4                                  # сколько цифр в нужном числе\nl = findall(pattern, s)\ndl = 0\nfor e  "Средний", "file": "https://kompege.ru/files/UgdvYqcjC.txt", "alts": []}, {"id": "20909", "blk": "RW", "role": "hw", "like": "21717", "star": false, "title": "", "idea": "", "note": "Регулярки — неподходящий способ: нужно «ровно K вхождений», а шаблон вхождения не считает. Режем строку по слову: между K+1 соседними кусками лежат K слов.", "tr": "в учебной строке — ровно 3 раза (в файле — 100)", "ask": "", "s": "BBFFCBAABEEFFBAAEDAABABDCBFEAECABBEBCBDFABBA", "ans": "33", "tpl": "s = 'BBFFCBAABEEFFBAAEDAABABDCBFEAECABBEBCBDFABBA'\nprint(len(s), set(s), s[:200])\nw = 'AB'\nK = 3\nl = s.split(w)\ndl = 0\nfor i in range(len(l) - K):\n    d = sum(len(x) for x in l[i:i+K+1]) + K * len(w)\n    if i > 0:\n        d += ⟦len(w) - 1⟧\n    if i + K + 1 < len(l):\n        d += len(w) - 1\n    dl = max(dl, d)\nprint(dl)", "methods": {"split": "s = 'BBFFCBAABEEFFBAAEDAABABDCBFEAECABBEBCBDFABBA'\nprint(len(s), set(s), s[:200])\nw = 'AB'\nK = 3\nl = s.split(w)\ndl = 0\nfor i in range(len(l) - K):\n    d = sum(len(x) for x in l[i:i+K+1]) + K * len(w)\n    if i > 0:\n        d += len(w) - 1\n    if i + K + 1 < len(l):\n        d += len(w) - 1\n    dl = max(dl, d)\nprint(dl)", "loops": "s = 'BBFFCBAABEEFFBAAEDAABABDCBFEAECABBEBCBDFABBA'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    return ss.count('AB') == 3\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) > dl:\n            dl = len(ss)\nprint(dl)"}, "final": "", "flags": "", "tree": [], "groups": 0, "main": "split", "norx": true, "d": 2, "alias": "", "realAns": "", "src2": "", "real": "Текстовый файл состоит из заглавных букв латинского алфавита A, B, C, D, E и F.\nОпределите в прилагаемом файле максимальное количество идущих подряд символов, среди которых пара AB (в указанном порядке) встречается ровно 100 раз.", "src": "Апробация 05.03.25", "lvl": "Средний", "file": "https://kompege.ru/files/BLJmfsrxrF.txt", "alts": []}, {"id": "28765", "blk": "RW", "role": "hw", "like": "21717", "star": false, "title": "", "idea": "", "note": "«Не более K» для максимума — то же, что «ровно K» (если слов в строке больше K). Если их меньше — подходит вся строка.", "tr": "в учебной строке — не более 3 раз (в файле — 180)", "ask": "", "s": "BFABBAEECDBEDFBCAAFBAEECFCABCBCDCFFBCCBCDBCCAAEFBCBE", "ans": "36", "tpl": "s = 'BFABBAEECDBEDFBCAAFBAEECFCABCBCDCFFBCCBCDBCCAAEFBCBE'\nprint(len(s), set(s), s[:200])\nw = 'BC'\nK = 3\nl = s.split(w)\nif len(l) <= K + 1:\n    print(len(s))\nelse:\n    dl = 0\n    for i in range(len(l) - K):\n        d = sum(len(x) for x in l[i:i+K+1]) + K * len(w)\n        if i > 0:\n            d += len(w) - 1\n        if i + K + 1 < len(l):\n            d += len(w) - 1\n        dl = max(dl, d)\n    print(⟦dl⟧)", "methods": {"split": "s = 'BFABBAEECDBEDFBCAAFBAEECFCABCBCDCFFBCCBCDBCCAAEFBCBE'\nprint(len(s), set(s), s[:200])\nw = 'BC'\nK = 3\nl = s.split(w)\nif len(l) <= K + 1:\n    print(len(s))\nelse:\n    dl = 0\n    for i in range(len(l) - K):\n        d = sum(len(x) for x in l[i:i+K+1]) + K * len(w)\n        if i > 0:\n            d += len(w) - 1\n        if i + K + 1 < len(l):\n            d += len(w) - 1\n        dl = max(dl, d)\n    print(dl)", "loops": "s = 'BFABBAEECDBEDFBCAAFBAEECFCABCBCDCFFBCCBCDBCCAAEFBCBE'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    return ss.count('BC') <= 3\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) > dl:\n            dl = len(ss)\nprint(dl)"}, "final": "", "flags": "", "tree": [], "groups": 0, "main": "split", "norx": true, "d": 3, "alias": "", "realAns": "", "src2": "", "real": "Текстовый файл состоит из заглавных букв латинского алфавита A, B, C, D, E и F.\nОпределите максимальное количество идущих подряд символов в прилагаемом файле, среди которых пара символов BС (в указанном порядке) встречается не более 180 раз.", "src": "Досрочная волна 2026", "lvl": "Базовый", "file": "https://kompege.ru/files/j3nY4l4vsY.txt", "alts": []}, {"id": "21717", "blk": "RW", "role": "main", "like": "", "star": false, "title": "", "idea": "Самый короткий кусок начинается в начале i-го RSQ и кончается в конце (i+K−1)-го. Но кончаться на Q нельзя — добавляем символы справа, пока последний — Q.", "note": "Минимум: K−1 кусок между словами + K слов. Края не мешают — окно начинается и кончается на слове.", "tr": "в учебной строке — ровно 3 раза (в файле — 130)", "ask": "", "s": "FQFRFRGGRFWFRFRRSQFWQQRSQRWGWGSRSGWFWGFSSRSQFW", "ans": "30", "tpl": "from re import *\ns = 'FQFRFRGGRFWFRFRRSQFWQQRSQRWGWGSRSGWFWGFSSRSQFW'\nprint(len(s), set(s), s[:200])\nw = 'RSQ'\nK = 3\np = [m.start() for m in finditer(w, s)]\ndl = len(s) + 1\nfor i in range(len(p) - K + 1):\n    a, b = p[i], p[i+K-1] + len(w)      # от первого слова до конца K-го\n    while b < len(s) and s[b-1] == 'Q':  # не должно кончаться на Q\n        b += 1\n    if s[b-1] != 'Q':\n        dl = min(dl, ⟦b - a⟧)\nprint(dl)", "methods": {"split": "s = 'FQFRFRGGRFWFRFRRSQFWQQRSQRWGWGSRSGWFWGFSSRSQFW'\nprint(len(s), set(s), s[:200])\nw = 'RSQ'\nK = 3\nl = s.split(w)\ndl = len(s) + 1\nfor i in range(1, len(l) - K + 1):\n    d = sum(len(x) for x in l[i:i+K-1]) + K * len(w)   # K-1 кусок внутри + K слов\n    nxt = l[i+K-1]                                     # кусок справа\n    q = len(nxt) - len(nxt.lstrip('Q'))\n    if q < len(nxt) or i + K - 1 < len(l) - 1:   # после Q есть другая буква\n        dl = min(dl, d + q + 1)\nprint(dl)", "loops": "s = 'FQFRFRGGRFWFRFRRSQFWQQRSQRWGWGSRSGWFWGFSSRSQFW'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    return ss.count('RSQ') == 3 and ss[-1] != 'Q'\ndl = len(s) + 1\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) < dl:\n            dl = len(ss)\nprint(dl)"}, "final": "", "flags": "", "tree": [], "groups": 0, "main": "split", "norx": true, "d": 3, "alias": "", "realAns": "", "src2": "", "real": "Текстовый файл состоит из символов F, G, Q, R, S и W. Определите в этом файле минимальное количество идущих подряд символов, среди которых подстрока RSQ встречается ровно 130 раз, при этом искомая последовательность не оканчивается символом Q.", "src": "ЕГКР 19.04.25", "lvl": "Средний", "file": "https://kompege.ru/files/PpYYb3sP_r.txt", "alts": []}, {"id": "31230", "blk": "RW", "role": "hw", "like": "21717", "star": false, "title": "", "idea": "", "note": "Самое короткое окно и так кончается на C — последней букве ABC.", "tr": "в учебной строке — ровно 3 раза (в файле — 110)", "ask": "", "s": "ABAEACAAABCEBFFAAAABCBCECBBFAFBBAEDCCBBBBCAECABC", "ans": "40", "tpl": "s = 'ABAEACAAABCEBFFAAAABCBCECBBFAFBBAEDCCBBBBCAECABC'\nprint(len(s), set(s), s[:200])\nw = 'ABC'\nK = 3\nl = s.split(w)\ndl = len(s) + 1\nfor i in range(1, len(l) - K + 1):\n    d = sum(len(x) for x in l[i:i+K-1]) + ⟦K * len(w)⟧\n    dl = min(dl, d)\nprint(dl)", "methods": {"split": "s = 'ABAEACAAABCEBFFAAAABCBCECBBFAFBBAEDCCBBBBCAECABC'\nprint(len(s), set(s), s[:200])\nw = 'ABC'\nK = 3\nl = s.split(w)\ndl = len(s) + 1\nfor i in range(1, len(l) - K + 1):\n    d = sum(len(x) for x in l[i:i+K-1]) + K * len(w)\n    dl = min(dl, d)\nprint(dl)", "loops": "s = 'ABAEACAAABCEBFFAAAABCBCECBBFAFBBAEDCCBBBBCAECABC'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    return ss.count('ABC') == 3 and ss[-1] == 'C'\ndl = len(s) + 1\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) < dl:\n            dl = len(ss)\nprint(dl)"}, "final": "", "flags": "", "tree": [], "groups": 0, "main": "split", "norx": true, "d": 2, "alias": "", "realAns": "", "src2": "", "real": "Текстовый файл состоит из заглавных букв латинского алфавита А, В, С, D, Е и F. Определите в прилагаемом файле минимальное количество идущих подряд символов, среди которых тройка букв АВС (в указанном порядке) встречается ровно 110 раз, при этом искомая последовательность заканчивается буквой С. В ответе запишите число - количество символов в найденной последовательности.", "src": "Резерв 22.06.26", "lvl": "Средний", "file": "https://kompege.ru/files/KawiFKeeq.txt", "alts": []}, {"id": "9169", "blk": "RW", "role": "hw", "like": "21717", "star": false, "title": "", "idea": "", "note": "Слов два — режем split из модуля re по шаблону BAD|FAT; дальше как с одним словом.", "tr": "", "ask": "", "s": "BABDTBTDDDDDTTBAZZATTTTBADTBAFTFATFBTZTDDBAFBADZ", "ans": "24", "tpl": "from re import *\ns = 'BABDTBTDDDDDTTBAZZATTTTBADTBAFTFATFBTZTDDBAFBADZ'\nprint(len(s), set(s), s[:200])\nK = 3\nl = split(r'⟦BAD|FAT⟧', s)             # split из модуля re: режем по шаблону\ndl = len(s) + 1\nfor i in range(1, len(l) - K + 1):\n    dl = min(dl, sum(len(x) for x in l[i:i+K-1]) + K * 3)\nprint(dl)", "methods": {"split": "from re import *\ns = 'BABDTBTDDDDDTTBAZZATTTTBADTBAFTFATFBTZTDDBAFBADZ'\nprint(len(s), set(s), s[:200])\nK = 3\nl = split(r'BAD|FAT', s)             # split из модуля re: режем по шаблону\ndl = len(s) + 1\nfor i in range(1, len(l) - K + 1):\n    dl = min(dl, sum(len(x) for x in l[i:i+K-1]) + K * 3)\nprint(dl)", "loops": "s = 'BABDTBTDDDDDTTBAZZATTTTBADTBAFTFATFBTZTDDBAFBADZ'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    return sum(ss[k:k+3] in ('BAD', 'FAT') for k in range(len(ss) - 2)) == 3\ndl = len(s) + 1\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) < dl:\n            dl = len(ss)\nprint(dl)"}, "final": "", "flags": "", "tree": [], "groups": 0, "main": "split", "norx": true, "d": 3, "alias": "6651п", "realAns": "10", "src2": "", "real": "В файле содержится строка длиной не более 10⁶ из букв английского алфавита. Определите минимальную длину подстроки, в которой ровно три тройки BAD или FAT.\nНапример, в строке SDFATFDBADZZSFATBADGHTBAD есть три подходящие подстроки FATFDBADZZSFAT, BADZZSFATBAD и FATBADGHTBAD. Минимальная длина 12.", "src": "Джобс 06.06.2023", "lvl": "Сложный", "file": "https://kompege.ru/files/3ioHBrX2_.txt", "alts": []}, {"id": "7356", "blk": "RW", "role": "hw", "like": "21717", "star": false, "title": "", "idea": "", "note": "Пары «согласная + гласная» не налезают друг на друга, поэтому split по шаблону работает.", "tr": "в учебной строке — не более 2 пар (в файле — 5)", "ask": "", "s": "OFDDFODFAOAOCOCFFAOADAOAOADDFFDCAAADACFFDDDOODCOC", "ans": "22", "tpl": "from re import *\ns = 'OFDDFODFAOAOCOCFFAOADAOAOADDFFDCAAADACFFDDDOODCOC'\nprint(len(s), set(s), s[:200])\nK = 2\nl = split(r'⟦[CDF][AO]⟧', s)\nif len(l) <= K + 1:\n    print(len(s))\nelse:\n    dl = 0\n    for i in range(len(l) - K):\n        d = sum(len(x) for x in l[i:i+K+1]) + K * 2\n        if i > 0:\n            d += 1\n        if i + K + 1 < len(l):\n            d += 1\n        dl = max(dl, d)\n    print(dl)", "methods": {"split": "from re import *\ns = 'OFDDFODFAOAOCOCFFAOADAOAOADDFFDCAAADACFFDDDOODCOC'\nprint(len(s), set(s), s[:200])\nK = 2\nl = split(r'[CDF][AO]', s)\nif len(l) <= K + 1:\n    print(len(s))\nelse:\n    dl = 0\n    for i in range(len(l) - K):\n        d = sum(len(x) for x in l[i:i+K+1]) + K * 2\n        if i > 0:\n            d += 1\n        if i + K + 1 < len(l):\n            d += 1\n        dl = max(dl, d)\n    print(dl)", "loops": "s = 'OFDDFODFAOAOCOCFFAOADAOAOADDFFDCAAADACFFDDDOODCOC'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    return sum(ss[k] in 'CDF' and ss[k+1] in 'AO' for k in range(len(ss) - 1)) <= 2\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) > dl:\n            dl = len(ss)\nprint(dl)"}, "final": "", "flags": "", "tree": [], "groups": 0, "main": "split", "norx": true, "d": 3, "alias": "", "realAns": "", "src2": "", "real": "(Л. Шастин) Текстовый файл состоит из символов A, C, D, F и O. \nОпределите максимальное количество идущих подряд символов, среди которых не более 5 пар вида \nсогласная + гласная  в прилагаемом файле.", "src": "", "lvl": "Средний", "file": "https://kompege.ru/files/Qul_gD19y.txt", "alts": []}, {"id": "19489", "blk": "RW", "role": "hw", "like": "21717", "star": true, "title": "", "idea": "", "note": "Твой приём: сначала заменой режем строку по запрету WSFWW, потом в каждом куске — окна по WWF.", "tr": "в учебной строке — WWF не более 2 раз (в файле — 120)", "ask": "", "s": "WFFSSFFWWFWFWWFSSFSFFFWWFWFFSFSWFWFWSWSFFWWF", "ans": "35", "tpl": "s = 'WFFSSFFWWFWFWWFSSFSFFFWWFWFFSFSWFWFWSWSFFWWF'\nprint(len(s), set(s), s[:200])\nwhile 'WSFWW' in s:\n    s = s.replace('WSFWW', 'WSFW SFWW')   # разрезаем запрет пробелом\nK = 2\nw = 'WWF'\ndl = 0\nfor part in s.split():\n    l = part.split(w)\n    if len(l) <= K + 1:\n        dl = max(dl, len(part))\n        continue\n    for i in range(len(l) - K):\n        d = sum(len(x) for x in l[i:i+K+1]) + K * len(w)\n        if i > 0:\n            d += len(w) - 1\n        if i + K + 1 < len(l):\n            d += ⟦len(w) - 1⟧\n        dl = max(dl, d)\nprint(dl)", "methods": {"split": "s = 'WFFSSFFWWFWFWWFSSFSFFFWWFWFFSFSWFWFWSWSFFWWF'\nprint(len(s), set(s), s[:200])\nwhile 'WSFWW' in s:\n    s = s.replace('WSFWW', 'WSFW SFWW')   # разрезаем запрет пробелом\nK = 2\nw = 'WWF'\ndl = 0\nfor part in s.split():\n    l = part.split(w)\n    if len(l) <= K + 1:\n        dl = max(dl, len(part))\n        continue\n    for i in range(len(l) - K):\n        d = sum(len(x) for x in l[i:i+K+1]) + K * len(w)\n        if i > 0:\n            d += len(w) - 1\n        if i + K + 1 < len(l):\n            d += len(w) - 1\n        dl = max(dl, d)\nprint(dl)", "loops": "s = 'WFFSSFFWWFWFWWFSSFSFFFWWFWFFSFSWFWFWSWSFFWWF'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    return ss.count('WWF') <= 2 and 'WSFWW' not in ss\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) > dl:\n            dl = len(ss)\nprint(dl)"}, "final": "", "flags": "", "tree": [], "groups": 0, "main": "split", "norx": true, "d": 4, "alias": "", "realAns": "", "src2": "", "real": "(Л. Шастин) Текстовый файл состоит из символов F, S и W. Определите в прилагаемом файле максимальное количество идущих подряд символов, среди которых подстрока WWF встречается не более 120 раз, а подстрока WSFWW не встречается совсем.", "src": "", "lvl": "Средний", "file": "https://kompege.ru/files/Ho58arSQh.txt", "alts": []}, {"id": "12476", "blk": "RW", "role": "hw", "like": "21717", "star": true, "title": "", "idea": "", "note": "Запреты ORO и ROR убираем заменами-разрезами, дальше окна по RO в каждом куске.", "tr": "в учебной строке — RO ровно 2 раза (в файле — 21)", "ask": "", "s": "EROEOROGGGEGEPGPGEREEPRRGRRRORGEOPOREEPROPPRE", "ans": "24", "tpl": "s = 'EROEOROGGGEGEPGPGEREEPRRGRRRORGEOPOREEPROPPRE'\nprint(len(s), set(s), s[:200])\nwhile 'ORO' in s or 'ROR' in s:\n    s = s.replace('ORO', 'OR RO').replace('ROR', 'RO OR')\nK = 2\nw = 'RO'\ndl = 0\nfor part in s.split():\n    l = part.split(w)\n    for i in range(len(l) - K):\n        d = sum(len(x) for x in l[i:i+K+1]) + K * len(w)\n        if i > 0:\n            d += 1\n        if i + K + 1 < len(l):\n            d += ⟦1⟧\n        dl = max(dl, d)\nprint(dl)", "methods": {"split": "s = 'EROEOROGGGEGEPGPGEREEPRRGRRRORGEOPOREEPROPPRE'\nprint(len(s), set(s), s[:200])\nwhile 'ORO' in s or 'ROR' in s:\n    s = s.replace('ORO', 'OR RO').replace('ROR', 'RO OR')\nK = 2\nw = 'RO'\ndl = 0\nfor part in s.split():\n    l = part.split(w)\n    for i in range(len(l) - K):\n        d = sum(len(x) for x in l[i:i+K+1]) + K * len(w)\n        if i > 0:\n            d += 1\n        if i + K + 1 < len(l):\n            d += 1\n        dl = max(dl, d)\nprint(dl)", "loops": "s = 'EROEOROGGGEGEPGPGEREEPRRGRRRORGEOPOREEPROPPRE'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    return ss.count('RO') == 2 and 'ORO' not in ss and 'ROR' not in ss\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) > dl:\n            dl = len(ss)\nprint(dl)"}, "final": "", "flags": "", "tree": [], "groups": 0, "main": "split", "norx": true, "d": 4, "alias": "", "realAns": "814", "src2": "", "real": "Текстовый файл состоит из символов P, R, O, E, G – зашифрованное письмо Деду Морозу.\nОпределите в прилагаемом файле максимальное количество идущих подряд символов, среди которых комбинация символов RO встречается ровно 21 раз, а комбинации символов ORO и ROR ни разу не встречаются.", "src": "PRO100 ЕГЭ 29.12.23", "lvl": "Сложный", "file": "https://kompege.ru/files/uleRzVuPF.txt", "alts": []}, {"id": "5381", "blk": "RF", "role": "main", "like": "", "star": false, "title": "", "idea": "Тройки налезают друг на друга (BAB AB…), split тут ломается. Берём позиции всех троек, а окно с ровно K тройками тянется от «после начала» левой соседней тройки до «перед концом» правой.", "note": "Пустые соседи: позиция −1 слева и len(s)−len(w)+1 справа — тогда край строки работает как середина, одна формула без if.", "tr": "", "ask": "", "s": "FUDFUCUDCEFECBEDADDAEBCBBFBEFBFEAFUFCCAUDBFBFEBADBBDF", "ans": "30", "tpl": "from re import *\ns = 'FUDFUCUDCEFECBEDADDAEBCBBFBEFBFEAFUFCCAUDBFBFEBADBBDF'\nprint(len(s), set(s), s[:200])\np = [m.start() for m in finditer(r'⟦(?=[BCDF][AEU][BCDF])⟧', s)]   # тройки налезают — просмотр вперёд\nK = 2\np = [-1] + p + [len(s) - 3 + 1]             # «пустые» соседи за краями\nprint(p)\nprint(max(p[i+K+1] + 3 - 1 - (p[i] + 1) for i in range(len(p) - K - 1)))", "methods": {"pos": "from re import *\ns = 'FUDFUCUDCEFECBEDADDAEBCBBFBEFBFEAFUFCCAUDBFBFEBADBBDF'\nprint(len(s), set(s), s[:200])\np = [m.start() for m in finditer(r'(?=[BCDF][AEU][BCDF])', s)]   # тройки налезают — просмотр вперёд\nK = 2\np = [-1] + p + [len(s) - 3 + 1]             # «пустые» соседи за краями\nprint(p)\nprint(max(p[i+K+1] + 3 - 1 - (p[i] + 1) for i in range(len(p) - K - 1)))", "loops": "s = 'FUDFUCUDCEFECBEDADDAEBCBBFBEFBFEAFUFCCAUDBFBFEBADBBDF'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    return sum(ss[k] in 'BCDF' and ss[k+1] in 'AEU' and ss[k+2] in 'BCDF' for k in range(len(ss) - 2)) == 2\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) > dl:\n            dl = len(ss)\nprint(dl)"}, "final": "", "flags": "", "tree": [], "groups": 0, "main": "pos", "norx": true, "d": 4, "alias": "", "realAns": "108", "src2": "", "real": "(А. Рогов) Текстовый файл состоит из символов A, B, C, D, E, F и U. Определите максимальное количество идущих подряд символов в прилагаемом файле, среди которых комбинация\nсогласная + гласная + согласная\nвстречается ровно 2 раза.", "src": "/dev/inf 12.2022", "lvl": "Сложный", "file": "https://kompege.ru/files/i5Xa8zgMZ.txt", "alts": [], "fiTag": true}, {"id": "24977", "blk": "RF", "role": "hw", "like": "5381", "star": false, "title": "", "idea": "", "note": "", "tr": "в учебной строке — не более 2 подстрок (в файле — 10)", "ask": "", "s": "1A126021210266AA6220162A0A2A6200222002266606AA0", "ans": "40", "tpl": "from re import *\ns = '1A126021210266AA6220162A0A2A6200222002266606AA0'\nprint(len(s), set(s), s[:200])\np = [m.start() for m in finditer(r'⟦(?=2.0.2.6)⟧', s)]\nK = 2\nif len(p) <= K:\n    print(len(s))\nelse:\n    p = [-1] + p + [len(s) - 7 + 1]\n    print(max(p[i+K+1] + 7 - 1 - (p[i] + 1) for i in range(len(p) - K - 1)))", "methods": {"pos": "from re import *\ns = '1A126021210266AA6220162A0A2A6200222002266606AA0'\nprint(len(s), set(s), s[:200])\np = [m.start() for m in finditer(r'(?=2.0.2.6)', s)]\nK = 2\nif len(p) <= K:\n    print(len(s))\nelse:\n    p = [-1] + p + [len(s) - 7 + 1]\n    print(max(p[i+K+1] + 7 - 1 - (p[i] + 1) for i in range(len(p) - K - 1)))", "loops": "s = '1A126021210266AA6220162A0A2A6200222002266606AA0'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    return sum(ss[k] == '2' and ss[k+2] == '0' and ss[k+4] == '2' and ss[k+6:k+7] == '6' for k in range(len(ss) - 6)) <= 2\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) > dl:\n            dl = len(ss)\nprint(dl)"}, "final": "", "flags": "", "tree": [], "groups": 0, "main": "pos", "norx": true, "d": 4, "alias": "", "realAns": "", "src2": "", "real": "(В. Лашин) Текстовый файл состоит из десятичных цифр и заглавных букв латинского алфавита. Определите в прилагаемом файле максимальное количество идущих подряд символов, среди которых можно найти не более 10 подстрок соответствующих записи 2?0?2?6, где ? обозначает любой символ.\nНапример, в строке \"A22002266G2J0K2L6A\" можно найти 3 подстроки \"2200226\", \"2002266\", \"2J0K2L6\"\nВ ответе запишите число – количество символов в найденной последовательности.", "src": "", "lvl": "Средний", "file": "https://kompege.ru/files/gY5OtFyh072.txt", "alts": [], "fiTag": true}, {"id": "26077", "blk": "RW", "role": "main", "like": "", "star": false, "title": "", "idea": "Начинается с G и других G нет — режем по G: каждый кусок (кроме первого) идёт сразу после своей G. Внутри куска берём начало, где нечётных цифр ровно K.", "note": "Регулярки — неподходящий способ: нужно ровно K штук. Split по особому символу + позиции внутри куска.", "tr": "в учебной строке — ровно 3 нечётные цифры (в файле — 45)", "ask": "", "s": "00647G5AAAB625B4349G89999843G007170883518G243027", "ans": "13", "tpl": "from re import *\ns = '00647G5AAAB625B4349G89999843G007170883518G243027'\nprint(len(s), set(s), s[:200])\nl = s.split('G')\nK = 3\ndl = 0\nfor x in l[1:]:                       # каждый кусок стоит сразу после G\n    q = [m.start() for m in finditer('[13579]', x)]   # нечётные цифры\n    if len(q) >= K:\n        end = q[K] if len(q) > K else len(x)        # до (K+1)-й нечётной\n        dl = max(dl, ⟦1 + end⟧)\nprint(dl)", "methods": {"split": "from re import *\ns = '00647G5AAAB625B4349G89999843G007170883518G243027'\nprint(len(s), set(s), s[:200])\nl = s.split('G')\nK = 3\ndl = 0\nfor x in l[1:]:                       # каждый кусок стоит сразу после G\n    q = [m.start() for m in finditer('[13579]', x)]   # нечётные цифры\n    if len(q) >= K:\n        end = q[K] if len(q) > K else len(x)        # до (K+1)-й нечётной\n        dl = max(dl, 1 + end)\nprint(dl)", "loops": "s = '00647G5AAAB625B4349G89999843G007170883518G243027'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    return ss[0] == 'G' and 'G' not in ss[1:] and sum(c in '13579' for c in ss) == 3\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) > dl:\n            dl = len(ss)\nprint(dl)"}, "final": "", "flags": "", "tree": [], "groups": 0, "main": "split", "norx": true, "d": 3, "alias": "", "realAns": "", "src2": "", "real": "Текстовый файл состоит из десятичных цифр и заглавных букв латинского алфавита. Определите в прилагаемом файле последовательность из максимального количества идущих подряд символов, среди которых ровно 45 нечётных цифр и при этом начинающуюся с буквы G, не содержащую других букв G, кроме первой.\nВ ответе запишите число – количество символов в найденной последовательности.", "src": "", "lvl": "Базовый", "file": "https://kompege.ru/files/NaPFMPwCvR2.txt", "alts": []}, {"id": "25361", "blk": "RW", "role": "hw", "like": "26077", "star": false, "title": "", "idea": "", "note": "", "tr": "в учебной строке — ровно 3 (в файле — 76)", "ask": "", "s": "8675322FFF8797442324F3800823798FA1B75AF731343746582", "ans": "4", "tpl": "from re import *\ns = '8675322FFF8797442324F3800823798FA1B75AF731343746582'\nprint(len(s), set(s), s[:200])\nl = split(r'⟦[02468]⟧', s)                 # каждый кусок (кроме первого) — сразу после чётной цифры\nK = 3\ndl = 0\nfor x in l[1:]:\n    q = [m.start() for m in finditer('F', x)]\n    if len(q) >= K:\n        end = q[K] if len(q) > K else len(x)\n        dl = max(dl, 1 + end)\nprint(dl)", "methods": {"split": "from re import *\ns = '8675322FFF8797442324F3800823798FA1B75AF731343746582'\nprint(len(s), set(s), s[:200])\nl = split(r'[02468]', s)                 # каждый кусок (кроме первого) — сразу после чётной цифры\nK = 3\ndl = 0\nfor x in l[1:]:\n    q = [m.start() for m in finditer('F', x)]\n    if len(q) >= K:\n        end = q[K] if len(q) > K else len(x)\n        dl = max(dl, 1 + end)\nprint(dl)", "loops": "s = '8675322FFF8797442324F3800823798FA1B75AF731343746582'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    return ss[0] in '02468' and not any(c in '02468' for c in ss[1:]) and ss.count('F') == 3\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) > dl:\n            dl = len(ss)\nprint(dl)"}, "final": "", "flags": "", "tree": [], "groups": 0, "main": "split", "norx": true, "d": 3, "alias": "", "realAns": "", "src2": "", "real": "Текстовый файл состоит из десятичных цифр и заглавных букв латинского алфавита. Определите в прилагаемом файле максимальное количество идущих подряд символов, среди которых буква F встречается ровно 76 раз, чётная цифра встречается ровно один раз, искомая последовательность начинается с этой единственной чётной цифры.\nВ ответе запишите число - количество символов в найденной последовательности.", "src": "ЕГКР 13.12.25", "lvl": "Базовый", "file": "https://kompege.ru/files/x6sV1G7SuWL.txt", "alts": []}, {"id": "23206", "blk": "RW", "role": "hw", "like": "26077", "star": false, "title": "", "idea": "", "note": "", "tr": "в учебной строке — ровно 3 (в файле — 35)", "ask": "", "s": "4S3S98BA0A7A76S9S004182SSS52SSS918239626A9016SA41A8", "ans": "6", "tpl": "from re import *\ns = '4S3S98BA0A7A76S9S004182SSS52SSS918239626A9016SA41A8'\nprint(len(s), set(s), s[:200])\nl = split(r'⟦[02468]⟧', s)                 # каждый кусок (кроме первого) — сразу после чётной цифры\nK = 3\ndl = 0\nfor x in l[1:]:\n    q = [m.start() for m in finditer('S', x)]\n    if len(q) >= K:\n        end = q[K] if len(q) > K else len(x)\n        dl = max(dl, 1 + end)\nprint(dl)", "methods": {"split": "from re import *\ns = '4S3S98BA0A7A76S9S004182SSS52SSS918239626A9016SA41A8'\nprint(len(s), set(s), s[:200])\nl = split(r'[02468]', s)                 # каждый кусок (кроме первого) — сразу после чётной цифры\nK = 3\ndl = 0\nfor x in l[1:]:\n    q = [m.start() for m in finditer('S', x)]\n    if len(q) >= K:\n        end = q[K] if len(q) > K else len(x)\n        dl = max(dl, 1 + end)\nprint(dl)", "loops": "s = '4S3S98BA0A7A76S9S004182SSS52SSS918239626A9016SA41A8'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    return ss[0] in '02468' and not any(c in '02468' for c in ss[1:]) and ss.count('S') == 3\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) > dl:\n            dl = len(ss)\nprint(dl)"}, "final": "", "flags": "", "tree": [], "groups": 0, "main": "split", "norx": true, "d": 3, "alias": "", "realAns": "", "src2": "", "real": "Текстовый файл состоит из десятичных цифр и заглавных букв латинского алфавита. Определите в прилагаемом файле последовательность из максимального количества идущих подряд символов, среди которых ровно 35 букв S, начинающуюся чётной цифрой, не содержащую других чётных цифр, кроме первой.\nВ ответе запишите число - количество символов в найденной последовательности.", "src": "Основная волна 10.06.25", "lvl": "Средний", "file": "https://kompege.ru/files/aOCPOfIZ8w.txt", "alts": []}, {"id": "28943", "blk": "RW", "role": "hw", "like": "26077", "star": false, "title": "", "idea": "", "note": "", "tr": "в учебной строке — пара «20» ровно 2 раза (в файле — 26)", "ask": "", "s": "BCA203A003CC3A232C0BAA20EBBE2020A0CAC0CE200E", "ans": "5", "tpl": "from re import *\ns = 'BCA203A003CC3A232C0BAA20EBBE2020A0CAC0CE200E'\nprint(len(s), set(s), s[:200])\nl = split(r'⟦[AEIOUY]⟧', s)             # куски между гласными\nK = 2\ndl = len(s) + 1\nfor x in l[:-1]:                     # после каждого куска стоит гласная\n    q = [m.start() for m in finditer('20', x)]\n    if len(q) >= K:\n        dl = min(dl, len(x) - q[-K] + 1)    # от K-й с конца пары до гласной\nprint(dl)", "methods": {"split": "from re import *\ns = 'BCA203A003CC3A232C0BAA20EBBE2020A0CAC0CE200E'\nprint(len(s), set(s), s[:200])\nl = split(r'[AEIOUY]', s)             # куски между гласными\nK = 2\ndl = len(s) + 1\nfor x in l[:-1]:                     # после каждого куска стоит гласная\n    q = [m.start() for m in finditer('20', x)]\n    if len(q) >= K:\n        dl = min(dl, len(x) - q[-K] + 1)    # от K-й с конца пары до гласной\nprint(dl)", "loops": "s = 'BCA203A003CC3A232C0BAA20EBBE2020A0CAC0CE200E'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    return ss[-1] in 'AEIOUY' and not any(c in 'AEIOUY' for c in ss[:-1]) and ss.count('20') == 2\ndl = len(s) + 1\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) < dl:\n            dl = len(ss)\nprint(dl)"}, "final": "", "flags": "", "tree": [], "groups": 0, "main": "split", "norx": true, "d": 4, "alias": "", "realAns": "", "src2": "", "real": "Текстовый файл состоит из десятичных цифр и заглавных букв латинского алфавита. Определите в прилагаемом файле минимальное количество идущих подряд символов, среди которых пара символов «20» (в указанном порядке) встречается ровно 26 раз, гласная буква встречается ровно один раз, искомая последовательность заканчивается этой единственной гласной буквой. В ответе запишите число - количество символов в найденной последовательности.\nПримечание. гласные буквы латинского алфавита: A, E, I, O, U, Y.", "src": "ЕГКР 18.04.26", "lvl": "Базовый", "file": "https://kompege.ru/files/IjZCVO1qNHt.txt", "alts": []}, {"id": "5496", "blk": "RW", "role": "hw", "like": "26077", "star": false, "title": "", "idea": "", "note": "Режем по D: каждый кусок между соседними D проверяем, подходящие куски подряд склеиваются вместе с буквами D.", "tr": "", "ask": "", "s": "AAOOOFFDDOOCOACFDOOODCAOOFADDDFOOFADDFODOODCFDADD", "ans": "29", "tpl": "s = 'AAOOOFFDDOOCOACFDOOODCAOOFADDDFOOFADDFODOODCFDADD'\nprint(len(s), set(s), s[:200])\nl = s.split('D')\ndl = 0\nk =
