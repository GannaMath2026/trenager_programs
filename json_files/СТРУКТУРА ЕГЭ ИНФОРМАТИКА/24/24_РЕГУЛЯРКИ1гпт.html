", "tpl": "from re import *\ns = 'CCBCCABBABBAACAABCACBAAAABACABAABBBBABCACBAAABBAAA'\nprint(len(s), set(s), s[:200])\np = [m.start() for m in finditer('A', s)]\nn = len(p)\naa = sum(1 for k in range(n - 1) if p[k+1] - p[k] == 1)   # соседние AA\nprint(⟦n * (n - 1) // 2 - aa⟧)", "methods": {"pos": "from re import *\ns = 'CCBCCABBABBAACAABCACBAAAABACABAABBBBABCACBAAABBAAA'\nprint(len(s), set(s), s[:200])\np = [m.start() for m in finditer('A', s)]\nn = len(p)\naa = sum(1 for k in range(n - 1) if p[k+1] - p[k] == 1)   # соседние AA\nprint(n * (n - 1) // 2 - aa)", "loops": "s = 'CCBCCABBABBAACAABCACBAAAABACABAABBBBABCACBAAABBAAA'\nprint(len(s), set(s), s[:200])\nk = 0\nfor i in range(len(s)):\n    for j in range(i + 3, len(s) + 1):\n        if s[i] == 'A' and s[j-1] == 'A':\n            k += 1\nprint(k)"}, "final": "", "flags": "", "tree": [], "groups": 0, "main": "pos", "norx": true, "d": 3, "alias": "", "realAns": "42587173055", "src2": "", "real": "(Л. Шастин) Текстовый файл состоит не более, чем из 7 200 000 прописных символов латинского алфавита. Определите в прилагаемом файле количество подстрок вида A#A, где на месте # стоит хотя бы один символ.", "src": "", "lvl": "Сложный", "file": "https://kompege.ru/files/7Qu5mQV8J.txt", "alts": [], "fiTag": true}, {"id": "3019", "blk": "R1", "role": "main", "like": "", "star": false, "title": "", "idea": "", "note": "От каждой A подходит не больше одного куска — до ближайшей B (внутри нет ни A, ни B). Значит, количество подстрок = количество кусков A[^AB]*B, прошедших фильтр.", "tr": "в учебной строке — длиной не более 7 (в файле — 15)", "ask": "", "s": "ACBACAAFFCCCBFACFBABBFFACCCCFABFCBFCBCACAFFBB", "ans": "3", "tpl": "from re import *\ns = 'ACBACAAFFCCCBFACFBABBFFACCCCFABFCBFCBCACAFFBB'\nprint(len(s), set(s), s[:200])\npattern = r'⟦A[^AB]*B⟧'\npattern = f'(?=({pattern}))'\nl = findall(pattern, s)\nl = [x for x in l if ⟦'F' in x⟧ and len(x) <= 7]\nprint(l)\nprint(len(l))", "methods": {"rx": "from re import *\ns = 'ACBACAAFFCCCBFACFBABBFFACCCCFABFCBFCBCACAFFBB'\nprint(len(s), set(s), s[:200])\npattern = r'A[^AB]*B'\npattern = f'(?=({pattern}))'\nl = findall(pattern, s)\nl = [x for x in l if 'F' in x and len(x) <= 7]\nprint(l)\nprint(len(l))", "loops": "s = 'ACBACAAFFCCCBFACFBABBFFACCCCFABFCBFCBCACAFFBB'\nprint(len(s), set(s), s[:200])\nk = 0\nfor i in range(len(s)):\n    for j in range(i + 2, len(s) + 1):\n        ss = s[i:j]\n        if ss[0] == 'A' and ss[-1] == 'B' and not any(c in 'AB' for c in ss[1:-1]) and 'F' in ss and len(ss) <= 7:\n            k += 1\nprint(k)"}, "final": "(?=(A[^AB]*B))", "flags": "", "tree": [{"t": "(?=(A[^AB]*B))", "d": "просмотр вперёд: дальше ДОЛЖНО идти следующее (символы не забираются, позиция не сдвигается):", "c": [{"t": "(A[^AB]*B)", "g": 1, "d": "ГРУППА №1 — запоминает совпавший кусок: его вернёт findall, m.group(1), на него ссылается \\1", "c": [{"t": "A", "d": "символ «A»"}, {"t": "[^AB]*", "d": "повторить ноль или больше раз — жадно (как можно больше):", "c": [{"t": "[^AB]", "d": "один любой символ, КРОМЕ: «A», «B»"}]}, {"t": "B", "d": "символ «B»"}]}]}], "groups": 1, "main": "rx", "norx": false, "d": 2, "alias": "", "realAns": "", "src2": "", "real": "Текстовый файл содержит строку из заглавных латинских букв, всего не более чем из 10⁶ символов. Определите количество подстрок длиной не более 15 символов, которые начинаются буквой A, содержат букву F, заканчиваются буквой B и не содержат других букв A и B, кроме первой и последней.", "src": "", "lvl": "Средний", "file": "https://kompege.ru/files/8dvZzs7u4.txt", "alts": [], "endOrder": 1}, {"id": "4919п", "blk": "R5", "role": "hw", "like": "21", "star": false, "title": "", "idea": "Кусок от A до B, внутри нет A и B: A[^AB]*B. Для каждой буквы A такой кусок один — до ближайшей B.", "note": "Хотя спрашивают КОЛИЧЕСТВО подстрок, короче «максимального» куска A…B подстрока не бывает: она обязана кончаться на B, а внутри не может быть других B. Поэтому от каждой A — ровно один кандидат: findall с обёрткой даёт все такие куски, остаётся фильтр по числу F и длине.", "tr": "в учебной строке — длиной не менее 6 (в файле — 20)", "ask": "", "s": "CFBAFCCFBABBCAFFCCCBFFCBACFFBCAFBAFCCBCB", "ans": "2", "tpl": "from re import *\ns = 'CFBAFCCFBABBCAFFCCCBFFCBACFFBCAFBAFCCBCB'\nprint(len(s), set(s), s[:200])\npattern = r'⟦A[^AB]*B⟧'\npattern = f'(?=({pattern}))'\nl = findall(pattern, s)\nl = [x for x in l if ⟦x.count('F') == 2⟧ and len(x) >= 6]\nprint(l)\nprint(len(l))", "methods": {"rx": "from re import *\ns = 'CFBAFCCFBABBCAFFCCCBFFCBACFFBCAFBAFCCBCB'\nprint(len(s), set(s), s[:200])\npattern = r'A[^AB]*B'\npattern = f'(?=({pattern}))'\nl = findall(pattern, s)\nl = [x for x in l if x.count('F') == 2 and len(x) >= 6]\nprint(l)\nprint(len(l))", "loops": "s = 'CFBAFCCFBABBCAFFCCCBFFCBACFFBCAFBAFCCBCB'\nprint(len(s), set(s), s[:200])\nk = 0\nfor i in range(len(s)):\n    for j in range(i + 2, len(s) + 1):\n        ss = s[i:j]\n        if ss[0] == 'A' and ss[-1] == 'B' and not any(c in 'AB' for c in ss[1:-1]) and ss.count('F') == 2 and len(ss) >= 6:\n            k += 1\nprint(k)"}, "final": "(?=(A[^AB]*B))", "flags": "", "tree": [{"t": "(?=(A[^AB]*B))", "d": "просмотр вперёд: дальше ДОЛЖНО идти следующее (символы не забираются, позиция не сдвигается):", "c": [{"t": "(A[^AB]*B)", "g": 1, "d": "ГРУППА №1 — запоминает совпавший кусок: его вернёт findall, m.group(1), на него ссылается \\1", "c": [{"t": "A", "d": "символ «A»"}, {"t": "[^AB]*", "d": "повторить ноль или больше раз — жадно (как можно больше):", "c": [{"t": "[^AB]", "d": "один любой символ, КРОМЕ: «A», «B»"}]}, {"t": "B", "d": "символ «B»"}]}]}], "groups": 1, "main": "rx", "norx": false, "d": 3, "alias": "", "realAns": "94", "src2": "", "real": "Определите количество подстрок длиной не менее 20 символов, которые начинаются буквой A, содержат ровно две буквы F, заканчиваются буквой B и не содержат других букв A и B, кроме первой и последней.", "src": "сайт К. Полякова", "lvl": "", "file": "", "alts": []}, {"id": "1143", "blk": "RF", "role": "main", "like": "", "star": false, "title": "", "idea": "AF-подстрока определяется началом (буква A) и концом (буква F). Берём позиции A и F через finditer и для каждой A проверяем, есть ли F на расстоянии, дающем длину 7–10.", "note": "", "tr": "", "ask": "", "s": "ACACCACFDFCFCFACCCCCCFFCFDACBECEDCCDEDABEBEC", "ans": "8", "tpl": "from re import *\ns = 'ACACCACFDFCFCFACCCCCCFFCFDACBECEDCCDEDABEBEC'\nprint(len(s), set(s), s[:200])\na = [m.start() for m in finditer('A', s)]\nf = set(m.start() for m in finditer('F', s))\nk = 0\nfor i in a:\n    for L in range(7, 11):\n        if ⟦i + L - 1 in f⟧:\n            k += 1\nprint(k)", "methods": {"pos": "from re import *\ns = 'ACACCACFDFCFCFACCCCCCFFCFDACBECEDCCDEDABEBEC'\nprint(len(s), set(s), s[:200])\na = [m.start() for m in finditer('A', s)]\nf = set(m.start() for m in finditer('F', s))\nk = 0\nfor i in a:\n    for L in range(7, 11):\n        if i + L - 1 in f:\n            k += 1\nprint(k)", "loops": "s = 'ACACCACFDFCFCFACCCCCCFFCFDACBECEDCCDEDABEBEC'\nprint(len(s), set(s), s[:200])\nk = 0\nfor i in range(len(s)):\n    for j in range(i + 7, i + 11):\n        if j <= len(s) and s[i] == 'A' and s[j-1] == 'F':\n            k += 1\nprint(k)", "dp": "s = 'ACACCACFDFCFCFACCCCCCFFCFDACBECEDCCDEDABEBEC'\nprint(len(s), set(s), s[:200])\npa = [0]                            # pa[i] — сколько букв A среди s[:i]\nfor c in s:\n    pa.append(pa[-1] + (c == 'A'))\nk = 0\nfor j in range(len(s)):             # j — конец подстроки, там буква F\n    if s[j] == 'F':\n        lo, hi = max(0, j - 9), j - 6   # начало i: длина j - i + 1 от 7 до 10\n        if hi >= 0:\n            k += pa[hi + 1] - pa[lo]    # сколько A на отрезке [lo; hi]\nprint(k)"}, "final": "", "flags": "", "tree": [], "groups": 0, "main": "pos", "norx": true, "d": 2, "alias": "", "realAns": "", "src2": "", "real": "Текстовый файл содержит строку из заглавных букв A, B, C, D, E, F, всего не более чем из 10⁶ символов. AF-подстроками назовём непустые последовательности идущих подряд символов A, B, C, D, E, F, ограниченные в начале символом A, а в конце символом F (граничные символы входят в подстроку). Определите количество AF-подстрок длиной от 7 до 10 символов.", "src": "", "lvl": "Средний", "file": "https://kompege.ru/files/AAGqSw59y.txt", "alts": [], "fiTag": true}, {"id": "12410", "blk": "RW", "role": "hw", "like": "21717", "star": true, "title": "", "idea": "", "note": "Нарушение в позиции i — пара (s[i], s[i+1]). Окно может начинаться сразу после левой соседней пары и кончаться на первой букве правой.", "tr": "в учебной строке — ровно 3 нарушения (в файле — 100000)", "ask": "", "s": "EDBEGBGABCDEACFCGDDCCBEDBGBCCGGFEDBGGEFFFDGCE", "ans": "13", "tpl": "s = 'EDBEGBGABCDEACFCGDDCCBEDBGBCCGGFEDBGGEFFFDGCE'\nprint(len(s), set(s), s[:200])\nq = [i for i in range(len(s) - 1) if s[i] > s[i+1]]   # где порядок нарушается\nK = 3\nq = [-1] + q + [len(s) - 1]            # пустые соседи\nprint(max(q[i+K+1] + 1 - (q[i] + 1) for i in range(len(q) - K - 1)))", "methods": {"pos": "s = 'EDBEGBGABCDEACFCGDDCCBEDBGBCCGGFEDBGGEFFFDGCE'\nprint(len(s), set(s), s[:200])\nq = [i for i in range(len(s) - 1) if s[i] > s[i+1]]   # где порядок нарушается\nK = 3\nq = [-1] + q + [len(s) - 1]            # пустые соседи\nprint(max(q[i+K+1] + 1 - (q[i] + 1) for i in range(len(q) - K - 1)))", "loops": "s = 'EDBEGBGABCDEACFCGDDCCBEDBGBCCGGFEDBGGEFFFDGCE'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    return sum(ss[k] > ss[k+1] for k in range(len(ss) - 1)) == 3\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) > dl:\n            dl = len(ss)\nprint(dl)"}, "final": "", "flags": "", "tree": [], "groups": 0, "main": "pos", "norx": true, "d": 4, "alias": "", "realAns": "", "src2": "", "real": "(Л. Шастин) Текстовый файл состоит не более, чем из 7 200 000 прописных символов латинского алфавита.\nОпределите в прилагаемом файле максимальное количество идущих подряд символов, среди которых прямой алфавитный порядок нарушается ровно 100000 раз.\nНапример, в подстроке AABCEGBCDFXCDEFA прямой алфавитный порядок нарушается ровно трижды.", "src": "", "lvl": "Средний", "file": "https://kompege.ru/files/plKdEkV3w.txt", "alts": []}, {"id": "24374", "blk": "RW", "role": "hw", "like": "21717", "star": false, "title": "", "idea": "", "note": "Слово, задетое краем окна, — всё равно слово. Поэтому окно тянется от конца предыдущего слова до начала следующего.", "tr": "в учебной строке — ровно 3 слова (в файле — 80); ответ — номер первого символа", "ask": "", "s": "1Q2A1AB2122BBB2A1AA12ABA2AB1C2DAB2B2BB1B2A1AAA12A12", "ans": "7", "tpl": "from re import *\ns = '1Q2A1AB2122BBB2A1AA12ABA2AB1C2DAB2B2BB1B2A1AAA12A12'\nprint(len(s), set(s), s[:200])\nw = [m.span() for m in finditer('[A-Z]+', s)]      # слова: (начало, конец)\nK = 3\nst = [0] + [b for a, b in w] \nbest = (-1, 0)\nfor i in range(len(w) - K + 1):\n    L = w[i-1][1] if i > 0 else 0               # после предыдущего слова\n    R = w[i+K][0] if i + K < len(w) else len(s)   # до следующего слова\n    best = max(best, (R - L, -L))\nprint(⟦-best[1]⟧)", "methods": {"pos": "from re import *\ns = '1Q2A1AB2122BBB2A1AA12ABA2AB1C2DAB2B2BB1B2A1AAA12A12'\nprint(len(s), set(s), s[:200])\nw = [m.span() for m in finditer('[A-Z]+', s)]      # слова: (начало, конец)\nK = 3\nst = [0] + [b for a, b in w] \nbest = (-1, 0)\nfor i in range(len(w) - K + 1):\n    L = w[i-1][1] if i > 0 else 0               # после предыдущего слова\n    R = w[i+K][0] if i + K < len(w) else len(s)   # до следующего слова\n    best = max(best, (R - L, -L))\nprint(-best[1])", "loops": "s = '1Q2A1AB2122BBB2A1AA12ABA2AB1C2DAB2B2BB1B2A1AAA12A12'\nprint(len(s), set(s), s[:200])\nimport re as _r\nbest = (-1, 0)\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        if len(_r.findall('[A-Z]+', s[i:j])) == 3:\n            best = max(best, (j - i, -i))\nprint(-best[1])"}, "final": "", "flags": "", "tree": [], "groups": 0, "main": "pos", "norx": true, "d": 4, "alias": "", "realAns": "", "src2": "", "real": "(Иглин К.) Текстовый файл состоит из десятичных цифр и заглавных букв латинского алфавита. Определите в прилагаемом файле последовательность из максимального количества идущих подряд символов, удовлетворяющую условию: в ней ровно 80 отдельных слов (слова - это последовательности подряд идущих букв, отделенные друг от друга хотя бы одной цифрой).\nВ ответе запишите число - порядковый номер в файле первого символа найденной последовательности.\nПримечание. В прилагаемом файле нумерация символов начинается с нуля.", "src": "", "lvl": "Средний", "file": "https://kompege.ru/files/J-IpeNeSO5j.txt", "alts": []}, {"id": "2506", "blk": "RC", "role": "main", "like": "", "star": false, "title": "", "idea": "Для каждого символа из set(s) считаем s.count(c). Самый частый — max по количеству; при равенстве берём первый по алфавиту — min среди лидеров.", "note": "Регулярка здесь не нужна — хватает count и set.", "tr": "", "ask": "", "s": "CBABACBAACBACBBBCBBABCCAACABABBACACBABBABCBBABBBBC", "ans": "B23", "tpl": "s = 'CBABACBAACBACBBBCBBABCCAACABABBACACBABBABCBBABBBBC'\nprint(len(s), set(s), s[:200])\nl = [(s.count(c), c) for c in set(s)]\nk = max(x[0] for x in l)\nc = ⟦min(x[1] for x in l if x[0] == k)⟧\nprint(l)\nprint(c + str(k))", "methods": {"rx": "s = 'CBABACBAACBACBBBCBBABCCAACABABBACACBABBABCBBABBBBC'\nprint(len(s), set(s), s[:200])\nl = [(s.count(c), c) for c in set(s)]\nk = max(x[0] for x in l)\nc = min(x[1] for x in l if x[0] == k)\nprint(l)\nprint(c + str(k))", "loops": "s = 'CBABACBAACBACBBBCBBABCCAACABABBACACBABBABCBBABBBBC'\nprint(len(s), set(s), s[:200])\nd = {}\nfor c in s:\n    d[c] = d.get(c, 0) + 1\nk = max(d.values())\nc = min(x for x in d if d[x] == k)\nprint(c + str(k))"}, "final": "", "flags": "", "tree": [], "groups": 0, "main": "rx", "norx": true, "d": 1, "alias": "", "realAns": "", "src2": "", "real": "Текстовый файл состоит не более чем из 10⁶ символов и содержит только заглавные буквы латинского алфавита (ABC…Z). Определите символ, который чаще всего встречается в файле. Если таких символов несколько, выведите тот, который стоит раньше в алфавите. Например, в тексте CCBAABABCBC A встречается 3 раза, B - 4 раза и С - 4 раза. Чаще всего встречаются символы B и C, в ответе для этого случая надо написать B4 (без пробелов и других разделителей).", "src": "", "lvl": "Средний", "file": "https://kompege.ru/files/caz1v-kBl.txt", "alts": []}, {"id": "2509", "blk": "RC", "role": "hw", "like": "2506", "star": false, "title": "", "idea": "", "note": "", "tr": "", "ask": "", "s": "DCDBDACBBBCBBDDCACACADADADBBBBDADACAACBBACC", "ans": "2", "tpl": "s = 'DCDBDACBBBCBBDDCACACADADADBBBBDADACAACBBACC'\nprint(len(s), set(s), s[:200])\nl = [s.count(c) for c in set(s)]\nprint(l)\nprint(⟦max(l) - min(l)⟧)", "methods": {"rx": "s = 'DCDBDACBBBCBBDDCACACADADADBBBBDADACAACBBACC'\nprint(len(s), set(s), s[:200])\nl = [s.count(c) for c in set(s)]\nprint(l)\nprint(max(l) - min(l))", "loops": "s = 'DCDBDACBBBCBBDDCACACADADADBBBBDADACAACBBACC'\nprint(len(s), set(s), s[:200])\nd = {}\nfor c in s:\n    d[c] = d.get(c, 0) + 1\nprint(max(d.values()) - min(d.values()))"}, "final": "", "flags": "", "tree": [], "groups": 0, "main": "rx", "norx": true, "d": 1, "alias": "", "realAns": "", "src2": "", "real": "Текстовый файл состоит не более чем из 10⁶ символов и содержит только заглавные буквы латинского алфавита (ABC…Z). Определите количество самого частого и самого редкого символа в файле (без учёта символа окончания строки). В качестве ответа запишите разницу между ними.", "src": "", "lvl": "Средний", "file": "https://kompege.ru/files/ZFHhzbRCm.txt", "alts": []}, {"id": "2684", "blk": "RC", "role": "hw", "like": "2506", "star": false, "title": "", "idea": "", "note": "", "tr": "", "ask": "", "s": "ADDCCBBABCDDCDBACBCBDABCBDCABCBABDBBBBAB", "ans": "B", "tpl": "s = 'ADDCCBBABCDDCDBACBCBDABCBDCABCBABDBBBBAB'\nprint(len(s), set(s), s[:200])\nl = [(s.count(c), c) for c in set(s)]\nk = max(x[0] for x in l)\nprint(⟦''.join(sorted(c for n, c in l if n == k))⟧)", "methods": {"rx": "s = 'ADDCCBBABCDDCDBACBCBDABCBDCABCBABDBBBBAB'\nprint(len(s), set(s), s[:200])\nl = [(s.count(c), c) for c in set(s)]\nk = max(x[0] for x in l)\nprint(''.join(sorted(c for n, c in l if n == k)))", "loops": "s = 'ADDCCBBABCDDCDBACBCBDABCBDCABCBABDBBBBAB'\nprint(len(s), set(s), s[:200])\nd = {}\nfor c in s:\n    d[c] = d.get(c, 0) + 1\nk = max(d.values())\nprint(''.join(sorted(c for c in d if d[c] == k)))"}, "final": "", "flags": "", "tree": [], "groups": 0, "main": "rx", "norx": true, "d": 1, "alias": "", "realAns": "", "src2": "", "real": "Текстовый файл состоит не более чем из 10⁸ символов прописных латинских букв (A, B, .., Z). \nОпределите, какая буква встречается в текстовом файле максимальное количество раз. Если таких букв несколько, запишите их в ответе в алфавитном порядке. Ответ необходимо записать прописными (заглавными) буквами.", "src": "Пробный 02.2022 /dev/inf Base level", "lvl": "Средний", "file": "https://kompege.ru/files/x53vxGdwF.txt", "alts": []}, {"id": "786", "blk": "RC", "role": "hw", "like": "2506", "star": false, "title": "", "idea": "", "note": "", "tr": "", "ask": "", "s": "CAAAABDACABAABBACABBDACBBCDABBADBABDACADDA", "ans": "6", "tpl": "s = 'CAAAABDACABAABBACABBDACBBCDABBADBABDACADDA'\nprint(len(s), set(s), s[:200])\nprint(⟦sum(s[i] == s[-1 - i] for i in range(len(s) // 2))⟧)", "methods": {"rx": "s = 'CAAAABDACABAABBACABBDACBBCDABBADBABDACADDA'\nprint(len(s), set(s), s[:200])\nprint(sum(s[i] == s[-1 - i] for i in range(len(s) // 2)))", "loops": "s = 'CAAAABDACABAABBACABBDACBBCDABBADBABDACADDA'\nprint(len(s), set(s), s[:200])\nk = 0\nfor i in range(len(s) // 2):\n    if s[i] == s[len(s) - 1 - i]:\n        k += 1\nprint(k)"}, "final": "", "flags": "", "tree": [], "groups": 0, "main": "rx", "norx": true, "d": 1, "alias": "", "realAns": "", "src2": "", "real": "В файле хранится строка из символов. Длина строки не более 106. \n\nСколько пар символов в строке являются симметричными? Симметричной парой называют такие два символа, которые расположены на одинаковом удалении от концов строки. \n\nНапример, в строке adcdeefcba три симметричных пары – aa, cc и ee.", "src": "Джобс 30.11.2020", "lvl": "Средний", "file": "https://kompege.ru/files/eLeRo8pGW.txt", "alts": []}, {"id": "3099", "blk": "RC", "role": "hw", "like": "2506", "star": false, "title": "", "idea": "", "note": "Палиндром собирается, если букв с нечётным количеством не больше одной. Одна замена исправляет две такие буквы.", "tr": "", "ask": "", "s": "DDDCBBBBDBADCBCCBADDDBBDAABDCAAADDCBCBDB", "ans": "2", "tpl": "s = 'DDDCBBBBDBADCBCCBADDDBBDAABDCAAADDCBCBDB'\nprint(len(s), set(s), s[:200])\nodd = sum(s.count(c) % 2 for c in set(s))\nprint(⟦odd // 2⟧)", "methods": {"rx": "s = 'DDDCBBBBDBADCBCCBADDDBBDAABDCAAADDCBCBDB'\nprint(len(s), set(s), s[:200])\nodd = sum(s.count(c) % 2 for c in set(s))\nprint(odd // 2)", "loops": "s = 'DDDCBBBBDBADCBCCBADDDBBDAABDCAAADDCBCBDB'\nprint(len(s), set(s), s[:200])\nd = {}\nfor c in s:\n    d[c] = d.get(c, 0) + 1\nprint(sum(v % 2 for v in d.values()) // 2)"}, "final": "", "flags": "", "tree": [], "groups": 0, "main": "rx", "norx": true, "d": 2, "alias": "", "realAns": "", "src2": "", "real": "(PRO100 ЕГЭ) Текстовый файл содержит строку из заглавных латинских букв, всего не более чем из 10⁶ символов. Требуется заменить некоторые буквы на другие латинские так, чтобы из букв получившейся строки можно было собрать палиндром. В ответ запишите минимальное количество замен, которое нужно сделать.\nПример:\nИз строки wqe, строка wqq (можно собрать палиндром qwq) получается с помощью одной замены e -> q. \nОтвет: 1", "src": "", "lvl": "Гроб", "file": "https://kompege.ru/files/scdrcDEHG.txt", "alts": []}, {"id": "2508п", "blk": "RC", "role": "main", "like": "", "star": false, "title": "", "idea": "", "note": "Здесь ответ печатаем в одну строку: «E 9 Y 9».", "tr": "", "ask": "", "s": "BACYDAACDEABCDADYDEYACCCYYYYYBACYEEEEYCYYEYADEBD", "ans": "Y 5", "tpl": "from re import *\ns = 'BACYDAACDEABCDADYDEYACCCYYYYYBACYEEEEYCYYEYADEBD'\nprint(len(s), set(s), s[:200])\npattern = r'⟦(.)\\1*⟧'\nl = [m.group() for m in finditer(pattern, s)]\nk = max(len(x) for x in l)\nprint(⟦' '.join(x[0] + ' ' + str(k) for x in l if len(x) == k)⟧)", "methods": {"rx": "from re import *\ns = 'BACYDAACDEABCDADYDEYACCCYYYYYBACYEEEEYCYYEYADEBD'\nprint(len(s), set(s), s[:200])\npattern = r'(.)\\1*'\nl = [m.group() for m in finditer(pattern, s)]\nk = max(len(x) for x in l)\nprint(' '.join(x[0] + ' ' + str(k) for x in l if len(x) == k))", "loops": "s = 'BACYDAACDEABCDADYDEYACCCYYYYYBACYEEEEYCYYEYADEBD'\nprint(len(s), set(s), s[:200])\nruns = []\ni = 0\nwhile i < len(s):\n    j = i\n    while j < len(s) and s[j] == s[i]:\n        j += 1\n    runs.append((s[i], j - i))\n    i = j\nk = max(n for c, n in runs)\nprint(' '.join(c + ' ' + str(n) for c, n in runs if n == k))"}, "final": "(.)\\1*", "flags": "", "tree": [{"t": "(.)", "g": 1, "d": "ГРУППА №1 — запоминает совпавший кусок: его вернёт findall, m.group(1), на него ссылается \\1", "c": [{"t": ".", "d": "точка — ровно один любой символ (кроме перевода строки, если нет флага S)"}]}, {"t": "\\1*", "d": "повторить ноль или больше раз — жадно (как можно больше):", "c": [{"t": "\\1", "d": "обратная ссылка: здесь должен стоять ТОТ ЖЕ текст, что совпал с группой №1"}]}], "groups": 1, "main": "rx", "norx": false, "d": 2, "alias": "", "realAns": "E 9 Y 9", "src2": "", "real": "Найдите длину самой длинной подцепочки, состоящей из одинаковых символов. Для каждой цепочки максимальной длины выведите отдельной строке сначала символ, из которого строится эта цепочка, а затем через пробел – длину этой цепочки. Данные о найденных цепочках расположите в порядке их появления в файле.", "src": "сайт К. Полякова", "lvl": "", "file": "", "alts": []}, {"id": "5830п", "blk": "RC", "role": "hw", "like": "2506", "star": false, "title": "", "idea": "", "note": "", "tr": "", "ask": "", "s": "ABCCBBCBACABCABACCCBAABACAABBCBABCBBBACABCCCBAACC", "ans": "4", "tpl": "from re import *\ns = 'ABCCBBCBACABCABACCCBAABACAABBCBABCBBBACABCCCBAACC'\nprint(len(s), set(s), s[:200])\npattern = r'⟦(?:(.)(?!\\1))*.⟧'\nl = [m.group() for m in finditer(pattern, s)]\nk = max(len(x) for x in l)\nx = [x for x in l if len(x) == k][-1]          # последняя из самых длинных\nprint(x)\nprint(⟦max(x.count(c) for c in x)⟧)", "methods": {"rx": "from re import *\ns = 'ABCCBBCBACABCABACCCBAABACAABBCBABCBBBACABCCCBAACC'\nprint(len(s), set(s), s[:200])\npattern = r'(?:(.)(?!\\1))*.'\nl = [m.group() for m in finditer(pattern, s)]\nk = max(len(x) for x in l)\nx = [x for x in l if len(x) == k][-1]          # последняя из самых длинных\nprint(x)\nprint(max(x.count(c) for c in x))", "loops": "s = 'ABCCBBCBACABCABACCCBAABACAABBCBABCBBBACABCCCBAACC'\nprint(len(s), set(s), s[:200])\nbest = ''\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if all(ss[k] != ss[k+1] for k in range(len(ss) - 1)) and len(ss) >= len(best):\n            best = ss\nprint(max(best.count(c) for c in best))"}, "final": "(?:(.)(?!\\1))*.", "flags": "", "tree": [{"t": "(?:(.)(?!\\1))*", "d": "повторить ноль или больше раз — жадно (как можно больше):", "c": [{"t": "(.)", "g": 1, "d": "ГРУППА №1 — запоминает совпавший кусок: его вернёт findall, m.group(1), на него ссылается \\1", "c": [{"t": ".", "d": "точка — ровно один любой символ (кроме перевода строки, если нет флага S)"}]}, {"t": "(?!\\1)", "d": "просмотр вперёд: дальше НЕ должно идти следующее (символы не забираются, позиция не сдвигается):", "c": [{"t": "\\1", "d": "обратная ссылка: здесь должен стоять ТОТ ЖЕ текст, что совпал с группой №1"}]}]}, {"t": ".", "d": "точка — ровно один любой символ (кроме перевода строки, если нет флага S)"}], "groups": 1, "main": "rx", "norx": false, "d": 3, "alias": "", "realAns": "19", "src2": "", "real": "Определите максимальное количество подряд идущих символов, среди которых нет пар одинаковых символов. В ответе укажите количество повторений самого часто встречающегося символ в найденной строке. Если таких строк несколько, используйте последнюю из них.", "src": "сайт К. Полякова", "lvl": "", "file": "", "alts": []}, {"id": "1148", "blk": "RC", "role": "hw", "like": "2506", "star": false, "title": "", "idea": "", "note": "", "tr": "", "ask": "", "s": "BBBE\nBQQCFB\nEQCBE\nQQQQ\nEFDQBEACB", "ans": "Q8", "tpl": "s = 'BBBE\\nBQQCFB\\nEQCBE\\nQQQQ\\nEFDQBEACB'\nprint(len(s), set(s), s[:200])\nl = s.split('\\n')\nq = max(line.count('Q') for line in l)\nline = [x for x in l if x.count('Q') == q][-1]      # самая поздняя\nm = min(line.count(c) for c in set(line))\nc = ⟦min(c for c in set(line) if line.count(c) == m)⟧\nprint(line)\nprint(c + str(s.count(c)))", "methods": {"rx": "s = 'BBBE\\nBQQCFB\\nEQCBE\\nQQQQ\\nEFDQBEACB'\nprint(len(s), set(s), s[:200])\nl = s.split('\\n')\nq = max(line.count('Q') for line in l)\nline = [x for x in l if x.count('Q') == q][-1]      # самая поздняя\nm = min(line.count(c) for c in set(line))\nc = min(c for c in set(line) if line.count(c) == m)\nprint(line)\nprint(c + str(s.count(c)))", "loops": "s = 'BBBE\\nBQQCFB\\nEQCBE\\nQQQQ\\nEFDQBEACB'\nprint(len(s), set(s), s[:200])\nl = s.split('\\n')\nbest = None\nfor line in l:\n    if best is None or line.count('Q') >= best.count('Q'):\n        best = line\nd = {}\nfor c in best:\n    d[c] = d.get(c, 0) + 1\nm = min(d.values())\nc = min(x for x in d if d[x] == m)\nprint(c + str(s.count(c)))"}, "final": "", "flags": "", "tree": [], "groups": 0, "main": "rx", "norx": true, "d": 3, "alias": "2508", "realAns": "", "src2": "", "real": "Текстовый файл состоит не более чем из 10⁶ символов и содержит только заглавные буквы латинского алфавита (ABC…Z). Текст разбит на строки различной длины. Необходимо найти строку, содержащую наибольшее количество букв Q (если таких строк несколько, надо взять ту, которая в файле встретилась позже). Определите, какая буква встречается в этой строке реже всего (но присутствует!). Если таких букв несколько, надо взять ту, которая стоит раньше в алфавите. Запишите в ответе эту букву, а затем – сколько раз она встречается во всем файле.\nПример. Исходный файл:\nZZQAQB\nQAVQAB\nBAQTUB\nВ этом примере в первой и второй строках по две букву Q, в третьей – одна. Берём вторую строку, т.к. она стоит в файле позже. В этой строке реже других встречаются буквы V и B (по одному разу), выбираем букву B, т. к. она раньше стоит в алфавите. В ответе для этого примера надо записать B4, так как во всех строках файла буква B встречается 4 раза.", "src": "", "lvl": "Сложный", "file": "https://kompege.ru/files/rWKOZMZph.txt", "alts": []}, {"id": "2507", "blk": "RC", "role": "hw", "like": "2506", "star": false, "title": "", "idea": "", "note": "", "tr": "", "ask": "", "s": "DCQQQ\nBBCQABCC\nBBBCDC\nABECFFQD\nQCQQBFB", "ans": "Q8", "tpl": "from re import *\ns = 'DCQQQ\\nBBCQABCC\\nBBBCDC\\nABECFFQD\\nQCQQBFB'\nprint(len(s), set(s), s[:200])\nl = s.split('\\n')\nruns = [max(len(m.group()) for m in finditer(r'(.)\\1*', x)) for x in l]\nline = l[runs.index(max(runs))]            # самая ранняя\nm = max(line.count(c) for c in set(line))\nc = ⟦min(c for c in set(line) if line.count(c) == m)⟧\nprint(line)\nprint(c + str(s.count(c)))", "methods": {"rx": "from re import *\ns = 'DCQQQ\\nBBCQABCC\\nBBBCDC\\nABECFFQD\\nQCQQBFB'\nprint(len(s), set(s), s[:200])\nl = s.split('\\n')\nruns = [max(len(m.group()) for m in finditer(r'(.)\\1*', x)) for x in l]\nline = l[runs.index(max(runs))]            # самая ранняя\nm = max(line.count(c) for c in set(line))\nc = min(c for c in set(line) if line.count(c) == m)\nprint(line)\nprint(c + str(s.count(c)))", "loops": "s = 'DCQQQ\\nBBCQABCC\\nBBBCDC\\nABECFFQD\\nQCQQBFB'\nprint(len(s), set(s), s[:200])\nl = s.split('\\n')\ndef run(x):\n    b, k = 1, 1\n    for i in range(1, len(x)):\n        k = k + 1 if x[i] == x[i-1] else 1\n        b = max(b, k)\n    return b\nbest = l[0]\nfor line in l:\n    if run(line) > run(best):\n        best = line\nd = {}\nfor c in best:\n    d[c] = d.get(c, 0) + 1\nm = max(d.values())\nc = min(x for x in d if d[x] == m)\nprint(c + str(s.count(c)))"}, "final": "", "flags": "", "tree": [], "groups": 0, "main": "rx", "norx": true, "d": 3, "alias": "", "realAns": "", "src2": "", "real": "Текстовый файл состоит не более чем из 10⁶ символов и содержит только заглавные буквы латинского алфавита (ABC…Z). Текст разбит на строки различной длины. Необходимо найти строку, содержащую самую длинную цепочку стоящих подряд одинаковых букв. Если таких строк несколько, надо взять ту, которая в файле встретилась раньше. Определите, какая буква встречается в этой строке чаще всего. Если таких букв несколько, надо взять ту, которая стоит раньше в алфавите. Запишите в ответе эту букву, а затем – сколько раз она встречается во всем файле.\nПример. Исходный файл:\nZZQABA\nZALAAC\nQRAQUT\nВ этом примере в первой и второй строках наибольшая длина цепочек одинаковых буквы равна 2 (ZZ в первой строке, AA во второй), в третьей – 1. Берём первую строку, т.к. она находится в файле раньше. В этой строке чаще других встречаются буквы Z и A (по 2 раза), выбираем букву A, т. к. она стоит раньше в алфавите. В ответе для этого примера надо записать A6, так как во всех строках файла буква A встречается 6 раз.", "src": "", "lvl": "Сложный", "file": "https://kompege.ru/files/beXmcewXJ.txt", "alts": []}, {"id": "1255", "blk": "RC", "role": "hw", "like": "2506", "star": false, "title": "", "idea": "", "note": "", "tr": "", "ask": "", "s": "BBCEABFFFE\nBEQQBBBC\nQAQABBCFCC\nAAAE\nEFFFBBEB", "ans": "6", "tpl": "s = 'BBCEABFFFE\\nBEQQBBBC\\nQAQABBCFCC\\nAAAE\\nEFFFBBEB'\nprint(len(s), set(s), s[:200])\nl = s.split('\\n')\ndl = 0\nfor x in l:\n    if x.count('A') < 25:\n        for c in set(x):\n            dl = max(dl, ⟦x.rfind(c) - x.find(c)⟧)\nprint(dl)", "methods": {"rx": "s = 'BBCEABFFFE\\nBEQQBBBC\\nQAQABBCFCC\\nAAAE\\nEFFFBBEB'\nprint(len(s), set(s), s[:200])\nl = s.split('\\n')\ndl = 0\nfor x in l:\n    if x.count('A') < 25:\n        for c in set(x):\n            dl = max(dl, x.rfind(c) - x.find(c))\nprint(dl)", "loops": "s = 'BBCEABFFFE\\nBEQQBBBC\\nQAQABBCFCC\\nAAAE\\nEFFFBBEB'\nprint(len(s), set(s), s[:200])\ndl = 0\nfor x in s.split('\\n'):\n    if x.count('A') < 25:\n        for i in range(len(x)):\n            for j in range(i + 1, len(x)):\n                if x[i] == x[j]:\n                    dl = max(dl, j - i)\nprint(dl)"}, "final": "", "flags": "", "tree": [], "groups": 0, "main": "rx", "norx": true, "d": 2, "alias": "", "realAns": "", "src2": "", "real": "Текстовый файл содержит строки различной длины. Общий объём файла не превышает 1 Мбайт. \nСтроки содержат только заглавные буквы латинского алфавита (ABC…Z).\nВ строках, содержащих менее 25 букв A, нужно определить и вывести максимальное расстояние между одинаковыми буквами в одной строке.\n\nПример. Исходный файл:\nGIGA\nGABLAB\nNOTEBOOK\nAGAAA\nВ этом примере во всех строках меньше 25 букв A. Самое большое расстояние между одинаковыми буквами – в третьей строке между буквами O, расположенными в строке на 2-й и 7-й позициях. В ответе для данного примера нужно вывести число 5.", "src": "Статград 26.04.2021", "lvl": "Сложный", "file": "https://kompege.ru/files/v03s1T3pa.txt", "alts": []}, {"id": "1064", "blk": "RC", "role": "hw", "like": "2506", "star": false, "title": "", "idea": "", "note": "", "tr": "", "ask": "", "s": "AAAEAD\nQQBCAFBBC\nAAAAAQD\nBBFC\nBCQQDFDDFA", "ans": "ABQ", "tpl": "from re import *\ns = 'AAAEAD\\nQQBCAFBBC\\nAAAAAQD\\nBBFC\\nBCQQDFDDFA'\nprint(len(s), set(s), s[:200])\nl = s.split('\\n')\nd = {}\nfor x in l:\n    r = [m.group() for m in finditer(r'(.)\\1*', x)]\n    k = max(len(y) for y in r)\n    for c in set(y[0] for y in r if len(y) == k):\n        d[c] = d.get(c, 0) + 1\nm = max(d.values())\nprint(⟦''.join(sorted(c for c in d if d[c] == m))⟧)", "methods": {"rx": "from re import *\ns = 'AAAEAD\\nQQBCAFBBC\\nAAAAAQD\\nBBFC\\nBCQQDFDDFA'\nprint(len(s), set(s), s[:200])\nl = s.split('\\n')\nd = {}\nfor x in l:\n    r = [m.group() for m in finditer(r'(.)\\1*', x)]\n    k = max(len(y) for y in r)\n    for c in set(y[0] for y in r if len(y) == k):\n        d[c] = d.get(c, 0) + 1\nm = max(d.values())\nprint(''.join(sorted(c for c in d if d[c] == m)))", "loops": "s = 'AAAEAD\\nQQBCAFBBC\\nAAAAAQD\\nBBFC\\nBCQQDFDDFA'\nprint(len(s), set(s), s[:200])\nd = {}\nfor x in s.split('\\n'):\n    runs = {}\n    i = 0\n    while i < len(x):\n        j = i\n        while j < len(x) and x[j] == x[i]:\n            j += 1\n        runs[x[i]] = max(runs.get(x[i], 0), j - i)\n        i = j\n    k = max(runs.values())\n    for c in runs:\n        if runs[c] == k:\n            d[c] = d.get(c, 0) + 1\nm = max(d.values())\nprint(''.join(sorted(c for c in d if d[c] == m)))"}, "final": "", "flags": "", "tree": [], "groups": 0, "main": "rx", "norx": true, "d": 3, "alias": "", "realAns": "", "src2": "", "real": "Текстовый файл состоит из множества строк, каждая из которых может содержать буквы из набора A, B, C, D, E, F. \n\n1) Для каждой строки необходимо найти максимальную длину подстроки, состоящей из одинаковых символов.\n2) Для всего файла необходимо определить, какая буква чаще всего образует подстроки максимальной длины, найденные в предыдущем пункте.\n\nЕсли в строке несколько подстрок из различных букв, то считается, что каждая из этих букв составляет подстроку максимальной длины. Например, в строке AABBBBBDDCCCCCE, будет две буквы, составляющих подстроки максимальной длины – B и C.\n\nВ качестве ответа необходимо вывести буквы, которые чаще всего составляют подцепочки максимальной длины", "src": "Джобс 15.03.2021", "lvl": "Сложный", "file": "https://kompege.ru/files/YnfHLM97h.txt", "alts": []}, {"id": "27069", "blk": "RS", "role": "hw", "like": "27069", "star": true, "title": "", "idea": "", "note": "В ответе — количество СЛОВ, а не символов.", "tr": "", "ask": "", "s": "baAb ba Ba.b.a  AaBB. Aaa .Ab. bAA.Aa  b.b..ba..a", "ans": "3", "tpl": "from ество символов в непрерывной последовательности, которая является корректно записанным предложением. Считаем, что в корректно записанном предложении выполнены все следующие условия:\n– предложение начинается с заглавной буквы;\n– предложение оканчивается точкой, которая в предложении единственная и перед которой нет пробела;\n– слова в предложении состоят из произвольных комбинаций букв, возможно не имеют семантического смысла, но при этом только первая буква слова может быть заглавной;\n– слова в предложении разделены пробелами, два пробела стоять рядом в предложении не могут.\nВ ответе укажите количество слов в этом предложении.", "src": "", "lvl": "Средний", "file": "https://kompege.ru/files/DgACIgjCbXm.txt", "alts": []}, {"id": "19969", "blk": "RS", "role": "hw", "like": "27069", "star": false, "title": "", "idea": "", "note": "Точку экранируем: \\. — иначе это «любой символ». Нужен поиск с каждой позиции: в «a.bba@ab.bb» обычный findall съест «bba» в предыдущем совпадении.", "tr": "", "ask": "", "s": "ab@ba.abbaa@bba@ab.bb@aa@@b@.@@..bab@@a.@.bab@a", "ans": "11", "tpl": "from re import *\ns = 'ab@ba.abbaa@bba@ab.bb@aa@@b@.@@..bab@@a.@.bab@a'\nprint(len(s), set(s), s[:200])\npattern = r'⟦[a-z]+@[a-z]+\\.[a-z]+⟧'\npattern = f'(?=({pattern}))'\nl = findall(pattern, s)\nmaxs = max(l, key=len)\nprint(maxs, l)\nprint(len(maxs))", "methods": {"rx": "from re import *\ns = 'ab@ba.abbaa@bba@ab.bb@aa@@b@.@@..bab@@a.@.bab@a'\nprint(len(s), set(s), s[:200])\npattern = r'[a-z]+@[a-z]+\\.[a-z]+'\npattern = f'(?=({pattern}))'\nl = findall(pattern, s)\nmaxs = max(l, key=len)\nprint(maxs, l)\nprint(len(maxs))", "loops": "s = 'ab@ba.abbaa@bba@ab.bb@aa@@b@.@@..bab@@a.@.bab@a'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    p = ss.split('@')\n    if len(p) != 2:\n        return False\n    q = p[1].split('.')\n    return p[0].isalpha() and len(q) == 2 and q[0].isalpha() and q[1].isalpha()\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) > dl:\n            dl = len(ss)\nprint(dl)"}, "final": "(?=([a-z]+@[a-z]+\\.[a-z]+))", "flags": "", "tree": [{"t": "(?=([a-z]+@[a-z]+\\.[a-z]+))", "d": "просмотр вперёд: дальше ДОЛЖНО идти следующее (символы не забираются, позиция не сдвигается):", "c": [{"t": "([a-z]+@[a-z]+\\.[a-z]+)", "g": 1, "d": "ГРУППА №1 — запоминает совпавший кусок: его вернёт findall, m.group(1), на него ссылается \\1", "c": [{"t": "[a-z]+", "d": "повторить один или больше раз — жадно (как можно больше):", "c": [{"t": "[a-z]", "d": "один символ: от «a» до «z»"}]}, {"t": "@", "d": "символ «@»"}, {"t": "[a-z]+", "d": "повторить один или больше раз — жадно (как можно больше):", "c": [{"t": "[a-z]", "d": "один символ: от «a» до «z»"}]}, {"t": "\\.", "d": "символ «.»"}, {"t": "[a-z]+", "d": "повторить один или больше раз — жадно (как можно больше):", "c": [{"t": "[a-z]", "d": "один символ: от «a» до «z»"}]}]}]}], "groups": 1, "main": "rx", "norx": false, "d": 2, "alias": "", "realAns": "230", "src2": "", "real": "Текстовый файл состоит не более чем из 10⁶ символов и содержит только строчные латинские буквы, а также знаки «@» и «.» . Определите максимальное количество символов в непрерывной последовательности вида [буквы]@[буквы].[буквы] (например yasdamege@nasto.ballov). В ответе укажите количество символов.", "src": "", "lvl": "Сложный", "file": "https://kompege.ru/files/VvjdVL1gC.txt", "alts": []}, {"id": "28005", "blk": "RS", "role": "hw", "like": "27069", "star": false, "title": "", "idea": "", "note": "Имя: буквы, цифры, точки, но точки не подряд и не рядом с @. Сервер — одно из двух слов целиком.", "tr": "", "ask": "", "s": "1bbaa1.@@ab1@b@.1@baa@11ab@gmail.comru..1@1@.ab.a.", "ans": "14", "tpl": "from re import *\ns = '1bbaa1.@@ab1@b@.1@baa@11ab@gmail.comru..1@1@.ab.a.'\nprint(len(s), set(s), s[:200])\npattern = r'⟦[A-Za-z0-9](?:[A-Za-z0-9]|\\.(?!\\.))*(?<!\\.)@(?:yandex\\.ru|gmail\\.com)⟧'\npattern = f'(?=({pattern}))'\nl = findall(pattern, s)\nmaxs = max( имской системы счисления I, V, X, L, C, D, M. Найдите корректные римские записи максимальной длины. а) Укажите наименьшее десятичное значение. б) Для наибольшего значения укажите индекс последнего символа (с нуля; при равенстве — первый индекс). Ответ: два числа через пробел.\nПримечание.\nВ римской системе счисления приняты следующие правила:\n1) в качестве цифр используют заглавные латинские буквы I, V, X, L, C, D, M, числовое значение которых 1, 5, 10, 50, 100, 500 и 1000 соответственно;\n2) цифры V, L, D никогда не повторяются;\n3) цифры I, X, C, M могут повторяться не более трёх раз подряд;\n4) если меньшая цифра стоит слева от большей, её значение вычитается из большей; вычитать можно только одну цифру I, Х или С; вычитаемое не может быть меньше одной десятой от уменьшаемого;\n5) если цифра стоит справа от большей или равной, их значения складываются;\n6) цифры в записи числа располагаются слева направо в порядке невозрастания их числового значения за исключением случаев вычитания.\nНапример, запись MMXXVI является корректной и обозначает число 2026, а записи MDDIVXXX, IVIV, XCXC и MCMCMDCCCLXXXVIII являются некорректными.", "src": "", "lvl": "Гроб", "file": "https://kompege.ru/files/EHqzAkYtadk.txt", "alts": []}, {"id": "5263п", "blk": "R5", "role": "main", "like": "", "star": true, "title": "", "idea": "", "note": "Шаг — 3 символа, а четвёрку проверяем просмотром вперёд (?=…); в конце добираем последний символ. Четвёрок = (длина − 1) // 3.", "tr": "", "ask": "", "s": "DBAAEABEECBFEFFDFBBEFEBCEBCADFEBFABADFCAFBDACDECF", "ans": "2", "tpl": "from re import *\ns = 'DBAAEABEECBFEFFDFBBEFEBCEBCADFEBFABADFCAFBDACDECF'\nprint(len(s), set(s), s[:200])\npattern = r'⟦(?:(?=ABEC|BDAC|CAFB|CFBA)...)+.⟧'\npattern = f'(?=({pattern}))'\nl = findall(pattern, s)\nmaxs = max(l, key=len)\nprint(maxs, l)\nprint(⟦(len(maxs) - 1) // 3⟧)", "methods": {"rx": "from re import *\ns = 'DBAAEABEECBFEFFDFBBEFEBCEBCADFEBFABADFCAFBDACDECF'\nprint(len(s), set(s), s[:200])\npattern = r'(?:(?= EDDDDBFFFA'\nprint(len(s), set(s), s[:200])\npattern = r'⟦(.)\\1*⟧'\nl = [m.group() for m in finditer(pattern, s)]       # серии одинаковых букв\ndl = 0\nfor i in range(len(l) - 3):\n    if ⟦l[i][0] < l[i+1][0] < l[i+2][0] < l[i+3][0]⟧:\n        dl = max(dl, len(l[i]) + len(l[i+1]) + len(l[i+2]) + len(l[i+3]))\nprint(dl)", "methods": {"rx": "from re import *\ns = 'CCCCADFFFEBFFFEEEFBAFCCDDBBBAAACBFFBBDDDEFFDDAAEEAAAFFFFFBBDFFEDDDDBFFFA'\nprint(len(s), set(s), s[:200])\npattern = r'(.)\\1*'\nl = [m.group() for m in finditer(pattern, s)]       # серии одинаковых букв\ndl = 0\nfor i in range(len(l) - 3):\n    if l[i][0] < l[i+1][0] < l[i+2][0] < l[i+3][0]:\n        dl = max(dl, len(l[i]) + len(l[i+1]) + len(l[i+2]) + len(l[i+3]))\nprint(dl)", "loops": "s = 'CCCCADFFFEBFFFEEEFBAFCCDDBBBAAACBFFBBDDDEFFDDAAEEAAAFFFFFBBDFFEDDDDBFFFA'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    return len(set(ss)) == 4 and list(ss) == sorted(ss)\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) > dl:\n            dl = len(ss)\nprint(dl)"}, "final": "(.)\\1*", "flags": "", "tree": [{"t": "(.)", "g": 1, "d": "ГРУППА №1 — запоминает совпавший кусок: его вернёт findall, m.group(1), на него ссылается \\1", "c": [{"t": ".", "d": "точка — ровно один любой символ (кроме перевода строки, если нет флага S)"}]}, {"t": "\\1*", "d": "повторить ноль или больше раз — жадно (как можно больше):", "c": [{"t": "\\1", "d": "обратная ссылка: здесь должен стоять ТОТ ЖЕ текст, что совпал с группой №1"}]}], "groups": 1, "main": "rx", "norx": false, "d": 4, "alias": "", "realAns": "", "src2": "", "real": "Текстовый файл содержит только заглавные буквы латинского алфавита (ABC…Z). Определите длину наибольшей последовательности из ЧЕТЫРЁХ различных символов, расположенных в порядке неубывания.\nНапример, для строки AABBAABBCCDDDEFFGF такая последовательность — AABBCCDDD, её длина — 9.", "src": "учебный аналог", "lvl": "", "file": "", "alts": []}, {"id": "8431а", "blk": "RF", "role": "hw", "like": "14510", "star": true, "title": "", "idea": "Разделители налезают друг на друга — их позиции даёт просмотр вперёд (?=ABC|ACB|…). Закрашиваем все их символы и режем строку split.", "note": "Разделители налезают друг на друга, поэтому их позиции находим просмотром вперёд, закрашиваем все их символы и режем строку. Чистой регуляркой это неудобно.", "tr": "", "ask": "", "s": "CACBACACCACDAEBBAEACBCAFBBBAEBDABABECCBCGCBAGBACCBFBGECBBFDD", "ans": "18", "tpl": "from re import *\ns = 'CACBACACCACDAEBBAEACBCAFBBBAEBDABABECCBCGCBAGBACCBFBGECBBFDD'\nprint(len(s), set(s), s[:200])\np = [m.start() for m in finditer(r'⟦(?=ABC|ACB|BAC|BCA|CAB|CBA)⟧', s)]   # где начинается разделитель\ncut = [False] * len(s)\nfor i in p:\n    for k in range(i, i + 3):\n        cut[k] = True\nt = ''.join(' ' if cut[k] else s[k] for k in range(len(s)))\nl = t.split()\nprint(l)\nprint(max(len(x) for x in l))", "methods": {"pos": "from re import *\ns = 'CACBACACCACDAEBBAEACBCAFBBBAEBDABABECCBCGCBAGBACCBFBGECBBFDD'\nprint(len(s), set(s), s[:200])\np = [m.start() for m in finditer(r'(?=ABC|ACB|BAC|BCA|CAB|CBA)', s)]   # где начинается разделитель\ncut = [False] * len(s)\nfor i in p:\n    for k in range(i, i + 3):\n        cut[k] = True\nt = ''.join(' ' if cut[k] else s[k] for k in range(len(s)))\nl = t.split()\nprint(l)\nprint(max(len(x) for x in l))", "loops": "s = 'CACBACACCACDAEBBAEACBCAFBBBAEBDABABECCBCGCBAGBACCBFBGECBBFDD'\nprint(len(s), set(s), s[:200])\ncut = [False] * len(s)\nfor i in range(len(s) - 2):\n    if sorted(s[i:i+3]) == ['A', 'B', 'C']:\n        cut[i] = cut[i+1] = cut[i+2] = True\nt = ''.join(' ' if cut[k] else s[k] for k in range(len(s)))\nprint(max(len(x) for x in t.split()))"}, "final": "", "flags": "", "tree": [], "groups": 0, "main": "pos", "norx": true, "d": 4, "alias": "", "realAns": "", "src2": "", "real": "Шифровка содержит только заглавные буквы латинского алфавита (ABC…Z). Группа из трёх идущих подряд символов, содержащая по одному разу каждую из букв A, B и C, считается разделителем. Разделители могут накладываться друг на друга: например, ABCAB — это разделители ABC, BCA и CAB.\nПри дешифровке разделители удаляются, разбивая шифровку на фрагменты. Определите количество символов в самом длинном фрагменте.", "src": "учебный аналог", "lvl": "", "file": "", "alts": [], "fiTag": true}], "examples": {"R1": [{"text": "NEWYEARXNEWYEARQ", "pat": "NEWYEAR", "mode": "", "spans": [[0, 7], [8, 15]], "res": "findall(pattern, s) → ['NEWYEAR', 'NEWYEAR']", "cmt": "Шаблон-слово находит само слово."}, {"text": "GAMEGXMEGME", "pat": "G.ME", "mode": "", "spans": [[0, 4], [4, 8]], "res": "findall(pattern, s) → ['GAME', 'GXME']", "cmt": "Точка — один любой символ: GXME подходит, GME — нет."}, {"text": "AAAA", "pat": "AA", "mode": "", "spans": [[0, 2], [2, 4]], "res": "findall(pattern, s) → ['AA', 'AA']", "cmt": "Обычный поиск продолжает с конца найденного: только 2 пары."}, {"text": "AAAA", "pat": "(?=(AA))", "mode": "", "spans": [[0, 2], [1, 3], [2, 4]], "res": "findall(pattern, s) → ['AA', 'AA', 'AA']", "cmt": "Просмотр вперёд ничего не забирает — найдены все 3 пары."}, {"text": "BOSSJBOSSBOSS", "pat": "(?<!J)BOSS(?!J)", "mode": "", "spans": [[9, 13]], "res": "findall(pattern, s) → ['BOSS']", "cmt": "Соседи проверены, но не забраны: третья BOSS тоже найдена."}], "R2": [{"text": "ABDCDEFFAB", "pat": "[^D]+", "mode": "", "spans": [[0, 2], [3, 4], [5, 10]], "res": "findall(pattern, s) → ['AB', 'C', 'EFFAB']", "cmt": "Куски между буквами D."}, {"text": "AB12C345D6", "pat": "\\d+", "mode": "", "spans": [[2, 4], [5, 8], [9, 10]], "res": "findall(pattern, s) → ['12', '345', '6']", "cmt": "Серии цифр."}, {"text": "AAABCCCCD", "pat": "(.)\\1*", "mode": "finditer", "spans": [[0, 3], [3, 4], [4, 8], [8, 9]], "res": "[m.group() for m in finditer(pattern, s)] → ['AAA', 'B', 'CCCC', 'D']", "cmt": "Серии одинаковых: findall вернул бы одни буквы из группы."}], "R3": [{"text": "BACODAXBO", "pat": "(?:[BCD][AO])+", "mode": "", "spans": [[0, 6], [7, 9]], "res": "findall(pattern, s) → ['BACODA', 'BO']", "cmt": "Пары «согласная + гласная» подряд."}, {"text": "DBBBDD", "pat": "(?:BB|DD)+", "mode": "", "spans": [[1, 3], [4, 6]], "res": "findall(pattern, s) → ['BB', 'DD']", "cmt": "Без перекрытия цепочка BBDD потеряна."}, {"text": "DBBBDD", "pat": "(?=((?:BB|DD)+))", "mode": "", "spans": [[1, 3], [2, 6], [4, 6]], "res": "findall(pattern, s) → ['BB', 'BBDD', 'DD']", "cmt": "С перекрытием — найдена."}, {"text": "CBABCBDBC", "pat": "(?=(CB(.)BC))", "mode": "", "spans": [[0, 5], [4, 9]], "res": "findall(pattern, s) → [('CBABC', 'A'), ('CBDBC', 'D')]", "cmt": "findall вернул кортежи: (весь кусок, буква из группы 2)."}], "R4": [{"text": "ABDFFDFFAB", "pat": "(?:(?!DFFD).)+", "mode": "", "spans": [[0, 2], [3, 10]], "res": "findall(pattern, s) → ['AB', 'FFDFFAB']", "cmt": "Так нельзя: кусок обрывается перед D, теряется «DFF»."}, {"text": "ABDFFDFFAB", "pat": "(?=((?:(?!DFFD).)*.{0,3}))", "mode": "", "spans": [[0, 5], [1, 5], [2, 5], [3, 10], [4, 10], [5, 10], [6, 10], [7, 10], [8, 10], [9, 10]], "res": "findall(pattern, s) → ['ABDFF', 'BDFF', 'DFF', 'FFDFFAB', 'FDFFAB', 'DFFAB', 'FFAB', 'FAB', 'AB', 'B', '']", "cmt": "Правильно: + хвост из 3 символов, поиск с каждой позиции."}, {"text": "AAABBBA", "pat": "(?=((?:(?!(.)\\2\\2).)*.{0,2}))", "mode": "", "spans": [[0, 2], [1, 5], [2, 5], [3, 5], [4, 7], [5, 7], [6, 7]], "res": "findall(pattern, s) → [('AA', ''), ('AABB', ''), ('ABB', ''), ('BB', ''), ('BBA', ''), ('BA', ''), ('A', ''), ('', '')]", "cmt": "Запрет «три одинаковых»: (.) — группа 2 из-за обёртки."}], "R5": [{"text": "XYXXZYZZ", "pat": "(?:(.)(?!\\1))*.", "mode": "finditer", "spans": [[0, 3], [3, 7], [7, 8]], "res": "[m.group() for m in finditer(pattern, s)] → ['XYX', 'XZYZ', 'Z']", "cmt": "Соседи различны."}, {"text": "DEFEFFE", "pat": "[EF](?:(?<=E)F|(?<=F)E)*", "mode": "", "spans": [[1, 5], [5, 7]], "res": "findall(pattern, s) → ['EFEF', 'FE']", "cmt": "Чередование E и F через просмотр назад."}, {"text": "XXYZYZZ", "pat": "X*Y*Z*", "mode": "", "spans": [[0, 4], [4, 7]], "res": "findall(pattern, s) → ['XXYZ', 'YZZ', '']", "cmt": "Алфавитный порядок (и пустые совпадения)."}], "R6": [{"text": "12=7=345==8", "pat": "\\d+(?:=\\d+)*", "mode": "", "spans": [[0, 8], [10, 11]], "res": "findall(pattern, s) → ['12=7=345', '8']", "cmt": "Цепочки «число=число…»: двойное == разрывает цепочку."}, {"text": "2*3+04", "pat": "(?=((?:0|[1-9]\\d*)(?:[+*](?:0|[1-9]\\d*))*))", "mode": "", "spans": [[0, 5], [2, 5], [4, 5], [5, 6]], "res": "findall(pattern, s) → ['2*3+0', '3+0', '0', '4']", "cmt": "С каждой позиции — самое длинное выражение; 04 не число, поэтому «+0» — и всё."}, {"text": "0012", "pat": "(?:0|[1-9][0-9]*)", "mode": "", "spans": [[0, 1], [1, 2], [2, 4]], "res": "findall(pattern, s) → ['0', '0', '12']", "cmt": "Числа без ведущих нулей: «0» — отдельное число."}, {"text": "12+04*6", "pat": "(?:[1-9]\\d*)?[02468](?:[+*](?:[1-9]\\d*)?[02468])*", "mode": "", "spans": [[0, 4], [4, 7]], "res": "findall(pattern, s) → ['12+0', '4*6']", "cmt": "Выражение из чётных чисел: 04 — нельзя."}], "R7": [{"text": "ABCBABA", "pat": "(?=((.)(.).\\3\\2))", "mode": "", "spans": [[0, 5]], "res": "findall(pattern, s) → [('ABCBA', 'A', 'B')]", "cmt": "Один палиндром длины 5 — ABCBA. findall вернул кортеж групп: (весь палиндром, 1-я буква, 2-я буква)."}], "R8": [{"text": "DFDDFDFD", "pat": "(?=([^F]*(?:F[^F]*){0,1}))", "mode": "", "spans": [[0, 4], [1, 4], [2, 6], [3, 6], [4, 6], [5, 8], [6, 8], [7, 8]], "res": "findall(pattern, s) → ['DFDD', 'FDD', 'DDFD', 'DFD', 'FD', 'DFD', 'FD', 'D', '']", "cmt": "С каждой позиции — кусок, где F не больше одного раза."}, {"text": "A.B..C.D", "pat": "\\.(?:[^.]*\\.){2}", "mode": "", "spans": [[1, 5]], "res": "findall(pattern, s) → ['.B..']", "cmt": "От точки до третьей точки."}], "R9": [{"text": "AZBRO\nQQZ\nZZROX", "pat": "^.*Z.RO.*$", "mode": "M", "spans": [[0, 5], [10, 15]], "res": "findall(pattern, s, M) → ['AZBRO', 'ZZROX']", "cmt": "С флагом M каждая строка — отдельно; точка не переходит через \\n."}], "RS": [{"text": "Ab cb. Ca Ab c.", "pat": "[ABC][abc]*(?: [ABCabc][abc]*)*\\.", "mode": "", "spans": [[0, 6], [7, 15]], "res": "findall(pattern, s) → ['Ab cb.', 'Ca Ab c.']", "cmt": "Корректные предложения."}], "RW": [{"text": "ABFSRQCDFSRQEFSRQGH", "pat": "FSRQ", "mode": "", "spans": [[2, 6], [8, 12], [13, 17]], "res": "findall(pattern, s) → ['FSRQ', 'FSRQ', 'FSRQ']", "cmt": "Вхождения слова. s.split('FSRQ') → ['AB', 'CD', 'E', 'GH'] — куски между ними."}, {"text": "BABABAB", "pat": "(?=(BAB))", "mode": "", "spans": [[0, 3], [2, 5], [4, 7]], "res": "findall(pattern, s) → ['BAB', 'BAB', 'BAB']", "cmt": "Налезающие вхождения: split их не разделит — берём позиции через просмотр вперёд."}, {"text": "XDFFDFFDY", "pat": "DFFD", "mode": "", "spans": [[1, 5]], "res": "findall(pattern, s) → ['DFFD']", "cmt": "replace('DFFD', 'DFF FFD') разрезает запрет пробелом, потом split()."}], "RC": [{"text": "ABCABAA", "pat": "A", "mode": "", "spans": [[0, 1], [3, 4], [5, 6], [6, 7]], "res": "findall(pattern, s) → ['A', 'A', 'A', 'A']", "cmt": "count считает то же, что len(findall): s.count('A') → 4. Для частот регулярка не нужна."}], "RF": [], "RL": []}}</script>

function confetti() {
  const c = document.createElement('canvas'); c.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:300'; c.width = innerWidth; c.height = innerHeight; document.body.appendChild(c);
  const g = c.getContext('2d'), P = Array.from({length: 110}, () => ({x: innerWidth / 2, y: innerHeight / 3, vx: (Math.random() - .5) * 16, vy: Math.random() * -12 - 3, c: ['#4f6bff', '#7b5cff', '#16a36a', '#ffd666', '#ff8a00', '#e5484d'][Math.random() * 6 | 0], r: Math.random() * 6 + 3}));

function counts(s, list) { s = s || stu(); const L = list || ORDER; const c = {ok: 0, err: 0, hint: 0, fill: 0, mark: 0, new: 0, total: L.length}; L.forEach(id => { const x = s.tasks[id]; c[x && x.st ? x.st : 'new']++; }); c.done = c.total - c.new; return c; }
const hwList = () => ORDER.filter(id => FL(id).hw);
function filterIds(ids) {
  const s = stu();
  if (cur.filter === 'hw') return ids.filter(id => FL(id).hw);
  if (cur.filter === 'fav') return ids.filter(id => FL(id).fav);
  if (cur.filter === 'new') return ids.filter(id => !solved(s.tasks[id]));
  return ids;
}
function navList() {
  const s = stu();
  if (cur.filter === 'hw') return hwList();
  if (cur.filter === 'fav') return ORDER.filter(id => FL(id).fav);
  if (cur.filter === 'review') return ORDER.filter(id => REVIEW_DELETE[id]);
  if (cur.filter === 'new') return ORDER.filter(id => !solved(s.tasks[id]));
  return ORDER;
}
function nextUnsolved(from) { const s = stu(), L = navList(), i = Math.max(0, L.indexOf(from)); for (let k = 1; k <= L.length; k++) { const id = L[(i + k) % L.length]; if (!solved(s.tasks[id])) return id; } return null; }

function hlText(text, spans) {
  const cls = Array(text.length).fill(-1);
  spans.forEach((sp, k) => { for (let i = sp[0]; i < sp[1]; i++) cls[i] = k; });
  let h = '', i = 0;
  while (i < text.length) {
    let j = i; while (j < text.length && cls[j] === cls[i]) j++;
    const piece = esc(text.slice(i, j)).replace(/\n/g, '<span class="nl">↵</span>\n');
    h += cls[i] >= 0 ? `<mark class="m${cls[i] % 2}">${piece}</mark>` : piece; i = j;
  }
  return h;
}
function exCard(e) {

}

/* ===== Пояснения к строкам кода ===== */
function lineNotes(code, t) {
  const ng = t ? t.groups : 0;
  return code.split('\n').map(line => {
    const L = line.trim(); let d = '';
    if (/^from re import \*/.test(L)) d = 'подключаем все функции модуля re: findall, finditer, search, fullmatch, split, sub';
    else if (/^s = '/.test(L)) d = /\\n/.test(L) ? 'учебный текст из нескольких строк (\\n — перевод строки). На экзамене: s = open(\'24.txt\').read()' : 'учебная строка. На экзамене: s = open(\'24.txt\').readline().strip()';
    else if (/^print\(len\(s\), set\(s\)/.test(L)) d = 'проверка: длина строки, какие символы в ней есть, начало строки';
    else if (/^num = r'/.test(L)) d = 'кусок шаблона «одно число» — подставим его в выражение через f-строку';
    else if (/^pattern = rf'/.test(L)) d = 'f-строка: вместо {num} Python подставит шаблон числа';
    else if (/^pattern = r'/.test(L)) d = 'сама регулярка. r перед кавычкой — «сырая» строка: \\d, \\1 остаются как есть';
    else if (/^pattern = f'\(\?=\(\{pattern\}\)\)'/.test(L)) d = 'обёртка: просмотр вперёд — поиск с КАЖДОЙ позиции (с перекрытиями). Весь кусок попадает в группу 1, группы внутри шаблона сдвигаются: начинаются с 2';
    else if (/^l = findall\(pattern, s, M\)/.test(L)) d = 'findall с флагом M: ^ и $ — начало и конец каждой строки; одно совпадение — одна строка';
    else if (/^l = findall\(pattern, s\)/.test(L)) d = ng === 0 ? 'findall — список всех найденных кусков (без перекрытий: поиск продолжается с конца найденного)' : ng === 1 ? 'в шаблоне одна группа — findall вернёт список её содержимого' : 'в шаблоне ' + ng + ' групп(ы) — findall вернёт список кортежей (группа1, группа2, …)';
    else if (/^l = \[c\[0\] for c in l\]/.test(L)) d = 'из каждого кортежа берём c[0] — группу 1, то есть весь найденный кусок';
    else if (/^l = \[m\.group\(\) for m in finditer/.test(L)) d = 'finditer выдаёт объекты-совпадения; m.group() — весь найденный кусок, даже если в шаблоне есть группы';
    else if (/^maxs = max\(l, key=len\)/.test(L)) d = 'самый длинный элемент списка (key=len — сравниваем по длине, а не по алфавиту)';
    else if (/^mins = min\(l, key=len\)/.test(L)) d = 'самый короткий элемент списка';
    else if (/^print\(len\(maxs\) \/\/ (\d)\)/.test(L)) d = 'длина куска, делённая на ' + /\/\/ (\d)/.exec(L)[1] + ' — количество блоков; это ответ';
    else if (/^print\(len\((maxs|mins)\)\)/.test(L)) d = 'длина найденного куска — ответ';
    else if (/^print\(len\(l\)\)/.test(L)) d = 'сколько найдено — длина списка; это ответ';
    else if (/^print\((maxs|mins), l\)/.test(L)) d = 'проверка глазами: сам кусок и весь список найденного';
    else if (/^print\(l\)/.test(L)) d = 'весь список найденного — для проверки';
    else if (/^l = \[c\[1\] for c in l\]/.test(L)) d = 'из каждого кортежа берём c[1] — группу 2 (букву в середине)';
    else if (/^l = \[\(l\.count\(c\), c\)/.test(L)) d = 'для каждой буквы — пара (сколько раз встретилась, буква)';
    else if (/^k, c = max\(l\)/.test(L)) d = 'самая частая буква: max сравнивает пары сначала по количеству';
    else if (/eval\(ss, \{"__builtins__": \{\}\}\)/.test(L)) d = 'fullmatch пропускает только цифры и знаки, а eval без встроенных функций ({"__builtins__": {}}) не может вызвать ничего постороннего — считаем значение выражения безопасно';
    else if (/^def calc\(/.test(L)) d = 'своя функция вместо eval: делим по + на слагаемые, каждое по * на множители — так соблюдается приоритет умножения';
    else if (/^p = \[-1\] \+ p \+/.test(L)) d = '«пустые» соседи за краями строки: тогда начало и конец строки работают как обычная середина — одна формула без if';
    else if (/^l = s\.split\(w\)/.test(L)) d = 'режем строку по слову: между соседними кусками стоит ровно одно слово';
    else if (/^for (part|x) in /.test(L) && /split/.test(L)) d = 'перебираем куски после разрезания';
    else if (/#/.test(L)) d = L.slice(L.indexOf('#') + 1).trim();
    return {line, d};
  });
}

import json, re, time
def _dbg(p):
    flags = 0
    for ch in p.get('flags', ''):
        flags |= {'M': re.M, 'I': re.I, 'S': re.S}.get(ch, 0)
    pat = p.get('pat', '')
    if p.get('wrap'):
        pat = '(?=(' + pat + '))'
    a = analyze_pattern(pat, flags)
    a['final'] = pat
    if not a['ok']:
        return a
    rx = re.compile(pat, flags)
    try:
        a['simple'] = unparse(_P.parse(pat, flags))
    except Exception:
        a['simple'] = pat
    s = p.get('s', '')
    t0 = time.time()
    ms = []
    prev = 0
    for m in rx.finditer(s):
        g = []
        for i in range(1, rx.groups + 1):
            sp = m.span(i)
            g.append(list(sp) if sp[0] >= 0 else None)
        ms.append({'s': m.start(), 'e': m.end(), 'from': prev, 'g': g})
        prev = m.end()
        if len(ms) >= 1500:
            a['cut'] = True
            break
    a['ms'] = ms
    def R(f):
        try:
            return repr(f())[:3000]
        except Exception as e:
            return '⚠ ' + type(e).__name__ + ': ' + str(e)
    fa = rx.findall(s)
    a['findall'] = repr(fa)[:3000]
    a['nfind'] = len(fa)
    a['search'] = R(lambda: rx.search(s))
    a['match'] = R(lambda: rx.match(s))
    a['fullmatch'] = R(lambda: rx.fullmatch(s))
    a['split'] = R(lambda: rx.split(s))
    a['sub'] = R(lambda: rx.sub(p.get('repl', ' '), s))
    a['time'] = round((time.time() - t0) * 1000, 1)
    return a

   `<div class="chg"><b>Функции</b><table class="bth"><tr><td><code>findall(p, s)</code></td><td>список всех совпадений (или групп)</td></tr><tr><td><code>finditer(p, s)</code></td><td>объекты m: m.group(), m.start(), m.end()</td></tr><tr><td><code>search(p, s)</code></td><td>первое совпадение где угодно или None</td></tr><tr><td><code>fullmatch(p, ss)</code></td><td>подходит ли ss целиком</td></tr><tr><td><code>split(p, s)</code></td><td>куски между совпадениями</td></tr><tr><td><code>sub(p, r, s)</code></td><td>заменить совпадения на r</td></tr><tr><td><code>findall(p, s, M)</code></td><td>флаг M: ^ и $ для каждой строки</td></tr></table></div>`;
}

/* ===== Консоль (как в приложении 5) ===== */
const CON_CHIPS = ["findall('[^D]+', s)", "len(findall('AB', s))", "max(findall('[^D]+', s), key=len)", "[m.span() for m in finditer('AB', s)]", "m = search('(A)(B+)', s)", 'm.group(), m.group(1), m.group(2)', "m.start(), m.end()", "findall('(?=(AB))', s)", "split('D', s)", "sub('D', ' ', s)", "fullmatch('[A-F]+', s)", "findall('(.)\\\\1', s)", "pattern = r'(?:AB|AC)+'", 'findall(pattern, s)', "s.replace('D', ' ').split()"];
let CONLOG = [], CONHIST = [];
function openConsole(preset) {
  const s = stu(); if (s) { s.con = (s.con || 0) + 1; bump(); }
  modal(`<div class="mhead"><h2>🧪 Консоль Python</h2><button class="btn sm" id="cRst" title="Забыть все переменные">♻ Сбросить переменные</button><button class="btn sm" id="cClr">🧹 Очистить экран</button><button class="btn ghost" id="cX">✕</button></div>
   <div class="con"><div class="conlog" id="clog"></div>
    <div class="conside"><b>Переменные на всю сессию</b><textarea id="cvars" spellcheck="false"></textarea><button class="btn sm pri" id="cApply">▶ Применить переменные</button><div style="font-weight:800;margin:10px 0 6px">Попробуй:</div><div class="chips">${CON_CHIPS.map((c, i) => `<button data-ch="${i}">${esc(c)}</button>`).join('')}</div>
    <p style="color:var(--mut);font-size:13px">Enter — выполнить, Shift+Enter — новая строка, ↑ ↓ — история.<br>Уже подключено: <code class="i">from re import *</code>. print писать не нужно — значение покажется само.</p></div></div>`, 'full');
  const log = $('#clog'), varsEditor = $('#cvars'); varsEditor.value = (s && s.consoleVars) || "s = 'ABDCABDEFFDACAB'";
  const execute = async (v, quiet) => { if (!v.trim()) return; if (!quiet) { CONHIST.push(v); CONLOG.push({k: 'cmd', v}); }
    const r = await PY.repl(v, {onStatus: m => { CONLOG.push({k: 'pr', v: m}); draw(); }}); CONLOG = CONLOG.filter(z => !(z.k === 'pr' && /Загружаю/.test(z.v)));
    if (r.out) CONLOG.push({k: 'pr', v: r.out.replace(/\n$/, '')}); if (r.ok && r.val != null) CONLOG.push({k: 'res', v: r.val});
    if (r.ok && !r.out && r.val == null && !quiet) CONLOG.push({k: 'pr', v: '✓ Выполнено.'}); if (!r.ok) { CONLOG.push({k: 'err', v: r.err}); CONLOG.push({k: 'pr', v: '↳ ' + translatePythonError(r.err)}); }
    CON_READY = true; draw(); };
  const draw = () => { if (!$('#clog')) return; log.innerHTML = CONLOG.map(e => e.k === 'cmd' ? `<div class="cmd">${esc(e.v.split('\n').map((l, i) => (i ? '... ' : '>>> ') + l).join('\n'))}</div>` : `<div class="${e.k}">${esc(e.v)}</div>`).join('') + `<div class="conin"><span>&gt;&gt;&gt;</span><textarea id="cin" rows="1" spellcheck="false"></textarea></div>`;
    const ta = $('#cin'); ta.focus(); log.scrollTop = log.scrollHeight; let hp = CONHIST.length;
    const fit = () => { ta.rows = Math.max(1, ta.value.split('\n').length); }; ta.addEventListener('input', fit);
    ta.addEventListener('keydown', async e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); const v = ta.value; if (!v.trim()) return; if (/:\s*$/.test(v.split('\n').slice(-1)[0])) { ta.value = v + '\n    '; fit(); return; } ta.disabled = true; await execute(v); }
      else if (e.key === 'Tab') { e.preventDefault(); document.execCommand('insertText', false, '    '); }
      else if (e.key === 'ArrowUp' && !ta.value.includes('\n')) { e.preventDefault(); if (hp > 0) { hp--; ta.value = CONHIST[hp]; fit(); } }
      else if (e.key === 'ArrowDown' && !ta.value.includes('\n')) { e.preventDefault(); if (hp < CONHIST.length - 1) { hp++; ta.value = CONHIST[hp]; } else { hp = CONHIST.length; ta.value = ''; } fit(); }
    }); return ta; };
  let ta = draw();
  if (preset) { varsEditor.value = preset; }
  $('#cApply').onclick = () => { if (s) s.consoleVars = varsEditor.value; bump(); execute(varsEditor.value); };
  document.querySelectorAll('[data-ch]').forEach(b => b.onclick = () => { const t = $('#cin'); t.value = CON_CHIPS[+b.dataset.ch]; t.focus(); });
  $('#cX').onclick = closeModal; $('#cClr').onclick = () => { CONLOG = []; ta = draw(); };
  $('#cRst').onclick = async () => { CON_READY = false; await PY.repl('None', {reset: true}); CONLOG.push({k: 'pr', v: '♻ Переменные сброшены; применяю стартовые значения'}); await execute(varsEditor.value, true); };
  if (!CON_READY || preset) { if (s) s.consoleVars = varsEditor.value; execute(varsEditor.value, true); }
}

/* ===== Отчёт ===== */
function hintStr(x) { const h = []; if (x.hint >= 1) h.push('подсказка'); if (x.hint >= 2) h.push('разбор'); if (x.hint >= 3) h.push('заполнил поля / готовый код'); if (x.dbg) h.push('отладчик ×' + x.dbg); return h.join(', '); }
function calcReport(name) {
  const s = DB.students[name];
  const ids = cur.filter === 'hw' ? hwList() : ORDER;
  const rows = ids.map(id => ({id, t: TK[id], x: normX(Object.assign({}, s.tasks[id] || {})), hw: !!FL(id).hw}));
  const c = counts(s, ids), hw = hwList(), ch = counts(s, hw);
  const byBlk = BLOCKS.map(b => { const all = ids.filter(id => TK[id].blk === b.id), cc = counts(s, all); return {b, total: all.length, done: cc.done, self: cc.ok + cc.err, help: cc.hint + cc.fill, wrong: all.reduce((a, id) => a + ((s.tasks[id] || {}).wrong || []).length, 0)}; });
  return {s, c, ch, hwN: hw.length, rows, byBlk, wrongTotal: rows.reduce((a, r) => a + r.x.wrong.length, 0)};
}
function reportDialog(name, teacher) {
  if (!DB.students[name]) return; tickTime();

   <div class="stats">${[['Решено', r.c.done + ' / ' + r.c.total], ['ДЗ', r.hwN ? r.ch.done + ' / ' + r.ch.total : '—'], ['Сам, с 1-й', r.c.ok], ['Сам, после ошибок', r.c.err], ['С подсказкой', r.c.hint], ['Заполнил поля', r.c.fill], ['Неверных ответов', r.wrongTotal], ['Время', fmtT(r.s.totalMs || 0)]].map(([a, b]) => `<div class="stat"><b>${b}</b><span>${a}</span></div>`).join('')}</div>
   <table class="st"><tr><th>Блок</th><th>Решено</th><th>Сам</th><th>С помощью</th><th>Ошибок</th></tr>${r.byBlk.map(b => `<tr><td>${b.b.id} · ${esc(b.b.name)}</td><td>${b.done}/${b.total}</td><td>${b.self}</td><td>${b.help}</td><td>${b.wrong}</td></tr>`).join('')}</table>
   <details open><summary style="cursor:pointer;font-weight:800">${cur.filter === 'hw' ? 'Все задачи ДЗ' : 'Все задачи'} (${r.rows.length})</summary><table class="st"><tr><th>№</th><th>Итог</th><th>Попыток</th><th>Неверные ответы</th><th>Помощь</th><th>Ответ по файлу</th>${showAns ? '<th>Верный ответ (учебная строка)</th>' : ''}</tr>

   <p class="vhint">Отладчик открывался: ${r.s.dbg || 0} · дни: ${(r.s.days || []).map(d => d.split('-').reverse().slice(0, 2).join('.')).join(', ')}</p>

  $('#rX').onclick = closeModal;
  $('#rD').onclick = async () => { const f = await makeReportPDF(name, teacher, $('#rCode').checked); download(f, f.name); showSendHelp(name, true); };
  $('#rS').onclick = async () => {
    const f = await makeReportPDF(name, teacher, $('#rCode').checked);
    try { if (navigator.canShare && navigator.canShare({files: [f]})) { await navigator.share({files: [f], title: 'Отчёт: ' + name, text: reportText(name)}); $('#rMsg').innerHTML = '<div class="fb show good">Отчёт передан ✅</div>'; return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    download(f, f.name); showSendHelp(name, false);

    if (!was) { x.st = x.hint >= 3 ? 'fill' : x.hint >= 1 ? 'hint' : x.wrong.length ? 'err' : 'ok'; x.md = dstamp(); x.ans = v; x.code = ED.get(); }
    bump(); refreshSide();
    const tc = $('#tc'); if (tc) tc.classList.add('solved');
    fb.className = 'fb show good'; fb.innerHTML = '✅ Верно! ' + (x.st === 'ok' && !was ? 'Сам и с первой попытки — отлично!' : '') + (was ? '' : ' Флаг «решено» поставлен.');
    if (x.st === 'ok' && !was) confetti();
    const an = ANALOGS(t.id).filter(a => !solved(stu().tasks[a.id]));
    if (an.length) fb.innerHTML += ` <span style="font-weight:600">Закрепи на аналоге:</span> ${an.slice(0, 4).map(a => `<button class="btn sm" data-go="${a.id}">№ ${esc(a.id)}</button>`).join(' ')}`;
    const nx = nextUnsolved(t.id); if (nx) fb.innerHTML += ` <button class="btn sm pri" data-go="${nx}">Дальше → ${esc(nx)}</button>`;
    if (auto && !was && nx) {
      fb.innerHTML += `<div class="autonx">Переход к № ${esc(nx)} через <b id="anS">3</b> с… <button class="btn sm ghost" id="anStop">остаться здесь</button></div>`;
      let k = 3; const tick = () => { k--; const e = $('#anS'); if (!e || cur.id !== t.id) return; if (k <= 0) { openTask(nx); return; } e.textContent = k; AUTO_NEXT = setTimeout(tick, 1000); };
      AUTO_NEXT = setTimeout(tick, 1000);
      $('#anStop').onclick = () => { clearTimeout(AUTO_NEXT); const a = document.querySelector('.autonx'); if (a) a.remove(); };
    }
    fb.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { clearTimeout(AUTO_NEXT); openTask(b.dataset.go); });
    const fl = document.querySelector('[data-fl="done"]'); if (fl) fl.classList.add('on');
  } else {
    if (!solved(x) && !x.wrong.includes(v)) x.wrong.push(v); bump(); refreshSide();
    const o = $('#out').dataset.last;
    let tip = o && normA(o) === normA(v) ? 'Программа выводит именно это — значит, ошибка в шаблоне. Открой 🔎 отладчик и посмотри, какие куски он находит и каких не хватает.' : !o ? 'Выполни программу ▶ — последняя строка вывода сама встанет в ответ.' : '';
    if (x.wrong.length >= 2 && x.hint < 1) tip += ' Можно взять 💡 подсказку.';
    fb.className = 'fb show bad'; fb.innerHTML = '❌ Неверно. ' + tip;
  }
}

/* ===== Отладчик: подстановка всех кусков {p}, {num}, {w} ===== */
function debugFromCode(code, t) {
  const lines = code.split('\n');
  const get = name => { const L = lines.find(l => new RegExp('^\\s*' + name + "\\s*=\\s*[rf]{0,2}'").test(l)); if (!L) return null; const m = /=\s*[rf]{0,2}'(.*)'\s*(#.*)?$/.exec(L); return m ? m[1].replace(/\\'/g, "'") : null; };
  let pat = get('pattern') || ''; let fpat = false;
  for (let k = 0; k < 3 && /\{(\w+)\}/.test(pat); k++) pat = pat.replace(/\{(\w+)\}/g, (m0, n) => { if (n === 'pattern') return m0; const v = get(n); if (v == null) return m0; fpat = true; return v; });
  const wrap = lines.some(l => /^\s*pattern\s*=\s*f'\(\?=\(\{pattern\}\)\)'/.test(l));
  openDebugger({pat: pat.trim() ? pat : '', wrap, s: sOf(code) || (t && t.s) || '', flags: (t && t.flags) || (/,\s*M\)/.test(code) ? 'M' : ''), fromTask: t ? t.id : null, fpat});
}
