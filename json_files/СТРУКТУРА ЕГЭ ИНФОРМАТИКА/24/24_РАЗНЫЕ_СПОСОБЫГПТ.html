<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta content="width=device-width,initial-scale=1" name="viewport">
<title>ЕГЭ 24 · Тренажёр по алгоритмам строк · банк ШКОЛКОВО</title>
<link href="https://fonts.googleapis.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>:root{--bg:#f3f5fb;--card:#fff;--ink:#1d2640;--mut:#6b7491;--line:#e1e5f0;--pri:#4f6bff;--pri2:#7b5cff;--ok:#16a36a;--okl:#dff6ea;--err:#e5484d;--errl:#ffe3e3;--warn:#f0a400;--code:#0f1424;--code2:#161d33;--cink:#e7ecff;--sh:0 6px 22px rgba(30,40,80,.08)}
[data-theme=dark]{--bg:#0f1322;--card:#181e33;--ink:#e6e9f5;--mut:#98a0bf;--line:#2a3150;--okl:#143826;--errl:#3b1518;--code:#0b0f1d;--code2:#131a30;--sh:0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Nunito','Segoe UI',Roboto,Arial,sans-serif}
button{font:inherit;cursor:pointer}input,select,textarea{font:inherit;color:inherit}
.mono,code,pre{font-family:"JetBrains Mono","Cascadia Code",Consolas,"Courier New",monospace}
.btn{border:0;border-radius:11px;padding:8px 14px;font-weight:700;background:var(--card);color:var(--ink);box-shadow:0 0 0 1.5px var(--line) inset;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn:hover{box-shadow:0 0 0 1.5px var(--pri) inset}
.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 6px 16px rgba(79,107,255,.3)}
.btn.ok{background:var(--ok);color:#fff;box-shadow:none}
.btn.yel{background:linear-gradient(135deg,#ffcf4a,#ffb02e);color:#4a3000;box-shadow:none}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.btn.on{background:#e6eaff;box-shadow:0 0 0 1.5px var(--pri) inset;color:#2f45c9}[data-theme=dark] .btn.on{background:#262f55;color:#b9c4ff}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:16px 20px;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1d2640;color:#fff;padding:11px 18px;border-radius:12px;z-index:300;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90vw;font-weight:600}
.mbg{position:fixed;inset:0;background:rgba(15,20,40,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:12px}
.mdl{background:var(--card);border-radius:20px;padding:20px;max-width:640px;width:100%;max-height:94vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.mdl.wide{max-width:1050px}.mdl.full{max-width:none;width:96vw;height:94vh;max-height:94vh;padding:16px;display:flex;flex-direction:column}
.mdl h2{margin:0 0 10px}
.mhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}.mhead h2{margin:0;flex:1}
.inp{border:1.5px solid var(--line);background:var(--bg);border-radius:11px;padding:8px 12px;outline:none}
.inp:focus{border-color:var(--pri)}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:9px 16px;background:var(--card);box-shadow:0 2px 12px rgba(30,40,80,.07);flex-wrap:wrap}
.logo{font-weight:900;font-size:17px;display:flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer}
.logo i{font-style:normal;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-size:14px}
.top .sp{flex:1}
.ib{border:0;background:var(--bg);color:var(--ink);border-radius:10px;padding:7px 10px;font-weight:700;white-space:nowrap}
.ib:hover{background:#e6eaff}[data-theme=dark] .ib:hover{background:#262f55}
.ib.yel{background:linear-gradient(135deg,#ffcf4a,#ffb02e);color:#4a3000}
.who{font-weight:800;background:var(--bg);border-radius:999px;padding:6px 12px}
.modeb{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:#e3f6ec;color:#0f7a4d}.modeb.home{background:#fff0e0;color:#b25e00}
.login{max-width:560px;margin:7vh auto;padding:0 14px}
.hero{background:linear-gradient(135deg,#4f6bff,#7b5cff 60%,#b44cff);color:#fff;border-radius:24px;padding:26px;box-shadow:0 20px 50px rgba(79,107,255,.35);position:relative;overflow:hidden;margin-bottom:14px}
.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0;opacity:.92}
.hero .code-deco{position:absolute;right:8px;bottom:-6px;font:700 12px/1.35 Consolas,monospace;opacity:.22;white-space:pre;text-align:left}
.slist{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.slist button{border:0;background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:700}
.lay{display:grid;grid-template-columns:290px 1fr;gap:16px;padding:16px;max-width:1700px;margin:0 auto}
.side{position:sticky;top:66px;align-self:start;max-height:calc(100vh - 82px);overflow:auto;background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:12px}
.prog{display:flex;height:10px;border-radius:9px;overflow:hidden;background:var(--bg);margin:4px 0 8px}.prog i{display:block;height:100%}
.sbig{width:100%;border:0;border-radius:14px;padding:10px 12px;text-align:left;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:6px;background:var(--bg);color:var(--ink)}
.sbig.cons{background:linear-gradient(135deg,#eef1ff,#f6efff)}[data-theme=dark] .sbig.cons{background:#232a4a}
.sbig.cur{outline:2.5px solid var(--pri)}
.sbig small{margin-left:auto;font-weight:700;color:var(--mut)}
.sec{margin-top:10px}.sech{font-weight:900;font-size:13.5px;padding:4px 2px;display:flex;align-items:center;gap:6px}.sech small{margin-left:auto;color:var(--mut)}
.its{display:flex;flex-wrap:wrap;gap:5px;padding:2px 2px 6px}
.it{border:0;border-radius:9px;padding:4px 7px;font:700 12.5px Consolas,monospace;background:var(--bg);color:var(--ink);position:relative;min-width:46px}
.it.z{background:#fff6dc;color:#8a6400}[data-theme=dark] .it.z{background:#3a3010;color:#ffd666}
.it.ok{background:#16a36a;color:#fff}.it.err{background:#7bd3a7;color:#08321f}.it.hint{background:#ffd666;color:#4a3500}.it.fill{background:#ffb27a;color:#4a2000}
.it.cur{outline:2.5px solid var(--pri);outline-offset:1px}
.it.tried::after{content:'';position:absolute;right:2px;top:2px;width:6px;height:6px;border-radius:50%;background:var(--err)}
.legend{font-size:11.5px;color:var(--mut);display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.main{min-width:0}
.th{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.th h2{margin:0;font-size:21px}
.tag{font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;background:var(--bg);color:var(--mut);white-space:nowrap}
.tag.z{background:#fff1c7;color:#8a6400}.tag.st{background:#dff6ea;color:#0f7a4d}
.dots{color:#f0a400;letter-spacing:1px}
.cond{white-space:pre-wrap;font-size:16px;line-height:1.55;margin-top:10px}
.cond .q{font-weight:800;background:#fff6dc;border-radius:6px;padding:1px 4px}.cond .cnum{font-weight:850}.cond .example{color:#13734f;background:#eaf8ef;border-radius:5px;padding:1px 3px}[data-theme=dark] .cond .q{background:#3a3010}[data-theme=dark] .cond .example{color:#91e1b6;background:#153a28}
.fold{background:var(--code2);color:#aab4da;border-radius:12px;font:13.5px/20px Consolas,monospace;margin-bottom:8px;overflow:hidden}
.fold>button{border:0;background:transparent;color:inherit;font:inherit;width:100%;text-align:left;padding:7px 12px;display:flex;gap:8px;align-items:center}
.fold>button b{color:#c792ea}.fold>button span.c{color:#69739a;margin-left:auto;font-family:Nunito,sans-serif;font-size:12px}
.fold pre{margin:0;padding:6px 14px 10px;color:var(--cink);border-top:1px solid #253055}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}.bar .sp{flex:1}.ed-tools{display:flex;gap:5px;flex-wrap:wrap;align-items:center}.bar button{max-width:100%}.base-vis-frame{width:100%;height:calc(94vh - 64px);min-height:420px;flex:1;border:0;border-radius:12px;background:#0b1018}
.exb{border:0;border-radius:9px;padding:5px 10px;font:700 12.5px Consolas,monospace;background:#e8f7ef;color:#0f7a4d}
[data-theme=dark] .exb{background:#143826;color:#7fe0b0}
.exin{width:84px;padding:5px 8px;font:700 13px Consolas,monospace}
.menu{position:absolute;background:var(--card);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:6px;z-index:150;display:flex;flex-direction:column;min-width:220px;border:1px solid var(--line)}
.menu button{white-space:pre;border:0;background:transparent;color:var(--ink);text-align:left;padding:6px 10px;border-radius:8px;font:13px Consolas,monospace}
.menu button:hover{background:var(--bg)}
.menu small{font-family:Nunito,sans-serif;color:var(--mut);padding:4px 10px}
/* редактор */
.ed{display:flex;background:var(--code);border-radius:14px;overflow:hidden;font:14px/21px "JetBrains Mono","Cascadia Code",Consolas,monospace}
.ed-gut{padding:8px 0;background:var(--code2);color:#5d6890;text-align:right;user-select:none;min-width:38px}
.ed-gut div{padding:0 8px;height:21px}.ed-gut div.on{background:#4f6bff;color:#fff}.ed-gut div.er{background:#e5484d;color:#fff}
.ed-box{position:relative;flex:1;min-width:0;overflow-x:auto}
.ed-hl,.ed-ta,.ed-mark{margin:0;padding:8px 12px;font:inherit;white-space:pre;tab-size:4;border:0}
.ed-hl{position:absolute;inset:0;overflow:hidden;color:var(--cink);pointer-events:none;z-index:1}
.ed-mark{position:absolute;inset:0;overflow:hidden;padding-left:0;padding-right:0;pointer-events:none;z-index:0}
.ed-mark div{height:21px}.ed-mark div.on{background:rgba(79,107,255,.3)}.ed-mark div.er{background:rgba(229,72,77,.32)}
.ed-ta{position:relative;z-index:2;display:block;width:100%;background:transparent;color:transparent;caret-color:#fff;outline:none;resize:none;overflow-x:auto;overflow-y:hidden;min-height:120px}
.ed-ta::selection{background:rgba(123,92,255,.45)}
.hk{color:#c792ea;font-weight:700}.hs{color:#c3e88d}.hn{color:#f78c6c}.hc{color:#69739a;font-style:italic}.hb{display:inline-block;white-space:pre;background:#ffd666;color:#1d2640;border-radius:4px;font-weight:800;min-width:1ch;padding:0 .22em;margin-left:.16em}.hb.touched{opacity:1;background:rgba(255,214,102,.13);color:#e7ecff;box-shadow:0 0 0 1px rgba(255,214,102,.38)}.hb.active{opacity:1;background:rgba(255,214,102,.22)}
.out{background:var(--code);color:#cfe3cf;border-radius:12px;padding:10px 12px;font:13.5px/1.5 Consolas,monospace;white-space:pre-wrap;word-break:break-all;max-height:240px;overflow:auto;min-height:42px;margin-top:8px}
.out .last{background:#2b3a1e;color:#d9ff9e;border-radius:4px;padding:0 3px;font-weight:700}
.out .e{color:#ff9a9a}.out .m{color:#7f8bb8}.out .g{color:#7fe0b0;font-weight:700}
.out.solved{box-shadow:0 0 0 3px var(--ok)}
.status{font-size:12.5px;color:var(--mut);margin-top:4px}
.exp{background:#fff0f0;color:#9b1c21;border-radius:12px;padding:9px 12px;font-size:14px;margin-top:6px}[data-theme=dark] .exp{background:#3b1518;color:#ffb0b3}
.ans{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bg);border-radius:14px;padding:10px 12px;margin-top:10px}
.ans .inp{width:170px;font:700 17px Consolas,monospace;background:var(--card)}
.fb{border-radius:12px;padding:10px 14px;font-weight:700;display:none;margin-top:8px}
.fb.show{display:block}.fb.good{background:var(--okl);color:var(--ok)}.fb.bad{background:var(--errl);color:var(--err)}
.nx{height:5px;background:rgba(22,163,106,.25);border-radius:9px;margin-top:8px;overflow:hidden}.nx i{display:block;height:100%;background:var(--ok);width:0;transition:width 2.2s linear}
.card.solved{box-shadow:0 0 0 3px var(--ok),var(--sh)}
.hcard{background:#fff8dc;border:1.5px solid #ffd98a;border-radius:14px;padding:10px 14px;margin-top:8px;color:#4a3500;animation:pop .3s}
[data-theme=dark] .hcard{background:#3a2e12;border-color:#6b5420;color:#ffe6a8}
.hcard .hn2{display:inline-block;background:#f0a400;color:#fff;border-radius:999px;padding:0 9px;margin-right:6px;font-size:12.5px;font-weight:800}
.hcard pre{background:var(--code);color:var(--cink);border-radius:10px;padding:8px 10px;margin:8px 0 4px;font-size:13px;overflow:auto}
code.i{background:var(--bg);border-radius:5px;padding:0 4px;font-size:.92em}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
/* общие подсказки */
.ghg{margin:14px 0 6px;display:flex;align-items:center;gap:8px;font-size:18px;font-weight:900}.ghg i{width:16px;height:16px;border-radius:5px;display:inline-block}
.ghs{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.ghc{background:var(--sc);border-radius:8px 8px 18px 8px;border-top:6px solid var(--se);padding:12px 14px;color:#1d2640;box-shadow:0 8px 18px rgba(40,40,80,.1)}
.ghc b.t{display:block;margin-bottom:4px}
.ghc pre{background:#0f1424;color:#e7ecff;border-radius:10px;padding:8px 10px;margin:8px 0 6px;font-size:12.8px;overflow:auto;white-space:pre}
.ghc .btn{background:#fff}
/* консоль */
.con{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:12px}
.conlog{background:var(--code);color:#e7ecff;border-radius:14px;padding:12px;font:14px/1.5 Consolas,monospace;overflow:auto;white-space:pre-wrap;word-break:break-all;display:flex;flex-direction:column}
.conlog .cmd{color:#82aaff}.conlog .res{color:#c3e88d}.conlog .err{color:#ff9a9a}.conlog .pr{color:#e7ecff}.conside{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}.conside textarea{display:block;width:100%;min-height:112px;resize:vertical;background:var(--code);color:#e7ecff;border:1px solid var(--line);border-radius:8px;padding:8px;font:13px/1.45 Consolas,monospace;margin:8px 0}.conside .help{font-size:12px;color:var(--mut);margin:7px 0 12px}.ru-error{display:block;color:#ffd98a;font:13px/1.45 system-ui,sans-serif;padding-top:3px}
.conin{display:flex;gap:6px;align-items:flex-start;margin-top:auto;padding-top:8px}
.conin span{color:#82aaff;font-weight:800;padding-top:6px}
.conin textarea{flex:1;background:#151c33;border:1px solid #2a3150;border-radius:8px;color:#fff;font:14px/1.5 Consolas,monospace;padding:6px 8px;resize:none;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{border:0;background:var(--bg);color:var(--ink);border-radius:8px;padding:4px 8px;font:12.5px Consolas,monospace}
.chips button:hover{background:#e6eaff}
/* пошаговый мини-питон */
.stp{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.stpv{overflow:auto;display:flex;flex-direction:column;gap:8px}
.vtab{width:100%;border-collapse:collapse;font:14px Consolas,monospace}
.vtab td{border-bottom:1px solid var(--line);padding:5px 6px;vertical-align:top}.vtab td:first-child{color:var(--pri);font-weight:800;width:70px}
.vtab tr.ch td{background:#fff3c4}[data-theme=dark] .vtab tr.ch td{background:#3a3010}
.cells{display:flex;flex-wrap:wrap;gap:2px}
.cells span{display:inline-flex;flex-direction:column;align-items:center;min-width:22px;background:#eef1ff;border-radius:5px;padding:1px 3px;font-weight:800}
.cells span small{font-size:9px;color:var(--mut);font-weight:600}
[data-theme=dark] .cells span{background:#232a4a}
/* конструктор */
.cgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;flex:1;min-height:0}
.cl{display:flex;align-items:center;gap:6px;margin:4px 0;font:15px/1 Consolas,monospace}
.cl .code{flex:1;background:var(--code);color:var(--cink);border-radius:8px;padding:8px 10px;white-space:pre;min-height:36px;display:flex;align-items:center}
.cl.bad .code{box-shadow:0 0 0 2.5px var(--err)}.cl.good .code{box-shadow:0 0 0 2.5px var(--ok)}
.cl .ind{color:#3c4670}
.cl button{border:0;border-radius:8px;padding:6px 9px;background:var(--bg);color:var(--ink);font-weight:800}
.cl .slot{flex:1;border:2px dashed var(--line);border-radius:8px;padding:8px 10px;color:var(--mut);background:transparent;text-align:left;font:15px Consolas,monospace;white-space:pre}
.cl .num{width:24px;color:var(--mut);text-align:right;font-size:12px}
.lvl3{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.cdone{color:var(--ok);font-weight:800}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl td,.tbl th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs button{border:0;padding:9px 14px;border-radius:10px;background:var(--bg);color:var(--ink);font-weight:800}.tabs button.on{background:var(--pri);color:#fff}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;max-width:460px}.fld span{font-size:13px;color:var(--mut);font-weight:700}
.flag{display:inline-flex;align-items:center;gap:4px;margin:3px 5px 3px 0;padding:5px 9px;border-radius:9px;background:var(--bg);font:700 13px Consolas,monospace;cursor:pointer;border:1.5px solid transparent;user-select:none}
.flag.on{border-color:var(--pri);background:#e6eaff;color:#1d2640}
.home{max-width:1100px;margin:16px auto;padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hmc{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:22px;cursor:pointer;border:0;text-align:left;color:var(--ink)}
.hmc:hover{box-shadow:0 0 0 2px var(--pri),var(--sh)}
.hmc h2{margin:6px 0}.hmc .big{font-size:40px}
.pb{height:9px;background:var(--bg);border-radius:9px;overflow:hidden;margin-top:10px}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#5ad19b)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--bg);border-radius:14px;padding:12px}.stat b{font-size:24px;display:block}.stat span{font-size:13px;color:var(--mut)}
@media (max-width:980px){.lay{grid-template-columns:1fr;padding:8px}.side{position:static;max-height:none}.home{grid-template-columns:1fr}.con,.stp,.cgrid{grid-template-columns:1fr}}

.vhint{color:var(--mut);font-size:13px}
.home2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;max-width:1300px;margin:18px auto;padding:0 16px}
.hcol{display:flex;flex-direction:column;gap:10px}
.bline{display:flex;align-items:center;gap:12px;border:0;background:var(--card);color:var(--ink);border-radius:16px;padding:12px 14px;box-shadow:var(--sh);text-align:left}
.bline:hover{box-shadow:0 0 0 2px var(--pri) inset,var(--sh)}
.bline .bn{flex:0 0 38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2))}
.bline .bt{flex:1;display:flex;flex-direction:column}.bline .bt small{color:var(--mut);font-size:12.5px;line-height:1.35}
.bline .bp{flex:0 0 90px;text-align:right;font-size:13px}.bline .bp i{display:block;height:6px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:4px}.bline .bp em{display:block;height:100%;background:var(--ok)}
.hwc{border:2px solid #ffb46b !important}
.filt{display:flex;gap:4px;flex-wrap:wrap}
.filt button{border:0;border-radius:999px;padding:5px 10px;font-weight:800;font-size:12.5px;background:var(--bg);color:var(--ink)}
.filt button.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}

(len(s)))\nl = t.split()\nprint(l)\nprint(⟦max(len(x) for x in l)⟧)", "methods": {"pos": "s = 'ABAXYXYZCCABABXXYZXYYABBBBBACCCXYZABABXYZCCCCC'\nfrom re import *\n\n\np = [m.start() for m in finditer(r'(?=XYZ|XZY|YXZ|YZX|ZXY|ZYX)', s)]   # где начинается разделитель\ncut = [False] * len(s)\nfor i in p:\n    for k in range(i, i + 3):\n        cut[k] = True\nt = ''.join(' ' if cut[k] else s[k] for k in range(len(s)))\nl = t.split()\nprint(l)\nprint(max(len(x) for x in l))", "loops": "s = 'ABAXYXYZCCABABXXYZXYYABBBBBACCCXYZABABXYZCCCCC'\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + max(1, dl), len(s) + 1):\n        ok = all(not (set(s[k:k+3]) == set('XYZ') and len(s[k:k+3]) == 3 and k + 3 > i and k < j) for k in range(max(0, i - 2), j))\n        if ok:\n            dl = max(dl, j - i)\n        else:\n            break\nprint(dl)"}, "final": "", "flags": "", "tree": [], "groups": 0, "main": "pos", "norx": false, "d": 2, "alias": "", "realAns": "", "src2": "s = 'ABAXYXYZCCABABXXYZXYYABBBBBACCCXYZABABXYZCCCCC'\nfrom re import *\n\n\np = [m.start() for m in finditer(r'(?=XYZ|XZY|YXZ|YZX|ZXY|ZYX)', s)]   # где начинается разделитель\ncut = [False] * len(s)\nfor i in p:\n    for k in range(i, i + 3):\n        cut[k] = True\nt = ''.join(' ' if cut[k] else s[k] for k in range(len(s)))\nl = t.split()\nprint(l)\nprint(max(len(x) for x in l))", "real": "Шифровка содержит только заглавные буквы латинского алфавита (ABC…Z). Группа из трёх идущих подряд символов, содержащая по одному разу каждую из букв X, Y и Z, считается разделителем. Разделители могут накладываться друг на друга, например, последовательность символов YZXYZ считается идущими подряд разделителями YZX, ZXY и XYZ. \nПри дешифровке разделители удаляются, разбивая шифровку на фрагменты. Определите количество символов в самом длинном фрагменте шифровки, полученном после удаления разделителей.\nПример\nПусть шифровка содержит такие символы:\nBADZXYZKLMENYZXXX.\nРазделители в этой строке выделены жирным шрифтом. ют друг на друга — их позиции даёт просмотр вперёд (?=ABC|ACB|…). Закрашиваем все их символы и режем строку split.", "note": "Разделители налезают друг на друга, поэтому их позиции находим просмотром вперёд, закрашиваем все их символы и режем строку. Чистой регуляркой это неудобно.", "file": "", "src": "учебный аналог"}]}, {"id": "2508", "blk": "B", "role": "hw", "d": 1, "main": "loops", "title": "(№ 2508)", "real": "Найдите длину самой длинной подцепочки, состоящей из одинаковых символов. \nДля каждой цепочки максимальной длины выведите отдельной строке сначала символ, из которого строится эта цепочка, а затем через пробел – длину этой цепочки. \nДанные о найденных цепочках расположите в порядке их появления в файле. E 9     Y 9", "idea": "Сначала зафиксируй, что именно должна удовлетворять подстрока. Выбирай границы и прекращай перебор, когда дальнейшее расширение уже не поможет.", "note": "Следи за включением правой границы: в срезе s[i:j] символ с индексом j не входит. Проверяй, можно ли безопасно использовать break.", "tpl": "s = 'AAABBBBBCCDDDDDDDAABBBBBBBDDDDCCAAAAAA'\nruns=[]\ni=0\nwhile i<len(s):\n    j=i+1\n    while j<len(s) and s[j]==s[i]: j+=1\n    runs.append((s[i],j-i))\n    i=j\nm=max(k for c,k in runs)\nfor c,k in runs:\n    if k==m: print(⟦c,k⟧)", "methods": {"loops": "s = 'AAABBBBBCCDDDDDDDAABBBBBBBDDDDCCAAAAAA'\nruns=[]\ni=0\nwhile i<len(s):\n    j=i+1\n    while j<len(s) and s[j]==s[i]: j+=1\n    runs.append((s[i],j-i))\n    i=j\nm=max(k for c,k in runs)\nfor c,k in runs:\n    if k==m: print(c,k)"}, "ans": "D 7\nB 7", "final": "", "flags": "", "tree": [], "groups": 0, "norx": false, "alias": "", "realAns": "", "src": "Школьково 24", "lvl": "", "file": "", "alts": [], "tr": "AAABBBBBCCDDDDDDDAABBBBBBBDDDDCCAAAAAA", "ask": "", "s": "AAABBBBBCCDDDDDDDAABBBBBBBDDDDCCAAAAAA", "src2": "s = 'AAABBBBBCCDDDDDDDAABBBBBBBDDDDCCAAAAAA'\nruns=[]\ni=0\nwhile i<len(s):\n    j=i+1\n    while j<len(s) and s[j]==s[i]: j+=1\n    runs.append((s[i],j-i))\n    i=j\nm=max(k for c,k in runs)\nfor c,k in runs:\n    if k==m: print(c,k)", "like": "2422"}, {"id": "21", "blk": "B", "role": "main", "d": 1, "main": "loops", "title": "21 Максимальная строка из различных символов", "real": "Определите максимальное количество идущих подряд символов, среди которых каждые два соседних различны.", "idea": "Разметь запрещённые фрагменты или символы разделителями. После split проанализируй получившиеся части.", "note": "Важно не удалять символы исходной строки, если требуется сохранить длину. Используй разделитель, которого гарантированно нет в данных. Для наложений иногда нужен while.", "tpl": "s = 'ABACCBABCAAAABCABCABCCABACABABACCAA'\nk=m=1\nfor i in range(1,len(s)):\n    if ⟦s[i]!=s[i-1]⟧:\n        k+=1\n    else:\n        k=1\n    m=max(m,k)\nprint(m)", "methods": {"loops": "s = 'ABACCBABCAAAABCABCABCCABACABABACCAA'\nk=m=1\nfor i in range(1,len(s)):\n    if s[i]!=s[i-1]:\n        k+=1\n    else:\n        k=1\n    m=max(m,k)\nprint(m)", "split": "s = 'ABACCBABCAAAABCABCABCCABACABABACCAA'\nfor c in set(s):\n    while c*2 in s:\n        s=s.replace(c*2,c+' '+c)\nprint(max(map(len,s.split()),default=0))"}, "ans": "11", "final": "", "flags": "", "tree": [], "groups": 0, "norx": false, "alias": "", "realAns": "35", "src": "Школьково 24", "lvl": "", "file": "", "alts": [], "tr": "ABACCBABCAAAABCABCABCCABACABABACCAA", "ask": "", "s": "ABACCBABCAAAABCABCABCCABACABABACCAA", "src2": "s = 'ABACCBABCAAAABCABCABCCABACABABACCAA'\nk=m=1\nfor i in range(1,len(s)):\n    if s[i]!=s[i-1]:\n        k+=1\n    else:\n        k=1\n    m=max(m,k)\nprint(m)", "like": ""}, {"id": "2422", "blk": "B", "role": "main", "d": 1, "main": "loops", "title": "2422 Максимальная строка в алфавитном порядке", "real": "Определите максимальное количество идущих подряд символов, расположенных в алфавитном порядке (возможно с повторением символов).", "idea": "Разметь запрещённые фрагменты или символы разделителями. После split проанализируй получившиеся части.", "note": "Важно не уд в, среди которых нет рядом стоящих четных и нечетных цифр.", "idea": "Сначала зафиксируй, что именно должна удовлетворять подстрока. Выбирай границы и прекращай перебор, когда дальнейшее расширение уже не поможет.", "note": "Следи за включением правой границы: в срезе s[i:j] символ с индексом j не входит. Проверяй, можно ли безопасно использовать break.", "tpl": "s = '2468A13579B24680246813579C2468A135'\ndef usl(ss):\n    return ⟦not any(a in '02468' and b in '13579' or b in '02468' and a in '13579' for a,b in zip(ss,ss[1:]))⟧\nm=0\nfor i in range(len(s)):\n    for j in range(i + max(1, m), len(s) + 1):\n        if usl(s[i:j]):\n            m=max(m,j-i)\n        else:\n            break\nprint(m)", "methods": {"loops": "s = '2468A13579B24680246813579C2468A135'\nk = m = int(bool(s))\nfor i in range(1,len(s)):\n    k = k+1 if not (s[i-1] in '02468' and s[i] in '13579' or s[i-1] in '13579' and s[i] in '02468') else 1\n    m = max(m,k)\nprint(m)"}, "ans": "20", "final": "", "flags": "", "tree": [], "groups": 0, "norx": false, "alias": "", "realAns": "263", "src": "Школьково 24", "lvl": "", "file": "", "alts": [], "tr": "2468A13579B24680246813579C2468A135", "ask": "", "s": "2468A13579B24680246813579C2468A135", "src2": "s = '2468A13579B24680246813579C2468A135'\ndef usl(ss):\n    return not any(a in '02468' and b in '13579' or b in '02468' and a in '13579' for a,b in zip(ss,ss[1:]))\nm=0\nfor i in range(len(s)):\n    for j in range(i + max(1, m), len(s) + 1):\n        if usl(s[i:j]):\n            m=max(m,j-i)\n        else:\n            break\nprint(m)", "like": "2715"}, {"id": "6782", "blk": "B", "role": "hw", "d": 3, "main": "loops", "title": "(№ 6782)", "real": "Определите максимальную длину подстроки, в которой ни одна буква не стоит рядом с буквой и ни одна цифра не стоит рядом с цифрой.", "idea": "Сначала зафиксируй, что именно должна удовлетворять подстрока. Выбирай границы и прекращай перебор, когда дальнейшее расширение уже не поможет.", "note": "Следи за включением правой границы: в срезе s[i:j] символ с индексом j не входит. Проверяй, можно ли безопасно использовать break.", "tpl": "s = 'AB2C3D4E55A2B3C4D5E6F77G8H9J'\ndef usl(ss):\n    return ⟦all(a.isdigit()!=b.isdigit() for a,b in zip(ss,ss[1:]))⟧\nm=0\nfor i in range(len(s)):\n    for j in range(i + max(1, m), len(s) + 1):\n        if usl(s[i:j]):\n            m=max(m,j-i)\n        else:\n            break\nprint(m)", "methods": {"loops": "s = 'AB2C3D4E55A2B3C4D5E6F77G8H9J'\nk = m = int(bool(s))\nfor i in range(1,len(s)):\n    k = k+1 if s[i-1].isdigit() != s[i].isdigit() else 1\n    m = max(m,k)\nprint(m)"}, "ans": "13", "final": "", "flags": "", "tree": [], "groups": 0, "norx": false, "alias": "", "realAns": "18", "src": "Школьково 24", "lvl": "", "file": "", "alts": [], "tr": "AB2C3D4E55A2B3C4D5E6F77G8H9J", "ask": "", "s": "AB2C3D4E55A2B3C4D5E6F77G8H9J", "src2": "s = 'AB2C3D4E55A2B3C4D5E6F77G8H9J'\ndef usl(ss):\n    return all(a.isdigit()!=b.isdigit() for a,b in zip(ss,ss[1:]))\nm=0\nfor i in range(len(s)):\n    for j in range(i + max(1, m), len(s) + 1):\n        if usl(s[i:j]):\n            m=max(m,j-i)\n        else:\n            break\nprint(m)", "like": "5830"}, {"id": "3362", "blk": "B", "role": "main", "like": "", "star": false, "title": "", "idea": "Возрастание по кодам — сравнение соседних символов. Один проход: j бежит, пока s[j] > s[j-1]; при равных длинах берём первую — сравнение строгое (>).", "note": "Символы — любые, порядок по кодам ASCII: регулярке сравнивать коды неудобно, проще один проход.", "tr": "KAA3ACKBC1GJHKCHAD3EKHGJKA1HE2BACJAAJGH2DCD2HGJAAJCAB2EH1AKJGHKE3DAHCKHJG1CBKCA3AAK", "ask": "", "s": "KAA3ACKBC1GJHKCHAD3EKHGJKA1HE2BACJAAJGH2DCD2HGJAAJCAB2EH1AKJGHKE3DAHCKHJG1CBKCA3AAK", "ans": "4", "tpl": "s = 'KAA3ACKBC1GJHKCHAD3EKHGJKA1HE2BACJAAJGH2DCD2HGJAAJCAB2EH1AKJGHKE3DAHCKHJG1CBKCA3AAK'\nib, dl = 0, 0\nfor i in range(len(s)):\n    for j in range(i + max(1, dl), len(s) + 1):\n        ss = s[i:j]\n        if all(ss[k+1] > ss[k] for k in range(le )\n    if i > 0:\n        d += len(w) - 1\n    if i + K + 1 < len(l):\n        d += len(w) - 1\n    dl = max(dl, d)\nprint(dl)", "loops": "s = 'ABCDABEFABABCCDEFABABDEABFFABCDAB'\ndef ok(ss):\n    return ss.count('AB') == 3\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + max(1, dl), len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) > dl:\n            dl = len(ss)\nprint(dl)"}, "final": "", "flags": "", "tree": [], "groups": 0, "main": "split", "norx": false, "d": 2, "alias": "", "realAns": "", "src2": "s = 'ABCDABEFABABCCDEFABABDEABFFABCDAB'\nw = 'AB'\nK = 3\nl = s.split(w)\ndl = 0\nfor i in range(len(l) - K):\n    d = sum(len(x) for x in l[i:i+K+1]) + K * len(w)\n    if i > 0:\n        d += len(w) - 1\n    if i + K + 1 < len(l):\n        d += len(w) - 1\n    dl = max(dl, d)\nprint(dl)", "real": "Текстовый файл состоит из заглавных букв латинского алфавита A, B, C, D, E и F.\nОпределите в прилагаемом файле максимальное количество идущих подряд символов, среди которых пара AB (в указанном порядке) встречается ровно 100 раз.", "src": "Апробация 05.03.25", "lvl": "Средний", "file": "https://kompege.ru/files/BLJmfsrxrF.txt", "alts": [], "variants": [{"id": "28765", "real": "Текстовый файл состоит из заглавных букв латинского алфавита A, B, C, D, E и F.\nОпределите максимальное количество идущих подряд символов в прилагаемом файле, среди которых пара символов BС (в указанном порядке) встречается не более 180 раз.", "methods": {"split": "s = 'BFABBAEECDBEDFBCAAFBAEECFCABCBCDCFFBCCBCDBCCAAEFBCBE'\n\nw = 'BC'\nK = 3\nl = s.split(w)\nif len(l) <= K + 1:\n    print(len(s))\nelse:\n    dl = 0\n    for i in range(len(l) - K):\n        d = sum(len(x) for x in l[i:i+K+1]) + K * len(w)\n        if i > 0:\n            d += len(w) - 1\n        if i + K + 1 < len(l):\n            d += len(w) - 1\n        dl = max(dl, d)\n    print(dl)", "loops": "s = 'BFABBAEECDBEDFBCAAFBAEECFCABCBCDCFFBCCBCDBCCAAEFBCBE'\n\ndef ok(ss):\n    return ss.count('BC') <= 3\ndl = 0\n                      # после каждого куска стоит гласная\n    q = [m.start() for m in finditer('20', x)]\n    if len(q) >= K:\n        dl = min(dl, len(x) - q[-K] + 1)    # от K-й с конца пары до гласной\nprint(dl)", "loops": "s = '20B20C20A2020D20E20F20G20H20I2020J20O'\ndef ok(ss):\n    return ss[-1] in 'AEIOUY' and not any(c in 'AEIOUY' for c in ss[:-1]) and ss.count('20') == 2\ndl = len(s) + 1\nfor i in range(len(s)):\n    for j in range(i + 1, min(len(s), i + dl) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) < dl:\n            dl = len(ss)\n            break\nprint(dl)"}, "final": "", "flags": "", "tree": [], "groups": 0, "main": "split", "norx": false, "d": 3, "alias": "", "realAns": "", "src2": "s = '20B20C20A2020D20E20F20G20H20I2020J20O'\nfrom re import *\n\n\nl = split(r'[AEIOUY]', s)             # куски между гласными\nK = 2\ndl = len(s) + 1\nfor x in l[:-1]:                     # после каждого куска стоит гласная\n    q = [m.start() for m in finditer('20', x)]\n    if len(q) >= K:\n        dl = min(dl, len(x) - q[-K] + 1)    # от K-й с конца пары до гласной\nprint(dl)", "real": "Текстовый файл состоит из десятичных цифр и заглавных букв латинского алфавита. Определите в прилагаемом файле минимальное количество идущих подряд символов, среди которых пара символов «20» (в указанном порядке) встречается ровно 26 раз, гласная буква встречается ровно один раз, искомая последовательность заканчивается этой единственной гласной буквой. В ответе запишите число - количество символов в найденной последовательности.\nПримечание. гласные буквы латинского алфавита: A, E, I, O, U, Y.", "src": "ЕГКР 18.04.26", "lvl": "Базовый", "file": "https://kompege.ru/files/IjZCVO1qNHt.txt", "alts": []}, {"id": "5381", "blk": "P", "role": "hw", "like": "28943", "star": false, "title": "", "idea": "Тройки налезают друг на друга (BAB AB…), split тут ломается. Берём позиции всех троек, а окно с ровно K тройками тянется от «после начала» левой соседней тройки до «перед концом» ается не более четырёх раз и присутствуют как минимум 5 различных цифр.", "src": "сайт К. Полякова", "lvl": "", "file": "", "alts": []}, {"id": "23228", "blk": "E", "role": "hw", "d": 3, "main": "window", "title": "№ 23228", "real": "Текстовый файл состоит из десятичных цифр и заглавных букв латинского алфавита. \nОпределите в прилагаемом файле минимальное количество идущих подряд символов, среди которых комбинация цифр 2025 (в указанном порядке) встречается 60 раз, при этом искомая последовательность начинается на комбинацию цифр 2025 (в указанном порядке) и содержит не менее 120 букв Y. \n", "idea": "Поддерживай окно [l; r]. Расширяй правую границу, а левую двигай, пока условие не станет допустимым.", "note": "Не пересчитывай окно целиком на каждом шаге: обновляй счётчики при добавлении и удалении символа.", "tpl": "s = '2025YY2025Y2025YYY2025Y2025YYYY2025YY2025YYY'\nK=3\nY=6\np=[i for i in range(len(s)-3) if s[i:i+4]=='2025']\n⟦m⟧=len(s)+1\nfor i in range(len(p)-K+1):\n    l=p[i]\n    r=p[i+K-1]+4\n    while r<=len(s) and r-l<=m and s[l:r].count('2025')==K:\n        if s[l:r].count('Y')>=Y:\n            m=min(m,r-l)\n            break\n        r+=1\nprint(m)", "methods": {"window": "s = '2025YY2025Y2025YYY2025Y2025YYYY2025YY2025YYY'\nK=3\nY=6\np=[i for i in range(len(s)-3) if s[i:i+4]=='2025']\nm=len(s)+1\nfor i in range(len(p)-K+1):\n    l=p[i]\n    r=p[i+K-1]+4\n    while r<=len(s) and r-l<=m and s[l:r].count('2025')==K:\n        if s[l:r].count('Y')>=Y:\n            m=min(m,r-l)\n            break\n        r+=1\nprint(m)"}, "ans": "18", "final": "", "flags": "", "tree": [], "groups": 0, "norx": false, "alias": "", "realAns": "", "src": "Школьково 24", "lvl": "", "file": "", "alts": [], "tr": "2025YY2025Y2025YYY2025Y2025YYYY2025YY2025YYY", "ask": "", "s": "2025YY2025Y2025YYY2025Y2025YYYY2025YY2025YYY", "src2": "s = '2025YY2025Y2025YYY2025Y2025YYYY2025YY2025YYY'\nK=3\nY=6\np=[i for i in range(len(s)-3) if s[i:i+4]=='2025']\nm=len(s)+1\nfor i in range(len(p)-K+1):\n    l=p[i]\n    r=p[i+K-1]+4\n    while r<=len(s) and r-l<=m and s[l:r].count('2025')==K:\n        if s[l:r].count('Y')>=Y:\n            m=min(m,r-l)\n            break\n        r+=1\nprint(m)", "like": "6610"}, {"id": "11636", "blk": "N", "role": "main", "like": "", "star": false, "title": "", "idea": "Подстрока A#A — любая пара букв A, кроме стоящих вплотную. Позиции A — finditer; пар всего n·(n−1)/2, вычитаем соседние AA.", "note": "Подстрока A#A — любая пара букв A, кроме стоящих рядом. Всего пар n·(n−1)/2.", "tr": "ABAABCAABACCBABAAACBABAACAB", "ask": "", "s": "ABAABCAABACCBABAAACBABAACAB", "ans": "86", "tpl": "s = 'ABAABCAABACCBABAAACBABAACAB'\nk=ans=0\nfor i in range(len(s)):\n    if ⟦i>=2 and s[i-2]==\"A\"⟧:\n        k+=1\n    if s[i]==\"A\":\n        ans+=k\nprint(ans)", "methods": {"loops": "s = 'ABAABCAABACCBABAAACBABAACAB'\nk=ans=0\nfor i in range(len(s)):\n    if i>=2 and s[i-2]==\"A\":\n        k+=1\n    if s[i]==\"A\":\n        ans+=k\nprint(ans)"}, "final": "", "flags": "", "tree": [], "groups": 0, "main": "loops", "norx": false, "d": 2, "alias": "", "realAns": "42587173055", "src2": "s = 'ABAABCAABACCBABAAACBABAACAB'\nk=ans=0\nfor i in range(len(s)):\n    if i>=2 and s[i-2]==\"A\":\n        k+=1\n    if s[i]==\"A\":\n        ans+=k\nprint(ans)", "real": "(Л. Шастин) Текстовый файл состоит не более, чем из 7 200 000 прописных символов латинского алфавита. Определите в прилагаемом файле количество подстрок вида A#A, где на месте # стоит хотя бы один символ.", "src": "", "lvl": "Сложный", "file": "https://kompege.ru/files/7Qu5mQV8J.txt", "alts": [], "fiTag": true}, {"id": "3763", "blk": "N", "role": "hw", "like": "7981", "star": false, "title": "", "idea": "Для каждого начала идём вправо, пока в подстроке нет всех трёх букв; как только появилась третья — дальше все подстроки «плохие», break.", "note": "Два цикла с ранним выходом — уже быстрое решение. Регулярки — неподходящий способ.", "tr": "ACAABABBABCCCCACBCABACCCBAAAAABACAACCAAACBCCCCCCCCCBCAAACCAACABAAAAABCCCABACBCACCCCBABBABAACA", "ask": "", "s": "ACAABABBABCCCCACBCABACCCBAAAAABACAACCAAACBCCCCCCCCCBCAAACCAACABAAAAABCCCABACBCACCCCBABBABAACA", "ans": "268", "tpl": "s = 'ACAABABBABCCCCACBCABACCCBAAAAABACAACCAAACBCCCCCCCCCBCAAACCAACABAAAAABCCCABACBCACCCCBABBABAACA'\nk = 0\nfor i in range(len(s)):\n    c = set()\n    for j in range(i, len(s)):\n        c.add(s[j])\n        if ⟦len(c) == 3⟧:                 # дальше все подстроки содержат A, B и C\n            break\n        if j - i + 1 >= 3:\n            k += 1\nprint(k)", "methods": {"win": "s = 'ACAABABBABCCCCACBCABACCCBAAAAABACAACCAAACBCCCCCCCCCBCAAACCAACABAAAAABCCCABACBCACCCCBABBABAACA'\ncnt={}\nl=k=0\nfor r,c in enumerate(s):\n    cnt[c]=cnt.get(c,0)+1\n    while len(cnt)==3:\n        cnt[s[l]]-=1\n        if cnt[s[l]]==0: del cnt[s[l]]\n        l+=1\n    k+=max(0,r-l-1)\nprint(k)", "loops": "s = 'ACAABABBABCCCCACBCABACCCBAAAAABACAACCAAACBCCCCCCCCCBCAAACCAACABAAAAABCCCABACBCACCCCBABBABAACA'\nk = 0\nfor i in range(len(s)):\n    for j in range(i + 3, len(s) + 1):\n        if len(set(s[i:j])) < 3:\n            k += 1\nprint(k)", "dp": "s = 'ACAABABBABCCCCACBCABACCCBAAAAABACAACCAAACBCCCCCCCCCBCAAACCAACABAAAAABCCCABACBCACCCCBABBABAACA'\nlast = {'A': -1, 'B': -1, 'C': -1}  # где буква встречалась последний раз\nk = 0\nfor j in range(len(s)):             # j — конец подстроки\n    last[s[j]] = j\n    m = min(last.values())          # начала i <= m дают подстроку со всеми тремя буквами\n    k += max(0, (j - 2) - m)        # хорошие начала: m < i <= j - 2 (длина >= 3)\nprint(k)"}, "final": "", "flags": "", "tree": [], "groups": 0, "main": "win", "norx": false, "d": 2, "alias": "5152п", "realAns": "252776", "src2": "s = 'ACAABABBABCCCCACBCABACCCBAAAAABACAACCAAACBCCCCCCCCCBCAAACCAACABAAAAABCCCABACBCACCCCBABBABAACA'\nk = 0\nfor i in range(len(s)):\n    c = set()\n    for j in range(i, len(s)):\n        c.add(s[j])\n        if len(c) == 3:                 # дальше все подстроки содержат A, B и C\n            break\n        if j - i + 1 >= 3:\n            k += 1\nprint(k)", "real": "(Н. Егорова) Текстовый файл содержит строку из заглавных латинских букв A, B и C, всего не более чем из 10⁶ символов. Определите количество подстрок длиной не менее трех символов, которые не содержали бы одновременно все три буквы A, B и C. Примечание: подстрока — это непрерывный фрагмент исходной строки.", "src": "", "lvl": "Сложный", "file": "https://kompege.ru/files/zl9rrsKN-.txt", "alts": []}, {"id": "7981", "blk": "N", "role": "main", "like": "", "star": true, "title": "", "idea": "Запрещённые соседи из набора A, B, C разрезаем: sub ставит пробел между ними. В каждом куске любая пара одинаковых букв даёт подходящую подстроку.", "note": "После разрезания внутри куска подходит ЛЮБАЯ пара одинаковых букв — их число k·(k−1)/2. sub с просмотром вперёд ставит пробел между соседями из набора.", "tr": "BDECBBBDECEACABCBEDBDADDCBEBECBBDDACCBABCEDEBEBCCCCCBEBEDECBABCCADDBBCEBEBCDDADBDEBCBACAECEDBBBCEDB", "ask": "", "s": "BDECBBBDECEACABCBEDBDADDCBEBECBBDDACCBABCEDEBEBCCCCCBEBEDECBABCCADDBBCEBEBCDDADBDEBCBACAECEDBBBCEDB", "ans": "30", "tpl": "s = 'BDECBBBDECEACABCBEDBDADDCBEBECBBDDACCBABCEDEBEBCCCCCBEBEDECBABCCADDBBCEBEBCDDADBDEBCBACAECEDBBBCEDB'\nfrom re import *\n\n\ns = sub(r'([ABC])(?=[ABC])', r'\\1 ', s)    # разрезаем запрещённые пары пробелом\nk = 0\nfor part in s.split():\n    for c in set(part):\n        n = part.count(c)\n        k += n * (n - 1) // 2               # пары одинаковых букв\nprint(⟦k⟧)", "methods": {"split": "s = 'BDECBBBDECEACABCBEDBDADDCBEBECBBDDACCBABCEDEBEBCCCCCBEBEDECBABCCADDBBCEBEBCDDADBDEBCBACAECEDBBBCEDB'\nfrom re import *\n\n\ns = sub(r'([ABC])(?=[ABC])', r'\\1 ', s)    # разрезаем запрещённые пары пробелом\nk = 0\nfor part in s.split():\n    for c in set(part):\n        n = part.count(c)\n        k += n * (n - 1) // 2               # пары одинаковых букв\nprint(k)", "loops": "s = 'BDECBBBDECEACABCBEDBDADDCBEBECBBDDACCBABCEDEBEBCCCCCBEBEDECBABCCADDBBCEBEBCDDADBDEBCBACAECEDBBBCEDB'\nk = 0\nfor i in range(len(s)):\n    for j in range(i + 2, len(s) + 1):\n        ss = s[i:j]\n        if ss[0] == ss[-1] and all(not (ss[q] in 'ABC' and ss[q+1] in 'ABC') for q in range(len(ss) - 1)):\n            k += 1\nprint(k)"}, "final": "", "flags": "", "tree": [], "groups": 0, "main": "split", "norx": false, "d": 2, "alias": "", "realAns": "2799126", "src2": "s = 'BDECBBBDECEACABCBEDBDADDCBEBECBBDDACCBABCEDEBEBCCCCCBEBEDECBABCCADDBBCEBEBCDDADBDEBCBACAECEDBBBCEDB'\nfrom re import *\n\n\ns = sub(r'([ABC])(?=[ABC])', r'\\1 ', s)    # разрезаем запрещённые пары пробелом\nk = 0\nfor part in s.split():\n    for c in set(part):\n        n = part.count(c)\n        k += n * (n - 1) // 2               # пары одинаковых букв\nprint(k)", "real": "(Л. Шастин) Текстовый файл состоит не более, чем из 1 200 000 прописных символов латинского алфавита. Определите количество подстрок длиной не менее 2, начинающихся и заканчивающихся на одну и ту же букву, среди которых любые два символа из набора A, B, C в различных комбинациях (с учётом повторений) не стоят рядом.", "src": "", "lvl": "Сложный", "file": "https://kompege.ru/files/UTWIS97eK.txt", "alts": [], "endOrder": 1}, {"id": "2528", "blk": "G", "role": "hw", "d": 2, "main": "loops", "title": "(№ 2528)", "real": "Определите максимальное число, состоящее только из чётных цифр. \nПод числом подразумевается последовательность цифр, ограниченная другими символами (не цифрами).", "idea": "Сначала зафиксируй, что именно должна удовлетворять подстрока. Выбирай границы и прекращай перебор, когда дальнейшее расширение уже не поможет.", "note": "Следи за включением правой границы: в срезе s[i:j] символ с индексом j не входит. Проверяй, можно ли безопасно использовать break.", "tpl": "s = 'A246B8888C24680D24681E86420F02468G2468'\nfrom re import findall\na=findall(r'\\d+',s)\nprint(⟦max(int(x) for x in a if all(c in '02468' for c in x))⟧)", "methods": {"loops": "s = 'A246B8888C24680D24681E86420F02468G2468'\nfrom re import findall\na=findall(r'\\d+',s)\nprint(max(int(x) for x in a if all(c in '02468' for c in x)))"}, "ans": "86420", "final": "", "flags": "", "tree": [], "groups": 0, "norx": false, "alias": "", "realAns": "4444", "src": "Школьково 24", "lvl": "", "file": "", "alts": [], "tr": "A246B8888C24680D24681E86420F02468G2468", "ask": "", "s": "A246B8888C24680D24681E86420F02468G2468", "src2": "s = 'A246B8888C24680D24681E86420F02468G2468'\nfrom re import findall\na=findall(r'\\d+',s)\nprint(max(int(x) for x in a if all(c in '02468' for c in x)))", "like": "17685"}, {"id": "7993", "blk": "G", "role": "main", "d": 3, "main": "window", "title": "(№ 7993)", "real": "Файл состоит не более чем из 10^6 символов и содержит только десятичные цифры и знаки равенства («=»). \nОпределите максимальную длину последовательности вида «число1=число2=число3=...=число N», в которой нет соседних знаков «=» и хотя бы два соседних числа в цепочке равны. \nВ ответе укажите количество символов. \n", "idea": "Сначала зафиксируй, что именно должна удовлетворять подстрока. Выбирай границы и прекращай перебор, когда дальнейшее расширение уже не поможет.", "note": "Следи за включением правой границы: в срезе s[i:j] символ с индексом j не входит. Проверяй, можно ли безопасно использовать break.", "tpl": "s = '12=12=345==7=8=8=12345=90==42=42=6'\nm=0\nfor part in s.split('=='):\n    a=part.strip('=').split('=')\n    if any(int(x)==int(y) for x,y in zip(a,a[1:])): m=max(m,len(part.strip('=')))\nprint(⟦m⟧)", "methods": {"window": "s = '12=12=345==7=8=8=12345=90==42=42=6'\nm=0\nfor part in s.split('=='):\n    a=part.strip('=').split('=')\n    if any(int(x)==int(y) for x,y in zip(a,a[1:])): m=max(m,len(part.strip('=')))\nprint(m)"}, "ans": "14", "final": "", "flags": "", "tree": [], "groups": 0, "norx": false, "alias": "", "realAns": "", "src": "Школьково 24", "lvl": "", "file": "", "alts": [], "tr": "12=12=345==7=8=8=12345=90==42=42=6", "ask": "", "s": "12=12=345==7=8=8=12345=90==42=42=6", "src2": "s = '12=12=345==7=8= art=part.strip('=')\n    if any(usl(c) for c in part.split('=')): m=max(m,len(part))\nprint(m)", "variants": [{"id": "8002", "real": "Файл состоит не более чем из 10^6 символов и содержит только десятичные цифры и знаки равенства («=»). \nОпределите максимальную длину последовательности вида «число1=число2=число3=...=число N», в которой нет соседних знаков «=» и есть хотя бы одно восьмизначное число, в котором все цифры нечётные. В ответе укажите количество символов.\n", "methods": {"window": "s = ''\nl=0\nfor i in range(len(s)):\n    j=i+l+1\n    while j<=len(s):\n        ss=s[i:j]\n        if '==' not in ss and ss[0]!='=' and ss[-1]!='=':\n            sp=ss.split('=')\n            if any(len(c)==8 and c[0]!='0' and all(int(x)%2 for x in c) for c in sp):\n                l=len(ss)\n                print(i,l,ss)\n        else: break\n        j+=1"}, "main": "window", "tpl": "s = ''\nl=0\nfor i in range(len(s)):\n    j=i+l+1\n    while ⟦j<=len(s)⟧:\n        ss=s[i:j]\n        if '==' not in ss and ss[0]!='=' and ss[-1]!='=':\n            sp=ss.split('=')\n            if any(len(c)==8 and c[0]!='0' and all(int(x)%2 for x in c) for c in sp):\n                l=len(ss)\n                print(i,l,ss)\n        else: break\n        j+=1", "ans": "", "s": "", "tr": "", "realAns": "873", "idea": "Сначала зафиксируй, что именно должна удовлетворять подстрока. Выбирай границы и прекращай перебор, когда дальнейшее расширение уже не поможет.", "note": "Следи за включением правой границы: в срезе s[i:j] символ с индексом j не входит. Проверяй, можно ли безопасно использовать break.", "file": "", "src": "Школьково 24"}, {"id": "8003", "real": "Файл состоит не более чем из 10^6 символов и содержит только десятичные цифры и знаки равенства («=»). \nОпределите максимальную длину последовательности вида «число1=число2=число3=...=число N», в которой нет соседних знаков «=» и есть хотя бы одно 5-значное\n число, которое является квадратом простого целого числа. В ответе укажите количество символов.\n", "methods": {"window": "s = ''\npr=[]\nfor n in range(2,317):\n    if all(n%c for c in range(2,int(n**0.5)+1)):\n        pr.append(n*n)\nl=0\nfor i in range(len(s)):\n    j=i+l+1\n    while j<=len(s):\n        ss=s[i:j]\n        if '==' not in ss and ss[0]!='=' and ss[-1]!='=':\n            sp=ss.split('=')\n            if any(len(c)==5 and c[0]!='0' and int(c) in pr for c in sp):\n                l=len(ss)\n                print(i,l,ss)\n        else: break\n        j+=1"}, "main": "window", "tpl": "s = ''\npr=[]\nfor n in range(2,317):\n    if ⟦all(n%c for c in range(2,int(n**0.5)+1))⟧:\n        pr.append(n*n)\nl=0\nfor i in range(len(s)):\n    j=i+l+1\n    while j<=len(s):\n        ss=s[i:j]\n        if '==' not in ss and ss[0]!='=' and ss[-1]!='=':\n            sp=ss.split('=')\n            if any(len(c)==5 and c[0]!='0' and int(c) in pr for c in sp):\n                l=len(ss)\n                print(i,l,ss)\n        else: break\n        j+=1", "ans": "", "s": "", "tr": "", "realAns": "430", "idea": "Сначала зафиксируй, что именно должна удовлетворять подстрока. Выбирай границы и прекращай перебор, когда дальнейшее расширение уже не поможет.", "note": "Следи за включением правой границы: в срезе s[i:j] символ с индексом j не входит. Проверяй, можно ли безопасно использовать break.", "file": "", "src": "Школьково 24"}], "like": ""}, {"id": "7997", "blk": "G", "role": "hw", "d": 3, "main": "window", "title": "(№ 7997)", "real": "Файл состоит не более чем из 10^6 символов и содержит только десятичные цифры и знаки равенства («=»). \nОпределите максимальную длину последовательности вида «число1=число2=число3=...=число N», в которой нет соседних знаков «=» и есть хотя бы одно число, не превышающее 264, шестеричная запись которого содержит ровно 7 единиц. \nВ ответе укажите количество символов.\n", "idea": "Сначала зафиксируй, что именно должна удовлетворять подстрока. Выбирай границы и прекращай перебор, когда дальнейшее расширение уже не поможет.", "note": "Следи за включением правой границы: в срезе s[i:j] символ с индексом j не входит. Проверяй, можно ли безопасно использовать break.", "tpl": "s = '12=55987=34==55987=12345=6789=2==55987=8'\ndef usl(c):\n    n=int(c)\n    k=0\n    while n:\n        k+=n%6==1\n        n//=6\n    return ⟦k==7⟧\nm=0\nfor part in s.split('=='):\n    part=part.strip('=')\n    if any(usl(c) for c in part.split('=') if c): m=max(m,len(part))\nprint(m)", "methods": {"window": "s = '12=55987=34==55987=12345=6789=2==55987=8'\ndef usl(c):\n    n=int(c)\n    k=0\n    while n:\n        k+=n%6==1\n        n//=6\n    return k==7\nm=0\nfor part in s.split('=='):\n    part=part.strip('=')\n    if any(usl(c) for c in part.split('=') if c): m=max(m,len(part))\nprint(m)"}, "ans": "18", "final": "", "flags": "", "tree": [], "groups": 0, "norx": false, "alias": "", "realAns": "910", "src": "Школьково 24", "lvl": "", "file": "", "alts": [], "tr": "12=55987=34==55987=12345=6789=2==55987=8", "ask": "", "s": "12=55987=34==55987=12345=6789=2==55987=8", "src2": "s = '12=55987=34==55987=12345=6789=2==55987=8'\ndef usl(c):\n    n=int(c)\n    k=0\n    while n:\n        k+=n%6==1\n        n//=6\n    return k==7\nm=0\nfor part in s.split('=='):\n    part=part.strip('=')\n    if any(usl(c) for c in part.split('=') if c): m=max(m,len(part))\nprint(m)", "like": "7993"}, {"id": "19970", "blk": "G", "role": "main", "d": 2, "main": "split", "title": "№ 19970", "real": "(Уровень: Сложный) Текстовый файл состоит из десятичных цифр, знаков «+» и «*» (сложения и умножения). \nОпределите максимальное количество символов в непрерывной последовательности, \nявляющейся корректным арифметическим выражением с целыми неотрицательными числами, кратными пяти. \nВ этом выражении никакие два знака арифметических операций не стоят рядом, \nпорядок действий определяется по правилам математики. \nВ записи чисел отсутствуют незначащие (ведущие) нули.", "idea": "Разметь запрещённые фрагменты или символы разделителями. После split проанализируй получившиеся части.", "note": "Важно не удалять символы исходной строки, если требуется сохранить длину. Используй разделитель, которого гарантированно нет в данных. Для наложений иногда нужен while.", "tpl": "s = '15+20*35++05*10+25+40*5+0**30+15*20'\nfro⟦m⟧ re import fullmatch,split\nm=0\nfor i in range(len(s)):\n    for j in range(i + max(1, m), len(s) + 1):\n        ss=s[i:j]\n        if fullmatch(r'(?:0|[1-9]\\d*)(?:[+*](?:0|[1-9]\\d*))*',ss):\n            a=split(r'[+*]',ss)\n            if all(int(c)%5==0 for c in a): m=max(m,len(ss))\nprint(m)", "methods": {"split": "s = '15+20*35++05*10+25+40*5+0**30+15*20'\nfrom re import fullmatch,split\nm=0\nfor i in range(len(s)):\n    for j in range(i + max(1, m), len(s) + 1):\n        ss=s[i:j]\n        if fullmatch(r'(?:0|[1-9]\\d*)(?:[+*](?:0|[1-9]\\d*))*',ss):\n            a=split(r'[+*]',ss)\n            if all(int(c)%5==0 for c in a): m=max(m,len(ss))\nprint(m)"}, "ans": "14", "final": "", "flags": "", "tree": [], "groups": 0, "norx": false, "alias": "", "realAns": "91", "src": "Школьково 24", "lvl": "", "file": "", "alts": [], "tr": "15+20*35++05*10+25+40*5+0**30+15*20", "ask": "", "s": "15+20*35++05*10+25+40*5+0**30+15*20", "src2": "s = '15+20*35++05*10+25+40*5+0**30+15*20'\nfrom re import fullmatch,split\nm=0\nfor i in range(len(s)):\n    for j in range(i + max(1, m), len(s) + 1):\n        ss=s[i:j]\n        if fullmatch(r'(?:0|[1-9]\\d*)(?:[+*](?:0|[1-9]\\d*))*',ss):\n            a=split(r'[+*]',ss)\n            if all(int(c)%5==0 for c in a): m=max(m,len(ss))\nprint(m)", "like": ""}, {"id": "18285", "blk": "G", "role": "hw", "d": 4, "main": "split", "title": "18285 сложно  арифметическое выражение без 0", "real": "Файл состоит из десятичных цифр, знаков «+» и «*». Рассматриваются непрерывные последовательности, которые являются корректными арифметическими выражениями с целыми положительными числами. \nДва знака операций не стоят рядом, порядок действий определяется по правилам математики. В записи чисел отсутствуют незначащие (ведущие) нули. \nОпределите максимальное количество чисел, входящих в одну из таких последовательностей.", "idea": "Разметь запрещённые фрагменты или символы разделителями. После split проанализируй получившиеся части.", "note": "Важно не удалять символы исходной строки, если требуется сохранить длину. Используй разделитель, которого гарантированно нет в данных. Для наложений иногда нужен while.", "tpl": "s = '12+3*4++05*6+7+8*9+10**2+3*4+5'\nfrom re import fullmatch,split\nm=0\nfor i in range(len(s)):\n    for j in range(i+1,len(s)+1):\n        ss=s[i:j]\n        if fullmatch(r'(?:0|[1-9]\\d*)(?:[+*](?:0|[1-9]\\d*))*',ss):\n            a=split(r'[+*]',ss)\n            if all(int(c)>0 for c in a): m=max(m,len(a))\nprint(⟦m⟧)", "methods": {"split": "s = '12+3*4++05*6+7+8*9+10**2+3*4+5'\nfrom re import fullmatch,split\nm=0\nfor i in range(len(s)):\n    for j in range(i+1,len(s)+1):\n        ss=s[i:j]\n        if fullmatch(r'(?:0|[1-9]\\d*)(?:[+*](?:0|[1-9]\\d*))*',ss):\n            a=split(r'[+*]',ss)\n            if all(int(c)>0 for c in a): m=max(m,len(a))\nprint(m)"}, "ans": "6", "final": "", "flags": "", "tree": [], "groups": 0, "norx": false, "alias": "", "realAns": "44", "src": "Школьково 24", "lvl": "", "file": "", "alts": [], "tr": "12+3*4++05*6+7+8*9+10**2+3*4+5", "ask": "", "s": "12+3*4++05*6+7+8*9+10**2+3*4+5", "src2": "s = '12+3*4++05*6+7+8*9+10**2+3*4+5'\nfrom re import fullmatch,split\nm=0\nfor i in range(len(s)):\n    for j in range(i+1,len(s)+1):\n        ss=s[i:j]\n        if fullmatch(r'(?:0|[1-9]\\d*)(?:[+*](?:0|[1-9]\\d*))*',ss):\n            a=split(r'[+*]',ss)\n            if all(int(c)>0 for c in a): m=max(m,len(a))\nprint(m)", "like": "19149"}, {"id": "7977", "blk": "G", "role": "main", "d": 3, "main": "regex", "title": "(№ 7977)", "real": "Файл состоит не более чем из 10^6 символов и содержит только цифры 16 сс, а также знаки «+» и «*» . Найдите самую длинную непрерывную последовательность символов, которая является корректным арифметическим выражением с целыми неотрицательными числами, записанными в 6 сс. \nВ ответе запишите последние 6 цифр значения этого выражения. \nЕсли в файле есть два выражения одинаковой длины, выберите то, у которого значение наибольшее.\n", "idea": "Сначала зафиксируй, что именно должна удовлетворять подстрока. Выбирай границы и прекращай перебор, когда дальнейшее расширение уже не поможет.", "note": "Следи за включением правой границы: в срезе s[i:j] символ с индексом j не входит. Проверяй, можно ли безопасно использовать break.", "tpl": "s = '12+34*5++F25*44+123*5+4**E15+24*5'\nfrom re import *\n\nreg=r'(?=((?:0|[1-5][0-5]*)(?:[+*](?:0|[1-5][0-5]*))*))'\nres=[c.group(1) for c in finditer(reg,s) if c.group(1)]\nl=max(map(len,res))\nres=[c for c in res if len(c)==l]\ndef value(ss):\n    a=split(r'([+*])',ss)\n    a=[str(int(c,6)) if c not in '+*' else c for c in a]\n    return ⟦eval(''.join(a))⟧\nans=max(res,key=value)\nprint(str(value(ans))[-6:])", "methods": {"regex": "s = '12+34*5++F25*44+123*5+4**E15+24*5'\nfrom re import *\n\nreg=r'(?=((?:0|[1-5][0-5]*)(?:[+*](?:0|[1-5][0-5]*))*))'\nres=[c.group(1) for c in finditer(reg,s) if c.group(1)]\nl=max(map(len,res))\nres=[c for c in res if len(c)==l]\ndef value(ss):\n    a=split(r'([+*])',ss)\n    a=[str(int(c,6)) if c not in '+*' else c for c in a]\n    return eval(''.join(a))\nans=max(res,key=value)\nprint(str(value(ans))[-6:])"}, "ans": "735", "final": "", "flags": "", "tree": [], "groups": 0, "norx": false, "alias": "", "realAns": "5513", "src": "Школьково 24", "lvl": "", "file": "", "alts": [], "tr": "12+34*5++F25*44+123*5+4**E15+24*5", "ask": "", "s": "12+34*5++F25*44+123*5+4**E15+24*5", "src2": "s = '12+34*5++F25*44+123*5+4**E15+24*5'\nfrom re import *\n\nreg=r'(?=((?:0|[1-5][0-5]*)(?:[+*](?:0|[1-5][0-5]*))*))'\nres=[c.group(1) for c in finditer(reg,s) if c.group(1)]\nl=max(map(len,res))\nres=[c for c in res if len(c)==l]\ndef value(ss):\n    a=split(r'([+*])',ss)\n    a=[str(int(c,6)) if c not in '+*' else c for c in a]\n    return eval(''.join(a))\nans=max(res,key=value)\nprint(str(value(ans))[-6:])", "variants": [{"id": "7979", "real": "Файл состоит из цифр 16 сс и знаков «+» и «*».\nОпределите самую длинную последовательность, которая стоит сразу после буквы F и является корректным выражением с целыми неотрицательными числами, записанными в 8 сс. \nВ ответе запишите ЗНАЧЕНИЕ этого выражения.  Если в файле есть два подходящих выражения одинаковой длины, выберите то, у которого значение НАИБОЛЬШЕЕ.\n", "methods": {"loops": "s = 'ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC'\ns=s.replace('8','G').replace('9','G').replace('A','G').replace('B','G').replace('C','G').replace('D','G').replace('E','G')\nl=30; t=set()\nfor i in range(len(s)):\n    j=i+l\n    while j<=len(s):\n        ss=s[i:j]\n        ss=ss.strip('*').strip('+')\n        if ss[0]=='F'  and all(c not in ss[1::] for c in \\\n            ['++','+*','*+','**','+00','+01','+02','+03','+04','+05','+06','+07','+0F','*00','*01','*02','*03','*04','*05','*06','*07','*0F','F','G']):\n            l = len(ss)\n            if l>=35:\n                t.add(ss)\n        else: break\n        j+=1\nprint(l,len(t),t)\nprint(max(5*1*59+6*9*59*42+22*14*25+17*61+0,2+3*3+5+27*30+53+10+20+12*28+30*12))"}, "main": "loops", "tpl": "s = 'ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC'\ns=s.replace('8','G').replace('9','G').replace('A','G').replace('B','G').replace('C','G').replace('D','G').replace('E','G')\nl=30; t=set()\nfor i in range(len(s)):\n    j=i+l\n    while ⟦j<=len(s)⟧:\n        ss=s[i:j]\n        ss=ss.strip('*').strip('+')\n        if ss[0]=='F'  and all(c not in ss[1::] for c in \\\n            ['++','+*','*+','**','+00','+01','+02','+03','+04','+05','+06','+07','+0F','*00','*01','*02','*03','*04','*05','*06','*07','*0F','F','G']):\n            l = len(ss)\n            if l>=35:\n                t.add(ss)\n        else: break\n        j+=1\nprint(l,len(t),t)\nprint(max(5*1*59+6*9*59*42+22*14*25+17*61+0,2+3*3+5+27*30+53+10+20+12*28+30*12))", "ans": "142844", "s": "ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC", "tr": "ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC", "realAns": "142844", "idea": "Переведи условие задачи в шаблон: допустимые символы, повторения, границы и обязательные фрагменты.", "note": "Проверь, нужны ли перекрывающиеся совпадения: обычный findall их не находит. Для перекрытий применяют просмотр вперёд.", "file": "", "src": "Школьково 24"}], "like": ""}, {"id": "17685", "blk": "G", "role": "main", "d": 2, "main": "loops", "title": "17685  (Гроб)  арифметическое выражение", "real": "Текстовый файл состоит из десятичных цифр, знаков «+» и «*» (сложения и умножения). \nОпределите максимальное количество символов в непрерывной последовательности, являющейся корректным арифметическим выражением с целыми неотрицательными числами (без знака), значение которого равно 0. \nВ этом выражении никакие два знака арифметических операций не стоят рядом, в записи чисел отсутствуют незначащие (ведущие) нули и число 0 не имеет знака. \nПорядок действий определяется по правилам математики.   ", "idea": "Сначала зафиксируй, что именно должна удовлетворять подстрока. Выбирай границы и прекращай перебор, когда дальнейшее расширение уже не поможет.", "note": "Следи за включением правой границы: в срезе s[i:j] символ с индексом j не входит. Проверяй, можно ли безопасно использовать break.", "tpl": "s = '2*0+0*123++01*0+0+25*0+0*9**4*0+0'\nfro⟦m⟧ re import fullmatch,split\nm=0\nfor i in range(len(s)):\n    for j in range(i + max(1, m), len(s) + 1):\n        ss=s[i:j]\n        if fullmatch(r'(?:0|[1-9]\\d*)(?:[+*](?:0|[1-9]\\d*))*',ss):\n            a=split(r'[+*]',ss)\n            if eval(ss)==0: m=max(m,len(ss))\nprint(m)", "methods": {"loops": "s = '2*0+0*123++01*0+0+25*0+0*9**4*0+0'\nfrom re import fullmatch,split\nm=0\nfor i in range(len(s)):\n    for j in range(i + max(1, m), len(s) + 1):\n        ss=s[i:j]\n        if fullmatch(r'(?:0|[1-9]\\d*)(?:[+*](?:0|[1-9]\\d*))*',ss):\n            a=split(r'[+*]',ss)\n            if eval(ss)==0: m=max(m,len(ss))\nprint(m)"}, "ans": "14", "final": "", "flags": "", "tree": [], "groups": 0, "norx": false, "alias": "", "realAns": "169", "src": "Школьково 24", "lvl": "", "file": "", "alts": [], "tr": "2*0+0*123++01*0+0+25*0+0*9**4*0+0", "ask": "", "s": "2*0+0*123++01*0+0+25*0+0*9**4*0+0", "src2": "s = '2*0+0*123++01*0+0+25*0+0*9**4*0+0'\nfrom re import fullmatch,split\nm=0\nfor i in range(len(s)):\n    for j in range(i + max(1, m), len(s) + 1):\n        ss=s[i:j]\n        if fullmatch(r'(?:0|[1-9]\\d*)(?:[+*](?:0|[1-9]\\d*))*',ss):\n            a=split(r'[+*]',ss)\n            if eval(ss)==0: m=max(m,len(ss))\nprint(m)", "like": ""}, {"id": "19149", "blk": "G", "role": "main", "like": "", "star": true, "title": "", "idea": "", "note": "Скобки регулярка не проверит (вложенность). Два цикла, а проверку корректности оставляем Python: fullmatch пропускает только цифры, скобки и +, потом eval без встроенных функций.", "tr": "(1+3)+(2+4))(1+(2+3)+4)+(2+2))((1+3)+4)", "ask": "", "s": "(1+3)+(2+4))(1+(2+3)+4)+(2+2))((1+3)+4)", "ans": "17", "tpl": "s = '(1+3)+(2+4))(1+(2+3)+4)+(2+2))((1+3)+4)'\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + max(2, dl), len(s) + 1):\n        e = s[i:j]\n        if ⟦e[0] == '(' and e[-1] == ')' and '++' not in e and '(+' not in e and '+)' not in e and '()' not in e and ')(' not in e⟧:\n            try:\n                if eval(e) % 2 == 0:\n                    dl = max(dl, j - i)\n            except Exception:\n                pass\nprint(dl)", "methods": {"loops": "s = '(1+3)+(2+4))(1+(2+3)+4)+(2+2))((1+3)+4)'\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + max(2, dl), len(s) + 1):\n        e = s[i:j]\n        if e[0] == '(' and e[-1] == ')' and '++' not in e and '(+' not in e and '+)' not in e and '()' not in e and ')(' not in e:\n            try:\n                if eval(e) % 2 == 0:\n                    dl = max(dl, j - i)\n м стыке.", "note": "Проверь граничные позиции отдельно. Для правой динамики обычно нужен обратный проход.", "tpl": "s = 'QTUHHMSMJFSMECQABCCDEEDCBAQABCDCBAX'\nn=len(s)\na=[1]*n\nb=[1]*n\nfor i in range(1,n):\n    if s[i-1]<=s[i]: a[i]=a[i-1]+1\nfor i in range(n-2,-1,-1):\n    if s[i]>=s[i+1]: b[i]=b[i+1]+1\nprint(⟦max(a[i]+b[i+1] for i in range(n-1))⟧)", "methods": {"dp": "s = 'QTUHHMSMJFSMECQABCCDEEDCBAQABCDCBAX'\nn=len(s)\na=[1]*n\nb=[1]*n\nfor i in range(1,n):\n    if s[i-1]<=s[i]: a[i]=a[i-1]+1\nfor i in range(n-2,-1,-1):\n    if s[i]>=s[i+1]: b[i]=b[i+1]+1\nprint(max(a[i]+b[i+1] for i in range(n-1)))"}, "ans": "11", "final": "", "flags": "", "tree": [], "groups": 0, "norx": false, "alias": "", "realAns": "17", "src": "Школьково 24", "lvl": "", "file": "", "alts": [], "tr": "QTUHHMSMJFSMECQABCCDEEDCBAQABCDCBAX", "ask": "", "s": "QTUHHMSMJFSMECQABCCDEEDCBAQABCDCBAX", "src2": "s = 'QTUHHMSMJFSMECQABCCDEEDCBAQABCDCBAX'\nn=len(s)\na=[1]*n\nb=[1]*n\nfor i in range(1,n):\n    if s[i-1]<=s[i]: a[i]=a[i-1]+1\nfor i in range(n-2,-1,-1):\n    if s[i]>=s[i+1]: b[i]=b[i+1]+1\nprint(max(a[i]+b[i+1] for i in range(n-1)))", "like": ""}, {"id": "14100", "blk": "F", "role": "main", "like": "", "star": true, "title": "", "idea": "Регулярка (?:ABA|CB|…)+ выбирает первый подошедший вариант и не возвращается, если другой выбор дал бы длиннее. Считаем с конца: best[j] — самая длинная склейка, начиная с позиции j.", "note": "Регулярки — неподходящий способ: (?:ABC|ABA|…)+ берёт ПЕРВЫЙ подошедший вариант и не возвращается, если другой выбор дал бы цепочку длиннее (проверено: на случайных строках ошибается). Считаем с конца: best[j] = лучший кусок w в позиции j плюс best сразу после него.", "tr": "CCCCABAACBBABCCCCCBABCBABACBBABCCCCAAB", "ask": "", "s": "CCCCABAACBBABCCCCCBABCBABACBBABCCCCAAB", "ans": "15", "tpl": "s = 'CCCCABAACBBABCCCCCBABCBABACBBABCCCCAAB'\nwords=[\"ABA\",\"CB\",\"AC\",\"BB\",\"ABC\",\"BCB\",\"BA\",\"AB\"]\ndp=[0]*(len(s)+1)\nfor i in range(1,len(s)+1):\n    for w in === A1 | A | 1 | split | 5 | Самая длинная серия без буквы A
real:
Текстовый файл состоит из заглавных латинских букв. Определите максимальное количество идущих подряд символов, среди которых нет буквы A.
idea:
Буква A — «стена». Если разрезать строку по A, между стенами останутся куски без A. Самый длинный кусок — ответ.
note:
split('A') даёт и пустые куски (когда A стоят рядом или на краю строки). Их длина 0, на максимум они не влияют.

s='ABCCDABEEEFAGGA'
l=⟦s.split('A')⟧
