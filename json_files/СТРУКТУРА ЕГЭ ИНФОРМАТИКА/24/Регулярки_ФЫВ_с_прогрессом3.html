<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Регулярки — тренажёр Python</title>
<style>
:root{--bg:#101a2b;--side:#15243a;--panel:#1c2d46;--ink:#17243a;--paper:#fbf7ec;--accent:#35a6b8;--line:#354a67;--font:16px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f7fb;font:var(--font)/1.42 system-ui,Segoe UI,sans-serif}
body.fs-small{--font:13px}body.fs-medium{--font:16px}body.fs-large{--font:19px}body.fs-giant{--font:22px}
button,input,select,textarea{font:inherit}button{border:1px solid #61748f;border-radius:9px;background:#263b58;color:#fff;padding:7px 11px;cursor:pointer}button:hover{filter:brightness(1.12)}button.primary{background:#126c80;border-color:#45b6c6}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 14px;min-height:58px;background:#142238;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.brand{font-weight:800;display:flex;align-items:center;gap:9px}.logo{padding:5px 9px;border-radius:8px;background:linear-gradient(135deg,#7583ed,#21b9b2)}.grow{flex:1}
.top select{background:#20334e;color:#fff;border:1px solid #526783;border-radius:8px;padding:7px}
.layout{display:grid;grid-template-columns:minmax(255px,29%) minmax(0,1fr);min-height:calc(100vh - 58px)}
.sidebar{padding:12px;background:var(--side);border-right:1px solid var(--line);position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}
.search{width:100%;padding:9px;border:1px solid #526783;background:#0e1929;color:#fff;border-radius:9px;margin-bottom:8px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px}.filters select{width:100%;min-width:0;padding:7px;border:1px solid #526783;border-radius:8px;background:#20334e;color:#fff}
.stats{margin:9px 0;padding:9px;background:#20334e;border-radius:9px}.bar{height:7px;background:#3b4e68;border-radius:10px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:#43c28c;width:0}
.group{border:1px solid #334967;border-radius:10px;overflow:hidden;margin:7px 0}
.group summary{list-style:none;cursor:pointer;color:#fff;font-weight:750;padding:10px;background:var(--group-color,#355a78)}.group summary::-webkit-details-marker{display:none}
.tasklist{padding:4px;background:#101c2e}.taskrow{width:100%;display:flex;gap:7px;align-items:center;text-align:left;border:0;background:transparent;color:#eaf0f8;padding:7px;border-radius:7px}.taskrow.active{background:rgba(80,160,255,.28)!important;outline:2px solid #4ea1ff;box-shadow:inset 3px 0 0 #4ea1ff}.taskrow.done{background:#15543e}.taskrow .num{font-weight:800;white-space:nowrap}.taskrow .lvl{margin-left:auto;color:#c3d2e5;font-size:.76em}
.main{min-width:0;padding:15px;max-width:1450px;width:100%;margin:auto}.welcome{color:#d2deed}.taskcard{background:var(--paper);color:var(--ink);border-radius:15px;padding:clamp(13px,1.6vw,22px);box-shadow:0 10px 30px #0003}
.head{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:8px}.head h1{font-size:1.25em;margin:0 4px 0 0;white-space:nowrap}.badge{font-size:.75em;padding:3px 8px;border-radius:15px;background:#e6eaf0;color:#34445b}.expand{margin-left:auto;white-space:nowrap}
.condition{background:#fffdf8;border-left:4px solid #e5b84d;border-radius:7px;padding:9px 12px;margin:7px 0 10px;line-height:1.45}.condition p{margin:0}.condition strong{font-weight:850;color:#132b4b}
details.theory{background:#dff3f6;border:1px solid #b2dce4;border-radius:10px;padding:8px 11px;margin:8px 0;color:#164654}details.theory summary{font-weight:750;cursor:pointer}.theory-body{padding-top:5px}.theory-body p{margin:4px 0}
.codebar{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 10px;background:#1c2b41;color:#eaf2fb;border-radius:9px 9px 0 0}.editor{display:block;width:100%;min-height:120px;resize:none;overflow:hidden;border:0;border-radius:0 0 9px 9px;background:#0d1725;color:#d9f4e7;padding:11px;font: .9em/1.48 ui-monospace,Consolas,monospace;tab-size:4;white-space:pre}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.actions button{padding:6px 10px}.output{background:#111d2d;color:#e4edf8;border-radius:8px;padding:9px;min-height:34px;max-height:280px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:.86em/1.45 ui-monospace,Consolas,monospace}

.regex-debugger{border:1px solid #8ba9c8;background:var(--panel,#edf3fa);color:#24364d;border-radius:10px;padding:10px;margin:9px 0}
.debug-head,.debug-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between}
.debug-caption{margin:5px 0 8px;font-size:.9em}
.debug-text{width:100%;min-height:75px;resize:vertical;border:1px solid #aabbd0;border-radius:7px;padding:8px;background:#fff;color:#17283d;font: .9em/1.5 ui-monospace,Consolas,monospace}
.debug-controls{justify-content:flex-start;margin-top:7px}
.debug-pattern{flex:1;min-width:180px;padding:8px;border:1px solid #9aabc0;border-radius:7px;font: .95em ui-monospace,Consolas,monospace}
.debug-highlight{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;border:1px solid #d1dbe7;border-radius:7px;padding:8px;color:#23354b;margin:6px 0}.debug-result{margin-top:8px;line-height:1.5;overflow-wrap:anywhere}
.debug-result mark{background:#ffe36e;color:#202020;border-radius:3px;padding:1px 0}
.feedback{margin-top:7px}.note{padding:8px 11px;border-radius:9px;margin:6px 0;background:#fff0b9;color:#59491e}.note.error{background:#ffe2e2;color:#733b3b}.note.ok{background:#dff5e9;color:#16563b}
.solution{background:#101827;color:#d8f3e8;border-radius:9px;padding:10px;white-space:pre;overflow:auto;font:.85em/1.45 ui-monospace,Consolas,monospace;max-height:65vh}
#focus{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;overflow:auto;padding:5vh 5vw}#focus .taskcard{width:100%;min-height:90vh;max-width:1600px;margin:0 auto;padding:clamp(18px,2vw,30px)}#focus .editor{overflow:hidden}
.modalback{position:fixed;inset:0;z-index:60;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px}.modal{width:min(500px,100%);background:#fbf7ec;color:#18243a;padding:22px;border-radius:15px}.modal input{width:100%;padding:10px;border:1px solid #aab6c5;border-radius:8px;margin:10px 0}.modal .actions{justify-content:flex-end}
.hidden{display:none!important}
@media(max-width:800px){.layout{grid-template-columns:1fr}.sidebar{position:relative;top:0;height:auto;max-height:45vh;border-right:0;border-bottom:1px solid var(--line)}.main{padding:9px}.expand{margin-left:0}}

.icon-actions{gap:8px;align-items:stretch}.icon-actions button{min-width:72px;height:auto;min-height:52px;padding:6px 8px;font-size:13px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.15;text-align:center}.icon-actions button .act-ico{font-size:18px;line-height:1}.icon-actions button .act-lbl{font-size:11px;opacity:.92;font-weight:600;max-width:78px;white-space:normal}
.editor-wrap{position:relative;width:100%;border-radius:0 0 9px 9px;background:#0d1725;overflow:hidden}
.editor-wrap .editor,.editor-wrap .editor-highlight{margin:0;width:100%;min-height:120px;padding:11px;font: .9em/1.48 ui-monospace,Consolas,monospace;tab-size:4;white-space:pre;overflow:hidden;letter-spacing:normal}
.editor-wrap .editor{position:relative;z-index:2;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:#fff;resize:none}
.editor-wrap .editor::selection{background:#3d6a9e;color:#e8f0ff;-webkit-text-fill-color:#e8f0ff}.editor-wrap .editor::-moz-selection{background:#3d6a9e;color:#e8f0ff}
.editor-wrap .editor-highlight{position:absolute;z-index:1;inset:0;color:#d9f4e7;pointer-events:none;overflow:auto}
.py-comment{color:#5a6a7a!important;font-style:italic;opacity:.75}
.debug-modal-backdrop{position:fixed;inset:0;z-index:100;background:#07111ddd;display:flex;align-items:center;justify-content:center;padding:3vh 3vw}
.debug-modal{width:min(1000px,96vw);max-height:92vh;overflow:auto;background:var(--panel);color:var(--ui-ink);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 20px 70px #0008}
.debug-modal-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:1.1em}
.debug-task-condition{background:var(--paper,#fbf7ec);color:var(--ink,#17243a);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 12px;line-height:1.45}
.debug-task-meta{font-size:.9em;opacity:.85;margin-bottom:6px}
.debug-task-text{font-size:.95em}
.debug-task-text strong{font-weight:850}
body[data-theme="dark"] .debug-task-condition{background:#1a2a40;color:#e8eef6}
:root{--ui-ink:#f4f7fb}
body[data-theme="light"]{--bg:#eef2f7;--side:#e1e8f0;--panel:#fff;--ink:#17243a;--line:#c1ccda;--ui-ink:#17243a;background:var(--bg);color:#17243a}
body[data-theme="light"] .top{background:#fff;color:#17243a;border-color:#c4cedb}
body[data-theme="light"] .top #studentLabel{color:#40536c!important}
body[data-theme="light"] .sidebar{background:#e4ebf3}
body[data-theme="light"] .search,body[data-theme="light"] .filters select,body[data-theme="light"] .top select{background:#fff;color:#17243a;border-color:#aab8c9}
body[data-theme="light"] .stats{background:#fff;color:#263b54}
body[data-theme="light"] .group{border-color:#bdc9d8}
body[data-theme="light"] .group summary{color:#fff}
body[data-theme="light"] .tasklist{background:#edf2f7}
body[data-theme="light"] .taskrow{color:#263b54}
body[data-theme="light"] .taskrow.active{outline:2px solid var(--accent,#5b9fd4);background:rgba(91,159,212,.25);background:#d2e3f4;color:#142d49}
body[data-theme="light"] .taskrow.done{background:#ccebdc;color:#15543e}
body[data-theme="light"] .welcome{color:#344a63}
body[data-theme="light"] .debug-modal{color:#17243a}
body[data-theme="light"] .debugger,body[data-theme="light"] .regex-debugger{color:#17243a}

.regex-debugger{color:var(--ui-ink)!important;background:var(--panel)!important}
.regex-debugger .debug-caption,.regex-debugger .debug-count{color:var(--ui-ink)!important;opacity:.92}
.regex-debugger .debug-head b{color:var(--ui-ink)!important}
body[data-theme="dark"] .regex-debugger{--ui-ink:#f2f6fc}
body[data-theme="light"] .regex-debugger{--ui-ink:#17243a}
body[data-theme="light"] button{background:#e5ebf3;color:#172b45;border-color:#9eafc3}
body[data-theme="light"] button.primary{background:#087e91;color:#fff;border-color:#087e91}
body[data-theme="light"] .editor-wrap{background:#0d1725}
.editor-wrap .editor-highlight{height:100%;box-sizing:border-box}

.solution-details{margin-top:8px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--panel);color:var(--ui-ink)}
.solution-details summary{cursor:pointer;font-weight:750}
body[data-theme="light"] .feedback{color:#17243a}
body[data-theme="light"] .solution{background:#172438;color:#f1f6fc}
body[data-theme="light"] .debug-modal-backdrop{background:#142033bb}

.group summary{background:transparent!important;color:var(--ui-ink,#eaf0f8)!important;border-bottom:1px solid var(--line);padding:11px 10px}
.group{background:transparent;border-color:var(--line)}
.section-count{float:right;color:var(--ui-ink);opacity:.72;font-weight:500}
.taskrow{color:var(--ui-ink,#eaf0f8)}
.taskrow-title{flex:1;min-width:0}
.taskmarks{white-space:nowrap;color:#e5b94f}
.task-flags{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0}
.task-flags button.flag-on{background:#247b67!important;color:#fff!important;border-color:#3ab18f!important}
.task-comment-label{display:block;font-weight:700;margin:10px 0 5px;color:var(--ui-ink)}
.task-comment{width:100%;min-height:58px;resize:vertical;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ui-ink);font:inherit}
.task-edit-modal{max-height:82vh;overflow:auto}
.task-edit-title{display:flex;align-items:center;justify-content:space-between;gap:10px}
.task-edit-title h2{margin:0 0 12px}
.task-edit-field{display:block;font-weight:700;margin:10px 0 4px;color:var(--ui-ink,#17243a)}
.task-edit-field input,.task-edit-field textarea{display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:8px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ui-ink);font:inherit}
.task-edit-field textarea{min-height:74px;resize:vertical}
.task-edit-field textarea[name="condition"]{min-height:105px}
.task-edit-field textarea[name="solutionCode"],.task-edit-field textarea[name="solutionCodeComments"]{min-height:125px;font-family:ui-monospace,Consolas,monospace}
button.danger{background:#9b3030!important;color:#fff!important;border-color:#bd5555!important}
body[data-theme="light"] .group summary{color:#24364d!important;background:transparent!important}
body[data-theme="light"] .taskrow{color:#263b54}
body[data-theme="light"] .section-count{color:#52647a}

/* Section titles: soft blue accent, readable in both themes */
.group summary{
  color:#a9c9df!important;
  background:transparent!important;
}
.group summary .section-count{
  color:#829fb5!important;
}
body[data-theme="light"] .group summary{
  color:#527b99!important;
  background:transparent!important;
}
body[data-theme="light"] .group summary .section-count{
  color:#7892a8!important;
}


.ans-mode-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 8px;padding:6px 10px;background:rgba(0,0,0,.2);border-radius:8px}
.ans-mode-label{font-size:.85rem;opacity:.8}
.ans-mode-btn{font:inherit;font-size:.85rem;padding:4px 10px;border-radius:6px;border:1px solid #3a4a60;background:#1a2433;color:#9ab;cursor:pointer}
.ans-mode-btn.active{background:#2a5a8a;color:#e8f4ff;border-color:#4ea1ff;box-shadow:0 0 0 1px #4ea1ff}
.ans-mode-hint{font-size:.75rem;opacity:.55}
.py-comment{color:#5a6a7a!important;font-style:italic;opacity:.75}

</style></head><body class="fs-medium">
<header class="top"><div class="brand"><span class="logo">re</span>Регулярки · Python</div><span id="studentLabel" style="color:#b8c7da">Ученик: —</span><div class="grow"></div>
<button id="themeToggle" type="button" title="Переключить светлую и тёмную тему" aria-label="Переключить тему">☀️ Светлая тема</button><label>Шрифт <select id="fontSize"><option value="small">Мелкий</option><option value="medium" selected>Средний</option><option value="large">Крупный</option><option value="giant">Гигантский</option></select></label>
<button id="saveApp" class="primary">Сохранить приложение</button><button id="exitBtn">Выход</button></header>
<div class="layout"><aside class="sidebar"><input id="search" class="search" placeholder="Поиск по условию, номеру, теории…">
<div class="filters"><button type="button" onclick="openTaskEditor()">＋ Добавить задачу</button></div><div class="filters"><select id="levelFilter"><option value="">Все уровни</option><option>Базовый</option><option>Средний</option><option>Сложный</option><option>Гроб</option><option>Не указан</option></select><select id="sectionFilter"><option value="">Все разделы</option></select><select id="taskFlagFilter"><option value="">Все задачи</option><option value="done">Решённые</option><option value="homework">ДЗ</option><option value="favorite">Избранное</option><option value="unsolved">Не решённые</option></select></div>

<script id="embeddedTasks" type="application/json">[{"id":"task_json_DFFD","number":"JSON-04","title":"Самая длинная цепочка без DFFD","section":"Запрещённые символы и последовательности","level":"Базовый","condition":"В файле найдите максимальную длину непрерывного фрагмента, в котором не встречается запрещённая последовательность DFFD.","filename":"24.txt","sampleText":"WNAJFCAZJBVEEUYKDNPVLXJDVNXCRUMTDWRFFWFGPXYHRVEM\n","expectedAnswer":"48","solutionCode":"import re\n\nf = open('24.txt', 'r')\ns = f.readline().strip()\n# s = \"WNAJFCAZJBVEEUYKDNPVLXJDVNXCRUMTDWRFFWFGPXYHRVEM\"\n\n# Регулярное выражение\npattern = r'(?:(?!DFFD).)+'\n\nmatches = re.findall(pattern, s)\nanswer = max((len(m) for m in matches), default=0)\nprint(answer)\n","source":"Каталог","theory":[],"approach":"","answerStatus":"verified","pattern":"(?:(?!DFFD).)+"},{"id":"task_21_1","number":"21","title":"Демоверсия 2021","section":"Максимальные и минимальные фрагменты","level":"Базовый","condition":"Текстовый файл состоит не более чем из 106 символов X, Y и Z. Определите максимальное количество идущих подряд символов, среди которых каждые два соседних различны.","filename":"24.txt","sampleText":"XXYZXYXZXXXYXZZYXYYXZZZZYZZYXYYYZZYXXXYYYYYYZ\n","expectedAnswer":7,"solutionCode":"import re\n\nf = open('24.txt', 'r')\ns = f.readline().strip()\n# s = \"XXYZXYXZXXXYXZZYXYYXZZZZYZZYXYYYZZYXXXYYYYYYZ\"\n\n# Регулярное выражение\npattern = r'(?:(.)(?!\\1))+'\n\nmatches = [m.group(0) for m in re.finditer(pattern, s)]\nanswer = max((len(m) for m in matches), default=0)\nprint(answer)\n","source":"Каталог","theory":[],"approach":"","answerStatus":"verified","pattern":"(?:(.)(?!\\1))+"},{"id":"task_66_2","number":"66","title":"Джобс 31.08.2020","section":"Повторяющиеся блоки и группы","level":"Базовый","condition":"Текстовый файл состоит не более чем из 106 латинских символов К, О, Т. Определите максимальное количество подряд идущих комбинаций КОТ.","filename":"24.txt","sampleText":"XXKOTKOTKOTYY\n","expectedAnswer":"3","solutionCode":"import re\n\nf = open('24.txt', 'r')\ns = f.readline().strip()\n# s = \"XXKOTKOTKOTYY\"\n\n# Регулярное выражение\npattern = r'(?:KOT)+'\n\nmatches = [m.group(0) for m in re.finditer(pattern, s)]\nanswer = max((len(m)//3 for m in matches), default=0)\nprint(answer)\n","source":"Каталог","theory":[],"approach":"","answerStatus":"verified","pattern":"(?:KOT)+"},{"id":"task_105_3","number":"105","title":"Джобс 07.09.2020","section":"Максимальные и минимальные фрагменты","level":"Базовый","condition":"Текстовый файл состоит не более чем из 106 символов F, A, I, L. Определите максимальное количество подряд идущих одинаковых букв.","filename":"24.txt","sampleText":"FLAIALAFFAAAFLAIAILIAFLFIIIILIFAFLFLLIFAFFIII\n","expectedAnswer":"4","solutionCode":"import re\n\nf = open('24.txt', 'r')\ns = f.readline().strip()\n# s = \"FLAIALAFFAAAFLAIAILIAFLFIIIILIFAFLFLLIFAFFIII\"\n\n# Регулярное выражение\npattern = r'(.)\\1+'\n\nmatches = [m.group(0) for m in re.finditer(pattern, s)]\nanswer = max((len(m) for m in matches), default=0)\nprint(answer)\n","source":"Каталог","theory":[],"approach":"","answerStatus":"verified","pattern":"(.)\\1+"},{"id":"task_314_4","number":"314","title":"Джобс 28.09.2020","section":"Повторяющиеся блоки и группы","level":"Базовый","condition":"Текстовый файл состоит не более чем из 106 символов S, T, O, C, K. Сколько раз встречается комбинация «OCK», не являющаяся при этом частью комбинации «STOCK».","filename":"24.txt","sampleText":"TCOKOKSKTOCKKOKCKOKOSTKCCCSCTTOCKSTTTTKKTCSTKOCKT\n","expectedAnswer":"3","solutionCode":"import re\n\nf = open('24.txt', 'r')\ns = f.readline().strip()\n# s = \"TCOKOKSKTOCKKOKCKOKOSTKCCCSCTTOCKSTTTTKKTCSTKOCKT\"\n\n# Регулярное выражение\npattern = r'(?<!ST)OCK'\n\nmatches = re.findall(pattern, s)\nprint(len(matches))\n","source":"Каталог","theory":[],"approach":"","answerStatus":"verified","pattern":"(?<!ST)OCK"},{"id":"task_414_5","number":"414","title":"Задание № 414","section":"Повторяющиеся блоки и группы","level":"Базовый","condition":"Текстовый файл состоит не более чем из 106 символов R, U, S, T, E, M. Сколько раз встречается комбинация «RUS», не являющаяся при этом частью комбинации «RUSTEM».","filename":"24.txt","sampleText":"RUUUSSURUSRMSSEMTRUSSMMEEEUUEEMMMUERURERRRUERUS\n","expectedAnswer":"3","solutionCode":"import re\n\nf = open('24.txt', 'r')\ns = f.readline().strip()\n# s = \"RUUUSSURUSRMSSEMTRUSSMMEEEUUEEMMMUERURERRRUERUS\"\n\n# Регулярное выражение\npattern = r'RUS(?!TEM)'\n\nmatches = re.findall(pattern, s)\nprint(len(matches))\n","source":"Каталог","theory":[],"approach":"","answerStatus":"verified","pattern":"RUS(?!TEM)"},{"id":"task_634_6","number":"634","title":"Джобс 02.11.2020","section":"Повторяющиеся блоки и группы","level":"Базовый","condition":"Текстовый файл состоит не более чем из 106 заглавных латинских букв (A..Z). Текст разбит на строки различной длины. Определите количество строк, в которых встречается комбинация Z*RO, где звёздочка обозначает любой символ.","filename":"24.txt","sampleText":"HELLOZAROXX\nNOTHING\nZZZROOK\n","expectedAnswer":"2","solutionCode":"import re\n\nf = open('24.txt', 'r')\ns = f.read()\n# s — многострочный текст\n\n# Регулярное выражение\npattern = r'^.*Z.RO.*$'\n\nmatches = re.findall(pattern, s, re.MULTILINE)\nprint(len(matches))\n","source":"Каталог","theory":[],"approach":"","answerStatus":"verified","pattern":"^.*Z.RO.*$"},{"id":"task_836_8","number":"836","title":"836 Джобс 14.12.2020","section":"Подсчёт и частотный анализ","level":"Базовый","condition":"Текстовый файл состоит не более чем из 106 символов английского алфавита. Определите количество палиндромов – последовательностей, которые читаются в обе стороны одинаково – длиной 5.","filename":"24.txt","sampleText":"ABCBADABCEABCFABCXABCD12321ABCKKKKKEABCMM MMFABCGABC\n","expectedAnswer":5,"solutionCode":"import re\n\nf = open('24.txt', 'r')\ns = f.readline().strip()\n# s = \"ABCBADABCEABCFABCXABCD12321ABCKKKKKEABCMM MMFABCGABC\"\n\n# Регулярное выражение\npattern = r'(?=(.)(.).\\2\\1)'\n\nmatches = re.findall(pattern, s)\nprint(len(matches))\n","source":"Каталог","theory":[],"approach":"","answerStatus":"verified","pattern":"(?=(.)(.).\\2\\1)"},{"id":"task_858_10","number":"858","title":"Задание № 858","section":"Повторяющиеся блоки и группы","level":"Базовый","condition":"Текстовый файл состоит не более чем из 106 заглавных латинских букв (A..Z). Текст разбит на строки различной длины. Определите количество строк, в которых встречается комбинация F*O, где звёздочка обозначает любой символ.","filename":"24.txt","sampleText":"ZOAAOAZOOOZFFOFOFFZOF\nOZFZOZOFAAOFOZZFOFZZO\nZOAFFOZOFFOAOZOZZFOAF\n","expectedAnswer":"3","solutionCode":"import re\n\nf = open('24.txt', 'r')\ns = f.read()\n\n# Регулярное выражение\npattern = r'^.*F.O.*$'\n\nmatches = re.findall(pattern, s, re.MULTILINE)\nprint(len(matches))\n","source":"Каталог","theory":[],"approach":"","answerStatus":"verified","pattern":"^.*F.O.*$"},{"id":"task_861_11","number":"861","title":"Задание № 861","section":"Повторяющиеся блоки и группы","level":"Базовый","condition":"Текстовый файл состоит не более чем из 106 символов S, T, O, C, K. Сколько раз встречается в файле комбинация «SOCKCOS»?","filename":"24.txt","sampleText":"CTTKSKCCTSSSSOCKCOSOSSCKTTCKSSOCKCOSCKOOOTSOCSOCKCOSKOTTC\n","expectedAnswer":"3","solutionCode":"import re\n\nf = open('24.txt', 'r')\ns = f.readline().strip()\n# s = \"CTTKSKCCTSSSSOCKCOSOSSCKTTCKSSOCKCOSCKOOOTSOCSOCKCOSKOTTC\"\n\n# Регулярное выражение\npattern = r'SOCKCOS'\n\nmatches = re.findall(pattern, s)\nprint(len(matches))\n","source":"Каталог","theory":[],"approach":"","answerStatus":"verified","pattern":"SOCKCOS"},{"id":"task_862_12","number":"862","title":"Задание № 862","section":"Повторяющиеся блоки и группы","level":"Базовый","condition":"Текстовый файл состоит не более чем из 106 символов S, T, O, C, K. Сколько раз встречается в файле комбинация «OKTOS»?","filename":"24.txt","sampleText":"OKTOSCTCCKTSSKCOSOKTOSSKOTCKKOOOKTKOKTOSSOKC\n","expectedAnswer":"3","solutionCode":"import re\n\nf = open('24.txt', 'r')\ns = f.readline().strip()\n# s = \"OKTOSCTCCKTSSKCOSOKTOSSKOTCKKOOOKTKOKTOSSOKC\"\n\n# Регулярное выражение\npattern = r'OKTOS'\n\nmatches = re.findall(pattern, s)\nprint(len(matches))\n","source":"Каталог","theory":[],"approach":"","answerStatus":"verified","pattern":"OKTOS"},{"id":"task_863_pdf","number":"863","title":"(Уровень: Базовый)","section":"Поиск и шаблоны","level":"Базовый","condition":"Текстовый файл состоит не более чем из 106 заглавных символов латинского алфавита и цифр. Определите максимальное количество идущих подряд символов, среди которых каждые два соседних различны.","filename":"24.txt","sampleText":"5783086271490940094929134653554505976717236739709347\n","expectedAnswer":23,"solutionCode":"s = open('24.txt').readline().strip()\nbest = cur = 1\nfor i in range(1, len(s)):\n    if s[i] != s[i-1]:\n        cur += 1\n        best = max(best, cur)\n    else:\n        cur = 1\nprint(best)\n","source":"Каталог","theory":[],"approach":"","answerStatus":"verified","pattern":""},{"id":"task_864_13","number":"864","title":"Задание № 864","section":"Запрещённые символы и последовательности","level":"Базовый","condition":"В текстовом файле находится цепочка из символов латинского алфавита A, B, C, D, E, F. Найдите длину самой длинной подцепочки, не содержащей гласных букв.","filename":"24.txt","sampleText":"DAEFACCFBFFCADCBEBEEDDFCCBDAEFBFACEDCECCACABDCBBBBECDECDEEDFCFDFA\n","expectedAnswer":"7","solutionCode":"import re\n\nf = open('24.txt', 'r')\ns = f.readline().strip()\n# s = \"DAEFACCFBFFCADCBEBEEDDFCCBDAEFBFACEDCECCACABDCBBBBECDECDEEDFCFDFA\"\n\n# Регулярное выражение\npattern = r'[^AEIOUY]+'\n\nmatches = re.findall(pattern, s)\nanswer = max((len(m) for m in matches), default=0)\nprint(answer)\n","source":"Каталог","theory":[],"approach":"","answerStatus":"verified","pattern":"[^AEIOUY]+"},{"id":"task_952_14","number":"952","title":"Задание № 952", n","expectedAnswer":"39","solutionCode":"import re\n\nf = open('24.txt', 'r')\ns = f.readline().strip()\n# s = \"642064230172368816909990970376009680784\"\n\n# Регулярное выражение\npattern = r'\\d+'\n\nmatches = re.findall(pattern, s)\nanswer = max((len(m) for m in matches), default=0)\nprint(answer)\n","source":"Каталог","theory":[],"approach":"","answerStatus":"verified","pattern":"\\d+"},{"id":"task_1042_17","number":"1042","title":"100 базовых задач Е. Джобс","section":"Классы символов и диапазоны","level":"Базовый","condition":"В файле записана последовательность символов. Сколько подстрок «abc» содержится в файле?","filename":"24.txt","sampleText":"abcabcabcabcXXX\n","expectedAnswer":"4","solutionCode":"import re\n\nf = open('24.txt', 'r')\ns = f.readline().strip()\n# s = \"abcabcabcabcXXX\"\n\n# Регулярное выражение\npattern = r'abc'\n\nmatches = re.findall(pattern, s)\nprint(len(matches))\n","source":"Каталог","theory":[],"approach":"","answerStatus":"verified","pattern":"abc"},{"id":"task_1205_18","number":"1205","title":"Апробация 27.04","section":"Максимальные и минимальные фрагменты","level":"Базовый","condition":"Текстовый файл состоит не более чем из 1200000 символов, которые являются прописными буквами латинского алфавита. Определите максимальное количество идущих подряд символов, среди которых нет символов G, W, P.","filename":"24.txt","sampleText":"ABCABCABCABCABCABCABCABCABCABCABCABCABCABCABC\n","expectedAnswer":"45","solutionCode":"import re\n\nf = open('24.txt', 'r')\ns = f.readline().strip()\n# s = \"ABCABCABCABCABCABCABCABCABCABCABCABCABCABCABC\"\n\n# Регулярное выражение\npattern = r'[^GWP]+'\n\nmatches = re.findall(pattern, s)\nanswer = max((len(m) for m in matches), default=0)\nprint(answer)\n","source":"Каталог","theory":[],"approach":"","answerStatus":"verified","pattern":"[^GWP]+"},{"id":"task_1230_19","number":"1230","title":"Апробация 27.04","section":"Максимальные и минимальные фрагменты","level":"Базовый","condition":"Текстовый файл состоит не более чем из 1200000 символов, которые являются прописными буквами латинского алфавита. Определите максимальное количество идущих подряд символов, среди которых нет символов W, R, Q.","filename":"24.txt","sampleText":"ABCABCABCABCABCABCABCABCABCABCABCABCABCABCABC\n","expectedAnswer":"45","solutionCode":"import re\n\nf = open('24.txt', 'r')\ns = f.readline().strip()\n# s = \"ABCABCABCABCABCABCABCABCABCABCABCABCABCABCABC\"\n\n# Регулярное выражение\npattern = r'[^WRQ]+'\n\nmatches = re.findall(pattern, s)\nanswer = max((len(m) for m in matches), default=0)\nprint(answer)\n","source":"Каталог","theory":[],"approach":"","answerStatus":"verified","pattern":"[^WRQ]+"},{"id":"task_1273_20","number":"1273","title":"Задание № 1273","section":"Максимальные и минимальные фрагменты","level":"Базовый","condition":"Текстовый файл состоит не более чем из 1200000 символов, которые являются прописными буквами латинского алфавита. Определите максимальное количество идущих подряд символов, среди которых нет подстроки XYZ.","filename":"24.txt","sampleText":"XYZXYZXYZXYZXXX\n","expectedAnswer":"5","solutionCode":"import re\n\nf = open('24.txt', 'r')\ns = f.readline().strip()\n# s = \"XYZXYZXYZXYZXXX\"\n\n# Регулярное выражение\npattern = r'(?:(?!XYZ).)+'\n\nmatches = re.findall(pattern, s)\nanswer = max((len(m) for m in matches), default=0)\nprint(answer)\n","source":"Каталог","theory":[],"approach":"","answerStatus":"verified","pattern":"(?:(?!XYZ).)+"},{"id":"task_1302_21","number":"1302","title":"Открытый вариант КЕГЭ","section":"Максимальные и минимальные фрагменты","level":"Базовый","condition":"Текстовый файл состоит не более чем из 1 200 000 символов X, Y, и Z. Определите максимальное количество идущих подряд символов, среди которых нет подстроки XZZY.","filename":"24.txt","sampleText":"ZZZYXZZZXXZXYZXYXYYZZYYZYXZYYXZXXZXZZYYZYYYXZXZZX\n","expectedAnswer":"34","solutionCode":"import re\n\nf = open('24.txt', 'r')\ns = f.readline().strip()\n# s = \"ZZZYXZZZXXZXYZXYXYYZZYYZYXZYYXZXXZXZZYYZYYYXZXZZX\"\n\n# Регулярное выражение\npattern = r'(?:(?!XZZY).)+'\n\nmatches = re.findall(pattern, s)\nanswer = max((len(m) for m in matches), default=0)\nprint(answer)\n","source":"Каталог","theory":[],"approach":"","answerStatus":"verified","pattern":"(?:(?!XZZY).)+"},{"id":"task_1866_22","number":"1866","title":"Основная волна 2021","section":"Максимальные и минимальные фрагменты","level":"Базовый","condition":"Текстовый файл состоит не более, чем из 107 строчных букв английского алфавита. Найдите максимальную длину подстроки, в которой символы a и d не стоят рядом.","filename":"24.txt","sampleText":"GZQYFKWZPUBRNXLESHJDCJTVXSDMVPPLMZGLSGDUEHYZXBEMWDKCPBXY\n","expectedAnswer":"56","solutionCode":"import re\n\nf = open('24.txt', 'r')\ns = f.readline().strip()\n# s = \"GZQYFKWZPUBRNXLESHJDCJTVXSDMVPPLMZGLSGDUEHYZXBEMWDKCPBXY\"\n\n# Регулярное выражение\npattern = r'(?:(?!ad|da).)+'\n\nmatches = re.findall(pattern, s)\nanswer = max((len(m) for m in matches), default=0)\nprint(answer)\n","source":"Каталог","theory":[],"approach":"","answerStatus":"verified","pattern":"(?:(?!ad|da).)+"},{"id":"task_1873_pdf","number":"1873","title":"(Уровень: Базовый)","section":"Поиск и шаблоны","level":"Базовый","condition":"Текстовый файл состоит не более чем из 106 символов и содержит только заглавные буквы латинского алфавита (A..Z). Определите максимальное количество идущих подряд символов, среди которых нет сочетания стоящих рядом букв P и R (в любом порядке).","filename":"24.txt","sampleText":"ZARRAPRZRZAPPARRRARZRRRPRAPAPPPRPPPPRRZAZPRAPRZPZPZZA\n","expectedAnswer":"17","solutionCode":"s = open('24.txt').readline().strip()\n# s = \"ZARRAPRZRZAPPARRRARZRRRPRAPAPPPRPPPPRRZAZPRAPRZPZPZZA\"\n\nbest = cur = 0\nfor i in range(len(s)):\n    if i > 0 and s[i-1]+s[i] in ('PR', 'RP'):\n        cur = 1\n    else:\n        cur += 1\n    best = max(best, cur)\nprint(best)\n","source":"Каталог","theory":[],"approach":"","answerStatus":"verified","pattern":""},{"id":"task_1874_23","number":"1874","title":"Задание № 1874","section":"Повторяющиеся блоки и группы","level":"Базовый","condition":"Текстовый файл состоит не более чем из 106 символов и содержит только заглавные буквы латинского алфавита (A..Z). Определите максимальное количество идущих подряд символов, среди которых нет сочетания символов QW.","filename":"24.txt","sampleText":"AZZZAZAAZZAZAZZAZZZZZZZZZZZAZAAZAAZAAAAZAZAAAZZAZZAZA\n","expectedAnswer":"53","solutionCode":"import re\n\nf = open('24.txt', 'r')\ns = f.readline().strip()\n# s = \"AZZZAZAAZZAZAZZAZZZZZZZZZZZAZAAZAAZAAAAZAZAAAZZAZZAZA\"\n\n# Регулярное выражение\npattern = r'(?:(?!QW).)+'\n\nmatches = re.findall(pattern, s)\nanswer = max((len(m) for m in matches), default=0)\nprint(answer)\n","source":"Каталог","theory":[],"approach":"","answerStatus":"verified","pattern":"(?:(?!QW).)+"},{"id":"task_2419_28","number":"2419","title":"Задание № 2419","section":"Максимальные и минимальные фрагменты","level":"Базовый","condition":"В текстовом файле находится цепочка из символов латинского алфавита A, B, C длиной не более 106 символов. Найдите длину самой длинной подцепочки, состоящей из символов C","filename":"24.txt","sampleText":"CACBABCAAABCBBBBBCAACBBCBBCBCBABABABCABBCCBBBBBAACACABAACBCCAC\n","expectedAnswer":"2","solutionCode":"import re\n\nf = open('24.txt', 'r')\ns = f.readline().strip()\n# s = \"CACBABCAAABCBBBBBCAACBBCBBCBCBABABABCABBCCBBBBBAACACABAACBCCAC\"\n\n# Регулярное выражение\npattern = r'C+'\n\nmatches = re.findall(pattern, s)\nanswer = max((len(m) for m in matches), default=0)\nprint(answer)\n","source":"Каталог","theory":[],"approach":"","answerStatus":"verified","pattern":"C+"},{"id":"task_2422_29","number":"2422","title":"Задание № 2422","section":"Повторяющиеся блоки и группы","level":"Базовый","condition":"Текстовый файл состоит не более чем из 106 символов X, Y, Z. Определите максимальное количество идущих подряд символов, расположенных в алфавитном порядке (возможно с повторением символов).","filename":"24.txt","sampleText":"YZXYZXYYXZYXZZZZZYZYZYXZYYXYYYYYXYYXYYXZZXYZZXYXXX\n","expectedAnswer":"6","solutionCode":"s = open('24.txt').readline().strip()\n# s = \"YZXYZXYYXZYXZZZZZYZYZYXZYYXYYYYYXYYXYYXZZXYZZXYXXX\"\n\nbest = cur = 1\nfor i in range(1, len(s)):\n    if s[i] >= s[i-1]:\n        cur += 1\n        best = max(best, cur)\n    else:\n        cur = 1\nprint(best)\n","source":"Каталог","theory":[],"approach":"","answerStatus":"verified","pattern":""},{"id":"task_2424_31","number":"2424","title":"Задание № 2424","section":"Повторяющиеся блоки и группы","level":"Базовый","condition":"Текстовый файл состоит не более чем из 106 символов и содержит только заглавные буквы латинского алфавита (ABC…Z). Определите максимальную длину цепочки символов, состоящей из повторяющихся фрагментов XYZ.","filename":"24.txt","sampleText":"ABCXYZXYZXYZDEF\n","expectedAnswer":"9","solutionCode":"import re\n\nf = open('24.txt', 'r')\ns = f.readline().strip()\n# s = \"ABCXYZXYZXYZDEF\"\n\n# Регулярное выражение\npattern = r'(?:XYZ)+'\n\nmatches = re.findall(pattern, s)\nanswer = max((len(m) for m in matches), default=0)\nprint(answer)\n","source":"Каталог","theory":[],"approach":"","answerStatus":"verified","pattern":"(?:XYZ)+"},{"id":"task_2500_33","number":"2500","title":"2500","section":"Подсчёт и частотный анализ","level":"Базовый","condition":"Текстовый файл состоит не более чем из 106 заглавных латинских букв (A..Z). Определите количество подстрок G*ME, где звёздочка обозначает любой символ.","filename":"24.txt","sampleText":"GAMEGXMEG1ME\n","expectedAnswer":"3","solutionCode":"import re\n\nf = open('24.txt', 'r')\ns = f.readline().strip()\n# s = \"GAMEGXMEG1ME\"\n\n# Регулярное выражение\npattern = r'G.ME'\n\nmatches = re.findall(pattern, s)\nprint(len(matches))\n","source":"Каталог","theory":[],"approach":"","answerStatus":"verified","pattern":"G.ME"},{"id":"task_2502_34","number":"2502","title":"Задание № 2502","section":"Повторяющиеся блоки и группы","level":"Базовый","condition":"Текстовый файл состоит не более чем из 106 заглавных латинских букв (A..Z). Текст разбит на строки различной длины. Определите количество строк, в которых хотя бы раз встречается комбинация K*GE, где звёздочка означает произвольный символ.","filename":"24.txt","sampleText":"AKXGEHELLO\nNOPE\nXKZGEYY\n","expectedAnswer":2,"solutionCode":"import re\nf = open('24.txt', 'r')\ns = f.read()\npattern = r'^.*K.GE.*$'\nmatches = re.findall(pattern, s, re.MULTILINE)\nprint(len(matches))\n","source":"Каталог","theory":[],"approach":"","answerStatus":"verified","pattern":"^.*K.GE.*$"},{"id":"task_2531_35","number":"2531","title":"Новогодний вариант 2021/2022","section":"Повторяющиеся блоки и группы","level":"Базовый","condition":"Определите, сколько раз встречается комбинация «NEWYEAR» в файле.","filename":"24.txt","sampleText":"NEWYEARNAEWNNWYNEWYEARYRARNEEWREEWYYRENAAEEANEWYEAR\n","expectedAnswer":"3","solutionCode":"import re\n\nf = open('24.txt', 'r')\ns = f.readline().strip()\n# s = \"NEWYEARNAEWNNWYNEWYEARYRARNEEWREEWYYRENAAEEANEWYEAR\"\n\n# Регулярное выражение\npattern = r'NEWYEAR'\n\nmatches = re.findall(pattern, s)\nprint(len(matches))\n","source":"Каталог","theory":[],"approach":"","answerStatus":"verified","pattern":"NEWYEAR"},{"id":"task_2576_36","number":"2576","title":"Задание № 2576","section":"Максимальные и минимальные фрагменты","level":"Базовый","condition":"Текстовый файл содержит строку из заглавных латинских букв и точек, всего не более 106 символов. Определите максимальное количество идущих подряд символов, среди которых нет точек, но есть не менее 3-х букв A.","filename":"24.txt","sampleText":".EABFAECABDB.EBECCCBCABD...AA.CBEACAFACAC\n","expectedAnswer":11,"solutionCode":"import re\nf = open('24.txt', 'r')\ns = f.readline().strip()\nparts = re.split(r'\\.', s)\nvalid_parts = [p for p in parts if p.count('A') >= 3]\nanswer = max((len(p) for p in valid_parts), default=0)\nprint(answer)\n","source":"Каталог","theory":[],"approach":"","answerStatus":"verified","pattern":""},{"id":"task_2577_37","number":"2577","title":"Задание № 2577","section":"Максимальные и минимальные фрагменты","level":"Базовый","condition":"Текстовый файл содержит строку из заглавных латинских букв и точек, всего не более 106 символов. Определите максимальное количество идущих подряд символов, среди которых нет букв Y, а количество точек не превышает 5.","filename":"24.txt","sampleText":"BCFFDE..DF.BAEBCEFF.BADAEABBCFCAFDCABCFCFC.CEDE.B\n","expectedAnswer":47,"solutionCode":"s = open('24.txt').readline().strip()\nbest = left = dots = 0\nfor right, ch in enumerate(s):\n    if ch == 'Y':\n        left = right + 1; dots = 0; continue\n    if ch == '.': dots += 1\n    while dots > 5:\n        if s[left] == '.': dots -= 1\n        left += 1\n    best = max(best, right - left + 1)\nprint(best)\n","source":"Каталог","theory":[],"approach":"","answerStatus":"verified","pattern":""},{"id":"task_2942_38","number":"2942","title":"Апробация 19.02.2022","section":"Повторяющиеся блоки и группы","level":"Базовый","condition":"Текстовый файл состоит из символов А, В и С. Определите максимальное количество идущих подряд пар символов АВ или АС в прилагаемом файле.","filename":"24.txt","sampleText":"ABACABACXX\n","expectedAnswer":"4","solutionCode":"import re\n\nf = open('24.txt', 'r')\ns = f.readline().strip()\n# s = \"ABACABACXX\"\n\n# Регулярное выражение\npattern = r'(?:AB|AC)+'\n\nmatches = [m.group(0) for m in re.finditer(pattern, s)]\nanswer = max((len(m)//2 for m in matches), default=0)\nprint(answer)\n","source":"Каталог","theory":[],"approach":"","answerStatus":"verified","pattern":"(?:AB|AC)+"},{"id":"task_3020_39","number":"3020","title":"Задание № 3020","section":"Повторяющиеся блоки и группы","level":"Базовый","condition":"Текстовый файл содержит строку из заглавных латинских букв X, Y и Z, всего не более чем из 106 символов. Определите максимальное количество идущих подряд пар символов ZX или ZY.","filename":"24.txt","sampleText": function setAnswerMode(mode, btn){

function hintPattern(t){

 if(/ограничена с одной стороны буквой a[\s\S]*другой[\s\S]*d[\s\S]*не содержит других букв a и d/i.test(m)
    || (/буквой a/.test(m) && /другой.*\bd\b/.test(m) && /не содержит других букв a и d/.test(m))){
  return 'A[^AD]*D|D[^AD]*A';
 }
 if(/перекрыва|с перекрыти/.test(m)) return '(?=...)';
 if(/не содержащ.*гласн/.test(m)) return '[^AEIOUY]+';
 if(/не содержащ.*символ(?:а|ов)? d\b/.test(m) && !/буквой a/.test(m)) return '[^D]+';
 if(/не содержащ.*c и f/.test(m)) return '[^CF]+';
 if(/не содержит|не содержится|без сочетания|без подстрок/.test(m)) return '[^ABC]+';
 if(/цифр/.test(m)) return '\\d+';
 if(/одинаков/.test(m)) return '(.)\\1+';

}

function liveRegex(input){

 try{

  for(const match of matches){const start=match.index,end=start+match[0].length;if(end<=start)continue;html+=esc(source.slice(last,start))+'<mark>'+esc(source.slice(start,end))+'</mark>';last=end;}
  html+=esc(source.slice(last));pre.innerHTML=html||esc(source);

function explainPattern(pat){
 if(!pat)return 'Шаблон подбирается под условие задачи.';
 const p=String(pat);
 const parts=[];
 if(p.startsWith('(?=')) parts.push('Внешняя конструкция (?=...) — просмотр вперёд: позиция в строке не сдвигается, поэтому можно находить перекрывающиеся совпадения.');
 if(/\[\^[^\]]+\]/.test(p)) parts.push('Класс вида [^...] означает «любой символ, кроме перечисленных внутри скобок». Так мы отбрасываем запрещённые буквы/цифры.');
 if(/\[(?!\^)[^\]]+\]/.test(p)) parts.push('Класс [...] перечисляет допустимые символы (или диапазон вроде A-Z / 0-9).');
 if(p.includes('\\d')) parts.push('\\d — любая цифра от 0 до 9 (эквивалент [0-9]).');
 if(p.includes('.')) parts.push('Точка . — ровно один любой символ (кроме перевода строки).');
 if(p.includes('+')) parts.push('Квантификатор + означает «один или более подряд».');
 if(p.includes('*') && !p.startsWith('(?=')) parts.push('Квантификатор * означает «ноль или более подряд».');
 if(p.includes('\\1')) parts.push('Обратная ссылка \\1 повторяет то, что захватила первая группа (...). Так ищут серии одинаковых символов.');
 if(p.includes('(?:')) parts.push('(?:...) — незахватывающая группа: нужна для группировки, но не попадает в результат findall отдельным элементом.');
 if(!parts.length) parts.push('Шаблон читается слева направо: каждый фрагмент описывает очередной кусок искомой подстроки.');
 return parts.join(' ');
}
function commentedSolution(code){
 const lines=String(code||'').split('\n');
 const patLine=lines.find(l=>/pattern\s*=/.test(l));
 const patMatch=patLine&&patLine.match(/pattern\s*=\s*r?(['"])([\s\S]*?)\1/);
 const pat=patMatch?patMatch[2]:'';
 const patternExplain=explainPattern(pat);
 return lines.map((line)=>{
  if(!line.trim())return '';
  if(line.trim().startsWith('#'))return line;
  const t=line.trim();
  if(t.startsWith('import re')) return line+'  # подключаем модуль регулярных выражений Python';
  if(t.startsWith('f = open(')) return line+'  # открываем файл с текстом задания (обычно 24.txt)';
  if(t.startsWith('s = f.readline()')) return line+'  # читаем одну строку файла в переменную s';
  if(t.startsWith('s = ')) return line+'  # (альтернатива) можно подставить образец строки прямо в код';
  if(t.startsWith('pattern =')) return line+'  # '+patternExplain;
  if(t.startsWith('matches = re.findall(')) return line+'  # findall возвращает список всех неперекрывающихся совпадений (или список групп)';
  if(t.startsWith('answer = len(matches)')) return line+'  # в этой задаче нужен подсчёт количества совпадений';
  if(t.startsWith('answer = max(')) return line+'  # среди всех совпадений выбираем максимальную длину — это ответ';
  if(t.startsWith('print(answer)')) return line+'  # выводим число-ответ; его сверит тренажёр с эталоном';
  return line+'  # следующий шаг решения';
 }).join('\n');
}
function highlightPython(code){
