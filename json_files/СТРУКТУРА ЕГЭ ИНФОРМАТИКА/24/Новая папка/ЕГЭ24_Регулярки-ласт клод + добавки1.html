DCCDEDABEBEC'\nprint(len(s), set(s), s[:200])\nk = 0\nfor i in range(len(s)):\n    for j in range(i + 7, i + 11):\n        if j <= len(s) and s[i] == 'A' and s[j-1] == 'F':\n            k += 1\nprint(k)"},"final":"","flags":"","tree":[],"groups":0,"main":"pos","norx":true,"d":2,"alias":"","realAns":"","src2":"","real":"Текстовый файл содержит строку из заглавных букв A, B, C, D, E, F, всего не более чем из 10⁶ символов. AF-подстроками назовём непустые последовательности идущих подряд символов A, B, C, D, E, F, ограниченные в начале символом A, а в конце символом F (граничные символы входят в подстроку). Определите количество AF-подстрок длиной от 7 до 10 символов.","src":"","lvl":"Средний","file":"https://kompege.ru/files/AAGqSw59y.txt"},{"id":"12410","blk":"RW","role":"hw","like":"5381","star":true,"title":"","idea":"","note":"Нарушение в позиции i — пара (s[i], s[i+1]). Окно может начинаться сразу после левой соседней пары и кончаться на первой букве правой.","tr":"в учебной строке — ровно 3 нарушения (в файле — 100000)","ask":"","s":"EDBEGBGABCDEACFCGDDCCBEDBGBCCGGFEDBGGEFFFDGCE","ans":"13","tpl":"s = 'EDBEGBGABCDEACFCGDDCCBEDBGBCCGGFEDBGGEFFFDGCE'\nprint(len(s), set(s), s[:200])\nq = [i for i in range(len(s) - 1) if s[i] > s[i+1]]   # где порядок нарушается\nK = 3\nq = [-1] + q + [len(s) - 1]            # пустые соседи\nprint(max(q[i+K+1] + 1 - (q[i] + 1) for i in range(len(q) - K - 1)))","methods":{"pos":"s = 'EDBEGBGABCDEACFCGDDCCBEDBGBCCGGFEDBGGEFFFDGCE'\nprint(len(s), set(s), s[:200])\nq = [i for i in range(len(s) - 1) if s[i] > s[i+1]]   # где порядок нарушается\nK = 3\nq = [-1] + q + [len(s) - 1]            # пустые соседи\nprint(max(q[i+K+1] + 1 - (q[i] + 1) for i in range(len(q) - K - 1)))","loops":"s = 'EDBEGBGABCDEACFCGDDCCBEDBGBCCGGFEDBGGEFFFDGCE'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    return sum(ss[k] > ss[k+1] for k in range(len(ss) - 1)) == 3\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) > dl:\n            dl = len(ss)\nprint(dl)"},"final":"","flags":"","tree":[],"groups":0,"main":"pos","norx":true,"d":4,"alias":"","realAns":"","src2":"","real":"(Л. Шастин) Текстовый файл состоит не более, чем из 7 200 000 прописных символов латинского алфавита.\nОпределите в прилагаемом файле максимальное количество идущих подряд символов, среди которых прямой алфавитный порядок нарушается ровно 100000 раз.\nНапример, в подстроке AABCEGBCDFXCDEFA прямой алфавитный порядок нарушается ровно трижды.\nДля выполнения этого задания следует написать программу.","src":"","lvl":"Средний","file":"https://kompege.ru/files/plKdEkV3w.txt"},{"id":"24374","blk":"RW","role":"hw","like":"5381","star":false,"title":"","idea":"","note":"Слово, задетое краем окна, — всё равно слово. Поэтому окно тянется от конца предыдущего слова до начала следующего.","tr":"в учебной строке — ровно 3 слова (в файле — 80); ответ — номер первого символа","ask":"","s":"1Q2A1AB2122BBB2A1AA12ABA2AB1C2DAB2B2BB1B2A1AAA12A12","ans":"7","tpl":"from re import *\ns = '1Q2A1AB2122BBB2A1AA12ABA2AB1C2DAB2B2BB1B2A1AAA12A12'\nprint(len(s), set(s), s[:200])\nw = [m.span() for m in finditer('[A-Z]+', s)]      # слова: (начало, конец)\nK = 3\nst = [0] + [b for a, b in w] \nbest = (-1, 0)\nfor i in range(len(w) - K + 1):\n    L = w[i-1][1] if i > 0 else 0               # после предыдущего слова\n    R = w[i+K][0] if i + K < len(w) else len(s)   # до следующего слова\n    best = max(best, (R - L, -L))\nprint(⟦-best[1]⟧)","methods":{"pos":"from re import *\ns = '1Q2A1AB2122BBB2A1AA12ABA2AB1C2DAB2B2BB1B2A1AAA12A12'\nprint(len(s), set(s), s[:200])\nw = [m.span() for m in finditer('[A-Z]+', s)]      # слова: (начало, конец)\nK = 3\nst = [0] + [b for a, b in w] \nbest = (-1, 0)\nfor i in range(len(w) - K + 1):\n    L = w[i-1][1] if i > 0 else 0               # после предыдущего слова\n    R = w[i+K][0] if i + K < len(w) else len(s)   # до следующего слова\n    best = max(best, (R - L, -L))\nprint(-best[1])","loops":"s = '1Q2A1AB2122BBB2A1AA12ABA2AB1C2DAB2B2BB1B2A1AAA12A12'\nprint(len(s), set(s), s[:200])\nimport re as _r\nbest = (-1, 0)\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        if len(_r.findall('[A-Z]+', s[i:j])) == 3:\n            best = max(best, (j - i, -i))\nprint(-best[1])"},"final":"","flags":"","tree":[],"groups":0,"main":"pos","norx":true,"d":4,"alias":"","realAns":"","src2":"","real":"(Иглин К.) Текстовый файл состоит из десятичных цифр и заглавных букв латинского алфавита. Определите в прилагаемом файле последовательность из максимального количества идущих подряд символов, удовлетворяющую условию: в ней ровно 80 отдельных слов (слова - это последовательности подряд идущих букв, отделенные друг от друга хотя бы одной цифрой).\nВ ответе запишите число - порядковый номер в файле первого символа найденной последовательности.\nДля выполнения этого задания следует написать программу.\nПримечание. В прилагаемом файле нумерация символов начинается с нуля.","src":"","lvl":"Средний","file":"https://kompege.ru/files/J-IpeNeSO5j.txt"},{"id":"2506","blk":"RC","role":"main","like":"","star":false,"title":"","idea":"Для каждого символа из set(s) считаем s.count(c). Самый частый — max по количеству; при равенстве берём первый по алфавиту — min среди лидеров.","note":"Регулярка здесь не нужна — хватает count и set.","tr":"","ask":"","s":"CBABACBAACBACBBBCBBABCCAACABABBACACBABBABCBBABBBBC","ans":"B23","tpl":"s = 'CBABACBAACBACBBBCBBABCCAACABABBACACBABBABCBBABBBBC'\nprint(len(s), set(s), s[:200])\nl = [(s.count(c), c) for c in set(s)]\nk = max(x[0] for x in l)\nc = ⟦min(x[1] for x in l if x[0] == k)⟧\nprint(l)\nprint(c + str(k))","methods":{"rx":"s = 'CBABACBAACBACBBBCBBABCCAACABABBACACBABBABCBBABBBBC'\nprint(len(s), set(s), s[:200])\nl = [(s.count(c), c) for c in set(s)]\nk = max(x[0] for x in l)\nc = min(x[1] for x in l if x[0] == k)\nprint(l)\nprint(c + str(k))","loops":"s = 'CBABACBAACBACBBBCBBABCCAACABABBACACBABBABCBBABBBBC'\nprint(len(s), set(s), s[:200])\nd = {}\nfor c in s:\n    d[c] = d.get(c, 0) + 1\nk = max(d.values())\nc = min(x for x in d if d[x] == k)\nprint(c + str(k))"},"final":"","flags":"","tree":[],"groups":0,"main":"rx","norx":true,"d":1,"alias":"","realAns":"","src2":"","real":"Текстовый файл состоит не более чем из 10⁶ символов и содержит только заглавные буквы латинского алфавита (ABC…Z). Определите символ, который чаще всего встречается в файле. Если таких символов несколько, выведите тот, который стоит раньше в алфавите. Например, в тексте CCBAABABCBC A встречается 3 раза, B - 4 раза и С - 4 раза. Чаще всего встречаются символы B и C, в ответе для этого случая надо написать B4 (без пробелов и других разделителей).","src":"","lvl":"Средний","file":"https://kompege.ru/files/caz1v-kBl.txt"},{"id":"2509","blk":"RC","role":"hw","like":"2506","star":false,"title":"","idea":"","note":"","tr":"","ask":"","s":"DCDBDACBBBCBBDDCACACADADADBBBBDADACAACBBACC","ans":"2","tpl":"s = 'DCDBDACBBBCBBDDCACACADADADBBBBDADACAACBBACC'\nprint(len(s), set(s), s[:200])\nl = [s.count(c) for c in set(s)]\nprint(l)\nprint(⟦max(l) - min(l)⟧)","methods":{"rx":"s = 'DCDBDACBBBCBBDDCACACADADADBBBBDADACAACBBACC'\nprint(len(s), set(s), s[:200])\nl = [s.count(c) for c in set(s)]\nprint(l)\nprint(max(l) - min(l))","loops":"s = 'DCDBDACBBBCBBDDCACACADADADBBBBDADACAACBBACC'\nprint(len(s), set(s), s[:200])\nd = {}\nfor c in s:\n    d[c] = d.get(c, 0) + 1\nprint(max(d.values()) - min(d.values()))"},"final":"","flags":"","tree":[],"groups":0,"main":"rx","norx":true,"d":1,"alias":"","realAns":"","src2":"","real":"Текстовый файл состоит не более чем из 10⁶ символов и содержит только заглавные буквы латинского алфавита (ABC…Z). Определите количество самого частого и самого редкого символа в файле (без учёта символа окончания строки). В качестве ответа запишите разницу между ними.","src":"","lvl":"Средний","file":"https://kompege.ru/files/ZFHhzbRCm.txt"},{"id":"2684","blk":"RC","role":"hw","like":"2506","star":false,"title":"","idea":"","note":"","tr":"","ask":"","s":"ADDCCBBABCDDCDBACBCBDABCBDCABCBABDBBBBAB","ans":"B","tpl":"s = 'ADDCCBBABCDDCDBACBCBDABCBDCABCBABDBBBBAB'\nprint(len(s), set(s), s[:200])\nl = [(s.count(c), c) for c in set(s)]\nk = max(x[0] for x in l)\nprint(⟦''.join(sorted(c for n, c in l if n == k))⟧)","methods":{"rx":"s = 'ADDCCBBABCDDCDBACBCBDABCBDCABCBABDBBBBAB'\nprint(len(s), set(s), s[:200])\nl = [(s.count(c), c) for c in set(s)]\nk = max(x[0] for x in l)\nprint(''.join(sorted(c for n, c in l if n == k)))","loops":"s = 'ADDCCBBABCDDCDBACBCBDABCBDCABCBABDBBBBAB'\nprint(len(s), set(s), s[:200])\nd = {}\nfor c in s:\n    d[c] = d.get(c, 0) + 1\nk = max(d.values())\nprint(''.join(sorted(c for c in d if d[c] == k)))"},"final":"","flags":"","tree":[],"groups":0,"main":"rx","norx":true,"d":1,"alias":"","realAns":"","src2":"","real":"Текстовый файл состоит не более чем из 10⁸ символов прописных латинских букв (A, B, .., Z). \nОпределите, какая буква встречается в текстовом файле максимальное количество раз. Если таких букв несколько, запишите их в ответе в алфавитном порядке. Ответ необходимо записать прописными (заглавными) буквами.","src":"Пробный 02.2022 /dev/inf Base level","lvl":"Средний","file":"https://kompege.ru/files/x53vxGdwF.txt"},{"id":"786","blk":"RC","role":"hw","like":"2506","star":false,"title":"","idea":"","note":"","tr":"","ask":"","s":"CAAAABDACABAABBACABBDACBBCDABBADBABDACADDA","ans":"6","tpl":"s = 'CAAAABDACABAABBACABBDACBBCDABBADBABDACADDA'\nprint(len(s), set(s), s[:200])\nprint(⟦sum(s[i] == s[-1 - i] for i in range(len(s) // 2))⟧)","methods":{"rx":"s = 'CAAAABDACABAABBACABBDACBBCDABBADBABDACADDA'\nprint(len(s), set(s), s[:200])\nprint(sum(s[i] == s[-1 - i] for i in range(len(s) // 2)))","loops":"s = 'CAAAABDACABAABBACABBDACBBCDABBADBABDACADDA'\nprint(len(s), set(s), s[:200])\nk = 0\nfor i in range(len(s) // 2):\n    if s[i] == s[len(s) - 1 - i]:\n        k += 1\nprint(k)"},"final":"","flags":"","tree":[],"groups":0,"main":"rx","norx":true,"d":1,"alias":"","realAns":"","src2":"","real":"В файле хранится строка из символов. Длина строки не более 106. \n\nСколько пар символов в строке являются симметричными? Симметричной парой называют такие два символа, которые расположены на одинаковом удалении от концов строки. \n\nНапример, в строке adcdeefcba три симметричных пары – aa, cc и ee.","src":"Джобс 30.11.2020","lvl":"Средний","file":"https://kompege.ru/files/eLeRo8pGW.txt"},{"id":"3099","blk":"RC","role":"hw","like":"2506","star":false,"title":"","idea":"","note":"Палиндром собирается, если букв с нечётным количеством не больше одной. Одна замена исправляет две такие буквы.","tr":"","ask":"","s":"DDDCBBBBDBADCBCCBADDDBBDAABDCAAADDCBCBDB","ans":"2","tpl":"s = 'DDDCBBBBDBADCBCCBADDDBBDAABDCAAADDCBCBDB'\nprint(len(s), set(s), s[:200])\nodd = sum(s.count(c) % 2 for c in set(s))\nprint(⟦odd // 2⟧)","methods":{"rx":"s = 'DDDCBBBBDBADCBCCBADDDBBDAABDCAAADDCBCBDB'\nprint(len(s), set(s), s[:200])\nodd = sum(s.count(c) % 2 for c in set(s))\nprint(odd // 2)","loops":"s = 'DDDCBBBBDBADCBCCBADDDBBDAABDCAAADDCBCBDB'\nprint(len(s), set(s), s[:200])\nd = {}\nfor c in s:\n    d[c] = d.get(c, 0) + 1\nprint(sum(v % 2 for v in d.values()) // 2)"},"final":"","flags":"","tree":[],"groups":0,"main":"rx","norx":true,"d":2,"alias":"","realAns":"","src2":"","real":"(PRO100 ЕГЭ) Текстовый файл содержит строку из заглавных латинских букв, всего не более чем из 10⁶ символов. Требуется заменить некоторые буквы на другие латинские так, чтобы из букв получившейся строки можно было собрать палиндром. В ответ запишите минимальное количество замен, которое нужно сделать.\nПример:\nИз строки wqe, строка wqq (можно собрать палиндром qwq) получается с помощью одной замены e -> q. \nОтвет: 1","src":"","lvl":"Гроб","file":"https://kompege.ru/files/scdrcDEHG.txt"},{"id":"2508п","blk":"RC","role":"hw","like":"2506","star":false,"title":"","idea":"","note":"Здесь ответ печатаем в одну строку: «E 9 Y 9».","tr":"","ask":"","s":"BACYDAACDEABCDADYDEYACCCYYYYYBACYEEEEYCYYEYADEBD","ans":"Y 5","tpl":"from re import *\ns = 'BACYDAACDEABCDADYDEYACCCYYYYYBACYEEEEYCYYEYADEBD'\nprint(len(s), set(s), s[:200])\npattern = r'⟦(.)\\1*⟧'\nl = [m.group() for m in finditer(pattern, s)]\nk = max(len(x) for x in l)\nprint(⟦' '.join(x[0] + ' ' + str(k) for x in l if len(x) == k)⟧)","methods":{"rx":"from re import *\ns = 'BACYDAACDEABCDADYDEYACCCYYYYYBACYEEEEYCYYEYADEBD'\nprint(len(s), set(s), s[:200])\npattern = r'(.)\\1*'\nl = [m.group() for m in finditer(pattern, s)]\nk = max(len(x) for x in l)\nprint(' '.join(x[0] + ' ' + str(k) for x in l if len(x) == k))","loops":"s = 'BACYDAACDEABCDADYDEYACCCYYYYYBACYEEEEYCYYEYADEBD'\nprint(len(s), set(s), s[:200])\nruns = []\ni = 0\nwhile i < len(s):\n    j = i\n    while j < len(s) and s[j] == s[i]:\n        j += 1\n    runs.append((s[i], j - i))\n    i = j\nk = max(n for c, n in runs)\nprint(' '.join(c + ' ' + str(n) for c, n in runs if n == k))"},"final":"(.)\\1*","flags":"","tree":[{"t":"(.)","g":1,"d":"ГРУППА №1 — запоминает совпавший кусок: его вернёт findall, m.group(1), на него ссылается \\1","c":[{"t":".","d":"точка — ровно один любой символ (кроме перевода строки, если нет флага S)"}]},{"t":"\\1*","d":"повторить ноль или больше раз — жадно (как можно больше):","c":[{"t":"\\1","d":"обратная ссылка: здесь должен стоять ТОТ ЖЕ текст, что совпал с группой №1"}]}],"groups":1,"main":"rx","norx":false,"d":2,"alias":"","realAns":"E 9 Y 9","src2":"","real":"Найдите длину самой длинной подцепочки, состоящей из одинаковых символов. Для каждой цепочки максимальной длины выведите отдельной строке сначала символ, из которого строится эта цепочка, а затем через пробел – длину этой цепочки. Данные о найденных цепочках расположите в порядке их появления в файле.","src":"сайт К. Полякова","lvl":"","file":""},{"id":"5830п","blk":"RC","role":"hw","like":"2506","star":false,"title":"","idea":"","note":"","tr":"","ask":"","s":"ABCCBBCBACABCABACCCBAABACAABBCBABCBBBACABCCCBAACC","ans":"4","tpl":"from re import *\ns = 'ABCCBBCBACABCABACCCBAABACAABBCBABCBBBACABCCCBAACC'\nprint(len(s), set(s), s[:200])\npattern = r'⟦(?:(.)(?!\\1))*.⟧'\nl = [m.group() for m in finditer(pattern, s)]\nk = max(len(x) for x in l)\nx = [x for x in l if len(x) == k][-1]          # последняя из самых длинных\nprint(x)\nprint(⟦max(x.count(c) for c in x)⟧)","methods":{"rx":"from re import *\ns = 'ABCCBBCBACABCABACCCBAABACAABBCBABCBBBACABCCCBAACC'\nprint(len(s), set(s), s[:200])\npattern = r'(?:(.)(?!\\1))*.'\nl = [m.group() for m in finditer(pattern, s)]\nk = max(len(x) for x in l)\nx = [x for x in l if len(x) == k][-1]          # последняя из самых длинных\nprint(x)\nprint(max(x.count(c) for c in x))","loops":"s = 'ABCCBBCBACABCABACCCBAABACAABBCBABCBBBACABCCCBAACC'\nprint(len(s), set(s), s[:200])\nbest = ''\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if all(ss[k] != ss[k+1] for k in range(len(ss) - 1)) and len(ss) >= len(best):\n            best = ss\nprint(max(best.count(c) for c in best))"},"final":"(?:(.)(?!\\1))*.","flags":"","tree":[{"t":"(?:(.)(?!\\1))*","d":"повторить ноль или больше раз — жадно (как можно больше):","c":[{"t":"(.)","g":1,"d":"ГРУППА №1 — запоминает совпавший кусок: его вернёт findall, m.group(1), на него ссылается \\1","c":[{"t":".","d":"точка — ровно один любой символ (кроме перевода строки, если нет флага S)"}]},{"t":"(?!\\1)","d":"просмотр вперёд: дальше НЕ должно идти следующее (символы не забираются, позиция не сдвигается):","c":[{"t":"\\1","d":"обратная ссылка: здесь должен стоять ТОТ ЖЕ текст, что совпал с группой №1"}]}]},{"t":".","d":"точка — ровно один любой символ (кроме перевода строки, если нет флага S)"}],"groups":1,"main":"rx","norx":false,"d":3,"alias":"","realAns":"19","src2":"","real":"Определите максимальное количество подряд идущих символов, среди которых нет пар одинаковых символов. В ответе укажите количество повторений самого часто встречающегося символ в найденной строке. Если таких строк несколько, используйте последнюю из них.","src":"сайт К. Полякова","lvl":"","file":""},{"id":"1148","blk":"RC","role":"hw","like":"2506","star":false,"title":"","idea":"","note":"","tr":"","ask":"","s":"BBBE\nBQQCFB\nEQCBE\nQQQQ\nEFDQBEACB","ans":"Q8","tpl":"s = 'BBBE\\nBQQCFB\\nEQCBE\\nQQQQ\\nEFDQBEACB'\nprint(len(s), set(s), s[:200])\nl = s.split('\\n')\nq = max(line.count('Q') for line in l)\nline = [x for x in l if x.count('Q') == q][-1]      # самая поздняя\nm = min(line.count(c) for c in set(line))\nc = ⟦min(c for c in set(line) if line.count(c) == m)⟧\nprint(line)\nprint(c + str(s.count(c)))","methods":{"rx":"s = 'BBBE\\nBQQCFB\\nEQCBE\\nQQQQ\\nEFDQBEACB'\nprint(len(s), set(s), s[:200])\nl = s.split('\\n')\nq = max(line.count('Q') for line in l)\nline = [x for x in l if x.count('Q') == q][-1]      # самая поздняя\nm = min(line.count(c) for c in set(line))\nc = min(c for c in set(line) if line.count(c) == m)\nprint(line)\nprint(c + str(s.count(c)))","loops":"s = 'BBBE\\nBQQCFB\\nEQCBE\\nQQQQ\\nEFDQBEACB'\nprint(len(s), set(s), s[:200])\nl = s.split('\\n')\nbest = None\nfor line in l:\n    if best is None or line.count('Q') >= best.count('Q'):\n        best = line\nd = {}\nfor c in best:\n    d[c] = d.get(c, 0) + 1\nm = min(d.values())\nc = min(x for x in d if d[x] == m)\nprint(c + str(s.count(c)))"},"final":"","flags":"","tree":[],"groups":0,"main":"rx","norx":true,"d":3,"alias":"2508","realAns":"","src2":"","real":"Текстовый файл состоит не более чем из 10⁶ символов и содержит только заглавные буквы латинского алфавита (ABC…Z). Текст разбит на строки различной длины. Необходимо найти строку, содержащую наибольшее количество букв Q (если таких строк несколько, надо взять ту, которая в файле встретилась позже). Определите, какая буква встречается в этой строке реже всего (но присутствует!). Если таких букв несколько, надо взять ту, которая стоит раньше в алфавите. Запишите в ответе эту букву, а затем – сколько раз она встречается во всем файле.\nПример. Исходный файл:\nZZQAQB\nQAVQAB\nBAQTUB\nВ этом примере в первой и второй строках по две букву Q, в третьей – одна. Берём вторую строку, т.к. она стоит в файле позже. В этой строке реже других встречаются буквы V и B (по одному разу), выбираем букву B, т. к. она раньше стоит в алфавите. В ответе для этого примера надо записать B4, так как во всех строках файла буква B встречается 4 раза.","src":"","lvl":"Сложный","file":"https://kompege.ru/files/rWKOZMZph.txt"},{"id":"2507","blk":"RC","role":"hw","like":"2506","star":false,"title":"","idea":"","note":"","tr":"","ask":"","s":"DCQQQ\nBBCQABCC\nBBBCDC\nABECFFQD\nQCQQBFB","ans":"Q8","tpl":"from re import *\ns = 'DCQQQ\\nBBCQABCC\\nBBBCDC\\nABECFFQD\\nQCQQBFB'\nprint(len(s), set(s), s[:200])\nl = s.split('\\n')\nruns = [max(len(m.group()) for m in finditer(r'(.)\\1*', x)) for x in l]\nline = l[runs.index(max(runs))]            # самая ранняя\nm = max(line.count(c) for c in set(line))\nc = ⟦min(c for c in set(line) if line.count(c) == m)⟧\nprint(line)\nprint(c + str(s.count(c)))","methods":{"rx":"from re import *\ns = 'DCQQQ\\nBBCQABCC\\nBBBCDC\\nABECFFQD\\nQCQQBFB'\nprint(len(s), set(s), s[:200])\nl = s.split('\\n')\nruns = [max(len(m.group()) for m in finditer(r'(.)\\1*', x)) for x in l]\nline = l[runs.index(max(runs))]            # самая ранняя\nm = max(line.count(c) for c in set(line))\nc = min(c for c in set(line) if line.count(c) == m)\nprint(line)\nprint(c + str(s.count(c)))","loops":"s = 'DCQQQ\\nBBCQABCC\\nBBBCDC\\nABECFFQD\\nQCQQBFB'\nprint(len(s), set(s), s[:200])\nl = s.split('\\n')\ndef run(x):\n    b, k = 1, 1\n    for i in range(1, len(x)):\n        k = k + 1 if x[i] == x[i-1] else 1\n        b = max(b, k)\n    return b\nbest = l[0]\nfor line in l:\n    if run(line) > run(best):\n        best = line\nd = {}\nfor c in best:\n    d[c] = d.get(c, 0) + 1\nm = max(d.values())\nc = min(x for x in d if d[x] == m)\nprint(c + str(s.count(c)))"},"final":"","flags":"","tree":[],"groups":0,"main":"rx","norx":true,"d":3,"alias":"","realAns":"","src2":"","real":"Текстовый файл состоит не более чем из 10⁶ символов и содержит только заглавные буквы латинского алфавита (ABC…Z). Текст разбит на строки различной длины. Необходимо найти строку, содержащую самую длинную цепочку стоящих подряд одинаковых букв. Если таких строк несколько, надо взять ту, которая в файле встретилась раньше. Определите, какая буква встречается в этой строке чаще всего. Если таких букв несколько, надо взять ту, которая стоит раньше в алфавите. Запишите в ответе эту букву, а затем – сколько раз она встречается во всем файле.\nПример. Исходный файл:\nZZQABA\nZALAAC\nQRAQUT\nВ этом примере в первой и второй строках наибольшая длина цепочек одинаковых буквы равна 2 (ZZ в первой строке, AA во второй), в третьей – 1. Берём первую строку, т.к. она находится в файле раньше. В этой строке чаще других встречаются буквы Z и A (по 2 раза), выбираем букву A, т. к. она стоит раньше в алфавите. В ответе для этого примера надо записать A6, так как во всех строках файла буква A встречается 6 раз.","src":"","lvl":"Сложный","file":"https://kompege.ru/files/beXmcewXJ.txt"},{"id":"1255","blk":"RC","role":"hw","like":"2506","star":false,"title":"","idea":"","note":"","tr":"","ask":"","s":"BBCEABFFFE\nBEQQBBBC\nQAQABBCFCC\nAAAE\nEFFFBBEB","ans":"6","tpl":"s = 'BBCEABFFFE\\nBEQQBBBC\\nQAQABBCFCC\\nAAAE\\nEFFFBBEB'\nprint(len(s), set(s), s[:200])\nl = s.split('\\n')\ndl = 0\nfor x in l:\n    if x.count('A') < 25:\n        for c in set(x):\n            dl = max(dl, ⟦x.rfind(c) - x.find(c)⟧)\nprint(dl)","methods":{"rx":"s = 'BBCEABFFFE\\nBEQQBBBC\\nQAQABBCFCC\\nAAAE\\nEFFFBBEB'\nprint(len(s), set(s), s[:200])\nl = s.split('\\n')\ndl = 0\nfor x in l:\n    if x.count('A') < 25:\n        for c in set(x):\n            dl = max(dl, x.rfind(c) - x.find(c))\nprint(dl)","loops":"s = 'BBCEABFFFE\\nBEQQBBBC\\nQAQABBCFCC\\nAAAE\\nEFFFBBEB'\nprint(len(s), set(s), s[:200])\ndl = 0\nfor x in s.split('\\n'):\n    if x.count('A') < 25:\n        for i in range(len(x)):\n            for j in range(i + 1, len(x)):\n                if x[i] == x[j]:\n                    dl = max(dl, j - i)\nprint(dl)"},"final":"","flags":"","tree":[],"groups":0,"main":"rx","norx":true,"d":2,"alias":"","realAns":"","src2":"","real":"Текстовый файл содержит строки различной длины. Общий объём файла не превышает 1 Мбайт. \nСтроки содержат только заглавные буквы латинского алфавита (ABC…Z).\nВ строках, содержащих менее 25 букв A, нужно определить и вывести максимальное расстояние между одинаковыми буквами в одной строке.\n\nПример. Исходный файл:\nGIGA\nGABLAB\nNOTEBOOK\nAGAAA\nВ этом примере во всех строках меньше 25 букв A. Самое большое расстояние между одинаковыми буквами – в третьей строке между буквами O, расположенными в строке на 2-й и 7-й позициях. В ответе для данного примера нужно вывести число 5.","src":"Статград 26.04.2021","lvl":"Сложный","file":"https://kompege.ru/files/v03s1T3pa.txt"},{"id":"1064","blk":"RC","role":"hw","like":"2506","star":false,"title":"","idea":"","note":"","tr":"","ask":"","s":"AAAEAD\nQQBCAFBBC\nAAAAAQD\nBBFC\nBCQQDFDDFA","ans":"ABQ","tpl":"from re import *\ns = 'AAAEAD\\nQQBCAFBBC\\nAAAAAQD\\nBBFC\\nBCQQDFDDFA'\nprint(len(s), set(s), s[:200])\nl = s.split('\\n')\nd = {}\nfor x in l:\n    r = [m.group() for m in finditer(r'(.)\\1*', x)]\n    k = max(len(y) for y in r)\n    for c in set(y[0] for y in r if len(y) == k):\n        d[c] = d.get(c, 0) + 1\nm = max(d.values())\nprint(⟦''.join(sorted(c for c in d if d[c] == m))⟧)","methods":{"rx":"from re import *\ns = 'AAAEAD\\nQQBCAFBBC\\nAAAAAQD\\nBBFC\\nBCQQDFDDFA'\nprint(len(s), set(s), s[:200])\nl = s.split('\\n')\nd = {}\nfor x in l:\n    r = [m.group() for m in finditer(r'(.)\\1*', x)]\n    k = max(len(y) for y in r)\n    for c in set(y[0] for y in r if len(y) == k):\n        d[c] = d.get(c, 0) + 1\nm = max(d.values())\nprint(''.join(sorted(c for c in d if d[c] == m)))","loops":"s = 'AAAEAD\\nQQBCAFBBC\\nAAAAAQD\\nBBFC\\nBCQQDFDDFA'\nprint(len(s), set(s), s[:200])\nd = {}\nfor x in s.split('\\n'):\n    runs = {}\n    i = 0\n    while i < len(x):\n        j = i\n        while j < len(x) and x[j] == x[i]:\n            j += 1\n        runs[x[i]] = max(runs.get(x[i], 0), j - i)\n        i = j\n    k = max(runs.values())\n    for c in runs:\n        if runs[c] == k:\n            d[c] = d.get(c, 0) + 1\nm = max(d.values())\nprint(''.join(sorted(c for c in d if d[c] == m)))"},"final":"","flags":"","tree":[],"groups":0,"main":"rx","norx":true,"d":3,"alias":"","realAns":"","src2":"","real":"Текстовый файл состоит из множества строк, каждая из которых может содержать буквы из набора A, B, C, D, E, F. \n\n1) Для каждой строки необходимо найти максимальную длину подстроки, состоящей из одинаковых символов.\n2) Для всего файла необходимо определить, какая буква чаще всего образует подстроки максимальной длины, найденные в предыдущем пункте.\n\nЕсли в строке несколько подстрок из различных букв, то считается, что каждая из этих букв составляет подстроку максимальной длины. Например, в строке AABBBBBDDCCCCCE, будет две буквы, составляющих подстроки максимальной длины – B и C.\n\nВ качестве ответа необходимо вывести буквы, которые чаще всего составляют подцепочки максимальной длины","src":"Джобс 15.03.2021","lvl":"Сложный","file":"https://kompege.ru/files/YnfHLM97h.txt"},{"id":"27069","blk":"RS","role":"hw","like":"21161","star":true,"title":"","idea":"","note":"В ответе — количество СЛОВ, а не символов.","tr":"","ask":"","s":"baAb ba Ba.b.a  AaBB. Aaa .Ab. bAA.Aa  b.b..ba..a","ans":"3","tpl":"from re import *\ns = 'baAb ba Ba.b.a  AaBB. Aaa .Ab. bAA.Aa  b.b..ba..a'\nprint(len(s), set(s), s[:200])\npattern = r'⟦[A-Z][a-z]*(?: [A-Za-z][a-z]*)*\\.⟧'\nl = findall(pattern, s)\nmaxs = max(l, key=len)\nprint(maxs, l)\nprint(⟦len(maxs.split(' '))⟧)","methods":{"rx":"from re import *\ns = 'baAb ba Ba.b.a  AaBB. Aaa .Ab. bAA.Aa  b.b..ba..a'\nprint(len(s), set(s), s[:200])\npattern = r'[A-Z][a-z]*(?: [A-Za-z][a-z]*)*\\.'\nl = findall(pattern, s)\nmaxs = max(l, key=len)\nprint(maxs, l)\nprint(len(maxs.split(' ')))","loops":"s = 'baAb ba Ba.b.a  AaBB. Aaa .Ab. bAA.Aa  b.b..ba..a'\nprint(len(s), set(s), s[:200])\nbest = ''\nfor i in range(len(s)):\n    for j in range(i + 2, len(s) + 1):\n        ss = s[i:j]\n        if ss[0].isupper() and ss[-1] == '.' and ss.count('.') == 1 and ss[-2] != ' ' and '  ' not in ss:\n            w = ss[:-1].split(' ')\n            if all(x != '' and x[0].isalpha() and x[1:].islower() if len(x) > 1 else x != '' and x.isalpha() for x in w):\n                if len(ss) > len(best):\n                    best = ss\nprint(len(best.split(' ')))"},"final":"[A-Z][a-z]*(?: [A-Za-z][a-z]*)*\\.","flags":"","tree":[{"t":"[A-Z]","d":"один символ: от «A» до «Z»"},{"t":"[a-z]*","d":"повторить ноль или больше раз — жадно (как можно больше):","c":[{"t":"[a-z]","d":"один символ: от «a» до «z»"}]},{"t":"(?: [A-Za-z][a-z]*)*","d":"повторить ноль или больше раз — жадно (как можно больше):","c":[{"t":" ","d":"символ пробел"},{"t":"[A-Za-z]","d":"один символ из набора: от «A» до «Z», от «a» до «z»"},{"t":"[a-z]*","d":"повторить ноль или больше раз — жадно (как можно больше):","c":[{"t":"[a-z]","d":"один символ: от «a» до «z»"}]}]},{"t":"\\.","d":"символ «.»"}],"groups":0,"main":"rx","norx":false,"d":3,"alias":"","realAns":"","src2":"","real":"(Д. Караулов) Текстовый файл состоит не более чем из 10⁶ символов и содержит латинские буквы (прописные и строчные), точки и пробелы. Определите максимальное количество символов в непрерывной последовательности, которая является корректно записанным предложением. Считаем, что в корректно записанном предложении выполнены все следующие условия:\n– предложение начинается с заглавной буквы;\n– предложение оканчивается точкой, которая в предложении единственная и перед которой нет пробела;\n– слова в предложении состоят из произвольных комбинаций букв, возможно не имеют семантического смысла, но при этом только первая буква слова может быть заглавной;\n– слова в предложении разделены пробелами, два пробела стоять рядом в предложении не могут.\nВ ответе укажите количество слов в этом предложении.","src":"","lvl":"Средний","file":"https://kompege.ru/files/DgACIgjCbXm.txt"},{"id":"19969","blk":"RS","role":"hw","like":"21161","star":false,"title":"","idea":"","note":"Точку экранируем: \\. — иначе это «любой символ». Нужен поиск с каждой позиции: в «a.bba@ab.bb» обычный findall съест «bba» в предыдущем совпадении.","tr":"","ask":"","s":"ab@ba.abbaa@bba@ab.bb@aa@@b@.@@..bab@@a.@.bab@a","ans":"11","tpl":"from re import *\ns = 'ab@ba.abbaa@bba@ab.bb@aa@@b@.@@..bab@@a.@.bab@a'\nprint(len(s), set(s), s[:200])\npattern = r'⟦[a-z]+@[a-z]+\\.[a-z]+⟧'\npattern = f'(?=({pattern}))'\nl = findall(pattern, s)\nmaxs = max(l, key=len)\nprint(maxs, l)\nprint(len(maxs))","methods":{"rx":"from re import *\ns = 'ab@ba.abbaa@bba@ab.bb@aa@@b@.@@..bab@@a.@.bab@a'\nprint(len(s), set(s), s[:200])\npattern = r'[a-z]+@[a-z]+\\.[a-z]+'\npattern = f'(?=({pattern}))'\nl = findall(pattern, s)\nmaxs = max(l, key=len)\nprint(maxs, l)\nprint(len(maxs))","loops":"s = 'ab@ba.abbaa@bba@ab.bb@aa@@b@.@@..bab@@a.@.bab@a'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    p = ss.split('@')\n    if len(p) != 2:\n        return False\n    q = p[1].split('.')\n    return p[0].isalpha() and len(q) == 2 and q[0].isalpha() and q[1].isalpha()\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) > dl:\n            dl = len(ss)\nprint(dl)"},"final":"(?=([a-z]+@[a-z]+\\.[a-z]+))","flags":"","tree":[{"t":"(?=([a-z]+@[a-z]+\\.[a-z]+))","d":"просмотр вперёд: дальше ДОЛЖНО идти следующее (символы не забираются, позиция не сдвигается):","c":[{"t":"([a-z]+@[a-z]+\\.[a-z]+)","g":1,"d":"ГРУППА №1 — запоминает совпавший кусок: его вернёт findall, m.group(1), на него ссылается \\1","c":[{"t":"[a-z]+","d":"повторить один или больше раз — жадно (как можно больше):","c":[{"t":"[a-z]","d":"один символ: от «a» до «z»"}]},{"t":"@","d":"символ «@»"},{"t":"[a-z]+","d":"повторить один или больше раз — жадно (как можно больше):","c":[{"t":"[a-z]","d":"один символ: от «a» до «z»"}]},{"t":"\\.","d":"символ «.»"},{"t":"[a-z]+","d":"повторить один или больше раз — жадно (как можно больше):","c":[{"t":"[a-z]","d":"один символ: от «a» до «z»"}]}]}]}],"groups":1,"main":"rx","norx":false,"d":2,"alias":"","realAns":"230","src2":"","real":"Текстовый файл состоит не более чем из 10⁶ символов и содержит только строчные латинские буквы, а также знаки «@» и «.» . Определите максимальное количество символов в непрерывной последовательности вида [буквы]@[буквы].[буквы] (например yasdamege@nasto.ballov). В ответе укажите количество символов.","src":"","lvl":"Сложный","file":"https://kompege.ru/files/VvjdVL1gC.txt"},{"id":"28005","blk":"RS","role":"hw","like":"21161","star":false,"title":"","idea":"","note":"Имя: буквы, цифры, точки, но точки не подряд и не рядом с @. Сервер — одно из двух слов целиком.","tr":"","ask":"","s":"1bbaa1.@@ab1@b@.1@baa@11ab@gmail.comru..1@1@.ab.a.","ans":"14","tpl":"from re import *\ns = '1bbaa1.@@ab1@b@.1@baa@11ab@gmail.comru..1@1@.ab.a.'\nprint(len(s), set(s), s[:200])\npattern = r'⟦[A-Za-z0-9](?:[A-Za-z0-9]|\\.(?!\\.))*(?<!\\.)@(?:yandex\\.ru|gmail\\.com)⟧'\npattern = f'(?=({pattern}))'\nl = findall(pattern, s)\nmaxs = max(l, key=len)\nprint(maxs, l)\nprint(len(maxs))","methods":{"rx":"from re import *\ns = '1bbaa1.@@ab1@b@.1@baa@11ab@gmail.comru..1@1@.ab.a.'\nprint(len(s), set(s), s[:200])\npattern = r'[A-Za-z0-9](?:[A-Za-z0-9]|\\.(?!\\.))*(?<!\\.)@(?:yandex\\.ru|gmail\\.com)'\npattern = f'(?=({pattern}))'\nl = findall(pattern, s)\nmaxs = max(l, key=len)\nprint(maxs, l)\nprint(len(maxs))","loops":"s = '1bbaa1.@@ab1@b@.1@baa@11ab@gmail.comru..1@1@.ab.a.'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    p = ss.split('@')\n    if len(p) != 2 or p[1] not in ('yandex.ru', 'gmail.com') or not p[0]:\n        return False\n    a = p[0]\n    return all(c.isalnum() or c == '.' for c in a) and a[0] Ans":"","src2":"","real":"(И. Карпачев) Текстовый файл состоит не более чем из 10⁶ символов и содержит только десятичные цифры, заглавные и строчные буквы латинского алфавита, а также символы «@» и «.» (точка). Определите максимальное количество символов в непрерывной последовательности, которая является корректным почтовым адресом. Корректным почтовым адресом назовем адрес, в котором сначала указывается имя почтового ящика, затем следует символ «@», далее – сервер, на котором находится почтовый ящик. В данной задаче будем считать, что:\n– в имени почтового ящика используются только символ «.» (точка), десятичные цифры и буквы латинского алфавита;\n– серверу могут соответствовать только строки вида: «yandex.ru» или «gmail.com»;\n– два символа «@» и «.» не могут следовать подряд друг за другом.\nВ ответе укажите количество символов. Например, для строки alex@@s..ch@Gmail.coM.rUnet@yandex.rubo@yandex.ru ответом будет число 25 – длина выделенной части, которая является правильным адресом.","src":"","lvl":"Средний","file":"https://kompege.ru/files/roH0Kzb2bPK.txt"},{"id":"18597","blk":"RS","role":"hw","like":"21161","star":false,"title":"","idea":"","note":"Целая часть — ровно 4 цифры без ведущего нуля: [1-9]\\d{3}.","tr":"","ask":"","s":"&601234.56&2345.09.108.240123.4&1111.12.85&&&&8.","ans":"15","tpl":"from re import *\ns = '&601234.56&2345.09.108.240123.4&1111.12.85&&&&8.'\nprint(len(s), set(s), s[:200])\npattern = r'⟦[1-9]\\d{3}\\.\\d+&[1-9]\\d{3}\\.\\d+⟧'\npattern = f'(?=({pattern}))'\nl = findall(pattern, s)\nmaxs = max(l, key=len)\nprint(maxs, l)\nprint(len(maxs))","methods":{"rx":"from re import *\ns = '&601234.56&2345.09.108.240123.4&1111.12.85&&&&8.'\nprint(len(s), set(s), s[:200])\npattern = r'[1-9]\\d{3}\\.\\d+&[1-9]\\d{3}\\.\\d+'\npattern = f'(?=({pattern}))'\nl = findall(pattern, s)\nmaxs = max(l, key=len)\nprint(maxs, l)\nprint(len(maxs))","loops":"s = '&601234.56&2345.09.108.240123.4&1111.12.85&&&&8.'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    p const BTH = {
 R1: [['from re import *', 'подключает функции регулярных выражений: findall, finditer, search, fullmatch, split, sub'],

function hlText(text, spans) {
  const cls = Array(text.length).fill(-1);
  spans.forEach((sp, k) => { for (let i = sp[0]; i < sp[1]; i++) cls[i] = k; });
  let h = '', i = 0;
  while (i < text.length) {
    let j = i; while (j < text.length && cls[j] === cls[i]) j++;
    const piece = esc(text.slice(i, j)).replace(/\n/g, '<span class="nl">↵</span>\n');
    h += cls[i] >= 0 ? `<mark class="m${cls[i] % 2}">${piece}</mark>` : piece; i = j;
  }
  return h;
}
function exCard(e) {

}

/* ===== Пояснения к строкам кода ===== */
function lineNotes(code, t) {
  const ng = t ? t.groups : 0;
  return code.split('\n').map(line => {
    const L = line.trim(); let d = '';
    if (/^from re import \*/.test(L)) d = 'подключаем все функции модуля re: findall, finditer, search, fullmatch, split, sub';
    else if (/^s = '/.test(L)) d = /\\n/.test(L) ? 'учебный текст из нескольких строк (\\n — перевод строки). На экзамене: s = open(\'24.txt\').read()' : 'учебная строка. На экзамене: s = open(\'24.txt\').readline().strip()';
    else if (/^print\(len\(s\), set\(s\)/.test(L)) d = 'проверка: длина строки, какие символы в ней есть, начало строки';
    else if (/^num = r'/.test(L)) d = 'кусок шаблона «одно число» — подставим его в выражение через f-строку';
    else if (/^pattern = rf'/.test(L)) d = 'f-строка: вместо {num} Python подставит шаблон числа';
    else if (/^pattern = r'/.test(L)) d = 'сама регулярка. r перед кавычкой — «сырая» строка: \\d, \\1 остаются как есть';
    else if (/^pattern = f'\(\?=\(\{pattern\}\)\)'/.test(L)) d = 'обёртка: просмотр вперёд — поиск с КАЖДОЙ позиции (с перекрытиями). Весь кусок попадает в группу 1, группы внутри шаблона сдвигаются: начинаются с 2';
    else if (/^l = findall\(pattern, s, M\)/.test(L)) d = 'findall с флагом M: ^ и $ — начало и конец каждой строки; одно совпадение — одна строка';
    else if (/^l = findall\(pattern, s\)/.test(L)) d = ng === 0 ? 'findall — список всех найденных кусков (без перекрытий: поиск продолжается с конца найденного)' : ng === 1 ? 'в шаблоне одна группа — findall вернёт список её содержимого' : 'в шаблоне ' + ng + ' групп(ы) — findall вернёт список кортежей (группа1, группа2, …)';
    else if (/^l = \[c\[0\] for c in l\]/.test(L)) d = 'из каждого кортежа берём c[0] — группу 1, то есть весь найденный кусок';
    else if (/^l = \[m\.group\(\) for m in finditer/.test(L)) d = 'finditer выдаёт объекты-совпадения; m.group() — весь найденный кусок, даже если в шаблоне есть группы';
    else if (/^maxs = max\(l, key=len\)/.test(L)) d = 'самый длинный элемент списка (key=len — сравниваем по длине, а не по алфавиту)';
    else if (/^mins = min\(l, key=len\)/.test(L)) d = 'самый короткий элемент списка';
    else if (/^print\(len\(maxs\) \/\/ (\d)\)/.test(L)) d = 'длина куска, делённая на ' + /\/\/ (\d)/.exec(L)[1] + ' — количество блоков; это ответ';
    else if (/^print\(len\((maxs|mins)\)\)/.test(L)) d = 'длина найденного куска — ответ';
    else if (/^print\(len\(l\)\)/.test(L)) d = 'сколько найдено — длина списка; это ответ';
    else if (/^print\((maxs|mins), l\)/.test(L)) d = 'проверка глазами: сам кусок и весь список найденного';
    else if (/^print\(l\)/.test(L)) d = 'весь список найденного — для проверки';
    else if (/^l = \[c\[1\] for c in l\]/.test(L)) d = 'из каждого кортежа берём c[1] — группу 2 (букву в середине)';
    else if (/^l = \[\(l\.count\(c\), c\)/.test(L)) d = 'для каждой буквы — пара (сколько раз встретилась, буква)';
    else if (/^k, c = max\(l\)/.test(L)) d = 'самая частая буква: max сравнивает пары сначала по количеству';
    else if (/eval\(ss, \{"__builtins__": \{\}\}\)/.test(L)) d = 'fullmatch пропускает только цифры и знаки, а eval без встроенных функций ({"__builtins__": {}}) не может вызвать ничего постороннего — считаем значение выражения безопасно';
    else if (/^def calc\(/.test(L)) d = 'своя функция вместо eval: делим по + на слагаемые, каждое по * на множители — так соблюдается приоритет умножения';
    else if (/^p = \[-1\] \+ p \+/.test(L)) d = '«пустые» соседи за краями строки: тогда начало и конец строки работают как обычная середина — одна формула без if';
    else if (/^l = s\.split\(w\)/.test(L)) d = 'режем строку по слову: между соседними кусками стоит ровно одно слово';
    else if (/^for (part|x) in /.test(L) && /split/.test(L)) d = 'перебираем куски после разрезания';
    else if (/#/.test(L)) d = L.slice(L.indexOf('#') + 1).trim();
    return {line, d};
  });
}

const RXE_SRC = "\n# Разбор регулярного выражения Python на части с русскими пояснениями.\n# Работает и в обычном Python, и в Pyodide (используется отладчиком).\nimport re\ntry:\n    import re._parser as _P\n    import re._constants as _C\nexcept ImportError:  # старые версии Python\n    import sre_parse as _P\n    import sre_constants as _C\n\n_MAXR = _C.MAXREPEAT\n_CAT = {\n    'CATEGORY_DIGIT': (r'\\d', 'любая цифра 0–9'),\n    'CATEGORY_NOT_DIGIT': (r'\\D', 'любой символ, кроме цифры'),\n    'CATEGORY_SPACE': (r'\\s', 'пробельный символ (пробел, табуляция, перевод строки)'),\n    'CATEGORY_NOT_SPACE': (r'\\S', 'любой непробельный символ'),\n    'CATEGORY_WORD': (r'\\w', 'буква, цифра или _'),\n    'CATEGORY_NOT_WORD': (r'\\W', 'любой символ, кроме буквы, цифры и _'),\n}\n_AT = {\n    'AT_BEGINNING': ('^', 'начало строки (с флагом M — начало каждой строки текста)'),\n    'AT_BEGINNING_STRING': (r'\\A', 'самое начало текста'),\n    'AT_END': ('$', 'конец строки (с флагом M — конец каждой строки текста)'),\n    'AT_END_STRING': (r'\\Z', 'самый конец текста'),\n    'AT_BOUNDARY': (r'\\b', 'граница слова'),\n    'AT_NON_BOUNDARY': (r'\\B', 'не граница слова'),\n}\n_SPECIAL = set('.^$*+?{}[]\\\\|()')\n\n\ndef _ch(c, in_class=False):\n    ch = chr(c)\n    if ch == '\\n':\n        return r'\\n'\n    if ch == '\\t':\n        return r'\\t'\n    if in_class:\n        return '\\\\' + ch if ch in '\\\\]^-' else ch\n    return '\\\\' + ch if ch in _SPECIAL else ch\n\n\ndef _show(c):\n    ch = chr(c)\n    return {'\\n': 'перевод строки', ' ': 'пробел', '\\t': 'табуляция'}.get(ch, '«' + ch + '»')\n\n\ndef _name(op):\n    return str(op).split('.')[-1]\n\n\ndef _unparse_class(av):\n    neg = ''\n    out = ''\n    for op, a in av:\n        n = _name(op)\n        if n == 'NEGATE':\n            neg = '^'\n        elif n == 'LITERAL':\n            out += _ch(a, True)\n        elif n == 'RANGE':\n            out += _ch(a[0], True) + '-' + _ch(a[1], True)\n        elif n == 'CATEGORY':\n            out += _CAT.get(_name(a), ('?', ''))[0]\n        else:\n            out += '?'\n    return '[' + neg + out + ']'\n\n\ndef _qtext(lo, hi, lazy='', poss=''):\n    if lo == 0 and hi == _MAXR:\n        q = '*'\n    elif lo == 1 and hi == _MAXR:\n        q = '+'\n    elif lo == 0 and hi == 1:\n        q = '?'\n    elif lo == hi:\n        q = '{%d}' % lo\n    elif hi == _MAXR:\n        q = '{%d,}' % lo\n    else:\n        q = '{%d,%d}' % (lo, hi)\n    return q + lazy + poss\n\n\ndef _atomic(sub):\n    # нужно ли брать в скобки перед квантификатором\n    if len(sub) != 1:\n        return False\n    n = _name(sub[0][0])\n    return n in ('LITERAL', 'NOT_LITERAL', 'ANY', 'IN', 'SUBPATTERN', 'GROUPREF', 'CATEGORY')\n\n\ndef unparse(sub, top=True):\n    items = list(sub)\n    out = ''\n    for op, av in items:\n        t = _unparse_item(op, av)\n        if _name(op) == 'BRANCH' and (len(items) > 1 or not top):\n            t = '(?:' + t + ')'\n        out += t\n    return out\n\n\ndef _unparse_item(op, av):\n    n = _name(op)\n    if n == 'LITERAL':\n        return _ch(av)\n    if n == 'NOT_LITERAL':\n        return '[^' + _ch(av, True) + ']'\n    if n == 'ANY':\n        return '.'\n    if n == 'IN':\n        if len(av) == 1 and _name(av[0][0]) == 'CATEGORY':\n            return _CAT.get(_name(av[0][1]), ('?', ''))[0]\n        return _unparse_class(av)\n    if n in ('MAX_REPEAT', 'MIN_REPEAT', 'POSSESSIVE_REPEAT'):\n        lo, hi, sub = av\n        inner = unparse(sub, False)\n        if len(list(sub)) == 1 and _name(list(sub)[0][0]) == 'BRANCH':\n            pass\n        elif not _atomic(sub):\n            inner = '(?:' + inner + ')'\n        return inner + _qtext(lo, hi, '?' if n == 'MIN_REPEAT' else '', '+' if n == 'POSSESSIVE_REPEAT' else '')\n    if n == 'SUBPATTERN':\n        gid, addf, delf, sub = av\n        return ('(' if gid else '(?:') + unparse(sub) + ')'\n    if n == 'BRANCH':\n        return '|'.join(unparse(b, False) for b in av[1])\n    if n ==   if (r.approx && DBG.tab !== 'st') { el.innerHTML = '<p class="vhint">⏳ Разбор и функции появятся, как только загрузится Python (около 10 секунд, нужен интернет).</p>'; return; }

  if (DBG.tab === 'fn') {

    const fx = ng === 0 ? 'Список найденных кусков. Сколько: len(l). Самый длинный: max(l, key=len).' : ng === 1 ? 'В шаблоне группа — вернулось её содержимое. Весь кусок: [m.group() for m in finditer(pattern, s)]' + (DBG.wrap ? ' (при обёртке группа 1 и есть весь кусок).' : '.') : 'Кортежи групп: l = [c[0] for c in l] — первая группа' + (DBG.wrap ? ' (весь кусок при обёртке)' : '') + ', c[1] — вторая…';
    const card = (call, res, d, extra) => `<div class="fcard"><code class="fcall">${esc(call)}</code><pre class="fres">${esc(res)}</pre><div class="fd">${d}</div>${extra || ''}</div>`;
    let h = card('l = findall(pattern, s' + (DBG.flags.includes('M') ? ', M' : '') + ')', r.findall, esc(fx) + ` <b>len(l) = ${r.nfind}</b>`);
    h += card('for m in finditer(pattern, s):', ms.length + ' объектов-совпадений', 'Каждое m: m.group() — весь кусок, m.group(1) — группа 1, m.start(), m.end() — границы, m.span() — пара (начало, конец).',
      ms.length ? `<table class="st dt"><tr><th>m.group()</th><th>m.start()</th><th>m.end()</th>${Array.from({length: ng}, (_, i) => `<th>m.group(${i + 1})</th>`).join('')}</tr>${ms.slice(0, 25).map(m => `<tr><td class="mono">${esc(s.slice(m.s, m.e)) || '«»'}</td><td>${m.s}</td><td>${m.e}</td>${m.g.map(g => `<td class="mono">${g ? esc(s.slice(g[0], g[1])) || '«»' : 'None'}</td>`).join('')}</tr>`).join('')}</table>${ms.length > 25 ? '<div class="vhint">…показаны первые 25</div>' : ''}` : '');
    h += card('m = search(pattern, s)', r.search, 'ПЕРВОЕ совпадение в любом месте строки (или None). Дальше: m.group(), m.start(). Удобно, чтобы проверить «есть ли вообще».');
    h += card('m = match(pattern, s)', r.match, 'Совпадение только с САМОГО НАЧАЛА строки (или None).');

    h += card('split(pattern, s)', r.split, 'Куски МЕЖДУ совпадениями. Если в шаблоне есть группы, их содержимое тоже попадёт в список.');
    h += card(`sub(pattern, '${DBG.repl}', s)`, r.sub, 'Заменяет все совпадения. Заменять на: <input class="inp" id="dRepl" style="width:90px;padding:3px 6px" value="' + esc(DBG.repl) + '">. В замене \\1 — содержимое группы 1.');
    el.innerHTML = h;

  }
  if (DBG.tab === 'st') {
    const ms = r.ms || [];
    let h = `<p class="vhint">Так работают findall и finditer: ищут первое совпадение начиная с позиции, а следующий поиск начинают с КОНЦА найденного. ${DBG.wrap ? 'С обёрткой (?=( … )) совпадение пустое — поэтому следующий поиск начинается с соседней позиции.' : 'Поэтому без обёртки куски не налезают друг на друга.'}</p><ol class="steps2">`;
    ms.slice(0, 120).forEach((m, k) => { const v = visSpan(m);
      h += `<li data-k="${k}" class="${k === DBG.focus ? 'on' : ''}">ищем с позиции <b>${m.from}</b> → ${v ? `нашли <code>${esc(s.slice(v[0], v[1]))}</code> в [${v[0]}:${v[1]})` : `пустое совпадение в позиции ${m.s}`}${m.e > m.s ? ` → дальше с ${m.e}` : ` → дальше с ${m.s + 1}`}</li>`; });
    h += `</ol>${ms.length ? '' : '<p class="vhint">Совпадений нет.</p>'}<p class="vhint">Нажми на шаг — он подсветится в строке слева.</p>`;
    el.innerHTML = h;
    el.querySelectorAll('li[data-k]').forEach(li => li.onclick = () => { DBG.focus = +li.dataset.k; dbgDraw(); });
  }
}

 ['Наборы', [['[ABC]', 'один из A, B, C'], ['[^ABC]', 'любой, кроме A, B, C'], ['[A-F]', 'от A до F'], ['[0-9]', 'цифра'], ['[02468]', 'чётная цифра'], ['[AEIOUY]', 'гласная']]],
 ['Повторы', [['+', '1 и больше'], ['*', '0 и больше'], ['?', '0 или 1'], ['{3}', 'ровно 3'], ['{2,5}', 'от 2 до 5'], ['{0,K}', 'не более K'], ['+?', 'лениво: как можно меньше']]],
 ['Скобки', [['(?:AB)+', 'повторить блок, не запоминая'], ['A|B', 'ИЛИ'], ['(.)', 'группа: запомнить'], ['\\1', 'тот же текст, что в группе 1'], ['(?P<c>.)', 'именованная группа'], ['(?P=c)', 'ссылка на неё']]],

 ['Якоря', [['^', 'начало строки'], ['$', 'конец строки'], ['\\b', 'граница слова']]],
];
function cheatHTML(ins) {

   `<div class="chg"><b>Функции</b><table class="bth"><tr><td><code>findall(p, s)</code></td><td>список всех совпадений (или групп)</td></tr><tr><td><code>finditer(p, s)</code></td><td>объекты m: m.group(), m.start(), m.end()</td></tr><tr><td><code>search(p, s)</code></td><td>первое совпадение где угодно или None</td></tr><tr><td><code>fullmatch(p, ss)</code></td><td>подходит ли ss целиком</td></tr><tr><td><code>split(p, s)</code></td><td>куски между совпадениями</td></tr><tr><td><code>sub(p, r, s)</code></td><td>заменить совпадения на r</td></tr><tr><td><code>findall(p, s, M)</code></td><td>флаг M: ^ и $ для каждой строки</td></tr></table></div>`;
}

/* ===== Консоль (как в приложении 5) ===== */
const CON_CHIPS = ["findall('[^D]+', s)", "len(findall('AB', s))", "max(findall('[^D]+', s), key=len)", "[m.span() for m in finditer('AB', s)]", "m = search('(A)(B+)', s)", 'm.group(), m.group(1), m.group(2)', "m.start(), m.end()", "findall('(?=(AB))', s)", "split('D', s)", "sub('D', ' ', s)", "fullmatch('[A-F]+', s)", "findall('(.)\\\\1', s)", "pattern = r'(?:AB|AC)+'", 'findall(pattern, s)', "s.replace('D', ' ').split()"];
let CONLOG = [], CONHIST = [];
function openConsole(preset) {
  const s = stu(); if (s) { s.con = (s.con || 0) + 1; bump(); }
  modal(`<div class="mhead"><h2>🧪 Консоль Python</h2><button class="btn sm" id="cRst" title="Забыть все переменные">♻ Сбросить переменные</button><button class="btn sm" id="cClr">🧹 Очистить экран</button><button class="btn ghost" id="cX">✕</button></div>
   <div class="con"><div class="conlog" id="clog"></div>
    <div class="conside"><b>Переменные на всю сессию</b><textarea id="cvars" spellcheck="false"></textarea><button class="btn sm pri" id="cApply">▶ Применить переменные</button><div style="font-weight:800;margin:10px 0 6px">Попробуй:</div><div class="chips">${CON_CHIPS.map((c, i) => `<button data-ch="${i}">${esc(c)}</button>`).join('')}</div>
    <p style="color:var(--mut);font-size:13px">Enter — выполнить, Shift+Enter — новая строка, ↑ ↓ — история.<br>Уже подключено: <code class="i">from re import *</code>. print писать не нужно — значение покажется само.</p></div></div>`, 'full');
  const log = $('#clog'), varsEditor = $('#cvars'); varsEditor.value = (s && s.consoleVars) || "s = 'ABDCABDEFFDACAB'";
  const execute = async (v, quiet) => { if (!v.trim()) return; if (!quiet) { CONHIST.push(v); CONLOG.push({k: 'cmd', v}); }
    const r = await PY.repl(v, {onStatus: m => { CONLOG.push({k: 'pr', v: m}); draw(); }}); CONLOG = CONLOG.filter(z => !(z.k === 'pr' && /Загружаю/.test(z.v)));
    if (r.out) CONLOG.push({k: 'pr', v: r.out.replace(/\n$/, '')}); if (r.ok && r.val != null) CONLOG.push({k: 'res', v: r.val});
    if (r.ok && !r.out && r.val == null && !quiet) CONLOG.push({k: 'pr', v: '✓ Выполнено.'}); if (!r.ok) { CONLOG.push({k: 'err', v: r.err}); CONLOG.push({k: 'pr', v: '↳ ' + translatePythonError(r.err)}); }
    CON_READY = true; draw(); };
  const draw = () => { if (!$('#clog')) return; log.innerHTML = CONLOG.map(e => e.k === 'cmd' ? `<div class="cmd">${esc(e.v.split('\n').map((l, i) => (i ? '... ' : '>>> ') + l).join('\n'))}</div>` : `<div class="${e.k}">${esc(e.v)}</div>`).join('') + `<div class="conin"><span>&gt;&gt;&gt;</span><textarea id="cin" rows="1" spellcheck="false"></textarea></div>`;
    const ta = $('#cin'); ta.focus(); log.scrollTop = log.scrollHeight; let hp = CONHIST.length;
    const fit = () => { ta.rows = Math.max(1, ta.value.split('\n').length); }; ta.addEventListener('input', fit);
    ta.addEventListener('keydown', async e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); const v = ta.value; if (!v.trim()) return; if (/:\s*$/.test(v.split('\n').slice(-1)[0])) { ta.value = v + '\n    '; fit(); return; } ta.disabled = true; await execute(v); }
      else if (e.key === 'Tab') { e.preventDefault(); document.execCommand('insertText', false, '    '); }
      else if (e.key === 'ArrowUp' && !ta.value.includes('\n')) { e.preventDefault(); if (hp > 0) { hp--; ta.value = CONHIST[hp]; fit(); } }
      else if (e.key === 'ArrowDown' && !ta.value.includes('\n')) { e.preventDefault(); if (hp < CONHIST.length - 1) { hp++; ta.value = CONHIST[hp]; } else { hp = CONHIST.length; ta.value = ''; } fit(); }
    }); return ta; };
  let ta = draw();
  if (preset) { varsEditor.value = preset; }
  $('#cApply').onclick = () => { if (s) s.consoleVars = varsEditor.value; bump(); execute(varsEditor.value); };
  document.querySelectorAll('[data-ch]').forEach(b => b.onclick = () => { const t = $('#cin'); t.value = CON_CHIPS[+b.dataset.ch]; t.focus(); });
  $('#cX').onclick = closeModal; $('#cClr').onclick = () => { CONLOG = []; ta = draw(); };
  $('#cRst').onclick = async () => { CON_READY = false; await PY.repl('None', {reset: true}); CONLOG.push({k: 'pr', v: '♻ Переменные сброшены; применяю стартовые значения'}); await execute(varsEditor.value, true); };
  if (!CON_READY || preset) { if (s) s.consoleVars = varsEditor.value; execute(varsEditor.value, true); }
}

/* ===== Отчёт ===== */
function hintStr(x) { const h = []; if (x.hint >= 1) h.push('подсказка'); if (x.hint >= 2) h.push('разбор'); if (x.hint >= 3) h.push('заполнил поля / готовый код'); if (x.dbg) h.push('отладчик ×' + x.dbg); return h.join(', '); }
function calcReport(name) {
  const s = DB.students[name];
  const ids = ORDER.filter(id => s.tasks[id] && (solved(s.tasks[id]) || s.tasks[id].tries || s.tasks[id].runs) || FL(id).hw);
  const rows = ids.map(id => ({id, t: TK[id], x: normX(Object.assign({}, s.tasks[id] || {})), hw: !!FL(id).hw}));
  const c = counts(s), hw = hwList(), ch = counts(s, hw);
  const byBlk = BLOCKS.map(b => { const all = ORDER.filter(id => TK[id].blk === b.id), cc = counts(s, all); return {b, total: all.length, done: cc.done, self: cc.ok + cc.err, help: cc.hint + cc.fill, wrong: all.reduce((a, id) => a + ((s.tasks[id] || {}).wrong || []).length, 0)}; });
  return {s, c, ch, hwN: hw.length, rows, byBlk, wrongTotal: rows.reduce((a, r) => a + r.x.wrong.length, 0)};
}

   <details open><summary style="cursor:pointer;font-weight:800">Задачи, с которыми работал(а), и ДЗ (${r.rows.length})</summary><table class="st"><tr><th>№</th><th>Итог</th><th>Попыток</th><th>Неверные ответы</th><th>Помощь</th><th>Ответ по файлу</th>${showAns ? '<th>Верный ответ (учебная строка)</th>' : ''}</tr>
   ${r.rows.map(w => `<tr><td class="mono">${esc(w.id)}${w.hw ? ' <sup class="fh">Д</sup>' : ''}</td><td>${ST_LABEL[w.x.st]}</td><td>${w.x.tries}</td><td class="mono">${esc(w.x.wrong.join('; ')) || '—'}</td><td>${esc(hintStr(w.x)) || '—'}</td><td class="mono">${w.x.real ? esc(w.x.real) + (w.x.realOk === true ? ' ✅' : w.x.realOk === false ? ' ❌' : ' ⏳') : '—'}</td>${showAns ? `<td class="mono">${esc(w.t.ans)}</td>` : ''}</tr>`).join('')}</table></details>
   <p class="vhint">Отладчик открывался: ${r.s.dbg || 0} · консоль: ${r.s.con || 0} · песочница: ${r.s.sand || 0} · дни: ${(r.s.days || []).map(d => d.split('-').reverse().slice(0, 2).join('.')).join(', ')}</p>

   <div class="row" style="margin-top:10px"><button class="btn pri" id="rS">📤 Отправить учителю</button><button class="btn" id="rD">📥 Скачать PDF</button></div><div id="rMsg" style="margin-top:12px"></div>`, 'wide');

}
function reportText(name) { const r = calcReport(name); return `Отчёт тренажёра «${APPNAME}». Ученик: ${name}. Решено ${r.c.done} из ${r.c.total}${r.hwN ? ', ДЗ: ' + r.ch.done + ' из ' + r.ch.total : ''}: сам с 1-й попытки — ${r.c.ok}, сам после ошибок — ${r.c.err}, с подсказкой — ${r.c.hint}, после заполнения полей — ${r.c.fill}. Неверных ответов: ${r.wrongTotal}. Время: ${fmtT(r.s.totalMs || 0)}. PDF во вложении.`; }

async function makeReportPDF(name, teacherView, withCode) {
  const mm = document.getElementById('rMsg'); if (mm) mm.innerHTML = '<div class="fb show good">⏳ Формирую PDF…</div>';
  const showAns = !!(DB.teacher.repAns || teacherView);
  const r = calcReport(name), W = 1240, H = 1754, MX = 70, pages = []; let cv, ctx, y;
  const newPage = () => { cv = document.createElement('canvas'); cv.width = W; cv.height = H; ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); pages.push(cv); y = 70; };
  const F = (sz, b, m) => `${b ? 'bold ' : ''}${sz}px ${m ? 'Consolas,"Courier New",monospace' : '"Segoe UI",Roboto,Arial,sans-serif'}`;
  const text = (s, x, yy, sz, col, b, al, m) => { ctx.font = F(sz, b, m); ctx.fillStyle = col || '#1d2640'; ctx.textAlign = al || 'left'; ctx.fillText(s, x, yy); };
  const fit = (s, w, sz, m) => { ctx.font = F(sz, 0, m); s = String(s); if (ctx.measureText(s).width <= w) return s; while (s.length > 2 && ctx.measureText(s + '…').width > w) s = s.slice(0, -1); return s + '…'; };
  const rr = (x, yy, w, h, rad, fill) => { ctx.beginPath(); ctx.moveTo(x + rad, yy); ctx.arcTo(x + w, yy, x + w, yy + h, rad); ctx.arcTo(x + w, yy + h, x, yy + h, rad); ctx.arcTo(x, yy + h, x, yy, rad); ctx.arcTo(x, yy, x + w, yy, rad); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); };
  newPage();
  const g = ctx.createLinearGradient(0, 0, W, 0); g.addColorStop(0, '#4f6bff'); g.addColorStop(1, '#7b5cff'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, 190);
  text('Отчёт ученика', MX, 82, 48, '#fff', 1); text('ЕГЭ 24 · Регулярные выражения', MX, 130, 26, '#e8ebff'); text(new Date().toLocaleString('ru-RU'), W - MX, 82, 24, '#e8ebff', 0, 'right');
  y = 250; text('Ученик: ' + name, MX, y, 36, '#1d2640', 1); y += 46;
  text(`Дни занятий: ${(r.s.days || []).map(d => d.split('-').reverse().join('.')).join(', ') || '—'}`, MX, y, 22, '#555'); y += 32;
  text(`Время: ${fmtT(r.s.totalMs || 0)}  ·  отладчик: ${r.s.dbg || 0}  ·  консоль: ${r.s.con || 0}${DB.teacher.name ? '  ·  учитель: ' + DB.teacher.name : ''}`, MX, y, 22, '#555'); y += 44;
  const tiles = [['Решено', r.c.done + ' / ' + r.c.total, '#e8ecff', '#3b4fd8'], ['ДЗ', r.hwN ? r.ch.done + ' / ' + r.ch.total : '—', '#fff0e0', '#b25e00'], ['Сам, с 1-й', r.c.ok, '#dff6ea', '#0f7a4d'], ['После ошибок', r.c.err, '#e6f7ef', '#2e8a5f'], ['С подсказкой', r.c.hint + r.c.fill, '#fff2cc', '#8a6400'], ['Неверных', r.wrongTotal, '#ffe3e3', '#c0262c']];
  const tw = (W - 2 * MX - 5 * 16) / 6;
  tiles.forEach((t, i) => { const x = MX + i * (tw + 16); rr(x, y, tw, 120, 18, t[2]); text(String(t[1]), x + tw / 2, y + 64, 36, t[3], 1, 'center'); text(t[0], x + tw / 2, y + 100, 17, '#444', 0, 'center'); });
  y += 170; const bw = W - 2 * MX;
  text('По блокам', MX, y, 30, '#1d2640', 1); y += 20;
  const tcol = [MX, MX + 600, MX + 740, MX + 860, MX + 1010];
  rr(MX, y, bw, 44, 10, '#f1f3fa'); ['Блок', 'Решено', 'Сам', 'С помощью', 'Ошибок'].forEach((h, i) => text(h, tcol[i] + 12, y + 30, 20, '#555', 1)); y += 44;
  r.byBlk.forEach((b, i) => { if (i % 2) rr(MX, y, bw, 40, 8, '#fafbfe'); text(fit(b.b.id + ' · ' + b.b.name, 580, 20), tcol[0] + 12, y + 28, 20); text(b.done + ' / ' + b.total, tcol[1] + 12, y + 28, 20, b.done === b.total ? '#0f7a4d' : '#1d2640', 1); text(String(b.self), tcol[2] + 12, y + 28, 20); text(String(b.help), tcol[3] + 12, y + 28, 20); text(String(b.wrong), tcol[4] + 12, y + 28, 20, b.wrong ? '#c0262c' : '#1d2640'); y += 40; });
  const cx = [MX, MX + 130, MX + 420, MX + 500, MX + 720, MX + 920];
  const head = () => { text('Задачи', MX, y, 30, '#1d2640', 1); text('Д — домашнее задание', W - MX, y, 16, '#888', 0, 'right'); y += 18; rr(MX, y, bw, 40, 10, '#f1f3fa'); ['№', 'Итог', 'Поп.', 'Неверные ответы', 'Помощь', showAns ? 'Ответ' : 'По файлу'].forEach((h, i) => text(h, cx[i] + 8, y + 27, 18, '#555', 1)); y += 40; };
  y += 40; if (y > H - 300) newPage(); head();
  const stCol = {ok: ['#dff6ea', '#0f7a4d'], err: ['#e6f7ef', '#2e8a5f'], hint: ['#fff2cc', '#8a6400'], fill: ['#ffe8d6', '#b04e10'], mark: ['#e8ecff', '#3b4fd8'], new: ['#f1f3fa', '#888']};
  r.rows.forEach((w, i) => {
    if (y > H - 110) { newPage(); head(); }
    const x = w.x; if (i % 2) rr(MX, y, bw, 36, 6, '#fafbfe');
    text(w.id + (w.hw ? ' Д' : ''), cx[0] + 4, y + 25, 17, '#1d2640', 1, 'left', 1);
    rr(cx[1] + 4, y + 5, 276, 26, 13, stCol[x.st][0]); text(fit(ST_LABEL[x.st].toLowerCase(), 266, 15), cx[1] + 142, y + 24, 15, stCol[x.st][1], 1, 'center');
    text(String(x.tries || 0), cx[2] + 35, y + 25, 17, '#333', 0, 'center');

    text(fit(hintStr(x) || '—', 190, 15), cx[4] + 8, y + 25, 15, x.hint ? '#8a6400' : '#999');
    text(fit(showAns ? String(w.t.ans) : x.real ? x.real + (x.realOk === true ? ' ✓' : x.realOk === false ? ' ✗' : ' ?') : '—', 160, 16, 1), cx[5] + 8, y + 25, 16, '#333', 0, 'left', 1);
    y += 36;
  });
  if (withCode) {
    const cs = r.rows.filter(w => w.x.code && (w.x.tries || w.x.runs) && (w.x.st !== 'ok' || w.x.wrong.length));

      cs.forEach(w => { const lines = w.x.code.split('\n').slice(0, 22), h = 70 + lines.length * 24; if (y + h > H - 90) newPage();
        rr(MX, y, bw, h, 14, '#f6f7fb'); text(w.id + ' · ' + ST_LABEL[w.x.st].toLowerCase() + (w.x.wrong.length ? ' · ошибки: ' + w.x.wrong.slice(0, 4).join('; ') : ''), MX + 16, y + 34, 20, '#1d2640', 1);
        lines.forEach((l, k) => text(fit(l, bw - 40, 17, 1), MX + 20, y + 64 + k * 24, 17, '#26304f', 0, 'left', 1)); y += h + 16; });
    }
  }
  pages.forEach((p, i) => { const c = p.getContext('2d'); c.font = F(16); c.fillStyle = '#999'; c.textAlign = 'center'; c.fillText(`${APPNAME} · ${name} · стр. ${i + 1} из ${pages.length}`, W / 2, H - 40); });
  const imgs = pages.map(p => { const d = atob(p.toDataURL('image/jpeg', 0.9).split(',')[1]); const u = new Uint8Array(d.length); for (let i = 0; i < d.length; i++) u[i] = d.charCodeAt(i); return u; });
  if (mm) mm.innerHTML = '';
  const blob = pdfFromJpegs(imgs, W, H), fn = 'Отчёт_регулярки_' + name.replace(/[^\wА-Яа-яЁё-]+/g, '_') + '_' + dstamp() + '.pdf';
  try { return new File([blob], fn, {type: 'application/pdf'}); } catch (e) { blob.name = fn; return blob; }
}
function pdfFromJpegs(imgs, w, h) {
  const enc = new TextEncoder(), parts = [], offs = []; let len = 0;

  obj(2, () => add(`<< /Type /Pages /Count ${n} /Kids [${imgs.map((_, i) => (3 + i * 3) + ' 0 R').join(' ')}] >>`));

    obj(p, () => add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im${i} ${x} 0 R >> >> /Contents ${c} 0 R >>`));
    const cs = `q ${PW} 0 0 ${PH} 0 0 cm /Im${i} Do Q`; obj(c, () => add(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(x, () => { add(`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.length} >>\nstream\n`); add(im); add('\nendstream'); }); });
  const total = 3 + n * 3, xref = len; let x = `xref\n0 ${total}\n0000000000 65535 f \n`; for (let i = 1; i < total; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
  add(x); add(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`); return new Blob(parts, {type: 'application/pdf'});
}
