<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ЕГЭ 24 · Регулярные выражения</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>:root{--bg:#f3f5fb;--card:#fff;--ink:#1d2640;--mut:#6b7491;--line:#e1e5f0;--pri:#4f6bff;--pri2:#7b5cff;--ok:#16a36a;--okl:#dff6ea;--err:#e5484d;--errl:#ffe3e3;--warn:#f0a400;--code:#0f1424;--code2:#161d33;--cink:#e7ecff;--sh:0 6px 22px rgba(30,40,80,.08)}
[data-theme=dark]{--bg:#0f1322;--card:#181e33;--ink:#e6e9f5;--mut:#98a0bf;--line:#2a3150;--okl:#143826;--errl:#3b1518;--code:#0b0f1d;--code2:#131a30;--sh:0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Nunito','Segoe UI',Roboto,Arial,sans-serif}
button{font:inherit;cursor:pointer}input,select,textarea{font:inherit;color:inherit}
.mono,code,pre{font-family:"JetBrains Mono","Cascadia Code",Consolas,"Courier New",monospace}
.btn{border:0;border-radius:11px;padding:8px 14px;font-weight:700;background:var(--card);color:var(--ink);box-shadow:0 0 0 1.5px var(--line) inset;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn:hover{box-shadow:0 0 0 1.5px var(--pri) inset}
.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 6px 16px rgba(79,107,255,.3)}
.btn.ok{background:var(--ok);color:#fff;box-shadow:none}
.btn.yel{background:linear-gradient(135deg,#ffcf4a,#ffb02e);color:#4a3000;box-shadow:none}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.btn.on{background:#e6eaff;box-shadow:0 0 0 1.5px var(--pri) inset;color:#2f45c9}[data-theme=dark] .btn.on{background:#262f55;color:#b9c4ff}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:16px 20px;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1d2640;color:#fff;padding:11px 18px;border-radius:12px;z-index:300;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90vw;font-weight:600}
.mbg{position:fixed;inset:0;background:rgba(15,20,40,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:12px}
.mdl{background:var(--card);border-radius:20px;padding:20px;max-width:640px;width:100%;max-height:94vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.mdl.wide{max-width:1050px}.mdl.full{max-width:none;width:96vw;height:94vh;max-height:94vh;padding:16px;display:flex;flex-direction:column}
.mdl h2{margin:0 0 10px}
.mhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}.mhead h2{margin:0;flex:1}
.inp{border:1.5px solid var(--line);background:var(--bg);border-radius:11px;padding:8px 12px;outline:none}
.inp:focus{border-color:var(--pri)}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:9px 16px;background:var(--card);box-shadow:0 2px 12px rgba(30,40,80,.07);flex-wrap:wrap}
.logo{font-weight:900;font-size:17px;display:flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer}
.logo i{font-style:normal;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-size:14px}
.top .sp{flex:1}
.ib{border:0;background:var(--bg);color:var(--ink);border-radius:10px;padding:7px 10px;font-weight:700;white-space:nowrap}
.ib:hover{background:#e6eaff}[data-theme=dark] .ib:hover{background:#262f55}
.ib.yel{background:linear-gradient(135deg,#ffcf4a,#ffb02e);color:#4a3000}
.who{font-weight:800;background:var(--bg);border-radius:999px;padding:6px 12px}
.modeb{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:#e3f6ec;color:#0f7a4d}.modeb.home{background:#fff0e0;color:#b25e00}
.login{max-width:560px;margin:7vh auto;padding:0 14px}
.hero{background:linear-gradient(135deg,#4f6bff,#7b5cff 60%,#b44cff);color:#fff;border-radius:24px;padding:26px;box-shadow:0 20px 50px rgba(79,107,255,.35);position:relative;overflow:hidden;margin-bottom:14px}
.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0;opacity:.92}
.hero .code-deco{position:absolute;right:8px;bottom:-6px;font:700 12px/1.35 Consolas,monospace;opacity:.22;white-space:pre;text-align:left}
.slist{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.slist button{border:0;background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:700}
.lay{display:grid;grid-template-columns:290px 1fr;gap:16px;padding:16px;max-width:1700px;margin:0 auto}
.side{position:sticky;top:66px;align-self:start;max-height:calc(100vh - 82px);overflow:auto;background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:12px}
.prog{display:flex;height:10px;border-radius:9px;overflow:hidden;background:var(--bg);margin:4px 0 8px}.prog i{display:block;height:100%}
.sbig{width:100%;border:0;border-radius:14px;padding:10px 12px;text-align:left;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:6px;background:var(--bg);color:var(--ink)}
.sbig.cons{background:linear-gradient(135deg,#eef1ff,#f6efff)}[data-theme=dark] .sbig.cons{background:#232a4a}
.sbig.cur{outline:2.5px solid var(--pri)}
.sbig small{margin-left:auto;font-weight:700;color:var(--mut)}
.sec{margin-top:10px}.sech{font-weight:900;font-size:13.5px;padding:4px 2px;display:flex;align-items:center;gap:6px}.sech small{margin-left:auto;color:var(--mut)}
.its{display:flex;flex-wrap:wrap;gap:5px;padding:2px 2px 6px}
.it{border:0;border-radius:9px;padding:4px 7px;font:700 12.5px Consolas,monospace;background:var(--bg);color:var(--ink);position:relative;min-width:46px}
.it.z{background:#fff6dc;color:#8a6400}[data-theme=dark] .it.z{background:#3a3010;color:#ffd666}
.it.ok{background:#16a36a;color:#fff}.it.err{background:#7bd3a7;color:#08321f}.it.hint{background:#ffd666;color:#4a3500}.it.fill{background:#ffb27a;color:#4a2000}
.it.cur{outline:2.5px solid var(--pri);outline-offset:1px}
.it.tried::after{content:'';position:absolute;right:2px;top:2px;width:6px;height:6px;border-radius:50%;background:var(--err)}
.legend{font-size:11.5px;color:var(--mut);display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.main{min-width:0}
.th{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.th h2{margin:0;font-size:21px}
.tag{font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;background:var(--bg);color:var(--mut);white-space:nowrap}
.tag.z{background:#fff1c7;color:#8a6400}.tag.st{background:#dff6ea;color:#0f7a4d}
.dots{color:#f0a400;letter-spacing:1px}
.cond{white-space:pre-wrap;font-size:16px;line-height:1.55;margin-top:10px}
.cond .q{font-weight:800;background:#fff6dc;border-radius:6px;padding:1px 4px}.cond .cnum{font-weight:850}.cond .example{color:#13734f;background:#eaf8ef;border-radius:5px;padding:1px 3px}[data-theme=dark] .cond .q{background:#3a3010}[data-theme=dark] .cond .example{color:#91e1b6;background:#153a28}
.fold{background:var(--code2);color:#aab4da;border-radius:12px;font:13.5px/20px Consolas,monospace;margin-bottom:8px;overflow:hidden}
.fold>button{border:0;background:transparent;color:inherit;font:inherit;width:100%;text-align:left;padding:7px 12px;display:flex;gap:8px;align-items:center}
.fold>button b{color:#c792ea}.fold>button span.c{color:#69739a;margin-left:auto;font-family:Nunito,sans-serif;font-size:12px}
.fold pre{margin:0;padding:6px 14px 10px;color:var(--cink);border-top:1px solid #253055}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}.bar .sp{flex:1}.ed-tools{display:flex;gap:5px;flex-wrap:wrap;align-items:center}.bar button{max-width:100%}.base-vis-frame{width:100%;height:calc(94vh - 64px);min-height:420px;flex:1;border:0;border-radius:12px;background:#0b1018}
.exb{border:0;border-radius:9px;padding:5px 10px;font:700 12.5px Consolas,monospace;background:#e8f7ef;color:#0f7a4d}
[data-theme=dark] .exb{background:#143826;color:#7fe0b0}
.exin{width:84px;padding:5px 8px;font:700 13px Consolas,monospace}
.menu{position:absolute;background:var(--card);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:6px;z-index:150;display:flex;flex-direction:column;min-width:220px;border:1px solid var(--line)}
.menu button{white-space:pre;border:0;background:transparent;color:var(--ink);text-align:left;padding:6px 10px;border-radius:8px;font:13px Consolas,monospace}
.menu button:hover{background:var(--bg)}
.menu small{font-family:Nunito,sans-serif;color:var(--mut);padding:4px 10px}
/* редактор */
.ed{display:flex;background:var(--code);border-radius:14px;overflow:hidden;font:14px/21px "JetBrains Mono","Cascadia Code",Consolas,monospace}
.ed-gut{padding:8px 0;background:var(--code2);color:#5d6890;text-align:right;user-select:none;min-width:38px}
.ed-gut div{padding:0 8px;height:21px}.ed-gut div.on{background:#4f6bff;color:#fff}.ed-gut div.er{background:#e5484d;color:#fff}
.ed-box{position:relative;flex:1;min-width:0;overflow-x:auto}
.ed-hl,.ed-ta,.ed-mark{margin:0;padding:8px 12px;font:inherit;white-space:pre;tab-size:4;border:0}
.ed-hl{position:absolute;inset:0;overflow:hidden;color:var(--cink);pointer-events:none;z-index:1}
.ed-mark{position:absolute;inset:0;overflow:hidden;padding-left:0;padding-right:0;pointer-events:none;z-index:0}
.ed-mark div{height:21px}.ed-mark div.on{background:rgba(79,107,255,.3)}.ed-mark div.er{background:rgba(229,72,77,.32)}
.ed-ta{position:relative;z-index:2;display:block;width:100%;background:transparent;color:transparent;caret-color:#fff;outline:none;resize:none;overflow-x:auto;overflow-y:hidden;min-height:120px}
.ed-ta::selection{background:rgba(123,92,255,.45)}
.hk{color:#c792ea;font-weight:700}.hs{color:#c3e88d}.hn{color:#f78c6c}.hc{color:#69739a;font-style:italic}.hb{display:inline-block;white-space:pre;background:#ffd666;color:#1d2640;border-radius:4px;font-weight:800;min-width:1ch;padding:0 .22em;margin-left:.16em}.hb.touched{opacity:1;background:rgba(255,214,102,.13);color:#e7ecff;box-shadow:0 0 0 1px rgba(255,214,102,.38)}.hb.active{opacity:1;background:rgba(255,214,102,.22)}
.out{background:var(--code);color:#cfe3cf;border-radius:12px;padding:10px 12px;font:13.5px/1.5 Consolas,monospace;white-space:pre-wrap;word-break:break-all;max-height:240px;overflow:auto;min-height:42px;margin-top:8px}
.out .last{background:#2b3a1e;color:#d9ff9e;border-radius:4px;padding:0 3px;font-weight:700}
.out .e{color:#ff9a9a}.out .m{color:#7f8bb8}.out .g{color:#7fe0b0;font-weight:700}
.out.solved{box-shadow:0 0 0 3px var(--ok)}
.status{font-size:12.5px;color:var(--mut);margin-top:4px}
.exp{background:#fff0f0;color:#9b1c21;border-radius:12px;padding:9px 12px;font-size:14px;margin-top:6px}[data-theme=dark] .exp{background:#3b1518;color:#ffb0b3}
.ans{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bg);border-radius:14px;padding:10px 12px;margin-top:10px}
.ans .inp{width:170px;font:700 17px Consolas,monospace;background:var(--card)}
.fb{border-radius:12px;padding:10px 14px;font-weight:700;display:none;margin-top:8px}
.fb.show{display:block}.fb.good{background:var(--okl);color:var(--ok)}.fb.bad{background:var(--errl);color:var(--err)}
.nx{height:5px;background:rgba(22,163,106,.25);border-radius:9px;margin-top:8px;overflow:hidden}.nx i{display:block;height:100%;background:var(--ok);width:0;transition:width 2.2s linear}
.card.solved{box-shadow:0 0 0 3px var(--ok),var(--sh)}
.hcard{background:#fff8dc;border:1.5px solid #ffd98a;border-radius:14px;padding:10px 14px;margin-top:8px;color:#4a3500;animation:pop .3s}
[data-theme=dark] .hcard{background:#3a2e12;border-color:#6b5420;color:#ffe6a8}
.hcard .hn2{display:inline-block;background:#f0a400;color:#fff;border-radius:999px;padding:0 9px;margin-right:6px;font-size:12.5px;font-weight:800}
.hcard pre{background:var(--code);color:var(--cink);border-radius:10px;padding:8px 10px;margin:8px 0 4px;font-size:13px;overflow:auto}
code.i{background:var(--bg);border-radius:5px;padding:0 4px;font-size:.92em}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
/* общие подсказки */
.ghg{margin:14px 0 6px;display:flex;align-items:center;gap:8px;font-size:18px;font-weight:900}.ghg i{width:16px;height:16px;border-radius:5px;display:inline-block}
.ghs{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.ghc{background:var(--sc);border-radius:8px 8px 18px 8px;border-top:6px solid var(--se);padding:12px 14px;color:#1d2640;box-shadow:0 8px 18px rgba(40,40,80,.1)}
.ghc b.t{display:block;margin-bottom:4px}
.ghc pre{background:#0f1424;color:#e7ecff;border-radius:10px;padding:8px 10px;margin:8px 0 6px;font-size:12.8px;overflow:auto;white-space:pre}
.ghc .btn{background:#fff}
/* консоль */
.con{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:12px}
.conlog{background:var(--code);color:#e7ecff;border-radius:14px;padding:12px;font:14px/1.5 Consolas,monospace;overflow:auto;white-space:pre-wrap;word-break:break-all;display:flex;flex-direction:column}
.conlog .cmd{color:#82aaff}.conlog .res{color:#c3e88d}.conlog .err{color:#ff9a9a}.conlog .pr{color:#e7ecff}.conside{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}.conside textarea{display:block;width:100%;min-height:112px;resize:vertical;background:var(--code);color:#e7ecff;border:1px solid var(--line);border-radius:8px;padding:8px;font:13px/1.45 Consolas,monospace;margin:8px 0}.conside .help{font-size:12px;color:var(--mut);margin:7px 0 12px}.ru-error{display:block;color:#ffd98a;font:13px/1.45 system-ui,sans-serif;padding-top:3px}
.conin{display:flex;gap:6px;align-items:flex-start;margin-top:auto;padding-top:8px}
.conin span{color:#82aaff;font-weight:800;padding-top:6px}
.conin textarea{flex:1;background:#151c33;border:1px solid #2a3150;border-radius:8px;color:#fff;font:14px/1.5 Consolas,monospace;padding:6px 8px;resize:none;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{border:0;background:var(--bg);color:var(--ink);border-radius:8px;padding:4px 8px;font:12.5px Consolas,monospace}
.chips button:hover{background:#e6eaff}
/* пошаговый мини-питон */
.stp{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.stpv{overflow:auto;display:flex;flex-direction:column;gap:8px}
.vtab{width:100%;border-collapse:collapse;font:14px Consolas,monospace}
.vtab td{border-bottom:1px solid var(--line);padding:5px 6px;vertical-align:top}.vtab td:first-child{color:var(--pri);font-weight:800;width:70px}
.vtab tr.ch td{background:#fff3c4}[data-theme=dark] .vtab tr.ch td{background:#3a3010}
.cells{display:flex;flex-wrap:wrap;gap:2px}
.cells span{display:inline-flex;flex-direction:column;align-items:center;min-width:22px;background:#eef1ff;border-radius:5px;padding:1px 3px;font-weight:800}
.cells span small{font-size:9px;color:var(--mut);font-weight:600}
[data-theme=dark] .cells span{background:#232a4a}
/* конструктор */
.cgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;flex:1;min-height:0}
.cl{display:flex;align-items:center;gap:6px;margin:4px 0;font:15px/1 Consolas,monospace}
.cl .code{flex:1;background:var(--code);color:var(--cink);border-radius:8px;padding:8px 10px;white-space:pre;min-height:36px;display:flex;align-items:center}
.cl.bad .code{box-shadow:0 0 0 2.5px var(--err)}.cl.good .code{box-shadow:0 0 0 2.5px var(--ok)}
.cl .ind{color:#3c4670}
.cl button{border:0;border-radius:8px;padding:6px 9px;background:var(--bg);color:var(--ink);font-weight:800}
.cl .slot{flex:1;border:2px dashed var(--line);border-radius:8px;padding:8px 10px;color:var(--mut);background:transparent;text-align:left;font:15px Consolas,monospace;white-space:pre}
.cl .num{width:24px;color:var(--mut);text-align:right;font-size:12px}
.lvl3{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.cdone{color:var(--ok);font-weight:800}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl td,.tbl th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs button{border:0;padding:9px 14px;border-radius:10px;background:var(--bg);color:var(--ink);font-weight:800}.tabs button.on{background:var(--pri);color:#fff}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;max-width:460px}.fld span{font-size:13px;color:var(--mut);font-weight:700}
.flag{display:inline-flex;align-items:center;gap:4px;margin:3px 5px 3px 0;padding:5px 9px;border-radius:9px;background:var(--bg);font:700 13px Consolas,monospace;cursor:pointer;border:1.5px solid transparent;user-select:none}
.flag.on{border-color:var(--pri);background:#e6eaff;color:#1d2640}
.home{max-width:1100px;margin:16px auto;padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hmc{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:22px;cursor:pointer;border:0;text-align:left;color:var(--ink)}
.hmc:hover{box-shadow:0 0 0 2px var(--pri),var(--sh)}
.hmc h2{margin:6px 0}.hmc .big{font-size:40px}
.pb{height:9px;background:var(--bg);border-radius:9px;overflow:hidden;margin-top:10px}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#5ad19b)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--bg);border-radius:14px;padding:12px}.stat b{font-size:24px;display:block}.stat span{font-size:13px;color:var(--mut)}
@media (max-width:980px){.lay{grid-template-columns:1fr;padding:8px}.side{position:static;max-height:none}.home{grid-template-columns:1fr}.con,.stp,.cgrid{grid-template-columns:1fr}}

.vhint{color:var(--mut);font-size:13px}
.home2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;max-width:1300px;margin:18px auto;padding:0 16px}
.hcol{display:flex;flex-direction:column;gap:10px}
.bline{display:flex;align-items:center;gap:12px;border:0;background:var(--card);color:var(--ink);border-radius:16px;padding:12px 14px;box-shadow:var(--sh);text-align:left}
.bline:hover{box-shadow:0 0 0 2px var(--pri) inset,var(--sh)}
.bline .bn{flex:0 0 38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2))}
.bline .bt{flex:1;display:flex;flex-direction:column}.bline .bt small{color:var(--mut);font-size:12.5px;line-height:1.35}
.bline .bp{flex:0 0 90px;text-align:right;font-size:13px}.bline .bp i{display:block;height:6px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:4px}.bline .bp em{display:block;height:100%;background:var(--ok)}
.hwc{border:2px solid #ffb46b !important}
.filt{display:flex;gap:4px;flex-wrap:wrap}
.filt button{border:0;border-radius:999px;padding:5px 10px;font-weight:800;font-size:12.5px;background:var(--bg);color:var(--ink)}
.filt button.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.sec.cur{box-shadow:0 0 0 2px var(--pri) inset;border-radius:12px}

<script id="rxdata" type="application/json">{"blocks":[["R1","Ищем слово: findall, точка, перекрытия","Первые шаги: шаблон-слово, точка «любой символ», подсчёт с перекрытиями через просмотр вперёд и проверка соседей слова."],["R2","Классы символов и серии","[ABC] — один из символов, [^ABC] — любой, кроме них, \\d — цифра, «+» — один или больше раз. Самая длинная серия: max(l, key=len)."],["R3","Скобки: повторяющиеся блоки и группы","(?:…)+ — повторить блок, | — ИЛИ, {2} — ровно два раза. Захватывающие группы (…) и что из них вытаскивать."],["R4","Запреты: просмотр вперёд (?!…)","Самая длинная подстрока, где не встречается запрещённый кусок: «берём символ, если с него не начинается запрет» + хвост. Альтернатива — replace + split."],["R5","Соседи: обратные ссылки и просмотр назад","\\1 — «тот же символ, что в группе 1», (?<=…) — что стоит слева. Чередования, различные соседи, алфавитный порядок."],["R6","Числа и арифметические выражения","Число без ведущих нулей, чётное число, число в другой системе — собираем выражение из кусков через f-строку."],["R7","Палиндромы фиксированной длины","Обратные ссылки в обратном порядке: (.)(.).\\3\\2 — и нумерация групп после обёртки (?=(…))."],["R8","Сколько раз встречается символ: ровно / не более / не менее K","Окно из K повторов «символ + не-символы» прямо в шаблоне: [^F]*(?:F[^F]*){K}. Альтернатива — split и позиции через finditer."],["R9","Файл из нескольких строк: ^, $ и флаг M","Точка не переходит через перевод строки, ^ и $ с флагом M — начало и конец каждой строки текста."],["RW","Слово K раз и окна: split, позиции, скользящее окно","Здесь регулярка — неподходящий способ: режем строку split по слову, считаем по позициям вхождений (finditer) или двигаем окно. Края — через «пустых» соседей."],["RC","Частоты и подсчёт символов","Самый частый символ, разница частот, симметричные пары, строки файла — count, set, словари. Регулярка здесь не нужна."],["RS","★ Со звёздочкой","Длинные составные шаблоны: грамматика предложения и e-mail, выражения в других системах, римские числа."]],"tasks":[{"id":"2531","blk":"R1","role":"main","like":"","star":false,"title":"","idea":"Нужное слово можно записать в шаблон как есть. findall вернёт список всех найденных слов, его длина — ответ.","note":"","tr":"","ask":"Сколько раз в строке встречается NEWYEAR?","s":"WAARNEAAANEWYEARENEEWYENEWYEARYWWWYRA","ans":"2","tpl":"from re import *\ns = 'WAARNEAAANEWYEARENEEWYENEWYEARYWWWYRA'\nprint(len(s), set(s), s[:200])\npattern = r'⟦NEWYEAR⟧'\nl = findall(pattern, s)\nprint(l)\nprint(len(l))","methods":{"rx":"from re import *\ns = 'WAARNEAAANEWYEARENEEWYENEWYEARYWWWYRA'\nprint(len(s), set(s), s[:200])\npattern = r'NEWYEAR'\nl = findall(pattern, s)\nprint(l)\nprint(len(l))","loops":"s = 'WAARNEAAANEWYEARENEEWYENEWYEARYWWWYRA'\nprint(len(s), set(s), s[:200])\nk = 0\nfor i in range(len(s)):\n    if s[i:i+7] == 'NEWYEAR':\n        k += 1\nprint(k)","split":"s = 'WAARNEAAANEWYEARENEEWYENEWYEARYWWWYRA'\nprint(len(s), set(s), s[:200])\nprint(s.count('NEWYEAR'))"},"final":"NEWYEAR","flags":"","tree":[{"t":"NEWYEAR","d":"символы «NEWYEAR» подряд, ровно в таком порядке"}],"groups":0,"main":"rx","norx":false,"d":2,"alias":"","realAns":"","src2":"","real":"(А. Калинин) Страшные порывы ветра в клочья уничтожили Боевого Робота, однако путники были спасены. Они забрели в лабиринт, представляющий собой текстовый документ, состоящий из букв N, E, W, Y, A, R. Помогите заблудившимся найти путь. Определите, сколько раз встречается комбинация «NEWYEAR» в файле.","src":"Новогодний вариант 2021/2022","lvl":"Базовый","file":"https://kompege.ru/files/SASZ2jTT2.txt"},{"id":"862","blk":"R1","role":"hw","like":"2531","star":false,"title":"","idea":"","note":"","tr":"","ask":"","s":"KTOSCOKTOKTOSCTOKTOSKOOKTOSCTSKTTCOSSTOSCSO","ans":"3","tpl":"from re import *\ns = 'KTOSCOKTOKTOSCTOKTOSKOOKTOSCTSKTTCOSSTOSCSO'\nprint(len(s), set(s), s[:200])\npattern = r'⟦OKTOS⟧'\nl = findall(pattern, s)\nprint(l)\nprint(len(l))","methods":{"rx":"from re import ) % 5 == 0 for p in parts)\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) > dl:\n            dl = len(ss)\nprint(dl)"},"final":"(?:[1-9]\\d*)?[05](?:[+*](?:[1-9]\\d*)?[05])*","flags":"","tree":[{"t":"(?:[1-9]\\d*)?","d":"повторить необязательно: ноль или один раз — жадно (как можно больше):","c":[{"t":"[1-9]","d":"один символ: от «1» до «9»"},{"t":"\\d*","d":"повторить ноль или больше раз — жадно (как можно больше):","c":[{"t":"\\d","d":"любая цифра 0–9"}]}]},{"t":"[05]","d":"один символ из набора: «0», «5»"},{"t":"(?:[+*](?:[1-9]\\d*)?[05])*","d":"повторить ноль или больше раз — жадно (как можно больше):","c":[{"t":"[+*]","d":"один символ из набора: «+», «*»"},{"t":"(?:[1-9]\\d*)?","d":"повторить необязательно: ноль или один раз — жадно (как можно больше):","c":[{"t":"[1-9]","d":"один символ: от «1» до «9»"},{"t":"\\d*","d":"повторить ноль или больше раз — жадно (как можно больше):","c":[{"t":"\\d","d":"любая цифра 0–9"}]}]},{"t":"[05]","d":"один символ из набора: «0», «5»"}]}],"groups":0,"main":"rx","norx":false,"d":2,"alias":"","realAns":"","src2":"","real":"Текстовый файл состоит из десятичных цифр, знаков «+» и «*» (сложения и умножения). Определите максимальное количество символов в непрерывной последовательности, являющейся корректным арифметическим выражением с целыми неотрицательными числами, кратными пяти. В этом выражении никакие два знака арифметических операций не стоят рядом. В записи чисел отсутствуют незначащие (ведущие) нули.","src":"","lvl":"Сложный","file":"https://kompege.ru/files/h2mFDwCKF.txt"},{"id":"21597","blk":"R6","role":"hw","like":"20968","star":false,"title":"","idea":"","note":"Числа 6-ричные: цифры 0–5. Слева направо считать можно, только если все умножения идут раньше вычитаний: сначала (*число)*, потом (-число)*.","tr":"","ask":"","s":"35325786*7143498-086716-1*0*2-1401771517*8-3491*5","ans":"10","tpl":"from re import *\ns = '35325786*7143498-086716-1*0*2- .count('.') != 1 or ss[-2] == ' ':\n        return False\n    words = ss[:-1].split(' ')\n    return all(w != '' and w[0] in 'ABCabc' and all(c in 'abc' for c in w[1:]) for w in words)\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) > dl:\n            dl = len(ss)\nprint(dl)"},"final":"[ABC][abc]*(?: [ABCabc][abc]*)*\\.","flags":"","tree":[{"t":"[ABC]","d":"один символ из набора: «A», «B», «C»"},{"t":"[abc]*","d":"повторить ноль или больше раз — жадно (как можно больше):","c":[{"t":"[abc]","d":"один символ из набора: «a», «b», «c»"}]},{"t":"(?: [ABCabc][abc]*)*","d":"повторить ноль или больше раз — жадно (как можно больше):","c":[{"t":" ","d":"символ пробел"},{"t":"[ABCabc]","d":"один символ из набора: «A», «B», «C», «a», «b», «c»"},{"t":"[abc]*","d":"повторить ноль или больше раз — жадно (как можно больше):","c":[{"t":"[abc]","d":"один символ из набора: «a», «b», «c»"}]}]},{"t":"\\.","d":"символ «.»"}],"groups":0,"main":"rx","norx":false,"d":2,"alias":"","realAns":"22","src2":"","real":"Текстовый файл состоит из заглавных букв А, В, С, строчных букв а, b, c, знака препинания «.» и знаков пробелов. Определите максимальное количество символов в непрерывной последовательности, которая является корректно записанным предложением. Считаем, что в корректно записанном предложении выполнены все следующие условия:\n- предложение начинается с заглавной буквы;\n- предложение оканчивается точкой, которая в предложении единственная и перед которой нет пробела;\n- слова в предложении состоят из произвольных комбинаций букв, возможно не имеют семантического смысла, но при этом только первая буква слова может быть заглавной;\n- слова в предложении разделены пробелами, два пробела стоять рядом в предложении не могут.\nВ ответе укажите количество символов.","src":"","lvl":"Сложный","file":"https://kompege.ru/files/ruFR3Lojh.txt"},{"id":"6094","blk":"RS","role":"hw","like":"21161","star":true,"title":"","idea":"","note":"Берём пару, если с неё не начинается XYZY, а последнюю пару — без проверки: XY в конце куска разрешена.","tr":"","ask":"","s":"YXYYZXYZYXYXXYYXZYXYXYZYYXXYYYYXXXZYZXZZY","ans":"3","tpl":"from re import *\ns = 'YXYYZXYZYXYXXYYXZYXYXYZYYXXYYYYXXXZYZXZZY'\nprint(len(s), set(s), s[:200])\npattern = r'⟦(?:(?!XYZY)[XZ]Y)*[XZ]Y⟧'\npattern = f'(?=({pattern}))'\nl = findall(pattern, s)\nmaxs = max(l, key=len)\nprint(maxs, l)\nprint(len(maxs) // 2)","methods":{"rx":"from re import *\ns = 'YXYYZXYZYXYXXYYXZYXYXYZYYXXYYYYXXXZYZXZZY'\nprint(len(s), set(s), s[:200])\npattern = r'(?:(?!XYZY)[XZ]Y)*[XZ]Y'\npattern = f'(?=({pattern}))'\nl = findall(pattern, s)\nmaxs = max(l, key=len)\nprint(maxs, l)\nprint(len(maxs) // 2)","loops":"s = 'YXYYZXYZYXYXXYYXZYXYXYZYYXXYYYYXXXZYZXZZY'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    return len(ss) % 2 == 0 and all(ss[k] in 'XZ' and ss[k+1] == 'Y' for k in range(0, len(ss), 2)) and 'XYZY' not in ss\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) > dl:\n            dl = len(ss)\nprint(dl // 2)"},"final":"(?=((?:(?!XYZY)[XZ]Y)*[XZ]Y))","flags":"","tree":[{"t":"(?=((?:(?!XYZY)[XZ]Y)*[XZ]Y))","d":"просмотр вперёд: дальше ДОЛЖНО идти следующее (символы не забираются, позиция не сдвигается):","c":[{"t":"((?:(?!XYZY)[XZ]Y)*[XZ]Y)","g":1,"d":"ГРУППА №1 — запоминает совпавший кусок: его вернёт findall, m.group(1), на него ссылается \\1","c":[{"t":"(?:(?!XYZY)[XZ]Y)*","d":"повторить ноль или больше раз — жадно (как можно больше):","c":[{"t":"(?!XYZY)","d":"просмотр вперёд: дальше НЕ должно идти следующее (символы не забираются, позиция не сдвигается):","c":[{"t":"XYZY","d":"символы «XYZY» подряд, ровно в таком порядке"}]},{"t":"[XZ]","d":"один символ из набора: «X», «Z»"},{"t":"Y","d":"символ «Y»"}]},{"t":"[XZ]","d":"один символ из набора: «X», «Z»"},{"t":"Y","d":"символ «Y»"}]}]}],"groups":1,"main":"rx","norx":false,"d":2,"alias":"","realAns":"","src2":"","re  8)","loops":"s = 'BCDBBBBBBBBBBBBBCBABDCACDACCCCAACCDCDCABCDBD'\nprint(len(s), set(s), s[:200])\nsave = 0\ni = 0\nwhile i < len(s):\n    j = i\n    while j < len(s) and s[j] == s[i]:\n        j += 1\n    k = j - i\n    if k > 1:\n        save += k - len(str(k)) - 1\n    i = j\nprint(save * 8)"},"final":"(.)\\1*","flags":"","tree":[{"t":"(.)","g":1,"d":"ГРУППА №1 — запоминает совпавший кусок: его вернёт findall, m.group(1), на него ссылается \\1","c":[{"t":".","d":"точка — ровно один любой символ (кроме перевода строки, если нет флага S)"}]},{"t":"\\1*","d":"повторить ноль или больше раз — жадно (как можно больше):","c":[{"t":"\\1","d":"обратная ссылка: здесь должен стоять ТОТ ЖЕ текст, что совпал с группой №1"}]}],"groups":1,"main":"rx","norx":false,"d":3,"alias":"","realAns":"","src2":"","real":"(Л. Шастин) Текстовый файл состоит не более, чем из 7 200 000 прописных символов латинского алфавита.\nДля последующего хранения и использования данные из файла сжимаются согласно алгоритму RLE — методу сжатия данных, который заменяет повторяющиеся символы на их количество и сам символ. Данные закодированы в формате UTF-8, то есть любой символ занимает в памяти 8 бит. Например, строка \"AAAABBBCCDAA\", состоящая из 12 символов и имеющая вес 96 бит, после применения RLE будет выглядеть как \"4A3B2CD2A\", состоять из 9 символов и весить 72 бита. В этом случае благодаря RLE удастся сэкономить 24 бита. \nОпределите количество бит, которое удастся сэкономить, если сжать данные из файла согласно алгоритму RLE.\nДля выполнения этого задания следует написать программу.","src":"","lvl":"Средний","file":"https://kompege.ru/files/ASqFMLUvG.txt"},{"id":"4682","blk":"R3","role":"hw","like":"4602","star":false,"title":"","idea":"","note":"","tr":"","ask":"","s":"DDBDCABECADADBEAAAECDCECAADEBABEECAAEBBE","ans":"4","tpl":"from re import *\ns = 'DDBDCABECADADBEAAAECDCECAADEBABEECAAEBBE'\nprint(len(s), set(s), s[:200])\npattern = r'⟦(?:[AE][BCD])+⟧'\nl = findall(pattern, s)\nmaxs = max(l, key=len)\nprint(maxs, l)\nprint(len(maxs) // 2)","methods":{"rx":"from re import *\ns = 'DDBDCABECADADBEAAAECDCECAADEBABEECAAEBBE'\nprint(len(s), set(s), s[:200])\npattern = r'(?:[AE][BCD])+'\nl = findall(pattern, s)\nmaxs = max(l, key=len)\nprint(maxs, l)\nprint(len(maxs) // 2)","loops":"s = 'DDBDCABECADADBEAAAECDCECAADEBABEECAAEBBE'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    return len(ss) % 2 == 0 and all(ss[k] in 'AE' and ss[k+1] in 'BCD' for k in range(0, len(ss), 2))\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) > dl:\n            dl = len(ss)\nprint(dl // 2)"},"final":"(?:[AE][BCD])+","flags":"","tree":[{"t":"(?:[AE][BCD])+","d":"повторить один или больше раз — жадно (как можно больше):","c":[{"t":"[AE]","d":"один символ из набора: «A», «E»"},{"t":"[BCD]","d":"один символ из набора: «B», «C», «D»"}]}],"groups":0,"main":"rx","norx":false,"d":1,"alias":"","realAns":"","src2":"","real":"Текстовый файл состоит из символов A, B, C, D, E.\nОпределите максимальное количество подряд пар символов вида гласная + согласная в прилагаемом файле.\nДля выполнения этого задания следует написать программу.","src":"Резервный день 2022","lvl":"Базовый","file":"https://kompege.ru/files/-OgUOA7fZ.txt"},{"id":"5139","blk":"R3","role":"hw","like":"4643","star":false,"title":"","idea":"","note":"","tr":"","ask":"","s":"BCCDUEABADCUFDCCFUFCFUCBCUECBBDAUUABUDBEUU","ans":"2","tpl":"from re import *\ns = 'BCCDUEABADCUFDCCFUFCFUCBCUECBBDAUUABUDBEUU'\nprint(len(s), set(s), s[:200])\npattern = r'⟦(?:[BCDF][AEU][BCDF])+⟧'\npattern = f'(?=({pattern}))'\nl = findall(pattern, s)\nmaxs = max(l, key=len)\nprint(maxs, l)\nprint(len(maxs) // 3)","methods":{"rx":"from re import *\ns = 'BCCDUEABADCUFDCCFUFCFUCBCUECBBDAUUABUDBEUU'\nprint(len(s), set(s), s[:200])\npattern = r'(?:[BCDF][AEU][BCDF])+'\npattern = f'(?=({pattern}))'\nl = findall(pattern, s)\nmaxs = max(l, key=len)\nprint(maxs, l)\nprint(len(maxs) // 3)","  r'(?:AB|CB)+'\nl = findall(pattern, s)\nmaxs = max(l, key=len)\nprint(maxs, l)\nprint(len(maxs) // 2)","loops":"s = 'AAAACCBABCBABAABCCBBBBAABAAACBCACAACCCBAAACACBABBB'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    return len(ss) % 2 == 0 and all(ss[k:k+2] in ('AB', 'CB') for k in range(0, len(ss), 2))\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) > dl:\n            dl = len(ss)\nprint(dl // 2)"},"final":"(?:AB|CB)+","flags":"","tree":[{"t":"(?:AB|CB)+","d":"повторить один или больше раз — жадно (как можно больше):","c":[{"t":"AB|CB","d":"ИЛИ — подходит один из 2 вариантов (проверяются слева направо, берётся первый подошедший):","c":[{"t":"AB","d":"вариант 1","c":[{"t":"AB","d":"символы «AB» подряд, ровно в таком порядке"}]},{"t":"CB","d":"вариант 2","c":[{"t":"CB","d":"символы «CB» подряд, ровно в таком порядке"}]}]}]}],"groups":0,"main":"rx","norx":false,"d":1,"alias":"","realAns":"","src2":"","real":"Текстовый файл состоит из символов A, B и C. \nОпределите максимальное количество идущих подряд пар символов AB или CB в прилагаемом файле.\n\nИскомая подпоследовательность должна состоять только из пар AB, или только из пар CB, или только из пар AB и CB в произвольном порядке следования этих пар.\n\nДля выполнения этого задания следует написать программу.","src":"Открытый вариант 2022","lvl":"Базовый","file":"https://kompege.ru/files/9g-_viQOG.txt"},{"id":"12111","blk":"R3","role":"hw","like":"4643","star":false,"title":"","idea":"","note":"","tr":"","ask":"","s":"HPYNYNHPYNNYYNHHNHNNPYPPYNYYYNYYNHNNPPNNNNPNYNYN","ans":"3","tpl":"from re import *\ns = 'HPYNYNHPYNNYYNHHNHNNPYPPYNYYYNYYNHNNPPNNNNPNYNYN'\nprint(len(s), set(s), s[:200])\npattern = r'⟦(?:HPY|NYN)+⟧'\npattern = f'(?=({pattern}))'\nl = findall(pattern, s)\nmaxs = max(l, key=len)\nprint(maxs, l)\nprint(len(maxs) // 3)","methods":{"rx":"from re import *\ns = 'HPYNYNHPYNNYYNHHNHNNPYPPYNYYYNYYNHNNPPNNNNPNYNYN'\nprint(len(s), se азличных символов, которые чередуются. В качестве ответа укажите её длину.\n\nПример. Дана строка: ABCDFDEGHJIJIJIJIJIJKMIJ. Наибольшая подстрока, которая строится на основе двух различных символов, меж собой чередующихся: JIJIJIJIJIJ. Её длина = 11. Ответ для примера: 11.","src":"","lvl":"Средний","file":"https://kompege.ru/files/RKxwF85DK.txt"},{"id":"5237","blk":"R5","role":"hw","like":"6029","star":false,"title":"","idea":"","note":"«Чередуются» здесь — соседние различны (букв всего X и Y). Символ берём, если он не Z и за ним не Z и не он сам: (?!Z|\\1). Внутри [ ] обратная ссылка не работает — [Z\\1] это Z или символ с кодом 1!","tr":"","ask":"","s":"ZZYYYXXYXYXZXYZYYXXYZYZXXXXZZXXZXXZZXXXYYZXYY","ans":"5","tpl":"from re import *\ns = 'ZZYYYXXYXYXZXYZYYXXYZYZXXXXZZXXZXXZZXXXYYZXYY'\nprint(len(s), set(s), s[:200])\npattern = r'⟦(?:([^Z])(?!Z|\\1))*[^Z]⟧'\nl = [m.group() for m in finditer(pattern, s)]\nmaxs = max(l, key=len)\nprint(maxs, l)\nprint(len(maxs))","methods":{"rx":"from re import *\ns = 'ZZYYYXXYXYXZXYZYYXXYZYZXXXXZZXXZXXZZXXXYYZXYY'\nprint(len(s), set(s), s[:200])\npattern = r'(?:([^Z])(?!Z|\\1))*[^Z]'\nl = [m.group() for m in finditer(pattern, s)]\nmaxs = max(l, key=len)\nprint(maxs, l)\nprint(len(maxs))","loops":"s = 'ZZYYYXXYXYXZXYZYYXXYZYZXXXXZZXXZXXZZXXXYYZXYY'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    return 'Z' not in ss and all(ss[k] != ss[k+1] for k in range(len(ss) - 1))\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) > dl:\n            dl = len(ss)\nprint(dl)"},"final":"(?:([^Z])(?!Z|\\1))*[^Z]","flags":"","tree":[{"t":"(?:([^Z])(?!Z|\\1))*","d":"повторить ноль или больше раз — жадно (как можно больше):","c":[{"t":"([^Z])","g":1,"d":"ГРУППА №1 — запоминает совпавший кусок: его вернёт findall, m.group(1), на него ссылается \\1","c":[{"t":"[^Z]","d":"один любой символ, кроме «Z»"}]},{"t":"(?!Z|\\1)","d":"просмотр вперёд: дальше НЕ должно идти следующее (симво x(best, sum(int(x) for x in ss.split('+')))\nprint(best)"},"final":"(?=(\\d+(?:\\+\\d+)+))","flags":"","tree":[{"t":"(?=(\\d+(?:\\+\\d+)+))","d":"просмотр вперёд: дальше ДОЛЖНО идти следующее (символы не забираются, позиция не сдвигается):","c":[{"t":"(\\d+(?:\\+\\d+)+)","g":1,"d":"ГРУППА №1 — запоминает совпавший кусок: его вернёт findall, m.group(1), на него ссылается \\1","c":[{"t":"\\d+","d":"повторить один или больше раз — жадно (как можно больше):","c":[{"t":"\\d","d":"любая цифра 0–9"}]},{"t":"(?:\\+\\d+)+","d":"повторить один или больше раз — жадно (как можно больше):","c":[{"t":"\\+","d":"символ «+»"},{"t":"\\d+","d":"повторить один или больше раз — жадно (как можно больше):","c":[{"t":"\\d","d":"любая цифра 0–9"}]}]}]}]}],"groups":1,"main":"rx","norx":false,"d":2,"alias":"","realAns":"","src2":"","real":"(В. Колчев) Текстовый файл состоит из символов, обозначающих знаки « + », « * » и цифры 7, 8, 9.\nОпределите максимальное значение, которое является результатом вычисления непрерывной последовательности, являющейся корректным арифметическим выражением из нескольких целых неотрицательных чисел, между которыми отсутствует операция умножения.\nВ этом выражении никакие два знака арифметических операций не стоят рядом.","src":"","lvl":"Средний","file":"https://kompege.ru/files/nOE71D3tL.txt"},{"id":"19751","blk":"R6","role":"hw","like":"31368","star":false,"title":"","idea":"","note":"","tr":"","ask":"","s":"-45734*5DC7*B5+582745AA9+9+9AA12+34-52*4","ans":"46","tpl":"from re import *\ns = '-45734*5DC7*B5+582745AA9+9+9AA12+34-52*4'\nprint(len(s), set(s), s[:200])\npattern = r'⟦A(\\d+(?:\\+\\d+)*)⟧'\nl = findall(pattern, s)\nl = [⟦sum(int(x) for x in e.split('+'))⟧ for e in l]\nprint(l)\nprint(max(l))","methods":{"rx":"from re import *\ns = '-45734*5DC7*B5+582745AA9+9+9AA12+34-52*4'\nprint(len(s), set(s), s[:200])\npattern = r'A(\\d+(?:\\+\\d+)*)'\nl = findall(pattern, s)\nl = [sum(int(x) for x in e.split('+')) for e in l]\nprint(l)\nprint(max(l))","loops":"s = '-45734*5DC7*B5+582745AA9+9+9AA12+34-52*4'\nprint(len(s), set(s), s[:200])\nbest = 0\nfor i in range(len(s)):\n    if s[i] != 'A':\n        continue\n    for j in range(i + 2, len(s) + 1):\n        ss = s[i+1:j]\n        if ss[0].isdigit() and ss[-1].isdigit() and all(c.isdigit() or c == '+' for c in ss) and '++' not in ss:\n            best = max(best, sum(int(x) for x in ss.split('+')))\nprint(best)"},"final":"A(\\d+(?:\\+\\d+)*)","flags":"","tree":[{"t":"A","d":"символ «A»"},{"t":"(\\d+(?:\\+\\d+)*)","g":1,"d":"ГРУППА №1 — запоминает совпавший кусок: его вернёт findall, m.group(1), на него ссылается \\1","c":[{"t":"\\d+","d":"повторить один или больше раз — жадно (как можно больше):","c":[{"t":"\\d","d":"любая цифра 0–9"}]},{"t":"(?:\\+\\d+)*","d":"повторить ноль или больше раз — жадно (как можно больше):","c":[{"t":"\\+","d":"символ «+»"},{"t":"\\d+","d":"повторить один или больше раз — жадно (как можно больше):","c":[{"t":"\\d","d":"любая цифра 0–9"}]}]}]}],"groups":1,"main":"rx","norx":false,"d":2,"alias":"","realAns":"67622777","src2":"","real":"Текстовый файл состоит из цифр от 1 до 9, знаков операций «+», «–» и «*» (сложение, вычитание и умножение) и заглавных латинских букв A, B, C, D. Назовём правильной суммой строку, содержащую последовательность из одного или более десятичных чисел, в которой между соседними числами стоит ровно один знак «+» и нет других знаков.\nПримеры правильных сумм: «23», «115+6», «1980+12+12351».\nНазовём результатом правильной суммы число, которое получится при выполнении записанных в соответствующей строке сложений. Например, результат правильной суммы «2+3» – число 5\nНайдите в данной строке правильную сумму, расположенную непосредственно после буквы A и имеющую наибольший результат.\nВ ответе запишите результат найденной суммы. Гарантируется, что ответ не превышает 2·109.","src":"","lvl":"Сложный","file":"https://kompege.ru/files/7U9TE3JMA.txt"},{"id":"19884","blk":"R6","role":"hw","like":"31368","star":true,"title":"","idea":"","note":"Считаем ВСЕ выражения: с каждой позиции — самое длинное, и все его начала, где есть хотя бы один знак.","tr":"","ask":"","s":"*770089908876*567-8**09-30-7-68*8*98986809707*9960","ans":"199","tpl":"from re import *\ns = '*770089908876*567-8**09-30-7-68*8*98986809707*9960'\nprint(len(s), set(s), s[:200])\nnum = r'⟦(?:0|[1-9]\\d*)⟧'\npattern = rf'⟦{num}(?:[\\-*]{num})+⟧'\npattern = f'(?=({pattern}))'\nk = 0\nfor m in findall(pattern, s):\n    for j in range(1, len(m) + 1):\n        ss = m[:j]\n        if ss[-1].isdigit() and ⟦search(r'[-*]', ss)⟧:\n            k += 1\nprint(k)","methods":{"rx":"from re import *\ns = '*770089908876*567-8**09-30-7-68*8*98986809707*9960'\nprint(len(s), set(s), s[:200])\nnum = r'(?:0|[1-9]\\d*)'\npattern = rf'{num}(?:[\\-*]{num})+'\npattern = f'(?=({pattern}))'\nk = 0\nfor m in findall(pattern, s):\n    for j in range(1, len(m) + 1):\n        ss = m[:j]\n        if ss[-1].isdigit() and search(r'[-*]', ss):\n            k += 1\nprint(k)","loops":"s = '*770089908876*567-8**09-30-7-68*8*98986809707*9960'\nprint(len(s), set(s), s[:200])\nOPS, DIG = '-*', '0123456789'\ndef ok(ss):\n    if ss[0] in OPS or ss[-1] in OPS:\n        return False\n    for z in OPS:\n        ss = ss.replace(z, ' ')\n    parts = ss.split(' ')\n    return all(p != '' and (p == '0' or p[0] != '0') and all(c in DIG for c in p) for p in parts)\nk = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and any(c in OPS for c in ss):\n            k += 1\nprint(k)"},"final":"(?=((?:0|[1-9]\\d*)(?:[\\-*](?:0|[1-9]\\d*))+))","flags":"","tree":[{"t":"(?=((?:0|[1-9]\\d*)(?:[\\-*](?:0|[1-9]\\d*))+))","d":"просмотр вперёд: дальше ДОЛЖНО идти следующее (символы не забираются, позиция не сдвигается):","c":[{"t":"((?:0|[1-9]\\d*)(?:[\\-*](?:0|[1-9]\\d*))+)","g":1,"d":"ГРУППА №1 — запоминает совпавший кусок: его вернёт findall, m.group(1), на него ссылается \\1","c":[{"t":"(?:0|[1-9]\\d*)","d":"ИЛИ — подходит один из 2 вариантов (проверяются слева направо, берётся первый подошедший):","c":[{"t":"0","d":"вариант 1","c":[{"t":"0","d":"символ «0»"}]},{"t":"[1-9]\\d*","d":"вариант 2","c":[{"t":"[1-9]","d":"один символ: от «1» до «9»"},{"t":"\\d*","d":"повторить ноль или больше раз — жадно (как можно больше):","c":[{"t":"\\d","d":"любая цифра 0–9"}]}]}]},{"t":"(?:[\\-*](?:0|[1-9]\\d*))+","d":"повторить один или больше раз — жадно (как можно больше):","c":[{"t":"[\\-*]","d":"один символ из набора: «-», «*»"},{"t":"(?:0|[1-9]\\d*)","d":"ИЛИ — подходит один из 2 вариантов (проверяются слева направо, берётся первый подошедший):","c":[{"t":"0","d":"вариант 1","c":[{"t":"0","d":"символ «0»"}]},{"t":"[1-9]\\d*","d":"вариант 2","c":[{"t":"[1-9]","d":"один символ: от «1» до «9»"},{"t":"\\d*","d":"повторить ноль или больше раз — жадно (как можно больше):","c":[{"t":"\\d","d":"любая цифра 0–9"}]}]}]}]}]}]}],"groups":1,"main":"rx","norx":false,"d":4,"alias":"","realAns":"","src2":"","real":"(Л. Шастин) Текстовый файл состоит из цифр 0, 6, 7, 8, 9 и знаков арифметических операций «–» и «*» (вычитание и умножение). Определите количество непрерывных подпоследовательностей в этом файле, которые являются корректными арифметическими выражениями с целыми неотрицательными числами.\nВ таких выражениях никакие два знака арифметических операций не должны стоять рядом, а в записи чисел должны отсутствовать незначащие (ведущие) нули. В ответе укажите количество подходящих подпоследовательностей.\nНапример, в строке *567-8**09-30- есть следующие корректные арифметические выражения: 567-8, 67-8, 7-8, 9-3 и 9-30. Ответ: 5.\nПримечание. Отдельно стоящие числа арифметическими выражениями не считать. Число 0 не имеет знака.","src":"","lvl":"Средний","file":"https://kompege.ru/files/AvgZjiADD.txt"},{"id":"18239","blk":"R6","role":"hw","like":"31368","star":true,"title":"","idea":"","note":"Числа отрывать нельзя: finditer даёт числа целиком; дальше два цикла по номерам чисел, значение считаем по ходу.","tr":"в учебной строке граница −20000 та же, числа короче","ask":"","s":"38934477-42371-6223-451-2-399-9999-9999-9999-791","ans":"48","tpl":"from re import *\ns = '38934477-42371-6223-451-2-399-9999-9999-9999-791'\nprint(len(s), set(s), s[:200])\nl = [m for m in finditer(r'\\d+', s)]            # все числа и их позиции\ndl = 0\nfor i in range(len(l)):\n    v = int(l[i].group())\n    for j in range(i, len(l)):\n        if j > i:\n            if s[l[j-1].end():l[j].start()] != '-':\n                break\n            v -= int(l[j].group())\n        if ⟦v > -20000⟧:\n            dl = max(dl, l[j].end() - l[i].start())\nprint(dl)","methods":{"rx":"from re import *\ns = '38934477-42371-6223-451-2-399-9999-9999-9999-791'\nprint(len(s), set(s), s[:200])\nl = [m for m in finditer(r'\\d+', s)]            # все числа и их позиции\ndl = 0\nfor i in range(len(l)):\n    v = int(l[i].group())\n    for j in range(i, len(l)):\n        if j > i:\n            if s[l[j-1].end():l[j].start()] != '-':\n                break\n            v -= int(l[j].group())\n        if v > -20000:\n            dl = max(dl, l[j].end() - l[i].start())\nprint(dl)","loops":"s = '38934477-42371-6223-451-2-399-9999-9999-9999-791'\nprint(len(s), set(s), s[:200])\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ss[0].isdigit() and ss[-1].isdigit() and (i == 0 or not s[i-1].isdigit()) and (j == len(s) or not s[j].isdigit()) and '--' not in ss:\n            p = ss.split('-')\n            v = int(p[0]) - sum(int(x) for x in p[1:])\n            if v > -20000:\n                dl = max(dl, len(ss))\nprint(dl)"},"final":"","flags":"","tree":[],"groups":0,"main":"rx","norx":false,"d":4,"alias":"","realAns":"","src2":"","real":"(Д. Бахтиев) Текстовый файл содержит цифры от 1 до 9 и знак арифметической операции «-» (вычитание). Определите максимальное количество символов в непрерывной последовательности, которая является корректным арифметическим выражением с целыми числами, чьё значение превышает -2000020000 (минус двадцать тысяч). Запрещается отрывать цифры от чисел, но разрешается брать их без знака. Например, в строке -23-456-789 нельзя взять выражение -456-78, но можно взять 23-456.\nВ ответе укажите количество символов.","src":"","lvl":"Сложный","file":"https://kompege.ru/files/ZT1fEfX5Pi.txt"},{"id":"19149","blk":"RS","role":"hw","like":"21161","star":true,"title":"","idea":"","note":"Скобки регулярка не проверит (вложенность). Два цикла, а проверку корректности оставляем Python: fullmatch пропускает только цифры, скобки и +, потом eval без встроенных функций.","tr":"","ask":"","s":"3(2)(1+2)+(3+(2+(4+3))434+)334)34+)233212)(4))()","ans":"3","tpl":"from re import *\ns = '3(2)(1+2)+(3+(2+(4+3))434+)334)34+)233212)(4))()'\nprint(len(s), set(s), s[:200])\ndef ok(e):\n    if '++' in e or '(+' in e or '+)' in e or '()' in e or ')(' in e:\n        return False\n    if not fullmatch(r'[0-9+()]+', e):\n        return False\n    try:\n        return eval(e, {\"__builtins__\": {}}) % 2 == 0\n    except Exception:\n        return False\ndl = 0\nfor i in range(len(s)):\n    if s[i] != '(':\n        continue\n    for j in range(i + 2, len(s) + 1):\n        if s[j-1] == ')' and ⟦ok(s[i:j])⟧:\n            dl = max(dl, j - i)\nprint(dl)","methods":{"loops":"s = '3(2)(1+2)+(3+(2+(4+3))434+)334)34+)233212)(4))()'\nprint(len(s), set(s), s[:200])\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 2, len(s) + 1):\n        e = s[i:j]\n        if e[0] == '(' and e[-1] == ')' and '++' not in e and '(+' not in e and '+)' not in e and '()' not in e and ')(' not in e:\n            try:\n                if eval(e) % 2 == 0:\n                    dl = max(dl, j - i)\n            except Exception:\n                pass\nprint(dl)"},"final":"","flags":"","tree":[],"groups":0,"main":"loops","norx":true,"d":5,"alias":"","realAns":"","src2":"","real":"(В. Лашин) Текстовый файл состоит из символов ')', '(', знака '+' и цифр 1, 2, 3, 4. Определите максимальное количество символов в непрерывной последовательности, начинающихся с символа '(' и кончающихся символом ')', при этом последовательность является математически корректной и её значение кратно 2.\nВ этом выражении никакие два знака арифметических операций не стоят рядом, в начале и в конце математической последовательности не может стоять знак '+'.\nВ ответе укажите количество символов.","src":"","lvl":"Гроб","file":"https://kompege.ru/files/2mhhaHRMtr.txt"},{"id":"7999п","blk":"R6","role":"main","like":"","star":false,"title":"","idea":"Цепочка — это число, а дальше сколько угодно раз «= число»: \\d+(?:=\\d+)*. Нужное число ищем внутри цепочки: e.split('='). Хорошее число можно и «вырезать» из более длинного — но тогда цепочка по эту сторону обрывается.","note":"Если хорошее число — целое число цепочки, подходит вся цепочка. Если оно вырезано из числа, то влево цепочка продолжается, только когда вырез начинается с начала числа, а вправо — когда он доходит до конца числа. Проверено двумя циклами по всем подстрокам.","tr":"","ask":"","s":"60=5269950=1000==1009=3305094=7919=6==4737600=887","ans":"19","tpl":"from re import *\ns = '60=5269950=1000==1009=3305094=7919=6==4737600=887'\nprint(len(s), set(s), s[:200])\npattern = r'⟦\\d+(?:=\\d+)*⟧'\ndef good(x):\n    return ⟦len(x) == 4 and all(int(x) % k for k in range(2, int(int(x) ** 0.5) + 1)) and int(x) > 1⟧\nN = 4                                  # сколько цифр в нужном числе\nl = findall(pattern, s)\ndl = 0\nfor e in l:\n    p = e.split('=')\n    for k in range(len(p)):\n        x = p[k]\n        for a in range(len(x) - N + 1):        # число можно вырезать из края\n            if good(x[a:a+N]):\n                L = '='.join(p[:k]) + '=' if a == 0 and k > 0 else ''\n                R = '=' + '='.join(p[k+1:]) if a + N == len(x) and k < len(p) - 1 else ''\n                dl = max(dl, len(L) + N + len(R))\nprint(dl)","methods":{"rx":"from re import *\ns = '60=5269950=1000==1009=3305094=7919=6==4737600=887'\nprint(len(s), s ий способ: нужно «ровно K вхождений», а шаблон вхождения не считает. Режем строку по слову: между K+1 соседними кусками лежат K слов. Способ «позиции» в меню — твоя идея с «пустыми» соседями на краях: тогда формула одна, без if.","tr":"в учебной строке — ровно 3 раза (в файле — 80)","ask":"","s":"WQRRFFWWGFRSGGGGFSRQRQFSRQRFRSFSRQSFSRQSRQSRQFRGWW","ans":"38","tpl":"s = 'WQRRFFWWGFRSGGGGFSRQRQFSRQRFRSFSRQSFSRQSRQSRQFRGWW'\nprint(len(s), set(s), s[:200])\nw = 'FSRQ'\nK = 3\nl = s.split(w)                       # куски между вхождениями\ndl = 0\nfor i in range(len(l) - K):\n    d = sum(len(x) for x in l[i:i+K+1]) + K * len(w)   # K+1 кусок и K слов\n    if i > 0:\n        d += ⟦len(w) - 1⟧                 # хвост левого соседа\n    if i + K + 1 < len(l):\n        d += len(w) - 1                 # начало правого соседа\n    dl = max(dl, d)\nprint(dl)","methods":{"split":"s = 'WQRRFFWWGFRSGGGGFSRQRQFSRQRFRSFSRQSFSRQSRQSRQFRGWW'\nprint(len(s), set(s), s[:200])\nw = 'FSRQ'\nK = 3\nl = s.split(w)                       # куски между вхождениями\ndl = 0\nfor i in range(len(l) - K):\n    d = sum(len(x) for x in l[i:i+K+1]) + K * len(w)   # K+1 кусок и K слов\n    if i > 0:\n        d += len(w) - 1                 # хвост левого соседа\n    if i + K + 1 < len(l):\n        d += len(w) - 1                 # начало правого соседа\n    dl = max(dl, d)\nprint(dl)","loops":"s = 'WQRRFFWWGFRSGGGGFSRQRQFSRQRFRSFSRQSFSRQSRQSRQFRGWW'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    return ss.count('FSRQ') == 3\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) > dl:\n            dl = len(ss)\nprint(dl)","pos":"from re import *\ns = 'WQRRFFWWGFRSGGGGFSRQRQFSRQRFRSFSRQSFSRQSRQSRQFRGWW'\nprint(len(s), set(s), s[:200])\nw = 'FSRQ'\nK = 3\np = [m.start() for m in finditer(w, s)]\np = [-1] + p + [len(s) - len(w) + 1]      # «пустые» соседи за краями строки\nprint(max(p[i+K+1] + len(w) - 1 - (p[i] + 1) for i in range(len :"RW","role":"hw","like":"19254","star":false,"title":"","idea":"","note":"«Не более K» для максимума — то же, что «ровно K» (если слов в строке больше K). Если их меньше — подходит вся строка.","tr":"в учебной строке — не более 3 раз (в файле — 180)","ask":"","s":"BFABBAEECDBEDFBCAAFBAEECFCABCBCDCFFBCCBCDBCCAAEFBCBE","ans":"36","tpl":"s = 'BFABBAEECDBEDFBCAAFBAEECFCABCBCDCFFBCCBCDBCCAAEFBCBE'\nprint(len(s), set(s), s[:200])\nw = 'BC'\nK = 3\nl = s.split(w)\nif len(l) <= K + 1:\n    print(len(s))\nelse:\n    dl = 0\n    for i in range(len(l) - K):\n        d = sum(len(x) for x in l[i:i+K+1]) + K * len(w)\n        if i > 0:\n            d += len(w) - 1\n        if i + K + 1 < len(l):\n            d += len(w) - 1\n        dl = max(dl, d)\n    print(⟦dl⟧)","methods":{"split":"s = 'BFABBAEECDBEDFBCAAFBAEECFCABCBCDCFFBCCBCDBCCAAEFBCBE'\nprint(len(s), set(s), s[:200])\nw = 'BC'\nK = 3\nl = s.split(w)\nif len(l) <= K + 1:\n    print(len(s))\nelse:\n    dl = 0\n    for i in range(len(l) - K):\n        d = sum(len(x) for x in l[i:i+K+1]) + K * len(w)\n        if i > 0:\n            d += len(w) - 1\n        if i + K + 1 < len(l):\n            d += len(w) - 1\n        dl = max(dl, d)\n    print(dl)","loops":"s = 'BFABBAEECDBEDFBCAAFBAEECFCABCBCDCFFBCCBCDBCCAAEFBCBE'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    return ss.count('BC') <= 3\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) > dl:\n            dl = len(ss)\nprint(dl)"},"final":"","flags":"","tree":[],"groups":0,"main":"split","norx":true,"d":3,"alias":"","realAns":"","src2":"","real":"Текстовый файл состоит из заглавных букв латинского алфавита A, B, C, D, E и F.\nОпределите максимальное количество идущих подряд символов в прилагаемом файле, среди которых пара символов BС (в указанном порядке) встречается не более 180 раз.\nДля выполнения этого задания следует написать программу.","src":"Досрочная волна 2026","lvl":"Базовый","file":"https://kompege.ru/files/j3nY4l4vsY.txt"},{"id":"21717","blk":"RW","role":"main","like":"","star":false,"title":"","idea":"Самый короткий кусок начинается в начале i-го RSQ и кончается в конце (i+K−1)-го. Но кончаться на Q нельзя — добавляем символы справа, пока последний — Q.","note":"Минимум: K−1 кусок между словами + K слов. Края не мешают — окно начинается и кончается на слове.","tr":"в учебной строке — ровно 3 раза (в файле — 130)","ask":"","s":"FQFRFRGGRFWFRFRRSQFWQQRSQRWGWGSRSGWFWGFSSRSQFW","ans":"30","tpl":"from re import *\ns = 'FQFRFRGGRFWFRFRRSQFWQQRSQRWGWGSRSGWFWGFSSRSQFW'\nprint(len(s), set(s), s[:200])\nw = 'RSQ'\nK = 3\np = [m.start() for m in finditer(w, s)]\ndl = len(s) + 1\nfor i in range(len(p) - K + 1):\n    a, b = p[i], p[i+K-1] + len(w)      # от первого слова до конца K-го\n    while b < len(s) and s[b-1] == 'Q':  # не должно кончаться на Q\n        b += 1\n    if s[b-1] != 'Q':\n        dl = min(dl, ⟦b - a⟧)\nprint(dl)","methods":{"split":"s = 'FQFRFRGGRFWFRFRRSQFWQQRSQRWGWGSRSGWFWGFSSRSQFW'\nprint(len(s), set(s), s[:200])\nw = 'RSQ'\nK = 3\nl = s.split(w)\ndl = len(s) + 1\nfor i in range(1, len(l) - K + 1):\n    d = sum(len(x) for x in l[i:i+K-1]) + K * len(w)   # K-1 кусок внутри + K слов\n    nxt = l[i+K-1]                                     # кусок справа\n    q = len(nxt) - len(nxt.lstrip('Q'))\n    if q < len(nxt) or i + K - 1 < len(l) - 1:   # после Q есть другая буква\n        dl = min(dl, d + q + 1)\nprint(dl)","loops":"s = 'FQFRFRGGRFWFRFRRSQFWQQRSQRWGWGSRSGWFWGFSSRSQFW'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    return ss.count('RSQ') == 3 and ss[-1] != 'Q'\ndl = len(s) + 1\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) < dl:\n            dl = len(ss)\nprint(dl)"},"final":"","flags":"","tree":[],"groups":0,"main":"split","norx":true,"d":3,"alias":"","realAns":"","src2":"","real":"Текстовый файл состоит из символов F, G, Q, R, S и W. Определите в этом файле минимальное количество идущих подряд символов, среди которых подстрока RSQ встречается ровно 130 раз, при этом искомая последовательность не оканчивается символом Q.\nДля выполнения этого задания следует написать программу.","src":"ЕГКР 19.04.25","lvl":"Средний","file":"https://kompege.ru/files/PpYYb3sP_r.txt"},{"id":"31230","blk":"RW","role":"hw","like":"21717","star":false,"title":"","idea":"","note":"Самое короткое окно и так кончается на C — последней букве ABC.","tr":"в учебной строке — ровно 3 раза (в файле — 110)","ask":"","s":"ABAEACAAABCEBFFAAAABCBCECBBFAFBBAEDCCBBBBCAECABC","ans":"40","tpl":"s = 'ABAEACAAABCEBFFAAAABCBCECBBFAFBBAEDCCBBBBCAECABC'\nprint(len(s), set(s), s[:200])\nw = 'ABC'\nK = 3\nl = s.split(w)\ndl = len(s) + 1\nfor i in range(1, len(l) - K + 1):\n    d = sum(len(x) for x in l[i:i+K-1]) + ⟦K * len(w)⟧\n    dl = min(dl, d)\nprint(dl)","methods":{"split":"s = 'ABAEACAAABCEBFFAAAABCBCECBBFAFBBAEDCCBBBBCAECABC'\nprint(len(s), set(s), s[:200])\nw = 'ABC'\nK = 3\nl = s.split(w)\ndl = len(s) + 1\nfor i in range(1, len(l) - K + 1):\n    d = sum(len(x) for x in l[i:i+K-1]) + K * len(w)\n    dl = min(dl, d)\nprint(dl)","loops":"s = 'ABAEACAAABCEBFFAAAABCBCECBBFAFBBAEDCCBBBBCAECABC'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    return ss.count('ABC') == 3 and ss[-1] == 'C'\ndl = len(s) + 1\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) < dl:\n            dl = len(ss)\nprint(dl)"},"final":"","flags":"","tree":[],"groups":0,"main":"split","norx":true,"d":2,"alias":"","realAns":"","src2":"","real":"Текстовый файл состоит из заглавных букв латинского алфавита А, В, С, D, Е и F. Определите в прилагаемом файле минимальное количество идущих подряд символов, среди которых тройка букв АВС (в указанном порядке) встречается ровно 110 раз, при этом искомая последовательность заканчивается буквой С. В ответе запишите число - количество символов в найденной последовательности.\nДля выполнения этого задания следует написать программу.","src":"Резерв 22.06.26","lvl":"Средний","file":"https://kompege.ru/files/KawiFKeeq.txt"},{"id":"9169","blk":"RW","role":"hw","like":"21717","star":false,"title":"","idea":"","note":"Слов два — режем split из модуля re по шаблону BAD|FAT; дальше как с одним словом.","tr":"","ask":"","s":"BABDTBTDDDDDTTBAZZATTTTBADTBAFTFATFBTZTDDBAFBADZ","ans":"24","tpl":"from re import *\ns = 'BABDTBTDDDDDTTBAZZATTTTBADTBAFTFATFBTZTDDBAFBADZ'\nprint(len(s), set(s), s[:200])\nK = 3\nl = split(r'⟦BAD|FAT⟧', s)             # split из модуля re: режем по шаблону\ndl = len(s) + 1\nfor i in range(1, len(l) - K + 1):\n    dl = min(dl, sum(len(x) for x in l[i:i+K-1]) + K * 3)\nprint(dl)","methods":{"split":"from re import *\ns = 'BABDTBTDDDDDTTBAZZATTTTBADTBAFTFATFBTZTDDBAFBADZ'\nprint(len(s), set(s), s[:200])\nK = 3\nl = split(r'BAD|FAT', s)             # split из модуля re: режем по шаблону\ndl = len(s) + 1\nfor i in range(1, len(l) - K + 1):\n    dl = min(dl, sum(len(x) for x in l[i:i+K-1]) + K * 3)\nprint(dl)","loops":"s = 'BABDTBTDDDDDTTBAZZATTTTBADTBAFTFATFBTZTDDBAFBADZ'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    return sum(ss[k:k+3] in ('BAD', 'FAT') for k in range(len(ss) - 2)) == 3\ndl = len(s) + 1\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) < dl:\n            dl = len(ss)\nprint(dl)"},"final":"","flags":"","tree":[],"groups":0,"main":"split","norx":true,"d":3,"alias":"6651п","realAns":"10","src2":"","real":"В файле содержится строка длиной не более 10⁶ из букв английского алфавита. Определите минимальную длину подстроки, в которой ровно три тройки BAD или FAT.\nНапример, в строке SDFATFDBADZZSFATBADGHTBAD есть три подходящие подстроки FATFDBADZZSFAT, BADZZSFATBAD и FATBADGHTBAD. Минимальная длина 12.","src":"Джобс 06.06.2023","lvl":"Сложный","file":"https://kompege.ru/files/3ioHBrX2_.txt"},{"id":"7356","blk":"RW","role":"hw","like":"19254","star":false,"title":"","idea":"","note":"Пары «согласная + гласная» не налезают друг на друга, поэтому split по шаблону работает.","tr":"в учебной строке — не более 2 пар (в файле — 5)","ask":"","s":"OFDDFODFAOAOCOCFFAOADAOAOADDFFDCAAADACFFDDDOODCOC","ans":"22","tpl":"from re import *\ns = 'OFDDFODFAOAOCOCFFAOADAOAOADDFFDCAAADACFFDDDOODCOC'\nprint(len(s), set(s), s[:200])\nK = 2\nl = split(r'⟦[CDF][AO]⟧', s)\nif len(l) <= K + 1:\n    print(len(s))\nelse:\n    dl = 0\n    for i in range(len(l) - K):\n        d = sum(len(x) for x in l[i:i+K+1]) + K * 2\n        if i > 0:\n            d += 1\n        if i + K + 1 < len(l):\n            d += 1\n        dl = max(dl, d)\n    print(dl)","methods":{"split":"from re import *\ns = 'OFDDFODFAOAOCOCFFAOADAOAOADDFFDCAAADACFFDDDOODCOC'\nprint(len(s), set(s), s[:200])\nK = 2\nl = split(r'[CDF][AO]', s)\nif len(l) <= K + 1:\n    print(len(s))\nelse:\n    dl = 0\n    for i in range(len(l) - K):\n        d = sum(len(x) for x in l[i:i+K+1]) + K * 2\n        if i > 0:\n            d += 1\n        if i + K + 1 < len(l):\n            d += 1\n        dl = max(dl, d)\n    print(dl)","loops":"s = 'OFDDFODFAOAOCOCFFAOADAOAOADDFFDCAAADACFFDDDOODCOC'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    return sum(ss[k] in 'CDF' and ss[k+1] in 'AO' for k in range(len(ss) - 1)) <= 2\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) > dl:\n            dl = len(ss)\nprint(dl)"},"final":"","flags":"","tree":[],"groups":0,"main":"split","norx":true,"d":3,"alias":"","realAns":"","src2":"","real":"(Л. Шастин) Текстовый файл состоит из символов A, C, D, F и O. \nОпределите максимальное количество идущих подряд символов, среди которых не более 5 пар вида \nсогласная + гласная  в прилагаемом файле. \nДля выполнения этого задания следует написать программу.","src":"","lvl":"Средний","file":"https://kompege.ru/files/Qul_gD19y.txt"},{"id":"19489","blk":"RW","role":"hw","like":"19254","star":true,"title":"","idea":"","note":"Твой приём: сначала заменой режем строку по запрету WSFWW, потом в каждом куске — окна по WWF.","tr":"в учебной строке — WWF не более 2 раз (в файле — 120)","ask":"","s":"WFFSSFFWWFWFWWFSSFSFFFWWFWFFSFSWFWFWSWSFFWWF","ans":"35","tpl":"s = 'WFFSSFFWWFWFWWFSSFSFFFWWFWFFSFSWFWFWSWSFFWWF'\nprint(len(s), set(s), s[:200])\nwhile 'WSFWW' in s:\n    s = s.replace('WSFWW', 'WSFW SFWW')   # разрезаем запрет пробелом\nK = 2\nw = 'WWF'\ndl = 0\nfor part in s.split():\n    l = part.split(w)\n    if len(l) <= K + 1:\n        dl = max(dl, len(part))\n        continue\n    for i in range(len(l) - K):\n        d = sum(len(x) for x in l[i:i+K+1]) + K * len(w)\n        if i > 0:\n            d += len(w) - 1\n        if i + K + 1 < len(l):\n            d += ⟦len(w) - 1⟧\n        dl = max(dl, d)\nprint(dl)","methods":{"split":"s = 'WFFSSFFWWFWFWWFSSFSFFFWWFWFFSFSWFWFWSWSFFWWF'\nprint(len(s), set(s), s[:200])\nwhile 'WSFWW' in s:\n    s = s.replace('WSFWW', 'WSFW SFWW')   # разрезаем запрет пробелом\nK = 2\nw = 'WWF'\ndl = 0\nfor part in s.split():\n    l = part.split(w)\n    if len(l) <= K + 1:\n        dl = max(dl, len(part))\n        continue\n    for i in range(len(l) - K):\n        d = sum(len(x) for x in l[i:i+K+1]) + K * len(w)\n        if i > 0:\n            d += len(w) - 1\n        if i + K + 1 < len(l):\n            d += len(w) - 1\n        dl = max(dl, d)\nprint(dl)","loops":"s = 'WFFSSFFWWFWFWWFSSFSFFFWWFWFFSFSWFWFWSWSFFWWF'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    return ss.count('WWF') <= 2 and 'WSFWW' not in ss\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) > dl:\n            dl = len(ss)\nprint(dl)"},"final":"","flags":"","tree":[],"groups":0,"main":"split","norx":true,"d":4,"alias":"","realAns":"","src2":"","real":"(Л. Шастин) Текстовый файл состоит из символов F, S и W. Определите в прилагаемом файле максимальное количество идущих подряд символов, среди которых подстрока WWF встречается не более 120 раз, а подстрока WSFWW не встречается совсем.\nДля выполнения этого задания следует написать программу.","src":"","lvl":"Средний","file":"https://kompege.ru/files/Ho58arSQh.txt"},{"id":"12476","blk":"RW","role":"hw","like":"19254","star":true,"title":"","idea":"","note":"Запреты ORO и ROR убираем заменами-разрезами, дальше окна по RO в каждом куске.","tr":"в учебной строке — RO ровно 2 раза (в файле — 21)","ask":"","s":"EROEOROGGGEGEPGPGEREEPRRGRRRORGEOPOREEPROPPRE","ans":"24","tpl":"s = 'EROEOROGGGEGEPGPGEREEPRRGRRRORGEOPOREEPROPPRE'\nprint(len(s), set(s), s[:200])\nwhile 'ORO' in s or 'ROR' in s:\n    s = s.replace('ORO', 'OR RO').replace('ROR', 'RO OR')\nK = 2\nw = 'RO'\ndl = 0\nfor part in s.split():\n    l = part.split(w)\n    for i in range(len(l) - K):\n        d = sum(len(x) for x in l[i:i+K+1]) + K * len(w)\n        if i > 0:\n            d += 1\n        if i + K + 1 < len(l):\n            d += ⟦1⟧\n        dl = max(dl, d)\nprint(dl)","methods":{"split":"s = 'EROEOROGGGEGEPGPGEREEPRRGRRRORGEOPOREEPROPPRE'\nprint(len(s), set(s), s[:200])\nwhile 'ORO' in s or 'ROR' in s:\n    s = s.replace('ORO', 'OR RO').replace('ROR', 'RO OR')\nK = 2\nw = 'RO'\ndl = 0\nfor part in s.split():\n    l = part.split(w)\n    for i in range(len(l) - K):\n        d = sum(len(x) for x in l[i:i+K+1]) + K * len(w)\n        if i > 0:\n            d += 1\n        if i + K + 1 < len(l):\n            d += 1\n        dl = max(dl, d)\nprint(dl)","loops":"s = 'EROEOROGGGEGEPGPGEREEPRRGRRRORGEOPOREEPROPPRE'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    return ss.count('RO') == 2 and 'ORO' not in ss and 'ROR' not in ss\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) > dl:\n            dl = len(ss)\nprint(dl)"},"final":"","flags":"","tree":[],"groups":0,"main":"split","norx":true,"d":4,"alias":"","realAns":"814","src2":"","real":"Текстовый файл состоит из символов P, R, O, E, G – зашифрованное письмо Деду Морозу.\nОпределите в прилагаемом файле максимальное количество идущих подряд символов, среди которых комбинация символов RO встречается ровно 21 раз, а комбинации символов ORO и ROR ни разу не встречаются.","src":"PRO100 ЕГЭ 29.12.23","lvl":"Сложный","file":"https://kompege.ru/files/uleRzVuPF.txt"},{"id":"5381","blk":"RW","role":"main","like":"","star":false,"title":"","idea":"Тройки налезают друг на друга (BAB AB…), split тут ломается. Берём позиции всех троек, а окно с ровно K тройками тянется от «после начала» левой соседней тройки до «перед концом» правой.","note":"Пустые соседи: позиция −1 слева и len(s)−len(w)+1 справа — тогда край строки работает как середина, одна формула без if.","tr":"","ask":"","s":"FUDFUCUDCEFECBEDADDAEBCBBFBEFBFEAFUFCCAUDBFBFEBADBBDF","ans":"30","tpl":"from re import *\ns = 'FUDFUCUDCEFECBEDADDAEBCBBFBEFBFEAFUFCCAUDBFBFEBADBBDF'\nprint(len(s), set(s), s[:200])\np = [m.start() for m in finditer(r'⟦(?=[BCDF][AEU][BCDF])⟧', s)]   # тройки налезают — просмотр вперёд\nK = 2\np = [-1] + p + [len(s) - 3 + 1]             # «пустые» соседи за краями\nprint(p)\nprint(max(p[i+K+1] + 3 - 1 - (p[i] + 1) for i in range(len(p) - K - 1)))","methods":{"pos":"from re import *\ns = 'FUDFUCUDCEFECBEDADDAEBCBBFBEFBFEAFUFCCAUDBFBFEBADBBDF'\nprint(len(s), set(s), s[:200])\np = [m.start() for m in finditer(r'(?=[BCDF][AEU][BCDF])', s)]   # тройки налезают — просмотр вперёд\nK = 2\np = [-1] + p + [len(s) - 3 + 1]             # «пустые» соседи за краями\nprint(p)\nprint(max(p[i+K+1] + 3 - 1 - (p[i] + 1) for i in range(len(p) - K - 1)))","loops":"s = 'FUDFUCUDCEFECBEDADDAEBCBBFBEFBFEAFUFCCAUDBFBFEBADBBDF'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    return sum(ss[k] in 'BCDF' and ss[k+1] in 'AEU' and ss[k+2] in 'BCDF' for k in range(len(ss) - 2)) == 2\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) > dl:\n            dl = len(ss)\nprint(dl)"},"final":"","fl  = s.split('D')\ndl = 0\nk = 0\nfor i in range(1, len(l) - 1):            # куски МЕЖДУ двумя D\n    if l[i].count('O') <= 2:\n        k = k + len(l[i]) + 1 if k else len(l[i]) + 2\n        dl = max(dl, k)\n    else:\n        k = 0\nprint(dl)","loops":"s = 'AAOOOFFDDOOCOACFDOOODCAOOFADDDFOOFADDFODOODCFDADD'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    p = ss.split('D')\n    return len(ss) >= 2 and ss[0] == ss[-1] == 'D' and all(x.count('O') <= 2 for x in p[1:-1])\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) > dl:\n            dl = len(ss)\nprint(dl)"},"final":"","flags":"","tree":[],"groups":0,"main":"split","norx":true,"d":3,"alias":"","realAns":"","src2":"","real":"Текстовый файл содержит только буквы A, C, D, F, O. Определите длину самой длинной цепочки символов, которая начинается и заканчивается буквой D, а между двумя последовательными буквами D содержит не более двух букв O и произвольное количество других букв.","src":"","lvl":"Средний","file":"https://kompege.ru/files/RaUHQAIpd.txt"},{"id":"7199п","blk":"RW","role":"main","like":"","star":false,"title":"","idea":"Скользящее окно: правый край идёт вперёд, а если какая-то буква встретилась больше K раз — подтягиваем левый край.","note":"Регулярки — неподходящий способ: условие на каждую букву сразу. Окно проходит строку один раз.","tr":"в учебной строке — каждая буква не более 2 раз (в файле — 10)","ask":"","s":"CABDAABACECAEACEECFDCCEBEEEECCAFAADCBFBFEFEEAEDADCFCDD","ans":"9","tpl":"s = 'CABDAABACECAEACEECFDCCEBEEEECCAFAADCBFBFEFEEAEDADCFCDD'\nprint(len(s), set(s), s[:200])\nK = 2\ncnt = {}\ni = 0\ndl = 0\nfor j in range(len(s)):           # правый край окна\n    cnt[s[j]] = cnt.get(s[j], 0) + 1\n    while ⟦cnt[s[j]] > K⟧:          # слишком много — двигаем левый край\n        cnt[s[i]] -= 1\n        i += 1\n    dl = max(dl, j - i + 1)\nprint(dl)","methods":{"win":"s = 'CABDAABACECAEACEECFDCCEBEEEECCAFAADCBFBFEFEEAEDADCFCDD'\nprint(len(s), set(s), s[:200])\nK = 2\ncnt = {}\ni = 0\ndl = 0\nfor j in range(len(s)):           # правый край окна\n    cnt[s[j]] = cnt.get(s[j], 0) + 1\n    while cnt[s[j]] > K:          # слишком много — двигаем левый край\n        cnt[s[i]] -= 1\n        i += 1\n    dl = max(dl, j - i + 1)\nprint(dl)","loops":"s = 'CABDAABACECAEACEECFDCCEBEEEECCAFAADCBFBFEFEEAEDADCFCDD'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    return all(ss.count(c) <= 2 for c in set(ss))\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) > dl:\n            dl = len(ss)\nprint(dl)"},"final":"","flags":"","tree":[],"groups":0,"main":"win","norx":true,"d":4,"alias":"","realAns":"226","src2":"","real":"Определите максимальное количество идущих подряд символов, среди которых каждая из латинских букв встречается не более 10 раз.","src":"сайт К. Полякова","lvl":"","file":""},{"id":"7223п","blk":"RW","role":"hw","like":"7199п","star":false,"title":"","idea":"","note":"","tr":"","ask":"","s":"GCDDAADBEEACCCACDBEDBABCDEFGGECCBCGCCGGCGGGAGGCEEA","ans":"7","tpl":"s = 'GCDDAADBEEACCCACDBEDBABCDEFGGECCBCGCCGGCGGGAGGCEEA'\nprint(len(s), set(s), s[:200])\nK = 2\ncnt = {}\ni = 0\ndl = 0\nfor j in range(len(s)):\n    cnt[s[j]] = cnt.get(s[j], 0) + 1\n    while ⟦cnt[s[j]] > 1⟧:\n        cnt[s[i]] -= 1\n        i += 1\n    dl = max(dl, j - i + 1)\nprint(dl)","methods":{"win":"s = 'GCDDAADBEEACCCACDBEDBABCDEFGGECCBCGCCGGCGGGAGGCEEA'\nprint(len(s), set(s), s[:200])\nK = 2\ncnt = {}\ni = 0\ndl = 0\nfor j in range(len(s)):\n    cnt[s[j]] = cnt.get(s[j], 0) + 1\n    while cnt[s[j]] > 1:\n        cnt[s[i]] -= 1\n        i += 1\n    dl = max(dl, j - i + 1)\nprint(dl)","loops":"s = 'GCDDAADBEEACCCACDBEDBABCDEFGGECCBCGCCGGCGGGAGGCEEA'\nprint(len(s), set(s), s[:200])\ndef ok(ss):\n    return len(set(ss)) == len(ss)\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ok(ss) and len(ss) >
