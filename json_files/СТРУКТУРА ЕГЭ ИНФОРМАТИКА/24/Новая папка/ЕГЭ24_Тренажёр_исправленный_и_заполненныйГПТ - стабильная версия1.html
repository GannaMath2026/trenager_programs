=== A1 | A | 1 | split | 5 | Самая длинная серия без буквы A
real:
Текстовый файл состоит из заглавных латинских букв. Определите максимальное количество идущих подряд символов, среди которых нет буквы A.
idea:
Буква A — «стена». Если разрезать строку по A, между стенами останутся куски без A. Самый длинный кусок — ответ.
note:
split('A') даёт и пустые куски (когда A стоят рядом или на краю строки). Их длина 0, на максимум они не влияют.
code:
s='ABCCDABEEEFAGGA'
l=⟦s.split('A')⟧
print(⟦max(len(c) for c in l)⟧)

=== A2 | A | 2 | split | 5 | Нет пары AB
real:
Текстовый файл состоит из заглавных латинских букв A, B, C. Определите максимальное количество идущих подряд символов, среди которых нет пары AB (буква A, сразу за ней буква B).
idea:
Запрещён кусок «AB». Разрежем строку прямо внутри него — вставим пробел между A и B. Запрещённых пар не останется, а буквы не пропадут. Дальше режем по пробелу и берём самый длинный кусок.
note:
Вставляй разрез, а не стирай символы: 'AB' → 'A B'. Пробел — служебный символ: в данных его нет, поэтому он безопасен как разделитель.
code:
s='CABBCABABCCCABCAB'
s=⟦s.replace('AB','A B')⟧
l=s.split(⟦' '⟧)
print(max(len(c) for c in l))

=== 18285 | A | 3 | split | 4 | Арифметическое выражение: сколько чисел
real:
Текстовый файл состоит из десятичных цифр и знаков «+» и «*». Рассматриваются непрерывные последовательности символов, которые являются корректными арифметическими выражениями с целыми положительными числами. Никакие два знака не стоят рядом, в записи чисел нет ведущих нулей. Определите максимальное количество чисел, входящих в одну из таких последовательностей.
idea:
Для подсчёта чисел «+» и «*» одинаковы — заменим «*» на «+». Плохие места: два знака подряд и число, начинающееся с 0. Заменим их пробелами и разрежем по пробелам: каждый кусок — самое длинное корректное выражение. Чисел в куске на одно больше, чем знаков.
note:
replace не видит наложений, поэтому повторяем замену в цикле while, пока плохое сочетание остаётся. Если файл начинается с нуля, этот способ его не отрежет — проверь s[0] отдельно.
code:
s='4+15*7+0+3*22++8*9+10*3'
s=s.replace('*','+')
while ⟦'++'⟧ in s: s=s.replace(⟦'++'⟧,' ')
while ⟦'+0'⟧ in s: s=s.replace(⟦'+0'⟧,' ')
s=s.split()
ss=[len(c.strip('+').split('+')) for c in s]
print(max(ss))

=== 7998 | A | 4 | split | 13 | Цепочка чисел с палиндромом
real:
Текстовый файл состоит из десятичных цифр и знаков равенства «=». Определите максимальную длину последовательности вида «число1=число2=число3=...=числоN», в которой нет двух знаков «=» подряд и есть хотя бы одно трёхзначное число-палиндром. В ответе укажите количество символов.
idea:
Два «=» подряд обрывают цепочку — режем строку по '=='. Каждый кусок — готовая цепочка. Внутри куска разбиваем по '=' на числа и ищем трёхзначный палиндром. Если он есть — длина куска кандидат на ответ (весь кусок, а не его часть, ведь больше — лучше).
note:
После split('==') у куска могут остаться '=' по краям (если было '==='), поэтому strip('='). Самый длинный кусок без палиндрома в ответ не годится — на это и ловушка в строке.
code:
s='12=343=5=6==99=1221=7=808==4=505=13=44==70=121==1234=567=89=1000=2345'
dl=0
for ch in s.⟦split('==')⟧:
    ch=ch.⟦strip('=')⟧
    if any(len(c)==3 and ⟦c==c[::-1]⟧ for c in ch.split('=')):
        dl=max(dl,len(ch))
print(dl)

=== B1 | B | 1 | one | 6 | Самая длинная серия одинаковых
real:
Текстовый файл состоит из заглавных латинских букв. Определите максимальное количество идущих подряд одинаковых символов.
idea:
Идём слева направо. Если символ равен предыдущему — серия растёт (k+1), иначе начинается заново (k=1). После каждого шага запоминаем максимум.
note:
Начальное k=1: один символ — уже серия длины 1. Максимум обновляй на каждом шаге, иначе потеряешь последнюю серию.
code:
s='AABBBBCDDDAAAAAAB'
k=1
dl=1
for i in range(1,len(s)):
    if s[i]==⟦s[i-1]⟧: k=⟦k+1⟧
    else: k=⟦1⟧
    dl=max(dl,k)
print(dl)

=== B2 | B | 2 | one | 6 | Соседние символы различны
real:
Текстовый файл состоит из заглавных латинских букв. Определите максимальную длину подпоследовательности идущих подряд символов, в которой никакие два соседних символа не равны.
idea:
Тот же проход со счётчиком, но условие продолжения обратное: следующий символ ОТЛИЧАЕТСЯ от предыдущего — k растёт; равные соседи — серия обрывается, k=1.
note:
Сравнивается только пара «текущий — предыдущий»; весь отрезок целиком проверять не надо.
code:
s='ABABBACACCADADA'
k=1
dl=1
for i in range(1,len(s)):
    if s[i]⟦!=⟧s[i-1]: ⟦k+=1⟧
    else: k=1
    dl=max(dl,k)
print(dl)

=== B3 | B | 3 | one | 8 | Буквы и цифры строго чередуются
real:
Текстовый файл состоит из заглавных латинских букв и цифр. Определите максимальную длину подпоследовательности идущих подряд символов, в которой буквы и цифры строго чередуются (две цифры или две буквы рядом стоять не могут).
idea:
Проход со счётчиком. Нужно сравнивать не сами символы, а их ТИП: s[i].isdigit() — это True/False. Тип изменился относительно предыдущего — серия растёт.
note:
isdigit() возвращает True для цифры и False для буквы, а значит два значения можно сравнивать через != — типы разные.
code:
s='A1B2C33D4E5F6GG7H8'
k=1
dl=1
for i in range(1,len(s)):
    if s[i].isdigit() ⟦!=⟧ s[i-1].isdigit(): k+=1
    else: ⟦k=1⟧
    dl=max(dl,k)
print(dl)

=== 4409 | C | 1 | loops | 4 | Комбинации CB*BC
real:
Текстовый файл состоит из заглавных латинских букв. Определите, сколько раз встречается комбинация вида CB*BC, где на месте «*» стоит любая буква, кроме A, B и F. В ответе укажите количество комбинаций.
idea:
Длина комбинации фиксирована — 5 символов. Берём срез s[i:i+5] для каждого i и проверяем: начало CB, конец BC, а средняя буква не из запрещённых.
note:
Последний срез начинается на 4 символа раньше конца — поэтому range(len(s)-4).
code:
s='CBCBCCBDBCACBEBCCBFBCCBCBC'
k=0
for i in range(len(s)-4):
    ss=s[i:i+⟦5⟧]
    if ss[:2]==⟦'CB'⟧ and ss[3:]==⟦'BC'⟧ and ss[2] ⟦not in 'ABF'⟧:
        k+=1
print(k)

=== C2 | C | 2 | loops | 8 | Не более двух букв A
real:
Текстовый файл состоит из заглавных латинских букв. Определите максимальную длину подстроки, в которой не более двух букв A.
idea:
Перебираем начало i и растим конец j. Пока букв A не больше двух — подстрока подходит, запоминаем длину. Как только стало больше — дальше будет только хуже: break.
note:
j=i+l+1 — начинаем сразу с длины на 1 больше найденной: короче или равные подстроки уже не улучшат ответ.
code:
s='BCAADBCACCBAAEBCA'
def usl(s): return ⟦s.count('A')<=2⟧
l=0
for i in range(len(s)):
    j=i+l+1
    while j<=len(s):
        ss=s[i:j]
        if usl(ss):
            l=⟦len(ss)⟧
        else: ⟦break⟧
        j+=1
print(l)

=== 17563 | C | 3 | loops | 9 | Правильное выражение из -, * и цифр
real:
Текстовый файл состоит из знаков «–», «*» и цифр 0, 7, 8, 9. Определите максимальное количество идущих подряд символов, образующих математически правильное выражение: два знака не стоят рядом, числа записаны без незначащих нулей (число не начинается с 0), выражение начинается и заканчивается числом.
idea:
Запреты вида «не содержит»: два знака рядом, знак и сразу 0, начало с знака или с 0. Такое плохое сочетание не исчезает при удлинении — можно break. А вот «заканчивается цифрой» может снова стать верным при удлинении, поэтому проверяем его отдельно внутри if.
note:
Окончание знаком НЕ запрещает расти дальше: 'ss[-1] not in' стоит перед l=len(ss), а не внутри usl, иначе break сработает слишком рано.
code:
s='9*80-7--9*0-78*90-8*9'
def usl(s): return s[0] not in '*-0' and all(c not in s for c in ⟦['**','--','*-','-*','-0','*0']⟧)
l=1
for i in range(len(s)):
    j=i+l+1
    while j<=len(s):
        ss=s[i:j]
        if usl(ss):
            if ⟦ss[-1] not in '*-'⟧: l=len(ss)
        else: break
        j+=1
print(l)

=== 18619 | C | 4 | loops | 11 | B и выражение после неё
real:
Текстовый файл состоит из цифр от 1 до 6, знаков «–», «*» и заглавных букв A, B, C, D. Определите максимальное количество символов в непрерывной последовательности, состоящей из буквы B и следующего сразу за ней корректного арифметического выражения с неотрицательными числами (два знака подряд не стоят). Буква B входит в длину.
idea:
Подстрока обязана начинаться с B, сразу после B — не знак, дальше нет букв и нет двух знаков рядом. Все эти запреты — «не содержит», при удлинении не исчезают, значит break законен. Заканчиваться подстрока должна цифрой — это проверяем внутри if.
note:
l начинаем с 1, потому что в usl есть s[1]: у подстроки должно быть минимум 2 символа. Буква B допустима только на первом месте, поэтому её тоже ищем в s[1:].
code:
s='AB23*5-4CB6**2B-3*1B4-2*35-6*1DB5*4-A'
def usl(s): return s[0]=='B' and s[1] ⟦not in '*-'⟧ and all(c not in s[1:] for c in ⟦['A','B','C','D','--','**','*-','-*']⟧)
l=1
for i in range(len(s)):
    j=i+l+1
    while j<=len(s):
        ss=s[i:j]
        if usl(ss):
            if ss[-1] not in '*-': l=len(ss)
        else: break
        j+=1
print(l)

=== D1 | D | 2 | prefix | 9 | Ровно две буквы Z
real:
Текстовый файл состоит из заглавных латинских букв. Определите максимальную длину подстроки, содержащей ровно две буквы Z.
idea:
Заведём массив p: p[i] — сколько букв Z среди первых i символов. Тогда в подстроке s[i:j] их p[j]-p[i] — одно вычитание вместо подсчёта по срезу. Больше K — break, ровно K — запоминаем длину.
note:
Массив p на один элемент длиннее строки: p[0]=0 — «до начала ничего нет». Срезу s[i:j] соответствует p[j]-p[i].
code:
s='XZXXZXXXZZXXZXZXXXX'
K=2
p=[0]*(len(s)+1)
for i in range(len(s)):
    p[i+1]=p[i]+⟦(s[i]=='Z')⟧
l=0
for i in range(len(s)):
    j=i+l+1
    while j<=len(s):
        if p[j]-⟦p[i]⟧>K: ⟦break⟧
        if p[j]-p[i]==K: l=⟦j-i⟧
        j+=1
print(l)

=== D2 | D | 3 | prefix | 14 | Ровно 2 смены символа
real:
Текстовый файл состоит из заглавных латинских букв. Определите максимальную длину подстроки, в которой соседние символы различаются ровно в двух местах (то есть подстрока состоит ровно из трёх серий одинаковых букв).
idea:
В pr[k] накапливаем число смен соседних символов от начала строки до позиции k. Смен внутри s[i:j] будет pr[j-1]-pr[i]: смена на самой позиции i относится к паре (i-1, i) и в подстроку не входит.
note:
В этом массиве нет лишнего нулевого элемента, поэтому правая граница j-1, а не j. Открой визуализатор префиксов 🔬 и выбери правило «число смен символа» — увидишь, откуда берётся сдвиг на единицу.
code:
s='AAABBBBBCCDDDDDDDAAA'
K=2
pr=[0]*len(s)
for k in range(1,len(s)):
    pr[k]=pr[k-1]+⟦(s[k]!=s[k-1])⟧
l=0
for i in range(len(s)):
    j=i+l+1
    while j<=len(s):
        if pr[j-1]-pr[i]>K: break
        if pr[j-1]-⟦pr[i]⟧==K: l=⟦j-i⟧
        j+=1
print(l)

=== D3 | D | 4 | prefix | 12 | Букв A и B поровну
real:
Текстовый файл состоит только из букв A и B. Определите максимальную длину подстроки, в которой букв A и B поровну.
idea:
Считаем баланс b: A даёт +1, B даёт −1. Если баланс в двух позициях одинаковый — между ними букв A и B поровну. Чем раньше мы впервые увидели это значение, тем длиннее подстрока, поэтому запоминаем только ПЕРВОЕ появление каждого баланса.
note:
Слово first={0:0} — стартовый баланс 0 до начала строки. Позиции префиксов нумеруем с 1 (i+1), как в массиве p.
code:
s='AAABBABBBBAAB'
b=0
first={0:0}
dl=0
for i in range(len(s)):
    if s[i]=='A': b+=⟦1⟧
    else: b-=1
    if b in first: dl=max(dl,⟦i+1-first[b]⟧)
    else: first[b]=⟦i+1⟧
print(dl)

=== E1 | E | 2 | two | 6 | Сумма цифр не больше K
real:
Текстовый файл состоит из десятичных цифр. Определите максимальную длину подстроки, сумма цифр которой не превышает 6.
idea:
Два указателя: l и r. Двигаем r вправо и добавляем цифру в сумму. Если сумма стала больше K — двигаем l вправо и вычитаем цифры, пока не станет не больше K. Длина окна r-l+1 — кандидат на ответ.
note:
Этот способ работает, потому что цифры неотрицательны: при сжатии окна слева сумма не растёт.
code:
s='1203004120105'
K=6
l=0
sm=0
dl=0
for r in range(len(s)):
    sm+=⟦int(s[r])⟧
    while ⟦sm>K⟧:
        sm-=int(s[l])
        l+=1
    dl=max(dl,⟦r-l+1⟧)
print(dl)

=== E2 | E | 3 | two | 7 | Не более двух различных символов
real:
Текстовый файл состоит из заглавных латинских букв. Определите максимальную длину подстроки, содержащей не более двух различных символов.
idea:
В окне ведём словарь d: буква → сколько раз она в окне. Различных букв — len(d). Если стало больше двух — сжимаем слева: уменьшаем счётчик буквы, а когда он стал 0 — удаляем ключ.
note:
Ключ со счётчиком 0 обязательно удаляем (del), иначе len(d) будет считать буквы, которых в окне уже нет.
code:
s='AABBABCCBCBCDDCDC'
d={}
l=0
dl=0
for r in range(len(s)):
    d[s[r]]=d.get(s[r],0)+1
    while ⟦len(d)>2⟧:
        d[s[l]]-=1
        if d[s[l]]==0: ⟦del d[s[l]]⟧
        l+=1
    dl=max(dl,r-l+1)
print(dl)

=== E3 | E | 4 | two | 8 | Каждая буква не более двух раз
real:
Текстовый файл состоит из заглавных латинских букв. Определите максимальную длину подстроки, в которой каждая буква встречается не более двух раз.
idea:
Снова словарь счётчиков. Портить окно может только что добавленная буква — если её стало 3, сжимаем слева, пока счётчик этой буквы снова не станет 2. Остальные буквы и так были в норме.
note:
Условие в while проверяем только для s[r]. Сжимаем окно слева: каждый раз уменьшаем счётчик буквы s[l] и сдвигаем l.
code:
s='ABABCACCBBDADD'
d={}
l=0
dl=0
for r in range(len(s)):
    d[s[r]]=d.get(s[r],0)+1
    while ⟦d[s[r]]>2⟧:
        d[s[l]]-=1
        l+=1
    dl=max(dl,r-l+1)
print(dl)

=== F1 | F | 3 | dp | 7 | Сначала A, потом B
real:
Текстовый файл состоит из букв A и B. Определите максимальную длину подстроки вида AA…ABB…B: сначала одна или несколько букв A, затем одна или несколько букв B.
idea:
Для каждой позиции считаем два числа. a[i] — сколько букв A подряд заканчивается в i. b[i] — сколько букв B подряд начинается в i. Подстрока «A…AB…B» делится на стыке между i и i+1: ответ — максимум a[i]+b[i+1], где обе части непустые.
note:
b считаем справа налево: значение b[i] берётся из уже готового b[i+1]. Если стык не «A→B», одно из слагаемых равно 0 и такой стык не рассматриваем.
code:
s='AABAAABBBBABBAAB'
n=len(s)
a=[0]*n
b=[0]*n
for i in range(n):
    if s[i]=='A': a[i]=⟦a[i-1]+1 if i>0 else 1⟧
for i in range(n-1,-1,-1):
    if s[i]=='B': b[i]=⟦b[i+1]+1 if i<n-1 else 1⟧
dl=0
for i in range(n-1):
    if a[i]>0 and b[i+1]>0: dl=max(dl,⟦a[i]+b[i+1]⟧)
print(dl)

=== 14704 | F | 4 | dp | 7 | Сначала по алфавиту, потом в обратном порядке
real:
В файле содержится строка из заглавных латинских букв. Определите максимальную длину подстроки, которая состоит из двух последовательных частей: в первой символы расположены в алфавитном порядке (каждый следующий не меньше предыдущего), во второй — в обратном алфавитном порядке (каждый следующий не больше предыдущего). Части могут быть разной длины. Например, для QTUHHMSMJFSMECQ ответ 7: HHMS + MJF.
idea:
lef[i] — длина неубывающей серии, которая ЗАКАНЧИВАЕТСЯ в i. rig[i] — длина невозрастающей серии, которая НАЧИНАЕТСЯ в i. Стык между i и i+1 даёт подстроку длиной lef[i]+rig[i+1]; берём максимум по всем стыкам.
note:
rig считаем справа налево: range(n-2,-1,-1). На стыке символы можно не сравнивать: части независимы.
code:
s='QTUHHMSMJFSMECQ'
n=len(s)
lef=[1]*n
rig=[1]*n
for i in range(1,n):
    if s[i]>=s[i-1]: lef[i]=⟦lef[i-1]+1⟧
for i in range(n-2,-1,-1):
    if s[i]>=s[i+1]: rig[i]=⟦rig[i+1]+1⟧
print(max(⟦lef[i]+rig[i+1]⟧ for i in range(n-1)))
</script>

<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let S='',rule='chg',X='A',Y='B',K=2,mode='eq',tab=1,st=0,A=null,ev=[],ci=null,cj=null,timer=null,speed=550,capped=false;
const PRE=[['Смены, ровно 2',{S:'AAABBBBBCCDDDDDDDAAA',rule:'chg',K:2,mode:'eq'}],['Букв Z ровно 2',{S:'XZXXZXXXZZXXZXZXXXX',rule:'cnt',X:'Z',K:2,mode:'eq'}],['Сумма цифр ≤ 6',{S:'1203004120105',rule:'sum',K:6,mode:'le'}],['Баланс A и B',{S:'AAABBABBBBAAB',rule:'bal',X:'A',Y:'B'}]];

function direct(i,j){let v=0;for(let k=i;k<j;k++){if(rule==='chg'){if(k>i&&S[k]!==S[k-1])v++;}else v+=contrib(k);}return v;}
function sim(){ev=[];capped=false;let l=0,best=null,checks=0;const n=A.n,T=rule==='bal'?0:K;

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function normX(x) { x.st = x.st || 'new'; x.wrong = x.wrong || []; ['tries', 'hint', 't', 'runs', 'dbg'].forEach(k => { if (x[k] == null) x[k] = 0; }); return x; }
function loadDB() {
  let saved = null, local = null;
  try { const el = document.getElementById('saved-state'); const t = el && el.textContent.trim(); if (t && t !== '{}') saved = JSON.parse(t); } catch (e) {}
  try { const t = lsGet(LSKEY); if (t) local = JSON.parse(t); } catch (e) {}
  const clr = +(lsGet(LSCLR) || 0), db = blankDB(); let tu = -1;
  [saved, local].forEach(src => {
    if (!src) return;
    if (src.teacher && (src.teacherUpdated || 0) >= tu) { db.teacher = Object.assign(blankDB().teacher, src.teacher); db.flags = src.flags || {}; tu = src.teacherUpdated || 0; }
    Object.values(src.students || {}).forEach(s => { if (src === saved && (s.updated || 0) <= clr) return; const c = db.students[s.name]; if (!c || (s.updated || 0) > (c.updated || 0)) db.students[s.name] = s; });
    if (src.last) db.last = src.last; if (src.theme) db.theme = src.theme;
  });
  db.teacherUpdated = Math.max(0, tu);
  Object.values(db.students).forEach(s => { s.tasks = s.tasks || {}; Object.values(s.tasks).forEach(normX); s.days = s.days || []; s.totalMs = s.totalMs || 0; });
  return db;
}
let DB = loadDB(), dirty = false, saveT = null, lsWarned = false;
function persist() { dirty = true; clearTimeout(saveT); saveT = setTimeout(writeLS, 300); }
function compactDB() {
  const d = JSON.parse(JSON.stringify(DB));
  Object.values(d.students).forEach(s => {
    Object.keys(s.tasks).forEach(n => { const x = s.tasks[n];
      if (x.wrong && x.wrong.length > 8) x.wrong = x.wrong.slice(-8);
      if (x.code && x.code.length > 4000) x.code = x.code.slice(0, 4000);
      if (x.t) x.t = Math.round(x.t / 1000) * 1000;
      if (x.st === 'new' && !(x.wrong || []).length && !x.tries && !x.hint && !x.code && !x.real && !x.runs) { delete s.tasks[n]; return; }
      ['tries', 'hint', 't', 'runs', 'dbg'].forEach(k => { if (!x[k]) delete x[k]; }); if (x.wrong && !x.wrong.length) delete x.wrong; });
    if (s.days.length > 90) s.days = s.days.slice(-90);
  });
  Object.keys(d.flags).forEach(k => { const f = d.flags[k]; if (!f.hw && !f.fav) delete d.flags[k]; });
  return d;
}
function writeLS() { clearTimeout(saveT);
  try { localStorage.setItem(LSKEY, JSON.stringify(compactDB())); lsWarned = false; }
  catch (e) { if (!lsWarned) { lsWarned = true; toast('⚠️ Память браузера переполнена. Сохрани файл (💾), затем «🧹 Очистить прогресс» у учителя.', 6000); } } }
function lsUsage() { let all = 0, mine = 0; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i), v = localStorage.getItem(k) || ''; all += (k.length + v.length) * 2; if (k.startsWith(LSKEY)) mine += (k.length + v.length) * 2; } } catch (e) {} return {all, mine}; }
const kb = b => b < 1024 ? b + ' Б' : b < 1048576 ? (b / 1024).toFixed(1).replace('.', ',') + ' КБ' : (b / 1048576).toFixed(2).replace('.', ',') + ' МБ';
function storeBox() { const u = lsUsage(); return `<div class="store">💽 Тренажёр занимает в браузере <b>${kb(u.mine)}</b> · все сайты этого адреса: ${kb(u.all)} из ~5 МБ<i><b style="width:${Math.min(100, u.all / 5242880 * 100).toFixed(1)}%"></b></i></div>`; }

function confetti() {

  const g = c.getContext('2d'), P = Array.from({length: 110}, () => ({x: innerWidth / 2, y: innerHeight / 3, vx: (Math.random() - .5) * 16, vy: Math.random() * -12 - 3, c: ['#4f6bff', '#7b5cff', '#16a36a', '#ffd666', '#ff8a00', '#e5484d'][Math.random() * 6 | 0], r: Math.random() * 6 + 3}));

const BTH = {
  A: [['s.replace(\'AB\', \'A B\')', 'вставляем разрез внутрь запрещённой пары: буквы не пропадают, а пары больше нет'], ['s.split(\' \')', 'куски между разрезами — готовые кандидаты на ответ'], ['while \'++\' in s: s=s.replace(...)', 'replace не видит налезающих вхождений — повторяем, пока плохое место остаётся'], ['strip(\'=\')', 'после split по краям могут остаться лишние символы-разделители']],
  B: [['k = 1', 'один символ — уже серия длины 1'], ['s[i] == s[i-1]', 'сравниваем только соседей: растёт k или начинается заново (k = 1)'], ['dl = max(dl, k)', 'максимум обновляем на каждом шаге, иначе потеряем последнюю серию'], ['s[i].isdigit() != s[i-1].isdigit()', 'сравнивать можно не символы, а их тип (True/False)']],
  C: [['i, j', 'i — начало, j — конец среза (s[j] в срез не входит)'], ['j = i + l + 1', 'сразу смотрим на длину больше найденной — короче нет смысла'], ['break', 'выходим, когда плохое уже не исправить удлинением'], ['условие в if', 'если «хорошо» может вернуться при удлинении (оканчивается цифрой) — проверяем внутри if, а не в usl']],
  D: [['p[i+1] = p[i] + c', 'p[i] — сколько нужного среди первых i символов'], ['p[j] − p[i]', 'значение на срезе s[i:j] за одно вычитание'], ['баланс +1 / −1', 'одинаковый баланс в двух местах — между ними поровну; храним первое появление'], ['сдвиг для смен', 'смена на первой позиции среза лежит вне среза: p[j-1] − p[i]']],
  E: [['l, r', 'границы окна; r двигаем всегда, l — только пока окно плохое'], ['sm += int(s[r]); sm -= int(s[l])', 'сумма обновляется за O(1), без пересчёта окна'], ['d[s[r]] += 1; del d[x]', 'словарь счётчиков; ключ с нулём удаляем, иначе len(d) врёт'], ['r − l + 1', 'длина окна — кандидат на ответ']],

function hlText(text, spans) {
  const cls = Array(text.length).fill(-1);
  spans.forEach((sp, k) => { for (let i = sp[0]; i < sp[1]; i++) cls[i] = k; });
  let h = '', i = 0;
  while (i < text.length) {
    let j = i; while (j < text.length && cls[j] === cls[i]) j++;
    const piece = esc(text.slice(i, j)).replace(/\n/g, '<span class="nl">↵</span>\n');
    h += cls[i] >= 0 ? `<mark class="m${cls[i] % 2}">${piece}</mark>` : piece; i = j;
  }
  return h;
}

/* ===== Пояснения к строкам кода ===== */
function lineNotes(code, t) {
  const ng = t ? t.groups : 0;
  return code.split('\n').map(line => {
    const L = line.trim(); let d = '';
    if (/^from re import \*/.test(L)) d = 'подключаем все функции модуля re: findall, finditer, search, fullmatch, split, sub';
    else if (/^s = '/.test(L)) d = /\\n/.test(L) ? 'учебный текст из нескольких строк (\\n — перевод строки). На экзамене: s = open(\'24.txt\').read()' : 'учебная строка. На экзамене: s = open(\'24.txt\').readline().strip()';
    else if (/^print\(len\(s\), set\(s\)/.test(L)) d = 'проверка: длина строки, какие символы в ней есть, начало строки';
    else if (/^num = r'/.test(L)) d = 'кусок шаблона «одно число» — подставим его в выражение через f-строку';
    else if (/^pattern = rf'/.test(L)) d = 'f-строка: вместо {num} Python подставит шаблон числа';
    else if (/^pattern = r'/.test(L)) d = 'сама регулярка. r перед кавычкой — «сырая» строка: \\d, \\1 остаются как есть';
    else if (/^pattern = f'\(\?=\(\{pattern\}\)\)'/.test(L)) d = 'обёртка: просмотр вперёд — поиск с КАЖДОЙ позиции (с перекрытиями). Весь кусок попадает в группу 1, группы внутри шаблона сдвигаются: начинаются с 2';
    else if (/^l = findall\(pattern, s, M\)/.test(L)) d = 'findall с флагом M: ^ и $ — начало и конец каждой строки; одно совпадение — одна строка';
    else if (/^l = findall\(pattern, s\)/.test(L)) d = ng === 0 ? 'findall — список всех найденных кусков (без перекрытий: поиск продолжается с конца найденного)' : ng === 1 ? 'в шаблоне одна группа — findall вернёт список её содержимого' : 'в шаблоне ' + ng + ' групп(ы) — findall вернёт список кортежей (группа1, группа2, …)';
    else if (/^l = \[c\[0\] for c in l\]/.test(L)) d = 'из каждого кортежа берём c[0] — группу 1, то есть весь найденный кусок';
    else if (/^l = \[m\.group\(\) for m in finditer/.test(L)) d = 'finditer выдаёт объекты-совпадения; m.group() — весь найденный кусок, даже если в шаблоне есть группы';
    else if (/^maxs = max\(l, key=len\)/.test(L)) d = 'самый длинный элемент списка (key=len — сравниваем по длине, а не по алфавиту)';
    else if (/^mins = min\(l, key=len\)/.test(L)) d = 'самый короткий элемент списка';
    else if (/^print\(len\(maxs\) \/\/ (\d)\)/.test(L)) d = 'длина куска, делённая на ' + /\/\/ (\d)/.exec(L)[1] + ' — количество блоков; это ответ';
    else if (/^print\(len\((maxs|mins)\)\)/.test(L)) d = 'длина найденного куска — ответ';
    else if (/^print\(len\(l\)\)/.test(L)) d = 'сколько найдено — длина списка; это ответ';
    else if (/^print\((maxs|mins), l\)/.test(L)) d = 'проверка глазами: сам кусок и весь список найденного';
    else if (/^print\(l\)/.test(L)) d = 'весь список найденного — для проверки';
    else if (/^l = \[c\[1\] for c in l\]/.test(L)) d = 'из каждого кортежа берём c[1] — группу 2 (букву в середине)';
    else if (/^l = \[\(l\.count\(c\), c\)/.test(L)) d = 'для каждой буквы — пара (сколько раз встретилась, буква)';
    else if (/^k, c = max\(l\)/.test(L)) d = 'самая частая буква: max сравнивает пары сначала по количеству';
    else if (/eval\(ss, \{"__builtins__": \{\}\}\)/.test(L)) d = 'fullmatch пропускает только цифры и знаки, а eval без встроенных функций ({"__builtins__": {}}) не может вызвать ничего постороннего — считаем значение выражения безопасно';
    else if (/^def calc\(/.test(L)) d = 'своя функция вместо eval: делим по + на слагаемые, каждое по * на множители — так соблюдается приоритет умножения';
    else if (/^p = \[-1\] \+ p \+/.test(L)) d = '«пустые» соседи за краями строки: тогда начало и конец строки работают как обычная середина — одна формула без if';
    else if (/^l = s\.split\(w\)/.test(L)) d = 'режем строку по слову: между соседними кусками стоит ровно одно слово';
    else if (/^for (part|x) in /.test(L) && /split/.test(L)) d = 'перебираем куски после разрезания';
    else if (/#/.test(L)) d = L.slice(L.indexOf('#') + 1).trim();
    return {line, d};
  });
}

ap:6px;align-items:center;flex-wrap:wrap\">\n   \u003cbutton class=\"g\" id=\"b0\">⏮\u003c/button>\u003cbutton class=\"g\" id=\"bP\">◀\u003c/button>\u003cbutton id=\"bN\">▶\u003c/button>\u003cbutton class=\"g\" id=\"bE\">⏭\u003c/button>\n   \u003cbutton class=\"g\" id=\"bPl\">⏯ Авто\u003c/button>\u003cspan id=\"stepInfo\" class=\"muted\">\u003c/span>\u003c/div>\n  \u003cinput type=\"range\" id=\"sl\" min=\"0\" max=\"0\" value=\"0\" style=\"margin-top:8px\">\u003c/div>\n \u003cdiv class=\"card\">\u003ch3>Строка и префиксные суммы смен\u003c/h3>\u003cdiv id=\"cells\" class=\"cells\">\u003c/div>\u003cdiv id=\"note\" class=\"note\">\u003c/div>\u003c/div>\n \u003cdiv class=\"card\">\u003ch3>Во что превратилась рассматриваемая строка (серии одинаковых символов)\u003c/h3>\u003cdiv id=\"runs\">\u003c/div>\u003c/div>\n \u003cdiv class=\"card\">\u003ch3>Найденные строки (клик — показать на исходной)\u003c/h3>\u003cdiv id=\"found\" class=\"muted\">Пока ничего не найдено\u003c/div>\u003c/div>\n \u003cdiv class=\"card\">\u003ch3>Переменные на этом шаге\u003c/h3>\u003cdiv id=\"vars\">\u003c/div>\u003c/div>\n\u003c/div>\u003c/main>\n\u003cscript src=\"https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js\">\u003c/script>\n\u003cscript>\nconst DEFAULT=`s='AAABBBBBCCDDDDDDDAAA'\nK=2   # допустимое число смен символов\n# Префиксные суммы смен символов\npr=[0]*len(s)\nfor k in range(1,len(s)):\n    pr[k]=pr[k-1]+(s[k]!=s[k-1])\nl=0\nfor i in range(len(s)):\n    j=i+l+1\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if pr[j-1]-pr[i]>K: break      # ПЛОХО: смен больше K\n        if pr[j-1]-pr[i]==K:           # ХОРОШО: ровно K смен\n            l=len(ss)\n            print(i,l,ss)\n        j+=1                           # в любом случае расширяем\nprint('Ответ:',l)`;\nconst PYRUN=`\nimport sys, json, io\ndef _ser(v,d=0):\n    if isinstance(v,(bool,int,float)): return v\n    if isinstance(v,str): return v[:300]\n    if isinstance(v,(list,tuple)) and d==0 and len(v)\u003c=300 and all(isinstance(x,(bool,int,float,str)) for x in v): return list(v)\n    return repr(v)[:60]\ndef _snap(g):\n    return {k:_ser(v) for k,v in g.items() if not k.startswith('__') and not callable(v) and not hasattr(v,'__spec__')}\ndef run_user(code):\n    buf=io.StringIO(); steps=[]; g={'__name__':'__main__'}; err=None\n    def tr(frame,ev,arg):\n        if frame.f_code.co_filename!='\u003cuser>': return None\n        if ev=='line' and len(steps)\u003c20000:\n            steps.append([frame.f_lineno,_snap(frame.f_globals),len(buf.getvalue())])\n        return tr\n    old=sys.stdout; sys.stdout=buf\n    try:\n        sys.settrace(tr); exec(compile(code,'\u003cuser>','exec'),g)\n    except BaseException as e: err=repr(e)\n    finally: sys.settrace(None); sys.stdout=old\n    return json.dumps({'steps':steps,'out':buf.getvalue(),'err':err})\n`;\nlet py,code=DEFAULT,T=null,cur=0,selLine=null,focus=null,timer=null,editing=false;\nconst $=id=>document.getElementById(id);\nconst esc=s=>String(s).replace(/[&\u003c>]/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;'}[c]));\n$('ta').value=code;\nasync function init(){py=await loadPyodide();py.runPython(PYRUN);$('status').textContent='Python готов';run();}\nfunction run(){\n if(!py)return; if(editing)toggleEdit();\n const r=JSON.parse(py.globals.get('run_user')(code));T=r;T.lines=r.out.split('\\n');\n cur=0;selLine=null;focus=null;$('sl').max=Math.max(0,r.steps.length-1);$('sl').value=0;\n $('out').innerHTML=esc(r.out)+(r.err?'\u003cdiv class=\"err\">'+esc(r.err)+'\u003c/div>':'');\n $('status').textContent='Шагов: '+r.steps.length;render();\n}\nfunction toggleEdit(){editing=!editing;if(!editing)code=$('ta').value;\n $('ta').style.display=editing?'block':'none';$('code').style.display=editing?'none':'block';\n $('bEdit').textContent=editing?'✔ Готово':'✏️ Редактировать код';if(!editing)run();}\n// какие значения были найдены к шагу k\nfunction foundUpTo(k){\n const n=T.steps.length?(k+1\u003cT.steps.length?T.steps[k+1][2]:T.out.le d(k=>Array.isArray(V[k])&&V[k].length==S.length&&V[k].every(x=>typeof x=='number'));\n const P=pName?V[pName]:null;\n const i=Number.isInteger(V.i)?V.i:null,j=Number.isInteger(V.j)?V.j:null;\n const F=foundUpTo(cur);const fo=focus!=null?F[focus]:null;\n let h='';\n for(let c=0;c\u003cS.length;c++){\n  let cl='c';\n  if(fo&&c>=fo.i&&c\u003cfo.i+fo.l)cl+=' fnd';\n  else if(!fo&&i!=null&&j!=null&&c>=i&&c\u003cj)cl+=' seg';\n  if(!fo&&i==c)cl+=' ai';if(!fo&&j!=null&&j==c)cl+=' aj';\n  h+=`\u003cdiv class=\"${cl}\">\u003cdiv class=\"ch\">${esc(S[c])}\u003c/div>\u003cdiv class=\"ix\">${c}\u003c/div>\u003cdiv class=\"pv\">${P?P[c]:''}\u003c/div>\u003c/div>`;}\n if(!fo&&j!=null&&j==S.length)h+=`\u003cdiv class=\"c aj\">\u003cdiv class=\"ch\" style=\"background:none;border:0\">\u003c/div>\u003c/div>`;\n $('cells').innerHTML=h;\n // пояснение\n let n='';\n if(P)n+=`\u003cdiv>Нижняя строка — \u003cb>${pName}[k]\u003c/b>: сколько раз символ сменился на отрезке от 0 до k.\u003c/div>`;\n if(fo){const a=fo.i,b=fo.i+fo.l-1;n+=`\u003cdiv>Выбрана найденная строка \u003cb>${esc(fo.ss)}\u003c/b>: позиции \u003cb>${a}…${b}\u003c/b>, длина \u003cb>${fo.l}\u003c/b>.`+(P?` Смен внутри: \u003cb>${P[b]}−${P[a]} = ${P[b]-P[a]}\u003c/b>`:'')+`\u003c/div>`;}\n else if(i!=null&&j!=null&&P&&j-1>=i&&j-1\u003cS.length){const d=P[j-1]-P[i];\n  n+=`\u003cdiv>Отрезок \u003cb>s[${i}:${j}]\u003c/b> = \u003cb>${esc(S.slice(i,j))}\u003c/b> (длина ${j-i}). Смен внутри: \u003cb>${P[j-1]} − ${P[i]} = ${d}\u003c/b>`+(Number.isInteger(V.K)?` — при K=${V.K} это \u003cb class=\"${d>V.K?'bad':d==V.K?'ok':''}\">${d>V.K?'ПЛОХО (больше K, break)':d==V.K?'ХОРОШО (ровно K)':'пока меньше K, расширяем'}\u003c/b>`:'')+`\u003c/div>`;}\n else if(i!=null)n+=`\u003cdiv>i = ${i}${j!=null?', j = '+j:''}\u003c/div>`;\n if(Number.isInteger(V.l))n+=`\u003cdiv>Лучшая длина на сейчас: \u003cb>l = ${V.l}\u003c/b>\u003c/div>`;\n $('note').innerHTML=n||'\u003cspan class=\"muted\">Нет данных для визуализации\u003c/span>';\n // серии\n   $('#edTaskClose').onclick = $('#etCancel').onclick = closeModal;
  $('#etSave').onclick = () => {

  };

/* ===== findall ⇄ finditer ===== */
function ffMode(code) {
  if (/^\s*\w+ = findall\(pattern\d?, s(, M)?\)/m.test(code)) return 'findall';
  if (/^\s*\w+ = \[m\.(group\(\)|group\(1\)|groups\(\)) for m in finditer\(pattern\d?, s(, M)?\)\]/m.test(code)) return 'finditer';
  return '';
}
function ffConvert(code, to, ng) {
  if (to === 'finditer') return code.replace(/^(\s*)(\w+) = findall\((pattern\d?), s(, M)?\)([^\n]*)$/m, (m0, ind, v, p, fl, rest) => {
    const warn = /⚠/.test(rest); const g = warn || ng === 0 ? 'group()' : ng === 1 ? 'group(1)' : 'groups()';
    return `${ind}${v} = [m.${g} for m in finditer(${p}, s${fl || ''})]`;
  });
  return code.replace(/^(\s*)(\w+) = \[m\.(group\(\)|group\(1\)|groups\(\)) for m in finditer\((pattern\d?), s(, M)?\)\]([^\n]*)$/m, (m0, ind, v, g, p, fl) => {
    const same = (g === 'group()' && ng === 0) || (g === 'group(1)' && ng === 1) || (g === 'groups()' && ng >= 2);
    return `${ind}${v} = findall(${p}, s${fl || ''})` + (same ? '' : '   # ⚠ в шаблоне есть группы: findall вернёт содержимое групп, а не весь кусок!');
  });
}
function ffUpdate() {
  const seg = $('#ffSeg'); if (!seg || !ED) return;
  const md = ffMode(ED.get()); seg.style.display = md ? '' : 'none';
  seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.ff === md));
}
function ffBind(t) {
  const seg = $('#ffSeg'); if (!seg) return;
  seg.querySelectorAll('button').forEach(b => b.onclick = () => {
    const to = b.dataset.ff, code = ED.get(); if (ffMode(code) === to) return;
    const nc = ffConvert(code, to, t.groups || 0); if (nc === code) return;
    ED.set(nc); X(t.id).code = ED.get(); bump(); ffUpdate();
    toast(to === 'finditer' ? '📍 finditer: объекты m — m.group() весь кусок, m.group(N) группа, m.start() позиция. Запусти ▶ и сравни.' : '📋 findall: сразу список строк; если в шаблоне есть группы — их содержимое (кортежи). Запусти ▶ и сравни.', 4500);
  });
  ffUpdate();
}

/* ===== Запуск: ответ подставляется сам, верный — переход дальше ===== */
let AUTO_NEXT = null;
async function runMain() {
  const t = TK[cur.id]; if (!t || !ED) return; const x = X(t.id);
  clearTimeout(AUTO_NEXT);
  const sample = String(t.s || t.tr || '');
  let code = ED.get().replace(/[‘’]/g, "'").replace(/[“”„]/g, '"');
  if (sample) { const lit = JSON.stringify(sample); code = code.replace(/^s\s*=\s*(['"][\s\S]*?['"])/m, 's = ' + lit); }
  if (code !== ED.get()) ED.set(code, [], true);
  const pl = code.split('\n').find(l => /^pattern\s*=\s*r'/.test(l.trim()));
  if (pl && /r'\s*'/.test(pl)) { $('#exp').innerHTML = '<div class="exp">Поле с регуляркой пустое — впиши шаблон (или нажми «✨ Заполнить поля»).</div>'; return; }

  const pre = sample ? `import builtins\n__chatgpt_test_lines = ${JSON.stringify(sample)}.split('\\n')\n__chatgpt_test_iter = iter(__chatgpt_test_lines)\nbuiltins.input = lambda prompt='': next(__chatgpt_test_iter, '')\n` : preCode();

  setBusy(false); if (!$('#out') || cur.id !== t.id) return;
  x.runs++; X(t.id).code = code; bump();
  $('#st').textContent = r.fatal ? '⚠️ Не удалось запустить Python: ' + r.err + '. Нужен интернет при первом запуске.' : `Готово за ${Math.round(performance.now() - t0)} мс.`;
  showOut(r); ED.err(r.ok ? null : r.line);

  CUR_RUN = {code, out: r.out || '', err: r.ok ? '' : (r.err || '') + (r.line ? ' (строка ' + r.line + ')' : '')};
  if (r.ok) {
    if (!t.ans) t.ans = await refAns(t);
    const last = lastLine(r.out);

      const ai = $('#ansIn'); ai.value = last;

      else { const fb = $('#fb'); fb.className = 'fb show bad'; fb.innerHTML = `Последняя строка вывода <code>${esc(last)}</code> подставлена в ответ — и это <b>не</b> ответ. Проверь шаблон: открой 🔎 отладчик и посмотри, что он находит.${x.hint < 1 ? ' Можно взять 💡 подсказку.' : ''}`; }
    }
  }
}
let CUR_RUN = null;
async function checkAns(t, auto) {
  if (!t.ans) t.ans = await refAns(t);
  const x = X(t.id), v = $('#ansIn').value.trim(), fb = $('#fb'); if (!v) { $('#ansIn').focus(); return; }
  x.tries++;
  if (normA(v) === normA(t.ans)) {
    const was = solved(x);
    if (!was) { x.st = x.hint >= 3 ? 'fill' : x.hint >= 1 ? 'hint' : x.wrong.length ? 'err' : 'ok'; x.md = dstamp(); x.ans = v; x.code = ED.get(); }
    bump(); refreshSide();
    const tc = $('#tc'); if (tc) tc.classList.add('solved');
    fb.className = 'fb show good'; fb.innerHTML = '✅ Верно! ' + (x.st === 'ok' && !was ? 'Сам и с первой попытки — отлично!' : '') + (was ? '' : ' Флаг «решено» поставлен.');
    if (x.st === 'ok' && !was) confetti();
    const an = ANALOGS(t.id).filter(a => !solved(stu().tasks[a.id]));
    if (an.length) fb.innerHTML += ` <span style="font-weight:600">Закрепи на аналоге:</span> ${an.slice(0, 4).map(a => `<button class="btn sm" data-go="${a.id}">№ ${esc(a.id)}</button>`).join(' ')}`;
    const nx = nextUnsolved(t.id); if (nx) fb.innerHTML += ` <button class="btn sm pri" data-go="${nx}">Дальше → ${esc(nx)}</button>`;
    if (auto && !was && nx) {
      fb.innerHTML += `<div class="autonx">Переход к № ${esc(nx)} через <b id="anS">3</b> с… <button class="btn sm ghost" id="anStop">остаться здесь</button></div>`;
      let k = 3; const tick = () => { k--; const e = $('#anS'); if (!e || cur.id !== t.id) return; if (k <= 0) { openTask(nx); return; } e.textContent = k; AUTO_NEXT = setTimeout(tick, 1000); };
      AUTO_NEXT = setTimeout(tick, 1000);
      $('#anStop').onclick = () => { clearTimeout(AUTO_NEXT); const a = document.querySelector('.autonx'); if (a) a.remove(); };
    }
    fb.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { clearTimeout(AUTO_NEXT); openTask(b.dataset.go); });
    const fl = document.querySelector('[data-fl="done"]'); if (fl) fl.classList.add('on');
  } else {
    if (!solved(x) && !x.wrong.includes(v)) x.wrong.push(v); bump(); refreshSide();
    const o = $('#out').dataset.last;
    let tip = o && normA(o) === normA(v) ? 'Программа выводит именно это — значит, ошибка в шаблоне. Открой 🔎 отладчик и посмотри, какие куски он находит и каких не хватает.' : !o ? 'Выполни программу ▶ — последняя строка вывода сама встанет в ответ.' : '';
    if (x.wrong.length >= 2 && x.hint < 1) tip += ' Можно взять 💡 подсказку или спросить 🤖 ИИ-помощника.';
    fb.className = 'fb show bad'; fb.innerHTML = '❌ Неверно. ' + tip;
  }
}
