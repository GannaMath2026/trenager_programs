<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta content="width=device-width,initial-scale=1" name="viewport">
<title>ЕГЭ 24 · Тренажёр по алгоритмам строк · банк ШКОЛКОВО</title>
<link href="https://fonts.googleapis.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>:root{--bg:#f3f5fb;--card:#fff;--ink:#1d2640;--mut:#6b7491;--line:#e1e5f0;--pri:#4f6bff;--pri2:#7b5cff;--ok:#16a36a;--okl:#dff6ea;--err:#e5484d;--errl:#ffe3e3;--warn:#f0a400;--code:#0f1424;--code2:#161d33;--cink:#e7ecff;--sh:0 6px 22px rgba(30,40,80,.08)}
[data-theme=dark]{--bg:#0f1322;--card:#181e33;--ink:#e6e9f5;--mut:#98a0bf;--line:#2a3150;--okl:#143826;--errl:#3b1518;--code:#0b0f1d;--code2:#131a30;--sh:0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Nunito','Segoe UI',Roboto,Arial,sans-serif}
button{font:inherit;cursor:pointer}input,select,textarea{font:inherit;color:inherit}
.mono,code,pre{font-family:"JetBrains Mono","Cascadia Code",Consolas,"Courier New",monospace}
.btn{border:0;border-radius:11px;padding:8px 14px;font-weight:700;background:var(--card);color:var(--ink);box-shadow:0 0 0 1.5px var(--line) inset;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn:hover{box-shadow:0 0 0 1.5px var(--pri) inset}
.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 6px 16px rgba(79,107,255,.3)}
.btn.ok{background:var(--ok);color:#fff;box-shadow:none}
.btn.yel{background:linear-gradient(135deg,#ffcf4a,#ffb02e);color:#4a3000;box-shadow:none}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.btn.on{background:#e6eaff;box-shadow:0 0 0 1.5px var(--pri) inset;color:#2f45c9}[data-theme=dark] .btn.on{background:#262f55;color:#b9c4ff}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:16px 20px;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1d2640;color:#fff;padding:11px 18px;border-radius:12px;z-index:300;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90vw;font-weight:600}
.mbg{position:fixed;inset:0;background:rgba(15,20,40,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:12px}
.mdl{background:var(--card);border-radius:20px;padding:20px;max-width:640px;width:100%;max-height:94vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.mdl.wide{max-width:1050px}.mdl.full{max-width:none;width:96vw;height:94vh;max-height:94vh;padding:16px;display:flex;flex-direction:column}
.mdl h2{margin:0 0 10px}
.mhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}.mhead h2{margin:0;flex:1}
.inp{border:1.5px solid var(--line);background:var(--bg);border-radius:11px;padding:8px 12px;outline:none}
.inp:focus{border-color:var(--pri)}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:9px 16px;background:var(--card);box-shadow:0 2px 12px rgba(30,40,80,.07);flex-wrap:wrap}
.logo{font-weight:900;font-size:17px;display:flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer}
.logo i{font-style:normal;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-size:14px}
.top .sp{flex:1}
.ib{border:0;background:var(--bg);color:var(--ink);border-radius:10px;padding:7px 10px;font-weight:700;white-space:nowrap}
.ib:hover{background:#e6eaff}[data-theme=dark] .ib:hover{background:#262f55}
.ib.yel{background:linear-gradient(135deg,#ffcf4a,#ffb02e);color:#4a3000}
.who{font-weight:800;background:var(--bg);border-radius:999px;padding:6px 12px}
.modeb{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:#e3f6ec;color:#0f7a4d}.modeb.home{background:#fff0e0;color:#b25e00}
.login{max-width:560px;margin:7vh auto;padding:0 14px}
.hero{background:linear-gradient(135deg,#4f6bff,#7b5cff 60%,#b44cff);color:#fff;border-radius:24px;padding:26px;box-shadow:0 20px 50px rgba(79,107,255,.35);position:relative;overflow:hidden;margin-bottom:14px}
.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0;opacity:.92}
.hero .code-deco{position:absolute;right:8px;bottom:-6px;font:700 12px/1.35 Consolas,monospace;opacity:.22;white-space:pre;text-align:left}
.slist{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.slist button{border:0;background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:700}
.lay{display:grid;grid-template-columns:290px 1fr;gap:16px;padding:16px;max-width:1700px;margin:0 auto}
.side{position:sticky;top:66px;align-self:start;max-height:calc(100vh - 82px);overflow:auto;background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:12px}
.prog{display:flex;height:10px;border-radius:9px;overflow:hidden;background:var(--bg);margin:4px 0 8px}.prog i{display:block;height:100%}
.sbig{width:100%;border:0;border-radius:14px;padding:10px 12px;text-align:left;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:6px;background:var(--bg);color:var(--ink)}
.sbig.cons{background:linear-gradient(135deg,#eef1ff,#f6efff)}[data-theme=dark] .sbig.cons{background:#232a4a}
.sbig.cur{outline:2.5px solid var(--pri)}
.sbig small{margin-left:auto;font-weight:700;color:var(--mut)}
.sec{margin-top:10px}.sech{font-weight:900;font-size:13.5px;padding:4px 2px;display:flex;align-items:center;gap:6px}.sech small{margin-left:auto;color:var(--mut)}
.its{display:flex;flex-wrap:wrap;gap:5px;padding:2px 2px 6px}
.it{border:0;border-radius:9px;padding:4px 7px;font:700 12.5px Consolas,monospace;background:var(--bg);color:var(--ink);position:relative;min-width:46px}
.it.z{background:#fff6dc;color:#8a6400}[data-theme=dark] .it.z{background:#3a3010;color:#ffd666}
.it.ok{background:#16a36a;color:#fff}.it.err{background:#7bd3a7;color:#08321f}.it.hint{background:#ffd666;color:#4a3500}.it.fill{background:#ffb27a;color:#4a2000}
.it.cur{outline:2.5px solid var(--pri);outline-offset:1px}
.it.tried::after{content:'';position:absolute;right:2px;top:2px;width:6px;height:6px;border-radius:50%;background:var(--err)}
.legend{font-size:11.5px;color:var(--mut);display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.main{min-width:0}
.th{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.th h2{margin:0;font-size:21px}
.tag{font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;background:var(--bg);color:var(--mut);white-space:nowrap}
.tag.z{background:#fff1c7;color:#8a6400}.tag.st{background:#dff6ea;color:#0f7a4d}
.dots{color:#f0a400;letter-spacing:1px}
.cond{white-space:pre-wrap;font-size:16px;line-height:1.55;margin-top:10px}
.cond .q{font-weight:800;background:#fff6dc;border-radius:6px;padding:1px 4px}.cond .cnum{font-weight:850}.cond .example{color:#13734f;background:#eaf8ef;border-radius:5px;padding:1px 3px}[data-theme=dark] .cond .q{background:#3a3010}[data-theme=dark] .cond .example{color:#91e1b6;background:#153a28}
.fold{background:var(--code2);color:#aab4da;border-radius:12px;font:13.5px/20px Consolas,monospace;margin-bottom:8px;overflow:hidden}
.fold>button{border:0;background:transparent;color:inherit;font:inherit;width:100%;text-align:left;padding:7px 12px;display:flex;gap:8px;align-items:center}
.fold>button b{color:#c792ea}.fold>button span.c{color:#69739a;margin-left:auto;font-family:Nunito,sans-serif;font-size:12px}
.fold pre{margin:0;padding:6px 14px 10px;color:var(--cink);border-top:1px solid #253055}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}.bar .sp{flex:1}.ed-tools{display:flex;gap:5px;flex-wrap:wrap;align-items:center}.bar button{max-width:100%}.base-vis-frame{width:100%;height:calc(94vh - 64px);min-height:420px;flex:1;border:0;border-radius:12px;background:#0b1018}
.exb{border:0;border-radius:9px;padding:5px 10px;font:700 12.5px Consolas,monospace;background:#e8f7ef;color:#0f7a4d}
[data-theme=dark] .exb{background:#143826;color:#7fe0b0}
.exin{width:84px;padding:5px 8px;font:700 13px Consolas,monospace}
.menu{position:absolute;background:var(--card);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:6px;z-index:150;display:flex;flex-direction:column;min-width:220px;border:1px solid var(--line)}
.menu button{white-space:pre;border:0;background:transparent;color:var(--ink);text-align:left;padding:6px 10px;border-radius:8px;font:13px Consolas,monospace}
.menu button:hover{background:var(--bg)}
.menu small{font-family:Nunito,sans-serif;color:var(--mut);padding:4px 10px}
/* редактор */
.ed{display:flex;background:var(--code);border-radius:14px;overflow:hidden;font:14px/21px "JetBrains Mono","Cascadia Code",Consolas,monospace}
.ed-gut{padding:8px 0;background:var(--code2);color:#5d6890;text-align:right;user-select:none;min-width:38px}
.ed-gut div{padding:0 8px;height:21px}.ed-gut div.on{background:#4f6bff;color:#fff}.ed-gut div.er{background:#e5484d;color:#fff}
.ed-box{position:relative;flex:1;min-width:0;overflow-x:auto}
.ed-hl,.ed-ta,.ed-mark{margin:0;padding:8px 12px;font:inherit;white-space:pre;tab-size:4;border:0}
.ed-hl{position:absolute;inset:0;overflow:hidden;color:var(--cink);pointer-events:none;z-index:1}
.ed-mark{position:absolute;inset:0;overflow:hidden;padding-left:0;padding-right:0;pointer-events:none;z-index:0}
.ed-mark div{height:21px}.ed-mark div.on{background:rgba(79,107,255,.3)}.ed-mark div.er{background:rgba(229,72,77,.32)}
.ed-ta{position:relative;z-index:2;display:block;width:100%;background:transparent;color:transparent;caret-color:#fff;outline:none;resize:none;overflow-x:auto;overflow-y:hidden;min-height:120px}
.ed-ta::selection{background:rgba(123,92,255,.45)}
.hk{color:#c792ea;font-weight:700}.hs{color:#c3e88d}.hn{color:#f78c6c}.hc{color:#69739a;font-style:italic}.hb{display:inline-block;white-space:pre;background:#ffd666;color:#1d2640;border-radius:4px;font-weight:800;min-width:1ch;padding:0 .22em;margin-left:.16em}.hb.touched{opacity:1;background:rgba(255,214,102,.13);color:#e7ecff;box-shadow:0 0 0 1px rgba(255,214,102,.38)}.hb.active{opacity:1;background:rgba(255,214,102,.22)}
.out{background:var(--code);color:#cfe3cf;border-radius:12px;padding:10px 12px;font:13.5px/1.5 Consolas,monospace;white-space:pre-wrap;word-break:break-all;max-height:240px;overflow:auto;min-height:42px;margin-top:8px}
.out .last{background:#2b3a1e;color:#d9ff9e;border-radius:4px;padding:0 3px;font-weight:700}
.out .e{color:#ff9a9a}.out .m{color:#7f8bb8}.out .g{color:#7fe0b0;font-weight:700}
.out.solved{box-shadow:0 0 0 3px var(--ok)}
.status{font-size:12.5px;color:var(--mut);margin-top:4px}
.exp{background:#fff0f0;color:#9b1c21;border-radius:12px;padding:9px 12px;font-size:14px;margin-top:6px}[data-theme=dark] .exp{background:#3b1518;color:#ffb0b3}
.ans{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bg);border-radius:14px;padding:10px 12px;margin-top:10px}
.ans .inp{width:170px;font:700 17px Consolas,monospace;background:var(--card)}
.fb{border-radius:12px;padding:10px 14px;font-weight:700;display:none;margin-top:8px}
.fb.show{display:block}.fb.good{background:var(--okl);color:var(--ok)}.fb.bad{background:var(--errl);color:var(--err)}
.nx{height:5px;background:rgba(22,163,106,.25);border-radius:9px;margin-top:8px;overflow:hidden}.nx i{display:block;height:100%;background:var(--ok);width:0;transition:width 2.2s linear}
.card.solved{box-shadow:0 0 0 3px var(--ok),var(--sh)}
.hcard{background:#fff8dc;border:1.5px solid #ffd98a;border-radius:14px;padding:10px 14px;margin-top:8px;color:#4a3500;animation:pop .3s}
[data-theme=dark] .hcard{background:#3a2e12;border-color:#6b5420;color:#ffe6a8}
.hcard .hn2{display:inline-block;background:#f0a400;color:#fff;border-radius:999px;padding:0 9px;margin-right:6px;font-size:12.5px;font-weight:800}
.hcard pre{background:var(--code);color:var(--cink);border-radius:10px;padding:8px 10px;margin:8px 0 4px;font-size:13px;overflow:auto}
code.i{background:var(--bg);border-radius:5px;padding:0 4px;font-size:.92em}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
/* общие подсказки */
.ghg{margin:14px 0 6px;display:flex;align-items:center;gap:8px;font-size:18px;font-weight:900}.ghg i{width:16px;height:16px;border-radius:5px;display:inline-block}
.ghs{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.ghc{background:var(--sc);border-radius:8px 8px 18px 8px;border-top:6px solid var(--se);padding:12px 14px;color:#1d2640;box-shadow:0 8px 18px rgba(40,40,80,.1)}
.ghc b.t{display:block;margin-bottom:4px}
.ghc pre{background:#0f1424;color:#e7ecff;border-radius:10px;padding:8px 10px;margin:8px 0 6px;font-size:12.8px;overflow:auto;white-space:pre}
.ghc .btn{background:#fff}
/* консоль */
.con{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:12px}
.conlog{background:var(--code);color:#e7ecff;border-radius:14px;padding:12px;font:14px/1.5 Consolas,monospace;overflow:auto;white-space:pre-wrap;word-break:break-all;display:flex;flex-direction:column}
.conlog .cmd{color:#82aaff}.conlog .res{color:#c3e88d}.conlog .err{color:#ff9a9a}.conlog .pr{color:#e7ecff}.conside{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}.conside textarea{display:block;width:100%;min-height:112px;resize:vertical;background:var(--code);color:#e7ecff;border:1px solid var(--line);border-radius:8px;padding:8px;font:13px/1.45 Consolas,monospace;margin:8px 0}.conside .help{font-size:12px;color:var(--mut);margin:7px 0 12px}.ru-error{display:block;color:#ffd98a;font:13px/1.45 system-ui,sans-serif;padding-top:3px}
.conin{display:flex;gap:6px;align-items:flex-start;margin-top:auto;padding-top:8px}
.conin span{color:#82aaff;font-weight:800;padding-top:6px}
.conin textarea{flex:1;background:#151c33;border:1px solid #2a3150;border-radius:8px;color:#fff;font:14px/1.5 Consolas,monospace;padding:6px 8px;resize:none;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{border:0;background:var(--bg);color:var(--ink);border-radius:8px;padding:4px 8px;font:12.5px Consolas,monospace}
.chips button:hover{background:#e6eaff}
/* пошаговый мини-питон */
.stp{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.stpv{overflow:auto;display:flex;flex-direction:column;gap:8px}
.vtab{width:100%;border-collapse:collapse;font:14px Consolas,monospace}
.vtab td{border-bottom:1px solid var(--line);padding:5px 6px;vertical-align:top}.vtab td:first-child{color:var(--pri);font-weight:800;width:70px}
.vtab tr.ch td{background:#fff3c4}[data-theme=dark] .vtab tr.ch td{background:#3a3010}
.cells{display:flex;flex-wrap:wrap;gap:2px}
.cells span{display:inline-flex;flex-direction:column;align-items:center;min-width:22px;background:#eef1ff;border-radius:5px;padding:1px 3px;font-weight:800}
.cells span small{font-size:9px;color:var(--mut);font-weight:600}
[data-theme=dark] .cells span{background:#232a4a}
/* конструктор */
.cgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;flex:1;min-height:0}
.cl{display:flex;align-items:center;gap:6px;margin:4px 0;font:15px/1 Consolas,monospace}
.cl .code{flex:1;background:var(--code);color:var(--cink);border-radius:8px;padding:8px 10px;white-space:pre;min-height:36px;display:flex;align-items:center}
.cl.bad .code{box-shadow:0 0 0 2.5px var(--err)}.cl.good .code{box-shadow:0 0 0 2.5px var(--ok)}
.cl .ind{color:#3c4670}
.cl button{border:0;border-radius:8px;padding:6px 9px;background:var(--bg);color:var(--ink);font-weight:800}
.cl .slot{flex:1;border:2px dashed var(--line);border-radius:8px;padding:8px 10px;color:var(--mut);background:transparent;text-align:left;font:15px Consolas,monospace;white-space:pre}
.cl .num{width:24px;color:var(--mut);text-align:right;font-size:12px}
.lvl3{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.cdone{color:var(--ok);font-weight:800}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl td,.tbl th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs button{border:0;padding:9px 14px;border-radius:10px;background:var(--bg);color:var(--ink);font-weight:800}.tabs button.on{background:var(--pri);color:#fff}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;max-width:460px}.fld span{font-size:13px;color:var(--mut);font-weight:700}
.flag{display:inline-flex;align-items:center;gap:4px;margin:3px 5px 3px 0;padding:5px 9px;border-radius:9px;background:var(--bg);font:700 13px Consolas,monospace;cursor:pointer;border:1.5px solid transparent;user-select:none}
.flag.on{border-color:var(--pri);background:#e6eaff;color:#1d2640}
.home{max-width:1100px;margin:16px auto;padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hmc{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:22px;cursor:pointer;border:0;text-align:left;color:var(--ink)}
.hmc:hover{box-shadow:0 0 0 2px var(--pri),var(--sh)}
.hmc h2{margin:6px 0}.hmc .big{font-size:40px}
.pb{height:9px;background:var(--bg);border-radius:9px;overflow:hidden;margin-top:10px}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#5ad19b)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--bg);border-radius:14px;padding:12px}.stat b{font-size:24px;display:block}.stat span{font-size:13px;color:var(--mut)}
@media (max-width:980px){.lay{grid-template-columns:1fr;padding:8px}.side{position:static;max-height:none}.home{grid-template-columns:1fr}.con,.stp,.cgrid{grid-template-columns:1fr}}

.vhint{color:var(--mut);font-size:13px}
.home2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;max-width:1300px;margin:18px auto;padding:0 16px}
.hcol{display:flex;flex-direction:column;gap:10px}
.bline{display:flex;align-items:center;gap:12px;border:0;background:var(--card);color:var(--ink);border-radius:16px;padding:12px 14px;box-shadow:var(--sh);text-align:left}
.bline:hover{box-shadow:0 0 0 2px var(--pri) inset,var(--sh)}
.bline .bn{flex:0 0 38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2))}
.bline .bt{flex:1;display:flex;flex-direction:column}.bline .bt small{color:var(--mut);font-size:12.5px;line-height:1.35}
.bline .bp{flex:0 0 90px;text-align:right;font-size:13px}.bline .bp i{display:block;height:6px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:4px}.bline .bp em{display:block;height:100%;background:var(--ok)}
.hwc{border:2px solid #ffb46b !important}
.filt{display:flex;gap:4px;flex-wrap:wrap}
.filt button{border:0;border-radius:999px;padding:5px 10px;font-weight:800;font-size:12.5px;background:var(--bg);color:var(--ink)}
.filt button.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}

e: break\n        j+=1","methods":{"split":"s = 'ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC'\ns=input()\ns1=s\ns = s.replace('*', '+')\n# for c in '12345678': s=s.replace(c, '9')\nwhile '++' in s: s=s.replace('++',' ')\nwhile '+0' in s: s=s.replace('+0',' ')\ns=s.split()\nss=[len(c.strip('+').split('+')) for c in s]\nprint(max(ss))\n#or\ns = 'ABACABBCABACAB'\ns=input().replace('*', '+')\ndef usl(s):\n    return all(c not in s for c  in ['++','+0'])\nl=0\nmaxi=0\nfor i in range(len(s)):\n    j=i+l+1\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if usl(ss):\n            l=len(ss)\n            ss=ss.strip('+').split('+')\n            ll=len(ss)\n            if ll>maxi:\n                maxi=ll\n                print(i,maxi,ss)\n        else: break\n        j+=1"},"ans":"44","final":"","flags":"","tree":[],"groups":0,"norx":true,"alias":"","realAns":"44","src":"Школьково 24","lvl":"","file":"","alts":[],"tr":"ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC","ask":"","s":"ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC","src2":"s = 'ABACABBCABACAB'\ns=input()\ns1=s\ns = s.replace('*', '+')\n# for c in '12345678': s=s.replace(c, '9')\nwhile '++' in s: s=s.replace('++',' ')\nwhile '+0' in s: s=s.replace('+0',' ')\ns=s.split()\nss=[len(c.strip('+').split('+')) for c in s]\nprint(max(ss))\n#or\ns = 'ABACABBCABACAB'\ns=input().replace('*', '+')\ndef usl(s):\n    return all(c not in s for c  in ['++','+0'])\nl=0\nmaxi=0\nfor i in range(len(s)):\n    j=i+l+1\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if usl(ss):\n            l=len(ss)\n            ss=ss.strip('+').split('+')\n            ll=len(ss)\n            if ll>maxi:\n                maxi=ll\n                print(i,maxi,ss)\n        else: break\n        j+=1","like":"1040"},{"id":"1975","blk":"A","role":"hw","d":1,"main":"split","title":"№ 1975 КАБАНОВ","real":"Текстовый файл состоит из символов P, Q, R и S. \nОпределите максимальное количество идущих подряд символов в прилагаемом файле, среди которых нет идущих подряд символов P. \nДля выполнения этого задания следует написать программу.","idea":"Разметь запрещённые фрагменты или символы разделителями. После split проанализируй получившиеся части.","note":"Важно не удалять символы исходной строки, если требуется сохранить длину. Используй разделитель, которого гарантированно нет в данных. Для наложений иногда нужен while.","tpl":"s = 'ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC'\nwhile 'PP' in s: s=s.replace('PP','P P')\nfor c in set(s):\n    if c!=' ': s=s.replace(c,'!')\nfor k in range(1000):\n    if '!'*k in s: print(k)","methods":{"split":"s = 'ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC'\nwhile 'PP' in s: s=s.replace('PP','P P')\nfor c in set(s):\n    if c!=' ': s=s.replace(c,'!')\nfor k in range(1000):\n    if '!'*k in s: print(k)"},"ans":"188","final":"","flags":"","tree":[],"groups":0,"norx":true,"alias":"","realAns":"188","src":"Школьково 24","lvl":"","file":"","alts":[],"tr":"ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC","ask":"","s":"ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC","src2":"s = 'ABACABBCABACAB'\nwhile 'PP' in s: s=s.replace('PP','P P')\nfor c in set(s):\n    if c!=' ': s=s.replace(c,'!')\nfor k in range(1000):\n    if '!'*k in s: print(k)\nSPLIT\nв 05 Максимальная строка без DDD. КРЫЛОВ 2024\ns = 'ABACABBCABACAB'\ns=input()\ns=s.replace('DDD','DD DD')\ns=set(s.split())\nprint(max(len(c) for c in s))\nв 06 Максимальная строка из соседних различающихся\ns = 'ABACABBCABACAB'\ns=input()\nfor c in set(s):\n    while c*2 in s : s=s.replace(c*2,  c+' '+c)\ns=set(s.split())\nprint(max(len(c) for c in s))\nв 07 Максимальная строка каждый больше предыдущего  код\ns = 'ABACABBCABACAB'\ns=input()\nfor [c,d] in product(set(s),set(s)):\n    if c\u003c=d:\n        while c+d in s: s=s.replace(c+d,  c+' '+d)\ns=set(s.split())\nprint(max(len(c) for c in s))","like":"18619"},{"id":"2420","blk":"A","role":"hw","d":1,"main":"split","title":"№ 2420 КАБАНОВ","real":"В т nput()\ndef usl(s): return len(set(s))\u003c=1\nl=0\nfor i in range(len(s)):\n    j=i+l\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if usl(ss):\n            l=len(ss)\n            print(i,l,ss)\n        else: break\n        j+=1"},{"id":"2716","blk":"B","role":"main","d":1,"main":"loops","title":"(№ 2716)","real":"Найдите максимальную длину последовательности, каждые две соседние цифры в которой в сумме дают значение не меньшее 10.","idea":"Сначала зафиксируй, что именно должна удовлетворять подстрока. Выбирай границы и прекращай перебор, когда дальнейшее расширение уже не поможет.","note":"Следи за включением правой границы: в срезе s[i:j] символ с индексом j не входит. Проверяй, можно ли безопасно использовать break.","tpl":"s = 'ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC'\ns=input()\nl=1\nfor i in range(len(s)):\n    j=i+l+1\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if all (int(ss[k])+int(ss[k+1])>=10 for k in range(len(ss)-1)) :\n            l=len(ss)\n            print(i,l,ss)\n        else: break\n        j+=1","methods":{"loops":"s = 'ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC'\ns=input()\nl=1\nfor i in range(len(s)):\n    j=i+l+1\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if all (int(ss[k])+int(ss[k+1])>=10 for k in range(len(ss)-1)) :\n            l=len(ss)\n            print(i,l,ss)\n        else: break\n        j+=1"},"ans":"","final":"","flags":"","tree":[],"groups":0,"norx":true,"alias":"","realAns":"","src":"Школьково 24","lvl":"","file":"","alts":[],"tr":"","ask":"","s":"","src2":"s = 'ABACABBCABACAB'\ns=input()\nl=1\nfor i in range(len(s)):\n    j=i+l+1\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if all (int(ss[k])+int(ss[k+1])>=10 for i in range(len(ss)-1)) :\n            l=len(ss)\n            print(i,l,ss)\n        else: break\n        j+=1"},{"id":"5830","blk":"B","role":"main","d":1,"main":"loops","title":"(№ 5830)  БАЗОВЫЙ КОД","real":"Определите максимальное количество подряд идущих символов, среди которых нет пар одинаковых символов. \nВ ответе укажите количество повторений самого часто встречающегося символ в найденной строке. \nЕсли таких строк несколько, используйте последнюю из них.","idea":"Сначала зафиксируй, что именно должна удовлетворять подстрока. Выбирай границы и прекращай перебор, когда дальнейшее расширение уже не поможет.","note":"Следи за включением правой границы: в срезе s[i:j] символ с индексом j не входит. Проверяй, можно ли безопасно использовать break.","tpl":"s = 'ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC'\ns=input()\nl=1\nmaxi=''\nfor i in range(len(s)):\n    j=i+l\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if all(ss[k]!=ss[k+1] for k in range(len(ss)-1)):\n            l=len(ss)\n            maxi=max((ss.count(c),c) for c in set(ss))\n            print(i,maxi,ss)\n        else: break\n        j+=1","methods":{"loops":"s = 'ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC'\ns=input()\nl=1\nmaxi=''\nfor i in range(len(s)):\n    j=i+l\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if all(ss[k]!=ss[k+1] for k in range(len(ss)-1)):\n            l=len(ss)\n            maxi=max((ss.count(c),c) for c in set(ss))\n            print(i,maxi,ss)\n        else: break\n        j+=1"},"ans":"19","final":"","flags":"","tree":[],"groups":0,"norx":true,"alias":"","realAns":"19","src":"Школьково 24","lvl":"","file":"","alts":[],"tr":"ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC","ask":"","s":"ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC","src2":"s = 'ABACABBCABACAB'\ns=input()\nl=1\nmaxi=''\nfor i in range(len(s)):\n    j=i+l\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if all(ss[k]!=ss[k+1] for k in range(len(ss)-1)):\n            l=len(ss)\n            maxi=max((ss.count(c),c) for c in set(ss))\n            print(i,maxi,ss)\n        else: break\n        j+=1"},{"id":"2715","blk":"B","role":"hw","d":1,"main":"loops","title":"(№ 2715)","real":"Найдите максимальную длину последовательности, которая состоит из цифр одинаковой четности.","idea":"Сначала зафиксируй, что именно должна удовлетворять подстрока. Выбирай границы и прекращай перебор, когда дальнейшее расширение уже не поможет.","note":"Следи за включением правой границы: в срезе s[i:j] символ с индексом j не входит. Проверяй, можно ли безопасно использовать break.","tpl":"s = 'ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC'\ns=input()\ndef usl(s): return all(int(c)%2==0 for c in s) or all(int(c)%2==1 for c in s)\nl=1\nfor i in range(len(s)):\n    j=i+l+1\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if usl(ss):\n            l=len(ss)\n            print(i,l,ss)\n        else: break\n        j+=1","methods":{"loops":"s = 'ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC'\ns=input()\ndef usl(s): return all(int(c)%2==0 for c in s) or all(int(c)%2==1 for c in s)\nl=1\nfor i in range(len(s)):\n    j=i+l+1\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if usl(ss):\n            l=len(ss)\n            print(i,l,ss)\n        else: break\n        j+=1"},"ans":"","final":"","flags":"","tree":[],"groups":0,"norx":true,"alias":"","realAns":"18","src":"Школьково 24","lvl":"","file":"","alts":[],"tr":"","ask":"","s":"","src2":"s = 'ABACABBCABACAB'\ns=input()\ndef usl(s): return all(int(c)%2==0 for c in s) or all(int(c)%2==1 for c in s)\nl=1\nfor i in range(len(s)):\n    j=i+l+1\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if usl(ss):\n            l=len(ss)\n            print(i,l,ss)\n        else: break\n        j+=1","like":"2508"},{"id":"3362","blk":"B","role":"hw","d":1,"main":"loops","title":"(№ 3362) *","real":"Возрастающей подпоследовательностью будем называть непрерывную последовательность символов, \nрасположенных в порядке увеличения их номера в кодовой таблице символов ASCII. \nОпределите номер символа, с которого начинается наибольшая возрастающая подпоследовательность. \nЕсли таких последовательностей несколько, используйте первую из них. Нумерация символов начинается с 1.","idea":"Сначала зафиксируй, что именно должна удовлетворять подстрока. Выбирай границы и прекращай перебор, когда дальнейшее расширение уже не поможет.","note":"Следи за включением правой границы: в срезе s[i:j] символ с индексом j не входит. Проверяй, можно ли безопасно использовать break.","tpl":"s = 'ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC'\ns=input()\nl=1\nfor i in range(len(s)):\n    j=i+l+1\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if all (ss[k]\u003css[k+1] for k in range(len(ss)-1)) :\n            l=len(ss); num=i+1\n            print(i,l,'ответ:', num,ss)\n        else: break\n        j+=1","methods":{"loops":"s = 'ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC'\ns=input()\nl=1\nfor i in range(len(s)):\n    j=i+l+1\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if all (ss[k]\u003css[k+1] for k in range(len(ss)-1)) :\n            l=len(ss); num=i+1\n            print(i,l,'ответ:', num,ss)\n        else: break\n        j+=1"},"ans":"45718","final":"","flags":"","tree":[],"groups":0,"norx":true,"alias":"","realAns":"45718","src":"Школьково 24","lvl":"","file":"","alts":[],"tr":"ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC","ask":"","s":"ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC","src2":"s = 'ABACABBCABACAB'\ns=input()\nl=1\nfor i in range(len(s)):\n    j=i+l+1\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if all (ss[k]\u003css[k+1] for k in range(len(ss)-1)) :\n            l=len(ss); num=i+1\n            print(i,l,'ответ:', num,ss)\n        else: break\n        j+=1","like":"2716"},{"id":"6905","blk":"B","role":"hw","d":1,"main":"loops","title":"(№ 6905)","real":"Определите максимальную длину последовательности из букв {K, N, L, F} в любом порядке, которая ограничена по краям одинаковыми чётными цифрами.","idea":"Разметь запрещённые фрагменты или символы разделителями. После split проанализируй получившиеся части.","note":"Важно не удалять символы исходной строки, если требуется сохранить длину. Используй разделитель, которого гарантированно нет в данных. Для наложений иногда нужен while.","tpl":"s = 'ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC'\ns='  '+input().replace('K','F').replace('N','F').replace('L','F')\nl=0\nfor i in range(len(s)):\n    j=i+l+1\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if ss[0] in '02468' and all(c=='F' for c in ss[1:-1]):\n            if ss[-1]==ss[0]:\n                l=len(ss)\n                print(i,l-2,ss)\n        else: break\n        j+=1","methods":{"loops":"s = 'ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC'\ns='  '+input().replace('K','F').replace('N','F').replace('L','F')\nl=0\nfor i in range(len(s)):\n    j=i+l+1\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if ss[0] in '02468' and all(c=='F' for c in ss[1:-1]):\n            if ss[-1]==ss[0]:\n                l=len(ss)\n                print(i,l-2,ss)\n        else: break\n        j+=1"},"ans":"","final":"","flags":"","tree":[],"groups":0,"norx":true,"alias":"","realAns":"5103","src":"Школьково 24","lvl":"","file":"","alts":[],"tr":"","ask":"","s":"","src2":"s = 'ABACABBCABACAB'\ns='  '+input().replace('K','F').replace('N','F').replace('L','F')\nl=0\nfor i in range(len(s)):\n    j=i+l+1\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if ss[0] in '02468' and all(c=='F' for c in ss[1:-1]):\n            if ss[-1]==ss[0]:\n                l=len(ss)\n                print(i,l-2,ss)\n        else: break\n        j+=1","like":"5830"},{"id":"17685","blk":"C","role":"main","d":1,"main":"loops","title":"17685  (Гроб)  арифметическое выражение","real":"Текстовый файл состоит из десятичных цифр, знаков «+» и «*» (сложения и умножения). \nОпределите максимальное количество символов в непрерывной последовательности, являющейся корректным арифметическим выражением с целыми неотрицательными числами (без знака), значение которого равно 0. \nВ этом выражении никакие два знака арифметических операций не стоят рядом, в записи чисел отсутствуют незначащие (ведущие) нули и число 0 не имеет знака. \nПорядок действий определяется по правилам математики.   ","idea":"Сначала зафиксируй, что именно должна удовлетворять подстрока. Выбирай границы и прекращай перебор, когда дальнейшее расширение уже не поможет.","note":"Следи за включением правой границы: в срезе s[i:j] символ с индексом j не входит. Проверяй, можно ли безопасно использовать break.","tpl":"s = 'ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC'\ns=input()\nprint(s[:100])\ndef usl(s):\n    return all(c not in s for c  in ['++','*+','+*','**','+00','+01','+02','+03','+04','+05','+06','+07','+08','+09','*09','*08','*07','*06','*05','*04','*03','*02','*01','*00'])\nl=152\nmaxi=0\nfor i in range(len(s)):\n    j=i+l+1\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if usl(ss):\n            try:\n                z=eval(ss)\n                if z==0:\n                    l=len(ss)\n                    maxi=len(ss)\n                    print(i,maxi,ss)\n            except: pass\n        else: break\n        j+=1\nРАЗНОЕ","methods":{"loops":"s = 'ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC'\ns=input()\nprint(s[:100])\ndef usl(s):\n    return all(c not in s for c  in ['++','*+','+*','**','+00','+01','+02','+03','+04','+05','+06','+07','+08','+09','*09','*08','*07','*06','*05','*04','*03','*02','*01','*00'])\nl=152\nmaxi=0\nfor i in range(len(s)):\n    j=i+l+1\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if usl(ss):\n            try:\n                z=eval(ss)\n                if z==0:\n                    l=len(ss)\n                    maxi=len(ss)\n                    print(i,maxi,ss)\n            except: pass\n        else: break\n        j+=1\nРАЗНОЕ"},"ans":"169","final":"","flags":"","tree":[],"groups":0,"norx":true,"alias":"","realAns":"169","src":"Школьково 24","lvl":"","file":"","alts":[],"tr":"ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC","ask":"","s":"ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC","src2":"s = 'ABACABBCABACAB'\ns=input()\nprint(s[:100])\ndef usl(s):\n    return all(c not in s for c  in ['++','*+','+*','**','+00','+01','+02','+03','+04','+05','+06','+07','+08','+09','*09','*08','*07','*06','*05','*04','*03','*02','*01','*00'])\nl=152\nmaxi=0\nfor i in range(len(s)):\n    j=i+l+1\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if usl(ss):\n            try:\n                z=eval(ss)\n                if z==0:\n                    l=len(ss)\n                    maxi=len(ss)\n                    print(i,maxi,ss)\n            except: pass\n        else: break\n        j+=1\nРАЗНОЕ"},{"id":"4105","blk":"C","role":"main","d":1,"main":"loops","title":"(№ 4105)*  БАЗОВЫЙ КОД – С ДВОЙНЫМ IF","real":"Определите наибольшую длину последовательности из трех различных символов, расположенных в порядке неубывания.","idea":"Сначала зафиксируй, что именно должна удовлетворять подстрока. Выбирай границы и прекращай перебор, когда дальнейшее расширение уже не поможет.","note":"Следи за включением правой границы: в срезе s[i:j] символ с индексом j не входит. Проверяй, можно ли безопасно использовать break.","tpl":"s = 'ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC'\ns=input()\nl=1\nfor i in range(len(s)):\n    j=i+l+1\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if all (ss[k]\u003c=ss[k+1] for k in range(len(ss)-1)) :\n            if len(set(ss))==3:\n                l=len(ss)\n                print(i,l,ss)\n        else: break\n        j+=1","methods":{"loops":"s = 'ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC'\ns=input()\nl=1\nfor i in range(len(s)):\n    j=i+l+1\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if all (ss[k]\u003c=ss[k+1] for k in range(len(ss)-1)) :\n            if len(set(ss))==3:\n                l=len(ss)\n                print(i,l,ss)\n        else: break\n        j+=1"},"ans":"","final":"","flags":"","tree":[],"groups":0,"norx":true,"alias":"","realAns":"6","src":"Школьково 24","lvl":"","file":"","alts":[],"tr":"", ,l,ss)\n        else: break\n        j+=1","methods":{"loops":"s = 'ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC'\ns=input()\ndef usl(s): return all(s.count(c)==1 for c in set(s))\nl=0\nfor i in range(len(s)):\n    j=i+l\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if usl(ss):\n            l=len(ss)\n            print(i,l,ss)\n        else: break\n        j+=1"},"ans":"","final":"","flags":"","tree":[],"groups":0,"norx":true,"alias":"","realAns":"23","src":"Школьково 24","lvl":"","file":"","alts":[],"tr":"","ask":"","s":"","src2":"s = 'ABACABBCABACAB'\ns=input()\ndef usl(s): return all(s.count(c)==1 for c in set(s))\nl=0\nfor i in range(len(s)):\n    j=i+l\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if usl(ss):\n            l=len(ss)\n            print(i,l,ss)\n        else: break\n        j+=1"},{"id":"17878","blk":"C","role":"main","d":2,"main":"loops","title":"№ 17878 Демоверсия 2025 (Сложный)","real":"Текстовый файл состоит из цифр 0, 6, 7, 8, 9 и знаков арифметических операций «–» и «*». \nОпределите максимальное количество символов в непрерывной последовательности, которая является корректным арифметическим выражением с целыми неотрицательными числами.\nВ этом выражении никакие два знака арифметических операций не стоят рядом, в записи чисел отсутствуют незначащие (ведущие) нули и число 0 не имеет знака. \nВ ответе укажите количество символов.","idea":"Сначала зафиксируй, что именно должна удовлетворять подстрока. Выбирай границы и прекращай перебор, когда дальнейшее расширение уже не поможет.","note":"Следи за включением правой границы: в срезе s[i:j] символ с индексом j не входит. Проверяй, можно ли безопасно использовать break.","tpl":"s = 'ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC'\ns=input()\ndef usl(s): return  s[0] not in '*-0' and all(c not in s for c in ['--','**','*-','-*','-00','*00'])\nl=1\nfor i in range(len(s)):\n    j=i+l+1\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if usl(ss):\n            l=len(ss)\n            print(i,len(ss),ss) \n        else: break\n        j+=1","methods":{"loops":"s = 'ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC'\ns=input()\ndef usl(s): return  s[0] not in '*-0' and all(c not in s for c in ['--','**','*-','-*','-00','*00'])\nl=1\nfor i in range(len(s)):\n    j=i+l+1\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if usl(ss):\n            l=len(ss)\n            print(i,len(ss),ss) \n        else: break\n        j+=1"},"ans":"154","final":"","flags":"","tree":[],"groups":0,"norx":true,"alias":"","realAns":"154","src":"Школьково 24","lvl":"","file":"","alts":[],"tr":"ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC","ask":"","s":"ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC","src2":"s = 'ABACABBCABACAB'\ns=input()\ndef usl(s): return  s[0] not in '*-0' and all(c not in s for c in ['--','**','*-','-*','-00','*00'])\nl=1\nfor i in range(len(s)):\n    j=i+l+1\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if usl(ss):\n            l=len(ss)\n            print(i,len(ss),ss) \n        else: break\n        j+=1"},{"id":"4919","blk":"C","role":"main","d":2,"main":"loops","title":"(№ 4919)  ДЗ","real":"Определите количество подстрок длиной не менее 20 символов, которые \nначинаются буквой A, содержат ровно две буквы F, заканчиваются буквой B и не содержат других букв A и B, кроме первой и последней.","idea":"Сначала зафиксируй, что именно должна удовлетворять подстрока. Выбирай границы и прекращай перебор, когда дальнейшее расширение уже не поможет.","note":"Следи за включением правой границы: в срезе s[i:j] символ с индексом j не входит. Проверяй, можно ли безопасно использовать break.","tpl":"s = 'ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC'\ns=input()\nl=20\nkol=0\nfor i in range(len(s)):\n    j=i+2\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if ss[0]=='A' and ss.count('F')\u003c=2 and 'A' not in ss[1:-1] and 'B' not in ss[1:-1]:\n            if ss[-1]=='B' and ss.count('F')==2:\n                kol+=1\n                print(i,kol,ss)\n        else: break\n        j+=1","methods":{"loops":"s = 'ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC'\ns=input()\nl=20\nkol=0\nfor i in range(len(s)):\n    j=i+2\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if ss[0]=='A' and ss.count('F')\u003c=2 and 'A' not in ss[1:-1] and 'B' not in ss[1:-1]:\n            if ss[-1]=='B' and ss.count('F')==2:\n                kol+=1\n                print(i,kol,ss)\n        else: break\n        j+=1"},"ans":"94","final":"","flags":"","tree":[],"groups":0,"norx":true,"alias":"","realAns":"94","src":"Школьково 24","lvl":"","file":"","alts":[],"tr":"ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC","ask":"","s":"ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC","src2":"s = 'ABACABBCABACAB'\ns=input()\nl=20\nkol=0\nfor i in range(len(s)):\n    j=i+2\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if ss[0]=='A' and ss.count('F')\u003c=2 and 'A' not in ss[1:-1] and 'B' not in ss[1:-1]:\n            if ss[-1]=='B' and ss.count('F')==2:\n                kol+=1\n                print(i,kol,ss)\n        else: break\n        j+=1"},{"id":"6277","blk":"C","role":"main","d":2,"main":"loops","title":"(№ 6277)","real":"Найдите максимальную длину подстроки, ограниченной с двух сторон одним и тем же символом и не содержащей этого символа в середине. В ответе укажите сначала символ, ограничивающий строку, а затем без разделителей длину найденной строки, включая граничные символы. \nЕсли в строке есть несколько подходящих подстрок одинаковой длины, нужно указать символ, имеющий больший числовой код.  D9747","idea":"Сначала зафиксируй, что именно должна удовлетворять подстрока. Выбирай границы и прекращай перебор, когда дальнейшее расширение уже не поможет.","note":"Следи за включением правой границы: в срезе s[i:j] символ с индексом j не входит. Проверяй, можно ли безопасно использовать break.","tpl":"s = 'ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC'\ns=input()\nl=3; maxi= ds":{"loops":"s = 'ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC'\ns=input()\ndef usl(s): return (s.count('BAD')+s.count('FAT'))>=3\nl=1000\nfor i in range(len(s)):\n    j=i+l-1\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if usl(ss):\n            l=len(ss)\n            print(i,l,ss)\n        else: break\n        j-=1"},"ans":"","final":"","flags":"","tree":[],"groups":0,"norx":true,"alias":"","realAns":"10","src":"Школьково 24","lvl":"","file":"","alts":[],"tr":"","ask":"","s":"","src2":"s = 'ABACABBCABACAB'\ns=input()\ndef usl(s): return (s.count('BAD')+s.count('FAT'))>=3\nl=1000\nfor i in range(len(s)):\n    j=i+l-1\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if usl(ss):\n            l=len(ss)\n            print(i,l,ss)\n        else: break\n        j-=1"},{"id":"7853","blk":"C","role":"main","d":2,"main":"loops","title":"№ 7853 Danov2304 (Уровень: Сложный)","real":"(А.Богданов) Текстовый файл состоит из символов латинского алфавита и десятичных цифр. \nОпределите максимальное количество идущих подряд символов, среди которых любые два символа из набора N,O,T в различных комбинациях(с учётом повторений) не стоят через один символ (который может быть любым). \nНапример, ТEN или NUТ не могут быть в искомой подстроке.","idea":"Сначала зафиксируй, что именно должна удовлетворять подстрока. Выбирай границы и прекращай перебор, когда дальнейшее расширение уже не поможет.","note":"Следи за включением правой границы: в срезе s[i:j] символ с индексом j не входит. Проверяй, можно ли безопасно использовать break.","tpl":"s = 'ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC'\ns=input().strip()\npr=[0]*(len(s))\nfor i in range(len(s)):\n    if s[i-2]+s[i]  in ['NT','NN','NO','TT','TN','TO','ON','OT','OO']:\n        pr[i]=pr[i-1]+1\n    else: pr[i]=pr[i-1]\nprint('преффиксы готовы')\ndl=10\nfor i in range(len(s)):\n    j=i+dl+1\n    while i\u003c=j\u003c=len(s):\n        if pr[j-1]-pr[i-2+3]!=0: break\n        dl=j-i\n        print(i,dl)\n        j+ альнейшее расширение уже не поможет.","note":"Следи за включением правой границы: в срезе s[i:j] символ с индексом j не входит. Проверяй, можно ли безопасно использовать break.","tpl":"s = 'ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC'\ns=input()\nl=1\nfor i in range(len(s)):\n    j=i+l+1\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if all(c in '0123456789ABCDEF'  for c in ss) and ss[0]!='0':\n            l=len(ss)\n            print(i,l,ss)\n        else: break\n        j+=1","methods":{"loops":"s = 'ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC'\ns=input()\nl=1\nfor i in range(len(s)):\n    j=i+l+1\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if all(c in '0123456789ABCDEF'  for c in ss) and ss[0]!='0':\n            l=len(ss)\n            print(i,l,ss)\n        else: break\n        j+=1"},"ans":"21","final":"","flags":"","tree":[],"groups":0,"norx":true,"alias":"","realAns":"21","src":"Школьково 24","lvl":"","file":"","alts":[],"tr":"ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC","ask":"","s":"ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC","src2":"s = 'ABACABBCABACAB'\ns=input()\nl=1\nfor i in range(len(s)):\n    j=i+l+1\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if all(c in '0123456789ABCDEF'  for c in ss) and ss[0]!='0':\n            l=len(ss)\n            print(i,l,ss)\n        else: break\n        j+=1","like":"6783"},{"id":"17563","blk":"C","role":"hw","d":2,"main":"loops","title":"№ 17563 Основная волна 08.06.24 (Сложный)","real":"Текстовый файл состоит из символов, обозначающих знаки « – », « * » и цифры 0, 7, 8, 9.\nОпределите в прилагаемом файле максимальное количество идущих подряд символов, которые образуют математически правильную последовательность, в которую входят знаки « – » или « * » и натуральные числа без незначащих нулей.","idea":"Сначала зафиксируй, что именно должна удовлетворять подстрока. Выбирай границы и прекращай перебор, когда дальнейшее расширение уже не поможет.","note":"Следи за вкл  задаче\n24.txt\nЗадача 15#160531Максимум баллов за задание: 1\nТекстовый файл содержит только буквы , , , , . Определите максимальное количество идущих подряд групп символов вида\nсогласная + согласная + гласная.\nИсточники: СтатГрад\nВложения к задаче\n24.txt\nЗадача 16#162056Максимум баллов за задание: 1\nТекстовый файл состоит из десятичных цифр и знаков арифметических операций «–» и «*» (вычитания и умножения).\nОпределите максимальное количество символов в непрерывной последовательности, являющейся корректным арифметическим выражением с целыми неотрицательными 6-ричными числами, в котором порядок действий слева направо совпадает с порядком действий по правилам математики. В этом выражении никакие два знака арифметических операций не стоят рядом, в записи чисел отсутствуют незначащие (ведущие) нули.\nВ ответе укажите количество символов.\nИсточники: СтатГрад\nВложения к задаче\n24.txt\nИнтенсивы\nГлубокий разбор тем, требующих дополнительного внимания\nЗадача 17#162057Максимум баллов за задание: 1\nТекстовый файл состоит из десятичных цифр и знаков арифметических операций «–» и «*» (вычитания и умножения).\nОпределите максимальное количество символов в непрерывной последовательности, являющейся корректным арифметическим выражением с целыми неотрицательными 8-ричными числами, в котором порядок действий слева направо совпадает с порядком действий по правилам математики. В этом выражении никакие два знака арифметических операций не стоят рядом, в записи чисел отсутствуют незначащие (ведущие) нули.\nВ ответе укажите количество символов.\nИсточники: СтатГрад\nВложения к задаче\n24.txt\nЗадача 18#165150Максимум баллов за задание: 1\nТекстовый файл состоит из десятичных цифр и заглавных букв латинского алфавита. Определите в прилагаемом файле минимальное количество идущих подряд символов, среди которых буква встречается ровно 63 раза, гласная буква встречается ровно один раз, искомая последовательность заканчивается на эту единственную гласную букву.\nВ ответе запишит едложение» должно начинаться с буквы в верхнем регистре, которой предшествует пробел или точка;\n«предложение» должно заканчиваться точкой, которой предшествует буква, причём других точек в предложении быть не должно;\n«словами» в предложении являются произвольные непрерывные подпоследовательности букв, которые могут не иметь смысла и не существовать в языке;\nкаждое «слово» может начинаться с буквы в любом регистре, даже если оно стоит не первым в «предложении», но в верхнем регистре может быть записана только первая буква «слова»;\nкаждые два соседних «слова» в «предложении» разделены ровно одним пробелом, двух и более рядом стоящих пробелов в «предложении» быть не должно;\nне более 3 различных «слов» в «предложении» могут повторяться (встречаться более одного раза).\nОпределите содержание в файле «предложение» максимальной длины. В ответе укажите количество символов в нём.\nИсточники: СтатГрад\nВложения к задаче\n24.txt\nЗадача 23#171054Максимум баллов за задание: 1\nТекстовый файл содержит буквы L, N, D в двух регистрах, точки и пробелы.\nВ рамках задачи назовем «предложением» непрерывную подпоследовательность символов, для которой выполняются все следующие условия:\n«предложение» должно начинаться с буквы в верхнем регистре, которой предшествует пробел или точка;\n«предложение» должно заканчиваться точкой, которой предшествует буква, причём других точек в предложении быть не должно;\n«словами» в предложении являются произвольные непрерывные подпоследовательности букв, которые могут не иметь смысла и не существовать в языке;\nкаждое «слово» может начинаться с буквы в любом регистре, даже если оно стоит не первым в «предложении», но в верхнем регистре может быть записана только первая буква «слова»;\nкаждые два соседних «слова» в «предложении» разделены ровно одним пробелом, двух и более рядом стоящих пробелов в «предложении» быть не должно;\nне более 2 различных «слов» в «предложении» могут повторяться (встречаться более одного раза).\nОпределите содержание в фа а стоит A и два раза T. Чаще других стоит A, эта буква попадает в отдельный список.\nВо второй строке после T по одному разу стоят буквы Y и A, обе эти буквы попадают в список.\nВ итоге буква A попадает в список два раза, буква Y – один раз. Чаще других в списке встречается буква A – два раза. В ответе для этого примера надо записать число 2.\nЗадача 33#179508Максимум баллов за задание: 1\nТекстовый файл содержит строки различной длины, содержащие только заглавные буквы латинского алфавита (ABC...Z). Будем называть цепочкой группу идущих подряд одинаковых букв в одной строке. Определите, сколько раз буква, образующая самую длинную цепочку в файле, встречается в строке, содержащей эту цепочку. Если в файле есть несколько цепочек одинаковой максимальной длины, нужно выбрать ту из них, для которой общее количество образующих цепочку букв в соответствующей строке будет меньше.\nПример\nПусть файл содержит такие строки:\nABBAAABBABBXY\nXYYYXYAB\nЗдесь в первой строке есть цепочка длины 3, образованная буквами A, всего буква A в этой строке встречается 5 раз. Во второй строке тоже есть цепочка длины 3, но образующая эту цепочку буква Y встречается в этой строке всего 4 раза. 4 \u003c 5, поэтому в ответе в данном случае надо записать число 4.\nВложения к задаче\n24.txt\nЗадача 34#179509Максимум баллов за задание: 1\nТекстовый файл содержит строки различной длины, содержащие только заглавные буквы латинского алфавита (ABC...Z). Будем называть цепочкой группу идущих подряд одинаковых букв в одной строке. Определите, сколько раз буква, образующая самую длинную цепочку в файле, встречается в строке, содержащей эту цепочку. Если в файле есть несколько цепочек одинаковой максимальной длины, нужно выбрать ту из них, для которой общее количество образующих цепочку букв в соответствующей строке будет больше.\nПример\nПусть файл содержит такие строки:\nABBAAABBABBXY\nXYYYXYAB\nЗдесь в первой строке есть цепочка длины 3, образованная буквами A, всего буква A в этой строке встречается 5 раз. Во второй строке тоже есть цепочка длины 3, но образующая эту цепочку буква Y встречается в этой строке всего 4 раза. 5 > 4, поэтому в ответе в данном случае надо записать число 5.\nВложения к задаче\n24.txt\nЗадача 35#180000Максимум баллов за задание: 1\nТекстовый файл содержит только буквы A, C, D, F, O. Определите длину самой длинной цепочки символов, которая начинается и заканчивается буквой F, а между двумя последовательными буквами F содержит не более двух букв A и произвольное количество других букв.\nВложения к задаче\n24.txt\nЗадача 36#180001Максимум баллов за задание: 1\nТекстовый файл содержит только буквы A, C, D, F, O. Определите длину самой длинной цепочки символов, которая начинается и заканчивается буквой D, а между двумя последовательными буквами D содержит не более двух букв O и произвольное количество других букв.\nИсточники: ФИПИ | Досрочная волна 2026\nВложения к задаче\n24.txt\nИнтенсивы\nГлубокий разбор тем, требующих дополнительного внимания\nЗадача 37#180280Максимум баллов за задание: 1\nШифровка содержит только заглавные буквы латинского алфавита (ABC...Z). Группа из трёх идущих подряд символов, содержащая по одному разу каждую из букв A, B и C, считается разделителем. Разделители могут накладываться друг на друга, например, последовательность символов BCABC считается идущими подряд разделителями BCA, CAB и ABC. При дешифровке разделители удаляются, разбивая шифровку на фрагменты. Определите количество символов в самом длинном фрагменте шифровки, полученном после удаления разделителей.\nПример\nПусть шифровка содержит такие символы:\nBADCBACKLMENBCAAA.\nРазделители в этой строке выделены жирным шрифтом. Шифровка содержит три фрагмента: BAD, KLMEN и AA. Самый длинный из них содержит 5 символов, в ответе в данном примере надо записать число 5.\nВложения к задаче\n24.txt\nЗадача 38#180290Максимум баллов за задание: 1\nШифровка содержит только заглавные буквы латинского алфавита (ABC...Z). Группа из трёх идущих подряд символов, содержащая по одному разу каждую из букв X, Y и Z, считается разделителем. Разделители могут накладываться друг на друга, например, последовательность символов YZXYZ считается идущими подряд разделителями YZX, ZXY и XYZ. При дешифровке разделители удаляются, разбивая шифровку на фрагменты. Определите количество символов в самом длинном фрагменте шифровки, полученном после удаления разделителей.\nПример\nПусть шифровка содержит такие символы:\nBADZXYZKLMENYZXXX.\nРазделители в этой строке выделены жирным шрифтом. Шифровка содержит три фрагмента: BAD, KLMEN и XX. Самый длинный из них содержит 5 символов, в ответе в данном примере надо записать число 5.\nВложения к задаче\n24.txt\nЗадача 39#211693Максимум баллов за задание: 1\nТекстовый файл состоит из заглавных букв латинского алфавита – цифр римской системы счисления I, V, X.\nОпределите в прилагаемом файле максимальное количество идущих подряд символов, которые представляют собой корректную римскую запись нечётного десятичного числа. Если найденных последовательностей несколько, выберите ту, для которой абсолютная разность индексов первого символа последовательности и первого символа ближайшего римского числа XXVIII в файле не менее 3642. Гарантируется, что в файле есть одна единственная искомая последовательность. В ответе укажите индекс первого символа найденной последовательности римских цифр.\nВ прилагаемом файле нумерация символов начинается с нуля. Для справки В римской системе счисления приняты следующие правила:\n1. в качестве цифр используют заглавные латинские буквы I, V, X, обозначающие 1, 5, 10 соответственно;\n2. цифра V никогда не повторяется;\n3. цифры I, X могут повторяться не более трёх раз подряд;\n4. если меньшая цифра стоит слева от большей, её значение вычитается из большей; вычитать можно только цифру I, причём только одну;\n5. если цифра стоит справа от большей или равной, их значения складываются;\n6. цифры в записи числа располагаются слева направо в порядке невозрастания их значений, за исключением случаев вычитания. Например, римская запись XVIII корректна и обозначает число 18, а запись IXIX некорректна.\nИсточники: СтатГрад\nВложения к задаче","like":"7853"},{"id":"5152","blk":"C","role":"hw","d":3,"main":"loops","title":"(№ 5152)  к-во","real":"Определите количество подстрок длиной не менее трех символов, которые не содержали бы одновременно все три буквы A, B и C.","idea":"Сначала зафиксируй, что именно должна удовлетворять подстрока. Выбирай границы и прекращай перебор, когда дальнейшее расширение уже не поможет.","note":"Следи за включением правой границы: в срезе s[i:j] символ с индексом j не входит. Проверяй, можно ли безопасно использовать break.","tpl":"s = 'ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC'\ns=input()\ndef usl(s): return (('A' in s)+('B' in s)+('C' in s))\u003c3\nm=[]\nfor i in range(len(s)):\n    j=i+3\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if usl(ss):\n            print(i,ss)\n            m.append(ss)\n        else: break\n        j+=1\nprint(len(m))","methods":{"loops":"s = 'ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC'\ns=input()\ndef usl(s): return (('A' in s)+('B' in s)+('C' in s))\u003c3\nm=[]\nfor i in range(len(s)):\n    j=i+3\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if usl(ss):\n            print(i,ss)\n            m.append(ss)\n        else: break\n        j+=1\nprint(len(m))"},"ans":"","final":"","flags":"","tree":[],"groups":0,"norx":true,"alias":"","realAns":"252776","src":"Школьково 24","lvl":"","file":"","alts":[],"tr":"","ask":"","s":"","src2":"s = 'ABACABBCABACAB'\ns=input()\ndef usl(s): return (('A' in s)+('B' in s)+('C' in s))\u003c3\nm=[]\nfor i in range(len(s)):\n    j=i+3\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if usl(ss):\n            print(i,ss)\n            m.append(ss)\n        else: break\n        j+=1\nprint(len(m))","like":"12476"},{"id":"7979","blk":"C","role":"hw","d":3,"main":"loops","title":"(№ 7979)","real":"Файл состоит из цифр 16 сс и знаков « "title":"24 (1).txt","real":"?????\n\nЗадача 40#211695Максимум баллов за задание: 1 Текстовый файл состоит из заглавных букв латинского алфавита – цифр римской системы счисления I, V, X. Определите в прилагаемом файле максимальное количество идущих подряд символов, которые представляют собой корректную римскую запись нечётного десятичного числа. Если найденных последовательностей несколько, выберите ту, для которой абсолютная разность индексов первого символа последовательности и первого символа ближайшего римского числа XXXVIII в файле не менее 9400. Гарантируется, что в файле есть одна единственная искомая последовательность. В ответе укажите индекс первого символа найденной последовательности римских цифр. В прилагаемом файле нумерация символов начинается с нуля. Для справки В римской системе счисления приняты следующие правила: 1. в качестве цифр используют заглавные латинские буквы I, V, X, обозначающие 1, 5, 10 соответственно; 2. цифра V никогда не повторяется; 3. цифры I, X могут повторяться не более трёх раз подряд; 4. если меньшая цифра стоит слева от большей, её значение вычитается из большей; вычитать можно только цифру I, причём только одну; 5. если цифра стоит справа от большей или равной, их значения складываются; 6. цифры в записи числа располагаются слева направо в порядке невозрастания их значений, за исключением случаев вычитания. Например, римская запись XVIII корректна и обозначает число 18, а запись IXIX некорректна. Источники: СтатГрад Вложения к задаче Каталог курсовРепетиторыБесплатноОтзывыАкцииКонтакты Каталог заданий ЕГЭ по информатике Задачи №24 из Банка ФИПИ Тема 24. Обработка символьной информации 24.04 Задачи №24 из Банка ФИПИ 01. Вспоминай формулы по каждой теме 02. Решай новые задачи каждый день 03. Вдумчиво разбирай решения 04. Готовиться с платформой «Школково» — ЛЕГКО! Получи персональную скидку на курсы подготовки к экзаменам Хочу получить огромную скидку Подтемы раздела обработка символьной информации Задача 1#137754Максимум балл  in range(len(s)):\n    j=i+l+1\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if usl(ss):\n            l=len(ss)\n            print(i,l,ss)\n        else: break\n        j+=1\ns='QTUHHMSMJFSMECQ' \n# метод префиксных сумм\nn=len(s)\nlef=[1]*n\nrig=[1]*n\ns1=s[::-1]\nfor i in range(1,n):\n    if s[i]>=s[i-1]: lef[i]=lef[i-1]+1\n    if s1[i]>=s1[i-1]: rig[i]=rig[i-1]+1\nrig=rig[::-1]\nmaxi=0\nprint(max(lef[i]+rig[i+1] for i in range(n-1)))"},"ans":"","final":"","flags":"","tree":[],"groups":0,"norx":true,"alias":"","realAns":"17","src":"Школьково 24","lvl":"","file":"","alts":[],"tr":"","ask":"","s":"","src2":"s = 'ABACABBCABACAB'\ns=input()\n# print(s)\ndef usl(s):\n    i=0\n    while i\u003clen(s)-1 and s[i]\u003c=s[i+1]: i+=1\n    while i\u003clen(s)-1 and s[i]>=s[i+1]: i+=1\n    return i==len(s)-1\nl=0\nfor i in range(len(s)):\n    j=i+l+1\n    while j\u003c=len(s):\n        ss=s[i:j]\n        if usl(ss):\n            l=len(ss)\n            print(i,l,ss)\n        else: break\n        j+=1\ns='QTUHHMSMJFSMECQ' \n# метод префиксных сумм\nn=len(s)\nlef=[1]*n\nrig=[1]*n\ns1=s[::-1]\nfor i in range(1,n):\n    if s[i]>=s[i-1]: lef[i]=lef[i-1]+1\n    if s1[i]>=s1[i-1]: rig[i]=rig[i-1]+1\nrig=rig[::-1]\nmaxi=0\nprint(max(lef[i]+rig[i+1] for i in range(n-1)))"},{"id":"7787","blk":"G","role":"main","d":2,"main":"regex","title":"(№ 7787)","real":"Файл состоит не более чем из 10^6 символов и содержит только цифры 16  сс, а также знаки «+» и «*» (сложения и умножения). \nОпределите максимальное количество символов в непрерывной последовательности, которая начинается символами AFD, за которыми следует правильное арифметическое выражение с целыми неотрицательными числами (без знака), записанными в 10 сс. \n","idea":"Сначала зафиксируй, что именно должна удовлетворять подстрока. Выбирай границы и прекращай перебор, когда дальнейшее расширение уже не поможет.","note":"Следи за включением правой границы: в срезе s[i:j] символ с индексом j не входит. Проверяй, можно ли безопасно использовать break.","tpl":"from re import *\ns=input()\nreg=r'(?=(AFD(?:0|[1-9][0-9]*)(?:[+*](?:0|[1-9][0-9]*))*))'\nres=[c.group(1) for c in finditer(reg,s)]\nans=max(res,key=len)\nprint(len(ans),ans)","methods":{"regex":"from re import *\ns=input()\nreg=r'(?=(AFD(?:0|[1-9][0-9]*)(?:[+*](?:0|[1-9][0-9]*))*))'\nres=[c.group(1) for c in finditer(reg,s)]\nans=max(res,key=len)\nprint(len(ans),ans)"},"ans":"72","final":"","flags":"","tree":[],"groups":0,"norx":true,"alias":"","realAns":"72","src":"Школьково 24","lvl":"","file":"","alts":[],"tr":"","ask":"","s":"","src2":"from re import *\ns=input()\nreg=r'(?=(AFD(?:0|[1-9][0-9]*)(?:[+*](?:0|[1-9][0-9]*))*))'\nres=[c.group(1) for c in finditer(reg,s)]\nans=max(res,key=len)\nprint(len(ans),ans)"},{"id":"7977","blk":"G","role":"main","d":2,"main":"regex","title":"(№ 7977)","real":"Файл состоит не более чем из 10^6 символов и содержит только цифры 16 сс, а также знаки «+» и «*» . Найдите самую длинную непрерывную последовательность символов, которая является корректным арифметическим выражением с целыми неотрицательными числами, записанными в 6 сс. \nВ ответе запишите последние 6 цифр значения этого выражения. \nЕсли в файле есть два выражения одинаковой длины, выберите то, у которого значение наибольшее.\n","idea":"Сначала зафиксируй, что именно должна удовлетворять подстрока. Выбирай границы и прекращай перебор, когда дальнейшее расширение уже не поможет.","note":"Следи за включением правой границы: в срезе s[i:j] символ с индексом j не входит. Проверяй, можно ли безопасно использовать break.","tpl":"from re import *\ns=input().strip()\nreg=r'(?=((?:0|[1-5][0-5]*)(?:[+*](?:0|[1-5][0-5]*))*))'\nres=[c.group(1) for c in finditer(reg,s) if c.group(1)]\nl=max(map(len,res))\nres=[c for c in res if len(c)==l]\ndef value(ss):\n    a=split(r'([+*])',ss)\n    a=[str(int(c,6)) if c not in '+*' else c for c in a]\n    return eval(''.join(a))\nans=max(res,key=value)\nprint(l,ans,str(value(ans))[-6:])","methods":{"regex":"from 0):\n        d -= s[l] == 'D'\n        c -= s[l] in '0123456789'\n        l += 1\n    if s[l]=='D' and d==1 and c==50:\n        maxi=max(maxi,r-l+1)\nprint(maxi) \n# 2 цикла\nfor c in '0123456789':s=s.replace(c,'1')\nl=10\nfor i in range(len(s)):\n    for j in range(i+l+1,len(s)+1):\n        ss=s[i:j]\n        if ss[0]!='D' or ss.count('D')>1 or ss.count('1')>50: break\n        if ss[0]=='D' and ss.count('D')==1 and ss.count('1')==50:\n            l=len(ss)\nprint(l)","methods":{"regex":"s = 'ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC'\nfrom re import finditer\ns=input() \n#регулярки\nreg=r'D([^D0123456789]*[0123456789]){50}[^D0123456789]*'\nres=finditer(reg,s)\nprint(len(max([c.group() for c in res], key=len)))  \n#2 указателя\nd=0;c=0;maxi=0;l=0;r=0\nfor r in range(len(s)):\n    if l>r: continue\n    ss=s[l:r+1]\n    d+=(s[r]=='D')\n    c+=(s[r] in '0123456789')\n    while l \u003c= r and (s[l] != 'D' or d > 1 or c > 50):\n        d -= s[l] == 'D'\n        c -= s[l] in '0123456789'\n        l += 1\n    if s[l]=='D' and d==1 and c==50:\n        maxi=max(maxi,r-l+1)\nprint(maxi) \n# 2 цикла\nfor c in '0123456789':s=s.replace(c,'1')\nl=10\nfor i in range(len(s)):\n    for j in range(i+l+1,len(s)+1):\n        ss=s[i:j]\n        if ss[0]!='D' or ss.count('D')>1 or ss.count('1')>50: break\n        if ss[0]=='D' and ss.count('D')==1 and ss.count('1')==50:\n            l=len(ss)\nprint(l)"},"ans":"","final":"","flags":"","tree":[],"groups":0,"norx":true,"alias":"","realAns":"","src":"Школьково 24","lvl":"","file":"","alts":[],"tr":"ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC","ask":"","s":"ABACABBCABACABABACABBCABACABABACABBCABACABABACABBC","src2":"s = 'ABACABBCABACAB'\ns=input() \n#регулярки\nreg=r'D([^D0123456789]*[0123456789]){50}[^D0123456789]*'\nres=finditer(reg,s)\nprint(len(max([c.group() for c in res], key=len)))  \n#2 указателя\nd=0;c=0;maxi=0;l=0;r=0\nfor r in range(len(s)):\n    if l>r: continue\n    ss=s[l:r+1]\n    d+=(s[r]=='D')\n    c+=(s[r]
