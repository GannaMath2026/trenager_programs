 знака.","file":"https://kompege.ru/files/S252jcdI-.txt"},{"id":19967,"lvl":"Сл","src":"","blk":"B11","sub":"S2","subn":"Корректное выражение","st":"arch","q":"Текстовый файл состоит не более чем из 106 символов и содержит только цифры шестнадцатеричной системы счисления, а также знаки «+» и «*» (сложения и умножения). Определите максимальное количество символов в непрерывной последовательности, которая начинается символами AFD, за которыми следует правильное арифметическое выражение с целыми неотрицательными числами (без знака), записанными в десятичной системе счисления. В этом выражении никакие два знака арифметических операций не стоят рядом. В записи чисел отсутствуют незначащие (ведущие) нули. В ответе укажите количество символов в найденном выражении.","file":"https://kompege.ru/files/B1HkdXgLZ.txt"},{"id":19887,"lvl":"Б","src":"","blk":"B6","sub":"F6","subn":"Чередование классов","st":"arch","q":"(М. Попков) Во входном файле в строчку записаны арабские цифры от 0 до 9 включительно.\nТребуется найти самую длинную последовательность, в которой чётные и нечётные цифры чередуются. \nВ ответ запишите длину найденной последовательности.","file":"https://kompege.ru/files/pY-Y_SnCV.txt"},{"id":19884,"lvl":"С","src":"","blk":"B11","sub":"S3","subn":"Значение выражения","st":"arch","q":"(Л. Шастин) Текстовый файл состоит из цифр 0, 6, 7, 8, 9 и знаков арифметических операций «–» и «*» (вычитание и умножение). Определите количество непрерывных подпоследовательностей в этом файле, которые являются корректными арифметическими выражениями с целыми неотрицательными числами.\nВ таких выражениях никакие два знака арифметических операций не должны стоять рядом, а в записи чисел должны отсутствовать незначащие (ведущие) нули. В ответе укажите количество подходящих подпоследовательностей.\nНапример, в строке *567-8**09-30- есть следующие корректные арифметические выражения: 567-8, 67-8, 7-8, 9-3 и 9-30. Ответ: 5.\nПримечание. Отдельно стоящие числа арифметическими выражениями не считать. Число 0 не имеет знака.","file":"https://kompege.ru/files/AvgZjiADD.txt"},{"id":19751,"lvl":"Сл","src":"","blk":"B11","sub":"S3","subn":"Значение выражения","st":"arch","q":"Текстовый файл состоит из цифр от 1 до 9, знаков операций «+», «–» и «*» (сложение, вычитание и умножение) и заглавных латинских букв A, B, C, D. Назовём правильной суммой строку, содержащую последовательность из одного или более десятичных чисел, в которой между соседними числами стоит ровно один знак «+» и нет других знаков.\nПримеры правильных сумм: «23», «115+6», «1980+12+12351».\nНазовём результатом правильной суммы число, которое получится при выполнении записанных в соответствующей строке сложений. Например, результат правильной суммы «2+3» – число 5\nНайдите в данной строке правильную сумму, расположенную непосредственно после буквы A и имеющую наибольший результат.\nВ ответе запишите результат найденной суммы. Гарантируется, что ответ не превышает 2·109.","file":"https://kompege.ru/files/7U9TE3JMA.txt"},{"id":19719,"lvl":"Б","src":"","blk":"B11","sub":"S2","subn":"Корректное выражение","st":"arch","q":"(М. Попков) Разработчики создают систему автоматического распознавания математических выражений для образовательной платформы. Точность распознавания зависит от способности системы правильно идентифицировать и обрабатывать различные комбинации символов и чисел.\nДля тестирования вам выдали текстовый файл, состоящий из символов, обозначающих знаки « * », « – » и цифры 0, 1, 2, 3, 4, 9.\nВам нужно в прилагаемом файле определить максимальное количество идущих подряд символов, которые образуют математически правильную последовательность, в которую входят знаки «*» или «–» и целые неотрицательные числа без незначащих нулей, чтобы улучшить точность распознавания выражений.","file":"https://kompege.ru/files/LiyAFuUkw.txt"},{"id":19717,"lvl":"С","src":"","blk":"B8","sub":"K1","subn":"Не более K одного символа","st":"arch","q":"(М. Попков) Текстовый файл состоит из символов A, E, G, I, L, M и R.\nОпределите в прилагаемом файле максимальное количество идущих подряд символов (длину непрерывной подпоследовательности), среди которых символ M встречается не более 278 раз.","file":"https://kompege.ru/files/BFxC3cdCM.txt"},{"id":19716,"lvl":"Б","src":"","blk":"B6","sub":"F4","subn":"Соседние символы различны","st":"arch","q":"(М. Попков) Аналитики данных работают над проектом по выявлению аномалий в финансовых транзакциях. Обнаружение последовательностей с различными характеристиками может помочь в идентификации подозрительных или мошеннических операций, улучшая безопасность финансовых систем.\nВо входном файле в строчку записаны арабские цифры от 0 до 9 включительно. Вам нужно найти самую длинную последовательность, в которой соседние символы различны, чтобы выявить подозрительные паттерны в транзакциях.","file":"https://kompege.ru/files/rOH1hOX-i.txt"},{"id":19489,"lvl":"С","src":"","blk":"B8","sub":"K3","subn":"Не более K вхождений подстроки","st":"main","q":"(Л. Шастин) Текстовый файл состоит из символов F, S и W. Определите в прилагаемом файле максимальное количество идущих подряд символов, среди которых подстрока WWF встречается не более 120 раз, а подстрока WSFWW не встречается совсем.","file":"https://kompege.ru/files/Ho58arSQh.txt"},{"id":19254,"lvl":"Б","src":"ЕГКР 21.12.24","blk":"B8","sub":"L2","subn":"Ровно K подстроки (MAX)","st":"arch","q":"Текстовый файл состоит из символов F, G, Q, R, S и W. Определите в прилагаемом файле максимальное количество идущих подряд символов, среди которых подстрока FSRQ встречается ровно 80 раз.","file":"https://kompege.ru/files/x73tzLF0PK.txt"},{"id":19149,"lvl":"Г","src":"","blk":"B11","sub":"S3","subn":"Значение выражения","st":"main","q":"(В. Лашин) Текстовый файл состоит из символов ')', '(', знака '+' и цифр 1, 2, 3, 4. Определите максимальное количество символов в непрерывной последовательности, начинающихся с символа '(' и кончающихся символом ')', при этом последовательность является математически корректной и её значение кратно 2.\nВ этом выражении никакие два знака арифметических операций не стоят рядом, в начале и в конце математической последовательности не может стоять знак '+'.\nВ ответе укажите количество символов.","file":"https://kompege.ru/files/2mhhaHRMtr.txt"},{"id":18937,"lvl":"Сл","src":"Новогодний вариант 2025","blk":"B11","sub":"S2","subn":"Корректное выражение","st":"arch","q":"(М. Попков) В волшебном королевстве, где звезды искрятся на ночном небе, жил-был Числовой Заклинатель. Он умел создавать удивительные заклинания из чисел и знаков, используя только цифры 0, 2, 3, 4, 5 и знаки операций «+» (сложение) и «*» (умножение). Эти числа и знаки были ключами к его магии!\nОднажды, наш Числовой Заклинатель нашел древний свиток, на котором были написаны только эти символы. Он решил выяснить, сколько символов в непрерывной последовательности на свитке могут образовать корректное арифметическое выражение с целыми неотрицательными числами.","file":"https://kompege.ru/files/RjFdM83DQ8.txt"},{"id":18619,"lvl":"Сл","src":"","blk":"B11","sub":"S2","subn":"Корректное выражение","st":"arch","q":"Текстовый файл состоит из цифр от 1 до 6, знаков операций «–» и «*» (вычитание и умножение) и заглавных латинских букв A, B, C, D.\nОпределите максимальное количество символов в непрерывной последовательности символов, состоящей из буквы B, за которой следует корректное арифметическое выражение с целыми неотрицательными числами, записанными в десятичной системе счисления.","file":"https://kompege.ru/files/kC3I96Zwxx.txt"},{"id":18597,"lvl":"С","src":"","blk":"B11","sub":"S4","subn":"Форматы (e-mail, предложение, вещественные)","st":"arch","q":"(А. Сражаев) Текстовый файл состоит из десятичных цифр, а так же знака точки и знака & (амперсанд). Определите максимальное количество символов в непрерывной последовательности, которая является выражением вида четырехзначное вещественное число&четырехзначное вещественное число (например, 1234.56&2345.09874). В записи чисел отсутствуют незначащие (ведущие) нули.\nВ ответе укажите количество символов","file":"https://kompege.ru/files/H9po-M08oq.txt"},{"id":18530,"lvl":"Сл","src":"","blk":"B6","sub":"F10","subn":"Локальные максимумы, прогрессии расстояний","st":"arch","q":"(Л. Шастин) Текстовый файл состоит из символов A, B, C, D, E, F, G и H.\nОпределите максимальное количество идущих подряд символов в прилагаемом файле, среди которых последовательность расстояний между ближайшими соседними гласными буквами образует арифметическую прогрессию.\nНапример, в строке BBDABCADEFBACDFAB подходит подстрока BCADEFBACDFAB, последовательность расстояний между ближайшими соседними гласными буквами в ней образована с шагом 1 и выглядит так: 2, 3, 4. \nПримечание. Под расстоянием понимается разница индексов.","file":"https://kompege.ru/files/WVv5xdV1Fz.txt"},{"id":18285,"lvl":"Сл","src":"","blk":"B11","sub":"S2","subn":"Корректное выражение","st":"arch","q":"(Л. Шастин) Текстовый файл состоит из десятичных цифр, знаков «+» и «*» (сложения и умножения). Рассматриваются непрерывные последовательности символов, которые являются корректными арифметическими выражениями с целыми положительными числами. В этих выражениях никакие два знака арифметических операций не стоят рядом, порядок действий определяется по правилам математики. В записи чисел отсутствуют незначащие (ведущие) нули. Определите максимальное количество чисел, входящих в одну из таких последовательностей.","file":"https://kompege.ru/files/goQDRPaMn.txt"},{"id":18284,"lvl":"С","src":"","blk":"B12","sub":"T2","subn":"Подпоследовательность в окне (MIN)","st":"main","q":"(Л. Шастин) Текстовый файл состоит не более чем из 108 символов латиницы, входящих в слово «REVOLUTION». Найдите наименьшую длину подстроки, которая включает в себя подпоследовательность символов, образующих слово «LOVE». Например, для строки REVVVLAAORRVEARRLBOLRVER ответом будет являться число 7 — это длина подстроки LBOLRVE.","file":"https://kompege.ru/files/gMR43QyzY.txt"},{"id":18239,"lvl":"Сл","src":"","blk":"B11","sub":"S3","subn":"Значение выражения","st":"arch","q":"(Д. Бахтиев) Текстовый файл содержит цифры от 1 до 9 и знак арифметической операции «-» (вычитание). Определите максимальное количество символов в непрерывной последовательности, которая является корректным арифметическим выражением с целыми числами, чьё значение превышает -2000020000 (минус двадцать тысяч). Запрещается отрывать цифры от чисел, но разрешается брать их без знака. Например, в строке -23-456-789 нельзя взять выражение -456-78, но можно взять 23-456.\nВ ответе укажите количество символов.","file":"https://kompege.ru/files/ZT1fEfX5Pi.txt"},{"id":18186,"lvl":"Б","src":"","blk":"B10","sub":"P1","subn":"Ограничена разными символами","st":"arch","q":"(Д. Бахтиев) Текстовый файл состоит не более чем из 107 латинских символов из набора A, B, C, D, E, F, G, H.\nОпределите подстроку наибольшей длины, начинающуюся и заканчивающуюся подстрокой вида «Согласная + Согласная + Гласная» и не содержащую внутри себя другие подстроки такого вида. В ответе укажите одно число — наибольшую длину такой подстроки.","file":"https://kompege.ru/files/f_C8QZdtN.txt"},{"id":18147,"lvl":"С","src":"","blk":"B11","sub":"S3","subn":"Значение выражения","st":"main","q":"(В. Колчев) Текстовый файл состоит из символов, обозначающих знаки « + », « * » и цифры 7, 8, 9.\nОпределите максимальное значение, которое является результатом вычисления непрерывной последовательности, являющейся корректным арифметическим выражением из нескольких целых неотрицательных чисел, между которыми отсутствует операция умножения.\nВ этом выражении никакие два знака арифметических операций не стоят рядом.","file":"https://kompege.ru/files/nOE71D3tL.txt"},{"id":18029,"lvl":"Б","src":"","blk":"B10","sub":"P3","subn":"Отрезки между X: максимум внутри","st":"main","q":"(Л. Шастин) Текстовый файл состоит не более чем из 108 символов X, Y и Z. «ИКС-ДВА» подстроками назовем непрерывные подпоследовательности символов, начинающиеся и заканчивающиеся на X и не содержащие внутри других символов X. Найдите «ИКС-ДВА» подстроку, содержащую наибольшее количество символов Y, и определите её длину. Если таких подстрок в файле несколько, тогда укажите длину наименьшей из них.","file":"https://kompege.ru/files/Nt33qPAYB.txt"},{"id":17878,"lvl":"Сл","src":"Демоверсия 2025","blk":"B11","sub":"S2","subn":"Корректное выражение","st":"arch","q":"Текстовый файл состоит из цифр 0, 6, 7, 8, 9 и знаков арифметических операций «–» и «*» (вычитание и умножение). Определите максимальное количество символов в непрерывной последовательности, которая является корректным арифметическим выражением с целыми неотрицательными числами. \nВ этом выражении никакие два знака арифметических операций не стоят рядом, в записи чисел отсутствуют незначащие (ведущие) нули и число 0 не имеет знака.\nВ ответе укажите количество символов.","file":"https://kompege.ru/files/qspzCDuhi.txt"},{"id":17756,"lvl":"Б","src":"","blk":"B11","sub":"S1","subn":"Знаки операций не рядом","st":"main","q":"(Л. Шастин) Текстовый файл состоит из десятичных цифр, знаков «+» и «*» (сложения и умножения). Определите максимальное количество идущих подряд символов в прилагаемом файле, среди которых никакие два знака арифметических операций не записаны подряд.","file":"https://kompege.ru/files/0wGUBUjFW.txt"},{"id":17685,"lvl":"Г","src":"Пересдача 04.07.24","blk":"B11","sub":"S3","subn":"Значение выражения","st":"arch","q":"Текстовый файл состоит из десятичных цифр, знаков «+» и «*» (сложения и умножения). Определите максимальное количество символов в непрерывной последовательности, являющейся корректным арифметическим выражением с целыми неотрицательными числами (без знака), значение которого равно нулю. В этом выражении никакие два знака арифметических операций не стоят рядом, порядок действий определяется по правилам математики. В записи чисел отсутствуют незначащие (ведущие) нули.\nВ ответе укажите количество символов.","file":"https://kompege.ru/files/9rWpROaef.txt"},{"id":17641,"lvl":"Г","src":"Основная волна 19.06.24","blk":"B11","sub":"S3","subn":"Значение выражения","st":"arch","q":"Текстовый файл состоит из десятичных цифр, знаков «+» и «*» (сложения и умножения). Определите максимальное количество символов в непрерывной последовательности, являющейся корректным арифметическим выражением с целыми неотрицательными числами (без знака), значение которого равно нулю. В этом выражении никакие два знака арифметических операций не стоят рядом, порядок действий определяется по правилам математики. В записи чисел отсутствуют незначащие (ведущие) нули.\nВ ответе укажите количество символов.","file":"https://kompege.ru/files/IGVcRTjyP.txt"},{"id":17563,"lvl":"Сл","src":"Основная волна 08.06.24","blk":"B11","sub":"S2","subn":"Корректное выражение","st":"arch","q":"Текстовый файл состоит из символов, обозначающих знаки « – », « * » и цифры 0, 7, 8, 9.\nОпределите в прилагаемом файле максимальное количество идущих подряд символов, которые образуют математически правильную последовательность, в которую входят знаки « – » или « * » и натуральные числа без незначащих нулей.","file":"https://kompege.ru/files/bI4DufyyF.txt"},{"id":17535,"lvl":"С","src":"Основная волна 07.06.24","blk":"B8","sub":"L2","subn":"Ровно K подстроки (MAX)","st":"arch","q":"Текстовый файл состоит из символов A, B, C, D, E и F.\nОпределите максимальное количество идущих подряд символов в прилагаемом файле, среди которых пара символов CD (в указанном порядке) встречается ровно 160 раз.","file":"https://kompege.ru/files/kQTF43F8B.txt"},{"id":16388,"lvl":"Б","src":"ЕГКР 27.04.24","blk":"B7","sub":"I2","subn":"Узор с хотя бы одной полной группой","st":"arch","q":"Текстовый файл состоит из символов K, L, M и N. В прилагаемом файле определите максимальное количество символов в непрерывной подпоследовательности, состоящей из идущих подряд групп символов KLMN в указанном порядке, при этом в начале и в конце искомой последовательности группа символов KLMN может быть неполной.\nИскомая последовательность должна содержать не менее одной полной группы символов KLMN. Например, условию задачи удовлетворяют: MNKLMNKLMNK, или NKLMNKLMNKL, или KLMNKLMNKLM и т.п.","file":"https://kompege.ru/files/bolsdX6Ni.txt"},{"id":16333,"lvl":"Б","src":"Открытый вариант 2024","blk":"B6","sub":"F6","subn":"Чередование классов","st":"arch","q":"Текстовый файл состоит из заглавных букв латинского алфавита Q, R, W и цифр 1, 2, 4. \nОпределите в прилагаемом файле максимальное количество идущих подряд символов, среди которых ни одна буква не стоит рядом с буквой, а цифра – с цифрой.","file":"https://kompege.ru/files/-SHpnTZli.txt"},{"id":16269,"lvl":"С","src":"Джобс 03.05.24","blk":"B7","sub":"J4","subn":"Структурные цепочки (тройки, лесенки, повтор групп)","st":"arch","q":"(Е.Джобс) Текстовый файл состоит из символов T, U, V, W, X, Y и Z.\nОпределите в прилагаемом файле максимальную длину подстроки, состоящую из пар символов XX, YY или ZZ в произвольном порядке, при этом ни одна пара не должна повторяться два раза подряд. Например, в строке YYZZZZYYXX искомая подстрока ZZYYXX.\nДля решения задачи напишите программу.","file":"https://kompege.ru/files/ThUvzCgn3.txt"},{"id":15339,"lvl":"С","src":"Досрочная волна 2024","blk":"B6","sub":"F6","subn":"Чередование классов","st":"arch","q":"Текстовый файл состоит из символов латинского алфавита A, B, C, и цифр 6, 7, 8, 9.\nОпределите в прилагаемом файле максимальное количество идущих подряд символов, среди которых никакая буква не стоит рядом с буквой, а цифра – с цифрой.","file":"https://kompege.ru/files/Ph7cB8EWL.txt"},{"id":14704,"lvl":"Сл","src":"","blk":"B6","sub":"F9","subn":"Две фазы (рост, затем спад)","st":"main","q":"(П. Говоров) Программист Павел \"Setzor\" любит составлять различные строки из букв. В файле содержится строка длиной не более 107 из заглавных букв латинского алфавита (ABC…Z).\nОпределите в прилагаемом файле максимальную длину подпоследовательности, которая состоит из двух последовательных частей (сначала 1 часть, затем 2):\nв первой части символы расположены в алфавитном порядке, во второй в обратном алфавитном порядке. (1-ая и 2-ая часть могут быть различной длины).\nНапример, для строки QTUHHMSMJFSMECQ ответом будет являться подпоследовательность HHMSMJF (ответ 7), в которой 1 часть - HHMS, 2 - часть MJF (разделить можно также на части HHM и SMJF).","file":"https://kompege.ru/files/_Ix8d_teN.txt"},{"id":14647,"lvl":"Б","src":"Открытый курс \"Слово пацана\"","blk":"B8","sub":"L1","subn":"Ровно K символа (MAX)","st":"arch","q":"(М. Попков) Текстовый файл содержит только заглавные буквы латинского алфавита (ABC…Z). Определите максимальное количество идущих подряд символов, среди которых ровно по одному разу встречаются буквы X и Y.","file":"https://kompege.ru/files/cdegb1HpP.txt"},{"id":14646,"lvl":"С","src":"Открытый курс \"Слово пацана\"","blk":"B3","sub":"C2","subn":"Символ рядом с заданными","st":"arch","q":"(М. Попков) В файле в одну строку записаны заглавные английские буквы. Задача – определить наиболее часто встречающийся символ после комбинации из трех одинаковых символов. В случае, если наиболее встречающихся символов несколько, в ответ нужно записать последний по алфавиту символ и число его повторений без пробела.\nТак, например, для строки QQQPGGGGHHHG можно выделить комбинации GGGG, QQQP, HHHG. Ответ к примеру – G2.","file":"https://kompege.ru/files/oF6qYP-xT.txt"},{"id":14645,"lvl":"С","src":"Открытый курс \"Слово пацана\"","blk":"B6","sub":"F6","subn":"Чередование классов","st":"arch","q":"(М. Попков) Во входном файле в строчку записаны заглавные буквы английского алфавита. Требуется найти самую длинную последовательность, в которой гласные и согласные буквы чередуются. В ответ запишите длину найденной последовательности.\nПримечание: Y – гласная буква.","file":"https://kompege.ru/files/XQ1oKTnkz.txt"},{"id":14643,"lvl":"Б","src":"Открытый курс \"Слово пацана\"","blk":"B5","sub":"E3","subn":"Нет длинной подстроки","st":"arch","q":"(М. Попков) Текстовый файл состоит не более чем из 106 символов M, A, X.\nОпределите максимальное количество идущих подряд символов, среди которых нет подстроки AXMM.","file":"https://kompege.ru/files/H-cv2_5hW.txt"},{"id":14642,"lvl":"Б","src":"Открытый курс \"Слово пацана\"","blk":"B8","sub":"K1","subn":"Не более K одного символа","st":"arch","q":"(М. Попков) Файл с текстом состоит не более чем из 106 символов D, E, F.\nОпределите максимальное количество идущих подряд символов, среди которых символ F встречается не более одного раза.","file":"https://kompege.ru/files/9tWDV6aYP.txt"},{"id":14514,"lvl":"С","src":"","blk":"B4","sub":"D1","subn":"Серия одинаковых символов","st":"arch","q":"(Л. Шастин) Текстовый файл состоит не более, чем из 7 200 000 прописных символов латинского алфавита.\nДля последующего хранения и использования данные из файла сжимаются согласно алгоритму RLE — методу сжатия данных, который заменяет повторяющиеся символы на их количество и сам символ. Данные закодированы в формате UTF-8, то есть любой символ занимает в памяти 8 бит. Например, строка \"AAAABBBCCDAA\", состоящая из 12 символов и имеющая вес 96 бит, после применения RLE будет выглядеть как \"4A3B2CD2A\", состоять из 9 символов и весить 72 бита. В этом случае благодаря RLE удастся сэкономить 24 бита. \nОпределите количество бит, которое удастся сэкономить, если сжать данные из файла согласно алгоритму RLE.","file":"https://kompege.ru/files/ASqFMLUvG.txt"},{"id":14513,"lvl":"Б","src":"","blk":"B11","sub":"S4","subn":"Форматы (e-mail, предложение, вещественные)","st":"arch","q":"(Л. Шастин) Текстовый файл состоит из символов, обозначающих буквы латинского алфавита и десятичные цифры. \nНазовём маской образец строки, который строится на основании служебных знаков # и &, причём знак # обозначает непустую последовательность из идущих подряд букв, а знак & задает непустую последовательность из идущих подряд цифр.\nОпределите в прилагаемом файле максимальную длину подстроки, которая соответствует маске #&#.\nНапример, в строке \"42ABC123FG75BCD\" условию удовлетворяет подстрока \"ABC123FG\".","file":"https://kompege.ru/files/wzp4TdPWV.txt"},{"id":14512,"lvl":"С","src":"","blk":"B10","sub":"O1","subn":"Равное количество двух букв","st":"main","q":"(Л. Шастин) Текстовый файл состоит из символов, обозначающих буквы латинского алфавита A, В и С и цифры 1 и 8.\nОпределите в прилагаемом файле максимальную длину подстроки, которая начинается и заканчивается на разные цифры, включает в себя равное количество букв B и C и не содержит других цифр, кроме первой и последней.","file":"https://kompege.ru/files/hOdqavi8X.txt"},{"id":14510,"lvl":"С","src":"","blk":"B8","sub":"M1","subn":"Не менее K (MIN)","st":"arch","q":"(Л. Шастин) Текстовый файл состоит не более, чем из 7 200 000 прописных символов латинского алфавита.\nОпределите в прилагаемом файле минимальное количество идущих подряд символов, среди которых тройка символов вида согласная + согласная + гласная  встречается не менее 500 раз.\nПримечание. Гласные буквы латинского алфавита: A, E, I, O, U, Y.","file":"https://kompege.ru/files/P9lgSOVz9.txt"},{"id":14505,"lvl":"С","src":"","blk":"B6","sub":"F9","subn":"Две фазы (рост, затем спад)","st":"arch","q":"(Л. Шастин) Текстовый файл состоит не более, чем из 7 200 000 прописных символов латинского алфавита.\nОпределите в прилагаемом файле максимальное количество идущих подряд символов, среди которых никакая гласная буква не стоит раньше согласной.\nПримечание. Гласные буквы латинского алфавита: A, E, I, O, U, Y.","file":"https://kompege.ru/files/5F88rhv1s.txt"},{"id":14502,"lvl":"С","src":"","blk":"B8","sub":"M3","subn":"Покрытие множества (MIN)","st":"main","q":"(Л. Шастин) Текстовый файл состоит не более, чем из 7 200 000 прописных символов латинского алфавита.\nОпределите в прилагаемом файле минимальное количество идущих подряд символов, среди которых каждая латинская буква встречается хотя бы один раз.","file":"https://kompege.ru/files/KxBze8wbY.txt"},{"id":14242,"lvl":"Г","src":"","blk":"B10","sub":"O1","subn":"Равное количество двух букв","st":"main","q":"(П. Говоров) В файле содержится строка длиной не более 106 из букв A,B,D,E и цифр 0,1,2,3.\nОпределите в прилагаемом файле максимальную длину подпоследовательности, в которой количество согласных букв равно количеству гласных и количество четных цифр равно количеству нечетных","file":"https://kompege.ru/files/2BMhQKZkF.txt"},{"id":14100,"lvl":"С","src":"","blk":"B7","sub":"J2","subn":"Неоднозначное разбиение","st":"arch","q":"(П. Говоров) В файле содержится строка длиной не более 106 из букв A,B,C.\nОпределите в прилагаемом файле максимальную длину подпоследовательности, составленную конкатенацией из следующих подстрок (могут использоваться любое количество раз): ABA, CB, AC, BB, ABC, BCB, BA, AB.","file":"https://kompege.ru/files/TXjQKjpC3.txt"},{"id":13939,"lvl":"С","src":"","blk":"B11","sub":"R2","subn":"Самая длинная запись в системе","st":"arch","q":"(Д. Бахтиев) Текстовый файл состоит из цифр 0, 1, 2, 3, 4 и букв A, B, C, D, E.\nОпределите в прилагаемом файле количество подстрок, которые могут представлять запись натурального числа в троичной системе счисления без незначащих нулей.\nНапример, в строке D021AB320 есть пять троичных чисел, удовлетворяющих условию задачи: 2, 1, 21, 2, 20.","file":"https://kompege.ru/files/HbhVbNpYz.txt"},{"id":13866,"lvl":"Б","src":"","blk":"B6","sub":"F2","subn":"Три символа из набора не рядом","st":"arch","q":"(Л. Шастин) Текстовый файл состоит из символов, обозначающих буквы латинского алфавита и десятичные цифры.\nОпределите в прилагаемом файле максимальное количество идущих подряд символов, среди которых никакие три нечётные цифры не стоят рядом.","file":"https://kompege.ru/files/kQWNKBJ1R.txt"},{"id":13715,"lvl":"С","src":"","blk":"B8","sub":"L2","subn":"Ровно K подстроки (MAX)","st":"arch","q":"Текстовый файл состоит из символов A, B, C, D и E.\nОпределите в прилагаемом файле максимальное количество идущих подряд символов, среди которых комбинация символов AB встречается ровно 50 раз.","file":"https://kompege.ru/files/BPn7T1BoJ.txt"},{"id":13100,"lvl":"С","src":"","blk":"B8","sub":"K2","subn":"Несколько счётчиков и запретов","st":"main","q":"Текстовый файл содержит только заглавные буквы латинского алфавита (ABC…Z). Определите максимальное количество идущих подряд символов, среди которых каждая из букв C и D встречается не более двух раз.","file":"https://kompege.ru/files/npqaw91ym.txt"},{"id":13085,"lvl":"С","src":"","blk":"B8","sub":"L1","subn":"Ровно K символа (MAX)","st":"arch","q":"Текстовый файл содержит только заглавные буквы латинского алфавита (ABC…Z). Определите максимальное количество идущих подряд символов, среди которых ровно по одному разу встречаются буквы X и Y.","file":"https://kompege.ru/files/qJ8bde_Gx.txt"},{"id":12946,"lvl":"С","src":"","blk":"B6","sub":"F6","subn":"Чередование классов","st":"arch","q":"(C. Горбачёв) Текстовый файл состоит из символов, обозначающих заглавные буквы латинского алфавита и цифры от 1 до 9 включительно. Определите в прилагаемом файле максимальное количество идущих подряд символов, среди которых ни одна буква не стоит рядом с буквой, а цифра — с цифрой.","file":"https://kompege.ru/files/qk-Iz4CVd.txt"},{"id":12931,"lvl":"Б","src":"PRO100 ЕГЭ 26.01.24","blk":"B7","sub":"I2","subn":"Узор с хотя бы одной полной группой","st":"arch","q":"Текстовый файл состоит из символов T, U, V, W, X, Y и Z. В прилагаемом файле определите максимальное количество символов в непрерывной подпоследовательности, состоящей из идущих подряд групп символов VWXYZ в указанном порядке. При этом в начале и в конце искомой последовательности группа символов VWXYZ может быть неполной.\nИскомая подпоследовательность должна содержать не менее одной полной группы символов VWXYZ.\nНапример, условию задачи удовлетворяют: XYZVWXYZVWXYZV; VWXYZ и т.п.","file":"https://kompege.ru/files/qkR7RjeWn.txt"},{"id":12476,"lvl":"Сл","src":"PRO100 ЕГЭ 29.12.23","blk":"B8","sub":"L2","subn":"Ровно K подстроки (MAX)","st":"main","q":"Текстовый файл состоит из символов P, R, O, E, G – зашифрованное письмо Деду Морозу.\nОпределите в прилагаемом файле максимальное количество идущих подряд символов, среди которых комбинация символов RO встречается ровно 21 раз, а комбинации символов ORO и ROR ни разу не встречаются.","file":"https://kompege.ru/files/uleRzVuPF.txt"},{"id":12410,"lvl":"С","src":"","blk":"B8","sub":"L3","subn":"Ровно K + условия на границы","st":"arch","q":"(Л. Шастин) Текстовый файл состоит не более, чем из 7 200 000 прописных символов латинского алфавита.\nОпределите в прилагаемом файле максимальное количество идущих подряд символов, среди которых прямой алфавитный порядок нарушается ровно 100000 раз.\nНапример, в подстроке AABCEGBCDFXCDEFA прямой алфавитный порядок нарушается ровно трижды.","file":"https://kompege.ru/files/plKdEkV3w.txt"},{"id":12254,"lvl":"Б","src":"ЕГКР 16.12.23","blk":"B7","sub":"I2","subn":"Узор с хотя бы одной полной группой","st":"arch","q":"Текстовый файл состоит из символов R, S и Q. В прилагаемом файле определите максимальное количество символов в непрерывной подпоследовательности, состоящей из идущих подряд групп символов RSQ в указанном порядке. При этом в начале и в конце искомой последовательности группа символов RSQ может быть неполной.\nИскомая подпоследовательность должна содержать не менее одной полной группы символов RSQ.\nНапример, условию задачи удовлетворяют: SQRSQRSQR; QRSQRS и т.п.","file":"https://kompege.ru/files/P0zjBljKv.txt"},{"id":12111,"lvl":"Б","src":"Новогодний вариант","blk":"B7","sub":"H2","subn":"Тройки из списка","st":"arch","q":"(М. Попков) Текстовый файл содержит зашифрованное письмо Санта-Клаусу, состоящее только из символов H, P, N, Y, с просьбой о подарке. Какой подарок хочет ребенок зависит от максимального количества идущих подряд троек символов HPY или NYN в прилагаемом файле.\nИскомая последовательность должна состоять только из троек HPY, или только из троек NYN, или только из троек HPY и NYN.\nПомогите Санте расшифровать послание, определите данное максимальное значение.","file":"https://kompege.ru/files/9sLZzdnGu.txt"},{"id":11954,"lvl":"С","src":"","blk":"B8","sub":"M1","subn":"Не менее K (MIN)","st":"arch","q":"(PRO100 ЕГЭ) Текстовый файл состоит из символов T, U, V, W, X, Y и Z.\nОпределите в прилагаемом файле минимальное количество идущих подряд символов (длину непрерывной подпоследовательности), среди которых символ X встречается не менее 500 раз, а символ Y не встречается совсем.","file":"https://kompege.ru/files/AGU3HUeiX.txt"},{"id":11813,"lvl":"Б","src":"","blk":"B6","sub":"F6","subn":"Чередование классов","st":"main","q":"(Л. Шастин) Текстовый файл состоит из символов, обозначающих прописные буквы латинского алфавита.\nОпределите в прилагаемом файле максимальное количество идущих подряд символов, среди которых гласные и согласные буквы чередуются.","file":"https://kompege.ru/files/PMp6GMWYC.txt"},{"id":11667,"lvl":"С","src":"","blk":"B8","sub":"L2","subn":"Ровно K подстроки (MAX)","st":"arch","q":"(Л. Шастин) Текстовый файл состоит не более, чем из 107 прописных символов латинского алфавита. Определите в прилагаемом файле максимальное количество идущих подряд символов (длину непрерывной подпоследовательности), среди которых сочетание символов INFINITY встречается ровно 1000 раз.","file":"https://kompege.ru/files/yrMLZnCMy.txt"},{"id":11636,"lvl":"Сл","src":"","blk":"B9","sub":"N4","subn":"Количество подстрок/окон (сложные)","st":"arch","q":"(Л. Шастин) Текстовый файл состоит не более, чем из 7 200 000 прописных символов латинского алфавита. Определите в прилагаемом файле количество подстрок вида A#A, где на месте # стоит хотя бы один символ.","file":"https://kompege.ru/files/7Qu5mQV8J.txt"},{"id":11241,"lvl":"Б","src":"","blk":"B4","sub":"D2","subn":"Серия символов из набора / без набора","st":"arch","q":"(М. Ишимов) Текстовый файл состоит из символов, обозначающих прописные буквы латинского алфавита.\nОпределите в прилагаемом файле максимальное количество идущих подряд символов, среди которых нет ни одной буквы из набора букв A,B,CA,B,C и DD.","file":"https://kompege.ru/files/12XLa84CA.txt"},{"id":10724,"lvl":"Б","src":"","blk":"B11","sub":"R2","subn":"Самая длинная запись в системе","st":"main","q":"(PRO100 ЕГЭ) Текстовый файл состоит из символов, обозначающих заглавные буквы латинского алфавита и цифры от 0 до 9 включительно. Определите в прилагаемом файле максимальное количество идущих подряд символов, которые могут представлять запись числа в шестнадцатеричной системе счисления.\nПримечание. Цифры, числовое значение которых превышает 9, обозначены латинскими буквами, начиная с буквы А.\nЧисла с незначащими нулями в ответ брать не следует.","file":"https://kompege.ru/files/KjQITJOP6.txt"},{"id":10131,"lvl":"Сл","src":"","blk":"B10","sub":"O1","subn":"Равное количество двух букв","st":"main","q":"(С. Чайкин) Текстовый файл состоит не более чем из 106 заглавных букв латинского алфавита. Определите максимальную длину подстроки, содержащую равное количество букв A и B.","file":"https://kompege.ru/files/oJLokDg_n.txt"},{"id":10105,"lvl":"С","src":"Демоверсия 2024","blk":"B8","sub":"L1","subn":"Ровно K символа (MAX)","st":"main","q":"Текстовый файл состоит из символов T, U, V, W, X, Y и Z.\nОпределите в прилагаемом файле максимальное количество идущих подряд символов (длину непрерывной подпоследовательности), среди которых символ T встречается ровно 100 раз.","file":"https://kompege.ru/files/-thDGMme0.txt"},{"id":9850,"lvl":"Б","src":"","blk":"B4","sub":"D2","subn":"Серия символов из набора / без набора","st":"arch","q":"(В. Ген) Текстовый файл состоит не более чем из 107 заглавных букв латинского алфавита. Определите максимальную длину подстроки, не содержащей в себе букв L, I, S, E, N, O, K.","file":"https://kompege.ru/files/Aj3AyQciI.txt"},{"id":9845,"lvl":"Б","src":"Основная волна 27.06.23","blk":"B6","sub":"F6","subn":"Чередование классов","st":"arch","q":"Текстовый файл состоит из символов, обозначающих буквы латинского алфавита А, В и С и цифры 8 и 9.\nОпределите в прилагаемом файле максимальное количество идущих подряд символов, среди которых ни одна буква не стоит рядом с буквой, а цифра — с цифрой.","file":"https://kompege.ru/files/HIJpUMRws.txt"},{"id":9791,"lvl":"С","src":"Основная волна 20.06.23","blk":"B11","sub":"R2","subn":"Самая длинная запись в системе","st":"arch","q":"Текстовый файл состоит из символов, обозначающих заглавные буквы латинского алфавита и цифры от 1 до 9 включительно. Определите в прилагаемом файле максимальное количество идущих подряд символов, которые могут представлять запись числа в шестнадцатеричной системе счисления.\nПримечание. Цифры, числовое значение которых превышает 9, обозначены латинскими буквами, начиная с буквы А.","file":"https://kompege.ru/files/o7GIvUMYm.txt"},{"id":9753,"lvl":"Сл","src":"Основная волна 19.06.23","blk":"B8","sub":"K1","subn":"Не более K одного символа","st":"arch","q":"Текстовый файл состоит из символов T, U, V, W, X, Y и Z.\nОпределите в прилагаемом файле максимальное количество идущих подряд символов (длину непрерывной подпоследовательности), среди которых символ Y встречается не более 150 раз.","file":"https://kompege.ru/files/mG-kU8F-l.txt"},{"id":9709,"lvl":"С","src":"Danov2307","blk":"B10","sub":"P1","subn":"Ограничена разными символами","st":"arch","q":"(А.Богданов) Передатчик непрерывно передает цифры и заглавные буквы латинского алфавита (ABC…Z). Если нет полезного сообщения, то передается повторяющаяся последовательность XYZ, которая может быть прервана на любой букве вставкой фрагмента полезного сообщения. После передачи полезного сообщения продолжается передача XYZ со следующего за прерванным символом. Известно, что первый и последний символы полезного сообщения не мешают выявлению полезного сообщения. Длина фрагмента повторяющейся последовательности не менее трех символов. Найдите максимальную длину фрагмента полезного сообщения.\n\nПример: XYZXYZXYUSEFULLMESSAGEZXYZXYZXYAVERYUSEFULLMESSAGEZXYZXYZXYZ","file":"https://kompege.ru/files/_MUiOn6TB.txt"},{"id":9552,"lvl":"Сл","src":"Джобс 14.06.23","blk":"B7","sub":"J1","subn":"Блоки разной длины","st":"arch","q":"В файле содержится строка длиной не более 106 из букв английского алфавита. Определите максимальную длину подпоследовательности, которая состоит только из пар символов PC, только из четверок символов CSGO, или из непересекающихся пар символов PC и четверок символов CSGO.\nНапример, в строке ASDPCCSGOPCNGCHPCPCSGOPC есть три подходящие подпоследовательности PCCSGOPC, PCPC и CSGOPC. Максимальная длина – 8.","file":"https://kompege.ru/files/2-duXbPMn.txt"},{"id":9377,"lvl":"Сл","src":"Джобс 10.06.23","blk":"B11","sub":"R1","subn":"Числа между буквами (мин/макс, чётность)","st":"arch","q":"В файле содержится строка длиной не более 106 из букв английского алфавита и десятичных цифр. Определите максимальную длину подстроки, которая состоит из четных чисел, разделенных буквенными комбинациями (без цифр от 0 до 9).\nНапример, в строке AS0256DG124FB2NHF1643GH124GG22ABCDF942AACV таких подстрок две: 124FB2 и 124GG22ABCDF942. Максимальная длина – 15. Число 256 в такой строке не участвует в формировании искомой строки, так как цифровая последовательность, начинающаяся после буквы слева, начинается на 0. Аналогичное рассуждение относится к возможному четному значению 164, являющемуся началом послежовательности 1643, так как в качестве цифровых последовательностей выбираются цепочки, ограниченные с обоих сторон буквами.\nПримечание: все цифры в числах должны быть значащими.","file":"https://kompege.ru/files/GxsR9eqv1.txt"},{"id":9169,"lvl":"Сл","src":"Джобс 06.06.2023","blk":"B8","sub":"M2","subn":"Ровно K (MIN)","st":"main","q":"В файле содержится строка длиной не более 106 из букв английского алфавита. Определите минимальную длину подстроки, в которой ровно три тройки BAD или FAT.\nНапример, в строке SDFATFDBADZZSFATBADGHTBAD есть три подходящие подстроки FATFDBADZZSFAT, BADZZSFATBAD и FATBADGHTBAD. Минимальная длина 12.","file":"https://kompege.ru/files/3ioHBrX2_.txt"},{"id":9075,"lvl":"Б","src":"Danov2306","blk":"B6","sub":"F6","subn":"Чередование классов","st":"arch","q":"(А.Богданов) Текстовый файл состоит не более чем из 106 символов и содержит только буквы латинского алфавита и десятичные цифры. Определите максимальное количество идущих подряд символов, среди которых нет рядом стоящих четных и нечетных цифр.","file":"https://kompege.ru/files/jAZiyc8cN.txt"},{"id":8959,"lvl":"Б","src":"Джобс 02.06.2023","blk":"B7","sub":"J1","subn":"Блоки разной длины","st":"arch","q":"(Е. Джобс) В файле содержится строка длиной не более 106 из букв английского алфавита. Определите максимальную длину подпоследовательности, которая состоит только из пар символов EA, только из троек символов NPC, или из пар символов EA и троек символов NPC.\nНапример, в строке FASEAEANPCVESEAEAEADDNPC есть три подходящие подпоследовательности EAEANPC, EAEAEA и NPC. Максимальная длина – 7.","file":"https://kompege.ru/files/apRHXZuFH.txt"},{"id":8654,"lvl":"С","src":"","blk":"B5","sub":"E6","subn":"Запрет по маске / почти совпадение","st":"main","q":"(Л. Шастин) Текстовый файл состоит не более, чем из 1 200 000 прописных символов латинского алфавита. Назовём маской подстроки последовательность символов, в которой также может встречаться символ «?», который означает ровно одну произвольную букву. \nОпределите максимальное количество идущих подряд символов, среди которых нет ни одной подстроки, соответствующей маске ?B??D.\nПример: подстроки CBFED и BBBBD соответствуют маске ?B??D, а подстроки BCEFD и RBECS - нет.","file":"https://kompege.ru/files/HzZ6Z8KrR.txt"},{"id":8615,"lvl":"Б","src":"","blk":"B6","sub":"F2","subn":"Три символа из набора не рядом","st":"main","q":"(Л. Шастин) Текстовый файл состоит не более, чем из 1 200 000 прописных символов латинского алфавита. Определите максимальное количество идущих подряд символов, среди которых любые три символа из набора A, B, C, D, E, F в различных комбинациях (с учётом повторений) не стоят рядом.","file":"https://kompege.ru/files/p0qZmR-Lk.txt"},{"id":8579,"lvl":"С","src":"","blk":"B10","sub":"P1","subn":"Ограничена разными символами","st":"arch","q":"(Л. Шастин) Текстовый файл состоит не более чем из 107 символов и содержит только буквы латинского алфавита и десятичные цифры. Найдите максимальную длину подстроки, которая начинается и заканчивается цифрами разной чётности, но при этом не содержит внутри других цифр. В ответе укажите длину найденной строки.","file":"https://kompege.ru/files/ooikT04at.txt"},{"id":8567,"lvl":"Б","src":"","blk":"B6","sub":"F2","subn":"Три символа из набора не рядом","st":"arch","q":"(В. Рыбальченко)Текстовый файл 24.txt состоит не более чем из 107 прописных латинских букв. Определите максимальное количество идущих подряд символов, среди которых не содержится три символа из набора букв A, B, C, D в различных комбинациях (с учётом повторений), стоящих рядом.","file":"https://kompege.ru/files/m-IQ5r4sq.txt"},{"id":8510,"lvl":"С","src":"Апробация 17.05","blk":"B6","sub":"F1","subn":"Два символа из набора не рядом","st":"arch","q":"Текстовый файл состоит из символов, обозначающих прописные буквы латинского алфавита.\nОпределите максимальное количество идущих подряд символов, среди которых никакие две буквы из набора букв N, O и P (с учетом повторений) не записаны подряд.","file":"https://kompege.ru/files/XBGwzXHsB.txt"},{"id":8480,"lvl":"С","src":"","blk":"B6","sub":"F1","subn":"Два символа из набора не рядом","st":"arch","q":"(В. Рыбальченко) Текстовый файл состоит не более чем из 107 прописных латинских букв. Определите максимальное количество идущих подряд символов, среди которых не содержится два символа из набора букв A, B, C в различных комбинациях (с учётом повторений), стоящих рядом.","file":"https://kompege.ru/files/bXV8I3Tw9.txt"},{"id":8431,"lvl":"С","src":"","blk":"B12","sub":"T3","subn":"Разделители с перекрытием","st":"main","q":"Шифровка содержит только заглавные буквы латинского алфавита (ABC…Z). Группа из трёх идущих подряд символов, содержащая по одному разу каждую из букв X, Y и Z, считается разделителем. Разделители могут накладываться друг на друга, например, последовательность символов YZXYZ считается идущими подряд разделителями YZX, ZXY и XYZ. \nПри дешифровке разделители удаляются, разбивая шифровку на фрагменты. Определите количество символов в самом длинном фрагменте шифровки, полученном после удаления разделителей.\nПример\nПусть шифровка содержит такие символы:\nBADZXYZKLMENYZXXX.\nРазделители в этой строке выделены жирным шрифтом. Шифровка содержит три фрагмента: BAD, KLMEN и XX. Самый длинный из них содержит 5 символов, в ответе в данном примере надо записать число 5.","file":"https://kompege.ru/files/lbnvxzRva.txt"},{"id":8378,"lvl":"С","src":"Danov2305","blk":"B10","sub":"P1","subn":"Ограничена разными символами","st":"arch","q":"(А.Богданов) В текстовом файле приведен геном коронавируса SARS-CoV-2 в виде последовательности из четырех нуклеотидов, обозначенных буквами A,T,G,C. Белки кодируются последовательностью кодонов. Кодон состоит из трех нуклеотидов (три буквы подряд). Код белка начинается со старт-кодона (ATG, который может встречаться и внутри кода белка) и заканчивается стоп-кодоном (TAA или TGA или TAG, которые не может встречаться внутри кода белка). Известно, что S-белок отвечает за проникновение вируса в клетку и кодируется фрагментом, который начинается на ATGTTT и заканчивается на ACATAA и не содержит внутри себя стоп-кодоны. Найдите длину S-белка в кодонах, включая старт и стоп-кодоны.","file":"https://kompege.ru/files/UgUkCkave.txt"},{"id":8166,"lvl":"Б","src":"/dev/inf 05.23","blk":"B7","sub":"H3","subn":"Блоки по классам символов","st":"arch","q":"(А. Рогов) Текстовый файл состоит из символов, обозначающих прописные буквы латинского алфавита. Определите максимальное количество идущих подряд пар символов, каждая из которых содержит только символы из набора букв A, B и C (с учётом повторений).\nПример входных данных\nQWAABAD\nДля приведенного примера максимальное количество идущих подряд пар это 2: АА и ВА.","file":"https://kompege.ru/files/EHtApFlt0.txt"},{"id":7981,"lvl":"Сл","src":"","blk":"B9","sub":"N2","subn":"Количество подстрок с равными краями","st":"main","q":"(Л. Шастин) Текстовый файл состоит не более, чем из 1 200 000 прописных символов латинского алфавита. Определите количество подстрок длиной не менее 2, начинающихся и заканчивающихся на одну и ту же букву, среди которых любые два символа из набора A, B, C в различных комбинациях (с учётом повторений) не стоят рядом.","file":"https://kompege.ru/files/UTWIS97eK.txt"},{"id":7891,"lvl":"С","src":"","blk":"B10","sub":"P2","subn":"Ограничена одинаковым символом","st":"main","q":"﻿﻿﻿﻿(Е. Фокин) Текстовый файл состоит не более чем из 106 символов и содержит только буквы латинского алфавита и десятичные цифры. Найдите максимальную длину подстроки, ограниченной с двух сторон одним и тем же символом и не содержащей этого символа между ними. В ответе укажите длину найденной строки, включая граничные символы. Например, для строки ABCDABECD ответом будет 6.","file":"https://kompege.ru/files/mcsGxbAFm.txt"},{"id":7853,"lvl":"Сл","src":"Danov2304","blk":"B6","sub":"F3","subn":"Запрет «через один»","st":"main","q":"(А.Богданов) Текстовый файл состоит из символов латинского алфавита и десятичных цифр. Определите максимальное количество идущих подряд символов, среди которых любые два символа из набора N,O,T в различных комбинациях(с учётом повторений) не стоят через один символ (который может быть любым). Например, ТEN или NUТ не могут быть в искомой подстроке.","file":"https://kompege.ru/files/E9VsBlSM4.txt"},{"id":7824,"lvl":"С","src":"","blk":"B6","sub":"F2","subn":"Три символа из набора не рядом","st":"arch","q":"(М. Ишимов) Текстовый файл состоит из символов, обозначающих прописные буквы латинского алфавита.\nОпределите максимальное количество идущих подряд символов, среди которых никакие три буквы из набора букв A, B и С (с учетом повторений) не записаны подряд.","file":"https://kompege.ru/files/58NBz_FT6.txt"},{"id":7723,"lvl":"Б","src":"","blk":"B7","sub":"H3","subn":"Блоки по классам символов","st":"arch","q":"(Грачев Н.) Текстовый файл состоит из символов D, R и цифр 1, 8.\nОпределите максимальное количество идущих подряд троек символов вида двузначное число + буква в прилагаемом файле.","file":"https://kompege.ru/files/06ExX0vcK.txt"},{"id":7688,"lvl":"С","src":"","blk":"B7","sub":"J1","subn":"Блоки разной длины","st":"arch","q":"(В. Рыбальченко) Текстовый файл состоит не более чем из 106 латинских букв и десятичных цифр. Определите максимальную длину цепочки символов, состоящей из повторяющихся фрагментов XA, XY, TXA в любом порядке. В ответ укажите найденную длину.","file":"https://kompege.ru/files/gPPhWV7BV.txt"},{"id":7662,"lvl":"С","src":"Вариант от ChatGPT","blk":"B8","sub":"K3","subn":"Не более K вхождений подстроки","st":"arch","q":"(М. Шагитов) Определите максимальную длину последовательности символов в текстовом файле, который состоит из не более 106 символов (заглавные латинские буквы и десятичные цифры). Последовательность должна удовлетворять следующим условиям: комбинация символов \"SOLO\" встречается не более 4 раз и в последовательности присутствуют как минимум 5 различных цифр.","file":"https://kompege.ru/files/4gHwZ5GpX.txt"},{"id":7624,"lvl":"Б","src":"Досрочная волна 2023","blk":"B6","sub":"F1","subn":"Два символа из набора не рядом","st":"arch","q":"Текстовый файл состоит из прописных символов латинских букв.\nОпределите максимальное количество подряд идущих символов в прилагаемом файле, среди которых не содержится два символа из набора букв X, Y и Z (с учётом повторений), стоящих рядом.","file":"https://kompege.ru/files/2k6zlwlNP.txt"},{"id":7600,"lvl":"Б","src":"Досрочная волна 2023","blk":"B6","sub":"F1","subn":"Два символа из набора не рядом","st":"main","q":"Текстовый файл состоит не более, чем из 1 200 000 прописных символов латинского алфавита. Определите максимальное количество идущих подряд символов, среди которых любые два символа из набора Q, R, S в различных комбинациях (с учётом повторений) не стоят рядом.","file":"https://kompege.ru/files/PftWBzpUM.txt"},{"id":7356,"lvl":"С","src":"","blk":"B8","sub":"K3","subn":"Не более K вхождений подстроки","st":"arch","q":"(Л. Шастин) Текстовый файл состоит из символов A, C, D, F и O. \nОпределите максимальное количество идущих подряд символов, среди которых не более 5 пар вида \nсогласная + гласная  в прилагаемом файле.","file":"https://kompege.ru/files/Qul_gD19y.txt"},{"id":7272,"lvl":"Б","src":"OpenFIPI","blk":"B7","sub":"H1","subn":"Пары из списка","st":"arch","q":"Текстовый файл состоит из символов A, B и C. \nОпределите максимальное количество идущих подряд пар символов AB или CB в прилагаемом файле.\nИскомая подпоследовательность должна состоять только из пар AB, или только из пар CB, или только из пар AB и CB в произвольном порядке следования этих пар.","file":"https://kompege.ru/files/QLNAobQmz.txt"},{"id":7094,"lvl":"Б","src":"OpenFIPI","blk":"B7","sub":"H3","subn":"Блоки по классам символов","st":"arch","q":"Текстовый файл состоит из символов A, C, D, F и U.Определите максимальное количество идущих подряд пар символов вида\nсогласная + гласная\nв прилагаемом файле.","file":"https://kompege.ru/files/pXoVGfxeN.txt"},{"id":7043,"lvl":"Сл","src":"Danov2303","blk":"B12","sub":"T2","subn":"Подпоследовательность в окне (MIN)","st":"arch","q":"(А.Богданов) Текстовый файл состоит не более чем из 106 символов и содержит только десятичные цифры и буквы латинского алфавита. Найдите минимальную длину подстроки, содержащей в порядке возрастания все шестнадцатеричные цифры. Строка может включать повторяющиеся цифры и другие символы. В ответе укажите найденную длину.\nПример: Строка '0XY3Z9ABC1948FRG2333W4' содержит первые 5 символов (из 16 нужных).","file":"https://kompege.ru/files/5hDUOCDsO.txt"},{"id":7016,"lvl":"Б","src":"","blk":"B10","sub":"P1","subn":"Ограничена разными символами","st":"main","q":"(Д. Статный)  Текстовый файл состоит из букв латинского алфавита и десятичных цифр. Определите максимальную длину подстроки, которая ограничена с одной стороны буквой A, а с другой - D и не содержит других букв A и D внутри.","file":"https://kompege.ru/files/zytAPLWaj.txt"},{"id":7012,"lvl":"С","src":"","blk":"B2","sub":"B4s","subn":"Подпоследовательность в строке","st":"main","q":"Текстовый файл состоит не более чем из 106 символов и содержит только заглавные буквы латинского алфавита (ABC…Z) и десятичные цифры. Файл разбит на строки различной длины. Определите количество строк, в которых встречается сочетание букв QWERTY, полученные путем удаления лишних символов без перестановок. \nПример: \nПусть в файле находится 3 строки:\n QW1ERTY5EEQW\nTTERTTYFF\nQ6W6EHRHTHYR \nЗдесь можно получить сочетания QWERTY путем удаления лишних символов без перестановок в двух строках.","file":"https://kompege.ru/files/NlYgye1FC.txt"},{"id":6798,"lvl":"С","src":"","blk":"B7","sub":"H3","subn":"Блоки по классам символов","st":"arch","q":"(PRO100 ЕГЭ) Текстовый файл состоит из символов A, C, D, F и O. Определите максимальное количество идущих подряд троек символов вида\n  согласная + любая буква + гласная\nв прилагаемом файле.\nНапример, для строки ACCADAADD ответом будет число 2 (ACCADAADD).","file":"https://kompege.ru/files/A0SaX43YT.txt"},{"id":6757,"lvl":"Б","src":"Апробация 10.03.23","blk":"B7","sub":"H2","subn":"Тройки из списка","st":"arch","q":"Текстовый файл состоит из символов С, D, Е и F.\n\nОпределите максимальное количество идущих подряд последовательностей символов CFE или FCE в прилагаемом файле. Искомая подпоследовательность должна состоять только из троек CFE, или только из троек FCE, или только из троек CFE или FCE в произвольном порядке их следования.","file":"https://kompege.ru/files/YNMmVhGrf.txt"},{"id":6734,"lvl":"С","src":"","blk":"B8","sub":"M2","subn":"Ровно K (MIN)","st":"main","q":"(В. Петров) Текстовый файл содержит строку из заглавных латинских букв и точек, всего не более 106 символов. Определите минимальное количество идущих подряд символов, среди которых ровно семь точек.","file":"https://kompege.ru/files/i4rC_FqNq.txt"},{"id":6636,"lvl":"Б","src":"Пробник ИМЦ СПб","blk":"B7","sub":"H3","subn":"Блоки по классам символов","st":"arch","q":"Текстовый файл состоит из цифр 1, 2, 3, 4 и 5. Определите максимальное количество идущих подряд пар символов вида:\nчетная цифра + нечетная цифра\nв прилагаемом файле.\nНапример: если в файле содержится последовательность\n1234525345234, то ответ 3, потому что самая длинная последовательность состоит из 3 пар: ...234525…","file":"https://kompege.ru/files/-Et1tUqOw.txt"},{"id":6275,"lvl":"Сл","src":"Danov2302","blk":"B8","sub":"M3","subn":"Покрытие множества (MIN)","st":"arch","q":"(А.Богданов) Текстовый файл содержит строку из десятичных цифр и букв латинского алфавита. Найдите минимальную длину подстроки включающей все шестнадцатеричные цифры. Строка может включать повторяющиеся цифры и другие символы. В ответе укажите найденную длину.","file":"https://kompege.ru/files/huzooBIjx.txt"},{"id":6094,"lvl":"С","src":"/dev/inf 02.2023","blk":"B7","sub":"H5","subn":"Блоки + запрещённая подстрока","st":"arch","q":"(А. Рогов) Текстовый файл состоит не более чем из 1 200 000 символов X, Y, и Z. Определите максимальное количество идущих подряд пар символов вида\nсогласная + гласная\nсреди которых нет подстроки XYZY.\nПримечание. Букву Y считайте всегда гласной.","file":"https://kompege.ru/files/XS4AEb3gB.txt"},{"id":6060,"lvl":"Б","src":"","blk":"B1","sub":"A7","subn":"Палиндромы фиксированной длины","st":"arch","q":"﻿﻿﻿﻿﻿(А.Игнатюк) В файле представлена последовательность, состоящая из символов X, Y, Z. Необходимо указать количество всех палиндромов (слова, которые справа налево и слева направо читаются одинаково), состоящих из 9 символов, имеющихся в последовательности.","file":"https://kompege.ru/files/h4yYOkerf.txt"},{"id":6054,"lvl":"Б","src":"ФИПИ 04.02.23","blk":"B7","sub":"H3","subn":"Блоки по классам символов","st":"arch","q":"Текстовый файл состоит из символов A, B, C. \nОпределите максимальную длину подпоследовательности подряд идущих символов, состоящую из троек вида \nсогласная + согласная + гласная\nНапример, для строки ABBACCABC искомая последовательность - это BBACCA, и ответом является 6.","file":"https://kompege.ru/files/wkXkxyVGO.txt"},{"id":6029,"lvl":"Б","src":"ФИПИ 03.02.23","blk":"B6","sub":"F6","subn":"Чередование классов","st":"arch","q":"Текстовый файл состоит из символов E, D и F.\nОпределите максимальную длину непрерывной последовательности символов, состоящей из чередующихся символов E и F в прилагаемом файле. Искомая последовательность может начинаться как с символа E, так и с символа F.","file":"https://kompege.ru/files/RUqXTSNxX.txt"},{"id":5955,"lvl":"С","src":"","blk":"B5","sub":"E6","subn":"Запрет по маске / почти совпадение","st":"arch","q":"Текстовый файл состоит из символов A, C, D, F и O. \nОпределите максимальное количество идущих подряд символов, среди которых нет подстроки вида \nсогласная + гласная + гласная + согласная\nв прилагаемом файле.","file":"https://kompege.ru/files/qkB7IiONg.txt"},{"id":5888,"lvl":"Сл","src":"Danov2301","blk":"B5","sub":"E6","subn":"Запрет по маске / почти совпадение","st":"arch","q":"(А.Богданов) Строка содержит символы латинского алфавита. Определите максимальную длину подстроки не содержащей подстрок, отличающейся от «DANOV» лишь на одну букву.","file":"https://kompege.ru/files/i7lxTYZSn.txt"},{"id":5810,"lvl":"Сл","src":"","blk":"B7","sub":"J2","subn":"Неоднозначное разбиение","st":"main","q":"Текстовый файл содержит строку из заглавных латинских букв X, Y и Z, всего не более чем из 106 символов.\nОпределите максимальную длину подпоследовательности, состоящей из сочетаний XY, YZ и XYZ.\n\nИскомая подпоследовательность должна состоять только из пар XY, или только из пар YZ, или только из троек XYZ, или только из пар XY, YZ и троек XYZ в произвольном порядке следования этих сочетаний.","file":"https://kompege.ru/files/qQOl_YShr.txt"},{"id":5746,"lvl":"Сл","src":"","blk":"B7","sub":"J4","subn":"Структурные цепочки (тройки, лесенки, повтор групп)","st":"arch","q":"(Д. Тараскин) Дана строка длиной менее 106 символов, состоящая из заглавных букв латинского алфавита. Будем называть подстрокой-лесенкой такую подстроку, в которой буквы чередуются следующим образом АBBCCCAAAADDDDD и т.д. Иными словами, первая буква записана один раз, вторая дублируется дважды, третья - трижды и т.д. Буквы соседних \"ступеней\" лесенки должны отличаться, но могут повторятся в пределах подстроки. Укажите длину самой длинной подстроки-лесенки. Обратите внимание, что лесенки могут идти как друг за другом, так и частично друг на друга накладываться.\nВ строке ABBCCCABBCCC - 2 лесенки идут друг за другом\nВ строке ABBCCCDDBBBCCCC - 2 лесенки - конец одной лесенки ABBCCC совпадает с началом другой CDDBBBCCCC\nВ строке AABBCCCCCCCCCCDDEEEEEEE - тоже 2 лесенки ABBCCC и CDDEEE","file":"https://kompege.ru/files/IH1Ws0vL8.txt"},{"id":5677,"lvl":"С","src":"Вариант 09.01.23","blk":"B7","sub":"I1","subn":"Циклический узор с неполными краями","st":"arch","q":"(А. Игнатюк) В текстовом файле дана последовательность латинских букв. Необходимо найти в этой последовательности самую длинную подстроку, состоящую из комбинации DAD, при этом первый и последний элементы могут быть неполными. Например ADDADDADDADD.\n\nВ ответе укажите количество символов, составляющих наибольшую длину подходящей подстроки.","file":"https://kompege.ru/files/jsU5WUeqk.txt"},{"id":5641,"lvl":"С","src":"","blk":"B5","sub":"E2","subn":"Нет нескольких подстрок","st":"arch","q":"(М. Ишимов) Текстовый файл состоит из символов N, R, O и P.\nОпределите максимальную длину последовательности, в которых нет подряд идущих символов NP или PO в прилагаемом файле.","file":"https://kompege.ru/files/Usl65rkFN.txt"},{"id":5551,"lvl":"С","src":"","blk":"B6","sub":"F6","subn":"Чередование классов","st":"arch","q":"Текстовый файл состоит из символов латинского алфавита. Найдите подстроку наибольшей длины, состоящую из двух различных символов, которые чередуются. В качестве ответа укажите её длину.\n\nПример. Дана строка: ABCDFDEGHJIJIJIJIJIJKMIJ. Наибольшая подстрока, которая строится на основе двух различных символов, меж собой чередующихся: JIJIJIJIJIJ. Её длина = 11. Ответ для примера: 11.","file":"https://kompege.ru/files/RKxwF85DK.txt"},{"id":5496,"lvl":"С","src":"","blk":"B10","sub":"P3","subn":"Отрезки между X: максимум внутри","st":"arch","q":"Текстовый файл содержит только буквы A, C, D, F, O. Определите длину самой длинной цепочки символов, которая начинается и заканчивается буквой D, а между двумя последовательными буквами D содержит не более двух букв O и произвольное количество других букв.","file":"https://kompege.ru/files/RaUHQAIpd.txt"},{"id":5444,"lvl":"С","src":"Джобс 21.12.22","blk":"B7","sub":"J4","subn":"Структурные цепочки (тройки, лесенки, повтор групп)","st":"arch","q":"Текстовый файл содержит строку из символов A, B, C, D, E, F.\nНайдите максимальную длину подстроки, которая состоит из подряд идущих троек одинаковых символов.\n\nНапример, в строке BBCDDDEEEFGGGEEEDDDDK такая подстрока GGGEEEDDD. Следовательно, ответ будет 9.","file":"https://kompege.ru/files/7UhTdbSSS.txt"},{"id":5381,"lvl":"Сл","src":"/dev/inf 12.2022","blk":"B8","sub":"L2","subn":"Ровно K подстроки (MAX)","st":"main","q":"(А. Рогов) Текстовый файл состоит из символов A, B, C, D, E, F и U. Определите максимальное количество идущих подряд символов в прилагаемом файле, среди которых комбинация\nсогласная + гласная + согласная\nвстречается ровно 2 раза.","file":"https://kompege.ru/files/i5Xa8zgMZ.txt"},{"id":5237,"lvl":"С","src":"","blk":"B6","sub":"F6","subn":"Чередование классов","st":"arch","q":"Текстовый файл состоит не более чем из 106 символов X, Y и Z.  \nОпределите максимальное количество идущих подряд символов, среди которых нет символов Z, а остальные символы чередуются.","file":"https://kompege.ru/files/W3TQSNggO.txt"},{"id":5223,"lvl":"Б","src":"","blk":"B5","sub":"E5","subn":"Нет X, но есть Y","st":"main","q":"Текстовый файл состоит из заглавных букв латинского алфавита. Определите максимальное количество подряд идущих символов, среди которых нет сочетания DD, но есть сочетание FE.","file":"https://kompege.ru/files/-Sq5f8X0N.txt"},{"id":5171,"lvl":"Б","src":"","blk":"B7","sub":"I1","subn":"Циклический узор с неполными краями","st":"main","q":"В текстовом файле находится цепочка из символов латинского алфавита A, B, C, D, E, F. Найдите максимальную длину цепочки вида CACACA.... (состоящей из фрагментов CA, последний фрагмент может быть неполным).","file":"https://kompege.ru/files/W57NAJwEp.txt"},{"id":5139,"lvl":"С","src":"/dev/inf 11.22","blk":"B7","sub":"H3","subn":"Блоки по классам символов","st":"arch","q":"(А. Рогов) Текстовый файл состоит из символов A, B, C, D, E, F и U. Определите максимальное количество идущих подряд троек символов вида\nсогласная + гласная + согласная\nв прилагаемом файле.","file":"https://kompege.ru/files/e9LUABb1s.txt"},{"id":4710,"lvl":"Б","src":"Демоверсия 2023","blk":"B7","sub":"H3","subn":"Блоки по классам символов","st":"arch","q":"Текстовый файл состоит из символов A, C, D, F и O. \nОпределите максимальное количество идущих подряд пар символов вида \nсогласная + гласная  \nв прилагаемом файле.","file":"https://kompege.ru/files/Yv4sIxmbs.txt"},{"id":4682,"lvl":"Б","src":"Резервный день 2022","blk":"B7","sub":"H3","subn":"Блоки по классам символов","st":"arch","q":"Текстовый файл состоит из символов A, B, C, D, E.\nОпределите максимальное количество подряд пар символов вида гласная + согласная в прилагаемом файле.","file":"https://kompege.ru/files/-OgUOA7fZ.txt"},{"id":4643,"lvl":"Б","src":"","blk":"B7","sub":"H3","subn":"Блоки по классам символов","st":"arch","q":"(А. Калинин)  Текстовый файл состоит из символов A, B и цифр 1, 2.\nОпределите максимальное количество идущих подряд троек символов вида двузначное число + буква в прилагаемом файле.","file":"https://kompege.ru/files/8yQZfjOY_.txt"},{"id":4642,"lvl":"Б","src":"","blk":"B7","sub":"H3","subn":"Блоки по классам символов","st":"main","q":"(А. Калинин)  Текстовый файл состоит из символов A, B и цифр 1, 2.\nОпределите максимальное количество идущих подряд пар символов вида буква  + цифра в прилагаемом файле.","file":"https://kompege.ru/files/AYweJ0QiB.txt"},{"id":4627,"lvl":"Б","src":"Основная волна 2022","blk":"B7","sub":"H2","subn":"Тройки из списка","st":"arch","q":"Текстовый файл состоит из символов N, O и P. \nОпределите максимальное количество подряд идущих последовательностей символов NPO или PNO в прилагаемом файле. Искомая последовательность должна состоять только из троек NPO, или только из троек PNO, или только из троек NPO и PNO в произвольном порядке их следования.","file":"https://kompege.ru/files/-m40JTHGn.txt"},{"id":4602,"lvl":"Б","src":"Основная волна 2022","blk":"B7","sub":"H3","subn":"Блоки по классам символов","st":"arch","q":"Текстовый файл состоит из символов A, B, C, D и O. Определите максимальное количество идущих подряд пар символов вида\nсогласная + гласная\nв прилагаемом файле.","file":"https://kompege.ru/files/nkbV0RABS.txt"},{"id":4555,"lvl":"Сл","src":"","blk":"B7","sub":"J1","subn":"Блоки разной длины","st":"main","q":"Текстовый файл содержит строку из заглавных латинских букв X, Y и Z, всего не более чем из 106 символов.\nОпределите максимальную длину подпоследовательности, состоящей из сочетаний XY и ZZX.\n\nИскомая подпоследовательность должна состоять только из пар XY, или только из троек ZZX, или только из пар XY и троек ZZX в произвольном порядке следования этих сочетаний.","file":"https://kompege.ru/files/MkoNZber1.txt"},{"id":4551,"lvl":"С","src":"Danov 2202","blk":"B4","sub":"D4","subn":"Две серии подряд (0…01…1)","st":"main","q":"(А. Богданов) Текстовый файл содержит строку из символов десятичных цифр, состоящей из миллиона символов. Найдите максимальное количество подряд идущих нулей и затем единиц. В строке должен быть хотя бы один ноль и хотя бы одна единица.","file":"https://kompege.ru/files/I8GYOXFqy.txt"},{"id":4549,"lvl":"Сл","src":"","blk":"B7","sub":"J3","subn":"Перекрывающиеся блоки","st":"arch","q":"Текстовый файл содержит строку из набора A, B, C, D, E, F, всего не более чем из 106 символов. Найдите максимальное количество подряд идущих троек символов ABC, BAC, CAB, CBA, стоящих одна за другой и пересекающихся с соседними тройками одной буквой. Например, в строке BDEABCBABCABBD такие пары составляют подстроку ABCBABCAB = ABC + СBA + ABC + CAB, итого 4 тройки.","file":"https://kompege.ru/files/sRp4gGLmI.txt"},{"id":4546,"lvl":"Б","src":"","blk":"B7","sub":"H4","subn":"Блоки с «любым символом»","st":"arch","q":"Текстовый файл состоит не более, чем из 106 символов из набора A, B, C.\nНайдите максимальное количество подряд идущих троек символов A*A или C*C, где * обозначает один любой символ.","file":"https://kompege.ru/files/sJDwcyfWx.txt"},{"id":4545,"lvl":"Б","src":"","blk":"B7","sub":"H2","subn":"Тройки из списка","st":"arch","q":"Текстовый файл содержит строку из заглавных латинских букв X, Y и Z, всего не более чем из 106 символов. Определите максимальное количество идущих подряд троек символов XYZ или ZYX.","file":"https://kompege.ru/files/W5Y6Yd6-Y.txt"},{"id":4544,"lvl":"Б","src":"","blk":"B5","sub":"E4","subn":"Самоперекрывающийся запрет","st":"arch","q":"Текстовый файл состоит не более чем из 106 символов I, V и X.\nОпределите максимальное количество идущих подряд символов в прилагаемом файле, среди которых нет последовательности цифр, формирующая римскую цифру девятнадцать (XIX)?","file":"https://kompege.ru/files/c_ZcTM8wB.txt"},{"id":4543,"lvl":"Б","src":"","blk":"B5","sub":"E3","subn":"Нет длинной подстроки","st":"arch","q":"Текстовый файл состоит не более чем из 106 символов I, V и X.\nОпределите максимальное количество идущих подряд символов в прилагаемом файле, среди которых нет последовательности цифр, формирующая римскую цифру восемнадцать (XVIII)?","file":"https://kompege.ru/files/OBo5sNON9.txt"},{"id":4479,"lvl":"Сл","src":"Джобс 15.06.2022","blk":"B7","sub":"J1","subn":"Блоки разной длины","st":"arch","q":"Текстовый файл состоит из символов A, B и C.\nОпределите максимальную длину подпоследовательности, состоящей из сочетаний AB и CAC.\n \nИскомая подпоследовательность должна состоять только из пар AB, или только из троек CAC, или только из пар AB и троек CAC в произвольном порядке следования этих сочетаний.","file":"https://kompege.ru/files/kwoklzBu4.txt"},{"id":4334,"lvl":"С","src":"Пробный 06.2022 /dev/inf advanced","blk":"B8","sub":"K2","subn":"Несколько счётчиков и запретов","st":"arch","q":"Текстовый файл состоит не более, чем из 106 символов латинского алфавита A, B, C, D ... Z.\nОпределите максимальное количество подряд идущих символов, среди которых символ R встречается не менее 2 раз, а количество символов А не превышает 3.","file":"https://kompege.ru/files/Oiu6GEMiH.txt"},{"id":4306,"lvl":"С","src":"/dev/inf 06.2022","blk":"B8","sub":"K2","subn":"Несколько счётчиков и запретов","st":"arch","q":"Текстовый файл состоит не более, чем из 106 символов латинского алфавита A, B, C, D ... Z.\nОпределите максимальное количество подряд идущих символов, среди которых нет символа R, а количество символов А не превышает 3.","file":"https://kompege.ru/files/QGCUPrwKe.txt"},{"id":4203,"lvl":"Б","src":"Открытый вариант 2022","blk":"B7","sub":"H1","subn":"Пары из списка","st":"arch","q":"Текстовый файл состоит из символов A, B и C. \nОпределите максимальное количество идущих подряд пар символов AB или CB в прилагаемом файле.\n\nИскомая подпоследовательность должна состоять только из пар AB, или только из пар CB, или только из пар AB и CB в произвольном порядке следования этих пар.","file":"https://kompege.ru/files/9g-_viQOG.txt"},{"id":4113,"lvl":"Б","src":"","blk":"B7","sub":"H1","subn":"Пары из списка","st":"arch","q":"Текстовый файл состоит из символов A, B, и D.\nОпределите максимальное количество идущих подряд пар символов BB или DD в прилагаемом файле.\nИскомая подпоследовательность должна состоять только из пар BB, или только из пар DD, или только из пар BB и DD.","file":"https://kompege.ru/files/y6MO1ZIAS.txt"},{"id":4021,"lvl":"Б","src":"","blk":"B8","sub":"K1","subn":"Не более K одного символа","st":"arch","q":"Текстовый файл содержит строку из заглавных латинских букв и точек, всего не более 106 символов. Определите максимальное количество идущих подряд символов, среди которых не более пяти точек.","file":"https://kompege.ru/files/WIa77fwqJ.txt"},{"id":3900,"lvl":"С","src":"Джобс 14.05.2022","blk":"B7","sub":"J4","subn":"Структурные цепочки (тройки, лесенки, повтор групп)","st":"arch","q":"Текстовый файл состоит не более, чем из 106 символов из набора A, B, C, D, E, F. \n\nНайдите максимальную длину строки вида А*А*А*А, где между буквами А расположены одинаковые группы символов, не содержащие букв А. Например, в строке BDADBADBADBABDAFABDA такая подстрока ADBADBADBA (длина 10).","file":"https://kompege.ru/files/vE6OVCtam.txt"},{"id":3792,"lvl":"Б","src":"","blk":"B4","sub":"D2","subn":"Серия символов из набора / без набора","st":"arch","q":"В текстовом файле находится цепочка из символов латинского алфавита A, B, C, D, E. Найдите длину самой длинной подцепочки, состоящей из символов A, B или C (в произвольном порядке).","file":"https://kompege.ru/files/QA4XnU4ZP.txt"},{"id":3763,"lvl":"Сл","src":"","blk":"B9","sub":"N1","subn":"Количество подстрок без всех трёх букв","st":"main","q":"(Н. Егорова) Текстовый файл содержит строку из заглавных латинских букв A, B и C, всего не более чем из 106 символов. Определите количество подстрок длиной не менее трех символов, которые не содержали бы одновременно все три буквы A, B и C. Примечание: подстрока — это непрерывный фрагмент исходной строки.","file":"https://kompege.ru/files/zl9rrsKN-.txt"},{"id":3762,"lvl":"С","src":"","blk":"B2","sub":"B1s","subn":"Строки, содержащие шаблон","st":"arch","q":"(И. Женецкий) Системный администратор Дамир обслуживает крупную корпорацию. У него в текстовом файле находятся IP-адреса этих сотрудников. Ему необходимо посчитать количество таких различных IP-адресов, которые удовлетворяют маске 195.2?.1?5.14, где символ ? обозначает цифру от 0 до 9. Например, подходящие IP-адреса могут быть такими: 195.20.145.14, 195.24.185.14, 195.21.135.14 и т.д. Определите количество различных подходящих IP-адресов в файле.","file":"https://kompege.ru/files/UgdvYqcjC.txt"},{"id":3761,"lvl":"С","src":"","blk":"B7","sub":"H4","subn":"Блоки с «любым символом»","st":"main","q":"Текстовый файл содержит строку из заглавных латинских букв X, Y и Z, всего не более чем из 106 символов. Определите максимальное количество идущих подряд троек символов X*X или Y*Y, где * обозначает один любой символ.","file":"https://kompege.ru/files/KR8FP1JT5.txt"},{"id":3760,"lvl":"С","src":"","blk":"B7","sub":"H4","subn":"Блоки с «любым символом»","st":"arch","q":"Текстовый файл содержит строку из заглавных латинских букв X, Y и Z, всего не более чем из 106 символов. Определите максимальное количество идущих подряд троек символов X*Y или Z*Y, где * обозначает один любой символ.","file":"https://kompege.ru/files/hJ3v19g2A.txt"},{"id":3743,"lvl":"Сл","src":"Джобс 05.05.2022","blk":"B7","sub":"J3","subn":"Перекрывающиеся блоки","st":"main","q":"Текстовый файл состоит не более, чем из 106 символов из набора A, B, C, D, E, F. \n\nНайдите максимальное количество подряд идущих пар символов АB, CB, BС и BA, стоящие одна за другой и пересекающиеся последней буквой. Например, в строке BDEABCBABBD такие пары составляют подстроку ABCBAB = AB + BC + CB + BA + AB, итого 5 пар.","file":"https://kompege.ru/files/GjAOms87_.txt"},{"id":3584,"lvl":"Б","src":"Апробация 27.04.2022","blk":"B7","sub":"H1","subn":"Пары из списка","st":"arch","q":"Текстовый файл состоит из символов A, B, и D.\nОпределите максимальное количество идущих подряд пар символов BA или DA в прилагаемом файле.\nИскомая подпоследовательность должна состоять только из пар BA, или только из пар DA, или только из пар BA и DA.","file":"https://kompege.ru/files/i0avjkQBB.txt"},{"id":3399,"lvl":"С","src":"Вариант от учеников","blk":"B2","sub":"B1s","subn":"Строки, содержащие шаблон","st":"arch","q":"Системный администратор Дамир обслуживает крупную корпорацию из одного миллиона сотрудников. У него в файле 24_ip.txt находятся IP-адреса этих сотрудников. Ему необходимо посчитать количество таких IP-адресов, которые удовлетворяют маске 195.2?.1?5.14, где ? обозначает цифру от 0 до 9. Например, IP-адреса могут быть такими:\n195.20.145.14;\n195.24.185.14;\n195.21.135.14; и т.д\nВ ответе укажите количество подходящих IP-адресов.","file":"https://kompege.ru/files/iYIlzKWFW.txt"},{"id":3375,"lvl":"Б","src":"Джобс 22.04.2022","blk":"B7","sub":"H1","subn":"Пары из списка","st":"arch","q":"Текстовый файл состоит не более, чем из 106 символов из набора A, B, C. \n\nНайдите максимальное количество подряд идущих пар символов AA или CC. Искомая подстрока может включать только пары АA, только пары CС или содержать одновременно как пары АA, так и пары CC.","file":"https://kompege.ru/files/DvuBAVgoS.txt"},{"id":3228,"lvl":"Б","src":"Досрочный этап 2022","blk":"B7","sub":"H1","subn":"Пары из списка","st":"arch","q":"Текстовый файл состоит не более, чем из 106 символов из набора A, B, C. \n\nНайдите максимальное количество подряд идущих пар символов АС или АВ. Искомая подстрока может включать только пары АВ, только пары АС или содержать одновременно как пары АС, так и пары АВ.","file":"https://kompege.ru/files/q_XBXiwyU.txt"},{"id":3163,"lvl":"Б","src":"","blk":"B5","sub":"E7","subn":"Нет пар одновременно","st":"arch","q":"Текстовый файл состоит не более чем из 106 символов и содержит только заглавные буквы латинского алфавита (A..Z). Определите максимальное количество идущих подряд символов, среди которых нет пар символов PR и ST одновременно.\nНапример строка ABDSTRE подходит под условие, а OSTREWPRT нет.","file":"https://kompege.ru/files/_64x_YNAJ.txt"},{"id":3099,"lvl":"Г","src":"","blk":"B3","sub":"C4","subn":"Частоты + соседство / замены","st":"main","q":"(PRO100 ЕГЭ) Текстовый файл содержит строку из заглавных латинских букв, всего не более чем из 106 символов. Требуется заменить некоторые буквы на другие латинские так, чтобы из букв получившейся строки можно было собрать палиндром. В ответ запишите минимальное количество замен, которое нужно сделать.\nПример:\nИз строки wqe, строка wqq (можно собрать палиндром qwq) получается с помощью одной замены e -> q. \nОтвет: 1","file":"https://kompege.ru/files/scdrcDEHG.txt"},{"id":3091,"lvl":"Г","src":"","blk":"B2","sub":"B5s","subn":"Палиндромные перестановки в строках","st":"arch","q":"Текстовый файл состоит не более чем из 106 заглавных латинских букв (A..Z). Текст разбит на строки различной длины. Определите количество строк, в которых есть хотя бы одна подстрока, состоящая из 7 символов, которая либо изначально является палиндромом, либо может быть преобразована к палиндромическому виду путём максимум одной перестановки (двух символов), которая выполняется в рамках текущей подстроки.\n\nНапример, даны строки:\nAFDGADGHAGHGJAGJ - здесь нет палиндромов длины 7, перестановка тоже не помогает.\nADGHADGOJAJAG - здесь ADGHADG преобразовывается в GDAHADG (G и A поменялись местами).\nABDGJHAGDJGAJHA - здесь нет палиндромов длины 7, перестановка тоже не помогает.\nПодошла одна строка. Ответ: 1.\n\nПримечание: палиндром - последовательность символов, которая читается\nодинаково как вперёд, так и назад, например \"BABAB\".","file":"https://kompege.ru/files/X4uckkr9g.txt"},{"id":3021,"lvl":"Б","src":"","blk":"B7","sub":"H2","subn":"Тройки из списка","st":"main","q":"Текстовый файл содержит строку из заглавных латинских букв X, Y и Z, всего не более чем из 106 символов. Определите максимальное количество идущих подряд троек символов ZXY или ZYX.","file":"https://kompege.ru/files/IG7KvBQwv.txt"},{"id":3020,"lvl":"Б","src":"","blk":"B7","sub":"H1","subn":"Пары из списка","st":"arch","q":"Текстовый файл содержит строку из заглавных латинских букв X, Y и Z, всего не более чем из 106 символов. Определите максимальное количество идущих подряд пар символов ZX или ZY.","file":"https://kompege.ru/files/A8B7Ga5Eo.txt"},{"id":3019,"lvl":"С","src":"","blk":"B9","sub":"N3","subn":"Количество подстрок между границами","st":"arch","q":"Текстовый файл содержит строку из заглавных латинских букв, всего не более чем из 106 символов. Определите количество подстрок длиной не более 15 символов, которые начинаются буквой A, содержат букву F, заканчиваются буквой B и не содержат других букв A и B, кроме первой и последней.","file":"https://kompege.ru/files/8dvZzs7u4.txt"},{"id":3018,"lvl":"С","src":"","blk":"B9","sub":"N3","subn":"Количество подстрок между границами","st":"arch","q":"Текстовый файл содержит строку из заглавных латинских букв, всего не более чем из 106 символов. Определите количество подстрок длиной не менее 17 символов, которые начинаются и заканчиваются буквой A и не содержат других букв A (кроме первой и последней) и букв B.","file":"https://kompege.ru/files/1xb6DowsN.txt"},{"id":2942,"lvl":"Б","src":"Апробация 19.02.2022","blk":"B7","sub":"H1","subn":"Пары из списка","st":"main","q":"Текстовый файл состоит из символов А, В и С.\nОпределите максимальное количество идущих подряд пар символов АВ или АС в прилагаемом файле.","file":"https://kompege.ru/files/FK6iy6KLK.txt"},{"id":2715,"lvl":"Сл","src":"Пробный 02.2022 /dev/inf Middle level","blk":"B3","sub":"C4","subn":"Частоты + соседство / замены","st":"arch","q":"Текстовый файл состоит не более чем из 108 символов прописных латинских букв (A, B, .., Z). Определите, какая буква (или несколько) встречается в текстовом файле максимальное количество раз. Для найденных букв определите, сколько раз в текстовом файле данные буквы стоят рядом с буквами, встречающимися минимальное количество раз в файле.\nПример. Содержимое файла ААВВСАВ. Для данной цепочки символов ответ 2.","file":"https://kompege.ru/files/6Wi4Z91lA.txt"},{"id":2684,"lvl":"С","src":"Пробный 02.2022 /dev/inf Base level","blk":"B3","sub":"C1","subn":"Самый частый символ","st":"arch","q":"Текстовый файл состоит не более чем из 108 символов прописных латинских букв (A, B, .., Z). \nОпределите, какая буква встречается в текстовом файле максимальное количество раз. Если таких букв несколько, запишите их в ответе в алфавитном порядке. Ответ необходимо записать прописными (заглавными) буквами.","file":"https://kompege.ru/files/x53vxGdwF.txt"},{"id":2578,"lvl":"Сл","src":"","blk":"B8","sub":"K2","subn":"Несколько счётчиков и запретов","st":"arch","q":"Текстовый файл содержит строку из заглавных латинских букв и точек, всего не более 106 символов. Определите максимальное количество идущих подряд символов, среди которых нет точек, а количество гласных (букв A, E, I, O, U, Y) не превышает 7.","file":"https://kompege.ru/files/eeEKO5W1V.txt"},{"id":2577,"lvl":"Б","src":"","blk":"B8","sub":"K2","subn":"Несколько счётчиков и запретов","st":"arch","q":"Текстовый файл содержит строку из заглавных латинских букв и точек, всего не более 106 символов. Определите максимальное количество идущих подряд символов, среди которых нет букв Y, а количество точек не превышает 5.","file":"https://kompege.ru/files/ECjxYCSUU.txt"},{"id":2576,"lvl":"Б","src":"","blk":"B8","sub":"K2","subn":"Несколько счётчиков и запретов","st":"arch","q":"Текстовый файл содержит строку из заглавных латинских букв и точек, всего не более 106 символов. Определите максимальное количество идущих подряд символов, среди которых нет точек, но есть не менее 3-х букв A.","file":"https://kompege.ru/files/-5xiahbOz.txt"},{"id":2531,"lvl":"Б","src":"Новогодний вариант 2021/2022","blk":"B1","sub":"A1","subn":"Подсчёт слова без перекрытий","st":"main","q":"(А. Калинин) Страшные порывы ветра в клочья уничтожили Боевого Робота,
