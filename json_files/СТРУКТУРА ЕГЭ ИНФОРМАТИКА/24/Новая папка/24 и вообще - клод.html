<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Информатика · ЕГЭ 24 · Обработка строк</title>
<style>:root{--bg:#f3f5fb;--card:#fff;--ink:#1d2640;--mut:#6b7392;--line:#e1e5f0;--pri:#4f6bff;--pri2:#7b5cff;--ok:#16a36a;--err:#e5484d;--warn:#f0a400;--code:#141a2e;--code2:#1c2340;--cink:#dfe5ff;--sh:0 8px 24px rgba(40,50,90,.08)}
[data-theme=dark]{--bg:#0f1322;--card:#181e33;--ink:#e6e9f5;--mut:#98a0bf;--line:#2a3150;--code:#0b0f1d;--code2:#131a30;--sh:0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:var(--pri)}
.mono,code,pre{font-family:"JetBrains Mono","Cascadia Code",Consolas,"Courier New",monospace}
.btn{border:0;border-radius:11px;padding:8px 14px;font-weight:700;background:var(--card);color:var(--ink);box-shadow:0 0 0 1.5px var(--line) inset;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn:hover{box-shadow:0 0 0 1.5px var(--pri) inset}
.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 6px 16px rgba(79,107,255,.3)}
.btn.ok{background:var(--ok);color:#fff;box-shadow:none}
.btn.red{background:var(--err);color:#fff;box-shadow:none}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:18px 20px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1d2640;color:#fff;padding:11px 18px;border-radius:12px;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90vw;font-weight:600}
.mbg{position:fixed;inset:0;background:rgba(15,20,40,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:12px}
.mdl{background:var(--card);border-radius:20px;padding:22px;max-width:620px;width:100%;max-height:94vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.mdl.wide{max-width:1000px}.mdl.full{max-width:min(1400px,98vw);width:98vw;max-height:97vh;padding:16px}
.mdl h2{margin:0 0 12px}
.inp{border:1.5px solid var(--line);background:var(--bg);border-radius:11px;padding:9px 12px;outline:none}
.inp:focus{border-color:var(--pri)}
/* топбар */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);box-shadow:0 2px 12px rgba(30,40,80,.07)}
.logo{font-weight:900;font-size:17px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo i{font-style:normal;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-size:15px}
.top .sp{flex:1}
.who{font-weight:800;background:var(--bg);border-radius:999px;padding:5px 12px;white-space:nowrap}
.modeb{font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;background:#e3f6ec;color:#0f7a4d;white-space:nowrap}
.modeb.home{background:#fff0e0;color:#b25e00}
.ib{border:0;background:var(--bg);color:var(--ink);border-radius:10px;padding:7px 10px;font-weight:700;white-space:nowrap}
.ib:hover{background:#e6eaff}[data-theme=dark] .ib:hover{background:#262f55}
/* логин и модули */
.login{max-width:560px;margin:7vh auto;padding:0 14px}
.hero{background:linear-gradient(135deg,#4f6bff,#7b5cff 60%,#b44cff);color:#fff;border-radius:24px;padding:26px;box-shadow:0 20px 50px rgba(79,107,255,.35);position:relative;overflow:hidden}
.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0;opacity:.9}
.hero .code-deco{position:absolute;right:-10px;bottom:-14px;font:700 13px/1.3 Consolas,monospace;opacity:.22;white-space:pre;text-align:left}
.slist{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.slist button{border:0;background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:700}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;max-width:1100px;margin:22px auto;padding:0 16px}
.mod{border:0;text-align:left;background:var(--card);color:var(--ink);border-radius:20px;padding:18px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:8px;min-height:170px;position:relative}
.mod b{font-size:18px;padding-right:56px}.mod span{color:var(--mut);font-size:14px}
.mod .num{position:absolute;right:16px;top:12px;font:900 34px/1 Consolas,monospace;color:var(--pri);opacity:.18}
.mod.off{opacity:.55;cursor:default}
.mod .pb{height:8px;background:var(--bg);border-radius:9px;overflow:hidden;margin-top:auto}.mod .pb i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#5fd39b)}
/* основная раскладка */
.lay{display:grid;grid-template-columns:300px 1fr;gap:16px;padding:16px;max-width:1700px;margin:0 auto}
.side{position:sticky;top:70px;align-self:start;max-height:calc(100vh - 86px);overflow:auto;background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:12px}
.prog{display:flex;height:10px;border-radius:9px;overflow:hidden;background:var(--bg);margin:4px 0 8px}
.prog i{display:block;height:100%}
.sec{margin-top:8px}
.sec>button.sh{width:100%;border:0;background:transparent;color:var(--ink);display:flex;align-items:center;gap:6px;font-weight:800;font-size:13.5px;padding:6px 4px;text-align:left}
.sec>button.sh small{margin-left:auto;color:var(--mut);font-weight:700}
.sec .bid{font:800 11px Consolas,monospace;background:var(--bg);border-radius:6px;padding:2px 5px;color:var(--pri)}
.its{display:flex;flex-wrap:wrap;gap:5px;padding:2px 2px 6px}
.it{border:0;border-radius:9px;padding:4px 7px;font:700 12.5px Consolas,monospace;background:var(--bg);color:var(--ink);position:relative;min-width:44px}
.it.w{font-family:inherit;font-size:12px;background:#eef1ff;color:#3b4fd8}[data-theme=dark] .it.w{background:#232a4a;color:#aab6ff}
.it.ok{background:#d7f5e6;color:#0f7a4d}.it.err{background:#e2f4ea;color:#2e8a5f}.it.hint{background:#fff1c7;color:#8a6400}.it.sol{background:#ffe2cc;color:#b04e10}
[data-theme=dark] .it.ok{background:#12452f;color:#7fe0b0}[data-theme=dark] .it.hint{background:#4a3a0c;color:#ffd666}[data-theme=dark] .it.sol{background:#4a2a12;color:#ffb27a}[data-theme=dark] .it.err{background:#173d2c;color:#8fd8b3}
.it.cur{outline:2.5px solid var(--pri);outline-offset:1px}
.it.tried::after{content:'';position:absolute;right:2px;top:2px;width:6px;height:6px;border-radius:50%;background:var(--err)}
.it.opt{opacity:.75;border:1.5px dashed var(--line)}
.memob{width:100%;border:0;background:linear-gradient(135deg,#fff6d6,#ffe9b0);color:#6b4b00;border-radius:10px;padding:5px 9px;font-weight:700;font-size:12.5px;text-align:left;margin:2px 0 4px}
[data-theme=dark] .memob{background:#3a3010;color:#ffd666}
.legend{font-size:11.5px;color:var(--mut);display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* задача */
.main{min-width:0;display:flex;flex-direction:column;gap:14px}
.th{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.th h2{margin:0;font-size:22px}
.tag{font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;background:var(--bg);color:var(--mut);white-space:nowrap}
.tag.k{background:#e6efff;color:#2759d6}.tag.p{background:#efe6ff;color:#6a35d6}.tag.star{background:#fff1c7;color:#8a6400}.tag.rom{background:#ffe3e3;color:#c0262c}.tag.tch{background:#e3f6ec;color:#0f7a4d}
.dots{letter-spacing:2px;color:var(--warn);font-size:13px}
.ttext{font-size:17px;line-height:1.55;margin:10px 0 4px}
.strip{display:flex;flex-wrap:wrap;gap:22px 2px;padding:20px 2px 4px;position:relative}
.vz .cell{min-width:19px}.vz .cell b{font-size:14.5px;line-height:26px;padding:0 2px}
.cell em{display:block;font:11px/15px Consolas,monospace;color:#7b5cff;font-style:normal;border-top:1px dashed var(--line)}
.cell em.up{color:#e5484d;font-weight:800}
.cell{flex:0 0 auto;min-width:22px;text-align:center;position:relative}
.cell b{display:block;font:700 16px/30px Consolas,monospace;background:var(--bg);border-radius:6px;padding:0 3px;transition:background .15s}
.cell small{display:block;font:10px Consolas,monospace;color:var(--mut)}
.cell.hl b{background:#ffd666;color:#1d2640}.cell.hl2 b{color:#0b8a55;text-decoration:underline 3px #16a36a;text-underline-offset:3px}
.cell.best b{box-shadow:0 0 0 2px var(--ok) inset}
.cell.sp b{background:transparent;color:var(--mut)}
.cell .ptr{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font:800 11px Consolas,monospace;color:#fff;background:var(--pri);border-radius:5px;padding:0 4px;white-space:nowrap;z-index:2}
.cell .ptr.p2{background:#e5484d}.cell .ptr.p3{background:#13a37a}
.cell .ptr.stack{top:-38px}
.cell.rx b{box-shadow:inset 0 -4px 0 var(--pri2)}.cell.rx.alt b{box-shadow:inset 0 -4px 0 #ff8a00}
.arr{display:flex;gap:2px;overflow:hidden}
.arr span{flex:0 0 auto;font:11px/18px Consolas,monospace;text-align:center;color:var(--mut)}
.strbox{background:var(--card);border-radius:14px;padding:6px 10px 8px;border:1.5px dashed var(--line)}
.strbox .lab{font-size:12px;color:var(--mut);font-weight:700;display:flex;gap:8px;align-items:center}
details.real{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:12px 18px}
details.real summary{font-weight:800;cursor:pointer}
details.real.home{box-shadow:0 0 0 2px #ffb46b inset,var(--sh)}
.realq{margin:10px 0;line-height:1.55}
/* рабочая зона */
.work{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px}
.pane{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:12px;min-width:0;display:flex;flex-direction:column;gap:10px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bar .sp{flex:1}
.ed{display:flex;background:var(--code);border-radius:14px;overflow:hidden;font:14px/21px "JetBrains Mono","Cascadia Code",Consolas,monospace}
.ed-gut{padding:8px 0;background:var(--code2);color:#5d6890;text-align:right;user-select:none;min-width:38px}
.ed-gut div{padding:0 8px;height:21px}.ed-gut div.on{background:#4f6bff;color:#fff}.ed-gut div.er{background:#e5484d;color:#fff}
.ed-box{position:relative;flex:1;min-width:0;overflow-x:auto}
.ed-hl,.ed-ta,.ed-mark{margin:0;padding:8px 12px;font:inherit;white-space:pre;tab-size:4;border:0}
.ed-hl{position:absolute;inset:0;overflow:hidden;color:var(--cink);pointer-events:none;z-index:1}
.ed-mark{position:absolute;inset:0;overflow:hidden;padding-left:0;padding-right:0;pointer-events:none;z-index:0}
.ed-mark div{height:21px}.ed-mark div.on{background:rgba(79,107,255,.28)}.ed-mark div.er{background:rgba(229,72,77,.3)}
.ed-ta{position:relative;z-index:2;display:block;width:100%;background:transparent;color:transparent;caret-color:#fff;outline:none;resize:none;overflow-x:auto;overflow-y:hidden;min-height:140px}
.ed-ta::selection{background:rgba(123,92,255,.45)}
.hk{color:#c792ea;font-weight:700}.hs{color:#c3e88d}.hn{color:#f78c6c}.hc{color:#69739a;font-style:italic}
.hb{background:#ffd666;color:#1d2640;border-radius:4px;font-weight:800}
.out{background:var(--code);color:#cfe3cf;border-radius:12px;padding:10px 12px;font:13px/1.45 Consolas,monospace;white-space:pre-wrap;word-break:break-all;max-height:220px;overflow:auto;min-height:44px}
.out .last{background:#2b3a1e;color:#d9ff9e;border-radius:4px;padding:0 3px}
.out .e{color:#ff9a9a}
.exp{background:#fff0f0;color:#9b1c21;border-radius:12px;padding:9px 12px;font-size:14px}
[data-theme=dark] .exp{background:#3b1518;color:#ffb0b3}
.status{font-size:12.5px;color:var(--mut)}
.ans{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bg);border-radius:14px;padding:10px 12px}
.ans .inp{width:170px;font:700 17px Consolas,monospace;background:var(--card)}
.fb{border-radius:12px;padding:10px 14px;font-weight:700;display:none}
.fb.show{display:block}.fb.good{background:#dff6ea;color:#0f7a4d}.fb.bad{background:#ffe3e3;color:#c0262c}.fb.inf{background:#eef1ff;color:#3b4fd8}
[data-theme=dark] .fb.good{background:#12452f;color:#9ff0c6}[data-theme=dark] .fb.bad{background:#4a1518;color:#ffb0b3}[data-theme=dark] .fb.inf{background:#232a4a;color:#c3ccff}
.hints{display:flex;flex-direction:column;gap:8px}
.hcard{border-radius:14px;padding:10px 14px;background:#fff8e1;border-left:5px solid var(--warn);font-size:14.5px}
[data-theme=dark] .hcard{background:#2e2710}
.hcard pre{background:var(--code);color:var(--cink);padding:10px;border-radius:10px;overflow:auto;font-size:13px;margin:8px 0 0}
/* визуализатор */
.vz{display:flex;flex-direction:column;gap:8px}
.steps{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.steps input[type=range]{flex:1;min-width:120px;accent-color:var(--pri)}
.steps .lbl{font:700 12.5px Consolas,monospace;color:var(--mut);min-width:150px}
.vars{display:flex;flex-wrap:wrap;gap:6px}
.var{background:var(--bg);border-radius:9px;padding:3px 8px;font:13px Consolas,monospace;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.var b{color:var(--pri)}
.var.ch{background:#fff1c7;box-shadow:0 0 0 1.5px var(--warn) inset}[data-theme=dark] .var.ch{background:#3a3010}
.bars{display:flex;gap:6px;align-items:flex-end;height:90px;padding-top:6px;overflow-x:auto}
.bars div{display:flex;flex-direction:column;align-items:center;font:11px Consolas,monospace;gap:2px;min-width:22px}
.bars i{display:block;width:18px;background:linear-gradient(180deg,var(--pri2),var(--pri));border-radius:5px 5px 2px 2px}
.vhint{font-size:13px;color:var(--mut)}
.rxl{display:flex;flex-wrap:wrap;gap:4px}
.rxl span{font:12.5px Consolas,monospace;background:#efe9ff;color:#5a3cc8;border-radius:6px;padding:1px 6px}
[data-theme=dark] .rxl span{background:#2c2350;color:#c9b8ff}
/* памятка */
.mtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.mtabs button{border:0;border-radius:999px;padding:6px 12px;font-weight:700;background:var(--bg);color:var(--ink);font-size:13px}
.mtabs button.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.mcard{background:var(--bg);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.mcard h4{margin:0;font-size:16px}
.mcard pre{margin:0;background:var(--code);color:var(--cink);border-radius:10px;padding:10px;font-size:13px;overflow:auto}
.mcard .er{font-size:13.5px;background:#ffecec;color:#9b1c21;border-radius:10px;padding:7px 10px}
[data-theme=dark] .mcard .er{background:#3b1518;color:#ffb0b3}
/* таблицы */
table.st{border-collapse:collapse;width:100%;font-size:14px;margin:10px 0}
table.st th,table.st td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.st th{color:var(--mut);font-size:12.5px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:10px 0}
.stat{border-radius:14px;padding:10px;text-align:center;background:var(--bg)}
.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:var(--mut)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:0;border-radius:10px;padding:8px 14px;font-weight:800;background:var(--bg);color:var(--ink)}
.tabs button.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.chk{display:flex;align-items:center;gap:6px;font-size:14px}
.agrid{display:flex;flex-wrap:wrap;gap:5px}
.agrid label{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:9px;padding:3px 8px;font:12.5px Consolas,monospace;cursor:pointer}
.agrid label.on{background:#e3e8ff;box-shadow:0 0 0 1.5px var(--pri) inset}[data-theme=dark] .agrid label.on{background:#262f55}
.store{background:var(--bg);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
.store i{display:block;height:8px;border-radius:9px;background:var(--line);margin-top:6px;overflow:hidden}.store i b{display:block;height:100%;background:var(--warn)}
.arch{max-height:60vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
.arow{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px}
.arow .q{max-height:4.5em;overflow:hidden}
.arow.open .q{max-height:none}
.banner{border-radius:14px;padding:10px 14px;font-weight:700;background:#fff0e0;color:#b25e00}
.lab2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tok{display:inline-flex;flex-direction:column;background:var(--bg);border-radius:10px;padding:6px 9px;margin:3px;font-size:12.5px;max-width:240px}
.tok code{font-weight:800;color:var(--pri2);font-size:14px}
.ptab{border-collapse:collapse;font:13px Consolas,monospace}
.ptab td{border:1px solid var(--line);padding:3px 6px;text-align:center;min-width:28px;cursor:pointer}
.ptab td.h{background:var(--bg);color:var(--mut);cursor:default}
.ptab td.sel{background:#ffd666;color:#1d2640}.ptab td.edge{background:#ff8a8a;color:#fff}.ptab td.m{background:#9fe6c4;color:#1d2640}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:150}
@media (max-width:1100px){.work{grid-template-columns:1fr}.lab2{grid-template-columns:1fr}}
@media (max-width:860px){.lay{grid-template-columns:1fr}.side{position:static;max-height:none}.top{flex-wrap:wrap}.top .modeb{display:none}}

n":"Строки разделены пробелами. Найдите строку с наибольшим количеством букв Q (если таких несколько — последнюю). Какая буква встречается в этой строке реже всего (но есть)? Если таких несколько — раньше по алфавиту. Ответ: эта буква и сколько раз она встречается во всём тексте (без пробела).","real":"Текстовый файл состоит не более чем из 106 символов и содержит только заглавные буквы латинского алфавита (ABC…Z). Текст разбит на строки различной длины. Необходимо найти строку, содержащую наибольшее количество букв Q (если таких строк несколько, надо взять ту, которая в файле встретилась позже). Определите, какая буква встречается в этой строке реже всего (но присутствует!). Если таких букв несколько, надо взять ту, которая стоит раньше в алфавите. Запишите в ответе эту букву, а затем – сколько раз она встречается во всем файле.\nПример. Исходный файл:\nZZQAQB\nQAVQAB\nBAQTUB\nВ этом примере в первой и второй строках по две букву Q, в третьей – одна. Берём вторую строку, т.к. она стоит в файле позже. В этой строке реже других встречаются буквы V и B (по одному разу), выбираем букву B, т. к. она раньше стоит в алфавите. В ответе для этого примера надо записать B4, так как во всех строках файла буква B встречается 4 раза.","src":"","lvl":"Сл","file":"https://kompege.ru/files/UridmRvJj.txt","s":"QQAZQB QAQZAB ZZQBQAQ QBAQQB AZBQ","code":"s='QQAZQB QAQZAB ZZQBQAQ QBAQQB AZBQ'\nlines = s.split()\nbest = ''\nfor line in lines:\n    if ⟦line.count('Q') >= best.count('Q')⟧:\n        best = line\nprint(best)\nl = sorted([(best.count(c), c) for c in set(best)])\nc = l[0][1]\nprint(l, c)\nprint(c + str(s.count(c)))","ans":"A6","note":"","similar":[1148,2507,1064,1255]},{"id":"7012к","kid":7012,"alias":"","blk":"B2","sub":"B4s","subn":"Подпоследовательность в строке","skills":["S07","S30"],"method":"жадный указатель","alt":"re: Q.*W.*E.*R…","re":"да","d":3,"star":false,"grob":false,"roman":false,"teacher":false,"viz":"PTR2","train":"Строки разделены пробелами. Определите колич   k = 0\n    for j in range(i, len(s)):\n        if ⟦s[j] == 'LOVE'[k]⟧:\n            k += 1\n            if k == 4:\n                if j - i + 1 < dl:\n                    dl = j - i + 1\n                    print(i, dl, s[i:j+1])\n                break\nprint(dl)","ans":"7","note":"","similar":[7043]},{"id":"8431к","kid":8431,"alias":"","blk":"B12","sub":"T3","subn":"Разделители с перекрытием","skills":["S03","S11"],"method":"отметка символов, входящих в разделители","alt":"re с просмотром вперёд","re":"да","d":4,"star":false,"grob":false,"roman":false,"teacher":false,"viz":"REGEX","train":"Тройка подряд идущих символов, содержащая по одному разу X, Y и Z, — разделитель; разделители могут накладываться. Разделители удаляют. Определите длину самого длинного фрагмента.","real":"Шифровка содержит только заглавные буквы латинского алфавита (ABC…Z). Группа из трёх идущих подряд символов, содержащая по одному разу каждую из букв X, Y и Z, считается разделителем. Разделители могут накладываться друг на друга, например, последовательность символов YZXYZ считается идущими подряд разделителями YZX, ZXY и XYZ. \nПри дешифровке разделители удаляются, разбивая шифровку на фрагменты. Определите количество символов в самом длинном фрагменте шифровки, полученном после удаления разделителей.\nПример\nПусть шифровка содержит такие символы:\nBADZXYZKLMENYZXXX.\nРазделители в этой строке выделены жирным шрифтом. Шифровка содержит три фрагмента: BAD, KLMEN и XX. Самый длинный из них содержит 5 символов, в ответе в данном примере надо записать число 5.","src":"","lvl":"С","file":"https://kompege.ru/files/lbnvxzRva.txt","s":"BADZXYZKLMENYZXXXQWYXZABCDXYXZYZQRS","code":"from re import *\ns='BADZXYZKLMENYZXXXQWYXZABCDXYXZYZQRS'\nprint(len(s), set(s), s[:200])\nt = list(s)\nfor i in range(len(s) - 2):\n    if ⟦sorted(s[i:i+3]) == ['X', 'Y', 'Z']⟧:\n        t[i] = t[i+1] = t[i+2] = ' '\ns = ''.join(t)\nprint(s)\nl = findall('[^ ]+', s)\nmaxs = max(l, key=len)\nprint(len(maxs), maxs, l)","ans":"5","note":"","similar":[]},{"id":"32511к","kid":32511,"alias":"","blk":"B11","sub":"R4","subn":"Экзотические записи (римские, вавилонские, Excel, таймкоды)","skills":["S28","S29"],"method":"автомат проверки корректности","alt":"—","re":"частично","d":5,"star":true,"grob":false,"roman":false,"teacher":false,"viz":"LOOP2","train":"Вавилонская запись: разряды разделены «:», непустой разряд — сначала от 0 до 5 символов X, затем от 0 до 9 символов I (хотя бы один символ). Пустой разряд — ноль; он допустим между двоеточиями и в конце, но запись не может начинаться с «:». Найдите длину самой длинной подстроки — корректной вавилонской записи.","real":"(Е. Джобс) В упрощённой записи вавилонских чисел используются только символы X, I и двоеточие (:). Символ X обозначает десяток, символ I — единицу, а двоеточие отделяет соседние разряды шестидесятеричного числа.\nКаждый непустой разряд имеет вид X…XI…I: сначала идут все X (от 0 до 5), затем все I (от 0 до 9). Разряд должен содержать хотя бы один символ. Таким образом, его значение находится в диапазоне от 1 до 59. После символа I в пределах одного разряда символ X появляться не может.\nПустой разряд обозначает ноль. Пустые разряды допускаются между двоеточиями и в конце записи, но запись числа не может начинаться с двоеточия (ведущие нулевые разряды запрещены). Например, X::XIII — корректная запись числа 10·60² + 13 = 36013.\nДана одна длинная строка S из символов X, I и :. Требуется найти её самую длинную непрерывную подстроку, которая является корректной записью вавилонского числа по описанным правилам. Разделителей между кандидатами в строке нет: проверяются все возможные подстроки.\nЕсли существует несколько подходящих подстрок максимальной длины, выберите ту, которая начинается раньше остальных. Выведите начальную позицию найденной подстроки (нумерация с 1). Гарантируется, что искомая строка в файле есть.\nПримеры","src":"","lvl":"С","file":"https://kompege.ru/files/lme337vfbv.txt","s":"XXI::XIIIXXXXXXI:XXIIIIIIIIII:I::XX","code":"from re import *\ns='XXI::XIIIXXXXXXI:XXIIIIIIIIII:I::XX'\nprint(len(s), set(s), s[:200])\ng = '(?:X{1,5}I{0,9}|I{1,9})'\npat = ⟦g + '(?::' + g + '?)*'⟧\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        if fullmatch(pat, s[i:j]) and j - i > dl:\n            dl = j - i\n            print(i, dl, s[i:j])\nprint(dl)","ans":"18","note":"","similar":[32536,32535,31204,31160,32522,32513,32512,2130]},{"id":"32536к","kid":32536,"alias":"","blk":"B11","sub":"R4","subn":"Экзотические записи (римские, вавилонские, Excel, таймкоды)","skills":["S28","S29"],"method":"автомат проверки корректности","alt":"—","re":"частично","d":5,"star":true,"grob":false,"roman":false,"teacher":false,"viz":"LOOP2","train":"Столбцы Excel: A = 1, …, Z = 26, AA = 27, …, XFD = 16384 (больше нельзя). Найдите непрерывную подстроку из букв — допустимое имя столбца с максимальным номером. Ответ: этот номер.","real":"(Е. Джобс) В Excel столбцы обозначаются заглавными английскими буквами. Буквам A, B, …, Z соответствуют значения 1, 2, …, 26. Номер столбца вычисляется как значение записи в системе с основанием 26 без нулевой цифры. Например: A = 1, Z = 26, AA = 27, ZZ = 702, CAT = 2074. В современных версиях Excel допустимы только столбцы с номерами от 1 до 16 384 включительно (последний столбец — XFD).\nДана строка, состоящая из цифр 0–9 и заглавных английских букв A–Z. Найдите непрерывную подстроку, которая является допустимым именем столбца Excel и имеет максимальный номер. В ответе запишите десятичный номер найденного столбца.","src":"","lvl":"С","file":"https://kompege.ru/files/fdCQIpJz4l.txt","s":"1AB2XFE3XFC9KZZ0ZZZQ7XEZ","code":"s='1AB2XFE3XFC9KZZ0ZZZQ7XEZ'\nprint(len(s), set(s), s[:200])\ndef num(x):\n    n = 0\n    for c in x:\n        n = n * 26 + ord(c) - 64\n    return n\nmx = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if not ss.isalpha():\n            break\n        if ⟦num(ss) <= 16384 and num(ss) > mx⟧:\n            mx = num(ss)\n            print(i, ss, mx)\nprint(mx)","ans":"16383","note":"","similar":[32535,31204,31160,32522,32513,32512,32511,2130]},{"id":"32525к","kid":32525,"alias":"","blk":"B12","sub":"T4","subn":"Слова Фибоначчи","skills":["S06","S30"],"method":"генерация слов + find","alt":"—","re":"нет","d":5,"star":true,"grob":false,"roman":false,"teacher":false,"viz":"FIND","train":"Слова Фибоначчи: F1 = 01, F2 = 010, Fn = Fn−1 + Fn−2 (склейка строк). Найдите самую длинную подстроку, в точности совпадающую с одним из слов Fn. Ответ: её длина.","real":"(Е. Джобс) Дана строка S, состоящая только из символов 0 и 1. Рассмотрим последовательность двоичных слов Фибоначчи:\nF₁ = 01;    F₂ = 010;    Fₙ = Fₙ₋₁ + Fₙ₋₂ при n ≥ 3.\nЗнак «+» означает конкатенацию (соединение) строк, а не сложение чисел.\nНайдите самую длинную непрерывную подстроку, в точности совпадающую с одним из слов Fₙ. В ответе запишите её длину.\nПервые слова последовательности","src":"","lvl":"С","file":"https://kompege.ru/files/2QNhcqx6Jg.txt","s":"1101001010010100101101001011010011","code":"s='1101001010010100101101001011010011'\nprint(len(s), set(s), s[:200])\nf = ['01', '010']\nwhile len(f[-1]) <= len(s):\n    f.append(⟦f[-1] + f[-2]⟧)\nprint(f)\ndl = 0\nfor w in f:\n    if w in s and len(w) > dl:\n        dl = len(w)\n        print(w, s.find(w))\nprint(dl)","ans":"8","note":"","similar":[32528,32527,32526,32524,32523]},{"id":"31368к","kid":31368,"alias":"","blk":"B11","sub":"S3","subn":"Значение выражения","skills":["S29"],"method":"RE + eval для кандидатов","alt":"—","re":"частично","d":5,"star":true,"grob":true,"roman":false,"teacher":false,"viz":"LOOP2","train":"Строка из цифр и знаков «+» и «*». Определите максимальное количество символов в корректном выражении (числа без ведущих нулей, знаки не стоят рядом), значение которого равно нулю.","real":"Текстовый файл состоит из десятичных цифр, знаков \"+\" и \"*\" (сложения и умножения). Определите максимальное количество символов в непрерывной последовательности, являющейся корректным арифметическим выражением с целыми неотрицательными числами (без знака), значение которого равно нулю. В этом выражении никакие два знака арифметических операций не стоят рядом, порядок действий определяется по правилам математики. В записи чисел отсутствуют незначащие (ведущие) нули.\nВ ответе укажите количество символов.","src":"Пересдача 08.07.26","lvl":"Г","file":"https://kompege.ru/files/UOR5WNvHt.txt","s":"5+0*12*0+0*3+04*0+7*0*80+0*0+9","code":"from re import *\ns='5+0*12*0+0*3+04*0+7*0*80+0*0+9'\nprint(len(s), set(s), s[:200])\nnum = '(?:0|[1-9][0-9]*)'\npat = num + '(?:[+*]' + num + ')*'\ndl = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if fullmatch(pat, ss) and ⟦eval(ss) == 0⟧ and len(ss) > dl:\n            dl = len(ss)\n            print(i, dl, ss)\nprint(dl)","ans":"14","note":"","similar":[18147,26491,19970,17685,17641,18239,19751,21597,19149,19884]},{"id":"14242к","kid":14242,"alias":"","blk":"B10","sub":"O1","subn":"Равное количество двух букв","skills":["S26"],"method":"префиксная разность + первый индекс","alt":"—","re":"нет","d":5,"star":true,"grob":true,"roman":false,"teacher":false,"viz":"BALANCE","train":"Строка из букв A, B, D, E и цифр 0, 1, 2, 3. Определите максимальную длину подстроки, в которой согласных букв столько же, сколько гласных, и чётных цифр столько же, сколько нечётных. Гласные: A, E.","real":"(П. Говоров) В файле содержится строка длиной не более 106 из букв A,B,D,E и цифр 0,1,2,3.\nОпределите в прилагаемом файле максимальную длину подпоследовательности, в которой количество согласных букв равно количеству гласных и количество четных цифр равно количеству нечетных","src":"","lvl":"Г","file":"https://kompege.ru/files/2BMhQKZkF.txt","s":"AB01DE2BBA31EA0D2B13AEDB0","code":"s='AB01DE2BBA31EA0D2B13AEDB0'\nprint(len(s), set(s), s[:200])\nb1 = b2 = 0\nfirst = {(0, 0): -1}\ndl = 0\nfor i in range(len(s)):\n    c = s[i]\n    b1 += (c in 'AE') - (c in 'BD')\n    b2 += (c in '02') - (c in '13')\n    key = ⟦(b1, b2)⟧\n    if key in first:\n        if i - first[key] > dl:\n            dl = i - first[key]\n            print(i, key, dl, s[first[key]+1:i+1])\n    else:\n        first[key] = i\nprint(dl)","ans":"20","note":"","similar":[10131,14512]},{"id":"3099к","kid":3099,"alias":"","blk":"B3","sub":"C4","subn":"Частоты + соседство / замены","skills":["S08"],"method":"Counter, проход по соседям","alt":"—","re":"нет","d":4,"star":true,"grob":true,"roman":false,"teacher":false,"viz":"FREQ","train":"Нужно заменить некоторые буквы на другие так, чтобы из букв строки можно было собрать палиндром. Ответ: минимальное количество замен.","real":"(PRO100 ЕГЭ) Текстовый файл содержит строку из заглавных латинских букв, всего не более чем из 106 символов. Требуется заменить некоторые буквы на другие латинские так, чтобы из букв получившейся строки можно было собрать палиндром. В ответ запишите минимальное количество замен, которое нужно сделать.\nПример:\nИз строки wqe, строка wqq (можно собрать палиндром qwq) получается с помощью одной замены e -> q. \nОтвет: 1","src":"","lvl":"Г","file":"https://kompege.ru/files/scdrcDEHG.txt","s":"WQEABCAQZZXWEBRTY","code":"s='WQEABCAQZZXWEBRTY'\nprint(len(s), set(s), s[:200])\nodd = 0\nfor c in set(s):\n    if s.count(c) % 2 == 1:\n        odd += 1\nprint(odd)\nprint(⟦odd // 2⟧)","ans":"2","note":"","similar":[2715,786]},{"id":"19149к","kid":19149,"alias":"","blk":"B11","sub":"S3","subn":"Значение выражения","skills":["S29"],"method":"RE + eval для кандидатов","alt":"—","re":"частично","d":5,"star":true,"grob":true,"roman":false,"teacher":false,"viz":"LOOP2","train":"Строка из скобок «(» и «)», знака «+» и цифр 1–4. Определите максимальное количество символов в подстроке, которая начинается с «(» и заканчивается «)», является корректным выражением и имеет чётное значение. Знаки не стоят рядом, «+» не стоит сразу после «(» и перед «)».","real":"(В. Лашин) Текстовый файл состоит из символов ')', '(', знака '+' и цифр 1, 2, 3, 4. Определите максимальное количество символов в непрерывной последовательности, начинающихся с символа '(' и кончающихся символом ')', при этом последовательность является математически корректной и её значение кратно 2.\nВ этом выражении никакие два знака арифметических операций не стоят рядом, в начале и в конце математической последовательности не может стоять знак '+'.\nВ ответе укажите количество символов.","src":"","lvl":"Г","file":"https://kompege.ru/files/2mhhaHRMtr.txt","s":"(1+2)+(3+1)(2+(4+3))+1)((21+3)+(4))+(","code":"s='(1+2)+(3+1)(2+(4+3))+1)((21+3)+(4))+('\nprint(len(s), set(s), s[:200])\ndl = 0\nfor i in range(len(s)):\n    if s[i] != '(':\n        continue\n    for j in range(i + 2, len(s) + 1):\n        ss = s[i:j]\n        if ss[-1] != ')' or '++' in ss or '(+' in ss or '+)' in ss or '()' in ss:\n            continue\n        try:\n            v = eval(ss)\n        except Exception:\n            continue\n        if ⟦type(v) == int and v % 2 == 0⟧ and len(ss) > dl:\n            dl = len(ss)\n            print(i, dl, ss, v)\nprint(dl)","ans":"12","note":"","similar":[18147,26491,19970,31368,17685,17641,18239,19751,21597,19884]}],"warm":[{"id":"W01","blk":"B1","mode":"А","viz":"LOOP1","title":"Индексы и срезы","task":"Срез s[a:b] берёт символы с индексами a, a+1, …, b−1. Впиши срез, который выводит символы с индекса 3 по индекс 6 включительно.","gen":{"alpha":"ABCDEFGHKLMN","n":[10,14]},"code":"s='{s}'\nprint(s[0], s[2], s[-1])\nprint(⟦s[3:7]⟧)"},{"id":"W02","blk":"B1","mode":"А","viz":"FIND","title":"count и in","task":"Посчитай, сколько раз в строке встречается пара AB (без перекрытий).","gen":{"alpha":"ABC","n":[16,22]},"code":"s='{s}'\nprint('AB' in s)\nprint(⟦s.count('AB')⟧)"},{"id":"W03","blk":"B1","mode":"Б","viz":"FIND","title":"Перекрывающиеся вхождения","task":"count не видит перекрытий: в ABABA он найдёт ABA один раз. Допиши условие цикла, чтобы найти все вхождения с перекрытиями.","gen":{"alpha":"AB","n":[14,18],"words":["ABABA","ABA"]},"code":"s='{s}'\nw = 'ABA'\nk = 0\nfor i in range(len(s)):\n    if ⟦s[i:i+len(w)] == w⟧:\n        k += 1\nprint(s.count(w), k)"},{"id":"W04","blk":"B1","mode":"Б","viz":"FIND","title":"find в цикле","task":"find(w, start) ищет слово начиная с позиции start и возвращает −1, если не нашёл. Допиши поиск следующего вхождения.","gen":{"alpha":"XYZ","n":[14,20],"words":["XY","XY","XY"]},"code":"s='{s}'\np = s.find('XY')\nl = []\nwhile p != -1:\n    l.append(p)\n    p = ⟦s.find('XY', p + 1)⟧\nprint(l)"},{"id":"W05","blk":"B1","mode":"А","viz":"REGEX","title":"Первое регулярное выражение","task":"Найди все подстроки «A, любой символ, C». Точка в шаблоне — ровно один любой символ.","gen":{"alpha":"ABCD","n":[18,24],"words":["ABC","ADC"]},"code":"from re import *\ns='{s}'\nl = findall(⟦'A.C'⟧, s)\nprint(l)"},{"id":"W06","blk":"B1","mode":"А","viz":"REGEX","title":"Просмотр вперёд","task":"findall не возвращается назад, поэтому AAAA даёт только две пары AA. Оберни шаблон в (?=(…)), чтобы найти все пары с перекрытиями.","gen":{"alpha":"AB","n":[14,18],"words":["AAAA"]},"code":"from re import *\ns='{s}'\nprint(len(findall('AA', s)))\nl = findall(⟦'(?=(AA))'⟧, s)\nprint(len(l))"},{"id":"W07","blk":"B4","mode":"А","viz":"REGEX","title":"Классы символов и квантификатор +","task":"[ABC]+ — одна или больше букв из набора подряд. Найди длину самой длинной цепочки из букв A, B, C.","gen":{"alpha":"ABCDE","n":[20,26]},"code":"from re import *\ns='{s}'\nl = findall(⟦'[ABC]+'⟧, s)\nprint(l)\nprint(len(max(l, key=len)))"},{"id":"W08","blk":"B4","mode":"Б","viz":"RUN","title":"Текущая и максимальная серия","task":"k — длина текущей серии одинаковых символов, mx — лучшая. Допиши, что делаем, если символ совпал с предыдущим и если нет.","gen":{"alpha":"AB","n":[16,20],"words":["AAAA","BBB"]},"code":"s='{s}'\nk = 1\nmx = 1\nfor i in range(1, len(s)):\n    if s[i] == s[i-1]:\n        ⟦k += 1⟧\n    else:\n        ⟦k = 1⟧\n    mx = max(mx, k)\nprint(mx)"},{"id":"W09","blk":"B5","mode":"А","viz":"SPLIT","title":"split и самый длинный кусок","task":"split(\".\") режет строку по точкам. Впиши разделитель и найди длину самого длинного куска.","gen":{"alpha":"ABC..","n":[18,24]},"code":"s='{s}'\nl = s.split(⟦'.'⟧)\nprint(l)\nm = max(l, key=len)\nprint(len(m))"},{"id":"W10","blk":"B5","mode":"Б","viz":"REPLACE","title":"replace перед split","task":"Запрещена пара XY. Вставь пробел внутрь пары, чтобы X остался в левом куске, а Y — в правом, и разрежь строку.","gen":{"alpha":"XYZ","n":[16,22],"words":["XY","XY"]},"code":"s='{s}'\ns = s.replace('XY', ⟦'X Y'⟧)\nprint(s)\nl = s.split()\nprint(len(max(l, key=len)))"},{"id":"W11","blk":"B5","mode":"Б","viz":"REPLACE","title":"Повторная замена","task":"Запрещены три A подряд. Одной замены мало: из AAAA получится AA AAA. Допиши цикл, который повторяет замену, пока AAA есть в строке.","gen":{"alpha":"AB","n":[16,20],"words":["AAAAA","AAA"]},"code":"s='{s}'\n⟦while 'AAA' in s:⟧\n    s = s.replace('AAA', 'AA AA')\nprint(s)\nprint(len(max(s.split(), key=len)))"},{"id":"W12","blk":"B6","mode":"Б","viz":"RUN","title":"Условие на соседей","task":"Найди самую длинную неубывающую последовательность цифр. Впиши условие продолжения серии.","gen":{"alpha":"0123456789","n":[16,22]},"code":"s='{s}'\nk = 1\nmx = 1\nfor i in range(1, len(s)):\n    if ⟦s[i] >= s[i-1]⟧:\n        k += 1\n    else:\n        k = 1\n    mx = max(mx, k)\nprint(mx)"},{"id":"W13","blk":"B7","mode":"Б","viz":"BLOCK","title":"Шаг 2 и две фазы","task":"Ищем самую длинную цепочку пар AB. Пары могут начинаться с чётной или с нечётной позиции — поэтому две фазы. Впиши проверку пары.","gen":{"alpha":"ABC","n":[18,24],"words":["ABABAB","ABAB"]},"code":"s='{s}'\nmx = 0\nfor st in range(2):\n    k = 0\n    for i in range(st, len(s) - 1, 2):\n        if ⟦s[i:i+2] == 'AB'⟧:\n            k += 1\n        else:\n            k = 0\n        mx = max(mx, k)\nprint(mx)"},{"id":"W14","blk":"B7","mode":"Б","viz":"RUN","title":"Узор по остатку","task":"Ищем самый длинный кусок, который идёт по кругу XYZXYZ… с любой буквы. Впиши, какой символ ожидается на позиции j.","gen":{"alpha":"XYZ","n":[18,24],"words":["XYZXYZX","ZXY"]},"code":"s='{s}'\nmx = 0\nfor i in range(len(s)):\n    j = i\n    while j < len(s) and s[j] == ⟦'XYZ'[('XYZ'.index(s[i]) + j - i) % 3]⟧:\n        j += 1\n    mx = max(mx, j - i)\nprint(mx)"},{"id":"W15","blk":"B7","mode":"А","viz":"REGEX","title":"Альтернация групп","task":"Цепочка из блоков XY и ZZX в любом порядке. Впиши шаблон: внешняя группа — вся цепочка, внутренняя — выбор XY или ZZX.","gen":{"alpha":"XYZ","n":[18,24],"words":["XYZZX","ZZXXY"]},"code":"from re import *\ns='{s}'\nl = findall(⟦'((XY|ZZX)+)'⟧, s)\nl = [c[0] for c in l]\nprint(l)\nprint(len(max(l, key=len)))"},{"id":"W16","blk":"B9","mode":"Б","viz":"LOOP2","title":"Двойной цикл по подстрокам","task":"Перебери все подстроки s[i:j] и посчитай те, в которых не больше одной буквы A.","gen":{"alpha":"AB","n":[7,9]},"code":"s='{s}'\nk = 0\nfor i in range(len(s)):\n    for j in range(i + 1, len(s) + 1):\n        ss = s[i:j]\n        if ⟦ss.count('A') <= 1⟧:\n            k += 1\nprint(k)"},{"id":"W17","blk":"B9","mode":"Б","viz":"LOOP2","title":"Ранний выход break","task":"Если в подстроке уже две буквы A, то в более длинных их не меньше — дальше можно не проверять. Впиши выход из внутреннего цикла и сравни число проверок n.","gen":{"alpha":"AB","n":[9,11]},"code":"s='{s}'\nk = 0\nn = 0\nfor i in range(len(s)):\n    j = i + 1\n    while j <= len(s):\n        ss = s[i:j]\n        n += 1\n        if ss.count('A') > 1:\n            ⟦break⟧\n        k += 1\n        j += 1\nprint(n, k)"},{"id":"W18","blk":"B8","mode":"Б","viz":"WINDOW","title":"Окно фиксированной длины","task":"Сдвигай окно длины 5 по строке и найди наибольшее количество букв A внутри окна.","gen":{"alpha":"ABB","n":[16,20]},"code":"s='{s}'\nmx = 0\nfor i in range(len(s) - 4):\n    mx = max(mx, ⟦s[i:i+5].count('A')⟧)\nprint(mx)"},{"id":"W19","blk":"B8","mode":"Б","viz":"WINDOW","title":"Окно «не более K»","task":"Правая граница r идёт вперёд. Когда букв A стало больше двух, левая граница l сдвигается. Впиши условие сдвига.","gen":{"alpha":"ABBC","n":[18,22]},"code":"s='{s}'\nl = 0\nk = 0\nmx = 0\nfor r in range(len(s)):\n    k += s[r] == 'A'\n    while ⟦k > 2⟧:\n        k -= s[l] == 'A'\n        l += 1\n    mx = max(mx, r - l + 1)\nprint(mx)"},{"id":"W20","blk":"B8","mode":"Б","viz":"WINDOW","title":"Ровно K через позиции","task":"p — позиции букв A, с добавленными −1 и len(s) по краям. Самый длинный кусок ровно с K буквами A тянется от p[i−1]+1 до p[i+K]−1. Впиши его длину.","gen":{"alpha":"ABBC","n":[18,22],"words":["A","A","A"]},"code":"s='{s}'\np = [-1] + [i for i in range(len(s)) if s[i] == 'A'] + [len(s)]\nprint(p)\nK = 2\nmx = 0\nfor i in range(1, len(p) - K):\n    mx = max(mx, ⟦p[i+K] - p[i-1] - 1⟧)\nprint(mx)"},{"id":"W21","blk":"B8","mode":"Б","viz":"WINDOW","title":"Минимальное окно","task":"Самый короткий кусок с K буквами A начинается на одной A и заканчивается на K-й следующей. Впиши его длину через позиции.","gen":{"alpha":"ABBC","n":[18,22],"words":["A","A","A","A"]},"code":"s='{s}'\np = [i for i in range(len(s)) if s[i] == 'A']\nprint(p)\nK = 3\nmn = len(s)\nfor i in range(len(p) - K + 1):\n    mn = min(mn, ⟦p[i+K-1] - p[i] + 1⟧)\nprint(mn)"},{"id":"W22","blk":"B12","mode":"Б","viz":"PTR2","title":"Два указателя навстречу","task":"l идёт слева, r — справа. Если символы не совпали, строка не палиндром. Впиши условие.","gen":{"alpha":"ABC","n":[7,11],"pal":true},"code":"s='{s}'\nl = 0\nr = len(s) - 1\nok = True\nwhile l < r:\n    if ⟦s[l] != s[r]⟧:\n        ok = False\n        break\n    l += 1\n    r -= 1\nprint(ok)"},{"id":"W23","blk":"B9","mode":"Б","viz":"PREFIX","title":"Префиксный массив","task":"K[i] — сколько букв A среди s[0..i]. Тогда в s[I:J] их K[J−1] − K[I−1]. Впиши формулу.","gen":{"alpha":"ABC","n":[16,20]},"code":"s='{s}'\nK = [0] * len(s)\nfor i in range(len(s)):\n    K[i] = (K[i-1] if i > 0 else 0) + (s[i] == 'A')\nprint(K)\nI, J = 3, 12\nprint(s[I:J].count('A'))\nprint(⟦K[J-1] - K[I-1]⟧)"},{"id":"W24","blk":"B3","mode":"Б","viz":"FREQ","title":"Частотный словарь","task":"Посчитай буквы в словаре d и выведи самую частую (при равенстве — раньше по алфавиту) с количеством.","gen":{"alpha":"ABCD","n":[18,24]},"code":"s='{s}'\nd = {}\nfor c in s:\n    ⟦d[c] = d.get(c, 0) + 1⟧\nprint(d)\nm = max(d.values())\nc = min(x for x in d if d[x] == m)\nprint(c + str(m))"},{"id":"W25","blk":"B10","mode":"Б","viz":"BALANCE","title":"Баланс через словарь","task":"b растёт на A и уменьшается на B. Если значение b уже было на позиции first[b], то между ними A и B поровну. Впиши длину такого куска.","gen":{"alpha":"ABAB","n":[16,20]},"code":"s='{s}'\nb = 0\nfirst = {0: -1}\nmx = 0\nfor i in range(len(s)):\n    b += (s[i] == 'A') - (s[i] == 'B')\n    if b in first:\n        mx = max(mx, ⟦i - first[b]⟧)\n    else:\n        first[b] = i\nprint(mx)"},{"id":"W26","blk":"B11","mode":"А","viz":"REGEX","title":"Запись числа без ведущих нулей","task":"Восьмеричные цифры — 0…7. Число не может начинаться с 0 (кроме самого числа 0). Впиши шаблон и найди длину самой длинной записи.","gen":{"alpha":"0123456789AB","n":[18,24]},"code":"from re import *\ns='{s}'\nl = findall(⟦'[1-7][0-7]*|0'⟧, s)\nprint(l)\nprint(len(max(l, key=len)))"}],"archive":[{"id":32536,"lvl":"С","src":"","blk":"B11","sub":"R4","subn":"Экзотические записи (римские, вавилонские, Excel, таймкоды)","st":"main","q":"(Е. Джобс) В Excel столбцы обозначаются заглавными английскими буквами. Буквам A, B, …, Z соответствуют значения 1, 2, …, 26. Номер столбца вычисляется как значение записи в системе с основанием 26 без нулевой цифры. Например: A = 1, Z = 26, AA = 27, ZZ = 702, CAT = 2074. В современных версиях Excel допустимы только столбцы с номерами от 1 до 16 384 включительно (последний столбец — XFD).\nДана строка, состоящая из цифр 0–9 и заглавных английских букв A–Z. Найдите непрерывную подстроку, которая является допустимым именем столбца Excel и имеет максимальный номер. В ответе запишите десятичный номер найденного столбца.","file":"https://kompege.ru/files/fdCQIpJz4l.txt"},{"id":32535,"lvl":"С","src":"","blk":"B11","sub":"R4","subn":"Экзотические записи (римские, вавилонские, Excel, таймкоды)","st":"arch","q":"(Е. Джобс) В Excel столбцы обозначаются заглавными английскими буквами. Буквам A, B, …, Z соответствуют значения 1, 2, …, 26. Номер столбца вычисляется как значение записи в системе с основанием 26 без нулевой цифры. Например: A = 1, Z = 26, AA = 27, ZZ = 702, CAT = 2074. В современных версиях Excel допустимы только столбцы с номерами от 1 до 16 384 включительно (последний столбец — XFD).\nДана строка, состоящая из цифр 0–9 и заглавных английских букв A–Z. Найдите непрерывную подстроку, которая является допустимым именем столбца Excel и имеет максимальный номер. Рассматриваются ВСЕ подстроки, в том числе части более длинных последовательностей букв. Если максимальный номер встречается несколько раз, выберите самое левое вхождение. В ответе запишите её начальную позицию в строке (нумерация с 1).","file":"https://kompege.ru/files/2SJucKjutg.txt"},{"id":32528,"lvl":"С","src":"","blk":"B12","sub":"T4","subn":"Слова Фибоначчи","st":"arch","q":"(Е. Джобс) Дана строка S, состоящая только из символов 0 и 1. Рассмотрим последовательность двоичных слов Фибоначчи:\nНачальное слово в ряду F0 = 0. Каждое следующее слово получается по принципу: каждый ноль в строке заменяется на 01, каждая единица – на 0.\nТребуется найти самую длинную непрерывную подстроку, в точности совпадающую с одним из слов Fₙ. Если таких вхождений несколько, выберите самое левое. В ответе запишите её начальную позицию в строке (нумерация с 1).\nПервые слова последовательности","file":"https://kompege.ru/files/r_yR0lq4Jk.txt"},{"id":32527,"lvl":"С","src":"","blk":"B12","sub":"T4","subn":"Слова Фибоначчи","st":"arch","q":"(Е. Джобс) Дана строка S, состоящая только из символов 0 и 1. Рассмотрим последовательность двоичных слов Фибоначчи:\nНачальное слово в ряду F0 = 0. Каждое следующее слово получается по принципу: каждый ноль в строке заменяется на 01, каждая единица – на 0.\nТребуется найти самую длинную непрерывную подстроку, в точности совпадающую с одним из слов Fₙ. В ответе запишите длину найденной подстроки.\nПервые слова последовательности","file":"https://kompege.ru/files/DgGLQVuUEZ.txt"},{"id":32526,"lvl":"С","src":"","blk":"B12","sub":"T4","subn":"Слова Фибоначчи","st":"arch","q":"(Е. Джобс) Дана строка S, состоящая только из символов 0 и 1. Рассмотрим последовательность двоичных слов Фибоначчи:\nНачальное слово в ряду F0 = 0. Каждое следующее слово получается по принципу: каждый ноль в строке заменяется на 01, каждая единица – на 0.\nТребуется найти самую длинную непрерывную подстроку, в точности совпадающую с одним из слов Fₙ. В ответе запишите максимальный номер найденного слова Фибоначчи. Гарантируется, что слово Фибоначчи в строке есть.\nПервые слова последовательности","file":"https://kompege.ru/files/CAiUSOwBsp.txt"},{"id":32525,"lvl":"С","src":"","blk":"B12","sub":"T4","subn":"Слова Фибоначчи","st":"main","q":"(Е. Джобс) Дана строка S, состоящая только из символов 0 и 1. Рассмотрим последовательность двоичных слов Фибоначчи:\nF₁ = 01;    F₂ = 010;    Fₙ = Fₙ₋₁ + Fₙ₋₂ при n ≥ 3.\nЗнак «+» означает конкатенацию (соединение) строк, а не сложение чисел.\nНайдите самую длинную непрерывную подстроку, в точности совпадающую с одним из слов Fₙ. В ответе запишите её длину.\nПервые слова последовательности","file":"https://kompege.ru/files/2QNhcqx6Jg.txt"},{"id":32524,"lvl":"С","src":"","blk":"B12","sub":"T4","subn":"Слова Фибоначчи","st":"arch","q":"(Е. Джобс) Дана строка S, состоящая только из символов 0 и 1. Рассмотрим последовательность двоичных слов Фибоначчи:\nF₁ = 01;    F₂ = 010;    Fₙ = Fₙ₋₁ + Fₙ₋₂ при n ≥ 3.\nЗнак «+» означает конкатенацию (соединение) строк, а не сложение чисел.\nНайдите самую длинную непрерывную подстроку, в точности совпадающую с одним из слов Fₙ. Если таких вхождений несколько, выберите самое левое. В ответе запишите её начальную позицию в строке (нумерация с 1).\nПервые слова последовательности","file":"https://kompege.ru/files/REy8WukwYA.txt"},{"id":32523,"lvl":"С","src":"","blk":"B12","sub":"T4","subn":"Слова Фибоначчи","st":"arch","q":"(Е. Джобс) Дана строка S, состоящая только из символов 0 и 1. Рассмотрим последовательность двоичных слов Фибоначчи:\nF₁ = 01;    F₂ = 010;    Fₙ = Fₙ₋₁ + Fₙ₋₂ при n ≥ 3.\nЗнак «+» означает конкатенацию (соединение) строк, а не сложение чисел.\nТребуется найти самую длинную непрерывную подстроку, в точности совпадающую с одним из слов Fₙ. В ответе запишите максимальный номер найденного слова Фибоначчи. Гарантируется, что слово Фибоначчи в строке есть.\nПервые слова последовательности","file":"https://kompege.ru/files/NSY2gQSIvt.txt"},{"id":32522,"lvl":"С","src":"","blk":"B11","sub":"R4","subn":"Экзотические записи (римские, вавилонские, Excel, таймкоды)","st":"arch","q":"(Е. Джобс) В упрощённой записи вавилонских чисел используются только символы X, I и двоеточие (:). Символ X обозначает десяток, символ I — единицу, а двоеточие отделяет соседние разряды шестидесятеричного числа.\nКаждый непустой разряд имеет вид X…XI…I: сначала идут все X (от 0 до 5), затем все I (от 0 до 9). Разряд должен содержать хотя бы один символ. Таким образом, его значение находится в диапазоне от 1 до 59. После символа I в пределах одного разряда символ X появляться не может.\nПустой разряд обозначает ноль. Пустые разряды допускаются между двоеточиями и в конце записи, но запись числа не может начинаться с двоеточия (ведущие нулевые разряды запрещены). Например, X::XIII — корректная запись числа 10·60² + 13 = 36013.\nДана одна строка S из символов X, I и :. Любая её непрерывная подстрока, являющаяся корректной записью вавилонского числа, рассматривается как кандидат. Требуется найти подстроку с максимальным числовым значением и вывести её длину.\nПримеры","file":"https://kompege.ru/files/85RVTvKuee.txt"},{"id":32513,"lvl":"С","src":"","blk":"B11","sub":"R4","subn":"Экзотические записи (римские, вавилонские, Excel, таймкоды)","st":"arch","q":"(Е. Джобс) В упрощённой записи вавилонских чисел используются только символы X, I и двоеточие (:). Символ X обозначает десяток, символ I — единицу, а двоеточие отделяет соседние разряды шестидесятеричного числа.\nКаждый непустой разряд имеет вид X…XI…I: сначала идут все X (от 0 до 5), затем все I (от 0 до 9). Разряд должен содержать хотя бы один символ. Таким образом, его значение находится в диапазоне от 1 до 59. После символа I в пределах одного разряда символ X появляться не может.\nПустой разряд обозначает ноль. Пустые разряды допускаются между двоеточиями и в конце записи, но запись числа не может начинаться с двоеточия (ведущие нулевые разряды запрещены). Например, X::XIII — корректная запись числа 10·60² + 13 = 36013.\nДана одна строка S из символов X, I и :. Любая её непрерывная подстрока, являющаяся корректной записью вавилонского числа, рассматривается как кандидат. Требуется найти подстроку с максимальным числовым значением и вывести её начальную позицию (нумерация с 1).\nЕсли максимальное значение достигается несколькими подстроками, выбирается подстрока с наименьшей начальной позицией.\nПримеры","file":"https://kompege.ru/files/m1XdeUxEiV.txt"},{"id":32512,"lvl":"С","src":"","blk":"B11","sub":"R4","subn":"Экзотические записи (римские, вавилонские, Excel, таймкоды)","st":"arch","q":"(Е. Джобс) В упрощённой записи вавилонских чисел используются только символы X, I и двоеточие (:). Символ X обозначает десяток, символ I — единицу, а двоеточие отделяет соседние разряды шестидесятеричного числа.\nКаждый непустой разряд имеет вид X…XI…I: сначала идут все X (от 0 до 5), затем все I (от 0 до 9). Разряд должен содержать хотя бы один символ. Таким образом, его значение находится в диапазоне от 1 до 59. После символа I в пределах одного разряда символ X появляться не может.\nПустой разряд обозначает ноль. Пустые разряды допускаются между двоеточиями и в конце записи, но запись числа не может начинаться с двоеточия (ведущие нулевые разряды запрещены). Например, X::XIII — корректная запись числа 10·60² + 13 = 36013.\nДана одна длинная строка S из символов X, I и :. Требуется найти её самую длинную непрерывную подстроку, которая является корректной записью вавилонского числа по описанным правилам.\nВыведите длину найденной строки в символах. Гарантируется, что искомая строка в файле есть.\nПримеры","file":"https://kompege.ru/files/CA-LKLm9vo.txt"},{"id":32511,"lvl":"С","src":"","blk":"B11","sub":"R4","subn":"Экзотические записи (римские, вавилонские, Excel, таймкоды)","st":"main","q":"(Е. Джобс) В упрощённой записи вавилонских чисел используются только символы X, I и двоеточие (:). Символ X обозначает десяток, символ I — единицу, а двоеточие отделяет соседние разряды шестидесятеричного числа.\nКаждый непустой разряд имеет вид X…XI…I: сначала идут все X (от 0 до 5), затем все I (от 0 до 9). Разряд должен содержать хотя бы один символ. Таким образом, его значение находится в диапазоне от 1 до 59. После символа I в пределах одного разряда символ X появляться не может.\nПустой разряд обозначает ноль. Пустые разряды допускаются между двоеточиями и в конце записи, но запись числа не может начинаться с двоеточия (ведущие нулевые разряды запрещены). Например, X::XIII — корректная запись числа 10·60² + 13 = 36013.\nДана одна длинная строка S из символов X, I и :. Требуется найти её самую длинную непрерывную подстроку, которая является корректной записью вавилонского числа по описанным правилам. Разделителей между кандидатами в строке нет: проверяются все возможные подстроки.\nЕсли существует несколько подходящих подстрок максимальной длины, выберите ту, которая начинается раньше остальных. Выведите начальную позицию найденной подстроки (нумерация с 1). Гарантируется, что искомая строка в файле есть.\nПримеры","file":"https://kompege.ru/files/lme337vfbv.txt"},{"id":31368,"lvl":"Г","src":"Пересдача 08.07.26","blk":"B11","sub":"S3","subn":"Значение выражения","st":"main","q":"Текстовый файл состоит из десятичных цифр, знаков \"+\" и \"*\" (сложения и умножения). Определите максимальное количество символов в непрерывной последовательности, являющейся корректным арифметическим выражением с целыми неотрицательными числами (без знака), значение которого равно нулю. В этом выражении никакие два знака арифметических операций не стоят рядом, порядок действий определяется по правилам математики. В записи чисел отсутствуют незначащие (ведущие) нули.\nВ ответе укажите количество символов.","file":"https://kompege.ru/files/UOR5WNvHt.txt"},{"id":31230,"lvl":"С","src":"Резерв 22.06.26","blk":"B8","sub":"M2","subn":"Ровно K (MIN)","st":"arch","q":"Текстовый файл состоит из заглавных букв латинского алфавита А, В, С, D, Е и F. Определите в прилагаемом файле минимальное количество идущих подряд символов, среди которых тройка букв АВС (в указанном порядке) встречается ровно 110 раз, при этом искомая последовательность заканчивается буквой С. В ответе запишите число - количество символов в найденной последовательности.","file":"https://kompege.ru/files/KawiFKeeq.txt"},{"id":31204,"lvl":"Г","src":"","blk":"B11","sub":"R4","subn":"Экзотические записи (римские, вавилонские, Excel, таймкоды)","st":"main","q":"(А. Ходарин) Текстовый файл состоит из заглавных букв латинского алфавита — цифр римской системы счисления I, V, X, L, C, D, M. Определите в прилагаемом файле максимальное количество идущих подряд символов, которые представляют собой корректную римскую запись десятичного числа. Если найдено несколько таких последовательностей, выберите ту, которая обозначает наибольшее десятичное число. В ответе запишите индекс последнего символа, которым заканчивается запись этого римского числа. Нумерация символов в текстовом файле начинается с нуля. \nПримечание.\nВ римской системе счисления приняты следующие правила:\n1) в качестве цифр используют заглавные латинские буквы I, V, X, L, C, D, M, числовое значение которых 1, 5, 10, 50, 100, 500 и 1000 соответственно;\n2) цифры V, L, D никогда не повторяются;\n3) цифры I, X, C, M могут повторяться не более трёх раз подряд;\n4) если меньшая цифра стоит слева от большей, её значение вычитается из большей; вычитать можно только одну цифру I, Х или С; вычитаемое не может быть меньше одной десятой от уменьшаемого;\n5) если цифра стоит справа от большей или равной, их значения складываются;\n6) цифры в записи числа располагаются слева направо в порядке невозрастания их числового значения за исключением случаев вычитания.\nНапример, запись MMXXVI является корректной и обозначает число 2026, а записи MDDIVXXX, IVIV, XCXC и MCMCMDCCCLXXXVIII являются некорректными.","file":"https://kompege.ru/files/EHqzAkYtadk.txt"},{"id":31160,"lvl":"Г","src":"Основная волна 19.06.26","blk":"B11","sub":"R4","subn":"Экзотические записи (римские, вавилонские, Excel, таймкоды)","st":"main","q":"Текстовый файл состоит из заглавных букв латинского алфавита - цифр римской системы счисления I, V, X, L, C, D, M.\nОпределите в прилагаемом файле максимальное количество идущих подряд символов, которые представляют собой корректную римскую запись десятичного числа. Если найдено несколько таких последовательностей, выберите ту которая обозначает наименьшее десятичное число. В ответе укажите десятичное число, соответствующее найденной последовательности римских цифр.\nПримечание.\nВ римской системе счисления приняты следующие правила:\n1) в качестве цифр используют заглавные латинские буквы I, V, X, L, C, D, M, числовое значение которых 1, 5, 10, 50, 100, 500 и 1000 соответственно;\n2) цифры V, L, D никогда не повторяются;\n3) цифры I, X, C, M могут повторяться не более трёх раз подряд;\n4) если меньшая цифра стоит слева от большей, её значение вычитается из большей; вычитать можно только одну цифру I, Х или С; вычитаемое не может быть меньше одной десятой от уменьшаемого;\n5) если цифра стоит справа от большей или равной, их значения складываются;\n6) цифры в записи числа располагаются слева направо в порядке невозрастания их числового значения за исключением случаев вычитания.\nНапример, римская запись MMXXVI корректна обозначает число 2026, а запись MDDIVXXX некорректна.","file":"https://kompege.ru/files/UyBwlB4N1E.txt"},{"id":31129,"lvl":"С","src":"Основная волна 18.06.26","blk":"B11","sub":"S2","subn":"Корректное выражение","st":"arch","q":"Текстовый файл состоит из цифр 0, 1, 2, 3, 4 и знаков арифметических операций \"-\" и \"*\" (вычитание и умножение). Определите максимальное количество символов в непрерывной последовательности, которая является корректным арифметическим выражением с целыми неотрицательными числами. В этом выражении никакие два знака арифметических операций не стоят рядом, в записи чисел отсутствуют незначащие (ведущие) нули и число 0 не имеет знака.\nВ ответе укажите количество символов.","file":"https://kompege.ru/files/0HlEZ32kdE.txt"},{"id":29354,"lvl":"Б","src":"Открытый вариант 2026","blk":"B8","sub":"L2","subn":"Ровно K подстроки (MAX)","st":"main","q":"Текстовый файл состоит из заглавных букв латинского алфавита A, B, C, D, E и F.\nОпределите в прилагаемом файле максимальное количество идущих подряд символов, среди которых пара символов BC (в указанном порядке) встречается ровно 190 раз.\nВ ответе запишите число – количество символов в найденной последовательности.","file":"https://kompege.ru/files/RnO39StItH.txt"},{"id":28943,"lvl":"Б","src":"ЕГКР 18.04.26","blk":"B8","sub":"M2","subn":"Ровно K (MIN)","st":"main","q":"Текстовый файл состоит из десятичных цифр и заглавных букв латинского алфавита. Определите в прилагаемом файле минимальное количество идущих подряд символов, среди которых пара символов «20» (в указанном порядке) встречается ровно 26 раз, гласная буква встречается ровно один раз, искомая последовательность заканчивается этой единственной гласной буквой. В ответе запишите число - количество символов в найденной последовательности.\nПримечание. гласные буквы латинского алфавита: A, E, I, O, U, Y.","file":"https://kompege.ru/files/IjZCVO1qNHt.txt"},{"id":28765,"lvl":"Б","src":"Досрочная волна 2026","blk":"B8","sub":"K3","subn":"Не более K вхождений подстроки","st":"main","q":"Текстовый файл состоит из заглавных букв латинского алфавита A, B, C, D, E и F.\nОпределите максимальное количество идущих подряд символов в прилагаемом файле, среди которых пара символов BС (в указанном порядке) встречается не более 180 раз.","file":"https://kompege.ru/files/j3nY4l4vsY.txt"},{"id":28007,"lvl":"С","src":"","blk":"B11","sub":"S2","subn":"Корректное выражение","st":"arch","q":"(И. Карпачев) Текстовый файл состоит не более чем из 106 символов и содержит только десятичные цифры, арифметические знаки «+» и «-» и скобки «(» и «)». Определите в этом файле максимальное количество символов в идущих подряд группах символов вида (A+B) или (A-B), где А обозначает натуральное число, не кратное 5, а B – натуральное число, кратное 5. В записи чисел A и B не должно быть незначащих нулей. Например, для строки (((56+-+00(0678-89)(7182-15)(3222+745)) ответом будет 19.","file":"https://kompege.ru/files/QqZ623c9r5b.txt"},{"id":28006,"lvl":"С","src":"","blk":"B11","sub":"S2","subn":"Корректное выражение","st":"arch","q":"(И. Карпачев) Текстовый файл состоит не более чем из 106 символов и содержит только десятичные цифры, арифметические знаки «+» и «-» и скобки «(» и «)». Определите в этом файле максимальное количество идущих подряд групп символов вида (A+B) или (A-B), где А обозначает натуральное чётное число, а B – натуральное нечётное число. В записи чисел A и B не должно быть незначащих нулей. Например, для строки (((56+-+00(0678-89)(78-9)(322+7)) ответом будет 13.","file":"https://kompege.ru/files/rLebe8V7g_w.txt"},{"id":28005,"lvl":"С","src":"","blk":"B11","sub":"S4","subn":"Форматы (e-mail, предложение, вещественные)","st":"main","q":"(И. Карпачев) Текстовый файл состоит не более чем из 106 символов и содержит только десятичные цифры, заглавные и строчные буквы латинского алфавита, а также символы «@» и «.» (точка). Определите максимальное количество символов в непрерывной последовательности, которая является корректным почтовым адресом. Корректным почтовым адресом назовем адрес, в котором сначала указывается имя почтового ящика, затем следует символ «@», далее – сервер, на котором находится почтовый ящик. В данной задаче будем считать, что:\n– в имени почтового ящика используются только символ «.» (точка), десятичные цифры и буквы латинского алфавита;\n– серверу могут соответствовать только строки вида: «yandex.ru» или «gmail.com»;\n– два символа «@» и «.» не могут следовать подряд друг за другом.\nВ ответе укажите количество символов. Например, для строки alex@@s..ch@Gmail.coM.rUnet@yandex.rubo@yandex.ru ответом будет число 25 – длина выделенной части, которая является правильным адресом.","file":"https://kompege.ru/files/roH0Kzb2bPK.txt"},{"id":27777,"lvl":"Б","src":"Апробация 04.03.26","blk":"B11","sub":"R2","subn":"Самая длинная запись в системе","st":"arch","q":"Текстовый файл состоит из символов, обозначающих заглавные буквы латинского алфавита и цифры от 1 до 9 включительно.\nОпределите в прилагаемом файле максимальное количество идущих подряд символов, которые могут представлять запись числа в двенадцатеричной системе счисления.\nПримечание. Цифры, числовое значение которых превышает 9, обозначены латинскими буквами начиная с буквы А.","file":"https://kompege.ru/files/0WfSLOU9xmH.txt"},{"id":27634,"lvl":"Б","src":"Апробация 04.03.26","blk":"B8","sub":"M1","subn":"Не менее K (MIN)","st":"main","q":"Текстовый файл состоит из символов T, U, V, W, X, Y и Z.\nОпределите в прилагаемом файле минимальное количество идущих подряд символов (длину непрерывной подпоследовательности), среди которых символ Z встречается не менее 270 раз.\nДля выполнения этого задания следует написать. программу.","file":"https://kompege.ru/files/DQrJ9-OYjOc.txt"},{"id":27069,"lvl":"С","src":"","blk":"B11","sub":"S4","subn":"Форматы (e-mail, предложение, вещественные)","st":"arch","q":"(Д. Караулов) Текстовый файл состоит не более чем из 106 символов и содержит латинские буквы (прописные и строчные), точки и пробелы. Определите максимальное количество символов в непрерывной последовательности, которая является корректно записанным предложением. Считаем, что в корректно записанном предложении выполнены все следующие условия:\n– предложение начинается с заглавной буквы;\n– предложение оканчивается точкой, которая в предложении единственная и перед которой нет пробела;\n– слова в предложении состоят из произвольных комбинаций букв, возможно не имеют семантического смысла, но при этом только первая буква слова может быть заглавной;\n– слова в предложении разделены пробелами, два пробела стоять рядом в предложении не могут.\nВ ответе укажите количество слов в этом предложении.","file":"https://kompege.ru/files/DgACIgjCbXm.txt"},{"id":26551,"lvl":"Б","src":"","blk":"B11","sub":"R3","subn":"Максимальное число с условием","st":"main","q":"Текстовый файл состоит из десятичных цифр и заглавных букв латинского алфавита. Определите в этом файле последовательность идущих подряд символов, представляющих собой запись максимального чётного 14-ричного числа. В ответе запишите количество символов (значащих цифр в записи числа) в этой последовательности.\nПримечание. Латинские буквы A, B, C и D означают цифры из алфавита 14-ричной системы счисления.","file":"https://kompege.ru/files/iXewhu93aIq.txt"},{"id":26549,"lvl":"Б","src":"Апробация 14.05.26","blk":"B8","sub":"L3","subn":"Ровно K + условия на границы","st":"arch","q":"Текстовый файл состоит из десятичных цифр и заглавных букв латинского алфавита. Определите в прилагаемом файле максимальное количество идущих подряд символов, оканчивающихся подстрокой 2025, среди которых буква Y встречается не менее 140 раз, а подстрока 2025 содержится ровно 50 раз.\nВ ответе запишите число – количество символов в найденной последовательности.","file":"https://kompege.ru/files/QKe9fML1txX.txt"},{"id":26491,"lvl":"Сл","src":"","blk":"B11","sub":"S3","subn":"Значение выражения","st":"arch","q":"(Иглин К.) Текстовый файл состоит из десятичных цифр, знаков «+» и «*» (сложения и умножения). Определите максимальное количество символов в непрерывной последовательности, являющейся корректным арифметическим выражением с целыми положительными числами (без знака), значение которого равно чётному числу. В этом выражении никакие два знака арифметических операций не стоят рядом, порядок действий определяется по правилам математики. В записи чисел отсутствуют незначащие (ведущие) нули.\nВ ответе укажите количество символов.","file":"https://kompege.ru/files/SSphRdOGsg1.txt"},{"id":26078,"lvl":"Б","src":"","blk":"B8","sub":"M2","subn":"Ровно K (MIN)","st":"arch","q":"Текстовый файл состоит из десятичных цифр и заглавных букв латинского алфавита. Определите в прилагаемом файле минимальное количество идущих подряд символов, среди которых подстрока 2025 встречается не менее 110 раз и при этом содержится ровно 90 букв W.\nВ ответе запишите число – количество символов в найденной последовательности.","file":"https://kompege.ru/files/ST-pzcQS-fN.txt"},{"id":26077,"lvl":"Б","src":"","blk":"B8","sub":"L3","subn":"Ровно K + условия на границы","st":"arch","q":"Текстовый файл состоит из десятичных цифр и заглавных букв латинского алфавита. Определите в прилагаемом файле последовательность из максимального количества идущих подряд символов, среди которых ровно 45 нечётных цифр и при этом начинающуюся с буквы G, не содержащую других букв G, кроме первой.\nВ ответе запишите число – количество символов в найденной последовательности.","file":"https://kompege.ru/files/NaPFMPwCvR2.txt"},{"id":25361,"lvl":"Б","src":"ЕГКР 13.12.25","blk":"B8","sub":"L3","subn":"Ровно K + условия на границы","st":"main","q":"Текстовый файл состоит из десятичных цифр и заглавных букв латинского алфавита. Определите в прилагаемом файле максимальное количество идущих подряд символов, среди которых буква F встречается ровно 76 раз, чётная цифра встречается ровно один раз, искомая последовательность начинается с этой единственной чётной цифры.\nВ ответе запишите число - количество символов в найденной последовательности.","file":"https://kompege.ru/files/x6sV1G7SuWL.txt"},{"id":24977,"lvl":"С","src":"","blk":"B8","sub":"K3","subn":"Не более K вхождений подстроки","st":"arch","q":"(В. Лашин) Текстовый файл состоит из десятичных цифр и заглавных букв латинского алфавита. Определите в прилагаемом файле максимальное количество идущих подряд символов, среди которых можно найти не более 10 подстрок соответствующих записи 2?0?2?6, где ? обозначает любой символ.\nНапример, в строке \"A22002266G2J0K2L6A\" можно найти 3 подстроки \"2200226\", \"2002266\", \"2J0K2L6\"\nВ ответе запишите число – количество символов в найденной последовательности.","file":"https://kompege.ru/files/gY5OtFyh072.txt"},{"id":24895,"lvl":"С","src":"","blk":"B11","sub":"S2","subn":"Корректное выражение","st":"arch","q":"Текстовый файл состоит из десятичных цифр от 1 до 9, знаков «+» и «*» (сложения и умножения).\nОпределите в прилагаемом файле максимальное количество символов в непрерывной последовательности, являющейся корректной записью арифметического выражения, состоящей из не более чем 40 натуральных чисел и знаков арифметических операций между ними.\nВ ответе укажите количество символов.","file":"https://kompege.ru/files/_t74VoAmIAK.txt"},{"id":24613,"lvl":"Сл","src":"","blk":"B9","sub":"N4","subn":"Количество подстрок/окон (сложные)","st":"arch","q":"(В. Лашин) Текстовый файл состоит из десятичных цифр и заглавных букв латинского алфавита. Определите, сколько в этом файле подпоследовательностей подряд идущих символов, в которых каждое из слов: 'HALLOWEEN', 'TRICK' и 'TREAT' встречается ровно по 5 раз.\nВ ответе запишите число — количество подходящих подпоследовательностей.\nДля выполнения этого задания необходимо написать программу.","file":"https://kompege.ru/files/SoS8rh6ygQS.txt"},{"id":24374,"lvl":"С","src":"","blk":"B8","sub":"L3","subn":"Ровно K + условия на границы","st":"arch","q":"(Иглин К.) Текстовый файл состоит из десятичных цифр и заглавных букв латинского алфавита. Определите в прилагаемом файле последовательность из максимального количества идущих подряд символов, удовлетворяющую условию: в ней ровно 80 отдельных слов (слова - это последовательности подряд идущих букв, отделенные друг от друга хотя бы одной цифрой).\nВ ответе запишите число - порядковый номер в файле первого символа найденной последовательности.\nПримечание. В прилагаемом файле нумерация символов начинается с нуля.","file":"https://kompege.ru/files/J-IpeNeSO5j.txt"},{"id":23762,"lvl":"С","src":"Демоверсия 2026","blk":"B8","sub":"L3","subn":"Ровно K + условия на границы","st":"arch","q":"Текстовый файл состоит из десятичных цифр и заглавных букв латинского алфавита. Определите в прилагаемом файле максимальное количество идущих подряд символов, среди которых подстрока 2025 встречается не менее 90 раз и при этом содержится ровно 80 букв\nY.\nВ ответе запишите число – количество символов в найденной последовательности.","file":"https://kompege.ru/files/Rr-AWxrY5I.txt"},{"id":23568,"lvl":"С","src":"Пересдача 03.07.25","blk":"B10","sub":"P1","subn":"Ограничена разными символами","st":"arch","q":"Текстовый файл состоит из десятичных цифр и заглавных букв латинского алфавита. Определите в прилагаемом файле последовательность символов, состоящую из максимального количества идущих подряд цифр, начинающуюся и заканчивающуюся одинаковыми буквами, содержащую ровно две буквы: первую и последнюю. Если таких несколько, выберите последовательность с наименьшим порядковым номером в файле её первого символа. В ответе запишите число - порядковый номер в файле первого символа найденной последовательности.\nПримечание. В прилагаемом файле нумерация символов начинается с нуля.","file":"https://kompege.ru/files/HvOIZ69KD.txt"},{"id":23381,"lvl": гаемом файле. Нумерация символов в текстовом файле начинается с нуля.\nПримечание. Латинские буквы А, В, C, D - цифры из алфавита 14-ричной системы счисления.","file":"https://kompege.ru/files/4W4cHgIA0_.txt"},{"id":22356,"lvl":"С","src":"Апробация 14.05.25","blk":"B11","sub":"R3","subn":"Максимальное число с условием","st":"arch","q":"Текстовый файл состоит из десятичных цифр и заглавных букв латинского алфавита. Onределите в этом файле последовательность идущих подряд символов, представляющих собой запись максимального нечётного 12-ричного числа. В ответе запишите индекс (номер) первого символа (первой значащей цифры), с которого начинается запись этого числа в прилагаемом файле. Нумерация символов в текстовом файле начинается с нуля.\nПримечание. Латинские буквы А и В - цифры из алфавита 12-ричной системы счисления.","file":"https://kompege.ru/files/3YNdXanK6D.txt"},{"id":21981,"lvl":"С","src":"","blk":"B11","sub":"R3","subn":"Максимальное число с условием","st":"arch","q":"(Л. Шастин) Текстовый файл состоит из десятичных цифр и заглавных букв латинского алфавита. Определите в этом файле последовательность идущих подряд символов, представляющих собой запись максимального 16-ричного числа, содержащего ровно 10 цифр «B». В ответе запишите количество символов (значащих цифр в записи числа) в этой последовательности.\nПримечание. Латинские буквы A, B, C, D, E и F означают цифры из алфавита 16-ричной системы счисления.","file":"https://kompege.ru/files/SQ78yeyxxp.txt"},{"id":21908,"lvl":"Б","src":"Открытый вариант 2025","blk":"B11","sub":"R3","subn":"Максимальное число с условием","st":"arch","q":"Текстовый файл состоит из десятичных цифр и заглавных букв латинского алфавита. Определите в этом файле последовательность идущих подряд символов, представляющих собой запись максимального чётного 14-ричного числа. В ответе запишите количество символов (значащих цифр в записи числа) в этой последовательности.\nПримечание. Латинские буквы A, B, C и D означают цифры из алфавита 14-ричной системы счисления.","file":"https://kompege.ru/files/UPY5NWUjKx.txt"},{"id":21717,"lvl":"С","src":"ЕГКР 19.04.25","blk":"B8","sub":"M2","subn":"Ровно K (MIN)","st":"arch","q":"Текстовый файл состоит из символов F, G, Q, R, S и W. Определите в этом файле минимальное количество идущих подряд символов, среди которых подстрока RSQ встречается ровно 130 раз, при этом искомая последовательность не оканчивается символом Q.","file":"https://kompege.ru/files/PpYYb3sP_r.txt"},{"id":21597,"lvl":"Сл","src":"","blk":"B11","sub":"S3","subn":"Значение выражения","st":"arch","q":"Текстовый файл состоит из десятичных цифр и знаков арифметических операций «–» и «*» (вычитания и умножения).\nОпределите максимальное количество символов последовательности, являющейся корректным арифметическим выражением с целыми неотрицательными 6-ричными числами, в котором порядок действий слева направо совпадает с порядком действий по правилам математики. В этом выражении никакие два знака арифметических операций не стоят рядом, в записи чисел отсутствуют незначащие (ведущие) нули.\nВ ответе укажите количество символов.","file":"https://kompege.ru/files/jUuYepZ2c.txt"},{"id":21421,"lvl":"Б","src":"Досрочная волна 2025","blk":"B11","sub":"R2","subn":"Самая длинная запись в системе","st":"arch","q":"Текстовый файл состоит из символов, обозначающих десятичные цифры и заглавные буквы латинского алфавита.\nОпределите в прилагаемом файле максимальное количество идущих подряд символов, которые могут представлять запись чётного числа в двенадцатеричной системе счисления. В этой записи отсутствуют незначащие (ведущие) нули.\nПримечание. Цифры, числовое значение которых превышает 9, обозначены латинскими буквами, начиная с буквы A.","file":"https://kompege.ru/files/CLna42cqv.txt"},{"id":21161,"lvl":"Сл","src":"","blk":"B11","sub":"S4","subn":"Форматы (e-mail, предложение, вещественные)","st":"arch","q":"Текстовый файл состоит из заглавных букв А, В, С, строчных букв а, b, c, знака препинания «.» и знаков пробелов. Определите максимальное количество символов в непрерывной последовательности, которая является корректно записанным предложением. Считаем, что в корректно записанном предложении выполнены все следующие условия:\n- предложение начинается с заглавной буквы;\n- предложение оканчивается точкой, которая в предложении единственная и перед которой нет пробела;\n- слова в предложении состоят из произвольных комбинаций букв, возможно не имеют семантического смысла, но при этом только первая буква слова может быть заглавной;\n- слова в предложении разделены пробелами, два пробела стоять рядом в предложении не могут.\nВ ответе укажите количество символов.","file":"https://kompege.ru/files/ruFR3Lojh.txt"},{"id":20968,"lvl":"Б","src":"","blk":"B11","sub":"S2","subn":"Корректное выражение","st":"arch","q":"(М. Попков) Текстовый файл состоит из десятичных цифр, знаков «+» и «*» (сложения и умножения). Определите максимальное количество символов в непрерывной последовательности, являющейся корректным арифметическим выражением с целыми неотрицательными чётными числами. В этом выражении никакие два знака арифметических операций не стоят рядом, порядок действий определяется по правилам математики. В записи чисел отсутствуют незначащие (ведущие) нули.","file":"https://kompege.ru/files/T56f5kQOdo.txt"},{"id":20909,"lvl":"С","src":"Апробация 05.03.25","blk":"B8","sub":"L2","subn":"Ровно K подстроки (MAX)","st":"arch","q":"Текстовый файл состоит из заглавных букв латинского алфавита A, B, C, D, E и F.\nОпределите в прилагаемом файле максимальное количество идущих подряд символов, среди которых пара AB (в указанном порядке) встречается ровно 100 раз.","file":"https://kompege.ru/files/BLJmfsrxrF.txt"},{"id":20813,"lvl":"Сл","src":"Апробация 05.03.25","blk":"B11","sub":"S2","subn":"Корректное выражение","st":"main","q":"Текстовый файл состоит из цифр 0, 7, 8, 9 и знаков арифметических операций «-» и «*» (вычитание и умножение).\nОпределите максимальное количество символов в непрерывной последовательности, которая является корректным арифметическим выражением с целыми неотрицательными числами. В этом выражении никакие два знака арифметических операций не стоят рядом, в записи чисел отсутствуют незначащие (ведущие) нули и число 0 не имеет знака.\nВ ответе укажите количество символов.","file":"https://kompege.ru/files/bznf-u81ka.txt"},{"id":19970,"lvl":"Сл","src":"","blk":"B11","sub":"S3","subn":"Значение выражения","st":"arch","q":"Текстовый файл состоит из десятичных цифр, знаков «+» и «*» (сложения и умножения). Определите максимальное количество символов в непрерывной последовательности, являющейся корректным арифметическим выражением с целыми неотрицательными числами, кратными пяти. В этом выражении никакие два знака арифметических операций не стоят рядом. В записи чисел отсутствуют незначащие (ведущие) нули.","file":"https://kompege.ru/files/h2mFDwCKF.txt"},{"id":19969,"lvl":"Сл","src":"","blk":"B11","sub":"S4","subn":"Форматы (e-mail, предложение, вещественные)","st":"arch","q":"Текстовый файл состоит не более чем из 106 символов и содержит только строчные латинские буквы, а также знаки «@» и «.» . Определите максимальное количество символов в непрерывной последовательности вида [буквы]@[буквы].[буквы] (например yasdamege@nasto.ballov). В ответе укажите количество символов.","file":"https://kompege.ru/files/VvjdVL1gC.txt"},{"id":19968,"lvl":"Сл","src":"","blk":"B11","sub":"S2","subn":"Корректное выражение","st":"arch","q":"Текстовый файл состоит не более чем из 106 символов и содержит только цифры шестнадцатеричной системы счисления, а также знаки «+» и «*» (сложения и умножения). Определите максимальное количество символов в непрерывной последовательности, которая является корректным арифметическим выражением с целыми неотрицательными числами, записанными в шестеричной системе счисления. В этом выражении никакие два знака арифметических операций не стоят рядом, в записи чисел отсутствуют незначащие (ведущие) нули и число 0 не имеет
