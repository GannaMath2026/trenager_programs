однако путники были спасены. Они забрели в лабиринт, представляющий собой текстовый документ, состоящий из букв N, E, W, Y, A, R. Помогите заблудившимся найти путь. Определите, сколько раз встречается комбинация «NEWYEAR» в файле.","file":"https://kompege.ru/files/SASZ2jTT2.txt"},{"id":2509,"lvl":"С","src":"","blk":"B3","sub":"C1","subn":"Самый частый символ","st":"arch","q":"Текстовый файл состоит не более чем из 106 символов и содержит только заглавные буквы латинского алфавита (ABC…Z). Определите количество самого частого и самого редкого символа в файле (без учёта символа окончания строки). В качестве ответа запишите разницу между ними.","file":"https://kompege.ru/files/ZFHhzbRCm.txt"},{"id":2508,"lvl":"Сл","src":"","blk":"B2","sub":"B3s","subn":"Многошаговый анализ строк","st":"main","q":"Текстовый файл состоит не более чем из 106 символов и содержит только заглавные буквы латинского алфавита (ABC…Z). Текст разбит на строки различной длины. Необходимо найти строку, содержащую наибольшее количество букв Q (если таких строк несколько, надо взять ту, которая в файле встретилась позже). Определите, какая буква встречается в этой строке реже всего (но присутствует!). Если таких букв несколько, надо взять ту, которая стоит раньше в алфавите. Запишите в ответе эту букву, а затем – сколько раз она встречается во всем файле.\nПример. Исходный файл:\nZZQAQB\nQAVQAB\nBAQTUB\nВ этом примере в первой и второй строках по две букву Q, в третьей – одна. Берём вторую строку, т.к. она стоит в файле позже. В этой строке реже других встречаются буквы V и B (по одному разу), выбираем букву B, т. к. она раньше стоит в алфавите. В ответе для этого примера надо записать B4, так как во всех строках файла буква B встречается 4 раза.","file":"https://kompege.ru/files/UridmRvJj.txt"},{"id":2507,"lvl":"Сл","src":"","blk":"B2","sub":"B3s","subn":"Многошаговый анализ строк","st":"arch","q":"Текстовый файл состоит не более чем из 106 символов и содержит только заглавные буквы латинского алфавита (ABC…Z). Текст разбит на строки различной длины. Необходимо найти строку, содержащую самую длинную цепочку стоящих подряд одинаковых букв. Если таких строк несколько, надо взять ту, которая в файле встретилась раньше. Определите, какая буква встречается в этой строке чаще всего. Если таких букв несколько, надо взять ту, которая стоит раньше в алфавите. Запишите в ответе эту букву, а затем – сколько раз она встречается во всем файле.\nПример. Исходный файл:\nZZQABA\nZALAAC\nQRAQUT\nВ этом примере в первой и второй строках наибольшая длина цепочек одинаковых буквы равна 2 (ZZ в первой строке, AA во второй), в третьей – 1. Берём первую строку, т.к. она находится в файле раньше. В этой строке чаще других встречаются буквы Z и A (по 2 раза), выбираем букву A, т. к. она стоит раньше в алфавите. В ответе для этого примера надо записать A6, так как во всех строках файла буква A встречается 6 раз.","file":"https://kompege.ru/files/beXmcewXJ.txt"},{"id":2506,"lvl":"С","src":"","blk":"B3","sub":"C1","subn":"Самый частый символ","st":"main","q":"Текстовый файл состоит не более чем из 106 символов и содержит только заглавные буквы латинского алфавита (ABC…Z). Определите символ, который чаще всего встречается в файле. Если таких символов несколько, выведите тот, который стоит раньше в алфавите. Например, в тексте CCBAABABCBC A встречается 3 раза, B - 4 раза и С - 4 раза. Чаще всего встречаются символы B и C, в ответе для этого случая надо написать B4 (без пробелов и других разделителей).","file":"https://kompege.ru/files/caz1v-kBl.txt"},{"id":2505,"lvl":"С","src":"","blk":"B3","sub":"C2","subn":"Символ рядом с заданными","st":"arch","q":"Текстовый файл состоит не более чем из 106 символов и содержит только заглавные буквы латинского алфавита (ABC…Z). Определите символ, который чаще всего встречается в файле между двумя одинаковыми символами. Например, в тексте CCBAABABCBC есть комбинации ABA, BAB, BCB и CBC. Чаще всего – 2 раза – между двумя одинаковыми символами стоит B, в ответе для этого случая надо написать B2 (без пробелов и других разделителей). Если таких символов несколько, выведите тот, который стоит раньше в алфавите.","file":"https://kompege.ru/files/k2j_DRcAR.txt"},{"id":2504,"lvl":"С","src":"","blk":"B3","sub":"C3","subn":"Частая комбинация по маске","st":"main","q":"(Л. Шастин) Текстовый файл содержит строку из заглавных букв A, B, C, D, E, F, всего не более чем из 106 символов. Определите самую частую комбинацию вида CB*BC, где на месте \"*\" может стоять любая буква. В ответе укажите без пробела сначала букву, которая чаще всего встречается на месте \"*\", затем количество подходящих комбинаций c этой буквой.","file":"https://kompege.ru/files/ZvLtggnx7.txt"},{"id":2503,"lvl":"С","src":"","blk":"B2","sub":"B2s","subn":"Сравнение количеств в строке","st":"main","q":"Текстовый файл состоит не более чем из 106 заглавных латинских букв (A..Z). Текст разбит на строки различной длины. Определите количество строк, в которых комбинация букв AOA встречается чаще комбинации OAO.","file":"https://kompege.ru/files/ZDMJv7MNz.txt"},{"id":2502,"lvl":"Б","src":"","blk":"B2","sub":"B1s","subn":"Строки, содержащие шаблон","st":"arch","q":"Текстовый файл состоит не более чем из 106 заглавных латинских букв (A..Z). Текст разбит на строки различной длины. Определите количество строк, в которых хотя бы раз встречается комбинация K*GE, где звёздочка означает произвольный символ.","file":"https://kompege.ru/files/gmr87Y-Uk.txt"},{"id":2501,"lvl":"С","src":"","blk":"B1","sub":"A5","subn":"Шаблон с «любым символом»","st":"arch","q":"Текстовый файл состоит не более чем из 106 заглавных латинских букв (A..Z). Определите количество комбинаций A*A*A, где звёздочка обозначает любой символ.","file":"https://kompege.ru/files/KHJm78Uwp.txt"},{"id":2500,"lvl":"Б","src":"","blk":"B1","sub":"A5","subn":"Шаблон с «любым символом»","st":"main","q":"Текстовый файл состоит не более чем из 106 заглавных латинских букв (A..Z). Определите количество подстрок G*ME, где звёздочка обозначает любой символ.","file":"https://kompege.ru/files/8VdB5r_dB.txt"},{"id":2499,"lvl":"Б","src":"","blk":"B1","sub":"A2","subn":"Подсчёт с перекрытиями","st":"arch","q":"Текстовый файл состоит не более чем из 106 символов X, Y и Z.\nСколько раз в файле встречается последовательность символов XXXX?","file":"https://kompege.ru/files/-Szo1Xtpt.txt"},{"id":2498,"lvl":"Б","src":"","blk":"B1","sub":"A2","subn":"Подсчёт с перекрытиями","st":"arch","q":"Текстовый файл состоит не более чем из 106 символов I, V и X.\nСколько раз в файле встречается последовательность цифр, формирующая римскую цифру девятнадцать (XIX)?","file":"https://kompege.ru/files/vUBBNQn1w.txt"},{"id":2497,"lvl":"Б","src":"","blk":"B1","sub":"A1","subn":"Подсчёт слова без перекрытий","st":"arch","q":"Текстовый файл состоит не более чем из 106 символов I, V и X.\nСколько раз в файле встречается последовательность цифр, формирующая римскую цифру восемнадцать (XVIII)?","file":"https://kompege.ru/files/5fRq53ElA.txt"},{"id":2478,"lvl":"Б","src":"","blk":"B5","sub":"E4","subn":"Самоперекрывающийся запрет","st":"main","q":"Текстовый файл состоит не более чем из 106 символов и содержит только заглавные латинские буквы и десятичные цифры. Определите максимальное количество идущих подряд символов, среди которых нет трёх одинаковых подряд идущих символов.","file":"https://kompege.ru/files/qz04sWk5n.txt"},{"id":2428,"lvl":"С","src":"","blk":"B7","sub":"I2","subn":"Узор с хотя бы одной полной группой","st":"main","q":"(А. Богданов) Текстовый файл состоит не более чем из 106 символов X, Y и Z. В прилагаемом файле определите максимальное количество символов в непрерывной подпоследовательности, состоящей из идущих подряд групп символов XYZ в указанном порядке. При этом в начале и в конце искомой последовательности группа символов XYZ может быть неполной.\nИскомая подпоследовательность должна содержать не менее одной полной группы символов XYZ.\nНапример, условию задачи удовлетворяют: YZXYZXYZX; ZXYZXY; XYZX и т.п.","file":"https://kompege.ru/files/8exZ7brPI.txt"},{"id":2427,"lvl":"С","src":"","blk":"B6","sub":"F5","subn":"Монотонность","st":"arch","q":"(В.Н. Шубинкин) Текстовый файл содержит последовательность из строчных и заглавных букв английского алфавита и цифр, всего не более 106 символов. Убывающей подпоследовательностью будем называть последовательность символов, расположенных в порядке уменьшения их номера в кодовой таблице символов ASCII. Запишите в ответе наибольшую убывающую подпоследовательность. Если таких последовательностей несколько, запишите первую из них.","file":"https://kompege.ru/files/pZ_3cNdsJK.txt"},{"id":2426,"lvl":"Б","src":"","blk":"B4","sub":"D2","subn":"Серия символов из набора / без набора","st":"main","q":"Текстовый файл состоит не более чем из 106 символов 1, 2, 3, A, B, C.\nОпределите максимальное количество идущих подряд цифр.","file":"https://kompege.ru/files/-ktj6OwX0.txt"},{"id":2425,"lvl":"Б","src":"","blk":"B7","sub":"I1","subn":"Циклический узор с неполными краями","st":"arch","q":"В текстовом файле находится цепочка из символов латинского алфавита A, B, C, D, E, F. Найдите максимальную длину цепочки вида DBACDBACDBAC.... (состоящей из фрагментов DBAC, последний фрагмент может быть неполным).","file":"https://kompege.ru/files/okyVgRPB3.txt"},{"id":2424,"lvl":"Б","src":"","blk":"B7","sub":"I2","subn":"Узор с хотя бы одной полной группой","st":"arch","q":"Текстовый файл состоит не более чем из 106 символов и содержит только заглавные буквы латинского алфавита (ABC…Z). Файл разбит на строки различной длины. Определите максимальную длину цепочки символов, состоящей из повторяющихся фрагментов XYZ. Цепочка должна начинаться с символа X и заканчиваться символом Z. Например, для строки SAZZXYZXYZXZQW длина цепочки равна 6: XYZ+XYZ.","file":"https://kompege.ru/files/xNj3o3itQ.txt"},{"id":2423,"lvl":"Б","src":"","blk":"B6","sub":"F5","subn":"Монотонность","st":"arch","q":"Текстовый файл состоит не более чем из 106 символов арабских цифр (0, 1, ..., 9).\nОпределите максимальное количество идущих подряд цифр, расположенных в строгом возрастающем порядке.","file":"https://kompege.ru/files/ARav_BOHd.txt"},{"id":2422,"lvl":"Б","src":"","blk":"B6","sub":"F5","subn":"Монотонность","st":"arch","q":"Текстовый файл состоит не более чем из 106 символов X, Y, Z.\nОпределите максимальное количество идущих подряд символов, расположенных в алфавитном порядке (возможно с повторением символов).","file":"https://kompege.ru/files/zHDxLDMwt.txt"},{"id":2421,"lvl":"Б","src":"","blk":"B4","sub":"D2","subn":"Серия символов из набора / без набора","st":"main","q":"В текстовом файле находится цепочка из символов латинского алфавита A, B, C, D, E, F. Найдите длину самой длинной подцепочки, не содержащей символа D.","file":"https://kompege.ru/files/RXfDKsVD6.txt"},{"id":2420,"lvl":"Б","src":"","blk":"B4","sub":"D2","subn":"Серия символов из набора / без набора","st":"main","q":"В текстовом файле находится цепочка из символов латинского алфавита A, B, C, D, E, F. Найдите длину самой длинной подцепочки, состоящей из символов A, B, E, F (в произвольном порядке).","file":"https://kompege.ru/files/NneIhILSl.txt"},{"id":2419,"lvl":"Б","src":"","blk":"B4","sub":"D1","subn":"Серия одинаковых символов","st":"arch","q":"В текстовом файле находится цепочка из символов латинского алфавита A, B, C длиной не более 106 символов. Найдите длину самой длинной подцепочки, состоящей из символов C","file":"https://kompege.ru/files/RmIe5MTxU.txt"},{"id":2393,"lvl":"Б","src":"","blk":"B6","sub":"F5","subn":"Монотонность","st":"arch","q":"Текстовый файл состоит не более чем из 106 символов арабских цифр (0, 1, .., 9). \nОпределите максимальное количество идущих подряд цифр, расположенных в неубывающем порядке.","file":"https://kompege.ru/files/zk2f4N9S_.txt"},{"id":2360,"lvl":"Б","src":"","blk":"B6","sub":"F5","subn":"Монотонность","st":"arch","q":"Текстовый файл состоит не более чем из 106 символов арабских цифр (0, 1, ..., 9).\nОпределите максимальное количество идущих подряд цифр, расположенных в неубывающем порядке.","file":"https://kompege.ru/files/Uio_xJUEH.txt"},{"id":2251,"lvl":"Б","src":"","blk":"B8","sub":"K1","subn":"Не более K одного символа","st":"arch","q":"Текстовый файл содержит только заглавные буквы латинского алфавита(ABC…Z). Определите максимальное количество идущих подряд символов, среди которых не более двух букв D.","file":"https://kompege.ru/files/o95guNX4a.txt"},{"id":2250,"lvl":"Б","src":"","blk":"B8","sub":"K1","subn":"Не более K одного символа","st":"main","q":"Текстовый файл содержит только заглавные буквы латинского алфавита(ABC…Z). Определите максимальное количество идущих подряд символов, среди которых не более одной буквы A.","file":"https://kompege.ru/files/FeR1tcg8t.txt"},{"id":2150,"lvl":"С","src":"","blk":"B3","sub":"C3","subn":"Частая комбинация по маске","st":"arch","q":"(Л. Шастин) Текстовый файл содержит строку из заглавных букв A, B, C, D, E, F, всего не более чем из 10^6 символов. Определите, сколько встречается комбинаций вида CA*AC, где на месте \"*\" может стоять любая буква, кроме A, B и F. В ответе укажите сначала заглавную латинскую букву, которая чаще всего встречается на месте \"*\", затем общее количество подходящих комбинаций.","file":"https://kompege.ru/files/2y7Q2dcwo.txt"},{"id":2130,"lvl":"Сл","src":"Danov2201","blk":"B11","sub":"R4","subn":"Экзотические записи (римские, вавилонские, Excel, таймкоды)","st":"arch","q":"(А. Богданов) Текстовый файл состоит не более чем из миллиона символов десятичных цифр. Файл образовался в результате последовательной записи «таймкодов» некоторых событий в формате HHMM (часы и минуты слитно по две цифры, т.е. всего 4 цифры на «таймкод», от 0000 до 2359) и прочей случайной информации. Найти максимально возможное количество подряд идущих «таймкодов» между фрагментами неподходящих по формату цифр.\nНапример, строку 4212231135414447 можно разбить:\n - 4[2122]3[1135]4[1444]7 – максимум 1 таймкод подряд\n - 42[1223,1135]4[1444]7 – максимум 2 таймкода подряд\n - 421[2231,1354,1444]7 – максимум 3 таймкода подряд","file":"https://kompege.ru/files/gcG7iDN9u.txt"},{"id":1975,"lvl":"Б","src":"Демоверсия 2022","blk":"B5","sub":"E1","subn":"Нет подстроки из двух символов","st":"main","q":"Текстовый файл состоит из символов P, Q, R и S.  \nОпределите максимальное количество идущих подряд символов в прилагаемом файле, среди которых нет идущих подряд символов P.","file":"https://kompege.ru/files/Neemh_rJh.txt"},{"id":1874,"lvl":"Б","src":"","blk":"B5","sub":"E1","subn":"Нет подстроки из двух символов","st":"arch","q":"Текстовый файл состоит не более чем из 106 символов и содержит только заглавные буквы латинского алфавита (A..Z). Определите максимальное количество идущих подряд символов, среди которых нет сочетания символов QW.","file":"https://kompege.ru/files/JIQe0Ag-d.txt"},{"id":1873,"lvl":"Б","src":"","blk":"B5","sub":"E1","subn":"Нет подстроки из двух символов","st":"arch","q":"Текстовый файл состоит не более чем из 106 символов и содержит только заглавные буквы латинского алфавита (A..Z). Определите максимальное количество идущих подряд символов, среди которых нет сочетания стоящих рядом букв P и R (в любом порядке).","file":"https://kompege.ru/files/F4ciE-vtQ.txt"},{"id":1866,"lvl":"Б","src":"Основная волна 2021","blk":"B5","sub":"E1","subn":"Нет подстроки из двух символов","st":"arch","q":"Текстовый файл состоит не более, чем из 107 строчных букв английского алфавита. Найдите максимальную длину подстроки, в которой символы a и d не стоят рядом.","file":"https://kompege.ru/files/4scJBAUuh.txt"},{"id":1761,"lvl":"Сл","src":"Danov2102","blk":"B12","sub":"T1","subn":"Самый длинный палиндром","st":"main","q":"(А. Богданов) Текстовый файл состоит не более чем из 106 символов X, Y и Z. Определите максимальную длину цепочки символов, являющуюся палиндромом. Например, в последовательности ZZZXYZYXXXZ длина цепочки будет 5: --Z+XYZYX+X--","file":"https://kompege.ru/files/gUaWaiUg2.txt"},{"id":1428,"lvl":"Б","src":"","blk":"B5","sub":"E2","subn":"Нет нескольких подстрок","st":"main","q":"Текстовый файл состоит не более чем из 1200000 символов, которые являются прописными буквами латинского алфавита. Определите максимальное количество идущих подряд символов, среди которых нет подстроки XY и подстроки XZ.","file":"https://kompege.ru/files/awhwk2d6b.txt"},{"id":1377,"lvl":"С","src":"Джобс 16.05.2021","blk":"B7","sub":"J4","subn":"Структурные цепочки (тройки, лесенки, повтор групп)","st":"arch","q":"Текстовый файл состоит не более, чем из 107 символов из набора A, B, C, D, E, F. \n\nНайдите максимальную длину подстроки, в которой ни одна тройка символов не записана два раза подряд.\n\nНапример, в искомой подстроке не может быть фрагмента ABCABC.","file":"https://kompege.ru/files/shcJIqndj.txt"},{"id":1352,"lvl":"Сл","src":"Danov2101","blk":"B7","sub":"I1","subn":"Циклический узор с неполными краями","st":"arch","q":"(А. Богданов) Текстовый файл состоит не более чем из 106 символов X, Y и Z. Определите максимальную длину цепочки символов, состоящей из повторяющихся фрагментов XYZ. Цепочка может начинаться и заканчиваться любым символом из XYZ, но внутри цепочки порядок строго определен. Например, ZZZXYZXYZXZZZ длина цепочки будет 8: --Z+XYZ+XYZ+X--, где цепочка начинается с Z и заканчивается X","file":"https://kompege.ru/files/BqBDuGgpr.txt"},{"id":1302,"lvl":"Б","src":"Открытый вариант КЕГЭ","blk":"B5","sub":"E3","subn":"Нет длинной подстроки","st":"main","q":"Текстовый файл состоит не более чем из 1 200 000 символов X, Y, и Z.  \nОпределите максимальное количество идущих подряд символов, среди которых нет подстроки XZZY.","file":"https://kompege.ru/files/g3Zo67YDg.txt"},{"id":1273,"lvl":"Б","src":"","blk":"B5","sub":"E3","subn":"Нет длинной подстроки","st":"arch","q":"Текстовый файл состоит не более чем из 1200000 символов, которые являются прописными буквами латинского алфавита. Определите максимальное количество идущих подряд символов, среди которых нет подстроки XYZ.","file":"https://kompege.ru/files/j13MDHZQj.txt"},{"id":1255,"lvl":"Сл","src":"Статград 26.04.2021","blk":"B2","sub":"B3s","subn":"Многошаговый анализ строк","st":"arch","q":"Текстовый файл содержит строки различной длины. Общий объём файла не превышает 1 Мбайт. \nСтроки содержат только заглавные буквы латинского алфавита (ABC…Z).\nВ строках, содержащих менее 25 букв A, нужно определить и вывести максимальное расстояние между одинаковыми буквами в одной строке.\n\nПример. Исходный файл:\nGIGA\nGABLAB\nNOTEBOOK\nAGAAA\nВ этом примере во всех строках меньше 25 букв A. Самое большое расстояние между одинаковыми буквами – в третьей строке между буквами O, расположенными в строке на 2-й и 7-й позициях. В ответе для данного примера нужно вывести число 5.","file":"https://kompege.ru/files/v03s1T3pa.txt"},{"id":1230,"lvl":"Б","src":"Апробация 27.04","blk":"B4","sub":"D2","subn":"Серия символов из набора / без набора","st":"arch","q":"Текстовый файл состоит не более чем из 1200000 символов, которые являются прописными буквами латинского алфавита. Определите максимальное количество идущих подряд символов, среди которых нет символов W, R, Q.","file":"https://kompege.ru/files/f37AN05Gb.txt"},{"id":1205,"lvl":"Б","src":"Апробация 27.04","blk":"B4","sub":"D2","subn":"Серия символов из набора / без набора","st":"arch","q":"Текстовый файл состоит не более чем из 1200000 символов, которые являются прописными буквами латинского алфавита. Определите максимальное количество идущих подряд символов, среди которых нет символов G, W, P.","file":"https://kompege.ru/files/MxmSqx0NK.txt"},{"id":1149,"lvl":"С","src":"","blk":"B3","sub":"C2","subn":"Символ рядом с заданными","st":"arch","q":"Текстовый файл состоит не более чем из 106 заглавных латинских букв. Определите символ, который чаще всего встречается в файле между буквами A и C, так что A стоит слева от него, а C – справа. В ответе запишите сначала этот символ, а потом сразу (без разделителя) сколько раз он встретился между буквами A и C. Если таких символов несколько, нужно вывести тот, который стоит раньше в алфавите. Например, в тексте ABCCAAСZABCADCDD между буквами A и C два раза стоит B, по одному разу – A и D. Для этого текста ответом будет B2.","file":"https://kompege.ru/files/pcdxnaEwR.txt"},{"id":1148,"lvl":"Сл","src":"","blk":"B2","sub":"B3s","subn":"Многошаговый анализ строк","st":"arch","q":"Текстовый файл состоит не более чем из 106 символов и содержит только заглавные буквы латинского алфавита (ABC…Z). Текст разбит на строки различной длины. Необходимо найти строку, содержащую наибольшее количество букв Q (если таких строк несколько, надо взять ту, которая в файле встретилась позже). Определите, какая буква встречается в этой строке реже всего (но присутствует!). Если таких букв несколько, надо взять ту, которая стоит раньше в алфавите. Запишите в ответе эту букву, а затем – сколько раз она встречается во всем файле.\nПример. Исходный файл:\nZZQAQB\nQAVQAB\nBAQTUB\nВ этом примере в первой и второй строках по две букву Q, в третьей – одна. Берём вторую строку, т.к. она стоит в файле позже. В этой строке реже других встречаются буквы V и B (по одному разу), выбираем букву B, т. к. она раньше стоит в алфавите. В ответе для этого примера надо записать B4, так как во всех строках файла буква B встречается 4 раза.","file":"https://kompege.ru/files/rWKOZMZph.txt"},{"id":1147,"lvl":"С","src":"","blk":"B3","sub":"C2","subn":"Символ рядом с заданными","st":"arch","q":"Текстовый файл состоит не более чем из 106 символов и содержит только заглавные буквы латинского алфавита (ABC…Z). Определите символ, который чаще всего встречается в файле перед двумя одинаковыми символами. Например, в тексте CCBAABABBCCC есть комбинации BAA, ABB, BCC и CCC. Чаще всего – 2 раза – перед двумя одинаковыми символами стоит B, в ответе для этого случая надо написать B2 (без пробелов и других разделителей). Если таких символов несколько, выведите тот, который стоит раньше в алфавите.","file":"https://kompege.ru/files/2-bsul9eE.txt"},{"id":1146,"lvl":"С","src":"","blk":"B4","sub":"D3","subn":"Минимальная серия","st":"arch","q":"Текстовый файл содержит строку из заглавных букв A, B, C, D, E, F, всего не более чем из 106 символов. D-подстроками назовём последовательности идущих подряд символов D, ограниченные иными символами или концом строки. Например, в строке ABDDDBCDDDDBEDDDDDD три D-подстроки: DDD, DDDD, DDDDD. \nОпределите минимальную длину D-подстроки.","file":"https://kompege.ru/files/x0UhFPz2p.txt"},{"id":1145,"lvl":"С","src":"","blk":"B10","sub":"P1","subn":"Ограничена разными символами","st":"arch","q":"Текстовый файл содержит строку из заглавных букв A, B, C, D, E, F, всего не более чем из 106 символов. DD-подстроками назовём последовательности символов A, B, C, E, F, ограниченные символами D (граничные символы входят в подстроку). Определите минимальную длину DD-подстроки. Подстроки, состоящие из двух символов, не учитывать.","file":"https://kompege.ru/files/JWU5j0vaX.txt"},{"id":1144,"lvl":"С","src":"","blk":"B10","sub":"P1","subn":"Ограничена разными символами","st":"arch","q":"Текстовый файл содержит строку из заглавных букв A, B, C, D, E, F, всего не более чем из 106 символов. AF-подстроками назовём последовательности символов A, B, C, D, E, F, ограниченные в начале символом A, а в конце символом F (граничные символы входят в подстроку). Определите минимальную длину AF-подстроки. Подстроки, состоящие из двух символов, не учитывать.","file":"https://kompege.ru/files/L9F9WY6pT.txt"},{"id":1143,"lvl":"С","src":"","blk":"B9","sub":"N3","subn":"Количество подстрок между границами","st":"main","q":"Текстовый файл содержит строку из заглавных букв A, B, C, D, E, F, всего не более чем из 106 символов. AF-подстроками назовём непустые последовательности идущих подряд символов A, B, C, D, E, F, ограниченные в начале символом A, а в конце символом F (граничные символы входят в подстроку). Определите количество AF-подстрок длиной от 7 до 10 символов.","file":"https://kompege.ru/files/AAGqSw59y.txt"},{"id":1077,"lvl":"С","src":"","blk":"B6","sub":"F5","subn":"Монотонность","st":"arch","q":"Текстовый файл состоит не более чем из 106 символов 1, 2, 3, A, B, C.\nОпределите максимальное количество идущих подряд в неубывающем порядке цифр (цифры могут повторяться).","file":"https://kompege.ru/files/haE5FhflF.txt"},{"id":1064,"lvl":"Сл","src":"Джобс 15.03.2021","blk":"B2","sub":"B3s","subn":"Многошаговый анализ строк","st":"arch","q":"Текстовый файл состоит из множества строк, каждая из которых может содержать буквы из набора A, B, C, D, E, F. \n\n1) Для каждой строки необходимо найти максимальную длину подстроки, состоящей из одинаковых символов.\n2) Для всего файла необходимо определить, какая буква чаще всего образует подстроки максимальной длины, найденные в предыдущем пункте.\n\nЕсли в строке несколько подстрок из различных букв, то считается, что каждая из этих букв составляет подстроку максимальной длины. Например, в строке AABBBBBDDCCCCCE, будет две буквы, составляющих подстроки максимальной длины – B и C.\n\nВ качестве ответа необходимо вывести буквы, которые чаще всего составляют подцепочки максимальной длины","file":"https://kompege.ru/files/YnfHLM97h.txt"},{"id":1042,"lvl":"Б","src":"100 базовых задач Е. Джобс","blk":"B1","sub":"A1","subn":"Подсчёт слова без перекрытий","st":"arch","q":"В файле записана последовательность символов. Сколько подстрок «abc» содержится в файле?","file":"https://kompege.ru/files/6MQPzPOz-.txt"},{"id":1041,"lvl":"С","src":"100 базовых задач Е. Джобс","blk":"B1","sub":"A6","subn":"Позиция k-го вхождения","st":"main","q":"В файле записана последовательность символов. На какой позиции от начала строки встречается 123 буква «f»? Нумерация символов в строке ведется с единицы.","file":"https://kompege.ru/files/70So_7Xbu.txt"},{"id":1040,"lvl":"Б","src":"100 базовых задач Е. Джобс","blk":"B4","sub":"D2","subn":"Серия символов из набора / без набора","st":"arch","q":"В файле записана последовательность символов, состоящей из строчных латинских букв и цифр. Укажите длину самой длинной последовательности, состоящей из цифр.","file":"https://kompege.ru/files/CKKVKnmud.txt"},{"id":1039,"lvl":"Б","src":"100 базовых задач Е. Джобс","blk":"B4","sub":"D1","subn":"Серия одинаковых символов","st":"arch","q":"В файле записана последовательность символов. Укажите длину самой длинной последовательности, состоящей из одинаковых символов.","file":"https://kompege.ru/files/MqlQ_tZAB.txt"},{"id":952,"lvl":"Б","src":"","blk":"B4","sub":"D2","subn":"Серия символов из набора / без набора","st":"arch","q":"В текстовом файле находится цепочка из символов латинского алфавита A, B, C, D, E, F и десятичных цифр. Найдите длину самой длинной подцепочки, не содержащей гласных букв.\nПримечание: Гласными буквами являются буквы A, E","file":"https://kompege.ru/files/o3BAHDdyR.txt"},{"id":934,"lvl":"С","src":"Джобс 08.02.2021","blk":"B6","sub":"F5","subn":"Монотонность","st":"arch","q":"Текстовый файл содержит только заглавные буквы латинского алфавита (ABC…Z). Определите длину наибольшей последовательности из трех различных символов, расположенным в порядке неубывания.\n\nНапример, для строки AABBAABBCCDDDEFFGF такая искомая последовательность BBCCDDD, её длина – 7.","file":"https://kompege.ru/files/pQGk4VA6Y.txt"},{"id":887,"lvl":"С","src":"Джобс 25.12.2020","blk":"B3","sub":"C2","subn":"Символ рядом с заданными","st":"arch","q":"Текстовый файл содержит только заглавные буквы латинского алфавита (ABC…Z). Определите символ, который чаще всего встречается в файле сразу после буквы X. В ответе запишите сначала этот символ, а потом сразу (без разделителя) сколько раз он встретился после буквы X. Например, в тексте XBCXXBXDDD после буквы X два раза стоит B, по одному разу – X и D. Для этого текста ответом будет B2.","file":"https://kompege.ru/files/uzfbd9rTP.txt"},{"id":865,"lvl":"Б","src":"","blk":"B4","sub":"D2","subn":"Серия символов из набора / без набора","st":"arch","q":"(А.М. Кабанов) В текстовом файле находится цепочка из символов латинского алфавита A, B, C, D, E, F. Найдите длину самой длинной подцепочки, не содержащей символов C и F.","file":"https://kompege.ru/files/eObhMvP9n.txt"},{"id":864,"lvl":"Б","src":"","blk":"B4","sub":"D2","subn":"Серия символов из набора / без набора","st":"arch","q":"В текстовом файле находится цепочка из символов латинского алфавита A, B, C, D, E, F. Найдите длину самой длинной подцепочки, не содержащей гласных букв.","file":"https://kompege.ru/files/HrlaIg4Wy.txt"},{"id":863,"lvl":"Б","src":"","blk":"B6","sub":"F4","subn":"Соседние символы различны","st":"arch","q":"Текстовый файл состоит не более чем из 106 заглавных символов латинского алфавита и цифр. Определите максимальное количество идущих подряд символов, среди которых каждые два соседних различны.","file":"https://kompege.ru/files/5lMcFyqVu.txt"},{"id":862,"lvl":"Б","src":"","blk":"B1","sub":"A1","subn":"Подсчёт слова без перекрытий","st":"arch","q":"Текстовый файл состоит не более чем из 106 символов S, T, O, C, K. Сколько раз встречается в файле комбинация «OKTOS»?","file":"https://kompege.ru/files/JvqmKLfub.txt"},{"id":861,"lvl":"Б","src":"","blk":"B1","sub":"A2","subn":"Подсчёт с перекрытиями","st":"main","q":"Текстовый файл состоит не более чем из 106 символов S, T, O, C, K. Сколько раз встречается в файле комбинация «SOCKCOS»?","file":"https://kompege.ru/files/-863oSGJq.txt"},{"id":860,"lvl":"Б","src":"","blk":"B2","sub":"B2s","subn":"Сравнение количеств в строке","st":"arch","q":"Текстовый файл состоит не более чем из 106 заглавных латинских букв (A..Z). Текст разбит на строки различной длины. Определите количество строк, в которых буква J встречается чаще, чем буква E.","file":"https://kompege.ru/files/RVFBMGeWN.txt"},{"id":859,"lvl":"Б","src":"","blk":"B2","sub":"B2s","subn":"Сравнение количеств в строке","st":"arch","q":"Текстовый файл состоит не более чем из 106 заглавных латинских букв (A..Z). Текст разбит на строки различной длины. Определите количество строк, в которых буква S встречается столько же раз, сколько и буква X.","file":"https://kompege.ru/files/LUwlZjrkh.txt"},{"id":858,"lvl":"Б","src":"","blk":"B2","sub":"B1s","subn":"Строки, содержащие шаблон","st":"arch","q":"Текстовый файл состоит не более чем из 106 заглавных латинских букв (A..Z). Текст разбит на строки различной длины. Определите количество строк, в которых встречается комбинация F*O, где звёздочка обозначает любой символ.","file":"https://kompege.ru/files/Kax-g6QK0.txt"},{"id":857,"lvl":"Б","src":"","blk":"B2","sub":"B1s","subn":"Строки, содержащие шаблон","st":"arch","q":"Текстовый файл состоит не более чем из 106 заглавных латинских букв (A..Z). Текст разбит на строки различной длины. Определите количество строк, в которых встречается комбинация Z*RO, где звёздочка обозначает любой символ.","file":"https://kompege.ru/files/Miszvn0O3.txt"},{"id":856,"lvl":"С","src":"","blk":"B3","sub":"C2","subn":"Символ рядом с заданными","st":"arch","q":"Текстовый файл состоит не более чем из 106 заглавных латинских букв. Определите символ, который чаще всего встречается в файле сразу после буквы A. В ответе запишите сначала этот символ, а потом сразу (без разделителя) сколько раз он встретился после буквы А. Например, в тексте ABCAABADDD после буквы A два раза стоит B, по одному разу – A и D. Для этого текста ответом будет B2.","file":"https://kompege.ru/files/BNH47KMY-.txt"},{"id":855,"lvl":"С","src":"","blk":"B3","sub":"C2","subn":"Символ рядом с заданными","st":"arch","q":"Текстовый файл состоит не более чем из 106 заглавных латинских букв. Определите символ, который чаще всего встречается в файле между буквами X и Z, так что X стоит слева от него, а Z – справа. В ответе запишите сначала этот символ, а потом сразу (без разделителя) сколько раз он встретился между буквами X и Z. Например, в тексте XBZCXXZXBZXDZDD между буквами X и Z два раза стоит B, по одному разу – X и D. Для этого текста ответом будет B2.","file":"https://kompege.ru/files/QahQN0fgq.txt"},{"id":836,"lvl":"Б","src":"Джобс 14.12.2020","blk":"B1","sub":"A7","subn":"Палиндромы фиксированной длины","st":"main","q":"Текстовый файл состоит не более чем из 106 символов английского алфавита. \nОпределите количество палиндромов – последовательностей, которые читаются в обе стороны одинаково – длиной 5.","file":"https://kompege.ru/files/RWPLYMnoL.txt"},{"id":811,"lvl":"Б","src":"Джобс 07.12.2020","blk":"B6","sub":"F4","subn":"Соседние символы различны","st":"arch","q":"Текстовый файл состоит не более чем из 106 символов X, Y и Z. \n\nОпределите максимальное количество идущих подряд символов, каждый из которых имеет отличное значение от своих соседей. Первый и последний символ в строке не могут входить в искомую последовательность.","file":"https://kompege.ru/files/uLfXA-vXS.txt"},{"id":786,"lvl":"С","src":"Джобс 30.11.2020","blk":"B3","sub":"C4","subn":"Частоты + соседство / замены","st":"arch","q":"В файле хранится строка из символов. Длина строки не более 106. \n\nСколько пар символов в строке являются симметричными? Симметричной парой называют такие два символа, которые расположены на одинаковом удалении от концов строки. \n\nНапример, в строке adcdeefcba три симметричных пары – aa, cc и ee.","file":"https://kompege.ru/files/eLeRo8pGW.txt"},{"id":730,"lvl":"С","src":"Джобс 23.11.2020","blk":"B6","sub":"F10","subn":"Локальные максимумы, прогрессии расстояний","st":"arch","q":"Текстовый файл содержит последовательность из строчных и заглавных букв английского алфавита и цифр. Всего не более 106 символов. Назовём локальным максимумом символ, номер которого в кодовой таблице больше номеров предыдущего и последующего символов. Самый первый и самый последний символ не являются локальным максимумами. \n\nОпределить наибольшее расстояние между двумя соседними локальными максимумами. Расстоянием между элементами будем считать разность их индексов.","file":"https://kompege.ru/files/zHo-bgLzk.txt"},{"id":705,"lvl":"С","src":"Джобс 16.11.2020","blk":"B6","sub":"F5","subn":"Монотонность","st":"arch","q":"Текстовый файл содержит последовательность из строчных и заглавных букв английского алфавита и цифр, всего не более 106 символов. Убывающей подпоследовательностью будем называть последовательность символов, расположенных в порядке уменьшения их номера в кодовой таблице символов ASCII. Запишите в ответе номер символа, с которого начинается наибольшая убывающая подпоследовательность. Нумерация символов начинается с 1.","file":"https://kompege.ru/files/WU9PpKK2y.txt"},{"id":679,"lvl":"С","src":"Джобс 09.11.2020","blk":"B1","sub":"A6","subn":"Позиция k-го вхождения","st":"arch","q":"Текстовый файл содержит последовательность из символов «(»и «)», всего не более 106 символов. Определить, с какого по счёту символа от начала файла начинается 10000-я пара скобок «()».","file":"https://kompege.ru/files/qQlBzgyhG.txt"},{"id":634,"lvl":"Б","src":"Джобс 02.11.2020","blk":"B2","sub":"B1s","subn":"Строки, содержащие шаблон","st":"arch","q":"Текстовый файл состоит не более чем из 106 заглавных латинских букв (A..Z). Текст разбит на строки различной длины. Определите количество строк, в которых встречается комбинация Z*RO, где звёздочка обозначает любой символ.","file":"https://kompege.ru/files/OIApnzcFs.txt"},{"id":587,"lvl":"Б","src":"Джобс 26.10.2020","blk":"B2","sub":"B2s","subn":"Сравнение количеств в строке","st":"arch","q":"Текстовый файл состоит из не более, чем 1000 строк, каждая из которых состоит не более чем из 106 символов A, B, C. Найдите количество строк, где количество букв B не менее, чем на 5% больше количества букв A. В качестве ответа приведите количество найденных строк.\n\nПримечание: символы в латинице или в английской раскладке","file":"https://kompege.ru/files/zuemySwVg.txt"},{"id":505,"lvl":"С","src":"Джобс 19.10.2020","blk":"B6","sub":"F7","subn":"Одинаковая чётность / сумма соседей","st":"arch","q":"Текстовый файл состоит не более чем из 106 десятичных цифр. Найдите максимальную длину последовательности, каждые две соседние цифры в которой в сумме дают значение не меньшее 10. \n\nНапример, в последовательности 1567543853 есть две такие последовательности 5675 и 385.\n\nВ качестве ответа укажите максимальную длину найденной последовательности.","file":"https://kompege.ru/files/lzx28Yp0h.txt"},{"id":474,"lvl":"Б","src":"Джобс 12.10.2020","blk":"B6","sub":"F7","subn":"Одинаковая чётность / сумма соседей","st":"main","q":"Текстовый файл состоит не более чем из 106 десятичных цифр. Найдите максимальную длину последовательности, которая состоит из цифр одинаковой четности. \n\nНапример, в последовательности 1533244622185452354, 5 последовательностей с нечетными цифрами – 1533, 1, 5, 5, 35 – и 5 с четными – 244622, 8, 4, 2, 4. Следовательно, искомая последовательность – 244622.\n\nВ качестве ответа укажите максимальную длину найденной последовательности.","file":"https://kompege.ru/files/RokRTByXG.txt"},{"id":439,"lvl":"С","src":"Джобс 05.10.2020","blk":"B6","sub":"F8","subn":"Подсчёт максимальных серий длины k","st":"main","q":"Текстовый файл состоит не более чем из 106 десятичных цифр. Восходящей последовательностью называется последовательность цифр, в которой каждая цифра меньше следующей за ней. Например, в последовательности 7238903278 три таких последовательности – 2389, 03 и 278. Длиной последовательности называется количество входящих в нее цифр.\n\nОпределите сколько в файле восходящих последовательностей длиной 5, не входящих в восходящие последовательности большей длины.","file":"https://kompege.ru/files/y5WA0PDm_.txt"},{"id":414,"lvl":"Б","src":"","blk":"B1","sub":"A4","subn":"Вхождение с ограничением контекста","st":"main","q":"Текстовый файл состоит не более чем из 106 символов R, U, S, T, E, M. Сколько раз встречается комбинация «RUS», не являющаяся при это частью комбинации «RUSTEM».","file":"https://kompege.ru/files/SwanhjHcH.txt"},{"id":324,"lvl":"С","src":"","blk":"B4","sub":"D2","subn":"Серия символов из набора / без набора","st":"arch","q":"(П.Е. Фин pege.ru/files/qT_4G_9te.txt"},{"id":66,"lvl":"Б","src":"Джобс 31.08.2020","blk":"B7","sub":"H2","subn":"Тройки из списка","st":"arch","q":"Текстовый файл состоит не более чем из 106 латинских символов К, О, Т. Определите максимальное количество подряд идущих комбинаций КОТ.","file":"https://kompege.ru/files/JlReI6dVB.txt"},{"id":21,"lvl":"Б","src":"Демоверсия 2021","blk":"B6","sub":"F4","subn":"Соседние символы различны","st":"main","q":"Текстовый файл состоит не более чем из 106 символов X, Y и Z.  \nОпределите максимальное количество идущих подряд символов, среди которых каждые два соседних различны.","file":"https://kompege.ru/files/RmJqoDK9H.txt"}],"teacherBank":[{"lab":"2250к","kid":2250,"ans":"53","sub":"K1","note":""},{"lab":"2426к","kid":2426,"ans":"15","sub":"D2","note":""},{"lab":"1428к","kid":1428,"ans":"85","sub":"E2","note":""},{"lab":"7223к","kid":null,"ans":"18","sub":"K2","note":"нет в выгрузке Kompege: окно без повторяющихся букв (множество)"},{"lab":"9753п","kid":9753,"ans":"244","sub":"K1","note":"«п» — вероятно, номер К. Полякова; текст совпадает с Kompege 9753"},{"lab":"12476п","kid":12476,"ans":"814","sub":"L2","note":""},{"lab":"2715п","kid":474,"ans":"18","sub":"F7","note":"текст совпадает с Kompege 474, а не 2715 — номер расходится"},{"lab":"7203п","kid":null,"ans":"30","sub":"K2","note":"нет в выгрузке Kompege: S, U, N не более 10, X и Y нет"},{"lab":"5152п","kid":3763,"ans":"252776","sub":"N1","note":"текст совпадает с Kompege 3763"},{"lab":"9169","kid":9169,"ans":"","sub":"M2","note":""},{"lab":"3763","kid":3763,"ans":"","sub":"N1","note":""},{"lab":"12476 (3 раза)","kid":null,"ans":"","sub":"L2","note":"вариант 12476 с «ровно 3» — учебная модификация"},{"lab":"7981","kid":7981,"ans":"","sub":"N2","note":""},{"lab":"7853","kid":7853,"ans":"","sub":"F3","note":""},{"lab":"5381","kid":5381,"ans":"","sub":"L2","note":""},{"lab":"2552 РЕГУЛЯРКИ","kid":861,"ans":"","sub":"A2","note":"SOCKCOS"},{"lab":"865","kid":865,"ans":"","sub":"D2","note":""},{"lab":"2420","kid":2420,"ans":"","sub":"D2","note":""},{"lab":"2421","kid":2421,"ans":"","sub":"D2","note":""},{"lab":"2426 (re)","kid":2426,"ans":"","sub":"D2","note":""},{"lab":"279","kid":279,"ans":"","sub":"A4","note":""},{"lab":"836","kid":836,"ans":"","sub":"A7","note":""},{"lab":"2500","kid":2500,"ans":"","sub":"A5","note":""},{"lab":"2504","kid":2504,"ans":"","sub":"C3","note":""},{"lab":"1428 (re)","kid":1428,"ans":"","sub":"E2","note":""},{"lab":"1975","kid":1975,"ans":"","sub":"E1","note":""},{"lab":"вариант 4-2024 (DFFD)","kid":null,"ans":"","sub":"E3","note":"нет в выгрузке Kompege: без подстроки DFFD"},{"lab":"4642","kid":4642,"ans":"","sub":"H3","note":""},{"lab":"4555","kid":4555,"ans":"","sub":"J1","note":""}]}</script>

<script>/* ===== Памятка: карточки по блокам. code — можно открыть в песочнице ===== */
const MEMO={
 B1:[
  {t:'count и in',x:'s.count(w) — сколько раз w встречается в s <b>без перекрытий</b>. w in s — есть ли вхождение вообще.',code:"s='ABABA'\nprint(s.count('ABA'))\nprint('BAB' in s)",err:'count не видит перекрытий: в ABABA слово ABA он найдёт один раз, а вхождений два.'},
  {t:'Перекрытия: цикл по позициям',x:'Проверяем каждую стартовую позицию i: совпадает ли кусок s[i:i+len(w)] со словом.',code:"s='ABABABA'\nw='ABA'\nk=0\nfor i in range(len(s)):\n    if s[i:i+len(w)]==w:\n        k+=1\nprint(k)",err:'range(len(s)-len(w)) теряет последнее вхождение: правильно range(len(s)-len(w)+1) или просто range(len(s)).'},
  {t:'find с позицией',x:'s.find(w, p) ищет w начиная с позиции p и возвращает индекс или −1. В цикле получаем все позиции.',code:"s='XYZXYXY'\np=s.find('XY')\nwhile p!=-1:\n    print(p)\n    p=s.find('XY',p+1)",err:'p=s.find(w,p) без +1 — бесконечный цикл на одном и том же вхождении.'},
  {t:'findall и просмотр вперёд',x:'findall(pat, s) — список всех совпадений слева направо без перекрытий. (?=(pat)) не «съедает» символы, поэтому находит перекрывающиеся совпадения. (?!...) — «после этого места НЕ стоит …».',code:"from re import *\ns='SOCKCOSOCKCOS'\nprint(len(findall('SOCKCOS',s)))\nprint(len(findall('(?=(SOCKCOS))',s)))\nprint(findall('RUS(?!TEM)','RUSTEMRUSRUST'))",err:'Шаблон [^J]BOSS[^J] «съедает» соседний символ: у BOSSBOSS вторая комбинация теряется.'},
 ],
 B2:[
  {t:'Строки файла',x:'Дома: for line in open("24.txt"): line=line.strip(). В тренажёре строки записаны через пробел — s.split().',code:"s='AOAOA OAOAO AOAXAOA'\nk=0\nfor line in s.split():\n    print(line, line.count('A'))\n    k+=1\nprint(k)",err:'Без strip() в конце строки остаётся \\n — длины и сравнения ломаются.'},
  {t:'Подпоследовательность (не подряд)',x:'Указатель j идёт по слову: если очередная буква строки совпала с word[j], сдвигаем j. Если j дошёл до конца слова — слово «вычёркивается» из строки.',code:"line='Q6W6EHRHTHYR'\nj=0\nfor c in line:\n    if j<6 and c=='QWERTY'[j]:\n        j+=1\nprint(j==6)",err:'Подпоследовательность ≠ подстрока: «QWERTY» in line проверяет только подряд идущие буквы.'},
 ],
 B3:[
  {t:'Частотный словарь',x:'d[c]=d.get(c,0)+1 — счётчик для каждого символа. Самый частый: max(d.values()), затем выбираем символ по правилу.',code:"s='CCBAABABCBC'\nd={}\nfor c in s:\n    d[c]=d.get(c,0)+1\nprint(d)\nm=max(d.values())\nprint(min(c for c in d if d[c]==m), m)",err:'max(d) сравнивает ключи (буквы), а не количества.'},
  {t:'Сортировка пар (количество, буква)',x:'Стиль «в одну строку»: l=[(s.count(c), c) for c in set(s)]. Для «раньше по алфавиту при равенстве» удобно сортировать (−количество, буква).',code:"s='CCBAABABCBC'\nl=sorted([(-s.count(c), c) for c in set(s)])\nprint(l)\nprint(l[0][1]+str(-l[0][0]))",err:'max(l) при равенстве количеств выберет букву, которая ПОЗЖЕ по алфавиту.'},
 ],
 B4:[
  {t:'Серия из набора: [ABC]+, [^D]+',x:'[ABC] — один символ из набора, [^D] — любой, кроме D, + — один или больше подряд. findall возвращает все серии, max(l, key=len) — самую длинную.',code:"from re import *\ns='ABEFCABEBEFADD'\nl=findall('[ABEF]+',s)\nprint(l, len(max(l,key=len)))",err:'max(l) без key=len берёт строку, которая больше по алфавиту, а не самую длинную.'},
  {t:'Один проход: k и mx',x:'k — длина текущей серии, mx — лучшая. Символ подходит — k+=1, иначе k начинается заново.',code:"s='AABBBAB'\nk=mx=1\nfor i in range(1,len(s)):\n    if s[i]==s[i-1]: k+=1\n    else: k=1\n    mx=max(mx,k)\nprint(mx)",err:'Обновлять mx только в else — потерять серию в конце строки.'},
  {t:'Одинаковые подряд: (.)\\2*',x:'Группа (.) ловит символ, \\2 — «тот же символ ещё раз» (номер 2, потому что внешняя группа — номер 1).',code:"from re import *\ns='FAILLFFAIIIA'\nl=[c[0] for c in findall(r'((.)\\2*)',s)]\nprint(l)",err:'findall с группами возвращает кортежи: берём c[0].'},

const WORKER_SRC = `
let py=null;
self.onmessage=async(e)=>{
  const {id,code,trace,limit,runner}=e.data;
  try{
    if(!py){
      self.postMessage({id,status:'Загружаю Python (один раз, ~10 с)…'});
      importScripts('https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js');
      py=await loadPyodide();
    }
    py.globals.set('_CODE',code);py.globals.set('_TRACE',!!trace);py.globals.set('_LIM',limit||3000);

};`;
const PY = {
  w: null, seq: 0, pend: {}, ready: false, timer: null,

    if (this.w) return;
    const url = URL.createObjectURL(new Blob([WORKER_SRC], {type: 'text/javascript'}));
    this.w = new Worker(url);
    this.w.onmessage = e => {
      const m = e.data, p = this.pend[m.id];
      if (!p) return;
      if (m.status) { p.onStatus && p.onStatus(m.status); return; }
      clearTimeout(p.to); delete this.pend[m.id];
      this.ready = true;
      if (m.fatal) p.res({ok: false, err: m.fatal, fatal: true, out: '', steps: []});
      else { try { p.res(JSON.parse(m.result)); } catch (er) { p.res({ok: false, err: 'Ошибка разбора результата', out: '', steps: []}); } }

  },
  kill() { if (this.w) { this.w.terminate(); this.w = null; this.ready = false; } Object.values(this.pend).forEach(p => { clearTimeout(p.to); p.res({ok: false, err: 'Выполнение остановлено', stopped: true, out: '', steps: []}); }); this.pend = {}; },

      }, ms);
      this.pend[id] = {res, to, onStatus: opt.onStatus};

/* ===== Редактор Python: подсветка, отступы, пропуски ___, строка трассы ===== */
const PY_KW = /\b(from|import|for|in|while|if|elif|else|break|continue|def|return|and|or|not|True|False|None|print|len|range|max|min|sorted|set|sum|int|str|list|dict|all|any|lambda|try|except|global|enumerate|abs|ord|chr|type)\b/g;
function hlPy(src) {
  return src.split('\n').map(line => {
    let out = '', i = 0;
    while (i < line.length) {
      const c = line[i];
      if (c === '#') { out += '<span class="hc">' + esc(line.slice(i)) + '</span>'; break; }
      if (c === "'" || c === '"') {
        let j = i + 1;
        while (j < line.length && line[j] !== c) { if (line[j] === '\\') j++; j++; }
        out += '<span class="hs">' + esc(line.slice(i, j + 1)) + '</span>'; i = j + 1; continue;
      }
      if (line.startsWith('___', i)) { out += '<span class="hb">___</span>'; i += 3; continue; }
      let m = /^[A-Za-z_]\w*/.exec(line.slice(i));
      if (m) { const w = m[0]; out += PY_KW.test(w) ? '<span class="hk">' + w + '</span>' : esc(w); PY_KW.lastIndex = 0; i += w.length; continue; }
      m = /^\d+/.exec(line.slice(i));
      if (m) { out += '<span class="hn">' + m[0] + '</span>'; i += m[0].length; continue; }
      out += esc(c); i++;
    }
    return out;
  }).join('\n');
}

function drawViz(q, s0, snap, prev, r, viz, code, best) {

  const ints = k => Number.isInteger(v[k]);

  let hl = false;
  if (typeof v.ss === 'string' && v.ss && ints('i') && s.substr(v.i, v.ss.length) === v.ss) { mark(v.i, v.i + v.ss.length, 'hl'); hl = true; }

  const arrs = Object.entries(v).filter(([k, x]) => Array.isArray(x) && n > 0 && x.length >= n && x.length <= n + 12 && x.every(y => typeof y === 'number'));
  if (arrs.length && /PREFIX/.test(viz || '')) arrs.forEach(([, x]) => { for (let k = 0; k < Math.min(n, cls.length); k++) if (x[k] > (k ? x[k - 1] : 0)) cls[k].push('hl2'); });
  const cell = k => { const c = k < n ? s[k] : ''; const ps = ptr[k] || [];
    return `<div class="cell ${cls[k] ? cls[k].join(' ') : ''} ${c === ' ' ? 'sp' : ''}">${ps.map((p, z) => `<span class="ptr ${p === 'j' || p === 'r' ? 'p2' : p === 'i' || p === 'l' ? '' : 'p3'} ${z ? 'stack' : ''}">${p}</span>`).join('')}<b>${c === ' ' ? '␣' : esc(c) || '&nbsp;'}</b><small>${k}</small>${arrs.map(([, x]) => `<em class="${x[k] > (k ? x[k - 1] : 0) ? 'up' : ''}">${x[k]}</em>`).join('')}</div>`; };
  let h = ''; for (let k = 0; k < Math.min(n, MAX); k++) h += cell(k);
  if (n > MAX) h += `<div class="cell"><b>…</b><small>${n}</small></div>`;
  else if (ptr[n]) h += `<div class="cell" style="opacity:.7">${ptr[n].map((p, z) => `<span class="ptr ${p === 'j' || p === 'r' ? 'p2' : 'p3'} ${z ? 'stack' : ''}">${p}</span>`).join('')}<b>|</b><small>${n}</small></div>`;
  q('[data-r="strip"]').innerHTML = h;

  // список совпадений
  q('[data-r="rxbox"]').innerHTML = spans && spans.length ? `<div class="vhint">Совпадения шаблона (${spans.length}):</div><div class="rxl">${spans.slice(0, 60).map(sp => `<span>${esc(s.slice(sp[0], sp[1]))}</span>`).join('')}</div>` : '';
  // переменные

  q('[data-r="vars"]').innerHTML = vs.length ? vs.map(([k, x]) => { const ch = prev && JSON.stringify(prev[k]) !== JSON.stringify(x); let t = fmtVal(x); if (t.length > 90) t = t.slice(0, 88) + '…'; return `<span class="var ${ch ? 'ch' : ''}" title="${esc(fmtVal(x))}"><b>${esc(k)}</b> = ${esc(t)}</span>`; }).join('') : (snap ? '<span class="vhint">переменных пока нет</span>' : '');

  vs.forEach(([k, x]) => { if (x && typeof x === 'object' && !Array.isArray(x)) { const e = Object.entries(x).filter(([, y]) => typeof y === 'number'); if (e.length && e.length <= 40) { const mx = Math.max(1, ...e.map(z => Math.abs(z[1]))); ex += `<div class="vhint">словарь ${esc(k)}</div><div class="bars">${e.map(([a, y]) => `<div><span>${y}</span><i style="height:${Math.max(3, Math.abs(y) / mx * 60)}px"></i><span>${esc(a)}</span></div>`).join('')}</div>`; } } });

}

/* ===== Генераторы строк ===== */
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

  let order; do { order = [0, 1, 2, 3].sort(() => Math.random() - .5); } while (order.join() === '0,1,2,3');

/* ===== Лаборатория регулярных выражений ===== */
const RX_TOK = [
  [/^\(\?=/, '(?=…)', 'просмотр вперёд: проверяет, не «съедая» символы — так находятся перекрывающиеся вхождения'],
  [/^\(\?!/, '(?!…)', 'запрет впереди: дальше НЕ должно идти …'],
  [/^\(\?:/, '(?:…)', 'группа без запоминания: для | и повторов +, *'],
  [/^\(\?P<\w+>/, '(?P<имя>…)', 'именованная группа'],
  [/^\(/, '(…)', 'группа: findall вернёт её содержимое'],
  [/^\)/, ')', 'конец группы'],
  [/^\[\^[^\]]*\]/, null, 'любой символ, КРОМЕ перечисленных'],
  [/^\[[^\]]*\]/, null, 'один символ из перечисленных (A-Z — диапазон)'],
  [/^\\d/, '\\d', 'цифра 0–9'], [/^\\w/, '\\w', 'буква, цифра или _'], [/^\\s/, '\\s', 'пробельный символ'],
  [/^\\./, null, 'экранированный символ — берётся буквально'],
  [/^\{\d+,\d*\}/, null, 'повтор от m до n раз'], [/^\{\d+\}/, null, 'повтор ровно n раз'],
  [/^\+\?/, '+?', 'ленивый «один или больше» — как можно меньше'], [/^\*\?/, '*?', 'ленивый «ноль или больше»'],
  [/^\+/, '+', 'один или больше раз (жадно — как можно больше)'], [/^\*/, '*', 'ноль или больше раз'], [/^\?/, '?', 'необязательно (0 или 1 раз)'],
  [/^\|/, '|', 'ИЛИ: левый вариант или правый'], [/^\./, '.', 'любой символ'], [/^\^/, '^', 'начало строки'], [/^\$/, '$', 'конец строки'],
  [/^[^()[\]\\{}+*?|.^$]+/, null, 'обычные символы — ищутся как есть']];
function rxTokens(p) {
  const out = []; let i = 0, g = 0;
  while (i < p.length && g++ < 200) { const rest = p.slice(i); const t = RX_TOK.find(([re]) => re.test(rest)); if (!t) { out.push([rest[0], '']); i++; continue; } const m = t[0].exec(rest)[0]; out.push([m, t[2]]); i += m.length; }
  return out;
}
const RX_PRE = [
  ['Перекрывающиеся вхождения', '(?=(AA))', 'AAAABAAAB'], ['Самая длинная серия A', 'A+', 'BAAABAAAAABA'],
  ['Цепочки XY…', '(?:XY)+', 'XYXYZXYXYXYX'], ['Буквы без «запрещённой» пары', '(?:(?!AB).)+', 'CAABBCABCAAB'],
  ['Числа без ведущих нулей', '(?:0|[1-9][0-9]*)', '0012309007'], ['Выражение a+b*c', '\\d+(?:[+*]\\d+)+', '1+23*4++5*6'],
  ['Гласная-согласная', '[AEIOU][^AEIOU]', 'BAKETORIUM'], ['Между двумя A', 'A[^A]*A', 'XAXYAZZAQA']];
function regexLab() {
  modal(`<div class="row" style="justify-content:space-between"><h2 style="margin:0">🔤 Лаборатория регулярных выражений</h2><button class="btn ghost" onclick="closeModal()">✕</button></div>
   <div class="mtabs" style="margin-top:10px">${RX_PRE.map((p, k) => `<button data-p="${k}">${esc(p[0])}</button>`).join('')}</div>
   <div class="lab2"><div><div class="vhint">шаблон pat (как в Python, без r'')</div><input class="inp mono" id="rxP" style="width:100%;font-size:17px" value="(?=(AA))">

   <div class="hcard" style="margin-top:10px">В Python: <code class="mono">from re import *</code> · <code class="mono">findall(pat, s)</code> — список всех совпадений (или содержимого группы) · <code class="mono">max(findall(pat, s), key=len)</code> — самое длинное · <code class="mono">fullmatch(pat, ss)</code> — подходит ли подстрока целиком.</div>
   <div class="row" style="margin-top:8px"><button class="btn sm" id="rxPy">▶ Открыть как код Python</button></div></div></div>`, 'full');

/* ===== Лаборатория префиксных сумм ===== */
function prefixLab() {
  modal(`<div class="row" style="justify-content:space-between"><h2 style="margin:0">∑ Префиксные суммы на строке</h2><button class="btn ghost" onclick="closeModal()">✕</button></div>
   <p class="vhint">p[k] — сколько вхождений шаблона <b>заканчивается</b> на позициях 0…k. Кликни по двум клеткам строки — начало i и конец j−1 подстроки s[i:j].</p>
   <div class="row"><span>s =</span><input class="inp mono" id="pS" style="flex:1;min-width:240px" value="FATBADROFATNOTBADFAT"><span>шаблоны (через запятую):</span><input class="inp mono" id="pW" style="width:180px" value="FAT,BAD"></div>
   <div style="overflow-x:auto;margin-top:12px"><table class="ptab" id="pT"></table></div><div id="pInfo" style="margin-top:10px"></div>`, 'full');
  let a = null, b = null;
  const upd = () => {
    const s = $('#pS').value, W = $('#pW').value.split(',').map(x => x.trim()).filter(Boolean), d = W.length ? W[0].length : 1;
    const same = W.every(w => w.length === d);
    const p = [], hit = []; let c = 0;
    for (let k = 0; k < s.length; k++) { const h = k + 1 >= d && W.includes(s.slice(k + 1 - d, k + 1)); hit.push(h); if (h) c++; p.push(c); }
    const sel = k => a != null && b != null && k >= a && k <= b;
    $('#pT').innerHTML = `<tr><td class="h">k</td>${[...s].map((_, k) => `<td class="h">${k}</td>`).join('')}</tr><tr><td class="h">s</td>${[...s].map((ch, k) => `<td data-k="${k}" class="${sel(k) ? 'sel' : ''} ${hit[k] ? 'm' : ''}">${esc(ch)}</td>`).join('')}</tr><tr><td class="h">p</td>${p.map((x, k) => `<td class="h ${a != null && b != null && (k === b || k === a + d - 2) ? 'edge' : ''}">${x}</td>`).join('')}</tr>`;
    document.querySelectorAll('#pT td[data-k]').forEach(td => td.onclick = () => { const k = +td.dataset.k; if (a == null || b != null) { a = k; b = null; } else { if (k < a) { b = a; a = k; } else b = k; } upd(); });
    let info = `<div class="vhint">Зелёным — позиции, где <b>заканчивается</b> шаблон длины d = ${d}.${same ? '' : ' ⚠ Шаблоны разной длины — формула ниже верна только для одинаковой длины.'}</div>`;
    if (a != null && b != null) {
      const i = a, j = b + 1, sub = s.slice(i, j);
      const brute = (() => { let n = 0; for (let k = 0; k + d <= sub.length; k++) if (W.includes(sub.slice(k, k + d))) n++; return n; })();
      const left = i + d - 2, pl = left >= 0 ? p[left] : 0, f = j - i >= d ? p[j - 1] - pl : 0;
      info += `<div class="hcard" style="margin-top:8px"><b>s[${i}:${j}] = <span class="mono">${esc(sub)}</span></b><br>
       Шаблон целиком внутри подстроки, если он <b>заканчивается</b> на позиции от i+d−1 = ${i + d - 1} до j−1 = ${j - 1}.<br>
       Число = p[j−1] − p[i+d−2] = p[${j - 1}] − ${left >= 0 ? 'p[' + left + ']' : '0 (индекс ' + left + ' < 0 — вычитать нечего)'} = ${p[j - 1]} − ${pl} = <b>${f}</b>
       ${j - i < d ? '<br>Подстрока короче шаблона — вхождений 0.' : ''}<br>Проверка перебором: <b>${brute}</b> ${brute === f ? '✅' : '❌'}<br>
       <span class="vhint">Частая ошибка: при i = 0 и d = 1 индекс i+d−2 = −1, а p[−1] в Python — это ПОСЛЕДНИЙ элемент массива! Нужна проверка «if i+d−2 >= 0».</span></div>`;
    }
    $('#pInfo').innerHTML = info;
  };
  $('#pS').oninput = () => { a = b = null; upd(); }; $('#pW').oninput = upd; upd();
}

function repRows(s) {

  return L.map(id => { const it = item(id, s); const x = normRec(Object.assign({}, s.tasks[id] || {})); return {id, it, x, st: x.st, extra: !vis(s).includes(id)}; }).filter(r => r.it);
}
function hintStr(r) { const x = r.x, h = []; if (x.hint >= 1) h.push('идея'); if (x.bl) h.push('пропуски ' + x.bl); if (x.hint >= 3) h.push('эталон'); if (x.memo) h.push('памятка'); return h.join(', '); }
function blockOf(r) { return r.it.kind === 'warm' ? r.it.w.blk : r.it.kind === 'arch' ? r.it.a.blk : r.it.t.blk; }
function calcReport(name) {
  const s = DB.students[name], rows = repRows(s), c = counts(s);
  const byBlk = DATA.blocks.map(b => { const rs = rows.filter(r => blockOf(r) === b.id && !r.extra); if (!rs.length) return null; return {b, total: rs.length, done: rs.filter(r => solved(r.x)).length, self: rs.filter(r => r.st === 'ok' || r.st === 'err').length, help: rs.filter(r => r.st === 'hint' || r.st === 'sol').length, wrong: rs.reduce((a, r) => a + r.x.wrong.length, 0)}; }).filter(Boolean);

  return {s, c, rows, byBlk, wrongTotal, reals, extra: rows.filter(r => r.extra && solved(r.x)).length, scratch: rows.filter(r => r.x.scratch && solved(r.x)).length};
}

function pdfFromJpegs(imgs, w, h) {
  const enc = new TextEncoder(), parts = [], offs = []; let len = 0;

  const obj = (id, body) => { offs[id] = len; add(id + ' 0 obj\n'); body(); add('\nendobj\n'); };
  obj(1, () => add('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => add(`<< /Type /Pages /Count ${n} /Kids [${imgs.map((_, i) => (3 + i * 3) + ' 0 R').join(' ')}] >>`));
  imgs.forEach((im, i) => { const p = 3 + i * 3, c = p + 1, x = p + 2;
    obj(p, () => add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im${i} ${x} 0 R >> >> /Contents ${c} 0 R >>`));
    const cs = `q ${PW} 0 0 ${PH} 0 0 cm /Im${i} Do Q`;
    obj(c, () => add(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(x, () => { add(`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.length} >>\nstream\n`); add(im); add('\nendstream'); });
  });
  const total = 3 + n * 3, xref = len;
  let x = `xref\n0 ${total}\n0000000000 65535 f \n`; for (let i = 1; i < total; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
  add(x); add(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts, {type: 'application/pdf'});
}
