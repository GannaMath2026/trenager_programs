<style>

.vcode .ln{display:block;padding:0 6px;border-radius:4px}
.vcode .hl{background:#2a3a7a}.vcode .hg{background:#1d5a37}.vcode .hr{background:#6a2326}.vcode .hy{background:#6b5a14}

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const PIN='1234';           /* PIN учителя — поменяйте здесь */
const KEY='e24_methods_v1';

/* ---------- учебная строка 50 символов ---------- */
function mkStr(){let x=2024,r='';for(let i=0;i<50;i++){x=(Math.imul(x,1103515245)+12345)&0x7fffffff;r+='ABC'[(x>>16)%3];}return r;}
const S=mkStr();

/* ---------- эталонные функции (для вычисления ответа) ---------- */
const cnt=(x,c)=>x.split(c).length-1;
function longest(s,f){let b=0;for(let i=0;i<s.length;i++)for(let j=i+1;j<=s.length;j++)if(j-i>b&&f(s.slice(i,j)))b=j-i;return b;}
function howmany(s,f){let b=0;for(let i=0;i<s.length;i++)for(let j=i+1;j<=s.length;j++)if(f(s.slice(i,j)))b++;return b;}
const chg=x=>{let c=0;for(let k=1;k<x.length;k++)if(x[k]!=x[k-1])c++;return c;};
const wsum=x=>[...x].reduce((a,c)=>a+'ABC'.indexOf(c)+1,0);
const allP=(x,f)=>{for(let k=0;k<x.length-1;k++)if(!f(x[k],x[k+1]))return false;return true;};

const BL={
 A:{n:'✂️ replace + split',color:'#4f6bff'},
 B:{n:'🔁 Перебор: два цикла + break',color:'#e0a020'},
 C:{n:'📊 Префиксные суммы',color:'#2fbf71'}
};
const HEAD="s=open('24.txt').read()\n";
const T=[
/* ===== A: replace + split ===== */
{id:'A1',blk:'A',role:'proto',pair:'A2',lvl:1,title:'Без буквы C',
 text:'Текстовый файл состоит из символов A, B и C. Определите длину самой длинной подстроки, <b>не содержащей букву C</b>.',
 code:HEAD+"dl=0\nfor x in [[1]]:\n    dl=max(dl,[[2]])\nprint(dl)\n",
 blanks:[{acc:["s.split('C')"]},{acc:['len(x)']}],
 hints:['Буква C — «разделитель». Если разрезать строку по C, подстроки без C станут отдельными кусками.','1) s.split(...) с буквой C; 2) для каждого куска x нужна его длина.'],
 idea:'<b>Идея.</b> Запрещённый символ — это «забор». Режем по нему: между заборами остаются куски, где его нет. Ищем самый длинный кусок.',
 ref:s=>longest(s,x=>!x.includes('C'))},
{id:'A2',blk:'A',role:'analog',pair:'A1',lvl:2,title:'Только из букв B',
 text:'Определите длину самой длинной подстроки, состоящей <b>только из букв B</b>.',
 code:HEAD+"[[1]]\ndl=0\nfor x in [[2]]:\n    dl=max(dl,len(x))\nprint(dl)\n",
 blanks:[{acc:["s=s.replace('A','C')"]},{acc:["s.split('C')"]}],
 hints:['«Не B» — это и A, и C. Сделайте из них один и тот же разделитель.','Замените все A на C (s=s.replace(...)), потом режьте по C.'],
 idea:'<b>Идея.</b> Два «забора» (A и C) сводим к одному: A→C. После этого split по C даёт куски из одних B.',
 ref:s=>longest(s,x=>/^B+$/.test(x))},
{id:'A3',blk:'A',role:'proto',pair:'A4',lvl:3,title:'Нет соседних AB и BA',
 text:'Определите длину самой длинной подстроки, в которой <b>нет пар соседних символов AB и BA</b>.',
 code:HEAD+"s=s.replace('AB',[[1]])\ns=s.replace('BA',[[2]])\ndl=0\nfor x in [[3]]:\n    dl=max(dl,len(x))\nprint(dl)\n",
 blanks:[{acc:["'A B'"]},{acc:["'B A'"]},{acc:["s.split(' ')","s.split()"]}],
 hints:['Запрещена не буква, а ПАРА. Режем между её символами, ничего не удаляя.','AB → «A B»: пробел встаёт между A и B. Затем split по пробелу.'],
 idea:'<b>Идея.</b> Пару нельзя удалить (потеряем символы). Вставляем разрез <i>внутрь</i> пары: «AB» → «A B». Пара распадается, куски — допустимые подстроки.',
 ref:s=>longest(s,x=>!x.includes('AB')&&!x.includes('BA'))},
{id:'A4',blk:'A',role:'analog',pair:'A3',lvl:3,title:'Нет соседних AC и CA',
 text:'Определите длину самой длинной подстроки, в которой <b>нет пар соседних символов AC и CA</b>.',
 code:HEAD+"s=s.replace('AC',[[1]])\ns=s.replace('CA',[[2]])\ndl=0\nfor x in [[3]]:\n    dl=max(dl,len(x))\nprint(dl)\n",
 blanks:[{acc:["'A C'"]},{acc:["'C A'"]},{acc:["s.split(' ')","s.split()"]}],
 hints:['Тот же приём, что и в предыдущей паре, но с буквами A и C.','AC → «A C», CA → «C A», затем split по пробелу.'],
 idea:'<b>Идея.</b> Аналог предыдущей: меняются только буквы в паре. Разрез вставляем между ними.',
 ref:s=>longest(s,x=>!x.includes('AC')&&!x.includes('CA'))},
/* ===== B: перебор + break ===== */
{id:'B1',blk:'B',role:'proto',pair:'B2',lvl:2,title:'Не более 3 букв A',
 text:'Определите длину самой длинной подстроки, в которой <b>букв A не больше 3</b>.',
 code:HEAD+"l=len(s)\ndl=0\nfor i in range(l):\n    for j in range(i+1,l+1):\n        ss=s[i:j]\n        if [[1]]:\n            break\n        dl=max(dl,[[2]])\nprint(dl)\n",
 blanks:[{acc:["ss.count('A')>3"]},{acc:['len(ss)','j-i']}],
 hints:['Подстрока растёт вправо (j увеличивается). Как только условие нарушено — дальше будет только хуже.','В if записываем НАРУШЕНИЕ условия: A больше 3.'],
 idea:'<b>Идея.</b> Для каждого начала i растим конец j. Пока условие верно — обновляем ответ. Нарушилось — break: у более длинных подстрок с тем же началом условие тоже нарушено (счётчик не убывает).',
 ref:s=>longest(s,x=>cnt(x,'A')<=3)},
{id:'B2',blk:'B',role:'analog',pair:'B1',lvl:2,title:'A и B вместе не более 4',
 text:'Определите длину самой длинной подстроки, в которой <b>букв A и B вместе не больше 4</b>.',
 code:HEAD+"l=len(s)\ndl=0\nfor i in range(l):\n    for j in range(i+1,l+1):\n        ss=s[i:j]\n        if [[1]]:\n            break\n        dl=max(dl,[[2]])\nprint(dl)\n",
 blanks:[{acc:["ss.count('A')+ss.count('B')>4"]},{acc:['len(ss)','j-i']}],
 hints:['Количество A и B складываем.','ss.count(...)+ss.count(...) и сравниваем с 4 (нарушение — «больше»).'],
 idea:'<b>Идея.</b> Как B1, но счётчик — сумма двух букв. Он по-прежнему не убывает при росте j, значит break применим.',
 ref:s=>longest(s,x=>cnt(x,'A')+cnt(x,'B')<=4)},
{id:'B3',blk:'B',role:'proto',pair:'B4',lvl:3,title:'Соседние символы различны',
 text:'Определите длину самой длинной подстроки, в которой <b>любые два соседних символа различны</b>.',
 code:HEAD+"l=len(s)\ndl=0\nfor i in range(l):\n    for j in range(i+1,l+1):\n        ss=s[i:j]\n        if [[1]]:\n            break\n        dl=max(dl,len(ss))\nprint(dl)\n",
 blanks:[{acc:['not all(ss[k]!=ss[k+1] for k in range(len(ss)-1))','any(ss[k]==ss[k+1] for k in range(len(ss)-1))']}],
 hints:['Условие «все соседи различны» — это all(...). Нам нужно его нарушение.','not all(...) или any(ss[k]==ss[k+1] ...).'],
 idea:'<b>Идея.</b> Если в ss уже появилась пара одинаковых соседей, она останется в любой более длинной подстроке с тем же началом — можно прерывать цикл.',
 ref:s=>longest(s,x=>allP(x,(a,b)=>a!=b))},
{id:'B4',blk:'B',role:'analog',pair:'B3',lvl:3,title:'Буквы не убывают',
 text:'Определите длину самой длинной подстроки, в которой <b>символы идут в алфавитном порядке (не убывают)</b>.',
 code:HEAD+"l=len(s)\ndl=0\nfor i in range(l):\n    for j in range(i+1,l+1):\n        ss=s[i:j]\n        if [[1]]:\n            break\n        dl=max(dl,len(ss))\nprint(dl)\n",
 blanks:[{acc:['not all(ss[k]<=ss[k+1] for k in range(len(ss)-1))','any(ss[k]>ss[k+1] for k in range(len(ss)-1))']}],
 hints:['Нарушение порядка — когда какая-то пара «убывает».','not all(ss[k]<=ss[k+1] ...) или any(ss[k]>ss[k+1] ...).'],
 idea:'<b>Идея.</b> Аналог B3: меняется только условие на соседей. Нарушение порядка «живёт» и в более длинных подстроках.',
 ref:s=>longest(s,x=>allP(x,(a,b)=>a<=b))},
/* ===== C: префиксные суммы ===== */
{id:'C1',blk:'C',role:'proto',pair:'C2',lvl:1,title:'Ровно 5 букв A (длина)',
 text:'Определите длину самой длинной подстроки, в которой <b>ровно 5 букв A</b>.',
 code:HEAD+"n=len(s)\np=[0]\nfor c in s:\n    p.append(p[-1]+[[1]])\ndl=0\nfor i in range(n):\n    for j in range(i+1,n+1):\n        v=[[2]]\n        if v>5:\n            break\n        if v==5:\n            dl=max(dl,j-i)\nprint(dl)\n",
 blanks:[{acc:["(c=='A')","int(c=='A')","1 if c=='A' else 0"]},{acc:['p[j]-p[i]']}],
 hints:['p[k] — сколько букв A среди первых k символов. На каждом шаге к p[-1] добавляется 1, если очередной символ — A, иначе 0.','v=p[j]-p[i]: из «A в первых j» вычитаем «A в первых i».'],
 idea:'<b>p[k]</b> = число A среди s[0..k−1] (первые k символов), p[0]=0.<br><b>Добавляем:</b> p[k+1] = p[k] + <code>(s[k]==\'A\')</code> → 1 для A, 0 для остальных.<br><b>Отрезок</b> s[i..j−1]: <code>v = p[j] − p[i]</code>. p[j] включает всё до границы j, p[i] — всё левее отрезка. Разность — только отрезок.',
 ref:s=>longest(s,x=>cnt(x,'A')==5)},
{id:'C2',blk:'C',role:'analog',pair:'C1',lvl:2,title:'Поровну A и B (длина)',
 text:'Определите длину самой длинной подстроки, в которой <b>букв A и B поровну</b>.',
 code:HEAD+"n=len(s)\np=[0]\nfor c in s:\n    p.append(p[-1]+[[1]])\ndl=0\nfor i in range(n):\n    for j in range(i+1,n+1):\n        v=[[2]]\n        if v==0:\n            dl=max(dl,j-i)\nprint(dl)\n",
 blanks:[{acc:["(c=='A')-(c=='B')","int(c=='A')-int(c=='B')","1 if c=='A' else -1 if c=='B' else 0"]},{acc:['p[j]-p[i]']}],

};
const V={rule:'a',s:S,tab:0,step:0,i:3,j:20,T:5,ev:[],e:-1,timer:null,speed:150};
const PP=()=>{const R=RULES[V.rule],p=[0];for(let k=0;k<V.s.length;k++)p.push(p[k]+R.f(V.s,k));return p;};
function openVis(){stopT();$('#mVis').classList.add('on');drawVis();}
$('#bVis').onclick=openVis;
function stopT(){if(V.timer){clearInterval(V.timer);V.timer=null;}}
function drawVis(){
 const opts=Object.keys(RULES).map(k=>`<option value="${k}" ${V.rule==k?'selected':''}>${RULES[k].name}</option>`).join('');
 $('#visBody').innerHTML=`<div class="vctl"><b>Что считаем:</b><select id="vR">${opts}</select>
 <b>Строка:</b><input type="text" id="vS" size="52" value="${V.s}"><button id="vSet">Применить</button><button id="vTask">↧ строка из задач</button></div>
 <div class="tabs">${['1️⃣ Строим p','2️⃣ Отрезок и формула','3️⃣ Поиск: два цикла + break'].map((x,i)=>`<button data-t="${i}" class="${V.tab==i?'on':''}">${x}</button>`).join('')}</div><div id="vT"></div>`;
 $('#vR').onchange=e=>{V.rule=e.target.value;V.T=RULES[V.rule].T;V.step=0;V.e=-1;stopT();drawVis();};
 $('#vSet').onclick=()=>{const x=$('#vS').value.toUpperCase().replace(/[^ABC]/g,'');if(x.length<3)return alert('Нужна строка из букв A, B, C (минимум 3)');V.s=x;V.step=0;V.e=-1;V.i=0;V.j=Math.min(5,x.length);stopT();drawVis();};
 $('#vTask').onclick=()=>{V.s=S;V.step=0;V.e=-1;V.i=3;V.j=20;stopT();drawVis();};
 $$('.tabs button').forEach(b=>b.onclick=()=>{V.tab=+b.dataset.t;stopT();drawVis();});
 [drawBuild,drawSeg,drawSearch][V.tab]();
}
const cellCls=(k,i,j,off)=>k<i+off?'neg':(k<j?'pos':'gry');
function drawBuild(){
 const R=RULES[V.rule],s=V.s,n=s.length,p=PP();let k=V.step-1,e;
 if(V.step==0)e=`<div class="fm">p[0] = 0</div>Пустой префикс — ни одного символа. Дальше на каждом шаге <b>p[k+1] = p[k] + вклад(s[k])</b>.`;
 else e=`<div class="fm">p[${k+1}] = p[${k}] + вклад(s[${k}]) = ${p[k]} + (${R.f(s,k)}) = <b>${p[k+1]}</b></div>
  <div><b>Откуда вклад:</b> ${esc(R.why(s,k))}</div><div class="role">В коде: <code>p.append(p[-1]+${esc(R.expr)})</code></div>`;
 let cols='';for(let q=0;q<n;q++){const d=q<V.step;cols+=`<div class="cell ${d?'done':''} ${q==k?'cur':''}"><i>${q}</i><b>${s[q]}</b><u>${d?(R.f(s,q)>=0?'+':'')+R.f(s,q):''}</u><em>${d?p[q+1]:''}</em></div>`;}
 $('#vT').innerHTML=`<div class="vctl"><button id="bb">◀</button><button id="bf" class="pri">Шаг ▶</button><button id="bp">▶ Авто</button><button id="be">⏭ До конца</button><button id="b0">⟲</button><span class="pill">p[0] = 0</span></div>
 <div class="role">В каждой колонке: индекс k · символ s[k] · <span style="color:#ffe27a">вклад (+)</span> · <span style="color:#8fd0ff">p[k+1]</span></div>
 <div class="cols">${cols}</div><div class="exp">${e}</div>
 <div class="exp"><b>Что хранит p[k]:</b> итог правила «${R.name}» для первых k символов (s[0..k−1]). Длина p = n+1, потому что p[0] — «ничего не взяли».</div>`;
 $('#bf').onclick=()=>{if(V.step<n)V.step++;drawBuild();};$('#bb').onclick=()=>{if(V.step>0)V.step--;drawBuild();};
 $('#be').onclick=()=>{V.step=n;drawBuild();};$('#b0').onclick=()=>{V.step=0;stopT();drawBuild();};
 $('#bp').onclick=()=>{stopT();V.timer=setInterval(()=>{if(V.step>=n){stopT();return;}V.step++;drawBuild();},250);};
}
function drawSeg(){
 const R=RULES[V.rule],s=V.s,n=s.length,p=PP();
 V.i=Math.max(0,Math.min(V.i,n-1));V.j=Math.max(V.i+1,Math.min(V.j,n));
 const i=V.i,j=V.j,off=R.off,v=p[j]-p[i+off],sub=s.slice(i,j),chk=R.sub(sub);
 let cols='';for(let q=0;q<n;q++)cols+=`<div class="cell ${cellCls(q,i,j,off)} ${(off&&q==i)?'skip':''}"><i>${q}</i><b>${s[q]}</b><em>${p[q+1]}</em></div>`;
 const why=off==0?
 `<b>p[j]=p[${j}]=${p[j]}</b> — итог по символам s[0..${j-1}] (всё до правой границы).<br><b>p[i]=p[${i}]=${p[i]}</b> — итог по s[0..${i-1}]: всё, что <u>левее</u> отрезка. Вычитаем этот «левый хвост» — остаётся ровно s[${i}..${j-1}].`:
 `<b>p[j]=p[${j}]=${p[j]}</b> — итог по вкладам позиций 0..${j-1}.<br>Вклад позиции k зависит от пары (s[k−1], s[k]). В отрезке s[${i}..${j-1}] полностью лежат пары с правой буквой в позициях ${i+1}..${j-1}. Пара (s[${i-1<0?'—':i-1}], s[${i}]) вылезает за левую границу — её <b>нельзя</b> считать.<br>Поэтому вычитаем <b>p[i+1]=p[${i+1}]=${p[i+1]}</b>: в нём уже учтены вклады 0..${i}, включая вклад позиции ${i}. 🟨 — символ, чей вклад не берём.`;
 $('#vT').innerHTML=`<div class="vctl">i = <input type="number" id="si" min="0" max="${n-1}" value="${i}" style="width:70px"> <input type="range" id="sir" min="0" max="${n-1}" value="${i}">
  j = <input type="number" id="sj" min="${i+1}" max="${n}" value="${j}" style="width:70px"> <input type="range" id="sjr" min="${i+1}" max="${n}" value="${j}"></div>
 <div class="role">Отрезок s[i..j−1] = «${sub}». <span style="color:#ef5b5b">🟥 вычитаем (левее)</span> · <span style="color:#2fbf71">🟩 остаётся</span> · 🟨 вклад не берём · серое — правее j. Нижнее число — p[k+1].</div>
 <div class="cols">${cols}</div>
 <div class="exp"><div class="fm">v = p[j] − p[${off?'i+1':'i'}] = ${p[j]} − ${p[i+off]} = <b>${v}</b></div><div>${why}</div></div>
 <div class="exp"><b>Проверка «в лоб»:</b> считаем правило «${R.name}» прямо по подстроке «${sub}» → <b>${chk}</b> ${chk==v?'✅ совпало':'❌ не совпало'}</div>`;
 const up=()=>{V.i=+$('#si').value;V.j=+$('#sj').value;drawSeg();};
 $('#si').onchange=up;$('#sj').onchange=up;$('#sir').oninput=e=>{V.i=+e.target.value;drawSeg();};$('#sjr').oninput=e=>{V.j=+e.target.value;drawSeg();};
}
function buildEv(){
 const R=RULES[V.rule],n=V.s.length,p=PP(),T=V.T,ev=[];let best=0;
 for(let i=0;i<n;i++)for(let j=i+1;j<=n;j++){
  const v=p[j]-p[i+R.off],brk=R.mono&&v>T,good=R.cond=='eq'?v==T:v<=T;
  const imp=!brk&&good&&j-i>best;if(imp)best=j-i;
  ev.push({i,j,v,brk,good:!brk&&good,imp,best});
  if(brk)break_i:{ /* остальные j для этого i пропускаем */
   break;}
  }
 return ev;
}
function genEv(){
 const R=RULES[V.rule],n=V.s.length,p=PP(),T=V.T,ev=[];let best=0;
 for(let i=0;i<n;i++){
  for(let j=i+1;j<=n;j++){
   const v=p[j]-p[i+R.off],brk=R.mono&&v>T,good=R.cond=='eq'?v==T:v<=T;
   const imp=!brk&&good&&j-i>best;if(imp)best=j-i;
   ev.push({i,j,v,brk,good:!brk&&good,imp,best});
   if(brk)break;
  }
 }
 return ev;
}
function drawSearch(){
 const R=RULES[V.rule],s=V.s,n=s.length;
 if(!V.ev.length||V.evKey!=V.rule+V.s+V.T){V.ev=genEv();V.evKey=V.rule+V.s+V.T;V.e=-1;}
 const e=V.ev[V.e],total=n*(n+1)/2,done=V.e+1,best=e?e.best:0;
 const pi=R.off?'p[j]-p[i+1]':'p[j]-p[i]',cmp=R.cond=='eq'?`v==${V.T}`:`v<=${V.T}`;
 const L=[
  ['for i in range(n):',e&&V.e>=0&&0],
  ['    for j in range(i+1,n+1):',0],
  [`        v=${pi}`,e?'hl':''],
  R.mono?[`        if v>${V.T}: break`,e?(e.brk?'hr':''):'']:null,
  [`        if ${cmp}: dl=max(dl,j-i)`,e?(e.imp?'hy':e.good?'hg':''):'']
 ].filter(Boolean);
 let cols='';
 for(let q=0;q<n;q++){let c='gry';if(e)c=cellCls(q,e.i,e.j,R.off);cols+=`<div class="cell ${c} ${(e&&R.off&&q==e.i)?'skip':''}"><i>${q}</i><b>${s[q]}</b></div>`;}
 let msg='Нажмите «Шаг» или «Авто».';
 if(e)msg=e.brk?`🟥 <b>v=${e.v} &gt; ${V.T}</b> → break: для начала i=${e.i} дальше v только растёт, остальные j пропускаем.`:
  e.imp?`🟨 <b>v=${e.v}</b>, условие выполнено, длина ${e.j-e.i} — <b>новый рекорд</b>!`:
  e.good?`🟩 <b>v=${e.v}</b>, условие выполнено, но длина ${e.j-e.i} ≤ рекорда ${e.best}.`:
  `⬜ <b>v=${e.v}</b>, условие не выполнено — идём дальше.`;
 $('#vT').innerHTML=`<div class="vctl"><button id="s1" class="pri">Шаг ▶</button><button id="s2">▶ Авто / ⏸</button><button id="s3">⏭ Следующий рекорд</button><button id="s4">⟲</button>
  Цель T = <input type="number" id="sT" value="${V.T}" style="width:70px"> Скорость <input type="range" id="sSp" min="20" max="600" value="${620-V.speed}"></div>
  <div class="stat"><span class="pill">i = ${e?e.i:'—'}</span><span class="pill">j = ${e?e.j:'—'}</span><span class="pill">v = ${e?e.v:'—'}</span><span class="pill">рекорд dl = ${best}</span><span class="pill">проверок: ${done} / ${total} без break</span><span class="pill">сэкономил break: ${total-V.ev.length} (всего в этом поиске ${V.ev.length})</span></div>
  <div class="cols">${cols}</div>
  <div class="vcode">${L.map(l=>`<span class="ln ${l[1]||''}">${esc(l[0])}</span>`).join('')}</div>
  <div class="exp">${msg}</div>`;
 const go=()=>{if(V.e<V.ev.length-1)V.e++;else stopT();drawSearch();};
 $('#s1').onclick=()=>{stopT();go();};
 $('#s2').onclick=()=>{if(V.timer){stopT();return;}V.timer=setInterval(go,V.speed);};
 $('#s3').onclick=()=>{stopT();let q=V.e+1;while(q<V.ev.length&&!V.ev[q].imp)q++;V.e=Math.min(q,V.ev.length-1);drawSearch();};
 $('#s4').onclick=()=>{stopT();V.e=-1;drawSearch();};
 $('#sT').onchange=e=>{V.T=+e.target.value;stopT();drawSearch();};
 $('#sSp').oninput=e=>{V.speed=620-+e.target.value;if(V.timer){stopT();V.timer=setInterval(go,V.speed);}};
}
/* ---------- старт ---------- */
$('#bT').textContent=teacher?'🔓 Учитель (вкл)':'🔑 Учитель';$('#bLink').style.display=teacher?'':'none';
drawFlt();open(cur);
</script>
