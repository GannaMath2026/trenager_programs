<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Регулярки — тренажёр Python</title>
<style>
:root{--bg:#101a2b;--side:#15243a;--panel:#1c2d46;--ink:#17243a;--paper:#fbf7ec;--accent:#35a6b8;--line:#354a67;--font:16px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f7fb;font:var(--font)/1.42 system-ui,Segoe UI,sans-serif}
body.fs-small{--font:13px}body.fs-medium{--font:16px}body.fs-large{--font:19px}body.fs-giant{--font:22px}
button,input,select,textarea{font:inherit}button{border:1px solid #61748f;border-radius:9px;background:#263b58;color:#fff;padding:7px 11px;cursor:pointer}button:hover{filter:brightness(1.12)}button.primary{background:#126c80;border-color:#45b6c6}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 14px;min-height:58px;background:#142238;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.brand{font-weight:800;display:flex;align-items:center;gap:9px}.logo{padding:5px 9px;border-radius:8px;background:linear-gradient(135deg,#7583ed,#21b9b2)}.grow{flex:1}
.top select{background:#20334e;color:#fff;border:1px solid #526783;border-radius:8px;padding:7px}
.layout{display:grid;grid-template-columns:minmax(255px,29%) minmax(0,1fr);min-height:calc(100vh - 58px)}
.sidebar{padding:12px;background:var(--side);border-right:1px solid var(--line);position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}
.search{width:100%;padding:9px;border:1px solid #526783;background:#0e1929;color:#fff;border-radius:9px;margin-bottom:8px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px}.filters select{width:100%;min-width:0;padding:7px;border:1px solid #526783;border-radius:8px;background:#20334e;color:#fff}
.stats{margin:9px 0;padding:9px;background:#20334e;border-radius:9px}.bar{height:7px;background:#3b4e68;border-radius:10px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:#43c28c;width:0}
.group{border:1px solid #334967;border-radius:10px;overflow:hidden;margin:7px 0}
.group summary{list-style:none;cursor:pointer;color:#fff;font-weight:750;padding:10px;background:var(--group-color,#355a78)}.group summary::-webkit-details-marker{display:none}
.tasklist{padding:4px;background:#101c2e}.taskrow{width:100%;display:flex;gap:7px;align-items:center;text-align:left;border:0;background:transparent;color:#eaf0f8;padding:7px;border-radius:7px}.taskrow.active{background:#36506e}.taskrow.done{background:#15543e}.taskrow .num{font-weight:800;white-space:nowrap}.taskrow .lvl{margin-left:auto;color:#c3d2e5;font-size:.76em}
.main{min-width:0;padding:15px;max-width:1450px;width:100%;margin:auto}.welcome{color:#d2deed}.taskcard{background:var(--paper);color:var(--ink);border-radius:15px;padding:clamp(13px,1.6vw,22px);box-shadow:0 10px 30px #0003}
.head{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:8px}.head h1{font-size:1.25em;margin:0 4px 0 0;white-space:nowrap}.badge{font-size:.75em;padding:3px 8px;border-radius:15px;background:#e6eaf0;color:#34445b}.expand{margin-left:auto;white-space:nowrap}
.condition{background:#fffdf8;border-left:4px solid #e5b84d;border-radius:7px;padding:9px 12px;margin:7px 0 10px;line-height:1.45}.condition p{margin:0}.condition strong{font-weight:850;color:#132b4b}
details.theory{background:#dff3f6;border:1px solid #b2dce4;border-radius:10px;padding:8px 11px;margin:8px 0;color:#164654}details.theory summary{font-weight:750;cursor:pointer}.theory-body{padding-top:5px}.theory-body p{margin:4px 0}
.codebar{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 10px;background:#1c2b41;color:#eaf2fb;border-radius:9px 9px 0 0}.editor{display:block;width:100%;min-height:120px;resize:none;overflow:hidden;border:0;border-radius:0 0 9px 9px;background:#0d1725;color:#d9f4e7;padding:11px;font: .9em/1.48 ui-monospace,Consolas,monospace;tab-size:4;white-space:pre}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.actions button{padding:6px 10px}.output{background:#111d2d;color:#e4edf8;border-radius:8px;padding:9px;min-height:34px;max-height:280px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:.86em/1.45 ui-monospace,Consolas,monospace}

.regex-debugger{border:1px solid #8ba9c8;background:var(--panel,#edf3fa);color:#24364d;border-radius:10px;padding:10px;margin:9px 0}
.debug-head,.debug-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between}
.debug-caption{margin:5px 0 8px;font-size:.9em}
.debug-text{width:100%;min-height:75px;resize:vertical;border:1px solid #aabbd0;border-radius:7px;padding:8px;background:#fff;color:#17283d;font: .9em/1.5 ui-monospace,Consolas,monospace}
.debug-controls{justify-content:flex-start;margin-top:7px}
.debug-pattern{flex:1;min-width:180px;padding:8px;border:1px solid #9aabc0;border-radius:7px;font: .95em ui-monospace,Consolas,monospace}
.debug-highlight{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;border:1px solid #d1dbe7;border-radius:7px;padding:8px;color:#23354b;margin:6px 0}.debug-result{margin-top:8px;line-height:1.5;overflow-wrap:anywhere}
.debug-result mark{background:#ffe36e;color:#202020;border-radius:3px;padding:1px 0}
.feedback{margin-top:7px}.note{padding:8px 11px;border-radius:9px;margin:6px 0;background:#fff0b9;color:#59491e}.note.error{background:#ffe2e2;color:#733b3b}.note.ok{background:#dff5e9;color:#16563b}
.solution{background:#101827;color:#d8f3e8;border-radius:9px;padding:10px;white-space:pre;overflow:auto;font:.85em/1.45 ui-monospace,Consolas,monospace;max-height:65vh}
#focus{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;overflow:auto;padding:5vh 5vw}#focus .taskcard{width:100%;min-height:90vh;max-width:1600px;margin:0 auto;padding:clamp(18px,2vw,30px)}#focus .editor{overflow:hidden}
.modalback{position:fixed;inset:0;z-index:60;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px}.modal{width:min(500px,100%);background:#fbf7ec;color:#18243a;padding:22px;border-radius:15px}.modal input{width:100%;padding:10px;border:1px solid #aab6c5;border-radius:8px;margin:10px 0}.modal .actions{justify-content:flex-end}
.hidden{display:none!important}
@media(max-width:800px){.layout{grid-template-columns:1fr}.sidebar{position:relative;top:0;height:auto;max-height:45vh;border-right:0;border-bottom:1px solid var(--line)}.main{padding:9px}.expand{margin-left:0}}

.icon-actions{gap:8px;align-items:stretch}.icon-actions button{min-width:72px;height:auto;min-height:52px;padding:6px 8px;font-size:13px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.15;text-align:center}.icon-actions button .act-ico{font-size:18px;line-height:1}.icon-actions button .act-lbl{font-size:11px;opacity:.92;font-weight:600;max-width:78px;white-space:normal}
.editor-wrap{position:relative;width:100%;border-radius:0 0 9px 9px;background:#0d1725;overflow:hidden}
.editor-wrap .editor,.editor-wrap .editor-highlight{margin:0;width:100%;min-height:120px;padding:11px;font: .9em/1.48 ui-monospace,Consolas,monospace;tab-size:4;white-space:pre;overflow:hidden;letter-spacing:normal}
.editor-wrap .editor{position:relative;z-index:2;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:#fff;resize:none}
.editor-wrap .editor::selection{background:#526b8a;color:transparent}
.editor-wrap .editor-highlight{position:absolute;z-index:1;inset:0;color:#d9f4e7;pointer-events:none;overflow:auto}
.py-comment{color:#72d69a!important;font-style:italic}
.debug-modal-backdrop{position:fixed;inset:0;z-index:100;background:#07111ddd;display:flex;align-items:center;justify-content:center;padding:3vh 3vw}
.debug-modal{width:min(1000px,96vw);max-height:92vh;overflow:auto;background:var(--panel);color:var(--ui-ink);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 20px 70px #0008}
.debug-modal-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:1.1em}
.debug-task-condition{background:var(--paper,#fbf7ec);color:var(--ink,#17243a);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 12px;line-height:1.45}
.debug-task-meta{font-size:.9em;opacity:.85;margin-bottom:6px}
.debug-task-text{font-size:.95em}
.debug-task-text strong{font-weight:850}
body[data-theme="dark"] .debug-task-condition{background:#1a2a40;color:#e8eef6}
:root{--ui-ink:#f4f7fb}
body[data-theme="light"]{--bg:#eef2f7;--side:#e1e8f0;--panel:#fff;--ink:#17243a;--line:#c1ccda;--ui-ink:#17243a;background:var(--bg);color:#17243a}
body[data-theme="light"] .top{background:#fff;color:#17243a;border-color:#c4cedb}
body[data-theme="light"] .top #studentLabel{color:#40536c!important}
body[data-theme="light"] .sidebar{background:#e4ebf3}
body[data-theme="light"] .search,body[data-theme="light"] .filters select,body[data-theme="light"] .top select{background:#fff;color:#17243a;border-color:#aab8c9}
body[data-theme="light"] .stats{background:#fff;color:#263b54}
body[data-theme="light"] .group{border-color:#bdc9d8}
body[data-theme="light"] .group summary{color:#fff}
body[data-theme="light"] .tasklist{background:#edf2f7}
body[data-theme="light"] .taskrow{color:#263b54}
body[data-theme="light"] .taskrow.active{background:#d2e3f4;color:#142d49}
body[data-theme="light"] .taskrow.done{background:#ccebdc;color:#15543e}
body[data-theme="light"] .welcome{color:#344a63}
body[data-theme="light"] .debug-modal{color:#17243a}
body[data-theme="light"] .debugger,body[data-theme="light"] .regex-debugger{color:#17243a}

.regex-debugger{color:var(--ui-ink)!important;background:var(--panel)!important}
.regex-debugger .debug-caption,.regex-debugger .debug-count{color:var(--ui-ink)!important;opacity:.92}
.regex-debugger .debug-head b{color:var(--ui-ink)!important}
body[data-theme="dark"] .regex-debugger{--ui-ink:#f2f6fc}
body[data-theme="light"] .regex-debugger{--ui-ink:#17243a}
body[data-theme="light"] button{background:#e5ebf3;color:#172b45;border-color:#9eafc3}
body[data-theme="light"] button.primary{background:#087e91;color:#fff;border-color:#087e91}
body[data-theme="light"] .editor-wrap{background:#0d1725}
.editor-wrap .editor-highlight{height:100%;box-sizing:border-box}

.solution-details{margin-top:8px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--panel);color:var(--ui-ink)}
.solution-details summary{cursor:pointer;font-weight:750}
body[data-theme="light"] .feedback{color:#17243a}
body[data-theme="light"] .solution{background:#172438;color:#f1f6fc}
body[data-theme="light"] .debug-modal-backdrop{background:#142033bb}

.group summary{background:transparent!important;color:var(--ui-ink,#eaf0f8)!important;border-bottom:1px solid var(--line);padding:11px 10px}
.group{background:transparent;border-color:var(--line)}
.section-count{float:right;color:var(--ui-ink);opacity:.72;font-weight:500}
.taskrow{color:var(--ui-ink,#eaf0f8)}
.taskrow-title{flex:1;min-width:0}
.taskmarks{white-space:nowrap;color:#e5b94f}
.task-flags{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0}
.task-flags button.flag-on{background:#247b67!important;color:#fff!important;border-color:#3ab18f!important}
.task-comment-label{display:block;font-weight:700;margin:10px 0 5px;color:var(--ui-ink)}
.task-comment{width:100%;min-height:58px;resize:vertical;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ui-ink);font:inherit}
.task-edit-modal{max-height:82vh;overflow:auto}
.task-edit-title{display:flex;align-items:center;justify-content:space-between;gap:10px}
.task-edit-title h2{margin:0 0 12px}
.task-edit-field{display:block;font-weight:700;margin:10px 0 4px;color:var(--ui-ink,#17243a)}
.task-edit-field input,.task-edit-field textarea{display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:8px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ui-ink);font:inherit}
.task-edit-field textarea{min-height:74px;resize:vertical}
.task-edit-field textarea[name="condition"]{min-height:105px}
.task-edit-field textarea[name="solutionCode"],.task-edit-field textarea[name="solutionCodeComments"]{min-height:125px;font-family:ui-monospace,Consolas,monospace}
button.danger{background:#9b3030!important;color:#fff!important;border-color:#bd5555!important}
body[data-theme="light"] .group summary{color:#24364d!important;background:transparent!important}
body[data-theme="light"] .taskrow{color:#263b54}
body[data-theme="light"] .section-count{color:#52647a}
.group summary{color:#a9c9df!important;background:transparent!important;}
.group summary .section-count{color:#829fb5!important;}
body[data-theme="light"] .group summary{color:#527b99!important;background:transparent!important;}
body[data-theme="light"] .group summary .section-count{color:#7892a8!important;}
</style></head><body class="fs-medium">
<header class="top"><div class="brand"><span class="logo">re</span>Регулярки · Python</div><span id="studentLabel" style="color:#b8c7da">Ученик: —</span><div class="grow"></div>
<button id="themeToggle" type="button" title="Переключить светлую и тёмную тему" aria-label="Переключить тему">☀️ Светлая тема</button><label>Шрифт <select id="fontSize"><option value="small">Мелкий</option><option value="medium" selected>Средний</option><option value="large">Крупный</option><option value="giant">Гигантский</option></select></label>
<button id="saveApp" class="primary">Сохранить приложение</button><button id="exitBtn">Выход</button></header>
<div class="layout"><aside class="sidebar"><input id="search" class="search" placeholder="Поиск по условию, номеру, теории…">
<div class="filters"><button type="button" onclick="openTaskEditor()">＋ Добавить задачу</button></div><div class="filters"><select id="levelFilter"><option value="">Все уровни</option><option>Базовый</option><option>Средний</option><option>Сложный</option><option>Гроб</option><option>Не указан</option></select><select id="sectionFilter"><option value="">Все разделы</option></select><select id="taskFlagFilter"><option value="">Все задачи</option><option value="done">Решённые</option><option value="homework">ДЗ</option><option value="favorite">Избранное</option><option value="unsolved">Не решённые</option></select></div>
<div class="stats"><b id="progressText">0 / 0 решено</b><span id="percent" style="float:right">0%</span><div class="bar"><i id="progressBar"></i></div><small id="foundCount"></small></div><div id="groups"></div></aside>
<main class="main"><div id="welcome" class="welcome"><h2>Начнём тренировку! 👋</h2><p>Выбери раздел и задачу слева. Разделы остаются открытыми, пока ты сама их не закроешь.</p></div><div id="taskHost"></div></main></div>
<div id="focus"><div id="focusHost"></div></div><div id="modalRoot" class="modalback hidden"><div class="modal" id="modal"></div></div>
<script id="embeddedTasks" type="application/json">[
{
"id": "t1",
"number": "1",
"title": "Максимальная длина без гласных",
"section": "Запрещённые символы и последовательности",
"level": "Базовый",
"condition": "В текстовом файле находится цепочка из символов латинского алфавита A, B, C, D, E, F. Найдите длину самой длинной подцепочки, не содержащей гласных букв.",
"filename": "24.txt",
"sampleText": "DAEFACCFBFFCADCBEBEEDDFCCBDAEFBFACEDCECCACABDCBBBBECDECDEEDFCFDFA",
"expectedAnswer": "7",
"solutionCode": "import re\n\nf = open('24.txt', 'r')\ns = f.readline().strip()\n\npattern = r'[^AEIOUY]+'\nmatches = re.findall(pattern, s)\nanswer = max((len(m) if isinstance(m,str) else len(m[0])) for m in matches) if matches else 0\nprint(answer)\n"
},
{
"id": "t2",
"number": "2",
"title": "Самый длинный фрагмент без XZZY",
"section": "Запрещённые символы и последовательности",
"level": "Базовый",
"condition": "Текстовый файл состоит не более чем из 1 200 000 символов X, Y, и Z. Определите максимальное количество идущих подряд символов, среди которых нет подстроки XZZY. Для выполнения этого задания следует написать программу.",
"filename": "24.txt",
"sampleText": "ZZZYXZZZXXZXYZXYXYYZZYYZYXZYYXZXXZXZZYYZYYYXZXZZX",
"expectedAnswer": "5",
"solutionCode": "import re\n\nf = open('24.txt', 'r')\ns = f.readline().strip()\n\npattern = r'XZZY'\nparts = re.split(pattern, s)\nanswer = max((len(p) for p in parts), default=0)\nprint(answer)\n"
},
{
"id": "t3",
"number": "3",
"title": "Максимальное количество пар ABC",
"section": "Повторяющиеся блоки и группы",
"level": "Базовый",
"condition": "Текстовый файл состоит из символов A, B, C. Определите максимальное количество идущих подряд пар символов АB, CB, BС и BA, стоящие одна за другой и пересекающиеся последней буквой.",
"filename": "24.txt",
"sampleText": "ABCBABABCBABABCBABABCBABXXX",
"expectedAnswer": "4",
"solutionCode": "import re\n\nf = open('24.txt', 'r')\ns = f.readline().strip()\n\n# Ищем последовательность, состоящую из цепочек AB, BC, CB, BA\npattern = r'(?:AB|BC|CB|BA)+'\nmatches = re.findall(pattern, s)\nanswer = max((len(m) for m in matches), default=0) if matches else 0\nprint(answer)\n"
},
{
"id": "t4",
"number": "4",
"title": "Палиндромы длины 5",
"section": "Подсчёт и частотный анализ",
"level": "Базовый",
"condition": "Текстовый файл состоит не более чем из 106 символов английского алфавита. Определите количество палиндромов – последовательностей, которые читаются в обе стороны одинаково – длиной 5.",
"filename": "24.txt",
"sampleText": "ABCBADABCEABCFABCXABCD12321ABCKKKKKEABCMM MMFABCGABC",
"expectedAnswer": "1",
"solutionCode": "import re\n\nf = open('24.txt', 'r')\ns = f.readline().strip()\n\n# Палиндром длины 5: первый символ = последнему, второй = предпоследнему\n# Используем lookahead для поиска перекрывающихся палиндромов\npattern = r'(?=(.)(.).\\2\\1)'\nmatches = re.findall(pattern, s)\nanswer = len(matches)\nprint(answer)\n"
},
{
"id": "t5",
"number": "5",
"title": "Арифметическое выражение",
"section": "Максимальные и минимальные фрагменты",
"level": "Сложный",
"condition": "Текстовый файл состоит из цифр 0, 6, 7, 8, 9 и знаков арифметических операций «–» и «*» (вычитание и умножение). Определите максимальное количество символов в непрерывной последовательности, которая является корректным арифметическим выражением с целыми неотрицательными числами. В этом выражении никакие два знака арифметических операций не стоят рядом, в записи чисел отсутствуют незначащие (нули) и число 0 не имеет знака.",
"filename": "24.txt",
"sampleText": "64375636478549509357673508368260882429332591019716301003490",
"expectedAnswer": "59",
"solutionCode": "import re\n\nf = open('24.txt', 'r')\ns = f.readline().strip()\n\n# Ищем корректное выражение: число (без ведущих нулей), затем операции и числа\npattern = r'(?:0|[6-9][0-9]*)(?:[-*](?:0|[6-9][0-9]*))*'\nmatches = re.findall(pattern, s)\nanswer = max((len(m) for m in matches), default=0) if matches else 0\nprint(answer)\n"
},
{
"id": "t6",
"number": "6",
"title": "Границы A и D",
"section": "Запрещённые символы и последовательности",
"level": "Сложный",
"condition": "Текстовый файл состоит из букв латинского алфавита и десятичных цифр. Определите максимальную длину подстроки, которая ограничена с одной стороны буквой A, а с другой - D и не содержит других букв A и D внутри.",
"filename": "24.txt",
"sampleText": "XXA123B45CYYDZZA9K8MDQA12D\nAXXD\nD7B3A\n",
"expectedAnswer": "11",
"solutionCode": "import re\n\nf = open('24.txt', 'r')\ns = f.readline().strip()\n\n# Ищем A...D или D...A, где внутри нет A и D\npattern = r'A[^AD]*D|D[^AD]*A'\nmatches = re.findall(pattern, s)\nanswer = max((len(m) for m in matches), default=0) if matches else 0\nprint(answer)\n"
},
{
"id": "t7",
"number": "7",
"title": "Самый длинный фрагмент без DD",
"section": "Запрещённые символы и последовательности",
"level": "Базовый",

(function(){const order={'Базовый':1,'Средний':2,'Сложный':3,'Гроб':4,'Не указан':5};TASKS.sort((x,y)=>(order[x.level]||5)-(order[y.level]||5)||(parseInt(String(x.number).replace(/\D/g,''),10)||0)-(parseInt(String(y.number).replace(/\D/g,''),10)||0));})();

function pyStringLiteral(s){return JSON.stringify(String(s??''))}

function starter(t){

f = open('${String(t.filename||'24.txt').replace(/['\\\\]/g,'')}', 'r')

# s = ${pyStringLiteral(sample)}

}

function theoryHTML(){return `<details class="theory"><summary>📚 Теория к задаче · нажми, чтобы открыть или закрыть</summary><div class="theory-body"><p><b>re.findall()</b> — все совпадения.</p><p><b>\\d</b> — цифра; <b>[A-Z]</b> — заглавная латинская буква.</p><p><b>+</b> — один или более повторов; <b>*</b> — ноль или более.</p><p><b>[^ABC]</b> — любой символ, кроме A, B и C.</p><p><b>(?=...)</b> — просмотр вперёд, в том числе для перекрывающихся совпадений.</p></div></details>`}
function cardHTML(t){let code=codeByTask[t.id]??starter(t);return `<section class="taskcard"><div class="head"><h1>Задание № ${esc(t.number)}</h1><span class="badge">${esc(t.section)}</span><span class="badge">${esc(t.level)}</span><span class="badge">${done(t)?'✓ Решено':'В работе'}</span><button type="button" onclick="openTaskEditor(current)">✏️ Редактировать</button><button class="expand" onclick="toggleFocus()">${focus?'Свернуть задачу':'Развернуть задачу'}</button></div>

</div>
<label class="task-comment-label">Мой комментарий к задаче</label><textarea class="task-comment" placeholder="Запиши свои заметки…" oninput="saveTaskComment(this)">${esc(progress[t.id]?.comment||'')}</textarea>
<div class="condition">${conditionHTML(t.condition)}</div>${theoryHTML()}
<div class="codebar"><b>🐍 Код на Python</b><span>Файл: 24.txt</span></div><div class="editor-wrap"><pre class="editor-highlight" aria-hidden="true"></pre><textarea class="editor" spellcheck="false" oninput="onCodeInput(this)" onscroll="syncEditorScroll(this)">${esc(code)}</textarea></div>
<div class="actions icon-actions"><button title="Заполнить полный код решения" aria-label="Заполнить полный код" onclick="fillFields(this)"><span class="act-ico">✨</span><span class="act-lbl">Полный код</span></button><button class="primary" title="Запустить и проверить ответ" aria-label="Запустить и проверить" onclick="runCode(this)"><span class="act-ico">▶</span><span class="act-lbl">Запуск</span></button><button title="Вернуть исходную заготовку" aria-label="Вернуть заготовку" onclick="resetCode(this)"><span class="act-ico">↶</span><span class="act-lbl">Сброс</span></button><button title="Очистить окно вывода" aria-label="Очистить вывод" onclick="clearOutput(this)"><span class="act-ico">⌫</span><span class="act-lbl">Очистить</span></button><button title="Скопировать код в буфер" aria-label="Копировать код" onclick="copyCode(this)"><span class="act-ico">📋</span><span class="act-lbl">Копировать</span></button><button title="Подсказка по шаблону" aria-label="Подсказка" onclick="showHint(this)"><span class="act-ico">💡</span><span class="act-lbl">Подсказка</span></button><button title="Показать эталонный ответ" aria-label="Показать ответ" onclick="showExpectedAnswer(this)"><span class="act-ico">🔑</span><span class="act-lbl">Ответ</span></button><button title="Отладить регулярное выражение" aria-label="Отладить регулярное выражение" onclick="openRegexDebugger(this)"><span class="act-ico">🔎</span><span class="act-lbl">Отладка</span></button><button title="Показать подробный разбор решения" aria-label="Показать разбор" onclick="showSolution(this)"><span class="act-ico">📖</span><span class="act-lbl">Разбор</span></button></div>
<div class="output">Здесь появится результат выполнения.</div><div class="regex-debugger" hidden><div class="debug-head"><b>🔎 Отладка регулярного выражения</b><button type="button" onclick="closeRegexDebugger(this)">Закрыть</button></div><p class="debug-caption">Меняй выражение — совпадения в тексте ниже будут подсвечиваться сразу.</p><div class="debug-controls"><input class="debug-pattern" type="text" spellcheck="false" placeholder="Регулярное выражение, например \\d+" oninput="liveRegex(this)"><button type="button" onclick="useSuggestedRegex(this)">Подставить подсказку</button></div><div class="debug-result"><pre class="debug-highlight"></pre><div class="debug-count"></div></div></div><div class="feedback"></div></section>`}
function activeCard(){return focus?$('#focusHost .taskcard'):$('#taskHost .taskcard')}

 if(!current)return;
 const active=activeCard(),editor=active?.querySelector('.editor');

function onCodeInput(el){

}

function updateCodeHighlight(el){

 if(!pre)return;
 pre.innerHTML=el.value.split('\n').map(line=>{
  const i=line.indexOf('#');
  return i<0?esc(line):esc(line.slice(0,i))+'<span class="py-comment">'+esc(line.slice(i))+'</span>';

function showHint(btn){
 const t=current,box=cardButton(btn).querySelector('.feedback');
 if(!t)return;
 const m=(t.condition+' '+t.title).toLowerCase();
 let pat, title, steps=[];
 if(t.solutionCode && t.solutionCode.includes("pattern =")){
    const lines = t.solutionCode.split('\n');
    const pLine = lines.find(l => l.includes("pattern ="));
    if(pLine) pat = pLine.replace(/.*pattern\s*=\s*r?['"](.*)['"].*/, '$1');
 }
 if(!pat) {
   if(/ограничена с одной стороны буквой a[\s\S]*другой[\s\S]*d[\s\S]*не содержит других букв a и d/i.test(m)) pat='A[^AD]*D|D[^AD]*A';
   else if(/перекрыва|с перекрыти|палиндром/.test(m)) pat='(?=(...))';
   else if(/не содержит|не содержащ|без сочетания|без подстрок|запрещ/.test(m)) pat='[^XYZ]+';
   else if(/цифр/.test(m)) pat='\\d+';
   else if(/одинаков|повтор/.test(m)) pat='(.)\\1+';
   else pat='[A-Z]+';
 }
 const list=steps.map((s,i)=>'<li><b>Шаг '+(i+1)+'.</b> '+esc(s)+'</li>').join('');
 box.innerHTML='<div class="note"><b>💡 '+esc(title||"Подсказка")+'</b><br>Опорный шаблон: <code>'+esc(pat)+'</code><ol style="margin:8px 0 0;padding-left:18px">'+list+'</ol><p style="margin:8px 0 0">Подставь шаблон в <code>pattern = r\'...\'</code> и адаптируй под буквы/цифры из условия.</p></div>';
}

function extractPatternFromCode(code){
 if(!code) return '';
 let m = code.match(/pattern\s*=\s*r(['"])((?:\\.|(?!\1).)*)\1/);
 if(m){
  return m[2].replace(/\\([\\'"nrt])/g, function(_,c){
   return ({n:'\n',r:'\r',t:'\t','\\':'\\',"'":"'",'"':'"'}[c]) || ('\\'+c);
  });
 }
 return '';
}
function extractSampleFromCode(code, fallback){
 if(!code) return fallback||'';
 const lines = code.split(/\r?\n/);
 for(const line of lines){
  const t=line.trim();
  if(t.startsWith('#')) continue;
  let m = t.match(/^s\s*=\s*(['"])((?:\\.|(?!\1).)*)\1/);
  if(m){
   try { return JSON.parse('"'+m[2].replace(/\\/g,'\\\\').replace(/"/g,'\\"')+'"'); } catch(e){ return m[2]; }
  }
 }
 for(const line of lines){
  let m = line.match(/#\s*s\s*=\s*(['"])((?:\\.|(?!\1).)*)\1/);
  if(m){
   try { return JSON.parse('"'+m[2].replace(/\\/g,'\\\\').replace(/"/g,'\\"')+'"'); } catch(e){ return m[2]; }
  }
 }
 return fallback||'';
}
function openRegexDebugger(btn){

 cond.innerHTML='<div class="debug-task-meta"><b>Задание № '+esc(t.number)+'</b> · '+esc(t.level||'')+' · '+esc(t.section||'')+'</div><div class="debug-task-text">'+conditionHTML(t.condition||'')+'</div>';
 dialog.appendChild(head);dialog.appendChild(cond);dialog.appendChild(panel);overlay.appendChild(dialog);document.body.appendChild(overlay);
 const innerHead=panel.querySelector('.debug-head');if(innerHead)innerHead.style.display='none';
 panel.hidden=false;
 const ed = cardButton(btn).querySelector('.editor');
 const code = ed ? ed.value : (codeByTask[t.id]||'');
 const fromCodeSample = extractSampleFromCode(code, '');
 const sample = (fromCodeSample || String(t.sampleText||'ABC123\nAAB456\nXYZ789\n')).replace(/\r/g,'');
 panel.dataset.sample = sample;

 panel.querySelector('.debug-highlight').textContent = sample;
 if(fromCodePat){
  liveRegex(panel.querySelector('.debug-pattern'));
 } else {
  panel.querySelector('.debug-count').textContent = 'Введи выражение выше — совпадения появятся сразу. Можно нажать «Подставить выражение».';
 }

function closeRegexDebugger(btn){
 const panel=btn.closest('.regex-debugger')||document.querySelector('#regexDebugModal .regex-debugger'),overlay=document.getElementById('regexDebugModal');
 if(panel){const innerHead=panel.querySelector('.debug-head');if(innerHead)innerHead.style.display='';}
 if(panel&&panel._returnMarker&&panel._returnMarker.parentNode){panel.hidden=true;panel._returnMarker.parentNode.insertBefore(panel,panel._returnMarker);panel._returnMarker.remove();panel._returnMarker=null;}
 if(overlay)overlay.remove();
}
function hintPattern(t){
 const m=(t.condition+' '+t.title).toLowerCase();
 if(/ограничена с одной стороны буквой a[\s\S]*другой[\s\S]*d[\s\S]*не содержит других букв a и d/i.test(m)
    || (/буквой a/.test(m) && /другой.*\bd\b/.test(m) && /не содержит других букв a и d/.test(m))){
  return 'A[^AD]*D|D[^AD]*A';
 }
 if(/перекрыва|с перекрыти/.test(m)) return '(?=(...))';
 if(/не содержащ.*гласн/.test(m)) return '[^AEIOUY]+';
 if(/не содержащ.*символ(?:а|ов)? d\b/.test(m) && !/буквой a/.test(m)) return '[^D]+';
 if(/не содержащ.*c и f/.test(m)) return '[^CF]+';
 if(/не содержит|не содержится|без сочетания|без подстрок/.test(m)) return '[^ABC]+';
 if(/цифр/.test(m)) return '\\d+';
 if(/одинаков/.test(m)) return '(.)\\1+';
 if(/латинск/.test(m)) return '[A-Z]+';
 return '[A-Z]+';
}
function useSuggestedRegex(btn){
 const panel=btn.closest('.regex-debugger'),input=panel.querySelector('.debug-pattern');
 let sug = panel.dataset.suggested || '';
 sug = sug.replace(/\\\\([dDwWsSbBnrt])/g, '\\$1');
 input.value = sug;
 liveRegex(input); input.focus();
}
function liveRegex(input){
 const panel=input.closest('.regex-debugger'),pattern=input.value,source=panel.dataset.sample||'',pre=panel.querySelector('.debug-highlight'),count=panel.querySelector('.debug-count');
 if(!pattern){pre.textContent=source;count.textContent='Введи регулярное выражение.';return}
 try{
  const re=new RegExp(pattern,'g'),matches=[...source.matchAll(re)];let html='',last=0;
  for(const match of matches){const start=match.index,end=start+match[0].length;if(end<=start)continue;html+=esc(source.slice(last,start))+'<mark>'+esc(source.slice(start,end))+'</mark>';last=end;}
  html+=esc(source.slice(last));pre.innerHTML=html||esc(source);count.textContent='Найдено совпадений: '+matches.length;
 }catch(e){pre.textContent=source;count.textContent='Ошибка в регулярном выражении: '+e.message}
}
function showExpectedAnswer(btn){let t=current,box=cardButton(btn).querySelector('.feedback');if(t.expectedAnswer===undefined){box.innerHTML='<div class="note">Для этой задачи эталонный ответ ещё не рассчитан.</div>';return}box.innerHTML='<div class="note">Эталонный ответ для текущего тестового файла: <b>'+esc(String(t.expectedAnswer))+'</b></div>'}
function explainPattern(pat){
 if(!pat)return 'Шаблон подбирается под условие задачи.';
 const p=String(pat);
 const parts=[];
 if(p.startsWith('(?=')) parts.push('Внешняя конструкция (?=...) — просмотр вперёд: позиция в строке не сдвигается, поэтому можно находить перекрывающиеся совпадения.');
 if(/\[\^[^\]]+\]/.test(p)) parts.push('Класс вида [^...] означает «любой символ, кроме перечисленных внутри скобок». Так мы отбрасываем запрещённые буквы/цифры.');
 if(/\[(?!\^)[^\]]+\]/.test(p)) parts.push('Класс [...] перечисляет допустимые символы (или диапазон вроде A-Z / 0-9).');
 if(p.includes('\\d')) parts.push('\\d — любая цифра от 0 до 9 (эквивалент [0-9]).');
 if(p.includes('.')) parts.push('Точка . — ровно один любой символ (кроме перевода строки).');
 if(p.includes('+')) parts.push('Квантификатор + означает «один или более подряд».');
 if(p.includes('*') && !p.startsWith('(?=')) parts.push('Квантификатор * означает «ноль или более подряд».');
 if(p.includes('\\1')) parts.push('Обратная ссылка \\1 повторяет то, что захватила первая группа (...). Так ищут серии одинаковых символов.');
 if(p.includes('(?:')) parts.push('(?:...) — незахватывающая группа: нужна для группировки, но не попадает в результат findall отдельным элементом.');
 if(!parts.length) parts.push('Шаблон читается слева направо: каждый фрагмент описывает очередной кусок искомой подстроки.');
 return parts.join(' ');
}
function commentedSolution(code){
 const lines=String(code||'').split('\n');
 const patLine=lines.find(l=>/pattern\s*=/.test(l));
 const patMatch=patLine&&patLine.match(/pattern\s*=\s*r?(['"])([\s\S]*?)\1/);
 const pat=patMatch?patMatch[2]:'';
 const patternExplain=explainPattern(pat);
 return lines.map((line)=>{
  if(!line.trim())return '';
  if(line.trim().startsWith('#'))return line;
  const t=line.trim();
  if(t.startsWith('import re')) return line+'  # подключаем модуль регулярных выражений Python';
  if(t.startsWith('f = open(')) return line+'  # открываем файл с текстом задания (обычно 24.txt)';
  if(t.startsWith('s = f.readline()')) return line+'  # читаем одну строку файла в переменную s';
  if(t.startsWith('s = ')) return line+'  # (альтернатива) можно подставить образец строки прямо в код';
  if(t.startsWith('pattern =')) return line+'  # '+patternExplain;
  if(t.startsWith('matches = re.findall(')) return line+'  # findall возвращает список всех неперекрывающихся совпадений (или список групп)';
  if(t.startsWith('answer = len(matches)')) return line+'  # в этой задаче нужен подсчёт количества совпадений';
  if(t.startsWith('answer = max(')) return line+'  # среди всех совпадений выбираем максимальную длину — это ответ';
  if(t.startsWith('print(answer)')) return line+'  # выводим число-ответ; его сверит тренажёр с эталоном';
  return line+'  # следующий шаг решения';
 }).join('\n');
}
function highlightPython(code){
 return code.split('\n').map(line=>{const i=line.indexOf('#');return i<0?esc(line):esc(line.slice(0,i))+'<span class="py-comment">'+esc(line.slice(i))+'</span>'}).join('\n');
}
function showSolution(btn){
 const box=cardButton(btn).querySelector('.feedback'),code=fullSolutionCode(current);
 if(!code){box.innerHTML='<div class="note">Для этой задачи пока не подготовлен полный проверенный код.</div>';return}
 const old=box.querySelector('details.solution-details');
 if(old){old.remove();return}
 const patMatch=code.match(/pattern\s*=\s*r?(['"])([\s\S]*?)\1/);
 const pat=patMatch?patMatch[2]:'';
 const explain=explainPattern(pat);
 const intro='<div class="note" style="margin-bottom:8px"><b>Как читать шаблон <code>'+esc(pat)+'</code></b><br>'+esc(explain)+'</div>';
 box.insertAdjacentHTML('beforeend','<details class="solution-details" open><summary>📖 Полный разбор — нажми, чтобы скрыть или открыть</summary>'+intro+'<pre class="solution">'+highlightPython(commentedSolution(code))+'</pre></details>');
}

function expected(t){return t.expectedAnswer??null}
async function runCode(btn){let t=current,card=cardButton(btn),ed=card.querySelector('.editor'),out=card.querySelector('.output'),fb=card.querySelector('.feedback');onCodeInput(ed);out.textContent='Запускаю Python…';fb.innerHTML='';
try{if(!window.loadPyodide){await new Promise((res,rej)=>{let sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js';sc.onload=res;sc.onerror=rej;document.head.append(sc)})}if(!pyodide)pyodide=await loadPyodide();
let filename=t.filename||'24.txt',sample=String(t.sampleText||'ABC123DEF456').replace(/[\\r\\n]+$/g,'');pyodide.FS.writeFile(filename,sample);
let captured='',errors='';pyodide.setStdout({batched:x=>captured+=x});pyodide.setStderr({batched:x=>errors+=x});
let timer;await Promise.race([pyodide.runPythonAsync(ed.value),new Promise((_,rej)=>timer=setTimeout(()=>rej(new Error('TIME_LIMIT')),5000))]);clearTimeout(timer);
out.textContent=captured+(errors?'\n'+errors:'')||'Код выполнен, но print ничего не вывел.';
let key=expected(t);if(key!==null){let got=captured.trim().split(/\\r?\n/).pop();if(normalize(got)===normalize(key)){progress[t.id]={...(progress[t.id]||{}),done:true,attempts:(progress[t.id]?.attempts||0)+1};saveProgress();fb.innerHTML='<div class="note ok">Верно! Переходим к следующему заданию…</div>';renderSidebar();setTimeout(()=>nextTask(),1300)}else{progress[t.id]={...(progress[t.id]||{}),attempts:(progress[t.id]?.attempts||0)+1};saveProgress();fb.innerHTML='<div class="note error">Ответ не совпадает с эталоном. Проверь регулярное выражение и итоговое вычисление.</div>'}}
else{progress[t.id]={...(progress[t.id]||{}),attempts:(progress[t.id]?.attempts||0)+1};saveProgress();fb.innerHTML='<div class="note">Код выполнен. Автоматическая сверка для этой задачи пока недоступна.</div>'}
}catch(e){clearTimeout(timer);out.textContent=e.message==='TIME_LIMIT'?'Код выполняется дольше 5 секунд. Попробуй выполнить его в отдельной среде Python.':'Ошибка Python: '+e.message}}
function normalize(x){return String(x??'').replace(/\\s+/g,'').replace(',', '.').toLowerCase()}
function nextTask(){let arr=sorted(filtered()),i=arr.findIndex(t=>t.id===current?.id),n=arr.slice(i+1).find(t=>!done(t))||arr[i+1];if(n)openTask(n.id)}
function populateFilters(){let secs=[...new Set(TASKS.map(t=>t.section))].sort((a,b)=>a.localeCompare(b,'ru'));$('#sectionFilter').innerHTML='<option value="">Все разделы</option>'+secs.map(x=>'<option>'+esc(x)+'</option>').join('')}
function modal(html){$('#modal').innerHTML=html;$('#modalRoot').classList.remove('hidden')}
function closeModal(){$('#modalRoot').classList.add('hidden')}
function askStudent(){
 let remembered=localStorage.getItem('regexTrainer.lastStudent')||initialState.student||'';
 try{
  const cached=JSON.parse(localStorage.getItem('regexTrainer.studentsDB')||'null');
  if(cached && typeof cached==='object'){
   Object.keys(cached).forEach(k=>{
    if(!studentsDB[k] || (cached[k].updated||0)>(studentsDB[k].updated||0)) studentsDB[k]=cached[k];
   });
  }
 }catch(e){}
 const known=Object.keys(studentsDB).sort((a,b)=>a.localeCompare(b,'ru'));
 const chips=known.map(n=>'<button type="button" class="stu-chip" data-name="'+esc(n)+'" style="margin:2px">'+esc(n)+'</button>').join(' ');
 modal('<h2>Кто сегодня занимается?</h2><p>Прогресс и флаги хранятся <b>отдельно для каждого ученика</b> и попадают в сохранённый файл приложения.</p>'
  +(chips?'<div style="display:flex;flex-wrap:wrap;gap:6px;margin:10px 0">'+chips+'</div>':'')
  +'<input id="studentInput" placeholder="Имя ученика" value="'+esc(remembered)+'"><div class="actions"><button class="primary" id="startBtn">Начать</button></div>');
 const start=()=>{let n=$('#studentInput').value.trim();if(!n)return;student=n;localStorage.setItem('regexTrainer.lastStudent',n);$('#studentLabel').textContent='Ученик: '+n;loadProgress();closeModal();renderSidebar();dirty=true};
 $('#startBtn').onclick=start;
 document.querySelectorAll('.stu-chip').forEach(b=>b.onclick=()=>{$('#studentInput').value=b.dataset.name;start()});
}

function persistTaskLibrary(){try{localStorage.setItem('regexTrainer.taskLibrary',JSON.stringify(TASKS));dirty=true}catch(e){alert('Не удалось сохранить библиотеку задач: '+e.message)}}
function openTaskEditor(task=null){
 const t=task?JSON.parse(JSON.stringify(task)):{id:'task_custom_'+Date.now(),number:'',title:'Новая задача',section:'Новый раздел',level:'Базовый',condition:'',source:'Добавлена преподавателем',approach:'',theory:[],filename:'24.txt',sampleText:'',expectedAnswer:'',solutionCode:'',solutionCodeComments:'',answerStatus:'manual'};
 const fields=[
  ['number','Номер'],['title','Название'],['section','Раздел'],['level','Сложность'],['condition','Условие'],['source','Источник'],['approach','Подход / навык'],['filename','Имя файла'],['sampleText','Содержимое файла (одна строка)'],['expectedAnswer','Эталонный ответ'],['theory','Индексы теории (через запятую)'],['solutionCode','Полный код решения'],['solutionCodeComments','Код решения с комментариями'],['answerStatus','Статус эталона']
 ];
 const body=fields.map(([key,label])=>{let val=t[key]??'';if(key==='theory'&&Array.isArray(val))val=val.join(', ');let area=['condition','sampleText','solutionCode','solutionCodeComments'].includes(key);return `<label class="task-edit-field">${esc(label)}${area?`<textarea name="${key}">${esc(val)}</textarea>`:`<input name="${key}" value="${esc(val)}">`}</label>`}).join('');
 modal(`<div class="task-edit-modal"><div class="task-edit-title"><h2>${task?'Редактировать задачу':'Добавить задачу'}</h2><button type="button" id="taskEditClose">✕</button></div><form id="taskEditForm">${body}<div class="actions"><button type="submit" class="primary">Сохранить задачу</button>${task?'<button type="button" id="deleteTask" class="danger">Удалить задачу</button>':''}</div></form></div>`);
 $('#taskEditClose').onclick=closeModal;
 $('#taskEditForm').onsubmit=e=>{
  e.preventDefault();const form=e.currentTarget,updated={...t};
  fields.forEach(([key])=>{let v=form.elements[key].value;updated[key]=key==='theory'?v.split(',').map(x=>x.trim()).filter(Boolean):v});
  updated.id=t.id;
  if(!updated.number.trim()||!updated.condition.trim()){alert('Заполни номер и условие задачи.');return}
  if(task){let i=TASKS.findIndex(x=>x.id===task.id);if(i>=0)TASKS[i]=updated}else TASKS.push(updated);
  persistTaskLibrary();current=updated;closeModal();renderSectionFilter();renderSidebar();openTask(updated.id)
 };
 const del=$('#deleteTask');if(del)del.onclick=()=>{
  if(!confirm('Удалить задачу № '+t.number+'? Это действие нельзя отменить.'))return;
  const i=TASKS.findIndex(x=>x.id===t.id);if(i>=0)TASKS.splice(i,1);
  delete progress[t.id];delete codeByTask[t.id];persistTaskLibrary();saveProgress();current=null;closeModal();$('#taskHost').innerHTML='';$('#focusHost').innerHTML='';focus=false;$('#focus').style.display='none';renderSectionFilter();renderSidebar()
 };
}
function renderSectionFilter(){const sel=$('#sectionFilter'),value=sel.value;sel.innerHTML='<option value="">Все разделы</option>'+[...new Set(TASKS.map(t=>t.section))].sort((a,b)=>a.localeCompare(b,'ru')).map(x=>'<option>'+esc(x)+'</option>').join('');if([...sel.options].some(o=>o.value===value))sel.value=value}
function snapshot(){
 if(student) studentsDB[student]={progress, codeByTask, updated:Date.now()};

}
function saveApplication(){try{saveProgress();let state=snapshot(),copy=document.documentElement.cloneNode(true);copy.querySelector('#embeddedState').textContent=JSON.stringify(state).replace(/</g,'\\u003c');copy.querySelector('#embeddedTasks').textContent=JSON.stringify(TASKS).replace(/</g,'\\u003c');let blob=new Blob(['<!DOCTYPE html>\\n'+copy.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Регулярки_'+(student||'ученик')+'_с_прогрессом.html';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);dirty=false;return true}catch(e){alert('Не удалось сохранить приложение: '+e.message);return false}}
function exitAsk(){modal('<h2>Завершить работу?</h2><p>Сначала сохранить приложение с прогрессом и кодом?</p><div class="actions"><button id="stay">Остаться</button><button id="saveExit" class="primary">Сохранить и выйти</button><button id="exitNow">Выйти без сохранения</button></div>');$('#stay').onclick=closeModal;$('#saveExit').onclick=()=>{if(saveApplication())leaveApp();};$('#exitNow').onclick=()=>leaveApp(true)}
function leaveApp(withoutSaving=false){closeModal();current=null;focus=false;$('#focus').style.display='none';$('#taskHost').innerHTML='';$('#focusHost').innerHTML='';$('#welcome').classList.remove('hidden');document.body.style.overflow='';if(withoutSaving){localStorage.removeItem('regexTrainer.lastStudent');student='';initialState.student='';initialState.progress=null;progress={};codeByTask={};$('#studentLabel').textContent='Ученик: не выбран';dirty=false;askStudent();}}
const themeBtn=document.getElementById('themeToggle');function setTheme(mode){document.body.dataset.theme=mode;themeBtn.textContent=mode==='light'?'🌙 Тёмная тема':'☀️ Светлая тема';themeBtn.title=mode==='light'?'Переключить на тёмную тему':'Переключить на светлую тему';try{localStorage.setItem('regex.theme',mode)}catch(e){}}setTheme(localStorage.getItem('regex.theme')||'dark');themeBtn.addEventListener('click',()=>setTheme(document.body.dataset.theme==='dark'?'light':'dark'));
$('#saveApp').onclick=saveApplication;$('#exitBtn').onclick=exitAsk;$('#search').oninput=renderSidebar;$('#levelFilter').onchange=renderSidebar;$('#sectionFilter').onchange=renderSidebar;$('#taskFlagFilter').onchange=renderSidebar;
