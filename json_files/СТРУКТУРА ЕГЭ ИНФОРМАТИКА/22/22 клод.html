<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Информатика · ЕГЭ 22 · Параллельные процессы</title>
<style>:root{--bg:#f3f5fb;--card:#fff;--ink:#1d2640;--mut:#6b7392;--line:#e1e5f0;--pri:#4f6bff;--pri2:#7b5cff;--ok:#16a36a;--err:#e5484d;--warn:#f0a400;--code:#141a2e;--code2:#1c2340;--cink:#dfe5ff;--sh:0 8px 24px rgba(40,50,90,.08);
 --xl-grid:#d4d4d4;--xl-head:#f3f3f3;--xl-headsel:#d3f0e0;--xl-headfull:#217346;--xl-sel:rgba(33,115,70,.13);--xl-act:#217346;--xl-cell:#fff;--xl-ink:#1b1b1b;--fs:15px}
[data-theme=dark]{--bg:#0f1322;--card:#181e33;--ink:#e6e9f5;--mut:#98a0bf;--line:#2a3150;--code:#0b0f1d;--code2:#131a30;--sh:0 8px 24px rgba(0,0,0,.35);
 --xl-grid:#3a4262;--xl-head:#20283f;--xl-headsel:#24513d;--xl-headfull:#2fa36a;--xl-sel:rgba(80,200,140,.18);--xl-act:#3ccf85;--xl-cell:#141a2c;--xl-ink:#e8ecf8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs)/1.5 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:var(--pri)}
.mono,code,pre{font-family:"JetBrains Mono","Cascadia Code",Consolas,"Courier New",monospace}
.btn{border:0;border-radius:11px;padding:8px 14px;font-weight:700;background:var(--card);color:var(--ink);box-shadow:0 0 0 1.5px var(--line) inset;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn:hover{box-shadow:0 0 0 1.5px var(--pri) inset}
.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 6px 16px rgba(79,107,255,.3)}
.btn.ok{background:var(--ok);color:#fff;box-shadow:none}
.btn.red{background:var(--err);color:#fff;box-shadow:none}
.btn.gold{background:linear-gradient(135deg,#ffb100,#ff7a00);color:#fff;box-shadow:0 6px 16px rgba(255,140,0,.3)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:16px 18px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1d2640;color:#fff;padding:11px 18px;border-radius:12px;z-index:400;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90vw;font-weight:600}
.mbg{position:fixed;inset:0;background:rgba(15,20,40,.55);display:flex;align-items:center;justify-content:center;z-index:300;padding:12px}
.mdl{background:var(--card);border-radius:20px;padding:22px;max-width:640px;width:100%;max-height:94vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.mdl.wide{max-width:1040px}.mdl.full{max-width:min(1400px,98vw);width:98vw;max-height:97vh;padding:16px}
.mdl h2{margin:0 0 12px}
.inp{border:1.5px solid var(--line);background:var(--bg);border-radius:11px;padding:8px 12px;outline:none}
.inp:focus{border-color:var(--pri)}
textarea.inp{width:100%;font:13px/1.4 Consolas,monospace}
.vhint{font-size:13px;color:var(--mut)}
/* топбар */
.top{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--card);box-shadow:0 2px 12px rgba(30,40,80,.07);flex-wrap:wrap}
.logo{font-weight:900;font-size:17px;display:flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer}
.logo i{font-style:normal;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-size:14px}
.top .sp{flex:1}
.who{font-weight:800;background:var(--bg);border-radius:999px;padding:5px 12px;white-space:nowrap}
.modeb{font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;background:#e3f6ec;color:#0f7a4d;white-space:nowrap}
.modeb.home{background:#fff0e0;color:#b25e00}
.ib{border:0;background:var(--bg);color:var(--ink);border-radius:10px;padding:7px 10px;font-weight:700;white-space:nowrap}
.ib:hover{background:#e6eaff}[data-theme=dark] .ib:hover{background:#262f55}
.ib.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.seg{display:inline-flex;background:var(--bg);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 9px;font-weight:700;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.seg .xl.on{color:#217346}.seg .lo.on{color:#1e6fd9}
/* вход */
.login{max-width:600px;margin:6vh auto;padding:0 14px}
.hero{background:linear-gradient(135deg,#4f6bff,#7b5cff 60%,#b44cff);color:#fff;border-radius:24px;padding:26px;box-shadow:0 20px 50px rgba(79,107,255,.35);position:relative;overflow:hidden}
.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0;opacity:.92}
.hero .deco{position:absolute;right:14px;bottom:12px;display:grid;grid-template-columns:repeat(12,14px);gap:3px;opacity:.35}
.hero .deco i{height:12px;border-radius:3px;background:#fff}
.slist{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.slist button{border:0;background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:700}
/* раскладка */
.lay{display:grid;grid-template-columns:290px minmax(0,1fr);gap:14px;padding:14px;max-width:1900px;margin:0 auto}
.side{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 78px);overflow:auto;background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:12px}
.prog{display:flex;height:10px;border-radius:9px;overflow:hidden;background:var(--bg);margin:4px 0 8px}
.prog i{display:block;height:100%}
.sec{margin-top:10px}
.sec .sh{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:6px;font-weight:800;font-size:13.5px;padding:5px 4px;text-align:left}
.sec .sh small{margin-left:auto;color:var(--mut);font-weight:700}
.lv{font:800 11px/1 Consolas,monospace;border-radius:6px;padding:4px 6px;color:#fff}
.lv1{background:#16a36a}.lv2{background:#2f80ed}.lv3{background:#f08c00}.lv4{background:#e5484d}.lv5{background:#7b5cff}.lv0{background:#6b7392}
.sec .sd{font-size:11.5px;color:var(--mut);padding:0 4px 4px}
.its{display:flex;flex-wrap:wrap;gap:5px;padding:2px 2px 6px}
.it{border:0;border-radius:9px;padding:4px 7px;font:700 12.5px Consolas,monospace;background:var(--bg);color:var(--ink);position:relative;min-width:46px}
.it.ok{background:#d7f5e6;color:#0f7a4d}.it.err{background:#e2f4ea;color:#2e8a5f}.it.hint{background:#fff1c7;color:#8a6400}.it.sol{background:#ffe2cc;color:#b04e10}
[data-theme=dark] .it.ok{background:#12452f;color:#7fe0b0}[data-theme=dark] .it.hint{background:#4a3a0c;color:#ffd666}[data-theme=dark] .it.sol{background:#4a2a12;color:#ffb27a}[data-theme=dark] .it.err{background:#173d2c;color:#8fd8b3}
.it.cur{outline:2.5px solid var(--pri);outline-offset:1px}
.it.tried::after{content:'';position:absolute;right:2px;top:2px;width:6px;height:6px;border-radius:50%;background:var(--err)}
.it.nn::before{content:'';position:absolute;left:2px;top:2px;width:5px;height:5px;border-radius:50%;background:var(--warn)}
.it.opt{opacity:.75;border:1.5px dashed var(--line)}
.legend{font-size:11.5px;color:var(--mut);display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.addbtn{width:100%;margin-top:10px;justify-content:center}
/* задача */
.main{min-width:0;display:flex;flex-direction:column;gap:12px}
.th{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.th h2{margin:0;font-size:22px}
.tag{font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;background:var(--bg);color:var(--mut);white-space:nowrap}
.tag.k{background:#e6efff;color:#2759d6}.tag.star{background:#fff1c7;color:#8a6400}.tag.rom{background:#ffe3e3;color:#c0262c}.tag.tch{background:#e3f6ec;color:#0f7a4d}
.tag.nn{background:#fff3d6;color:#9a5b00;box-shadow:0 0 0 1.5px #ffcf70 inset}
.cond{font-size:17px;line-height:1.55;margin:10px 0 4px;background:#f7f8fd;color:#1d2640;border-radius:14px;padding:12px 16px;border-left:5px solid var(--pri)}
.cond b{color:#3b4fd8}
.intro{font-size:13.5px;color:var(--mut);margin-top:6px}
.intro summary{cursor:pointer;font-weight:700}
.ans{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bg);border-radius:14px;padding:10px 12px}
.ans .inp{width:150px;font:700 17px Consolas,monospace;background:var(--card)}
.fb{border-radius:12px;padding:10px 14px;font-weight:700;display:none}
.fb.show{display:block}.fb.good{background:#dff6ea;color:#0f7a4d}.fb.bad{background:#ffe3e3;color:#c0262c}.fb.inf{background:#eef1ff;color:#3b4fd8}
[data-theme=dark] .fb.good{background:#12452f;color:#9ff0c6}[data-theme=dark] .fb.bad{background:#4a1518;color:#ffb0b3}[data-theme=dark] .fb.inf{background:#232a4a;color:#c3ccff}
.hcard{border-radius:14px;padding:10px 14px;background:#fff8e1;border-left:5px solid var(--warn);font-size:14.5px;margin-top:8px}
[data-theme=dark] .hcard{background:#2e2710}
.hcard.trap{background:#ffeef0;border-left-color:var(--err)}[data-theme=dark] .hcard.trap{background:#3b1518}
.solcard{border-radius:16px;padding:12px 16px;background:linear-gradient(135deg,#eef1ff,#f6efff);border:1.5px solid #c9d1ff;margin-top:10px}
[data-theme=dark] .solcard{background:linear-gradient(135deg,#1f2546,#29204a);border-color:#3a447a}
.solcard ol{margin:6px 0 4px 20px;padding:0}.solcard li{margin:3px 0}
.solcard .fx{display:inline-block;background:var(--code);color:#c3e88d;border-radius:8px;padding:3px 10px;font:700 14px Consolas,monospace;margin:4px 0}
.solcard .big{font-size:22px;font-weight:900;color:var(--pri)}
/* шаги */
.steps{display:flex;gap:4px;overflow-x:auto;padding:2px 2px 6px;align-items:stretch}
.step{display:flex;align-items:stretch;border-radius:12px;background:var(--bg);min-width:0;flex:0 0 auto;box-shadow:0 0 0 1.5px var(--line) inset}
.step .go{border:0;background:transparent;display:flex;align-items:center;gap:6px;padding:6px 8px 6px 7px;font-weight:700;font-size:12.5px;text-align:left;max-width:150px;line-height:1.15}
.step .n{flex:0 0 22px;height:22px;border-radius:50%;display:grid;place-items:center;font:800 12px Consolas,monospace;background:var(--card);color:var(--mut);box-shadow:0 0 0 1.5px var(--line) inset}
.step .eye{border:0;background:transparent;border-left:1.5px solid var(--line);padding:0 8px;font-size:16px;opacity:.85}
.step .eye:hover{background:rgba(79,107,255,.12)}
.step.done{background:#e3f6ec;box-shadow:0 0 0 1.5px #9fdcbc inset}.step.done .n{background:var(--ok);color:#fff;box-shadow:none}
.step.cur{box-shadow:0 0 0 2.5px var(--pri) inset}.step.cur .n{background:var(--pri);color:#fff}
.step.opt{opacity:.62}
[data-theme=dark] .step{background:#1f2640}[data-theme=dark] .step.done{background:#16382a}
.stepinfo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px;margin:2px 2px 4px}
.stepinfo b{font-size:14.5px}
.fchip{display:inline-flex;align-items:center;gap:6px;background:var(--code);color:#c3e88d;border-radius:8px;padding:3px 10px;font:700 13px Consolas,monospace}
.fchip button{border:0;background:#2a3358;color:#cfd7ff;border-radius:6px;font-size:11px;padding:2px 6px}
/* рабочая книга */
.wb{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.wbbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs3{display:flex;gap:4px}
.tabs3 button{border:0;border-radius:10px 10px 0 0;padding:7px 12px;font-weight:800;background:var(--bg);color:var(--mut);border-bottom:3px solid transparent}
.tabs3 button.on{background:var(--card);color:var(--ink);border-bottom-color:#217346;box-shadow:0 -1px 0 1.5px var(--line) inset}
.zoom{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut);font-weight:700}
.zoom input{accent-color:#217346;width:130px}
.fxbar{display:flex;gap:0;align-items:stretch;border:1px solid var(--xl-grid);border-radius:6px;overflow:hidden;background:var(--xl-cell);font:13px Consolas,monospace;color:var(--xl-ink)}
.fxbar .nb{width:110px;border:0;border-right:1px solid var(--xl-grid);padding:4px 8px;background:var(--xl-cell);color:var(--xl-ink);font:700 13px Consolas,monospace;outline:none}
.fxbar .fx{padding:4px 10px;border-right:1px solid var(--xl-grid);color:#7a7a7a;font-style:italic;font-weight:700}
.fxbar .fv{flex:1;padding:4px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ref0{color:#1f6fd9}.ref1{color:#c0262c}.ref2{color:#7b3fd1}.ref3{color:#0f8a55}
.sheetwrap{position:relative;overflow:auto;max-height:calc(100vh - 330px);min-height:240px;border:1px solid var(--xl-grid);border-radius:6px;background:var(--xl-cell);outline:none}
.sheetwrap:focus{box-shadow:0 0 0 2px rgba(33,115,70,.35)}
.xl{border-collapse:separate;border-spacing:0;font:13.5px/1.2 Calibri,"Segoe UI",Arial,sans-serif;color:var(--xl-ink);table-layout:fixed;user-select:none}
.xl th,.xl td{border-right:1px solid var(--xl-grid);border-bottom:1px solid var(--xl-grid);height:24px;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:clip;background:var(--xl-cell)}
.xl thead th{position:sticky;top:0;z-index:3;background:var(--xl-head);color:#555;font:12px Calibri,"Segoe UI",Arial;text-align:center;cursor:s-resize}
[data-theme=dark] .xl thead th{color:#aab3d0}
.xl tbody th{position:sticky;left:0;z-index:2;background:var(--xl-head);color:#555;font:12px Calibri,Arial;text-align:center;cursor:e-resize;width:38px;min-width:38px}
[data-theme=dark] .xl tbody th{color:#aab3d0}
.xl thead th.corner{left:0;z-index:4;cursor:se-resize}
.xl th.hs{background:var(--xl-headsel);color:#0b5a32;font-weight:700;border-bottom-color:#217346}
.xl tbody th.hs{border-right:2px solid #217346}
.xl th.hf{background:var(--xl-headfull)!important;color:#fff!important}
.xl th.hov{box-shadow:inset 0 0 0 9px rgba(79,107,255,.12)}
.xl td{cursor:cell;text-align:right}
.xl td.t{text-align:left}.xl td.c{text-align:center}
.xl td.hd{font-weight:700;text-align:center;background:#f2f5fb;color:#30385a}
[data-theme=dark] .xl td.hd{background:#1d2440;color:#cfd6f3}
.xl td.sel{background-image:linear-gradient(var(--xl-sel),var(--xl-sel))}
.xl td.act{box-shadow:inset 0 0 0 2px var(--xl-act);background-image:none!important}
.xl.bord td{border-right:1px solid #222;border-bottom:1px solid #222}
[data-theme=dark] .xl.bord td{border-color:#b7c0e0}
.xl td.dep{background:#ffe6c7}.xl td.help{background:#eef3ff}.xl td.st{background:#e4f7ec}.xl td.en{background:#fde9ef}.xl td.shc{background:#fff6c9;font-weight:800;color:#8a6400}
[data-theme=dark] .xl td.dep{background:#4a3417}[data-theme=dark] .xl td.help{background:#1f2a4a}[data-theme=dark] .xl td.st{background:#173d2c}[data-theme=dark] .xl td.en{background:#46202c}[data-theme=dark] .xl td.shc{background:#433a10;color:#ffe08a}
.xl td.edit{cursor:text}
.xl td.edit:hover{outline:1px dashed #b58900;outline-offset:-3px}
.xl td.svc{background:#ffe066!important;font-weight:800}
.xl td.unk{background:#ffef9e!important;color:#9a3d00;font-weight:900}
.xl td.zero{color:#9aa2b8}
.xl td.mk{background:#c9f2db!important;font-weight:800}
[data-theme=dark] .xl td.mk{background:#1d5a3c!important}
.xl td.mk2{background:#ffd9a8!important;font-weight:800}
.xl td.g{padding:0;text-align:center;font:700 12px Consolas,monospace;color:#fff}
.xl td.g.on{text-shadow:0 1px 1px rgba(0,0,0,.35)}
.xl td.g.off{color:transparent}
.xl td.sum{background:#eef1ff;font-weight:800;text-align:center;color:#3b4fd8}
[data-theme=dark] .xl td.sum{background:#232a4a;color:#c3ccff}
.xl td.sum.top{background:#ffd666;color:#1d2640}
.xl td.colhl{box-shadow:inset 2px 0 0 #ff7a00,inset -2px 0 0 #ff7a00}
.xl td.band{background-image:linear-gradient(rgba(255,170,0,.22),rgba(255,170,0,.22))}
.xl td.refc0{box-shadow:inset 0 0 0 2px #1f6fd9}.xl td.refc1{box-shadow:inset 0 0 0 2px #c0262c}.xl td.refc2{box-shadow:inset 0 0 0 2px #7b3fd1}.xl td.refc3{box-shadow:inset 0 0 0 2px #0f8a55}
.selbox{position:absolute;border:2px solid var(--xl-act);pointer-events:none;z-index:5;display:none}
.selbox i{position:absolute;right:-5px;bottom:-5px;width:7px;height:7px;background:var(--xl-act);border:1px solid #fff}
.cedit{position:absolute;z-index:8;border:2px solid var(--xl-act);font:700 13.5px Calibri,Arial;padding:0 4px;outline:none;background:var(--xl-cell);color:var(--xl-ink)}
.status{display:flex;justify-content:flex-end;gap:18px;font-size:12.5px;color:var(--mut);padding:2px 6px;min-height:20px}
.status b{color:var(--ink)}
/* диаграмма */
.chartwrap{position:relative;overflow:auto;max-height:calc(100vh - 330px);min-height:260px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.chart{position:relative}
.ch-ruler{position:sticky;top:0;z-index:6;height:26px;background:var(--card);border-bottom:1px solid var(--line)}
.ch-ruler span{position:absolute;top:5px;text-align:center;font:11px Consolas,monospace;color:var(--mut)}
.ch-ruler span.f5{color:var(--ink);font-weight:700}
.ch-lab{position:sticky;left:0;z-index:5;background:var(--card);border-right:1px solid var(--line);font:700 12.5px Consolas,monospace;display:flex;align-items:center;padding:0 8px;white-space:nowrap;cursor:pointer}
.ch-lab.sel{background:#eef1ff}[data-theme=dark] .ch-lab.sel{background:#232a4a}
.ch-lab small{color:var(--mut);font-weight:400;margin-left:6px}
.ch-grid{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);opacity:.55}
.ch-grid.f5{opacity:1}
.bar{position:absolute;z-index:3;border-radius:7px;color:#fff;font:800 12px/1 "Segoe UI",Arial;display:flex;align-items:center;padding:0 6px;white-space:nowrap;overflow:hidden;cursor:grab;box-shadow:0 2px 6px rgba(0,0,0,.18);touch-action:none;transition:left .45s ease}
.bar.drag{cursor:grabbing;transition:none;box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:4}
.bar.sel{outline:3px solid #1d2640;outline-offset:1px}[data-theme=dark] .bar.sel{outline-color:#fff}
.bar.crit{box-shadow:0 0 0 2px #e5484d,0 2px 6px rgba(0,0,0,.18)}
.bar.dim{opacity:.35}
.bar small{font-weight:600;opacity:.9;margin-left:5px}
.res{position:absolute;border-radius:7px;border:1.5px dashed rgba(100,110,150,.6);background:repeating-linear-gradient(45deg,rgba(120,130,170,.10) 0 6px,transparent 6px 12px)}
.win{position:absolute;top:0;bottom:0;background:rgba(255,190,0,.18);border-left:2px solid #ff9800;border-right:2px solid #ff9800;pointer-events:none;z-index:1}
.win b{position:absolute;top:28px;left:4px;background:#ff9800;color:#fff;font:800 11px Consolas,monospace;border-radius:5px;padding:1px 5px;white-space:nowrap}
.tline{position:absolute;top:0;bottom:0;border-left:2px dashed #e5484d;z-index:2;pointer-events:none}
.tline b{position:absolute;top:2px;left:3px;background:#e5484d;color:#fff;font:800 11px Consolas,monospace;border-radius:5px;padding:1px 5px;white-space:nowrap}
.mark{position:absolute;top:0;bottom:0;width:0;border-left:2px solid #2f80ed;z-index:7;cursor:ew-resize}
.mark::before{content:attr(data-l);position:absolute;top:2px;left:-11px;background:#2f80ed;color:#fff;font:800 11px Consolas,monospace;border-radius:5px;padding:1px 5px}
.mark.b{border-color:#9b51e0}.mark.b::before{background:#9b51e0}

nd": "Определите количество процессов, минимальное время выполнения которых является чётным числом.", "data": "ID\tВремя (мс)\tЗависимости\n1\t14\t14;10\n2\t9\t0\n3\t8\t2\n4\t15\t5;9\n5\t11\t0\n6\t10\t12;9\n7\t12\t2\n8\t14\t7\n9\t7\t11;8\n10\t5\t3;8\n11\t12\t3;8\n12\t5\t10;7\n13\t15\t0\n14\t6\t8;20\n15\t9\t17\n16\t9\t12;14\n17\t15\t0\n18\t6\t0\n19\t2\t11;7\n20\t4\t0", "answer": "7", "native": false, "auto": true, "trap": "Минимальное время выполнения процесса — это его Конец (с учётом ожидания предков), а не его длительность из столбца B."}, {"num": 22, "kid": "6795", "sim": false, "src": "", "author": "PRO100 ЕГЭ", "lvl": 1, "kind": "endOf", "params": {"id": 7}, "cond": "Определите минимальное время, через которое может завершиться выполнение процесса с ID = 7, при условии, что все независимые друг от друга процессы могут выполняться параллельно.", "data": "ID\tВремя (мс)\tЗависимости\n1\t8\t0\n2\t27\t0\n3\t15\t0\n4\t22\t7\n5\t26\t15\n6\t27\t5;11\n7\t24\t1;5\n8\t13\t0\n9\t19\t11;8\n10\t30\t8;2\n11\t25\t1\n12\t19\t6\n13\t9\t4\n14\t21\t11\n15\t11\t0", "answer": "61", "native": false, "auto": true, "trap": "Нужен Конец одного процесса, а не время всей совокупности."}, {"num": 23, "kid": "4792", "sim": false, "src": "", "author": "Л. Шастин", "lvl": 1, "kind": "twoModes", "params": {}, "cond": "Эта группа процессов выполняется дважды при различных условиях: 1) все процессы считаются независимыми и выполняются параллельно; 2) независимые процессы выполняются параллельно, а зависимые — последовательно. Определите, на сколько миллисекунд один режим быстрее другого.", "data": "ID\tВремя (мс)\tЗависимости\n1\t9\t5\n2\t19\t4\n3\t6\t13;6\n4\t13\t8\n5\t20\t3\n6\t9\t12\n7\t18\t13;3\n8\t16\t12;15\n9\t13\t5;12\n10\t16\t4\n11\t3\t8;7\n12\t11\t0\n13\t18\t12;6\n14\t18\t4;15\n15\t16\t0", "answer": "57", "native": false, "auto": true, "trap": "Без зависимостей всё идёт параллельно — время равно самой большой длительности, а не сумме."}, {"num": 24, "kid": "21992", "sim": false, "src": "", "author": "Л. Шастин", "lvl": 1, "kind": "unknownMax", "params": {"id": 9, "total": 2025}, "cond": "Время выполнения процесса с ID = 9 обозначено за T (T — натуральное число). Известно, что выполнение всей совокупности процессов (при условии того, что все независимые друг от друга процессы могут выполняться параллельно) завершилось за 2025 мс. Определите максимально возможное значение T.", "data": "ID\tВремя (мс)\tЗависимости\n1\t88\t4\n2\t258\t9\n3\t74\t5;4\n4\t317\t0\n5\t114\t0\n6\t130\t4\n7\t93\t12\n8\t85\t7;12\n9\tT\t0\n10\t110\t7\n11\t160\t0\n12\t167\t4\n13\t298\t11\n14\t398\t0\n15\t367\t13", "answer": "1767", "native": false, "auto": true, "trap": "Подбирайте T в ячейке и следите за МАКС(Конец). Ищем максимальное T, при котором всё ещё ровно 2025."}, {"num": 25, "kid": "7721", "sim": false, "src": "", "author": "Грачев Н.", "lvl": 1, "kind": "unknownMin", "params": {"id": 7, "total": 19}, "cond": "Время работы одного из процессов неизвестно и обозначено буквой t. Определите минимальное значение t, если известно, что минимально возможное время выполнения всей совокупности равно 19 мс.", "data": "ID\tВремя (мс)\tЗависимости\n1\t3\t7\n2\t1\t7\n3\t1\t6\n4\t2\t0\n5\t4\t7\n6\t5\t0\n7\tt\t6\n8\t1\t4;2", "answer": "10", "native": false, "auto": true, "trap": "Пока t мало, общее время не меняется. Нужно минимальное t, при котором общее время становится ровно 19."}, {"num": 26, "kid": "5079", "sim": false, "src": "", "author": "", "lvl": 1, "kind": "lostDep", "params": {"id": 18, "total": 158}, "cond": "При составлении таблицы была потеряна информация, после какого процесса начался процесс ID = 18 (в таблице — «?»). Однако известно, что вся совокупность процессов завершилась за минимальное время 158 мс. Определите ID процесса, после которого начался процесс с ID = 18. В ответе укажите только число.", "data": "ID\tВремя (мс)\tЗависимости\n1\t20\t18;7\n2\t29\t0\n3\t23\t4;11\n4\t28\t11\n5\t21\t7;17\n6\t30\t19\n7\t17\t4;2\n8\t8\t16;11\n9\t8\t8\n10\t14\t5\n11\t21\t0\n12\t5\t5;7\n13\t22\t0\n14\t7\t3;9\n15\t29\t7\n16\t22\t11\n17\t30\t0\n18\t38\t?\n19\t5\t15\n20\t11\t9", "answer": "19", "native": false, "auto": true, "trap": "Подставляйте разные ID в зависимость процесса 18. Не берите потомков процесса 18 — получится цикл."}, {"num": 27, "kid": "9375", "sim": false, "src": "Джобс 10.06.23", "author": "", "lvl": 1, "kind": "delay", "params": {"total": 300}, "cond": "Известно, что при запуске описанной совокупности процессов произошла задержка, то есть все процессы начали выполняться не раньше, чем через X мс, при этом вся совокупность процессов завершилась через 300 мс после запуска. Определите максимально допустимое время задержки X.", "data": "ID\tВремя (мс)\tЗависимости\n1\t41\t9;8\n2\t52\t11;15\n3\t48\t15;6\n4\t44\t17\n5\t49\t3;12\n6\t45\t0\n7\t43\t0\n8\t13\t2\n9\t13\t12;13\n10\t33\t18;15\n11\t22\t0\n12\t49\t0\n13\t55\t7;19\n14\t16\t8\n15\t23\t19\n16\t42\t12\n17\t56\t0\n18\t34\t19\n19\t46\t11\n20\t60\t10", "answer": "103", "native": false, "auto": true, "trap": "Задержка сдвигает весь график: X = 300 − (минимальное время совокупности)."}, {"num": 28, "kid": "5684", "sim": false, "src": "", "author": "", "lvl": 1, "kind": "minEndAfter", "params": {"T": 90}, "cond": "Независимые процессы (не имеющие поставщиков данных) можно запускать в любой момент времени. Если процесс B получает данные от процесса A, то процесс B может начать выполнение сразу же после завершения процесса A. Определите, какое наименьшее количество процессов может завершить свою работу после 90 мс с момента запуска первого процесса при условии, что все процессы должны быть выполнены.", "data": "ID\tВремя (мс)\tЗависимости\n1\t24\t12\n2\t24\t5;19\n3\t5\t5\n4\t17\t7;8\n5\t21\t19\n6\t5\t0\n7\t25\t0\n8\t25\t15\n9\t7\t8;2\n10\t18\t14;9\n11\t23\t6\n12\t10\t13;20\n13\t6\t8\n14\t23\t4\n15\t9\t19;5\n16\t11\t13\n17\t8\t13\n18\t10\t0\n19\t6\t0\n20\t9\t19;18", "answer": "3", "native": false, "auto": true, "trap": "«Наименьшее количество» — значит всё запускаем как можно раньше   if (/один режим быстрее/.test(t)) return ['twoModes', {}];

  if (/максимально возможное (целочисленное )?(значение )?[tT]\b|максимальное значение t/i.test(t)) { const id = m(/процесса с ID ?= ?(\d+)/), tot = m(/за (\d+) мс/); return ['unknownMax', {id: id ? n(id[1]) : 0, total: tot ? n(tot[1]) : 0}]; }

  if ((r = m(/минимальное количество процессов, которые могут начать выполняться в течени\S* первых (\d+)/))) return ['minStartWithin', {t: n(r[1])}];

  }

  if ((r = m(/(?:параллельно выполняются|выполняются|выполняемых процессов) на (\d+)/))) return ['atMs', {t: n(r[1])}];
  if ((r = m(/начнутся не ранее (\d+)-й мс и при этом завершатся не позднее (\d+)/))) return ['window', {a: n(r[1]), b: n(r[2])}];

function normTask(x, i) {
  x = Object.assign({}, x);

  if (x.condition != null && x.cond == null) x.cond = x.condition;
  if (x.text && !x.data) x.data = x.text;
  x.num = Number(x.num) || (i + 1);
  x.cond = String(x.cond || ''); x.data = String(x.data || '');
  if (!x.kind) { const d = detectKind(x.cond); x.kind = d[0]; x.params = d[1]; }
  x.params = x.params || {};
  if (x.lvl == null) x.lvl = guessLevel(x.kind);
  x.answer = x.answer == null ? '' : String(x.answer);
  if (x.native == null) x.native = true;
  if (x.auto == null) x.auto = !x.answer;

  Object.values(d.students).forEach(s => {
    Object.keys(s.tasks).forEach(n => { const x = s.tasks[n];
      if (x.wrong && x.wrong.length > 8) x.wrong = x.wrong.slice(-8);
      if (x.t) x.t = Math.round(x.t / 1000) * 1000;
      if (x.st === 'new' && !x.wrong.length && !x.tries && !x.hint && !x.shifts && !x.steps) { delete s.tasks[n]; return; } });
    if (s.days.length > 90) s.days = s.days.slice(-90);

}
