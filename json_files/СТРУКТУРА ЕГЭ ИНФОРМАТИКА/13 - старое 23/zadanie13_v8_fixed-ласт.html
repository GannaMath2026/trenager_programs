  #print-host { display:none; }
  .print-code { background:#0b1220 !important; color:#f1f5f9 !important; border:1px solid #334155 !important; border-radius:7px; padding:3.5mm; font-family:Consolas,'Courier New',monospace; font-size:9pt; line-height:1.35; white-space:pre; overflow:auto; overflow-wrap:normal; tab-size:4; -webkit-print-color-adjust:exact; print-color-adjust:exact; }

<script>
/* ============================================================
   СТРУКТУРА ДАННЫХ
   ============================================================
   Тема → массив задач.
   Каждая задача:
     id       — номер
     title    — короткое название
     desc     — HTML-описание (строки через <span class="line">)
     answer   — ответ (строка)
     code     — массив строк кода
     notes    — массив строк «особенности»
     codelines— массив {line, comment} для режима «Код с комментами»
     tags     — {done, fav, dz} начальные значения (по желанию)
     comment  — стартовый комментарий пользователя
   ============================================================ */

const THEMES = [
  {
    id: 'level1',
    name: 'УРОВЕНЬ 1 — базовые',
    tasks: [
      {
        id: '18125',
        title: 'Извлечь целый корень',
        desc: `<span class="line"><b>A.</b> Вычесть 4</span>
               <span class="line"><b>B.</b> Вычесть 7</span>
               <span class="line"><b>C.</b> Извлечь целый корень</span>
               <span class="line">Сколько существует программ, для которых при исходном числе 44 результатом является число 3 и при этом траектория вычислений содержит число 22?</span>`,
        answer: '54',
        code: [
          'def f(n, t):',
          '    usl = (22 in t)',
          '    if n == 3 and usl: return 1',
          '    if n == 3 and not usl: return 0',
          '    if n < 3: return 0',
          '    rez = 0',
          '    rez += f(n - 4, t + [n - 4])',
          '    rez += f(n - 7, t + [n - 7])',
          '    rez += f(int(n ** 0.5), t + [int(n ** 0.5)])',
          '    return rez',
          '',
          'print(f(44, [44]))'
        ],
        notes: [
          'Траектория передаётся списком t, в ней накапливаются посещённые числа.',
          'Команда C — целая часть квадратного корня: int(n ** 0.5).',
          'Отсечение n < 3 — все команды уменьшают число.',
          'Условие usl проверяется на финише: 22 должно быть в траектории.'
        ],
        codelines: [
          {line:'def f(n, t):', comment:'функция: n — текущее число, t — траектория'},
          {line:'    usl = (22 in t)', comment:'условие: 22 встречалось в траектории'},
          {line:'    if n == 3 and usl: return 1', comment:'финиш + условие выполнено'},
          {line:'    if n == 3 and not usl: return 0', comment:'финиш, но условия нет'},
          {line:'    if n < 3: return 0', comment:'промахнулись ниже финиша'},
          {line:'    rez = 0', comment:'счётчик программ'},
          {line:'    rez += f(n - 4, t + [n - 4])', comment:'команда A: −4'},
          {line:'    rez += f(n - 7, t + [n - 7])', comment:'команда B: −7'},
          {line:'    rez += f(int(n ** 0.5), t + [int(n ** 0.5)])', comment:'команда C: целый корень'},
          {line:'    return rez', comment:'возвращаем сумму'},
          {line:'', comment:''},
          {line:'print(f(44, [44]))', comment:'старт 44, траектория начинается с [44]'}
        ]
      },
      {
        id: '3612',
        title: 'Дописать справа 1',
        desc: `<span class="line"><b>1.</b> Прибавить 2</span>
               <span class="line"><b>2.</b> Прибавить 3</span>
               <span class="line"><b>3.</b> Дописать справа 1 (= умножить на 10 и прибавить 1)</span>
               <span class="line">Сколько существует программ, которые число 3 преобразуют в 25, траектория содержит 12?</span>`,
        answer: '80',
        code: [
          'def f(n, t):',
          '    usl = (12 in t)',
          '    if n == 25 and usl: return 1',
          '    if n == 25 and not usl: return 0',
          '    if n > 25: return 0',
          '    rez = 0',
          '    rez += f(n + 2, t + [n])',
          '    rez += f(n + 3, t + [n])',
          '    rez += f(n * 10 + 1, t + [n])',
          '    return rez',
          '',
          'print(f(3, []))'
        ],
        notes: [
          '«Дописать справа 1» = n * 10 + 1.',
          'Все команды увеличивают число, отсечка n > 25.',
          'В t добавляем текущее n — так фиксируются все посещённые числа.'
        ],
        codelines: [
          {line:'def f(n, t):', comment:'n — число, t — траектория'},
          {line:'    usl = (12 in t)', comment:'условие: были в 12'},
          {line:'    if n == 25 and usl: return 1', comment:'финиш + условие'},
          {line:'    if n == 25 and not usl: return 0', comment:'финиш без условия'},
          {line:'    if n > 25: return 0', comment:'перепрыгнули финиш'},
          {line:'    rez = 0', comment:'счётчик'},

const STATE_KEY = 'task13_state_v3';
const OLD_STATE_KEYS = ['task16_state_v1','task23_state_v1','task23_state_v2','task13_state_v2'];
const STUDENTS_KEY = 'task13_students_v1';
const CURRENT_STUDENT_KEY = 'task13_current_student_v1';
let STATE = {};
let STUDENTS = [];
let CURRENT_STUDENT_ID = '';
let EDITED_TASKS = {};
let APP_MODE = 'student';
const EDITS_KEY = 'task13_edited_tasks_v8';
const OLD_EDITS_KEYS = ['task13_edited_tasks_v7','task13_edited_tasks_v6','task13_edited_tasks_v5'];
const MODE_KEY = 'task13_mode_v5';

function defaultStudentState(){ return {}; }
function makeStudentId(){ return 'st_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7); }
function normalizeStudents(){
  if (!Array.isArray(STUDENTS) || !STUDENTS.length) {
    STUDENTS = [{id:'student_default', name:'Ученик 1'}];
  }
  if (!CURRENT_STUDENT_ID || !STUDENTS.some(x=>x.id===CURRENT_STUDENT_ID)) CURRENT_STUDENT_ID=STUDENTS[0].id;
}
function currentStudent(){ return STUDENTS.find(x=>x.id===CURRENT_STUDENT_ID) || STUDENTS[0]; }
function loadState() {
  try {
    let raw = localStorage.getItem(STATE_KEY);
    let oldRaw = null;
    if (!raw) {
      for (const key of OLD_STATE_KEYS) { oldRaw = localStorage.getItem(key); if (oldRaw) break; }
    }
    const studentRaw = localStorage.getItem(STUDENTS_KEY);
    STUDENTS = studentRaw ? JSON.parse(studentRaw) : [];
    normalizeStudents();
    const currentRaw = localStorage.getItem(CURRENT_STUDENT_KEY);
    CURRENT_STUDENT_ID = currentRaw || STUDENTS[0].id;
    let loaded = raw ? JSON.parse(raw) : (oldRaw ? JSON.parse(oldRaw) : {});
    // Старый общий прогресс переносим первому ученику один раз.
    if (loaded && !loaded.__perStudent && !STUDENTS[0].migrated) {
      STATE = loaded || {};
      STUDENTS[0].migrated = true;
    } else {
      STATE = loaded && loaded.__perStudent ? (loaded.byStudent?.[CURRENT_STUDENT_ID] || {}) : (loaded || {});
    }
    const eraw = localStorage.getItem(EDITS_KEY) || localStorage.getItem(OLD_EDITS_KEYS[0]) || localStorage.getItem(OLD_EDITS_KEYS[1]);
    EDITED_TASKS = eraw ? JSON.parse(eraw) : {};
    APP_MODE = localStorage.getItem(MODE_KEY) === 'teacher' ? 'teacher' : 'student';
    // Новая схема хранит отдельный прогресс каждого ученика.
    const perStudentRaw = localStorage.getItem(STATE_KEY + '_students');
    if (perStudentRaw) {
      const obj = JSON.parse(perStudentRaw);
      STATE = obj[CURRENT_STUDENT_ID] || {};
    }
    saveState();
  } catch (e) { STUDENTS=[{id:'student_default',name:'Ученик 1'}]; CURRENT_STUDENT_ID=STUDENTS[0].id; STATE = {}; EDITED_TASKS = {}; APP_MODE='student'; }
}
function saveState() {
  try {
    normalizeStudents();
    const perKey = STATE_KEY + '_students';
    let all = {};
    try { all = JSON.parse(localStorage.getItem(perKey) || '{}'); } catch(e) { all={}; }
    all[CURRENT_STUDENT_ID] = STATE;
    localStorage.setItem(perKey, JSON.stringify(all));
    localStorage.setItem(STATE_KEY, JSON.stringify({__perStudent:true,byStudent:all}));
    localStorage.setItem(STUDENTS_KEY, JSON.stringify(STUDENTS));
    localStorage.setItem(CURRENT_STUDENT_KEY, CURRENT_STUDENT_ID);
    localStorage.setItem(EDITS_KEY, JSON.stringify(EDITED_TASKS));
    localStorage.setItem(MODE_KEY, APP_MODE);
  } catch (e) {}
}
function switchStudent(id){
  if (!STUDENTS.some(x=>x.id===id)) return;
  saveState();
  CURRENT_STUDENT_ID=id;
  let all={}; try { all=JSON.parse(localStorage.getItem(STATE_KEY+'_students')||'{}'); } catch(e){}
  STATE=all[id]||{};
  localStorage.setItem(CURRENT_STUDENT_KEY,id);
  renderStudentSelector(); renderMain(); updatePrintCount();
}
function addStudent(){
  const name=prompt('Имя ученика:');
  if(!name || !name.trim()) return;
  const st={id:makeStudentId(),name:name.trim()};
  saveState(); STUDENTS.push(st); CURRENT_STUDENT_ID=st.id; STATE={}; saveState();
  renderStudentSelector(); renderMain(); updatePrintCount();
}
function removeStudent(){
  if(STUDENTS.length<=1){ alert('Должен остаться хотя бы один ученик.'); return; }
  const st=currentStudent();
  if(!confirm('Удалить ученика «'+st.name+'» вместе с его прогрессом?')) return;
  let all={}; try { all=JSON.parse(localStorage.getItem(STATE_KEY+'_students')||'{}'); } catch(e){}
  delete all[st.id];
  STUDENTS=STUDENTS.filter(x=>x.id!==st.id); CURRENT_STUDENT_ID=STUDENTS[0].id; STATE=all[CURRENT_STUDENT_ID]||{};
  localStorage.setItem(STATE_KEY+'_students',JSON.stringify(all)); saveState();
  renderStudentSelector(); renderMain(); updatePrintCount();
}
function renderStudentSelector(){
  const sel=document.getElementById('student-select'); if(!sel) return;
  normalizeStudents(); sel.innerHTML=STUDENTS.map(st=>'<option value="'+escapeHtml(st.id)+'">'+escapeHtml(st.name)+'</option>').join(''); sel.value=CURRENT_STUDENT_ID;
  const name=document.getElementById('current-student-name'); if(name) name.textContent='Прогресс: '+currentStudent().name;
}
function effectiveTask(task) {
  const e=EDITED_TASKS[task.id];
  if(!e) return task;
  const merged=Object.assign({}, task, e);
  // Старые редакторские записи с пустыми codelines не должны стирать исходные комментарии.
  const sourceHasComments = Array.isArray(task.codelines) && task.codelines.some(r => r && r.comment);
  const editedHasComments = Array.isArray(e.codelines) && e.codelines.some(r => r && r.comment);
  // Если старая запись редактора содержит только строки кода без комментариев,
  // сохраняем исходные комментарии задачи — переключение режима их не стирает.
  if (sourceHasComments && !editedHasComments) merged.codelines = task.codelines;
  if ((!e.code || !e.code.length) && task.code && task.code.length) merged.code=task.code;
  return merged;
}
function setMode(mode) {
  APP_MODE = mode === 'teacher' ? 'teacher' : 'student';
  document.body.classList.toggle('teacher-mode', APP_MODE === 'teacher');
  document.getElementById('mode-student').classList.toggle('active', APP_MODE === 'student');
  document.getElementById('mode-teacher').classList.toggle('active', APP_MODE === 'teacher');
  document.querySelector('.print-tools').style.display = APP_MODE === 'teacher' ? '' : 'none';
  saveState(); renderStudentSelector(); renderMain(); updatePrintCount();
}
function getTaskState(id) {
  if (!STATE[id]) STATE[id] = {done:false, fav:false, dz:false, comment:''};
  return STATE[id];
}

/* ============================================================
   ФИЛЬТРЫ
   ============================================================ */
let FILTER = {done:false, fav:false, dz:false, search:''};

function matchesFilter(task) {
  const st = getTaskState(task.id);
  if (FILTER.done && !st.done) return false;
  if (FILTER.fav  && !st.fav)  return false;
  if (FILTER.dz   && !st.dz)   return false;
  if (FILTER.search) {
    const q = FILTER.search.toLowerCase();
    const hay = (task.id + ' ' + task.title + ' ' + task.desc + ' ' + task.answer + ' ' + (st.comment||'')).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

/* ============================================================
   РЕНДЕР
   ============================================================ */
function renderTOC() {
  const toc = document.getElementById('toc');
  toc.innerHTML = '';
  THEMES.forEach(theme => {
    const total = theme.tasks.length;
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = '#theme-' + theme.id;
    a.innerHTML = theme.name + ' <span class="cnt">(' + total + ')</span>';
    a.dataset.theme = theme.id;
    li.appendChild(a);
    toc.appendChild(li);
  });
}

function renderMain() {
  const main = document.getElementById('main');
  main.innerHTML = '';

  let total = 0;
  let shown = 0;

  THEMES.forEach(theme => {
    const h = document.createElement('h2');
    h.className = 'section-title';
    h.id = 'theme-' + theme.id;
    h.textContent = theme.name + ' — ' + theme.tasks.length + ' задач';
    main.appendChild(h);

    theme.tasks.forEach(task => {
      total++;
      const card = buildTaskCard(task);
      const visible = matchesFilter(task);
      if (!visible) card.style.display = 'none';
      else shown++;
      main.appendChild(card);
    });
  });

  const count = document.getElementById('screen-task-count');
  if (count) count.textContent = 'На экране: ' + shown + ' из ' + total + ' задач';

  // Если фильтр дал 0 результатов, показываем понятное сообщение,
  // но сами данные задач не удаляем из DOM.
  let empty = document.getElementById('no-tasks-message');
  if (!shown && (FILTER.done || FILTER.fav || FILTER.dz || FILTER.search)) {
    empty = empty || document.createElement('div');
    empty.id = 'no-tasks-message';
    empty.className = 'empty-screen-message';
    empty.textContent = 'По выбранному фильтру задач нет. Нажмите «Показать все задачи».';
    main.insertBefore(empty, main.firstChild);
  } else if (empty) {
    empty.remove();
  }
}

function buildTaskCard(task) {
  task = effectiveTask(task);
  const st = getTaskState(task.id);
  const card = document.createElement('div');
  card.className = 'task';
  card.dataset.id = task.id;
  updateCardClasses(card, st);

  // заголовок
  const head = document.createElement('div');
  head.className = 'task-head';

  const idEl = document.createElement('span');
  idEl.className = 'task-id';
  idEl.textContent = '№ ' + task.id;

  const titleEl = document.createElement('span');
  titleEl.className = 'task-title';
  titleEl.textContent = task.title;

  const badges = document.createElement('div');
  badges.className = 'badges';

  ['done','fav','dz'].forEach(k => {
    const b = document.createElement('span');
    b.className = 'badge ' + k + (st[k] ? '' : ' off');
    b.textContent = k === 'done' ? '✓ Решено' : k === 'fav' ? '★ Избранное' : 'ДЗ';
    b.onclick = () => {
      st[k] = !st[k];
      saveState();
      updateCardClasses(card, st);
      b.classList.toggle('off', !st[k]);
    };
    badges.appendChild(b);
  });

  head.appendChild(idEl);
  head.appendChild(titleEl);
  head.appendChild(badges);
  card.appendChild(head);

  // описание
  const desc = document.createElement('div');
  desc.className = 'task-desc';
  desc.innerHTML = task.desc;
  card.appendChild(desc);

  // ответ
  if (task.answer) {
    const ans = document.createElement('div');
    ans.className = 'task-answer';
    ans.textContent = 'Ответ: ' + task.answer;
    card.appendChild(ans);
  }

  // действия
  const actions = document.createElement('div');
  actions.className = 'task-actions';

  const pyBtn = document.createElement('button');
  pyBtn.className = 'abtn py';
  pyBtn.textContent = 'Python';
  actions.appendChild(pyBtn);

  const notesBtn = document.createElement('button');
  notesBtn.className = 'abtn notes';
  notesBtn.textContent = 'Подробнее';
  actions.appendChild(notesBtn);

  const cmtBtn = document.createElement('button');
  cmtBtn.className = 'abtn cmt';
  cmtBtn.textContent = 'Код с комментами';
  actions.appendChild(cmtBtn);

  const copyBtn = document.createElement('button');
  copyBtn.className = 'abtn copy';
  copyBtn.textContent = '📋 Скопировать';
  actions.appendChild(copyBtn);

  if (APP_MODE === 'teacher') {
    const editBtn = document.createElement('button');
    editBtn.className = 'abtn edit-task-btn teacher-only';
    editBtn.textContent = '✏ Редактировать';
    editBtn.onclick = () => openEditDialog(task);
    actions.appendChild(editBtn);
  }

  const cmtInput = document.createElement('input');
  cmtInput.className = 'cmt-input';
  cmtInput.placeholder = 'свой комментарий…';
  cmtInput.value = st.comment || '';
  cmtInput.oninput = () => { st.comment = cmtInput.value; saveState(); };
  actions.appendChild(cmtInput);

  card.appendChild(actions);

  // панель кода
  const codePanel = document.createElement('div');
  codePanel.className = 'code-panel';
  codePanel.innerHTML = highlight(task.code.join('\n'));
  card.appendChild(codePanel);

  // панель комментариев
  const cmtPanel = document.createElement('div');
  cmtPanel.className = 'cmt-panel';
  if (task.codelines && task.codelines.length) {
    cmtPanel.innerHTML = task.codelines.map(row => {
      if (row.comment) {
        return '<div class="line"><span class="code-line">' + escapeHtml(row.line) + '</span>\n' +
               '<span class="cmt-line"># ' + escapeHtml(row.comment) + '</span></div>';
      } else {
        return '<div class="line"><span class="code-line">' + escapeHtml(row.line) + '</span></div>';
      }
    }).join('');
  } else {
    cmtPanel.textContent = 'Комментарии для этой задачи не заданы.';
  }
  card.appendChild(cmtPanel);

  // панель заметок
  const notesPanel = document.createElement('div');
  notesPanel.className = 'notes-panel';
  notesPanel.innerHTML = '<b>Особенности:</b><ul>' +
    (notesForDisplay(task.notes).length ? notesForDisplay(task.notes) : ['—']).map(n => '<li>' + escapeHtml(n) + '</li>').join('') + '</ul>';
  card.appendChild(notesPanel);

  // обработчики
  pyBtn.onclick = () => {
    pyBtn.classList.toggle('on');
    codePanel.classList.toggle('show');
  };
  notesBtn.onclick = () => {
    notesBtn.classList.toggle('on');
    notesPanel.classList.toggle('show');
  };
  cmtBtn.onclick = () => {
    cmtBtn.classList.toggle('on');
    cmtPanel.classList.toggle('show');
  };
  copyBtn.onclick = () => {
    const text = task.code.join('\n');
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => {
        copyBtn.textContent = '✓ Скопировано';
        setTimeout(() => copyBtn.textContent = '📋 Скопировать', 1500);
      }).catch(() => alert('Не удалось скопировать'));
    } else {
      alert('Код:\n\n' + text);
    }
  };

  return card;
}

function updateCardClasses(card, st) {
  card.classList.remove('done','fav','dz');
  if (st.dz)   card.classList.add('dz');
  if (st.done) card.classList.add('done');
  if (st.fav)  card.classList.add('fav');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
function highlight(code) {
  // Безопасная подсветка: сначала экранируем весь Python, затем красим только комментарии.
  // Никаких kw/num/str внутри самого HTML больше не появляется.
  return escapeHtml(code).replace(/(^|\n)([ \t]*#.*)$/gm, '$1<span class="cmt">$2</span>');
}

/* ============================================================
   ПЕЧАТЬ / ПРОГРЕСС
   ============================================================ */
function allTasks() { return THEMES.flatMap(theme => theme.tasks); }
function selectedTasksForPrint() {
  // Берём ровно те карточки, которые сейчас реально видны после фильтра.
  const ids = Array.from(document.querySelectorAll('#main .task'))
    .filter(el => getComputedStyle(el).display !== 'none')
    .map(el => String(el.dataset.id));
  return allTasks().filter(t => ids.includes(String(t.id))).map(effectiveTask);
}
function codeWithComments(task) {
  task = effectiveTask(task);
  if (task.codelines && task.codelines.length) return task.codelines.map(r => r.line + (r.comment ? '  # ' + r.comment : '')).join('\n');
  return (task.code || []).join('\n');
}
function codeCleanPrintHtml(task) {
  task = effectiveTask(task);
  // ЧИСТЫЙ код всегда берём именно из task.code, без комментариев и без HTML-подсветки.
  return escapeHtml((task.code || []).join('\n'));
}
function codeCommentedPrintHtml(task) {
  task = effectiveTask(task);
  const rows = (task.codelines && task.codelines.length)
    ? task.codelines
    : (task.code || []).map(line => ({line,comment:''}));
  // Сохраняем каждую строку и переносы. Комментарий добавляется только в отдельный блок.
  return rows.map(r => escapeHtml(r.line) + (r.comment ? '  <span class="pc-comment"># ' + escapeHtml(r.comment) + '</span>' : '')).join('\n');
}
function printSelected() {
  const tasks = selectedTasksForPrint();
  if (!tasks.length) { alert('Нет задач для печати: сначала отфильтруй нужные задачи.'); return; }
  const opts = {
    condition: document.getElementById('print-condition').checked,
    answer: document.getElementById('print-answer').checked,
    notes: document.getElementById('print-notes').checked,
    code: document.getElementById('print-code').checked,
    codeComments: document.getElementById('print-code-comments').checked,
    myComment: document.getElementById('print-my-comment').checked
  };
  const host = document.createElement('div');
  host.id = 'print-host';
  host.innerHTML = tasks.map((task, i) => {
    const t = effectiveTask(task);
    let h = '<article class="print-task">';
    h += '<h1 class="print-task-title">№ ' + escapeHtml(t.id) + ' — ' + escapeHtml(t.title || '') + '</h1>';
    if (opts.condition) h += '<div class="print-condition">' + (t.desc || '') + '</div>';
    if (opts.answer && t.answer) h += '<div class="print-answer">Ответ: ' + escapeHtml(t.answer) + '</div>';
    if (opts.notes) h += '<div class="print-notes"><b>Подробнее:</b><ul>' + (notesForDisplay(t.notes).length ? notesForDisplay(t.notes) : ['—']).map(n => '<li>' + escapeHtml(n) + '</li>').join('') + '</ul></div>';
    // Два независимых флажка = два независимых блока. Чистый код никогда не заменяется кодом с комментариями.
    if (opts.code) {
      h += '<div class="print-code-label">Код</div>';
      h += '<pre class="print-code print-code-clean">' + codeCleanPrintHtml(t) + '</pre>';
    }
    if (opts.codeComments) {
      h += '<div class="print-code-label">Код с комментариями</div>';
      h += '<pre class="print-code print-code-commented">' + codeCommentedPrintHtml(t) + '</pre>';
    }
    if (opts.myComment) { const c = getTaskState(t.id).comment || ''; if (c) h += '<div class="print-mycomment"><b>Мой комментарий:</b> ' + escapeHtml(c) + '</div>'; }
    h += '</article>';
    return h;
  }).join('');
  document.body.appendChild(host);
  document.body.classList.add('printing');
  setTimeout(() => {
    window.print();
    setTimeout(() => { host.remove(); document.body.classList.remove('printing'); }, 500);
  }, 100);
}
function updatePrintCount() { const n=selectedTasksForPrint().length; const el=document.getElementById('print-count'); if(el) el.textContent='К печати: '+n+' '+(n===1?'задача':n<5?'задачи':'задач'); }

function humanizeEditorText(value) {
  let s = String(value ?? '');
  // Показываем человеку обычный текст: никаких буквальных \n, HTML-entity и служебной разметки.
  s = s.replace(/\\r\\n/g, "\n").replace(/\\n/g, "\n");
  s = s.replace(/&#x20;/gi, ' ').replace(/&#32;/gi, ' ');
  s = s.replace(/<br\s*\/?>(?=.)/gi, "\n");
  s = s.replace(/<[^>]*>/g, '');
  return s;
}
function notesForDisplay(notes) {
  const out=[];
  (notes || []).forEach(item => {
    humanizeEditorText(item).split('\n').forEach(line => {
      const t=line.trim();
      if(t) out.push(t);
    });
  });
  return out;
}

function openEditDialog(task) {
  task = effectiveTask(task);
  const dlg = document.getElementById('edit-dialog');
  dlg.hidden = false;
  dlg.querySelector('[name=edit-title]').value = task.title || '';
  dlg.querySelector('[name=edit-desc]').value = humanizeEditorText(String(task.desc || '').replace(/<\/span>\s*/g,'\n')).trim();
  dlg.querySelector('[name=edit-answer]').value = task.answer || '';
  // В редакторе показываем обычный чистый Python без HTML-меток, \n  // а комментарии — отдельно. Никаких буквальных \n, kw, num, str.
  dlg.querySelector('[name=edit-code]').value = (task.code || []).join('\n');
  const rows = (task.codelines && task.codelines.length) ? task.codelines : (task.code || []).map(line => ({line, comment:''}));
  dlg.querySelector('[name=edit-code-comments]').value = rows.map(r => humanizeEditorText(r.comment || '')).join('\n');
  dlg.querySelector('[name=edit-notes]').value = notesForDisplay(task.notes).join('\n');
  dlg.dataset.taskId = task.id;
}
function closeEditDialog(){ document.getElementById('edit-dialog').hidden=true; }
function saveEditDialog(){
  const dlg=document.getElementById('edit-dialog'); const id=dlg.dataset.taskId; if(!id) return;
  const codeText=dlg.querySelector('[name=edit-code]').value.replace(/\r/g,'');
  const codeLines=codeText.split('\n');
  const commentLines=humanizeEditorText(dlg.querySelector('[name=edit-code-comments]').value).replace(/\r/g,'').split('\n');
  const codelines=codeLines.map((line,i)=>({line, comment:(commentLines[i] || '').trim()}));
  EDITED_TASKS[id]={
    title:dlg.querySelector('[name=edit-title]').value,
    desc:formatEditedDesc(dlg.querySelector('[name=edit-desc]').value),
    answer:dlg.querySelector('[name=edit-answer]').value,
    code:codeLines,
    codelines:codelines,
    notes:humanizeEditorText(dlg.querySelector('[name=edit-notes]').value).replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean)
  };
  saveState();
  closeEditDialog();
  renderMain();
  updatePrintCount();
  alert('Изменения сохранены.');
}
function formatEditedDesc(text){
  return String(text).replace(/\r/g,'').split('\n').map(line=>'<span class="line">'+escapeHtml(line)+'</span>').join('');
}

function exportProgress() {
  saveState();
  let allStudents={}; try{ allStudents=JSON.parse(localStorage.getItem(STATE_KEY+'_students')||'{}'); }catch(e){}
  const data = {app:'Задача 13 (бывшая 23)', version:8, exportedAt:new Date().toISOString(), students:STUDENTS, currentStudentId:CURRENT_STUDENT_ID, statesByStudent:allStudents, state:STATE, editedTasks:EDITED_TASKS, mode:APP_MODE};
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='zadanie13-progress-v7.json'; a.click(); URL.revokeObjectURL(a.href);
}
function importProgress(file) {
  const r=new FileReader();
  r.onload=()=>{ try {
    const data=JSON.parse(r.result);
    if(Array.isArray(data.students) && data.students.length){
      STUDENTS=data.students; CURRENT_STUDENT_ID=data.currentStudentId || STUDENTS[0].id;
      localStorage.setItem(STUDENTS_KEY,JSON.stringify(STUDENTS));
      localStorage.setItem(STATE_KEY+'_students',JSON.stringify(data.statesByStudent||{}));
      STATE=(data.statesByStudent||{})[CURRENT_STUDENT_ID] || data.state || {};
    } else { STATE=data.state||data; }
    EDITED_TASKS=data.editedTasks||{};
    APP_MODE=data.mode==='teacher'?'teacher':'student';
    saveState(); setMode(APP_MODE); renderStudentSelector(); alert('Прогресс загружен.');
  } catch(e){ alert('Не удалось загрузить JSON.'); } };
  r.readAsText(file);
}
