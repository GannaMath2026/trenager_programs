function printCodeHtml(code,withComments){const clean=withComments?code:code.split('\n').map(line=>{let q=null;let out='';let escp=false;for(let i=0;i<line.length;i++){const ch=line[i];if(q){out+=ch;if(escp)escp=false;else if(ch==='\\')escp=true;else if(ch===q)q=null;}else if(ch==='"'||ch==="'"){q=ch;out+=ch;}else if(ch==='#')break;else out+=ch;}return out.replace(/\s+$/,'');}).join('\n');return esc(clean).split('\n').map(line=>{const i=line.indexOf('#');return withComments&&i>=0?esc(line.slice(0,i))+'<span class="pc-comment">'+esc(line.slice(i))+'</span>':esc(line);}).join('\n');}

function fillAnchors(){const kind=document.getElementById('add-kind').value;const sel=document.getElementById('add-anchor');const arr=TASKS.filter(t=>t.kind===kind&&!DELETED_TASKS[t.id]);sel.innerHTML=arr.map(t=>'<option value="'+esc(t.id)+'">№ '+esc(t.id)+' — '+esc(t.title||'')+'</option>').join('');if(LAST_TASK_ID&&arr.some(t=>String(t.id)===String(LAST_TASK_ID)))sel.value=String(LAST_TASK_ID);}
function addTask(){const id=(document.getElementById('add-id').value.trim()||makeId());if(TASKS.some(t=>String(t.id)===id)){alert('Такой номер задачи уже существует.');return;}const kind=document.getElementById('add-kind').value;const anchor=document.getElementById('add-anchor').value;const pos=document.getElementById('add-position').value;const t={id,title:document.getElementById('add-title').value,desc:document.getElementById('add-desc').value,question:document.getElementById('add-question').value,expr:'',answer:document.getElementById('add-answer').value,kind,methods:methodsFor({kind}),sourceAnswer:''};const code=document.getElementById('add-code').value;CUSTOM_TASKS[id]=Object.assign({},t,{customCode:code});const arrIndex=TASKS.findIndex(x=>String(x.id)===String(anchor));if(pos==='before'&&arrIndex>=0)TASKS.splice(arrIndex,0,t);else if(pos==='after'&&arrIndex>=0)TASKS.splice(arrIndex+1,0,t);else{let last=-1;TASKS.forEach((x,i)=>{if(x.kind===kind)last=i;});TASKS.splice(last>=0?last+1:TASKS.length,0,t);}saveState();document.getElementById('add-dialog').hidden=true;renderTOC();renderMain();}
function runPython(code,out,btn){out.textContent='Загрузка Python…';out.classList.remove('err');btn.disabled=true;if(window.pyodideInstance){execPy(code,out,btn);return;}if(window.pyodideLoading){window.pyodideQueue.push([code,out,btn]);return;}window.pyodideLoading=true;window.pyodideQueue=[];window.pyodideQueue.push([code,out,btn]);const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js';sc.onload=async()=>{try{window.pyodideInstance=await loadPyodide();const q=window.pyodideQueue.splice(0);q.forEach(x=>execPy(x[0],x[1],x[2]));}catch(e){window.pyodideLoading=false;window.pyodideQueue.splice(0).forEach(x=>{x[1].textContent='Ошибка загрузки Python: '+e.message;x[2].disabled=false;});}};sc.onerror=()=>{window.pyodideLoading=false;window.pyodideQueue.splice(0).forEach(x=>{x[1].textContent='Не удалось загрузить Python.';x[2].disabled=false;});};document.head.appendChild(sc);}
async function execPy(code,out,btn){try{const wrapped="import sys,io\n_out=io.StringIO()\nsys.stdout=_out\ntry:\n    exec("+JSON.stringify(code)+",globals())\n    _result=_out.getvalue()\nfinally:\n    sys.stdout=sys.__stdout__\n";window.pyodideInstance.runPython(wrapped);const r=window.pyodideInstance.runPython('_result');out.textContent=r||'(пусто)';}catch(e){out.textContent='Ошибка: '+(e.message||e);out.classList.add('err');}finally{btn.disabled=false;}}

// UI events — one authoritative handler per control.
document.querySelectorAll('.fbtn').forEach(b=>b.onclick=()=>{FILTER[b.dataset.filter]=!FILTER[b.dataset.filter];b.classList.toggle('on',FILTER[b.dataset.filter]);renderMain();});
document.getElementById('show-all-tasks').onclick=()=>{FILTER={done:false,fav:false,dz:false,search:''};document.getElementById('search').value='';document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));renderMain();};
document.getElementById('search').oninput=e=>{FILTER.search=e.target.value;renderMain();};
document.getElementById('mode-student').onclick=()=>setMode('student');document.getElementById('mode-teacher').onclick=()=>setMode('teacher');document.getElementById('student-select').onchange=e=>switchStudent(e.target.value);document.getElementById('student-add').onclick=addStudent;document.getElementById('student-remove').onclick=removeStudent;document.getElementById('restore-deleted').onclick=restoreDeleted;document.getElementById('add-task').onclick=openAddDialog;document.getElementById('add-cancel').onclick=()=>document.getElementById('add-dialog').hidden=true;document.getElementById('add-kind').onchange=fillAnchors;document.getElementById('add-save').onclick=addTask;document.getElementById('print-selected').onclick=printSelected;document.getElementById('export-progress').onclick=exportProgress;document.getElementById('save-application').onclick=saveApplication;document.getElementById('import-file').onchange=e=>{if(e.target.files[0])importProgress(e.target.files[0]);e.target.value='';};
loadState();renderStudents();setMode(APP_MODE);renderTOC();renderMain();
</script>
