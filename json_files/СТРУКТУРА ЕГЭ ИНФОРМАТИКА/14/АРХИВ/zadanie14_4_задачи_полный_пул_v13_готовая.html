const KEY='z14_clean_v9';
const VALID_SECTIONS=['from10','from10any','to10small','to10any'];
let mode='student', selectedTaskId=null;

// TASKS всегда берутся из текущего HTML-файла.
// localStorage используется только для учеников, фильтров, флагов и прогресса.
const DEFAULT_USER_STATE={
  students:[{id:'s1',name:'Ученик 1'}],
  current:'s1',
  filtersByStudent:{},
  sectionByStudent:{},
  progressByStudent:{}
};

function storageGet(key){
  try{return localStorage.getItem(key)}catch(e){return null}
}
function storageSet(key,value){
  try{localStorage.setItem(key,value);return true}catch(e){return false}
}
function normalizeTri(v){return v===true?true:v===false?false:null}
function normalizeFilters(raw){
  raw=raw&&typeof raw==='object'?raw:{};
  return {
    q:typeof raw.q==='string'?raw.q:'',
    done:normalizeTri(raw.done),
    fav:normalizeTri(raw.fav),
    dz:normalizeTri(raw.dz)
  };
}
function loadUserState(){
  let saved=null;
  try{const raw=storageGet(KEY);saved=raw?JSON.parse(raw):null}catch(e){saved=null}
  saved=saved&&typeof saved==='object'?saved:{};
  const students=Array.isArray(saved.students)&&saved.students.length
    ?saved.students.map((x,i)=>({id:String(x?.id||('s'+(i+1))),name:String(x?.name||('Ученик '+(i+1)))}))
    :DEFAULT_USER_STATE.students.map(x=>({...x}));
  const state={
    students,
    current:String(saved.current||students[0].id),
    filtersByStudent:saved.filtersByStudent&&typeof saved.filtersByStudent==='object'?saved.filtersByStudent:{},
    sectionByStudent:saved.sectionByStudent&&typeof saved.sectionByStudent==='object'?saved.sectionByStudent:{},
    progressByStudent:saved.progressByStudent&&typeof saved.progressByStudent==='object'?saved.progressByStudent:{}
  };
  if(!state.students.some(x=>x.id===state.current))state.current=state.students[0].id;
  return state;
}
let state=loadUserState();

function uiForStudent(){
  const id=state.current;
  state.filtersByStudent[id]=normalizeFilters(state.filtersByStudent[id]);
  state.sectionByStudent[id]=VALID_SECTIONS.includes(state.sectionByStudent[id])?state.sectionByStudent[id]:null;
  if(!state.progressByStudent[id]||typeof state.progressByStudent[id]!=='object')state.progressByStudent[id]={};
  return {filters:state.filtersByStudent[id],section:state.sectionByStudent[id]};
}
function taskById(id){return TASKS.find(x=>x.id===id)||null}
function ensure(id){
  const sid=state.current;
  if(!state.progressByStudent[sid])state.progressByStudent[sid]={};
  if(!state.progressByStudent[sid][id]){const task=taskById(id);state.progressByStudent[sid][id]={done:false,fav:false,dz:!!task?.defaultDz,comment:'',method:(task?.methods||[])[0]||'',codeOpen:false};}
  const st=state.progressByStudent[sid][id];
  st.done=!!st.done; st.fav=!!st.fav; st.dz=!!st.dz;
  st.comment=typeof st.comment==='string'?st.comment:'';
  const methods=taskById(id)?.methods||[];
  if(!methods.includes(st.method))st.method=methods[0]||'';
  st.codeOpen=!!st.codeOpen;
  return st;
}
function save(){
  // Никаких TASKS / order / custom / deleted в localStorage.
  const payload={
    students:state.students,
    current:state.current,
    filtersByStudent:state.filtersByStudent,
    sectionByStudent:state.sectionByStudent,
    progressByStudent:state.progressByStudent
  };
  return storageSet(KEY,JSON.stringify(payload));
}
function commit(){save();render()}
function normalizeState(){
  if(!Array.isArray(state.students)||!state.students.length)state.students=DEFAULT_USER_STATE.students.map(x=>({...x}));
  if(!state.current||!state.students.some(x=>x.id===state.current))state.current=state.students[0].id;
  state.filtersByStudent=state.filtersByStudent&&typeof state.filtersByStudent==='object'?state.filtersByStudent:{};
  state.sectionByStudent=state.sectionByStudent&&typeof state.sectionByStudent==='object'?state.sectionByStudent:{};
  state.progressByStudent=state.progressByStudent&&typeof state.progressByStudent==='object'?state.progressByStudent:{};
  Object.keys(state.filtersByStudent).forEach(id=>state.filtersByStudent[id]=normalizeFilters(state.filtersByStudent[id]));
  Object.keys(state.sectionByStudent).forEach(id=>{state.sectionByStudent[id]=VALID_SECTIONS.includes(state.sectionByStudent[id])?state.sectionByStudent[id]:null});
  uiForStudent();
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cleanCode(s){return String(s||'').replace(/&amp;#39;|&#39;|&quot;|&gt;|&lt;|&amp;/g,m=>({'&amp;#39;':"'",'&#39;':"'",'&quot;':'"','&gt;':'>','&lt;':'<','&amp;':'&'}[m])).replace(/<br\s*\/?>(?=.)/gi,'\n').replace(/<[^>]+>/g,'')}
function normalizeState(){
  state.students=state.students&&state.students.length?state.students:[{id:'s1',name:'Ученик 1'}];
  if(!state.current||!state.students.some(x=>x.id===state.current))state.current=state.students[0].id;
  state.filtersByStudent=state.filtersByStudent||{};

function currentTasks(){
  const ui=uiForStudent();
  let arr=TASKS.slice();
  if(ui.section)arr=arr.filter(t=>t.kind===ui.section);
  const q=ui.filters.q.trim().toLowerCase();
  return arr.filter(t=>{
    const st=ensure(t.id);
    const text=[t.id,t.title,t.desc,t.question].map(v=>String(v??'')).join(' ').toLowerCase();
    return (!q||text.includes(q))
      &&(ui.filters.done===null||st.done===ui.filters.done)
      &&(ui.filters.fav===null||st.fav===ui.filters.fav)
      &&(ui.filters.dz===null||st.dz===ui.filters.dz);
  });
}
function syncFilters(){
  const ui=uiForStudent(),f=ui.filters;
  [['fDone',f.done===true],['fUndone',f.done===false],['fFav',f.fav===true],['fUnfav',f.fav===false],['fDz',f.dz===true],['fNotDz',f.dz===false]]
    .forEach(([id,active])=>{const el=document.getElementById(id);if(el)el.classList.toggle('active',active)});
  document.querySelectorAll('.section-btn[data-section]').forEach(el=>el.classList.toggle('active',el.dataset.section===ui.section));
}
function render(){

  if(!main)return;
  main.innerHTML='';

  const arr=currentTasks();
  if(!arr.length){main.innerHTML='<div class="empty">Нет задач по выбранным условиям.</div>';return}
  arr.forEach(t=>main.appendChild(card(t)));
}

  refreshStudents();
  commit();

function printDialog(){
  const h=document.getElementById('modalHost');
  h.innerHTML=`<div class="modal"><div class="modalbox"><h2>Что выводить на печать?</h2>
    <div class="print-options">
      <label class="print-option"><input type="checkbox" id="p_num">Номер</label>
      <label class="print-option"><input type="checkbox" id="p_cond">Условие</label>
      <label class="print-option"><input type="checkbox" id="p_ans">Ответ</label>
      <label class="print-option"><input type="checkbox" id="p_c1">Код 1</label>
      <label class="print-option"><input type="checkbox" id="p_c2">Код 2</label>
      <label class="print-option"><input type="checkbox" id="p_comment">Мой комментарий</label>
    </div>
    <div class="modal-actions"><button class="btn" id="p_cancel">Отмена</button><button class="btn green" id="p_go">Печать</button></div>
  </div></div>`;
  h.querySelector('#p_cancel').onclick=()=>h.innerHTML='';
  h.querySelector('#p_go').onclick=()=>{
    const opt={num:h.querySelector('#p_num').checked,cond:h.querySelector('#p_cond').checked,ans:h.querySelector('#p_ans').checked,c1:h.querySelector('#p_c1').checked,c2:h.querySelector('#p_c2').checked,comment:h.querySelector('#p_comment').checked};
    if(!Object.values(opt).some(Boolean)){alert('Выберите хотя бы один пункт для печати.');return;}
    const arr=currentTasks();
    if(!arr.length){alert('Нет задач для печати по текущим фильтрам.');return;}
    const parts=arr.map(t=>{
      const st=ensure(t.id);
      const c1=cleanCode((st.codes&&st.codes[t.methods[0]])||t.codes[t.methods[0]]||'');
      const c2=cleanCode((st.codes&&st.codes[t.methods[1]])||t.codes[t.methods[1]]||'');
      let html='<article class="print-task">';
      if(opt.num)html+=`<div class="print-number">№ ${esc(t.id)}</div>`;
      if(opt.cond)html+=`<div class="print-condition">${esc(t.desc)}<br><br><b>${esc(t.question)}</b></div>`;
      if(opt.c1)html+=`<div><b>Код 1 — ${esc(t.methods[0])}</b><pre class="print-code">${esc(c1)}</pre></div>`;
      if(opt.c2)html+=`<div><b>Код 2 — ${esc(t.methods[1])}</b><pre class="print-code">${esc(c2)}</pre></div>`;
      if(opt.ans)html+=`<div class="print-answer"><b>Ответ:</b> ${esc(t.answer)}</div>`;
      if(opt.comment)html+=`<div><b>Мой комментарий:</b><div class="print-comment">${esc(st.comment||'')}</div></div>`;
      return html+'</article>';
    }).join('');
    const w=window.open('','_blank','width=1000,height=800');
    if(!w){alert('Браузер заблокировал окно печати. Разрешите всплывающие окна для этого файла.');return;}
    w.document.open();
    w.document.write(`<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Печать — Задание 14</title><style>
      *{box-sizing:border-box}body{font-family:Arial,sans-serif;color:#111;margin:28px;font-size:14px}.print-task{margin:0 0 26px;padding:0 0 18px;border-bottom:1px solid #ccc;break-inside:avoid}.print-number{font-size:18px;font-weight:800;margin-bottom:10px}.print-condition{margin-bottom:12px;line-height:1.45}.print-code{white-space:pre-wrap;font:11px/1.4 Consolas,monospace;background:#fff;color:#111;border:1px solid #bbb;padding:9px;margin:5px 0 10px}.print-answer,.print-comment{margin-top:8px;white-space:pre-wrap}@media print{body{margin:15mm}.print-task{break-inside:avoid}}</style></head><body>${parts}</body></html>`);
    w.document.close();
    h.innerHTML='';
    setTimeout(()=>{w.focus();w.print();},250);
  };
}
