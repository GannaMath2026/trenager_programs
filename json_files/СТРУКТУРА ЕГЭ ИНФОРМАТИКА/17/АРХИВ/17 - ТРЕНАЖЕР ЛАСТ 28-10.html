let pyodideInstance = null;
let pyodideLoading = false;

async function initPyodide() {
  if (pyodideInstance) return pyodideInstance;
  if (pyodideLoading) {
    return new Promise((resolve) => {
      const interval = setInterval(() => {
        if (pyodideInstance) { clearInterval(interval); resolve(pyodideInstance); }
      }, 100);
    });
  }
  pyodideLoading = true;
  try {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js';
    document.head.appendChild(script);
    await new Promise((resolve, reject) => { script.onload = resolve; script.onerror = reject; });
    pyodideInstance = await loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/' });
    return pyodideInstance;
  } catch (err) {
    throw err;
  } finally {
    pyodideLoading = false;
  }
}

async function runPython(code, outEl, statusEl, btnEl) {
  outEl.textContent = '⏳ Подготовка Python…';
  statusEl.textContent = 'СТАТУС: ⏳ Подготовка Python…';
  btnEl.disabled = true;

  try {
    const py = await initPyodide();
    py.FS.writeFile('17all.txt', DATA_TEXT, { encoding: 'utf8' });
    statusEl.textContent = 'СТАТУС: ▶ Выполняю код…';
    outEl.textContent = '▶ Выполняю…';
    
    let output = '';
    py.setStdout({ batched: (msg) => { output += msg + '\n'; } });
    
    try {
      await py.runPythonAsync(code);
      outEl.textContent = output || '(код выполнен, вывода нет)';
      statusEl.textContent = 'СТАТУС: ✓ Код выполнен';
    } catch (err) {
      outEl.textContent = 'Ошибка: ' + err.message;
      statusEl.textContent = 'СТАТУС: ✕ Ошибка выполнения';
    }
  } catch (err) {
    outEl.textContent = 'Ошибка загрузки Python: ' + err.message;
    statusEl.textContent = 'СТАТУС: ✕ Ошибка (требуется сервер)';
  } finally {
    btnEl.disabled = false;
  }
}

// 6. Модальные окна (Добавление / Редактирование)
function openAddModal() {
  const host = document.getElementById('modalHost');
  host.innerHTML = `
    <div class="modal">
      <div class="modalbox">
        <h2>Добавить задачу</h2>
        <label>Номер задачи (ID)</label>
        <input id="add-id" placeholder="Например: 9999">
        <label>Название</label>
        <input id="add-title" placeholder="Например: Задача 9999 (Средний)">
        <label>Раздел</label>
        <select id="add-kind">
          <option value="single">Отдельные числа</option>
          <option value="pair">Пары элементов</option>
          <option value="triple">Тройки элементов</option>
          <option value="quad">Четвёрки элементов</option>
          <option value="nonadj">Несоседние пары</option>
        </select>
        <label>Условие</label>
        <textarea id="add-desc"></textarea>
        <label>Ответ</label>
        <input id="add-answer">
        <label>Код Python</label>
        <textarea id="add-code">file=open('17all.txt')\ns=[int(c) for c in file.readlines()]\n\n# Напиши решение задачи ниже.</textarea>
        <div class="modal-actions">
          <button class="btn" id="add-cancel">Отмена</button>
          <button class="btn green" id="add-save">Добавить</button>
        </div>
      </div>
    </div>
  `;
  
  host.querySelector('#add-cancel').onclick = () => host.innerHTML = '';
  
  host.querySelector('#add-save').onclick = () => {
    const id = host.querySelector('#add-id').value.trim();
    if (!id) { alert('Укажите номер'); return; }
    if (state.tasks.some(t => t.id === id)) { alert('Такой номер уже существует'); return; }
    
    const task = {
      id,
      title: host.querySelector('#add-title').value || ('Задача ' + id),
      kind: host.querySelector('#add-kind').value,
      desc: host.querySelector('#add-desc').value,
      question: '',
      answer: host.querySelector('#add-answer').value,
      code: host.querySelector('#add-code').value
    };
    
    state.tasks.push(task);
    Object.keys(state.progress).forEach(sid => {
      state.progress[sid][id] = { done: false, fav: false, dz: false, comment: '', lastCheck: null };
    });
    
    host.innerHTML = '';
    render();
  };
}

function openEditModal(task) {
  const host = document.getElementById('modalHost');
  host.innerHTML = `
    <div class="modal">
      <div class="modalbox">
        <h2>Редактировать задачу</h2>
        <label>Номер задачи (ID)</label>
        <input id="edit-id" value="${esc(task.id)}">
        <label>Название</label>
        <input id="edit-title" value="${esc(task.title)}">
        <label>Раздел</label>
        <select id="edit-kind">
          <option value="single" ${task.kind === 'single' ? 'selected' : ''}>Отдельные числа</option>
          <option value="pair" ${task.kind === 'pair' ? 'selected' : ''}>Пары элементов</option>
          <option value="triple" ${task.kind === 'triple' ? 'selected' : ''}>Тройки элементов</option>
          <option value="quad" ${task.kind === 'quad' ? 'selected' : ''}>Четвёрки элементов</option>
          <option value="nonadj" ${task.kind === 'nonadj' ? 'selected' : ''}>Несоседние пары</option>
        </select>
        <label>Условие</label>
        <textarea id="edit-desc">${esc(task.desc)}</textarea>
        <label>Вопрос (необязательно)</label>
        <textarea id="edit-question">${esc(task.question || '')}</textarea>
        <label>Ответ</label>
        <input id="edit-answer" value="${esc(task.answer)}">
        <div class="modal-actions">
          <button class="btn" id="edit-cancel">Отмена</button>
          <button class="btn green" id="edit-save">Сохранить</button>
        </div>
      </div>
    </div>
  `;
  
  host.querySelector('#edit-cancel').onclick = () => host.innerHTML = '';
  
  host.querySelector('#edit-save').onclick = () => {
    const newId = host.querySelector('#edit-id').value.trim();
    if (!newId) { alert('Укажите номер'); return; }
    if (state.tasks.some(t => t !== task && t.id === newId)) { alert('Такой номер уже существует'); return; }
    
    const oldId = task.id;
    
    if (oldId !== newId) {
      Object.keys(state.progress).forEach(sid => {
        if (state.progress[sid][oldId]) {
          state.progress[sid][newId] = state.progress[sid][oldId];
          delete state.progress[sid][oldId];
        }
      });
    }
    
    task.id = newId;
    task.title = host.querySelector('#edit-title').value;
    task.kind = host.querySelector('#edit-kind').value;
    task.desc = host.querySelector('#edit-desc').value;
    task.question = host.querySelector('#edit-question').value;
    task.answer = host.querySelector('#edit-answer').value;
    
    host.innerHTML = '';
    render();
  };
}

// 7. Печать
function printTasks() {
  const filtered = getFilteredTasks();
  if (filtered.length === 0) {
    alert('Нет задач для печати по текущим фильтрам.');
    return;
  }

  const win = window.open('', '_blank');
  win.document.write('<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Печать задач</title>');
  win.document.write('<style>');
  win.document.write('body{font-family:Arial,sans-serif;margin:20px;color:#000;}');
  win.document.write('.task{margin-bottom:30px;page-break-inside:avoid;}');
  win.document.write('.task-title{font-size:16px;font-weight:bold;margin-bottom:10px;border-bottom:1px solid #ccc;padding-bottom:5px;}');
  win.document.write('.condition{margin-bottom:10px;white-space:pre-wrap;line-height:1.5;}');
  win.document.write('.answer{font-weight:bold;margin-top:10px;}');
  win.document.write('.code{background:#f4f4f4;padding:10px;border:1px solid #ddd;font-family:monospace;white-space:pre-wrap;margin-top:10px;}');
  win.document.write('</style></head><body>');

  filtered.forEach(t => {
    win.document.write('<div class="task">');
    win.document.write('<div class="task-title">Задача №' + esc(t.id) + ' - ' + esc(t.title) + '</div>');
    win.document.write('<div class="condition">' + formatConditionText(t.desc).replace(/\n/g, '<br>') + '</div>');
    if (t.question && t.question.trim()) {
      win.document.write('<div class="condition"><strong>' + formatConditionText(t.question) + '</strong></div>');
    }
    win.document.write('<div class="answer">Ответ: ' + esc(t.answer) + '</div>');
    if (t.code) {
      win.document.write('<div class="code">' + esc(t.code) + '</div>');
    }
    win.document.write('</div>');
  });

  win.document.write('</body></html>');
  win.document.close();
  win.focus();
  setTimeout(() => { win.print(); }, 500);
}

// 8. Интерфейс
function updateFilterButtons() {
  const f = getCurrentFilters();
  document.getElementById('fDone').classList.toggle('active', f.done === true);
  document.getElementById('fUndone').classList.toggle('active', f.done === false);
  document.getElementById('fFav').classList.toggle('active', f.fav === true);
  document.getElementById('fUnfav').classList.toggle('active', f.fav === false);
  document.getElementById('fDz').classList.toggle('active', f.dz === true);
  document.getElementById('fNotDz').classList.toggle('active', f.dz === false);
  document.querySelectorAll('.section-btn[data-section]').forEach(el => {
    el.classList.toggle('active', el.dataset.section === state.selectedSection);
  });
}

function setupFilters() {
  document.getElementById('searchInput').oninput = (e) => {
    getCurrentFilters().q = e.target.value;
    render();
  };
  
  const toggleFilter = (key, val) => {
    const f = getCurrentFilters();
    f[key] = f[key] === val ? null : val;
    updateFilterButtons();
    render();
  };
  
  document.getElementById('fDone').onclick = () => toggleFilter('done', true);
  document.getElementById('fUndone').onclick = () => toggleFilter('done', false);
  document.getElementById('fFav').onclick = () => toggleFilter('fav', true);
  document.getElementById('fUnfav').onclick = () => toggleFilter('fav', false);
  document.getElementById('fDz').onclick = () => toggleFilter('dz', true);
  document.getElementById('fNotDz').onclick = () => toggleFilter('dz', false);
  
  document.getElementById('resetFiltersBtn').onclick = () => {
    state.filters[state.currentStudentId] = { q: '', done: null, fav: null, dz: null };
    state.selectedSection = null;
    document.getElementById('searchInput').value = '';
    updateFilterButtons();
    render();
  };
  
  document.getElementById('showAllBtn').onclick = () => {
    state.filters[state.currentStudentId] = { q: '', done: null, fav: null, dz: null };
    state.selectedSection = null;
    document.getElementById('searchInput').value = '';
    updateFilterButtons();
    render();
  };
  
  document.querySelectorAll('.section-btn[data-section]').forEach(btn => {
    btn.onclick = () => {
      const section = btn.dataset.section;
      state.selectedSection = state.selectedSection === section ? null : section;
      updateFilterButtons();
      render();
    };
  });
}

function setupModes() {
  document.getElementById('studentMode').onclick = () => setMode('student');
  document.getElementById('teacherMode').onclick = () => setMode('teacher');
  document.getElementById('studentModeSide').onclick = () => setMode('student');
  document.getElementById('teacherModeSide').onclick = () => setMode('teacher');
}

function setMode(mode) {
  state.mode = mode;
  document.getElementById('studentMode').classList.toggle('active', mode === 'student');
  document.getElementById('teacherMode').classList.toggle('active', mode === 'teacher');
  document.getElementById('studentModeSide').classList.toggle('active', mode === 'student');
  document.getElementById('teacherModeSide').classList.toggle('active', mode === 'teacher');
  document.querySelectorAll('.teacher-only').forEach(el => {
    el.style.display = mode === 'teacher' ? '' : 'none';
  });
  render();
}

function setupStudents() {
  const select = document.getElementById('studentSelect');
  
  function refreshSelect() {
    select.innerHTML = '';
    state.students.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.id;
      opt.textContent = s.name;
      select.appendChild(opt);
    });
    select.value = state.currentStudentId;
  }
  
  select.onchange = (e) => {
    state.currentStudentId = e.target.value;
    updateFilterButtons();
    document.getElementById('searchInput').value = getCurrentFilters().q;
    render();
  };
  
  document.getElementById('addStudentBtn').onclick = () => {
    const name = prompt('Имя ученика:');
    if (!name) return;
    const id = 's' + Date.now();
    state.students.push({ id, name });
    state.progress[id] = {};
    state.filters[id] = { q: '', done: null, fav: null, dz: null };
    state.tasks.forEach(t => {
      state.progress[id][t.id] = { done: false, fav: false, dz: false, comment: '', lastCheck: null };
    });
    state.currentStudentId = id;
    refreshSelect();
    render();
  };
  
  document.getElementById('delStudentBtn').onclick = () => {
    if (state.students.length < 2) return;
    if (!confirm('Удалить текущего ученика?')) return;
    delete state.progress[state.currentStudentId];
    delete state.filters[state.currentStudentId];
    state.students = state.students.filter(s => s.id !== state.currentStudentId);
    state.currentStudentId = state.students[0].id;
    refreshSelect();
    render();
  };
  
  refreshSelect();
}

// 9. Сохранение
document.getElementById('saveAppBtn').onclick = () => {
  // Синхронизация кодов из редакторов
  document.querySelectorAll('#main .task[data-id]').forEach(card => {
    const task = state.tasks.find(t => t.id === card.dataset.id);
    const editor = card.querySelector('.codebox textarea');
    if (task && editor) task.code = editor.value;
  });

  // Запись в скрытый тег
  const initScript = document.getElementById('initial-state');
  initScript.textContent = JSON.stringify(state);

  // Сборка HTML
  const clone = document.documentElement.cloneNode(true);
  clone.querySelector('#main').innerHTML = '';
  clone.querySelector('body').className = '';
  
  const html = '<!doctype html>\n' + clone.outerHTML;
  
  const blob = new Blob([html], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ege17_saved.html';
  a.click();
};

// 10. Кнопки действий
document.getElementById('addTaskBtn').onclick = openAddModal;
document.getElementById('printBtn').onclick = printTasks;
document.getElementById('openAllAnswersBtn').onclick = () => {
  const answers = document.querySelectorAll('#main .answer-val');
  if (answers.length === 0) return;
  const isHidden = answers[0].classList.contains('hidden');
  answers.forEach(a => a.classList.toggle('hidden', !isHidden));
};

// 11. Инициализация
window.onload = () => {
  initState();
  setupFilters();
  setupModes();
  setupStudents();
  updateFilterButtons();
  render();
  
  document.querySelectorAll('[data-global-size]').forEach(btn => {
    btn.onclick = () => {
      state.conditionFont = btn.dataset.globalSize;
      document.querySelectorAll('[data-global-size]').forEach(b => b.classList.toggle('active', b === btn));
      render();
    };
  });
};
