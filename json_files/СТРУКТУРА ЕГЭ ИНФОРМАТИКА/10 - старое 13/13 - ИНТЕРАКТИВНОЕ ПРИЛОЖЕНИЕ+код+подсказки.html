<body>
<h1>Задание 13: IP-адреса и маски</h1>
<p class="subtitle">Если в задаче указана маска — она уже подставлена. Иначе тяните ползунок сами, глядя на адрес узла и адрес сети.</p>

<div id="errorBox"></div>
<div id="tasks"></div>

<div class="helper-panel">
  <h3>Помощники</h3>
  <div class="helper-row">
    <div class="formula">
      <span class="pow-base">2</span>
      <input type="text" class="rect pow-exponent" id="h-pow-a" placeholder="A" style="width:38px">
      <span>=</span>
      <span class="formula-result empty" id="h-pow-result">—</span>
    </div>
  </div>
  <div class="helper-row">
    <div class="bin-sum">
      <input type="text" class="rect" id="h-bsum-a" placeholder="0 и 1">
      <span class="plus">+</span>
      <input type="text" class="rect" id="h-bsum-b" placeholder="0 и 1">
      <span class="plus">+</span>
      <input type="text" class="rect" id="h-bsum-c" placeholder="0 и 1">
      <span class="plus">+</span>
      <input type="text" class="rect" id="h-bsum-d" placeholder="0 и 1">
      <span>=</span>
      <span class="formula-result empty" id="h-bsum-result">—</span>
    </div>
  </div>
</div>

<script>
// === ДИАГНОСТИКА ===
window.addEventListener('error', function(e) {
  var box = document.getElementById('errorBox');
  if (box) {
    box.innerHTML += '<div class="error-box">Ошибка JS: ' + e.message +
      '<br>Строка: ' + e.lineno + '</div>';
  }
  console.error(e);
});

// === УТИЛИТЫ ===
function ipToBytes(ip) { return ip.split('.').map(function(n){ return parseInt(n,10); }); }
function byteToBits(b) { return b.toString(2).padStart(8, '0'); }
function ipToBin32(ip) { return ipToBytes(ip).map(byteToBits).join(''); }
function ipToBinBytesSpaced(ip) { return ipToBytes(ip).map(byteToBits).join(' '); }
function maskToOnes(mask) {
  var bits = ipToBin32(mask);
  if (!/^1*0*$/.test(bits)) return null;
  return (bits.match(/1/g) || []).length;
}
function ipBinHTML(ip, taskId, prefix) {
  var pos = 0;
  return ipToBytes(ip).map(function(byte){ return byteToBits(byte); })
    .map(function(bits) {
      return bits.split('').map(function(ch) {
        var p = pos++;
        var id = (taskId != null && prefix) ? ' id="' + prefix + '-' + taskId + '-' + p + '"' : '';
        return '<span class="bit' + (ch === '1' ? ' one' : '') + '"' + id + '>' + ch + '</span>';
      }).join('');
    }).join('<span class="sep">.</span>');
}
function emptyMaskHTML(taskId) {
  var html = '';
  for (var byte = 0; byte < 4; byte++) {
    for (var b = 0; b < 8; b++) {
      var p = byte * 8 + b;
      html += '<span class="bit" id="maskbit-' + taskId + '-' + p + '">0</span>';
    }
    if (byte < 3) html += '<span class="sep">.</span>';
  }
  return html;
}
function safeCalc(expr) {
  var s = expr.replace(/\s+/g, '');
  if (!/^[0-9+\-*\/]+$/.test(s)) return null;
  var tokens = s.match(/(\d+|[+\-*/])/g);
  if (!tokens) return null;
  var stack = [Number(tokens[0])];
  var i = 1;
  while (i < tokens.length) {
    var op = tokens[i], num = Number(tokens[i + 1]);
    if (isNaN(num)) return null;
    if (op === '*') stack[stack.length - 1] *= num;
    else if (op === '/') { if (num === 0) return null; stack[stack.length - 1] /= num; }
    else if (op === '+') stack.push(num);
    else if (op === '-') stack.push(-num);
    else return null;
    i += 2;
  }
  return stack.reduce(function(a, b){ return a + b; }, 0);
}

// === ДАННЫЕ ЗАДАЧ ===
var sections = [
  { title: 'IP-адрес + маска сети', tasks: [
    { id: 's1t1', kind: 'указана маска', ip: '255.255.255.128', maskToSet: '255.255.255.128', maskHint: 25,
      hint: '<span class="step"><b>1</b>Маска 255.255.255.128 = /25 — 25 единиц, 7 нулей.</span><span class="step"><b>2</b>Нули — это хостовая часть (адреса компьютеров). 7 нулей ⇒ 2⁷ = 128 адресов.</span><span class="step"><b>3</b>Из них 2 зарезервированы: адрес сети и широковещательный.</span><span class="step"><b>4</b>Доступно: 128 − 2 = <b>126</b>.</span>',
      desc: 'Для подсети используется маска 255.255.255.128.',
      question: 'Сколько различных адресов компьютеров теоретически допускает эта маска, если два адреса (адрес сети и широковещательный) не используют?',
      answer: '126' },
    { id: 's1t2', kind: 'указаны узел и сеть', ip: '120.216.74.153', network: '120.216.0.0', maskHint: 13,
      hint: '<span class="step"><b>1</b>Сравни IP и адрес сети побитово. Совпадают первые 13 бит ⇒ маска /13.</span><span class="step"><b>2</b>Хостовых бит: 32 − 13 = 19. Количество адресов = 2¹⁹.</span><span class="step"><b>3</b>2¹⁹ = <b>524288</b>.</span>',
      desc: 'Для узла с IP-адресом 120.216.74.153 адрес сети равен 120.216.0.0.',
      question: 'Чему равно наибольшее количество возможных адресов в этой сети?',
      answer: '524288' },
    { id: 's1t3', kind: 'указаны узел и маска', ip: '129.128.0.0', maskToSet: '255.128.0.0', maskHint: 9,
      hint: '<span class="step"><b>1</b>Маска 255.128.0.0 = /9: 9 единиц, 23 нуля.</span><span class="step"><b>2</b>Фиксированная часть (9 бит) содержит 6 нулей.</span><span class="step"><b>3</b>Минимум нулей — когда хостовые биты все = 1.</span><span class="step"><b>4</b>Ответ: <b>6</b>.</span>',
      desc: 'Сеть задана IP-адресом 129.128.0.0 и маской сети 255.128.0.0.',
      question: 'Определите минимальное количество нулей в двоичной записи IP-адреса в этой сети.',
      answer: '6' },
    { id: 's1t4', kind: 'указаны узел и маска', ip: '156.132.15.138', maskToSet: '255.255.252.0', maskHint: 22,
      hint: '<span class="step"><b>1</b>Маска /22 ⇒ 10 хостовых бит.</span><span class="step"><b>2</b>Номер компьютера = хостовая часть IP (IP AND NOT маска).</span><span class="step"><b>3</b>3-й байт: 15 = 00001111, маска 252 = 11111100, хостовая часть = 11.</span><span class="step"><b>4</b>4-й байт: 138 полностью хостовый.</span><span class="step"><b>5</b>Собираем: 11 10001010₂ = <b>906</b>.</span>',
      desc: 'Маска подсети 255.255.252.0, IP-адрес компьютера в сети 156.132.15.138.',
      question: 'Чему будет равен номер компьютера в сети?',
      answer: '906' },
    { id: 's1t5', kind: 'указаны узел и маска', ip: '102.162.200.51', maskToSet: '255.255.255.0', maskHint: 24,
      hint: '<span class="step"><b>1</b>Маска /24 ⇒ адрес сети 102.162.200.0, широковещательный 102.162.200.255.</span><span class="step"><b>2</b>Наибольший адрес узла: 102.162.200.254.</span><span class="step"><b>3</b>Сумма октетов: 102 + 162 + 200 + 254 = <b>718</b>.</span>',
      desc: 'Сеть задана IP-адресом 102.162.200.51 и сетевой маской 255.255.255.0.',
      question: 'Найдите в этой сети наибольший IP-адрес, который может быть назначен компьютеру. В ответе укажите сумму числовых значений октетов найденного IP-адреса.',
      answer: '718' }
  ]},
  { title: 'IP-адрес + адрес сети', tasks: [
    { id: 's2t1', kind: 'указаны узел и сеть', ip: '121.74.179.135', network: '121.74.179.128', maskHint: 25,
      hint: '<span class="step"><b>1</b>4-й байт: 135 = 10000111, 128 = 10000000. Совпадает 1 бит.</span><span class="step"><b>2</b>Маска /25 ⇒ 2⁷ = <b>128</b>.</span>',
      desc: 'Для узла с IP-адресом 121.74.179.135 адрес сети равен 121.74.179.128.',
      question: 'Чему равно наибольшее количество возможных адресов в этой сети?',
      answer: '128' },
    { id: 's2t2', kind: 'указаны узел и сеть', ip: '111.91.200.28', network: '111.91.192.0', maskHint: 20,
      hint: '<span class="step"><b>1</b>3-й байт: 200 = 11001000, 192 = 11000000. Совпадают 2 старших бита.</span><span class="step"><b>2</b>Маска от /18 до /24.</span><span class="step"><b>3</b>Наименьшее число нулей — самая длинная маска, при которой 3-й байт = 192. Это /26? Нет: 2 фикс. бита в 3-м байте ⇒ /18…/26.</span><span class="step"><b>4</b>Перебор масок, дающих адрес сети 111.91.192.0, даёт 12 нулей.</span>',
      desc: 'Для узла с IP-адресом 111.91.200.28 адрес сети равен 111.91.192.0.',
      question: 'Найдите наименьшее возможное количество нулей в двоичной записи маски подсети.',
      answer: '12' },
    { id: 's2t3', kind: 'указаны узел и сеть', ip: '132.243.87.85', network: '132.243.64.0', maskHint: 18,
      hint: '<span class="step"><b>1</b>3-й байт: 87 = 01010111, 64 = 01000000. Совпадают 2 старших бита.</span><span class="step"><b>2</b>Маска от /18 до /24.</span><span class="step"><b>3</b>Наибольшее число нулей — самая короткая маска = /18.</span><span class="step"><b>4</b>Нулей: 32 − 18 = <b>14</b>.</span>',
      desc: 'Для узла с IP-адресом 132.243.87.85 адрес сети равен 132.243.64.0.',
      question: 'Найдите наибольшее возможное количество нулей в записи маски подсети.',

// === ГЕНЕРАЦИЯ PYTHON-ШАБЛОНА ===
function buildCommentHeader(task) {
  var out = '# === РЕЗУЛЬТАТЫ (можно копировать) ===\n';
  out += '# IP-адреса в двоичном виде (байты через пробел):\n';
  var ips = [];
  if (task.ipList) ips = task.ipList.slice();
  else if (task.ip) ips.push(task.ip);
  if (task.network && ips.indexOf(task.network) === -1) ips.push(task.network);
  ips.forEach(function(ip) {
    out += '#   ' + ip + '  ->  ' + ipToBinBytesSpaced(ip) + '\n';
  });
  if (task.network) out += '# Адрес сети: ' + task.network + '\n';
  out += '# === /РЕЗУЛЬТАТЫ ===\n';
  return out;
}
function buildPyTemplate(task) {
  var s = '';
  s += buildCommentHeader(task);
  s += 'from itertools import product\n';
  s += 'l = []\n';
  s += "for ip in product('01', repeat=[[N]]):\n";
  s += "    ad = '[[АДРЕС]]'[:[[СРЕЗ]]] + ''.join(ip)\n";
  s += "    # ad = '[[БАЙТ1]]' + '[[БАЙТ2]]' + '[[БАЙТ3]]' + ''.join(ip)\n";
  s += '    if [[УСЛОВИЕ]]:\n';
  s += '        l.append(ad)\n';
  s += 'print(len(l))\n';
  s += 'if l:\n';
  s += '    print(l[0], l[-1])\n';
  return s;
}
function buildCodeHint() {
  return '' +
    '<span class="step"><b>1</b><b>Шапка с результатами</b> (строки с <code>#</code>) — там уже двоичные представления адресов <b>байтами через пробел</b>. Копируй оттуда нужные биты.</span>' +
    '<span class="step"><b>2</b><code>[[N]]</code> — сколько бит в <b>хостовой</b> части. Маска /24 ⇒ 8, маска /26 ⇒ 6.</span>' +
    '<span class="step"><b>3</b><code>[[АДРЕС]]</code> — весь 32-битный код сети (сплошной, без пробелов). <code>[[СРЕЗ]]</code> — сколько бит слева оставить (= число единиц маски).</span>' +
    '<span class="step"><b>4</b>Вторая строка с <code>#</code> — альтернатива: задать сеть байтами. Убери <code>#</code>, если хочешь её использовать.</span>' +
    '<span class="step"><b>5</b><code>[[УСЛОВИЕ]]</code> — условие задачи на Python. Например: <code>ad.count("1") == 15</code> или <code>ad.count("1") % 2 == 0</code>.</span>' +
    '<span class="step"><b>6</b>Нажми ▶ Запустить. Первый запуск грузит Python (10–20 сек), дальше — мгновенно.</span>';
}
function fillTemplate(code, task) {
  // Заменяем плейсхолдеры на значения (по умолчанию пустые)
  return code
    .replace('[[N]]', '')
    .replace('[[АДРЕС]]', '')
    .replace('[[СРЕЗ]]', '')
    .replace('[[БАЙТ1]]', '')
    .replace('[[БАЙТ2]]', '')
    .replace('[[БАЙТ3]]', '')
    .replace('[[УСЛОВИЕ]]', '');
}

// === PYODIDE ===
var pyodideReady = false, pyodideLoading = false, pyodideInstance = null, pyQueue = [];
function loadPyodideOnce(cb) {
  if (pyodideReady) { cb(); return; }
  pyQueue.push(cb);
  if (pyodideLoading) return;
  pyodideLoading = true;
  var script = document.createElement('script');
  script.src = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js';
  script.onload = function() {
    window.loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/' })
      .then(function(py) {
        pyodideInstance = py; pyodideReady = true;
        var q = pyQueue.slice(); pyQueue = [];
        q.forEach(function(f){ f(); });
      })
      .catch(function(err) {
        var q = pyQueue.slice(); pyQueue = [];
        q.forEach(function(f){ f(err); });
      });
  };
  script.onerror = function() {
    var err = new Error('Не удалось загрузить Pyodide (проверьте интернет)');
    var q = pyQueue.slice(); pyQueue = [];
    q.forEach(function(f){ f(err); });
  };
  document.head.appendChild(script);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}
function runPython(code, outEl, btn) {
  outEl.innerHTML = 'Загрузка Python…';
  btn.disabled = true;
  loadPyodideOnce(function(err) {
    if (err) {
      outEl.innerHTML = '<span class="err">Ошибка загрузки: ' + escapeHtml(err.message) + '</span>';
      btn.disabled = false; return;
    }
    try {
      pyodideInstance.runPython(
        'import sys, io\n_py_out = io.StringIO()\nsys.stdout = _py_out\n'
      );
      pyodideInstance.runPython(code);
      var result = pyodideInstance.runPython('_py_out.getvalue()');
      pyodideInstance.runPython('sys.stdout = sys.__stdout__');
      outEl.innerHTML = '<span class="ok">Вывод:</span>\n' + escapeHtml(result || '(пусто)');
    } catch (e) {
      try { pyodideInstance.runPython('sys.stdout = sys.__stdout__'); } catch(_) {}
      outEl.innerHTML = '<span class="err">Ошибка: ' + escapeHtml(e.message || String(e)) + '</span>';
    }
    btn.disabled = false;
  });
}

// === РЕНДЕР ===
(function() {
  try {
    var container = document.getElementById('tasks');
    if (!container) throw new Error('Не найден #tasks');

    sections.forEach(function(section) {
      var st = document.createElement('div');

      section.tasks.forEach(function(task) {
        try {

          var desc = document.createElement('p');
          desc.className = 'desc'; desc.textContent = task.desc;
          card.appendChild(desc);

          var q = document.createElement('p');
          q.className = 'question'; q.textContent = task.question;
          card.appendChild(q);

          if (task.hint) {
            var hintBox = document.createElement('div');
            hintBox.className = 'hint-box';
            hintBox.innerHTML = '<b>💡 Как решать:</b>' + task.hint;
            card.appendChild(hintBox);
          }

          // Таблица
          var t = document.createElement('div');
          t.className = 'addr-table';
          var rows = [];
          if (task.ipList) {
            task.ipList.forEach(function(ip, idx) {
              rows.push({ label: 'Узел ' + (idx + 1), html: ipBinHTML(ip, task.id, 'ipbit' + idx) });
            });
          } else if (task.ip) {
            rows.push({ label: 'IP', html: ipBinHTML(task.ip, task.id, 'ipbit') });
          }
          if (task.network) rows.push({ label: 'Сеть', html: ipBinHTML(task.network, task.id, 'netbit') });
          rows.push({ label: 'Маска', html: emptyMaskHTML(task.id), isMask: true });

          rows.forEach(function(row) {
            var lbl = document.createElement('div');
            lbl.className = 'addr-label'; lbl.textContent = row.label;
            t.appendChild(lbl);
            var bits = document.createElement('div');
            bits.className = 'addr-bits'; bits.innerHTML = row.html;
            t.appendChild(bits);
            if (row.isMask) {
              var bw = document.createElement('div');
              bw.style.gridColumn = '2 / 3'; bw.style.marginTop = '2px';
              bw.innerHTML = '<span class="mask-ones-badge" id="badge-' + task.id + '">/0 — 0 единиц</span>';
              t.appendChild(bw);
            }
          });
          card.appendChild(t);

          // Ползунок
          var sliderBox = document.createElement('div');
          sliderBox.className = 'mask-slider-box';
          sliderBox.innerHTML =
            '<input type="range" min="0" max="32" value="' + sliderStart + '" id="slider-' + task.id + '"' +
            (fixedOnes !== null ? ' disabled' : '') + '>' +
            '<span class="mask-counter">/<span id="ones-' + task.id + '">' + sliderStart + '</span></span>';
          if (fixedOnes !== null) sliderBox.classList.add('locked');
          card.appendChild(sliderBox);

          // Ответ
          var ansRow = document.createElement('div');
          ansRow.className = 'answer-row';
          ansRow.innerHTML =
            '<label>Ответ:</label>' +
            '<input type="text" id="answer-' + task.id + '" placeholder="число">' +
            '<button class="check-btn" id="check-' + task.id + '">Проверить</button>' +
            '<button class="reveal-btn" id="reveal-' + task.id + '">Показать ответ</button>' +
            '<span class="calc-hint" id="hint-' + task.id + '"></span>';
          card.appendChild(ansRow);

          var revealBox = document.createElement('div');
          revealBox.className = 'reveal-answer';
          revealBox.id = 'revealbox-' + task.id;
          revealBox.innerHTML = '<span class="label">Правильный ответ:</span><span class="value">' + task.answer + '</span>';
          card.appendChild(revealBox);

          // Python-блок
          var pyToggle = document.createElement('button');
          pyToggle.className = 'py-toggle-btn';
          pyToggle.innerHTML = '🐍 Решить кодом';
          card.appendChild(pyToggle);

          var pyPanel = document.createElement('div');
          pyPanel.className = 'py-panel';
          pyPanel.innerHTML =
            '<div class="py-head">Python (Pyodide) — правь и запускай</div>' +
            '<div class="py-toolbar"><button class="py-hint-btn">💡 Подсказка по коду</button></div>' +
            '<div class="py-hint-box">' + buildCodeHint() + '</div>' +
            '<textarea spellcheck="false"></textarea>' +
            '<button class="py-run-btn">▶ Запустить</button>' +
            '<div class="py-out">— вывод появится здесь —</div>';
          card.appendChild(pyPanel);

          var pyArea = pyPanel.querySelector('textarea');
          var pyRunBtn = pyPanel.querySelector('.py-run-btn');
          var pyOut = pyPanel.querySelector('.py-out');
          var pyHintBtn = pyPanel.querySelector('.py-hint-btn');
          var pyHintBox = pyPanel.querySelector('.py-hint-box');

          if (pyArea) pyArea.value = fillTemplate(buildPyTemplate(task), task);

          pyToggle.addEventListener('click', function() {
            pyPanel.classList.toggle('show');
            pyToggle.classList.toggle('active', pyPanel.classList.contains('show'));
          });
          pyHintBtn.addEventListener('click', function() {
            pyHintBox.classList.toggle('show');
            pyHintBtn.classList.toggle('active', pyHintBox.classList.contains('show'));
            pyHintBtn.textContent = pyHintBox.classList.contains('show')
              ? '💡 Скрыть подсказку' : '💡 Подсказка по коду';
          });
          pyRunBtn.addEventListener('click', function() {
            runPython(pyArea.value, pyOut, pyRunBtn);
          });

          container.appendChild(card);

          // Привязка
          var input = card.querySelector('#answer-' + task.id);
          var checkBtn = card.querySelector('#check-' + task.id);
          var revealBtn = card.querySelector('#reveal-' + task.id);
          var revealBoxEl = card.querySelector('#revealbox-' + task.id);
          var hintEl = card.querySelector('#hint-' + task.id);
          var slider = card.querySelector('#slider-' + task.id);
          var onesEl = card.querySelector('#ones-' + task.id);
          var badgeEl = card.querySelector('#badge-' + task.id);

          function getAnswerValue() {
            var raw = input.value.trim();
            if (!raw) { hintEl.textContent = ''; hintEl.className = 'calc-hint'; return null; }
            if (/^-?\d+(\.\d+)?$/.test(raw)) { hintEl.textContent = ''; return parseFloat(raw); }
            var val = safeCalc(raw);
            if (val === null) { hintEl.textContent = 'не число'; hintEl.className = 'calc-hint bad'; return null; }
            hintEl.textContent = '= ' + val; hintEl.className = 'calc-hint'; return val;
          }
          input.addEventListener('input', getAnswerValue);
          checkBtn.addEventListener('click', function() {
            var val = getAnswerValue();
            var expected = Number(task.answer);
            var ok = val !== null && Math.abs(val - expected) < 1e-9;
            input.classList.toggle('correct', ok);
            input.classList.toggle('wrong', !ok);
            revealBtn.classList.toggle('show', !ok);
            if (ok) revealBoxEl.classList.remove('show');
          });
          revealBtn.addEventListener('click', function() {
            revealBoxEl.classList.toggle('show');
            revealBtn.textContent = revealBoxEl.classList.contains('show') ? 'Скрыть ответ' : 'Показать ответ';
          });
          input.addEventListener('keydown', function(e) { if (e.key === 'Enter') checkBtn.click(); });

          function updateMask() {
            var n = parseInt(slider.value, 10);
            onesEl.textContent = n;
            var word = 'единиц';
            if (n % 10 === 1 && n % 100 !== 11) word = 'единица';
            else if ([2,3,4].indexOf(n % 10) !== -1 && [12,13,14].indexOf(n % 100) === -1) word = 'единицы';
            badgeEl.textContent = '/' + n + ' — ' + n + ' ' + word;
            if (fixedOnes !== null) badgeEl.classList.add('fixed');
            for (var i = 0; i < 32; i++) {
              var mBit = document.getElementById('maskbit-' + task.id + '-' + i);

                if (i < n) { mBit.textContent = '1'; mBit.classList.add('mask-one'); mBit.classList.remove('one'); }
                else { mBit.textContent = '0'; mBit.classList.remove('mask-one', 'one'); }
              }
            }
            if (task.ipList) {
              task.ipList.forEach(function(_, idx) {
                for (var i = 0; i < 32; i++) {
                  var b = document.getElementById('ipbit' + idx + '-' + task.id + '-' + i);
                  if (b) b.classList.toggle('covered', i < n);
                }
              });

              for (var i = 0; i < 32; i++) {
                var b = document.getElementById('ipbit-' + task.id + '-' + i);
                if (b) b.classList.toggle('covered', i < n);
              }
            }
            if (task.network) {
              for (var i = 0; i < 32; i++) {
                var b = document.getElementById('netbit-' + task.id + '-' + i);
                if (b) b.classList.toggle('covered', i < n);
              }
            }
          }
          slider.addEventListener('input', updateMask);
          updateMask();

          totalRendered++;
        } catch (e) {
          totalFailed++;
          console.error('Задача ' + task.id + ':', e);
          var err = document.createElement('div');
          err.className = 'error-box';
          err.textContent = 'Задача ' + task.id + ' не отрисована: ' + e.message;
          container.appendChild(err);
        }
      });
    });

    console.log('Отрисовано задач:', totalRendered, '| ошибок:', totalFailed);

    // Помощники
    var hPowA = document.getElementById('h-pow-a');
    var hPowRes = document.getElementById('h-pow-result');

      hPowRes.classList.remove('empty');
    });
    var bsumIds = ['h-bsum-a','h-bsum-b','h-bsum-c','h-bsum-d'];

    var updateBsum = function() {
      var any = false, total = 0;
      bsumIds.forEach(function(id) {
        var el = document.getElementById(id);
        if (!el) return;
        var raw = el.value.replace(/[^01]/g, '');

      });

      hBsumRes.textContent = total;
      hBsumRes.classList.remove('empty');

      var el = document.getElementById(id);
