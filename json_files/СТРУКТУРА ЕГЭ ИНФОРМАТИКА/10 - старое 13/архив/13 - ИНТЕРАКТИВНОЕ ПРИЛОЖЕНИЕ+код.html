<body>
<h1>Задание 13: IP-адреса и маски</h1>
<p class="subtitle">Если в задаче указана маска — она уже подставлена. Иначе тяните ползунок сами, глядя на адрес узла и адрес сети.</p>

<div id="errorBox"></div>
<div id="tasks"></div>

<div class="helper-panel">
  <h3>Помощники</h3>
  <div class="helper-row">
    <div class="formula">
      <span class="pow-base">2</span>
      <input type="text" class="rect pow-exponent" id="h-pow-a" placeholder="A" style="width:38px">
      <span>=</span>
      <span class="formula-result empty" id="h-pow-result">—</span>
    </div>
  </div>
  <div class="helper-row">
    <div class="bin-sum">
      <input type="text" class="rect" id="h-bsum-a" placeholder="0 и 1">
      <span class="plus">+</span>
      <input type="text" class="rect" id="h-bsum-b" placeholder="0 и 1">
      <span class="plus">+</span>
      <input type="text" class="rect" id="h-bsum-c" placeholder="0 и 1">
      <span class="plus">+</span>
      <input type="text" class="rect" id="h-bsum-d" placeholder="0 и 1">
      <span>=</span>
      <span class="formula-result empty" id="h-bsum-result">—</span>
    </div>
  </div>
</div>

<div class="sel-counter" id="selCounter"></div>

<script>
window.addEventListener('error', function(e) {
  const box = document.getElementById('errorBox');
  if (box) {
    box.innerHTML = '<div class="error-box">Ошибка JS: ' + e.message +
      '<br>Строка: ' + e.lineno + '</div>';
  }
  console.error(e);
});

(function() {
  'use strict';

  /* =============== УТИЛИТЫ =============== */
  function ipToBytes(ip) {
    return ip.split('.').map(function(n) { return parseInt(n, 10); });
  }
  function byteToBits(b) { return b.toString(2).padStart(8, '0'); }
  function ipToBin32(ip) {
    return ipToBytes(ip).map(byteToBits).join('');
  }
  /* Двоичное представление байтами через пробел: "11001001 00101100 11110000 00100001" */
  function ipToBinBytesSpaced(ip) {
    return ipToBytes(ip).map(byteToBits).join(' ');
  }
  /* Возвращает число единиц, если маска корректна (сначала 1, потом 0), иначе null */
  function maskToOnes(mask) {
    const bits = ipToBin32(mask);
    if (!/^1*0*$/.test(bits)) return null;
    return (bits.match(/1/g) || []).length;
  }

  function ipBinHTML(ip, taskId, prefix) {
    let pos = 0;
    return ipToBytes(ip).map(function(byte) { return byteToBits(byte); })
      .map(function(bits) {
        return bits.split('').map(function(ch) {
          const p = pos++;
          const id = (taskId != null && prefix) ? ' id="' + prefix + '-' + taskId + '-' + p + '"' : '';
          return '<span class="bit' + (ch === '1' ? ' one' : '') + '"' + id + '>' + ch + '</span>';
        }).join('');
      }).join('<span class="sep">.</span>');
  }
  function emptyMaskHTML(taskId) {
    let html = '';
    for (let byte = 0; byte < 4; byte++) {
      for (let b = 0; b < 8; b++) {
        const p = byte * 8 + b;
        html += '<span class="bit" id="maskbit-' + taskId + '-' + p + '">0</span>';
      }
      if (byte < 3) html += '<span class="sep">.</span>';
    }
    return html;
  }

  function safeCalc(expr) {
    const s = expr.replace(/\s+/g, '');
    if (!/^[0-9+\-*\/]+$/.test(s)) return null;
    const tokens = s.match(/(\d+|[+\-*/])/g);
    if (!tokens) return null;
    const stack = [Number(tokens[0])];
    let i = 1;
    while (i < tokens.length) {
      const op = tokens[i];
      const num = Number(tokens[i + 1]);
      if (isNaN(num)) return null;
      if (op === '*') { stack[stack.length - 1] *= num; }
      else if (op === '/') { if (num === 0) return null; stack[stack.length - 1] /= num; }
      else if (op === '+') { stack.push(num); }
      else if (op === '-') { stack.push(-num); }
      else return null;
      i += 2;
    }
    return stack.reduce(function(a, b) { return a + b; }, 0);
  }

  /* =============== СЧЁТЧИК ВЫДЕЛЕНИЯ =============== */
  const selCounter = document.getElementById('selCounter');
  function countBitsInSelection() {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || sel.rangeCount === 0) return null;
    const text = sel.toString();
    if (!text) return null;
    const bits = (text.match(/[01]/g) || []).length;
    if (bits === 0) return null;
    const range = sel.getRangeAt(0);
    const container = range.commonAncestorContainer;
    const el = container.nodeType === 1 ? container : container.parentElement;
    if (!el || !el.closest('.addr-bits')) return null;
    const rects = range.getClientRects();
    if (rects.length === 0) return null;
    const last = rects[rects.length - 1];
    const middle = rects[Math.floor(rects.length / 2)];
    return { bits: bits, x: middle.left + middle.width / 2, y: last.bottom + 8 };
  }
  function updateSelectionCounter() {
    const info = countBitsInSelection();
    if (!info) { selCounter.classList.remove('show'); return; }
    selCounter.textContent = 'Выделено битов: ' + info.bits;
    selCounter.style.left = info.x + 'px';
    selCounter.style.top = info.y + 'px';
    selCounter.classList.add('show');
  }
  document.addEventListener('selectionchange', updateSelectionCounter);
  document.addEventListener('mouseup', function() { setTimeout(updateSelectionCounter, 0); });
  document.addEventListener('scroll', function() {
    if (selCounter.classList.contains('show')) updateSelectionCounter();
  }, true);
  document.addEventListener('keyup', updateSelectionCounter);

  /* =============== ЗАДАЧИ =============== */
  const sections = [
    {
      title: 'IP-адрес + маска сети',
      tasks: [
        { id: 's1t1', kind: 'указана маска', ip: '255.255.255.128', maskToSet: '255.255.255.128', maskHint: 25,
          hint: 'Маска 255.255.255.128 = /25. Хостовая часть — последние 7 бит. Адресов узлов = 2⁷ − 2 = 128 − 2.',
          desc: 'Для подсети используется маска 255.255.255.128.',
          question: 'Сколько различных адресов компьютеров теоретически допускает эта маска, если два адреса (адрес сети и широковещательный) не используют?',
          answer: '126' },
        { id: 's1t2', kind: 'указаны узел и сеть', ip: '120.216.74.153', network: '120.216.0.0', maskHint: 13,
          hint: 'Найди, где кончается общая часть адреса узла и адреса сети — это и есть граница маски. Затем 2^(32−k).',
          desc: 'Для узла с IP-адресом 120.216.74.153 адрес сети равен 120.216.0.0.',
          question: 'Чему равно наибольшее количество возможных адресов в этой сети?',
          answer: '524288' },
        { id: 's1t3', kind: 'указаны узел и маска', ip: '129.128.0.0', maskToSet: '255.128.0.0', maskHint: 9,
          hint: 'Маска 255.128.0.0 = /9. Хостовая часть — 23 бита. Наименьшее число нулей — когда все хостовые биты = 1.',
          desc: 'Сеть задана IP-адресом 129.128.0.0 и маской сети 255.128.0.0.',
          question: 'Определите минимальное количество нулей в двоичной записи IP-адреса в этой сети.',
          answer: '6' },
        { id: 's1t4', kind: 'указаны узел и маска', ip: '156.132.15.138', maskToSet: '255.255.252.0', maskHint: 22,
          hint: 'Номер компьютера = IP & ~маска (хостовая часть как число).',
          desc: 'Маска подсети 255.255.252.0, IP-адрес компьютера в сети 156.132.15.138.',
          question: 'Чему будет равен номер компьютера в сети?',
          answer: '906' },
        { id: 's1t5', kind: 'указаны узел и маска', ip: '102.162.200.51', maskToSet: '255.255.255.0', maskHint: 24,
          hint: 'Наибольший адрес узла = адрес сети + (2^(32−k) − 2). Затем сложи октеты.',
          desc: 'Сеть задана IP-адресом 102.162.200.51 и сетевой маской 255.255.255.0.',
          question: 'Найдите в этой сети наибольший IP-адрес, который может быть назначен компьютеру. В ответе укажите сумму числовых значений октетов найденного IP-адреса.',
          answer: '718' }
      ]
    },
    {
      title: 'IP-адрес + адрес сети',
      tasks: [
        { id: 's2t1', kind: 'указаны узел и сеть', ip: '121.74.179.135', network: '121.74.179.128', maskHint: 25,
          hint: 'IP и адрес сети совпадают до последнего байта (128). Маска = /25, значит 2⁷ = 128.',
          desc: 'Для узла с IP-адресом 121.74.179.135 адрес сети равен 121.74.179.128.',
          question: 'Чему равно наибольшее количество возможных адресов в этой сети?',
          answer: '128' },
        { id: 's2t2', kind: 'указаны узел и сеть', ip: '111.91.200.28', network: '111.91.192.0', maskHint: 20,

      title: 'IP-адрес + маска сети с параметром А',
      tasks: [
        { id: 's9t1', kind: 'узел и маска с параметром A', ip: '108.8.190.123', maskHint: 16,
          hint: 'Маска 255.255.A.0. Перебирай A от 0 до 255 и проверяй условие для всех адресов сети.',
          desc: 'Сеть, в которой содержится узел с IP-адресом 108.8.190.123, задана маской сети 255.255.A.0.',
          question: 'Определите минимальное значение A, для которого для всех IP-адресов этой сети суммарное количество единиц в левых двух байтах не более суммарного количества единиц в правых двух байтах.',
          answer: '252' }
      ]
    }
  ];

  /* =============== ГЕНЕРАЦИЯ PYTHON-ШАБЛОНА =============== */
  function escHtml(s) {
    return String(s).replace(/[&<>]/g, function(c) {
      return ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c];
    });
  }
  function slot(placeholder, cls) {
    return '<input class="py-slot' + (cls ? ' ' + cls : '') +
           '" type="text" contenteditable="false" placeholder="' +
           escHtml(placeholder) + '">';
  }

  /* Шапка с закомментированными результатами: байты через пробел */
  function buildCommentHeader(task) {
    var out = '';
    out += '# === РЕЗУЛЬТАТЫ (можно копировать) ===\n';
    out += '# IP-адреса в двоичном виде (байты через пробел):\n';
    var ips = [];
    if (task.ipList) ips = task.ipList.slice();
    else if (task.ip) ips.push(task.ip);
    if (task.network && ips.indexOf(task.network) === -1) ips.push(task.network);
    ips.forEach(function(ip) {
      out += '#   ' + ip + '  ->  ' + ipToBinBytesSpaced(ip) + '\n';
    });
    if (task.network) {
      out += '# Адрес сети: ' + task.network + '\n';
    }
    out += '# === /РЕЗУЛЬТАТЫ ===\n';
    return out;
  }

  function buildPyTemplate(task) {
    var html = '';
    // Закомментированная шапка с результатами
    html += escHtml(buildCommentHeader(task));
    // Код без пустых строк
    html += escHtml("from itertools import product\n");
    html += escHtml("l = []\n");
    html += escHtml("for ip in product('01', repeat=") + slot('N') + escHtml("):\n");

    // Вариант 1 (активен по умолчанию): со срезом
    html += escHtml("    ad = '") + slot('весь 32-битный код', 'xwide') +
            escHtml("'[:") + slot('срез') + escHtml("] + ''.join(ip)\n");

    // Вариант 2 (закомментирован): по байтам
    html += escHtml("    # ad = '") + slot('1-й байт') + escHtml("' + '") +
            slot('2-й байт') + escHtml("' + '") +
            slot('3-й байт') + escHtml("' + ''.join(ip)\n");

    // Условие
    html += escHtml('    if ') + slot('условие', 'wide') + escHtml(':\n');
    html += escHtml('        l.append(ad)\n');
    html += escHtml('print(len(l))\n');
    html += escHtml('if l:\n');
    html += escHtml('    print(l[0], l[-1])\n');
    return html;
  }

  /* =============== СБОРКА КОДА ИЗ РЕДАКТОРА =============== */
  function collectPyCode(editorEl) {
    var clone = editorEl.cloneNode(true);
    clone.querySelectorAll('input.py-slot').forEach(function(inp) {
      var val = inp.value.trim();
      var txt = document.createTextNode(val === '' ? ' ' : val);
      inp.parentNode.replaceChild(txt, inp);
    });
    var raw = clone.innerHTML;
    raw = raw.replace(/<br\s*\/?>/gi, '\n');
    raw = raw.replace(/<div[^>]*>/gi, '\n').replace(/<\/div>/gi, '');
    var tmp = document.createElement('div');
    tmp.innerHTML = raw;
    var text = tmp.textContent || tmp.innerText || '';
    return text.replace(/^\n+/, '');
  }

  /* =============== PYTHON RUNNER (Pyodide) =============== */
  var pyodideReady = false;
  var pyodideLoading = false;
  var pyodideInstance = null;
  var pyQueue = [];

  function loadPyodideOnce(callback) {
    if (pyodideReady) { callback(); return; }
    pyQueue.push(callback);
    if (pyodideLoading) return;
    pyodideLoading = true;

    var script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js';
    script.onload = function() {
      window.loadPyodide({
        indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/'
      }).then(function(py) {
        pyodideInstance = py;
        pyodideReady = true;
        var q = pyQueue.slice(); pyQueue = [];
        q.forEach(function(cb) { cb(); });
      }).catch(function(err) {
        console.error('Pyodide load error:', err);
        var q = pyQueue.slice(); pyQueue = [];
        q.forEach(function(cb) { cb(err); });
      });
    };
    script.onerror = function() {
      var err = new Error('Не удалось загрузить Pyodide (проверьте интернет)');
      var q = pyQueue.slice(); pyQueue = [];
      q.forEach(function(cb) { cb(err); });
    };
    document.head.appendChild(script);
  }

  function runPython(code, outEl, btn) {
    outEl.innerHTML = 'Загрузка Python…';
    btn.disabled = true;
    loadPyodideOnce(function(err) {
      if (err) {
        outEl.innerHTML = '<span class="err">Ошибка загрузки: ' + escHtml(err.message) + '</span>';
        btn.disabled = false;
        return;
      }
      try {
        pyodideInstance.runPython(
          'import sys, io\n' +
          '_py_out = io.StringIO()\n' +
          'sys.stdout = _py_out\n'
        );
        pyodideInstance.runPython(code);
        var result = pyodideInstance.runPython('_py_out.getvalue()');
        pyodideInstance.runPython('sys.stdout = sys.__stdout__');
        outEl.innerHTML = '<span class="ok">Вывод:</span>\n' + escHtml(result || '(пусто)');
      } catch (e) {
        try { pyodideInstance.runPython('sys.stdout = sys.__stdout__'); } catch(_) {}
        outEl.innerHTML = '<span class="err">Ошибка: ' + escHtml(e.message || String(e)) + '</span>';
      }
      btn.disabled = false;
    });
  }

  /* =============== РЕНДЕР =============== */
  const container = document.getElementById('tasks');
  let totalRendered = 0, totalFailed = 0;

  sections.forEach(function(section) {
    const st = document.createElement('div');
    st.className = 'section-title';
    st.textContent = section.title;
    container.appendChild(st);

    section.tasks.forEach(function(task) {
      try {
        var fixedOnes = null;
        if (task.maskToSet) {
          fixedOnes = maskToOnes(task.maskToSet);
        }
        var sliderStart = (fixedOnes !== null) ? fixedOnes : 0;

        const card = document.createElement('div');
        card.className = 'task';

        const h2 = document.createElement('h2');
        h2.textContent = 'Задача ' + (totalRendered + 1) + ' — ' + task.kind;
        card.appendChild(h2);

        const desc = document.createElement('p');
        desc.className = 'desc';
        desc.textContent = task.desc;
        card.appendChild(desc);

        const q = document.createElement('p');
        q.className = 'question';
        q.textContent = task.question;
        card.appendChild(q);

        if (task.hint) {
          const hintBox = document.createElement('div');
          hintBox.className = 'hint-box';
          hintBox.innerHTML = '<b>💡 Подсказка:</b> ' + task.hint;
          card.appendChild(hintBox);
        }

        /* Таблица битов */
        const t = document.createElement('div');
        t.className = 'addr-table';
        const rows = [];
        if (task.ipList) {
          task.ipList.forEach(function(ip, idx) {
            rows.push({ label: 'Узел ' + (idx + 1), html: ipBinHTML(ip, task.id, 'ipbit' + idx) });
          });
        } else if (task.ip) {
          rows.push({ label: 'IP', html: ipBinHTML(task.ip, task.id, 'ipbit') });
        }
        if (task.network) {
          rows.push({ label: 'Сеть', html: ipBinHTML(task.network, task.id, 'netbit') });
        }
        rows.push({ label: 'Маска', html: emptyMaskHTML(task.id), isMask: true });

        rows.forEach(function(row) {
          const lbl = document.createElement('div');
          lbl.className = 'addr-label'; lbl.textContent = row.label;
          t.appendChild(lbl);
          const bits = document.createElement('div');
          bits.className = 'addr-bits'; bits.innerHTML = row.html;
          t.appendChild(bits);
          if (row.isMask) {
            const badgeWrap = document.createElement('div');
            badgeWrap.style.gridColumn = '2 / 3';
            badgeWrap.style.marginTop = '2px';
            badgeWrap.innerHTML = '<span class="mask-ones-badge" id="badge-' + task.id + '">/0 — 0 единиц</span>';
            t.appendChild(badgeWrap);
          }
        });
        card.appendChild(t);

        /* Ползунок */
        const sliderBox = document.createElement('div');
        sliderBox.className = 'mask-slider-box';
        sliderBox.innerHTML =
          '<input type="range" min="0" max="32" value="' + sliderStart + '" id="slider-' + task.id + '"' +
          (fixedOnes !== null ? ' disabled' : '') + '>' +
          '<span class="mask-counter">/<span id="ones-' + task.id + '">' + sliderStart + '</span></span>';
        if (fixedOnes !== null) {
          sliderBox.classList.add('locked');
          sliderBox.title = 'Маска задана в условии и не изменяется';
        }
        card.appendChild(sliderBox);

        /* Ответ */
        const ansRow = document.createElement('div');
        ansRow.className = 'answer-row';
        ansRow.innerHTML =
          '<label>Ответ:</label>' +
          '<input type="text" id="answer-' + task.id + '" placeholder="число или выражение">' +
          '<button class="check-btn" id="check-' + task.id + '">Проверить</button>' +
          '<button class="reveal-btn" id="reveal-' + task.id + '">Показать ответ</button>' +
          '<span class="calc-hint" id="hint-' + task.id + '"></span>';
        card.appendChild(ansRow);

        const revealBox = document.createElement('div');
        revealBox.className = 'reveal-answer';
        revealBox.id = 'revealbox-' + task.id;
        revealBox.innerHTML = '<span class="label">Правильный ответ:</span><span class="value">' + task.answer + '</span>';
        card.appendChild(revealBox);

        /* ===== PYTHON-БЛОК ===== */
        const pyToggle = document.createElement('button');
        pyToggle.className = 'py-toggle-btn';
        pyToggle.innerHTML = '🐍 Решить кодом';
        card.appendChild(pyToggle);

        const pyPanel = document.createElement('div');
        pyPanel.className = 'py-panel';
        pyPanel.innerHTML =
          '<div class="py-head">Python (Pyodide) — правь и запускай</div>' +
          '<div class="py-editor" contenteditable="true" spellcheck="false"></div>' +
          '<button class="py-run-btn">▶ Запустить</button>' +
          '<div class="py-out">— вывод появится здесь —</div>';
        card.appendChild(pyPanel);

        const pyEditor = pyPanel.querySelector('.py-editor');
        const pyRunBtn = pyPanel.querySelector('.py-run-btn');
        const pyOut = pyPanel.querySelector('.py-out');

        if (pyEditor) {
          pyEditor.innerHTML = buildPyTemplate(task);
        }

        pyToggle.addEventListener('click', function() {
          pyPanel.classList.toggle('show');
          pyToggle.classList.toggle('active', pyPanel.classList.contains('show'));
        });

        if (pyRunBtn && pyEditor && pyOut) {
          pyRunBtn.addEventListener('click', function() {
            var code = collectPyCode(pyEditor);
            runPython(code, pyOut, pyRunBtn);
          });
        }

        container.appendChild(card);

        /* ===== ПРИВЯЗКА ОСТАЛЬНЫХ ЭЛЕМЕНТОВ ===== */
        const input = card.querySelector('#answer-' + task.id);
        const checkBtn = card.querySelector('#check-' + task.id);
        const revealBtn = card.querySelector('#reveal-' + task.id);
        const revealBoxEl = card.querySelector('#revealbox-' + task.id);
        const hintEl = card.querySelector('#hint-' + task.id);
        const slider = card.querySelector('#slider-' + task.id);
        const onesEl = card.querySelector('#ones-' + task.id);
        const badgeEl = card.querySelector('#badge-' + task.id);

        function getAnswerValue() {
          const raw = input.value.trim();
          if (!raw) { hintEl.textContent = ''; hintEl.className = 'calc-hint'; return null; }
          if (/^-?\d+(\.\d+)?$/.test(raw)) {
            hintEl.textContent = '';
            hintEl.className = 'calc-hint';
            return parseFloat(raw);
          }
          const val = safeCalc(raw);
          if (val === null) {
            hintEl.textContent = 'не число';
            hintEl.className = 'calc-hint bad';
            return null;
          }
          const disp = Number.isInteger(val) ? val : val.toFixed(3);
          hintEl.textContent = '= ' + disp;
          hintEl.className = 'calc-hint';
          return val;
        }
        input.addEventListener('input', getAnswerValue);

        checkBtn.addEventListener('click', function() {
          const val = getAnswerValue();
          const expected = Number(task.answer);
          const ok = val !== null && Math.abs(val - expected) < 1e-9;
          input.classList.toggle('correct', ok);
          input.classList.toggle('wrong', !ok);
          hintEl.className = 'calc-hint ' + (ok ? 'ok' : (val === null ? 'bad' : ''));
          revealBtn.classList.toggle('show', !ok);
          if (ok) revealBoxEl.classList.remove('show');
        });
        revealBtn.addEventListener('click', function() {
          revealBoxEl.classList.toggle('show');
          revealBtn.textContent = revealBoxEl.classList.contains('show') ? 'Скрыть ответ' : 'Показать ответ';
        });
        input.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') checkBtn.click();
        });

        const updateMask = function() {
          const n = parseInt(slider.value, 10);
          onesEl.textContent = n;
          let word = 'единиц';
          if (n % 10 === 1 && n % 100 !== 11) word = 'единица';
          else if ([2,3,4].indexOf(n % 10) !== -1 && [12,13,14].indexOf(n % 100) === -1) word = 'единицы';
          badgeEl.textContent = '/' + n + ' — ' + n + ' ' + word;
          if (fixedOnes !== null) badgeEl.classList.add('fixed');
          else badgeEl.classList.remove('fixed');

          for (let i = 0; i < 32; i++) {
            const mBit = document.getElementById('maskbit-' + task.id + '-' + i);
            if (mBit) {
              if (i < n) {
                mBit.textContent = '1';
                mBit.classList.add('mask-one');
                mBit.classList.remove('one');
              } else {
                mBit.textContent = '0';
                mBit.classList.remove('mask-one', 'one');
              }
            }
          }
          if (task.ipList) {
            task.ipList.forEach(function(_, idx) {
              for (let i = 0; i < 32; i++) {
                const b = document.getElementById('ipbit' + idx + '-' + task.id + '-' + i);
                if (b) b.classList.toggle('covered', i < n);
              }
            });
          } else if (task.ip) {
            for (let i = 0; i < 32; i++) {
              const b = document.getElementById('ipbit-' + task.id + '-' + i);
              if (b) b.classList.toggle('covered', i < n);
            }
          }
          if (task.network) {
            for (let i = 0; i < 32; i++) {
              const b = document.getElementById('netbit-' + task.id + '-' + i);
              if (b) b.classList.toggle('covered', i < n);
            }
          }
        };
        slider.addEventListener('input', updateMask);
        updateMask();

        totalRendered++;
      } catch (e) {
        totalFailed++;
        console.error('Задача ' + task.id + ':', e);
        const err = document.createElement('div');
        err.className = 'error-box';
        err.textContent = 'Задача ' + task.id + ' не отрисована: ' + e.message;
        container.appendChild(err);
      }
    });
  });

  console.log('Отрисовано задач:', totalRendered, '| ошибок:', totalFailed);

  /* =============== ПОМОЩНИКИ =============== */
  const hPowA = document.getElementById('h-pow-a');
  const hPowRes = document.getElementById('h-pow-result');
  hPowA.addEventListener('input', function() {
    const a = parseInt(hPowA.value, 10);
    if (isNaN(a)) { hPowRes.textContent = '—'; hPowRes.classList.add('empty'); return; }
    hPowRes.textContent = Math.pow(2, a);
    hPowRes.classList.remove('empty');
  });

  const bsumIds = ['h-bsum-a','h-bsum-b','h-bsum-c','h-bsum-d'];
  const hBsumRes = document.getElementById('h-bsum-result');
  const updateBsum = function() {
    let any = false, total = 0;
    bsumIds.forEach(function(id) {
      const el = document.getElementById(id);
      if (!el) return;
      const raw = el.value.replace(/[^01]/g, '');
      if (raw !== el.value) el.value = raw;
      if (raw) { total += parseInt(raw, 2); any = true; }
    });
    if (!any) { hBsumRes.textContent = '—'; hBsumRes.classList.add('empty'); return; }
    hBsumRes.textContent = total;
    hBsumRes.classList.remove('empty');
  };
  bsumIds.forEach(function(id) {
    const el = document.getElementById(id);
    if (el) el.addEventListener('input', updateBsum);
  });
})();
</script>
</body>
</html>
