  .hint-btn {

<body>
<h1>Задание 13: свежие задачи (Кабанов)</h1>
<p class="subtitle">Задачи 2024–2027 гг. Если не получается — жми «Подсказка» (ответ она НЕ показывает). В поле ответа можно вводить выражение: <b>2+3+5+7-2*6</b>.</p>

<div id="errorBox"></div>
<div id="tasks"></div>

<div class="helper-panel">
  <h3>Помощники</h3>
  <div class="helper-row">
    <div class="formula">
      <span class="pow-base">2</span>
      <input type="text" class="rect pow-exponent" id="h-pow-a" placeholder="A" style="width:38px">

      <span class="plus">+</span>
      <input type="text" class="rect" id="h-bsum-c" placeholder="0 и 1">
      <span class="plus">+</span>
      <input type="text" class="rect" id="h-bsum-d" placeholder="0 и 1">
      <span>=</span>
      <span class="formula-result empty" id="h-bsum-result">—</span>
    </div>
  </div>
</div>

<div class="sel-counter" id="selCounter"></div>

<script>
window.addEventListener('error', function(e) {
  const box = document.getElementById('errorBox');
  if (box) {
    box.innerHTML = '<div class="error-box">Ошибка JS: ' + e.message +
      '<br>Строка: ' + e.lineno + '</div>';
  }
  console.error(e);
});

(function() {
  'use strict';

  /* =============== УТИЛИТЫ =============== */
  function ipToBytes(ip) {
    return ip.split('.').map(function(n) { return parseInt(n, 10); });
  }
  function byteToBits(b) { return b.toString(2).padStart(8, '0'); }

  function ipBinHTML(ip, taskId, prefix) {
    let pos = 0;
    return ipToBytes(ip).map(function(byte) { return byteToBits(byte); })
      .map(function(bits) {
        return bits.split('').map(function(ch) {
          const p = pos++;
          const id = (taskId != null && prefix) ? ' id="' + prefix + '-' + taskId + '-' + p + '"' : '';
          return '<span class="bit' + (ch === '1' ? ' one' : '') + '"' + id + '>' + ch + '</span>';
        }).join('');
      }).join('<span class="sep">.</span>');
  }
  function emptyMaskHTML(taskId) {
    let html = '';
    for (let byte = 0; byte < 4; byte++) {
      for (let b = 0; b < 8; b++) {
        const p = byte * 8 + b;
        html += '<span class="bit" id="maskbit-' + taskId + '-' + p + '">0</span>';
      }
      if (byte < 3) html += '<span class="sep">.</span>';
    }
    return html;
  }

  function safeCalc(expr) {
    const s = expr.replace(/\s+/g, '');
    if (!/^[0-9+\-*\/]+$/.test(s)) return null;
    const tokens = s.match(/(\d+|[+\-*/])/g);
    if (!tokens) return null;
    const stack = [Number(tokens[0])];
    let i = 1;
    while (i < tokens.length) {
      const op = tokens[i];
      const num = Number(tokens[i + 1]);
      if (isNaN(num)) return null;
      if (op === '*') { stack[stack.length - 1] *= num; }
      else if (op === '/') { if (num === 0) return null; stack[stack.length - 1] /= num; }
      else if (op === '+') { stack.push(num); }
      else if (op === '-') { stack.push(-num); }
      else return null;
      i += 2;
    }
    return stack.reduce(function(a, b) { return a + b; }, 0);
  }

  /* =============== СЧЁТЧИК ВЫДЕЛЕНИЯ =============== */
  const selCounter = document.getElementById('selCounter');
  function countBitsInSelection() {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || sel.rangeCount === 0) return null;
    const text = sel.toString();
    if (!text) return null;
    const bits = (text.match(/[01]/g) || []).length;
    if (bits === 0) return null;
    const range = sel.getRangeAt(0);
    const container = range.commonAncestorContainer;
    const el = container.nodeType === 1 ? container : container.parentElement;
    if (!el || !el.closest('.addr-bits')) return null;
    const rects = range.getClientRects();
    if (rects.length === 0) return null;
    const last = rects[rects.length - 1];
    const middle = rects[Math.floor(rects.length / 2)];
    return { bits: bits, x: middle.left + middle.width / 2, y: last.bottom + 8 };
  }
  function updateSelectionCounter() {
    const info = countBitsInSelection();
    if (!info) { selCounter.classList.remove('show'); return; }
    selCounter.textContent = 'Выделено битов: ' + info.bits;
    selCounter.style.left = info.x + 'px';
    selCounter.style.top = info.y + 'px';
    selCounter.classList.add('show');
  }
  document.addEventListener('selectionchange', updateSelectionCounter);
  document.addEventListener('mouseup', function() { setTimeout(updateSelectionCounter, 0); });
  document.addEventListener('scroll', function() {
    if (selCounter.classList.contains('show')) updateSelectionCounter();
  }, true);
  document.addEventListener('keyup', updateSelectionCounter);

  /* =============== ЗАДАЧИ =============== */
  /* hint — инструкция, куда тянуть, на что смотреть, как сделать вывод.
     В hint НЕТ финального ответа — только направление. */
  const sections = [
    {
      title: 'Демоверсии 2024–2027',
      tasks: [
        { id: 't31507', kind: 'узел + маска', ip: '192.168.159.86', maskStart: 22,
          desc: 'Даны адрес узла 192.168.159.86 и маска 255.255.252.0.',
          question: 'Найдите адрес сети. В ответе укажите сумму числовых значений октетов найденного IP-адреса.',
          answer: '446',
          hint: '📌 Маска 255.255.252.0 — тяни ползунок до /22 (в третьем байте 6 единиц).\n\n1. Что смотреть: биты узла под нулями маски (третий и четвёртый байты) затемняются — они превратятся в нули.\n2. Адрес сети: 192.168.159.86 → 192.168.<X>.0, где X = 159, у которого младшие 2 бита обнулены.\n3. Из чего делать вывод: сложи 4 октета адреса сети. 192 + 168 + X + 0.\n\nПодсказка по арифметике: 159 = 10011111₂. Обнулить 2 младших бита → 10011100₂.' },

        { id: 't23751', kind: 'узел + маска', ip: '191.128.66.83', maskStart: 10,
          desc: 'Сеть задана IP-адресом одного из входящих в неё узлов 191.128.66.83 и сетевой маской 255.192.0.0.',
          question: 'Найдите в данной сети наибольший IP-адрес, который может быть назначен компьютеру. В ответе укажите найденный IP-адрес без разделителей.',
          answer: '191191255254',
          hint: '📌 Маска 255.192.0.0 = /10. Тяни ползунок до 10 единиц.\n\n1. Что смотреть: под нулями маски затемняются биты, которые можно свободно менять.\n2. Наибольший адрес для компьютера: все хостовые биты = 1, КРОМЕ последнего бита (иначе это широковещательный). То есть последний байт = 254.\n3. Из чего делать вывод: склей 4 октета без точек: 191 . 191 . 255 . 254.\n\nВнимание: первый байт и часть второго фиксированы маской — их не трогаем.' },

        { id: 't10095', kind: 'узел + маска', ip: '192.168.32.160', maskStart: 28,
          desc: 'Сеть задана IP-адресом 192.168.32.160 и маской сети 255.255.255.240.',
          question: 'Сколько в этой сети IP-адресов, для которых сумма единиц в двоичной записи IP-адреса чётна?',
          answer: '8',
          hint: '📌 Маска /28. Тяни ползунок до 28.\n\n1. Что смотреть: в узле 192.168.32.160 под нулями маски остаются только 4 младших бита 4-го байта (2⁴ = 16 адресов).\n2. Всего адресов в сети: 16. Из них 2 служебных (адрес сети и широковещательный) — но в этой задаче считаем ВСЕ адреса, включая их.\n3. Из чего делать вывод: проверь, у скольких из 16 адресов сумма единиц чётна. Ровно половина (для каждого фиксированного префикса) → 16/2.\n\nМожно посчитать вручную, перебрав 16 значений последнего байта от .160 до .175.' },

        { id: 't17867', kind: 'узел + маска', ip: '172.16.168.0', maskStart: 21,
          desc: 'Сеть задана IP-адресом 172.16.168.0 и маской сети 255.255.248.0.',
          question: 'Сколько в этой сети IP-адресов, для которых количество единиц в двоичной записи IP-адреса не кратно 5?',
          answer: '1789',
          hint: '📌 Маска /21. Тяни ползунок до 21.\n\n1. Что смотреть: 32 − 21 = 11 хостовых бит. Всего адресов 2¹¹ = 2048.\n2. Среди них надо найти те, у которых число единиц в 32-битной записи НЕ делится на 5.\n3. Из чего делать вывод: перебор 2¹¹ вариантов в уме сложен. Подумай, что фиксированный префикс даёт +N единиц, а переменная часть добавляет от 0 до 11. Ищи по числу единиц в переменной части.\n\nОбщая формула: сумма единиц в IP = (единицы в фиксированном префиксе) + (единицы в переменной части).' }
      ]
    },
    {
      title: 'Основная волна 2026',
      tasks: [
        { id: 't31151', kind: 'узел + маска', ip: '185.249.55.138', maskStart: 18,
          desc: 'Сеть задана IP-адресом одного из входящих в неё узлов 185.249.55.138 и сетевой маской 255.255.192.0.',
          question: 'Найдите её широковещательный IP-адрес. В ответе укажите сумму числовых значений октетов найденного IP-адреса.',
          answer: '766',
          hint: '📌 Маска 255.255.192.0 = /18. Тяни до 18.\n\n1. Что смотреть: под нулями маски — биты, которые у широковещательного адреса становятся ЕДИНИЦАМИ.\n2. Широковещательный = адрес сети + все хостовые биты → 1 (последние 14 бит).\n3. Из чего делать вывод: сложи 4 октета получившегося широковещательного адреса.\n\nНапример, 3-й байт: 55 = 00110111₂, под нулями маски младшие 6 бит → станут 111111₂.' },

        { id: 't31120', kind: 'узел + маска', ip: '189.163.226.71', maskStart: 28,
          desc: 'Сеть задана IP-адресом одного из входящих в неё узлов 189.163.226.71 и сетевой маской 255.255.255.240.',
          question: 'Найдите IP-адрес сети. В ответе укажите сумму числовых значений октетов найденного IP-адреса.',
          answer: '659',
          hint: '📌 Маска /28. Тяни до 28.\n\n1. Что смотреть: под нулями маски в узле затемняются младшие 4 бита 4-го байта — они обнуляются в адресе сети.\n2. Адрес сети: 189.163.226.<X>, где X = 71 с обнулёнными 4 младшими битами.\n3. Из чего делать вывод: 71 = 01000111₂. Обнуляем 4 младших → 01000000₂ = 64. Значит, X = 64. Складываем: 189 + 163 + 226 + 64.' }
      ]
    },
    {
      title: 'Пересдача и резерв 2026',
      tasks: [
        { id: 't31359', kind: 'узел + маска', ip: '154.141.198.190', maskStart: 18,
          desc: 'Сеть задана IP-адресом одного из входящих в неё узлов 154.141.198.190 и сетевой маской 255.255.192.0.',

  /* =============== РЕНДЕР =============== */
  const container = document.getElementById('tasks');
  let totalRendered = 0, totalFailed = 0;

  sections.forEach(function(section) {
    const st = document.createElement('div');
    st.className = 'section-title';
    st.textContent = section.title;
    container.appendChild(st);

    section.tasks.forEach(function(task) {
      try {
        const card = document.createElement('div');
        card.className = 'task';

        const h2 = document.createElement('h2');
        h2.textContent = 'Задача ' + (totalRendered + 1) + ' — ' + task.kind;
        card.appendChild(h2);

        const desc = document.createElement('p');
        desc.className = 'desc';
        desc.textContent = task.desc;
        card.appendChild(desc);

        const q = document.createElement('p');
        q.className = 'question';
        q.textContent = task.question;
        card.appendChild(q);

        const t = document.createElement('div');
        t.className = 'addr-table';
        const hasNetwork = !!task.network;

        const rows = [];
        if (task.ipList) {
          task.ipList.forEach(function(ip, idx) {
            rows.push({ label: 'Узел ' + (idx + 1), html: ipBinHTML(ip, task.id, 'ipbit' + idx) });
          });
        } else if (task.ip) {
          rows.push({ label: 'IP', html: ipBinHTML(task.ip, task.id, 'ipbit') });
        }
        if (task.network) {
          rows.push({ label: 'Сеть', html: ipBinHTML(task.network, task.id, 'netbit') });
        }
        rows.push({ label: 'Маска', html: emptyMaskHTML(task.id), isMask: true });

        rows.forEach(function(row) {
          const lbl = document.createElement('div');
          lbl.className = 'addr-label'; lbl.textContent = row.label;
          t.appendChild(lbl);
          const bits = document.createElement('div');
          bits.className = 'addr-bits'; bits.innerHTML = row.html;
          t.appendChild(bits);
          if (row.isMask) {
            const badgeWrap = document.createElement('div');
            badgeWrap.style.gridColumn = '2 / 3';
            badgeWrap.style.marginTop = '2px';
            badgeWrap.innerHTML = '<span class="mask-ones-badge" id="badge-' + task.id + '">/0 — 0 единиц</span>';
            t.appendChild(badgeWrap);
          }
        });
        card.appendChild(t);

        const startN = (typeof task.maskStart === 'number') ? task.maskStart : 0;
        const sliderBox = document.createElement('div');
        sliderBox.className = 'mask-slider-box';
        sliderBox.innerHTML =
          '<input type="range" min="0" max="32" value="' + startN + '" id="slider-' + task.id + '">' +
          '<span class="mask-counter">/<span id="ones-' + task.id + '">' + startN + '</span></span>';
        card.appendChild(sliderBox);

        const ansRow = document.createElement('div');
        ansRow.className = 'answer-row';
        ansRow.innerHTML =
          '<label>Ответ:</label>' +
          '<input type="text" id="answer-' + task.id + '" placeholder="число или выражение">' +
          '<button class="check-btn" id="check-' + task.id + '">Проверить</button>' +
          '<button class="hint-btn" id="hintbtn-' + task.id + '">Подсказка</button>' +
          '<span class="calc-hint" id="hint-' + task.id + '"></span>';
        card.appendChild(ansRow);

        const hintBox = document.createElement('div');
        hintBox.className = 'hint-box';
        hintBox.id = 'hintbox-' + task.id;
        hintBox.innerHTML = '<span class="title">💡 Куда смотреть и как рассуждать:</span>' + task.hint;
        card.appendChild(hintBox);

        container.appendChild(card);

        const input = document.getElementById('answer-' + task.id);
        const checkBtn = document.getElementById('check-' + task.id);
        const hintBtn = document.getElementById('hintbtn-' + task.id);
        const hintBoxEl = document.getElementById('hintbox-' + task.id);
        const hintEl = document.getElementById('hint-' + task.id);
        const slider = document.getElementById('slider-' + task.id);
        const onesEl = document.getElementById('ones-' + task.id);
        const badgeEl = document.getElementById('badge-' + task.id);

        function getAnswerValue() {
          const raw = input.value.trim();
          if (!raw) { hintEl.textContent = ''; hintEl.className = 'calc-hint'; return null; }
          if (/^-?\d+(\.\d+)?$/.test(raw)) {
            hintEl.textContent = '';
            hintEl.className = 'calc-hint';
            return parseFloat(raw);
          }
          const val = safeCalc(raw);
          if (val === null) {
            hintEl.textContent = 'не число';
            hintEl.className = 'calc-hint bad';
            return null;
          }
          const disp = Number.isInteger(val) ? val : val.toFixed(3);
          hintEl.textContent = '= ' + disp;
          hintEl.className = 'calc-hint';
          return val;
        }
        input.addEventListener('input', getAnswerValue);

        checkBtn.addEventListener('click', function() {
          const val = getAnswerValue();
          const expected = Number(task.answer);
          const ok = val !== null && Math.abs(val - expected) < 1e-9;
          input.classList.toggle('correct', ok);
          input.classList.toggle('wrong', !ok);
          hintEl.className = 'calc-hint ' + (ok ? 'ok' : (val === null ? 'bad' : ''));
        });

        hintBtn.addEventListener('click', function() {
          hintBoxEl.classList.toggle('show');
          hintBtn.textContent = hintBoxEl.classList.contains('show')
            ? 'Скрыть подсказку'
            : 'Подсказка';
        });

        input.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') checkBtn.click();
        });

        const updateMask = function() {
          const n = parseInt(slider.value, 10);
          onesEl.textContent = n;
          let word = 'единиц';
          if (n % 10 === 1 && n % 100 !== 11) word = 'единица';
          else if ([2,3,4].indexOf(n % 10) !== -1 && [12,13,14].indexOf(n % 100) === -1) word = 'единицы';
          badgeEl.textContent = '/' + n + ' — ' + n + ' ' + word;

          for (let i = 0; i < 32; i++) {
            const mBit = document.getElementById('maskbit-' + task.id + '-' + i);
            if (mBit) {
              if (i < n) {
                mBit.textContent = '1';
                mBit.classList.add('mask-one');
                mBit.classList.remove('one', 'dimmed');
              } else {
                mBit.textContent = '0';
                mBit.classList.remove('mask-one', 'one');
                mBit.classList.add('dimmed');
              }
            }
          }
          if (task.ipList) {
            task.ipList.forEach(function(_, idx) {
              for (let i = 0; i < 32; i++) {
                const b = document.getElementById('ipbit' + idx + '-' + task.id + '-' + i);
                if (!b) continue;
                if (i < n) { b.classList.add('covered'); b.classList.remove('dimmed'); }
                else { b.classList.remove('covered'); if (hasNetwork) b.classList.add('dimmed'); }
              }
            });
          } else if (task.ip) {
            for (let i = 0; i < 32; i++) {
              const b = document.getElementById('ipbit-' + task.id + '-' + i);
              if (!b) continue;
              if (i < n) { b.classList.add('covered'); b.classList.remove('dimmed'); }
              else { b.classList.remove('covered'); if (hasNetwork) b.classList.add('dimmed'); }
            }
          }
          if (task.network) {
            for (let i = 0; i < 32; i++) {
              const b = document.getElementById('netbit-' + task.id + '-' + i);
              if (!b) continue;
              if (i < n) { b.classList.add('covered'); b.classList.remove('dimmed'); }
              else { b.classList.remove('covered'); b.classList.add('dimmed'); }
            }
          }
        };
        slider.addEventListener('input', updateMask);
        updateMask();

        totalRendered++;
      } catch (e) {
        totalFailed++;
        console.error('Задача ' + task.id + ':', e);
        const err = document.createElement('div');
        err.className = 'error-box';
        err.textContent = 'Задача ' + task.id + ' не отрисована: ' + e.message;
        container.appendChild(err);
      }
    });
  });

  console.log('Отрисовано задач:', totalRendered, '| ошибок:', totalFailed);

  const hPowA = document.getElementById('h-pow-a');
  const hPowRes = document.getElementById('h-pow-result');
  hPowA.addEventListener('input', function() {
    const a = parseInt(hPowA.value, 10);
    if (isNaN(a)) { hPowRes.textContent = '—'; hPowRes.classList.add('empty'); return; }
    hPowRes.textContent = Math.pow(2, a);
    hPowRes.classList.remove('empty');
  });

  const bsumIds = ['h-bsum-a','h-bsum-b','h-bsum-c','h-bsum-d'];
  const hBsumRes = document.getElementById('h-bsum-result');
  const updateBsum = function() {
    let any = false, total = 0;
    bsumIds.forEach(function(id) {
      const el = document.getElementById(id);
      if (!el) return;
      const raw = el.value.replace(/[^01]/g, '');
      if (raw !== el.value) el.value = raw;
      if (raw) { total += parseInt(raw, 2); any = true; }
    });
    if (!any) { hBsumRes.textContent = '—'; hBsumRes.classList.add('empty'); return; }
    hBsumRes.textContent = total;
    hBsumRes.classList.remove('empty');
  };
  bsumIds.forEach(function(id) {
    const el = document.getElementById(id);
    if (el) el.addEventListener('input', updateBsum);
  });
})();
</script>
</body>
</html>
