(function() {
  'use strict';

  /* =============== УТИЛИТЫ =============== */
  function ipToBytes(ip) {
    return ip.split('.').map(function(n) { return parseInt(n, 10); });
  }
  function byteToBits(b) { return b.toString(2).padStart(8, '0'); }

  function ipBinHTML(ip, taskId, prefix) {
    let pos = 0;
    return ipToBytes(ip).map(function(byte) { return byteToBits(byte); })
      .map(function(bits) {
        return bits.split('').map(function(ch) {
          const p = pos++;
          const id = (taskId != null && prefix) ? ' id="' + prefix + '-' + taskId + '-' + p + '"' : '';
          return '<span class="bit' + (ch === '1' ? ' one' : '') + '"' + id + '>' + ch + '</span>';
        }).join('');
      }).join('<span class="sep">.</span>');
  }
  function emptyMaskHTML(taskId) {
    let html = '';
    for (let byte = 0; byte < 4; byte++) {
      for (let b = 0; b < 8; b++) {
        const p = byte * 8 + b;
        html += '<span class="bit" id="maskbit-' + taskId + '-' + p + '">0</span>';
      }
      if (byte < 3) html += '<span class="sep">.</span>';
    }
    return html;
  }

  function safeCalc(expr) {
    const s = expr.replace(/\s+/g, '');
    if (!/^[0-9+\-*\/]+$/.test(s)) return null;
    const tokens = s.match(/(\d+|[+\-*/])/g);
    if (!tokens) return null;
    const stack = [Number(tokens[0])];
    let i = 1;
    while (i < tokens.length) {
      const op = tokens[i];
      const num = Number(tokens[i + 1]);
      if (isNaN(num)) return null;
      if (op === '*') { stack[stack.length - 1] *= num; }
      else if (op === '/') { if (num === 0) return null; stack[stack.length - 1] /= num; }
      else if (op === '+') { stack.push(num); }
      else if (op === '-') { stack.push(-num); }
      else return null;
      i += 2;
    }
    return stack.reduce(function(a, b) { return a + b; }, 0);
  }

  /* =============== СЧЁТЧИК ВЫДЕЛЕНИЯ =============== */
  const selCounter = document.getElementById('selCounter');
  function countBitsInSelection() {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || sel.rangeCount === 0) return null;
    const text = sel.toString();
    if (!text) return null;
    const bits = (text.match(/[01]/g) || []).length;
    if (bits === 0) return null;
    const range = sel.getRangeAt(0);
    const container = range.commonAncestorContainer;
    const el = container.nodeType === 1 ? container : container.parentElement;
    if (!el || !el.closest('.addr-bits')) return null;
    const rects = range.getClientRects();
    if (rects.length === 0) return null;
    const last = rects[rects.length - 1];
    const middle = rects[Math.floor(rects.length / 2)];
    return { bits: bits, x: middle.left + middle.width / 2, y: last.bottom + 8 };
  }
  function updateSelectionCounter() {
    const info = countBitsInSelection();
    if (!info) { selCounter.classList.remove('show'); return; }
    selCounter.textContent = 'Выделено битов: ' + info.bits;
    selCounter.style.left = info.x + 'px';
    selCounter.style.top = info.y + 'px';
    selCounter.classList.add('show');
  }
  document.addEventListener('selectionchange', updateSelectionCounter);
  document.addEventListener('mouseup', function() { setTimeout(updateSelectionCounter, 0); });
  document.addEventListener('scroll', function() {

  /* =============== РЕНДЕР =============== */
  const container = document.getElementById('tasks');
  let totalRendered = 0, totalFailed = 0;

  sections.forEach(function(section) {
    const st = document.createElement('div');
    st.className = 'section-title';
    st.textContent = section.title;
    container.appendChild(st);

    section.tasks.forEach(function(task) {
      try {
        const card = document.createElement('div');
        card.className = 'task';

        const h2 = document.createElement('h2');
        h2.textContent = 'Задача ' + (totalRendered + 1) + ' — ' + task.kind;
        card.appendChild(h2);

        const desc = document.createElement('p');
        desc.className = 'desc';
        desc.textContent = task.desc;
        card.appendChild(desc);

        const q = document.createElement('p');
        q.className = 'question';
        q.textContent = task.question;
        card.appendChild(q);

        /* Таблица битов */
        const t = document.createElement('div');
        t.className = 'addr-table';
        const rows = [];
        if (task.ipList) {
          task.ipList.forEach(function(ip, idx) {
            rows.push({ label: 'Узел ' + (idx + 1), html: ipBinHTML(ip, task.id, 'ipbit' + idx) });
          });
        } else if (task.ip) {
          rows.push({ label: 'IP', html: ipBinHTML(task.ip, task.id, 'ipbit') });
        }
        if (task.network) {
          rows.push({ label: 'Сеть', html: ipBinHTML(task.network, task.id, 'netbit') });
        }
        rows.push({ label: 'Маска', html: emptyMaskHTML(task.id), isMask: true });

        rows.forEach(function(row) {
          const lbl = document.createElement('div');
          lbl.className = 'addr-label'; lbl.textContent = row.label;
          t.appendChild(lbl);
          const bits = document.createElement('div');
          bits.className = 'addr-bits'; bits.innerHTML = row.html;
          t.appendChild(bits);
          if (row.isMask) {
            const badgeWrap = document.createElement('div');
            badgeWrap.style.gridColumn = '2 / 3';
            badgeWrap.style.marginTop = '2px';
            badgeWrap.innerHTML = '<span class="mask-ones-badge" id="badge-' + task.id + '">/0 — 0 единиц</span>';
            t.appendChild(badgeWrap);
          }
        });
        card.appendChild(t);

        /* Ползунок — всегда с 0 */
        const sliderBox = document.createElement('div');
        sliderBox.className = 'mask-slider-box';
        sliderBox.innerHTML =
          '<input type="range" min="0" max="32" value="0" id="slider-' + task.id + '">' +
          '<span class="mask-counter">/<span id="ones-' + task.id + '">0</span></span>';
        card.appendChild(sliderBox);

        /* Ответ */
        const ansRow = document.createElement('div');
        ansRow.className = 'answer-row';
        ansRow.innerHTML =
          '<label>Ответ:</label>' +
          '<input type="text" id="answer-' + task.id + '" placeholder="число или выражение">' +
          '<button class="check-btn" id="check-' + task.id + '">Проверить</button>' +
          '<button class="reveal-btn" id="reveal-' + task.id + '">Показать ответ</button>' +
          '<span class="calc-hint" id="hint-' + task.id + '"></span>';
        card.appendChild(ansRow);

        const revealBox = document.createElement('div');
        revealBox.className = 'reveal-answer';
        revealBox.id = 'revealbox-' + task.id;
        revealBox.innerHTML = '<span class="label">Правильный ответ:</span><span class="value">' + task.answer + '</span>';
        card.appendChild(revealBox);

        container.appendChild(card);

        /* Привязка */
        const input = document.getElementById('answer-' + task.id);
        const checkBtn = document.getElementById('check-' + task.id);
        const revealBtn = document.getElementById('reveal-' + task.id);
        const revealBoxEl = document.getElementById('revealbox-' + task.id);
        const hintEl = document.getElementById('hint-' + task.id);
        const slider = document.getElementById('slider-' + task.id);
        const onesEl = document.getElementById('ones-' + task.id);
        const badgeEl = document.getElementById('badge-' + task.id);

        function getAnswerValue() {
          const raw = input.value.trim();
          if (!raw) { hintEl.textContent = ''; hintEl.className = 'calc-hint'; return null; }
          if (/^-?\d+(\.\d+)?$/.test(raw)) {
            hintEl.textContent = '';
            hintEl.className = 'calc-hint';
            return parseFloat(raw);
          }
          const val = safeCalc(raw);
          if (val === null) {
            hintEl.textContent = 'не число';
            hintEl.className = 'calc-hint bad';
            return null;
          }
          const disp = Number.isInteger(val) ? val : val.toFixed(3);
          hintEl.textContent = '= ' + disp;
          hintEl.className = 'calc-hint';
          return val;
        }
        input.addEventListener('input', getAnswerValue);

        checkBtn.addEventListener('click', function() {
          const val = getAnswerValue();
          const expected = Number(task.answer);
          const ok = val !== null && Math.abs(val - expected) < 1e-9;
          input.classList.toggle('correct', ok);
          input.classList.toggle('wrong', !ok);
          hintEl.className = 'calc-hint ' + (ok ? 'ok' : (val === null ? 'bad' : ''));
          revealBtn.classList.toggle('show', !ok);
          if (ok) revealBoxEl.classList.remove('show');
        });
        revealBtn.addEventListener('click', function() {
          revealBoxEl.classList.toggle('show');
          revealBtn.textContent = revealBoxEl.classList.contains('show') ? 'Скрыть ответ' : 'Показать ответ';
        });
        input.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') checkBtn.click();
        });

        /* Ползунок */
        const updateMask = function() {
          const n = parseInt(slider.value, 10);
          onesEl.textContent = n;
          let word = 'единиц';
          if (n % 10 === 1 && n % 100 !== 11) word = 'единица';
          else if ([2,3,4].indexOf(n % 10) !== -1 && [12,13,14].indexOf(n % 100) === -1) word = 'единицы';
          badgeEl.textContent = '/' + n + ' — ' + n + ' ' + word;

          for (let i = 0; i < 32; i++) {
            const mBit = document.getElementById('maskbit-' + task.id + '-' + i);
            if (mBit) {
              if (i < n) {
                mBit.textContent = '1';
                mBit.classList.add('mask-one');
                mBit.classList.remove('one');
              } else {
                mBit.textContent = '0';
                mBit.classList.remove('mask-one', 'one');
              }
            }
          }
          if (task.ipList) {
            task.ipList.forEach(function(_, idx) {
              for (let i = 0; i < 32; i++) {
                const b = document.getElementById('ipbit' + idx + '-' + task.id + '-' + i);
                if (b) b.classList.toggle('covered', i < n);
              }
            });
          } else if (task.ip) {
            for (let i = 0; i < 32; i++) {
              const b = document.getElementById('ipbit-' + task.id + '-' + i);
              if (b) b.classList.toggle('covered', i < n);
            }
          }
          if (task.network) {
            for (let i = 0; i < 32; i++) {
              const b = document.getElementById('netbit-' + task.id + '-' + i);
              if (b) b.classList.toggle('covered', i < n);
            }
          }
        };
        slider.addEventListener('input', updateMask);
        updateMask();

        totalRendered++;
      } catch (e) {
        totalFailed++;
        console.error('Задача ' + task.id + ':', e);
        const err = document.createElement('div');
        err.className = 'error-box';
        err.textContent = 'Задача ' + task.id + ' не отрисована: ' + e.message;
        container.appendChild(err);
      }
    });
  });

  console.log('Отрисовано задач:', totalRendered, '| ошибок:', totalFailed);

  /* =============== ПОМОЩНИКИ =============== */
  const hPowA = document.getElementById('h-pow-a');
  const hPowRes = document.getElementById('h-pow-result');
  hPowA.addEventListener('input', function() {
    const a = parseInt(hPowA.value, 10);
    if (isNaN(a)) { hPowRes.textContent = '—'; hPowRes.classList.add('empty'); return; }
    hPowRes.textContent = Math.pow(2, a);
    hPowRes.classList.remove('empty');
  });

  const bsumIds = ['h-bsum-a','h-bsum-b','h-bsum-c','h-bsum-d'];
  const hBsumRes = document.getElementById('h-bsum-result');
  const updateBsum = function() {
    let any = false, total = 0;
    bsumIds.forEach(function(id) {
      const el = document.getElementById(id);
      if (!el) return;
      const raw = el.value.replace(/[^01]/g, '');
      if (raw !== el.value) el.value = raw;
      if (raw) { total += parseInt(raw, 2); any = true; }
    });
    if (!any) { hBsumRes.textContent = '—'; hBsumRes.classList.add('empty'); return; }
    hBsumRes.textContent = total;
    hBsumRes.classList.remove('empty');
  };
  bsumIds.forEach(function(id) {
    const el = document.getElementById(id);
    if (el) el.addEventListener('input', updateBsum);
  });
})();
</script>
