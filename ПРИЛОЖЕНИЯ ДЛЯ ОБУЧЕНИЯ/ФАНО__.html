<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌳 Дерево Фано — полный функционал + GitHub</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }
        body {
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app {
            width: 100vw;
            height: 100vh;
            display: flex;
            overflow: hidden;
            background: #1a202c;
        }

        .left-panel {
            background: rgba(26, 32, 44, 0.95);
            backdrop-filter: blur(10px);
            color: white;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-right: 2px solid #4a5568;
            transition: width 0.2s;
        }
        .left-panel.narrow {
            width: 320px;
            min-width: 300px;
        }
        .left-panel.wide {
            width: 500px;
            min-width: 450px;
        }

        .panel-header {
            padding: 15px;
            background: #2d3748;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #4a5568;
        }
        .panel-header h3 {
            font-size: 1.2em;
            color: #e2e8f0;
            margin: 0;
        }
        .panel-header button {
            background: #4a5568;
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        .panel-header button:hover {
            background: #718096;
        }

        .search-bar {
            padding: 10px;
            background: #2d3748;
            border-bottom: 1px solid #4a5568;
        }
        .search-bar input {
            width: 100%;
            padding: 8px 12px;
            background: #1e293b;
            border: 2px solid #4a5568;
            border-radius: 30px;
            color: white;
            font-size: 0.95em;
            outline: none;
        }
        .search-bar input:focus {
            border-color: #4299e1;
        }
        .search-bar input::placeholder {
            color: #a0aec0;
        }

        .filter-bar {
            display: flex;
            gap: 5px;
            padding: 10px;
            background: #2d3748;
            border-bottom: 1px solid #4a5568;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: #4a5568;
            border: none;
            color: #cbd5e0;
            padding: 5px 10px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.2s;
        }
        .filter-btn.active {
            background: #4299e1;
            color: white;
        }
        .filter-btn:hover {
            background: #718096;
            color: white;
        }

        .task-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .task-item {
            padding: 8px 8px;
            margin-bottom: 4px;
            background: #4a5568;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95em;
            border-left: 3px solid transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 4px;
        }
        .task-item:hover {
            background: #5f6b7a;
            transform: translateX(2px);
        }
        .task-item.active {
            background: #434190;
            border-left-color: #fbbf24;
        }
        .task-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100px;
            font-size: 0.9em;
            cursor: pointer;
            flex-shrink: 0;
        }
        .task-item .status-checkboxes {
            display: flex;
            gap: 2px;
            margin-left: 4px;
            flex-shrink: 0;
        }
        .task-item .status-checkboxes label {
            cursor: pointer;
            font-size: 1em;
            display: flex;
            align-items: center;
            opacity: 0.3;
            transition: opacity 0.2s;
            padding: 0 2px;
        }
        .task-item .status-checkboxes label.active {
            opacity: 1;
        }
        .task-item .status-checkboxes input[type="checkbox"] {
            display: none;
        }
        .task-item .move-buttons {
            display: flex;
            flex-direction: column;
            margin-left: 2px;
            gap: 1px;
            flex-shrink: 0;
        }
        .task-item .move-buttons button {
            background: #2d3748;
            border: none;
            color: #a0aec0;
            padding: 1px 4px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.7em;
            line-height: 1.2;
            min-width: 20px;
        }
        .task-item .move-buttons button:hover {
            background: #4a5568;
            color: white;
        }
        .task-item .edit-btn {
            background: #2d3748;
            border: none;
            color: #a0aec0;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8em;
            flex-shrink: 0;
        }
        .task-item .edit-btn:hover {
            background: #4a5568;
            color: white;
        }

        .edit-panel {
            flex: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }
        .edit-panel label {
            color: #cbd5e0;
            font-weight: 600;
            margin-bottom: 3px;
            display: block;
        }
        .edit-panel input, .edit-panel textarea {
            width: 100%;
            padding: 8px;
            background: #2d3748;
            border: 2px solid #4a5568;
            border-radius: 6px;
            color: white;
            font-family: 'Courier New', monospace;
        }
        .edit-panel textarea {
            resize: vertical;
            min-height: 60px;
        }
        .checkbox-group {
            display: flex;
            gap: 20px;
            background: #2d3748;
            padding: 10px;
            border-radius: 6px;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: normal;
            color: #e2e8f0;
        }
        .edit-panel .solution-preview {
            max-height: 150px;
            overflow-y: auto;
            background: #1a202c;
            border-radius: 6px;
            padding: 8px;
            margin-top: 5px;
        }
        .edit-panel .solution-preview img {
            max-width: 100%;
            max-height: 120px;
            border-radius: 4px;
        }
        .button-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 5px;
        }
        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9em;
            flex: 1;
            min-width: 70px;
        }
        .btn-primary {
            background: #4299e1;
            color: white;
        }
        .btn-primary:hover {
            background: #3182ce;
        }
        .btn-success {
            background: #48bb78;
            color: white;
        }
        .btn-success:hover {
            background: #38a169;
        }
        .btn-danger {
            background: #f56565;
            color: white;
        }
        .btn-danger:hover {
            background: #e53e3e;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #4a5568;
            color: #e2e8f0;
        }
        .btn-outline:hover {
            background: #4a5568;
        }

        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #1a202c;
        }

        .task-info {
            background: #2d3748;
            padding: 12px 20px;
            color: white;
            border-bottom: 2px solid #4a5568;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .task-info .task-id {
            background: #4299e1;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
        }
        .task-info h2 {
            font-size: 1.2em;
            margin: 0;
            color: #e2e8f0;
        }
        .task-info .task-condition {
            color: #cbd5e0;
            font-size: 1.2em !important;
            flex: 2.5;
            overflow-wrap: break-word;
            min-width: 300px;
        }
        .task-info .answer-box {
            background: #4a5568;
            padding: 4px 8px;
            border-radius: 6px;
            color: #fbbf24;
            font-weight: bold;
            min-width: 60px;
            text-align: center;
            font-size: 0.9em;
            cursor: pointer;
        }
        .hidden-answer {
            background: #2d3748;
            padding: 4px 8px;
            border-radius: 6px;
            color: #fbbf24;
            font-weight: bold;
            min-width: 60px;
            text-align: center;
            display: none;
            border: 1px solid #fbbf24;
        }
        .fano-toggle {
            display: flex;
            gap: 5px;
            background: #4a5568;
            padding: 3px;
            border-radius: 30px;
        }
        .fano-toggle button {
            background: transparent;
            border: none;
            color: #cbd5e0;
            padding: 4px 12px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
            font-size: 0.9em;
        }
        .fano-toggle button.active {
            background: #4299e1;
            color: white;
        }
        .task-info .video-link {
            background: #e53e3e;
            color: white;
            padding: 5px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9em;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .task-info .video-link:hover {
            background: #c53030;
        }
        .task-info .solution-button {
            background: #48bb78;
            color: white;
            padding: 5px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 0.9em;
        }
        .task-info .solution-button:hover {
            background: #38a169;
        }

        .canvas-container {
            flex: 1;
            overflow: auto;
            background: #1a202c;
            width: 100%;
            height: 100%;
        }
        .canvas-wrapper {
            width: fit-content;
            min-width: 100%;
            min-height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #treeCanvas {
            display: block;
            width: 2000px;
            height: 1000px;
            background: #1a202c;
        }

        .zoom-panel {
            background: #2d3748;
            padding: 10px 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            border-top: 2px solid #4a5568;
            flex-wrap: wrap;
        }
        .zoom-panel .btn {
            flex: 0;
            min-width: 70px;
            padding: 6px 12px;
            font-size: 0.9em;
        }
        .zoom-panel span {
            color: white;
            background: #4a5568;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.9em;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #2d3748;
            padding: 30px;
            border-radius: 12px;
            width: 90vw;
            height: 90vh;
            max-width: 90vw;
            max-height: 90vh;
            overflow: auto;
            color: white;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .modal-content img {
            max-width: 100%;
            max-height: calc(90vh - 100px);
            object-fit: contain;
        }
        .modal-content pre {
            font-size: 1.2em;
            color: #e2e8f0;
        }
        .modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 28px;
            cursor: pointer;
            color: #a0aec0;
        }
        .modal-close:hover {
            color: white;
        }

        @media print {
            body, .app {
                background: white;
                height: auto;
                display: block;
                overflow: visible;
            }
            .left-panel, .task-info .fano-toggle, .zoom-panel, .filter-bar,
            .panel-header button, .task-item button, .video-link, .solution-button,
            #backToListBtn, .modal, .search-bar, .answer-box {
                display: none !important;
            }
            .hidden-answer {
                display: inline-block !important;
                background: #ddd;
                color: black;
                border: 1px solid black;
            }
            .right-panel {
                display: block;
                background: white;
                overflow: visible;
            }
            .canvas-container {
                overflow: visible;
                background: white;
                page-break-inside: avoid;
            }
            canvas {
                background: white;
                border: 1px solid #ccc;
                width: 100%;
                height: auto;
            }
            .task-condition {
                white-space: normal;
                color: black;
                font-size: 1.2em !important;
            }
            .task-info {
                background: #f0f0f0;
                color: black;
                border: 1px solid #aaa;
            }
            a.video-link[href] {
                display: inline !important;
                background: none;
                color: blue;
                padding: 0;
                text-decoration: underline;
            }
        }

        ::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }
        ::-webkit-scrollbar-track {
            background: #2d3748;
        }
        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 6px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #5a67d8;
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="left-panel narrow" id="leftPanel">
            <div class="panel-header">
                <h3 id="leftPanelTitle">📋 Задачи</h3>
                <button id="backToListBtn" style="display: none;" onclick="showTaskList()">← Назад</button>
            </div>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="🔍 Поиск по условию (часть строки)..." oninput="applyTextSearch()">
            </div>
            <div class="filter-bar" id="filterBar">
                <button class="filter-btn active" onclick="setFilter('all', event)">Все</button>
                <button class="filter-btn" onclick="setFilter('solved', event)">✅ Решённые</button>
                <button class="filter-btn" onclick="setFilter('favorite', event)">⭐ Избранные</button>
                <button class="filter-btn" onclick="setFilter('homework', event)">📚 ДЗ</button>
            </div>
            <div id="taskListContainer" class="task-list"></div>
            <div id="editPanelContainer" class="edit-panel" style="display: none;">
                <label>Номер задачи</label>
                <input type="text" id="editId" readonly placeholder="авто">
                <label>Название</label>
                <input type="text" id="editName" placeholder="Введите название">
                <label>Условие задачи</label>
                <textarea id="editCondition" placeholder="Текст условия..." rows="2"></textarea>
                <label>Коды (формат: А=0, Б=10, ...)</label>
                <textarea id="editCodes" placeholder="А=0&#10;Б=10&#10;В=110" rows="3"></textarea>
                <label>Ответ</label>
                <input type="text" id="editAnswer" placeholder="Например: 101">
                <label>Решение (текст или Ctrl+V для изображения)</label>
                <textarea id="editSolution" placeholder="Вставьте текст решения или изображение (Ctrl+V)..." rows="3"></textarea>
                <div class="solution-preview" id="solutionPreview"></div>
                <label>Видеоразбор (ссылка на Rutube)</label>
                <input type="url" id="editVideo" placeholder="https://rutube.ru/video/...">
                <div class="checkbox-group">
                    <label><input type="checkbox" id="editSolved"> ✅ Решено</label>
                    <label><input type="checkbox" id="editFavorite"> ⭐ Избранное</label>
                    <label><input type="checkbox" id="editHomework"> 📚 ДЗ</label>
                </div>
                <div class="button-group">
                    <button class="btn btn-success" onclick="saveEditedTask()">Сохранить</button>
                    <button class="btn btn-danger" onclick="deleteEditedTask()">Удалить</button>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <div class="task-info">
                <span class="task-id" id="currentTaskId">#?</span>
                <h2 id="currentTaskName">Загрузка...</h2>
                <span class="task-condition" id="currentTaskCondition"></span>
                <span class="answer-box" id="currentAnswer" onclick="toggleAnswer()">?</span>
                <span class="hidden-answer" id="hiddenAnswer"></span>
                <div class="fano-toggle" id="fanoToggle">
                    <button class="active" onclick="setFanoType('direct')">Прямое</button>
                    <button onclick="setFanoType('reverse')">Обратное</button>
                </div>
                <a href="#" id="videoLink" class="video-link" target="_blank" style="display: none;">🎬 Видео</a>
                <button class="solution-button" id="solutionButton" onclick="showSolution()">📄 Решение</button>
            </div>
            <div class="canvas-container">
                <div class="canvas-wrapper">
                    <canvas id="treeCanvas" width="2000" height="1000"></canvas>
                </div>
            </div>
            <div class="zoom-panel">
                <button class="btn btn-primary" onclick="zoomIn()">➕</button>
                <button class="btn btn-primary" onclick="zoomOut()">➖</button>
                <button class="btn btn-primary" onclick="resetZoom()">🔄</button>
                <button class="btn btn-primary" onclick="fitToScreen()">⤢</button>
                <span id="zoomLevel">100%</span>
                <button class="btn btn-outline" onclick="exportTasks()">📤 Экспорт</button>
                <button class="btn btn-outline" onclick="importTasks()">📥 Импорт</button>
                <button class="btn btn-outline" onclick="newTask()">➕ Новая</button>
                <button class="btn btn-outline" onclick="saveTaskFromTree()">💾 Сохранить</button>
                <button class="btn btn-outline" onclick="deleteCurrentTask()">🗑️ Удалить</button>
                <button class="btn btn-success" onclick="printFilteredTasks()">🖨️ Печать всех деревьев</button>
                <button class="btn btn-outline" onclick="loadTasksFromGitHub()">🌐 GitHub</button>
            </div>
        </div>
    </div>

    <div id="solutionModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <h3>Решение</h3>
            <div id="modalSolutionContent"></div>
        </div>
    </div>

    <script>
        class Node {
            constructor(name = null, originalCode = null) {
                this.name = name;
                this.originalCode = originalCode;
                this.left = null;
                this.right = null;
                this.code = "";
                this.x = 0;
                this.y = 0;
                this.isUserAdded = false;
                this.id = nextNodeId++;
                nodesById[this.id] = this;
            }
        }

        let tasks = [];
        let currentTaskId = null;
        let root = null;
        let fanoType = 'direct';
        let currentFilter = 'all';
        let searchText = '';

        let nextNodeId = 1;
        let nodesById = {};

        const canvas = document.getElementById('treeCanvas');
        const ctx = canvas.getContext('2d');
        let scale = 1;
        let offsetX = 0;
        let offsetY = 0;
        let isDragging = false;
        let dragStartX, dragStartY;

        const TOP_MARGIN = 40;
        const VERTICAL_SPACING = 100;

        const leftPanel = document.getElementById('leftPanel');
        const taskListContainer = document.getElementById('taskListContainer');
        const editPanelContainer = document.getElementById('editPanelContainer');
        const leftPanelTitle = document.getElementById('leftPanelTitle');
        const backToListBtn = document.getElementById('backToListBtn');
        const fanoButtons = document.querySelectorAll('#fanoToggle button');
        const videoLink = document.getElementById('videoLink');
        const solutionModal = document.getElementById('solutionModal');
        const modalContent = document.getElementById('modalSolutionContent');
        const searchInput = document.getElementById('searchInput');
        const currentAnswerSpan = document.getElementById('currentAnswer');
        const hiddenAnswerSpan = document.getElementById('hiddenAnswer');

        let clickTimer = null;

        // ========== ОБРАБОТКА ВСТАВКИ ИЗОБРАЖЕНИЙ ==========
        document.getElementById('editSolution').addEventListener('paste', function(e) {
            const items = (e.clipboardData || window.clipboardData).items;
            for (let item of items) {
                if (item.type.indexOf('image') === 0) {
                    e.preventDefault();
                    const blob = item.getAsFile();
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        document.getElementById('editSolution').value = event.target.result;
                        showSolutionPreview(event.target.result);
                    };
                    reader.readAsDataURL(blob);
                    break;
                }
            }
        });

        function showSolutionPreview(data) {
            const preview = document.getElementById('solutionPreview');
            if (data.startsWith('data:image')) {
                preview.innerHTML = `<img src="${data}" alt="решение">`;
            } else {
                preview.innerHTML = '<div style="color:#a0aec0">Текстовое решение</div>';
            }
        }

        // ========== АЛГОРИТМ ПОЗИЦИОНИРОВАНИЯ ==========
        function calculateLevels(node, level = 0, levels = []) {
            if (!node) return levels;
            if (!levels[level]) levels[level] = [];
            levels[level].push(node);
            calculateLevels(node.left, level + 1, levels);
            calculateLevels(node.right, level + 1, levels);
            return levels;
        }

        function positionNodesEvenly() {
            if (!root) return;
            const levels = calculateLevels(root);
            const maxLevel = levels.length - 1;
            for (let level = 0; level <= maxLevel; level++) {
                const nodesAtLevel = levels[level];
                const count = nodesAtLevel.length;
                const baseSpacing = 300 - level * 30;
                const totalWidth = count * baseSpacing;
                const startX = (canvas.width - totalWidth) / 2 + baseSpacing / 2;
                nodesAtLevel.forEach((node, index) => {
                    node.x = startX + index * baseSpacing;
                    node.y = TOP_MARGIN + level * VERTICAL_SPACING;
                });
            }
        }

        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!root) return;
            ctx.save();
            ctx.translate(offsetX, offsetY);
            ctx.scale(scale, scale);

            drawEdges(root);
            drawNodes(root);

            ctx.restore();
            document.getElementById('zoomLevel').innerText = Math.round(scale * 100) + '%';
        }

        function drawEdges(node) {
            if (!node) return;
            ctx.beginPath();
            ctx.strokeStyle = '#4a5568';
            ctx.lineWidth = 2 / scale;
            ctx.setLineDash([]);

            if (node.left) {
                ctx.moveTo(node.x, node.y);
                ctx.lineTo(node.left.x, node.left.y);
                ctx.stroke();
                ctx.fillStyle = '#4299e1';
                ctx.font = `${16 / scale}px monospace`;
                ctx.fillText('0', (node.x + node.left.x) / 2 - 5, (node.y + node.left.y) / 2 - 10);
                drawEdges(node.left);
            }
            if (node.right) {
                ctx.moveTo(node.x, node.y);
                ctx.lineTo(node.right.x, node.right.y);
                ctx.stroke();
                ctx.fillStyle = '#4299e1';
                ctx.font = `${16 / scale}px monospace`;
                ctx.fillText('1', (node.x + node.right.x) / 2 + 5, (node.y + node.right.y) / 2 - 10);
                drawEdges(node.right);
            }
        }

        function drawNodes(node) {
            if (!node) return;
            const radius = node.name ? 26 : 18;
            
            let fillColor;
            if (node.name) {
                fillColor = '#f56565';
            } else {
                fillColor = node.isUserAdded ? '#fbbf24' : '#48bb78';
            }

            ctx.beginPath();
            ctx.fillStyle = fillColor;
            ctx.arc(node.x, node.y, radius / scale, 0, 2 * Math.PI);
            ctx.fill();
            
            ctx.strokeStyle = node.name ? '#c53030' : (node.isUserAdded ? '#d97706' : '#2f855a');
            ctx.lineWidth = 2 / scale;
            ctx.stroke();

            if (!node.name && ((!node.left && node.right) || (node.left && !node.right))) {
                ctx.beginPath();
                ctx.strokeStyle = '#ed8936';
                ctx.lineWidth = 4 / scale;
                ctx.arc(node.x, node.y, (radius + 3) / scale, 0, 2 * Math.PI);
                ctx.stroke();
            }

            const isLeaf = !node.left && !node.right;

            if (isLeaf) {
                if (node.name) {
                    ctx.fillStyle = 'white';
                    ctx.font = `bold ${22 / scale}px Arial`;
                    ctx.fillText(node.name, node.x - 11/scale, node.y + 8/scale);

                    ctx.fillStyle = '#e2e8f0';
                    ctx.font = `${16 / scale}px monospace`;
                    const label = `${node.originalCode}`;
                    const textWidth = ctx.measureText(label).width;
                    ctx.fillText(label, node.x - textWidth/2, node.y + 50/scale);
                } else if (node.isUserAdded) {
                    ctx.fillStyle = '#e2e8f0';
                    ctx.font = `${16 / scale}px monospace`;
                    const label = `${node.code}`;
                    const textWidth = ctx.measureText(label).width;
                    ctx.fillText(label, node.x - textWidth/2, node.y + 35/scale);
                }
            }

            if (node.left) drawNodes(node.left);
            if (node.right) drawNodes(node.right);
        }

        function findNodeByXY(node, x, y) {
            if (!node) return null;
            const dx = node.x - x;
            const dy = node.y - y;
            if (Math.sqrt(dx*dx + dy*dy) < 25) return node;
            return findNodeByXY(node.left, x, y) || findNodeByXY(node.right, x, y);
        }

        function addBranches(node) {
            if (!node || !node.isUserAdded) return;
            let changed = false;
            if (!node.left) {
                const newCode = node.code + '0';
                const newNode = new Node();
                newNode.code = newCode;
                newNode.isUserAdded = true;
                node.left = newNode;
                changed = true;
            }
            if (!node.right) {
                const newCode = node.code + '1';
                const newNode = new Node();
                newNode.code = newCode;
                newNode.isUserAdded = true;
                node.right = newNode;
                changed = true;
            }
            if (changed) {
                positionNodesEvenly();
                drawCanvas();
            }
        }

        function removeNode(targetNode) {
            function removeSubtree(node) {
                if (!node) return;
                if (node.left) removeSubtree(node.left);
                if (node.right) removeSubtree(node.right);
                delete nodesById[node.id];
            }
            removeSubtree(targetNode);

            function findAndRemove(parent, target) {
                if (!parent) return false;
                if (parent.left === target) {
                    parent.left = null;
                    return true;
                }
                if (parent.right === target) {
                    parent.right = null;
                    return true;
                }
                return findAndRemove(parent.left, target) || findAndRemove(parent.right, target);
            }
            if (findAndRemove(root, targetNode)) {
                positionNodesEvenly();
                drawCanvas();
            }
        }

        canvas.addEventListener('click', function(e) {
            if (!root) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left - offsetX) / scale;
            const y = (e.clientY - rect.top - offsetY) / scale;
            
            const clickedNode = findNodeByXY(root, x, y);
            if (!clickedNode) return;

            if (clickedNode.name) return;

            if (clickedNode.isUserAdded) {
                if (clickTimer) clearTimeout(clickTimer);
                clickTimer = setTimeout(() => {
                    addBranches(clickedNode);
                    clickTimer = null;
                }, 200);
                return;
            }

            if (!clickedNode.left) {
                const newCode = clickedNode.code + '0';
                const newNode = new Node();
                newNode.code = newCode;
                newNode.isUserAdded = true;
                clickedNode.left = newNode;
                positionNodesEvenly();
                drawCanvas();
            } else if (!clickedNode.right) {
                const newCode = clickedNode.code + '1';
                const newNode = new Node();
                newNode.code = newCode;
                newNode.isUserAdded = true;
                clickedNode.right = newNode;
                positionNodesEvenly();
                drawCanvas();
            }
        });

        canvas.addEventListener('dblclick', function(e) {
            if (!root) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left - offsetX) / scale;
            const y = (e.clientY - rect.top - offsetY) / scale;
            
            const clickedNode = findNodeByXY(root, x, y);
            if (!clickedNode) return;
            if (clickedNode.name) return;
            if (clickedNode.isUserAdded) {
                if (clickTimer) {
                    clearTimeout(clickTimer);
                    clickTimer = null;
                }
                removeNode(clickedNode);
            }
        });

        // ========== ФИЛЬТРАЦИЯ С ПОИСКОМ ==========

                filtered = filtered.filter(t => (t.condition || '').toLowerCase().includes(text));

        // ========== ПЕРЕКЛЮЧЕНИЕ СТАТУСОВ ==========

            const task = tasks.find(t => t.id === taskId);
            if (!task) return;
            
            if (statusType === 'solved') task.solved = !task.solved;

            else if (statusType === 'homework') task.homework = !task.homework;
            
            renderTaskList();
            // Обновляем активный элемент, если он есть
            if (currentTaskId === taskId) {
                // Обновляем информацию в редакторе (не закрывая его)
                const task = tasks.find(t => t.id === currentTaskId);
                if (task) {
                    document.getElementById('editSolved').checked = task.solved || false;
                    document.getElementById('editFavorite').checked = task.favorite || false;
                    document.getElementById('editHomework').checked = task.homework || false;
                }

        // ========== ПЕРЕМЕЩЕНИЕ ЗАДАЧ ==========
        function moveTask(taskId, direction, event) {
            if (event) event.stopPropagation();
            const index = tasks.findIndex(t => t.id === taskId);
            if (index === -1) return;
            
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= tasks.length) return;
            
            // Меняем местами
            [tasks[index], tasks[newIndex]] = [tasks[newIndex], tasks[index]];
            
            renderTaskList();
        }

        function loadTask(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;
            currentTaskId = id;
            document.getElementById('currentTaskId').innerText = '#' + id;
            document.getElementById('currentTaskName').innerText = task.name;
            document.getElementById('currentTaskCondition').innerText = task.condition || '';

                videoLink.href = task.video;
                videoLink.style.display = 'inline-flex';
            } else {
                videoLink.style.display = 'none';
            }

            buildTreeFromCodes(task.codes);
            renderTaskList();
        }

        function buildTreeFromCodes(originalCodes) {
            nextNodeId = 1;
            nodesById = {};

            let codesForBuild = originalCodes;
            if (fanoType === 'reverse') {
                codesForBuild = {};
                for (let [letter, code] of Object.entries(originalCodes)) {
                    codesForBuild[letter] = code.split('').reverse().join('');
                }
            }

            root = new Node();
            root.code = "";

            for (let [letter, code] of Object.entries(codesForBuild)) {
                let current = root;
                for (let bit of code) {
                    if (bit === '0') {
                        if (!current.left) {
                            current.left = new Node();
                            current.left.code = current.code + '0';
                        }
                        current = current.left;
                    } else {
                        if (!current.right) {
                            current.right = new Node();
                            current.right.code = current.code + '1';
                        }
                        current = current.right;
                    }
                }
                current.name = letter;
                current.originalCode = originalCodes[letter];
                current.isUserAdded = false;
            }

            positionNodesEvenly();
            setTimeout(() => fitToScreen(), 50);
        }

        function zoomIn() { scale = Math.min(scale + 0.2, 3); drawCanvas(); }
        function zoomOut() { scale = Math.max(scale - 0.2, 0.3); drawCanvas(); }
        function resetZoom() { scale = 1; offsetX = 0; offsetY = 0; drawCanvas(); }

        function fitToScreen() {
            if (!root) return;
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            function findBounds(node) {
                if (!node) return;
                minX = Math.min(minX, node.x);
                maxX = Math.max(maxX, node.x);
                minY = Math.min(minY, node.y);
                maxY = Math.max(maxY, node.y);
                if (node.left) findBounds(node.left);
                if (node.right) findBounds(node.right);
            }
            findBounds(root);
            const padding = 200;
            const treeW = maxX - minX + padding * 2;
            const treeH = maxY - minY + padding * 2;
            const scaleX = canvas.width / treeW;
            const scaleY = canvas.height / treeH;
            scale = Math.min(scaleX, scaleY) * 0.9;
            offsetX = (canvas.width / 2) - (minX + maxX) / 2 * scale;
            offsetY = TOP_MARGIN * scale - minY * scale;
            drawCanvas();
        }

        function startDrag(e) { isDragging = true; dragStartX = e.clientX - offsetX; dragStartY = e.clientY - offsetY; }
        function drag(e) { if (!isDragging) return; offsetX = e.clientX - dragStartX; offsetY = e.clientY - dragStartY; drawCanvas(); }
        function endDrag() { isDragging = false; }

        function saveEditedTask() {
            const idRaw = document.getElementById('editId').value;
            const name = document.getElementById('editName').value.trim();
            const condition = document.getElementById('editCondition').value.trim();
            const codesStr = document.getElementById('editCodes').value;
            const answer = document.getElementById('editAnswer').value.trim();
            const solution = document.getElementById('editSolution').value;
            const video = document.getElementById('editVideo').value.trim();
            const solved = document.getElementById('editSolved').checked;
            const favorite = document.getElementById('editFavorite').checked;
            const homework = document.getElementById('editHomework').checked;

            if (!name) { alert('Введите название'); return; }
            const codes = parseCodes(codesStr);
            if (Object.keys(codes).length === 0) { alert('Введите хотя бы один код'); return; }

            let id = idRaw ? parseInt(idRaw) : 0;
            if (id && tasks.some(t => t.id === id)) {
                const task = tasks.find(t => t.id === id);
                task.name = name;
                task.condition = condition;
                task.codes = codes;
                task.answer = answer;
                task.solution = solution;
                task.video = video;
                task.solved = solved;
                task.favorite = favorite;
                task.homework = homework;
            } else {
                const newId = Math.max(...tasks.map(t => t.id), 0) + 1;
                tasks.push({ id: newId, name, condition, codes, answer, solution, video, solved, favorite, homework });
                id = newId;
            }
            currentTaskId = id;
            renderTaskList();
            loadTask(id);
            showTaskList();
        }

        function deleteEditedTask() {
            const id = parseInt(document.getElementById('editId').value);
            if (!id) return;
            if (confirm(`Удалить задачу #${id}?`)) {
                tasks = tasks.filter(t => t.id !== id);
                if (currentTaskId === id) {
                    currentTaskId = tasks[0]?.id || null;
                    if (currentTaskId) loadTask(currentTaskId);
                }
                renderTaskList();
                showTaskList();
            }
        }

            openEditForTask(null);
        }

                alert('Сначала создайте задачу через кнопку Новая');

            if (confirm(`Удалить задачу #${currentTaskId}?`)) {
                tasks = tasks.filter(t => t.id !== currentTaskId);
                currentTaskId = tasks[0]?.id || null;
                if (currentTaskId) loadTask(currentTaskId);
                renderTaskList();
            }

        function parseCodes(input) {
            const codes = {};
            input.split('\n').filter(l => l.trim()).forEach(line => {
                const parts = line.split('=').map(s => s.trim());
                if (parts.length === 2 && parts[0] && parts[1]) {
                    codes[parts[0]] = parts[1];
                }
            });
            return codes;
        }

        function formatCodesForInput(codes) {
            return Object.entries(codes).map(([k, v]) => `${k}=${v}`).join('\n');
        }

        function exportTasks() {
            const dataStr = JSON.stringify(tasks, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'fano_tasks.json';
            a.click();
        }

        function importTasks() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = ev => {
                    try {
                        const imported = JSON.parse(ev.target.result);
                        if (Array.isArray(imported)) {
                            tasks = imported;
                            currentTaskId = tasks[0]?.id || null;
                            if (currentTaskId) loadTask(currentTaskId);
                            renderTaskList();
                        } else alert('Неверный формат');
                    } catch { alert('Ошибка чтения'); }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        // ========== ПЕЧАТЬ ==========
        function printFilteredTasks() {
            const filtered = filterTasks();
            if (!filtered.length) {
                alert('Нет задач для печати');
                return;
            }

            const includeAnswers = confirm('Включить ответы в печать? (OK - да, Отмена - без ответов)');
            const previousTaskId = currentTaskId;
            
            let imagesData = [];
            
            const offscreenCanvas = document.createElement('canvas');
            offscreenCanvas.width = 2000;
            offscreenCanvas.height = 1000;
            const offCtx = offscreenCanvas.getContext('2d');
            
            function renderTaskToCanvas(task) {
                let codesForBuild = task.codes;
                if (fanoType === 'reverse') {
                    codesForBuild = {};
                    for (let [letter, code] of Object.entries(task.codes)) {
                        codesForBuild[letter] = code.split('').reverse().join('');
                    }
                } else {
                    codesForBuild = task.codes;
                }
                
                let tempRoot = new Node();
                tempRoot.code = "";
                for (let [letter, code] of Object.entries(codesForBuild)) {
                    let current = tempRoot;
                    for (let bit of code) {
                        if (bit === '0') {
                            if (!current.left) {
                                current.left = new Node();
                                current.left.code = current.code + '0';
                            }
                            current = current.left;
                        } else {
                            if (!current.right) {
                                current.right = new Node();
                                current.right.code = current.code + '1';
                            }
                            current = current.right;
                        }
                    }
                    current.name = letter;
                    current.originalCode = task.codes[letter];
                    current.isUserAdded = false;
                }
                
                const levels = calculateLevels(tempRoot);
                const maxLevel = levels.length - 1;
                for (let level = 0; level <= maxLevel; level++) {
                    const nodesAtLevel = levels[level];
                    const count = nodesAtLevel.length;
                    const baseSpacing = 300 - level * 30;
                    const totalWidth = count * baseSpacing;
                    const startX = (offscreenCanvas.width - totalWidth) / 2 + baseSpacing / 2;
                    nodesAtLevel.forEach((node, index) => {
                        node.x = startX + index * baseSpacing;
                        node.y = TOP_MARGIN + level * VERTICAL_SPACING;
                    });
                }
                
                offCtx.clearRect(0, 0, offscreenCanvas.width, offscreenCanvas.height);
                
                function drawEdgesOff(node) {
                    if (!node) return;
                    offCtx.beginPath();
                    offCtx.strokeStyle = '#4a5568';
                    offCtx.lineWidth = 2;
                    offCtx.setLineDash([]);
                    if (node.left) {
                        offCtx.moveTo(node.x, node.y);
                        offCtx.lineTo(node.left.x, node.left.y);
                        offCtx.stroke();
                        offCtx.fillStyle = '#4299e1';
                        offCtx.font = `16px monospace`;
                        offCtx.fillText('0', (node.x + node.left.x) / 2 - 5, (node.y + node.left.y) / 2 - 10);
                        drawEdgesOff(node.left);
                    }
                    if (node.right) {
                        offCtx.moveTo(node.x, node.y);
                        offCtx.lineTo(node.right.x, node.right.y);
                        offCtx.stroke();
                        offCtx.fillStyle = '#4299e1';
                        offCtx.font = `16px monospace`;
                        offCtx.fillText('1', (node.x + node.right.x) / 2 + 5, (node.y + node.right.y) / 2 - 10);
                        drawEdgesOff(node.right);
                    }
                }
                
                function drawNodesOff(node) {
                    if (!node) return;
                    const radius = node.name ? 26 : 18;
                    let fillColor;
                    if (node.name) fillColor = '#f56565';
                    else fillColor = node.isUserAdded ? '#fbbf24' : '#48bb78';
                    
                    offCtx.beginPath();
                    offCtx.fillStyle = fillColor;
                    offCtx.arc(node.x, node.y, radius, 0, 2 * Math.PI);
                    offCtx.fill();
                    offCtx.strokeStyle = node.name ? '#c53030' : (node.isUserAdded ? '#d97706' : '#2f855a');
                    offCtx.lineWidth = 2;
                    offCtx.stroke();
                    
                    if (!node.name && ((!node.left && node.right) || (node.left && !node.right))) {
                        offCtx.beginPath();
                        offCtx.strokeStyle = '#ed8936';
                        offCtx.lineWidth = 4;
                        offCtx.arc(node.x, node.y, radius + 3, 0, 2 * Math.PI);
                        offCtx.stroke();
                    }
                    
                    const isLeaf = !node.left && !node.right;
                    if (isLeaf) {
                        if (node.name) {
                            offCtx.fillStyle = 'white';
                            offCtx.font = `bold 22px Arial`;
                            offCtx.fillText(node.name, node.x - 11, node.y + 8);
                            offCtx.fillStyle = '#e2e8f0';
                            offCtx.font = `16px monospace`;
                            const label = `${node.originalCode}`;
                            const textWidth = offCtx.measureText(label).width;
                            offCtx.fillText(label, node.x - textWidth/2, node.y + 50);
                        } else if (node.isUserAdded) {
                            offCtx.fillStyle = '#e2e8f0';
                            offCtx.font = `16px monospace`;
                            const label = `${node.code}`;
                            const textWidth = offCtx.measureText(label).width;
                            offCtx.fillText(label, node.x - textWidth/2, node.y + 35);
                        }
                    }
                    if (node.left) drawNodesOff(node.left);
                    if (node.right) drawNodesOff(node.right);
                }
                
                drawEdgesOff(tempRoot);
                drawNodesOff(tempRoot);
                
                return offscreenCanvas.toDataURL('image/png');
            }
            
            for (let task of filtered) {
                const imgData = renderTaskToCanvas(task);
                imagesData.push(imgData);
            }
            
            let htmlContent = `
                <html>
                <head><title>Печать задач Фано</title>
                <style>
                    body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: white; }
                    .task-card { page-break-after: always; border-bottom: 2px dashed #aaa; margin-bottom: 30px; padding-bottom: 20px; }
                    .task-header { background: #f0f0f0; padding: 10px; font-size: 1.4em; font-weight: bold; }
                    .condition { margin: 10px 0; background: #f9f9f9; padding: 10px; border-left: 5px solid #4299e1; font-size: 1.1em; }
                    .answer { background: #e2e8f0; padding: 5px 10px; display: inline-block; border-radius: 20px; margin: 10px 0; }
                    .tree-img { max-width: 100%; border: 1px solid #ccc; margin: 10px 0; }
                    .video-link { color: #1a0dab; text-decoration: underline; }
                </style>
                </head>
                <body>
                <h1>🌳 Задачи по условию Фано (фильтр: ${currentFilter} ${searchText ? 'поиск: ' + searchText : ''})</h1>
            `;
            
            for (let i = 0; i < filtered.length; i++) {
                const task = filtered[i];
                const imgData = imagesData[i];
                htmlContent += `
                    <div class="task-card">
                        <div class="task-header">#${task.id}. ${task.name}</div>
                        <div class="condition"><strong>Условие:</strong> ${task.condition || '—'}</div>
                        ${includeAnswers ? `<div class="answer"><strong>Ответ:</strong> ${task.answer || '?'}</div>` : ''}
                        <img class="tree-img" src="${imgData}" alt="дерево для задачи ${task.id}">
                        ${task.video ? `<p>📺 <a class="video-link" href="${task.video}" target="_blank">Видеоразбор</a></p>` : ''}
                        <hr>
                    </div>
                `;
            }
            
            htmlContent += '</body></html>';
            
            loadTask(previousTaskId);
            
            const printWin = window.open('', '_blank');
            printWin.document.write(htmlContent);
            printWin.document.close();
            printWin.focus();
            printWin.print();
        }

        // ========== ЗАГРУЗКА С GITHUB ==========
        async function loadTasksFromGitHub() {
            try {
                const url = 'https://raw.githubusercontent.com/GannaMath2026/trenager_programs/main/json_files/информатика_4_фано.json';
                
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                
                if (!Array.isArray(data)) throw new Error('Неверный формат данных');
                
                tasks = data;
                console.log(`✅ Загружено ${tasks.length} задач с GitHub`);
                
                if (tasks.length > 0) {
                    currentTaskId = tasks[0].id;
                    loadTask(currentTaskId);
                }
                
                renderTaskList();
                alert(`Загружено ${tasks.length} задач`);
                
            } catch (error) {
                console.error('❌ Ошибка загрузки:', error);
                alert('Не удалось загрузить задачи с GitHub. Используются демо-задачи.');
                
                tasks = [
                    { id: 1, name: "ДЕМО 2024", condition: "Для букв А, Б, В, Г, Д, Е известны коды: А=000, Б=001, В=0101, Г=0100, Д=011, Е=101.", codes: { "А": "000", "Б": "001", "В": "0101", "Г": "0100", "Д": "011", "Е": "101" }, answer: "011", solution: "Дерево построено.", video: "", solved: false, favorite: false, homework: false },
                    { id: 2, name: "Вариант 303", condition: "Для букв А, Б, В, Г заданы коды: А=00, Б=01, В=100, Г=101.", codes: { "А": "00", "Б": "01", "В": "100", "Г": "101" }, answer: "110", solution: "Обратное дерево", video: "", solved: true, favorite: true, homework: true }
                ];
                currentTaskId = 1;
                loadTask(1);
                renderTaskList();
            }
        }

        // ========== ИНИЦИАЛИЗАЦИЯ ==========
        function init() {
            loadTasksFromGitHub();
            
            canvas.addEventListener('mousedown', startDrag);
            canvas.addEventListener('mousemove', drag);
            canvas.addEventListener('mouseup', endDrag);
            canvas.addEventListener('mouseleave', endDrag);
        }

        window.onload = init;
    </script>
</body>
